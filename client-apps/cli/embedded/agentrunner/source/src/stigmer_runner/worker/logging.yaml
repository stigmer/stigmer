# Logging configuration for agent-runner service.
#
# Python equivalent of Spring Boot's application.yml logging section.
# Uses logging.config.dictConfig() for declarative, atomic configuration.
#
# The root level can be overridden at runtime via the LOG_LEVEL env var.
# Per-logger levels below are fixed defaults; add new entries as needed.

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stderr

root:
  level: INFO
  handlers: [console]

loggers:
  # ── Internal modules ────────────────────────────────────────────────
  worker.activities.graphton:
    level: INFO

  # ── Third-party: infrastructure (WARNING) ───────────────────────────
  asyncio:
    level: WARNING
  httpcore:
    level: WARNING
  httpx:
    level: WARNING
  grpc:
    level: WARNING
  grpc._cython.cygrpc:
    level: WARNING
  aiosqlite:
    level: WARNING
  langgraph.checkpoint.sqlite:
    level: WARNING

  # ── Third-party: operational (INFO) ─────────────────────────────────
  anthropic:
    level: INFO
  anthropic._base_client:
    level: INFO
  temporalio:
    level: INFO
  temporalio.worker._activity:
    level: INFO
  temporalio.activity:
    level: INFO
  graphton:
    level: INFO
  graphton.core.loop_detection:
    level: INFO
  worker.auth:
    level: INFO
