<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stigmer</title>
    <script>
      (function () {
        var d = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var bg = d ? "#242424" : "#fdfdfd";
        var fg = d ? "#f5f5f5" : "#262626";
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.color = fg;
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script>
      // Suppress macOS WebKit form autocomplete pills, autocorrect, and
      // auto-capitalization on all inputs. WKWebView (used by Tauri on macOS)
      // inherits Safari's form autofill behavior -- a floating "pill" appears
      // below text inputs with previously typed values, and autocorrect rewrites
      // partial words. A MutationObserver catches inputs added later by React.
      (function() {
        var attrs = {autocomplete:'off',autocorrect:'off',autocapitalize:'off'};
        function suppress(el) {
          for (var k in attrs) el.setAttribute(k, attrs[k]);
          el.spellcheck = false;
        }
        function walk(root) {
          root.querySelectorAll('input,textarea').forEach(suppress);
        }
        new MutationObserver(function(mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var nodes = mutations[i].addedNodes;
            for (var j = 0; j < nodes.length; j++) {
              var n = nodes[j];
              if (n.nodeType !== 1) continue;
              if (n.tagName === 'INPUT' || n.tagName === 'TEXTAREA') suppress(n);
              if (n.querySelectorAll) walk(n);
            }
          }
        }).observe(document.documentElement, {childList:true,subtree:true});
      })();
    </script>
    <script>
      // Only catch synchronous module-evaluation errors (fatal).
      // Async rejections (API errors etc.) are non-fatal and handled by React.
      window.addEventListener("error", function(e) {
        if (e.filename && e.filename.indexOf("/src/") !== -1) {
          var r = document.getElementById("root");
          if (r && !r.hasChildNodes()) {
            r.style.cssText = "padding:2rem;color:#f87171;font-family:monospace;white-space:pre-wrap;background:#09090b;min-height:100vh;";
            r.textContent = "[module error] " + e.message + "\n\n" + (e.filename || "") + ":" + (e.lineno || "") + "\n\n" + (e.error && e.error.stack ? e.error.stack : "");
          }
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
