[package]
name = "stigmer"
version = "0.1.0"
description = "Stigmer Desktop — native app for sessions and agents"
authors = ["Stigmer <oss@stigmer.ai>"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
ignore = "0.4"
# Ripgrep's own search engine, reused for workspace content search so grep
# behavior (encoding, CRLF, line counting, binary detection) matches ripgrep
# rather than being hand-rolled. `ignore` (above) is already a ripgrep crate.
grep-searcher = "0.1"
grep-regex = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Workspace image reads ship their bytes base64-encoded through the Tauri
# invoke JSON boundary (stigmer/stigmer#379).
base64 = "0.22"
tokio = { version = "1", features = ["io-util", "process", "sync"] }
url = "2"
# Embedded-runner IPC driver, vendored in-repo. The `tauri` feature provides the
# #[tauri::command] surface that `runner.rs` re-exports.
stigmer-runner-host = { path = "../../../crates/stigmer-runner-host", features = ["tauri"] }

[dev-dependencies]
tempfile = "3"
