[package]
name = "stigmer-desktop"
version = "0.1.0"
description = "Stigmer Desktop — native app for sessions, agents, and runner management"
authors = ["Stigmer <oss@stigmer.ai>"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
