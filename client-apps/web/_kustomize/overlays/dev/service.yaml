# dev's overlay for the console: the namespace, the hostnames, and the sign-in tenant dev shares with demo.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesDeployment
metadata:
  name: stigmer-web
spec:
  namespace:
    value: stigmer-dev # the environment's namespace, which the environment owns
  createNamespace: false
  container:
    app:
      env:
        variables:
        - name: NEXT_PUBLIC_API_URL
          value: https://api.dev.stigmer.ai # dev's API door
        - name: NEXT_PUBLIC_APP_URL
          value: https://app.dev.stigmer.ai # this console's own origin
        - name: NEXT_PUBLIC_OIDC_ISSUER
          value: https://id.preprod.stigmer.ai/ # the preprod tenant's sign-in domain, shared by dev and demo; tokens name the host they were requested from as issuer, so this matches stigmer-server's STIGMER_IDP_URL. Auth0's issuer carries the trailing slash
        - name: NEXT_PUBLIC_OIDC_AUDIENCE
          value: https://api.stigmer.com/ # the tenant's API identifier
        # The console's application in the tenant, created by dev's environment: read from it, never copied.
        - name: NEXT_PUBLIC_OIDC_CLIENT_ID
          valueFrom:
            kind: Auth0Client
            name: console
            env: dev
            fieldPath: status.outputs.client_id
---
# The console answers on dev's app hostname.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesHttpRoute
metadata:
  name: stigmer-web
spec:
  namespace:
    value: stigmer-dev
  hostnames:
  - app.dev.stigmer.ai
