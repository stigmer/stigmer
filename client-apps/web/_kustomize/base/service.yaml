apiVersion: kubernetes.project-planton.org/v1
kind: KubernetesDeployment
metadata:
  name: stigmer-web
  org: stigmer
  labels:
    project-planton.org/provisioner: pulumi
    pulumi.project-planton.org/organization: stigmer
    pulumi.project-planton.org/project: stigmer
    kubernetes.project-planton.org/docker-config-json-file: "~/scm/github.com/stigmer/stigmer-cloud/ops/docker-config.ghcr.json"
spec:
  container:
    app:
      image:
        repo: ghcr.io/stigmer/stigmer-cloud/client-apps/web
      env:
        variables:
          IAM_DOMAIN: $variables-group/stigmer-auth0-config/prod.domain
          IAM_LOGOUT_REDIRECT: "/"
        secrets:
          NEXTAUTH_SECRET:
            value: $secrets-group/stigmer-web/prod.nextauth-secret
      resources:
        limits:
          cpu: 500m
          memory: 500Mi
        requests:
          cpu: 50m
          memory: 100Mi
      ports:
        - name: app
          containerPort: 3000
          servicePort: 80
          appProtocol: http
          networkProtocol: TCP
          isIngressPort: true
  availability:
    minReplicas: 1
    horizontalPodAutoscaling:
      isEnabled: false
  version: main

