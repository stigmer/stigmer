apiVersion: kubernetes.project-planton.org/v1
kind: KubernetesDeployment
metadata:
  name: stigmer-web
  org: stigmer
  labels:
    project-planton.org/provisioner: pulumi
    pulumi.project-planton.org/organization: stigmer
    pulumi.project-planton.org/project: stigmer
spec:
  container:
    app:
      image:
        repo: ghcr.io/stigmer/stigmer/client-apps/web
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
        requests:
          cpu: 10m
          memory: 16Mi
      ports:
        - name: app
          containerPort: 3000
          servicePort: 80
          appProtocol: http
          networkProtocol: TCP
          isIngressPort: true
  availability:
    minReplicas: 1
    horizontalPodAutoscaling:
      isEnabled: false
  version: main
