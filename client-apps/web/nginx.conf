server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js hashed assets are safe to cache indefinitely.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must always be revalidated so the browser fetches
    # the latest JS/CSS references after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: serve matching file, .html variant, or index.html.
    # Next.js static export produces /about.html for /about, so try
    # the .html suffix before falling back to the SPA entry point.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
