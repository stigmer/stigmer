server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js hashed assets are safe to cache indefinitely.
    # ^~ ensures this prefix match takes priority over the regex
    # dynamic-route fallback below.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must always be revalidated so the browser fetches
    # the latest JS/CSS references after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Runtime configuration generated by entrypoint.sh must never be
    # cached so config changes propagate immediately on redeploy.
    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The embed loader is referenced by an unversioned URL pasted into
    # third-party sites, so it cannot be immutable — a short TTL lets
    # loader fixes reach embedders within minutes of a deploy.
    location = /embed.js {
        add_header Cache-Control "public, max-age=300";
    }

    # Dynamic-route fallback: resolve URLs with dynamic [param]
    # segments to their __placeholder__.html counterparts generated
    # by Next.js static export.  Two regex blocks cover two- and
    # one-level dynamic routes (evaluated in declaration order).
    #
    # Two-level (4+ segments): e.g. /library/skills/[org]/[slug]
    #   /library/skills/acme/web-search  (4 segments)
    #   → /library/skills/__placeholder__/__placeholder__.html
    #
    # The (.+/[^/]+) capture requires at least two static prefix
    # segments so that 3-segment URLs like /library/skills/my-skill
    # fall through to the one-level block below.
    location ~ ^(.+/[^/]+)/[^/]+/[^/]+$ {
        try_files $uri $uri.html $uri/ $1/__placeholder__/__placeholder__.html /index.html;
    }

    # One-level (3+ segments): e.g. /sessions/[id]
    #   /sessions/ses_abc  (2 segments)
    #   → /sessions/__placeholder__.html
    location ~ ^(.+)/[^/]+$ {
        try_files $uri $uri.html $uri/ $1/__placeholder__.html /index.html;
    }

    # Static-route fallback: top-level paths like / or /library resolve
    # to their own pre-rendered .html files directly.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
