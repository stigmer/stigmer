server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js hashed assets are safe to cache indefinitely.
    # ^~ ensures this prefix match takes priority over the regex
    # dynamic-route fallback below.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must always be revalidated so the browser fetches
    # the latest JS/CSS references after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Runtime configuration generated by entrypoint.sh must never be
    # cached so config changes propagate immediately on redeploy.
    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The embed loader is referenced by an unversioned URL pasted into
    # third-party sites, so it cannot be immutable — a short TTL lets
    # loader fixes reach embedders within minutes of a deploy.
    location = /embed.js {
        add_header Cache-Control "public, max-age=300";
    }

    # Dynamic-route fallback: resolve URLs with dynamic [param]
    # segments to their __placeholder__.html counterparts generated
    # by Next.js static export.  Regex blocks are evaluated in
    # declaration order, so the three-segment block must stay ahead
    # of the two-segment one.
    #
    # A URL alone cannot tell a static segment from a dynamic one:
    # /workflows/executions/wfe_123 and /workflows/acme/my-flow are
    # both three segments, but the first is /workflows/executions/[id]
    # and the second is /workflows/[org]/[slug]. Any rule that guesses
    # from segment counts serves one of them wrong (that guess shipped
    # the /conversations blank-page failure, channel-conversations
    # F-12). So instead of classifying the URL, ask the filesystem:
    # substitute __placeholder__ into the trailing segments, longest
    # static prefix first, and serve whichever file the export actually
    # produced. The export writes at most one candidate per URL, and
    # trying the more-literal candidate first mirrors Next.js route
    # priority (a literal segment beats a dynamic one). New dynamic
    # routes are served the day they are added — no per-route block.
    #
    # No route has more than two dynamic trailing segments, so two
    # placeholder candidates are exhaustive. The route tree and these
    # rules are held together by scripts/verify-static-export-routes.mjs
    # (run by `make verify-web`), which fails the build when a route
    # cannot be resolved by this chain.

    # Three or more segments: /a/b/c, /a/b/c/d
    #   $1 = everything before the last two segments, $2 = second-to-last
    location ~ ^(.+)/([^/]+)/[^/]+$ {
        try_files $uri $uri.html $uri/
                  $1/$2/__placeholder__.html
                  $1/__placeholder__/__placeholder__.html
                  /index.html;
    }

    # Two segments: e.g. /sessions/[id]
    #   /sessions/ses_abc → /sessions/__placeholder__.html
    location ~ ^(.+)/[^/]+$ {
        try_files $uri $uri.html $uri/ $1/__placeholder__.html /index.html;
    }

    # Static-route fallback: top-level paths like / or /library resolve
    # to their own pre-rendered .html files directly.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
