apiVersion: kubernetes.project-planton.org/v1
kind: KubernetesDeployment
metadata:
  name: agent-runner
  org: stigmer
  labels:
    project-planton.org/provisioner: pulumi
    pulumi.project-planton.org/organization: stigmer
    pulumi.project-planton.org/project: stigmer
    kubernetes.project-planton.org/docker-config-json-file: "~/scm/github.com/stigmer/stigmer-cloud/ops/platform/service-deployments/files/docker-config.ghcr.json"
spec:
  container:
    app:
      image:
        repo: ghcr.io/stigmer/stigmer/backend/services/agent-runner
        #tag: <comes-from-ci-git-commit-sha>
      env:
        variables:
          # Temporal Configuration
          # Polyglot setup: Python activities on agent_execution_runner, Java workflows on agent_execution_stigmer
          - name: TEMPORAL_NAMESPACE
            value: $variables-group/stigmer-temporal-config/namespace
          - name: TEMPORAL_AGENT_EXECUTION_RUNNER_TASK_QUEUE
            value: agent_execution_runner
          - name: TEMPORAL_MAX_CONCURRENCY
            value: "10"
          # Stigmer Backend Configuration
          - name: STIGMER_BACKEND_ENDPOINT
            value: localhost:8080
          # Redis Configuration
          - name: REDIS_PORT
            value: $variables-group/stigmer-redis-config/port
          # Auth0 Configuration
          - name: AUTH0_DOMAIN
            value: $variables-group/stigmer-auth0-config/prod.domain
          - name: AUTH0_AUDIENCE
            value: $variables-group/stigmer-auth0-config/prod.api-audience
          # Daytona Configuration
          - name: DAYTONA_DEV_TOOLS_SNAPSHOT_ID
            value: $variables-group/daytona/dev-tools-snapshot-id
          # LLM Configuration
          # Provider, model, and API key are set in environment-specific overlays
          # This allows flexibility: prod uses Anthropic, local can use Ollama/OpenAI/Anthropic
          - name: STIGMER_LLM_MAX_TOKENS
            value: $variables-group/stigmer-llm-config/max-tokens
          - name: STIGMER_LLM_BASE_URL
            value: $variables-group/stigmer-llm-config/prod.ollama-base-url
          # MongoDB Checkpointer Configuration (cloud mode uses mongodb by default)
          - name: STIGMER_CHECKPOINTER_MONGODB_DB
            value: $variables-group/stigmer-mongodb-config/prod.checkpointer-db-name
          # Logging
          - name: LOG_LEVEL
            value: INFO
      resources:
        limits:
          cpu: 1000m
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 256Mi
  availability:
    minReplicas: 1
    horizontalPodAutoscaling:
      isEnabled: false
  version: main
