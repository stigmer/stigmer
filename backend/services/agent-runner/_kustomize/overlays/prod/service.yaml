apiVersion: kubernetes.project-planton.org/v1
kind: KubernetesDeployment
metadata:
  name: agent-runner
  env: prod
  labels:
    pulumi.project-planton.org/stack.name: prod.KubernetesDeployment.agent-runner
spec:
  namespace:
    value: stigmer-prod
  container:
    app:
      resources:
        limits:
          cpu: 2000m
          memory: 4Gi
        requests:
          cpu: 200m
          memory: 512Mi
      env:
        variables:
          ENV:
            value: prod
          # Temporal Configuration (using internal Kubernetes endpoints)
          TEMPORAL_SERVICE_ADDRESS:
            value: $variables-group/stigmer-temporal-config/prod.kube-endpoint
          TEMPORAL_NAMESPACE:
            value: default
          TEMPORAL_MAX_CONCURRENCY:
            value: "20"
          # Redis Configuration (using internal Kubernetes endpoint)
          REDIS_HOST:
            value: $variables-group/stigmer-redis-config/prod.kube-endpoint
          # Stigmer API Configuration (internal Kubernetes endpoint, plain gRPC)
          STIGMER_BACKEND_ENDPOINT:
            value: $variables-group/stigmer-api/prod.kube-endpoint
          # Public gRPC endpoint injected into MCP server subprocesses.
          # Daytona sandboxes run outside K8s and cannot reach the internal
          # kube-endpoint, so this must be the public ingress with TLS.
          STIGMER_MCP_PUBLIC_ENDPOINT:
            value: $variables-group/stigmer-api/prod.grpc-endpoint
          # LLM Configuration (production uses Anthropic)
          STIGMER_LLM_PROVIDER:
            value: anthropic
          STIGMER_LLM_MODEL:
            value: claude-sonnet-4.5
          # Artifact Storage Configuration
          # Use R2 for cloud deployments (uploads artifacts during agent execution)
          ARTIFACT_STORAGE_TYPE:
            value: r2
          # Cloudflare R2 Configuration (Agent Execution Artifact Storage)
          # Used for uploading artifacts during agent execution via publish_artifact tool
          AGENT_EXECUTION_ARTIFACT_R2_BUCKET:
            value: $variables-group/stigmer-agent-execution-r2-config/prod.bucket-name
          AGENT_EXECUTION_ARTIFACT_R2_ENDPOINT:
            value: $variables-group/stigmer-agent-execution-r2-config/prod.endpoint
          AGENT_EXECUTION_ARTIFACT_R2_REGION:
            value: $variables-group/stigmer-agent-execution-r2-config/region
          # MongoDB Checkpointer Configuration
          STIGMER_CHECKPOINTER_MONGODB_DB:
            value: $variables-group/stigmer-mongodb-config/prod.checkpointer-db-name
        secrets:
          # Redis password
          REDIS_PASSWORD:
            value: $secrets-group/stigmer-redis-credentials/prod.password
          # Stigmer API Key
          STIGMER_API_KEY:
            value: $secrets-group/stigmer-api/prod.api-key
          # Daytona API Key
          DAYTONA_API_KEY:
            value: $secrets-group/daytona/prod.api-key
          # LLM API Key (Anthropic for production)
          STIGMER_LLM_API_KEY:
            value: $secrets-group/anthropic/prod.api-key
          # Backward compatibility (some code may still use ANTHROPIC_API_KEY)
          ANTHROPIC_API_KEY:
            value: $secrets-group/anthropic/prod.api-key
          # Cloudflare R2 Credentials (Agent Execution Artifact Storage)
          AGENT_EXECUTION_ARTIFACT_R2_ACCESS_KEY_ID:
            value: $secrets-group/stigmer-r2-credentials/prod.access-key-id
          AGENT_EXECUTION_ARTIFACT_R2_SECRET_ACCESS_KEY:
            value: $secrets-group/stigmer-r2-credentials/prod.secret-access-key
          # MongoDB Checkpointer URI (contains credentials)
          STIGMER_CHECKPOINTER_MONGODB_URI:
            value: $secrets-group/stigmer-mongodb-credentials/prod.checkpointer-uri
  availability:
    minReplicas: 1
    # Zero-downtime deployment strategy
    deploymentStrategy:
      maxUnavailable: "0"
      maxSurge: "1"
    # Pod disruption budget for cluster maintenance protection
    podDisruptionBudget:
      enabled: true
      minAvailable: "1"
