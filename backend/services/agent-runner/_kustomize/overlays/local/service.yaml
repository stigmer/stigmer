apiVersion: kubernetes.project-planton.org/v1
kind: KubernetesDeployment
metadata:
  name: agent-runner
spec:
  container:
    app:
      env:
        variables:
          - name: ENV
            value: local
          - name: LOG_LEVEL
            value: INFO
          # Temporal Configuration (using external endpoints for local development)
          - name: TEMPORAL_SERVICE_ADDRESS
            value: $variables-group/stigmer-temporal-config/prod.external-endpoint
          - name: TEMPORAL_NAMESPACE
            value: $variables-group/stigmer-temporal-config/namespace
          - name: TEMPORAL_AGENT_EXECUTION_RUNNER_TASK_QUEUE
            value: agent_execution_runner
          # Redis Configuration (using external endpoint for local development)
          - name: REDIS_HOST
            value: $variables-group/stigmer-redis-config/prod.host
          # Stigmer Backend
          - name: STIGMER_BACKEND_ENDPOINT
            value: $variables-group/stigmer-api/prod.endpoint
          # LLM Configuration (local development)
          # Default: Ollama (zero-cost, runs locally)
          # 
          # To use OpenAI instead:
          #   STIGMER_LLM_PROVIDER: openai
          #   STIGMER_LLM_MODEL: gpt-4
          #   STIGMER_LLM_API_KEY: <your-openai-key> (in secrets section below)
          #
          # To use Anthropic instead:
          #   STIGMER_LLM_PROVIDER: anthropic
          #   STIGMER_LLM_MODEL: claude-sonnet-4.5
          #   STIGMER_LLM_API_KEY: <your-anthropic-key> (in secrets section below)
          - name: STIGMER_LLM_PROVIDER
            value: ollama
          - name: STIGMER_LLM_MODEL
            value: qwen2.5-coder:7b
          - name: STIGMER_LLM_BASE_URL
            value: $variables-group/stigmer-llm-config/local.ollama-base-url
          - name: STIGMER_LLM_MAX_TOKENS
            value: "8192"
          - name: STIGMER_LLM_TEMPERATURE
            value: "0.0"
        # Secrets (uncomment and add API key if using OpenAI/Anthropic locally)
        # secrets:
        #   - name: STIGMER_LLM_API_KEY
        #     value: <your-api-key-here>
