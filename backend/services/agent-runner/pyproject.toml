[tool.poetry]
name = "agent-runner"
version = "1.0.0"
description = "Temporal worker for Graphton agent execution in Stigmer"
authors = ["Stigmer <engineering@stigmer.ai>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

# Temporal
temporalio = "^1.9.0"

# YAML logging config (logging.yaml)
pyyaml = ">=6.0"

# LangGraph (for Graphton state persistence)
langgraph = "*"
langchain-core = ">=1.0.0"

# LangGraph checkpointers (for HITL approval flow and conversation persistence)
# SQLite: file-based persistence for local/open-source deployments
langgraph-checkpoint-sqlite = "^3.0.0"
# MongoDB: database persistence for cloud deployments (multi-instance safe)
# MongoDBSaver uses pymongo internally (pulled transitively)
langgraph-checkpoint-mongodb = "^0.3.0"

# LangMem for context window summarization
langmem = ">=0.0.30"

# LangChain model providers (for LangMem evaluation)
langchain-anthropic = ">=0.3.0"
langchain-openai = ">=0.3.0"

# Graphton (local copy)
graphton = {path = "../../libs/python/graphton", develop = true}

# Daytona sandbox support
daytona = ">=0.113.0"
deepagents-cli = ">=0.0.3,<0.1.0"  # pinned: wildcard pulled corrupted transitive deps twice (2026-02-14)

# gRPC
grpcio = "*"
grpcio-reflection = "*"
protobuf = "^6.32.0"

# Authentication
authlib = "^1.3.0"
httpx = "^0.28.1"
pyjwt = "^2.8.0"

# Cloudflare R2 artifact storage (S3-compatible API, default for cloud mode)
boto3 = "^1.35.0"

# Environment variable loading (local development)
python-dotenv = "^1.0.0"

# Local API protos
stigmer-protos = { path = "../../../apis/stubs/python/stigmer", develop = true }

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6.0"
mypy = ">=1.10.0"
pytest = ">=8.0.0"
pytest-asyncio = ">=0.24.0"
pyinstaller = {version = "^6.18.0", python = ">=3.11,<3.15"}
types-pyyaml = "^6.0.12.20250915"

[tool.mypy]
python_version = "3.11"
show_error_codes = true
strict = false
check_untyped_defs = true
warn_unreachable = true
ignore_missing_imports = true
# "normal" allows MyPy to follow imports and type-check proto stubs.
# The previous "skip" setting prevented analysis of imported modules entirely,
# defeating the purpose of type checking at the proto boundary.
follow_imports = "normal"

# Proto-generated stubs (ai.stigmer.*) are NOT excluded from type checking.
# The .pyi stubs generated by buf provide accurate type information for all
# proto fields, enabling MyPy to catch field-name typos and type mismatches
# at development time rather than at runtime.

# Graphton is checked by its own mypy config; suppress when imported transitively.
[[tool.mypy.overrides]]
module = "graphton.*"
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Rule set aligned with graphton for consistency across Python codebase.
# E: pycodestyle errors, F: pyflakes, I: isort, UP: pyupgrade, N: pep8-naming
select = ["E", "F", "I", "UP", "N"]
ignore = ["E501"]  # line length handled by formatter, not linter

[tool.ruff.lint.per-file-ignores]
# Tests can use more relaxed naming and import conventions
"tests/**" = ["N802", "N803"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
