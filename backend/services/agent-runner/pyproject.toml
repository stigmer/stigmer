[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stigmer-runner"
version = "0.0.0.dev0"
description = "Stigmer Agent Runner — Temporal worker for AI agent execution"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "Apache-2.0"
authors = [{ name = "Stigmer", email = "engineering@stigmer.ai" }]
keywords = ["stigmer", "agent-runner", "temporal", "ai-agents", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # Temporal
    "temporalio>=1.9.0",
    # YAML logging config
    "pyyaml>=6.0",
    # LangGraph
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    # LangGraph checkpointers (HITL approval flow, conversation persistence)
    "langgraph-checkpoint-sqlite>=3.0.0",
    "langgraph-checkpoint-mongodb>=0.3.0",
    # LangMem for context window summarization
    "langmem>=0.0.30",
    # LangChain model providers (for LangMem evaluation)
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    # Graphton — declarative agent creation framework
    "graphton>=0.1.0",
    # Deep Agents CLI
    "deepagents-cli>=0.0.3,<0.1.0",
    # gRPC
    "grpcio>=1.60.0",
    "grpcio-reflection>=1.60.0",
    "protobuf>=6.32.0",
    # Proto stubs
    "stigmer-protos>=0.1.0",
    # Authentication
    "authlib>=1.3.0",
    "httpx>=0.28.1",
    "pyjwt>=2.8.0",
    # Cloudflare R2 artifact storage (S3-compatible API)
    "boto3>=1.35.0",
    # Environment variable loading
    "python-dotenv>=1.0.0",
    # OpenTelemetry (opt-in distributed tracing)
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
]

[project.scripts]
stigmer-runner = "stigmer_runner.__main__:main"

[project.urls]
Homepage = "https://stigmer.ai"
Repository = "https://github.com/stigmer/stigmer"
Documentation = "https://docs.stigmer.ai/guides/runners"

[tool.hatch.build.targets.wheel]
packages = ["src/stigmer_runner"]

# ---------------------------------------------------------------------------
# Dev dependencies (not shipped in the wheel)
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "types-pyyaml>=6.0.12",
]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6.0"
mypy = ">=1.10.0"
pytest = ">=8.0.0"
pytest-asyncio = ">=0.24.0"
types-pyyaml = ">=6.0.12"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
show_error_codes = true
strict = false
check_untyped_defs = true
warn_unreachable = true
ignore_missing_imports = true
follow_imports = "normal"

[[tool.mypy.overrides]]
module = "graphton.*"
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
