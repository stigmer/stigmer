# An editor of one blueprint (agent, workflow, MCP server) changes its
# definition and does whatever a viewer can, and decides nothing about who
# else reaches it: delete, grants (can_grant_access) and the audience
# (can_manage_audience) stay the owner's. The grant is
# bounded by the organization like every direct grant.
#
# Cast (organization acme; every blueprint is private, so no org tuple):
#   own  - acme member; authored every blueprint
#   adm  - acme admin; owner of every blueprint by inheritance
#   ed   - acme member; granted editor on every blueprint
#   ted  - acme member of team maint, which is granted editor on every
#          blueprint
#   vw   - acme member; granted viewer on every blueprint
#   mem  - acme member; no grant
#   left - granted editor on every blueprint, holds no role in acme
name: blueprint-editor
model_file: ../../src/authorization/model/data/authorization-model.json
tuples:
  - {user: identity_account:own, relation: member, object: organization:acme}
  - {user: identity_account:own, relation: affiliated, object: organization:acme}
  - {user: identity_account:adm, relation: admin, object: organization:acme}
  - {user: identity_account:adm, relation: affiliated, object: organization:acme}
  - {user: identity_account:ed, relation: member, object: organization:acme}
  - {user: identity_account:ed, relation: affiliated, object: organization:acme}
  - {user: identity_account:ted, relation: member, object: organization:acme}
  - {user: identity_account:ted, relation: affiliated, object: organization:acme}
  - {user: identity_account:vw, relation: member, object: organization:acme}
  - {user: identity_account:vw, relation: affiliated, object: organization:acme}
  - {user: identity_account:mem, relation: member, object: organization:acme}
  - {user: identity_account:mem, relation: affiliated, object: organization:acme}
  - {user: organization:acme, relation: organization, object: team:maint}
  - {user: identity_account:ted, relation: member, object: team:maint}

  - {user: organization:acme, relation: organization, object: agent:bot}
  - {user: identity_account:own, relation: owner, object: agent:bot}
  - {user: identity_account:ed, relation: editor, object: agent:bot}
  - {user: team:maint#member, relation: editor, object: agent:bot}
  - {user: identity_account:vw, relation: viewer, object: agent:bot}
  - {user: identity_account:left, relation: editor, object: agent:bot}
  - {user: organization:acme, relation: organization, object: agent_instance:bot-default}
  - {user: agent:bot, relation: agent, object: agent_instance:bot-default}
  - {user: agent:bot, relation: default_of, object: agent_instance:bot-default}

  - {user: organization:acme, relation: organization, object: workflow:flow}
  - {user: identity_account:own, relation: owner, object: workflow:flow}
  - {user: identity_account:ed, relation: editor, object: workflow:flow}
  - {user: team:maint#member, relation: editor, object: workflow:flow}
  - {user: identity_account:vw, relation: viewer, object: workflow:flow}
  - {user: identity_account:left, relation: editor, object: workflow:flow}

  - {user: organization:acme, relation: organization, object: mcp_server:tools}
  - {user: identity_account:own, relation: owner, object: mcp_server:tools}
  - {user: identity_account:ed, relation: editor, object: mcp_server:tools}
  - {user: team:maint#member, relation: editor, object: mcp_server:tools}
  - {user: identity_account:vw, relation: viewer, object: mcp_server:tools}
  - {user: identity_account:left, relation: editor, object: mcp_server:tools}
tests:
  - name: an editor edits and does what a viewer does, and never deletes or decides who reaches it
    check:
      - user: identity_account:ed
        object: agent:bot
        assertions: {editor: true, viewer: true, owner: false, can_view: true, can_edit: true, can_execute: true, can_create_instance: true, can_view_access: true, can_delete: false, can_grant_access: false, can_manage_audience: false}
      - user: identity_account:ed
        object: workflow:flow
        assertions: {editor: true, viewer: true, owner: false, can_view: true, can_edit: true, can_execute: true, can_view_access: true, can_delete: false, can_grant_access: false, can_manage_audience: false}
      - user: identity_account:ed
        object: mcp_server:tools
        assertions: {editor: true, viewer: true, owner: false, can_view: true, can_edit: true, can_connect: true, can_view_access: true, can_delete: false, can_grant_access: false, can_manage_audience: false}
  - name: an editor runs the agent through its default instance, as its viewers do
    check:
      - user: identity_account:ed
        object: agent_instance:bot-default
        assertions: {viewer: true, can_view: true, can_execute: true, can_edit: false, can_grant_access: false}
  - name: a team granted editor makes each bounded member an editor
    check:
      - user: identity_account:ted
        object: agent:bot
        assertions: {editor: true, can_edit: true, can_delete: false, can_grant_access: false, can_manage_audience: false}
      - user: identity_account:ted
        object: workflow:flow
        assertions: {editor: true, can_edit: true, can_delete: false, can_grant_access: false, can_manage_audience: false}
      - user: identity_account:ted
        object: mcp_server:tools
        assertions: {editor: true, can_edit: true, can_delete: false, can_grant_access: false, can_manage_audience: false}
  - name: a viewer, a member without a grant and someone outside the organization edit nothing
    check:
      - {user: identity_account:vw, object: agent:bot, assertions: {editor: false, can_view: true, can_edit: false}}
      - {user: identity_account:vw, object: workflow:flow, assertions: {editor: false, can_view: true, can_edit: false}}
      - {user: identity_account:vw, object: mcp_server:tools, assertions: {editor: false, can_view: true, can_edit: false}}
      - {user: identity_account:mem, object: agent:bot, assertions: {editor: false, can_view: false, can_edit: false}}
      - {user: identity_account:mem, object: workflow:flow, assertions: {editor: false, can_view: false, can_edit: false}}
      - {user: identity_account:mem, object: mcp_server:tools, assertions: {editor: false, can_view: false, can_edit: false}}
      - {user: identity_account:left, object: agent:bot, assertions: {editor: false, viewer: false, can_view: false, can_edit: false}}
      - {user: identity_account:left, object: workflow:flow, assertions: {editor: false, viewer: false, can_view: false, can_edit: false}}
      - {user: identity_account:left, object: mcp_server:tools, assertions: {editor: false, viewer: false, can_view: false, can_edit: false}}
  - name: the owner and the organization's admins keep everything
    check:
      - {user: identity_account:own, object: agent:bot, assertions: {owner: true, can_edit: true, can_delete: true, can_grant_access: true, can_manage_audience: true}}
      - {user: identity_account:adm, object: agent:bot, assertions: {owner: true, can_edit: true, can_delete: true, can_grant_access: true, can_manage_audience: true}}
      - {user: identity_account:own, object: workflow:flow, assertions: {owner: true, can_edit: true, can_delete: true, can_grant_access: true, can_manage_audience: true}}
      - {user: identity_account:adm, object: mcp_server:tools, assertions: {owner: true, can_edit: true, can_delete: true, can_grant_access: true, can_manage_audience: true}}
  - name: an editor's listings carry what they edit
    list_objects:
      - {user: identity_account:ed, type: agent, assertions: {can_edit: [agent:bot], can_view: [agent:bot]}}
      - {user: identity_account:ted, type: workflow, assertions: {can_edit: [workflow:flow]}}
      - {user: identity_account:left, type: mcp_server, assertions: {can_edit: [], can_view: []}}
