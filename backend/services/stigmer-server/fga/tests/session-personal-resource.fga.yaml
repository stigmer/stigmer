# Store tests for the session personal-resource model, including owner
# deletability (since 2026-07-08).
#
# Sessions are always private: no visibility tuples are ever written, so
# access is owner + explicit participant and viewer grants only. A
# participant reads and sends; a viewer only reads. Org admins have no implicit
# access, and platform operators have no session-delete override — the
# platform-level can_delete_session relation was removed in favor of
# `can_delete: owner` on the session itself (deletion no longer threatens
# the billing trail; usage records are immutable and denormalized).
#
# Runs inherit ALL access from their parent session
# (`owner from session`), so the run assertions here pin the
# inheritance that session cascade-delete relies on.
#
# Run with:
#   fga model test --tests session-personal-resource.fga.yaml
#
# Scenario: org "acme" has admin alice, member bob (session creator), member
# carol (a viewer of bob's session) and member paul (a participant in it).
# dana is a platform operator with no relation to the session.
name: session-personal-resource
model_file: ../../src/authorization/model/data/authorization-model.json

tuples:
  # --- Org roles ---
  - user: identity_account:alice
    relation: admin
    object: organization:acme
  - user: identity_account:alice
    relation: affiliated
    object: organization:acme
  - user: identity_account:bob
    relation: member
    object: organization:acme
  - user: identity_account:bob
    relation: affiliated
    object: organization:acme
  - user: identity_account:carol
    relation: member
    object: organization:acme
  - user: identity_account:carol
    relation: affiliated
    object: organization:acme
  - user: identity_account:paul
    relation: member
    object: organization:acme
  - user: identity_account:paul
    relation: affiliated
    object: organization:acme

  # --- Platform operator (no relation to the session) ---
  - user: identity_account:dana
    relation: operator
    object: platform:stigmer

  # --- bob's session (tuples written on create) ---
  - user: organization:acme
    relation: organization
    object: session:bobs-chat
  - user: identity_account:bob
    relation: owner
    object: session:bobs-chat

  # --- carol holds an explicit viewer grant on the session ---
  - user: identity_account:carol
    relation: viewer
    object: session:bobs-chat

  # --- paul holds an explicit participant grant on the session ---
  - user: identity_account:paul
    relation: participant
    object: session:bobs-chat

  # --- a run inside the session ---
  - user: session:bobs-chat
    relation: session
    object: run:run-1

tests:
  - name: owner has full control including delete
    check:
      - user: identity_account:bob
        object: session:bobs-chat
        assertions:
          can_view: true
          can_edit: true
          can_delete: true
          can_create_run_in: true
          can_grant_access: true

  - name: explicit viewer reads, but cannot send, edit or delete
    check:
      - user: identity_account:carol
        object: session:bobs-chat
        assertions:
          can_view: true
          can_view_access: true
          can_create_run_in: false
          can_edit: false
          can_delete: false
          can_grant_access: false

  - name: explicit participant reads and sends, but cannot edit, delete or share
    check:
      - user: identity_account:paul
        object: session:bobs-chat
        assertions:
          can_view: true
          can_view_access: true
          can_create_run_in: true
          can_edit: false
          can_delete: false
          can_grant_access: false

  - name: org admin has no implicit access to a personal session
    check:
      - user: identity_account:alice
        object: session:bobs-chat
        assertions:
          can_view: false
          can_edit: false
          can_delete: false

  - name: platform operator has no session-delete override
    check:
      - user: identity_account:dana
        object: session:bobs-chat
        assertions:
          can_view: false
          can_delete: false

  - name: run access is inherited from the parent session
    check:
      - user: identity_account:bob
        object: run:run-1
        assertions:
          can_view: true
          can_edit: true
      - user: identity_account:carol
        object: run:run-1
        assertions:
          can_view: true
          can_edit: false
      # A participant reads the runs; stopping and approving stay the
      # owners' (run#can_edit is owner from session).
      - user: identity_account:paul
        object: run:run-1
        assertions:
          can_view: true
          can_edit: false
      - user: identity_account:alice
        object: run:run-1
        assertions:
          can_view: false
