# Every organization-scoped type admits its direct subjects only while
# they hold a role in the object's organization (`affiliated`, the
# organization's viewers and guests; tenancy/organization.fga). One
# object per bounded type, all in organization acme:
#
#   stays - a member of acme; authored every object and holds a direct
#           viewer grant on the credential kinds
#   left  - authored every object and holds a direct viewer grant on every
#           one, but holds no role in acme: never joined, or was removed
#   back  - authored every object, left, and was invited back as a viewer
#   stray - holds acme's member role and authored the agent, but no
#           `affiliated` tuple stands for them: the state a crash between
#           a role's write and its affiliation leaves, which must deny
#
# What the suite pins: `left` reaches nothing, however the grant was
# made; `stays` and `back` keep what they authored; a system account that
# holds only `guest` keeps the session it owns; a memory's subject reaches
# the memory only while in the organization; environment's `creator` and
# a workflow instance's `execution_viewer` are bounded the same way.
name: organization-affiliation-bound
model_file: ../../src/authorization/model/data/authorization-model.json

tuples:
  - {user: identity_account:stays, relation: member, object: organization:acme}
  - {user: identity_account:stays, relation: affiliated, object: organization:acme}
  - {user: identity_account:back, relation: viewer, object: organization:acme}
  - {user: identity_account:back, relation: affiliated, object: organization:acme}
  - {user: identity_account:sys-guest, relation: guest, object: organization:acme}
  - {user: identity_account:sys-guest, relation: affiliated, object: organization:acme}

  - {user: organization:acme, relation: organization, object: agent:x}
  - {user: identity_account:stays, relation: owner, object: agent:x}
  - {user: identity_account:left, relation: owner, object: agent:x}
  - {user: identity_account:back, relation: owner, object: agent:x}
  - {user: identity_account:left, relation: viewer, object: agent:x}
  - {user: organization:acme, relation: organization, object: mcp_server:x}
  - {user: identity_account:stays, relation: owner, object: mcp_server:x}
  - {user: identity_account:left, relation: owner, object: mcp_server:x}
  - {user: identity_account:back, relation: owner, object: mcp_server:x}
  - {user: identity_account:left, relation: viewer, object: mcp_server:x}
  - {user: organization:acme, relation: organization, object: skill:x}
  - {user: identity_account:stays, relation: owner, object: skill:x}
  - {user: identity_account:left, relation: owner, object: skill:x}
  - {user: identity_account:back, relation: owner, object: skill:x}
  - {user: identity_account:left, relation: viewer, object: skill:x}
