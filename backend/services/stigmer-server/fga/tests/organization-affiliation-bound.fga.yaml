  - {user: identity_account:stays, relation: owner, object: plugin:x}
  - {user: identity_account:left, relation: owner, object: plugin:x}
  - {user: identity_account:back, relation: owner, object: plugin:x}
  - {user: identity_account:left, relation: viewer, object: plugin:x}
  - {user: organization:acme, relation: organization, object: agent_channel:x}
  - {user: identity_account:stays, relation: owner, object: agent_channel:x}
  - {user: identity_account:left, relation: owner, object: agent_channel:x}
  - {user: identity_account:back, relation: owner, object: agent_channel:x}
  - {user: identity_account:left, relation: viewer, object: agent_channel:x}
  - {user: organization:acme, relation: organization, object: agent_share:x}
  - {user: identity_account:stays, relation: owner, object: agent_share:x}
  - {user: identity_account:left, relation: owner, object: agent_share:x}
  - {user: identity_account:back, relation: owner, object: agent_share:x}
  - {user: identity_account:left, relation: viewer, object: agent_share:x}
  - {user: organization:acme, relation: organization, object: channel_app:x}
  - {user: identity_account:stays, relation: viewer, object: channel_app:x}
  - {user: identity_account:left, relation: viewer, object: channel_app:x}
  - {user: organization:acme, relation: organization, object: schedule:x}
  - {user: identity_account:stays, relation: owner, object: schedule:x}
  - {user: identity_account:left, relation: owner, object: schedule:x}
  - {user: identity_account:back, relation: owner, object: schedule:x}
  - {user: identity_account:left, relation: viewer, object: schedule:x}
  - {user: organization:acme, relation: organization, object: artifact:x}
  - {user: identity_account:stays, relation: owner, object: artifact:x}
  - {user: identity_account:left, relation: owner, object: artifact:x}
  - {user: identity_account:back, relation: owner, object: artifact:x}
  - {user: identity_account:left, relation: viewer, object: artifact:x}
  - {user: organization:acme, relation: organization, object: agent_instance:x}
  - {user: identity_account:stays, relation: owner, object: agent_instance:x}
  - {user: identity_account:left, relation: owner, object: agent_instance:x}
  - {user: identity_account:back, relation: owner, object: agent_instance:x}
  - {user: identity_account:left, relation: viewer, object: agent_instance:x}
  - {user: organization:acme, relation: organization, object: workflow_instance:x}
  - {user: identity_account:stays, relation: owner, object: workflow_instance:x}
  - {user: identity_account:left, relation: owner, object: workflow_instance:x}
  - {user: identity_account:back, relation: owner, object: workflow_instance:x}
  - {user: identity_account:left, relation: viewer, object: workflow_instance:x}
  - {user: organization:acme, relation: organization, object: environment:x}
