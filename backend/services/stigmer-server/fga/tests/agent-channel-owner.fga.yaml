# Agent channels are owner-scoped connection config (since 2026-07-13,
# cloned from the agent_share model): the creator owns the
# channel; view/edit/delete/install require ownership or an explicit grant.
# Plain org members get NO implicit access, and — critically — no
# workspace-visitor tuples exist at all: workspace-user admission to the
# channel runtime is app-level (webhook signature + channel caller identity
# + per-turn gates), never FGA.
#
# Org ADMINS inherit owner (since 2026-07-13, consistent with agents and
# shares — an admin who can edit the agent can manage its distribution
# channels). The narrowness these tests pin: owner + admins have control,
# granted viewers read, plain members have nothing.
#
# Run: fga model test --tests agent-channel-owner.fga.yaml

name: agent-channel-owner
model_file: ../../src/authorization/model/data/authorization-model.json

tuples:
  # Org membership for both accounts — proving membership grants nothing.
  - user: identity_account:alice
    relation: member
    object: organization:acme
  - user: identity_account:mallory
    relation: member
    object: organization:acme

  # Org admin — proving admin owner inheritance reaches channels.
  - user: identity_account:ana
    relation: admin
    object: organization:acme

  # The channel, created by alice (the config-driven create tuples).
  - user: organization:acme
    relation: organization
    object: agent_channel:support-bot-slack
  - user: identity_account:alice
    relation: owner
    object: agent_channel:support-bot-slack

  # An explicit viewer grant to carol (not even an org member).
  - user: identity_account:carol
    relation: viewer
    object: agent_channel:support-bot-slack

tests:
  - name: owner has full control including grant management
    check:
      - user: identity_account:alice
        object: agent_channel:support-bot-slack
        assertions:
          can_view: true
          can_edit: true
          can_delete: true
          can_grant_access: true
          can_view_access: true

  - name: explicitly granted viewer can read but not mutate
    check:
      - user: identity_account:carol
        object: agent_channel:support-bot-slack
        assertions:
          can_view: true
          can_edit: false
          can_delete: false
          can_grant_access: false
          can_view_access: true

  - name: fellow org member has no implicit access
    check:
      - user: identity_account:mallory
        object: agent_channel:support-bot-slack
        assertions:
          can_view: false
          can_edit: false
          can_delete: false
          can_grant_access: false
          can_view_access: false

  - name: org admin inherits channel management
    check:
      - user: identity_account:ana
        object: agent_channel:support-bot-slack
        assertions:
          can_view: true
          can_edit: true
          can_delete: true
          can_grant_access: true

  - name: listing channels reflects ownership and grants, not membership
    list_objects:
      - user: identity_account:alice
        type: agent_channel
        assertions:
          can_view:
            - agent_channel:support-bot-slack
          can_edit:
            - agent_channel:support-bot-slack
      - user: identity_account:carol
        type: agent_channel
        assertions:
          can_view:
            - agent_channel:support-bot-slack
          can_edit: []
      - user: identity_account:mallory
        type: agent_channel
        assertions:
          can_view: []
