# Store tests for the reserved-label write permission (stigmer#548).
#
# can_write_reserved_labels gates who may introduce or change labels in
# the reserved stigmer.ai/* namespace at client-facing write boundaries
# (GuardReservedLabelsStep). It derives from the platform operator role
# — the seeding machine account holds it, ordinary tenants (even org
# owners) never do, regardless of what they own.
#
# Run with:
#   fga model test --tests reserved-label-writer.fga.yaml
name: reserved-label-writer
model_file: ../../src/authorization/model/data/authorization-model.json

tuples:
  # The bootstrap machine account is the platform operator
  # (BootstrapIdentitySeeder re-asserts this tuple on every boot).
  - user: identity_account:machine
    relation: operator
    object: platform:stigmer

  # A tenant org owner — owns everything in their org, nothing on the
  # platform.
  - user: identity_account:mallory
    relation: owner
    object: organization:acme

tests:
  - name: operator may write reserved labels, tenants may not
    check:
      - user: identity_account:machine
        object: platform:stigmer
        assertions:
          can_write_reserved_labels: true
      - user: identity_account:mallory
        object: platform:stigmer
        assertions:
          can_write_reserved_labels: false
