# A service account is managed by its organization's current admins: they
# view, rename and delete it and view and revoke its keys. Its
# organization's other people, and the admins of any other organization,
# reach neither. Nobody but a person reaches a person's account or keys:
# a person's account carries no organization link.
#
# Cast (organization acme unless named):
#   root  - acme owner (an admin through the role hierarchy)
#   ana   - acme admin
#   dave  - acme member-role member
#   vera  - acme viewer-role member
#   zara  - admin of the unrelated organization other
#   ci    - acme's service account, holding member; owns key `ci_key`
#   ana's own key is `ana_key`
#
# `ci` carries its self-owner tuple and the organization link. Its key's
# owner is `ci`, the account the key speaks for.
name: service-account-administration
model_file: ../../src/authorization/model/data/authorization-model.json
tuples:
  - {user: identity_account:root, relation: owner, object: organization:acme}
  - {user: identity_account:root, relation: affiliated, object: organization:acme}
  - {user: identity_account:ana, relation: admin, object: organization:acme}
  - {user: identity_account:ana, relation: affiliated, object: organization:acme}
  - {user: identity_account:dave, relation: member, object: organization:acme}
  - {user: identity_account:dave, relation: affiliated, object: organization:acme}
  - {user: identity_account:vera, relation: viewer, object: organization:acme}
  - {user: identity_account:vera, relation: affiliated, object: organization:acme}
  - {user: identity_account:zara, relation: admin, object: organization:other}
  - {user: identity_account:zara, relation: affiliated, object: organization:other}
  - {user: identity_account:ci, relation: member, object: organization:acme}
  - {user: identity_account:ci, relation: affiliated, object: organization:acme}
  - {user: identity_account:ci, relation: owner, object: identity_account:ci}
  - {user: organization:acme, relation: organization, object: identity_account:ci}
  - {user: identity_account:ci, relation: owner, object: api_key:ci_key}
  - {user: identity_account:ana, relation: owner, object: identity_account:ana}
  - {user: identity_account:ana, relation: owner, object: api_key:ana_key}
tests:
  - name: an admin manages the service account and its keys, the owner through the same role
    check:
      - user: identity_account:ana
        object: identity_account:ci
        assertions: {can_view: true, can_edit: true, can_delete: true, can_manage_keys: true, can_grant_access: false, can_view_access: false}
      - user: identity_account:root
        object: identity_account:ci
        assertions: {can_view: true, can_edit: true, can_delete: true, can_manage_keys: true}
      - user: identity_account:ana
        object: api_key:ci_key
        assertions: {can_view: true, can_edit: true, can_delete: true, can_grant_access: false, can_view_access: false}
      - user: identity_account:root
        object: api_key:ci_key
        assertions: {can_view: true, can_delete: true}
  - name: a member and a viewer reach neither the service account nor its keys
    check:
      - user: identity_account:dave
        object: identity_account:ci
        assertions: {can_view: false, can_edit: false, can_delete: false, can_manage_keys: false}
      - user: identity_account:vera
        object: identity_account:ci
        assertions: {can_view: false, can_edit: false, can_delete: false, can_manage_keys: false}
      - user: identity_account:dave
        object: api_key:ci_key
        assertions: {can_view: false, can_edit: false, can_delete: false}
      - user: identity_account:vera
        object: api_key:ci_key
        assertions: {can_view: false, can_delete: false}
  - name: an admin of another organization reaches nothing
    check:
      - user: identity_account:zara
        object: identity_account:ci
        assertions: {can_view: false, can_edit: false, can_delete: false, can_manage_keys: false}
      - user: identity_account:zara
        object: api_key:ci_key
        assertions: {can_view: false, can_delete: false}
  - name: a member-role service account holds its own key as owner and manages no keys
    check:
      - user: identity_account:ci
        object: api_key:ci_key
        assertions: {can_view: true, can_delete: true}
      - user: identity_account:ci
        object: identity_account:ci
        assertions: {can_view: true, can_manage_keys: false}
  - name: nobody but the person reaches a person's account or key, an admin included
    check:
      - user: identity_account:ana
        object: api_key:ana_key
        assertions: {can_view: true, can_edit: true, can_delete: true}
      - user: identity_account:root
        object: api_key:ana_key
        assertions: {can_view: false, can_edit: false, can_delete: false}
      - user: identity_account:root
        object: identity_account:ana
        assertions: {can_view: false, can_edit: false, can_delete: false, can_manage_keys: false}
      - user: identity_account:ci
        object: api_key:ana_key
        assertions: {can_view: false, can_delete: false}
  - name: an admin lists the service account's keys among the keys it may view
    list_objects:
      - user: identity_account:ana
        type: api_key
        assertions: {can_view: [api_key:ci_key, api_key:ana_key]}
      - user: identity_account:dave
        type: api_key
        assertions: {can_view: []}
