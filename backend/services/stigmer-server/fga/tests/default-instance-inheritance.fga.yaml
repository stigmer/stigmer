# Store tests for default-instance structural inheritance (default_of).
#
# A workflow's system-managed default instance carries a single
#   workflow_instance#default_of@workflow:<id>
# tuple and inherits the workflow's ENTIRE viewer set through
# `viewer from default_of` — org members and the people of the owning
# organization's children (organization#child_org_viewer). No enum-derived
# visibility tuples are ever written on default instances, so their access
# can never drift from the template's.
#
# Run with:
#   fga model test --tests default-instance-inheritance.fga.yaml
#
# Scenario: "planton" is a parent organization with one child, "acme".
# Planton authors workflows at every visibility level; each has a default
# instance linked via default_of. Alice (acme member) reaches default
# instances of workflows shared with child organizations; planton members reach default instances of org-visible ones;
# personal instances never leak.
name: default-instance-inheritance
model_file: ../../src/authorization/model/data/authorization-model.json

tuples:
  # --- acme is a child of planton: both edges ---
  - user: organization:planton
    relation: parent_org
    object: organization:acme
  - user: organization:acme
    relation: child_org
    object: organization:planton

  # --- Org memberships ---
  - user: identity_account:swarup
    relation: owner
    object: organization:planton
  - user: identity_account:swarup
    relation: affiliated
    object: organization:planton
  - user: identity_account:priya
    relation: member
    object: organization:planton
  - user: identity_account:priya
    relation: affiliated
    object: organization:planton
  - user: identity_account:veda
    relation: viewer
    object: organization:planton
  - user: identity_account:veda
    relation: affiliated
    object: organization:planton
  - user: identity_account:alice
    relation: member
    object: organization:acme
  - user: identity_account:alice
    relation: affiliated
    object: organization:acme
  - user: identity_account:mallory
    relation: member
    object: organization:outsider
  - user: identity_account:mallory
    relation: affiliated
    object: organization:outsider

  # --- Workflow shared with child organizations + its default instance ---
  - user: organization:planton
    relation: organization
    object: workflow:onboarding
  - user: identity_account:swarup
    relation: owner
    object: workflow:onboarding
  - user: organization:planton#child_org_viewer
    relation: child_org_viewer
    object: workflow:onboarding
  - user: organization:planton#viewer
    relation: viewer
    object: workflow:onboarding
  - user: organization:planton
    relation: organization
    object: workflow_instance:onboarding-default
  - user: workflow:onboarding
    relation: workflow
    object: workflow_instance:onboarding-default
  - user: identity_account:swarup
    relation: owner
    object: workflow_instance:onboarding-default
  - user: workflow:onboarding
    relation: default_of
    object: workflow_instance:onboarding-default

  # --- Alice's personal instance of the shared workflow (NO default_of) ---
  - user: organization:acme
    relation: organization
    object: workflow_instance:alice-personal
  - user: workflow:onboarding
    relation: workflow
    object: workflow_instance:alice-personal
  - user: identity_account:alice
    relation: owner
    object: workflow_instance:alice-personal

  # --- Org-visible workflow + its default instance ---
  # ORG visibility is an explicit viewer tuple (viewer@org#viewer) — the
  # unconditional `viewer from organization` grant is gone (private is real).
  - user: organization:planton
    relation: organization
    object: workflow:internal-flow
  - user: identity_account:swarup
    relation: owner
    object: workflow:internal-flow
  - user: organization:planton#viewer
    relation: viewer
    object: workflow:internal-flow
  - user: organization:planton
    relation: organization
    object: workflow_instance:internal-default
  - user: workflow:internal-flow
    relation: workflow
    object: workflow_instance:internal-default
  - user: identity_account:swarup
    relation: owner
    object: workflow_instance:internal-default
  - user: workflow:internal-flow
    relation: default_of
    object: workflow_instance:internal-default

tests:
  - name: a child's member reaches the default instance of a workflow shared with children
    check:
      - user: identity_account:alice
        object: workflow_instance:onboarding-default
        assertions:
          can_view: true
          can_execute: true
          can_edit: false
          can_delete: false

  - name: outsiders get nothing from the default_of link
    check:
      - user: identity_account:mallory
        object: workflow_instance:onboarding-default
        assertions:
          can_view: false
          can_execute: false

  - name: personal instances never leak through the parent workflow
    check:
      # Swarup owns the workflow itself, but alice's personal instance has
      # no default_of tuple — only she (its owner) can reach it.
      - user: identity_account:swarup
        object: workflow_instance:alice-personal
        assertions:
          can_view: false
      - user: identity_account:alice
        object: workflow_instance:alice-personal
        assertions:
          can_view: true
          can_edit: true

  - name: org members reach the default instance of an org-visible workflow
    check:
      - user: identity_account:priya
        object: workflow_instance:internal-default
        assertions:
          can_view: true
          can_execute: true
          can_edit: false
      # stigmer#465: the default_of chain reaches org viewer-role users too —
      # the viewer-shaped org tuple on the parent workflow is the org's full
      # read audience, and the default instance inherits it structurally.
      - user: identity_account:veda
        object: workflow_instance:internal-default
        assertions:
          can_view: true
          can_edit: false
      # A child's membership grants nothing on a workflow not shared with children.
      - user: identity_account:alice
        object: workflow_instance:internal-default
        assertions:
          can_view: false

  - name: list a child member's viewable workflow instances resolves the default_of chain
    list_objects:
      - user: identity_account:alice
        type: workflow_instance
        assertions:
          can_view:
            - workflow_instance:onboarding-default
            - workflow_instance:alice-personal
