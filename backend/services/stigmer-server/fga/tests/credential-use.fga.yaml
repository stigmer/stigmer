# Who may use, manage and reveal a credential.
#
# A person's credential is theirs alone: they use, edit and reveal it, and
# nobody else reaches it, the organization's owner and admins included. An
# organization's credential has no owner: its admins manage and use it, a
# `user` grant (to a person or a team's members) lets others' runs use it,
# and nobody reveals it.
#
# Cast (organization acme unless named):
#   root - acme owner
#   ana  - acme admin
#   dave - acme member; owns the credential dave-openai
#   bob  - acme member granted `user` on the organization's datadog key
#   tess - acme viewer, a member of team on-call, which is granted `user`
#   gus  - acme guest (the system accounts' role)
#   vera - acme viewer with no grant
#   mal  - a member of organization other
name: credential-use
model_file: ../../src/authorization/model/data/authorization-model.json

tuples:
  - {user: identity_account:root, relation: owner, object: organization:acme}
  - {user: identity_account:root, relation: affiliated, object: organization:acme}
  - {user: identity_account:ana, relation: admin, object: organization:acme}
  - {user: identity_account:ana, relation: affiliated, object: organization:acme}
  - {user: identity_account:dave, relation: member, object: organization:acme}
  - {user: identity_account:dave, relation: affiliated, object: organization:acme}
  - {user: identity_account:bob, relation: member, object: organization:acme}
  - {user: identity_account:bob, relation: affiliated, object: organization:acme}
  - {user: identity_account:tess, relation: viewer, object: organization:acme}
  - {user: identity_account:tess, relation: affiliated, object: organization:acme}
  - {user: identity_account:gus, relation: guest, object: organization:acme}
  - {user: identity_account:gus, relation: affiliated, object: organization:acme}
  - {user: identity_account:vera, relation: viewer, object: organization:acme}
  - {user: identity_account:vera, relation: affiliated, object: organization:acme}
  - {user: identity_account:mal, relation: member, object: organization:other}
  - {user: identity_account:mal, relation: affiliated, object: organization:other}
  - {user: organization:acme, relation: organization, object: team:on-call}
  - {user: identity_account:tess, relation: member, object: team:on-call}

  # dave's own credential: the scope link and its owner link.
  - {user: organization:acme, relation: organization, object: credential:dave-openai}
  - {user: identity_account:dave, relation: owner, object: credential:dave-openai}

  # The organization's credential: the scope link, its org_owned link, and
  # two `user` grants.
  - {user: organization:acme, relation: organization, object: credential:datadog}
  - {user: organization:acme, relation: org_owned, object: credential:datadog}
  - {user: identity_account:bob, relation: user, object: credential:datadog}
  - {user: team:on-call#member, relation: user, object: credential:datadog}

  # A grant on another organization's credential reaches nobody here.
  - {user: organization:other, relation: organization, object: credential:other-key}
  - {user: organization:other, relation: org_owned, object: credential:other-key}
  - {user: identity_account:dave, relation: user, object: credential:other-key}

tests:
  - name: a person's credential is theirs alone
    check:
      - user: identity_account:dave
        object: credential:dave-openai
        assertions: {can_use: true, can_view: true, can_edit: true, can_delete: true, can_read_secrets: true, can_grant_access: false}
      - user: identity_account:ana
        object: credential:dave-openai
        assertions: {can_use: false, can_view: false, can_edit: false, can_delete: false, can_read_secrets: false}
      - user: identity_account:root
        object: credential:dave-openai
        assertions: {can_use: false, can_view: false, can_read_secrets: false}
      - user: identity_account:bob
        object: credential:dave-openai
        assertions: {can_use: false, can_view: false}

  - name: the organization's admins manage its credential and never reveal it
    check:
      - user: identity_account:ana
        object: credential:datadog
        assertions: {can_use: true, can_view: true, can_edit: true, can_delete: true, can_grant_access: true, can_view_access: true, can_read_secrets: false}
      - user: identity_account:root
        object: credential:datadog
        assertions: {can_use: true, can_edit: true, can_read_secrets: false}

  - name: a user grant lets a run use the credential and nothing more
    check:
      - user: identity_account:bob
        object: credential:datadog
        assertions: {can_use: true, can_view: true, can_edit: false, can_delete: false, can_grant_access: false, can_read_secrets: false}
      - user: identity_account:tess
        object: credential:datadog
        assertions: {can_use: true, can_view: true, can_edit: false, can_read_secrets: false}

  - name: without a grant, a member, a viewer, a guest and an outsider use nothing
    check:
      - user: identity_account:dave
        object: credential:datadog
        assertions: {can_use: false, can_view: false}
      - user: identity_account:vera
        object: credential:datadog
        assertions: {can_use: false, can_view: false}
      - user: identity_account:gus
        object: credential:datadog
        assertions: {can_use: false, can_view: false}
      - user: identity_account:mal
        object: credential:datadog
        assertions: {can_use: false, can_view: false}
      - user: identity_account:dave
        object: credential:other-key
        assertions: {can_use: false, can_view: false}

  - name: members save their own credentials and admins the organization's
    check:
      - user: identity_account:dave
        object: organization:acme
        assertions: {can_create_credential: true, can_create_org_credential: false}
      - user: identity_account:ana
        object: organization:acme
        assertions: {can_create_credential: true, can_create_org_credential: true}
      - user: identity_account:vera
        object: organization:acme
        assertions: {can_create_credential: false, can_create_org_credential: false}
      - user: identity_account:gus
        object: organization:acme
        assertions: {can_create_credential: false, can_create_org_credential: false}

  - name: listings follow the grants
    list_objects:
      - user: identity_account:bob
        type: credential
        assertions:
          can_use: [credential:datadog]
      - user: identity_account:dave
        type: credential
        assertions:
          can_use: [credential:dave-openai]
      - user: identity_account:ana
        type: credential
        assertions:
          can_use: [credential:datadog]
