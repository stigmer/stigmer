# Agent shares are owner-scoped channel config (since 2026-07-12):
# the creator owns the share; view/edit/delete/rotate require ownership or
# an explicit grant. Plain org members get NO implicit access, and —
# critically — no visitor-facing tuples exist at all: guest/member
# admission to the hosted chat is app-level (shared-profile, mint, and
# create-time gates), never FGA.
#
# Since 2026-07-13, org ADMINS inherit owner (consistent with agents — an
# admin who can edit the agent can manage its channels). The narrowness
# these tests pin is now: owner + admins have control, granted viewers
# read, plain members have nothing.

name: agent-share-owner
model_file: ../../src/authorization/model/data/authorization-model.json

tuples:
  # Org membership for both accounts — proving membership grants nothing.
  - user: identity_account:alice
    relation: member
    object: organization:acme
  - user: identity_account:mallory
    relation: member
    object: organization:acme

  # Org admin — proving admin owner inheritance reaches shares.
  - user: identity_account:ana
    relation: admin
    object: organization:acme

  # The share, created by alice (the config-driven create tuples).
  - user: organization:acme
    relation: organization
    object: agent_share:support-bot-share
  - user: identity_account:alice
    relation: owner
    object: agent_share:support-bot-share

  # An explicit viewer grant to carol (not even an org member).
  - user: identity_account:carol
    relation: viewer
    object: agent_share:support-bot-share

tests:
  - name: owner has full control including grant management
    check:
      - user: identity_account:alice
        object: agent_share:support-bot-share
        assertions:
          can_view: true
          can_edit: true
          can_delete: true
          can_grant_access: true
          can_view_access: true

  - name: explicitly granted viewer can read but not mutate
    check:
      - user: identity_account:carol
        object: agent_share:support-bot-share
        assertions:
          can_view: true
          can_edit: false
          can_delete: false
          can_grant_access: false
          can_view_access: true

  - name: fellow org member has no implicit access
    check:
      - user: identity_account:mallory
        object: agent_share:support-bot-share
        assertions:
          can_view: false
          can_edit: false
          can_delete: false
          can_grant_access: false
          can_view_access: false

  - name: org admin inherits share management
    check:
      - user: identity_account:ana
        object: agent_share:support-bot-share
        assertions:
          can_view: true
          can_edit: true
          can_delete: true
          can_grant_access: true

  - name: listing shares reflects ownership and grants, not membership
    list_objects:
      - user: identity_account:alice
        type: agent_share
        assertions:
          can_view:
            - agent_share:support-bot-share
          can_edit:
            - agent_share:support-bot-share
      - user: identity_account:carol
        type: agent_share
        assertions:
          can_view:
            - agent_share:support-bot-share
          can_edit: []
      - user: identity_account:mallory
        type: agent_share
        assertions:
          can_view: []
