# A federation issuer is managed by its organization's current admins, and
# is invisible to the organization's other people. Creating one confers
# nothing that outlives the creator's role: the kind records no owner.
#
# Cast (organization acme unless named):
#   root  - acme owner (an admin through the role hierarchy)
#   ana   - acme admin; created nothing
#   carol - acme admin; created issuer `sso`
#   cody  - created issuer `sso` too as an acme admin, since demoted to
#           member
#   rex   - created issuer `sso` too, since removed from acme
#   dave  - acme member-role member
#   vera  - acme viewer-role member
#   vince - acme member with a direct viewer grant on `sso`
#   zara  - admin of the unrelated organization other
#   tina  - member of organization tenant, a child of acme
#
# Issuer `sso` carries its creation tuple, the organization link. Issuer
# `unowned` carries the same single link and never had a creator recorded:
# the two are managed alike, which is the point. Issuer `ghost` carries no
# tuple at all, the state an issuer is left in when its creation event
# failed: nobody manages it, which is why the reconcile exists.
name: federation-issuer-administration
model_file: ../../src/authorization/model/data/authorization-model.json
tuples:
  - {user: identity_account:root, relation: owner, object: organization:acme}
  - {user: identity_account:root, relation: affiliated, object: organization:acme}
  - {user: identity_account:ana, relation: admin, object: organization:acme}
  - {user: identity_account:ana, relation: affiliated, object: organization:acme}
  - {user: identity_account:carol, relation: admin, object: organization:acme}
  - {user: identity_account:carol, relation: affiliated, object: organization:acme}
  - {user: identity_account:cody, relation: member, object: organization:acme}
  - {user: identity_account:cody, relation: affiliated, object: organization:acme}
  - {user: identity_account:dave, relation: member, object: organization:acme}
  - {user: identity_account:dave, relation: affiliated, object: organization:acme}
  - {user: identity_account:vera, relation: viewer, object: organization:acme}
  - {user: identity_account:vera, relation: affiliated, object: organization:acme}
  - {user: identity_account:vince, relation: member, object: organization:acme}
  - {user: identity_account:vince, relation: affiliated, object: organization:acme}
  - {user: identity_account:zara, relation: admin, object: organization:other}
  - {user: identity_account:zara, relation: affiliated, object: organization:other}
  - {user: identity_account:tina, relation: member, object: organization:tenant}
  - {user: identity_account:tina, relation: affiliated, object: organization:tenant}
  - {user: organization:acme, relation: organization, object: federation_issuer:sso}
  - {user: identity_account:vince, relation: viewer, object: federation_issuer:sso}
  - {user: organization:acme, relation: parent_org, object: organization:tenant}
  - {user: organization:tenant, relation: child_org, object: organization:acme}
  - {user: organization:acme, relation: organization, object: federation_issuer:unowned}
tests:
  - name: every org admin manages the issuer, its creator through the same role
    check:
      - user: identity_account:carol
        object: federation_issuer:sso
        assertions: {owner: true, can_view: true, can_edit: true, can_delete: true, can_grant_access: true, can_view_access: true}
      - user: identity_account:ana
        object: federation_issuer:sso
        assertions: {owner: true, can_view: true, can_edit: true, can_delete: true, can_grant_access: true, can_view_access: true}
      - user: identity_account:root
        object: federation_issuer:sso
        assertions: {owner: true, can_view: true, can_edit: true, can_delete: true, can_grant_access: true}
  - name: a creator who is no longer an admin, or no longer a member, has nothing on the issuer
    check:
      - user: identity_account:cody
        object: federation_issuer:sso
        assertions: {owner: false, viewer: false, can_view: false, can_edit: false, can_delete: false, can_grant_access: false}
      - user: identity_account:rex
        object: federation_issuer:sso
        assertions: {owner: false, viewer: false, can_view: false, can_edit: false, can_delete: false, can_grant_access: false}
  - name: an issuer with no recorded creator is still managed by its organization's admins
    check:
      - user: identity_account:ana
        object: federation_issuer:unowned
        assertions: {owner: true, can_view: true, can_edit: true, can_delete: true, can_grant_access: true}
      - user: identity_account:dave
        object: federation_issuer:unowned
        assertions: {can_view: false}
  - name: the organization's members and viewers see nothing
    check:
      - user: identity_account:dave
        object: federation_issuer:sso
        assertions: {owner: false, viewer: false, can_view: false, can_edit: false, can_delete: false, can_view_access: false}
      - user: identity_account:vera
        object: federation_issuer:sso
        assertions: {owner: false, viewer: false, can_view: false, can_edit: false, can_view_access: false}
  - name: a direct viewer grant reads the issuer and its access list, and manages nothing
    check:
      - user: identity_account:vince
        object: federation_issuer:sso
        assertions: {viewer: true, can_view: true, can_view_access: true, owner: false, can_edit: false, can_delete: false, can_grant_access: false}
  - name: an admin of another organization has nothing
    check:
      - user: identity_account:zara
        object: federation_issuer:sso
        assertions: {owner: false, can_view: false, can_edit: false, can_delete: false}
  - name: a child organization's people reach nothing on the parent's issuer
    check:
      - user: identity_account:tina
        object: federation_issuer:sso
        assertions: {owner: false, can_view: false, can_edit: false}
  - name: an issuer with no tuples is managed by nobody
    check:
      - user: identity_account:ana
        object: federation_issuer:ghost
        assertions: {can_view: false, can_edit: false, can_delete: false}
  - name: only admins may create an issuer
    check:
      - user: identity_account:ana
        object: organization:acme
        assertions: {can_create_federation_issuer: true}
      - user: identity_account:dave
        object: organization:acme
        assertions: {can_create_federation_issuer: false}
      - user: identity_account:vera
        object: organization:acme
        assertions: {can_create_federation_issuer: false}
  - name: the organization's list holds only what each caller could get
    list_objects:
      - user: identity_account:ana
        type: federation_issuer
        assertions: {can_view: [federation_issuer:sso, federation_issuer:unowned]}
      - user: identity_account:vince
        type: federation_issuer
        assertions: {can_view: [federation_issuer:sso]}
      - user: identity_account:dave
        type: federation_issuer
        assertions: {can_view: []}
      - user: identity_account:vera
        type: federation_issuer
        assertions: {can_view: []}
      - user: identity_account:zara
        type: federation_issuer
        assertions: {can_view: []}
