# Store tests for platform visibility (visibility_platform).
#
# Verifies the userset chain end-to-end against the authorization model:
#
#   blueprint#platform_viewer -> identity_provider#platform_user
#     -> member from managed_org -> organization#member
#
# Run with:
#   fga model test --tests platform-visibility.fga.yaml
#
# Scenario: "planton" is a platform org owning identity_provider:idp1, which
# manages two customer orgs (acme, beta). Blueprints owned by planton and
# shared with visibility_platform must be viewable/executable by acme and
# beta members, invisible to members of an unrelated org, and never editable
# by managed-org members.
name: platform-visibility
model_file: ../../src/authorization/model/data/authorization-model.json

tuples:
  # --- Platform tenancy: idp1 is owned by planton and manages acme + beta ---
  - user: organization:planton
    relation: organization
    object: identity_provider:idp1
  - user: organization:acme
    relation: managed_org
    object: identity_provider:idp1
  - user: organization:beta
    relation: managed_org
    object: identity_provider:idp1

  # --- Org memberships ---
  - user: identity_account:swarup
    relation: owner
    object: organization:planton
  - user: identity_account:priya
    relation: member
    object: organization:planton
  - user: identity_account:veda
    relation: viewer
    object: organization:planton
  - user: identity_account:alice
    relation: member
    object: organization:acme
  - user: identity_account:bob
    relation: member
    object: organization:beta
  - user: identity_account:mallory
    relation: member
    object: organization:outsider

  # --- Platform-shared agent (visibility_platform) owned by planton ---
  # PLATFORM carries the org floor tuple too (viewer@org#viewer — the org's
  # full read audience, stigmer#465), exactly as VisibilityTupleReconciler
  # writes it, so everyone in the platform org keeps access.
  - user: organization:planton
    relation: organization
    object: agent:sara
  - user: identity_account:swarup
    relation: owner
    object: agent:sara
  - user: identity_provider:idp1#platform_user
    relation: platform_viewer
    object: agent:sara
  - user: organization:planton#viewer
    relation: viewer
    object: agent:sara

  # --- Private agent owned by planton (no platform_viewer tuple) ---
  - user: organization:planton
    relation: organization
    object: agent:internal-bot
  - user: identity_account:swarup
    relation: owner
    object: agent:internal-bot

  # --- Platform-shared blueprints of the other three kinds ---
  - user: organization:planton
    relation: organization
    object: skill:research
  - user: identity_provider:idp1#platform_user
    relation: platform_viewer
    object: skill:research
  - user: organization:planton
    relation: organization
    object: workflow:onboarding
  - user: identity_provider:idp1#platform_user
    relation: platform_viewer
    object: workflow:onboarding
  - user: organization:planton
    relation: organization
    object: mcp_server:github
  - user: identity_provider:idp1#platform_user
    relation: platform_viewer
    object: mcp_server:github

tests:
  - name: managed-org members can view and execute a platform-shared agent
    check:
      - user: identity_account:alice
        object: agent:sara
        assertions:
          can_view: true
          can_execute: true
          can_create_instance: true
          can_edit: false
          can_delete: false
      - user: identity_account:bob
        object: agent:sara
        assertions:
          can_view: true
          can_execute: true

  - name: outsiders and unrelated orgs get nothing from platform visibility
    check:
      - user: identity_account:mallory
        object: agent:sara
        assertions:
          can_view: false
          can_execute: false
          can_create_instance: false

  - name: platform org's own members keep access via the org floor tuple
    check:
      - user: identity_account:priya
        object: agent:sara
        assertions:
          can_view: true
          can_execute: true
          can_edit: false
      # stigmer#465: the viewer-shaped org floor reaches the platform org's own
      # read-only viewers too. (Managed-org audiences are deliberately
      # narrower: platform_user resolves member-from-managed_org.)
      - user: identity_account:veda
        object: agent:sara
        assertions:
          can_view: true
          can_edit: false

  - name: platform visibility does not leak the platform org's private agents
    check:
      - user: identity_account:alice
        object: agent:internal-bot
        assertions:
          can_view: false
          can_execute: false
      # Private is real: even the platform org's own members see nothing
      # without an explicit visibility tuple.
      - user: identity_account:priya
        object: agent:internal-bot
        assertions:
          can_view: false
          can_execute: false

  - name: platform-shared skill is usable by managed-org members
    check:
      - user: identity_account:alice
        object: skill:research
        assertions:
          can_view: true
          can_use: true
          can_edit: false

  - name: platform-shared workflow is viewable and executable by managed-org members
    check:
      - user: identity_account:alice
        object: workflow:onboarding
        assertions:
          can_view: true
          can_execute: true

  - name: platform-shared mcp_server is usable by managed-org members
    check:
      - user: identity_account:alice
        object: mcp_server:github
        assertions:
          can_view: true
          can_use: true
          can_connect: true

  - name: platform owner retains full control of shared blueprints
    check:
      - user: identity_account:swarup
        object: agent:sara
        assertions:
          can_view: true
          can_edit: true
          can_delete: true

  - name: list managed-org member's viewable agents includes only the shared one
    list_objects:
      - user: identity_account:alice
        type: agent
        assertions:
          can_view:
            - agent:sara
