# Store tests for parent and child organizations.
#
# Verifies the two halves of a child organization end-to-end against the
# authorization model:
#
#   - administration: the parent's admins hold parent_admin on a child
#     (admin from parent_org), which is part of the child's admin and of
#     its membership bound (affiliated), so they are the child's admins:
#     they read and change what it holds, and what they make there is
#     theirs; a person's sessions, My vault and memories stay private from
#     them, as from the child's own admins. Children stay walled off from
#     each other, and a child's admins reach neither its parent nor a
#     sibling;
#   - sharing: a blueprint at visibility_child_orgs names
#     organization:<parent>#child_org_viewer, which is everyone in every
#     child (viewer from child_org).
#
# Run with:
#   fga model test --tests child-organizations.fga.yaml
#
# Scenario: "planton" is a parent with two children (acme, beta).
# "rival" is another parent with its own child (rivalco). "outsider"
# is an unrelated organization.
name: child-organizations
model_file: ../../src/authorization/model/data/authorization-model.json

tuples:
  # --- The edges, both written once when each child is created ---
  - {user: organization:planton, relation: parent_org, object: organization:acme}
  - {user: organization:acme, relation: child_org, object: organization:planton}
  - {user: organization:planton, relation: parent_org, object: organization:beta}
  - {user: organization:beta, relation: child_org, object: organization:planton}
  - {user: organization:rival, relation: parent_org, object: organization:rivalco}
  - {user: organization:rivalco, relation: child_org, object: organization:rival}

  # --- Memberships ---
  # swarup owns planton; pat administers it; priya is a member; veda a viewer.
  - {user: identity_account:swarup, relation: owner, object: organization:planton}
  - {user: identity_account:swarup, relation: affiliated, object: organization:planton}
  - {user: identity_account:pat, relation: admin, object: organization:planton}
  - {user: identity_account:pat, relation: affiliated, object: organization:planton}
  - {user: identity_account:priya, relation: member, object: organization:planton}
  - {user: identity_account:priya, relation: affiliated, object: organization:planton}
  - {user: identity_account:veda, relation: viewer, object: organization:planton}
  - {user: identity_account:veda, relation: affiliated, object: organization:planton}
  # alice is a member of acme; vic a read-only viewer there; cara administers
  # acme; bob a member of beta.
  - {user: identity_account:alice, relation: member, object: organization:acme}
  - {user: identity_account:alice, relation: affiliated, object: organization:acme}
  - {user: identity_account:vic, relation: viewer, object: organization:acme}
  - {user: identity_account:vic, relation: affiliated, object: organization:acme}
  - {user: identity_account:cara, relation: admin, object: organization:acme}
  - {user: identity_account:cara, relation: affiliated, object: organization:acme}
  - {user: identity_account:bob, relation: member, object: organization:beta}
  - {user: identity_account:bob, relation: affiliated, object: organization:beta}
  # rhea administers rival; ross is a member of rival's child.
  - {user: identity_account:rhea, relation: admin, object: organization:rival}
  - {user: identity_account:rhea, relation: affiliated, object: organization:rival}
  - {user: identity_account:ross, relation: member, object: organization:rivalco}
  - {user: identity_account:ross, relation: affiliated, object: organization:rivalco}
  - {user: identity_account:mallory, relation: member, object: organization:outsider}
  - {user: identity_account:mallory, relation: affiliated, object: organization:outsider}

  # --- Shared with children (visibility_child_orgs) by planton ---
  # The level carries the org floor too, so planton's own people keep it.
  - {user: organization:planton, relation: organization, object: agent:sara}
  - {user: identity_account:swarup, relation: owner, object: agent:sara}
  - {user: organization:planton#child_org_viewer, relation: child_org_viewer, object: agent:sara}
  - {user: organization:planton#viewer, relation: viewer, object: agent:sara}
  - {user: organization:planton, relation: organization, object: skill:research}
  - {user: organization:planton#child_org_viewer, relation: child_org_viewer, object: skill:research}
  - {user: organization:planton, relation: organization, object: plugin:thermos}
  - {user: organization:planton#child_org_viewer, relation: child_org_viewer, object: plugin:thermos}

  # --- Private agent of planton's (no child_org_viewer tuple) ---
  - {user: organization:planton, relation: organization, object: agent:internal-bot}
  - {user: identity_account:swarup, relation: owner, object: agent:internal-bot}

  # --- Shared with children by rival ---
  - {user: organization:rival, relation: organization, object: agent:rival-bot}
  - {user: organization:rival#child_org_viewer, relation: child_org_viewer, object: agent:rival-bot}

  # --- What acme holds: an org-visible agent, a session, an org-visible
  #     shared vault and a memory, all alice's ---
  - {user: organization:acme, relation: organization, object: agent:acme-helper}
  - {user: identity_account:alice, relation: owner, object: agent:acme-helper}
  - {user: organization:acme#viewer, relation: viewer, object: agent:acme-helper}
  - {user: organization:acme, relation: organization, object: session:acme-chat}
  - {user: identity_account:alice, relation: owner, object: session:acme-chat}
  - {user: organization:acme, relation: organization, object: vault:acme-vault}
  - {user: organization:acme, relation: org_owned, object: vault:acme-vault}
  - {user: organization:acme#viewer, relation: viewer, object: vault:acme-vault}
  - {user: organization:acme, relation: organization, object: memory:acme-fact}
  - {user: identity_account:alice, relation: subject, object: memory:acme-fact}
  # alice's My vault in acme: a person link and no org_owned link.
  - {user: organization:acme, relation: organization, object: vault:alice-mine}
  - {user: identity_account:alice, relation: person, object: vault:alice-mine}
  # An eval run of acme's agent.
  - {user: organization:acme, relation: organization, object: eval_run:acme-eval}
  - {user: agent:acme-helper, relation: agent, object: eval_run:acme-eval}

  # --- acme's own administration: a federation issuer and a team ---
  - {user: organization:acme, relation: organization, object: federation_issuer:acme-sso}
  - {user: organization:acme, relation: organization, object: team:acme-eng}

  # --- What pat, a parent admin, made in acme: a session of their own ---
  - {user: organization:acme, relation: organization, object: session:pat-chat}
  - {user: identity_account:pat, relation: owner, object: session:pat-chat}

tests:
  - name: a parent admin is an admin in every child
    check:
      - user: identity_account:pat
        object: organization:acme
        assertions:
          parent_admin: true
          owner: false
          admin: true
          member: true
          viewer: true
          affiliated: true
          can_view: true
          can_view_settings: true
          can_edit: true
          can_delete: true
          can_grant_access: true
          can_view_access: true
          can_view_access_history: true
          can_assign_roles: true
          can_view_billing: true
          can_manage_billing: true
          can_mint_user_tokens: true
          can_create_agent: true
          can_create_session: true
          can_create_run_in: true
          can_create_shared_vault: true
      # The parent's owner is one of its admins.
      - user: identity_account:swarup
        object: organization:beta
        assertions:
          admin: true
          can_edit: true
          can_grant_access: true
          can_view_billing: true

  - name: a parent admin reads and changes what a child holds
    check:
      - user: identity_account:pat
        object: agent:acme-helper
        assertions:
          owner: true
          viewer: true
          can_view: true
          can_execute: true
          can_edit: true
          can_delete: true
      - user: identity_account:pat
        object: vault:acme-vault
        assertions:
          can_view: true
          can_use: true
          can_edit: true
      - user: identity_account:pat
        object: team:acme-eng
        assertions:
          can_view: true
          can_edit: true
          can_delete: true
          can_grant_access: true
      - user: identity_account:pat
        object: federation_issuer:acme-sso
        assertions:
          can_view: true
          can_edit: true
          can_delete: true
      - user: identity_account:pat
        object: eval_run:acme-eval
        assertions:
          can_view: true
          can_edit: true

  - name: a person's session, My vault and memories stay private from a parent admin
    check:
      - user: identity_account:pat
        object: session:acme-chat
        assertions:
          can_view: false
          can_edit: false
      - user: identity_account:pat
        object: vault:alice-mine
        assertions:
          owner: false
          can_view: false
          can_use: false
      - user: identity_account:pat
        object: memory:acme-fact
        assertions:
          can_view: false
      # The child's own admin reads none of them either.
      - user: identity_account:cara
        object: session:acme-chat
        assertions:
          can_view: false
      - user: identity_account:cara
        object: vault:alice-mine
        assertions:
          can_view: false

  - name: a parent admin's own session in a child is theirs
    check:
      - user: identity_account:pat
        object: session:pat-chat
        assertions:
          owner: true
          can_view: true
          can_edit: true
      - user: identity_account:alice
        object: session:pat-chat
        assertions:
          can_view: false

  - name: the parent's members and viewers are not admins in a child
    check:
      - user: identity_account:priya
        object: organization:acme
        assertions:
          parent_admin: false
          admin: false
          viewer: false
          affiliated: false
          can_view: false
          can_view_settings: false
          can_edit: false
          can_grant_access: false
          can_view_billing: false
      - user: identity_account:priya
        object: agent:acme-helper
        assertions:
          can_view: false
      - user: identity_account:veda
        object: organization:acme
        assertions:
          can_view_settings: false
          can_view_billing: false

  - name: a parent's admin reaches neither another parent's child nor a sibling's people through the parent
    check:
      - user: identity_account:rhea
        object: organization:acme
        assertions:
          parent_admin: false
          admin: false
          affiliated: false
          can_view: false
          can_view_settings: false
          can_edit: false
      - user: identity_account:rhea
        object: agent:acme-helper
        assertions:
          can_view: false
      - user: identity_account:pat
        object: organization:rivalco
        assertions:
          admin: false
          affiliated: false
          can_view: false

  - name: a child's admin reaches neither its parent nor a sibling
    check:
      - user: identity_account:cara
        object: organization:planton
        assertions:
          admin: false
          viewer: false
          can_view: false
          can_edit: false
      - user: identity_account:cara
        object: organization:beta
        assertions:
          admin: false
          can_view: false
      - user: identity_account:cara
        object: agent:internal-bot
        assertions:
          can_view: false
      # A child's admins hold the children permission and cannot use it: a
      # child has no children.
      - user: identity_account:cara
        object: organization:acme
        assertions:
          can_manage_child_orgs: true

  - name: a child's own people keep their roles and settings
    check:
      - user: identity_account:alice
        object: organization:acme
        assertions:
          can_view: true
          can_view_settings: true
          can_edit: false
      - user: identity_account:alice
        object: organization:planton
        assertions:
          can_view: false
          can_view_settings: false
          child_org_viewer: true

  - name: only a parent's admins manage its children
    check:
      - user: identity_account:pat
        object: organization:planton
        assertions:
          can_manage_child_orgs: true
      - user: identity_account:priya
        object: organization:planton
        assertions:
          can_manage_child_orgs: false
      - user: identity_account:alice
        object: organization:planton
        assertions:
          can_manage_child_orgs: false

  - name: everyone in a child reads and runs what the parent shares with children
    check:
      - user: identity_account:alice
        object: agent:sara
        assertions:
          can_view: true
          can_execute: true
          can_edit: false
          can_delete: false
      # A read-only viewer of the child too: the audience is every role.
      - user: identity_account:vic
        object: agent:sara
        assertions:
          can_view: true
          can_execute: true
      - user: identity_account:bob
        object: agent:sara
        assertions:
          can_view: true
          can_execute: true
      - user: identity_account:alice
        object: skill:research
        assertions:
          can_view: true
          can_edit: false
      - user: identity_account:alice
        object: plugin:thermos
        assertions:
          can_view: true

  - name: nobody outside planton's children reads what it shares with them
    check:
      # Another parent's child.
      - user: identity_account:ross
        object: agent:sara
        assertions:
          can_view: false
          can_execute: false
      # An unrelated organization's member.
      - user: identity_account:mallory
        object: agent:sara
        assertions:
          can_view: false
          can_execute: false
      # A child's member reads nothing another parent shares with its children.
      - user: identity_account:alice
        object: agent:rival-bot
        assertions:
          can_view: false

  - name: the parent's own people keep the shared agent through the org floor
    check:
      - user: identity_account:priya
        object: agent:sara
        assertions:
          can_view: true
          can_execute: true
          can_edit: false
      - user: identity_account:veda
        object: agent:sara
        assertions:
          can_view: true
          can_edit: false
      - user: identity_account:swarup
        object: agent:sara
        assertions:
          can_view: true
          can_edit: true
          can_delete: true

  - name: sharing with children does not leak the parent's private agents
    check:
      - user: identity_account:alice
        object: agent:internal-bot
        assertions:
          can_view: false
          can_execute: false
      - user: identity_account:priya
        object: agent:internal-bot
        assertions:
          can_view: false

  - name: what a child member and a parent admin list
    list_objects:
      - user: identity_account:alice
        type: agent
        assertions:
          can_view:
            - agent:sara
            - agent:acme-helper
      # The parent's admin: the parent's agents and each child's, never another
      # parent's, through the one recursion admin -> parent_admin -> admin.
      - user: identity_account:pat
        type: agent
        assertions:
          can_view:
            - agent:sara
            - agent:internal-bot
            - agent:acme-helper
      # Their own session in the child, and no one else's.
      - user: identity_account:pat
        type: session
        assertions:
          can_view:
            - session:pat-chat
