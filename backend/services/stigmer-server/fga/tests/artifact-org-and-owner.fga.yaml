# Artifacts are org-scoped execution outputs with creator ownership on
# top (since 2026-08-11, when every artifact read gained an authorization
# check). The two access arms these tests pin:
#
# 1. Org inheritance — anyone who is at least a viewer of the owning org
#    can view its artifacts ("if you can view resources in the org, you
#    can view its artifacts"). Editing stays org-admin-only.
# 2. Creator ownership — the identity whose execution produced the
#    artifact can view it WITHOUT any org role. This is the guest-share /
#    embedded-user case: org guests are not org viewers, but their
#    sessions render artifact-backed review payloads and artifact tabs.
#
# The narrowness pinned: creator-owners read but never edit (all guests
# of an org share one guest identity account — owner-edit would let one
# guest soft-delete another's artifacts), and no arm crosses org
# boundaries.
#
# Run: fga model test --tests artifact-org-and-owner.fga.yaml

name: artifact-org-and-owner
model_file: ../../src/authorization/model/data/authorization-model.json

tuples:
  # Org roles: victor views, ana administers acme. Rival org for the
  # cross-org boundary.
  - user: identity_account:victor
    relation: viewer
    object: organization:acme
  - user: identity_account:ana
    relation: admin
    object: organization:acme
  - user: identity_account:eve
    relation: member
    object: organization:rival

  # Guest identity: an org GUEST, deliberately not an org viewer.
  - user: identity_account:acme-guest
    relation: guest
    object: organization:acme

  # Artifact produced by a signed-in member's execution.
  - user: organization:acme
    relation: organization
    object: artifact:art_report
  - user: identity_account:victor
    relation: owner
    object: artifact:art_report

  # Artifact produced by a guest-share execution: creator is the guest
  # identity account (runner tokens carry the acting identity as sub).
  - user: organization:acme
    relation: organization
    object: artifact:art_guest_plan
  - user: identity_account:acme-guest
    relation: owner
    object: artifact:art_guest_plan

tests:
  - name: org viewer reads any org artifact but cannot edit
    check:
      - user: identity_account:victor
        object: artifact:art_report
        assertions:
          can_view: true
          can_edit: false
      - user: identity_account:victor
        object: artifact:art_guest_plan
        assertions:
          can_view: true
          can_edit: false

  - name: org admin views and edits org artifacts
    check:
      - user: identity_account:ana
        object: artifact:art_report
        assertions:
          can_view: true
          can_edit: true

  - name: guest creator reads own execution's artifact via ownership, never edits
    check:
      - user: identity_account:acme-guest
        object: artifact:art_guest_plan
        assertions:
          can_view: true
          can_edit: false

  - name: guest role alone grants nothing on other artifacts in the org
    check:
      - user: identity_account:acme-guest
        object: artifact:art_report
        assertions:
          can_view: false
          can_edit: false

  - name: cross-org caller is denied everything
    check:
      - user: identity_account:eve
        object: artifact:art_report
        assertions:
          can_view: false
          can_edit: false
      - user: identity_account:eve
        object: artifact:art_guest_plan
        assertions:
          can_view: false
          can_edit: false

  - name: listing reflects org inheritance plus creator ownership
    list_objects:
      - user: identity_account:victor
        type: artifact
        assertions:
          can_view:
            - artifact:art_report
            - artifact:art_guest_plan
      - user: identity_account:acme-guest
        type: artifact
        assertions:
          can_view:
            - artifact:art_guest_plan
      - user: identity_account:eve
        type: artifact
        assertions:
          can_view: []
