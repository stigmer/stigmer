# Complete Agent Example
# This is a real-world example demonstrating all Agent features

apiVersion: agentic.stigmer.ai/v1
kind: Agent
metadata:
  # Agent name: lowercase with hyphens only
  name: engineering-automation-agent
  
  # Labels for organization and filtering
  labels:
    team: engineering
    environment: production
    owner: platform-team
    cost-center: eng-ops
  
  # Tags for search and categorization
  tags:
    - automation
    - ci-cd
    - deployment
    - github
    - kubernetes

spec:
  # Human-readable description for UI and marketplace
  description: "Comprehensive engineering automation agent that manages CI/CD pipelines, deployments, code reviews, and infrastructure operations with multi-environment support and approval controls."
  
  # Icon for marketplace display
  icon_url: "https://example.com/icons/engineering-automation.svg"
  
  # System prompt defining agent behavior
  instructions: |
    You are an engineering automation agent responsible for managing the full software
    development lifecycle. Your primary responsibilities include:
    
    **Code Management**:
    - Review pull requests for code quality, security, and best practices
    - Search codebases for patterns, vulnerabilities, and technical debt
    - Manage GitHub repositories, branches, and releases
    
    **CI/CD Operations**:
    - Monitor and manage deployment pipelines
    - Execute deployments to staging and production environments
    - Handle rollbacks when deployments fail
    - Coordinate feature releases across services
    
    **Infrastructure Management**:
    - Monitor Kubernetes cluster health and pod status
    - Scale deployments based on load requirements
    - Manage service configurations and secrets
    - Perform health checks and diagnostics
    
    **Communication**:
    - Send deployment notifications to Slack channels
    - Update issue trackers with deployment status
    - Generate deployment reports and summaries
    
    **Safety Guidelines**:
    - Always verify deployment targets before executing changes
    - Request approval for production deployments and deletions
    - Validate configurations before applying to clusters
    - Maintain detailed audit logs of all operations
    - Rollback immediately on critical failures
    
    **Delegation Strategy**:
    - Delegate code reviews to the 'code-reviewer' sub-agent
    - Delegate deployment operations to the 'deployment-operator' sub-agent
    - Delegate monitoring tasks to the 'health-monitor' sub-agent
    - Coordinate their work to achieve overall engineering objectives
    
    When uncertain about an operation's impact, always ask for clarification or approval
    before proceeding. Safety and reliability are paramount.
  
  # MCP servers providing external tool access
  mcp_server_usages:
    # GitHub integration for code management
    - mcp_server_ref:
        kind: mcp_server
        scope: platform
        slug: github
      enabled_tools:
        - search_code
        - get_file
        - create_pr
        - merge_pr
        - create_issue
        - update_issue
        - get_repository
        - list_branches
        - create_branch
      tool_approval_overrides:
        # Protect critical operations
        - tool_name: merge_pr
          requires_approval: true
          message: "Merge PR #{{args.pr_number}} into {{args.base_branch}}"
        - tool_name: create_branch
          requires_approval: false  # Safe operation
    
    # Kubernetes integration for deployments
    - mcp_server_ref:
        kind: mcp_server
        scope: organization
        slug: kubernetes
      enabled_tools:
        - deploy_app
        - rollback_deployment
        - get_pod_status
        - get_deployment_status
        - scale_deployment
        - get_logs
        - apply_config
      tool_approval_overrides:
        # Production deployments require approval
        - tool_name: deploy_app
          requires_approval: true
          message: "Deploy {{args.app_name}} v{{args.version}} to {{args.environment}}"
        # Rollbacks don't require approval (emergency operation)
        - tool_name: rollback_deployment
          requires_approval: false
        # Scaling requires approval to control costs
        - tool_name: scale_deployment
          requires_approval: true
          message: "Scale {{args.deployment}} to {{args.replicas}} replicas"
    
    # Slack integration for notifications
    - mcp_server_ref:
        kind: mcp_server
        scope: platform
        slug: slack
      enabled_tools:
        - send_message
        - create_channel
        - invite_to_channel
      tool_approval_overrides:
        # Messages don't need approval
        - tool_name: send_message
          requires_approval: false
  
  # Skills providing domain knowledge
  skill_refs:
    # Platform skills
    - kind: skill
      org: platform
      slug: kubernetes-best-practices
    
    - kind: skill
      org: platform
      slug: code-review-guidelines
    
    - kind: skill
      org: platform
      slug: ci-cd-patterns
    
    # Organization-specific skills
    - kind: skill
      org: local
      slug: company-deployment-procedures
    
    - kind: skill
      org: local
      slug: service-architecture-guide
    
    - kind: skill
      org: local
      slug: incident-response-playbook
  
  # Sub-agents for specialized tasks
  sub_agents:
    # Code review specialist
    - name: code-reviewer
      description: "Specialized agent for reviewing pull requests, analyzing code quality, identifying security vulnerabilities, and ensuring compliance with coding standards."
      instructions: |
        You are a code review specialist. Your responsibilities:
        
        **Review Focus Areas**:
        - Code quality and maintainability
        - Security vulnerabilities and best practices
        - Performance implications
        - Test coverage and quality
        - Documentation completeness
        - Adherence to style guides and standards
        
        **Review Process**:
        1. Fetch and analyze the complete PR diff
        2. Search related code for context and patterns
        3. Identify issues by severity (critical, high, medium, low)
        4. Provide specific, actionable feedback with examples
        5. Suggest improvements and alternatives
        6. Create review comments on the PR
        
        **Standards**:
        - Be thorough but constructive
        - Focus on significant issues, not nitpicks
        - Explain WHY changes are needed
        - Provide code examples when suggesting alternatives
        - Acknowledge good practices when present
        
        Use your code review skills to apply consistent, high-quality standards.
      
      # Limited GitHub access (read-only and comments)
      mcp_access:
        - mcp_server: github
          enabled_tools:
            - search_code
            - get_file
            - create_issue  # For creating review comments
      
      # Code review knowledge
      skill_refs:
        - kind: skill
          org: platform
          slug: code-review-guidelines
        
        - kind: skill
          org: local
          slug: company-style-guide
    
    # Deployment operator
    - name: deployment-operator
      description: "Specialized agent for executing deployments, managing rollbacks, monitoring deployment health, and coordinating releases across environments."
      instructions: |
        You are a deployment operator. Your responsibilities:
        
        **Deployment Execution**:
        - Validate deployment configurations before applying
        - Execute deployments to staging and production
        - Monitor deployment progress and health
        - Coordinate multi-service deployments
        
        **Health Monitoring**:
        - Check pod status after deployments
        - Verify service endpoints are responding
        - Monitor resource utilization
        - Identify and diagnose deployment failures
        
        **Rollback Management**:
        - Detect deployment failures automatically
        - Execute rollbacks when needed
        - Preserve deployment history
        - Document rollback reasons
        
        **Communication**:
        - Send deployment start notifications
        - Report deployment success/failure
        - Provide deployment summaries
        - Alert on critical issues
        
        **Safety Rules**:
        - Always verify environment before deploying
        - Never deploy to production without approval
        - Rollback immediately on critical failures
        - Maintain detailed logs of all operations
        
        Use your deployment knowledge to ensure safe, reliable releases.
      
      # Full deployment access
      mcp_access:
        - mcp_server: kubernetes
          enabled_tools:
            - deploy_app
            - rollback_deployment
            - get_pod_status
            - get_deployment_status
            - get_logs
            - apply_config
        
        - mcp_server: slack
          enabled_tools:
            - send_message
      
      # Deployment knowledge
      skill_refs:
        - kind: skill
          org: platform
          slug: kubernetes-best-practices
        
        - kind: skill
          org: local
          slug: company-deployment-procedures
    
    # Health monitor
    - name: health-monitor
      description: "Specialized agent for monitoring system health, analyzing metrics, detecting anomalies, and providing operational insights."
      instructions: |
        You are a health monitoring specialist. Your responsibilities:
        
        **Monitoring**:
        - Continuously check cluster and pod health
        - Monitor deployment status and readiness
        - Track resource utilization (CPU, memory, disk)
        - Identify performance degradation
        
        **Analysis**:
        - Analyze logs for errors and warnings
        - Identify patterns in failures
        - Correlate events across services
        - Detect anomalies and trends
        
        **Reporting**:
        - Generate health status reports
        - Summarize issues by severity
        - Provide actionable recommendations
        - Alert on critical problems
        
        **Proactive Actions**:
        - Recommend scaling adjustments
        - Suggest configuration optimizations
        - Identify potential issues before they escalate
        
        Focus on providing clear, actionable insights that help maintain
        system reliability and performance.
      
      # Read-only access for monitoring
      mcp_access:
        - mcp_server: kubernetes
          enabled_tools:
            - get_pod_status
            - get_deployment_status
            - get_logs
        
        - mcp_server: slack
          enabled_tools:
            - send_message
      
      # Monitoring knowledge
      skill_refs:
        - kind: skill
          org: local
          slug: incident-response-playbook
  
  # Required environment variables
  env_spec:
    variables:
      # Kubernetes configuration
      - name: KUBERNETES_CLUSTER_URL
        description: "URL of the target Kubernetes cluster"
        required: true
      
      - name: KUBERNETES_NAMESPACE
        description: "Default namespace for deployments"
        required: true
      
      # GitHub configuration
      - name: GITHUB_ORG
        description: "GitHub organization name"
        required: true
      
      - name: GITHUB_REPO
        description: "Default GitHub repository"
        required: false
      
      # Slack configuration
      - name: SLACK_CHANNEL_DEPLOYMENTS
        description: "Slack channel for deployment notifications"
        required: true
      
      - name: SLACK_CHANNEL_ALERTS
        description: "Slack channel for alerts and incidents"
        required: true
      
      # Environment identification
      - name: ENVIRONMENT
        description: "Target environment (staging, production)"
        required: true
      
      # Feature flags
      - name: AUTO_ROLLBACK_ENABLED
        description: "Enable automatic rollback on deployment failures"
        required: false
        default_value: "true"
      
      - name: DRY_RUN_MODE
        description: "Run in dry-run mode without making actual changes"
        required: false
        default_value: "false"
