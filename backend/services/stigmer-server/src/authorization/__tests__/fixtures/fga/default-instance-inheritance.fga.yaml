# Pinned copy of stigmer-cloud backend/services/stigmer-server/fga/tests/default-instance-inheritance.fga.yaml
# as changed by stigmer-cloud#765 (the OpenFGA store test the cloud runs against its live model).
# The body below is byte-identical to the source; the cloud re-runs the LIVE
# file against this evaluator at the re-pin, so a stale copy is caught there.
# Store tests for default-instance structural inheritance (default_of).
#
# A blueprint's system-managed default instance carries a single
#   instance#default_of@<blueprint>:<id>
# tuple and inherits the blueprint's ENTIRE viewer set through
# `viewer from default_of` — org members and platform users
# (identity_provider#platform_user). No enum-derived
# visibility tuples are ever written on default instances, so their access
# can never drift from the template's.
#
# Run with:
#   fga model test --tests default-instance-inheritance.fga.yaml
#
# Scenario: "planton" is a platform org owning identity_provider:idp1 which
# manages customer org "acme". Planton authors agents/workflows at every
# visibility level; each has a default instance linked via default_of.
# Alice (acme member) reaches default instances of platform-shared
# blueprints; planton members reach default instances of org-visible ones;
# personal instances never leak.
name: default-instance-inheritance
model_file: ../model/fga.mod

tuples:
  # --- Platform tenancy: idp1 is owned by planton and manages acme ---
  - user: organization:planton
    relation: organization
    object: identity_provider:idp1
  - user: organization:acme
    relation: managed_org
    object: identity_provider:idp1

  # --- Org memberships ---
  - user: identity_account:swarup
    relation: owner
    object: organization:planton
  - user: identity_account:priya
    relation: member
    object: organization:planton
  - user: identity_account:veda
    relation: viewer
    object: organization:planton
  - user: identity_account:alice
    relation: member
    object: organization:acme
  - user: identity_account:mallory
    relation: member
    object: organization:outsider

  # --- Platform-shared agent + its default instance ---
  # PLATFORM carries the org floor tuple too (viewer@org#viewer — the org's
  # full read audience), exactly as VisibilityTupleReconciler writes it.
  - user: organization:planton
    relation: organization
    object: agent:sara
  - user: identity_account:swarup
    relation: owner
    object: agent:sara
  - user: identity_provider:idp1#platform_user
    relation: platform_viewer
    object: agent:sara
  - user: organization:planton#viewer
    relation: viewer
    object: agent:sara
  - user: organization:planton
    relation: organization
    object: agent_instance:sara-default
  - user: agent:sara
    relation: agent
    object: agent_instance:sara-default
  - user: identity_account:swarup
    relation: owner
    object: agent_instance:sara-default
  - user: agent:sara
    relation: default_of
    object: agent_instance:sara-default

  # --- Alice's personal instance of the shared agent (NO default_of) ---
  - user: organization:acme
    relation: organization
    object: agent_instance:alice-personal
  - user: agent:sara
    relation: agent
    object: agent_instance:alice-personal
  - user: identity_account:alice
    relation: owner
    object: agent_instance:alice-personal

  # --- Org-visible agent + its default instance ---
  # ORG visibility is an explicit viewer tuple (viewer@org#viewer) — the
  # unconditional `viewer from organization` grant is gone (private is real).
  - user: organization:planton
    relation: organization
    object: agent:internal-bot
  - user: identity_account:swarup
    relation: owner
    object: agent:internal-bot
  - user: organization:planton#viewer
    relation: viewer
    object: agent:internal-bot
  - user: organization:planton
    relation: organization
    object: agent_instance:internal-default
  - user: agent:internal-bot
    relation: agent
    object: agent_instance:internal-default
  - user: identity_account:swarup
    relation: owner
    object: agent_instance:internal-default
  - user: agent:internal-bot
    relation: default_of
    object: agent_instance:internal-default

  # --- Platform-shared workflow + its default instance ---
  - user: organization:planton
    relation: organization
    object: workflow:onboarding
  - user: identity_account:swarup
    relation: owner
    object: workflow:onboarding
  - user: identity_provider:idp1#platform_user
    relation: platform_viewer
    object: workflow:onboarding
  - user: organization:planton#viewer
    relation: viewer
    object: workflow:onboarding
  - user: organization:planton
    relation: organization
    object: workflow_instance:onboarding-default
  - user: workflow:onboarding
    relation: workflow
    object: workflow_instance:onboarding-default
  - user: identity_account:swarup
    relation: owner
    object: workflow_instance:onboarding-default
  - user: workflow:onboarding
    relation: default_of
    object: workflow_instance:onboarding-default

tests:
  - name: managed-org member reaches the default instance of a platform-shared agent
    check:
      - user: identity_account:alice
        object: agent_instance:sara-default
        assertions:
          can_view: true
          can_execute: true
          can_edit: false
          can_delete: false

  - name: outsiders get nothing from the default_of link
    check:
      - user: identity_account:mallory
        object: agent_instance:sara-default
        assertions:
          can_view: false
          can_execute: false

  - name: personal instances never leak through the parent agent
    check:
      # Swarup owns the agent itself, but alice's personal instance has no
      # default_of tuple — only she (its owner) can reach it.
      - user: identity_account:swarup
        object: agent_instance:alice-personal
        assertions:
          can_view: false
      - user: identity_account:alice
        object: agent_instance:alice-personal
        assertions:
          can_view: true
          can_edit: true

  - name: org members reach the default instance of an org-visible agent
    check:
      - user: identity_account:priya
        object: agent_instance:internal-default
        assertions:
          can_view: true
          can_execute: true
          can_edit: false
      # cloud#257: the default_of chain reaches org viewer-role users too —
      # the viewer-shaped org tuple on the parent agent is the org's full
      # read audience, and the default instance inherits it structurally.
      - user: identity_account:veda
        object: agent_instance:internal-default
        assertions:
          can_view: true
          can_edit: false
      # Managed-org membership grants nothing on non-platform-shared agents.
      - user: identity_account:alice
        object: agent_instance:internal-default
        assertions:
          can_view: false

  - name: managed-org member reaches the default instance of a platform-shared workflow
    check:
      - user: identity_account:alice
        object: workflow_instance:onboarding-default
        assertions:
          can_view: true
          can_execute: true
          can_edit: false

  - name: list managed-org member's viewable agent instances resolves the default_of chain
    list_objects:
      - user: identity_account:alice
        type: agent_instance
        assertions:
          can_view:
            - agent_instance:sara-default
            - agent_instance:alice-personal
