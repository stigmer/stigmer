# Pinned copy of stigmer-cloud backend/services/stigmer-server/fga/tests/public-visibility-setter.fga.yaml
# at commit b87dd1170 (the OpenFGA store test the cloud runs against its live model).
# The body below is byte-identical to the source; the cloud re-runs the LIVE
# file against this evaluator at the re-pin, so a stale copy is caught there.
# Store tests for the public-visibility permission (marketplace curation).
#
# can_set_public_visibility gates who may set a resource's visibility to
# PUBLIC — the only level that crosses every org boundary. It derives
# from the platform operator role: operators (human curators and the
# seeding machine account) hold it; ordinary tenants — even org owners,
# who can otherwise fully manage their resources — never do. Enforced by
# PublicVisibilityEscalationPolicy at both write doors (updateVisibility
# escalation and create-with-public).
#
# Run with:
#   fga model test --tests public-visibility-setter.fga.yaml
name: public-visibility-setter
model_file: ../model/fga.mod

tuples:
  # The bootstrap machine account is the platform operator
  # (BootstrapIdentitySeeder re-asserts this tuple on every boot).
  - user: identity_account:machine
    relation: operator
    object: platform:stigmer

  # A human operator granted the same platform role.
  - user: identity_account:opal
    relation: operator
    object: platform:stigmer

  # A tenant org owner — owns everything in their org, nothing on the
  # platform.
  - user: identity_account:mallory
    relation: owner
    object: organization:acme

tests:
  - name: operators may set public visibility, tenants may not
    check:
      - user: identity_account:machine
        object: platform:stigmer
        assertions:
          can_set_public_visibility: true
      - user: identity_account:opal
        object: platform:stigmer
        assertions:
          can_set_public_visibility: true
      - user: identity_account:mallory
        object: platform:stigmer
        assertions:
          can_set_public_visibility: false
