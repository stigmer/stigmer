# Pinned copy of stigmer-cloud backend/services/stigmer-server/fga/tests/workflow-execution-sharing.fga.yaml
# as changed by stigmer-cloud#765 (the OpenFGA store test the cloud runs against its live model).
# The body below is byte-identical to the source; the cloud re-runs the LIVE
# file against this evaluator at the re-pin, so a stale copy is caught there.
# Store tests for workflow_execution sharing and run observability.
#
# Two independent axes govern who can read a run's inputs/outputs:
#
#   1. Per-execution sharing — the triggerer (owner) grants viewer on a single
#      workflow_execution. Enabled by the new can_grant_access / can_view_access
#      relations (mirrors session.fga).
#   2. Instance-level run observability — opt-in via the workflow_instance's
#      `execution_viewer` relation, inherited by every execution through
#      `viewer = ... or execution_viewer from workflow_instance`.
#
# The critical invariant: making an instance org-RUNNABLE (instance#viewer for
# org members) must NOT leak run history. Only execution_viewer does that.
#
# Run with:
#   fga model test --tests workflow-execution-sharing.fga.yaml
#
# Scenario: org "acme" with members alice (triggerer), bob, carol; outsider
# org with member mallory. inst1 is org-runnable but keeps runs private; inst2
# opts into org-wide run observability.
name: workflow-execution-sharing
model_file: ../model/fga.mod

tuples:
  # --- Org memberships ---
  - user: identity_account:alice
    relation: member
    object: organization:acme
  - user: identity_account:bob
    relation: member
    object: organization:acme
  - user: identity_account:carol
    relation: member
    object: organization:acme
  - user: identity_account:vera
    relation: viewer
    object: organization:acme
  - user: identity_account:mallory
    relation: member
    object: organization:outsider

  # --- inst1: ORG-RUNNABLE instance, runs stay PRIVATE (no execution_viewer) ---
  - user: organization:acme
    relation: organization
    object: workflow_instance:inst1
  - user: identity_account:alice
    relation: owner
    object: workflow_instance:inst1
  # Everyone in the org can SEE the instance (cloud#257 viewer shape;
  # RUNNING it is additionally gated in Java on can_create_execution_in)...
  - user: organization:acme#viewer
    relation: viewer
    object: workflow_instance:inst1
  # ...but NO execution_viewer tuple, so run history is not shared.

  # run1: alice's run on inst1, no explicit grants.
  - user: organization:acme
    relation: organization
    object: workflow_execution:run1
  - user: workflow_instance:inst1
    relation: workflow_instance
    object: workflow_execution:run1
  - user: identity_account:alice
    relation: owner
    object: workflow_execution:run1

  # run1b: alice's run on inst1, explicitly shared with bob (per-execution).
  - user: organization:acme
    relation: organization
    object: workflow_execution:run1b
  - user: workflow_instance:inst1
    relation: workflow_instance
    object: workflow_execution:run1b
  - user: identity_account:alice
    relation: owner
    object: workflow_execution:run1b
  - user: identity_account:bob
    relation: viewer
    object: workflow_execution:run1b

  # --- inst2: opts into ORG-WIDE run observability (execution_viewer) ---
  - user: organization:acme
    relation: organization
    object: workflow_instance:inst2
  - user: identity_account:alice
    relation: owner
    object: workflow_instance:inst2
  - user: organization:acme#viewer
    relation: execution_viewer
    object: workflow_instance:inst2

  # run2: alice's run on inst2.
  - user: organization:acme
    relation: organization
    object: workflow_execution:run2
  - user: workflow_instance:inst2
    relation: workflow_instance
    object: workflow_execution:run2
  - user: identity_account:alice
    relation: owner
    object: workflow_execution:run2

tests:
  - name: triggerer always sees and can manage sharing of their own run
    check:
      - user: identity_account:alice
        object: workflow_execution:run1
        assertions:
          can_view: true
          can_grant_access: true
          can_view_access: true

  - name: org-runnable instance does NOT leak run history to teammates
    check:
      # bob and carol can see/run inst1, but cannot read alice's run1.
      - user: identity_account:bob
        object: workflow_execution:run1
        assertions:
          can_view: false
          can_view_access: false
      - user: identity_account:carol
        object: workflow_execution:run1
        assertions:
          can_view: false

  - name: per-execution share grants exactly the named teammate
    check:
      - user: identity_account:bob
        object: workflow_execution:run1b
        assertions:
          can_view: true
          can_view_access: true
      # A viewer cannot re-share (only the owner can grant).
      - user: identity_account:bob
        object: workflow_execution:run1b
        assertions:
          can_grant_access: false
      # Another org member not on the grant sees nothing.
      - user: identity_account:carol
        object: workflow_execution:run1b
        assertions:
          can_view: false

  - name: instance execution_viewer opt-in shares all runs org-wide
    check:
      - user: identity_account:bob
        object: workflow_execution:run2
        assertions:
          can_view: true
      - user: identity_account:carol
        object: workflow_execution:run2
        assertions:
          can_view: true
      # cloud#257: run observability is a pure read grant, so the org's
      # read-only viewers are exactly its audience.
      - user: identity_account:vera
        object: workflow_execution:run2
        assertions:
          can_view: true
      # Outsiders never gain access through org-scoped observability.
      - user: identity_account:mallory
        object: workflow_execution:run2
        assertions:
          can_view: false

  - name: run privacy holds against org viewers exactly as against members
    check:
      # No execution_viewer opt-in on inst1 → vera reads the instance but
      # never alice's run history.
      - user: identity_account:vera
        object: workflow_instance:inst1
        assertions:
          can_view: true
      - user: identity_account:vera
        object: workflow_execution:run1
        assertions:
          can_view: false

  - name: list a teammate's viewable runs reflects both sharing axes
    list_objects:
      - user: identity_account:bob
        type: workflow_execution
        assertions:
          can_view:
            - workflow_execution:run1b
            - workflow_execution:run2
