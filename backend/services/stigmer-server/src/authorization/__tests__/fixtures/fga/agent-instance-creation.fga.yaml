# Pinned copy of stigmer-cloud backend/services/stigmer-server/fga/tests/agent-instance-creation.fga.yaml
# at commit 4c03c38d2 (the OpenFGA store test the cloud runs against its live model).
# The body below is byte-identical to the source; the cloud re-runs the LIVE
# file against this evaluator at the re-pin, so a stale copy is caught there.
# Store tests for agent-instance creation: two halves, asked together by
# the create since stigmer#1209 (v3.22.0). The agent half is the agent's
# can_create_instance (can_execute, so the viewer set: whoever may run the
# agent may instantiate it). The organization half is
# can_create_agent_instance: member on the organization the instance is
# created IN, which is the caller's own, not the agent's: a personal
# instance of another organization's public agent lives in the caller's
# organization (the marketplace case), so the agent's permission alone
# would let a row be planted in any organization named on the request.
#
# What these pin: owners, admins and members hold the organization half;
# a viewer-role account may run an org-visible agent (the agent half) and
# still lacks the organization half; a guest holds neither; an outsider
# holds neither; and the marketplace case passes on the caller's own
# organization while the agent half comes from the public wildcard.
#
# Run: fga model test --tests agent-instance-creation.fga.yaml

name: agent-instance-creation
model_file: ../model/fga.mod

tuples:
  # Org acme: olivia owns it, oscar administers, dave is a plain member,
  # vera a read-only viewer, greta the share-link guest account.
  - user: identity_account:olivia
    relation: owner
    object: organization:acme
  - user: identity_account:oscar
    relation: admin
    object: organization:acme
  - user: identity_account:dave
    relation: member
    object: organization:acme
  - user: identity_account:vera
    relation: viewer
    object: organization:acme
  - user: identity_account:greta
    relation: guest
    object: organization:acme

  # Org consumer: mia is a plain member there and holds no role in acme.
  - user: identity_account:mia
    relation: member
    object: organization:consumer

  # An ORG-visible agent in acme, authored by oscar.
  - user: organization:acme
    relation: organization
    object: agent:team-bot
  - user: identity_account:oscar
    relation: owner
    object: agent:team-bot
  - user: organization:acme#viewer
    relation: viewer
    object: agent:team-bot

  # A PRIVATE agent in acme, authored by oscar (no visibility tuple).
  - user: organization:acme
    relation: organization
    object: agent:secret-bot
  - user: identity_account:oscar
    relation: owner
    object: agent:secret-bot

  # A PUBLIC marketplace agent in acme (the conditional wildcard plus the
  # org floor tuple the visibility writer emits).
  - user: organization:acme
    relation: organization
    object: agent:open-bot
  - user: identity_account:oscar
    relation: owner
    object: agent:open-bot
  - user: identity_account:*
    relation: viewer
    object: agent:open-bot
    condition:
      name: allow_public
      context: {}
  - user: organization:acme#viewer
    relation: viewer
    object: agent:open-bot

tests:
  - name: owners, admins and members hold the organization half
    check:
      - user: identity_account:olivia
        object: organization:acme
        assertions:
          can_create_agent_instance: true
      - user: identity_account:oscar
        object: organization:acme
        assertions:
          can_create_agent_instance: true
      - user: identity_account:dave
        object: organization:acme
        assertions:
          can_create_agent_instance: true

  - name: a viewer, a guest and an outsider do not
    check:
      - user: identity_account:vera
        object: organization:acme
        assertions:
          can_create_agent_instance: false
          can_create_session: false
      - user: identity_account:greta
        object: organization:acme
        assertions:
          can_create_agent_instance: false
          can_create_session: true
      - user: identity_account:mia
        object: organization:acme
        assertions:
          can_create_agent_instance: false

  - name: a member instantiates an org-visible agent, both halves held
    check:
      - user: identity_account:dave
        object: agent:team-bot
        context:
          allow: false
        assertions:
          can_create_instance: true
          can_execute: true

  - name: a viewer may run the org-visible agent and still cannot instantiate it here
    check:
      - user: identity_account:vera
        object: agent:team-bot
        context:
          allow: false
        assertions:
          can_create_instance: true
      - user: identity_account:vera
        object: organization:acme
        assertions:
          can_create_agent_instance: false

  - name: a private agent gives the agent half to its author and the admins only
    check:
      - user: identity_account:oscar
        object: agent:secret-bot
        context:
          allow: false
        assertions:
          can_create_instance: true
      - user: identity_account:olivia
        object: agent:secret-bot
        context:
          allow: false
        assertions:
          can_create_instance: true
      - user: identity_account:dave
        object: agent:secret-bot
        context:
          allow: false
        assertions:
          can_create_instance: false
      - user: identity_account:mia
        object: agent:secret-bot
        context:
          allow: false
        assertions:
          can_create_instance: false

  - name: the marketplace case, the agent half from the wildcard and the organization half at home
    check:
      - user: identity_account:mia
        object: agent:open-bot
        context:
          allow: true
        assertions:
          can_create_instance: true
      - user: identity_account:mia
        object: organization:consumer
        assertions:
          can_create_agent_instance: true
      - user: identity_account:mia
        object: organization:acme
        assertions:
          can_create_agent_instance: false
