# Pinned copy of stigmer-cloud backend/services/stigmer-server/fga/tests/blueprint-private-visibility.fga.yaml
# as changed by stigmer-cloud#765 (the OpenFGA store test the cloud runs against its live model).
# The body below is byte-identical to the source; the cloud re-runs the LIVE
# file against this evaluator at the re-pin, so a stale copy is caught there.
# Store tests for real blueprint privacy (Phase 3 of the visibility model).
#
# Blueprint viewer relations no longer include the unconditional
# `viewer from organization` grant: a PRIVATE blueprint is invisible to the
# rest of its own org. Every broader level is an explicit tuple written by
# VisibilityTupleReconciler:
#
#   ORG       viewer@organization:<org>#viewer   (the org's FULL read audience —
#             every role satisfies organization#viewer, including read-only
#             viewers; pre-cloud#257 tuples carried #member, which excluded
#             viewer-role users — still honored until backfilled, see the
#             legacy-bot fixture)
#   PLATFORM  platform_viewer@identity_provider:<idp>#platform_user  +  the ORG tuple
#
# Read vs spend: an org viewer-role user READS org-visible blueprints (and, at
# the model level, satisfies can_execute — run-what-you-can-read), but every
# spend path is gated in Java on the org-level can_create_session /
# can_create_execution_in permissions, which require member-or-guest. The
# vera assertions pin both halves of that contract.
#
# The ORG tuple rides along on PLATFORM (the "org floor") so a shared
# blueprint stays listable in its own org.
#
# T08 exception: org ADMINS (and org owners, via the role hierarchy) are
# composed into blueprint `owner` and therefore see, list, and manage
# PRIVATE blueprints — the GitHub-org-admin model. "Private is real" now
# means: invisible to plain members, never to org admins. Pinned by the
# oscar (org admin) assertions below.
#
# Run with:
#   fga model test --tests blueprint-private-visibility.fga.yaml
#
# Scenario: org "acme" has owner-creator carol, org admin oscar, plain
# member dave, and read-only viewer vera (the role SSO auto-provisioning
# grants by default); mallory belongs to an unrelated org. Carol authors one
# blueprint of each kind at PRIVATE, plus an ORG agent and a legacy ORG
# agent whose tuple still carries the pre-cloud#257 shape.
name: blueprint-private-visibility
model_file: ../model/fga.mod

tuples:
  # --- Org memberships ---
  - user: identity_account:carol
    relation: owner
    object: organization:acme
  - user: identity_account:oscar
    relation: admin
    object: organization:acme
  - user: identity_account:dave
    relation: member
    object: organization:acme
  - user: identity_account:vera
    relation: viewer
    object: organization:acme
  - user: identity_account:mallory
    relation: member
    object: organization:outsider

  # --- PRIVATE blueprints (no visibility tuples at all) ---
  - user: organization:acme
    relation: organization
    object: agent:secret-bot
  - user: identity_account:carol
    relation: owner
    object: agent:secret-bot
  - user: organization:acme
    relation: organization
    object: skill:secret-notes
  - user: identity_account:carol
    relation: owner
    object: skill:secret-notes
  - user: organization:acme
    relation: organization
    object: workflow:secret-flow
  - user: identity_account:carol
    relation: owner
    object: workflow:secret-flow
  - user: organization:acme
    relation: organization
    object: mcp_server:secret-tools
  - user: identity_account:carol
    relation: owner
    object: mcp_server:secret-tools

  # --- ORG-visible agent (explicit org viewer tuple, cloud#257 shape) ---
  - user: organization:acme
    relation: organization
    object: agent:team-bot
  - user: identity_account:carol
    relation: owner
    object: agent:team-bot
  - user: organization:acme#viewer
    relation: viewer
    object: agent:team-bot

  # --- ORG-visible agent with the LEGACY pre-cloud#257 tuple shape ---
  # Pins two transition facts until the boot backfill converges prod tuples:
  # members must keep their access through the old shape, and viewer-role
  # users are still refused by it (the cloud#257 defect, alive on legacy
  # tuples only).
  - user: organization:acme
    relation: organization
    object: agent:legacy-bot
  - user: identity_account:carol
    relation: owner
    object: agent:legacy-bot
  - user: organization:acme#member
    relation: viewer
    object: agent:legacy-bot

  # --- PRIVATE agent with an explicit individual viewer grant ---
  - user: organization:acme
    relation: organization
    object: agent:shared-secret
  - user: identity_account:carol
    relation: owner
    object: agent:shared-secret
  - user: identity_account:dave
    relation: viewer
    object: agent:shared-secret

tests:
  - name: private blueprints are invisible to fellow org members (all four kinds)
    check:
      - user: identity_account:dave
        object: agent:secret-bot
        assertions:
          can_view: false
          can_execute: false
          can_create_instance: false
          can_clone: false
      - user: identity_account:dave
        object: skill:secret-notes
        assertions:
          can_view: false
          can_use: false
      - user: identity_account:dave
        object: workflow:secret-flow
        assertions:
          can_view: false
          can_execute: false
      - user: identity_account:dave
        object: mcp_server:secret-tools
        assertions:
          can_view: false
          can_use: false
          can_connect: false

  - name: org admin sees and manages private blueprints of every kind (T08)
    check:
      - user: identity_account:oscar
        object: agent:secret-bot
        assertions:
          can_view: true
          can_edit: true
          can_delete: true
          can_execute: true
      - user: identity_account:oscar
        object: skill:secret-notes
        assertions:
          can_view: true
          can_edit: true
      - user: identity_account:oscar
        object: workflow:secret-flow
        assertions:
          can_view: true
          can_edit: true
      # mcp_server had admin inheritance before T08 — asserted here so all
      # four private-blueprint kinds are pinned to the same rule.
      - user: identity_account:oscar
        object: mcp_server:secret-tools
        assertions:
          can_view: true
          can_edit: true

  - name: org admin's listable agents include private ones (T08)
    list_objects:
      - user: identity_account:oscar
        type: agent
        assertions:
          can_view:
            - agent:secret-bot
            - agent:team-bot
            - agent:legacy-bot
            - agent:shared-secret

  - name: owner retains full access to private blueprints
    check:
      - user: identity_account:carol
        object: agent:secret-bot
        assertions:
          can_view: true
          can_execute: true
          can_create_instance: true
          can_edit: true
          can_delete: true
      - user: identity_account:carol
        object: workflow:secret-flow
        assertions:
          can_view: true
          can_execute: true
          can_edit: true

  - name: org-visible agent is viewable and runnable by org members, not outsiders
    check:
      - user: identity_account:dave
        object: agent:team-bot
        assertions:
          can_view: true
          can_execute: true
          can_create_instance: true
          can_edit: false
          can_delete: false
      - user: identity_account:mallory
        object: agent:team-bot
        assertions:
          can_view: false
          can_execute: false

  - name: explicit individual viewer grant on a private agent conveys view and run
    check:
      # Run-what-you-can-read: can_execute derives from viewer, so an
      # explicit viewer grant is enough to run (matches the execution gate,
      # which checks can_view).
      - user: identity_account:dave
        object: agent:shared-secret
        assertions:
          can_view: true
          can_execute: true
          can_edit: false

  - name: org member's listable agents exclude private ones
    list_objects:
      - user: identity_account:dave
        type: agent
        assertions:
          can_view:
            - agent:team-bot
            - agent:legacy-bot
            - agent:shared-secret

  - name: owner's listable agents include everything they authored
    list_objects:
      - user: identity_account:carol
        type: agent
        assertions:
          can_view:
            - agent:secret-bot
            - agent:team-bot
            - agent:legacy-bot
            - agent:shared-secret

  # ── cloud#257: the viewer-role cell (previously untested) ──────────────

  - name: org viewer reads org-visible blueprints — the cloud#257 contract
    check:
      # View, clone and (model-level) execute all derive from viewer; the
      # spend refusal is pinned separately on the org permissions below.
      - user: identity_account:vera
        object: agent:team-bot
        assertions:
          can_view: true
          can_clone: true
          can_execute: true
          can_edit: false
          can_delete: false
      # Private stays private — the viewer role grants nothing beyond the
      # explicit visibility tuples.
      - user: identity_account:vera
        object: agent:secret-bot
        assertions:
          can_view: false
          can_execute: false

  - name: org viewer holds no spend authority on the org (the cost gate)
    check:
      # Java execution lanes (session create, agent-execution create,
      # workflow-execution create, EC create) all check these org-level
      # permissions — this is why widening read to viewers exposes no cost.
      - user: identity_account:vera
        object: organization:acme
        assertions:
          can_view: true
          can_create_session: false
          can_create_execution_in: false
      - user: identity_account:dave
        object: organization:acme
        assertions:
          can_create_session: true
          can_create_execution_in: true

  - name: legacy member-shaped tuple keeps members but still excludes viewers (until backfilled)
    check:
      - user: identity_account:dave
        object: agent:legacy-bot
        assertions:
          can_view: true
          can_execute: true
      # The original cloud#257 defect, pinned on the legacy shape: the org
      # role hierarchy flows downward, so a viewer-role user never satisfies
      # organization#member. The boot backfill converges these tuples.
      - user: identity_account:vera
        object: agent:legacy-bot
        assertions:
          can_view: false
          can_execute: false

  - name: org viewer's listable agents are exactly the viewer-shaped org-visible ones
    list_objects:
      - user: identity_account:vera
        type: agent
        assertions:
          can_view:
            - agent:team-bot
