# Pinned copy of stigmer-cloud backend/services/stigmer-server/fga/tests/cross-org-share-creation.fga.yaml
# at commit 2ec420161 (the OpenFGA store test the cloud runs against its live model).
# The body below is byte-identical to the source; the cloud re-runs the LIVE
# file against this evaluator at the re-pin, so a stale copy is caught there.
# Cross-org share creation, the FGA half of the decision 013 D2 consent
# bar. Creating a share of ANOTHER org's marketplace-public agent requires:
#
#   1. can_execute on the agent — granted to every authenticated account by
#      the allow_public wildcard when the agent is public (checked here),
#      and to nobody cross-org when it is not.
#   2. can_create_agent_share on the SHARE's own org — admin-level: a
#      public share spends the org's credits on the open internet. The
#      per-kind can_create_* pattern, one more row.
#
# The same-org bar (agent can_edit) is untouched and pinned by
# agent-share-owner.fga.yaml; the app-level halves of the contract
# (visibility check, audience rule, dependency sweep, agent-id pin) are
# handler logic outside FGA, pinned by the Java and Go unit tests.

name: cross-org-share-creation
model_file: ../model/fga.mod

tuples:
  # provider-org publishes a marketplace-public agent (the conditional
  # wildcard viewer tuple visibility_public writes).
  - user: organization:provider-org
    relation: organization
    object: agent:public-helper
  - user: identity_account:paula
    relation: owner
    object: agent:public-helper
  - user: identity_account:*
    relation: viewer
    object: agent:public-helper
    condition:
      name: allow_public
      context: {}

  # A private agent in the same provider org — the wildcard is absent.
  - user: organization:provider-org
    relation: organization
    object: agent:private-helper
  - user: identity_account:paula
    relation: owner
    object: agent:private-helper

  # consumer-org: an admin and a plain member.
  - user: identity_account:adam
    relation: admin
    object: organization:consumer-org
  - user: identity_account:mia
    relation: member
    object: organization:consumer-org

tests:
  - name: consumer-org admin holds both halves of the cross-org bar
    check:
      - user: identity_account:adam
        object: agent:public-helper
        context:
          allow: true
        assertions:
          can_execute: true
          can_edit: false
      - user: identity_account:adam
        object: organization:consumer-org
        assertions:
          can_create_agent_share: true

  - name: plain member lacks the org-side bar (spending is admin-level)
    check:
      - user: identity_account:mia
        object: agent:public-helper
        context:
          allow: true
        assertions:
          can_execute: true
      - user: identity_account:mia
        object: organization:consumer-org
        assertions:
          can_create_agent_share: false

  - name: nobody cross-org can execute a private agent
    check:
      - user: identity_account:adam
        object: agent:private-helper
        context:
          allow: true
        assertions:
          can_execute: false
          can_view: false

  - name: the org-side bar does not leak across orgs
    check:
      - user: identity_account:paula
        object: organization:consumer-org
        assertions:
          can_create_agent_share: false
