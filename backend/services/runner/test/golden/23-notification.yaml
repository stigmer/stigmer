# Golden Test 23: Notification Task (Webhook)
# Tests: Notification via call:function dispatch, webhook channel
# CNCF DSL 1.0.0 FORMAT

document:
  dsl: '1.0.0'
  namespace: golden-tests
  name: notification-test
  version: '1.0.0'
  description: Tests fire-and-forget notification delivery

do:
  - alertOncall:
      call: notification
      with:
        channel: webhook
        recipients:
          - https://hooks.example.com/incident
        subject: "P1 Incident: service degradation"
        body: |
          Severity: high
          Service: payment-gateway
          Status: degraded
        metadata:
          priority: urgent
          source: workflow-runner

  - confirmationEmail:
      call: notification
      with:
        channel: webhook
        recipients:
          - https://hooks.example.com/email
          - https://hooks.example.com/slack
        subject: "Order confirmed"
        body: "Your order has been processed."

  - markDone:
      set:
        notifications_sent: true
