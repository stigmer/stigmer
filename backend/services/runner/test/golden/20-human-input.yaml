# Golden Test 20: Human Input (HITL Approval Gate)
# Tests: Basic approval, timeout with auto-approve, custom outcomes
# CNCF DSL 1.0.0 FORMAT

document:
  dsl: '1.0.0'
  namespace: golden-tests
  name: human-input-test
  version: '1.0.0'
  description: Tests human-in-the-loop approval gates

do:
  - requireDeployApproval:
      call: human_input
      with:
        prompt: "Deploy to production?"
        timeout: 300
        on_timeout: approve
        outcomes:
          - name: approve
          - name: deny

  - processDecision:
      set:
        approval_received: true

  - requireSecurityReview:
      call: human_input
      with:
        prompt: "Security team: review this change"
        timeout: 3600
        on_timeout: fail

  - allGatesCleared:
      set:
        all_gates_passed: true
