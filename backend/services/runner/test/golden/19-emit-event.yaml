# Golden Test 19: Emit Event (CloudEvents Envelope)
# Tests: CloudEvents 1.0 envelope construction via call:function, plus
# delivery-target propagation (webhook + signal) through the engine to the
# function-call boundary (authoring surface added at oss#530)
# CNCF DSL 1.0.0 FORMAT

document:
  dsl: '1.0.0'
  namespace: golden-tests
  name: emit-event-test
  version: '1.0.0'
  description: Tests emitting CloudEvents envelopes

do:
  - emitStepComplete:
      call: emit_event
      with:
        event:
          type: workflow.step.completed
          subject: data-enrichment
          data:
            step_name: enrichment
            status: success
            duration_ms: 1200

  - emitCustomSource:
      call: emit_event
      with:
        event:
          type: audit.action.performed
          source: /services/stigmer/workflows
          data:
            action: approve
            actor: reviewer@example.com

  - emitWithDelivery:
      call: emit_event
      with:
        event:
          type: acme.order.fulfilled
          subject: ORDER-42
          data:
            order_id: ord_123
        delivery:
          - webhook:
              url: https://hooks.acme.com/orders
              headers:
                X-Source: stigmer
          - signal:
              execution_id: wfx_shipping_001
              signal_name: order-fulfilled

  - markDone:
      set:
        events_emitted: true
