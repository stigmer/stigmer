# Golden Test 17: Listen (Signal Event Gate)
# Tests: Single signal wait, multi-signal all, any-first-wins, acceptIf condition
# CNCF DSL 1.0.0 FORMAT

document:
  dsl: '1.0.0'
  namespace: golden-tests
  name: listen-signal-test
  version: '1.0.0'
  description: Tests waiting for external signals with various strategies

do:
  - waitForApproval:
      listen:
        to:
          one:
            with:
              id: approval_signal
              type: signal

  - processApproval:
      set:
        approved: true

  - waitForAllReviewers:
      listen:
        to:
          all:
            - with:
                id: reviewer_1_signal
                type: signal
            - with:
                id: reviewer_2_signal
                type: signal

  - allReviewsComplete:
      set:
        reviews_done: true

  - waitForFirstResponse:
      listen:
        to:
          any:
            - with:
                id: fast_responder
                type: signal
            - with:
                id: slow_responder
                type: signal

  - responseReceived:
      set:
        first_response: true
