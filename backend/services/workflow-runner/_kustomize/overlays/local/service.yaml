apiVersion: kubernetes.project-planton.org/v1
kind: KubernetesDeployment
metadata:
  name: workflow-runner
spec:
  container:
    app:
      env:
        variables:
          - name: ENV
            value: local
          # Execution Mode - dual (gRPC + Temporal worker in same process)
          - name: EXECUTION_MODE
            value: dual
          # gRPC Server Configuration
          - name: GRPC_PORT
            value: "9090"
          - name: PORT
            value: "9090"
          # For local development, use a test workflow file
          - name: WORKFLOW_FILE
            value: /app/test/golden/01-operation-basic.yaml
          # Temporal Configuration (using external endpoint for local development)
          - name: TEMPORAL_SERVICE_ADDRESS
            value: $variables-group/stigmer-temporal-config/prod.external-endpoint
          - name: TEMPORAL_NAMESPACE
            value: $variables-group/stigmer-temporal-config/namespace
          - name: TEMPORAL_WORKFLOW_EXECUTION_RUNNER_TASK_QUEUE
            value: workflow_execution_runner
          # More verbose logging for local dev
          - name: LOG_LEVEL
            value: info
          # OpenTelemetry
          - name: OTEL_EXPORTER_OTLP_TRANSPORT
            value: http
          # Stigmer Backend Configuration
          - name: STIGMER_BACKEND_ENDPOINT
            value: $variables-group/stigmer-api/prod.endpoint
          - name: STIGMER_SERVICE_USE_TLS
            value: "true"
