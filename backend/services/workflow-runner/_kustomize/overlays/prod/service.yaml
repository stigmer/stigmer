apiVersion: kubernetes.project-planton.org/v1
kind: KubernetesDeployment
metadata:
  name: workflow-runner
  env: prod
  labels:
    pulumi.project-planton.org/stack.name: prod.KubernetesDeployment.workflow-runner
spec:
  namespace:
    value: stigmer-prod
  container:
    app:
      env:
        variables:
          - name: ENV
            value: prod
          # Temporal Configuration (using internal Kubernetes endpoint for prod)
          - name: TEMPORAL_SERVICE_ADDRESS
            value: $variables-group/stigmer-temporal-config/prod.kube-endpoint
          - name: TEMPORAL_NAMESPACE
            value: default
          - name: TEMPORAL_WORKFLOW_EXECUTION_RUNNER_TASK_QUEUE
            value: workflow_execution_runner
          # Stigmer Backend Configuration (internal Kubernetes endpoint, plain gRPC)
          # Used by workflow runner to report progress back to Stigmer backend service
          - name: STIGMER_BACKEND_ENDPOINT
            value: $variables-group/stigmer-api/prod.kube-endpoint
          - name: STIGMER_SERVICE_USE_TLS
            value: "false"
          # Claim Check Configuration (for large payload handling)
          # In cloud mode (STIGMER_PROXY_ENDPOINT set), claim check uses presigned
          # URLs from the Side-Channel Proxy instead of direct R2 credentials.
          - name: CLAIMCHECK_ENABLED
            value: "true"
          - name: CLAIMCHECK_THRESHOLD_BYTES
            value: "51200"  # 50KB
          - name: CLAIMCHECK_COMPRESSION_ENABLED
            value: "true"
          # Side-Channel Proxy origin (enables proxy mode for LLM calls and claim check).
          # When set, R2 credentials are not needed — the proxy generates presigned URLs.
          - name: STIGMER_PROXY_ENDPOINT
            value: https://api.stigmer.ai
        secrets:
          # Stigmer API Key (unified with agent-runner)
          # Used for Side-Channel Proxy authentication (LLM proxy + claim check proxy)
          - name: STIGMER_API_KEY
            value: $secrets-group/stigmer-api/prod.api-key
      resources:
        limits:
          cpu: "2"
          memory: 2Gi
        requests:
          cpu: 60m
          memory: 100Mi
  availability:
    minReplicas: 1
    # Zero-downtime deployment strategy
    deploymentStrategy:
      maxUnavailable: "0"
      maxSurge: "1"
    # Pod disruption budget for cluster maintenance protection
    podDisruptionBudget:
      enabled: true
      minAvailable: "1"
