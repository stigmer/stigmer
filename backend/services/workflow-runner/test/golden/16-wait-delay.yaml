# Golden Test 16: Wait (Timer Delay)
# Tests: Duration-based wait, multi-field duration, zero-duration edge case
# CNCF DSL 1.0.0 FORMAT

document:
  dsl: '1.0.0'
  namespace: golden-tests
  name: wait-delay-test
  version: '1.0.0'
  description: Tests timer delays with various duration configurations

do:
  - setupData:
      set:
        started: true

  - shortDelay:
      wait:
        seconds: 5

  - markAfterShort:
      set:
        after_short: true

  - multiFieldDelay:
      wait:
        minutes: 1
        seconds: 30

  - markAfterMulti:
      set:
        after_multi: true

  - millisecondDelay:
      wait:
        milliseconds: 500

  - finalMark:
      set:
        completed: true
