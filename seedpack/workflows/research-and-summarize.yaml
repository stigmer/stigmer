apiVersion: agentic.stigmer.ai/v1
kind: Workflow
metadata:
  name: research-and-summarize
  visibility: visibility_public
  labels:
    stigmer.ai/system: "true"
spec:
  description: >
    Multi-step AI analysis pipeline with parallel processing and human approval.
    An LLM analyzes source material, then two parallel branches simultaneously
    generate an executive summary and extract structured key findings.
    Results are merged and presented for human review before finalization.
    Demonstrates: llm_call, fork with parallel branches, transform with JQ,
    human_input with revision loops, and structured output extraction.
  document:
    dsl: "1.0.0"
    namespace: stigmer
    name: research-and-summarize
    version: "1.0.0"
  env:
    TOPIC:
      description: "The topic or question to analyze"
    SOURCE_MATERIAL:
      description: "Text, article, or data to analyze (paste content directly)"
    DEPTH:
      description: "Analysis depth: brief, standard, or thorough (default: standard)"
      optional: true
  budget:
    max_cost_micros: 3000000
    max_total_tokens: 300000
    max_duration_seconds: 600
  tasks:
    - name: initial_analysis
      kind: llm_call
      task_config:
        model: "claude-sonnet-4.5"
        system_prompt: >
          You are a research analyst. Analyze the provided source material
          thoroughly. Identify key themes, claims, evidence, and gaps.
          Organize your analysis with clear sections.
        prompt: >
          Analyze the following material on "${ $context.env.TOPIC }"
          at ${ $context.env.DEPTH } depth:

          ${ $context.env.SOURCE_MATERIAL }
        temperature: 0.3
        max_tokens: 3000
        timeout: 120
        max_retries: 2
      export:
        as: "${ . }"
      flow:
        then: parallel_processing

    - name: parallel_processing
      kind: fork
      task_config:
        branches:
          - name: executive_summary
            do:
              - name: summarize
                kind: llm_call
                task_config:
                  model: "claude-sonnet-4.5"
                  system_prompt: >
                    You are an executive briefing writer. Distill analysis
                    into a concise, actionable summary for decision-makers.
                    Lead with conclusions, follow with key evidence.
                  prompt: >
                    Write a 3-paragraph executive summary of this analysis:

                    ${ $context.initial_analysis.text }
                  temperature: 0.3
                  max_tokens: 500
                  timeout: 60
                  max_retries: 2
                export:
                  as: "${ . }"
          - name: key_findings
            do:
              - name: extract_findings
                kind: llm_call
                task_config:
                  model: "claude-haiku-4.5"
                  system_prompt: "Extract structured key findings from the analysis."
                  prompt: >
                    Extract the key findings from this analysis as structured data:

                    ${ $context.initial_analysis.text }
                  response_schema:
                    type: object
                    required:
                      - findings
                      - confidence
                    properties:
                      findings:
                        type: array
                        items:
                          type: object
                          required:
                            - title
                            - detail
                          properties:
                            title:
                              type: string
                            detail:
                              type: string
                      confidence:
                        type: string
                        enum:
                          - low
                          - medium
                          - high
                      limitations:
                        type: array
                        items:
                          type: string
                  on_invalid: ON_INVALID_RETRY
                  max_retries: 2
                  max_tokens: 500
                  timeout: 60
                export:
                  as: "${ . }"
        compete: false
      export:
        as: "${ . }"
      flow:
        then: merge_results

    - name: merge_results
      kind: transform
      task_config:
        engine: TRANSFORM_ENGINE_JQ
        expression: >
          {
            topic: .topic,
            executive_summary: .summary,
            key_findings: .findings,
            finding_count: (.findings.findings | length)
          }
        input: "${ {topic: $context.env.TOPIC, summary: $context.parallel_processing.executive_summary.summarize.text, findings: $context.parallel_processing.key_findings.extract_findings.structured} }"
      export:
        as: "${ . }"
      flow:
        then: review_report

    - name: review_report
      kind: human_input
      task_config:
        prompt: >
          Review the analysis report for "${ $context.merge_results.topic }".

          --- Executive Summary ---
          ${ $context.merge_results.executive_summary }

          --- Key Findings (${ $context.merge_results.finding_count } items) ---
          Confidence: ${ $context.merge_results.key_findings.confidence }

          Approve this report?
        form_schema:
          type: object
          properties:
            notes:
              type: string
              description: "Optional reviewer notes or corrections"
        outcomes:
          - name: approve
            label: "Approve Report"
          - name: reject
            label: "Discard"
            then: end
        timeout: 172800
        on_timeout: HUMAN_INPUT_TIMEOUT_FAIL
      export:
        as: "${ . }"
      flow:
        then: finalize_report

    - name: finalize_report
      kind: transform
      task_config:
        engine: TRANSFORM_ENGINE_JQ
        expression: >
          {
            status: "approved",
            topic: .report.topic,
            executive_summary: .report.executive_summary,
            key_findings: .report.key_findings,
            finding_count: .report.finding_count,
            approved_by: .review.reviewer,
            reviewer_notes: .review.form_data.notes
          }
        input: "${ {report: $context.merge_results, review: $context.review_report} }"
      export:
        as: "${ . }"
