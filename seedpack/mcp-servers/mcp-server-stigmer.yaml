apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-stigmer
  visibility: visibility_public
  labels:
    stigmer.ai/system: "true"
  tags:
    - system
    - built-in
spec:
  description: "Built-in MCP server that exposes Stigmer resources (agents, skills, workflows, MCP servers) to MCP clients via the Model Context Protocol."
  stdio:
    command: "go"
    args:
      - "run"
      - "github.com/stigmer/stigmer/mcp-server/cmd/mcp-server-stigmer@latest"
  env:
    STIGMER_SERVER_ADDRESS:
      is_secret: false
      description: "gRPC address of the stigmer-server (e.g., localhost:9090 or api.stigmer.ai:443)"
    STIGMER_API_KEY:
      is_secret: true
      description: "API key for authenticating with stigmer-server (optional for local unauthenticated backends)"
