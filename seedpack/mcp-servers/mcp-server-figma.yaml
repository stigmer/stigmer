apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-figma
  visibility: visibility_public
  labels:
    stigmer.ai/category: "design"
spec:
  description: "Figma MCP server for accessing design files, inspecting components, extracting design tokens, and navigating project structures."
  repository_url: "https://github.com/figma/mcp-server-guide"
  github_stars: 1060
  tags:
    - figma
    - design
    - ui
    - design-tokens
  http:
    url: "https://mcp.figma.com/mcp"
    headers:
      Authorization: "Bearer ${FIGMA_ACCESS_TOKEN}"
  env_spec:
    data:
      FIGMA_ACCESS_TOKEN:
        is_secret: true
        description: "Figma personal access token or OAuth token (generate at figma.com/developers)"
