apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-resend
  visibility: visibility_public
  labels:
    stigmer.ai/category: "notifications"
spec:
  description: "Resend MCP server for sending transactional emails, managing domains, and accessing email delivery analytics."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/resend.svg"
  repository_url: "https://github.com/resend/resend-mcp"
  github_stars: 493
  tags:
    - resend
    - email
    - notifications
    - transactional
  stdio:
    command: "npx"
    args:
      - "-y"
      - "resend-mcp"
  env:
    RESEND_API_KEY:
      is_secret: true
      description: "Resend API key (get at resend.com/api-keys)"
