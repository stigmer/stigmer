apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: github
  visibility: visibility_public
  labels:
    stigmer.ai/category: "developer"
  tags:
    - github
    - git
    - vcs
    - code-review
    - pull-request
spec:
  description: "GitHub repository operations, code search, issue tracking, and pull request management."
  icon_url: "https://github.githubassets.com/favicons/favicon.svg"
  stdio:
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-github"
  env_spec:
    data:
      GITHUB_PERSONAL_ACCESS_TOKEN:
        is_secret: true
        description: "GitHub personal access token. Create at https://github.com/settings/tokens with 'repo' scope for private repos or 'public_repo' for public-only access."
