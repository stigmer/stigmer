apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-mongodb
  visibility: visibility_public
  labels:
    stigmer.ai/category: "databases"
spec:
  description: "MongoDB MCP server for document queries, collection management, aggregation pipelines, and Atlas cloud operations."
  icon_url: "https://cdn.simpleicons.org/mongodb"
  repository_url: "https://github.com/mongodb-js/mongodb-mcp-server"
  github_stars: 994
  tags:
    - mongodb
    - database
    - nosql
    - document
  stdio:
    command: "npx"
    args:
      - "-y"
      - "mongodb-mcp-server@latest"
      - "--readOnly"
  env:
    MDB_MCP_CONNECTION_STRING:
      is_secret: true
      description: "MongoDB connection string (e.g., mongodb://localhost:27017/mydb or mongodb+srv://...)"
