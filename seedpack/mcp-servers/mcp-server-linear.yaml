apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-linear
  visibility: visibility_public
  labels:
    stigmer.ai/category: "communication"
spec:
  description: "Linear MCP server for issue tracking, project management, team collaboration, and sprint planning."
  repository_url: ""
  github_stars: 0
  tags:
    - linear
    - project-management
    - issue-tracking
  http:
    url: "https://mcp.linear.app/mcp"
    headers:
      Authorization: "Bearer ${LINEAR_ACCESS_TOKEN}"
  env_spec:
    data:
      LINEAR_ACCESS_TOKEN:
        is_secret: true
        description: "Linear API key or OAuth access token (generate at linear.app/settings/api)"
