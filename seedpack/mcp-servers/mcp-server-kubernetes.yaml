apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-kubernetes
  visibility: visibility_public
  labels:
    stigmer.ai/category: "cloud-infrastructure"
spec:
  description: "Kubernetes MCP server for cluster management, pod inspection, deployment operations, and resource exploration."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/kubernetes.svg"
  repository_url: "https://github.com/strowk/mcp-k8s-go"
  github_stars: 378
  tags:
    - kubernetes
    - k8s
    - cloud
    - container-orchestration
  stdio:
    command: "npx"
    args:
      - "-y"
      - "@strowk/mcp-k8s"
