apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: Postgres
  visibility: visibility_public
  labels:
    stigmer.ai/category: "databases"
spec:
  description: "PostgreSQL MCP server for database exploration, schema inspection, query execution, index tuning, and performance analysis."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/postgresql.svg"
  repository_url: "https://github.com/crystaldba/postgres-mcp"
  github_stars: 3000
  tags:
    - postgresql
    - database
    - sql
  stdio:
    command: "uvx"
    args:
      - "postgres-mcp"
      - "--access-mode=unrestricted"
      - "${POSTGRES_CONNECTION_URL}"
  env:
    POSTGRES_CONNECTION_URL:
      is_secret: true
      description: "PostgreSQL connection URL (e.g., postgresql://user:password@localhost:5432/dbname)"
