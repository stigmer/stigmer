apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: Memory
  visibility: visibility_public
  labels:
    stigmer.ai/category: "ai-reasoning"
spec:
  description: "Memory MCP server providing a knowledge graph-based persistent memory system for storing and retrieving entities, relations, and observations across sessions."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/databricks.svg"
  repository_url: "https://github.com/modelcontextprotocol/servers"
  github_stars: 83366
  tags:
    - memory
    - knowledge-graph
    - persistence
    - ai
  stdio:
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-memory"
