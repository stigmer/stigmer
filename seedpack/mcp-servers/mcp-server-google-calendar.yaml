apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-google-calendar
  visibility: visibility_public
  labels:
    stigmer.ai/category: "scheduling"
spec:
  description: "Google Calendar MCP server for creating, reading, updating, and managing calendar events and schedules."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/googlecalendar.svg"
  repository_url: "https://github.com/nspady/google-calendar-mcp"
  github_stars: 1083
  tags:
    - google-calendar
    - scheduling
    - calendar
    - productivity
  stdio:
    command: "npx"
    args:
      - "-y"
      - "@cocal/google-calendar-mcp"
  env:
    GOOGLE_OAUTH_CREDENTIALS:
      is_secret: true
      description: "Google OAuth access token or credentials JSON path (obtained via Connect or at console.cloud.google.com)"
  auth:
    oauth_app_ref:
      org: stigmer
      kind: oauth_app
      slug: google-calendar-oauth
    target_env_var: "GOOGLE_OAUTH_CREDENTIALS"
    token_lifetime_hint: "1h"
    scope_hints:
      - "https://www.googleapis.com/auth/calendar"
