apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-exa
  visibility: visibility_public
  labels:
    stigmer.ai/category: "search"
spec:
  description: "Exa MCP server for AI-native web search with neural and keyword modes, content retrieval, and domain-specific filtering."
  icon_url: "https://cdn.simpleicons.org/exa"
  repository_url: "https://github.com/exa-labs/exa-mcp-server"
  github_stars: 4201
  tags:
    - exa
    - search
    - web-search
    - research
  stdio:
    command: "npx"
    args:
      - "-y"
      - "exa-mcp-server"
  env:
    EXA_API_KEY:
      is_secret: true
      description: "Exa API key (get at exa.ai)"
