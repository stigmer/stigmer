apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: AWS IAC
  visibility: visibility_public
  labels:
    stigmer.ai/category: "cloud-infrastructure"
spec:
  description: "AWS Infrastructure as Code MCP server for CloudFormation validation, compliance checking, deployment troubleshooting, and CDK constructs and best practices."
  icon_url: "https://upload.wikimedia.org/wikipedia/commons/9/93/Amazon_Web_Services_Logo.svg"
  repository_url: "https://github.com/awslabs/mcp"
  github_stars: 8732
  tags:
    - aws
    - cdk
    - cloudformation
    - infrastructure-as-code
    - cloud
  stdio:
    command: "uvx"
    args:
      - "awslabs.aws-iac-mcp-server@latest"
  env:
    AWS_ACCESS_KEY_ID:
      is_secret: true
      description: "AWS access key ID for CloudFormation deployment troubleshooting and resource operations"
    AWS_SECRET_ACCESS_KEY:
      is_secret: true
      description: "AWS secret access key"
    AWS_REGION:
      is_secret: false
      description: "AWS region (e.g., us-east-1)"
    FASTMCP_LOG_LEVEL:
      is_secret: false
      description: "Log level for the MCP server (default: ERROR)"
      optional: true
