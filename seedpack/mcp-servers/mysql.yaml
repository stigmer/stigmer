apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mysql
  visibility: visibility_public
  labels:
    stigmer.ai/category: "database"
  tags:
    - mysql
    - sql
    - database
    - relational
spec:
  description: "MySQL database queries with configurable read-only safety, connection pooling, and schema exploration."
  icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/mysql/mysql-original.svg"
  stdio:
    command: "npx"
    args:
      - "-y"
      - "@benborla29/mcp-server-mysql"
  env_spec:
    data:
      MYSQL_HOST:
        is_secret: false
        description: "MySQL server hostname (e.g., localhost or db.example.com)."
      MYSQL_PORT:
        is_secret: false
        description: "MySQL server port (default: 3306)."
      MYSQL_USER:
        is_secret: false
        description: "MySQL username for authentication."
      MYSQL_PASS:
        is_secret: true
        description: "MySQL password for authentication."
      MYSQL_DB:
        is_secret: false
        description: "Default database name to connect to."
