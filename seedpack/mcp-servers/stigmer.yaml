apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: Stigmer
  visibility: visibility_public
  labels:
    stigmer.ai/system: "true"
  tags:
    - system
    - built-in
spec:
  description: "Built-in MCP server that exposes Stigmer resources (agents, skills, workflows, MCP servers) to MCP clients via the Model Context Protocol."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/site/public/favicon.svg"
  http:
    url: "https://mcp.stigmer.ai"
    headers:
      Authorization: "Bearer ${STIGMER_API_KEY}"
  env:
    STIGMER_API_KEY:
      is_secret: true
      description: "Stigmer API key (stk_…) or an access token issued by your organization's identity provider. Forwarded unchanged to stigmer-server, which validates it."
