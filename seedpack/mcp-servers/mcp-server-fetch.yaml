apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-fetch
  visibility: visibility_public
  labels:
    stigmer.ai/category: "search"
spec:
  description: "Fetch MCP server for retrieving web content and converting it to formats optimized for LLM consumption."
  icon_url: "https://cdn.simpleicons.org/curl"
  repository_url: "https://github.com/modelcontextprotocol/servers"
  github_stars: 83366
  tags:
    - fetch
    - web
    - content-extraction
    - scraping
  stdio:
    command: "uvx"
    args:
      - "mcp-server-fetch"
