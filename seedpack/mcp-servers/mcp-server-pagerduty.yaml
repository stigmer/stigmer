apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-pagerduty
  visibility: visibility_public
  labels:
    stigmer.ai/category: "monitoring"
spec:
  description: "PagerDuty MCP server for incident management, on-call schedules, alerting, escalation policies, and service health monitoring."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/pagerduty.svg"
  repository_url: "https://github.com/PagerDuty/pagerduty-mcp-server"
  github_stars: 58
  tags:
    - pagerduty
    - incident-management
    - on-call
    - alerting
  http:
    url: "https://mcp.pagerduty.com/mcp"
    headers:
      Authorization: "Token ${PAGERDUTY_API_TOKEN}"
  env:
    PAGERDUTY_API_TOKEN:
      is_secret: true
      description: "PagerDuty REST API token (generate at your-subdomain.pagerduty.com > Integrations > API Access Keys)"
