apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: atlassian
  visibility: visibility_public
  labels:
    stigmer.ai/category: "developer"
  tags:
    - atlassian
    - jira
    - confluence
    - project-management
    - issue-tracking
spec:
  description: "Atlassian Cloud operations across Jira issue management, Confluence page search, and Compass component tracking."
  icon_url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/atlassian.svg"
  http:
    url: "https://mcp.atlassian.com/v1/mcp"
    headers:
      Authorization: "Bearer ${ATLASSIAN_API_KEY}"
  env_spec:
    data:
      ATLASSIAN_API_KEY:
        is_secret: true
        description: "Atlassian service account API key. Create at admin.atlassian.com > Settings > Service accounts, generate an API key with access to the Atlassian products you need."
