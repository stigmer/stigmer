apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: Atlassian
  visibility: visibility_public
  labels:
    stigmer.ai/category: "crm-support"
spec:
  description: "Atlassian MCP server for Jira issue management, Confluence page access, and project collaboration via the Rovo platform."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/atlassian.svg"
  repository_url: "https://github.com/atlassian/atlassian-mcp-server"
  github_stars: 557
  tags:
    - atlassian
    - jira
    - confluence
    - project-management
  http:
    url: "https://mcp.atlassian.com/v1/mcp"
    headers:
      Authorization: "Bearer ${ATLASSIAN_ACCESS_TOKEN}"
  env:
    ATLASSIAN_ACCESS_TOKEN:
      is_secret: true
      description: "Atlassian API token or OAuth access token"
  auth:
    target_env_var: "ATLASSIAN_ACCESS_TOKEN"
    token_lifetime_hint: "1h"
