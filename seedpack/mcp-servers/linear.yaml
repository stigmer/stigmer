apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: linear
  visibility: visibility_public
  labels:
    stigmer.ai/category: "developer"
  tags:
    - linear
    - project-management
    - issue-tracking
spec:
  description: "Linear issue tracking, project management, initiative planning, and team workflow operations via the Linear API."
  icon_url: "https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/linear.svg"
  http:
    url: "https://mcp.linear.app/mcp"
    headers:
      Authorization: "Bearer ${LINEAR_API_KEY}"
  env_spec:
    data:
      LINEAR_API_KEY:
        is_secret: true
        description: "Linear personal API key. Generate at Settings > Account > Security & access > API keys. Grants access scoped to your account permissions."
