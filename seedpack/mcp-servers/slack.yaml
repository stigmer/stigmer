apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: slack
  visibility: visibility_public
  labels:
    stigmer.ai/category: "communication"
  tags:
    - slack
    - messaging
    - communication
    - chat
spec:
  description: "Slack workspace messaging, channel history, thread replies, reactions, and user profile lookup."
  icon_url: "https://a.slack-edge.com/80588/marketing/img/icons/icon_slack_hash_colored.png"
  stdio:
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-slack"
  env_spec:
    data:
      SLACK_BOT_TOKEN:
        is_secret: true
        description: "Slack Bot User OAuth Token (xoxb-...). Create a Slack App at https://api.slack.com/apps with scopes: channels:history, channels:read, chat:write, reactions:write, users:read, users.profile:read."
      SLACK_TEAM_ID:
        is_secret: false
        description: "Slack workspace team ID (starts with T). Find at https://slack.com/help/articles/221769328-Locate-your-Slack-URL-or-ID."
