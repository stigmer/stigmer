apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: Monday
  visibility: visibility_public
  labels:
    stigmer.ai/category: "productivity"
spec:
  description: "monday.com MCP server for board management, item tracking, workflow automation, and team collaboration."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/mondaydotcom.svg"
  repository_url: "https://github.com/mondaycom/mcp"
  github_stars: 387
  tags:
    - monday
    - project-management
    - work-management
    - collaboration
  http:
    url: "https://mcp.monday.com/mcp"
    headers:
      MONDAY_TOKEN: "${MONDAY_ACCESS_TOKEN}"
  env:
    MONDAY_ACCESS_TOKEN:
      is_secret: true
      description: "monday.com personal API token — generate at monday.com > Avatar menu > Developers > My Access Tokens. See developer.monday.com for details."
  auth:
    target_env_var: "MONDAY_ACCESS_TOKEN"
    token_lifetime_hint: "1h"
