apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: Monday
  visibility: visibility_public
  labels:
    stigmer.ai/category: "productivity"
spec:
  description: "monday.com MCP server for board management, item tracking, workflow automation, and team collaboration."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/mondaydotcom.svg"
  repository_url: "https://github.com/mondaycom/mcp"
  github_stars: 387
  tags:
    - monday
    - project-management
    - work-management
    - collaboration
  http:
    url: "https://mcp.monday.com/mcp"
    headers:
      Authorization: "Bearer ${MONDAY_ACCESS_TOKEN}"
  env:
    MONDAY_ACCESS_TOKEN:
      is_secret: true
      description: "monday.com OAuth access token, obtained automatically via Connect. monday's hosted MCP endpoint requires OAuth 2.1 and rejects personal API tokens."
  auth:
    target_env_var: "MONDAY_ACCESS_TOKEN"
    token_lifetime_hint: "1h"
    # monday's hosted endpoint rejects personal API tokens; OAuth is the only
    # working credential path, so the connect UI hides manual token entry.
    oauth_only: true
