apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: Sequential Thinking
  visibility: visibility_public
  labels:
    stigmer.ai/category: "ai-reasoning"
spec:
  description: "Sequential Thinking MCP server for dynamic, reflective problem-solving through structured thought sequences with branching and revision."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/site/public/favicon.svg"
  repository_url: "https://github.com/modelcontextprotocol/servers"
  github_stars: 83366
  tags:
    - reasoning
    - thinking
    - problem-solving
    - ai
  stdio:
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-sequential-thinking"
