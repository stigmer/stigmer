# Credential Manifest for MCP Seedpack Canary Tests
#
# Tracks which MCP servers have credentials provisioned for automated
# canary testing. CI reads this file to determine which canary tests to run.
#
# Status values:
#   not_required  - Server has no secret env vars; canary tests run without credentials
#   provisioned   - Credentials stored in Planton secrets; canary tests enabled
#   pending       - Needs human to provision credentials (new server or expired token)
#   oauth_only    - Requires browser-based OAuth; manual token acquisition needed
#   header_fix_needed - Seedpack YAML has wrong auth config; fix before testing
#
# Auth types:
#   none          - No credentials needed
#   api_key       - Static API key or token (Bearer header or env var)
#   vendor_oauth  - OAuth via pre-registered OAuthApp (oauth_app_ref set)
#   dcr_oauth     - MCP Authorization spec (DCR + PKCE, no oauth_app_ref)
#
# When adding a new server, use @add-mcp-server-to-seedpack rule.

servers:

  # --- No credentials required ---

  aws-cdk:
    status: not_required
    auth_type: none

  aws-documentation:
    status: not_required
    auth_type: none

  aws-lambda:
    status: not_required
    auth_type: none

  fetch:
    status: not_required
    auth_type: none

  filesystem:
    status: not_required
    auth_type: none

  git:
    status: not_required
    auth_type: none

  memory:
    status: not_required
    auth_type: none

  playwright:
    status: not_required
    auth_type: none

  sequential-thinking:
    status: not_required
    auth_type: none

  stigmer:
    status: not_required
    auth_type: none
    notes: "STIGMER_API_KEY is optional for local backends"

  # --- Credentials provisioned (from team spreadsheet) ---

  atlassian:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-atlassian-api-token
    env_var: ATLASSIAN_ACCESS_TOKEN

  brevo:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-brevo-mcp-token
    env_var: BREVO_MCP_TOKEN

  cloudflare:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-cloudflare-token
    env_var: CLOUDFLARE_ACCESS_TOKEN

  cloudinary:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-cloudinary-token
    env_var: CLOUDINARY_ACCESS_TOKEN

  exa:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-exa-api-key
    env_var: EXA_API_KEY

  github:
    status: provisioned
    auth_type: vendor_oauth
    secret_ref: mcp-canary-github-token
    env_var: GITHUB_ACCESS_TOKEN
    notes: "Pre-acquired PAT used in lieu of full OAuth flow"

  google-maps:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-google-maps-api-key
    env_var: GOOGLE_MAPS_API_KEY

  linear:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-linear-api-key
    env_var: LINEAR_ACCESS_TOKEN

  neon:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-neon-api-key
    env_var: NEON_API_KEY

  pagerduty:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-pagerduty-token
    env_var: PAGERDUTY_API_TOKEN

  sentry:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-sentry-auth-token
    env_var: SENTRY_AUTH_TOKEN

  stripe:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-stripe-token
    env_var: STRIPE_ACCESS_TOKEN

  tavily:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-tavily-api-key
    env_var: TAVILY_API_KEY

  # --- OAuth-only (requires browser-based authorization) ---

  attio:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: ATTIO_ACCESS_TOKEN
    notes: "Provider endpoint requires OAuth; API key rejected"

  buildkite:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: BUILDKITE_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  canva:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: CANVA_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  contentful:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: CONTENTFUL_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  figma:
    status: oauth_only
    auth_type: vendor_oauth
    env_var: FIGMA_ACCESS_TOKEN
    notes: "OAuth app pending vendor approval"

  google-calendar:
    status: oauth_only
    auth_type: vendor_oauth
    env_var: GOOGLE_OAUTH_CREDENTIALS
    notes: "Requires Google OAuth consent flow"

  hubspot:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: HUBSPOT_ACCESS_TOKEN
    notes: "Requires OAuth 2.1 with PKCE; personal keys rejected"

  intercom:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: INTERCOM_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  monday:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: MONDAY_ACCESS_TOKEN
    notes: "OAuth 2.0 Authorization Code Grant required; personal tokens rejected"

  netlify:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: NETLIFY_ACCESS_TOKEN
    notes: "Rejects tokens with 'Invalid JWE token'; expects MCP protocol OAuth"

  notion:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: NOTION_ACCESS_TOKEN
    notes: "Hosted endpoint requires OAuth 2.0 + PKCE; local npm server accepts integration tokens"

  paypal:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: PAYPAL_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  slack:
    status: oauth_only
    auth_type: vendor_oauth
    env_var: SLACK_ACCESS_TOKEN
    notes: "OAuth app pending vendor approval"

  square:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: SQUARE_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  supabase:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: SUPABASE_ACCESS_TOKEN
    notes: "Fails with UnicodeEncodeError; OAuth required"

  webflow:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: WEBFLOW_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  wix:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: WIX_ACCESS_TOKEN
    notes: "Provider endpoint requires OAuth; API key may not work"

  # --- Pending credential provisioning ---

  brave-search:
    status: pending
    auth_type: api_key
    secret_ref: mcp-canary-brave-search-api-key
    env_var: BRAVE_API_KEY
    notes: "Free tier: 2,000 queries/month at brave.com/search/api"

  context7:
    status: pending
    auth_type: api_key
    secret_ref: mcp-canary-context7-api-key
    env_var: CONTEXT7_API_KEY
    notes: "API key is optional for this server"

  datadog:
    status: pending
    auth_type: api_key
    secret_ref: mcp-canary-datadog-token
    env_var: DATADOG_ACCESS_TOKEN
    notes: "Blocked: verification email not received from Datadog"

  kubernetes:
    status: pending
    auth_type: api_key
    secret_ref: mcp-canary-kubernetes-config
    env_var: KUBECONFIG_PATH
    notes: "Needs a test cluster kubeconfig"

  mongodb:
    status: pending
    auth_type: api_key
    secret_ref: mcp-canary-mongodb-url
    env_var: MONGODB_CONNECTION_URL
    notes: "Needs a test MongoDB instance connection string"

  mysql:
    status: pending
    auth_type: api_key
    secret_ref: mcp-canary-mysql-url
    env_var: MYSQL_CONNECTION_URL
    notes: "Needs a test MySQL instance connection string"

  postgres:
    status: pending
    auth_type: api_key
    secret_ref: mcp-canary-postgres-url
    env_var: POSTGRES_CONNECTION_URL
    notes: "Needs a test PostgreSQL instance connection string"

  prisma:
    status: pending
    auth_type: dcr_oauth
    env_var: PRISMA_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  redis:
    status: pending
    auth_type: api_key
    secret_ref: mcp-canary-redis-url
    env_var: REDIS_URL
    notes: "Needs a test Redis instance connection string"

  resend:
    status: pending
    auth_type: api_key
    secret_ref: mcp-canary-resend-api-key
    env_var: RESEND_API_KEY
    notes: "Email sending service; needs API key from resend.com"

  sqlite:
    status: pending
    auth_type: api_key
    secret_ref: mcp-canary-sqlite-db-path
    env_var: SQLITE_DB_PATH
    notes: "Needs a local DB path; can use temp file in CI"

  terraform:
    status: pending
    auth_type: api_key
    secret_ref: mcp-canary-terraform-token
    env_var: TERRAFORM_CLOUD_TOKEN
    notes: "Needs Terraform Cloud API token"

  twilio:
    status: pending
    auth_type: api_key
    secret_ref: mcp-canary-twilio-credentials
    env_var: TWILIO_ACCOUNT_SID
    notes: "Needs account SID + auth token"

  # --- Header/config fix needed ---

  gitlab:
    status: header_fix_needed
    auth_type: api_key
    env_var: GITLAB_ACCESS_TOKEN
    notes: "Seedpack uses Authorization: Bearer but GitLab MCP expects PRIVATE-TOKEN header"
