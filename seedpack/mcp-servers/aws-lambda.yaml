apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: AWS Lambda
  visibility: visibility_public
  labels:
    stigmer.ai/category: "cloud-infrastructure"
spec:
  description: "AWS Lambda MCP server for invoking Lambda functions, listing deployments, and managing serverless workloads."
  icon_url: "https://upload.wikimedia.org/wikipedia/commons/9/93/Amazon_Web_Services_Logo.svg"
  repository_url: "https://github.com/awslabs/mcp"
  github_stars: 8732
  tags:
    - aws
    - lambda
    - serverless
    - cloud
  stdio:
    command: "uvx"
    args:
      - "awslabs.lambda-tool-mcp-server@latest"
  env:
    AWS_REGION:
      is_secret: false
      description: "AWS region for Lambda operations (e.g., us-east-1)"
    AWS_PROFILE:
      is_secret: false
      description: "AWS CLI profile name (default: default)"
      optional: true
