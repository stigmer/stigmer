apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-prisma
  visibility: visibility_public
  labels:
    stigmer.ai/category: "databases"
spec:
  description: "Prisma Postgres MCP server for querying databases, managing schemas, running migrations, and inspecting data models."
  repository_url: ""
  github_stars: 0
  tags:
    - prisma
    - postgresql
    - orm
    - database
  http:
    url: "https://mcp.prisma.io/mcp"
    headers:
      Authorization: "Bearer ${PRISMA_ACCESS_TOKEN}"
  env:
    PRISMA_ACCESS_TOKEN:
      is_secret: true
      description: "Prisma OAuth access token"
  auth:
    target_env_var: "PRISMA_ACCESS_TOKEN"
    token_lifetime_hint: "1h"
