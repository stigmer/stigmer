apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-supabase
  visibility: visibility_public
  labels:
    stigmer.ai/category: "databases"
spec:
  description: "Supabase MCP server for database management, schema operations, edge functions, and project administration."
  icon_url: "https://supabase.com/favicon/favicon-196x196.png"
  repository_url: "https://github.com/supabase-community/supabase-mcp"
  github_stars: 2598
  tags:
    - supabase
    - postgresql
    - database
    - backend-as-a-service
  http:
    url: "https://mcp.supabase.com/mcp"
    headers:
      Authorization: "Bearer ${SUPABASE_ACCESS_TOKEN}"
  env:
    SUPABASE_ACCESS_TOKEN:
      is_secret: true
      description: "Supabase personal access token (generate at supabase.com/dashboard/account/tokens)"
  auth:
    target_env_var: "SUPABASE_ACCESS_TOKEN"
    token_lifetime_hint: "1h"
