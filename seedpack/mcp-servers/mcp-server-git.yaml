apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-git
  visibility: visibility_public
  labels:
    stigmer.ai/category: "developer-tools"
spec:
  description: "Git MCP server for reading, searching, and analyzing local Git repositories including log, diff, blame, and branch operations."
  repository_url: "https://github.com/modelcontextprotocol/servers"
  github_stars: 83366
  tags:
    - git
    - version-control
    - repository
  stdio:
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-git"
