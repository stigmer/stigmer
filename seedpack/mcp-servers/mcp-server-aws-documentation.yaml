apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-aws-documentation
  visibility: visibility_public
  labels:
    stigmer.ai/category: "cloud-infrastructure"
spec:
  description: "AWS Documentation MCP server for searching and retrieving official AWS documentation, API references, and getting-started guides."
  repository_url: "https://github.com/awslabs/mcp"
  github_stars: 8732
  tags:
    - aws
    - documentation
    - cloud
    - reference
  stdio:
    command: "uvx"
    args:
      - "awslabs.aws-documentation-mcp-server@latest"
  env_spec:
    data:
      FASTMCP_LOG_LEVEL:
        is_secret: false
        description: "Log level for the MCP server (default: ERROR)"
