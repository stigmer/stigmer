apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: PayPal
  visibility: visibility_public
  labels:
    stigmer.ai/category: "payments"
spec:
  description: "PayPal MCP server for payment processing, invoicing, transaction management, and e-commerce operations. For testing against sandbox credentials, use the PayPal Sandbox server."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/paypal.svg"
  repository_url: "https://github.com/paypal/paypal-mcp-server"
  github_stars: 9
  tags:
    - paypal
    - payments
    - e-commerce
    - invoicing
  http:
    # Streamable HTTP endpoint. PayPal's quickstart still documents /sse and
    # /http, but the live server contradicts it (verified 2026-08-11): /http
    # returns 404, while /mcp answers with a spec-correct OAuth challenge
    # (RFC 9728 resource_metadata) and is the URL third-party MCP registries
    # list. /sse is the legacy transport our clients cannot use
    # (stigmer/stigmer#231; denylisted in mcp_servers_test.go).
    url: "https://mcp.paypal.com/mcp"
    headers:
      Authorization: "Bearer ${PAYPAL_ACCESS_TOKEN}"
  env:
    PAYPAL_ACCESS_TOKEN:
      is_secret: true
      description: "PayPal API key or OAuth access token (generate at developer.paypal.com/dashboard)"
  auth:
    target_env_var: "PAYPAL_ACCESS_TOKEN"
    token_lifetime_hint: "1h"
