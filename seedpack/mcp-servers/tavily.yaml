apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: Tavily
  visibility: visibility_public
  labels:
    stigmer.ai/category: "search"
spec:
  description: "Tavily MCP server for AI-optimized web search, content extraction, and research with structured results."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/tavily.svg"
  repository_url: "https://github.com/tavily-ai/tavily-mcp"
  github_stars: 1692
  tags:
    - tavily
    - search
    - web-search
    - research
  http:
    url: "https://mcp.tavily.com/mcp"
    headers:
      Authorization: "Bearer ${TAVILY_API_KEY}"
  env:
    TAVILY_API_KEY:
      is_secret: true
      description: "Tavily API key (get at tavily.com)"
  auth:
    target_env_var: "TAVILY_API_KEY"
