apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-filesystem
  visibility: visibility_public
  labels:
    stigmer.ai/category: "developer-tools"
spec:
  description: "Filesystem MCP server for secure file operations with configurable access controls, including read, write, search, and directory management."
  repository_url: "https://github.com/modelcontextprotocol/servers"
  github_stars: 83366
  tags:
    - filesystem
    - files
    - directory
  stdio:
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "${FILESYSTEM_ALLOWED_DIR}"
  env_spec:
    data:
      FILESYSTEM_ALLOWED_DIR:
        is_secret: false
        description: "Root directory the server is allowed to access (e.g., /home/user/projects)"
