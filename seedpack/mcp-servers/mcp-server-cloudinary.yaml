apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-cloudinary
  visibility: visibility_public
  labels:
    stigmer.ai/category: "developer-tools"
spec:
  description: "Cloudinary MCP server for managing digital assets, uploading images and videos, applying transformations, and optimizing media delivery."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/cloudinary.svg"
  repository_url: "https://github.com/cloudinary/mcp-servers"
  github_stars: 8
  tags:
    - cloudinary
    - asset-management
    - image-optimization
    - media
  http:
    url: "https://asset-management.mcp.cloudinary.com/mcp"
    headers:
      Authorization: "Bearer ${CLOUDINARY_ACCESS_TOKEN}"
  env:
    CLOUDINARY_ACCESS_TOKEN:
      is_secret: true
      description: "Cloudinary OAuth access token"
  auth:
    target_env_var: "CLOUDINARY_ACCESS_TOKEN"
    token_lifetime_hint: "1h"
