apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: Context7
  visibility: visibility_public
  labels:
    stigmer.ai/category: "developer-tools"
spec:
  description: "Context7 MCP server for fetching up-to-date, version-specific library documentation and code examples directly into agent context."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/context7.svg"
  repository_url: "https://github.com/upstash/context7"
  github_stars: 53500
  tags:
    - context7
    - documentation
    - code-docs
    - library-docs
  http:
    url: "https://mcp.context7.com/mcp"
    headers:
      CONTEXT7_API_KEY: "${CONTEXT7_API_KEY}"
  env:
    CONTEXT7_API_KEY:
      is_secret: true
      optional: true
      description: "Context7 API key for higher rate limits (free at context7.com/dashboard)"
