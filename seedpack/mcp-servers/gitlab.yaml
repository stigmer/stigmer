apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: GitLab
  visibility: visibility_public
  labels:
    stigmer.ai/category: "developer-tools"
spec:
  description: "GitLab MCP server for project management, merge requests, pipelines, issues, and code review workflows."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/gitlab.svg"
  repository_url: "https://gitlab.com"
  github_stars: 0
  tags:
    - gitlab
    - git
    - version-control
    - code-review
    - ci-cd
  http:
    url: "https://gitlab.com/api/v4/mcp"
    headers:
      Authorization: "Bearer ${GITLAB_ACCESS_TOKEN}"
  env:
    GITLAB_ACCESS_TOKEN:
      is_secret: true
      description: "GitLab personal access token or OAuth token (requires Premium or Ultimate tier)"
  auth:
    target_env_var: "GITLAB_ACCESS_TOKEN"
    token_lifetime_hint: "2h"
    scope_hints:
      - "read_api"
      - "api"
