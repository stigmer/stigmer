apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-aws-cdk
  visibility: visibility_public
  labels:
    stigmer.ai/category: "cloud-infrastructure"
spec:
  description: "AWS CDK MCP server for infrastructure-as-code assistance with AWS Cloud Development Kit constructs, patterns, and best practices."
  icon_url: "https://upload.wikimedia.org/wikipedia/commons/9/93/Amazon_Web_Services_Logo.svg"
  repository_url: "https://github.com/awslabs/mcp"
  github_stars: 8732
  tags:
    - aws
    - cdk
    - infrastructure-as-code
    - cloud
  stdio:
    command: "uvx"
    args:
      - "awslabs.cdk-mcp-server@latest"
  env:
    FASTMCP_LOG_LEVEL:
      is_secret: false
      description: "Log level for the MCP server (default: ERROR)"
      optional: true
