apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: Cloudflare
  visibility: visibility_public
  labels:
    stigmer.ai/category: "cloud-infrastructure"
spec:
  description: "Cloudflare MCP server for managing Workers, KV, R2, D1, and other Cloudflare developer platform services."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/cloudflare.svg"
  repository_url: "https://github.com/cloudflare/mcp"
  github_stars: 3596
  tags:
    - cloudflare
    - cloud
    - workers
    - edge-computing
  http:
    url: "https://mcp.cloudflare.com/mcp"
    headers:
      Authorization: "Bearer ${CLOUDFLARE_ACCESS_TOKEN}"
  env:
    CLOUDFLARE_ACCESS_TOKEN:
      is_secret: true
      description: "Cloudflare OAuth access token (obtained via Connect or at dash.cloudflare.com/profile/api-tokens)"
  auth:
    target_env_var: "CLOUDFLARE_ACCESS_TOKEN"
    token_lifetime_hint: "1h"
