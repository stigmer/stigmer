apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-brave-search
  visibility: visibility_public
  labels:
    stigmer.ai/category: "search"
spec:
  description: "Brave Search MCP server for web search, local business search, image search, video search, news, and AI-powered summarization."
  repository_url: "https://github.com/brave/brave-search-mcp-server"
  github_stars: 888
  tags:
    - brave
    - search
    - web-search
  stdio:
    command: "npx"
    args:
      - "-y"
      - "@brave/brave-search-mcp-server"
  env_spec:
    data:
      BRAVE_API_KEY:
        is_secret: true
        description: "Brave Search API key (free tier: 2,000 queries/month at brave.com/search/api)"
