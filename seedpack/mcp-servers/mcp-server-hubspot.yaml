apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-hubspot
  visibility: visibility_public
  labels:
    stigmer.ai/category: "crm-support"
spec:
  description: "HubSpot MCP server for CRM operations, contact management, deal tracking, marketing automation, and sales pipeline workflows."
  repository_url: ""
  github_stars: 0
  tags:
    - hubspot
    - crm
    - marketing
    - sales
  http:
    url: "https://app.hubspot.com/mcp/v1/http"
    headers:
      Authorization: "Bearer ${HUBSPOT_ACCESS_TOKEN}"
  env:
    HUBSPOT_ACCESS_TOKEN:
      is_secret: true
      description: "HubSpot private app access token (generate at app.hubspot.com > Settings > Integrations > Private Apps)"
