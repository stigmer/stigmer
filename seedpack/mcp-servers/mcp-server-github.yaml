apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-github
  visibility: visibility_public
  labels:
    stigmer.ai/category: "developer-tools"
spec:
  description: "GitHub MCP server for repository management, code search, issue and PR workflows, branch operations, and team collaboration."
  repository_url: "https://github.com/github/github-mcp-server"
  github_stars: 28600
  tags:
    - github
    - git
    - version-control
    - code-review
  stdio:
    command: "go"
    args:
      - "run"
      - "github.com/github/github-mcp-server/cmd/github-mcp-server@latest"
      - "stdio"
  env_spec:
    data:
      GITHUB_PERSONAL_ACCESS_TOKEN:
        is_secret: true
        description: "GitHub personal access token with repo, issues, and pull request scopes"
