apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mcp-server-github
  visibility: visibility_public
  labels:
    stigmer.ai/category: "developer-tools"
spec:
  description: "GitHub MCP server for repository management, code search, issue and PR workflows, branch operations, and team collaboration."
  icon_url: "https://raw.githubusercontent.com/stigmer/stigmer/main/seedpack/icons/mcp-servers/github.svg"
  repository_url: "https://github.com/github/github-mcp-server"
  github_stars: 28600
  tags:
    - github
    - git
    - version-control
    - code-review
  http:
    url: "https://api.githubcopilot.com/mcp/"
    headers:
      Authorization: "Bearer ${GITHUB_ACCESS_TOKEN}"
  env:
    GITHUB_ACCESS_TOKEN:
      is_secret: true
      description: "GitHub OAuth token or personal access token (generate at github.com/settings/tokens)"
  auth:
    oauth_app_ref:
      org: stigmer
      kind: oauth_app
      slug: github-oauth
    target_env_var: "GITHUB_ACCESS_TOKEN"
    token_lifetime_hint: "8h"
    scope_hints:
      - "repo"
      - "read:org"
      - "read:user"
