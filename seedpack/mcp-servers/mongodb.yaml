apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: mongodb
  visibility: visibility_public
  labels:
    stigmer.ai/category: "database"
  tags:
    - mongodb
    - nosql
    - database
    - atlas
spec:
  description: "MongoDB database queries, aggregation pipelines, index management, and Atlas cluster administration."
  icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/mongodb/mongodb-original.svg"
  stdio:
    command: "npx"
    args:
      - "-y"
      - "mongodb-mcp-server"
  env_spec:
    data:
      MDB_MCP_CONNECTION_STRING:
        is_secret: true
        description: "MongoDB connection URI (e.g., mongodb+srv://user:pass@cluster.mongodb.net/dbname). Create at https://cloud.mongodb.com under Database > Connect."
      MDB_MCP_READ_ONLY:
        is_secret: false
        description: "Set to 'true' to restrict to read-only operations (recommended). Omit or set 'false' for full read/write access."
  default_tool_approvals:
    - tool_name: "drop-database"
      message: "Drop database {{args.database}}"
    - tool_name: "drop-collection"
      message: "Drop collection {{args.collection}} in {{args.database}}"
    - tool_name: "delete-many"
      message: "Delete documents from {{args.collection}}"
