# Credential Manifest for MCP Seedpack Canary Tests
#
# Tracks which MCP servers have credentials provisioned for automated
# canary testing. CI reads this file to determine which canary tests to run.
#
# Status values:
#   not_required  - Server has no secret env vars; canary tests run without credentials
#   provisioned   - Credentials stored in Planton secrets; canary tests enabled
#   pending       - Needs human to provision credentials (new server or expired token)
#   oauth_only    - Requires browser-based OAuth; manual token acquisition needed
#   header_fix_needed - Seedpack YAML has wrong auth config; fix before testing
#
# Auth types:
#   none          - No credentials needed
#   api_key       - Static API key or token (Bearer header or env var)
#   vendor_oauth  - OAuth via pre-registered OAuthApp (oauth_app_ref set)
#   dcr_oauth     - MCP Authorization spec (DCR + PKCE, no oauth_app_ref)
#
# When adding a new server, use @add-mcp-server-to-seedpack rule.

servers:

  # --- Built-in ---

  stigmer:
    status: pending
    auth_type: api_key
    notes: "Built-in Stigmer MCP at mcp.stigmer.ai. Client supplies a Bearer token (stk_ API key or org IdP access token); no shared canary credential is provisioned."

  # --- Credentials provisioned (from team spreadsheet) ---

  atlassian:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-atlassian-api-token
    env_var: ATLASSIAN_ACCESS_TOKEN

  brevo:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-brevo-mcp-token
    env_var: BREVO_MCP_TOKEN

  cloudflare:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-cloudflare-token
    env_var: CLOUDFLARE_ACCESS_TOKEN

  cloudinary:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-cloudinary-token
    env_var: CLOUDINARY_ACCESS_TOKEN

  github:
    status: provisioned
    auth_type: vendor_oauth
    secret_ref: mcp-canary-github-token
    env_var: GITHUB_ACCESS_TOKEN
    notes: "Pre-acquired PAT used in lieu of full OAuth flow"

  google-maps:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-google-maps-api-key
    env_var: GOOGLE_MAPS_API_KEY

  linear:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-linear-api-key
    env_var: LINEAR_ACCESS_TOKEN

  neon:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-neon-api-key
    env_var: NEON_API_KEY

  pagerduty:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-pagerduty-token
    env_var: PAGERDUTY_API_TOKEN

  sentry:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-sentry-auth-token
    env_var: SENTRY_AUTH_TOKEN

  stripe:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-stripe-token
    env_var: STRIPE_ACCESS_TOKEN

  tavily:
    status: provisioned
    auth_type: api_key
    secret_ref: mcp-canary-tavily-api-key
    env_var: TAVILY_API_KEY

  # --- OAuth-only (requires browser-based authorization) ---

  attio:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: ATTIO_ACCESS_TOKEN
    notes: "Provider endpoint requires OAuth; API key rejected"

  buildkite:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: BUILDKITE_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  canva:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: CANVA_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  contentful:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: CONTENTFUL_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  figma:
    status: oauth_only
    auth_type: vendor_oauth
    env_var: FIGMA_ACCESS_TOKEN
    notes: "OAuth app pending vendor approval"

  hubspot:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: HUBSPOT_ACCESS_TOKEN
    notes: "Requires OAuth 2.1 with PKCE; personal keys rejected"

  intercom:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: INTERCOM_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  monday:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: MONDAY_ACCESS_TOKEN
    notes: "OAuth 2.0 Authorization Code Grant required; personal tokens rejected. Token sent as Authorization: Bearer. Seedpack declares auth.oauth_only=true so the connect UI hides manual token entry."

  netlify:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: NETLIFY_ACCESS_TOKEN
    notes: "Rejects tokens with 'Invalid JWE token'; expects MCP protocol OAuth"

  notion:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: NOTION_ACCESS_TOKEN
    notes: "Hosted endpoint requires OAuth 2.0 + PKCE and rejects internal integration tokens (local npm server accepts them). Seedpack declares auth.oauth_only=true so the connect UI hides manual token entry."

  paypal:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: PAYPAL_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  slack:
    status: oauth_only
    auth_type: vendor_oauth
    env_var: SLACK_ACCESS_TOKEN
    notes: "OAuth app pending vendor approval"

  square:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: SQUARE_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  supabase:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: SUPABASE_ACCESS_TOKEN
    notes: "Fails with UnicodeEncodeError; OAuth required"

  webflow:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: WEBFLOW_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  wix:
    status: oauth_only
    auth_type: dcr_oauth
    env_var: WIX_ACCESS_TOKEN
    notes: "Provider endpoint requires OAuth; API key may not work"

  # --- Pending credential provisioning ---

  context7:
    status: pending
    auth_type: api_key
    secret_ref: mcp-canary-context7-api-key
    env_var: CONTEXT7_API_KEY
    notes: "API key is optional for this server"

  datadog:
    status: pending
    auth_type: api_key
    secret_ref: mcp-canary-datadog-token
    env_var: DATADOG_ACCESS_TOKEN
    notes: "Blocked: verification email not received from Datadog"

  prisma:
    status: pending
    auth_type: dcr_oauth
    env_var: PRISMA_ACCESS_TOKEN
    notes: "Hosted endpoint likely OAuth-only; untested"

  # --- Header/config fix needed ---

  gitlab:
    status: header_fix_needed
    auth_type: api_key
    env_var: GITLAB_ACCESS_TOKEN
    notes: "Seedpack uses Authorization: Bearer but GitLab MCP expects PRIVATE-TOKEN header"
