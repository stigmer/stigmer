[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stigmer-sdk"
version = "0.0.0.dev0"
description = "Python client for Stigmer, the open-source backend for the agents in your product"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Stigmer", email = "engineering@stigmer.ai" }]
keywords = ["stigmer", "sdk", "api-client", "grpc", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=6.32.0",
    "stigmer-apis>=0.1.0",
]

[project.urls]
Homepage = "https://stigmer.ai"
Repository = "https://github.com/stigmer/stigmer"
Documentation = "https://stigmer.ai/docs/sdk/python"

[tool.hatch.build.targets.wheel]
packages = ["src/stigmer"]
