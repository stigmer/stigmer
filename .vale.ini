StylesPath = vale/styles
MinAlertLevel = warning

Packages = Google, Microsoft, alex
Vocab = Stigmer

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Google, Microsoft, alex, Stigmer

; Disabled rules — same proven baseline as Temporal docs
Microsoft.Contractions = NO
Microsoft.Headings = NO
Microsoft.Passive = NO
Microsoft.Spacing = NO
Google.Spacing = NO
Microsoft.We = NO
Google.Will = NO
Google.WordList = NO
alex.ProfanityUnlikely = NO

; Disabled rules — Stigmer domain conflicts
Google.Headings = NO
Microsoft.Terms = NO
Microsoft.Avoid = NO
Microsoft.HeadingPunctuation = NO
; Developer docs use standard acronyms (API, MCP, YAML, RAG) in headings freely
Microsoft.HeadingAcronyms = NO
; Prerequisite/label patterns like **Time**: ~5 minutes are intentional
Google.Colons = NO
; "URL" is universal terminology in developer documentation
Microsoft.GeneralURL = NO

; Disabled rules — MDX/JSX false positives
; JSX attributes like items={["A", "B"]} trigger quotes-punctuation rules
Google.Quotes = NO
Microsoft.Quotes = NO
; Spaced em-dashes (` — `) are an intentional style choice in these docs
Microsoft.Dashes = NO
Google.EmDash = NO
; Strip JSX/HTML tags so attribute values like groupId="sdk-language" are not linted
TokenIgnores = (<[A-Za-z][A-Za-z0-9]*\b[^>]*?>)
; Skip multiline JSX component blocks where attribute values (URL slugs, etc.)
; trigger false positives — the single-line TokenIgnores cannot handle these
BlockIgnores = (?s)<Cards>.*?</Cards>

; Auto-generated CLI reference — content is extracted verbatim from Go source
; code. Style issues in command descriptions should be fixed in the CLI source,
; not in the documentation layer. Only inclusive-language checks (alex) remain.
[docs/cli/commands/**/*.{md,mdx}]
BasedOnStyles = alex
alex.ProfanityMaybe = NO
alex.Condescending = NO

; Auto-generated SDK reference — content is derived from proto comments via
; stigmer-codegen and the React SDK docs generator. Style issues should be
; fixed in the source, not in the generated docs. Only inclusive-language
; checks (alex) remain, minus rules that fire on standard technical vocabulary
; (disabled, invalid, primitive, mental model).
[docs/sdk/**/*.{md,mdx}]
BasedOnStyles = alex
alex.ProfanityMaybe = NO
alex.Condescending = NO
alex.Ablist = NO
alex.Race = NO

; Archived content — excluded from linting
[docs/_archive/**/*.{md,mdx}]
