extends: substitution
message: Use '%s' instead of '%s' when referring to a Stigmer term.
level: warning
ignorecase: false
action:
  name: replace
# Capitalization and the edition names. Former names live in FormerNames.yml,
# at error level, so a former name fails the build instead of warning.
swap:
  # --- Agentic pillar ---
  '\bagent\b': Agent
  agent instance: Agent Instance
  agent runner: Agent Runner
  mcp server: MCP server
  mcp servers: MCP servers
  '\bsession\b': Session
  '\bsessions\b': Sessions
  '\bskill\b': Skill
  '\bskills\b': Skills
  # Claude Code's and Claude Managed Agents' word: lowercase, one word
  # ("Subagent" only to start a sentence).
  '\b[Ss]ub-[Aa]gent\b': subagent
  '\b[Ss]ub-[Aa]gents\b': subagents

  # --- Platform pillar ---
  api key: API Key
  api keys: API Keys
  federation issuer: Federation Issuer
  federation issuers: Federation Issuers
  identity account: Identity Account
  '\borganization\b': Organization
  '\borganizations\b': Organizations
  '\bseedpack\b': Seedpack
  '\bseedpacks\b': Seedpacks
  '\bworkspace\b': Workspace
  '\bworkspaces\b': Workspaces

  # --- Infrastructure ---
  durable execution: Durable Execution
  stigmer server: Stigmer Server

  # --- Editions and plans ---
  # The three editions are names: Stigmer (open source), Stigmer Enterprise,
  # Stigmer Cloud. Cloud's top plan is "Enterprise Cloud", never "Enterprise",
  # which is the self-hosted edition.
  '\bStigmer enterprise\b': Stigmer Enterprise
  '\bStigmer cloud\b': Stigmer Cloud
  '\bEnterprise plan\b': Enterprise Cloud plan

  # --- Common corrections ---
  grpc: gRPC
  Grpc: gRPC
  GRPC: gRPC
  id: ID
  ids: IDs
