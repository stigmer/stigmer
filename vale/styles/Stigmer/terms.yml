extends: substitution
message: Use '%s' instead of '%s' when referring to a Stigmer term.
level: warning
ignorecase: false
action:
  name: replace
swap:
  # --- Agentic pillar ---
  '\bagent\b': Agent
  # Former names of a run; the engine's own words stay in code spans. A bare
  # "run" gets no rule of its own: it is also a verb ("let the agent run").
  '\bAgent Run\b': run
  '\bAgent Runs\b': runs
  '\bagent execution\b': run
  '\bagent executions\b': runs
  '\bAgent Execution\b': run
  '\bAgent Executions\b': runs
  agent instance: Agent Instance
  agent runner: Agent Runner
  execution context: Execution Context
  mcp server: MCP Server
  mcp servers: MCP Servers
  '\bsession\b': Session
  '\bsessions\b': Sessions
  '\bskill\b': Skill
  '\bskills\b': Skills
  sub-agent: Sub-Agent
  sub-agents: Sub-Agents
  subagent: Sub-Agent
  subagents: Sub-Agents

  # --- Platform pillar ---
  api key: API Key
  api keys: API Keys
  iam policy: IAM Policy
  identity account: Identity Account
  identity provider: Identity Provider
  '\borganization\b': Organization
  '\borganizations\b': Organizations
  '\bseedpack\b': Seedpack
  '\bseedpacks\b': Seedpacks
  '\bworkspace\b': Workspace
  '\bworkspaces\b': Workspaces

  # --- Infrastructure ---
  durable execution: Durable Execution
  stigmer server: Stigmer Server

  # --- Common corrections ---
  grpc: gRPC
  Grpc: gRPC
  GRPC: gRPC
  id: ID
  ids: IDs
