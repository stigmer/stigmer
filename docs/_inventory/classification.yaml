# The docs inventory classification — the source of truth for every page's
# fate, kind and medium.
#
# One entry per hand-authored page, keyed by extension-less docs-relative
# path (the docs root is "index"). Generated pages are covered by the
# `cohorts` rules at the bottom; their classification belongs to the
# generator, never the page.
#
# Fields per page:
#   fate      keep | split | archive | delete | move:<path> | merge:<path>
#             The PLAN for the page. Executing a fate removes or re-keys
#             the entry in the same commit; git history is the record.
#   diataxis  tutorial | how-to | explanation | reference | landing
#   teaches   One sentence: what the reader walks away knowing or having done.
#   medium    none | diagram | still | screenshot-journey | animated-tour |
#             interactive — the page's TARGET demonstration centerpiece.
#             Prose and code are the substrate of every page, not a
#             medium. `still` and `screenshot-journey` are never
#             hand-captured screenshots (see docs/STYLE.md, "Classify every
#             page").
#   why       Rationale, required by the gate for a non-"none" medium (why
#             that centerpiece) and for a non-"keep" fate (why the page
#             doesn't survive as-is) — one sentence each when both apply.
#
# Enforced by `make check-docs-inventory` (ci.docs): every hand-authored
# page on disk needs an entry, and every entry needs a live page.

pages:
  # ── Docs root ──────────────────────────────────────────────────────────
  index:
    fate: keep
    diataxis: landing
    teaches:
      Stigmer's headline and subhead, and the path from a first agent job to
      putting it in your product or running it on your servers.
    medium: animated-tour
    why:
      The hero exists to show the product working; motion is the pitch. The
      quickstart is the first thing a reader does, so the hero shows it.

  # ── Get Started ────────────────────────────────────────────────────────
  concepts/what-is-stigmer:
    fate: keep
    diataxis: explanation
    teaches:
      That Stigmer is the open-source backend for the agents in your product,
      what each customer's agent has, one job told through the pieces in the
      sidebar's order, and how it differs from a model API, an agent framework
      and Claude Managed Agents.
    medium: diagram
    why:
      Where Stigmer sits between your app and your model provider is structure;
      one diagram of the job's path carries it.

  getting-started/quickstart:
    fate: keep
    diataxis: tutorial
    teaches:
      Start Stigmer on your machine or on Stigmer Cloud with your model key,
      apply an Agent, give it a customer's ledger and get its variance report
      back as a file.
    medium: none

  getting-started/call-from-your-app:
    fate: keep
    diataxis: tutorial
    teaches:
      Run the same job from TypeScript, uploading the ledger, starting the turn
      with sendAndWait, listing the turn's Files by its run and saving the
      report.
    medium: none

  getting-started/embed-agent:
    fate: keep
    diataxis: tutorial
    teaches:
      Mint a user token from your backend with a service account's key, and give
      the signed-in user a pinned-Agent chat with file uploads through
      NewSessionViewer and SessionViewer in a React app.
    medium: animated-tour
    why:
      The payoff is the chat streaming inside a third-party product; the motion
      is the demonstration (a deliberate deviation from the screenshot-journey
      default for getting-started pages, 2026-08-23).

  getting-started/one-organization-per-customer:
    fate: keep
    diataxis: tutorial
    teaches:
      Share an Agent with child organizations, create a child organization per
      customer, and mint each customer's users into their own.
    medium: none

  concepts/coming-from-claude-managed-agents:
    fate: keep
    diataxis: explanation
    teaches:
      Each Claude Managed Agents idea mapped to its Stigmer counterpart, or to
      none where Stigmer has none, what carries over in your code, and what
      Stigmer adds.
    medium: none

  # ── How it works ───────────────────────────────────────────────────────
  concepts/agents:
    fate: keep
    diataxis: explanation
    teaches:
      An Agent is a secret-free, versioned YAML blueprint that a Session names
      directly and each run runs.
    medium: still
    why:
      The prose says "here's how this Agent looks in the console" — one frame
      answers that; nothing needs to move.

  concepts/environments:
    fate: keep
    diataxis: explanation
    teaches:
      An Environment is a named setup for the sandboxes Agents run in, its
      packages and its network; which one a conversation gets and in what order,
      who creates and who uses one, when packages install and when an edit takes
      effect, what a blocked website looks like, the package registries and code
      hosts, what each kind of server can do, deleting one, and how it compares
      with Claude Managed Agents' environments.
    medium: none

  guides/environments/set-up-an-environment:
    fate: keep
    diataxis: how-to
    teaches:
      Create an Environment from the console or a manifest, make it an Agent's
      or the Organization's default, name one for a conversation, check which
      one a conversation got, and fix each refusal the server gives.
    medium: screenshot-journey
    why:
      A console procedure from the Environments list to a conversation's Setup
      tab.

  concepts/sessions:
    fate: keep
    diataxis: explanation
    teaches:
      A Session is one piece of work an Agent does for someone, keeping the
      computer its Agent works on, an ordered log of events and its files; it
      names its Agent, runs the version it started on until updated, re-checks
      run permission on every message, locks a Harness, and can override Skills
      and tools and name the Environment its sandbox runs in.
    medium: diagram
    why:
      The lifecycle (Agent to Session to runs) is structure; the existing
      mermaid carries it.

  concepts/files:
    fate: keep
    diataxis: explanation
    teaches:
      A File is a file uploaded once and named by its id; how a file reaches the
      Agent (sent with a message, held by a conversation, named by a routine),
      what the model sees, the uploads and outputs folders and why they sit in
      the platform folder, what comes back, who sees a File and when it goes,
      and how it compares with Claude's Files API and Managed Agents.
    medium: none

  concepts/vaults:
    fate: keep
    diataxis: explanation
    teaches:
      What a vault holds (secrets by name, logins by address), My vault and
      shared vaults with Can use, which vaults a run uses and in what order, how
      a key is matched, the refusal at create, when the values are read, a
      repository's own token, and Connect links.
    medium: none

  # ── What an agent can do ───────────────────────────────────────────────
  concepts/skills:
    fate: keep
    diataxis: explanation
    teaches:
      A Skill is a folder of instructions an Agent reads when a job calls for
      it, a SKILL.md directory whose frontmatter description is the trigger
      condition, attachable to Agents and Sessions.
    medium: still
    why:
      The Skill detail page shown next to its source makes the split visible; a
      single frame is the honest medium for a static screen.

  concepts/plugins:
    fate: keep
    diataxis: explanation
    teaches:
      A plugin is one package of Skills, MCP servers, hooks and subagents in the
      Claude Code, Cursor and Codex format, its parts named after it, turned on
      for one chat or listed on an Agent, and the three places Stigmer differs.
    medium: none

  guides/plugins/install-a-plugin:
    fate: keep
    diataxis: how-to
    teaches:
      Validate a Cursor, Claude Code, Codex or Agent Plugins folder offline,
      install it as one resource, use it whole from a chat or an Agent's
      `plugins`, upgrade it by pushing again, and know that its `ai.stigmer/`
      folder is not read.
    medium: none

  guides/plugins/install-from-a-marketplace:
    fate: keep
    diataxis: how-to
    teaches:
      Install a plugin from Stigmer's official catalogue and read what it leaves
      to do, add your own plugin marketplace, see what it offers, install a
      plugin from it by name, and understand what the server does and does not
      record about where a plugin came from.
    medium: none

  guides/plugins/install-from-the-console:
    fate: keep
    diataxis: how-to
    teaches:
      Find a plugin in the Marketplace (the official catalogue and one you add)
      or upload a plugin folder or zip from your computer, in the web console or
      the desktop app; understand what the preview states before the act (what
      installs, its hooks, already installed, upgrade); sign in to the plugin's
      MCP servers and check their tools from the plugin's page; read its hooks;
      start a chat with it or add it to an agent.
    medium: none
    why:
      A console how-to is a screenshot journey; the tour follows when the
      Marketplace and the upload path have settled, and the words here already
      match the CLI's.

  guides/plugins/use-hooks:
    fate: keep
    diataxis: how-to
    teaches:
      Install a plugin whose hooks guard tool calls, read every command its
      hooks run and the ones Stigmer does not run, switch the hooks on by
      listing the plugin on an agent or a chat, write hooks in an agent, remove
      a plugin an agent uses, and what differs from Claude Code.
    medium: none

  guides/plugins/marketplace-file:
    fate: keep
    diataxis: reference
    teaches:
      The four marketplace file locations Stigmer reads, the one shape they
      reduce to, what makes an entry installable, and the two error postures.
    medium: none

  concepts/tools:
    fate: split
    diataxis: explanation
    teaches:
      How MCP servers reach an Agent in a plugin or in the Agent's own
      mcp_servers, how they are added, authenticated and sandboxed, how their
      tools are named and listed, and how Agents and Sessions use them.
    medium: animated-tour
    why:
      A tool call firing, streaming results, and returning to the conversation
      is a sequence that must be seen once. Split because the page mixes
      concept, marketplace pitch, connect procedure, and auth patterns that
      guides/integrations already owns.

  guides/integrations/overview:
    fate: keep
    diataxis: landing
    teaches:
      Which of the four integration sub-guides to read and what to know first.
    medium: none

  guides/integrations/connect-an-mcp-server:
    fate: keep
    diataxis: how-to
    teaches:
      How to add an MCP server by its address as a plugin of one server, sign in
      to it, list its tools and which ask first, and use it in a chat or an
      Agent; and how to give one Agent a server of its own in one call.
    medium: animated-tour
    why:
      Adding a server, signing in and checking its tools is a sequence the
      reader must see once to trust.

  guides/integrations/oauth-for-tools:
    fate: keep
    diataxis: how-to
    teaches:
      How a URL-only server is recognized as one you sign in to at install, how
      a person signs in once from the plugin's page or the CLI, and how the
      login is kept and refreshed.
    medium: animated-tour
    why:
      The popup authorize round-trip and the row flipping to Signed in is a
      sequence; the timing is the lesson.

  guides/integrations/oauth-architecture:
    fate: keep
    diataxis: explanation
    teaches:
      The internals behind OAuth tool connections — how the login for an address
      is found, credential storage, refresh mechanics.
    medium: diagram
    why:
      Backend resolution chains and credential flows are structure; the page's
      three diagrams already carry it.

  guides/integrations/bring-your-own-oauth:
    fate: keep
    diataxis: how-to
    teaches:
      When and how to add your Organization's own OAuth app for the addresses it
      signs in to.
    medium: screenshot-journey
    why:
      The most console-centric integrations page — a form procedure quoted by
      exact UI labels, read at the reader's pace.

  guides/integrations/model-provider-keys:
    fate: keep
    diataxis: how-to
    teaches:
      Add your Organization's own Anthropic or OpenAI key on Stigmer Cloud, an
      LLM key optionally on your own compatible endpoint, and the rules a key
      and its base URL follow.
    medium: none

  guides/integrations/caller-identity-for-mcp-servers:
    fate: keep
    diataxis: how-to
    teaches:
      Template the reserved caller-identity variables into a plugin's MCP server
      headers so the server receives the platform-verified caller, handle the
      anonymous tool-listing context, and pair the header with a shared secret.
    medium: none

  guides/editors/connect-mcp:
    fate: keep
    diataxis: how-to
    teaches:
      Register the hosted Stigmer MCP endpoint in Claude Desktop, Claude Code,
      or Cursor and verify the connection.
    medium: none

  concepts/approval-flows:
    fate: keep
    diataxis: explanation
    teaches:
      How to make specific tool calls pause for a human, at which of four layers
      to configure it, and what each decision does.
    medium: animated-tour
    why:
      The pause-then-resume beat IS the concept — the agent stops mid-run and a
      human decision resumes it; motion carries the cause-and-effect.

  concepts/scores:
    fate: keep
    diataxis: explanation
    teaches:
      A Score records how good a finished run was, as a person's thumbs with a
      comment, the three free run-health checks with their reasons, or an AI
      judge's verdict on four standard rubrics, switched on per Agent with a
      sample rate and a monthly limit in its Quality tab, or an eval run's
      checks on one try, and the not-graded state; whoever sees the run sees its
      scores, read with `stigmer runs scores`.
    medium: none

  guides/evals/test-with-evals:
    fate: keep
    diataxis: how-to
    teaches:
      Keep an agent's test cases as an eval and push its versions; run evals and
      the cases of the plugins an agent uses on the agent, from the console or
      the CLI; compare the agent with and without a plugin, and test a plugin on
      its own; read the table, the exit codes and the result file; know what
      runs, what differs from Claude Code, who sees an eval run and who pays;
      and turn a conversation that went wrong into a case.
    medium: none

  # ── Reach an agent ─────────────────────────────────────────────────────
  concepts/channels:
    fate: keep
    diataxis: explanation
    teaches:
      A channel is one way people reach one Agent (a chat link, Slack or
      WhatsApp); what every channel carries, who creates one and who reads its
      conversations, why a channel is not sharing, and how it compares with
      Azure Bot Service.
    medium: none

  guides/channels/create-a-chat-link:
    fate: keep
    diataxis: how-to
    teaches:
      Create and manage hosted chat links for an Agent — audience, who pays,
      visitor messages, embedding, and credentials.
    medium: screenshot-journey
    why: A console procedure across the chat link dialog's tabs.

  guides/channels/embed-an-agent:
    fate: keep
    diataxis: how-to
    teaches:
      Drop the stigmer-agent web component onto a site, size and theme it,
      restrict origins, and pass per-user session context.
    medium: still
    why:
      The page documents a rendered widget the reader currently never sees; one
      frame of the widget on a host page shows the outcome.

  guides/channels/connect-slack:
    fate: keep
    diataxis: how-to
    teaches:
      Install an Agent into a Slack workspace through the platform app, bind
      credentials, and operate the channel afterward.
    medium: screenshot-journey
    why:
      A multi-screen console procedure (channel wizard, consent, channel card)
      the reader performs step by step.

  guides/channels/connect-whatsapp:
    fate: keep
    diataxis: how-to
    teaches:
      Bind an Agent to a WhatsApp Business number through your own Meta app and
      operate the channel afterward.
    medium: screenshot-journey
    why:
      Same procedural shape as the Slack twin — console screens the reader
      follows at their own pace.

  guides/channels/bring-your-own-slack-app:
    fate: keep
    diataxis: how-to
    teaches:
      Register your own Slack app as a Channel App so the bot carries your
      branding and multiple Agents can serve one workspace.
    medium: screenshot-journey
    why:
      The Stigmer-side screens (Settings, Channel Apps, register form) are
      depictable stills; Slack's own screens stay prose — we depict only our
      product.

  guides/channels/send-proactive-messages-with-templates:
    fate: keep
    diataxis: how-to
    teaches:
      Enable proactive messaging on a WhatsApp channel, author an approved
      template in WhatsApp Manager, and have the Agent send reminders and
      invoices with it.
    medium: none

  guides/channels/set-up-your-meta-app:
    fate: keep
    diataxis: how-to
    teaches:
      The full Meta prerequisite chain — WABA, app, permanent token, Channel App
      registration, webhook verification.
    medium: none

  guides/channels/take-over-conversations:
    fate: keep
    diataxis: how-to
    teaches:
      Watch customer conversations in the console's Conversations area, take one
      over, reply through the channel's number, hand it back, and answer an
      Agent escalation.
    medium: screenshot-journey
    why:
      A console procedure the reader follows at their own pace — the
      Conversations inbox, timeline, and banners are depictable stills (the
      connect-guide precedent); the page ships prose-only until the stills are
      rendered.

  concepts/routines:
    fate: keep
    diataxis: explanation
    teaches:
      A routine is a saved Agent invocation that starts on its schedule, by Run
      now or from another system's call with a note; who it acts as, who may
      start it and read its conversations by edition, the Environment its runs
      use, off versus paused, and how it compares with Claude Code's routines
      and Managed Agents' scheduled deployments.
    medium: none

  guides/routines/run-an-agent-on-a-schedule:
    fate: keep
    diataxis: how-to
    teaches:
      Make a routine that runs an Agent on a schedule, from the console or a
      manifest; test it with Run now, read who started each run, turn it off,
      resume it after a pause, and pin the Agent's version.
    medium: screenshot-journey
    why: A console procedure from the routine list to the routine's history.

  guides/routines/start-a-routine-from-another-system:
    fate: keep
    diataxis: how-to
    teaches:
      Let another system start a routine with one HTTP call and a note, through
      a service account holding Participant on it; what the key reaches, the
      hourly limit, and the open-source path with the owner's own key.
    medium: none

  # ── Access and organizations ───────────────────────────────────────────
  concepts/sharing-and-access:
    fate: keep
    diataxis: explanation
    teaches:
      Who reaches a resource — general access, the Viewer, Editor and Owner
      roles with Participant and Can use, what an Organization's roles allow and
      how they combine with a resource's, conversations, that a chat link is a
      channel and never a grant, service accounts, Environments among the kinds
      with general access, and what each edition grants.
    medium: none

  concepts/organizations:
    fate: keep
    diataxis: explanation
    teaches:
      An Organization is the account everything belongs to and the wall between
      customers; on the editions that include it, a parent organization has one
      child organization per customer, and its admins are admins in every child.
    medium: diagram
    why: Tenancy fan-out is structure; the two existing mermaids carry it.

  concepts/identity:
    fate: keep
    diataxis: explanation
    teaches:
      The five Identity Account types, service accounts for automation among
      them, and the two trust models — external OIDC federation vs
      Stigmer-signed minted user tokens.
    medium: diagram
    why:
      Both trust models are eight-step sequences already rendered as sequence
      diagrams — their native form.

  guides/authentication/overview:
    fate: keep
    diataxis: landing
    teaches:
      Choose among API key, identity federation, and minted user tokens based on
      where the request originates and who makes it.
    medium: none

  guides/authentication/service-accounts:
    fate: keep
    diataxis: how-to
    teaches:
      Create a service account with one Organization role, give it a key, use
      the key in CI, and manage or delete it; what a service account may never
      do.
    medium: screenshot-journey
    why:
      Creating a service account and its first key is a console procedure the
      reader follows at their own pace; the CLI path sits beside each step.

  guides/authentication/access-history:
    fate: keep
    diataxis: how-to
    teaches:
      Read an Organization's access history in the Console and with the CLI,
      what each entry and cause says, and export it as JSON Lines to a tool that
      keeps its copy current with --after.
    medium: none

  guides/authentication/federation/overview:
    fate: keep
    diataxis: landing
    teaches:
      The two provisioning modes (JIT and manual) and which numbered sub-guide
      applies to each.
    medium: diagram
    why:
      A mode-selection hub; the architecture diagram plus cards carry it, and
      the animated overview tour added nothing a hub needs (dropped 2026-07-28).

  guides/authentication/federation/authentication-flow:
    fate: keep
    diataxis: explanation
    teaches:
      The runtime path a federated JWT takes — JWKS fetch, validation, sub
      resolution, IAM check — and how to diagnose 401 vs 403.
    medium: diagram
    why:
      A machine-to-machine flow is structure; the page's two sequence diagrams
      are its native form.

  guides/authentication/federation/register-federation-issuer:
    fate: keep
    diataxis: how-to
    teaches:
      Gather JWKS URI, issuer, and audience from your OIDC vendor and create the
      Federation Issuer, optionally with JIT.
    medium: none

  guides/authentication/federation/grant-access:
    fate: keep
    diataxis: how-to
    teaches:
      Authentication without a Grant yields 403; grant a principal a role on a
      resource, or revoke access again.
    medium: none

  guides/authentication/federation/provision-federated-accounts:
    fate: keep
    diataxis: how-to
    teaches:
      The check-then-create provisioning pattern, plus update and deprovision,
      and why externalSub must be the OIDC sub.
    medium: none

  guides/authentication/federation/child-organizations:
    fate: keep
    diataxis: how-to
    teaches:
      Give each customer an isolated child organization under yours, administer
      it as one of its admins, route sign-ins with externalIdClaim or minted
      user tokens, and share a catalog with every child.
    medium: diagram
    why: Parent-to-child fan-out is structure; the two mermaids carry it.

  guides/authentication/product-users:
    fate: keep
    diataxis: how-to
    teaches:
      Mint per-user Stigmer JWTs from your backend with an admin service
      account's API key, set the Organization's embedding settings, and hand the
      tokens to StigmerProvider.
    medium: diagram
    why: Token minting is a backend sequence; one sequence diagram carries it.

  guides/authentication/customer-keys:
    fate: keep
    diataxis: how-to
    teaches:
      Keep each customer's keys in a vault no other customer can name, chosen by
      how the customers sign in and the edition; put a key in, rotate it, and
      check where a run's values came from.
    medium: none

  concepts/resources:
    fate: keep
    diataxis: explanation
    teaches:
      Every resource has a permanent ID and a renamable slug, is pointed at by
      ID, changes by apply or by a named update with an optional freshness
      check, lists in pages, and carries labels to filter and tags to find.
    medium: none

  # ── Editions and running it ────────────────────────────────────────────
  concepts/billing:
    fate: keep
    diataxis: explanation
    teaches:
      Stigmer Cloud's plans, their monthly fees and agent hours, how Stripe
      invoices them, where agent hours and working time are shown, that every
      model call runs on the Organization's own provider keys, what the model
      catalog's list prices are for, and what reduces model spend.
    medium: none

  concepts/runners:
    fate: keep
    diataxis: explanation
    teaches:
      A Runner is the process that executes work, not a resource; where one
      comes from in each way of running Stigmer; how work reaches it through a
      task queue and what happens when none is polling.
    medium: diagram
    why:
      The runner's place at the end of the Agent, Session, run chain is
      structure; the existing mermaid carries it.

  guides/runners/overview:
    fate: keep
    diataxis: landing
    teaches:
      Whether the reader needs the runner-embedding guides at all, and which
      sub-guide to open.
    medium: none

  guides/runners/claude-harness:
    fate: keep
    diataxis: how-to
    teaches:
      Where each edition gets Anthropic's Claude engine, the one-time download a
      local runner makes, and how to install the engine on a machine that cannot
      download it.
    medium: none

  guides/runners/model-backends:
    fate: keep
    diataxis: how-to
    teaches:
      Serve a provider's models from your own cloud account (GCP Vertex AI for
      Claude) by setting backend env vars on a direct-mode runner.
    medium: none

  guides/runners/payload-encryption:
    fate: keep
    diataxis: how-to
    teaches:
      Encrypt every Temporal payload the runner produces (AES-256-GCM) so
      decrypted secrets never rest in Temporal history — two env vars set on
      both the runner and the server.
    medium: none

  guides/runners/ipc-protocol:
    fate: keep
    diataxis: reference
    teaches:
      The complete line-delimited JSON contract for driving the runner as a
      subprocess.
    medium: none

  guides/runners/embedding:
    fate: split
    diataxis: how-to
    teaches:
      Which runner-embedding path fits your deployment and how to wire a
      RunnerAdapter in-process or as a subprocess.
    medium: diagram
    why:
      Deployment archetypes and the in-process/subprocess split are structure.
      Split because 540 lines mix a decision matrix, an infra explainer, an SDK
      tutorial, an interface contract, and a Tauri worked example.

  concepts/harnesses:
    fate: keep
    diataxis: explanation
    teaches:
      Choose between the Native and Claude execution engines on models,
      tooling, checkpointing, and cost; the choice locks per Session.
    medium: diagram
    why:
      The engine-selection fork is structure; the existing mermaid carries it.

  guides/self-hosting/overview:
    fate: keep
    diataxis: landing
    teaches:
      Which of the three self-hosting shapes (laptop, one server, Kubernetes)
      fits the reader's team, where each shape's guide is, and what every shape
      shares — sign-in off until turned on, the runner as one trust domain, one
      Organization, the reader's own provider keys and backups.
    medium: none

  guides/self-hosting/cloud-vs-self-hosted:
    fate: keep
    diataxis: explanation
    teaches:
      Which of the three editions fits the reader's team — what Stigmer open
      source includes (the full contract, Postgres, OIDC + API keys, isolation
      drivers), what Stigmer Enterprise adds on the reader's own infrastructure
      (many organizations, teams and invitations, federation, the access
      history), what Stigmer Cloud adds (hosted sign-in, channels, plans and
      billing, managed ops), and the honest limitation of self-hosting today
      (two production packagings, no operator).
    medium: none

  guides/self-hosting/all-in-one:
    fate: keep
    diataxis: how-to
    teaches:
      Run the whole stack from one Docker image for evaluation — the run command
      and what each flag means, a first message to the built-in assistant from
      the console, stopping and upgrading, looking inside with the CLI, what
      runs where — with the evaluation-only label, the no-auth trust model and
      the laptop sibling (`stigmer up`) named up front.
    medium: none

  guides/self-hosting/docker-compose:
    fate: keep
    diataxis: how-to
    teaches:
      Run the production one-server stack (server, Postgres, Temporal, runner)
      with Docker Compose, every setting a line in .env; open the console (the
      server made its one Organization at first start), connect the CLI as a
      named backend and run a first Agent; then put a TLS proxy in front and
      turn authentication on from .env — with sign-in off-by-default stated up
      front.
    medium: diagram
    why:
      The four-service topology and which volume holds what state is structure;
      the compose file's inline comments can't orient a reader the way one
      flowchart does.

  guides/self-hosting/kubernetes:
    fate: keep
    diataxis: how-to
    teaches:
      Install the complete stack on a Kubernetes cluster with the Helm chart on
      one rule, every setting is a line in your values file — create the
      Secrets, write the values file and install, reach the console through a
      port-forward (the server made its one Organization at first start),
      connect the CLI as a named backend and run a first Agent, add the two-host
      Ingress, turn authentication on, bring your own Postgres and Temporal,
      back up and upgrade — with the no-auth trust model stated up front.
    medium: none

  guides/self-hosting/authentication:
    fate: keep
    diataxis: how-to
    teaches:
      Turn on authentication for the Compose stack or the Helm chart with your
      own OIDC provider and API keys, in order — register the console as a
      public PKCE client (redirect and post-logout URIs, web origins, refresh
      tokens, the audience on the token, Dex's audience-is-the-client-ID rule),
      set issuer, audience and console client ID as .env lines or values-file
      lines, read the server's /config.json to confirm, sign in, create the
      runner's never-expiring key and your own under Settings → API Keys, give
      the runner its key (the chart's Secret and the order it forces), point the
      CLI at the stack on 443 — then what changes (roles, run attribution, what
      stays open) and what still needs an API key.
    medium: none

  guides/self-hosting/operations:
    fate: keep
    diataxis: how-to
    teaches:
      One backup format for both team shapes (a dump of the three databases, a
      tarball per file store, the keys as a flat file); back up, restore, move
      between Compose and Kubernetes, upgrade by version pin, change a setting
      or rotate the runner's key, uninstall, each per shape.
    medium: none

  guides/self-hosting/runners:
    fate: keep
    diataxis: explanation
    teaches:
      What executes Agents on a self-hosted stack and how a run reaches it
      through the one task queue; what an Agent run does when no runner is
      polling; where the LLM key, the shared artifact disk and the runner's own
      API key come from per shape; why the runner is one trust domain; the
      per-Session sandbox provisioner as a mechanism and its limit at the
      current release; what each sandbox driver does with an Environment, where
      and when it installs packages, and what a base image needs for them.
    medium: diagram
    why:
      The path one run takes (you, the server, the queue, the runner, your LLM
      provider, and back) is a sequence; the shape pages carry topology, this
      page carries the flow.

  guides/self-hosting/tracing:
    fate: keep
    diataxis: how-to
    teaches:
      Send every run to a tracing tool over OpenTelemetry — what one trace holds
      (a span per turn, model call, tool call, subagent), the
      standard variables per runner shape (the login on the server's secrets
      list for sandboxed runners), the gRPC default that changed, the content
      switch and what it never shows, Langfuse and a generic collector as
      examples, and that the conventions may still rename attributes.
    medium: none

  # ── CLI ────────────────────────────────────────────────────────────────
  cli:
    fate: keep
    diataxis: landing
    teaches:
      Install the CLI, point it at a local or cloud backend, and run first
      commands.
    medium: none

  # ── SDK ────────────────────────────────────────────────────────────────
  sdk:
    fate: keep
    diataxis: landing
    teaches:
      Which of the seven SDK packages exists and where each one's entry page
      lives.
    medium: none

  sdk/overview:
    fate: keep
    diataxis: how-to
    teaches:
      Install, authenticate, configure, and call the Stigmer API in all four
      languages, including errors and pagination.
    medium: none

  sdk/streaming:
    fate: keep
    diataxis: how-to
    teaches:
      Follow a Session's event log in production — the events to read, the end
      of a run, answering a waiting call, resuming a dropped stream, previews,
      cancellation.
    medium: none

  sdk/managed-agents:
    fate: keep
    diataxis: how-to
    teaches:
      Point Anthropic's SDK at Stigmer to list, stream and answer a Session's
      events — the claim's version, the credential, the three events Stigmer
      accepts, and what it does not serve.
    medium: none

  sdk/typescript:
    fate: keep
    diataxis: how-to
    teaches:
      Install @stigmer/client, construct a client, and make one call with
      not-found handling.
    medium: none

  sdk/go:
    fate: keep
    diataxis: how-to
    teaches:
      Install the v3 Go module, build a client with deferred close, and make one
      call with not-found handling.
    medium: none

  sdk/python:
    fate: keep
    diataxis: how-to
    teaches:
      Install the Python package, construct the client including the
      context-manager form, and make one call.
    medium: none

  sdk/java:
    fate: keep
    diataxis: how-to
    teaches:
      Add the Maven dependency, build a client in try-with-resources, and make
      one call.
    medium: none

  sdk/react:
    fate: keep
    diataxis: how-to
    teaches:
      Install @stigmer/react-sdk, wrap an app in StigmerProvider with the right
      credential per environment, and find the hooks.
    medium: none

  sdk/ink:
    fate: keep
    diataxis: how-to
    teaches:
      Render a session in a terminal with SessionApp, or compose
      InkStigmerProvider with individual components.
    medium: still
    why:
      A terminal UI documented with no visual at all; one frame of SessionApp
      rendering a session shows the outcome.

  sdk/ink/cli-integration:
    fate: keep
    diataxis: how-to
    teaches:
      Spawn the @stigmer/ink-ui binary from a non-JavaScript CLI, pass through
      terminal streams, and read final state.
    medium: none

  sdk/theme/theming:
    fate: keep
    diataxis: how-to
    teaches:
      Restyle Stigmer components by overriding --stgm-* tokens — scope
      mechanics, color mode, presets, slot overrides.
    medium: interactive
    why:
      Theming is learned by flipping presets and modes and watching token values
      change — the reader must drive it.

