# Build-from-source override for the compose stack (contributors + CI).
#
#   make smoke-compose            # the full gate: build, up, probe, teardown
#
# or by hand — both images COPY staged inputs, so stage them first: the
# server image its prebuilt slim tree, the runner image the CLI tarballs it
# installs (backend/services/runner/stage/cli):
#
#   make build-server build-web stage-compose-runner-cli
#   cd backend/services/stigmer-server && node scripts/bundle-slim.mjs && cd -
#   node scripts/smoke-compose.mjs --build --keep
#
# (smoke-compose.mjs stages dist-slim into the dist-slim-<arch>/ directory
# the Dockerfile's TARGETARCH COPY expects, reads the staged CLI version into
# STIGMER_CLI_VERSION, then runs `docker compose build` with both files.)
#
# The published-image pins in docker-compose.yml stay the user contract;
# this file exists so every PR can prove the real topology without waiting
# for a release (the P5 gate ruling Q-A).

services:
  stigmer-server:
    image: stigmer-server:compose-dev
    build:
      context: ./backend/services/stigmer-server
    pull_policy: never

  stigmer-runner:
    image: stigmer-runner:compose-dev
    build:
      context: .
      dockerfile: backend/services/runner/Dockerfile.sandbox
      target: compose-runner
      args:
        # The version the staged CLI tarballs carry (stage/cli/VERSION); the
        # image asserts the installed CLI reports it. Required, no default:
        # a source build without a staged CLI has nothing to install.
        STIGMER_CLI_VERSION: ${STIGMER_CLI_VERSION:?run scripts/stage-compose-runner-cli.mjs (make stage-compose-runner-cli) and set STIGMER_CLI_VERSION to backend/services/runner/stage/cli/VERSION}
    pull_policy: never
