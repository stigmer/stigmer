version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: google/protobuf/empty
    - file_option: go_package
      module: google/protobuf/timestamp
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: optimize_for
      value: SPEED
    - file_option: go_package_prefix
      value: github.com/stigmer/stigmer/sdk/go/v3/proto
# Local plugins (no buf.build round-trip). Pinned binaries are installed into
# .tools/bin by the `go-stubs-tools` Make target; versions are kept in sync with
# the GO_PROTOC_GEN_* variables in the Makefile so output stays byte-identical.
plugins:
  - local: .tools/bin/protoc-gen-go
    out: ../sdk/go/proto
  - local: .tools/bin/protoc-gen-go-grpc
    out: ../sdk/go/proto
    opt: require_unimplemented_servers=false
inputs:
  - directory: .
