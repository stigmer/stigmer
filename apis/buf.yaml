version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request makes RunConfig the one settings message for every run:
  # it deletes ExecutionConfig and ContextManagementConfig and reserves
  # AgentExecutionSpec field 4 (execution_config; its settings are run_config
  # and its intents top-level fields). AgentSpec gains its run defaults, so
  # McpServerUsage moves from the agent package to the mcpserver package: the
  # session package imported the agent package for that one type, which would
  # close a Go package import cycle. McpServerUsage's binary and JSON
  # encodings are unchanged. It is made before launch: the release notes name
  # every change under Upgrading. This block exists for that one pull request.
  # While it stays, buf breaking does not report these rules on the listed
  # files, so the pull request that removes it lands straight after the merge
  # (https://github.com/stigmer/stigmer/issues/1908).
  ignore_only:
    MESSAGE_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/spec.proto
      - ai/stigmer/agentic/agentexecution/v1/spec.proto
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/agentexecution/v1/spec.proto
    FIELD_SAME_TYPE:
      - ai/stigmer/agentic/agent/v1/spec.proto
      - ai/stigmer/agentic/session/v1/spec.proto
