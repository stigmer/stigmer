version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request replaces the sign-in fields of IdentityProviderSpec (9,
  # 10, 11) and PlatformClientSpec (6, 7, 8) with create_accounts_on_sign_in
  # and sign_in_role; the old numbers and names are reserved. Nothing has
  # launched on the old fields, and every edition starts from an empty
  # database. This block exists for that one pull request; the pull request
  # that removes it lands straight after the merge
  # (https://github.com/stigmer/stigmer/issues/1888).
  ignore_only:
    FIELD_NO_DELETE:
      - ai/stigmer/iam/identityprovider/v1/spec.proto
      - ai/stigmer/iam/platformclient/v1/spec.proto
