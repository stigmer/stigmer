version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request makes labels a filter on every list and tags search
  # words: ApiResourceMetadata's annotations go, with field 7 and its name
  # reserved, and ListRunsRequest's and ListSessionsRequest's tags filters,
  # which nothing applied, are reserved and replaced by a labels filter. It
  # is made before launch: the release notes name it under Upgrading. This
  # block exists for that one pull request. While it stays, buf breaking does
  # not report these rules on the listed files, so the pull request that
  # removes it lands straight after the merge (#2280).
  ignore_only:
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/run/v1/io.proto
      - ai/stigmer/agentic/session/v1/io.proto
      - ai/stigmer/commons/apiresource/metadata.proto
    MESSAGE_NO_DELETE:
      - ai/stigmer/commons/apiresource/metadata.proto
