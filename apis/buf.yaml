version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request makes every update name the fields it changes: each
  # update RPC takes Update<Kind>Input (the resource and an update_mask)
  # instead of the bare resource, and the session's harness conversation id
  # and its history move from spec to status, where only the runner writes
  # them (bindHarnessState), with fields 3 and 13 of SessionSpec reserved.
  # It is made before launch: the release notes name it under Upgrading.
  # This block exists for that one pull request. While it stays, buf
  # breaking does not report these rules on the listed files, so the pull
  # request that removes it lands straight after the merge (#2241).
  #
  # One pull request gives every list one shape: a request takes page_size
  # and page_token, a response returns entries and next_page_token, and 0
  # asks for a default page instead of every row. PageInfo, total_count and
  # total_pages go, with their numbers and names reserved; listByOrg becomes
  # list, getByAgent becomes listByAgent, findAll and findByAccount become
  # list and listByAccount, findMyOrganizations becomes listMine, and the
  # conversation lists become list and listTimeline; organization find and
  # FindApiResourcesRequest go; the unused SkillList and PluginList move to
  # io.proto as the new list responses. It is made before launch: the
  # release notes name it under Upgrading. This block exists for that one
  # pull request. While it stays, buf breaking does not report these rules
  # on the listed files, so the pull request that removes it lands straight
  # after the merge.
  #
  # One pull request removes Stigmer's own single sign-on: company sign-in
  # is the identity providers' job, and an IdentityProvider is trust in
  # another platform's tokens. It deletes getSsoProvider and
  # previewSsoRequirement from IdentityProviderQueryController,
  # createAccessMove and redeemAccessMove from
  # IdentityProviderCommandController, bootstrapMoveOrgAccess from
  # IamPolicyCommandController, their messages, and IdentityProviderSpec's
  # is_sso_provider, oidc_client_id and sso_required, whose numbers and names
  # are reserved. It is made before launch: the release notes name the
  # change under Upgrading. This block exists for that one pull request.
  # While it stays, buf breaking does not report these rules on the listed
  # files, so the pull request that removes it lands straight after the
  # merge (#2259).
  #
  # One pull request renames the IdentityProvider kind for what it is: an
  # outside issuer whose tokens Stigmer accepts. The package
  # ai.stigmer.iam.identityprovider.v1 moves to
  # ai.stigmer.iam.federationissuer.v1 with every message and service
  # renamed; ApiResourceKind identity_provider = 21 becomes
  # federation_issuer, IamPermission can_create_idp = 11 becomes
  # can_create_federation_issuer, and the identity_provider_ref fields of
  # IdentityAccountSpec and the federated account inputs become
  # federation_issuer_ref. Every field and value number is kept. It is made
  # before launch: the release notes name it under Upgrading. This block
  # exists for that one pull request. While it stays, buf breaking does not
  # report these rules on the listed files, so the pull request that removes
  # it lands straight after the merge.
  ignore_only:
    ENUM_VALUE_SAME_NAME:
      - ai/stigmer/commons/apiresource/apiresourcekind/api_resource_kind.proto
      - ai/stigmer/iam/v1/enum.proto
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/version.proto
      - ai/stigmer/agentic/agentchannel/v1/conversation_io.proto
      - ai/stigmer/agentic/agentchannel/v1/io.proto
      - ai/stigmer/agentic/agenteval/v1/io.proto
      - ai/stigmer/agentic/agentshare/v1/io.proto
      - ai/stigmer/agentic/memory/v1/io.proto
      - ai/stigmer/agentic/plugin/v1/io.proto
      - ai/stigmer/agentic/plugineval/v1/io.proto
      - ai/stigmer/agentic/run/v1/io.proto
      - ai/stigmer/agentic/schedule/v1/io.proto
      - ai/stigmer/agentic/score/v1/io.proto
      - ai/stigmer/agentic/session/v1/io.proto
      - ai/stigmer/agentic/session/v1/spec.proto
      - ai/stigmer/agentic/skill/v1/io.proto
      - ai/stigmer/agentic/vault/v1/io.proto
      - ai/stigmer/iam/identityaccount/v1/io.proto
      - ai/stigmer/iam/identityprovider/v1/spec.proto
      - ai/stigmer/search/v1/io.proto
    FIELD_SAME_CARDINALITY:
