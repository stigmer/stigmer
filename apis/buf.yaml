version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request renames the agent run to a run: the agentrun/v1 package
  # moves to run/v1, every message, enum, value, service and field that said
  # agent run says run, the run kind's enum value is run, and a schedule's
  # history record is a fire (ScheduleFire, listFires), with every field and
  # value number kept. It is made before launch: the release notes name every
  # change under Upgrading. This block exists for that one pull request. While
  # it stays, buf breaking does not report these rules on the listed files, so
  # the pull request that removes it lands straight after the merge.
  ignore_only:
    ENUM_NO_DELETE:
      - ai/stigmer/agentic/schedule/v1/io.proto
    ENUM_VALUE_SAME_NAME:
      - ai/stigmer/commons/apiresource/apiresourcekind/api_resource_kind.proto
    FIELD_SAME_JSON_NAME:
      - ai/stigmer/agentic/memory/v1/spec.proto
      - ai/stigmer/platform/v1/server_info.proto
    FIELD_SAME_NAME:
      - ai/stigmer/agentic/memory/v1/spec.proto
      - ai/stigmer/platform/v1/server_info.proto
    FIELD_SAME_TYPE:
      - ai/stigmer/agentic/agent/v1/spec.proto
      - ai/stigmer/agentic/agentchannel/v1/spec.proto
      - ai/stigmer/agentic/agentshare/v1/spec.proto
      - ai/stigmer/agentic/schedule/v1/io.proto
      - ai/stigmer/agentic/schedule/v1/spec.proto
      - ai/stigmer/billing/v1/io.proto
    FILE_NO_DELETE:
      - ai/stigmer/agentic/agentrun
    MESSAGE_NO_DELETE:
      - ai/stigmer/agentic/schedule/v1/io.proto
    RPC_NO_DELETE:
      - ai/stigmer/agentic/schedule/v1/query.proto
