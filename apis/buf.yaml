version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request removes OrganizationSpec field 6 (is_personal) and
  # reserves its number and name: the organization Stigmer Cloud creates at
  # sign-up is an ordinary organization. It is made before launch: the
  # release notes name the change under Upgrading. This block exists for that
  # one pull request. While it stays, buf breaking does not report this rule
  # on the listed file, so the pull request that removes it lands straight
  # after the merge.
  ignore_only:
    FIELD_NO_DELETE:
      - ai/stigmer/tenancy/organization/v1/spec.proto
