version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # Public visibility retired: the operator permission that granted it, the
  # two Search switches that read it and the kind-config flag that declared
  # it leave the contract, each number and name reserved in place. A
  # deliberate FILE-category break the CI gate would otherwise refuse; this
  # block lets that one pull request through and nothing else, and the pull
  # request that follows the merge removes it, because main then has no
  # such field for a deletion to be measured against.
  ignore_only:
    ENUM_VALUE_NO_DELETE:
      - ai/stigmer/iam/v1/enum.proto
    FIELD_NO_DELETE:
      - ai/stigmer/search/v1/io.proto
      - ai/stigmer/commons/apiresource/apiresourcekind/authorization_config.proto
