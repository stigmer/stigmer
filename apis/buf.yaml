version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request makes a subagent a saved agent the parent lists. It
  # deletes AgentSpec.sub_agents and the SubAgent message written inside an
  # agent (the number and name reserved). It is made before launch: the
  # release notes name the change under Upgrading. This block exists for that
  # one pull request. While it stays, buf breaking does not report these
  # rules on the listed file, so the pull request that removes it lands
  # straight after the merge.
  ignore_only:
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/spec.proto
    MESSAGE_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/spec.proto
