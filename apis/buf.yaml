version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request finds a login by the address it signs in to. It deletes
  # the McpServer sign-in and organization-override RPCs with their messages,
  # the override's file and its two status fields with their enum, the
  # GitHub sign-in service's file, the auth block's
  # app reference and discovery URL, and the sign-in record's server binding
  # (each removed field's number and name reserved). It is made before
  # launch: the release notes name every change under Upgrading. This block
  # exists for that one pull request. While it stays, buf breaking does not
  # report these rules on the listed files, so the pull request that removes
  # it lands straight after the merge
  # (https://github.com/stigmer/stigmer/issues/2049).
  ignore_only:
    FILE_NO_DELETE:
      - ai/stigmer/agentic/mcpserver/v1/oauth.proto
      - ai/stigmer/platform/github/v1/service.proto
    RPC_NO_DELETE:
      - ai/stigmer/agentic/mcpserver/v1/command.proto
      - ai/stigmer/agentic/mcpserver/v1/query.proto
    MESSAGE_NO_DELETE:
      - ai/stigmer/agentic/mcpserver/v1/io.proto
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/mcpserver/v1/spec.proto
      - ai/stigmer/agentic/mcpserver/v1/status.proto
      - ai/stigmer/agentic/vault/v1/spec.proto
    ENUM_NO_DELETE:
      - ai/stigmer/agentic/mcpserver/v1/status.proto
