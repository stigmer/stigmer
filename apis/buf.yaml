version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request renames the IdentityProvider kind for what it is: an
  # outside issuer whose tokens Stigmer accepts. The package
  # ai.stigmer.iam.identityprovider.v1 moves to
  # ai.stigmer.iam.federationissuer.v1 with every message and service
  # renamed; ApiResourceKind identity_provider = 21 becomes
  # federation_issuer, IamPermission can_create_idp = 11 becomes
  # can_create_federation_issuer, and the identity_provider_ref fields of
  # IdentityAccountSpec and the federated account inputs become
  # federation_issuer_ref. Every field and value number is kept. It is made
  # before launch: the release notes name it under Upgrading. This block
  # exists for that one pull request. While it stays, buf breaking does not
  # report these rules on the listed files, so the pull request that removes
  # it lands straight after the merge (#2279).
  ignore_only:
    ENUM_VALUE_SAME_NAME:
      - ai/stigmer/commons/apiresource/apiresourcekind/api_resource_kind.proto
      - ai/stigmer/iam/v1/enum.proto
    FIELD_SAME_JSON_NAME:
      - ai/stigmer/iam/identityaccount/v1/io.proto
      - ai/stigmer/iam/identityaccount/v1/spec.proto
    FIELD_SAME_NAME:
      - ai/stigmer/iam/identityaccount/v1/io.proto
      - ai/stigmer/iam/identityaccount/v1/spec.proto
    FILE_NO_DELETE:
      - ai/stigmer/iam/identityprovider/v1/api.proto
      - ai/stigmer/iam/identityprovider/v1/command.proto
      - ai/stigmer/iam/identityprovider/v1/io.proto
      - ai/stigmer/iam/identityprovider/v1/query.proto
      - ai/stigmer/iam/identityprovider/v1/spec.proto
