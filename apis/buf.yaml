version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request makes the contract read as a first release: every
  # `reserved` statement goes, with the seven enum values nothing writes
  # (visibility_public, the Feature values sso_enforcement, platform_client
  # and byo_provider_keys, AccessChangeCause.platform_client_grant,
  # IdentityAccountProvisioningMode.machine and
  # PROVIDER_KEY_SOURCE_PLATFORM) and ApiResourceKindMeta.retired_id_prefixes
  # (10), and Feature.sharing (5) is named chat_links. No number moves. This
  # block exists for that pull request; the pull request that removes it
  # lands straight after the merge (stigmer/stigmer#2725), and from then on a
  # removed field or value keeps its number and name reserved.
  ignore_only:
    RESERVED_MESSAGE_NO_DELETE:
      - ai/stigmer/activity/v1/io.proto
      - ai/stigmer/agentic/agent/v1/spec.proto
      - ai/stigmer/agentic/agent/v1/status.proto
      - ai/stigmer/agentic/agent/v1/version.proto
      - ai/stigmer/agentic/channel/v1/conversation_io.proto
      - ai/stigmer/agentic/memory/v1/io.proto
      - ai/stigmer/agentic/plugin/v1/io.proto
      - ai/stigmer/agentic/plugin/v1/status.proto
      - ai/stigmer/agentic/routine/v1/io.proto
      - ai/stigmer/agentic/run/v1/api.proto
      - ai/stigmer/agentic/run/v1/filereview.proto
      - ai/stigmer/agentic/run/v1/invocation.proto
      - ai/stigmer/agentic/run/v1/io.proto
      - ai/stigmer/agentic/run/v1/spec.proto
      - ai/stigmer/agentic/run/v1/usage.proto
      - ai/stigmer/agentic/score/v1/io.proto
      - ai/stigmer/agentic/session/v1/event.proto
      - ai/stigmer/agentic/session/v1/io.proto
      - ai/stigmer/agentic/session/v1/resource.proto
      - ai/stigmer/agentic/session/v1/spec.proto
      - ai/stigmer/agentic/session/v1/status.proto
      - ai/stigmer/agentic/skill/v1/io.proto
      - ai/stigmer/agentic/skill/v1/spec.proto
      - ai/stigmer/agentic/vault/v1/io.proto
      - ai/stigmer/agentic/vault/v1/spec.proto
      - ai/stigmer/agentic/vault/v1/values.proto
      - ai/stigmer/billing/plan/v1/spec.proto
      - ai/stigmer/billing/providerkey/v1/api.proto
      - ai/stigmer/billing/subscription/v1/io.proto
      - ai/stigmer/billing/v1/billing_account.proto
      - ai/stigmer/billing/v1/io.proto
      - ai/stigmer/billing/v1/model_pricing_baseline.proto
      - ai/stigmer/commons/apiresource/apiresourcekind/authorization_config.proto
      - ai/stigmer/commons/apiresource/metadata.proto
      - ai/stigmer/commons/apiresource/status.proto
      - ai/stigmer/iam/federationissuer/v1/spec.proto
      - ai/stigmer/iam/identityaccount/v1/io.proto
      - ai/stigmer/iam/identityaccount/v1/spec.proto
      - ai/stigmer/platform/v1/entitlement.proto
      - ai/stigmer/platform/v1/server_info.proto
      - ai/stigmer/search/v1/io.proto
      - ai/stigmer/tenancy/organization/v1/io.proto
      - ai/stigmer/tenancy/organization/v1/spec.proto
    RESERVED_ENUM_NO_DELETE:
      - ai/stigmer/agentic/session/v1/enum.proto
      - ai/stigmer/billing/subscription/v1/io.proto
      - ai/stigmer/commons/apiresource/apiresourcekind/api_resource_kind.proto
      - ai/stigmer/iam/v1/enum.proto
    ENUM_VALUE_NO_DELETE:
      - ai/stigmer/agentic/run/v1/usage.proto
      - ai/stigmer/commons/apiresource/enum.proto
      - ai/stigmer/iam/grant/v1/io.proto
      - ai/stigmer/iam/identityaccount/v1/enum.proto
      - ai/stigmer/platform/v1/entitlement.proto
    ENUM_VALUE_SAME_NAME:
      - ai/stigmer/platform/v1/entitlement.proto
    FIELD_NO_DELETE:
      - ai/stigmer/commons/apiresource/apiresourcekind/api_resource_kind.proto
