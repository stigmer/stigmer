version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request removes the per-tool approval model: the connect-time
  # classifier's tool_approvals, a server's default_enabled_tools and
  # pinned_tool_approvals, an agent's enabled_tools and
  # tool_approval_overrides, a sub-agent's mcp_access, their messages, and the
  # three ApprovalPolicySource values that recorded them. Every number and
  # name is reserved, so a stored row decodes with them dropped and nothing
  # reuses them; no compatibility is kept for what they held. This block
  # exists for that one pull request; the pull request that removes it lands
  # straight after the merge (https://github.com/stigmer/stigmer/issues/1865).
  ignore_only:
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/spec.proto
      - ai/stigmer/agentic/mcpserver/v1/spec.proto
      - ai/stigmer/agentic/mcpserver/v1/status.proto
    MESSAGE_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/spec.proto
      - ai/stigmer/agentic/mcpserver/v1/spec.proto
    ENUM_VALUE_NO_DELETE:
      - ai/stigmer/agentic/agentexecution/v1/enum.proto
