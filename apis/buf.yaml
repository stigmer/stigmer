version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request ships agent versions and removes a field and a message
  # from apis/ai/stigmer/agentic/agent/v1/version.proto that were part of an
  # unimplemented design: AgentVersionEntry.git_provenance (its number and
  # name are reserved) and GitProvenance. No proto imported the file, no RPC
  # returned the entry and no write path could fill the field, so nothing on
  # the wire changes. This block exists for that one pull request; the pull
  # request that removes it lands straight after the merge
  # (https://github.com/stigmer/stigmer/issues/1853).
  ignore_only:
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/version.proto
    MESSAGE_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/version.proto
