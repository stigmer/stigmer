version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request moves child organizations off the identity provider and
  # onto the organization: OrganizationSpec 3 and 4 and the ManagementMode
  # enum are removed (numbers and names reserved), the lookup by external id
  # is replaced, and the names that described the old link take the child
  # organization's words with their numbers kept. Nothing has launched on
  # the old names, and every edition starts from an empty database. This
  # block exists for that one pull request; the pull request that removes it
  # lands straight after the merge
  # (https://github.com/stigmer/stigmer/issues/1909).
  ignore_only:
    FILE_NO_DELETE:
      - ai/stigmer/tenancy/organization/v1/enum.proto
    FIELD_NO_DELETE:
      - ai/stigmer/tenancy/organization/v1/io.proto
      - ai/stigmer/tenancy/organization/v1/spec.proto
    RPC_NO_DELETE:
      - ai/stigmer/tenancy/organization/v1/query.proto
    FIELD_SAME_NAME:
      - ai/stigmer/billing/subscription/v1/io.proto
      - ai/stigmer/commons/apiresource/apiresourcekind/authorization_config.proto
      - ai/stigmer/iam/identityprovider/v1/spec.proto
      - ai/stigmer/platform/v1/entitlement.proto
      - ai/stigmer/tenancy/organization/v1/io.proto
      - ai/stigmer/tenancy/organization/v1/spec.proto
    FIELD_SAME_JSON_NAME:
      - ai/stigmer/billing/subscription/v1/io.proto
      - ai/stigmer/commons/apiresource/apiresourcekind/authorization_config.proto
      - ai/stigmer/iam/identityprovider/v1/spec.proto
      - ai/stigmer/platform/v1/entitlement.proto
      - ai/stigmer/tenancy/organization/v1/io.proto
      - ai/stigmer/tenancy/organization/v1/spec.proto
    ENUM_VALUE_SAME_NAME:
      - ai/stigmer/billing/subscription/v1/io.proto
      - ai/stigmer/commons/apiresource/enum.proto
      - ai/stigmer/platform/v1/entitlement.proto
