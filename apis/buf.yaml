version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request, made before launch, takes the run's own transcript off
  # the contract: RunStatus's messages, sub-agent runs, todos, approvals,
  # structured output and file-review ledgers, the types only they used, and
  # the run's submitApproval, submitFileDecision, cancel and subscribe
  # methods. Every client and the platform read a conversation from the
  # session's event log, and the session's interrupt, confirmToolUse,
  # grantPermission and reviewFileChanges replace the methods. The release
  # notes name it under Upgrading. This block exists for that one pull
  # request. While it stays, buf breaking does not report these rules on the
  # listed files, so the pull request that removes it lands straight after
  # the merge.
  ignore_only:
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/run/v1/api.proto
      - ai/stigmer/agentic/run/v1/filereview.proto
    ENUM_NO_DELETE:
      - ai/stigmer/agentic/run/v1/enum.proto
    FILE_NO_DELETE:
      - ai/stigmer/agentic/run/v1/approval.proto
      - ai/stigmer/agentic/run/v1/context.proto
      - ai/stigmer/agentic/run/v1/subagent.proto
      - ai/stigmer/agentic/run/v1/todo.proto
    MESSAGE_NO_DELETE:
      - ai/stigmer/agentic/run/v1/api.proto
      - ai/stigmer/agentic/run/v1/filereview.proto
      - ai/stigmer/agentic/run/v1/io.proto
      - ai/stigmer/agentic/run/v1/message.proto
    RPC_NO_DELETE:
      - ai/stigmer/agentic/run/v1/command.proto
      - ai/stigmer/agentic/run/v1/query.proto
