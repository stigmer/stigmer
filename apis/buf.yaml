version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request retires the Cursor harness: HARNESS_CURSOR (2), the
  # CursorMode enum and SessionSpec.cursor_mode (11), the session's harness
  # state (SessionStatus 5 and 6) with the bindHarnessState rpc and its
  # messages, IdentityAccountPreferences.default_cursor_model (4),
  # PricingBlock.cursor_token_rate_micros_per_million (5) and the permission
  # ask's content_digest (8), each number and name kept reserved. This block
  # exists for that pull request; the pull request that removes it lands
  # straight after the merge.
  ignore_only:
    ENUM_NO_DELETE:
      - ai/stigmer/agentic/session/v1/enum.proto
    ENUM_VALUE_NO_DELETE:
      - ai/stigmer/agentic/session/v1/enum.proto
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/session/v1/event.proto
      - ai/stigmer/agentic/session/v1/spec.proto
      - ai/stigmer/agentic/session/v1/status.proto
      - ai/stigmer/billing/v1/model_pricing_baseline.proto
      - ai/stigmer/iam/identityaccount/v1/spec.proto
    MESSAGE_NO_DELETE:
      - ai/stigmer/agentic/session/v1/io.proto
    RPC_NO_DELETE:
      - ai/stigmer/agentic/session/v1/command.proto
