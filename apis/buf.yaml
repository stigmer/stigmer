version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request removes the AgentInstance kind: a Session names its agent
  # directly and records the version it runs, and a workflow's agent turn
  # carries one parent link the server vouches for instead of three
  # caller-set fields. It deletes the agentinstance/v1 package, the fields
  # that named an instance (each number and name reserved), the three
  # workflow fields, the two spec snapshots that moved to the execution's
  # status, and listByAgentInstance; it moves session_id and session_spec into
  # a oneof and retypes Session.status as SessionStatus, whose only stored
  # field until now (audit = 99) it keeps. It is made before launch: the
  # release notes name every change under Upgrading. This block exists for
  # that one pull request. While it stays, buf breaking does not report these
  # rules on the listed files, so the pull request that removes it lands
  # straight after the merge (https://github.com/stigmer/stigmer/issues/1890).
  ignore_only:
    FILE_NO_DELETE:
      - ai/stigmer/agentic/agentinstance
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/status.proto
      - ai/stigmer/agentic/agentexecution/v1/spec.proto
      - ai/stigmer/agentic/agentshare/v1/io.proto
      - ai/stigmer/agentic/session/v1/spec.proto
    FIELD_SAME_CARDINALITY:
      - ai/stigmer/agentic/agentexecution/v1/spec.proto
    FIELD_SAME_ONEOF:
      - ai/stigmer/agentic/agentexecution/v1/spec.proto
    FIELD_SAME_TYPE:
      - ai/stigmer/agentic/session/v1/api.proto
    MESSAGE_NO_DELETE:
      - ai/stigmer/agentic/session/v1/io.proto
    RPC_NO_DELETE:
      - ai/stigmer/agentic/session/v1/query.proto
    ENUM_VALUE_NO_DELETE:
      - ai/stigmer/commons/apiresource/apiresourcekind/api_resource_kind.proto
      - ai/stigmer/iam/v1/enum.proto
