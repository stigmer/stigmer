version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request turns the runner's File mount service into the runner's
  # one door to Files, which also takes back what a turn saved in its outputs
  # folder: mount.proto becomes run_files.proto and FileMountController
  # becomes RunFileController. No released client calls it (runner and
  # server ship together). This block exists for that pull request and the
  # one after it that retires run artifacts; the pull request that removes it
  # lands straight after the second merge.
  ignore_only:
    FILE_NO_DELETE:
      - ai/stigmer/agentic/file/v1/mount.proto
