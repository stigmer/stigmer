version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request trims vaults: it deletes the agent's vaults and a
  # conversation's own secrets and connections (each removed field's number
  # and name reserved). It is made before launch: the release notes name
  # every change under Upgrading. This block exists for that one pull
  # request. While it stays, buf breaking does not report this rule on the
  # listed files, so the pull request that removes it lands straight after
  # the merge (https://github.com/stigmer/stigmer/issues/2046).
  ignore_only:
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/spec.proto
      - ai/stigmer/agentic/session/v1/spec.proto
