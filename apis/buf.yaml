version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # Two pull requests each delete proto surface under a one-PR exemption, and
  # each exemption's removal lands straight after its merge.
  #
  # One ships agent versions and removes a field and a message from
  # apis/ai/stigmer/agentic/agent/v1/version.proto that were part of an
  # unimplemented design: AgentVersionEntry.git_provenance (its number and name
  # are reserved) and GitProvenance. No proto imported the file, no RPC
  # returned the entry and no write path could fill the field, so nothing on
  # the wire changes (https://github.com/stigmer/stigmer/issues/1853).
  #
  # One removes the per-tool approval model: the connect-time classifier's
  # tool_approvals, a server's default_enabled_tools and pinned_tool_approvals,
  # an agent's enabled_tools and tool_approval_overrides, a sub-agent's
  # mcp_access, their messages, and the three ApprovalPolicySource values that
  # recorded them. Every number and name is reserved, so a stored row decodes
  # with them dropped and nothing reuses them; no compatibility is kept for
  # what they held (https://github.com/stigmer/stigmer/issues/1865).
  ignore_only:
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/version.proto
      - ai/stigmer/agentic/agent/v1/spec.proto
      - ai/stigmer/agentic/mcpserver/v1/spec.proto
      - ai/stigmer/agentic/mcpserver/v1/status.proto
    MESSAGE_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/version.proto
      - ai/stigmer/agentic/agent/v1/spec.proto
      - ai/stigmer/agentic/mcpserver/v1/spec.proto
    ENUM_VALUE_NO_DELETE:
      - ai/stigmer/agentic/agentexecution/v1/enum.proto
