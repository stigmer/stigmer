version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request removes provider standing and pricing governance: the
  # canary probe of the platform's own LLM provider accounts and the loop
  # that corrected model prices from provider invoices. Every model call now
  # runs on a key the organization owns, so neither has anything left to
  # watch. It deletes the ProviderStandingQueryController package, the
  # pricing_override.proto file, the decideModelPricingOverride and
  # getModelPricingGovernance RPCs with their four messages, and the
  # can_view_provider_standing permission (the number and name reserved). It
  # is made before launch: the release notes name the change under
  # Upgrading. This block exists for that one pull request. While it stays,
  # buf breaking does not report these rules on the listed files, so the
  # pull request that removes it lands straight after the merge.
  ignore_only:
    FILE_NO_DELETE:
      - ai/stigmer/billing/v1/pricing_override.proto
      - ai/stigmer/platform/providerstanding/v1/io.proto
      - ai/stigmer/platform/providerstanding/v1/query.proto
    RPC_NO_DELETE:
      - ai/stigmer/billing/v1/command.proto
      - ai/stigmer/billing/v1/query.proto
    MESSAGE_NO_DELETE:
      - ai/stigmer/billing/v1/io.proto
    ENUM_VALUE_NO_DELETE:
      - ai/stigmer/iam/v1/enum.proto
