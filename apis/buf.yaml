version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # Deliberate wire break: sharing was promoted from Agent.spec.sharing to
  # the first-class AgentShare resource (decision 011, T09). The agent
  # package loses the AgentSharing messages/enum, the sharing/link-token
  # fields (numbers and names reserved), and the four sharing RPCs; their
  # replacements live in ai/stigmer/agentic/agentshare/v1. Remove these
  # entries once the T09 cutover has landed on main.
  ignore_only:
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/spec.proto
      - ai/stigmer/agentic/agent/v1/status.proto
    MESSAGE_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/spec.proto
      - ai/stigmer/agentic/agent/v1/io.proto
    ENUM_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/spec.proto
    RPC_NO_DELETE:
      - ai/stigmer/agentic/agent/v1/command.proto
      - ai/stigmer/agentic/agent/v1/query.proto
