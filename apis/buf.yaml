version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request gives the Stigmer harness its one word: HARNESS_NATIVE (1)
  # becomes HARNESS_STIGMER and IdentityAccountPreferences.default_native_model
  # (3) becomes default_stigmer_model, numbers kept and the old names
  # reserved. Stored data holds enums and fields by number, so nothing stored
  # changes meaning. This block exists for that pull request; the pull request
  # that removes it lands straight after the merge.
  ignore_only:
    ENUM_VALUE_SAME_NAME:
      - ai/stigmer/agentic/session/v1/enum.proto
    FIELD_SAME_NAME:
      - ai/stigmer/iam/identityaccount/v1/spec.proto
    FIELD_SAME_JSON_NAME:
      - ai/stigmer/iam/identityaccount/v1/spec.proto
