version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request renames the IamPolicy kind Grant: one record is one role
  # given to one principal on one resource, and "IAM policy" reads as the
  # whole set on a resource. The package moves to iam/grant/v1, the kind's
  # enum value and the check inputs' policy fields take the new word, and
  # every field and value number is kept. It is made before launch: the
  # release notes name it under Upgrading. This block exists for that one
  # pull request. While it stays, buf breaking does not report these rules
  # on the listed files, so the pull request that removes it lands straight
  # after the merge.
  ignore_only:
    ENUM_VALUE_SAME_NAME:
      - ai/stigmer/commons/apiresource/apiresourcekind/api_resource_kind.proto
    FILE_NO_DELETE:
      - ai/stigmer/iam/iampolicy/v1/api.proto
      - ai/stigmer/iam/iampolicy/v1/command.proto
      - ai/stigmer/iam/iampolicy/v1/io.proto
      - ai/stigmer/iam/iampolicy/v1/query.proto
      - ai/stigmer/iam/iampolicy/v1/spec.proto
