version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request made before launch replaces the PluginEval and
  # AgentEval kinds with one EvalRun kind (agentic/evalrun/v1): the two
  # kinds' values are reserved, their packages removed, and the run's case
  # context and files (fields 25 and 34) renamed with their messages,
  # numbers kept. The release notes name it under Upgrading. This block
  # exists for that one pull request. While it stays, buf breaking does not
  # report these rules on the listed files, so the pull request that removes
  # it lands straight after the merge.
  ignore_only:
    ENUM_VALUE_NO_DELETE:
      - ai/stigmer/commons/apiresource/apiresourcekind/api_resource_kind.proto
    FIELD_SAME_JSON_NAME:
      - ai/stigmer/agentic/run/v1/api.proto
      - ai/stigmer/agentic/run/v1/spec.proto
    FIELD_SAME_NAME:
      - ai/stigmer/agentic/run/v1/api.proto
      - ai/stigmer/agentic/run/v1/spec.proto
    FIELD_SAME_TYPE:
      - ai/stigmer/agentic/run/v1/api.proto
      - ai/stigmer/agentic/run/v1/spec.proto
    FILE_NO_DELETE:
      - ai/stigmer/agentic/agenteval/v1/api.proto
      - ai/stigmer/agentic/agenteval/v1/command.proto
      - ai/stigmer/agentic/agenteval/v1/io.proto
      - ai/stigmer/agentic/agenteval/v1/query.proto
      - ai/stigmer/agentic/agenteval/v1/spec.proto
      - ai/stigmer/agentic/agenteval/v1/status.proto
      - ai/stigmer/agentic/plugineval/v1/api.proto
      - ai/stigmer/agentic/plugineval/v1/command.proto
      - ai/stigmer/agentic/plugineval/v1/io.proto
      - ai/stigmer/agentic/plugineval/v1/query.proto
      - ai/stigmer/agentic/plugineval/v1/spec.proto
      - ai/stigmer/agentic/plugineval/v1/status.proto
      - ai/stigmer/agentic/run/v1/plugin_eval_case.proto
