version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # One pull request moves the hosted chat link, the guest-token mint and the
  # embed from an organization and a share slug to the share's own id: it
  # deletes GetSharedProfileRequest's and MintGuestTokenRequest's org and slug
  # (their numbers and names are reserved) for share_id, and
  # getSharedProfileForMember takes AgentShareId. It is made before launch: no
  # outside consumer uses these messages, and the release notes name every
  # change under Upgrading. This block exists for that one pull request. While
  # it stays, buf breaking does not report these rules on the listed files, so
  # the pull request that removes it lands straight after the merge
  # (https://github.com/stigmer/stigmer/issues/1856).
  ignore_only:
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/agentshare/v1/io.proto
      - ai/stigmer/iam/platformclient/v1/token.proto
    RPC_SAME_REQUEST_TYPE:
      - ai/stigmer/agentic/agentshare/v1/query.proto
