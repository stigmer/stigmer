version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/stigmer/stigmer
    excludes:
      - stubs
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_PASCAL_CASE
    - SERVICE_SUFFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
  # Two pull requests make a File the only way a file leaves a session. The
  # first turned the runner's File mount service into the runner's one door
  # to Files: mount.proto became run_files.proto. The second retires run
  # artifacts: artifact.proto and RunArtifactKind, RunStatus field 15 (kept
  # reserved with its name), and the skill import from a run artifact's
  # storage key with its request, replaced by pushFromFile. This block exists
  # for those two pull requests; the pull request that removes it lands
  # straight after the second merge.
  ignore_only:
    FILE_NO_DELETE:
      - ai/stigmer/agentic/file/v1/mount.proto
      - ai/stigmer/agentic/run/v1/artifact.proto
    FIELD_NO_DELETE:
      - ai/stigmer/agentic/run/v1/api.proto
    ENUM_NO_DELETE:
      - ai/stigmer/agentic/run/v1/enum.proto
    RPC_NO_DELETE:
      - ai/stigmer/agentic/skill/v1/command.proto
    MESSAGE_NO_DELETE:
      - ai/stigmer/agentic/skill/v1/io.proto
