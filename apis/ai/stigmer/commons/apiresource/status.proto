syntax = "proto3";

package ai.stigmer.commons.apiresource;

import "google/protobuf/timestamp.proto";

// ApiResourceAuditStatus contains system-managed audit information for a resource.
message ApiResourceAuditStatus {
  // Audit information tracking creation and modification.
  ApiResourceAudit audit = 99;
}

// ApiResourceAudit contains both spec-level and status-level audit details.
message ApiResourceAudit {
  // Audit info for the resource's specification (desired state).
  ApiResourceAuditInfo spec_audit = 1;

  // Audit info for the resource's status (actual state).
  ApiResourceAuditInfo status_audit = 2;
}

// ApiResourceAuditInfo contains detailed audit information.
message ApiResourceAuditInfo {
  // Actor who created this resource.
  ApiResourceAuditActor created_by = 1;

  // Timestamp when the resource was created.
  google.protobuf.Timestamp created_at = 2;

  // Actor who last updated this resource.
  ApiResourceAuditActor updated_by = 3;

  // Timestamp when the resource was last updated.
  google.protobuf.Timestamp updated_at = 4;

  // Type of the last event (e.g., "created", "updated").
  string event = 5;
}

// ApiResourceAuditActor represents the entity that performed an action.
//
// This is the platform's single actor vocabulary: every "who did this"
// reference (created_by / updated_by, version-history applied_by / pushed_by,
// approval resolved_by_actor) uses this message, so actor rendering is
// uniform across all surfaces.
message ApiResourceAuditActor {
  // Unique identifier of the actor.
  //
  // @internal
  // Historically, some writers populate this with the actor's email address
  // rather than the identity-account ID. New writers should use the
  // identity-account ID and carry the email in the dedicated field below;
  // renderers must treat this value as an opaque last-resort label.
  string id = 1;

  // URL to the actor's avatar image.
  string avatar = 2;

  // Human-readable display name (e.g. "Ada Lovelace"). Empty when unknown;
  // renderers fall back to email, then id.
  string display_name = 3;

  // Email address of the actor. Empty when unknown or not applicable
  // (e.g. machine accounts).
  string email = 4;

  // The PlatformClient whose minted user token the actor acted through.
  // Empty for every other credential, and on an actor that records no act
  // (an account's profile lookup).
  //
  // @internal
  // Server-stamped from the verified token by the PlatformClient
  // verifier (CallerIdentity.platformClientId), never from the request.
  // The account alone cannot name the client: an end user has one account
  // per organization whichever of its clients they came through, so this
  // is the one durable record of which client a resource was written
  // through. The execution-context builder keys the PlatformClient
  // environment layer on the execution's created_by value (spec.proto,
  // PlatformClientSpec.environment_refs).
  string platform_client_id = 5;
}
