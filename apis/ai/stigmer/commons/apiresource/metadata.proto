syntax = "proto3";

package ai.stigmer.commons.apiresource;

import "ai/stigmer/commons/apiresource/enum.proto";
import "buf/validate/validate.proto";

// ApiResourceMetadata contains standard metadata for all API resources.
// Every resource belongs to an organization and has a visibility setting.
message ApiResourceMetadata {
  // Human-readable name of the resource, at most 200 characters.
  // Validation is skipped when the field is empty (e.g., server-generated
  // responses or partial messages).
  string name = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 200
  ];

  // URL-friendly identifier, unique within the organization (an
  // Organization's own slug is unique across the server).
  // Combined with org, forms the canonical reference: "org/slug".
  // Update and apply never change it: a kind whose slug may change has a
  // rename RPC (organization, agent, vault, schedule, channel app, OAuth
  // app, platform client, team and federation issuer), after which the old
  // slug leads to the resource for reading for 30 days.
  // Format: lowercase alphanumeric characters and hyphens, 2 to 63
  // characters, the length every reference to a resource holds; must start
  // with a letter and end with a letter or digit. When empty, the server
  // derives the slug from the name, and refuses a name whose derived slug
  // breaks these rules, never shortening it. A resource the server names
  // itself is the exception (an identity account, after its email or
  // subject): its slug is made to fit instead (a letter in front, a
  // fallback, or a cut with a short hash). An update by id keeps the
  // stored slug, so a new name's derived slug is not checked there.
  string slug = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 2,
    (buf.validate.field).string.max_len = 63,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9-]*[a-z0-9]$"
  ];

  // System-generated unique identifier.
  //
  // For every kind this is a generated, prefixed id (e.g. agt_<ulid>,
  // org_<ulid>). An organization made by a release before organization ids
  // were minted keeps the id it was given then, which equals its first slug.
  // Two kinds derive it from their natural key instead: a direct
  // IdentityAccount's id is derived from its issuer subject (`ida_` followed by 26 Crockford-base32 characters of
  // sha256(spec.idp_id)), so one subject can only ever be one account; and
  // an IamPolicy's id is derived from its triple (`iamp_` followed by 26
  // Crockford-base32 characters of sha256 over
  // `principal.kind:principal.id#principal.relation@resource.kind:resource.id#relation`),
  // so one grant can only ever be one row.
  string id = 3;

  // Organization that owns this resource, by id.
  // A request may name it by id or by slug; the server stores, and answers
  // with, the id, so a resource stays in its organization across a rename.
  // On a server that holds one organization (the open-source edition,
  // GetServerInfoOutput.single_org), an empty org is that organization:
  // the server makes it the first time it starts and fills it into every
  // request that leaves it empty.
  // On a server that holds several: required, and enforced by
  // authorization.
  // Every organization-scoped resource belongs to exactly one organization.
  // An Organization's own org is always empty: it belongs to no
  // organization.
  string org = 4;

  // Visibility controls who can read this resource.
  // - PRIVATE: the owner and explicit grants.
  // - ORG: every member of the owning organization.
  // - CHILD_ORGS: everyone in the owning organization's child
  //   organizations (blueprint kinds only).
  // Write access always requires membership of the owning organization.
  // Default: config-driven per kind — blueprint kinds (marked
  // defaults_to_org_visibility) default to ORG; all other kinds default to PRIVATE.
  //
  // Mutation contract: visibility is set at create and changed ONLY through
  // the kind's UpdateVisibility RPC, where the visibility guards live
  // (per-kind level support). A plain Update
  // preserves the stored value — a request-carried level is ignored, never
  // applied. Declarative clients that want a manifest's visibility to land
  // on update must follow up with UpdateVisibility (the CLI and MCP apply
  // surfaces do this automatically).
  ApiResourceVisibility visibility = 5 [(buf.validate.field).enum.defined_only = true];

  // Key-value labels for organizing and filtering resources, in the
  // Kubernetes form, so a label is always a valid selector.
  // A key is an optional DNS subdomain prefix of at most 253 characters and
  // a slash, then a name of at most 63 characters that starts and ends with
  // a letter or digit and holds only letters, digits, `-`, `_` and `.`. A
  // value is empty or follows the name rule. At most 64 labels.
  map<string, string> labels = 6 [
    (buf.validate.field).map = {
      max_pairs: 64
      keys: {
        string: {
          max_len: 317
          pattern: "^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$"
        }
      }
      values: {
        string: {pattern: "^([A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?)?$"}
      }
    },
    (buf.validate.field).cel = {
      id: "labels.key_prefix_max_len"
      message: "a label key's prefix is at most 253 characters"
      expression: "this.all(k, !k.contains('/') || k.matches('^[^/]{1,253}/'))"
    }
  ];

  reserved 7;
  reserved "annotations";

  // Search words for the resource, in GitHub's topic form: lowercase
  // letters, digits and hyphens, starting with a letter or digit, at most 50
  // characters each. At most 20, each once.
  repeated string tags = 8 [(buf.validate.field).repeated = {
    max_items: 20
    unique: true
    items: {
      string: {pattern: "^[a-z0-9][a-z0-9-]{0,49}$"}
    }
  }];

  // Version information for the resource.
  ApiResourceMetadataVersion version = 9;

  // A fingerprint of what a person edits on the resource: its spec, name,
  // labels and tags, as stored.
  //
  // Send it back on update or apply to refuse the write with ABORTED
  // (ETAG_MISMATCH) when the resource changed since it was read; leave it
  // empty and the last write wins. A status write never changes it.
  //
  // @internal
  // Stamped by the store on every write of a resource, from its stored
  // form, so a response carries it with no read, and a redacted or
  // slug-filled response still answers the stored fingerprint. An exported
  // manifest drops it, so an apply from a file is a desired state, never a
  // freshness check.
  string etag = 10;
}

// ApiResourceMetadataVersion contains version tracking information.
//
// For versioned resources (is_versioned: true), this is populated by the
// backend on every spec-changing create/update:
// - id: content hash of the new version (SHA-256)
// - message: user-provided description of what changed
// - previous_version_id: hash of the prior version
// - tag: optional version tag assigned at apply time
message ApiResourceMetadataVersion {
  // Unique identifier for this version.
  // For versioned resources: SHA-256 content hash.
  string id = 1;

  // Message describing what changed in this version.
  // Analogous to a git commit message.
  string message = 2;

  // Reference to the previous version ID.
  string previous_version_id = 3;

  // Optional tag to assign to this version at creation time.
  // Only applicable to versioned resources (Agents, Skills, Plugins).
  // Examples: "stable", "v1.0", "production"
  string tag = 4;
}
