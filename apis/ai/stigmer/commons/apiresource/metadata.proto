syntax = "proto3";

package ai.stigmer.commons.apiresource;

import "ai/stigmer/commons/apiresource/enum.proto";
import "buf/validate/validate.proto";

// ApiResourceMetadata contains standard metadata for all API resources.
// Every resource belongs to an organization and has a visibility setting.
message ApiResourceMetadata {
  // Human-readable name of the resource.
  // Validation is skipped when the field is empty (e.g., server-generated
  // responses or partial messages).
  string name = 1 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  // URL-friendly identifier, unique within the organization.
  // Combined with org, forms the canonical reference: "org/slug".
  // Format: lowercase alphanumeric characters and hyphens (min 2 chars);
  // must start with a letter and end with a letter or digit. When empty,
  // the server derives the slug from the name.
  string slug = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 2,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9-]*[a-z0-9]$"
  ];

  // System-generated unique identifier.
  string id = 3;

  // Organization that owns this resource.
  // In Local Mode: Set by the project manifest (seedpack bootstraps "stigmer" org).
  // In Cloud Mode: Required and enforced by the Authorization Service.
  // All resources belong to exactly one organization.
  string org = 4;

  // Visibility controls who can access this resource.
  // - PRIVATE: Only members of the owning organization can access.
  // - PUBLIC: Anyone can access (read). Write access still requires org membership.
  // Default: config-driven per kind — blueprint kinds (marked
  // defaults_to_org_visibility) default to ORG; all other kinds default to PRIVATE.
  ApiResourceVisibility visibility = 5 [(buf.validate.field).enum.defined_only = true];

  // Key-value labels for organization and filtering.
  map<string, string> labels = 6;

  // Key-value annotations for additional metadata.
  map<string, string> annotations = 7;

  // Tags for categorization.
  repeated string tags = 8;

  // Version information for the resource.
  ApiResourceMetadataVersion version = 9;
}

// ApiResourceMetadataVersion contains version tracking information.
//
// For versioned resources (is_versioned: true), this is populated by the
// backend on every spec-changing create/update:
// - id: content hash of the new version (SHA-256)
// - message: user-provided description of what changed
// - previous_version_id: hash of the prior version
// - tag: optional version tag assigned at apply time
message ApiResourceMetadataVersion {
  // Unique identifier for this version.
  // For versioned resources: SHA-256 content hash.
  string id = 1;

  // Message describing what changed in this version.
  // Analogous to a git commit message.
  string message = 2;

  // Reference to the previous version ID.
  string previous_version_id = 3;

  // Optional tag to assign to this version at creation time.
  // Only applicable to versioned resources (Skills, Workflows).
  // Examples: "stable", "v1.0", "production"
  //
  // @since Workflow Versioning
  string tag = 4;
}
