syntax = "proto3";

package ai.stigmer.commons.apiresource.apiresourcekind;

import "ai/stigmer/iam/v1/enum.proto";

option java_outer_classname = "AuthorizationConfigProto";

// =============================================================================
// FGA AUTHORIZATION CONFIGURATION
// =============================================================================
// This file defines the authorization configuration that is embedded in
// ApiResourceKind enum metadata. The configuration drives FGA tuple creation
// at runtime, eliminating hardcoded authorization logic.
//
// Design principles:
// - Self-documenting: Proto IS the source of truth for authorization rules
// - Configuration-driven: Service reads config, no hardcoded logic
// - Extensible: New resources just need proto config, no code changes
// - Auditable: All authorization patterns visible in one place
// =============================================================================

// Primary scope linkage for FGA authorization.
// Determines what the resource links to for permission inheritance.
enum AuthorizationScopeType {
  AUTHORIZATION_SCOPE_TYPE_UNSPECIFIED = 0;

  // Links to platform singleton.
  // Used for: organization, identity_account
  // FGA tuple: resource#platform@platform:stigmer
  AUTHORIZATION_SCOPE_TYPE_PLATFORM = 1;

  // Links to an organization.
  // Used for: agent, skill, workflow, environment, session, mcp_server, etc.
  // FGA tuple: resource#organization@organization:<org_id>
  AUTHORIZATION_SCOPE_TYPE_ORGANIZATION = 2;

  // Links to a parent resource.
  // Used for: agent_execution (links to session)
  // FGA tuple: resource#<relation>@<parent_kind>:<parent_id>
  AUTHORIZATION_SCOPE_TYPE_PARENT = 3;

  // Owner link only, no scope hierarchy.
  // Used for: api_key, execution_context (belongs to user, not org)
  // FGA tuple: resource#owner@identity_account:<owner_id>
  AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY = 4;

  // No FGA tuples needed.
  // Used for: platform (singleton), api_resource_version
  AUTHORIZATION_SCOPE_TYPE_NONE = 5;
}

// How owner attribution is handled for a resource.
// Determines whether/how the owner relation tuple is created.
enum OwnerAttributionType {
  OWNER_ATTRIBUTION_TYPE_UNSPECIFIED = 0;

  // Creator becomes owner via direct tuple.
  // Used for: most resources where creator should have edit/delete rights
  // FGA tuple: resource#owner@identity_account:<creator_id>
  OWNER_ATTRIBUTION_TYPE_DIRECT = 1;

  // Owner is computed from parent - no tuple created.
  // Used for: agent_execution (inherits owner from session)
  // FGA: owner relation derived via "owner from session"
  OWNER_ATTRIBUTION_TYPE_INHERITED = 2;

  // Self-ownership - resource owns itself.
  // Used for: identity_account (user owns their own account)
  // FGA tuple: identity_account:<id>#owner@identity_account:<id>
  OWNER_ATTRIBUTION_TYPE_SELF = 3;

  // No owner attribution.
  // Used for: platform (singleton), internal resources
  OWNER_ATTRIBUTION_TYPE_NONE = 4;
}

// Visibility configuration: the set of visibility levels a resource kind
// may be set to. The declared levels drive both request validation (an
// unsupported level is rejected with INVALID_ARGUMENT before persist) and
// FGA tuple reconciliation (each level maps to exactly one tuple shape):
//
// - visibility_private: no visibility tuple (owner + explicit grants only)
// - visibility_org:     resource#viewer@organization:<org>#member
// - visibility_public:  resource#viewer@identity_account:* (conditional
//                       wildcard gated by allow_public)
// - visibility_platform: resource#platform_viewer@identity_provider:<idp>#platform_user
//                       (the "private catalog" primitive: grants access to
//                       all members of all platform_managed orgs linked to
//                       the owning org's IdentityProvider)
//
// Kinds WITHOUT a visibility config accept only visibility_private (or
// unspecified) — they are personal or org-structural resources whose access
// is fully defined by their FGA model, never by per-resource visibility
// tuples (session, environment, executions, etc.).
//
// Current classification:
// - Blueprint kinds (agent, skill, workflow, mcp_server):
//     private, org, public, platform
// - Instance kinds (agent_instance, workflow_instance):
//     private, org, public — platform is deliberately excluded to preserve
//     tenant isolation: each managed org instantiates shared blueprints
//     inside its own boundary. (System-managed DEFAULT instances opt out of
//     visibility entirely: their access tracks the parent blueprint
//     structurally via the default_of FGA relation.)
//
// Note: levels are declared as one bool per level instead of a repeated
// ApiResourceVisibility because that enum lives in the parent apiresource
// package, whose generated Go package already imports this one — a typed
// reference here would create a Go package import cycle.
message VisibilityConfig {
  // Whether resources of this kind can be set to visibility_public.
  // FGA tuple: resource#viewer@identity_account:* (gated by allow_public)
  bool supports_public = 1;

  // Whether resources of this kind can be set to visibility_platform.
  // FGA tuple: resource#platform_viewer@identity_provider:<idp>#platform_user
  //
  // Reserved for blueprint kinds (agent, skill, workflow, mcp_server).
  // Instance kinds are deliberately excluded to preserve tenant isolation.
  bool supports_platform = 2;

  // Whether resources of this kind can be set to visibility_org.
  // FGA tuple: resource#viewer@organization:<org>#member
  //
  // Historically org support was inferred from supports_public, which made
  // it impossible to declare "org but not public" and silently skipped org
  // tuples for kinds with no visibility config (the workflow_instance gap).
  bool supports_org = 3;
}

// Configuration for a parent relation link.
// Used for PARENT scope type and additional_parents.
message ParentRelationConfig {
  // Parent resource kind name (e.g., "session", "agent", "workflow").
  // Uses string instead of ApiResourceKind enum to avoid circular imports.
  // Validated at runtime against known resource kinds.
  string kind = 1;

  // Relation name in FGA model (e.g., "session", "agent", "workflow").
  // This is the relation that will be used in the FGA tuple.
  // FGA tuple: resource#<relation>@<kind>:<parent_id>
  string relation = 2;

  // Field name in the resource's spec message that contains the parent ID.
  // The service extracts this field from resource.spec to resolve the parent ID.
  // Example: "session_id" for agent_execution, "agent_id" for agent_instance.
  // This eliminates hardcoded parent ID extraction logic in the service.
  string spec_field = 3;
}

// FGA authorization tuple configuration for a resource kind.
// Embedded in ApiResourceKindMeta to drive tuple creation at runtime.
//
// Example configurations:
//
// Standard org-scoped resource (agent, skill, workflow):
//   scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
//   owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
//   -> Creates: resource#organization@organization:<org_id>
//   -> Creates: resource#owner@identity_account:<creator_id>
//
// Platform-linked resource (organization):
//   scope_type: AUTHORIZATION_SCOPE_TYPE_PLATFORM
//   owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
//   -> Creates: organization#platform@platform:stigmer
//   -> Creates: organization#owner@identity_account:<creator_id>
//
// Parent-bound resource (agent_execution):
//   scope_type: AUTHORIZATION_SCOPE_TYPE_PARENT
//   owner_type: OWNER_ATTRIBUTION_TYPE_INHERITED
//   parent: { kind: "session", relation: "session", spec_field: "session_id" }
//   -> Creates: agent_execution#session@session:<session_id>
//   -> No owner tuple (inherited from session)
//
// Resource with additional parent (agent_instance):
//   scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
//   owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
//   additional_parents: [{ kind: "agent", relation: "agent", spec_field: "agent_id" }]
//   -> Creates: agent_instance#organization@organization:<org_id>
//   -> Creates: agent_instance#agent@agent:<agent_id>
//   -> Creates: agent_instance#owner@identity_account:<creator_id>
//
// Personal resource with creator attribution (environment):
//   scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
//   owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
//   requires_creator_tuple: true
//   grantable_roles: [owner, viewer]
//   -> Creates: environment#organization@organization:<org_id>
//   -> Creates: environment#owner@identity_account:<creator_id>
//   -> Creates: environment#creator@identity_account:<creator_id>
//
// Organization with three-tier role hierarchy:
//   scope_type: AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY
//   owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
//   grantable_roles: [owner, admin, member]
//
// Owner-only resource with no role sharing (api_key, execution_context):
//   scope_type: AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY
//   owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
//   grantable_roles: [] (empty — owner is set at creation, no sharing)
message AuthorizationConfig {
  // Primary scope type - determines main linkage for permission inheritance.
  AuthorizationScopeType scope_type = 1;

  // Owner attribution type - how owner relation is handled.
  OwnerAttributionType owner_type = 2;

  // For PARENT scope: configuration of the parent resource link.
  // Required when scope_type is AUTHORIZATION_SCOPE_TYPE_PARENT.
  ParentRelationConfig parent = 3;

  // Additional parent relations beyond the primary scope.
  // Used for resources that need multiple parent links.
  // Example: agent_instance needs org link AND agent link.
  repeated ParentRelationConfig additional_parents = 4;

  // Visibility configuration: which visibility levels this kind supports.
  // Not configured means the kind accepts only visibility_private — no
  // visibility tuples are ever written for it.
  VisibilityConfig visibility = 5;

  // When true, creates an immutable creator relation tuple alongside the owner tuple.
  // FGA tuple: resource#creator@identity_account:<creator_id>
  // Used for resources where creator identity drives specific permissions
  // (e.g., environment: only the creator can read unredacted secret values).
  // The creator tuple uses the same identity as the owner tuple but serves
  // a different purpose: owner is mutable (can be transferred), creator is
  // permanent attribution.
  bool requires_creator_tuple = 6;

  // Roles that can be granted on this resource kind via IAM policies.
  // Drives the web app role selector and SDK validation for IAM policy creation.
  //
  // Each value must correspond to a directly-assignable FGA relation
  // (defined with [identity_account] in the FGA model). Computed roles
  // and structural relations are excluded.
  //
  // Empty means no user-grantable roles: the resource is either owner-only
  // (api_key, execution_context), inherits authorization from a parent
  // (agent_execution), is self-owned (identity_account), or has no
  // authorization (platform, api_resource_version).
  repeated ai.stigmer.iam.v1.IamRole grantable_roles = 7;
}
