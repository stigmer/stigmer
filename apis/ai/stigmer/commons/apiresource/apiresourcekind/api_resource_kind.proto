syntax = "proto3";

package ai.stigmer.commons.apiresource.apiresourcekind;

import "ai/stigmer/commons/apiresource/apiresourcekind/api_resource_group.proto";
import "ai/stigmer/commons/apiresource/apiresourcekind/authorization_config.proto";
import "google/protobuf/descriptor.proto";

option java_outer_classname = "ApiResourceKindOuterClass";

// Enum value options for api-resource-kind
extend google.protobuf.EnumValueOptions {
  ApiResourceKindMeta kind_meta = 90101;
}

// API resource version.
enum ApiResourceVersion {
  // Default value when no version is set.
  api_resource_version_unspecified = 0;
  // Current API version for all resource types.
  v1 = 1;
}

// The minimum edition that serves a resource kind.
//
// Editions are ordered oss < enterprise < cloud because each composes the
// previous one's units (ai.stigmer.platform.v1.ServerEdition). A kind
// tiered `open_source` is served everywhere; `enterprise` in Enterprise
// and Cloud; `cloud_only` in Cloud alone. Clients hide kinds the connected
// edition does not serve (the SDK's `isResourceAvailable`).
//
// A tier states what the edition's server SERVES today, not a plan: a
// kind's tier changes in the same change that makes the edition serve it,
// so a client never offers a surface the server answers UNIMPLEMENTED to.
//
// Value names are JSON wire and the conformance suite pins them, so
// `cloud_only` keeps its pre-Enterprise name beside `open_source` and
// `enterprise`. Value numbers are wire identifiers, not ranks —
// `enterprise` was added after `cloud_only` and sits at 3; compare tiers
// to editions through an explicit rank, never through these numbers.
enum ResourceTier {
  resource_tier_unspecified = 0;
  // Served by every edition.
  open_source = 1;
  // Served by Stigmer Cloud only.
  cloud_only = 2;
  // Served by Stigmer Enterprise and Stigmer Cloud.
  enterprise = 3;
}

// Platform ID values - defines the singleton platform instance ID
// This enum is used to define the platform kind value wherever platform kind is required
enum PlatformIdValue {
  platform_id_value_unspecified = 0;

  // The Stigmer platform singleton instance
  // This value is used as the resource ID for platform-level authorization
  stigmer = 1;
}

// Metadata for api-resource-kind
message ApiResourceKindMeta {
  // API resource group
  ApiResourceGroup group = 1;
  // API resource version
  ApiResourceVersion version = 2;
  // Kind name
  string name = 3;
  // Display name
  string display_name = 4;
  // Prefix to be used for api-resource metadata.id field
  string id_prefix = 5;
  // Flag to indicate if the api-resource-kind is versioned
  bool is_versioned = 6;
  // Flag to indicate if the api-resource-kind is not searchable
  bool not_search_indexed = 7;
  // The minimum edition that serves this kind (open_source, enterprise or cloud_only).
  ResourceTier tier = 8;
  // FGA authorization configuration - defines how FGA tuples are created for this resource
  AuthorizationConfig authorization = 9;
  // Prefixes this kind's ids were minted with before `id_prefix`. Ids are
  // identities and are never rewritten, so a store keeps the ids it minted
  // under an earlier prefix: readers that tell a kind from an id read these
  // too. Never minted.
  repeated string retired_id_prefixes = 10;
}

// API resource kinds for Stigmer.
enum ApiResourceKind {
  // Default value for unset or unrecognized resource kinds.
  api_resource_kind_unknown = 0;

  // Agentic - System-level audit trails and versioning

  // Immutable version record tracking changes to an API resource.
  api_resource_version = 1 [(kind_meta) = {
    group: agentic
    version: v1
    name: "ApiResourceVersion"
    display_name: "API Resource Version"
    id_prefix: "ver"
    is_versioned: false
    not_search_indexed: true
    // No edition serves this kind today: it has no service proto and no
    // domain in either composition; the enum entry is all there is. The
    // tier stays where it was and moves in the change that adds a service.
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_NONE
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
    }
  }];

  // IAM - Identity and Access Management

  // Role-based access control policy for granting permissions on resources.
  iam_policy = 10 [(kind_meta) = {
    group: iam
    version: v1
    name: "IamPolicy"
    display_name: "IAM Policy"
    id_prefix: "iamp"
    is_versioned: false
    not_search_indexed: true
    // The ROW half of the IamPolicy contract — the recorded grants, all
    // fourteen RPCs — is served by every edition since the organization
    // roles moved into open source: who holds which role on
    // an organization is a fact every edition records and shows. What
    // differs per edition is not the kind but the GRANT SCOPE a
    // composition registers: open source grants roles on organizations
    // only; per-resource grants (a viewer on one agent) are the fine-grained
    // control the Enterprise and Cloud editions add, refused UNIMPLEMENTED
    // where the scope does not admit them — degrade by probe, never by
    // this tier.
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
    }
  }];

  // User account in the identity system.
  identity_account = 11 [(kind_meta) = {
    group: iam
    version: v1
    name: "IdentityAccount"
    display_name: "Identity Account"
    id_prefix: "ida"
    is_versioned: false
    // Nobody searches accounts by prose, and the cloud never indexed them;
    // the flag keeps the kind out of the core index it would otherwise
    // join by tier (stigmer/stigmer#439 derives the searchable set).
    not_search_indexed: true
    // The open-source server serves this kind: the identity-account domain
    // lives once in @stigmer/server, and the cloud composition serves the same
    // domain over its own store driver. The four federation RPCs are a
    // driver capability the Enterprise and Cloud units provide; open source
    // answers them UNIMPLEMENTED by probe, not by this tier.
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY
      owner_type: OWNER_ATTRIBUTION_TYPE_SELF
    }
  }];

  // Credential for programmatic API access.
  api_key = 12 [(kind_meta) = {
    group: iam
    version: v1
    name: "ApiKey"
    display_name: "API Key"
    id_prefix: "key"
    is_versioned: false
    not_search_indexed: true
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
    }
  }];

  // IAM - Organization invitation management

  // Shareable link for joining an organization with a configurable role.
  invitation = 20 [(kind_meta) = {
    group: iam
    version: v1
    name: "Invitation"
    display_name: "Invitation"
    id_prefix: "inv"
    is_versioned: false
    not_search_indexed: true
    // Inviting members across organizations. In the open-source edition
    // members arrive by signing in through the one configured OIDC issuer.
    tier: enterprise
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      // No owner: an invitation is the organization's, managed by its
      // current administrators, so creating one confers nothing that
      // outlives the creator's role. The creator is recorded in the audit
      // trail, and the link redeems only while they could still create it.
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
    }
  }];

  // IAM - External identity provider configuration

  // External identity provider for federated authentication.
  identity_provider = 21 [(kind_meta) = {
    group: iam
    version: v1
    name: "IdentityProvider"
    display_name: "Identity Provider"
    id_prefix: "idp"
    is_versioned: false
    not_search_indexed: true
    // Registering IdPs, SSO enforcement and federating many organizations.
    // The open-source edition has one OIDC issuer by configuration and no
    // IdP resources.
    tier: enterprise
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      // No owner: a provider carries its organization's trust configuration
      // and is managed by the organization's current administrators, so a
      // creator who loses admin loses control of it. The creator is
      // recorded in the audit trail.
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
      // A direct grant can only let someone read the provider; managing it
      // is its organization's admins' alone.
      grantable_roles: [viewer]
    }
  }];

  // IAM - Outbound OAuth application credentials

  // Registered OAuth application with an external vendor for outbound authentication.
  oauth_app = 22 [(kind_meta) = {
    group: iam
    version: v1
    name: "OAuthApp"
    display_name: "OAuth App"
    id_prefix: "oapp"
    is_versioned: false
    not_search_indexed: true
    // The open-source server serves this kind (its own domain; the MCP
    // OAuth connect lane depends on it). It was tiered cloud_only by drift,
    // which hid in the console a kind the server answered. The hosted-only
    // org-override surface on top of it degrades by probe (UNIMPLEMENTED),
    // not by this tier.
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      // No owner: an OAuth app carries its organization's credentials with a
      // vendor and is managed by the organization's current administrators,
      // so a creator who loses admin loses control of it. The creator is
      // recorded in the audit trail.
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
      // A direct grant can only let someone read the app; managing it is its
      // organization's admins' alone.
      grantable_roles: [viewer]
    }
  }];

  // IAM - Platform client credentials for inbound authentication

  // OAuth2 client credential for platform builders embedding Stigmer into their products.
  platform_client = 23 [(kind_meta) = {
    group: iam
    version: v1
    name: "PlatformClient"
    display_name: "Platform Client"
    id_prefix: "pcl"
    is_versioned: false
    not_search_indexed: true
    // The open-source server serves this kind in every edition: its own
    // domain over a store port the cloud fills with its own table. Minting
    // user tokens needs a server that authenticates its callers; a server
    // that trusts every request refuses the mint, not the kind. The guest
    // mint on the same token service is an edition capability that degrades
    // by probe (UNIMPLEMENTED), not by this tier.
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      // No owner: a platform client mints tokens into its organization and is
      // managed by the organization's current administrators, so a creator
      // who loses admin loses control of it. The creator is recorded in the
      // audit trail.
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
      // A direct grant can only let someone read the client; managing it is
      // its organization's admins' alone.
      grantable_roles: [viewer]
    }
  }];

  // IAM - Teams

  // Named group of an organization's people that access is shared with as one.
  team = 24 [(kind_meta) = {
    group: iam
    version: v1
    name: "Team"
    display_name: "Team"
    id_prefix: "tm"
    is_versioned: false
    not_search_indexed: true
    // Grouping people so access is shared with a team rather than person by
    // person is fine-grained control a security team asks for; the
    // open-source edition shares with people and with the whole
    // organization.
    tier: enterprise
    authorization: {
      // A team belongs to its organization; its membership is bounded by
      // the organization's membership in the model.
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      // No owner: a team is the organization's, managed by its
      // administrators. The creator is recorded in the audit trail.
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
      grantable_roles: [member]
    }
  }];

  // Tenancy - Platform and organizational resources

  // The boundary that holds people, Agents, Sessions and secrets
  // together; nothing outside it sees them.
  //
  // Its id is a minted org_<ulid> that never changes; every organization-scoped
  // resource names it by that id (metadata.org). Its slug is unique across the
  // server and may change through rename; requests may name the organization
  // by either.
  organization = 30 [(kind_meta) = {
    group: tenancy
    version: v1
    name: "Organization"
    display_name: "Organization"
    id_prefix: "org"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        admin,
        member,
        viewer
      ]
    }
  }];

  // Singleton platform instance representing the Stigmer deployment.
  platform = 31 [(kind_meta) = {
    group: tenancy
    version: v1
    name: "Platform"
    display_name: "Platform"
    id_prefix: "plt"
    is_versioned: false
    not_search_indexed: true
    // The tier names the platform#operator seat, which a company
    // self-hosting Enterprise owns for its own instance. (getServerInfo on
    // PlatformQueryController is answered by every edition; it is not this
    // kind.) Billing-operator permissions on the platform stay gated by the
    // cloud's billing unit, not by this tier; the platform#credit_issuer
    // seat is one of them, a cloud billing seat no self-hosted server uses.
    tier: enterprise
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_NONE
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
    }
  }];

  // Agentic - AI agent management

  // AI assistant with instructions, tools, skills, and a delegation model.
  agent = 40 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Agent"
    display_name: "Agent"
    id_prefix: "agt"
    is_versioned: true
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      visibility: {
        supports_org: true
        supports_child_orgs: true
        defaults_to_org_visibility: true
      }
      grantable_roles: [
        owner,
        editor,
        viewer
      ]
      team_grantable_roles: [
        editor,
        viewer
      ]
    }
  }];

  // Single run of an agent within a session, tracking tool calls and responses.
  run = 41 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Run"
    display_name: "Run"
    id_prefix: "run"
    retired_id_prefixes: ["aex"]
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_PARENT
      owner_type: OWNER_ATTRIBUTION_TYPE_INHERITED
      parent: {
        kind: "session"
        relation: "session"
        spec_field: "session_id"
      }
    }
  }];

  // Conversation thread between a user and an agent.
  session = 42 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Session"
    display_name: "Session"
    id_prefix: "ses"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // Knowledge resource that provides domain-specific context to an agent.
  skill = 43 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Skill"
    display_name: "Skill"
    id_prefix: "skl"
    is_versioned: true
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      visibility: {
        supports_org: true
        supports_child_orgs: true
        defaults_to_org_visibility: true
      }
      grantable_roles: [
        owner,
        viewer
      ]
      team_grantable_roles: [viewer]
    }
  }];

  // External tool server connected via the Model Context Protocol.
  mcp_server = 44 [(kind_meta) = {
    group: agentic
    version: v1
    name: "McpServer"
    display_name: "MCP Server"
    id_prefix: "mcp"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      visibility: {
        supports_org: true
        supports_child_orgs: true
        defaults_to_org_visibility: true
      }
      grantable_roles: [
        owner,
        editor,
        viewer
      ]
      team_grantable_roles: [
        editor,
        viewer
      ]
    }
  }];

  // Value 45 was the agent instance, a configured deployment of an agent,
  // removed when conversations came to name their agent directly. Stored
  // rows of the retired kind are moved off by the store migration that
  // removed it.
  reserved 45;
  reserved "agent_instance";

  // Hosted chat link for an agent with its own audience, origins, and credentials.
  agent_share = 46 [(kind_meta) = {
    group: agentic
    version: v1
    name: "AgentShare"
    display_name: "Agent Share"
    id_prefix: "ash"
    is_versioned: false
    // Not searchable by design: a share is channel configuration reached
    // through its agent's Share dialog, not a library artifact.
    not_search_indexed: true
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // Connection binding an agent to an external messaging platform workspace.
  agent_channel = 47 [(kind_meta) = {
    group: agentic
    version: v1
    name: "AgentChannel"
    display_name: "Agent Channel"
    id_prefix: "ach"
    is_versioned: false
    // Not searchable by design: a channel is connection configuration
    // reached through its agent's surfaces, not a library artifact.
    // (Mirrors agent_share; skips the Go search-extractor entirely.)
    not_search_indexed: true
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      // participant is the conversation-participation role:
      // reply/takeover on the channel's
      // conversations without config authority. Grantable here only.
      grantable_roles: [
        owner,
        viewer,
        participant
      ]
      team_grantable_roles: [
        viewer,
        participant
      ]
    }
  }];

  // Customer-owned messaging-platform app (e.g. a Slack app) that agent
  // channels can install through instead of the shared platform app.
  channel_app = 48 [(kind_meta) = {
    group: agentic
    version: v1
    name: "ChannelApp"
    display_name: "Channel App"
    id_prefix: "chapp"
    is_versioned: false
    // Not searchable by design: a channel app is credential configuration
    // reached through the org's channel settings, not a library artifact.
    // (Mirrors agent_share/agent_channel; skips the Go search-extractor.)
    not_search_indexed: true
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      // No owner: a channel app carries its organization's credentials with
      // a messaging provider and is managed by the organization's current
      // administrators, so a creator who loses admin loses control of it.
      // The creator is recorded in the audit trail.
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
      // A direct grant can only let someone read the app; managing it is its
      // organization's admins' alone.
      grantable_roles: [viewer]
    }
  }];

  // Value 49 held the Datastore kind (id prefix "dst" — declared
  // collections of typed business records) until the domain was removed
  // platform-wide. Reserved so the number is never reused for a
  // different kind.
  reserved 49;
  reserved "datastore";

  // Value 50 held the Workflow kind (id prefix "wfl": a user-authored
  // multi-step definition run by the step engine) until the workflow
  // product was removed platform-wide. Reserved so the number is never
  // reused for a different kind.
  reserved 50;
  reserved "workflow";

  // Value 51 was the workflow instance, a configured deployment of a
  // workflow, removed when runs came to name their workflow directly and run
  // visibility moved onto the workflow. Stored rows of the retired kind are
  // moved off by the store migration that removed it.
  reserved 51;
  reserved "workflow_instance";

  // Value 52 held the WorkflowRun kind (id prefix "wex": one run of a
  // Workflow) until the workflow product was removed platform-wide.
  // Reserved so the number is never reused for a different kind.
  reserved 52;
  reserved "workflow_run";

  // Agentic - Run environment and context

  // Value 53 held the Environment kind (id prefix "env": a named set of
  // variables and secrets for a run) until vaults replaced it. Reserved so
  // the number is never reused for a different kind.
  reserved 53;
  reserved "environment";

  // User-owned runtime context for managing execution state.
  execution_context = 54 [(kind_meta) = {
    group: agentic
    version: v1
    name: "ExecutionContext"
    display_name: "Execution Context"
    id_prefix: "ectx"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
    }
  }];

  // Value 55 held the Artifact kind (id prefix "art": a blob a workflow
  // step promoted from its output) until the workflow product, its only
  // producer, was removed platform-wide. A run's own files are
  // RunArtifact entries on the run's status, not this kind. Reserved so
  // the number is never reused for a different kind.
  reserved 55;
  reserved "artifact";

  // Agentic - Scheduling

  // Recurring trigger that runs an agent on a cron schedule.
  schedule = 56 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Schedule"
    display_name: "Schedule"
    id_prefix: "sch"
    is_versioned: false
    // Not searchable by design: a schedule is operational configuration
    // reached through its target's surfaces, not a library artifact.
    // (Mirrors agent_share/agent_channel; skips the Go search-extractor.)
    not_search_indexed: true
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        viewer
      ]
      team_grantable_roles: [viewer]
    }
  }];

  // Agentic - Memory (learned facts about people)

  // Agent-proposed, user-confirmed fact the platform remembers about a person.
  memory = 57 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Memory"
    display_name: "Memory"
    id_prefix: "mem"
    is_versioned: false
    // Not searchable by design (privacy): memory content is subject-only
    // and must never surface through the global
    // search index, whose results are org-visible. Also skips the Go
    // search-extractor boot contract, like agent_share/schedule.
    not_search_indexed: true
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      // No owner tuple: the subject relation below is the ONLY principal
      // on a memory. An agent authored the record and the subject decides
      // on it — owner/creator vocabulary would misname both.
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
      // The permanent subject tuple: memory#subject@identity_account:<id>,
      // extracted from spec.subject_identity_account_id (itself
      // server-derived from the calling credential). Content
      // visibility is subject-only: org admins govern the org's
      // memory_enabled switch but never read members' memories.
      additional_parents: [
        {
          kind: "identity_account"
          relation: "subject"
          spec_field: "subject_identity_account_id"
        }
      ]
      // No visibility config (private-only) and no grantable roles:
      // memories are never shared, published, or granted.
    }
  }];

  // Agentic - Plugin (the unit of install)

  // An installed Agent Plugins package: the archive Stigmer materialised into
  // skills, MCP servers and an agent, and the handle that upgrades
  // and removes them together. A plugin is what you install; an agent is what
  // runs. Members are the resources labelled with the plugin's id.
  plugin = 58 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Plugin"
    display_name: "Plugin"
    id_prefix: "plg"
    // The archive digest is the version identity; every push archives the
    // previous head exactly as a skill push does.
    is_versioned: true
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      visibility: {
        supports_org: true
        supports_child_orgs: true
        defaults_to_org_visibility: true
      }
      grantable_roles: [
        owner,
        viewer
      ]
      team_grantable_roles: [viewer]
    }
  }];

  // Agentic - Vaults (the logins and secrets runs use)

  // A person's or an organization's box of logins (matched by a tool's
  // address) and secrets (matched by name) that runs use.
  vault = 59 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Vault"
    display_name: "Vault"
    id_prefix: "vlt"
    is_versioned: false
    // Not searchable by design (privacy): the search index's results are
    // org-visible, and the entry names in a person's My vault are theirs.
    not_search_indexed: true
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      // No owner tuple from the caller: the owner is a server-stamped
      // oneof in the spec. My vault links its person, a shared vault its
      // organization; each row writes exactly one of the two optional
      // parents below.
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
      additional_parents: [
        {
          kind: "identity_account"
          relation: "person"
          spec_field: "person"
          optional: true
        },
        {
          kind: "organization"
          relation: "org_owned"
          spec_field: "org"
          optional: true
        }
      ]
      // ORG is the ceiling, and only on a shared vault: org visibility lets
      // every member use it. My vault refuses every visibility change.
      // Values never cross the organization's boundary.
      visibility: {supports_org: true}
      grantable_roles: [user]
      team_grantable_roles: [user]
    }
  }];

  // Value 60 held the Project kind (id prefix "prj": an aggregate of member
  // references reconciled from a stigmer.yaml by the CLI) until plugins
  // became the one way resources are grouped and it was removed
  // platform-wide. Reserved so the number is never reused for a different
  // kind.
  reserved 60;
  reserved "project";

  // Billing - Plans, and the subscriptions and licenses that grant them.
  //
  // An entitlement is what the platform permits; a subscription and a
  // license are the two instruments that grant it. The three kinds below
  // are what the cloud sells and issues, so every one is cloud_only: the
  // open-source and Enterprise servers never store or serve them. What
  // those editions read (the entitlement vocabulary, the signed license
  // claims, a server's license status) lives under platform/v1, not here.

  // Catalog entry naming a bundle of entitlements and the terms that buy it.
  //
  // Platform-level: a plan belongs to no organization, so it carries no
  // authorization scope and no owner. Immutable once created; a change of
  // terms is a new Plan and the old one retires.
  plan = 70 [(kind_meta) = {
    group: billing
    version: v1
    name: "Plan"
    display_name: "Plan"
    id_prefix: "pln"
    is_versioned: false
    // A catalog, not a searchable resource: read through its own query
    // controller, never through the cross-kind search index.
    not_search_indexed: true
    // Sold and served by the cloud alone. An Enterprise deployment reads
    // its entitlements from its license, never from a plan.
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_NONE
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
    }
  }];

  // An organization's binding to a Plan; at most one active per organization.
  //
  // System-created: the payment system drives its lifecycle, so it has no
  // owner and grants no roles. Its reads and writes authorize on the
  // organization through the billing permissions.
  //
  // @internal
  // Organization-scoped with owner NONE is the memory kind's combination:
  // the organization link is the only tuple the kind ever needs.
  subscription = 71 [(kind_meta) = {
    group: billing
    version: v1
    name: "Subscription"
    display_name: "Subscription"
    id_prefix: "sub"
    is_versioned: false
    not_search_indexed: true
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
    }
  }];

  // A signed grant of entitlements to a self-hosting customer for a term.
  //
  // Platform-level: issued by the cloud's operators and verified offline by
  // the Enterprise server, so the customer is a value inside the license
  // (which may or may not name a cloud organization) and the kind has no
  // authorization scope and no owner. Claims are immutable once signed; a
  // renewal is a new License.
  license = 72 [(kind_meta) = {
    group: billing
    version: v1
    name: "License"
    display_name: "License"
    id_prefix: "lic"
    is_versioned: false
    not_search_indexed: true
    // Issued by the cloud; the Enterprise server that a license unlocks
    // never serves the kind, it reads the signed claims the license carries.
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_NONE
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
    }
  }];
}

// Note: Extension field 'kind_meta' (90101) is used for metadata access in Java
