  // User-owned runtime context for managing execution state.
  execution_context = 54 [(kind_meta) = {
    group: agentic
    version: v1
    name: "ExecutionContext"
    display_name: "Execution Context"
    id_prefix: "ectx"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY
