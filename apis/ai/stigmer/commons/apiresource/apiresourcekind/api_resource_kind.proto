syntax = "proto3";

package ai.stigmer.commons.apiresource.apiresourcekind;

import "ai/stigmer/commons/apiresource/apiresourcekind/api_resource_group.proto";
import "ai/stigmer/commons/apiresource/apiresourcekind/authorization_config.proto";
import "google/protobuf/descriptor.proto";

option java_outer_classname = "ApiResourceKindOuterClass";

// Enum value options for api-resource-kind
extend google.protobuf.EnumValueOptions {
  ApiResourceKindMeta kind_meta = 90101;
}

// API resource version.
enum ApiResourceVersion {
  // Default value when no version is set.
  api_resource_version_unspecified = 0;
  // Current API version for all resource types.
  v1 = 1;
}

// Resource tier defines the availability context of a resource
enum ResourceTier {
  resource_tier_unspecified = 0;
  open_source = 1; // Available in CLI local mode & Cloud
  cloud_only = 2; // Hidden in CLI local mode; Available in Cloud
}

// Platform ID values - defines the singleton platform instance ID
// This enum is used to define the platform kind value wherever platform kind is required
enum PlatformIdValue {
  platform_id_value_unspecified = 0;

  // The Stigmer platform singleton instance
  // This value is used as the resource ID for platform-level authorization
  stigmer = 1;
}

// Metadata for api-resource-kind
message ApiResourceKindMeta {
  // API resource group
  ApiResourceGroup group = 1;
  // API resource version
  ApiResourceVersion version = 2;
  // Kind name
  string name = 3;
  // Display name
  string display_name = 4;
  // Prefix to be used for api-resource metadata.id field
  string id_prefix = 5;
  // Flag to indicate if the api-resource-kind is versioned
  bool is_versioned = 6;
  // Flag to indicate if the api-resource-kind is not searchable
  bool not_search_indexed = 7;
  // Defines availability context - whether resource is available in open source or cloud only
  ResourceTier tier = 8;
  // FGA authorization configuration - defines how FGA tuples are created for this resource
  AuthorizationConfig authorization = 9;
}

// API resource kinds for Stigmer.
enum ApiResourceKind {
  // Default value for unset or unrecognized resource kinds.
  api_resource_kind_unknown = 0;

  // Agentic - System-level audit trails and versioning

  // Immutable version record tracking changes to an API resource.
  api_resource_version = 1 [(kind_meta) = {
    group: agentic
    version: v1
    name: "ApiResourceVersion"
    display_name: "API Resource Version"
    id_prefix: "ver"
    is_versioned: false
    not_search_indexed: true
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_NONE
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
    }
  }];

  // IAM - Identity and Access Management

  // Role-based access control policy for granting permissions on resources.
  iam_policy = 10 [(kind_meta) = {
    group: iam
    version: v1
    name: "IamPolicy"
    display_name: "IAM Policy"
    id_prefix: "iamp"
    is_versioned: false
    not_search_indexed: true
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
    }
  }];

  // User account in the identity system.
  identity_account = 11 [(kind_meta) = {
    group: iam
    version: v1
    name: "IdentityAccount"
    display_name: "Identity Account"
    id_prefix: "ida"
    is_versioned: false
    not_search_indexed: false
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY
      owner_type: OWNER_ATTRIBUTION_TYPE_SELF
    }
  }];

  // Credential for programmatic API access.
  api_key = 12 [(kind_meta) = {
    group: iam
    version: v1
    name: "ApiKey"
    display_name: "API Key"
    id_prefix: "key"
    is_versioned: false
    not_search_indexed: true
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
    }
  }];

  // IAM - Organization invitation management

  // Shareable link for joining an organization with a configurable role.
  invitation = 20 [(kind_meta) = {
    group: iam
    version: v1
    name: "Invitation"
    display_name: "Invitation"
    id_prefix: "inv"
    is_versioned: false
    not_search_indexed: true
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
    }
  }];

  // IAM - External identity provider configuration

  // External identity provider for federated authentication.
  identity_provider = 21 [(kind_meta) = {
    group: iam
    version: v1
    name: "IdentityProvider"
    display_name: "Identity Provider"
    id_prefix: "idp"
    is_versioned: false
    not_search_indexed: true
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // IAM - Outbound OAuth application credentials

  // Registered OAuth application with an external vendor for outbound authentication.
  oauth_app = 22 [(kind_meta) = {
    group: iam
    version: v1
    name: "OAuthApp"
    display_name: "OAuth App"
    id_prefix: "oapp"
    is_versioned: false
    not_search_indexed: true
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // IAM - Platform client credentials for inbound authentication

  // OAuth2 client credential for platform builders embedding Stigmer into their products.
  platform_client = 23 [(kind_meta) = {
    group: iam
    version: v1
    name: "PlatformClient"
    display_name: "Platform Client"
    id_prefix: "pcl"
    is_versioned: false
    not_search_indexed: true
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // Tenancy - Platform and organizational resources

  // Top-level tenant that owns and manages resources.
  //
  // Organization is the one resource whose metadata.id equals its metadata.slug
  // (set by the create pipeline), not a minted org_<ulid>. It is the immutable,
  // globally unique tenancy root that every child resource references by slug
  // (metadata.org), so its slug is globally unique and doubles as its id.
  // id_prefix below is retained deliberately: it still anchors legacy org_<ulid>
  // records and the CLI's id-vs-slug detection — it is not used to mint new ids.
  organization = 30 [(kind_meta) = {
    group: tenancy
    version: v1
    name: "Organization"
    display_name: "Organization"
    id_prefix: "org"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        admin,
        member,
        viewer
      ]
    }
  }];

  // Singleton platform instance representing the Stigmer deployment.
  platform = 31 [(kind_meta) = {
    group: tenancy
    version: v1
    name: "Platform"
    display_name: "Platform"
    id_prefix: "plt"
    is_versioned: false
    not_search_indexed: true
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_NONE
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
    }
  }];

  // Agentic - AI agent management

  // AI assistant with instructions, tools, skills, and a delegation model.
  agent = 40 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Agent"
    display_name: "Agent"
    id_prefix: "agt"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      visibility: {
        supports_org: true
        supports_public: true
        supports_platform: true
        defaults_to_org_visibility: true
      }
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // Single run of an agent within a session, tracking tool calls and responses.
  agent_execution = 41 [(kind_meta) = {
    group: agentic
    version: v1
    name: "AgentExecution"
    display_name: "Agent Execution"
    id_prefix: "aex"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_PARENT
      owner_type: OWNER_ATTRIBUTION_TYPE_INHERITED
      parent: {
        kind: "session"
        relation: "session"
        spec_field: "session_id"
      }
    }
  }];

  // Conversation thread between a user and an agent.
  session = 42 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Session"
    display_name: "Session"
    id_prefix: "ses"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // Knowledge resource that provides domain-specific context to an agent.
  skill = 43 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Skill"
    display_name: "Skill"
    id_prefix: "skl"
    is_versioned: true
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      visibility: {
        supports_org: true
        supports_public: true
        supports_platform: true
        defaults_to_org_visibility: true
      }
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // External tool server connected via the Model Context Protocol.
  mcp_server = 44 [(kind_meta) = {
    group: agentic
    version: v1
    name: "McpServer"
    display_name: "MCP Server"
    id_prefix: "mcp"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      visibility: {
        supports_org: true
        supports_public: true
        supports_platform: true
        defaults_to_org_visibility: true
      }
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // Configured deployment of an agent with environment-specific overrides.
  agent_instance = 45 [(kind_meta) = {
    group: agentic
    version: v1
    name: "AgentInstance"
    display_name: "Agent Instance"
    id_prefix: "ain"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      // platform is deliberately absent: instances are tenant-isolated.
      // System-managed default instances ignore visibility entirely — their
      // access tracks the parent agent via the default_of FGA relation.
      visibility: {
        supports_org: true
        supports_public: true
      }
      additional_parents: [
        {
          kind: "agent"
          relation: "agent"
          spec_field: "agent_id"
        }
      ]
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // Hosted chat link for an agent with its own audience, origins, and credentials.
  agent_share = 46 [(kind_meta) = {
    group: agentic
    version: v1
    name: "AgentShare"
    display_name: "Agent Share"
    id_prefix: "ash"
    is_versioned: false
    // Not searchable by design: a share is channel configuration reached
    // through its agent's Share dialog, not a library artifact.
    not_search_indexed: true
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // Connection binding an agent to an external messaging platform workspace.
  agent_channel = 47 [(kind_meta) = {
    group: agentic
    version: v1
    name: "AgentChannel"
    display_name: "Agent Channel"
    id_prefix: "ach"
    is_versioned: false
    // Not searchable by design: a channel is connection configuration
    // reached through its agent's surfaces, not a library artifact.
    // (Mirrors agent_share; skips the Go search-extractor entirely.)
    not_search_indexed: true
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      // participant is the conversation-participation role
      // (channel-conversations DD-010): reply/takeover on the channel's
      // conversations without config authority. Grantable here only.
      grantable_roles: [
        owner,
        viewer,
        participant
      ]
    }
  }];

  // Customer-owned messaging-platform app (e.g. a Slack app) that agent
  // channels can install through instead of the shared platform app.
  channel_app = 48 [(kind_meta) = {
    group: agentic
    version: v1
    name: "ChannelApp"
    display_name: "Channel App"
    id_prefix: "chapp"
    is_versioned: false
    // Not searchable by design: a channel app is credential configuration
    // reached through the org's channel settings, not a library artifact.
    // (Mirrors agent_share/agent_channel; skips the Go search-extractor.)
    not_search_indexed: true
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // Value 49 held the Datastore kind (id prefix "dst" — declared
  // collections of typed business records) until the domain was removed
  // platform-wide. Reserved so the number is never reused for a
  // different kind.
  reserved 49;
  reserved "datastore";

  // Agentic - Workflow orchestration

  // Multi-step orchestration defining how agents collaborate on a task.
  workflow = 50 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Workflow"
    display_name: "Workflow"
    id_prefix: "wfl"
    is_versioned: true
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      visibility: {
        supports_org: true
        supports_public: true
        supports_platform: true
        defaults_to_org_visibility: true
      }
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // Configured deployment of a workflow with environment-specific bindings.
  workflow_instance = 51 [(kind_meta) = {
    group: agentic
    version: v1
    name: "WorkflowInstance"
    display_name: "Workflow Instance"
    id_prefix: "win"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      // Mirrors agent_instance: org/public are enum-driven; platform is
      // deliberately absent (tenant isolation). Without this config the
      // reconciler would silently skip org/public viewer tuples for
      // workflow instances (the pre-2026-06 P0 gap).
      visibility: {
        supports_org: true
        supports_public: true
      }
      additional_parents: [
        {
          kind: "workflow"
          relation: "workflow"
          spec_field: "workflow_id"
        }
      ]
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // Single run of a workflow instance, tracking step progress and outcomes.
  workflow_execution = 52 [(kind_meta) = {
    group: agentic
    version: v1
    name: "WorkflowExecution"
    display_name: "Workflow Execution"
    id_prefix: "wex"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      // The workflow_instance link is REQUIRED, not cosmetic: a run inherits
      // opt-in org run observability via `execution_viewer from
      // workflow_instance` (see workflow_execution.fga). Without this parent
      // tuple the inheritance has nothing to traverse, so enabling an
      // instance's execution visibility would silently fail to expose its
      // runs. Mirrors agent_execution's session parent (there via PARENT
      // scope) and the additional_parents pattern of the *_instance kinds.
      additional_parents: [
        {
          kind: "workflow_instance"
          relation: "workflow_instance"
          spec_field: "workflow_instance_id"
        }
      ]
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // Named set of variables and secrets for agent and workflow execution.
  environment = 53 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Environment"
    display_name: "Environment"
    id_prefix: "env"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      requires_creator_tuple: true
      // ORG is the ceiling: org visibility shares the environment with the
      // owning org (members see redacted values; executions in the org may
      // use the values at runtime). Secret reveal stays creator-only at
      // every level. public/platform are deliberately absent — secret
      // values must never be resolvable across the org boundary, and
      // defaults_to_org_visibility is deliberately absent — sharing a
      // credential set is an explicit opt-in, never a creation default.
      visibility: {supports_org: true}
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // Persisted blob produced during workflow or agent execution.
  artifact = 55 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Artifact"
    display_name: "Artifact"
    id_prefix: "art"
    is_versioned: false
    // Truthed by stigmer/stigmer#439: NEITHER edition has ever registered a
    // search extractor for artifacts (nothing indexes artifact writes), so
    // the earlier `false` promised a search surface that never existed.
    // Flip this back only together with real extractors in both editions.
    not_search_indexed: true
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // User-owned runtime context for managing execution state.
  execution_context = 54 [(kind_meta) = {
    group: agentic
    version: v1
    name: "ExecutionContext"
    display_name: "Execution Context"
    id_prefix: "ectx"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
    }
  }];

  // Agentic - Scheduling

  // Recurring trigger that runs an agent on a cron schedule.
  schedule = 56 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Schedule"
    display_name: "Schedule"
    id_prefix: "sch"
    is_versioned: false
    // Not searchable by design: a schedule is operational configuration
    // reached through its target's surfaces, not a library artifact.
    // (Mirrors agent_share/agent_channel; skips the Go search-extractor.)
    not_search_indexed: true
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // Agentic - Memory (learned facts about people)

  // Agent-proposed, user-confirmed fact the platform remembers about a person.
  memory = 57 [(kind_meta) = {
    group: agentic
    version: v1
    name: "Memory"
    display_name: "Memory"
    id_prefix: "mem"
    is_versioned: false
    // Not searchable by design (privacy): memory content is subject-only
    // (DD-004 as ratified) and must never surface through the global
    // search index, whose results are org-visible. Also skips the Go
    // search-extractor boot contract, like agent_share/schedule.
    not_search_indexed: true
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      // No owner tuple: the subject relation below is the ONLY principal
      // on a memory. An agent authored the record and the subject decides
      // on it — owner/creator vocabulary would misname both (DD-004).
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
      // The permanent subject tuple: memory#subject@identity_account:<id>,
      // extracted from spec.subject_identity_account_id (itself
      // server-derived from the calling credential — DD-005 D2). Content
      // visibility is subject-only: org admins govern the org's
      // memory_enabled switch but never read members' memories.
      additional_parents: [
        {
          kind: "identity_account"
          relation: "subject"
          spec_field: "subject_identity_account_id"
        }
      ]
      // No visibility config (private-only) and no grantable roles:
      // memories are never shared, published, or granted.
    }
  }];

  // Tenancy - Project management

  // Aggregate root grouping related resources for lifecycle management.
  project = 60 [(kind_meta) = {
    group: tenancy
    version: v1
    name: "Project"
    display_name: "Project"
    id_prefix: "prj"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];
}

// Note: Extension field 'kind_meta' (90101) is used for metadata access in Java
