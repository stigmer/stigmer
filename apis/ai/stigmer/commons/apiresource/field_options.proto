syntax = "proto3";

package ai.stigmer.commons.apiresource;

import "ai/stigmer/commons/apiresource/apiresourcekind/api_resource_kind.proto";
import "google/protobuf/descriptor.proto";

// Field-level options for api-resource fields
//
// Numbers 90203 (is_expression) and 90205 (discriminated_by) on
// FieldOptions, and 90301 (discriminator_value) on MessageOptions, marked a
// workflow task's expression fields and its typed task configs until the
// workflow product was removed platform-wide. They are never reused, so a
// descriptor written with them never reads as a different option.
extend google.protobuf.FieldOptions {
  // Marks a field as computed/read-only
  bool computed = 90201;
  // Marks a field as immutable (can be set on create, but not updated)
  bool immutable = 90202;
  // Declares what kind of resource an ApiResourceReference field points to.
  // Used by codegen to auto-populate the kind enum and flatten reference types.
  ai.stigmer.commons.apiresource.apiresourcekind.ApiResourceKind reference_kind = 90204;
}
