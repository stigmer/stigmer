syntax = "proto3";

package ai.stigmer.billing.providerkey.v1;

import "google/protobuf/timestamp.proto";

// An organization's own model provider key, as every caller sees it: the key
// itself never leaves the server, only which provider it is for, a hint to
// tell two keys apart, and who saved it and when.
//
// An organization holds at most one key per provider, where the provider
// names the wire protocol: "anthropic" is Anthropic's API or any endpoint
// that speaks it, and "openai" is OpenAI's API or any endpoint that speaks
// it.
//
// The Stigmer Cloud proxy serves every one of the organization's calls to
// that provider on this key, on every plan, and on no other: a run that
// needs a provider the organization holds no key for (by its model) is
// refused with FAILED_PRECONDITION,
// reason PROVIDER_KEY_REQUIRED. The provider bills the organization
// directly, and Stigmer meters the calls without charging them.
//
// Provider keys are not an API resource. They are keyed by organization and
// provider, and they authorize against the organization, as billing does.
//
// @internal
// Served by the cloud composition only; the open-source server serves no
// billing service. A child organization with no key of its own for a
// provider is served by its parent organization's key, which list returns
// as an inherited row.
message ProviderKey {
  // The organization the key serves.
  string org = 1;

  // The provider the key is for: "anthropic" or "openai", the
  // proxy's own provider names.
  string provider = 2;

  // The key's last four characters.
  string key_hint = 3;

  // The identity account that saved the key.
  string created_by = 4;

  google.protobuf.Timestamp created_at = 5;

  // When the key was last replaced.
  google.protobuf.Timestamp updated_at = 6;

  // When the proxy last served a call on the key; unset when it never has.
  // Updated at most once a minute.
  google.protobuf.Timestamp last_used_at = 7;

  // 8 held in_use, which was always true: every plan serves calls on the
  // organization's own key, and list never returns a parent's key the
  // organization's own key shadows. The number and the name are reserved
  // so neither is ever reused for a different field.
  reserved 8;
  reserved "in_use";

  // Set when the row is the parent organization's key, serving this child
  // organization because it holds none of its own for the provider. Such a
  // row is read-only here; it is managed on the parent.
  string inherited_from_org = 9;

  // The endpoint the key is used against, as the provider's own SDK takes
  // it as its base URL; empty means the provider's own API. For example
  // "https://gateway.example.com/openai/v1" for an OpenAI-compatible
  // gateway. Always empty on an inherited row.
  string base_url = 10;
}
