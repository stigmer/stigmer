syntax = "proto3";

package ai.stigmer.billing.providerkey.v1;

import "ai/stigmer/billing/providerkey/v1/api.proto";
import "buf/validate/validate.proto";

// Save the organization's key for a provider, replacing any key it holds for
// that provider.
message SetProviderKeyInput {
  option (buf.validate.message).cel = {
    id: "provider_key.cursor_base_url"
    message: "a Cursor key takes no base URL; Cursor serves from its own hosts"
    expression: "this.provider != 'cursor' || this.base_url == ''"
  };

  string org = 1 [(buf.validate.field).string.min_len = 1];

  string provider = 2 [(buf.validate.field).string = {
    in: [
      "anthropic",
      "openai",
      "cursor"
    ]
  }];

  // The provider API key. Write-only: no read returns it. For "cursor", a
  // Cursor user API key or a team service-account API key (Cursor's SDK
  // refuses Team Admin keys).
  string api_key = 3 [(buf.validate.field).string = {
    min_len: 8
    max_len: 512
  }];

  // The endpoint to use the key against, as the provider's own SDK takes it
  // as its base URL: OpenAI's usually ends in /v1, Anthropic's does not.
  // Empty means the provider's own API. Otherwise an absolute https URL
  // with no credentials, query or fragment, that resolves to a public
  // address; the proxy appends the provider's request path to it, without
  // repeating a trailing /v1. For example
  // "https://my-resource.openai.azure.com/openai/v1". A Cursor key takes
  // none: Cursor serves from its own hosts.
  string base_url = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      uri: true
      prefix: "https://"
      max_len: 2048
    }
  ];
}

// Remove the organization's key for a provider.
message DeleteProviderKeyInput {
  string org = 1 [(buf.validate.field).string.min_len = 1];

  string provider = 2 [(buf.validate.field).string = {
    in: [
      "anthropic",
      "openai",
      "cursor"
    ]
  }];
}

// List the organization's provider keys.
message ListProviderKeysInput {
  string org = 1 [(buf.validate.field).string.min_len = 1];
}

message ListProviderKeysOutput {
  // One row per provider the organization is served on its own or its
  // parent organization's key, in provider order.
  repeated ProviderKey keys = 1;
}
