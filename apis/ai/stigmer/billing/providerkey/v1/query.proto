syntax = "proto3";

package ai.stigmer.billing.providerkey.v1;

import "ai/stigmer/billing/providerkey/v1/io.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// ProviderKeyQueryController reads an organization's own LLM provider keys,
// never their secrets.
//
// Authorizes against the organization with can_view_billing, the permission
// the organization's billing reads use.
//
// @internal
// Served by the cloud composition only.
service ProviderKeyQueryController {
  // List the keys that serve the organization, its own and any it inherits
  // from its integrator, without their secrets.
  rpc list(ListProviderKeysInput) returns (ListProviderKeysOutput) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view provider keys for this organization";
  }
}
