syntax = "proto3";

package ai.stigmer.billing.license.v1;

import "ai/stigmer/billing/license/v1/api.proto";
import "buf/validate/validate.proto";

// LicenseId identifies a license by its unique identifier.
message LicenseId {
  // Unique identifier of the license resource.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// Licenses contains a list of license resources.
message Licenses {
  // License entries.
  repeated License entries = 1;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 2;
}

// ListLicensesInput selects which licenses to list.
message ListLicensesInput {
  // When set, only licenses issued to this customer (LicenseCustomer.id)
  // are returned; every license otherwise.
  string customer_id = 1;

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
}
