syntax = "proto3";

package ai.stigmer.billing.subscription.v1;

import "ai/stigmer/billing/subscription/v1/api.proto";
import "ai/stigmer/billing/subscription/v1/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// SubscriptionQueryController provides the read operations on an
// organization's subscription.
//
// Every read is keyed by the organization, because an organization has at
// most one active subscription, and authorizes on the organization with
// can_view_billing, the permission the billing account's reads use.
//
// @internal
// Served by the cloud composition only (the kind is cloud_only).
service SubscriptionQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = subscription;

  // Get the organization's subscription.
  //
  // NOT_FOUND when the organization has none: it is on the Free plan, which
  // is not a row. Callers that only need what the organization may do
  // should call getEntitlements, which answers for every organization.
  rpc getForOrg(GetSubscriptionForOrgInput) returns (Subscription) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view this organization's subscription";
  }

  // Resolve what the organization is permitted right now.
  //
  // The answer is derived, never stored: the entitlements of the plan the
  // organization's active subscription names, else the Free plan's with an
  // empty plan_id. A child organization has no subscription of its own; its
  // entitlements resolve through its parent organization, whose plan counts
  // the child against the child organizations it includes.
  rpc getEntitlements(GetEntitlementsInput) returns (GetEntitlementsOutput) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view this organization's entitlements";
  }

  // Estimate what the organization's current period will be invoiced.
  //
  // The estimate is the invoice the period would close with: the plan's
  // monthly fee over the whole period (not prorated to the time elapsed),
  // plus the child organizations beyond those the plan includes, plus the
  // agent hours worked so far beyond those the plan includes. It is rated
  // by the same rule the monthly close invoices by, so an estimate read at
  // a period's end equals that period's invoice once every turn's end is
  // recorded. Every other read derives it the same way; nothing is stored.
  //
  // NOT_FOUND when the organization has no live subscription: it is on
  // Free, or it is a child organization on its parent's plan, and
  // neither is invoiced a plan of its own.
  rpc getPeriodEstimate(GetPeriodEstimateInput) returns (PeriodEstimate) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view this organization's period estimate";
  }

  // Read where the organization stands against its plan's agent hours.
  //
  // Answers for every plan, Free included: the working seconds the
  // organization and its child organizations have used in the month its
  // plan counts, the hours the plan includes and its price past them. The
  // count is the one the estimate's working_seconds and the pause at the
  // allowance read, so the three agree at the same instant.
  //
  // NOT_FOUND for a child organization: a child organization is on its
  // parent's plan, whose pool is the parent's to read.
  rpc getAgentHours(GetAgentHoursInput) returns (AgentHours) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view this organization's agent hours";
  }
}
