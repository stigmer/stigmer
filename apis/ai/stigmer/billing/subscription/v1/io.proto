syntax = "proto3";

package ai.stigmer.billing.subscription.v1;

import "ai/stigmer/platform/v1/entitlement.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// GetSubscriptionForOrgInput names the organization whose
// subscription is read.
message GetSubscriptionForOrgInput {
  // The organization's id.
  string org = 1 [(buf.validate.field).required = true];
}

// GetEntitlementsInput names the organization whose entitlements are
// resolved.
message GetEntitlementsInput {
  // The organization's id.
  string org = 1 [(buf.validate.field).required = true];
}

// GetEntitlementsOutput is what an organization is permitted right now and
// the plan that permits it.
message GetEntitlementsOutput {
  // The entitlements in force for the organization.
  ai.stigmer.platform.v1.Entitlements entitlements = 1;

  // The id of the Plan the entitlements were resolved from. Empty when the
  // organization is on Free, which is not a plan row.
  string plan_id = 2;
}

// ChangePlanInput moves an organization onto a plan.
message ChangePlanInput {
  // The organization's id.
  string org = 1 [(buf.validate.field).required = true];

  // The id of the Plan to move onto. Must be an active subscription plan.
  string plan_id = 2 [(buf.validate.field).required = true];
}

// CancelSubscriptionInput names the organization whose subscription is
// canceled.
message CancelSubscriptionInput {
  // The organization's id.
  string org = 1 [(buf.validate.field).required = true];
}

// GetPeriodEstimateInput names the organization whose current period is
// estimated.
message GetPeriodEstimateInput {
  // The organization's id.
  string org = 1 [(buf.validate.field).required = true];
}

// PeriodEstimate is what an organization's current subscription period
// would be invoiced at its end.
//
// Money is in micros (1 USD = 1,000,000). Each line is rounded to whole
// cents the way the invoice rounds it, and total_micros is the sum of the
// rounded lines, so the estimate and the invoice agree to the cent.
message PeriodEstimate {
  // The id of the Plan the period is on.
  string plan_id = 1;

  // When the period began.
  google.protobuf.Timestamp period_start = 2;

  // When the period ends and is invoiced.
  google.protobuf.Timestamp period_end = 3;

  // 4 and 5 held provider_cost_micros and commission_collected_micros: the
  // period's provider cost and the commission collected on it, which fed a
  // usage-share plan cost. A plan is a flat fee and usage is never part of
  // its price, so the numbers and the names are reserved so neither is
  // ever reused for a different field.
  reserved 4, 5;
  reserved "provider_cost_micros", "commission_collected_micros";

  // The child organizations counted against the plan this period.
  int32 child_org_count = 6;

  // The invoice's lines in the order they print, zero lines omitted.
  repeated PeriodEstimateLine lines = 7;

  // The estimated invoice total: the sum of the lines.
  int64 total_micros = 8;
}

// PeriodEstimateLine is one line of an estimated invoice.
message PeriodEstimateLine {
  // What the line charges.
  PeriodEstimateLineKind kind = 1;

  // The line's amount in micros, a whole number of cents.
  int64 amount_micros = 2;
}

// PeriodEstimateLineKind names what an estimated invoice line is for.
enum PeriodEstimateLineKind {
  period_estimate_line_kind_unspecified = 0;

  // The plan's monthly fee.
  plan = 1;

  // 2 was commission_credit, the commission collected on the period's
  // usage credited against a usage-share plan cost. A plan is a flat fee,
  // so no line credits usage; the number and the name are reserved so
  // neither is ever reused for a different line.
  reserved 2;
  reserved "commission_credit";

  // The child organizations beyond those the plan includes, at the
  // plan's fee for each.
  child_orgs = 3;
}
