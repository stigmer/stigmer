syntax = "proto3";

package ai.stigmer.billing.plan.v1;

import "ai/stigmer/billing/plan/v1/api.proto";
import "buf/validate/validate.proto";

// PlanId identifies a plan by its unique identifier.
message PlanId {
  // Unique identifier of the plan resource.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// Plans contains a list of plan resources.
message Plans {
  // Plan entries.
  repeated Plan entries = 1;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 2;
}

// ListPlansInput selects which plans to list.
message ListPlansInput {
  // When true, retired plans are included beside the active ones; by
  // default only plans that can still be bought are returned.
  bool include_retired = 1;

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
}
