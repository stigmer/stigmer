syntax = "proto3";

package ai.stigmer.billing.plan.v1;

import "ai/stigmer/billing/plan/v1/api.proto";
import "ai/stigmer/billing/plan/v1/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// PlanQueryController provides the read operations on the plan catalog.
//
// The catalog is readable by every signed-in caller: the console shows it
// when an organization chooses a plan, and a retired plan stays readable so
// an existing subscription can show what it bought. It is not public: a
// public list would put every seeded row, Enterprise tiers and retired terms
// included, in front of anyone.
//
// @internal
// Served by the cloud composition only (the kind is cloud_only). Both RPCs
// are is_skip_authorization although get carries an id: the kind has no
// authorization scope (AUTHORIZATION_SCOPE_TYPE_NONE, no tuples exist to
// check), and "any authenticated caller, no permission" has no other
// spelling in the annotation vocabulary (getRunnerBootstrapConfig is the
// precedent). The handler performs no further check. Relaxing to public
// later is additive; tightening later would break a caller.
service PlanQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = plan;

  // Get a plan by its unique identifier.
  //
  // Any signed-in caller may read any plan, retired plans included.
  rpc get(PlanId) returns (Plan) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List the plans in the catalog.
  //
  // Returns the active plans; set include_retired to see retired ones too.
  // Any signed-in caller may list.
  rpc list(ListPlansInput) returns (Plans) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
