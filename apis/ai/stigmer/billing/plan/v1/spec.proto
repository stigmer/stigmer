syntax = "proto3";

package ai.stigmer.billing.plan.v1;

import "ai/stigmer/platform/v1/entitlement.proto";
import "buf/validate/validate.proto";

// PlanSpec defines what a plan grants and what buys it.
//
// The spec is written once, at create, and never updated: a plan's terms are
// what a customer agreed to, so a change is a new Plan. Every money field is
// a term of one specific plan row, and no row ships in the contract, so the
// contract itself carries no price.
//
// The instrument decides which terms a plan may carry, and the four rules
// below refuse what cannot be billed. A license plan is invoiced for a
// term, so monthly terms have no meaning on it; a subscription plan bills
// monthly, so an annual price has none. A license never meters a
// self-hosted computer, so it carries no hourly price. And an hourly price
// needs an allowance of agent hours to exceed, since a price with nothing
// to exceed is never charged. per_extra_org_micros is bound to the
// entitlements' child organizations, not to the instrument, and no rule
// ties it to included_child_orgs yet (#2229): without an included count
// the children are unlimited and the fee is likewise never charged.
//
// @internal
// The expressions compare against the enum's numbers (1 subscription, 2
// license) because CEL sees an enum as its integer; the numbers are wire
// bytes and never change.
message PlanSpec {
  option (buf.validate.message).cel = {
    id: "plan_spec.license_has_no_monthly_terms"
    message: "a license plan carries no monthly_minimum_micros, the monthly fee"
    expression: "this.instrument != 2 || !has(this.terms.monthly_minimum_micros)"
  };
  option (buf.validate.message).cel = {
    id: "plan_spec.subscription_has_no_annual_price"
    message: "a subscription plan carries no annual_price_micros"
    expression: "this.instrument != 1 || !has(this.terms.annual_price_micros)"
  };
  option (buf.validate.message).cel = {
    id: "plan_spec.license_has_no_agent_hour_price"
    message: "a license plan carries no per_agent_hour_micros"
    expression: "this.instrument != 2 || !has(this.terms.per_agent_hour_micros)"
  };
  option (buf.validate.message).cel = {
    id: "plan_spec.agent_hour_price_needs_allowance"
    message: "per_agent_hour_micros needs entitlements.limits.included_agent_hours, the hours it is charged past"
    expression: "!has(this.terms.per_agent_hour_micros) || has(this.entitlements.limits.included_agent_hours)"
  };

  // The instrument this plan is bought through.
  PlanInstrument instrument = 1 [(buf.validate.field) = {
    required: true
    enum: {
      defined_only: true
      not_in: [0]
    }
  }];

  // What the plan permits: its limits and features.
  ai.stigmer.platform.v1.Entitlements entitlements = 2 [(buf.validate.field).required = true];

  // The commercial terms. Which fields are set depends on the instrument:
  // a subscription plan carries its monthly fee, a license plan its annual
  // price.
  PlanTerms terms = 3;

  // One or two sentences describing the plan as the pricing page shows it.
  string description = 4 [(buf.validate.field).string.max_len = 1024];
}

// The instrument a plan is bought through.
//
// An entitlement is what the platform permits; a subscription and a license
// are the two instruments that grant it. A plan names which one buys it, so
// the catalog for Stigmer Cloud and the catalog for self-hosted licenses are
// two views of one kind.
enum PlanInstrument {
  plan_instrument_unspecified = 0;

  // Bought as a Subscription by an organization on Stigmer Cloud, invoiced
  // each month: its fee, plus the child organizations and agent hours past
  // what it includes.
  subscription = 1;

  // Bought as a License by a self-hosting customer, invoiced for a term.
  license = 2;
}

// The commercial terms of a plan.
//
// Amounts are micro-USD (one millionth of a dollar). Every field has
// explicit presence: absent means the term does not apply to this plan,
// which is how a subscription plan and a license plan share one message. A
// monthly plan costs its monthly fee, monthly_minimum_micros, plus
// per_extra_org_micros for each child organization beyond the ones it
// includes, plus per_agent_hour_micros for each working agent hour beyond
// the ones it includes. Model tokens are never part of a plan's price;
// working agent hours past the plan's allowance are.
message PlanTerms {
  // The plan's monthly fee: what a subscription plan bills per month, in
  // micro-USD. Absent on a license plan.
  optional int64 monthly_minimum_micros = 1 [(buf.validate.field).int64.gte = 0];

  // 2 held usage_share_basis_points, a share of the month's provider cost a
  // subscription plan billed when it exceeded the monthly fee. Token usage
  // is never part of a plan's price, so the number and the name are
  // reserved so neither is ever reused for a different field.
  reserved 2;
  reserved "usage_share_basis_points";

  // What a subscription plan bills per month for each child organization
  // beyond the ones its entitlements include, in micro-USD. Absent when the
  // plan includes no child organizations.
  optional int64 per_extra_org_micros = 3 [(buf.validate.field).int64.gte = 0];

  // What a license plan invoices for a one-year term, in micro-USD. Absent on
  // a subscription plan.
  optional int64 annual_price_micros = 4 [(buf.validate.field).int64.gte = 0];

  // What a subscription plan bills for each working agent hour past its
  // entitlements' included_agent_hours, in micro-USD. Absent means the plan
  // has no overage: an organization on it pauses at its allowance. Zero is
  // refused, unlike the other terms, because a zero price on an allowance
  // would be a second way to say "unlimited hours", which an absent
  // allowance already says. Absent on a license plan.
  optional int64 per_agent_hour_micros = 5 [(buf.validate.field).int64.gt = 0];
}
