syntax = "proto3";

package ai.stigmer.billing.v1;

// LedgerEntryType classifies each row in the credit ledger.
//
// Every balance-affecting operation produces exactly one immutable ledger entry.
// The type determines sign convention and audit semantics.
enum LedgerEntryType {
  ledger_entry_type_unspecified = 0;

  // Credits added from a Stripe Checkout purchase.
  purchase_credit = 1;

  // Promotional credits granted (e.g., free trial, referral bonus).
  promotional_credit = 2;

  // Debit for a single LLM call during agent execution.
  usage_debit = 3;

  // Hold placed at execution start to reserve credits.
  reservation_hold = 4;

  // Release of unused reservation after execution completes.
  reservation_release = 5;

  // Manual credit added by a platform admin.
  adjustment_credit = 6;

  // Manual debit applied by a platform admin.
  adjustment_debit = 7;

  // Credits reversed due to a Stripe refund.
  refund_reversal = 8;

  // Credits frozen due to an active Stripe dispute.
  dispute_hold = 9;

  // Credits unfrozen after a dispute is resolved in the customer's favor.
  dispute_release = 10;

  // Credits removed upon grant expiration.
  expiry_debit = 11;

  // Credits added from an automatic recharge via saved payment method.
  auto_recharge_credit = 12;
}

// CreditGrantKind classifies how credits were acquired.
//
// Determines burn order (promotional consumed first) and expiry rules.
enum CreditGrantKind {
  credit_grant_kind_unspecified = 0;

  // Credits purchased via Stripe Checkout or auto-recharge.
  purchased = 1;

  // Complimentary credits (free trial, marketing campaign, referral).
  promotional = 2;

  // Credits added by manual admin adjustment.
  adjustment = 3;
}

// BillingAccountStatus tracks the lifecycle state of an org's billing account.
enum BillingAccountStatus {
  billing_account_status_unspecified = 0;

  // Account is operational; credits can be consumed and purchased.
  billing_account_active = 1;

  // Account is frozen (e.g., dispute, compliance hold). Executions blocked.
  billing_account_suspended = 2;

  // Account is permanently closed. No further operations allowed.
  billing_account_closed = 3;
}

// ReservationStatus tracks the lifecycle of an execution credit reservation.
enum ReservationStatus {
  reservation_status_unspecified = 0;

  // Reservation is active; execution is in progress.
  reservation_active = 1;

  // Execution completed; reservation settled and unused credits released.
  reservation_finalized = 2;

  // Reservation expired without finalization (safety timeout).
  reservation_expired = 3;

  // Reservation cancelled before execution started.
  reservation_cancelled = 4;
}

// ExecutionBillingSignal is returned after each usage debit to direct
// the agent runner's behavior.
enum ExecutionBillingSignal {
  execution_billing_signal_unspecified = 0;

  // Balance is healthy; execution may continue.
  continue_execution = 1;

  // Balance is low; execution may continue but a warning should be shown.
  low_balance_warning = 2;

  // Balance is exhausted; execution must stop gracefully.
  stop_execution = 3;
}
