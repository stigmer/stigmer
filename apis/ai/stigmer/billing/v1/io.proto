syntax = "proto3";

package ai.stigmer.billing.v1;

import "ai/stigmer/agentic/run/v1/enum.proto";
import "ai/stigmer/agentic/run/v1/usage.proto";
import "ai/stigmer/billing/v1/model_pricing_baseline.proto";
import "buf/validate/validate.proto";

// ─────────────────────────────────────────────────────────────────────────────
// Command Inputs & Responses
// ─────────────────────────────────────────────────────────────────────────────

// GetOrCreateBillingAccountInput initiates billing for an organization.
// Idempotent: returns the existing account if one already exists.
message GetOrCreateBillingAccountInput {
  string org = 1 [(buf.validate.field).required = true];
}

// RecordLlmCallUsageInput carries proxy-observed data for a single LLM call.
// The billing service resolves the call against the model catalog and
// records what it was; no cost figure is sent or recorded.
//
// Deduplication identity: `call_id` when the caller supplies one, else
// `sequence`. A report that is redelivered under the same identity records
// nothing new; two reports for the same run with distinct call ids
// are two calls even when they share a sequence number (a proxy that
// restarted mid-run numbers from 1 again).
message RecordLlmCallUsageInput {
  string run_id = 1 [(buf.validate.field).required = true];

  // 1-based call ordering within the run, as the reporting proxy
  // counted it. An ordering hint: a proxy counts in process memory, so the
  // numbering restarts when the proxy does. Dedup identity only for callers
  // that send no call_id.
  int32 sequence = 2 [(buf.validate.field).int32.gt = 0];

  // The identity of this call, minted by the proxy once before its first
  // report attempt and reused on every retry of the same report. Opaque
  // to billing; a UUID in practice. Recommended for every caller — a dedup
  // guard keyed on `sequence` alone survives neither a proxy restart nor a
  // second proxy replica. Stamped verbatim onto the usage record's `call_id`.
  string call_id = 20 [(buf.validate.field).string.max_len = 128];

  // Provider identifier (e.g., "openai", "anthropic", "cursor").
  string provider = 3 [(buf.validate.field).required = true];

  // Model as reported by the provider in the response.
  string resolved_model = 4 [(buf.validate.field).required = true];

  // Model as requested by the caller (may differ from resolved_model for aliases).
  string requested_model = 5;

  // Token usage extracted from the provider's SSE stream.
  ai.stigmer.agentic.run.v1.TokenUsage tokens = 6;

  // Status of usage extraction.
  ai.stigmer.agentic.run.v1.UsageCompletionStatus usage_status = 7;

  // Provider request ID from response headers.
  string provider_request_id = 8;

  // HTTP status code from the upstream provider.
  int32 http_status_code = 9;

  // Whether the response was streamed (SSE).
  bool streaming = 10;

  // Provider's finish reason (e.g., "end_turn", "stop").
  string finish_reason = 11;

  // Proxy-observed timing for this call.
  ai.stigmer.agentic.run.v1.ProxyTiming proxy_timing = 12;

  // Raw provider usage JSON for audit/debug.
  string provider_usage_json = 13;

  // Harness that originated this call ("native" or "cursor").
  // Set by the proxy controller based on which proxy path handled the request.
  // When empty, the billing handler falls back to the model catalog.
  string harness = 14;

  // 15, 16 and 17 held cursor_account_id, cursor_key_id and
  // cursor_key_source: which platform-owned Cursor account and key the
  // proxy injected upstream. Every Cursor call now runs on the
  // organization's own Cursor key, so the pool and its attribution were
  // removed; the numbers and the names are reserved so neither is ever
  // reused for a different field.
  reserved 15, 16, 17;
  reserved "cursor_account_id", "cursor_key_id", "cursor_key_source";

  // Provider-reported service tier that actually served this call
  // (native harness, stigmer/stigmer#361): Anthropic reports it in the
  // response usage ("standard" | "priority" | "batch"), OpenAI at the
  // response top level ("default" | "flex" | "priority"). Reported
  // verbatim by the proxy from the SSE stream — the wire truth billing
  // reconciles against the run's REQUESTED tier (the
  // service_tier.mismatch counter). Empty when the provider reported
  // none, and for cursor-harness calls, whose billed variant arrives
  // through the cursor path's pricing-variant resolution instead.
  string served_service_tier = 18;

  // The run this call is metered under, as the proxy resolved
  // it from the run's system of record — on the caller's own
  // credential, before reporting. The billing handler stamps these facts
  // onto the usage record and reconciles the requested tier and thinking
  // mode against what the wire served; it performs NO run lookup of
  // its own (the proxy holds the fact, reports it, the handler stamps it
  // verbatim). Absent when the proxy could not resolve the run — a run
  // found in neither store — in which case the record carries an empty
  // session and the requested-vs-billed reconciliation is skipped.
  MeteredRun metered_run = 19;

  // Whose provider credential the proxy injected upstream for this call,
  // stamped verbatim onto the usage record (the proxy holds the fact).
  // ORGANIZATION means the organization's own provider key served the
  // call, which is recorded and never charged.
  // PLATFORM means a connection the platform provides served it.
  // UNSPECIFIED from a proxy that predates the field.
  ai.stigmer.agentic.run.v1.ProviderKeySource provider_key_source = 21;
}

// The run-side facts LLM metering denormalizes onto every usage
// record, carried from the proxy that authorized the call to the billing
// handler that records it. Deliberately narrower than the settings the
// run resolved: only what metering reconciles or resolves against.
message MeteredRun {
  // The session the run belongs to, stamped onto the usage record.
  string session_id = 1;

  // The model the run resolved (status.run_config.model_name, whichever
  // layer chose it: the message, the agent's defaults or the lane's profile)
  // — the authoritative statement of what was asked for, and the catalog
  // fallback when the wire's requested_model came up empty. Empty when no
  // layer named a model and the engine chose.
  string pinned_model = 2;

  // The service tier the run resolved (status.run_config.
  // service_tier); UNSPECIFIED resolves to standard. Reconciled against
  // served_service_tier by the service_tier.mismatch counter.
  ai.stigmer.agentic.run.v1.ServiceTier requested_service_tier = 3;

  // The thinking mode the run resolved (status.run_config.
  // thinking_mode). Reconciled against the served variant by the
  // thinking.mismatch counter.
  ai.stigmer.agentic.run.v1.ThinkingMode requested_thinking_mode = 4;
}

// RecordLlmCallUsageResponse names the record written, so callers can
// observe what was recorded without querying separately.
message RecordLlmCallUsageResponse {
  // ID of the created LlmCallUsageRecord.
  string usage_record_id = 1;

  // 2, 3 and 4 held provider_cost_micros, customer_billable_amount_micros
  // and is_billable: the call's price and whether it was debited from the
  // organization's prepaid credit. Calls are metered and never priced or
  // charged, so the numbers and the names are reserved so neither is ever
  // reused for a different field.
  reserved 2, 3, 4;
  reserved "provider_cost_micros", "customer_billable_amount_micros", "is_billable";

  // True if this was a duplicate (idempotency key already existed).
  bool is_duplicate = 5;
}

// CreateBillingPortalSessionInput opens a Stripe Customer Portal session
// for payment method management.
//
// The portal allows the user to add, update, or remove payment methods
// without leaving the Stigmer billing flow. The return_url controls where
// Stripe redirects after the user finishes.
message CreateBillingPortalSessionInput {
  string org = 1 [(buf.validate.field).required = true];

  // URL to redirect to after the user exits the Stripe Customer Portal.
  string return_url = 2 [(buf.validate.field).required = true];
}

// CreateBillingPortalSessionResponse returns the Stripe-hosted Portal URL.
message CreateBillingPortalSessionResponse {
  // Stripe Customer Portal URL. Redirect the user here.
  string portal_url = 1;
}

// CreatePaymentMethodSetupSessionInput opens a Stripe Checkout Session in
// setup mode, to save a payment method without a purchase.
//
// The caller's email is resolved from their identity account for Stripe
// Customer creation.
message CreatePaymentMethodSetupSessionInput {
  string org = 1 [(buf.validate.field).required = true];

  // URL to redirect to after the payment method is saved.
  string success_url = 2 [(buf.validate.field).required = true];

  // URL to redirect to if the user leaves without saving one.
  string cancel_url = 3 [(buf.validate.field).required = true];
}

// CreatePaymentMethodSetupSessionResponse returns the Stripe-hosted setup
// page URL.
message CreatePaymentMethodSetupSessionResponse {
  // Stripe Checkout setup page URL. Redirect the user here.
  string setup_url = 1;

  // Stripe Checkout Session ID.
  string checkout_session_id = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Query Inputs & Responses
// ─────────────────────────────────────────────────────────────────────────────

// GetBillingAccountInput retrieves the billing account for an organization.
message GetBillingAccountInput {
  string org = 1 [(buf.validate.field).required = true];
}

// UpsertModelPricingBaselineInput creates or revises one model registry
// baseline entry.
//
// The (model_id, provider, harness) key identifies the entry: when an
// ACTIVE document already exists for the key it is superseded by this
// revision; otherwise a new catalog entry is created (which also revives a
// RETIRED key). Lifecycle fields on the embedded baseline (baseline_id,
// status, supersedes_baseline_id, decided_by/at, created_at) are
// server-owned and ignored; pricing effective_at is stamped server-side
// (see ModelPricingBaseline.effective_at).
message UpsertModelPricingBaselineInput {
  ModelPricingBaseline baseline = 1 [(buf.validate.field).required = true];

  // Optional operator note explaining the revision, recorded on the new
  // document for the audit trail.
  string revision_note = 2 [(buf.validate.field).string.max_len = 1024];
}

// RetireModelPricingBaselineInput removes one model from the catalog.
//
// The ACTIVE document for the key transitions to RETIRED; the rebuilt
// registry drops the model.
message RetireModelPricingBaselineInput {
  string model_id = 1 [(buf.validate.field).required = true];
  string provider = 2 [(buf.validate.field).required = true];
  string harness = 3 [(buf.validate.field).required = true];

  // Optional operator note explaining the retirement.
  string revision_note = 4 [(buf.validate.field).string.max_len = 1024];
}

// ListModelPricingBaselinesInput requests the baseline catalog.
message ListModelPricingBaselinesInput {
  // When true, includes SUPERSEDED and RETIRED revisions (the full audit
  // history). Default: ACTIVE documents only.
  bool include_history = 1;

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
}

// ModelPricingBaselinesResponse is the baseline catalog, ordered by
// harness, provider, then model id; historical revisions (when requested)
// follow their key's ACTIVE document newest-first.
message ModelPricingBaselinesResponse {
  repeated ModelPricingBaseline entries = 1;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 2;
}
