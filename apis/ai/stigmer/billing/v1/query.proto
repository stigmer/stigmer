syntax = "proto3";

package ai.stigmer.billing.v1;

import "ai/stigmer/billing/v1/billing_account.proto";
import "ai/stigmer/billing/v1/io.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// BillingQueryController handles read operations for the billing bounded context.
//
// All RPCs authorize against the organization resource kind with can_view_billing.
service BillingQueryController {
  // Retrieve the billing account for an organization.
  rpc getBillingAccount(GetBillingAccountInput) returns (BillingAccount) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view billing for this organization";
  }

  // Retrieve the credit balance breakdown for an organization.
  rpc getCreditBalance(GetCreditBalanceInput) returns (CreditBalance) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view billing for this organization";
  }

  // Retrieve paginated credit ledger entries with optional filters.
  rpc getCreditLedger(GetCreditLedgerInput) returns (CreditLedgerResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view billing for this organization";
  }

  // Retrieve an aggregated billing usage report for a date range.
  rpc getBillingUsageReport(GetBillingUsageReportInput) returns (BillingUsageReportResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view billing for this organization";
  }

  // Retrieve the customer-facing model price list with markup applied.
  // Returns prices for all models, organized by harness and cost tier.
  rpc getCustomerModelPricing(GetCustomerModelPricingInput) returns (CustomerModelPricingResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view billing for this organization";
  }

  // Retrieve the platform pricing governance view: baseline vs effective
  // rates per model, active override provenance, and pending sign-off
  // proposals from the pricing feedback loop.
  //
  // Operator surface: exposes raw provider rates (pre-markup), so it is
  // platform-gated, not org-gated.
  rpc getModelPricingGovernance(GetModelPricingGovernanceInput) returns (ModelPricingGovernanceResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_model_pricing;
    option (ai.stigmer.commons.rpc.config).resource_id = "stigmer";
    option (ai.stigmer.commons.rpc.config).error_msg = "only platform operators can view pricing governance";
  }

  // Retrieve the model registry baseline catalog (ACTIVE documents, or the
  // full append-only revision history when include_history is set).
  //
  // Operator surface: exposes raw provider rates (pre-markup) and revision
  // provenance, so it is platform-gated like the governance view.
  rpc listModelPricingBaselines(ListModelPricingBaselinesInput) returns (ModelPricingBaselinesResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_model_pricing;
    option (ai.stigmer.commons.rpc.config).resource_id = "stigmer";
    option (ai.stigmer.commons.rpc.config).error_msg = "only platform operators can view the model registry baseline";
  }

  // Preview whether an organization can fund an execution, without writing
  // a reservation. The read-only twin of BillingCommandController's
  // authorizeExecution: both ride the same server-side affordability
  // predicate (start threshold, negative allowance, default cap), so a
  // synchronous preflight refusal and the authoritative reservation can
  // never drift.
  //
  // @internal
  // Called by serving-side visitor billing preflights (guest and channel
  // lanes) before accepting work the organization cannot fund.
  rpc previewAuthorization(PreviewAuthorizationInput) returns (PreviewAuthorizationResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform;
    option (ai.stigmer.commons.rpc.config).permission = can_execute_billing_ops;
    option (ai.stigmer.commons.rpc.config).resource_id = "stigmer";
    option (ai.stigmer.commons.rpc.config).error_msg = "only platform operators can execute billing operations";
  }

  // Retrieve the current billing control signal for a running execution
  // (continue / low-balance warning / stop), derived from the execution's
  // reservation headroom and the billing account's status.
  //
  // @internal
  // Called by serving-side status and approval lanes to piggyback
  // STOP/WARNING onto runner-facing responses and to refuse continuing
  // work once the balance is exhausted.
  rpc getExecutionBillingSignal(GetExecutionBillingSignalInput) returns (GetExecutionBillingSignalResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform;
    option (ai.stigmer.commons.rpc.config).permission = can_execute_billing_ops;
    option (ai.stigmer.commons.rpc.config).resource_id = "stigmer";
    option (ai.stigmer.commons.rpc.config).error_msg = "only platform operators can execute billing operations";
  }
}
