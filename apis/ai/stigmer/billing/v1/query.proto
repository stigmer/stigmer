syntax = "proto3";

package ai.stigmer.billing.v1;

import "ai/stigmer/billing/v1/billing_account.proto";
import "ai/stigmer/billing/v1/io.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// BillingQueryController handles read operations for the billing bounded context.
//
// An organization's own reads authorize against the organization resource
// kind with can_view_billing; the model catalog's operator read authorizes
// against the static platform target.
service BillingQueryController {
  // Retrieve the billing account for an organization.
  rpc getBillingAccount(GetBillingAccountInput) returns (BillingAccount) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view billing for this organization";
  }

  // Retrieve the model registry baseline catalog (ACTIVE documents, or the
  // full append-only revision history when include_history is set).
  //
  // Operator surface: exposes the providers' list prices with their
  // revision provenance, so it is platform-gated, not org-gated.
  rpc listModelPricingBaselines(ListModelPricingBaselinesInput) returns (ModelPricingBaselinesResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_model_pricing;
    option (ai.stigmer.commons.rpc.config).resource_id = "stigmer";
    option (ai.stigmer.commons.rpc.config).error_msg = "only platform operators can view the model registry baseline";
  }
}
