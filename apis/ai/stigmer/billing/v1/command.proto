syntax = "proto3";

package ai.stigmer.billing.v1;

import "ai/stigmer/billing/v1/billing_account.proto";
import "ai/stigmer/billing/v1/credit.proto";
import "ai/stigmer/billing/v1/io.proto";
import "ai/stigmer/billing/v1/model_pricing_baseline.proto";
import "ai/stigmer/billing/v1/pricing_override.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// BillingCommandController handles write operations for the billing bounded context.
//
// Billing is not a standard API Resource — there is no api_resource_kind annotation.
// RPCs authorize against the organization resource kind.
//
service BillingCommandController {
  // Provision or retrieve the billing account for an organization.
  // Idempotent: creates the account on first call, returns existing on subsequent calls.
  //
  // @internal
  // Called during org creation or first billing interaction.
  // Initializes balance to zero with default thresholds.
  rpc getOrCreateBillingAccount(GetOrCreateBillingAccountInput) returns (BillingAccount) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to manage billing for this organization";
  }

  // Manually adjust an org's credit balance.
  // Produces an immutable ledger entry for audit. Requires admin privileges.
  rpc adjustCredits(AdjustCreditsInput) returns (CreditLedgerEntry) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to adjust credits for this organization";
  }

  // Grant promotional credits to an org, optionally expiring (use-it-or-lose-it).
  // Produces an immutable promotional_credit ledger entry for audit.
  //
  // The grant burns before adjustment and purchased credits. When expires_at
  // is set, any remainder unconsumed at that time is removed from the balance
  // by the platform's grant-expiry sweep (an expiry_debit ledger entry).
  // Idempotent: replaying an applied idempotency key returns the original
  // entry, even after the expiry has passed.
  rpc grantCredits(GrantCreditsInput) returns (CreditLedgerEntry) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to grant credits for this organization";
  }

  // Reserve credits before starting an agent execution.
  // Returns authorization status and reservation details.
  //
  // @internal
  // Called by the Temporal workflow before dispatching to the agent runner.
  // The runner must not start if authorized is false.
  rpc authorizeExecution(AuthorizeExecutionInput) returns (AuthorizeExecutionResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform;
    option (ai.stigmer.commons.rpc.config).permission = can_execute_billing_ops;
    option (ai.stigmer.commons.rpc.config).resource_id = "stigmer";
    option (ai.stigmer.commons.rpc.config).error_msg = "only platform operators can execute billing operations";
  }

  // Record a single LLM call's usage for billing.
  // Computes cost server-side from the model registry, inserts an immutable
  // LlmCallUsageRecord, and debits credits from the execution's reservation.
  //
  // @internal
  // Called by the proxy after each LLM SSE stream completes.
  // Deduplicated by (execution_id, sequence, metering_source).
  rpc recordLlmCallUsage(RecordLlmCallUsageInput) returns (RecordLlmCallUsageResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform;
    option (ai.stigmer.commons.rpc.config).permission = can_execute_billing_ops;
    option (ai.stigmer.commons.rpc.config).resource_id = "stigmer";
    option (ai.stigmer.commons.rpc.config).error_msg = "only platform operators can execute billing operations";
  }

  // Settle billing for a completed execution.
  // Releases unused reservation credits and produces the final billing record.
  //
  // @internal
  // Called by the Temporal workflow after the agent runner completes.
  rpc finalizeExecution(FinalizeExecutionInput) returns (FinalizeExecutionResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform;
    option (ai.stigmer.commons.rpc.config).permission = can_execute_billing_ops;
    option (ai.stigmer.commons.rpc.config).resource_id = "stigmer";
    option (ai.stigmer.commons.rpc.config).error_msg = "only platform operators can execute billing operations";
  }

  // Create a Stripe Checkout Session to purchase a credit pack.
  // Returns a checkout URL for the client to redirect the user.
  //
  // The caller's email is resolved server-side for Stripe Customer creation.
  // Credits are provisioned asynchronously via the checkout.session.completed webhook.
  rpc createCreditCheckoutSession(CreateCreditCheckoutSessionInput) returns (CreateCreditCheckoutSessionResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to purchase credits for this organization";
  }

  // Open a Stripe Customer Portal session for payment method management.
  // Returns a portal URL for the client to redirect the user.
  //
  // Requires an existing Stripe Customer (created during first credit purchase).
  // The portal allows users to add, update, or remove saved payment methods.
  rpc createBillingPortalSession(CreateBillingPortalSessionInput) returns (CreateBillingPortalSessionResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to manage billing for this organization";
  }

  // Configure automatic credit recharge for an organization.
  // Returns the updated BillingAccount with the new config applied.
  //
  // Enabling requires an active account with a saved payment method.
  // Disabling preserves the threshold/amount/cap for easy re-enablement.
  rpc setAutoRechargeConfig(SetAutoRechargeConfigInput) returns (BillingAccount) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_billing;
    option (ai.stigmer.commons.rpc.config).field_path = "org_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to manage auto-recharge for this organization";
  }

  // Record a human decision on a PENDING_SIGNOFF pricing override from the
  // pricing feedback loop. Approving makes the override ACTIVE (superseding
  // any current ACTIVE override on the same pricing key) and recomposes the
  // effective registry; rejecting archives it for audit.
  rpc decideModelPricingOverride(DecideModelPricingOverrideInput) returns (ModelPricingOverride) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_model_pricing;
    option (ai.stigmer.commons.rpc.config).resource_id = "stigmer";
    option (ai.stigmer.commons.rpc.config).error_msg = "only platform operators can decide pricing overrides";
  }

  // Create or revise one model registry baseline entry (catalog + list
  // prices). Append-only: an existing ACTIVE document for the same
  // (model_id, provider, harness) key is superseded, never mutated. The
  // effective registry is recomposed immediately, so the revision reaches
  // billing and every published price surface atomically.
  rpc upsertModelPricingBaseline(UpsertModelPricingBaselineInput) returns (ModelPricingBaseline) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_model_pricing;
    option (ai.stigmer.commons.rpc.config).resource_id = "stigmer";
    option (ai.stigmer.commons.rpc.config).error_msg = "only platform operators can edit the model registry baseline";
  }

  // Retire one model from the registry catalog. The next composition pass
  // drops it from the effective registry and archives any ACTIVE pricing
  // overrides that targeted it. Kept for audit; the key can be revived by
  // a subsequent upsert.
  rpc retireModelPricingBaseline(RetireModelPricingBaselineInput) returns (ModelPricingBaseline) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_model_pricing;
    option (ai.stigmer.commons.rpc.config).resource_id = "stigmer";
    option (ai.stigmer.commons.rpc.config).error_msg = "only platform operators can edit the model registry baseline";
  }
}
