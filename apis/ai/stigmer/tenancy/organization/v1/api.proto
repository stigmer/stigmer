syntax = "proto3";

package ai.stigmer.tenancy.organization.v1;

import "ai/stigmer/commons/apiresource/metadata.proto";
import "ai/stigmer/commons/apiresource/status.proto";
import "ai/stigmer/tenancy/organization/v1/spec.proto";
import "buf/validate/validate.proto";

// Organization is the top-level container for all Stigmer resources.
//
// An Organization's metadata.id equals its metadata.slug: unlike every other
// resource (which is assigned a generated prefixed id), the tenancy root is
// addressed by its slug, which is globally unique.
//
// @internal
// Similar to GitHub organizations, all agents, workflows, sessions, and other
// resources are scoped under an organization. This enables multi-tenancy and
// proper resource isolation. Child resources reference their owning org by slug
// (metadata.org), which is why the org's id is set to its slug rather than a
// minted org_<ulid> (see OrganizationCommandController create pipeline).
message Organization {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = "tenancy.stigmer.ai/v1"];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = "Organization"];

  // Resource metadata including name, organization, and labels.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // Configurable properties: description, logo, and management mode.
  OrganizationSpec spec = 4;

  // System-managed audit state.
  ai.stigmer.commons.apiresource.ApiResourceAuditStatus status = 5;
}
