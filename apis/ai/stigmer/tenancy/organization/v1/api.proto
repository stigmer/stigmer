syntax = "proto3";

package ai.stigmer.tenancy.organization.v1;

import "ai/stigmer/commons/apiresource/metadata.proto";
import "ai/stigmer/commons/apiresource/status.proto";
import "ai/stigmer/tenancy/organization/v1/spec.proto";
import "buf/validate/validate.proto";

// Organization is the top-level container for all Stigmer resources.
//
// An Organization has a permanent id (org_<ulid>), minted when it is
// created, and a slug: the unique name people type in URLs, manifests and
// --org. Every resource the organization owns names it by id in
// metadata.org, so renaming the slug moves nothing. Requests may name an
// organization by either; the server answers with the id.
//
// An Organization belongs to no organization: its own metadata.org is
// always empty.
//
// @internal
// Similar to GitHub organizations, all agents, sessions, and other
// resources are scoped under an organization. This enables multi-tenancy and
// proper resource isolation. The slug changes only through
// OrganizationCommandController.rename; a renamed slug keeps resolving to its
// organization for a while, then is free for anyone to take.
message Organization {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = "tenancy.stigmer.ai/v1"];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = "Organization"];

  // Resource metadata including name, organization, and labels.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // Configurable properties: description, logo, and management mode.
  OrganizationSpec spec = 4;

  // System-managed state: the audit, and who attached each embedding vault.
  OrganizationStatus status = 5;
}

// OrganizationStatus is an organization's server-owned state.
message OrganizationStatus {
  // Audit information tracking creation and modification.
  ai.stigmer.commons.apiresource.ApiResourceAudit audit = 99;

  // Who attached each of the embedding settings' vaults, by vault id: the
  // account whose permission to use the vault each app user's run checks.
  //
  // @internal
  // Server-owned. updateEmbedding records the writer for each vault it
  // introduces, keeps the entry for each vault it keeps, and drops entries
  // for removed vaults, so an editor's unrelated edit never re-attributes
  // someone else's attachment.
  map<string, string> embedding_vault_attachers = 1;
}
