syntax = "proto3";

package ai.stigmer.tenancy.organization.v1;

import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";
import "ai/stigmer/tenancy/organization/v1/api.proto";
import "ai/stigmer/tenancy/organization/v1/io.proto";

// OrganizationCommandController handles write operations for organizations.
service OrganizationCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = organization;

  // Create or update an organization.
  //
  // @internal
  // The authorization and state-operation are determined depending on whether the organization
  // is going to be created or updated which is determined as part of the request execution.
  rpc apply(Organization) returns (Organization);

  // Create an organization.
  //
  // On Stigmer Cloud, creating a platform-managed organization is a plan
  // feature of its integrator. An integrator whose plan lacks it is refused
  // with FAILED_PRECONDITION carrying a google.rpc.ErrorInfo detail (domain
  // "stigmer.ai"):
  //
  //   - PLAN_UPGRADE_REQUIRED — the integrator organization's plan does not
  //     include the feature. Metadata: feature ("managed_organizations"),
  //     org_id (the integrator organization).
  //
  // @internal
  // No authorization required — any authenticated user can create an organization.
  // The creator automatically becomes the owner of the organization.
  rpc create(Organization) returns (Organization) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Update an existing organization.
  //
  // @internal
  // Authorization: Requires can_edit permission on the organization.
  rpc update(Organization) returns (Organization) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update organization";
  }

  // Delete an organization.
  //
  // @internal
  // Authorization: Requires can_delete permission on the organization.
  // Before the organization itself, the delete runs each edition's
  // organization-delete steps, which remove or refuse what the edition
  // keeps for it, then revokes every authorization row that names it; when
  // any of these cannot complete, the delete fails with the organization in
  // place, and a retry resumes it.
  rpc delete(OrganizationId) returns (Organization) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete organization";
  }
}
