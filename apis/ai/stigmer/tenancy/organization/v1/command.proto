syntax = "proto3";

package ai.stigmer.tenancy.organization.v1;

import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";
import "ai/stigmer/tenancy/organization/v1/api.proto";
import "ai/stigmer/tenancy/organization/v1/io.proto";

// OrganizationCommandController handles write operations for organizations.
service OrganizationCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = organization;

  // Create or update an organization.
  //
  // Its create arm is refused as create is, ORGANIZATION_LIMIT_REACHED
  // included.
  //
  // @internal
  // The authorization and state-operation are determined depending on whether the organization
  // is going to be created or updated which is determined as part of the request execution.
  rpc apply(Organization) returns (Organization);

  // Create an organization.
  //
  // The server mints the organization's id (org_<ulid>); metadata.org must be
  // empty, because an organization belongs to no organization (one that names
  // the organization itself, by its own id or slug, is cleared). A slug held by
  // another organization is refused with ALREADY_EXISTS; a slug another
  // organization was renamed away from, and which still resolves to it, is
  // refused with ALREADY_EXISTS carrying a google.rpc.ErrorInfo detail
  // (domain "stigmer.ai"):
  //
  //   - ORGANIZATION_SLUG_RESERVED — another organization held the slug
  //     until a recent rename, and it still resolves there; or an
  //     organization from an earlier release was filed under it, which keeps
  //     it reserved for good, deleted or not. Metadata: slug.
  //
  // A child organization names its parent in spec.parent_org, and may carry
  // the parent's own identifier for it in spec.external_id. Creating one
  // needs can_manage_child_orgs on the parent; a parent the caller may not
  // manage is refused as if it did not exist (PERMISSION_DENIED either
  // way). An external_id another child of the same parent holds is refused
  // with ALREADY_EXISTS. Nobody owns a new child: the parent's admins
  // manage it, and grant its first members and owner. A parent that is
  // itself a child is refused with FAILED_PRECONDITION carrying a
  // google.rpc.ErrorInfo detail (domain "stigmer.ai"):
  //
  //   - ORGANIZATION_PARENT_IS_CHILD — child organizations are one level
  //     deep. Metadata: parent_org.
  //
  // A parent being deleted does not exist: naming it answers NOT_FOUND. A
  // create that races its parent's delete, and loses, is refused with
  // FAILED_PRECONDITION carrying a google.rpc.ErrorInfo detail (domain
  // "stigmer.ai"); the child it had stored is deleted with its parent:
  //
  //   - ORGANIZATION_PARENT_DELETING — the parent organization is being
  //     deleted. Metadata: parent_org.
  //
  // On Stigmer Cloud, creating a child organization is a plan feature of its
  // parent. A parent whose plan lacks it is refused with
  // FAILED_PRECONDITION carrying a google.rpc.ErrorInfo detail (domain
  // "stigmer.ai"):
  //
  //   - PLAN_UPGRADE_REQUIRED — the parent organization's plan does not
  //     include the feature. Metadata: feature ("child_orgs"), org (the
  //     parent organization).
  //
  // A server composed to hold a limited number of organizations (the
  // open-source edition holds one, which it makes the first time it
  // starts) refuses a create once it holds that many, with
  // FAILED_PRECONDITION carrying a google.rpc.ErrorInfo detail (domain
  // "stigmer.ai"), before anything is written:
  //
  //   - ORGANIZATION_LIMIT_REACHED — the server holds as many organizations
  //     as it is composed to. Metadata: limit.
  //
  // @internal
  // No lane authorization: any authenticated user can create an
  // organization, and its creator becomes its owner. A child is the
  // exception: the create step authorizes can_manage_child_orgs on
  // spec.parent_org before anything is written, and writes no owner.
  rpc create(Organization) returns (Organization) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Update an existing organization.
  //
  // The slug is not changed by an update (it is ignored, as for every
  // kind); rename changes it.
  //
  // @internal
  // Authorization: Requires can_edit permission on the organization.
  rpc update(Organization) returns (Organization) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update organization";
  }

  // Change what the organization lets its members do (OrganizationPolicies),
  // the one way to change a policy: update and apply keep the stored
  // policies. Replaces every policy with the input's.
  //
  // @internal
  // Authorization: Requires can_edit permission on the organization (its
  // admins), as update does. Fires the authorization lifecycle's
  // onOrganizationPoliciesChanged: a policy that opens an act is written
  // after the row persists, one that closes it is removed before, and a
  // fault fails the request.
  rpc updatePolicies(UpdateOrganizationPoliciesInput) returns (Organization) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "org_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update organization policies";
  }

  // Rename an organization: change its slug, the name people type.
  //
  // Nothing the organization owns moves, because every resource names it by
  // id. The old slug keeps resolving to the organization for 30 days, during
  // which no other organization can take it and this one can take it back;
  // then it is released. A slug another organization holds is refused with
  // ALREADY_EXISTS, and one another organization was recently renamed away
  // from with ORGANIZATION_SLUG_RESERVED (see create).
  //
  // @internal
  // Authorization: Requires can_delete permission on the organization (its
  // owners): a rename moves every member's links and scripts.
  rpc rename(ai.stigmer.commons.apiresource.RenameInput) returns (Organization) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to rename organization";
  }

  // Delete an organization, and everything it owned.
  //
  // The delete answers the organization as it stood. From that answer on,
  // the organization does not exist: every request that names it, or one
  // of its resources, answers NOT_FOUND, a second delete included, and
  // nothing new can start inside it. A purge then removes, in the
  // background, everything the organization owned: its agents, sessions,
  // runs and their files, skills, MCP servers, plugins,
  // vaults and their logins and secrets, sandboxes, channels and their
  // conversations, and every permission naming it or its resources. Its
  // slug stays held until the purge finishes, then is released: a later
  // organization may take it, and sees nothing the deleted one owned. An
  // edition may keep some records on purpose and says which (Stigmer Cloud
  // keeps financial records and the permission history). There is no
  // restore.
  //
  // A server that holds one organization (GetServerInfoOutput.single_org's
  // composition) refuses to delete it with FAILED_PRECONDITION carrying a
  // google.rpc.ErrorInfo detail (domain "stigmer.ai"), before anything is
  // written:
  //
  //   - ORGANIZATION_IS_SINGLE — the server's only organization cannot be
  //     deleted. Metadata: org.
  //
  // An organization with a child organization that is not being deleted is
  // refused with FAILED_PRECONDITION carrying a google.rpc.ErrorInfo detail
  // (domain "stigmer.ai"), with the organization in place:
  //
  //   - ORGANIZATION_HAS_CHILDREN — delete its child organizations first.
  //     Metadata: org.
  //
  // A parent whose children are all being deleted may be deleted; its purge
  // finishes after theirs.
  //
  // @internal
  // Authorization: Requires can_delete permission on the organization.
  // The delete marks the organization as being deleted, runs each
  // edition's organization-delete steps, which remove or refuse what must
  // not outlive the answer, then revokes every authorization row that names
  // it, and hands it to the purge; when any of these cannot complete, the
  // mark is removed and the delete fails with the organization in place.
  rpc delete(OrganizationId) returns (Organization) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete organization";
  }
}
