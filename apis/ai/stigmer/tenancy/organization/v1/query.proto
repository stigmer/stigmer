syntax = "proto3";

package ai.stigmer.tenancy.organization.v1;

import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";
import "ai/stigmer/tenancy/organization/v1/api.proto";
import "ai/stigmer/tenancy/organization/v1/io.proto";
import "ai/stigmer/tenancy/organization/v1/onboarding.proto";

// OrganizationQueryController handles read operations for organizations.
service OrganizationQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = organization;

  // Get an organization by ID.
  //
  // @internal
  // Authorization: Requires can_view_settings on the organization: its
  // members, the admins of its parent included, who are admins in every
  // child.
  rpc get(OrganizationId) returns (Organization) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view_settings;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view organization";
  }

  // List the organizations the authenticated caller is a member of.
  // Returns only organizations the caller has access to.
  //
  // @internal
  // Authorization handled in handler via the Grant service's listAuthorizedResourceIds.
  rpc listMine(ListMyOrganizationsInput) returns (Organizations) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Find a child organization by the identifier its parent keeps for it
  // (external_id). An organization that is not a child of parent_org, or no
  // child with that identifier, answers NotFound.
  //
  // @internal
  // Authorization: Requires can_manage_child_orgs on the parent (its
  // admins), who are admins in every child.
  rpc getByExternalId(OrganizationExternalLookup) returns (Organization) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_child_orgs;
    option (ai.stigmer.commons.rpc.config).field_path = "parent_org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to manage this organization's child organizations";
  }

  // List an organization's child organizations, newest first.
  //
  // @internal
  // Authorization: Requires can_manage_child_orgs on the parent (its
  // admins). Every child is listed: the parent's admins are admins in all
  // of them, so no per-row read scope runs.
  rpc listChildOrgs(ListChildOrgsInput) returns (ChildOrgList) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_child_orgs;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to manage this organization's child organizations";
  }

  // Get where an organization is on the journey from a first agent to its
  // users: which of the six steps are done, and the facts a client's lines
  // about them name.
  //
  // Every step is read from what the server already records, so a console
  // asks once instead of reading agents, runs, models and access itself.
  // The one asking is left out of the people who joined.
  //
  // @internal
  // Authorization: Requires can_edit on the organization, the journey's own
  // gate: its steps are an admin's acts, so a member is refused and a
  // console draws no journey for them. The rule is
  // domain/onboarding/progress.ts, which the platform's onboarding count
  // runs for every organization too.
  rpc getOnboarding(OrganizationId) returns (OnboardingProgress) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to read this organization's onboarding";
  }
}
