syntax = "proto3";

package ai.stigmer.tenancy.organization.v1;

import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";
import "ai/stigmer/tenancy/organization/v1/api.proto";
import "ai/stigmer/tenancy/organization/v1/io.proto";
import "google/protobuf/empty.proto";

// OrganizationQueryController handles read operations for organizations.
service OrganizationQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = organization;

  // Get an organization by ID.
  //
  // @internal
  // Authorization: Requires can_view permission on the organization.
  rpc get(OrganizationId) returns (Organization) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view organization";
  }

  // List organizations with pagination and filtering.
  //
  // @internal
  // Authorization: Requires platform admin permission. Administrative use only.
  rpc find(ai.stigmer.commons.apiresource.FindApiResourcesRequest) returns (OrganizationList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Find organizations the authenticated user is a member of.
  // Returns only organizations the caller has access to.
  //
  // @internal
  // Authorization handled in handler via IAM Policy listAuthorizedResourceIds.
  rpc findMyOrganizations(google.protobuf.Empty) returns (Organizations) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Look up a platform-managed organization by its external platform coordinates.
  // Returns the Stigmer organization mapped to the given IdentityProvider + external org ID.
  //
  // @internal
  // Authorization: custom — checks can_view on the referenced IdentityProvider.
  rpc getByExternalOrgId(OrganizationExternalLookup) returns (Organization) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
