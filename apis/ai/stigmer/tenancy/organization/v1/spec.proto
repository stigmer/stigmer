syntax = "proto3";

package ai.stigmer.tenancy.organization.v1;

import "buf/validate/validate.proto";

// OrganizationSpec defines the configurable properties of an organization.
//
// @internal
// Organizations are the top-level container for all Stigmer resources.
// Similar to GitHub organizations, all agents, sessions, and other resources
// are scoped under an organization.
message OrganizationSpec {
  option (buf.validate.message).cel = {
    id: "organization.external_id_requires_parent_org"
    message: "external_id is set only on a child organization: name its parent_org"
    expression: "this.external_id == '' || this.parent_org != ''"
  };

  // Human-readable description of the organization.
  string description = 1 [(buf.validate.field).string.max_len = 500];

  // Public URL for the organization logo.
  string logo_url = 2 [(buf.validate.field).string.max_len = 2048];

  // 3 was management_mode and 4 identity_provider_ref: a child organization
  // once hung off the identity provider that managed it. It now names its
  // parent organization directly (parent_org), and the ManagementMode enum
  // is gone.
  reserved 3, 4;
  reserved "management_mode", "identity_provider_ref";

  // The parent's own identifier for this organization, such as the
  // customer id an integrator keeps for it ("cust-4411").
  //
  // @internal
  // Set only on a child organization (requires parent_org), unique among
  // the parent's children, and fixed at create: update and apply keep the
  // stored value. The parent finds the child with getByExternalId, and a
  // sign-in through the parent's identity provider whose external_id_claim
  // carries this value is bound to the child.
  string external_id = 5 [(buf.validate.field).string.max_len = 256];

  // 6 was is_personal, a mark on the organization Stigmer Cloud created when
  // someone signed up. That organization is now an ordinary organization,
  // so there is one kind of organization and nothing to mark.
  reserved 6;
  reserved "is_personal";

  // Standing preferences declared by the organization.
  OrganizationPreferences preferences = 7;

  // The organization this one is a child of, by id or slug; empty for an
  // organization that has no parent.
  //
  // @internal
  // Fixed at create: update and apply keep the stored value. Creating a
  // child needs can_manage_child_orgs on the parent, and the parent may not
  // itself be a child (one level). The parent's admins manage the child
  // (settings, members, access) and see its billing, but read none of its
  // resources;
  // to look inside, one grants themselves a role in the child, which the
  // child's members and access history show. The edge resolver turns a
  // slug into the parent's id, so the stored value is always an id.
  string parent_org = 8 [(buf.validate.field).string.max_len = 64];

  // What the organization lets its members do. Set when the organization is
  // created (an omitted message means the defaults: members may create
  // agents) and changed only through updatePolicies, so an update or apply
  // of a manifest written before a policy changed neither fails nor
  // reverts it: a policy carried by update or apply is ignored.
  //
  // @internal
  // A policy decides who may do what, so it is held in the authorization
  // model, not read from the row at check time: the visibility precedent
  // (build-update-state.ts; ResourceAuthorizationLifecycle
  // onOrganizationPoliciesChanged).
  OrganizationPolicies policies = 9;
}

// OrganizationPreferences holds organization-declared defaults that apply to
// every eligible run in the organization.
//
// @internal
// Mutable through the existing update/apply RPCs under can_edit (admin) —
// the same trust tier as agent instructions, so injecting the content into
// member runs introduces no new trust boundary. Grows along the org
// scope's taxonomy path (memory_enabled is one such field). Org-side BOUNDS on
// members (ceilings, clamps, allowlists) are policies, not preferences —
// if they ever accumulate they get a sibling `policies` message, never a
// stretched `preferences`.
message OrganizationPreferences {
  // Free-text standing context injected into eligible runs in
  // this organization. Example: "We deploy to us-east-1."
  //
  // @internal
  // Snapshotted verbatim into
  // RunStatus.declared_preferences.org_context at run create,
  // for every run but a visitor's: the organization's own lanes carry
  // it, and a caller the edition classifies as a visitor (admitted to the
  // organization's agents without belonging to it) never does
  // (stigmer#1401). The runner frames it as context, not instructions that
  // override the task.
  string standing_context = 1 [(buf.validate.field).string.max_len = 2000];

  // Whether agents may retain learned facts about members of this
  // organization. Off by default: when off, the remember tool is never
  // offered and nothing is recalled, regardless of member opt-in.
  //
  // @internal
  // The org half of memory's double opt-in: effective
  // enablement = org memory_enabled AND the member's own memory_enabled
  // AND first-party human operator. An enablement gate, not a bound —
  // it does not parameterize member behavior, so it lives in
  // preferences legitimately; real bounds
  // (retention ceilings) would go to OrganizationPolicies.
  // Deliberately a bool, not an enum: a genuine on/off switch — finer
  // policy becomes new fields when evidence demands them. Enforced
  // fail-closed at memory create and read at recall compose.
  // OSS local mode: this flag alone governs (single user,
  // no account scope).
  bool memory_enabled = 2;
}

// OrganizationPolicies holds what an organization lets its members do.
// Each policy is a switch an admin turns in the organization's settings.
message OrganizationPolicies {
  // Members may create agents. On by default: a new organization lets its
  // members create agents, as a GitHub organization lets its members
  // create repositories. When off, only admins create agents. A member's
  // agent is theirs: private or shared with the organization, never with
  // child organizations, which stays an admin's choice.
  bool members_can_create_agents = 1;
}
