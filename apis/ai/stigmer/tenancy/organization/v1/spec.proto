syntax = "proto3";

package ai.stigmer.tenancy.organization.v1;

import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/tenancy/organization/v1/enum.proto";
import "buf/validate/validate.proto";

// OrganizationSpec defines the configurable properties of an organization.
//
// @internal
// Organizations are the top-level container for all Stigmer resources.
// Similar to GitHub organizations, all agents, workflows, and other resources
// are scoped under an organization.
message OrganizationSpec {
  // Human-readable description of the organization.
  string description = 1 [(buf.validate.field).string.max_len = 500];

  // Public URL for the organization logo.
  string logo_url = 2 [(buf.validate.field).string.max_len = 2048];

  // How this organization is operated.
  //
  // @internal
  // Immutable after creation.
  // - self_managed (default): Created and operated directly by users via Stigmer UI/CLI/API.
  // - platform_managed: Created programmatically by an external platform via an IdentityProvider.
  ManagementMode management_mode = 3;

  // Reference to the IdentityProvider that authenticates requests for this organization.
  //
  // @internal
  // Required when management_mode is platform_managed; must be empty for self_managed.
  // The referenced IdentityProvider must exist and be active at creation time.
  // Immutable after creation.
  ai.stigmer.commons.apiresource.ApiResourceReference identity_provider_ref = 4;

  // External platform's organization identifier for reverse mapping.
  //
  // @internal
  // Set only for platform_managed organizations. Stores the integrating platform's
  // own org ID so the platform can look up the corresponding Stigmer org even if
  // the Stigmer slug differs from the platform's original slug due to availability.
  string external_org_id = 5;

  // Whether this is a personal organization, auto-created during identity provisioning.
  //
  // @internal
  // Personal orgs serve as the user's default workspace (like GitHub personal accounts).
  // Immutable after creation. Set by the server — clients cannot set this to true.
  bool is_personal = 6;

  // Standing preferences declared by the organization.
  OrganizationPreferences preferences = 7;
}

// OrganizationPreferences holds organization-declared defaults that apply to
// every eligible agent execution in the organization.
//
// @internal
// Mutable through the existing update/apply RPCs under can_edit (admin) —
// the same trust tier as agent instructions, so injecting the content into
// member executions introduces no new trust boundary. Grows along the org
// scope's taxonomy path (Phase 2: memory-policy flag). Org-side BOUNDS on
// members (ceilings, clamps, allowlists) are policies, not preferences —
// if they ever accumulate they get a sibling `policies` message (DD-003
// refinement 2), never a stretched `preferences`.
message OrganizationPreferences {
  // Free-text standing context injected into eligible agent executions in
  // this organization. Example: "We deploy to us-east-1."
  //
  // @internal
  // Snapshotted verbatim into
  // AgentExecutionSpec.declared_preferences.org_context at execution create
  // (first-party human operators only, DD-002 D4 as amended). The runner
  // frames it as context, not instructions that override the task.
  string standing_context = 1 [(buf.validate.field).string.max_len = 2000];
}
