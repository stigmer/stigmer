syntax = "proto3";

package ai.stigmer.tenancy.organization.v1;

import "ai/stigmer/tenancy/organization/v1/api.proto";
import "ai/stigmer/tenancy/organization/v1/spec.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";

// List of organizations.
message Organizations {
  // Organization resources in this list.
  repeated Organization entries = 1;
}

// Response for a paginated organization list query.
message OrganizationList {
  // Total number of pages.
  int32 total_pages = 1;
  // Organizations in the current page.
  repeated Organization entries = 2;
}

// OrganizationId wraps an organization identifier.
message OrganizationId {
  // Organization identifier.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// Input for finding a child organization by the identifier its parent keeps
// for it.
message OrganizationExternalLookup {
  // 1 was identity_provider_ref: a child is found under its parent
  // organization now, not under an identity provider.
  reserved 1;
  reserved "identity_provider_ref";

  // The child's external_id: the parent's own identifier for it.
  string external_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];

  // The parent organization, by id or slug.
  string parent_org = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// Input for listing an organization's child organizations, newest first.
message ListChildOrgsInput {
  // The parent organization, by id or slug.
  string org = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];

  // The most children to return; 0 returns every child and no token. A
  // positive size is capped at 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
}

// One page of an organization's child organizations.
message ChildOrgList {
  // The children in this page, newest first.
  repeated Organization entries = 1;

  // Set when more children may follow: pass it as page_token to continue.
  string next_page_token = 2;
}

// Input for updatePolicies: the organization and the whole set of policies
// it holds from now on.
message UpdateOrganizationPoliciesInput {
  // The organization's id or slug.
  string org_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Every policy, as it should stand: a field left at its zero value
  // turns that policy off.
  OrganizationPolicies policies = 2 [(buf.validate.field).required = true];
}

// The changes an update makes to an organization: the fields update_mask names,
// taken from resource.
message UpdateOrganizationInput {
  option (buf.validate.message).cel = {
    id: "update_names_its_target"
    message: "resource.metadata.id is required: an update names the organization by its id"
    expression: "has(this.resource) && has(this.resource.metadata) && this.resource.metadata.id != ''"
  };

  // The organization carrying the new values, named by metadata.id. Only the fields
  // update_mask names are read, so the others may be left empty; the result
  // is validated as a whole.
  Organization resource = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The paths the update changes, as proto field names (spec.instructions,
  // metadata.labels). A list or map at a named path is replaced whole; "*"
  // names every path an update may change.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}
