syntax = "proto3";

package ai.stigmer.tenancy.project.v1;

import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";
import "ai/stigmer/tenancy/project/v1/api.proto";
import "ai/stigmer/tenancy/project/v1/io.proto";

// ProjectQueryController handles read operations for projects.
service ProjectQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = project;

  // Get a single project by ID.
  rpc get(ProjectId) returns (Project) {
    option (ai.stigmer.commons.rpc.config).resource_kind = project;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get project";
  }

  // Get a project by reference (org/name).
  //
  // @internal
  // Custom authorization is handled in the controller implementation.
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (Project) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
