syntax = "proto3";

package ai.stigmer.platform.cursoraccount.v1;

import "ai/stigmer/platform/cursoraccount/v1/cursor_account.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Input for creating or updating a CursorAccount.
//
// Create: account_id empty; admin_api_key plaintext (validated live
// against GET /teams/members before persistence).
// Update: account_id set; admin_api_key plaintext to rotate or
// "***REDACTED***" to keep the stored value. member_keys on the embedded
// account are IGNORED here — keys have their own add/remove/enable RPCs
// so key mutations are individually validated and audited.
message UpsertCursorAccountInput {
  CursorAccount account = 1 [(buf.validate.field).required = true];
}

// Input for deleting a CursorAccount.
message DeleteCursorAccountInput {
  string account_id = 1 [(buf.validate.field).string.min_len = 1];

  // Deletion is refused while live sessions are pinned to this account's
  // keys (their end-of-session agent disposal still needs the keys).
  // Setting force overrides the guard; the orphaned pin count is logged.
  bool force = 2;
}

// Input for adding one member key to an account. The key is presented to
// Cursor's GET /v1/me before persistence; the returned identity is bound
// server-side. A non-user-scoped key (e.g. a team admin key) fails with
// Cursor's own explanatory error.
message AddCursorMemberKeyInput {
  string account_id = 1 [(buf.validate.field).string.min_len = 1];

  // Plaintext user-scoped API key. The redaction marker is not accepted:
  // rotation is remove + add, so the identity binding can never go stale.
  string api_key = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 256
  ];

  // Optional operator label.
  string label = 3 [(buf.validate.field).string.max_len = 128];
}

// Input for removing one member key.
message RemoveCursorMemberKeyInput {
  string account_id = 1 [(buf.validate.field).string.min_len = 1];
  string key_id = 2 [(buf.validate.field).string.min_len = 1];

  // Removal is refused while live sessions are pinned to this key (the
  // runner archives the Cursor agent with the session's key at disposal;
  // removing it would orphan those agent handles). Setting force
  // overrides the guard; the orphaned pin count is logged.
  bool force = 3;
}

// Input for enabling or disabling one member key. Disabling blocks NEW
// sessions immediately; pinned sessions keep working.
message SetCursorMemberKeyEnabledInput {
  string account_id = 1 [(buf.validate.field).string.min_len = 1];
  string key_id = 2 [(buf.validate.field).string.min_len = 1];
  bool enabled = 3;
}

// Input for an on-demand roster + spend sync of one account.
message SyncCursorAccountInput {
  string account_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Input for listing all accounts. Empty by design: this is a
// platform-operator surface over a small collection.
message ListCursorAccountsInput {}

// One account plus derived routing/sync facts for the console list.
message CursorAccountSummary {
  // The account with all key material redacted.
  CursorAccount account = 1;

  // Count of enabled member keys — 0 means "not routable", surfaced
  // prominently in the console.
  int32 enabled_key_count = 2;

  // When the latest sync snapshot was taken; unset when never synced.
  google.protobuf.Timestamp last_synced_at = 3;

  // Count of member keys the routability predicate would select for a
  // NEW session right now: enabled AND owner active on the roster AND
  // usage guard not tripped. Server-computed by the same rule key
  // selection uses (clients must render it, never re-derive it — the
  // guard threshold is server config). The 2026-08-15 pool drain hid
  // behind the enabled count: 13 keys read "routable" while only one
  // guard-tripped key could actually serve.
  int32 routable_key_count = 4;

  // Of the enabled keys excluded above, how many are excluded ONLY by
  // the usage guard (owner still active, API pool exhausted). These
  // keys still serve already-pinned first-party traffic but fail every
  // API-pool turn upstream — the console's "drained, resets next
  // cycle" signal, distinct from dead keys (owner removed).
  int32 guard_tripped_key_count = 5;
}

message CursorAccountsResponse {
  repeated CursorAccountSummary accounts = 1;
}

// Input for the single-account detail view.
message GetCursorAccountViewInput {
  string account_id = 1 [(buf.validate.field).string.min_len = 1];
}

// CursorMemberKeyState classifies one stored member key against the
// latest roster snapshot. Computed on read (never stored) so it can
// not drift from its inputs.
enum CursorMemberKeyState {
  cursor_member_key_state_unspecified = 0;

  // Key owner is an active roster member.
  member_key_active = 1;

  // Key owner shows as "removed" in the roster — the key is excluded
  // from selection and flagged for the operator.
  member_key_owner_removed = 2;

  // Key owner does not appear in the roster at all (or no sync has run
  // yet, in which case every key reports this until the first sync).
  member_key_owner_unknown = 3;
}

// One active roster member Stigmer holds no key for, joined with their
// cycle spend — the operator's coverage-gap row. The spend join happens
// server-side by the same case-insensitive email rule as key views
// (computed on read, never stored) so clients never re-derive it.
message CursorTeamMemberView {
  CursorTeamMember member = 1;

  // Spend of this member this cycle; unset when the member has no
  // spend row.
  CursorMemberSpend spend = 2;
}

// One member key joined with roster + spend facts for the detail view.
message CursorMemberKeyView {
  // The key entry with material redacted.
  CursorMemberKey key = 1;

  CursorMemberKeyState state = 2;

  // Spend of the owning member this cycle; unset when the member has no
  // spend row. (Cursor's spend endpoint drifted 2026-07-23: it now also
  // returns removed members, with a flat totalPercentUsed=100 — the
  // roster state above, never spend, decides "removed".)
  CursorMemberSpend spend = 3;

  // True when the usage guard excludes this key from NEW-session
  // selection: the account declares on-demand usage disabled AND the
  // owning member's api_percent_used has crossed the platform soft
  // limit. Server-computed on read by the same routability predicate
  // key selection uses (the threshold is server config — clients must
  // render this flag, never re-derive it). Pinned sessions are not
  // affected by the guard.
  bool usage_guard_tripped = 4;
}

// Full detail view of one account: the redacted account, the latest
// roster/spend snapshot, and the computed key-coverage join.
message CursorAccountView {
  CursorAccount account = 1;

  // Latest sync snapshot; unset when never synced.
  CursorAccountSyncSnapshot snapshot = 2;

  // Every stored member key joined with roster and spend facts.
  repeated CursorMemberKeyView key_views = 3;

  // Field 4 was `repeated CursorTeamMember members_without_keys`, the
  // pre-spend-join flat list superseded by members_without_keys_views.
  // Removed once its last released reader (the v3.3.0 console) was ten
  // releases stale (stigmer#313); the number and name stay reserved so
  // neither can ever be reused with different semantics.
  reserved 4;
  reserved "members_without_keys";

  // Active roster members (role != "removed") for whom no member key is
  // stored — the operator's "coverage gap" list, each joined with the
  // member's cycle spend by the same email rule as key_views.
  repeated CursorTeamMemberView members_without_keys_views = 5;
}
