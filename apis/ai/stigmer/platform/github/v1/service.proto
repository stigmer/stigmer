syntax = "proto3";

package ai.stigmer.platform.github.v1;

import "ai/stigmer/commons/rpc/method_options.proto";
import "buf/validate/validate.proto";

// GitHubService connects a GitHub account through OAuth.
//
// The service builds the authorize URL and exchanges the authorization code
// for a token, which it saves as the github.com login in the caller's My
// vault. The token is never returned: repository listing, search and file
// reads go through GitHubQueryController, and runs clone with the saved
// login.
//
// @internal
// This is a platform utility service — not a domain resource.
// The backend protects the client_secret during the token exchange
// and constructs the authorize URL with the registered client_id and
// redirect_uri so the frontend never needs those values.
service GitHubService {
  // Get the GitHub OAuth authorize URL for initiating the OAuth flow.
  //
  // Returns a URL to redirect the user to and a random state value. After
  // the user authorizes, GitHub redirects back to your redirect_uri with an
  // authorization code, which exchangeOAuthCode accepts only with this state,
  // from the same person, for the same organization.
  //
  // @internal
  // The backend constructs the URL with the registered client_id, requested
  // scopes, and the state parameter, and records the state server-side
  // (caller, organization, redirect URI, expiry) for the exchange to
  // consume once. Authorization: can_create_vault on the organization, the
  // bar the exchange asks, since the login lands in the caller's My vault.
  rpc getOAuthAuthorizeUrl(GetOAuthAuthorizeUrlRequest) returns (GetOAuthAuthorizeUrlResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_vault;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to connect GitHub in this organization";
  }

  // Exchange a GitHub OAuth authorization code and save the login in the
  // caller's My vault.
  //
  // Call this after receiving the authorization code from GitHub's OAuth
  // redirect. Pass the code, the state from the original authorize request,
  // the same redirect_uri, and the organization whose My vault keeps the
  // login. Returns the connected account's login and granted scopes; the
  // token itself is saved as the github.com connection and never returned.
  //
  // @internal
  // The backend performs the token exchange using the client_secret, which
  // must never be exposed to the frontend, then writes the connection
  // through the vault's atomic entry write. Authorization: can_create_vault on
  // the organization (members), because the login lands in the caller's own
  // My vault there.
  rpc exchangeOAuthCode(ExchangeOAuthCodeRequest) returns (ExchangeOAuthCodeResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_vault;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to save a GitHub login in this organization";
  }
}

// Input for requesting a GitHub OAuth authorize URL.
message GetOAuthAuthorizeUrlRequest {
  // Callback URI that GitHub redirects to after the user authorizes.
  //
  // @internal
  // Must match one of the callback URLs registered on the GitHub App.
  string redirect_uri = 1 [(buf.validate.field).string.min_len = 1];

  // Organization whose My vault the login will be saved in, by slug or id.
  string org = 2 [(buf.validate.field).string.min_len = 1];
}

// Result of requesting a GitHub OAuth authorize URL.
message GetOAuthAuthorizeUrlResponse {
  // Full GitHub OAuth authorize URL to redirect the user to.
  string authorize_url = 1;

  // Random state value for CSRF protection.
  // Pass this back in ExchangeOAuthCodeRequest to verify the callback.
  string state = 2;
}

// Input for exchanging a GitHub authorization code for an access token.
message ExchangeOAuthCodeRequest {
  // Authorization code received from GitHub's OAuth redirect callback.
  string code = 1 [(buf.validate.field).string.min_len = 1];

  // State value from the original authorize response. The exchange consumes
  // it: a state the server did not issue to this caller for this
  // organization, or one already used, is refused.
  string state = 2 [(buf.validate.field).string.min_len = 1];

  // Redirect URI used in the original authorize request.
  //
  // @internal
  // GitHub requires this to match the value from the authorize step.
  string redirect_uri = 3 [(buf.validate.field).string.min_len = 1];

  // Organization whose My vault keeps the login, by slug or id.
  string org = 4 [(buf.validate.field).string.min_len = 1];
}

// Result of exchanging a GitHub authorization code: the account the saved
// login belongs to.
message ExchangeOAuthCodeResponse {
  // Field 1 returned the access token to the caller until the token moved
  // into the caller's My vault, so no page ever holds it.
  reserved 1;
  reserved "access_token";

  // Token type (typically "bearer").
  string token_type = 2;

  // Granted OAuth scopes, comma-separated.
  string scope = 3;

  // The connected GitHub account's login.
  string login = 4;
}
