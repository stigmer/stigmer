syntax = "proto3";

package ai.stigmer.platform.v1;

import "ai/stigmer/commons/rpc/method_options.proto";
import "buf/validate/validate.proto";

option java_outer_classname = "ServerInfoProto";

// Edition of the Stigmer server binary.
//
// Indicates whether the server is the open-source Go edition
// (stigmer-server) or the cloud Java edition (stigmer-service).
// Clients use this to determine feature availability instead of
// guessing from the API base URL.
enum ServerEdition {
  server_edition_unspecified = 0;

  // Open-source Go server (stigmer-server).
  // Only open_source-tier resources are available.
  oss = 1;

  // Stigmer Cloud Java server (stigmer-service).
  // All resources (including cloud_only) are available.
  cloud = 2;
}

// Query service for server identity, capabilities, and runner bootstrap.
//
// Clients call getServerInfo on startup to learn the server edition
// and version, replacing URL-based guessing. The RPC is public
// (no authentication required) so it can be called before login.
//
// Embedded runners call getRunnerBootstrapConfig during boot to discover
// the Temporal coordinates they need to join the execution backbone, so
// integrators never hardcode infrastructure addresses.
service PlatformQueryController {
  // Returns the server edition and version.
  //
  // This is the authoritative source for deployment mode detection.
  // Clients should call this once on startup and pass the result
  // to StigmerProvider as the deploymentMode prop.
  rpc getServerInfo(GetServerInfoInput) returns (GetServerInfoOutput) {
    option (ai.stigmer.commons.rpc.is_public) = true;
  }

  // Returns everything an embedded runner needs to bootstrap itself.
  //
  // An embedded runner (a desktop or web app hosting the runner for local
  // execution) needs two things at boot, both of which are details it should
  // not have to know or hold ahead of time: the Temporal frontend coordinates
  // to poll for work, and a Stigmer-signed identity to authenticate its
  // Cursor-proxy traffic. This RPC lets the runner self-bootstrap through the
  // one authenticated door it already opens at startup: it presents the token
  // it already holds and the control plane returns the environment's Temporal
  // coordinates plus a freshly minted runner access token. The contract for a
  // cloud embedder collapses to a single endpoint plus a token.
  //
  // Authenticated (not public): the response reveals an infrastructure
  // coordinate and mints a token bound to the caller, so any valid token is
  // required, but no specific FGA permission is — every authenticated caller in
  // an environment shares one Temporal cluster, and task queues are
  // per-session/execution and gated separately by control-plane session access.
  //
  // @internal
  // The minted runner access token (iss=stigmer, sub=caller identity account)
  // is a cloud-only capability — OSS has no Cursor proxy and leaves the token
  // fields empty. The handler degrades gracefully: if minting is unavailable
  // (signing key unconfigured, or no caller identity), it returns the Temporal
  // coordinates with an empty token rather than failing the runner's boot.
  rpc getRunnerBootstrapConfig(GetRunnerBootstrapConfigInput) returns (GetRunnerBootstrapConfigOutput) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Exchanges an embedded runner's bootstrap credential for a token scoped to
  // one unit of dispatched work.
  //
  // The bootstrap token from getRunnerBootstrapConfig identifies a runner but
  // is minted before any execution exists, so it carries no session or
  // execution scope. Secrets are only released to runner credentials bound to
  // the exact work they serve. At task start the runner presents its bootstrap
  // token and names the execution it was dispatched; the control plane verifies
  // the caller and returns a short-lived token scoped to that work, which the
  // runner then uses for its ExecutionContext fetch. This makes a desktop
  // runner indistinguishable, at the secret-release gate, from a
  // server-provisioned sandbox runner.
  //
  // The token fields are empty when the server cannot mint (OSS, or no signing
  // key configured) — the runner falls back to its existing credential.
  //
  // @internal
  // Cloud mints via SandboxTokenService: an agent_execution_id yields a
  // token_type=sandbox token carrying the execution's parent session_id (one
  // session sandbox serves multi-turn executions); a workflow_execution_id
  // yields token_type=workflow_sandbox carrying that id. Both are then bound by
  // RunnerScopeVerifier on the getByExecutionId decrypt path exactly like
  // cloud-sandbox-injected tokens (stigmer-cloud#155/#156).
  //
  // is_skip_authorization because the FGA target is derived from the input
  // oneof, which the declarative interceptor cannot express — the handler
  // enforces authorization itself (same pattern as getRunnerBootstrapConfig):
  // the caller must present a runner-class token_type=embedded_runner
  // credential AND pass the same can_view check getByExecutionId performs on
  // the named execution.
  //
  // The pool_claim arm is the one exception to the embedded_runner rule: it is
  // presented by a warm-pool sandbox holding a token_type=pool_sandbox
  // credential, and is authorized against the pool claim record instead of an
  // execution (see the arm's own doc).
  rpc getRunnerScopedToken(GetRunnerScopedTokenInput) returns (GetRunnerScopedTokenOutput) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}

// Empty request — no parameters needed.
message GetServerInfoInput {}

// Server identity and version information.
message GetServerInfoOutput {
  // Server edition (oss or cloud).
  ServerEdition edition = 1;

  // Semantic version of the server binary (e.g., "0.5.1").
  string version = 2;
}

// Empty request — the caller is identified by its bearer token, and the
// coordinates are the same for every runner in the environment.
message GetRunnerBootstrapConfigInput {}

// Everything an embedded runner needs to bootstrap: Temporal coordinates plus
// its own minted access token.
//
// The address is the one reachable by the caller: in OSS it is the server's
// own co-located Temporal (single host); in Cloud it is the external Temporal
// ingress, which differs from the internal address the control plane itself
// dials. The namespace is shared across both.
message GetRunnerBootstrapConfigOutput {
  // Temporal frontend address (host:port) the runner should dial.
  string temporal_address = 1 [(buf.validate.field).string.min_len = 1];

  // Temporal namespace the runner should use.
  string temporal_namespace = 2 [(buf.validate.field).string.min_len = 1];

  // Stigmer-signed access token the runner uses to authenticate its
  // Cursor-proxy traffic (the x-stigmer-auth header).
  //
  // Empty when the server cannot mint one — OSS (no Cursor proxy) or a cloud
  // server with no signing key configured. The runner keeps using its existing
  // token in that case.
  //
  // @internal
  // iss=stigmer, sub=caller identity account, token_type=embedded_runner. The
  // runner treats this as its proxy credential, distinct from the control-plane
  // token it authenticated this call with, and refreshes it before expiry.
  string runner_access_token = 3;

  // Token type for runner_access_token. "Bearer" when a token is present,
  // empty otherwise.
  string token_type = 4;

  // Lifetime of runner_access_token in seconds from issuance. 0 when no token
  // is present. The runner uses this to schedule a refresh before expiry.
  int32 runner_access_token_expires_in_seconds = 5;
}

// Names the unit of dispatched work a runner wants a scoped token for.
message GetRunnerScopedTokenInput {
  // The dispatched work the token will serve. The runner names only the id it
  // was dispatched; the server derives the token's scope from the resource
  // itself (an agent execution scopes to its parent session).
  oneof scope {
    option (buf.validate.oneof).required = true;

    // AgentExecution id — yields a token scoped to the execution's parent
    // session, valid for every ExecutionContext in that session (multi-turn).
    string agent_execution_id = 1;

    // WorkflowExecution id — yields a token scoped to exactly that workflow
    // execution's ExecutionContext.
    string workflow_execution_id = 2;

    // Warm-pool claim — a pool sandbox exchanging its pool credential for the
    // session token of the session it has just been claimed for. Presented
    // with a token_type=pool_sandbox credential (not embedded_runner).
    PoolClaim pool_claim = 3;
  }
}

// Claim exchange for a warm-pool sandbox member.
//
// A pool member is a blank, pre-booted sandbox holding only an org-agnostic
// token_type=pool_sandbox credential (carrying its pool_member_id claim). When
// the control plane claims it for a session, the member presents this arm to
// exchange that credential for the session's sandbox token.
//
// @internal
// Cloud authorizes against the pool claim record, not FGA: the pool_sandboxes
// row for the caller token's pool_member_id must be CLAIMED for exactly this
// session_id (the DB is the authorization source), and the minted session
// token's TTL is the window-covering value recorded on that row at claim time.
// OSS has no pool and mints nothing (empty output, presence-based contract).
message PoolClaim {
  // Session the pool member was claimed for — the scope of the token it
  // receives. Must match the claim recorded by the control plane.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// A runner token scoped to one unit of work, or empty when the server cannot
// mint one.
//
// Mirrors the token fields of GetRunnerBootstrapConfigOutput: presence-based —
// an empty token means "not minted" (OSS, or no signing key), and the runner
// keeps using its existing credential.
message GetRunnerScopedTokenOutput {
  // Stigmer-signed token scoped to the requested work. The runner presents it
  // for ExecutionContext reads in place of its unscoped bootstrap token.
  //
  // @internal
  // iss=stigmer, sub=caller identity account, token_type=sandbox (with
  // session_id claim) or workflow_sandbox (with workflow_execution_id claim),
  // minted by the same SandboxTokenService that provisions cloud sandboxes.
  string runner_scoped_token = 1;

  // Token type for runner_scoped_token. "Bearer" when a token is present,
  // empty otherwise.
  string token_type = 2;

  // Lifetime of runner_scoped_token in seconds from issuance. 0 when no token
  // is present.
  int32 expires_in_seconds = 3;
}
