syntax = "proto3";

package ai.stigmer.management.project.v1;

import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/iam/iampolicy/v1/rpcauthorization/method_options.proto";
import "ai/stigmer/management/project/v1/api.proto";
import "ai/stigmer/management/project/v1/io.proto";

// ProjectCommandController handles write operations for projects.
service ProjectCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = project;

  // Create or update a project.
  // The authorization and state-operation are determined depending on whether the project
  // is going to be created or updated which is determined as part of the request execution.
  rpc apply(Project) returns (Project);

  // Create a new project.
  //
  // Authorization:
  // - Organization-scoped projects: Caller must have can_create_project permission in the organization
  // - Platform-scoped projects: Caller must be a platform operator (handled automatically by common auth step)
  rpc create(Project) returns (Project) {
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).resource_kind = organization;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).permission = can_create_project;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).field_path = "metadata.org";
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).error_msg = "unauthorized to create project in this organization";
  }

  // Update an existing project.
  rpc update(Project) returns (Project) {
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).resource_kind = project;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).permission = can_edit;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).field_path = "metadata.id";
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).error_msg = "unauthorized to update project";
  }

  // Delete a project.
  rpc delete(ProjectId) returns (Project) {
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).resource_kind = project;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).permission = can_delete;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).field_path = "value";
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).error_msg = "unauthorized to delete project";
  }
}
