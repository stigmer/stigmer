syntax = "proto3";

package ai.stigmer.activity.v1;

import "ai/stigmer/activity/v1/io.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// ActivityQueryController provides cross-resource read queries for the
// activity feed — the unified "recents" sidebar that merges sessions and
// workflow executions into a single time-ordered list.
//
// This service exists because the recents list spans two bounded contexts
// (session and workflow_execution). A cross-cutting query service avoids
// forcing the client to make two parallel calls and merge client-side.
//
// @internal
// Authorization is handled in-handler: the implementation queries FGA for
// authorized session and workflow_execution IDs, then runs a single merged
// MongoDB query.
service ActivityQueryController {
  // List recent activity across sessions and workflow executions.
  //
  // Returns a merged, time-sorted list of the caller's most recent
  // sessions and workflow executions. On the hosted edition, per-resource
  // authorization filtering is applied server-side (FGA `can_view`
  // enumeration for both kinds — the same permission the per-kind `get`
  // RPCs enforce, so every listed entry is openable by construction). The
  // OSS server does not currently implement this RPC (stigmer#461).
  //
  // @internal
  // Authorization is handled in-handler: the FGA id enumeration is the only
  // gate (hence is_skip_authorization); the request's org merely narrows
  // the authorized set.
  rpc listRecentActivity(ListRecentActivityRequest) returns (ListRecentActivityResponse) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
