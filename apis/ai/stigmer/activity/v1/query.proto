syntax = "proto3";

package ai.stigmer.activity.v1;

import "ai/stigmer/activity/v1/io.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// ActivityQueryController provides the read query behind the "recents"
// sidebar: the caller's most recent sessions, newest first.
//
// @internal
// Authorization is handled in-handler: the implementation queries FGA for
// the caller's authorized session IDs, then reads those sessions in one
// query.
service ActivityQueryController {
  // List the caller's most recent sessions by last activity.
  //
  // On the hosted edition, per-resource authorization filtering is applied
  // server-side (FGA `can_view` enumeration — the same permission the
  // session `get` RPC enforces, so every listed entry is openable by
  // construction). On the OSS edition the server is single-tenant: the
  // caller owns every stored resource, so there is no authorization set to
  // enumerate and the request's org is a no-op (stigmer#461).
  //
  // @internal
  // Authorization is handled in-handler: the FGA id enumeration is the only
  // gate (hence is_skip_authorization); the request's org merely narrows
  // the authorized set.
  rpc listRecentActivity(ListRecentActivityRequest) returns (ListRecentActivityResponse) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
