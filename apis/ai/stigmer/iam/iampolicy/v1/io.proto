syntax = "proto3";

package ai.stigmer.iam.iampolicy.v1;

import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/iam/iampolicy/v1/api.proto";
import "ai/stigmer/iam/iampolicy/v1/spec.proto";
import "ai/stigmer/iam/identityaccount/v1/enum.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// ApiResourceRefView represents a reference to ANY API resource in the system
// WITH display fields for UI rendering. This is used in view/query responses.
//
// For command inputs, use ApiResourceRef from spec.proto (which only has id, kind, relation).
message ApiResourceRefView {
  // Type of the API resource being referenced
  string kind = 1;

  // Unique identifier of the resource
  string id = 2;

  // Optional relation qualifier for the resource reference
  string relation = 3;

  // Display name of the resource (e.g., "John Doe", "Engineering Team")
  string name = 4;

  // Email address associated with the resource (primarily for identity_account)
  string email = 5;

  // URL-friendly slug identifier for the resource
  string slug = 6;

  // Avatar URL or identifier for the resource
  string avatar = 7;

  // Members of the resource (only populated when kind = "team")
  repeated ApiResourceRefView members = 8;

  // Teams that this identity account belongs to (only populated when kind = "identity_account")
  repeated ApiResourceRefView teams = 9;

  // Where this identity account was provisioned from. Lets a chooser
  // disambiguate accounts that share the same email address.
  // Populated only when kind = "identity_account".
  IdentityOrigin identity_origin = 10;
}

// IdentityOrigin describes where an identity_account was provisioned from.
//
// Email is not an identity key in Stigmer: two distinct accounts can
// legitimately share one email address — for example a person who signed up
// directly and is also provisioned through a platform's identity provider.
// This message gives the UI enough context to tell such accounts apart when
// presenting a people chooser, so users never have to reason about raw
// account IDs.
message IdentityOrigin {
  // How the account was provisioned (direct, federated, machine, platform_client).
  ai.stigmer.iam.identityaccount.v1.IdentityAccountProvisioningMode provisioning_mode = 1;

  // Human-readable label for the identity source: "Stigmer" for direct
  // accounts, or the owning IdentityProvider's display name for federated
  // accounts.
  string provider_display_name = 2;
}

// IamPolicyId identifies an IAM policy by its unique identifier.
message IamPolicyId {
  // Unique identifier of the IAM policy.
  string value = 1 [(buf.validate.field).required = true];
}

// PrincipalResourceInput defines a generic input for operations involving a principal and a resource.
message PrincipalResourceInput {
  // The principal in the relationship (WHO)
  ApiResourceRef principal = 1 [(buf.validate.field).required = true];

  // The resource in the relationship (WHAT)
  ApiResourceRef resource = 2 [(buf.validate.field).required = true];
}

// ResourcePrincipalsInput defines input for operations involving multiple principals and a single resource.
message ResourcePrincipalsInput {
  // The resource being shared/accessed
  ApiResourceRef resource = 1 [(buf.validate.field).required = true];

  // List of principals being granted access
  repeated ApiResourceRef principals = 2 [(buf.validate.field).required = true];
}

// RevokeOrgAccessInput defines the input for revoking all of a user's access to an organization.
message RevokeOrgAccessInput {
  // The identity account whose access is being revoked
  string identity_account_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The organization from which access is being revoked
  string org = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

// IamPoliciesList contains a list of IAM policy resources.
message IamPoliciesList {
  // IAM policy entries.
  repeated IamPolicy entries = 1;
}

// ListResourceAccessInput defines input for querying access grants on a resource.
message ListResourceAccessInput {
  // The resource to query access for
  ApiResourceRef resource = 1 [(buf.validate.field).required = true];

  // Whether to include inherited permissions from parent resources
  bool include_inherited = 2;
}

// ResourceAccessByPrincipalList groups access grants by principal, showing each
// principal and all their assigned roles on the queried resource.
message ResourceAccessByPrincipalList {
  // Principal access entries.
  repeated PrincipalAccess entries = 1;
}

// PrincipalAccess represents a principal and all their role grants on a resource.
message PrincipalAccess {
  // The principal with full display information
  ApiResourceRefView principal = 1;

  // All roles this principal has on the resource
  repeated RoleGrant roles = 2;
}

// RoleGrant represents a single role assignment with metadata.
message RoleGrant {
  // The role being granted
  RoleInfo role = 1;

  // The resource that owns this role grant
  ApiResourceRef owner_resource = 2;

  // Whether this role is inherited from a parent resource
  bool is_inherited = 3;
}

// ResourceAccessByRoleList groups access grants by role, showing each role and
// all principals assigned to it on the queried resource.
message ResourceAccessByRoleList {
  // Role access entries.
  repeated RoleAccess entries = 1;
}

// RoleAccess represents a role and all principals that have it.
message RoleAccess {
  // The role with ownership and inheritance info
  RoleGrant role = 1;

  // All principals that have this role
  repeated ApiResourceRefView principals = 2;
}

// RoleInfo contains basic information about an IAM role.
message RoleInfo {
  // Unique identifier for the role
  string id = 1;

  // Machine-readable role code (e.g., "admin", "viewer")
  string code = 2;

  // Human-readable role name (e.g., "Administrator")
  string name = 3;

  // Description of what this role grants
  string description = 4;
}

// PrincipalResourceRoles contains all roles a principal has on a specific resource.
message PrincipalResourceRoles {
  // Roles assigned to the principal on this resource.
  repeated RoleInfo roles = 1;
}

// CheckAuthorizationInput defines input for checking if a principal is authorized.
message CheckAuthorizationInput {
  // The policy to check (principal, resource, relation)
  IamPolicySpec policy = 1 [(buf.validate.field).required = true];

  // Optional contextual policies for "what-if" scenarios
  repeated IamPolicySpec contextual_policies = 2;
}

// CheckAuthorizationResult contains the result of an authorization check.
message CheckAuthorizationResult {
  // Whether the principal is authorized
  bool is_authorized = 1;
}

// CheckMyPermissionInput defines input for checking whether the AUTHENTICATED
// CALLER has a permission on a resource.
//
// Unlike CheckAuthorizationInput, there is deliberately NO principal field:
// the principal is always derived server-side from the authenticated token —
// the only trustworthy source of caller identity. Clients cannot probe another
// user's permissions because the API gives them no way to name a principal.
//
// This mirrors the industry-standard self-check pattern (e.g. Kubernetes
// SelfSubjectAccessReview): self checks and cross-principal checks are
// separate API surfaces with separate trust models.
message CheckMyPermissionInput {
  // The resource being accessed (WHAT)
  ApiResourceRef resource = 1 [(buf.validate.field).required = true];

  // The permission to check (e.g., "can_edit", "can_grant_access").
  //
  // @internal
  // This is the FGA relation checked against the resource object.
  string relation = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];

  // Optional contextual policies for "what-if" scenarios
  repeated IamPolicySpec contextual_policies = 3;
}

// ListAuthorizedResourceIdsInput defines input for listing resources a principal can access.
message ListAuthorizedResourceIdsInput {
  // The principal whose access is being queried
  ApiResourceRef principal = 1 [(buf.validate.field).required = true];

  // The kind of resources to check
  string resource_kind = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The relation/permission to check for
  string relation = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Optional contextual policies for "what-if" scenarios
  repeated IamPolicySpec contextual_policies = 4;
}

// AuthorizedResourceIdsList contains all resource IDs a principal can access.
message AuthorizedResourceIdsList {
  // Resource IDs the principal is authorized to access.
  repeated string resource_ids = 1;
}

// ListAuthorizedPrincipalIdsInput defines input for listing principals that can access a resource.
message ListAuthorizedPrincipalIdsInput {
  // The resource whose access is being queried
  ApiResourceRef resource = 1 [(buf.validate.field).required = true];

  // The kind of principals to check for
  string principal_kind = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The relation/permission to check for
  string relation = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Optional contextual policies for "what-if" scenarios
  repeated IamPolicySpec contextual_policies = 4;
}

// AuthorizedPrincipalIdsList contains all principal IDs that can access a resource.
message AuthorizedPrincipalIdsList {
  // Principal IDs authorized to access the resource.
  repeated string principal_ids = 1;
}

// GetPrincipalsCountInput defines input for counting principals in an organization.
message GetPrincipalsCountInput {
  // Organization ID to count principals for
  string org = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The kind of principals to count (identity_account or team)
  string principal_kind = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

// PrincipalsCount contains the count of principals.
message PrincipalsCount {
  // Number of principals matching the query.
  int32 count = 1;
}

// ListAccessHistoryInput names the organization whose access history to
// read, and where to start.
message ListAccessHistoryInput {
  // The organization, by slug or id.
  string org = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100. A history only grows, so there is no size
  // that returns every entry at once: follow next_page_token.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that read.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];

  // Read oldest first, starting just after this entry's sequence; 0 reads
  // from the first entry. Unset reads newest first. A tool that keeps its
  // own copy passes the last sequence it holds.
  optional int64 after_sequence = 4 [(buf.validate.field).int64.gte = 0];
}

// AccessHistoryPage is one page of an organization's access history.
message AccessHistoryPage {
  // The entries, newest first, or oldest first when the request named
  // after_sequence.
  repeated AccessHistoryEntry entries = 1;

  // Set when more entries may follow: pass it as page_token, with the same
  // request otherwise, to continue. Empty when this page reached the end.
  // A page may be short, even empty, and still carry a token: a parent
  // organization's administrators are not shown the entries about a child's
  // resources.
  string next_page_token = 2;
}

// AccessHistoryEntry is one change to who has access to what: someone was
// given access, or lost it.
message AccessHistoryEntry {
  // The entry's number in its organization's history: 1 for the first, and
  // one more for each entry after it, in the order they happened.
  int64 sequence = 1;

  // When the change happened. Never before the entry numbered before it.
  google.protobuf.Timestamp occurred_at = 2;

  // Whether access was given or taken away.
  AccessChange change = 3;

  // Why the change happened.
  AccessChangeCause cause = 4;

  // Who made the change: a person or service account, named as their
  // account reads today (display name, email and avatar), whether or not
  // they still belong to the organization, so a security team can tell who
  // a past member was. An account that no longer exists, or the server
  // acting on its own, carries only its id.
  ApiResourceRefView actor = 5;

  // How the actor made the change: "user" for a person, "service_account"
  // for a service account's key, "internal" for the server acting on the
  // actor's behalf (an invitation's redemption, a removal's sweep). An
  // edition may add its own.
  string actor_class = 6;

  // Who was given or lost access: a person, named as the actor is, or a
  // group written with its relation (the members of a team, the viewers of
  // an organization).
  ApiResourceRefView principal = 7;

  // The role given or taken away, as the access list shows it.
  RoleInfo role = 8;

  // What the access is to. Its slug is the resource's current name, and
  // empty when the resource has been deleted.
  ai.stigmer.commons.apiresource.ApiResourceReference resource = 9;
}

// AccessChange says what happened to someone's access.
enum AccessChange {
  access_change_unspecified = 0;

  // Access was given.
  granted = 1;

  // Access was taken away.
  revoked = 2;
}

// AccessChangeCause says why someone's access changed. A cause is added,
// never renamed or reused.
enum AccessChangeCause {
  access_change_cause_unspecified = 0;

  // Someone gave a person, a team or a group a role.
  grant = 1;

  // Someone took a role away.
  revoke = 2;

  // The server recorded what creating a resource implies: its creator's
  // ownership, or the audience its visibility opens it to.
  structural = 3;

  // Someone removed a person from the organization.
  organization_access_revoked = 4;

  // A person left the organization, and the server took away what they
  // still held on its resources.
  left_organization = 5;

  // A resource was deleted, and its access with it.
  resource_deleted = 6;

  // A person created the organization and became its owner.
  organization_created = 7;

  // A person signed in for the first time and was given the roles the
  // server's membership rules grant.
  first_sign_in = 8;

  // The server gave existing accounts the roles its membership rules would
  // have given them.
  role_reconciliation = 9;

  // The server's operator became owner of an organization nobody owned.
  operator_ownership = 10;

  // A person who signed in through a platform client was given the
  // organization role that client grants.
  platform_client_grant = 11;

  // An administrator created a service account with its role in the
  // organization.
  service_account_created = 12;
}
