syntax = "proto3";

package ai.stigmer.iam.servicecredential.v1;

import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/iam/iampolicy/v1/rpcauthorization/method_options.proto";
import "ai/stigmer/iam/servicecredential/v1/api.proto";

// ServiceCredentialCommandController provides write operations for service credentials.
service ServiceCredentialCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = service_credential;

  // Create or update a service credential (Kubernetes-style apply).
  // If the resource doesn't exist: creates a new service credential.
  // If the resource exists: updates the existing service credential.
  rpc apply(ServiceCredential) returns (ServiceCredential);

  // Create a new service credential.
  // The creator's organization owns the credential.
  rpc create(ServiceCredential) returns (ServiceCredential) {
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).resource_kind = organization;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).permission = can_edit;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).field_path = "metadata.org";
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).error_msg = "unauthorized to create service credential in this organization";
  }

  // Update an existing service credential.
  // Requires can_edit permission on the service credential.
  rpc update(ServiceCredential) returns (ServiceCredential) {
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).resource_kind = service_credential;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).permission = can_edit;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).field_path = "metadata.id";
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).error_msg = "unauthorized to update service credential";
  }

  // Delete a service credential.
  // Deletion is blocked if any platform-managed organizations reference this credential.
  rpc delete(ai.stigmer.commons.apiresource.ApiResourceDeleteInput) returns (ServiceCredential) {
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).resource_kind = service_credential;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).permission = can_delete;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).field_path = "resource_id";
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).error_msg = "unauthorized to delete service credential";
  }
}
