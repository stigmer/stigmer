syntax = "proto3";

package ai.stigmer.iam.servicecredential.v1;

import "ai/stigmer/commons/apiresource/metadata.proto";
import "ai/stigmer/iam/servicecredential/v1/spec.proto";
import "ai/stigmer/iam/servicecredential/v1/status.proto";
import "buf/validate/validate.proto";

// ServiceCredential represents an external platform's trust relationship with Stigmer.
//
// A ServiceCredential is owned by an organization (e.g., "planton") and grants
// that platform the ability to create and manage organizations on behalf of its users.
// It holds the platform's JWKS URI and JWT validation configuration for
// authenticated cross-platform API calls.
//
// Example YAML:
//   apiVersion: iam.stigmer.ai/v1
//   kind: ServiceCredential
//   metadata:
//     name: Planton Cloud Integration
//     slug: cloud-integration
//     org: planton
//   spec:
//     display_name: "Planton Cloud"
//     jwks_uri: "https://api.planton.ai/.well-known/stigmer-jwks.json"
//     allowed_issuers: ["planton-cloud"]
//     expected_audience: "stigmer-api"
message ServiceCredential {
  // API version for this resource type.
  // Must be exactly "iam.stigmer.ai/v1".
  string api_version = 1 [(buf.validate.field).string.const = 'iam.stigmer.ai/v1'];

  // Resource kind identifier.
  // Must be exactly "ServiceCredential".
  string kind = 2 [(buf.validate.field).string.const = 'ServiceCredential'];

  // Standard resource metadata including name, id, org, visibility, labels, and tags.
  // The org field identifies which organization owns this service credential.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // User-provided service credential configuration (desired state).
  ServiceCredentialSpec spec = 4;

  // System-managed service credential state (observed state).
  // Contains lifecycle state and audit information.
  ServiceCredentialStatus status = 5;
}
