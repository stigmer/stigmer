syntax = "proto3";

package ai.stigmer.iam.servicecredential.v1;

import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/iam/iampolicy/v1/rpcauthorization/method_options.proto";
import "ai/stigmer/iam/servicecredential/v1/api.proto";

// ServiceCredentialQueryController provides read operations for service credentials.
service ServiceCredentialQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = service_credential;

  // Get a service credential by its unique identifier.
  rpc get(ai.stigmer.commons.apiresource.ApiResourceId) returns (ServiceCredential) {
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).resource_kind = service_credential;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).permission = can_view;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).field_path = "value";
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).error_msg = "unauthorized to view service credential";
  }

  // Get a service credential by reference (org + slug).
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (ServiceCredential);
}
