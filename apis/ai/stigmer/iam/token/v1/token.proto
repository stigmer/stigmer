syntax = "proto3";

package ai.stigmer.iam.token.v1;

import "ai/stigmer/commons/rpc/method_options.proto";
import "buf/validate/validate.proto";

// TokenService mints the short-lived tokens a browser uses to talk to
// Stigmer on someone's behalf: a person signed in to an organization's own
// product, or an anonymous visitor of a shared agent's chat link.
//
// It manages no resource. Each token is signed by the server's own
// platform-token key and verified on every request; minting requires a
// server that authenticates its callers, and a server that trusts every
// request refuses it FAILED_PRECONDITION, because nothing would ever verify
// the token.
service TokenService {
  // Mint a user token for a person signed in to an organization's own product.
  //
  // The product's backend calls it with a service account's API key and the
  // person's identity, as it would call any server API with its key. Stigmer
  // resolves the person's identity account in the organization the token is
  // for, creates it on first sign-in when the organization's embedding
  // settings allow (granting their sign_in_role), and returns a token bound
  // to that organization. A token for a child organization works in that
  // child only; one for the service account's own organization also reaches
  // its child organizations, only as far as the person's role there allows.
  //
  // Only a service account's key may mint, and only one whose account is an
  // administrator of the organization the token is for, or of its parent
  // organization: minting can create accounts and grant a role. A person's
  // key or token is refused PERMISSION_DENIED.
  //
  // The token lives until it expires or until the service account that
  // minted it is deleted, whichever comes first. Rotating the account's key
  // leaves minted tokens working.
  //
  // Error scenarios:
  // - PERMISSION_DENIED: the caller is not a service account, or its account
  //   may not mint for the organization.
  // - FAILED_PRECONDITION: the person has no account and the organization's
  //   embedding settings do not create one, or the server does not
  //   authenticate its callers.
  // - INTERNAL: account provisioning could not be completed. No partial
  //   account is left behind, so the request is safe to retry: a retry
  //   completes the provisioning.
  //
  // Origin enforcement (OrganizationEmbedding.allowed_origins) does not apply
  // to this call: minting is server-to-server, so there is no browser Origin
  // to check. It applies to the browser requests that bear the minted token.
  //
  // @internal
  // The settings that apply (create_accounts_on_sign_in, sign_in_role,
  // allowed_origins, vaults) are the minting service account's
  // organization's. Accounts and grants are written as the minting service
  // account, so the history names the machine that let the person in.
  rpc mintUserToken(MintUserTokenRequest) returns (MintUserTokenResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_mint_user_tokens;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to mint user tokens for this organization";
  }

  // Mint a guest token for an anonymous visitor of a shared agent's chat link.
  //
  // Resolves the share id from the hosted chat link to an AgentShare and
  // returns a short-lived token scoped to that share's organization. Editions
  // that do not host shared-agent pages answer it UNIMPLEMENTED.
  //
  // @internal
  // Public: no Bearer token and no credential. The handler gates on an
  // enabled public-audience share whose org still exists (one uniform
  // NOT_FOUND when disabled, missing, members-only, its link token does not
  // match, or its org is gone), counts the mint against that org's budget
  // only after the share itself admits the visitor, and stamps the resolved
  // share's id into the guest JWT as the share_id claim; the create-time
  // gate re-reads the live share by that id on every session/run create.
  rpc mintGuestToken(MintGuestTokenRequest) returns (MintGuestTokenResponse) {
    option (ai.stigmer.commons.rpc.is_public) = true;
  }
}

// MintUserTokenRequest names the organization and the person a user token
// is for.
//
// Sent from the product's backend, never from a browser: it carries the
// service account's API key.
message MintUserTokenRequest {
  // The organization the token is for, by id or slug: the minting service
  // account's organization, or one of its child organizations. The person's
  // account, their first sign-in and the token are all in this organization.
  string org = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];

  // The product's stable identifier for the person. With org it names one
  // identity account (keyed "stgm_pc|{org}|{user_id}"), so the same user_id
  // in two organizations is two accounts.
  //
  // Must be stable for the person: changing it creates a new identity
  // account. It must not contain the separator character '|'.
  string user_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];

  // The person's email address, as the product knows it. Used when the
  // account is created; later mints do not change the stored profile.
  string user_email = 3 [(buf.validate.field).string.max_len = 320];

  // The person's display name, as the product knows it. Used when the
  // account is created; later mints do not change the stored profile.
  string user_name = 4 [(buf.validate.field).string.max_len = 256];
}

// MintUserTokenResponse holds the minted token and its lifetime.
message MintUserTokenResponse {
  // The token the browser sends as its Bearer credential. Pass it to the
  // React SDK's StigmerProvider through getAccessToken.
  string access_token = 1;

  // Token type. Always "Bearer".
  string token_type = 2;

  // Token lifetime in seconds from the time of issuance.
  int32 expires_in = 3;
}

// MintGuestTokenRequest identifies a shared agent and optional visitor cookie id.
message MintGuestTokenRequest {
  // Id of the share, from the hosted chat link (required).
  string share_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];

  // Per-browser visitor cookie id from a prior mint (optional).
  //
  // When empty, the server generates a high-entropy id and returns it so the
  // hosted page can persist it in an httpOnly cookie. When supplied, it must
  // be the value previously returned by this RPC for the same visitor.
  string guest_cookie_id = 2;

  // Web origin of the page embedding the shared agent (optional).
  //
  // Set by the hosted chat page when it runs inside an iframe (the embedding
  // page's origin, e.g. "https://docs.example.com") and by direct SDK embeds
  // (their own page origin). Leave empty on the unframed hosted page. The
  // literal value "null" reports a framed page whose parent origin could not
  // be determined (opaque origin).
  //
  // @internal
  // Validated at mint against the share's spec.allowed_origins: empty list
  // admits any origin; a non-empty list refuses PERMISSION_DENIED for
  // unlisted origins and for "null". An empty field always passes for
  // hosted-page and non-browser requests (the anyone-with-link hosted
  // page). The validated value is stamped into the guest JWT as the
  // embed_origin claim and re-validated against the live list by the
  // guest create-time gate.
  //
  // The hosted server cross-checks this field against the request's
  // browser-enforced Origin header. When the header
  // is a third-party origin (a direct SDK embed), the header is
  // authoritative: a non-empty field that disagrees with it is refused
  // PERMISSION_DENIED naming both origins, and an empty field resolves
  // to the header instead of the hosted-page exemption. When the header
  // is Stigmer's own hosted-page origin, this self-report is the only
  // embedder signal (the iframe'd page's RPCs carry Stigmer's origin) —
  // the widget code derives it from browser-authentic sources the
  // embedder cannot alter. Non-browser callers send no Origin header and
  // keep the self-report semantics; they gain nothing by omitting it
  // since the hosted link is anyone-with-link — rate
  // limits and the billing gate remain the API guards.
  string embed_origin = 3 [(buf.validate.field).cel = {
    id: "embed_origin.format"
    message: "embed_origin must be empty, \"null\", or an exact web origin like https://example.com (no path, query, or trailing slash)"
    expression: "this == '' || this == 'null' || this.matches('^https?://[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\\\\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*(:[0-9]{1,5})?$')"
  }];

  // Link token from the share link's `?k=` parameter (optional).
  //
  // Required when the share link has been locked with rotateShareLink;
  // ignored for plain share links.
  //
  // @internal
  // Validated at mint against the share's live status.share_link_token
  // (mismatch or absence answers the same NOT_FOUND as a disabled share,
  // so a killed link is indistinguishable from a nonexistent one). The
  // validated value is stamped into the guest JWT as the link_token claim
  // and re-validated against the live value by the guest create-time gate
  // on every session/run create — rotation therefore revokes live
  // guest tokens on their next message, exactly like disabling the share.
  string link_token = 4 [(buf.validate.field).string.max_len = 128];
}

// MintGuestTokenResponse contains the guest JWT and the visitor cookie id.
message MintGuestTokenResponse {
  // Stigmer-signed JWT for authenticating shared-agent chat API calls.
  string access_token = 1;

  // Token type. Always "Bearer".
  string token_type = 2;

  // Token lifetime in seconds from the time of issuance.
  int32 expires_in = 3;

  // Visitor cookie id to persist client-side, as an httpOnly cookie.
  //
  // Echoes guest_cookie_id from the request when provided; otherwise a newly
  // generated high-entropy value.
  string guest_cookie_id = 4;
}
