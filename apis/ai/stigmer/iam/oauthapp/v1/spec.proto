syntax = "proto3";

package ai.stigmer.iam.oauthapp.v1;

import "buf/validate/validate.proto";

// OAuthAppSpec defines a registered OAuth application with an external vendor.
//
// @internal
// Represents Stigmer's (or a platform builder's) OAuth app registration
// with an external vendor like Slack, Salesforce, or Figma.
//
// Created by org admins or platform operators. Referenced by McpServer
// resources that need vendor OAuth authentication via McpServerVendorOAuth.
//
// Analogous to IdentityProvider (inbound auth trust), OAuthApp represents
// outbound auth — how Stigmer authenticates with external services on
// behalf of users.
//
// The redirect URI is intentionally omitted: the platform derives its
// OAuth callback URL from server configuration, not from per-app settings.
// When registering the OAuth app with a vendor, the admin uses the
// callback URL documented in Stigmer's deployment settings.
//
// Security:
// - client_secret is encrypted at rest and redacted in logs.
// - The resource should have visibility_private to prevent secret leakage.
// - OAuthApp does not support public visibility.
//
// Example YAML:
//   apiVersion: iam.stigmer.ai/v1
//   kind: OAuthApp
//   metadata:
//     name: Slack OAuth
//     slug: slack-oauth
//     org: acme
//   spec:
//     provider: "Slack"
//     client_id: "1234567890.abcdef"
//     client_secret: "xoxs-..."
//     authorization_url: "https://slack.com/oauth/v2/authorize"
//     token_url: "https://slack.com/api/oauth.v2.access"
//     scopes: ["channels:read", "chat:write"]
//     scope_parameter_name: "user_scope"
message OAuthAppSpec {
  // Human-readable vendor name for UI display and logging.
  // Examples: "Slack", "Salesforce", "Figma"
  string provider = 1;

  // OAuth client identifier registered with the vendor.
  string client_id = 2 [(buf.validate.field).string.min_len = 1];

  // OAuth client secret registered with the vendor.
  // Encrypted at rest, redacted in logs.
  string client_secret = 3 [(buf.validate.field).string.min_len = 1];

  // Vendor's OAuth authorization endpoint.
  // The browser redirects here to start the authorization code flow.
  // Example: "https://slack.com/oauth/v2/authorize"
  string authorization_url = 4 [(buf.validate.field).string.uri = true];

  // Vendor's OAuth token endpoint.
  // The backend exchanges the authorization code for tokens here.
  // Example: "https://slack.com/api/oauth.v2.access"
  string token_url = 5 [(buf.validate.field).string.uri = true];

  // OAuth scopes to request during the authorization flow.
  // Scope values are vendor-specific.
  // Examples: ["channels:read", "chat:write"] (Slack),
  //           ["read_api", "api"] (GitLab)
  repeated string scopes = 6;

  // Optional OIDC UserInfo endpoint for fetching user profile data.
  // When set, Stigmer calls this endpoint after token acquisition to
  // retrieve the user's display name and avatar for the connected account.
  // Omit for vendors that do not support a standard userinfo endpoint.
  string userinfo_url = 7;

  // Name of the query parameter used to send scopes in the authorization URL.
  //
  // Most OAuth providers use the standard "scope" parameter. Some vendors
  // use a non-standard name — for example, Slack's V2 OAuth API requires
  // user token scopes to be sent as "user_scope" instead of "scope".
  //
  // When empty, defaults to "scope" (standard OAuth 2.0 behavior).
  string scope_parameter_name = 8;

  // Vendor marketplace/app-review approval status for this OAuth app.
  //
  // Many vendors (Slack, Figma, Salesforce, etc.) require an approval
  // process before a third-party OAuth app can be used publicly. This
  // field tracks where Stigmer's registration stands with the vendor.
  //
  // UNSPECIFIED is treated as approved for backwards compatibility — only
  // apps explicitly marked PENDING are gated in the UI.
  VendorApprovalStatus vendor_approval_status = 9;

  // Documentation URL explaining how users can bring their own OAuth
  // app credentials or personal access tokens for this vendor while
  // the platform's OAuth app is pending approval.
  //
  // Shown in the frontend as a help link when vendor_approval_status
  // is PENDING. Empty means no documentation link is displayed.
  string vendor_approval_docs_url = 10;

  // How the client secret is presented to the vendor's token endpoint
  // during authorization-code exchange and refresh.
  //
  // RFC 6749 §2.3.1 requires authorization servers to support HTTP Basic,
  // but some vendors' token endpoints accept only client_secret_post
  // (e.g. HubSpot advertises token_endpoint_auth_methods_supported:
  // ["client_secret_post"]). Exactly one method is ever used per request —
  // RFC 6749 §2.3 forbids presenting credentials through more than one
  // channel at once, and some servers reject requests that do.
  //
  // UNSPECIFIED is treated as CLIENT_SECRET_BASIC for backwards
  // compatibility, preserving the historical behavior byte-for-byte.
  TokenEndpointAuthMethod token_endpoint_auth_method = 11;
}

// Lifecycle status of an OAuthApp's vendor marketplace approval.
//
// Vendors like Slack, Figma, and Salesforce require third-party OAuth
// apps to pass a review/approval process before they can be used by
// end users. This enum tracks that lifecycle.
enum VendorApprovalStatus {
  // Default / unset. Treated as approved for backwards compatibility.
  // OAuth apps that do not go through a vendor approval process
  // (e.g., self-hosted or private vendor integrations) leave this unset.
  VENDOR_APPROVAL_STATUS_UNSPECIFIED = 0;

  // The OAuth app has been submitted to the vendor for review and is
  // awaiting approval. The sign-in button is disabled in the UI.
  VENDOR_APPROVAL_STATUS_PENDING = 1;

  // The vendor has approved the OAuth app. Sign-in is enabled.
  VENDOR_APPROVAL_STATUS_APPROVED = 2;

  // The vendor rejected the OAuth app. Sign-in is disabled.
  VENDOR_APPROVAL_STATUS_REJECTED = 3;
}

// Client authentication method for the vendor's OAuth token endpoint,
// mirroring the RFC 8414 token_endpoint_auth_methods_supported vocabulary.
//
// Only confidential-client methods appear here: public (DCR) clients
// authenticate with PKCE alone and never carry a client secret, so this
// enum is meaningful only for OAuthApp-backed vendor OAuth.
enum TokenEndpointAuthMethod {
  // Default / unset. Treated as CLIENT_SECRET_BASIC for backwards
  // compatibility — every OAuthApp created before this field existed
  // authenticated via HTTP Basic.
  TOKEN_ENDPOINT_AUTH_METHOD_UNSPECIFIED = 0;

  // client_secret_basic: the secret rides the Authorization header as
  // HTTP Basic credentials (RFC 6749 §2.3.1's baseline method).
  TOKEN_ENDPOINT_AUTH_METHOD_CLIENT_SECRET_BASIC = 1;

  // client_secret_post: the secret rides the request body as the
  // client_secret form parameter. Required by vendors whose token
  // endpoints do not accept Basic (e.g. HubSpot).
  TOKEN_ENDPOINT_AUTH_METHOD_CLIENT_SECRET_POST = 2;
}
