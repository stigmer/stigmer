syntax = "proto3";

package ai.stigmer.iam.oauthapp.v1;

import "ai/stigmer/iam/oauthapp/v1/api.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";

// OAuthAppId identifies an OAuth app by its unique identifier.
message OAuthAppId {
  // Unique identifier of the OAuth app resource.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// OAuthApps contains a list of OAuth app resources.
message OAuthApps {
  // OAuth app entries.
  repeated OAuthApp entries = 1;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 2;
}

// ListOAuthAppsInput specifies the organization whose OAuth apps
// should be returned.
message ListOAuthAppsInput {
  // Organization slug to list OAuth apps for.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
}

// The changes an update makes to an OAuth app: the fields update_mask names,
// taken from resource.
message UpdateOAuthAppInput {
  option (buf.validate.message).cel = {
    id: "update_names_its_target"
    message: "resource.metadata.id is required: an update names the OAuth app by its id"
    expression: "has(this.resource) && has(this.resource.metadata) && this.resource.metadata.id != ''"
  };

  // The OAuth app carrying the new values, named by metadata.id. Only the fields
  // update_mask names are read, so the others may be left empty; the result
  // is validated as a whole.
  OAuthApp resource = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The paths the update changes, as proto field names (spec.instructions,
  // metadata.labels). A list or map at a named path is replaced whole; "*"
  // names every path an update may change.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}
