syntax = "proto3";

package ai.stigmer.iam.oauthapp.v1;

import "ai/stigmer/iam/oauthapp/v1/api.proto";
import "buf/validate/validate.proto";

// OAuthAppId identifies an OAuth app by its unique identifier.
message OAuthAppId {
  // Unique identifier of the OAuth app resource.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// OAuthApps contains a list of OAuth app resources.
message OAuthApps {
  // OAuth app entries.
  repeated OAuthApp entries = 1;
}

// ListOAuthAppsByOrgInput specifies the organization whose OAuth apps
// should be returned.
message ListOAuthAppsByOrgInput {
  // Organization slug to list OAuth apps for.
  string org = 1 [(buf.validate.field).string.min_len = 1];
}
