syntax = "proto3";

package ai.stigmer.iam.oauthapp.v1;

import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";
import "ai/stigmer/iam/oauthapp/v1/api.proto";
import "ai/stigmer/iam/oauthapp/v1/io.proto";

// OAuthAppQueryController provides read operations for OAuth app resources.
service OAuthAppQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = oauth_app;

  // Get an OAuth app by its unique identifier.
  //
  // @internal
  // Authorization: Requires can_view permission on the oauth_app resource.
  rpc get(ai.stigmer.commons.apiresource.ApiResourceId) returns (OAuthApp) {
    option (ai.stigmer.commons.rpc.config).resource_kind = oauth_app;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view oauth app";
  }

  // Get an OAuth app by its organization-scoped reference (org/slug).
  //
  // Resolves a human-readable reference like "acme/slack-oauth" to the full
  // OAuthApp resource.
  //
  // @internal
  // Authorization: the resolved app is authorized exactly as get is —
  // can_view on the oauth app, with get's refusal copy.
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (OAuthApp) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List all OAuth apps belonging to an organization.
  //
  // Returns the OAuthApps of the input org that the caller may view, newest
  // first. Typically a small set (1-5 per org), so results are not paginated.
  //
  // @internal
  // Authorization: Requires can_view permission on the organization resource;
  // the result is then narrowed to the apps a get would return.
  rpc listByOrg(ListOAuthAppsByOrgInput) returns (OAuthApps) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to list oauth apps in this organization";
  }
}
