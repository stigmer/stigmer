syntax = "proto3";

package ai.stigmer.iam.oauthapp.v1;

import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";
import "ai/stigmer/iam/oauthapp/v1/api.proto";
import "ai/stigmer/iam/oauthapp/v1/io.proto";

// OAuthAppCommandController provides write operations for OAuth app resources.
//
// @internal
// OAuthApps hold vendor client credentials (client_secret) and are always
// org-private. There is no updateVisibility RPC — public visibility is
// intentionally unsupported to prevent credential leakage.
service OAuthAppCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = oauth_app;

  // Create or update an OAuth app.
  //
  // If the resource does not exist, creates a new OAuth app.
  // If the resource exists, updates the existing OAuth app.
  //
  // A request that carries metadata.id of an OAuth app in its organization
  // updates that OAuth app, and its slug changes only through rename. A slug
  // the OAuth app was renamed away from, named without the OAuth app's id, is
  // refused with FAILED_PRECONDITION carrying a google.rpc.ErrorInfo detail
  // (domain "stigmer.ai"), because a write by a name that stops resolving after
  // 30 days would later make a second OAuth app:
  //
  //   - SLUG_RENAMED — the slug was renamed: it still leads to the same OAuth
  //     app for reading, but a write names its current slug. Metadata: slug
  //     (the one the request named).
  //
  // @internal
  // The authorization and state-operation are determined depending on whether the
  // OAuth app is going to be created or updated, which is determined as
  // part of the request execution.
  rpc apply(OAuthApp) returns (OAuthApp);

  // Create an OAuth app.
  //
  // The creator's organization owns the OAuth app, and the organization's
  // current admins manage it.
  //
  // A slug another OAuth app of the organization holds is refused with
  // ALREADY_EXISTS. A slug another OAuth app was renamed away from, which still
  // leads to it for 30 days, is refused with ALREADY_EXISTS carrying a
  // google.rpc.ErrorInfo detail (domain "stigmer.ai"):
  //
  //   - SLUG_RESERVED — another OAuth app held the slug until a recent rename,
  //     and it still leads there. Metadata: slug.
  //
  // @internal
  // Authorization: Requires can_create_oauth_app permission in the organization.
  rpc create(OAuthApp) returns (OAuthApp) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_oauth_app;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to create oauth app in this organization";
  }

  // Update an OAuth app: the fields update_mask names change, every other
  // field keeps its stored value.
  //
  // resource.metadata.id names the OAuth app; apply finds one by slug. The slug
  // changes only through rename, and a mask naming a field another door
  // owns, or a path the OAuth app does not have, is refused with
  // INVALID_ARGUMENT naming the path.
  //
  // An update is refused with ABORTED carrying a google.rpc.ErrorInfo detail
  // (domain "stigmer.ai"):
  //
  //   - ETAG_MISMATCH — resource.metadata.etag is set and the OAuth app changed
  //     since that etag was read: read it again and make the change again.
  //     No metadata.
  //   - WRITE_CONFLICT — the OAuth app kept changing while the update was
  //     being saved: try again. No metadata.
  //
  // @internal
  // Authorization: Requires can_edit permission on the oauth_app resource.
  rpc update(UpdateOAuthAppInput) returns (OAuthApp) {
    option (ai.stigmer.commons.rpc.config).resource_kind = oauth_app;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "resource.metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update oauth app";
  }

  // Rename an OAuth app: change its slug, the name people type.
  //
  // The OAuth app keeps its id, so everything that names it keeps working, and
  // every answer names it by the new slug. The old slug keeps leading to the
  // OAuth app for reading for 30 days, during which no other OAuth app of the
  // organization can take it and this one can take it back; then it is
  // released. A write that names the old slug is refused with SLUG_RENAMED (see
  // apply). A slug another OAuth app holds is refused with ALREADY_EXISTS, and
  // one another OAuth app was recently renamed away from with SLUG_RESERVED
  // (see create).
  //
  // Its addresses and its redirect URI do not name its slug, so sign-ins
  // through it are unchanged.
  //
  // @internal
  // Authorization: Requires can_delete permission on the OAuth app: whoever may
  // delete it may rename it.
  rpc rename(ai.stigmer.commons.apiresource.RenameInput) returns (OAuthApp) {
    option (ai.stigmer.commons.rpc.config).resource_kind = oauth_app;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to rename OAuth app";
  }

  // Delete an OAuth app.
  //
  // Its addresses are released: a sign-in at them uses Stigmer's own login
  // app or the address's login server from then on. Returns the deleted
  // OAuthApp, its client_secret redacted like every read.
  //
  // @internal
  // Authorization: Requires can_delete permission on the oauth_app resource.
  rpc delete(ai.stigmer.commons.apiresource.ApiResourceDeleteInput) returns (OAuthApp) {
    option (ai.stigmer.commons.rpc.config).resource_kind = oauth_app;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete oauth app";
  }
}
