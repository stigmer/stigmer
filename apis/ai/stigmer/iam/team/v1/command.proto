syntax = "proto3";

package ai.stigmer.iam.team.v1;

import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";
import "ai/stigmer/iam/team/v1/api.proto";
import "ai/stigmer/iam/team/v1/io.proto";

// TeamCommandController provides write operations for teams.
//
// Membership is not written here: a person joins a team when they are granted
// the member role on it, through the IAM policy service, like any other grant.
//
// @internal
// Served by the Enterprise and Cloud editions; the open-source server
// registers no Team service.
service TeamCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = team;

  // Create a team in an organization.
  //
  // On Stigmer Cloud, teams are a plan feature. An organization whose plan
  // lacks them is refused with FAILED_PRECONDITION carrying a
  // google.rpc.ErrorInfo detail (domain "stigmer.ai"):
  //
  //   - PLAN_UPGRADE_REQUIRED — the organization's plan does not include
  //     the feature. Metadata: feature ("teams"), org.
  //
  // On Stigmer Enterprise, a new team is growth the server's license pays
  // for. Once the license and its grace period have ended, a create is
  // refused with FAILED_PRECONDITION carrying a google.rpc.ErrorInfo detail
  // (domain "stigmer.ai"), before anything is written:
  //
  //   - LICENSE_RENEWAL_REQUIRED — the server's license has ended; every
  //     team that exists keeps working. No metadata.
  //
  // A slug another team of the organization holds is refused with
  // ALREADY_EXISTS. A slug another team was renamed away from, which still
  // leads to it for 30 days, is refused with ALREADY_EXISTS carrying a
  // google.rpc.ErrorInfo detail (domain "stigmer.ai"):
  //
  //   - SLUG_RESERVED — another team held the slug until a recent rename, and
  //     it still leads there. Metadata: slug.
  //
  // @internal
  // Authorization: can_create_team on the organization (admin).
  rpc create(Team) returns (Team) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_team;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to create team in this organization";
  }

  // Update a team: the fields update_mask names change, every other
  // field keeps its stored value.
  //
  // A team's name and description may change.
  //
  // resource.metadata.id names the team; apply finds one by slug. The slug
  // changes only through rename, and a mask naming a field another door
  // owns, or a path the team does not have, is refused with
  // INVALID_ARGUMENT naming the path.
  //
  // An update is refused with ABORTED carrying a google.rpc.ErrorInfo detail
  // (domain "stigmer.ai"):
  //
  //   - ETAG_MISMATCH — resource.metadata.etag is set and the team changed
  //     since that etag was read: read it again and make the change again.
  //     No metadata.
  //   - WRITE_CONFLICT — the team kept changing while the update was
  //     being saved: try again. No metadata.
  //
  // @internal
  // Authorization: can_edit on the team (the organization's admins).
  rpc update(UpdateTeamInput) returns (Team) {
    option (ai.stigmer.commons.rpc.config).resource_kind = team;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "resource.metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update team";
  }

  // Rename a team: change its slug, the name people type.
  //
  // The team keeps its id, so everything that names it keeps working, and every
  // answer names it by the new slug. The old slug keeps leading to the team for
  // reading for 30 days, during which no other team of the organization can
  // take it and this one can take it back; then it is released. A slug
  // another team holds is refused with ALREADY_EXISTS, and one another team was
  // recently renamed away from with SLUG_RESERVED (see create).
  //
  // Its memberships and shares name its id and are unchanged.
  //
  // @internal
  // Authorization: Requires can_delete permission on the team: whoever may
  // delete it may rename it.
  rpc rename(ai.stigmer.commons.apiresource.RenameInput) returns (Team) {
    option (ai.stigmer.commons.rpc.config).resource_kind = team;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to rename team";
  }

  // Delete a team.
  //
  // Deleting a team removes its memberships and every share made with it.
  //
  // @internal
  // Authorization: can_delete on the team (the organization's admins). The
  // team's policies die as target and as principal through the resource
  // lifecycle's delete cleanup.
  rpc delete(ai.stigmer.commons.apiresource.ApiResourceDeleteInput) returns (Team) {
    option (ai.stigmer.commons.rpc.config).resource_kind = team;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete team";
  }
}
