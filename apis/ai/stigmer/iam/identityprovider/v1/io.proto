syntax = "proto3";

package ai.stigmer.iam.identityprovider.v1;

import "ai/stigmer/iam/identityprovider/v1/api.proto";
import "buf/validate/validate.proto";

// Wrapper for identity provider id.
message IdentityProviderId {
  // The unique identifier of the identity provider resource.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// List of identity providers (unbounded).
message IdentityProviders {
  repeated IdentityProvider entries = 1;
}

// Response for paginated list query.
message IdentityProviderList {
  // Total number of pages.
  int32 total_pages = 1;
  // Identity providers in current page.
  repeated IdentityProvider entries = 2;
}
