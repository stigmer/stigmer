syntax = "proto3";

package ai.stigmer.iam.identityprovider.v1;

import "ai/stigmer/iam/v1/enum.proto";
import "buf/validate/validate.proto";

// IdentityProviderSpec defines the configuration for an external identity provider.
//
// An IdentityProvider represents an external platform's trust relationship with Stigmer.
// It is owned by an organization (e.g., "planton") and configures how Stigmer validates
// tokens from that platform. Each request presents the provider's own JWT: Stigmer routes
// it by its issuer and audience, validates the token signature against the configured
// JWKS, and resolves the user's federated identity account by the JWT's sub claim and
// this provider's reference.
//
// Every token this provider vouches for is bound to one organization: the
// organization tenant_org_claim names when it is set, otherwise the
// provider's own. A bound token works in that organization only.
//
// Two settings control what happens when someone signs in:
//
//   1. create_accounts_on_sign_in: whether Stigmer creates a federated
//      identity account from the token's claims the first time it sees a
//      user. When false (the default), the platform creates accounts through
//      CreateFederatedAccount before its users can sign in.
//
//   2. sign_in_role: the role an account receives the first time it signs in
//      to an organization through this provider. Unspecified means none: the
//      platform grants roles itself through IAM policies.
//
// An SSO provider (is_sso_provider) sets both, which also enables the OIDC
// browser login flow via oidc_client_id.
//
// The spec contains only public validation configuration — no secrets are stored.
// For OIDC-based integrators (e.g., Auth0), the jwks_uri and userinfo_endpoint
// point to the OIDC provider's standard endpoints.
//
// Example YAML (platform delegation):
//   apiVersion: iam.stigmer.ai/v1
//   kind: IdentityProvider
//   metadata:
//     name: Planton
//     slug: planton
//     org: planton
//   spec:
//     display_name: "Planton"
//     jwks_uri: "https://planton-prod.us.auth0.com/.well-known/jwks.json"
//     allowed_issuers: ["https://planton-prod.us.auth0.com/"]
//     expected_audience: "https://api.planton.ai/"
//     userinfo_endpoint: "https://planton-prod.us.auth0.com/userinfo"
//
// Example YAML (JIT provisioning, single-org):
//   apiVersion: iam.stigmer.ai/v1
//   kind: IdentityProvider
//   metadata:
//     name: Acme Platform
//     slug: acme-platform
//     org: acme
//   spec:
//     display_name: "Acme Platform"
//     jwks_uri: "https://auth.acme.com/.well-known/jwks.json"
//     allowed_issuers: ["https://auth.acme.com/"]
//     expected_audience: "https://api.acme.com/stigmer"
//     userinfo_endpoint: "https://auth.acme.com/userinfo"
//     create_accounts_on_sign_in: true
//     sign_in_role: viewer
//
// Example YAML (JIT provisioning, multi-tenant):
//   apiVersion: iam.stigmer.ai/v1
//   kind: IdentityProvider
//   metadata:
//     name: SaaS Platform
//     slug: saas-platform
//     org: saas-co
//   spec:
//     display_name: "SaaS Platform"
//     jwks_uri: "https://auth.saas.co/.well-known/jwks.json"
//     allowed_issuers: ["https://auth.saas.co/"]
//     expected_audience: "https://api.saas.co/stigmer"
//     userinfo_endpoint: "https://auth.saas.co/userinfo"
//     create_accounts_on_sign_in: true
//     sign_in_role: member
//     tenant_org_claim: "org_id"
//
// Example YAML (self-managed SSO):
//   apiVersion: iam.stigmer.ai/v1
//   kind: IdentityProvider
//   metadata:
//     name: Acme Corp Okta
//     slug: acme-okta
//     org: acme
//   spec:
//     display_name: "Acme Corp Okta"
//     jwks_uri: "https://acme.okta.com/oauth2/default/v1/keys"
//     allowed_issuers: ["https://acme.okta.com/oauth2/default"]
//     expected_audience: "api://acme-stigmer"
//     is_sso_provider: true
//     oidc_client_id: "0oa1bcdef2ghijk3lmno"
//     create_accounts_on_sign_in: true
//     sign_in_role: viewer
message IdentityProviderSpec {
  option (buf.validate.message).cel = {
    id: "identity_provider.sign_in_role_not_owner"
    message: "sign_in_role cannot be owner; organization ownership must be assigned explicitly"
    expression: "this.sign_in_role != 1"
  };
  option (buf.validate.message).cel = {
    id: "identity_provider.sso_creates_accounts_with_a_role"
    message: "an SSO provider must set create_accounts_on_sign_in and a sign_in_role"
    expression: "!this.is_sso_provider || (this.create_accounts_on_sign_in && this.sign_in_role != 0)"
  };
  option (buf.validate.message).cel = {
    id: "identity_provider.jwks_uri_required_with_issuers"
    message: "jwks_uri is required when allowed_issuers names an issuer"
    expression: "this.allowed_issuers.size() == 0 || this.jwks_uri != ''"
  };

  // Human-readable display name for this identity provider.
  // Used in UI and audit logs to identify the integrating platform.
  string display_name = 1 [(buf.validate.field).string.max_len = 200];

  // JWKS endpoint URL for validating the tokens this provider's users present.
  // For OIDC-based integrators, this points to the provider's standard JWKS endpoint
  // (e.g., Auth0's /.well-known/jwks.json). Stigmer fetches and caches signing keys
  // from this URL for JWT signature verification.
  //
  // This is the standard "jwks_uri" metadata field defined in
  // OpenID Connect Discovery 1.0 (Section 3) and RFC 7517 (JSON Web Key Set).
  // It must be the jwks_uri that the discovery document of every allowed
  // issuer names, so that only an issuer's own keys verify its tokens.
  // Required when allowed_issuers names an issuer.
  string jwks_uri = 2 [(buf.validate.field).string.max_len = 2048];

  // JWT issuer values that Stigmer will accept from this platform.
  // Each JWT's `iss` claim must match one of these values.
  // For Auth0-based integrators, this is the Auth0 tenant URL
  // (e.g., "https://planton-prod.us.auth0.com/").
  // Several values are accepted only when every issuer's discovery document
  // names the same jwks_uri (and the same userinfo_endpoint when one is set);
  // an environment with its own tenant and keys is its own identity provider.
  //
  // Each issuer must publish an OpenID Connect Discovery document whose
  // `issuer` equals it. An issuer and expected_audience together identify
  // this provider: no two identity providers share an issuer and audience
  // pair, so organizations that federate with the same issuer each register
  // an audience of their own. The issuer a deployment signs its own users in
  // with cannot be registered.
  repeated string allowed_issuers = 3 [(buf.validate.field).repeated = {
    max_items: 10
    items: {
      string: {
        min_len: 1
        max_len: 2048
      }
    }
  }];

  // Expected JWT audience value.
  // Every JWT from this platform must include this as the `aud` claim.
  // For Auth0-based integrators, this is the API identifier configured in Auth0
  // (e.g., "https://api.planton.ai/").
  // Prevents tokens intended for other services from being accepted by Stigmer.
  //
  // Required. Register an audience for Stigmer at the issuer that is your
  // organization's own, such as an API identifier or a client ID: a token is
  // routed to the identity provider whose issuer and audience it carries, so
  // an audience another identity provider already registered at the same
  // issuer is refused. It cannot be a URL the issuer's discovery document
  // names, such as its userinfo endpoint, which the issuer may add to every
  // token it mints.
  string expected_audience = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];

  // Field 5 held a requests-per-minute budget that no server ever enforced;
  // it was removed rather than left as a setting that does nothing, and is
  // reserved so the number and name cannot return with another meaning.
  reserved 5;
  reserved "rate_limit_budget";

  // Replaced by create_accounts_on_sign_in and sign_in_role, which grant on
  // each organization's first sign-in rather than once per account.
  reserved 9, 10, 11;
  reserved "auto_provision_accounts", "auto_grant_on_org", "auto_grant_role";

  // OIDC UserInfo endpoint URL for reading a user's profile when Stigmer creates their account.
  // When Stigmer auto-provisions a federated account from a token that carries
  // no email claim, it calls this endpoint with that token (as a Bearer token)
  // to read the user's email, name, and picture. An account that already
  // exists is not refreshed from it.
  //
  // This is the standard "userinfo_endpoint" metadata field defined in
  // OpenID Connect Discovery 1.0 (Section 3). The endpoint itself is specified in
  // OpenID Connect Core 1.0 (Section 5.3).
  //
  // For Auth0-based integrators: https://{tenant}.auth0.com/userinfo
  //
  // When set, it must be the userinfo_endpoint that the discovery document of
  // every allowed issuer names.
  string userinfo_endpoint = 6 [(buf.validate.field).string.max_len = 2048];

  // Whether this identity provider serves as the SSO login provider for its
  // owning organization.
  //
  // When true, the Stigmer web app offers a "Sign in with [display_name]"
  // option on the organization's login page and initiates the OIDC
  // Authorization Code flow with PKCE using the configured oidc_client_id.
  //
  // An SSO provider sets create_accounts_on_sign_in and a sign_in_role, so
  // a person's first sign-in creates their federated identity account from
  // the JWT's OIDC claims and grants them sign_in_role on the organization.
  //
  // Constraints:
  // - At most one IdentityProvider per organization can be the SSO provider.
  // - An IdP used for platform-managed organization delegation cannot also
  //   serve as an SSO provider (different trust models).
  bool is_sso_provider = 7;

  // OIDC client identifier for browser-based SSO login.
  //
  // This is the client_id registered with the external IdP (e.g., Okta,
  // Azure AD) for Stigmer's web application. The web app uses this to
  // build the OIDC Authorization Code request with PKCE.
  //
  // No client_secret is stored — the web app is a public client using PKCE
  // (Proof Key for Code Exchange), which is the recommended approach for
  // SPAs per OAuth 2.0 for Browser-Based Apps (RFC draft).
  //
  // Required when is_sso_provider is true; must be empty otherwise.
  string oidc_client_id = 8 [(buf.validate.field).string.max_len = 256];

  // Name of the JWT claim that names the organization a token works in.
  //
  // When set, Stigmer reads this claim from every token the provider vouches
  // for and resolves it to a platform-managed organization:
  //
  //   1. Read the claim value from the JWT (e.g., claim "org_id" yields
  //      value "tenant-123").
  //   2. Look up the platform-managed organization where
  //      identity_provider_ref matches this IdP and external_org_id matches
  //      the claim value.
  //   3. Bind the token to that organization: it works there and nowhere
  //      else, whatever roles the person holds in other organizations.
  //
  // When empty, every token is bound to the provider's own organization.
  //
  // The platform pre-creates its tenant organizations with their
  // external_org_id mappings. The first time an account signs in to a tenant,
  // it receives sign_in_role there when one is set; a role an admin later
  // removes stays removed.
  //
  // The claim name is case-sensitive and must match the JWT payload key
  // exactly. A token that lacks the claim, carries a value that is not a
  // string, or names no known platform-managed organization is refused as
  // unauthenticated on every sign-in, returning or first; the refusal does not
  // name the tenant. A first sign-in refused this way leaves no account.
  string tenant_org_claim = 12 [(buf.validate.field).string.max_len = 256];

  // Whether Stigmer creates a federated identity account the first time a
  // valid token arrives for a sub claim it has no account for.
  //
  // When false (the default), the platform creates federated accounts through
  // the CreateFederatedAccount API before its users can sign in. When true,
  // the account is created from the token's claims, or from the
  // userinfo_endpoint when the token carries no email claim. Later sign-ins
  // do not refresh the profile.
  //
  // Creating an account grants nothing by itself: sign_in_role does.
  bool create_accounts_on_sign_in = 13;

  // The role an account receives the first time it signs in to an
  // organization through this provider: the organization its token is bound
  // to (tenant_org_claim's, or the provider's own).
  //
  // Granted once per account and organization. A role an admin later removes
  // is not granted again, and changing this setting does not reach accounts
  // that already signed in there. Unspecified (iam_role_unspecified) grants
  // nothing. The owner role is refused with
  // `identity_provider.sign_in_role_not_owner`: ownership is assigned
  // explicitly.
  ai.stigmer.iam.v1.IamRole sign_in_role = 14;
}
