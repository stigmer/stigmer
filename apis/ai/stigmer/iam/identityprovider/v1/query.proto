syntax = "proto3";

package ai.stigmer.iam.identityprovider.v1;

import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";
import "ai/stigmer/iam/identityprovider/v1/api.proto";
import "ai/stigmer/iam/identityprovider/v1/io.proto";

// IdentityProviderQueryController provides read operations for identity providers.
service IdentityProviderQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = identity_provider;

  // Get an identity provider by its unique identifier.
  //
  // @internal
  // Authorization: Requires can_view permission on the identity provider resource.
  rpc get(ai.stigmer.commons.apiresource.ApiResourceId) returns (IdentityProvider) {
    option (ai.stigmer.commons.rpc.config).resource_kind = identity_provider;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view identity provider";
  }

  // Get an identity provider by its organization-scoped reference (org/slug).
  //
  // Resolves a human-readable reference like "acme/planton-cloud" to the full
  // IdentityProvider resource.
  //
  // @internal
  // Custom authorization in handler — checks both direct resource access
  // and organization-level visibility permissions.
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (IdentityProvider) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List all identity providers belonging to an organization.
  //
  // Returns every IdentityProvider whose metadata.org matches the input org.
  // Typically a small set (1-3 per org), so results are not paginated.
  //
  // @internal
  // Authorization: Requires can_view permission on the organization resource.
  rpc listByOrg(ListIdentityProvidersByOrgInput) returns (IdentityProviders) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to list identity providers in this organization";
  }

  // Look up the SSO identity provider for an organization.
  //
  // Returns the SSO-relevant projection (display name, OIDC client ID, issuer)
  // of the IdentityProvider where is_sso_provider is true for the given org.
  // Returns NOT_FOUND if the organization has no SSO provider configured.
  //
  // This endpoint is called by the web app's login page before the user has
  // authenticated, so it requires no authorization. The response intentionally
  // omits internal IdP configuration (JWKS URI, rate limits, userinfo endpoint).
  //
  // @internal
  // Authorization: none — unauthenticated, public endpoint for login page rendering.
  rpc getSsoProvider(OrganizationSsoLookup) returns (SsoProviderInfo) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
