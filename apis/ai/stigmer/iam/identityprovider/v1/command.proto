syntax = "proto3";

package ai.stigmer.iam.identityprovider.v1;

import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";
import "ai/stigmer/iam/identityprovider/v1/api.proto";

// IdentityProviderCommandController provides write operations for identity providers.
service IdentityProviderCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = identity_provider;

  // Create or update an identity provider.
  //
  // If the resource does not exist, creates a new identity provider.
  // If the resource exists, updates the existing identity provider.
  //
  // @internal
  // The authorization and state-operation are determined depending on whether the
  // identity provider is going to be created or updated, which is determined as
  // part of the request execution.
  rpc apply(IdentityProvider) returns (IdentityProvider);

  // Create an identity provider.
  //
  // The creator's organization owns the identity provider.
  //
  // @internal
  // Authorization: Requires can_create_idp permission in the organization.
  rpc create(IdentityProvider) returns (IdentityProvider) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_idp;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to create identity provider in this organization";
  }

  // Update an existing identity provider.
  //
  // @internal
  // Authorization: Requires can_edit permission on the identity provider resource.
  rpc update(IdentityProvider) returns (IdentityProvider) {
    option (ai.stigmer.commons.rpc.config).resource_kind = identity_provider;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update identity provider";
  }

  // Delete an identity provider.
  //
  // Deletion is blocked if any platform-managed organizations reference this
  // identity provider.
  //
  // @internal
  // Authorization: Requires can_delete permission on the identity provider resource.
  rpc delete(ai.stigmer.commons.apiresource.ApiResourceDeleteInput) returns (IdentityProvider) {
    option (ai.stigmer.commons.rpc.config).resource_kind = identity_provider;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete identity provider";
  }
}
