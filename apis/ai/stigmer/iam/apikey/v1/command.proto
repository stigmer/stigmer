syntax = "proto3";

package ai.stigmer.iam.apikey.v1;

import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";
import "ai/stigmer/iam/apikey/v1/api.proto";
import "ai/stigmer/iam/apikey/v1/io.proto";

// ApiKeyCommandController handles write operations for API keys.
service ApiKeyCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = api_key;

  // Create an API key for the authenticated user.
  //
  // The raw key value is included in the response and is never returned again.
  // Store it securely before discarding the response.
  //
  // @internal
  // Any authenticated user can create API keys, so authorization is skipped.
  // A service account's own key is refused: its keys are created by its
  // organization's admins with createForServiceAccount.
  rpc create(ApiKey) returns (ApiKey) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Create an API key for a service account.
  //
  // The key speaks for the service account, not for the caller who creates
  // it: it keeps working when that caller leaves, it works only in the
  // service account's organization, and resources it creates name the
  // service account as their creator. The raw key value is included in the
  // response and is never returned again.
  //
  // Authorization: Requires can_manage_keys on the service account, which
  // its organization's admins hold. A service account's own key is refused.
  rpc createForServiceAccount(CreateServiceAccountKeyInput) returns (ApiKey) {
    option (ai.stigmer.commons.rpc.config).resource_kind = identity_account;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_keys;
    option (ai.stigmer.commons.rpc.config).field_path = "service_account_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to manage this service account's keys";
  }

  // Update an existing API key.
  //
  // @internal
  // Authorization: Requires can_edit permission on the API key resource.
  rpc update(ApiKey) returns (ApiKey) {
    option (ai.stigmer.commons.rpc.config).resource_kind = api_key;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update api key";
  }

  // Delete an API key.
  //
  // @internal
  // Authorization: Requires can_delete permission on the API key resource.
  rpc delete(ApiKeyId) returns (ApiKey) {
    option (ai.stigmer.commons.rpc.config).resource_kind = api_key;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete api key";
  }
}
