syntax = "proto3";

package ai.stigmer.iam.apikey.v1;

import "ai/stigmer/iam/apikey/v1/api.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// ApiKeys contains a list of API key resources.
message ApiKeys {
  // API key entries.
  repeated ApiKey entries = 1;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 2;
}

// ApiKeyId identifies an API key by its unique identifier.
message ApiKeyId {
  // Unique identifier of the API key.
  string value = 1 [(buf.validate.field).required = true];
}

// ApiKeyHash identifies an API key by its hashed key value.
message ApiKeyHash {
  // Hash of the raw API key.
  string value = 1 [(buf.validate.field).required = true];
}

// Input for listing the caller's own API keys, newest first.
message ListApiKeysInput {
  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 1 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 2 [(buf.validate.field).string.max_len = 1024];
}

// Input for listing the API keys that speak for one identity account,
// newest first.
message ListApiKeysByAccountInput {
  // The identity account whose keys are listed.
  string account_id = 1 [(buf.validate.field).required = true];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
}

// CreateServiceAccountKeyInput is the command for creating an API key that
// speaks for a service account.
message CreateServiceAccountKeyInput {
  // Identity account id of the service account the key speaks for.
  string service_account_id = 1 [(buf.validate.field).required = true];

  // The key's name, shown beside its fingerprint (e.g., "github-actions").
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];

  // Expiration time for the key. Ignored when never_expires is true.
  google.protobuf.Timestamp expires_at = 3;

  // When true, the key never expires regardless of expires_at.
  bool never_expires = 4;
}

// The changes an update makes to an API key: the fields update_mask names,
// taken from resource.
message UpdateApiKeyInput {
  option (buf.validate.message).cel = {
    id: "update_names_its_target"
    message: "resource.metadata.id is required: an update names the API key by its id"
    expression: "has(this.resource) && has(this.resource.metadata) && this.resource.metadata.id != ''"
  };

  // The API key carrying the new values, named by metadata.id. Only the fields
  // update_mask names are read, so the others may be left empty; the result
  // is validated as a whole.
  ApiKey resource = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The paths the update changes, as proto field names (spec.instructions,
  // metadata.labels). A list or map at a named path is replaced whole; "*"
  // names every path an update may change.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}
