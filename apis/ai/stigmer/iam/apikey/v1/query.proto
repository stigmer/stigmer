syntax = "proto3";

package ai.stigmer.iam.apikey.v1;

import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";
import "ai/stigmer/iam/apikey/v1/api.proto";
import "ai/stigmer/iam/apikey/v1/io.proto";
import "google/protobuf/empty.proto";

// ApiKeyQueryController handles read operations for API keys.
service ApiKeyQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = api_key;

  // Get an API key by its unique identifier.
  rpc get(ApiKeyId) returns (ApiKey) {
    option (ai.stigmer.commons.rpc.config).resource_kind = api_key;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view api key";
  }

  // Get an API key by its hashed key value.
  //
  // @internal
  // A skip-authorization lane: the input names no key id, so no annotation
  // can target the row, and the lane is served to any authenticated caller
  // in every edition with no further gate.
  rpc getByKeyHash(ApiKeyHash) returns (ApiKey) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List all API keys belonging to the authenticated user.
  //
  // Returns only the keys that speak for the identity account in the auth
  // header; a service account's keys are listed with findByAccount.
  //
  // @internal
  // Scoped to the caller's own keys, so authorization is skipped.
  rpc findAll(google.protobuf.Empty) returns (ApiKeys) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List the API keys that speak for an identity account.
  //
  // An organization's admins list a service account's keys with it; a person
  // lists their own.
  //
  // Authorization: Requires can_view on the identity account.
  rpc findByAccount(ApiKeyAccountId) returns (ApiKeys) {
    option (ai.stigmer.commons.rpc.config).resource_kind = identity_account;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "identity_account_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to list this account's api keys";
  }
}
