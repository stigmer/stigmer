syntax = "proto3";

package ai.stigmer.iam.federationissuer.v1;

import "ai/stigmer/iam/federationissuer/v1/api.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";

// FederationIssuerId identifies a federation issuer by its unique identifier.
message FederationIssuerId {
  // Unique identifier of the federation issuer resource.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// FederationIssuers contains a list of federation issuer resources.
message FederationIssuers {
  // Federation issuer entries.
  repeated FederationIssuer entries = 1;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 2;
}

// ListFederationIssuersInput specifies the organization whose federation
// issuers should be returned.
message ListFederationIssuersInput {
  // Organization slug to list federation issuers for.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];

  // Only resources carrying every label given, each matched exactly (AND).
  // A selective filter may answer short pages, even empty ones, that still
  // carry a token.
  map<string, string> labels = 4;
}

// The changes an update makes to a federation issuer: the fields update_mask names,
// taken from resource.
message UpdateFederationIssuerInput {
  option (buf.validate.message).cel = {
    id: "update_names_its_target"
    message: "resource.metadata.id is required: an update names the federation issuer by its id"
    expression: "has(this.resource) && has(this.resource.metadata) && this.resource.metadata.id != ''"
  };

  // The federation issuer carrying the new values, named by metadata.id. Only the fields
  // update_mask names are read, so the others may be left empty; the result
  // is validated as a whole.
  FederationIssuer resource = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The paths the update changes, as proto field names (spec.instructions,
  // metadata.labels). A list or map at a named path is replaced whole; "*"
  // names every path an update may change.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}
