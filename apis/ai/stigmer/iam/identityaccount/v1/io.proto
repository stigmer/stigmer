syntax = "proto3";

package ai.stigmer.iam.identityaccount.v1;

import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/iam/identityaccount/v1/api.proto";
import "ai/stigmer/iam/v1/enum.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";

// IdentityAccounts contains a list of identity account resources.
message IdentityAccounts {
  // Identity account entries.
  repeated IdentityAccount entries = 1;
}

// IdentityAccountId identifies an identity account by its unique identifier.
message IdentityAccountId {
  // Unique identifier of the identity account.
  string value = 1 [(buf.validate.field).required = true];
}

// IdentityAccountEmail identifies an identity account by its email address.
message IdentityAccountEmail {
  // Email address of the identity account.
  string value = 1 [(buf.validate.field).required = true];
}

// IdpId identifies an identity account by its identity provider ID.
message IdpId {
  // Identity provider ID of the account.
  string value = 1 [(buf.validate.field).required = true];
}

// IdentityAccountsList is a paginated response containing identity accounts.
message IdentityAccountsList {
  // Identity accounts in the current page.
  repeated IdentityAccount entries = 2;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 3;
}

// ListServiceAccountsInput is the input for paginated queries scoped to an organization.
message ListServiceAccountsInput {
  // Organization to list identity accounts for, by id or slug.
  string org = 1;

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 3 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 4 [(buf.validate.field).string.max_len = 1024];

  // Only resources carrying every label given, each matched exactly (AND).
  // A selective filter may answer short pages, even empty ones, that still
  // carry a token.
  map<string, string> labels = 5;
}

// ExternalSubLookup identifies a federated identity account by its federation issuer
// reference and external subject identifier (OIDC sub claim).
//
// Used by platform backends to check whether a federated account already exists
// before calling createFederatedAccount.
message ExternalSubLookup {
  // Organization that owns the federation issuer.
  // Used as the authorization scope: caller must have can_create_identity_account
  // permission on this organization.
  string org = 1 [(buf.validate.field).required = true];

  // Reference to the FederationIssuer that the federated account belongs to.
  ai.stigmer.commons.apiresource.ApiResourceReference federation_issuer_ref = 2 [(ai.stigmer.commons.apiresource.reference_kind) = federation_issuer];

  // External subject identifier from the platform's OIDC provider.
  // The raw OIDC sub claim (e.g., "google-oauth2|109876543210").
  string external_sub = 3 [(buf.validate.field).required = true];
}

// CreateFederatedAccountInput is the command for creating a federated identity account
// linked to an external platform's federation issuer.
//
// Called by platform backends (via API key) when a new user signs up on their platform.
// The platform provides the user's OIDC subject identifier and profile data.
// Under a provider in manual mode the account must exist before the user can
// authenticate; a just-in-time provider creates it on first sign-in.
message CreateFederatedAccountInput {
  // Organization that owns the federation issuer.
  // Used as the authorization scope: caller must have can_create_identity_account
  // permission on this organization.
  // Must match federation_issuer_ref.org (when federation_issuer_ref.org is non-empty).
  string org = 1 [(buf.validate.field).required = true];

  // Reference to the FederationIssuer that this federated account belongs to.
  // The federation issuer must exist and belong to the specified org.
  ai.stigmer.commons.apiresource.ApiResourceReference federation_issuer_ref = 2 [(ai.stigmer.commons.apiresource.reference_kind) = federation_issuer];

  // External subject identifier from the platform's OIDC provider.
  // The raw OIDC sub claim (e.g., "google-oauth2|109876543210").
  // Stored as-is without any prefix transformation.
  // Must match the sub claim in JWTs this federation issuer accepts for authentication to work.
  string external_sub = 3 [(buf.validate.field).required = true];

  // Email address of the user.
  string email = 4 [(buf.validate.field).required = true];

  // First name of the user.
  string first_name = 5;

  // Last name of the user.
  string last_name = 6;

  // URL of the user's profile picture.
  string picture_url = 7;
}

// UpdateFederatedAccountInput is the command for updating profile fields on a
// federated identity account identified by its natural key (federation issuer
// reference + external subject).
//
// Called by platform backends when a user's profile changes on their platform
// (e.g., name update, email change). Uses full-replace semantics: all profile
// fields must be provided. Identity keys (org, federation_issuer_ref, external_sub)
// are immutable and used only for lookup.
message UpdateFederatedAccountInput {
  // Organization that owns the federation issuer.
  // Used as the authorization scope: caller must have can_create_identity_account
  // permission on this organization.
  string org = 1 [(buf.validate.field).required = true];

  // Reference to the FederationIssuer that the federated account belongs to.
  ai.stigmer.commons.apiresource.ApiResourceReference federation_issuer_ref = 2 [(ai.stigmer.commons.apiresource.reference_kind) = federation_issuer];

  // External subject identifier (OIDC sub claim) — lookup key, not updatable.
  string external_sub = 3 [(buf.validate.field).required = true];

  // Updated email address.
  string email = 4 [(buf.validate.field).required = true];

  // Updated first name.
  string first_name = 5;

  // Updated last name.
  string last_name = 6;

  // Updated profile picture URL.
  string picture_url = 7;
}

// DeprovisionFederatedAccountInput is the command for revoking a federated
// identity account's access, with an option to delete the account entirely.
//
// Called by platform backends when a user is removed from their platform
// (e.g., employee offboarding, account suspension). Uses the natural key
// (federation issuer reference + external subject) for lookup.
//
// Two modes:
//   - Revoke only (delete_account = false): removes all grants for the
//     account in the organization and in every organization the federation
//     issuer manages, where its sign-in grants roles too. The identity
//     account is preserved for audit trail. The user can still sign in but
//     holds no role in those organizations, and an existing account is never
//     granted one at sign-in, so this is the mode that keeps a user of a
//     just-in-time federation issuer out.
//   - Revoke and delete (delete_account = true): revokes access AND deletes
//     the identity account. All grants across all organizations are
//     cleaned up. Under a just-in-time provider, the user's next
//     sign-in creates the account again with any role the provider grants
//     automatically; use it when the user can no longer sign in to the
//     provider.
message DeprovisionFederatedAccountInput {
  // Organization that owns the federation issuer.
  // Used as the authorization scope: caller must have can_create_identity_account
  // permission on this organization.
  string org = 1 [(buf.validate.field).required = true];

  // Reference to the FederationIssuer that the federated account belongs to.
  ai.stigmer.commons.apiresource.ApiResourceReference federation_issuer_ref = 2 [(ai.stigmer.commons.apiresource.reference_kind) = federation_issuer];

  // External subject identifier (OIDC sub claim) — lookup key.
  string external_sub = 3 [(buf.validate.field).required = true];

  // When false (default): revoke the account's access in this organization and the organizations its federation issuer manages.
  // When true: revoke access AND delete the identity account; a just-in-time
  // provider creates a new one at the user's next sign-in.
  bool delete_account = 4;
}

// CreateServiceAccountInput is the command for creating an organization's
// service account.
message CreateServiceAccountInput {
  option (buf.validate.message).cel = {
    id: "service_account.role_not_owner"
    message: "role must be admin, member or viewer; a service account never owns its organization"
    expression: "this.role == 2 || this.role == 3 || this.role == 4"
  };

  // Organization the service account belongs to, by id or slug.
  // Used as the authorization scope: caller must have can_create_identity_account
  // permission on this organization.
  string org = 1 [(buf.validate.field).required = true];

  // The service account's name, unique among the organization's service
  // accounts (e.g., "ci-deploy").
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];

  // The organization role the service account holds: admin, member or viewer.
  ai.stigmer.iam.v1.IamRole role = 3;
}

// The changes an update makes to an identity account: the fields update_mask names,
// taken from resource.
message UpdateIdentityAccountInput {
  option (buf.validate.message).cel = {
    id: "update_names_its_target"
    message: "resource.metadata.id is required: an update names the identity account by its id"
    expression: "has(this.resource) && has(this.resource.metadata) && this.resource.metadata.id != ''"
  };

  // The identity account carrying the new values, named by metadata.id. Only the fields
  // update_mask names are read, so the others may be left empty; the result
  // is validated as a whole.
  IdentityAccount resource = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The paths the update changes, as proto field names (spec.instructions,
  // metadata.labels). A list or map at a named path is replaced whole; "*"
  // names every path an update may change.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}
