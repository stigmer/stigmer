syntax = "proto3";

package ai.stigmer.iam.identityaccount.v1;

import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";
import "ai/stigmer/iam/identityaccount/v1/api.proto";
import "ai/stigmer/iam/identityaccount/v1/io.proto";
import "google/protobuf/empty.proto";

// IdentityAccountCommandController handles write operations for identity accounts.
service IdentityAccountCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = identity_account;

  // Create a new identity account.
  //
  // @internal
  // System-level RPC. The handler admits machine, internal and in-process
  // callers — the federation lanes, the provisioner behind provisionMyAccount,
  // the trusted-local operator ensure at boot — and refuses a wire caller of
  // the user class with PERMISSION_DENIED before the chain runs
  // (stigmer-cloud#393); the rule is the same in every edition. A caller's
  // metadata.id is replaced by the id derived from spec.idp_id. The
  // self-owner grant is the standard CreateAuthorizationTuples step's work
  // after Persist.
  rpc create(IdentityAccount) returns (IdentityAccount) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Update an existing identity account.
  //
  // @internal
  // Authorization: Requires can_edit permission on the identity account resource.
  rpc update(IdentityAccount) returns (IdentityAccount) {
    option (ai.stigmer.commons.rpc.config).resource_kind = identity_account;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update identity account";
  }

  // Delete an identity account.
  //
  // @internal
  // Authorization: Requires can_delete permission on the identity account resource.
  rpc delete(IdentityAccountId) returns (IdentityAccount) {
    option (ai.stigmer.commons.rpc.config).resource_kind = identity_account;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete identity account";
  }

  // Create a federated identity account for an external platform user.
  //
  // Called by platform backends (via API key) when a new user signs up on their
  // platform. The platform provides the user's OIDC subject identifier and profile
  // data. The account must be created before the user can authenticate via the IdP.
  //
  // Returns the full identity account including its ID, which the platform uses
  // to grant roles via IAM policies.
  //
  // Served by the Enterprise and Cloud editions; the open-source server
  // answers UNIMPLEMENTED.
  //
  // Authorization: Requires can_create_identity_account on the organization
  // that owns the identity provider.
  rpc createFederatedAccount(CreateFederatedAccountInput) returns (IdentityAccount) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_identity_account;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to create identity accounts in this organization";
  }

  // Update profile fields on a federated identity account.
  //
  // Looks up the account by natural key (identity_provider_ref + external_sub)
  // and updates email, name, and picture. Identity keys are immutable.
  //
  // Called by platform backends when a user's profile changes on their platform.
  //
  // Served by the Enterprise and Cloud editions; the open-source server
  // answers UNIMPLEMENTED.
  //
  // Authorization: Requires can_create_identity_account on the organization
  // that owns the identity provider.
  rpc updateFederatedAccount(UpdateFederatedAccountInput) returns (IdentityAccount) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_identity_account;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to manage identity accounts in this organization";
  }

  // Deprovision a federated identity account by revoking access or deleting it.
  //
  // Looks up the account by natural key (identity_provider_ref + external_sub).
  // When delete_account is false, revokes all IAM policies in the organization.
  // When delete_account is true, revokes policies and deletes the account.
  //
  // Called by platform backends during user offboarding.
  //
  // Served by the Enterprise and Cloud editions; the open-source server
  // answers UNIMPLEMENTED.
  //
  // Authorization: Requires can_create_identity_account on the organization
  // that owns the identity provider.
  rpc deprovisionFederatedAccount(DeprovisionFederatedAccountInput) returns (IdentityAccount) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_identity_account;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to manage identity accounts in this organization";
  }

  // Provision the caller's own identity account.
  //
  // The first-sign-in step every client runs when whoAmI() returns NOT_FOUND:
  // the console's identity gate, `stigmer auth login` and `stigmer auth whoami`,
  // and the SDK's ensureMyIdentityAccount. Derives the account from the
  // caller's token and the userinfo endpoint of the issuer that vouched for
  // it. Idempotent: returns the existing account on retry.
  //
  // @internal
  // The core creates the account and nothing else. Edition steps ride the
  // `identity-account-provision:post-persist` gate slot, after the account
  // persists and before the reply; Stigmer Cloud's personal organization is
  // one such step, not this RPC's contract.
  rpc provisionMyAccount(google.protobuf.Empty) returns (IdentityAccount) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
