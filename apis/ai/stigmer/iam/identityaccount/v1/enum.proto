syntax = "proto3";

package ai.stigmer.iam.identityaccount.v1;

// IdentityAccountProvisioningMode defines how an identity account was created.
//
// @internal
// Unspecified is the default for legacy accounts created before this enum was introduced.
enum IdentityAccountProvisioningMode {
  // Default value for legacy accounts created before provisioning mode tracking.
  identity_account_provisioning_mode_unspecified = 0;

  // User signed up directly via Stigmer's own authentication tenant.
  direct = 1;

  // Account was created by the platform for federated authentication via an IdentityProvider.
  federated = 2;

  // Machine-to-machine client credentials account for inter-service communication.
  machine = 3;

  // Account provisioned via a PlatformClient's mintUserToken endpoint.
  //
  // The idp_id for these accounts uses the composite encoding
  // "stgm_pc|{org}|{external_user_id}", where org is the owning organization of
  // the PlatformClient that minted the token and external_user_id is the user
  // identifier supplied by the platform builder. Every PlatformClient of one
  // organization therefore resolves the same user to the same account. The
  // "stgm_pc|" prefix is reserved: no other provisioning mode may use it.
  //
  // Unlike federated accounts, PlatformClient is not an ongoing authentication
  // authority. Stigmer signs its own JWTs for these users; the PlatformClient
  // is the admission credential used at mint time only.
  platform_client = 4;

  // An organization's own non-person account: the principal its automation
  // (a CI job, a script, an integration) acts as, so the automation keeps
  // working when the person who set it up leaves.
  //
  // Created by an organization admin with createServiceAccount, it belongs to
  // that one organization for its whole life, holds one organization role
  // (admin, member or viewer, never owner) and acts only through API keys
  // the organization's admins create for it. Its keys work only in its
  // organization, and deleting it ends every key at once.
  //
  // The idp_id uses the composite encoding "stgm_sa|{org}|{random}", where
  // org is the owning organization's id and random is drawn at creation, so
  // a service account deleted and created again under the same name is a
  // new principal that inherits nothing. The "stgm_sa|" prefix is reserved:
  // no other provisioning mode may use it, and no sign-in resolves to it.
  service_account = 5;
}
