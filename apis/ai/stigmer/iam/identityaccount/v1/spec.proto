syntax = "proto3";

package ai.stigmer.iam.identityaccount.v1;

import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/iam/identityaccount/v1/enum.proto";
import "buf/validate/validate.proto";

// IdentityAccountSpec defines the configuration for an identity account.
//
// An identity account represents a user or machine principal in Stigmer.
// Accounts can be direct (signed up via Stigmer), federated (provisioned
// through an external identity provider), machine (service-to-service
// credentials), or platform_client (provisioned via a PlatformClient's
// mintUserToken endpoint).
//
// @internal
// All FGA tuples use identity_account as the principal type.
// Provisioning details:
// - direct: Auth0 subject ID (e.g., "auth0|abc123")
// - federated: raw OIDC sub claim (e.g., "google-oauth2|109876543210"),
//   scoped by identity_provider_ref
// - machine: Auth0 client ID with "@clients" suffix
// - platform_client: composite "stgm_pc|{org}|{external_user_id}" where org
//   is the Stigmer org that owns the PlatformClient(s) and external_user_id
//   is the platform builder's stable identifier for the user. Scoping by org
//   (not by PlatformClient) means a customer's end user resolves to a single
//   IdentityAccount across all of that customer's PlatformClients. Globally
//   unique by construction.
message IdentityAccountSpec {
  // IDP ID of the identity account.
  //
  // For direct accounts: the Auth0 subject ID (e.g., "auth0|abc123").
  // For federated accounts: the raw OIDC sub claim from the external identity
  // provider (e.g., "google-oauth2|109876543210"). Uniqueness is scoped by
  // identity_provider_ref — the pair (identity_provider_ref, idp_id) is unique.
  // For machine accounts: the Auth0 client ID with "@clients" suffix.
  // For platform_client accounts: composite "stgm_pc|{org}|{external_user_id}"
  // where org is the Stigmer org that owns the PlatformClient(s) and
  // external_user_id is the platform builder's stable identifier for the user.
  // Scoping by org (not by PlatformClient) means the same user_id presented
  // via any PlatformClient in the same org resolves to the same IdentityAccount.
  // Globally unique by construction — no additional scope field is needed.
  string idp_id = 1 [(buf.validate.field).required = true];

  // Email of the identity account.
  // For direct accounts: based on the email used to sign up.
  // For federated accounts: provided by the platform when creating the account.
  // (ignored for create) this value is assigned by backend.
  string email = 2;

  // First name of the identity account.
  string first_name = 3;

  // Last name of the identity account.
  string last_name = 4;

  // URL of the profile picture.
  // For direct accounts: from Auth0 profile.
  // For federated accounts: from the IdentityProvider's UserInfo endpoint.
  string picture_url = 5;

  // Indicates if this is a machine account used for inter-service communication.
  // Machine accounts have idp_id values ending with "@clients" suffix.
  // (ignored for create) this value is assigned by backend based on idp_id.
  bool is_machine_account = 6;

  // How this identity account was provisioned.
  // Unspecified for legacy accounts created before this field was introduced.
  // (ignored for create) this value is assigned by backend.
  IdentityAccountProvisioningMode provisioning_mode = 7;

  // Reference to the IdentityProvider that owns this federated account.
  // Set only when provisioning_mode is FEDERATED. Identifies which external
  // platform's identity provider scopes this account. Together with idp_id,
  // forms the unique identity for federated accounts.
  // (ignored for create) this value is assigned by backend.
  ai.stigmer.commons.apiresource.ApiResourceReference identity_provider_ref = 8;

  // Standing preferences declared by this identity account.
  IdentityAccountPreferences preferences = 9;
}

// IdentityAccountPreferences holds user-declared defaults that apply to the
// user's own agent executions.
//
// @internal
// Self-service: mutable through the existing update RPC under FGA can_edit
// (owner, via the self-ownership tuple written at account creation) — zero
// new IAM. Grows along the user scope's taxonomy path (Phase 1.5
// candidates: default harness, per-harness default model; Phase 2: memory
// opt-in). Never composed for machine accounts or platform-client user
// tokens (DD-002 D4 as amended).
message IdentityAccountPreferences {
  // Free-text standing context injected into this user's eligible agent
  // executions. Example: "Keep answers terse."
  //
  // @internal
  // Snapshotted verbatim into
  // AgentExecutionSpec.declared_preferences.user_context at execution create
  // (first-party human operators only, DD-002 D4 as amended). The runner
  // frames it as context, not instructions that override the task.
  string standing_context = 1 [(buf.validate.field).string.max_len = 2000];
}
