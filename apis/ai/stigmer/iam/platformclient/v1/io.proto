syntax = "proto3";

package ai.stigmer.iam.platformclient.v1;

import "ai/stigmer/iam/platformclient/v1/api.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";

// PlatformClientId identifies a platform client by its unique identifier.
message PlatformClientId {
  // Unique identifier of the platform client resource.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// PlatformClients contains a list of platform client resources.
message PlatformClients {
  // Platform client entries.
  repeated PlatformClient entries = 1;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 2;
}

// ListPlatformClientsInput specifies the organization whose platform
// clients should be returned.
message ListPlatformClientsInput {
  // Organization slug to list platform clients for.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
}

// PlatformClientCreateResponse wraps a PlatformClient resource with the
// one-time raw client secret.
//
// Returned by the create and rotateSecret RPCs. The client_secret field
// contains the raw secret value that must be stored securely by the caller —
// it is never returned again after this response.
//
// This wrapper makes the one-time secret explicit in the type system rather
// than relying on transient field injection in the resource message.
message PlatformClientCreateResponse {
  // The created or updated platform client resource.
  PlatformClient platform_client = 1;

  // The raw client secret. Store this value securely — it is not retrievable
  // after this response. If lost, use rotateSecret to generate a new one.
  string client_secret = 2;
}

// The changes an update makes to a platform client: the fields update_mask names,
// taken from resource.
message UpdatePlatformClientInput {
  option (buf.validate.message).cel = {
    id: "update_names_its_target"
    message: "resource.metadata.id is required: an update names the platform client by its id"
    expression: "has(this.resource) && has(this.resource.metadata) && this.resource.metadata.id != ''"
  };

  // The platform client carrying the new values, named by metadata.id. Only the fields
  // update_mask names are read, so the others may be left empty; the result
  // is validated as a whole.
  PlatformClient resource = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The paths the update changes, as proto field names (spec.instructions,
  // metadata.labels). A list or map at a named path is replaced whole; "*"
  // names every path an update may change.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}
