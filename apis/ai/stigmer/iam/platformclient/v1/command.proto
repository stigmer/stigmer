syntax = "proto3";

package ai.stigmer.iam.platformclient.v1;

import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";
import "ai/stigmer/iam/platformclient/v1/api.proto";
import "ai/stigmer/iam/platformclient/v1/io.proto";

// PlatformClientCommandController provides write operations for platform client resources.
//
// Platform clients hold OAuth2 credentials (client_id + client_secret) for
// platform builders embedding Stigmer into their products. The client_secret
// is generated server-side and returned only once in the create and
// rotateSecret responses.
//
// @internal
// PlatformClients hold credential material (client_secret_hash) and are always
// org-private. There is no updateVisibility RPC — public visibility is
// intentionally unsupported to prevent credential leakage.
service PlatformClientCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = platform_client;

  // Create a platform client.
  //
  // Generates a new client_id (stgm_cid_ prefix) and client_secret (stgm_cs_ prefix).
  // The raw client_secret is included in the response and is never returned again.
  // Store it securely before discarding the response.
  //
  // The creator's organization owns the platform client. The creator is granted
  // the owner role automatically.
  //
  // The slug `system-share-client` is platform-reserved (it identifies the org's
  // system-managed share client) and is rejected with INVALID_ARGUMENT — including
  // when derived from the resource name.
  //
  // @internal
  // Authorization: Requires can_create_platform_client permission in the organization.
  rpc create(PlatformClient) returns (PlatformClientCreateResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_platform_client;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to create platform client in this organization";
  }

  // Update an existing platform client.
  //
  // Only mutable fields can be changed: auto_provision_accounts, auto_grant_on_org,
  // auto_grant_role, and allowed_origins. Credential fields (client_id,
  // client_secret_hash, secret_fingerprint) are immutable after creation.
  // Use rotateSecret to change the client secret.
  //
  // @internal
  // Authorization: Requires can_edit permission on the platform client resource.
  rpc update(PlatformClient) returns (PlatformClient) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform_client;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update platform client";
  }

  // Delete a platform client.
  //
  // Immediately invalidates the client_id and client_secret AND revokes
  // the client's outstanding user tokens: the platform resolves the
  // minting client on every user-token request, and a client that no
  // longer exists is refused UNAUTHENTICATED (fail closed) — so deletion
  // takes effect on the very next request, not at token expiry.
  //
  // @internal
  // Authorization: Requires can_delete permission on the platform client resource.
  rpc delete(ai.stigmer.commons.apiresource.ApiResourceDeleteInput) returns (PlatformClient) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform_client;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete platform client";
  }

  // Rotate the client secret.
  //
  // Generates a new client_secret, invalidates the old one immediately,
  // and returns the new raw secret in the response. The client_id remains
  // unchanged — platform builders do not need to update their client_id
  // configuration after rotation.
  //
  // @internal
  // Authorization: Requires can_edit permission on the platform client resource.
  rpc rotateSecret(PlatformClientId) returns (PlatformClientCreateResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform_client;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to rotate platform client secret";
  }
}
