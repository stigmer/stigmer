syntax = "proto3";

package ai.stigmer.iam.platformclient.v1;

import "ai/stigmer/commons/rpc/method_options.proto";
import "buf/validate/validate.proto";

// PlatformClientTokenController provides token-minting operations for
// platform builders embedding Stigmer into their products.
//
// This service is distinct from the CRUD controllers — it does not manage
// a resource lifecycle. Instead, it issues Stigmer-signed JWTs on behalf
// of platform builder users, authenticated via PlatformClient credentials
// (client_id + client_secret).
//
// The minted JWT is signed by Stigmer's own key pair (not Auth0). The auth
// chain validates these tokens via a dedicated PlatformClientTokenAuthenticationProvider
// that checks the Stigmer-issued signature and resolves the identity account.
//
// mintGuestToken is the credential-free exception: no client_id/client_secret.
// It mints a guest-scoped JWT for anonymous visitors of a shared agent's
// hosted page, gated on an enabled public-audience AgentShare
// (ai.stigmer.agentic.agentshare.v1).
service PlatformClientTokenController {
  // Mint a user-scoped JWT for browser-based access to Stigmer resources.
  //
  // The platform builder's backend calls this RPC with its PlatformClient
  // credentials (client_id + client_secret) and the end user's identity.
  // Stigmer validates the credentials, optionally JIT-provisions the user's
  // identity account, and returns a Stigmer-signed JWT.
  //
  // The returned JWT can be used by the React SDK (via StigmerProvider's
  // getAccessToken callback) to authenticate API calls from the browser.
  //
  // Authentication flow:
  // 1. Validate client_id + client_secret against stored hash
  // 2. Resolve or JIT-provision the identity account for user_id
  // 3. If auto_grant_on_org is enabled, grant the configured role
  // 4. Sign a JWT with Stigmer's private key containing the user's identity
  //
  // Error scenarios:
  // - UNAUTHENTICATED: Invalid client_id or client_secret
  // - FAILED_PRECONDITION: user_id does not exist and auto_provision_accounts
  //   is false, or the PlatformClient secret has expired
  // - INTERNAL: Account provisioning could not be completed (for example, the
  //   auto_grant_on_org role grant failed). No partial account is left behind
  //   — the account is rolled back — so the request is safe to retry.
  //
  // Origin enforcement (spec.allowed_origins) does NOT apply to this call:
  // minting is server-to-server, so there is no browser Origin to check.
  // It applies to the browser API calls that BEAR the minted token — when
  // the PlatformClient lists allowed_origins, requests whose Origin header
  // is not on the list are refused PERMISSION_DENIED (see the
  // allowed_origins field docs in spec.proto for the exact semantics).
  //
  // @internal
  // This RPC is public — no Bearer token is required. The caller authenticates
  // by providing client_id + client_secret in the request body. The handler
  // validates these credentials as business logic, not via the auth interceptor.
  rpc mintUserToken(MintUserTokenRequest) returns (MintUserTokenResponse) {
    option (ai.stigmer.commons.rpc.is_public) = true;
  }

  // Mint a guest-scoped JWT for an anonymous visitor of a shared agent's hosted page.
  //
  // Resolves org+slug to an AgentShare, provisions the org's system-managed
  // PlatformClient and guest identity account lazily, and returns a short-lived
  // Stigmer-signed JWT scoped to that org.
  //
  // @internal
  // Public — no Bearer token. No PlatformClient credentials. The handler gates
  // on an enabled public-audience share (NOT_FOUND when disabled or missing)
  // and stamps the resolved share's id into the guest JWT as the share_id
  // claim — the create-time gate re-reads the live share by that id on every
  // session/execution create (decision 011 D6).
  rpc mintGuestToken(MintGuestTokenRequest) returns (MintGuestTokenResponse) {
    option (ai.stigmer.commons.rpc.is_public) = true;
  }
}

// MintUserTokenRequest contains the credentials and user identity needed
// to mint a Stigmer JWT.
//
// Called from the platform builder's backend — never from a browser.
// The client_secret must be transmitted over TLS and never exposed in
// client-side code.
message MintUserTokenRequest {
  // The PlatformClient's client identifier (stgm_cid_ prefix).
  // Used together with client_secret to authenticate the request.
  string client_id = 1 [(buf.validate.field).string.min_len = 1];

  // The raw client secret (stgm_cs_ prefix).
  // Validated against the stored client_secret_hash.
  string client_secret = 2 [(buf.validate.field).string.min_len = 1];

  // Platform's stable user identifier for the end user. Used together with
  // the PlatformClient's owning org to resolve or create an IdentityAccount
  // (keyed as "stgm_pc|{org}|{user_id}").
  //
  // Must be unique and stable within the org — the same user_id presented
  // via any PlatformClient in the same org resolves to the same identity.
  // Changing this value for the same user creates a new identity account.
  string user_id = 3 [(buf.validate.field).string.min_len = 1];

  // User's email address. Used for profile enrichment when JIT-provisioning
  // an identity account. Updated on each token mint if the account exists.
  string user_email = 4;

  // User's display name. Used for profile enrichment when JIT-provisioning
  // an identity account. Updated on each token mint if the account exists.
  string user_name = 5;

  // Optional confirmation of the organization the token is scoped to.
  // The minted token is ALWAYS scoped to the PlatformClient's owning
  // organization (metadata.org) — identity resolution and the optional
  // auto-grant are keyed on it, so cross-organization minting is not
  // supported. When set, this value must equal that owning organization;
  // any other value is rejected INVALID_ARGUMENT before the user is
  // resolved or provisioned. When empty, the owning organization applies.
  string org_id = 6;
}

// MintUserTokenResponse contains the Stigmer-signed JWT and its metadata.
message MintUserTokenResponse {
  // Stigmer-signed JWT for authenticating browser-based API calls.
  // Pass this to the React SDK's StigmerProvider via getAccessToken.
  string access_token = 1;

  // Token type. Always "Bearer".
  string token_type = 2;

  // Token lifetime in seconds from the time of issuance.
  int32 expires_in = 3;
}

// MintGuestTokenRequest identifies a shared agent and optional visitor cookie id.
message MintGuestTokenRequest {
  // Organization slug from the share URL (required).
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // Share slug from the share URL (required).
  string slug = 2 [(buf.validate.field).string.min_len = 1];

  // Per-browser visitor cookie id from a prior mint (optional).
  //
  // When empty, the server generates a high-entropy id and returns it so the
  // hosted page can persist it in an httpOnly cookie. When supplied, it must
  // be the value previously returned by this RPC for the same visitor.
  string guest_cookie_id = 3;

  // Web origin of the page embedding the shared agent (optional).
  //
  // Set by the hosted chat page when it runs inside an iframe (the embedding
  // page's origin, e.g. "https://docs.example.com") and by direct SDK embeds
  // (their own page origin). Leave empty on the unframed hosted page. The
  // literal value "null" reports a framed page whose parent origin could not
  // be determined (opaque origin).
  //
  // @internal
  // Validated at mint against the share's spec.allowed_origins: empty list
  // admits any origin; a non-empty list refuses PERMISSION_DENIED for
  // unlisted origins and for "null". An empty field always passes (the
  // anyone-with-link hosted page). The validated value is stamped into the
  // guest JWT as the embed_origin claim and re-validated against the live
  // list by the guest create-time gate. Self-reported by design: the widget
  // code inside the iframe derives it from browser-authentic sources the
  // embedder cannot alter; non-browser callers gain nothing by omitting it
  // since the hosted link is anyone-with-link (decision 001) — rate limits
  // and the billing gate remain the API guards.
  string embed_origin = 4 [(buf.validate.field).cel = {
    id: "embed_origin.format"
    message: "embed_origin must be empty, \"null\", or an exact web origin like https://example.com (no path, query, or trailing slash)"
    expression: "this == '' || this == 'null' || this.matches('^https?://[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\\\\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*(:[0-9]{1,5})?$')"
  }];

  // Link token from the share URL's `?k=` parameter (optional).
  //
  // Required when the share link has been locked with rotateShareLink;
  // ignored for plain share links.
  //
  // @internal
  // Validated at mint against the share's live status.share_link_token
  // (mismatch or absence answers the same NOT_FOUND as a disabled share,
  // so a killed link is indistinguishable from a nonexistent one). The
  // validated value is stamped into the guest JWT as the link_token claim
  // and re-validated against the live value by the guest create-time gate
  // on every session/execution create — rotation therefore revokes live
  // guest tokens on their next message, exactly like disabling the share.
  string link_token = 5 [(buf.validate.field).string.max_len = 128];
}

// MintGuestTokenResponse contains the guest JWT and the visitor cookie id.
message MintGuestTokenResponse {
  // Stigmer-signed JWT for authenticating shared-agent chat API calls.
  string access_token = 1;

  // Token type. Always "Bearer".
  string token_type = 2;

  // Token lifetime in seconds from the time of issuance.
  int32 expires_in = 3;

  // Visitor cookie id to persist client-side (httpOnly cookie in item 3).
  //
  // Echoes guest_cookie_id from the request when provided; otherwise a newly
  // generated high-entropy value.
  string guest_cookie_id = 4;
}
