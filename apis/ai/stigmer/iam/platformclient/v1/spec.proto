syntax = "proto3";

package ai.stigmer.iam.platformclient.v1;

import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/iam/v1/enum.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// PlatformClientSpec defines the configuration for a platform client credential.
//
// A PlatformClient holds an OAuth2 client credential pair (client_id + client_secret)
// where Stigmer acts as the authorization server. Platform builders use these
// credentials from their backend to mint user-scoped JWTs via the mintUserToken RPC,
// enabling their users to interact with Stigmer resources through the React SDK
// without requiring OIDC federation setup.
//
// This is the inbound auth counterpart to OAuthApp (outbound auth):
// - OAuthApp: Stigmer authenticates with external vendors on behalf of users.
// - PlatformClient: Platform builders authenticate with Stigmer on behalf of their users.
//
// Credential lifecycle:
// - client_id is generated on creation and is permanent (survives secret rotation).
// - client_secret is generated on creation, returned once, and only the hash is stored.
// - Secret rotation generates a new client_secret and invalidates the old one immediately.
//
// Identity resolution is org-scoped: the same user_id presented via any
// PlatformClient owned by the same organization resolves to a single
// IdentityAccount (keyed as "stgm_pc|{org}|{external_user_id}"). This means
// a customer with multiple PlatformClients (e.g., dashboard, mobile, admin)
// sees one Stigmer identity per end user, with one set of FGA grants.
//
// Every user token a PlatformClient mints is bound to the client's owning
// organization: it works there and nowhere else, whatever roles the user
// holds in other organizations.
//
// Two settings control what happens when mintUserToken meets a user:
//
//   1. create_accounts_on_sign_in: whether Stigmer creates the user's identity
//      account on first encounter. When false (the default), the platform
//      creates identity accounts before minting; mintUserToken fails if the
//      user does not exist.
//
//   2. sign_in_role: the role a newly created account receives on the owning
//      organization. Unspecified means none: the platform grants roles itself
//      through IAM policies.
message PlatformClientSpec {
  option (buf.validate.message).cel = {
    id: "platform_client.sign_in_role_requires_account_creation"
    message: "sign_in_role requires create_accounts_on_sign_in: only an account the client creates receives the role"
    expression: "this.sign_in_role == 0 || this.create_accounts_on_sign_in"
  };
  option (buf.validate.message).cel = {
    id: "platform_client.sign_in_role_not_owner"
    message: "sign_in_role cannot be owner; organization ownership must be assigned explicitly"
    expression: "this.sign_in_role != 1"
  };

  // OAuth client identifier.
  // Generated on creation with the prefix "stgm_cid_" followed by 43 random
  // URL-safe characters. Permanent across secret rotations — safe for logs,
  // configuration files, and client-side code.
  string client_id = 1 [(ai.stigmer.commons.apiresource.computed) = true];

  // SHA-256 hash of the raw client secret.
  // The raw secret is returned only in the create and rotateSecret responses
  // and is never stored or retrievable. Authentication compares the hash of
  // the presented secret against this value.
  string client_secret_hash = 2 [(ai.stigmer.commons.apiresource.computed) = true];

  // Short fingerprint of the client secret for display purposes (last 6 characters).
  // Allows users to identify which secret is active without exposing the full value.
  string secret_fingerprint = 3 [(ai.stigmer.commons.apiresource.computed) = true];

  // Expiration time for the client secret. Ignored when never_expires is true.
  google.protobuf.Timestamp expires_at = 4;

  // When true, the client secret never expires regardless of expires_at.
  bool never_expires = 5;

  // Replaced by create_accounts_on_sign_in and sign_in_role (fields 11 and
  // 12), the names identity providers use for the same two settings.
  reserved 6, 7, 8;
  reserved "auto_provision_accounts", "auto_grant_on_org", "auto_grant_role";

  // Web origins allowed for browser-based requests using tokens minted by
  // this PlatformClient.
  //
  // Enforced on every API request bearing a user token minted by this
  // client (never on mintUserToken itself — minting is server-to-server and
  // carries no browser Origin):
  //   - Empty list: origin validation is not enforced (open mode — suitable
  //     for development or when the platform controls all access points).
  //   - Non-empty list: the request's Origin header must match an entry
  //     (case-insensitive, per RFC 6454 origin comparison). Unlisted
  //     origins — including the opaque-origin serialization "null" — are
  //     refused PERMISSION_DENIED.
  //   - Requests without an Origin header always pass: only browsers send
  //     Origin, and only browsers guarantee it is not forgeable by page
  //     script. This is a browser-context, CORS-class defense-in-depth
  //     control against a leaked token being replayed from another site's
  //     browser context; the client_secret remains the primary control,
  //     and non-browser callers are not constrained by it.
  //
  // Edits apply to the next request: the client is read on every request
  // that bears one of its tokens.
  repeated string allowed_origins = 9;

  // Environments whose values are delivered to every agent run a
  // user signed in through this PlatformClient creates. This is how an
  // embedded assistant reaches secret-gated MCP servers: the client — the
  // connection resource — carries the credentials (for example a shared
  // API secret), and minted-user runs receive its values at
  // runtime, at the lowest priority, so the request's runtime values win on
  // a key conflict. The agent stays untouched.
  //
  // @internal
  // The fifth application of the connection-resource credential mechanism
  // (AgentShare, AgentChannel, Schedule, agent_call — stigmer/stigmer#381),
  // restored by stigmer/stigmer#1256: the execution-context builder
  // (domain/agentrun/create-execution-context-step.ts) prepends it
  // below every other layer for a run whose audit created_by names
  // this client (ApiResourceAuditActor.platform_client_id), on create and
  // on recover alike. The references follow the one write-time reference
  // rule (pipeline/steps/references.ts): same-organization only, and an
  // environment's own visibility is not consulted, because the server
  // resolves it on the run's behalf. A run in an organization other
  // than the client's receives nothing. A referenced environment that no
  // longer exists fails the run's create, as a Schedule's or an
  // agent_call task's does. Edits apply to the next run: the client
  // is read, not cached.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference environment_refs = 10 [
    (ai.stigmer.commons.apiresource.reference_kind) = environment,
    (buf.validate.field).repeated.items.cel = {
      id: "environment_refs.kind"
      message: "environment_refs must reference resources with kind=environment"
      expression: "this.kind == 53"
    }
  ];

  // Whether mintUserToken creates an identity account for a user_id that has
  // none yet.
  //
  // When false (the default), the platform creates identity accounts before
  // minting tokens, and mintUserToken returns FAILED_PRECONDITION for a user
  // that does not exist. When true, Stigmer creates the account on first
  // encounter from the user_email and user_name in the mintUserToken request.
  bool create_accounts_on_sign_in = 11;

  // The role an account mintUserToken creates receives on the client's owning
  // organization.
  //
  // A client's accounts belong to its owning organization alone, so an
  // account's creation is its first sign-in there: the role is granted once,
  // when the account is created. Accounts that already exist keep the roles
  // they hold, and changing this setting later does not reach them.
  // Unspecified (iam_role_unspecified) grants nothing. Requires
  // create_accounts_on_sign_in. The owner role is refused: ownership is
  // assigned explicitly.
  ai.stigmer.iam.v1.IamRole sign_in_role = 12;
}
