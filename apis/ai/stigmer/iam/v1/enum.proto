syntax = "proto3";

package ai.stigmer.iam.v1;

// IamPermission defines the permissions checked by the authorization
// interceptor before an RPC handler executes.
//
// Each value maps to an FGA permission name (a computed relation derived
// from roles). Permissions are never directly assigned to principals —
// they are granted implicitly through role assignments.
//
// For assignable roles, see IamRole below.
// For structural FGA relations (organization, session, agent, etc.),
// those are internal wiring and not represented in this enum.
enum IamPermission {
  unspecified = 0;

  // Standard CRUD permissions.
  can_view = 1;
  can_edit = 2;
  can_delete = 3;

  // Access management permissions.
  can_grant_access = 4;
  can_view_access = 5;

  // Organization-level create permissions.
  can_create_agent = 6;
  can_create_workflow = 7;
  can_create_session = 8;
  can_create_skill = 9;
  can_create_project = 10;
  can_create_idp = 11;
  can_create_environment = 12;
  can_create_identity_account = 21;
  can_create_oauth_app = 23;
  can_create_platform_client = 24;

  // Resource-level create permissions.
  can_create_execution_in = 13;
  can_create_instance = 14;

  // Execution permission.
  can_execute = 15;

  // Secret access permission.
  can_read_secrets = 16;

  // Platform-level permissions.
  can_bootstrap_iam = 17;
  can_manage_identity_accounts = 18;

  // Back-office access permission.
  login_to_back_office = 20;

  // MCP server connect permission.
  can_connect = 22;

  // Organization-level runner create permission.
  can_create_runner = 25;

  // Deprecated: session deletion is authorized via can_delete on the
  // session itself (owner-only). This platform-level permission is no
  // longer referenced by any RPC or FGA relation; the value is retained
  // because enum value removal is a breaking change.
  can_delete_session = 26 [deprecated = true];

  // Billing permissions (org-scoped).
  can_view_billing = 27;
  can_manage_billing = 28;

  // Platform-level permission to execute internal billing operations
  // (authorize, record, finalize). Gated to operator (machine account).
  can_execute_billing_ops = 29;

  // Organization-level permission to create agent shares billed to the
  // organization.
  //
  // Checked only for CROSS-ORG shares (a share of another org's
  // marketplace-public agent — decision 013): a public share spends the
  // sharing org's credits on the open internet, an admin-level act.
  // Same-org shares keep their Phase A bar (can_edit on the agent), which
  // already implies membership in the agent's org.
  can_create_agent_share = 30;

  // Organization-level permission to register channel apps (customer-owned
  // messaging-platform apps holding webhook and OAuth credentials).
  // Admin-gated like can_create_oauth_app.
  can_create_channel_app = 31;

  // Platform-level permission to view pricing governance and decide
  // pricing-override sign-offs from the pricing feedback loop. A human
  // operator action, kept distinct from can_execute_billing_ops (the
  // machine account's internal billing pipeline).
  can_manage_model_pricing = 32;

  // Values 33 and 34 held can_use_records / can_create_datastore until
  // the Datastore domain was removed platform-wide. Reserved so the
  // numbers are never reused for different permissions.
  reserved 33, 34;
  reserved "can_use_records", "can_create_datastore";

  // Platform-level permission to manage Cursor accounts: the managed
  // Cursor teams (admin keys, member execution keys, org assignments)
  // that back the cursor harness. A human operator action, gated to
  // platform operators like can_manage_model_pricing — key material and
  // per-member spend are platform-internal, never org-visible.
  can_manage_cursor_accounts = 35;

  // Resource-level permission to participate in an agent channel's
  // conversations: reply to customers as the business, take over and
  // hand back the control token, and clear the attention flag.
  //
  // @internal
  // channel-conversations DD-010: computed from the participant role on
  // agent_channel. Deliberately distinct from can_edit — "may talk to
  // this channel's customers" and "may configure this channel" are
  // different powers, and the ISC pilot's trainers hold only the first.
  can_participate = 36;

  // Platform-level permission to introduce or change labels in the
  // reserved stigmer.ai/* key namespace through client-facing write
  // boundaries. Gated to platform operators (the seeding machine
  // account): reserved labels carry platform semantics — most
  // critically stigmer.ai/default-agent, which selects the platform
  // default agent served to every organization — so ordinary requests
  // may echo or remove them but never write them (cloud#320).
  can_write_reserved_labels = 37;

  // Platform-level permission to view platform provider standing: the
  // canary-probe verdicts (health, billing/auth rejections, latency) for
  // the platform's own LLM provider accounts. Read-only and gated to
  // platform operators — provider account health is platform-internal,
  // never org-visible. Deliberately distinct from the manage-class
  // platform permissions: the standing console only observes (cloud#447).
  can_view_provider_standing = 38;
}

// IamRole defines the roles that can be assigned to principals on resources
// via IAM policies.
//
// Roles are human-assigned and represent a principal's relationship to a
// resource. They are distinct from permissions (which are computed from roles
// and checked by the authorization interceptor) and structural relations
// (which are internal FGA wiring like organization or session links).
//
// Each ApiResourceKind declares which of these roles are grantable via
// the grantable_roles field in its AuthorizationConfig.
enum IamRole {
  iam_role_unspecified = 0;

  // Full control of the resource. Typically assigned to the creator.
  owner = 1;

  // Administrative access. Grants most permissions except ownership transfer.
  admin = 2;

  // Membership-level access. Grants read and limited write permissions.
  member = 3;

  // Read-only access to the resource.
  viewer = 4;

  // Conversation participant on an agent channel: may read the channel's
  // conversations and speak to its customers as the business (reply, take
  // over, hand back, clear attention). Not a channel configurator.
  //
  // @internal
  // channel-conversations DD-010. Grantable only on agent_channel — the
  // second kind-scoped role after organization's admin/member; the
  // grantable_roles subsetting is the mechanism, not a new one. Team
  // usersets ([team#member]) are the named widening the day a team FGA
  // type lands.
  participant = 5;
}
