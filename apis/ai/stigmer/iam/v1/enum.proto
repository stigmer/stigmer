syntax = "proto3";

package ai.stigmer.iam.v1;

import "google/protobuf/descriptor.proto";

// IamPermission defines the permissions checked by the authorization
// interceptor before an RPC handler executes.
//
// Each value maps to an FGA permission name (a computed relation derived
// from roles). Permissions are never directly assigned to principals —
// they are granted implicitly through role assignments.
//
// For assignable roles, see IamRole below.
// For structural FGA relations (organization, session, agent, etc.),
// those are internal wiring and not represented in this enum.
enum IamPermission {
  unspecified = 0;

  // Standard CRUD permissions.
  can_view = 1;
  can_edit = 2;
  can_delete = 3;

  // Access management permissions.
  can_grant_access = 4;
  can_view_access = 5;

  // Whether the caller may grant a role that acts with, or sees what was
  // done under, the resource holder's authority: the owner role on an
  // organization (only its owners hold it), or Participant or Viewer on a
  // routine (only the routine's owner holds it, because a Participant's
  // fire acts as the owner and a Viewer reads the runs that acted as them).
  //
  // @internal
  // The relation `can_assign_roles`. The Grant lanes and the invitation lane
  // ask it on top of can_grant_access whenever a change touches the
  // organization's owner role, and when a grant gives Participant or Viewer
  // on a routine. Every caller that reaches them already holds
  // can_grant_access, so this one question is the whole of "no role above
  // your own". Taking a routine's Participant or Viewer away asks only
  // can_grant_access: removing access only shrinks it.
  can_assign_roles = 47;

  // Whether the caller may change who reaches the resource: its visibility,
  // who observes its runs, or a channel it answers on (a chat link among
  // them).
  //
  // @internal
  // Its own permission, apart from can_grant_access, because the self-check
  // answers can_grant_access false wherever the edition grants no roles on
  // the kind (the console hides grant controls there), while every edition
  // lets an owner change a resource's audience. The owner's in the model on
  // every kind that asks it; an editor never holds it.
  can_manage_audience = 48;

  // Organization-level create permissions.
  can_create_agent = 6;
  can_create_session = 8;
  can_create_skill = 9;
  can_create_federation_issuer = 11;
  can_create_identity_account = 21;
  can_create_oauth_app = 23;

  // Resource-level create permissions.
  can_create_run_in = 13;

  // Execution permission.
  can_execute = 15;

  // Platform-level permissions.
  can_bootstrap_iam = 17;

  // Billing permissions (org-scoped).
  can_view_billing = 27;
  can_manage_billing = 28;

  // Platform-level permission to execute internal billing operations
  // (recording a metered LLM call). Gated to operator (machine account).
  can_execute_billing_ops = 29;

  // Organization-level permission to create channels: a chat link, a Slack
  // workspace connection or a WhatsApp number for one of the organization's
  // agents.
  //
  // @internal
  // Asked on every channel create beside can_manage_audience on the
  // channel's agent: a channel spends on the organization's own provider
  // keys for outside traffic (a public chat link opens it to the internet),
  // an admin-level act, whichever agent it serves, so owning an agent
  // (which any member may, while the organization lets members create
  // agents) is not enough. A channel's agent lives in the channel's own
  // organization, so the two questions are always one organization's.
  can_create_channel = 54;

  // Organization-level permission to register channel apps (customer-owned
  // messaging-platform apps holding webhook and OAuth credentials).
  // Admin-gated like can_create_oauth_app.
  can_create_channel_app = 31;

  // Platform-level permission to edit and read the model catalog: the
  // operator-maintained model pricing baselines every run's model list and
  // price reads. A human operator action, kept distinct from
  // can_execute_billing_ops (the machine account's internal billing
  // pipeline).
  can_manage_model_pricing = 32;

  // Resource-level permission to participate in a channel's
  // conversations: reply to customers as the business, take over and
  // hand back the control token, and clear the attention flag.
  //
  // @internal
  // Computed from the participant role on channel. Deliberately
  // distinct from can_edit — "may talk to this channel's customers" and
  // "may configure this channel" are different powers, and a support
  // team may hold only the first.
  can_participate = 36;

  // Platform-level permission to introduce or change labels in the
  // reserved stigmer.ai/* key namespace through client-facing write
  // boundaries. Gated to platform operators (the seeding machine
  // account): reserved labels carry platform semantics the server acts
  // on (plugin membership and lineage, the stamps a run's vaults are found by) — so ordinary requests may echo or
  // remove them but never write them.
  can_write_reserved_labels = 37;

  // Organization-level permission to install a plugin: push an Agent
  // Plugins archive into the organization. Who may bring a package into an
  // organization is a policy an administrator sets on its own.
  can_create_plugin = 40;

  // Platform-level permission to create and retire Plans, the catalog the
  // cloud sells subscriptions and licenses against. A human operator
  // action on the static platform target, kept distinct from
  // can_execute_billing_ops (the machine account's pipeline) the way
  // can_manage_model_pricing is, so an audit line names what happened.
  can_manage_plans = 41;

  // Platform-level permission to issue and read Licenses: the signed
  // grants of entitlements to self-hosting customers. Every License RPC
  // checks it on the static platform target. Distinct from
  // can_manage_plans because issuing a license to a named customer is a
  // different act, and a different audit line, from editing the catalog.
  can_issue_license = 42;

  // Organization-level permission to create a team in the organization.
  //
  // @internal
  // Admin-level: a team is a group access is shared with, and who may define
  // one is the organization's administrators' decision, like who may grant
  // access. The Team kind is served by the Enterprise and Cloud editions.
  can_create_team = 45;

  // Organization-level permission to create, find and list the
  // organization's child organizations: OrganizationCommandController.create
  // with spec.parent_org naming it, getByExternalId and listChildOrgs.
  //
  // @internal
  // Held by the organization's admins. Child organizations are one level
  // deep, so a child's admins hold it on a child but can never use it: a
  // child cannot have children.
  can_manage_child_orgs = 49;

  // Organization-level permission to read the organization itself (its
  // name, slug, description and preferences): OrganizationQueryController.get.
  //
  // @internal
  // Held by everyone who holds can_view (every role in the organization),
  // the admins of its parent organization included: they are admins in
  // every child.
  can_view_settings = 50;

  // Whether the caller may save logins and secrets in their own My vault in
  // an organization: its members.
  //
  // @internal
  // Asked by the vault entry RPCs when the first write names My vault, and
  // by the GitHub sign-in, which saves the github.com login there. Guests
  // hold none.
  can_create_vault = 51;

  // Whether the caller may create a shared vault in an organization: its
  // admins.
  can_create_shared_vault = 52;

  // Whether a person's runs may use a vault's logins and secrets.
  //
  // @internal
  // Asked at save, when a session, routine, channel, agent or
  // organization's embedding settings name a vault, and again when each run
  // starts: of the run's person, or of the account that attached the vault
  // when the run has no person.
  can_use = 53;

  // Whether the caller may create, list and revoke a service account's API
  // keys: its organization's admins.
  //
  // @internal
  // Asked on createForServiceAccount; an API key's view and delete reach the
  // admins through it. A person's account has no organization link, so
  // nobody holds it over a person's keys.
  can_manage_keys = 55;

  // Whether the caller may read an organization's access history: its
  // owners and administrators, a parent organization's administrators
  // included, since they are administrators in every child.
  can_view_access_history = 56;

  // Whether the caller may mint a user token for an organization:
  // TokenService.mintUserToken with org naming it. Its administrators, a
  // parent organization's administrators included, since they are
  // administrators in every child.
  //
  // @internal
  // Asked of a service account's key only; the mint refuses every other
  // caller. Minting can create the person's account and grant them the
  // organization's embedding sign-in role, an administrator's act, so no
  // key mints with more than its account holds.
  can_mint_user_tokens = 57;

  // Organization-level permission to create an eval: push an evals/ folder
  // under a slug no eval of the organization holds. Whoever may create
  // agents may create their tests.
  //
  // @internal
  // A push onto an existing eval asks can_edit on that eval instead, as
  // agent apply does; createArtifactUploadUrl asks what the push will.
  can_create_eval = 58;

  // Whether the caller may fire a routine: start a run of it now, with an
  // optional note. Its owner and the Participants the owner granted.
  //
  // @internal
  // Not held by organization admins, who manage a routine (see it, switch
  // it off, rename or delete it) but do not act as its owner: the run acts
  // as the routine's owner, and the fire's text reaches it.
  can_fire = 59;

  // Whether the caller may create an Environment in an organization: the
  // packages and network access a conversation's sandbox gets. The
  // organization's admins.
  can_create_environment = 60;

  // Whether the caller may upload a File of their own in an organization:
  // its members and guests, the people who may start a conversation.
  //
  // @internal
  // A File uploaded into a conversation asks can_create_run_in on the
  // conversation instead.
  can_create_file = 61;
}

// Display metadata for an IamRole value: the one place a role's name lives,
// read by the server's access lists and generated into the SDKs.
extend google.protobuf.EnumValueOptions {
  IamRoleMeta role_meta = 91201;
}

// Metadata for one IamRole value.
message IamRoleMeta {
  // The role's name as people read it ("Admin", "Can use").
  string display_name = 1;
  // What the role means when no resource kind is known. A picker shows the
  // kind's own sentence instead (AuthorizationConfig.role_descriptions).
  string description = 2;
}

// IamRole defines the roles that can be assigned to principals on resources
// via Grants.
//
// Roles are human-assigned and represent a principal's relationship to a
// resource. They are distinct from permissions (which are computed from roles
// and checked by the authorization interceptor) and structural relations
// (which are internal FGA wiring like organization or session links).
//
// Each ApiResourceKind declares which of these roles are grantable via
// the grantable_roles field in its AuthorizationConfig, and what each one
// means there in role_descriptions.
enum IamRole {
  iam_role_unspecified = 0;

  // Full control of the resource, including deleting it and deciding who
  // has access. Typically assigned to the creator.
  owner = 1 [(role_meta) = {
    display_name: "Owner"
    description: "Everything, including deleting it and deciding who has access"
  }];

  // Administers an organization: its people, settings and resources, short
  // of its owners, its deletion and its private conversations.
  admin = 2 [(role_meta) = {
    display_name: "Admin"
    description: "Manage the organization's people, settings and resources"
  }];

  // Belongs to an organization or a team. In an organization, a member
  // starts conversations with what is shared with them and creates agents
  // while the organization allows it; in a team, a member holds what the
  // team is given.
  member = 3 [(role_meta) = {
    display_name: "Member"
    description: "Belongs to it and holds what it is given"
  }];

  // Sees the resource and changes nothing. What seeing allows is the kind's
  // own (role_descriptions): an agent's viewer runs it in the conversations
  // they may start, a conversation's viewer sends no message, and an
  // organization's viewer starts no conversation, since starting one needs
  // the organization's member role or higher.
  viewer = 4 [(role_meta) = {
    display_name: "Viewer"
    description: "Read it; cannot change it"
  }];

  // A person who takes part in a conversation: reads it and sends messages.
  // On a conversation (session), a participant's messages run in the
  // conversation's own workspace, as its creator, using only the vaults the
  // conversation names; stopping and approving stay with its owners. On a
  // channel, a participant reads the channel's conversations and
  // speaks to its customers as the business (reply, take over, hand back,
  // clear attention), and is not a channel configurator.
  //
  // @internal
  // Grantable on session and channel only, through the
  // grantable_roles subsetting. A team may hold it on channel
  // (team_grantable_roles); a conversation is granted to people only.
  participant = 5 [(role_meta) = {
    display_name: "Participant"
    description: "Read the conversations and send messages"
  }];

  // Editor of a blueprint (an agent): may change
  // its definition and do whatever a viewer can, and may not delete it,
  // change its visibility, give it a chat link or another channel, or decide
  // who else has access.
  //
  // @internal
  // Implies viewer in the model (`viewer: ... or editor`), and is bounded by
  // the organization like every direct grant. Granted per resource, so only
  // an edition that widens the policy grant scope beyond the organization
  // grants it; the open-source server does not.
  editor = 6 [(role_meta) = {
    display_name: "Editor"
    description: "Change and use it; cannot delete it or decide who has access"
  }];

  // May use a shared vault: the runs of a person who holds it use the
  // vault's logins and secrets. Shown as "Can use".
  //
  // @internal
  // Grantable only on vault, to people and Teams, the participant
  // precedent for a kind-scoped role. Using a vault hands its secrets to a
  // run with a shell, which viewer would understate.
  user = 7 [(role_meta) = {
    display_name: "Can use"
    description: "Use this vault's logins and secrets in their runs"
  }];
}
