syntax = "proto3";

package ai.stigmer.agentic.agent.v1;

import "ai/stigmer/agentic/agent/v1/api.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";

// AgentId wraps an agent identifier.
message AgentId {
  string value = 1 [(buf.validate.field).required = true];
}

// The changes an update makes to an agent: the fields update_mask names,
// taken from resource.
message UpdateAgentInput {
  option (buf.validate.message).cel = {
    id: "update_names_its_target"
    message: "resource.metadata.id is required: an update names the agent by its id"
    expression: "has(this.resource) && has(this.resource.metadata) && this.resource.metadata.id != ''"
  };

  // The agent carrying the new values, named by metadata.id. Only the fields
  // update_mask names are read, so the others may be left empty; the result
  // is validated as a whole.
  Agent resource = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The paths the update changes, as proto field names (spec.instructions,
  // metadata.labels). A list or map at a named path is replaced whole; "*"
  // names every path an update may change.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}

// Input for listing an organization's agents, newest first.
message ListAgentsRequest {
  // Organization whose agents to list, by id or slug.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];

  // Only resources carrying every label given, each matched exactly (AND).
  // A selective filter may answer short pages, even empty ones, that still
  // carry a token.
  map<string, string> labels = 4;
}

// One page of an organization's agents.
message AgentList {
  // The agents in this page, newest first.
  repeated Agent entries = 1;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 2;
}

// Input for asking which of an agent's keys and sign-ins the organization's
// embedding settings fill for the calling app user.
message CheckEmbeddingCoverageInput {
  // The agent a conversation would run, by id or by org and slug.
  ai.stigmer.commons.apiresource.ApiResourceReference agent = 1 [
    (buf.validate.field).required = true,
    (ai.stigmer.commons.apiresource.reference_kind) = agent
  ];

  // The organization the conversation would run in, by id or slug.
  string org = 2 [(buf.validate.field).string.min_len = 1];
}

// What the organization's embedding settings fill for a run of an agent by
// the calling app user: names only, never where they are kept or their
// values.
message EmbeddingCoverage {
  // The keys a run of the agent reads that a vault of the embedding
  // settings holds by name.
  repeated string keys = 1;

  // The tool addresses whose sign-in a vault of the embedding settings
  // holds, so the app user need not sign in to them.
  repeated string sign_in_addresses = 2;
}
