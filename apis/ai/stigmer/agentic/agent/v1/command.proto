syntax = "proto3";

package ai.stigmer.agentic.agent.v1;

import "ai/stigmer/agentic/agent/v1/api.proto";
import "ai/stigmer/agentic/agent/v1/io.proto";
import "ai/stigmer/agentic/agent/v1/version.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// AgentCommandController handles write operations for AI agents.
service AgentCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = agent;

  // Create or update an agent.
  //
  // A request that carries metadata.id of an agent in its organization updates
  // that agent, and its slug changes only through rename. A slug the agent was
  // renamed away from, named without the agent's id, is refused with
  // FAILED_PRECONDITION carrying a google.rpc.ErrorInfo detail (domain
  // "stigmer.ai"), because a write by a name that stops resolving after 30 days
  // would later make a second agent:
  //
  //   - SLUG_RENAMED — the slug was renamed: it still leads to the same agent
  //     for reading, but a write names its current slug. Metadata: slug (the
  //     one the request named).
  //
  // @internal
  // The authorization and state-operation are determined depending on whether the agent
  // is going to be created or updated which is determined as part of the request execution.
  rpc apply(Agent) returns (Agent);

  // Create an agent.
  //
  // A slug another agent of the organization holds is refused with
  // ALREADY_EXISTS. A slug another agent was renamed away from, which still
  // leads to it for 30 days, is refused with ALREADY_EXISTS carrying a
  // google.rpc.ErrorInfo detail (domain "stigmer.ai"):
  //
  //   - SLUG_RESERVED — another agent held the slug until a recent rename, and
  //     it still leads there. Metadata: slug.
  //
  // @internal
  // Authorization:
  // - Organization-scoped agents: Caller must have can_create_agent permission in the organization
  // - Platform-scoped agents: Caller must be a platform operator (handled automatically by common auth step)
  rpc create(Agent) returns (Agent) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_agent;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to create agent in this organization";
  }

  // Update an agent: the fields update_mask names change, every other
  // field keeps its stored value.
  //
  // resource.metadata.id names the agent; apply finds one by slug. The slug
  // changes only through rename, and a mask naming a field another door
  // owns, or a path the agent does not have, is refused with
  // INVALID_ARGUMENT naming the path.
  //
  // An update is refused with ABORTED carrying a google.rpc.ErrorInfo detail
  // (domain "stigmer.ai"):
  //
  //   - ETAG_MISMATCH — resource.metadata.etag is set and the agent changed
  //     since that etag was read: read it again and make the change again.
  //     No metadata.
  //   - WRITE_CONFLICT — the agent kept changing while the update was
  //     being saved: try again. No metadata.
  rpc update(UpdateAgentInput) returns (Agent) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "resource.metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update agent";
  }

  // Update the visibility of an existing agent.
  //
  // This is a targeted metadata update — it only modifies metadata.visibility,
  // leaving spec, status, and other metadata fields untouched. Use this to
  // widen or narrow who can read the agent without sending the entire agent
  // resource (avoiding read-modify-write races).
  //
  // Raising the level is refused while a skill, plugin or agent the
  // agent references is less visible than the requested level: what a
  // person can run they must also be able to read.
  //
  // @internal
  // Authorization: can_manage_audience on the agent for every transition.
  // Visibility decides who reaches the resource, so it is the owner's decision
  // and not an edit: an editor may change the definition but not its audience.
  // The level itself is checked against the kind's VisibilityConfig
  // (visibility_public is refused for every kind); the reference floor is a
  // pipeline step on this chain, not an annotation.
  rpc updateVisibility(ai.stigmer.commons.apiresource.UpdateVisibilityInput) returns (Agent) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_audience;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update agent visibility";
  }

  // Rename an agent: change its slug, the name people type.
  //
  // The agent keeps its id, so everything that names it keeps working, and
  // every answer names it by the new slug. The old slug keeps leading to the
  // agent for reading for 30 days, during which no other agent of the
  // organization can take it and this one can take it back; then it is
  // released. A write that names the old slug is refused with SLUG_RENAMED (see
  // apply). A slug another agent holds is refused with ALREADY_EXISTS, and one
  // another agent was recently renamed away from with SLUG_RESERVED (see
  // create).
  //
  // Its schedules, channels, conversations and the agents that hand work to it
  // name it by id; a parent agent's turns call it by its new slug.
  //
  // @internal
  // Authorization: Requires can_delete permission on the agent: whoever may
  // delete it may rename it.
  rpc rename(ai.stigmer.commons.apiresource.RenameInput) returns (Agent) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to rename agent";
  }

  // Delete an agent.
  //
  // Deletion also removes the agent's version history and every channel in
  // the agent's own organization that serves it (its chat links and its
  // Slack and WhatsApp connections, whose installs are torn down first), so
  // a later agent created at the same org/slug starts clean. A teardown
  // that fails refuses the delete and keeps the agent and that channel, so
  // a retry finishes it. Sessions on the agent are not deleted: their next
  // message fails, naming the agent. Nor is a chat link written in another
  // organization before sharing across organizations was retired; such a
  // link stops resolving instead.
  //
  // @internal
  // Cascade order is children-before-parent so a mid-failure retry
  // converges. Channels are found by spec.agent_ref's id through the
  // channel list index and scoped to the agent's own org: cascading
  // another org's channel would make delete a cross-principal destructive
  // action, and such a channel fails closed through the dangling-ref check
  // instead. A channel created while the agent is being deleted removes
  // itself after its write. Cloud additionally cleans each cascaded
  // child's FGA tuples.
  rpc delete(AgentId) returns (Agent) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete agent";
  }

  // Assign or move a tag to a specific agent version.
  //
  // Tags are human-readable pointers to immutable versions. Calling this
  // with an existing tag name moves it from the previous version to the
  // specified version. Common tags: "stable", "production", "v2.0".
  //
  // @internal
  // Authorization: Requires can_edit permission on the agent resource.
  // The handler validates that the version_hash exists in the agent's
  // version history before assigning the tag.
  rpc tagVersion(TagAgentVersionInput) returns (Agent) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "agent_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to tag agent version";
  }
}
