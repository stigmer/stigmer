syntax = "proto3";

package ai.stigmer.agentic.agent.v1;

import "ai/stigmer/agentic/agent/v1/api.proto";
import "ai/stigmer/agentic/agent/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// AgentCommandController handles write operations for AI agents.
service AgentCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = agent;

  // Create or update an agent.
  //
  // @internal
  // The authorization and state-operation are determined depending on whether the agent
  // is going to be created or updated which is determined as part of the request execution.
  rpc apply(Agent) returns (Agent);

  // Create an agent.
  //
  // @internal
  // Authorization:
  // - Organization-scoped agents: Caller must have can_create_agent permission in the organization
  // - Platform-scoped agents: Caller must be a platform operator (handled automatically by common auth step)
  rpc create(Agent) returns (Agent) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_agent;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to create agent in this organization";
  }

  // Update an existing agent.
  rpc update(Agent) returns (Agent) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update agent";
  }

  // Update the visibility of an existing agent.
  //
  // This is a targeted metadata update — it only modifies metadata.visibility,
  // leaving spec, status, and other metadata fields untouched. Use this to
  // widen or narrow who can read the agent without sending the entire agent
  // resource (avoiding read-modify-write races).
  //
  // Raising the level is refused while a skill, MCP server or agent the
  // agent references is less visible than the requested level: what a
  // person can run they must also be able to read.
  //
  // @internal
  // Authorization: can_edit on the agent for every transition. The level
  // itself is checked against the kind's VisibilityConfig (visibility_public
  // is refused for every kind); the reference floor is a pipeline step on
  // this chain, not an annotation.
  rpc updateVisibility(ai.stigmer.commons.apiresource.UpdateVisibilityInput) returns (Agent) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update agent visibility";
  }

  // Delete an agent.
  //
  // Deletion also removes the agent's system-managed default instance and
  // every AgentShare in the agent's own organization referencing it, so a
  // later agent created at the same org/slug starts clean. Personal
  // instances and sessions are not deleted, nor is a share written in
  // another organization before sharing across organizations was retired;
  // such a share stops resolving instead.
  //
  // @internal
  // Cascade order is children-before-parent so a mid-failure retry
  // converges. Shares are matched by spec.agent_ref (org + agent slug) and
  // scoped to the agent's own org — leaving same-org shares behind would
  // silently rebind a stale share (audience, link token, bound
  // credentials) to whatever agent is later created at that slug, while
  // cascading ANOTHER org's share would make delete a cross-principal
  // destructive action (decision 013). Cross-org shares instead fail
  // closed via the dangling-ref check and the status.agent_id pin; their
  // owning orgs clean up their own rows. Cloud additionally cleans each
  // cascaded child's FGA tuples.
  rpc delete(AgentId) returns (Agent) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete agent";
  }
}
