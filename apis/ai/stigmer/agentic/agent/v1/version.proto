syntax = "proto3";

package ai.stigmer.agentic.agent.v1;

import "ai/stigmer/agentic/agent/v1/spec.proto";
import "ai/stigmer/commons/apiresource/status.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Agent versions: the messages behind AgentQueryController.listVersions and
// getVersion and AgentCommandController.tagVersion.
//
// An agent's version is identified by the content hash of its stored spec
// (AgentStatus.version_hash). Every write that produces a spec the agent
// has never had archives a new immutable version; a write that reproduces
// an earlier spec points the agent back at that version; an unchanged write
// archives nothing. A tag is a mutable, single-holder name for one version,
// set at apply time (metadata.version.tag) or moved with tagVersion, the
// same model skills use.
//
// Every turn records the agent version it ran
// (RunStatus.agent_id and agent_version_hash) and runs that
// version's spec_snapshot, so getVersion answers what a past turn's agent
// was told.

// AgentVersionEntry is one historical version of an agent.
message AgentVersionEntry {
  // SHA-256 of the canonical JSON rendering of the version's AgentSpec: the
  // immutable version identifier.
  string version_hash = 1;

  // When this version was applied.
  google.protobuf.Timestamp applied_at = 2;

  // Who applied this version.
  ai.stigmer.commons.apiresource.ApiResourceAuditActor applied_by = 3;

  // The tag this version holds now, if any. A tag names at most one version,
  // so moving it to another version clears it here.
  // Examples: "stable", "v1.0", "production"
  string tag = 4;

  // Whether this is the agent's current version.
  bool is_current = 5;

  // Human-readable message describing what changed in this version, from
  // metadata.version.message at apply time. Analogous to a git commit
  // message.
  string message = 6;

  // The agent spec exactly as this version stored it: the instructions,
  // sub-agents, skill and plugin references, declared keys and vaults a
  // turn on this version runs with.
  AgentSpec spec_snapshot = 7;

  // Field 8 was a git provenance message in the unimplemented design of
  // this entry. No write path ever carried it (agents are applied, not
  // pushed from a directory), so it was removed before agent versions
  // shipped.
  reserved 8;
  reserved "git_provenance";
}

// ListAgentVersionsInput requests the version history for an agent.
//
// Returns every version, newest first. Used by the console, SDK and CLI to
// render version timelines.
message ListAgentVersionsInput {
  // Organization that owns the agent.
  string org = 1 [(buf.validate.field).required = true];

  // Agent slug (unique within the organization).
  string slug = 2 [(buf.validate.field).required = true];

  // Opaque token for offset pagination.
  // Empty string or omitted for the first page.
  string page_token = 3;

  // Maximum number of versions to return per page.
  // Server may return fewer. Default is 50, max is 100.
  int32 page_size = 4;
}

// ListAgentVersionsResponse contains a page of agent version history.
message ListAgentVersionsResponse {
  // Ordered list of versions (newest first).
  repeated AgentVersionEntry versions = 1;

  // Token for fetching the next page. Empty when no more pages exist.
  string next_page_token = 2;

  // Total number of versions across all pages.
  int32 total_count = 3;
}

// GetAgentVersionInput requests one version of an agent by its hash.
//
// Used by the runner and the server to run a turn on the version it
// recorded, and by clients to show what a past version said.
message GetAgentVersionInput {
  // ID of the agent resource.
  string agent_id = 1 [(buf.validate.field).required = true];

  // SHA-256 hash identifying the version to retrieve.
  string version_hash = 2 [(buf.validate.field).string.pattern = "^[a-f0-9]{64}$"];
}

// TagAgentVersionInput assigns or moves a tag to a specific agent version.
//
// Tags are mutable pointers: calling tagVersion with a tag another version
// holds moves it to the version named here.
message TagAgentVersionInput {
  // ID of the agent resource.
  string agent_id = 1 [(buf.validate.field).required = true];

  // SHA-256 hash of the version to tag.
  string version_hash = 2 [(buf.validate.field).string.pattern = "^[a-f0-9]{64}$"];

  // Tag to assign. Must be a non-empty alphanumeric string with dots,
  // hyphens, or underscores (the pattern skill tags use).
  string tag = 3 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[a-zA-Z0-9._-]+$"
  }];
}
