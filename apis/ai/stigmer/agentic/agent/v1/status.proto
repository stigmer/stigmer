syntax = "proto3";

package ai.stigmer.agentic.agent.v1;

import "ai/stigmer/commons/apiresource/status.proto";

// AgentStatus contains system-managed state for an agent.
message AgentStatus {
  // Standard audit information (created_at, updated_at, created_by, etc.)
  ai.stigmer.commons.apiresource.ApiResourceAudit audit = 99;

  // ID of the default agent instance.
  // Every agent has exactly one default instance that uses all agent defaults
  // and requires no additional configuration. Created automatically when the
  // agent is created.
  string default_instance_id = 1;

  // Field 2 held the rotatable share-link token until sharing was promoted
  // to the first-class AgentShare resource (decision 011); the token now
  // lives in AgentShareStatus.share_link_token.
  reserved 2;
  reserved "share_link_token";
}
