syntax = "proto3";

package ai.stigmer.agentic.agent.v1;

import "ai/stigmer/agentic/plugin/v1/status.proto";
import "ai/stigmer/commons/apiresource/status.proto";

// AgentStatus contains system-managed state for an agent.
message AgentStatus {
  // Standard audit information (created_at, updated_at, created_by, etc.)
  ai.stigmer.commons.apiresource.ApiResourceAudit audit = 99;

  // Content hash of the agent's current version: the SHA-256 of the
  // canonical JSON rendering of the stored AgentSpec (unset and default
  // fields omitted, object keys sorted at every depth, enums as numbers).
  //
  // Every write whose spec differs from every version the agent has had
  // records a new version under this hash; a write that reproduces an
  // earlier spec points back to that version, and an unchanged write
  // records none. The history is read through AgentQueryController's
  // listVersions and getVersion.
  //
  // Empty when the version could not be recorded (the write still
  // succeeds).
  string version_hash = 3;

  // Warnings the last save recorded: what the agent's skills carry that it
  // cannot use as configured, such as scripts an agent without a computer
  // cannot run. A save never fails over one.
  //
  // @internal
  // Computed at every save from the agent's spec and the file indexes of
  // the skills and plugins it names, after the computer refusals; status,
  // so it is outside the hashed spec and never moves version_hash. Cleared
  // for an agent with a computer.
  repeated AgentWarning warnings = 4;

  // How each of the agent's own MCP servers asked to be signed in to, as
  // its address answered when the agent was saved. A server listed here
  // with a sign-in is signed in to as a plugin's server is: a run needs the
  // login and is refused until there is one, and the chat offers Sign in.
  //
  // @internal
  // Written by RecordAgentServerSignIns at every save, outside the hashed
  // spec so it never moves version_hash: a server that is new, changed, or
  // has no answer recorded at its current address is asked once (the same
  // probe a plugin's install runs, domain/mcp/sign-in-probe.ts); every other
  // server carries its stored answer. Only an http server that says nothing
  // about authentication (no Authorization header, no ${VAR} in a header)
  // is asked. A server that did not answer is left out and asked again at
  // the next save. Readers match an answer to a server by name and url, so
  // an answer recorded at another address is ignored.
  repeated AgentServerSignIn server_sign_ins = 5;
}

// AgentServerSignIn is how one of an agent's own MCP servers answered when
// it was asked whether it wants a sign-in.
message AgentServerSignIn {
  // The server's name in the agent (AgentMcpServer.name).
  string name = 1;

  // The address the server was asked at (AgentMcpServer.url).
  string url = 2;

  // How a person signs in to the server; unset when the server asked for
  // no sign-in.
  ai.stigmer.agentic.plugin.v1.McpServerSignIn sign_in = 3;
}

// AgentWarning is one thing an agent's save noticed and did not refuse.
message AgentWarning {
  // Stable warning kind, e.g. "skill-scripts".
  string kind = 1;

  // The warning as one user-facing sentence.
  string message = 2;

  // The skill the warning names, as the agent's prompt names it: the
  // skill's slug, or "<plugin>:<skill>" for a plugin's skill.
  string skill = 3;
}
