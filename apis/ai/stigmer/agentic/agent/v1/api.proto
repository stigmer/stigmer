syntax = "proto3";

package ai.stigmer.agentic.agent.v1;

import "ai/stigmer/agentic/agent/v1/spec.proto";
import "ai/stigmer/agentic/agent/v1/status.proto";
import "ai/stigmer/commons/apiresource/metadata.proto";
import "buf/validate/validate.proto";

// Agent defines an AI assistant's identity, tools, skills, and delegation model.
//
// @internal
message Agent {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = 'agentic.stigmer.ai/v1'];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = 'Agent'];

  // Resource metadata including name, organization, visibility, and labels.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // Configurable properties: instructions, MCP servers, skills, and sub-agents.
  AgentSpec spec = 4;

  // System-managed state including audit trail and default instance ID.
  AgentStatus status = 5;
}
