syntax = "proto3";

package ai.stigmer.agentic.agent.v1;

import "ai/stigmer/agentic/plugin/v1/hooks.proto";
import "ai/stigmer/agentic/run/v1/invocation.proto";
import "ai/stigmer/agentic/session/v1/enum.proto";
import "ai/stigmer/agentic/vault/v1/declaration.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";

// AgentSpec defines the configurable properties of an agent.
//
// @internal
// This is the "Template" layer — declares capabilities and requirements.
// The overview.md file provides the SDK-facing description and example YAML.
message AgentSpec {
  // Human-readable description for UI and marketplace display.
  string description = 1;

  // Icon URL for marketplace and UI display.
  // Must be a publicly accessible URL to an image (SVG, PNG, or JPEG).
  string icon_url = 2;

  // System prompt defining the agent's behavior and personality.
  string instructions = 3 [(buf.validate.field).string.min_len = 10];

  // Field 4 named the MCP server resources this agent used until an MCP
  // server became configuration inside a plugin: an agent lists the plugins
  // it uses in plugins, and gets each plugin's servers with it.
  reserved 4;
  reserved "mcp_server_usages";

  // Skill resources providing additional knowledge to the agent.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference skill_refs = 5 [(ai.stigmer.commons.apiresource.reference_kind) = skill];

  // Field 6 held sub-agents written inside this agent, which narrowed its
  // tools, until a subagent became a saved agent this agent lists in
  // subagents.
  reserved 6;
  reserved "sub_agents";

  // Environment variable declarations for this agent.
  // Keys are variable names; values describe their metadata and optionality.
  // A secret is found by its name in a vault when a run starts; a plain
  // setting may carry its value in the declaration.
  map<string, ai.stigmer.agentic.vault.v1.EnvVarDeclaration> env = 7;

  // Field 8 held the embedded sharing configuration (AgentSharing) until
  // sharing was promoted to the first-class AgentShare resource
  // (ai.stigmer.agentic.agentshare.v1): sharing is channel
  // configuration with its own writer and lifecycle, so applying an agent
  // manifest can never touch a share again.
  reserved 8;
  reserved "sharing";

  // Field 9 held datastore_usages (repeated DatastoreUsage) until the
  // Datastore domain was removed platform-wide.
  reserved 9;
  reserved "datastore_usages";

  // Tools this agent may use; empty means every tool it has.
  //
  // Entries use Claude Code's names: a built-in such as Read, Grep, Bash,
  // Write, Edit, Glob, Agent or WebFetch; mcp__<server> for every tool of one
  // MCP server, mcp__<server>__<tool> for one tool, and mcp__* for every MCP
  // tool. A plugin's server is named plugin_<plugin>_<server>, as Claude Code
  // names it, with every character outside letters, digits, _ and - written
  // as _. A specifier in parentheses, as in Bash(git push *), is
  // accepted and governs the whole tool. Agent(explore, release-notes)
  // also limits which subagents this agent may start; the Cursor engine
  // cannot hold its built-in subagents back, so it refuses a turn whose agent
  // limits Agent to types. The lists hold on both engines, and under "approve everything"
  // too.
  //
  // Skill is a name here too, for the agent's skills: a list without Skill
  // keeps them, and a list holding only Skill names them, so it does not
  // refuse the turn, also under an outer list that omits Skill (a
  // plugin subagent's under its turn's, a turn's under the agent's). Denying
  // Skill in disallowed_tools removes them, and then a list of Skill alone
  // in a narrower layer refuses the turn.
  //
  // @internal
  // Resolution follows Claude Code's subagent rules: disallowed_tools is
  // applied first, then tools against what remains. An entry that names no
  // tool the turn has is ignored with a log line; a non-empty list in which
  // no entry resolves refuses the turn. The shape is checked at apply; names
  // are resolved only at run time, so a portable plugin agent applies on any
  // installation. The platform's own tools (think, channel messaging,
  // conversation participation, memory) are outside both lists. With Read
  // excluded, the agent still reads the platform's .stigmer/ content (its
  // skills, inputs and plan) and its own offloaded tool outputs.
  repeated string tools = 10 [(buf.validate.field).repeated.items.string = {
    max_len: 256
    pattern: "^(mcp__\\*|mcp__([a-z][a-z0-9-]*[a-z0-9]|plugin(_[A-Za-z0-9-]+)+)(__(\\*|[A-Za-z0-9_.-]+))?|[A-Z][A-Za-z0-9_]*(\\([^()\\r\\n]+\\))?)$"
  }];

  // Tools this agent may never use, in the same names as tools.
  // Applied before tools, so a tool named in both is excluded.
  //
  // Disallowing Skill hides every skill from this agent: no skill is listed
  // or mounted for its turns, and the Read tool refuses reads of skill and
  // plugin-tree files. Grep, Glob and a shell the agent is granted are not
  // refused, so they can still reach those files.
  repeated string disallowed_tools = 11 [(buf.validate.field).repeated.items.string = {
    max_len: 256
    pattern: "^(mcp__\\*|mcp__([a-z][a-z0-9-]*[a-z0-9]|plugin(_[A-Za-z0-9-]+)+)(__(\\*|[A-Za-z0-9_.-]+))?|[A-Z][A-Za-z0-9_]*(\\([^()\\r\\n]+\\))?)$"
  }];

  // Hooks written in this agent itself, run around its tool calls and its
  // subagents' calls, after the hooks of the plugins it lists.
  //
  // A hook can refuse a call, ask a person first, or let it run
  // without the approval it would otherwise need. Both engines run hooks in
  // Claude Code's format and in Cursor's. On the Cursor engine, web fetch and
  // web search reach no hook, so an agent whose PreToolUse hooks would match
  // them runs there without those tools; a PostToolUse hook on them does not
  // run there.
  //
  // @internal
  // Order matters only for attribution: when two hooks give the winning
  // answer, the first source is recorded as the decider, and a turn's
  // plugins come before this list. Apply refuses more than one inline block,
  // and checks its events, matchers and conditions with the plugin reader's
  // rules.
  repeated HookSource hooks = 12;

  // The author's run defaults: the model, speed tier, thinking and run
  // bounds a turn on this agent uses unless the message or the surface it
  // came through sets its own (RunConfig has the rule). Versioned with the
  // agent, so a conversation pinned to a version keeps that version's
  // defaults.
  //
  // A choice here (model_name, service_tier, thinking_mode) applies only on
  // the engine named in harness; on a conversation running the other engine
  // only the bounds apply. A bound here is a cap: a message or a surface can
  // lower it, never raise it. A model must be named together with harness,
  // and must be one that engine lists; service_tier FAST and thinking_mode
  // ENABLED need a model that engine prices or marks capable. Checked when
  // the agent is saved.
  ai.stigmer.agentic.run.v1.RunConfig run_config = 13;

  // The engine this agent's run defaults were chosen for, and the engine a
  // new conversation on this agent starts on when the person or the surface
  // starting it names neither an engine nor a model (a turn that names a
  // model but no engine starts on native, the engine its name was checked
  // against). Unspecified: the platform's default engine (native).
  //
  // Model names belong to an engine (each lists its own), so run_config's
  // model, tier and thinking count only on this engine. A conversation keeps
  // the engine it started on; a later version naming another engine changes
  // only new conversations.
  ai.stigmer.agentic.session.v1.Harness harness = 14;

  // Field 15 named shared vaults this agent's conversations used; an agent
  // is a blueprint and carries no vaults: each conversation names its own.
  reserved 15;
  reserved "vaults";

  // Plugins this agent uses, each whole: its skills, agents, hooks and MCP
  // servers.
  //
  // @internal
  // Resolved at turn start like a skill reference: the reference's version
  // when set, else the installed version. Another organization's plugin is
  // accepted only from this organization's parent, shared with its child
  // organizations (the reference rule). A conversation's own plugins are
  // added to these, one entry per plugin.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference plugins = 16 [(ai.stigmer.commons.apiresource.reference_kind) = plugin];

  // Saved agents this agent may hand work to, each running its own
  // instructions, model, tools, plugins, skills, hooks and values.
  //
  // A subagent runs as the conversation's person and on its budget, under
  // the conversation's hooks, and cannot hand work on to another agent: an
  // agent that lists subagents of its own is refused here. Each reference is
  // pinned when this agent is saved: a reference without a version takes the
  // listed agent's latest version, and one naming a tag or a version keeps
  // that version until a later save sends the list again. At most 20.
  //
  // @internal
  // The save step resolves each version to its 64-hex hash through the
  // version ladder, so a pin never tracks the head. The writer must be able
  // to run each agent the write adds (can_execute); the floor rule keeps a
  // subagent at least as visible as this agent. An agent another agent
  // lists cannot be deleted.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference subagents = 17 [
    (ai.stigmer.commons.apiresource.reference_kind) = agent,
    (buf.validate.field).repeated.max_items = 20
  ];
}

// HookSource is a hooks block written in the agent.
message HookSource {
  // Field 1 named a plugin whose hooks applied to the agent until an agent
  // came to list its plugins whole in AgentSpec.plugins, hooks included.
  reserved 1;
  reserved "plugin";

  oneof source {
    option (buf.validate.oneof).required = true;

    // A hooks block in Claude Code's hooks.json shape, written in the agent.
    //
    // @internal
    // An omitted format is filled with Claude Code's at apply.
    ai.stigmer.agentic.plugin.v1.HookConfig inline = 2;
  }
}
