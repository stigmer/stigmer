syntax = "proto3";

package ai.stigmer.agentic.agent.v1;

import "ai/stigmer/agentic/environment/v1/spec.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";

// AgentSpec defines the configurable properties of an agent.
//
// @internal
// This is the "Template" layer — declares capabilities and requirements.
// The overview.md file provides the SDK-facing description and example YAML.
message AgentSpec {
  // Human-readable description for UI and marketplace display.
  string description = 1;

  // Icon URL for marketplace and UI display.
  // Must be a publicly accessible URL to an image (SVG, PNG, or JPEG).
  string icon_url = 2;

  // System prompt defining the agent's behavior and personality.
  string instructions = 3 [(buf.validate.field).string.min_len = 10];

  // MCP servers this agent can use.
  // Each entry must reference a unique McpServer resource by slug.
  repeated McpServerUsage mcp_server_usages = 4 [(buf.validate.field).repeated.items.cel = {
    id: "mcp_server_usages.kind"
    message: "mcp_server_usages must reference resources with kind=mcp_server"
    expression: "this.mcp_server_ref.kind == 44"
  }];

  // Skill resources providing additional knowledge to the agent.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference skill_refs = 5 [
    (ai.stigmer.commons.apiresource.reference_kind) = skill,
    (buf.validate.field).repeated.items.cel = {
      id: "skill_refs.kind"
      message: "skill_refs must reference resources with kind=skill"
      expression: "this.kind == 43"
    }
  ];

  // Sub-agents that can be delegated to.
  // A sub-agent starts from this agent's tools and may narrow them with its
  // own tool lists, never widen them.
  repeated SubAgent sub_agents = 6;

  // Environment variable declarations for this agent.
  // Keys are variable names; values describe their metadata and optionality.
  map<string, ai.stigmer.agentic.environment.v1.EnvVarDeclaration> env = 7;

  // Field 8 held the embedded sharing configuration (AgentSharing) until
  // sharing was promoted to the first-class AgentShare resource
  // (ai.stigmer.agentic.agentshare.v1): sharing is channel
  // configuration with its own writer and lifecycle, so applying an agent
  // manifest can never touch a share again.
  reserved 8;
  reserved "sharing";

  // Field 9 held datastore_usages (repeated DatastoreUsage) until the
  // Datastore domain was removed platform-wide.
  reserved 9;
  reserved "datastore_usages";

  // Tools this agent may use; empty means every tool it has.
  //
  // Entries use Claude Code's names: a built-in such as Read, Grep, Bash,
  // Write, Edit, Glob, Agent or WebFetch; mcp__<server-slug> for every tool of
  // one MCP server, mcp__<server-slug>__<tool> for one tool, and mcp__* for
  // every MCP tool. A specifier in parentheses, as in Bash(git push *), is
  // accepted and governs the whole tool. Agent(explore, shell) also limits
  // which sub-agents this agent may start; the Cursor engine cannot hold its
  // built-in sub-agents back, so it refuses a turn whose agent limits Agent to
  // types. The lists hold on both engines, and under "approve everything"
  // too.
  //
  // @internal
  // Resolution follows Claude Code's sub-agent rules: disallowed_tools is
  // applied first, then tools against what remains. An entry that names no
  // tool the turn has is ignored with a log line; a non-empty list in which
  // no entry resolves refuses the turn. The shape is checked at apply; names
  // are resolved only at run time, so a portable plugin agent applies on any
  // installation. The platform's own tools (think, channel messaging,
  // conversation participation, memory) are outside both lists. With Read
  // excluded, the agent still reads the platform's .stigmer/ content (its
  // skills, inputs and plan) and its own offloaded tool outputs.
  repeated string tools = 10 [(buf.validate.field).repeated.items.string = {
    max_len: 256
    pattern: "^(mcp__\\*|mcp__[a-z][a-z0-9-]*[a-z0-9](__(\\*|[A-Za-z0-9_.-]+))?|[A-Z][A-Za-z0-9_]*(\\([^()\\r\\n]+\\))?)$"
  }];

  // Tools this agent may never use, in the same names as tools.
  // Applied before tools, so a tool named in both is excluded.
  repeated string disallowed_tools = 11 [(buf.validate.field).repeated.items.string = {
    max_len: 256
    pattern: "^(mcp__\\*|mcp__[a-z][a-z0-9-]*[a-z0-9](__(\\*|[A-Za-z0-9_.-]+))?|[A-Z][A-Za-z0-9_]*(\\([^()\\r\\n]+\\))?)$"
  }];
}

// SubAgent defines a specialized agent that the parent can delegate to.
//
// A sub-agent starts from the parent's tools and may narrow them with its own
// tool lists, never widen them. Skills are independent of the parent.
message SubAgent {
  // Unique name of the sub-agent within the parent agent.
  string name = 1 [(buf.validate.field).required = true];

  // What this sub-agent specializes in.
  string description = 2;

  // System prompt for this sub-agent.
  string instructions = 3 [(buf.validate.field).string.min_len = 10];

  // Skill resources for this sub-agent.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference skill_refs = 5 [
    (ai.stigmer.commons.apiresource.reference_kind) = skill,
    (buf.validate.field).repeated.items.cel = {
      id: "skill_refs.kind"
      message: "skill_refs must reference resources with kind=skill"
      expression: "this.kind == 43"
    }
  ];

  // Model override for this sub-agent.
  // When set, uses this model instead of the parent's model.
  // When empty, inherits the parent agent's model.
  string model_override = 6;

  // Tools this sub-agent may use, from what the parent may use; empty means
  // all of the parent's. Same names as AgentSpec.tools. Inside a sub-agent,
  // the type list of an Agent(...) entry is ignored, as in Claude Code. The
  // Cursor engine cannot tell which sub-agent made a call, so it refuses a
  // turn whose sub-agent carries its own lists; the native engine runs it.
  repeated string tools = 7 [(buf.validate.field).repeated.items.string = {
    max_len: 256
    pattern: "^(mcp__\\*|mcp__[a-z][a-z0-9-]*[a-z0-9](__(\\*|[A-Za-z0-9_.-]+))?|[A-Z][A-Za-z0-9_]*(\\([^()\\r\\n]+\\))?)$"
  }];

  // Tools this sub-agent may never use, in the same names as tools.
  repeated string disallowed_tools = 8 [(buf.validate.field).repeated.items.string = {
    max_len: 256
    pattern: "^(mcp__\\*|mcp__[a-z][a-z0-9-]*[a-z0-9](__(\\*|[A-Za-z0-9_.-]+))?|[A-Z][A-Za-z0-9_]*(\\([^()\\r\\n]+\\))?)$"
  }];

  // Field 4 held mcp_access, per-sub-agent grants over the parent's MCP
  // servers. A sub-agent now narrows the parent's tools with tools and
  // disallowed_tools, mcp__<server-slug> entries included.
  reserved 4;
  reserved "mcp_access";
}

// McpServerUsage declares that this agent uses a McpServer resource.
//
// Every tool of a used server is available to the agent unless its tool
// lists say otherwise (AgentSpec.tools, AgentSpec.disallowed_tools), where the
// server is named by its slug, as in mcp__<server-slug>.
message McpServerUsage {
  // Reference to the McpServer resource.
  ai.stigmer.commons.apiresource.ApiResourceReference mcp_server_ref = 1 [
    (ai.stigmer.commons.apiresource.reference_kind) = mcp_server,
    (buf.validate.field).required = true
  ];

  // Field 2 held enabled_tools, a per-server tool allow-list, and field 3
  // tool_approval_overrides, per-tool approval settings. Both were removed
  // with the approval-policy model: the agent's tool lists narrow its tools,
  // and a tool asks before it runs when its server marks it destructive.
  reserved 2, 3;
  reserved "enabled_tools", "tool_approval_overrides";
}
