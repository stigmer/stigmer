syntax = "proto3";

package ai.stigmer.agentic.agent.v1;

import "ai/stigmer/agentic/environment/v1/spec.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";

// AgentSpec defines the configurable properties of an agent.
//
// @internal
// This is the "Template" layer — declares capabilities and requirements.
// The overview.md file provides the SDK-facing description and example YAML.
message AgentSpec {
  // Human-readable description for UI and marketplace display.
  string description = 1;

  // Icon URL for marketplace and UI display.
  // Must be a publicly accessible URL to an image (SVG, PNG, or JPEG).
  string icon_url = 2;

  // System prompt defining the agent's behavior and personality.
  string instructions = 3 [(buf.validate.field).string.min_len = 10];

  // MCP servers this agent can use.
  // Each entry must reference a unique McpServer resource by slug.
  repeated McpServerUsage mcp_server_usages = 4 [(buf.validate.field).repeated.items.cel = {
    id: "mcp_server_usages.kind"
    message: "mcp_server_usages must reference resources with kind=mcp_server"
    expression: "this.mcp_server_ref.kind == 44"
  }];

  // Skill resources providing additional knowledge to the agent.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference skill_refs = 5 [
    (ai.stigmer.commons.apiresource.reference_kind) = skill,
    (buf.validate.field).repeated.items.cel = {
      id: "skill_refs.kind"
      message: "skill_refs must reference resources with kind=skill"
      expression: "this.kind == 43"
    }
  ];

  // Sub-agents that can be delegated to.
  // Sub-agents can access a subset of the parent's MCP servers and tools.
  repeated SubAgent sub_agents = 6;

  // Environment variable declarations for this agent.
  // Keys are variable names; values describe their metadata and optionality.
  map<string, ai.stigmer.agentic.environment.v1.EnvVarDeclaration> env = 7;

  // Field 8 held the embedded sharing configuration (AgentSharing) until
  // sharing was promoted to the first-class AgentShare resource
  // (ai.stigmer.agentic.agentshare.v1 — decision 011): sharing is channel
  // configuration with its own writer and lifecycle, so applying an agent
  // manifest can never touch a share again.
  reserved 8;
  reserved "sharing";

  // Datastores this agent can use.
  // Each entry must reference a Datastore resource by slug.
  repeated DatastoreUsage datastore_usages = 9 [(buf.validate.field).repeated.items.cel = {
    id: "datastore_usages.kind"
    message: "datastore_usages must reference resources with kind=datastore"
    expression: "this.datastore_ref.kind == 49"
  }];
}

// SubAgent defines a specialized agent that the parent can delegate to.
//
// A sub-agent can only access MCP servers that the parent has in
// mcp_server_usages, and its tools must be a subset of the parent's
// enabled tools. Skills are independent of the parent.
//
// @internal
// Permission model enforced at execution time by the delegation handler.
message SubAgent {
  // Unique name of the sub-agent within the parent agent.
  string name = 1 [(buf.validate.field).required = true];

  // What this sub-agent specializes in.
  string description = 2;

  // System prompt for this sub-agent.
  string instructions = 3 [(buf.validate.field).string.min_len = 10];

  // MCP server access grants for this sub-agent.
  // Each entry references a parent McpServerUsage by slug and optionally
  // restricts which tools are available.
  repeated McpAccess mcp_access = 4;

  // Skill resources for this sub-agent.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference skill_refs = 5 [
    (ai.stigmer.commons.apiresource.reference_kind) = skill,
    (buf.validate.field).repeated.items.cel = {
      id: "skill_refs.kind"
      message: "skill_refs must reference resources with kind=skill"
      expression: "this.kind == 43"
    }
  ];

  // Model override for this sub-agent.
  // When set, uses this model instead of the parent's model.
  // When empty, inherits the parent agent's model.
  string model_override = 6;
}

// McpServerUsage declares that this agent uses a McpServer resource.
//
// The slug from mcp_server_ref identifies this server for SubAgent access
// grants via McpAccess.
//
// @internal
// Design principle: Users already named their McpServer with a slug.
// We use that slug as the identifier — no extra naming required.
message McpServerUsage {
  // Reference to the McpServer resource.
  ai.stigmer.commons.apiresource.ApiResourceReference mcp_server_ref = 1 [
    (ai.stigmer.commons.apiresource.reference_kind) = mcp_server,
    (buf.validate.field).required = true
  ];

  // Tools to enable from this MCP server for this agent.
  // Empty list uses the McpServer's default_enabled_tools.
  // Sub-agents can only restrict this set further, not expand it.
  //
  // @internal
  // Tool names must match exactly what the MCP server reports via tools/list.
  // Only names from discovered_capabilities.tools are valid here.
  // Do NOT include names from discovered_capabilities.resource_templates —
  // resource templates are read-only data endpoints, not callable tools.
  // A name the server does not expose (including a resource template name)
  // is warned and ignored at execution: the runner enforces the INTERSECTION
  // with the server's live toolset, so a stale or mistyped entry narrows the
  // toolset but never widens it or fails the run.
  //
  // Enforcement: the native (deep-agent) harness filters the discovered
  // toolset before it reaches the model; the Cursor harness cannot hide a
  // server's tools (its SDK config has no allow-list field), so its HITL
  // hook permanently denies calls to non-enabled tools instead — the model
  // may still see the tool listed, but every call is refused.
  repeated string enabled_tools = 2;

  // Override approval requirements for specific tools.
  // Takes precedence over McpServerSpec.pinned_tool_approvals and
  // McpServerStatus.tool_approvals.
  repeated ToolApprovalOverride tool_approval_overrides = 3;
}

// DatastoreUsage declares that this agent uses a Datastore resource.
//
// Attaching a datastore gives the agent the built-in record tools
// (find_records, insert_record, update_record, delete_record,
// describe_datastore) for it. What each caller may actually do is
// governed by the datastore's own authorization block, resolved per
// request from the verified sender or principal behind the session.
//
// @internal
// Usage-wrapper idiom (McpServerUsage precedent) so per-usage fields
// (approval tightening, verb caps, collection subsets — recorded growth
// slots) land additively. The usage edge is authorization-bearing for
// session-bound runner credentials (DD-006 SD-1): the record RPCs
// resolve reach through it live, per call, fail-closed. The runner
// synthesizes one bridge MCP attachment with an injected execution
// credential and empty approval maps — record tools are approval-free
// by construction.
message DatastoreUsage {
  // Reference to the Datastore resource.
  ai.stigmer.commons.apiresource.ApiResourceReference datastore_ref = 1 [
    (ai.stigmer.commons.apiresource.reference_kind) = datastore,
    (buf.validate.field).required = true
  ];
}

// McpAccess grants a sub-agent access to one of the parent's MCP servers.
//
// @internal
// Permission model enforced at execution time: sub-agent can only access
// servers in the parent's mcp_server_usages, and tools must be a subset
// of the parent's enabled_tools.
message McpAccess {
  // Slug of the McpServer to grant access to.
  // Must match a mcp_server_ref.slug from the parent's mcp_server_usages.
  string mcp_server = 1 [(buf.validate.field).required = true];

  // Tools this sub-agent can use from this MCP server.
  // Must be a subset of the parent's enabled_tools for this server.
  // Empty list grants access to all tools the parent has enabled.
  repeated string enabled_tools = 2;
}

// ToolApprovalOverride allows per-agent customization of approval requirements.
//
// Set requires_approval to true to require approval even when the McpServer
// has no default, or to false to skip approval even when the McpServer
// requires it. These overrides take precedence over
// McpServerSpec.pinned_tool_approvals and McpServerStatus.tool_approvals,
// but can be bypassed at execution time by AgentExecution.auto_approve_all.
//
// @internal
// Policy chain (lowest to highest priority):
// 1. McpServerStatus.tool_approvals — system-generated defaults
// 2. McpServerSpec.pinned_tool_approvals — manual overrides
// 3. Agent.McpServerUsage.tool_approval_overrides — per-agent (this message)
// 4. AgentExecution.auto_approve_all — runtime bypass
//
// Invalid tool names are silently ignored (no approval applied).
// This allows forward-compatibility when MCP servers add/remove tools.
message ToolApprovalOverride {
  // Name of the tool to override.
  string tool_name = 1 [(buf.validate.field).string.min_len = 1];

  // Whether this tool requires approval for this agent.
  bool requires_approval = 2;

  // Custom approval message shown to the reviewer.
  // Supports {{args.field}} placeholders.
  // When empty, falls back to the McpServer default or auto-generates
  // "Execute tool: {tool_name}".
  string message = 3;
}
