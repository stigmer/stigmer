syntax = "proto3";

package ai.stigmer.agentic.agent.v1;

import "ai/stigmer/agentic/agent/v1/api.proto";
import "ai/stigmer/agentic/agent/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/iam/iampolicy/v1/rpcauthorization/method_options.proto";

// AgentQueryController handles read operations for AI agents.
service AgentQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = agent;

  // Get a single agent by ID.
  rpc get(AgentId) returns (Agent) {
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).resource_kind = agent;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).permission = can_view;
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).field_path = "value";
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.config).error_msg = "unauthorized to get agent";
  }

  // Custom authorization in handler
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (Agent) {
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.is_skip_authorization) = true;
  }

  // Get the platform default agent.
  //
  // Resolves the agent labeled stigmer.ai/default-agent: "true" with
  // visibility_public. Returns the full Agent resource including
  // status.default_instance_id for session creation.
  //
  // Used by frontends to enable session-first UX where users start
  // a conversation without explicitly selecting an agent.
  //
  // Error: NOT_FOUND if no default agent is configured.
  // Custom authorization in handler.
  rpc getDefault(GetDefaultAgentRequest) returns (Agent) {
    option (ai.stigmer.iam.iampolicy.v1.rpcauthorization.is_skip_authorization) = true;
  }
}
