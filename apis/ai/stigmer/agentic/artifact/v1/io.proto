syntax = "proto3";

package ai.stigmer.agentic.artifact.v1;

import "ai/stigmer/agentic/artifact/v1/api.proto";
import "ai/stigmer/agentic/artifact/v1/spec.proto";
import "buf/validate/validate.proto";

// ArtifactId wraps an artifact identifier.
//
// @internal
// Using a wrapper (instead of a raw string) provides validation,
// clear field naming, and extensibility.
//
// @since T07 (Artifact Store)
message ArtifactId {
  // Artifact identifier.
  // Format: "art_{unique-suffix}" (auto-generated by backend)
  string value = 1 [(buf.validate.field).required = true];
}

// ArtifactList contains a paginated list of artifacts.
//
// @internal
// Returned by list operations (listByExecution).
//
// @since T07 (Artifact Store)
message ArtifactList {
  // Total number of pages available for this query.
  int32 total_pages = 1;

  // Artifacts in the current page, sorted by created_at descending.
  repeated Artifact entries = 2;
}

// CreateArtifactInput provides the data needed to create an artifact.
//
// @internal
// Used by the workflow-runner and agent-runner to persist task outputs.
// This is a system-level RPC — not exposed to end users or the SDK.
//
// The backend:
// 1. Computes SHA-256 hash of content
// 2. Checks if a blob with that hash already exists (deduplication)
// 3. If not, writes blob to storage (filesystem in OSS, S3 in Cloud)
// 4. Creates the Artifact metadata record
// 5. Returns the created Artifact with status populated
//
// Size limit: 50MB per request. This matches Temporal's max history size
// and covers all practical workflow task outputs. For larger artifacts,
// multipart upload will be added in a future phase.
//
// @since T07 (Artifact Store)
message CreateArtifactInput {
  // Artifact properties (content type, display name, source, retention).
  ArtifactSpec spec = 1 [(buf.validate.field).required = true];

  // Raw artifact content bytes.
  //
  // @internal
  // Maximum size: 50MB (52,428,800 bytes).
  // The backend computes the SHA-256 hash of this content for
  // content-addressable storage and deduplication.
  bytes content = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.max_len = 52428800
  ];
}

// ListArtifactsByExecutionRequest lists artifacts produced by a specific execution.
//
// @internal
// Supports listing by either workflow_execution_id or agent_execution_id.
// At least one must be provided.
//
// @since T07 (Artifact Store)
message ListArtifactsByExecutionRequest {
  // WorkflowExecution ID to list artifacts for.
  // Format: "wex_{unique-suffix}"
  string workflow_execution_id = 1;

  // AgentExecution ID to list artifacts for.
  // Format: "aex_{unique-suffix}"
  string agent_execution_id = 2;

  // Maximum number of artifacts to return per page.
  // Default: 50. Maximum: 100.
  int32 page_size = 3;

  // Opaque pagination token from a previous response.
  string page_token = 4;
}

// GetArtifactContentRequest reads the raw content of an artifact.
//
// Unlike getDownloadUrl (which returns a presigned URL for direct
// browser download), this endpoint returns the artifact bytes through the
// Stigmer API. This eliminates CORS concerns for SDK consumers who need to
// read artifact content programmatically — e.g., rendering an artifact-backed
// review payload inside an embedded approval gate.
//
// @internal
// Mirrors AgentExecutionQueryController.getArtifactContent, which was added
// for the same reason on the agent-execution side. Artifacts are addressed
// by artifact ID here (the T07 store's identity) rather than by
// execution_id + storage_key.
//
// The server enforces a maximum content size (default: 512 KB). If the
// artifact exceeds max_bytes, the response contains the first max_bytes of
// content with truncated=true. Callers use total_size_bytes to decide
// whether to offer a full download via getDownloadUrl instead.
//
// @since Review Payloads (stigmer/stigmer#234)
message GetArtifactContentRequest {
  // Artifact identifier.
  // Format: "art_{unique-suffix}"
  string artifact_id = 1 [(buf.validate.field).string.min_len = 1];

  // Maximum number of bytes to return.
  //
  // If the artifact is larger than this limit, the response contains
  // the first max_bytes of content with truncated=true.
  //
  // When 0 or unset, the server applies a default limit (512 KB).
  // The server may also enforce a hard upper bound regardless of this value.
  int64 max_bytes = 2;
}

// GetArtifactContentResponse returns the raw content of an artifact.
//
// The content field contains the artifact bytes (up to max_bytes). For text
// artifacts, clients decode as UTF-8. The content_type field is the type
// recorded at creation (ArtifactSpec.content_type).
//
// @since Review Payloads (stigmer/stigmer#234)
message GetArtifactContentResponse {
  // Raw artifact content (up to max_bytes).
  //
  // For text artifacts (JSON, YAML, Markdown, etc.), decode as UTF-8.
  // For binary artifacts, callers should generally use getDownloadUrl
  // instead of this endpoint.
  bytes content = 1;

  // MIME content type recorded when the artifact was created
  // (same as ArtifactSpec.content_type). Example: "application/json".
  string content_type = 2;

  // Actual total size of the artifact in bytes.
  //
  // Larger than len(content) when truncated=true. Callers can use this
  // to show "showing 512 KB of 2.1 MB" messages or to decide whether
  // to offer a full download link.
  int64 total_size_bytes = 3;

  // Whether the content was truncated to fit within max_bytes.
  //
  // When true, content contains only the first max_bytes of the artifact.
  // The full artifact can be downloaded via getDownloadUrl.
  bool truncated = 4;
}

// ArtifactDownloadUrl provides a URL for downloading artifact content.
//
// @internal
// The download strategy differs by edition:
// - Cloud: pre-signed S3 URL with short TTL (e.g., 15 minutes)
// - OSS: direct URL to the local artifact server endpoint
//
// This pattern avoids streaming large blobs through the gRPC control plane.
// The client receives a URL and fetches the content via HTTP GET.
//
// @since T07 (Artifact Store)
message ArtifactDownloadUrl {
  // URL to download the artifact content via HTTP GET.
  //
  // @internal
  // Cloud: pre-signed S3 URL (expires after ttl_seconds)
  // OSS: http://localhost:{port}/artifacts/{hash}
  string url = 1;

  // Time-to-live for the download URL in seconds.
  // After this duration, the URL expires and a new one must be requested.
  // Typically 900 (15 minutes) for Cloud, 0 (no expiry) for OSS.
  int32 ttl_seconds = 2;

  // Size of the artifact content in bytes (convenience, same as status.size_bytes).
  int64 size_bytes = 3;

  // MIME content type (convenience, same as spec.content_type).
  string content_type = 4;
}
