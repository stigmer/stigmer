syntax = "proto3";

package ai.stigmer.agentic.agenteval.v1;

import "ai/stigmer/agentic/plugineval/v1/spec.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";

// AgentEvalSpec says which agent version is evaluated, on which of its
// plugins' cases, on which models, how many times, and within what spend.
//
// @internal
// Immutable after create: an eval is one run of the cases, and a
// different setting is a new eval. The cases and their graders are read
// from each plugin's archive at the version the eval stamped, never copied
// here, so criteria live in the plugins. The knobs shared with a plugin
// eval carry its field names and rules (plugineval/v1/spec.proto).
message AgentEvalSpec {
  // ID of the agent evaluated.
  //
  // @internal
  // The authorization parent: the eval's access is the agent's.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];

  // The agent version to evaluate, a version hash or a tag. Empty
  // evaluates the current version.
  //
  // @internal
  // Create resolves a tag and stamps the version's hash, so the eval names
  // the exact version every try ran even after the agent is saved again.
  string agent_version = 2 [(buf.validate.field).string.max_len = 128];

  // The slugs of the plugins whose cases run, each one the agent
  // attaches. Empty runs the cases of every plugin the agent attaches.
  repeated string plugins = 3 [(buf.validate.field).repeated = {
    max_items: 64
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];

  // The engines and models each case runs on, at most six. Empty runs
  // each case on the agent as it runs: its own engine, model and settings.
  repeated ai.stigmer.agentic.plugineval.v1.PluginEvalTarget targets = 4 [(buf.validate.field).repeated.max_items = 6];

  // Tries per case and target, from 1 to 50. Zero uses each case's own
  // runs value, or 3.
  int32 runs = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 50
  }];

  // The score a case needs to pass, from 0 to 1, or 1 when unset: every
  // scored check passes on every try.
  optional double threshold = 6 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];

  // Runs only the cases whose directory name matches this glob, as in
  // "review-*". Empty runs every case.
  string case_glob = 7 [(buf.validate.field).string.max_len = 256];

  // Runs only the cases carrying at least one of these tags. Empty runs
  // every case.
  //
  // @internal
  // Not named tags: every SDK generator reads a top-level spec field
  // named tags as resource metadata and drops it.
  repeated string case_tags = 8 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];

  // The model AI-graded checks use. Empty uses the platform's default
  // judge model.
  string judge_model = 9 [(buf.validate.field).string.max_len = 128];

  // The most this eval may spend, in estimated US dollars of model cost.
  //
  // Checked before each try starts, counting what tries already spent and
  // the cap each running try still holds: tries already running and their
  // AI-graded checks finish, so the spend can pass the limit by those.
  double max_cost_usd = 10 [(buf.validate.field).double = {
    gt: 0
    lte: 1000
    finite: true
  }];

  // Tries running at once, from 1 to 8. Zero means 1.
  int32 concurrency = 11 [(buf.validate.field).int32 = {
    gte: 0
    lte: 8
  }];

  // Tools every try may use beyond each case's own list, in Claude Code's
  // names, as Claude Code's --allow-tools.
  //
  // A try runs the agent with only the tools its case and this list grant,
  // within the agent's own tool lists: name the agent's working tools here
  // (Skill for its skills, Agent for its hand-offs to subagents). A
  // specifier in parentheses, as in Bash(npm test *), grants the whole
  // tool. A plugin's MCP tools are named either way: Claude Code's
  // mcp__plugin_<plugin>_<server>__<tool> or Stigmer's
  // mcp__<server>__<tool>.
  repeated string allow_tools = 12 [(buf.validate.field).repeated = {
    max_items: 64
    items: {
      string: {
        max_len: 256
        pattern: "^(mcp__\\*|mcp__plugin_[A-Za-z0-9.-]+_[A-Za-z0-9_.-]+?(__(\\*|[A-Za-z0-9_.-]+))?|mcp__[a-z][a-z0-9-]*[a-z0-9](__(\\*|[A-Za-z0-9_.-]+))?|[A-Z][A-Za-z0-9_]*(\\([^()\\r\\n]+\\))?)$"
      }
    }
  }];

  // Runs the plugins' MCP servers for real, with the organization's
  // connections. Off by default: a try cannot call the plugins' MCP tools,
  // as in Claude Code's evals without mocks.
  bool real_mcp_servers = 13;

  // Vaults whose logins and secrets the tries use, in order: the first
  // vault holding a match wins. At most 20.
  //
  // A try has no person, so these vaults are all its hooks and servers
  // use. Each is a shared vault: a My vault, the creator's included, is
  // refused, because every viewer of the agent may read a try, and a
  // hook's or server's output can show what a key unlocked.
  //
  // @internal
  // The schedule's rule: the credential resolver finds the eval from the
  // run's stigmer.ai/plugin-eval label and asks can_use again of the
  // account recorded in status.vault_attachers.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference vaults = 14 [
    (ai.stigmer.commons.apiresource.reference_kind) = vault,
    (buf.validate.field).repeated.max_items = 20,
    (buf.validate.field).repeated.items.cel = {
      id: "vaults.kind"
      message: "vaults must reference resources with kind=vault"
      expression: "this.kind == 59"
    }
  ];

  // Skips each case's scaffold script, as Claude Code's --no-scaffold; a
  // case that has one is then listed as not run.
  bool skip_scaffold = 15;

  // Starts the plugins' real MCP servers for the servers no mock answers,
  // as Claude Code's --allow-real-servers; mocked tools still answer from
  // their files. Their tools still need allow_tools.
  //
  // @internal
  // Create refuses it with real_mcp_servers, as a plugin eval's does.
  bool allow_real_servers = 16;
}
