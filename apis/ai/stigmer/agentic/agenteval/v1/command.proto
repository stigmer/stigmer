syntax = "proto3";

package ai.stigmer.agentic.agenteval.v1;

import "ai/stigmer/agentic/agenteval/v1/api.proto";
import "ai/stigmer/agentic/agenteval/v1/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// AgentEvalCommandController handles write operations for agent evals.
//
// @internal
// No update and no apply: an eval is one run of the cases, started from
// the console or the CLI, never authored as a manifest.
service AgentEvalCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = agent_eval;

  // Start an eval of an agent on its plugins' eval cases.
  //
  // The eval lives in its agent's organization, which pays for every try.
  // It returns at once, pending; get it again to follow its progress.
  //
  // @internal
  // Authorization: skip standard resource authorization, because the
  // target is the agent named in spec.agent_id, not the request's own id.
  // In-handler enforcement, in order (the agent-eval domain's create
  // chain):
  // 1. AuthorizeResolvedTarget: can_edit on the agent, before the agent is
  //    read, so a caller who cannot edit it learns nothing about whether
  //    it exists.
  // 2. metadata.org must be the agent's organization.
  // 3. spec.agent_version, a version hash or tag of the agent (empty: its
  //    current version), is resolved and stamped as the version's hash.
  // 4. Each plugin that version attaches (spec.plugins narrowing them) is
  //    resolved as a turn resolves it, the reference's version when set,
  //    else the version installed now, and stamped; its suite is read at
  //    that version.
  // 5. Each vault must be usable by the caller (the schedule's rule), and
  //    none may be a My vault: every viewer of the agent reads the tries.
  // 6. More than 200 cases or 1000 tries, across every plugin, is refused
  //    with the computed counts.
  // Then the eval's workflow starts under a deterministic id; a start that
  // fails marks the eval failed, "the eval's workflow could not be
  // started", the cause logged.
  //
  // Error Cases:
  //
  // - INVALID_ARGUMENT: metadata.org or spec is missing; spec.case_glob is
  //   not a valid glob; spec.plugins names a plugin the agent does not
  //   attach; an allow_tools entry names MCP tools of a plugin the agent
  //   does not attach; a target names a model the catalog does not run on
  //   its engine
  // - FAILED_PRECONDITION: the organization is not the agent's; the agent
  //   attaches no plugin; no plugin it attaches has eval cases at its
  //   version; no case matches case_glob and case_tags; the cases are more
  //   than an eval may run; a named vault is a My vault
  // - PERMISSION_DENIED: the caller may not edit the agent, or may not use
  //   a named vault
  // - NOT_FOUND: the agent, the named version or an attached plugin does
  //   not exist, or the agent was deleted while the eval was created
  // - ALREADY_EXISTS: the organization already has an eval of that name
  rpc create(AgentEval) returns (AgentEval) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Cancel a pending or running eval.
  //
  // Tries in flight are stopped; the eval ends partial, "cancelled", with
  // the results of the tries that finished. Cancelling a finished eval
  // changes nothing.
  //
  // @internal
  // Authorization: requires can_edit on the eval (can_edit from its
  // agent).
  rpc cancel(AgentEvalId) returns (AgentEval) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_eval;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to cancel agent eval";
  }

  // Delete an eval with its tries' conversations, runs and scores.
  //
  // A pending or running eval is refused: cancel it first.
  //
  // @internal
  // Authorization: requires can_delete on the eval (can_edit from its
  // agent). Deleting the agent deletes its evals.
  //
  // Error Cases:
  //
  // - FAILED_PRECONDITION: the eval is pending or running; the error names
  //   cancel
  rpc delete(AgentEvalId) returns (AgentEval) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_eval;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete agent eval";
  }
}
