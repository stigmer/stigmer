syntax = "proto3";

package ai.stigmer.agentic.agenteval.v1;

import "ai/stigmer/agentic/plugineval/v1/status.proto";
import "ai/stigmer/commons/apiresource/status.proto";
import "google/protobuf/timestamp.proto";

// AgentEvalStatus holds an eval's progress and results: per plugin, per
// case and per target, the score and every try with its run.
//
// @internal
// Written only by the eval's workflow, one write at a time, as a plugin
// eval's is. Create starts it pending with every plugin stamped. The case,
// target, arm, try and aggregate messages are the plugin eval's, so every
// renderer of a plugin eval's results renders a plugin's block here; an
// agent eval has one arm, with_plugin, and no delta.
message AgentEvalStatus {
  // Where the eval is.
  ai.stigmer.agentic.plugineval.v1.PluginEvalPhase phase = 1;

  // Why a partial eval stopped early; unspecified otherwise.
  ai.stigmer.agentic.plugineval.v1.PluginEvalPartialReason partial_reason = 2;

  // One sentence naming what failed when the phase is failed, as in "the
  // plugins' evals could not be read"; empty otherwise.
  string error = 3;

  // The agent version every try ran, as a version hash.
  string agent_version_hash = 4;

  // Every plugin the agent version attaches, in the agent's order, each
  // with the version the tries run and its cases' results.
  repeated AgentEvalPlugin plugins = 5;

  // The totals over every plugin's cases.
  ai.stigmer.agentic.plugineval.v1.PluginEvalAggregates aggregates = 6;

  // Estimated model cost so far of every try and every AI-graded check,
  // in US dollars.
  double cost_usd = 7;

  // Tries the eval plans in all, and tries finished.
  int32 tries_total = 8;
  int32 tries_finished = 9;

  // When the eval started running and when it finished.
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;

  // Who attached each of this eval's vaults, by vault id: the account
  // whose permission to use the vault each try checks, since a try has no
  // person.
  //
  // @internal
  // Server-owned, written at create (the schedule's reference rule).
  map<string, string> vault_attachers = 12;

  // Standard audit information (created_at, updated_at, created_by, etc.)
  ai.stigmer.commons.apiresource.ApiResourceAudit audit = 99;
}

// AgentEvalPlugin is one plugin the agent attaches, as the eval ran it.
message AgentEvalPlugin {
  // The plugin's ID and slug.
  string plugin_id = 1;
  string plugin_slug = 2;

  // The plugin version (archive digest) every try runs: the version the
  // agent's reference names, or the one installed when the eval was
  // created.
  string plugin_digest = 3;

  // Why none of this plugin's cases run, as in "no eval cases at this
  // version" or "not selected"; empty when its cases run.
  string not_run_reason = 4;

  // The plugin's cases, in directory order, each with its results. Every
  // case has one arm, with_plugin; without_plugin and delta stay unset.
  repeated ai.stigmer.agentic.plugineval.v1.PluginEvalCase cases = 5;

  // This plugin's totals; mean_delta stays unset.
  ai.stigmer.agentic.plugineval.v1.PluginEvalAggregates aggregates = 6;
}
