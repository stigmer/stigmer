syntax = "proto3";

package ai.stigmer.agentic.agenteval.v1;

import "ai/stigmer/agentic/agenteval/v1/api.proto";
import "buf/validate/validate.proto";

// AgentEvalId wraps an agent eval identifier.
message AgentEvalId {
  // Unique identifier of the agent eval.
  string value = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];
}

// ListAgentEvalsByAgentRequest names the agent whose evals to list.
message ListAgentEvalsByAgentRequest {
  // ID of the agent.
  string agent_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
}

// AgentEvalList is a list of agent evals.
message AgentEvalList {
  reserved 1;
  reserved "total_count";

  // The evals, newest first.
  repeated AgentEval entries = 2;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 3;
}
