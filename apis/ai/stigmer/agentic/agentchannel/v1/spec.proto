syntax = "proto3";

package ai.stigmer.agentic.agentchannel.v1;

import "ai/stigmer/agentic/credential/v1/requirement.proto";
import "ai/stigmer/agentic/run/v1/invocation.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";

// AgentChannelSpec defines the configurable properties of an agent channel.
//
// The spec is deliberately small: which agent serves the channel, whether
// serving is enabled, which provider the channel targets, and which
// credentials supply the agent's tool values. Workspace identity and
// provider credentials are produced by the install flow and live in
// status — a declarative apply can never clobber them.
//
// @internal
// Honest modeling: the provider arms carry only genuinely user-declarable
// fields. For
// the multi-tenant Slack app everything concrete (team_id, bot_user_id,
// scopes, credentials env) is OAuth-observed → status. Owner-customizable
// refusal copy (the AgentShareMessages analog) is deliberately deferred:
// platform-default copy lives in the deliverer; adding a
// messages block later is a non-breaking change.
message AgentChannelSpec {
  // Reference to the agent this channel serves.
  //
  // A version on the reference (a tag or a content hash) is the version
  // each new conversation on this channel runs; none, or "latest", runs the
  // agent's current version when the conversation starts. A started
  // conversation keeps the version it started on.
  //
  // @internal
  // Invariant (enforced in create/update/apply handlers of both editions,
  // mirroring AgentShare's same-org rule): agent_ref.org must equal
  // metadata.org — the connection-owning org is the billing org and
  // provider credentials resolve in that org.
  ai.stigmer.commons.apiresource.ApiResourceReference agent_ref = 1 [
    (ai.stigmer.commons.apiresource.reference_kind) = agent,
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "agent_ref.kind"
      message: "agent_ref must reference a resource with kind=agent"
      expression: "this.kind == 40"
    }
  ];

  // Whether serving traffic on this channel is enabled.
  //
  // Disabling is a config-preserving pause: the connection keeps its
  // install state and credentials, but inbound events are refused until
  // re-enabled. Delete the channel instead for a full teardown.
  //
  // @internal
  // Pause must never drop the install: re-installing a
  // Slack app to re-auth is painful. The per-turn gate re-reads this live,
  // so disabling takes effect on the next message.
  bool enabled = 2;

  // Provider this channel connects to. Exactly one must be specified.
  //
  // @internal
  // Provider variance is config-shaped, not lifecycle-shaped
  // — one kind, a validated oneof (McpServerSpec.server_type precedent).
  // Adding WhatsApp extends this oneof; it touches zero kinds.
  oneof provider_config {
    option (buf.validate.oneof).required = true;

    // Slack workspace connection (multi-tenant Stigmer Slack app).
    SlackChannelConfig slack = 3;

    // WhatsApp Business number connection (Meta Cloud API).
    WhatsAppChannelConfig whatsapp = 6;
  }

  // Field 4 held environment_refs, references to environments whose
  // values a channel's conversations received, until credentials replaced
  // environments. Reserved so the number and name are never reused.
  reserved 4;
  reserved "environment_refs";

  // The values this channel's conversations use for what the agent needs.
  //
  // A channel's runs have no person behind them, so they never use anyone's
  // own credentials: they use what is assigned here.
  //
  // Each assignment gives one requirement of the agent, one of its MCP
  // servers or a git host its value: a field of a credential the writer
  // may use, or a plain literal. A person's own credential is never
  // accepted here.
  //
  // @internal
  // Judged at write by the reference rule (pipeline/steps/references.ts):
  // the writer must hold can_use on each credential an assignment
  // introduces, and the server stamps the writer. A run re-checks the
  // writer's can_use when it starts and is refused, naming the
  // assignment, when it no longer holds.
  repeated ai.stigmer.agentic.credential.v1.CredentialAssignment credentials = 9 [(buf.validate.field).repeated.max_items = 64];

  // Reference to the ChannelApp this channel installs through.
  //
  // For Slack, absent means the channel uses the platform's shared
  // Stigmer app — the zero-setup default. Set it to install through your
  // own provider app instead: the bot carries the app's name and icon,
  // and each app is its own bot identity, so multiple agents can serve
  // one workspace. For WhatsApp the reference is required — every
  // WhatsApp channel installs through your own Meta app.
  //
  // @internal
  // Invariants (enforced in handlers of both editions):
  // app_ref.org must equal metadata.org (secrets never cross orgs — the
  // agent_ref rule), and the ref is immutable while install_state ==
  // installed (the workspace granted THAT app; switching apps requires
  // re-install, so pending/revoked channels may rebind freely). No
  // write-time existence or provider-match check: the install flow resolves the app and
  // fails closed on a missing or wrong-provider reference.
  ai.stigmer.commons.apiresource.ApiResourceReference app_ref = 5 [
    (ai.stigmer.commons.apiresource.reference_kind) = channel_app,
    (buf.validate.field).cel = {
      id: "app_ref.kind"
      message: "app_ref must reference a resource with kind=channel_app"
      expression: "this.slug == '' || this.kind == 48"
    }
  ];

  // Whether the serving agent may send business-initiated (proactive)
  // messages on this channel. Off by default: a channel is reply-only
  // until its owner grants this.
  //
  // @internal
  // The owner's consent lever, alongside the platform's own (two consents),
  // living where `enabled` lives (the surface owns the grant).
  // Existing channels keep reply-only behavior on deploy. Tuning knobs
  // (rate caps) stay platform config; what owners
  // control is this grant. The runner attaches the send_channel_message
  // tool only when getByAgent finds an installed + enabled channel with
  // this flag set — an agent with no proactive channel never sees the
  // tool.
  bool proactive_messaging_enabled = 7;

  // Per-turn model choice and run bounds for conversations on this
  // channel.
  //
  // These settings are the turn's own layer: unset fields fall to the
  // agent's defaults, then to the platform's channel execution profile
  // (RunConfig has the rule). A choice set here wins over the agent's;
  // max_cost_usd and max_tool_rounds can only lower the agent's and the
  // platform's caps — a channel owner can reduce what one turn may spend,
  // never raise it. What a sender's own request carries is never read.
  //
  // @internal
  // The shared run shape (stigmer/stigmer#360), embedded directly — never a
  // ChannelRunConfig mirror, mirroring being the drift mechanism the shared
  // message exists to end. Runtime enforcement is cloud-only (the edition's
  // run-lane driver hands these settings to the server's one resolution);
  // OSS has no channel serving runtime and stores/echoes the field.
  ai.stigmer.agentic.run.v1.RunConfig run_config = 8;
}

// SlackChannelConfig selects Slack as the channel provider.
//
// Empty in v1 by design: with the multi-tenant Stigmer Slack app there is
// nothing for the user to declare before installing — workspace identity,
// bot user, and granted scopes are observed during the OAuth install and
// recorded in status. Future user-tunable Slack behavior lands here.
//
// @internal
// An empty message is set explicitly in manifests (`slack: {}`),
// satisfying the required oneof. Do not add OAuth-observed facts here —
// that is the spec-clobbering bug class (observed facts live in status).
message SlackChannelConfig {}

// WhatsAppChannelConfig selects WhatsApp as the channel provider and names
// the WhatsApp Business phone number the channel serves.
//
// WhatsApp channels install through your own Meta app registered as a
// ChannelApp: `spec.app_ref` is required for this provider (there is no
// shared platform WhatsApp app). Installing validates the number against
// the Meta Cloud API and records the observed facts in status.
//
// @internal
// Unlike Slack, WhatsApp v1 is BYO-only — app_ref presence is
// enforced in the create/update/apply handlers of both editions (the
// oneof-conditional rule does not fit a field-level CEL). phone_number_id
// lives in SPEC because it is genuinely user-declared (a WABA holds many
// numbers; the owner picks which one this agent serves) — the
// honest-modeling rule, not an exception to it. The install flow echoes it
// into status.whatsapp as the routing/uniqueness fact, mirroring
// status.slack.team_id.
message WhatsAppChannelConfig {
  // Phone number ID of the WhatsApp Business number this channel serves,
  // from Meta's WhatsApp Manager (API Setup), e.g. "106540352242922".
  //
  // This is the Cloud API's identifier for the number — not the phone
  // number itself.
  string phone_number_id = 1 [(buf.validate.field).string.min_len = 1];
}
