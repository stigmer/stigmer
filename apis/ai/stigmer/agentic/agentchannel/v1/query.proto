syntax = "proto3";

package ai.stigmer.agentic.agentchannel.v1;

import "ai/stigmer/agentic/agentchannel/v1/api.proto";
import "ai/stigmer/agentic/agentchannel/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// AgentChannelQueryController handles read operations for agent channels.
//
// @internal
// Deliberately no anonymous/public RPC (AgentShare's getSharedProfile has
// no analog here): the channel's public surface is the provider webhook,
// which authenticates by signature — never a query endpoint.
service AgentChannelQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = agent_channel;

  // Get a single agent channel by ID.
  rpc get(AgentChannelId) returns (AgentChannel) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_channel;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get agent channel";
  }

  // Get an agent channel by its organization-scoped reference (org/slug).
  //
  // @internal
  // Custom authorization in handler — checks both direct resource access
  // and organization-level visibility permissions (AgentShare pattern).
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (AgentChannel) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Get all channels of a specific agent.
  // Returns only channels the caller has access to.
  //
  // This is how the agent's integrations surface and CLI resolve an
  // agent's existing channels regardless of slug.
  //
  // @internal
  // Authorization in-handler: FGA-filtered in cloud, unrestricted in OSS.
  rpc getByAgent(GetAgentChannelsByAgentRequest) returns (AgentChannelList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List agent channels with optional label filtering.
  //
  // @internal
  // Authorization in-handler via FGA-filtered queries (cloud) or
  // unrestricted store queries (OSS).
  rpc list(ListAgentChannelsRequest) returns (AgentChannelList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
