syntax = "proto3";

package ai.stigmer.agentic.agentchannel.v1;

import "ai/stigmer/agentic/agentchannel/v1/api.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";

// AgentChannelId wraps an agent channel identifier.
message AgentChannelId {
  // Unique identifier of the agent channel.
  string value = 1 [(buf.validate.field).required = true];
}

// Input for retrieving all channels of a specific agent.
message ListAgentChannelsByAgentRequest {
  // Identifier of the agent whose channels to retrieve.
  string agent_id = 1 [(buf.validate.field).required = true];

  reserved 2;
  reserved "page_info";

  // Organization slug to scope the results to.
  //
  // When set, only channels whose metadata.org matches are returned — the
  // org-context view a console tab needs. When empty, results are bounded
  // only by the caller's view permissions, which for a member of several
  // organizations spans all of them.
  //
  // @internal
  // Mirrors the org scoping on the sibling listByAgent request (agent
  // shares). Handlers
  // implementing this RPC must apply the filter in their query/list step.
  string org = 3;

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 4 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 5 [(buf.validate.field).string.max_len = 1024];

  // Only resources carrying every label given, each matched exactly (AND).
  // A selective filter may answer short pages, even empty ones, that still
  // carry a token.
  map<string, string> labels = 6;
}

// Response containing a paginated list of agent channels.
message AgentChannelList {
  reserved 1;
  reserved "total_count";

  // Agent channels in the current page.
  repeated AgentChannel entries = 2;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 3;
}

// Input for listing agent channels within an organization.
message ListAgentChannelsRequest {
  // Organization slug to scope the listing.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // Only resources carrying every label given, each matched exactly (AND).
  // A selective filter may answer short pages, even empty ones, that still
  // carry a token.
  map<string, string> labels = 2;

  reserved 3;
  reserved "page_info";

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 4 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 5 [(buf.validate.field).string.max_len = 1024];
}

// Input for starting a provider install flow.
message InitiateChannelInstallInput {
  // ID of the agent channel to install.
  string resource_id = 1 [(buf.validate.field).required = true];
}

// Output of the initiate-install RPC.
//
// Two install styles share this output. For redirect-installed providers
// (Slack) the caller redirects the user to authorization_url; the provider
// redirects back to the console, which completes the install with the
// completeInstall RPC. For direct-installed providers (WhatsApp) the
// install completes inside this RPC: completed is true and there is
// nothing to redirect to — refresh the channel to see its install facts.
message InitiateChannelInstallOutput {
  // Provider authorization URL to redirect the installing user to
  // (for Slack: the "Add to Slack" consent screen). Empty when the
  // install completed directly.
  string authorization_url = 1;

  // Single-use opaque state parameter bound to this install attempt.
  // Empty when the install completed directly.
  //
  // @internal
  // Persisted server-side (PendingOAuthStateDocument pattern) and consumed
  // atomically by completeInstall; expired or replayed states are rejected.
  string state = 2;

  // True when the install completed synchronously inside this RPC
  // (direct-installed providers). Clients branch on this field — never on
  // provider knowledge of their own — so the server stays the single
  // source of install-style truth.
  //
  // @internal
  // The seam behind it is the sealed ChannelInstaller split:
  // AuthorizationRedirectInstaller populates authorization_url + state;
  // DirectInstaller populates completed.
  bool completed = 3;
}

// Input for completing a provider install flow.
//
// Carries the state and authorization code the provider's consent
// redirect delivered to the console.
message CompleteChannelInstallInput {
  // ID of the agent channel being installed.
  string resource_id = 1 [(buf.validate.field).required = true];

  // Single-use state parameter issued by initiateInstall.
  string state = 2 [(buf.validate.field).required = true];

  // Authorization code returned by the provider's consent screen.
  string code = 3 [(buf.validate.field).required = true];
}

// The changes an update makes to an agent channel: the fields update_mask names,
// taken from resource.
message UpdateAgentChannelInput {
  option (buf.validate.message).cel = {
    id: "update_names_its_target"
    message: "resource.metadata.id is required: an update names the agent channel by its id"
    expression: "has(this.resource) && has(this.resource.metadata) && this.resource.metadata.id != ''"
  };

  // The agent channel carrying the new values, named by metadata.id. Only the fields
  // update_mask names are read, so the others may be left empty; the result
  // is validated as a whole.
  AgentChannel resource = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The paths the update changes, as proto field names (spec.instructions,
  // metadata.labels). A list or map at a named path is replaced whole; "*"
  // names every path an update may change.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}
