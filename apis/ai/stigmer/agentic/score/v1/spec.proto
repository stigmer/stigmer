syntax = "proto3";

package ai.stigmer.agentic.score.v1;

import "ai/stigmer/agentic/score/v1/enum.proto";
import "buf/validate/validate.proto";

// ScoreSpec holds what was measured, on which run, and the result.
//
// @internal
// run_id is the caller's; session_id is the server's, filled from the run
// at create so a conversation's scores read as one list. Only a person's
// feedback is editable after create, and only its value and comment
// (the score domain's ValidateScoreUpdate step).
message ScoreSpec {
  // ID of the run this score grades.
  string run_id = 1 [(buf.validate.field).string.min_len = 1];

  // ID of the session the run belongs to.
  //
  // @internal
  // Server-derived from the run at create; a supplied value is replaced.
  // Immutable after create.
  string session_id = 2;

  // What is measured: `feedback` for a person's thumbs, `run-health` for
  // the free checks.
  //
  // @internal
  // A string, not an enum, because later sources name their own metrics
  // (a rubric's name); the Langfuse export maps it to a score's name. Not
  // called `name`: the SDK generators read a top-level spec field of that
  // name as the resource's metadata name. The create chain requires the
  // metric to agree with the source: feedback with score_source_human,
  // run-health with score_source_check.
  string metric = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
  }];

  // Who or what gave the score.
  ScoreSource source = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Identifies the version of the checks or rubric that produced the
  // score, so scores from different versions are never compared as one.
  //
  // @internal
  // For run-health, the SHA-256 of the check identifiers and thresholds,
  // pinned by a server test. Empty for a person's feedback.
  string evaluator_version = 5 [(buf.validate.field).string.max_len = 128];

  // The result.
  //
  // @internal
  // Unset exactly when status.state is score_state_not_graded. Further
  // value types (a number, a category) are added to this oneof with their
  // first writer.
  oneof value {
    // True when the run passed: thumbs up, or every applicable check
    // passed.
    bool passed = 6;
  }

  // The criteria behind the value, one per check or rubric item.
  repeated ScoreCriterion criteria = 7 [(buf.validate.field).repeated.max_items = 32];

  // A person's optional note on their rating.
  //
  // @internal
  // Accepted on a person's feedback only.
  string comment = 8 [(buf.validate.field).string.max_len = 500];
}

// ScoreCriterion is one criterion's outcome and the reason for it.
message ScoreCriterion {
  // The criterion's identifier, for example `no-repeated-calls`.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
  }];

  // The criterion's outcome.
  CriterionResult result = 2 [(buf.validate.field).enum.defined_only = true];

  // Why, in counts, tool names and step numbers; never a quote of what
  // anyone typed.
  string reason = 3 [(buf.validate.field).string.max_len = 500];
}
