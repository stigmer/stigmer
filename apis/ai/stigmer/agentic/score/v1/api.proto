syntax = "proto3";

package ai.stigmer.agentic.score.v1;

import "ai/stigmer/agentic/score/v1/spec.proto";
import "ai/stigmer/agentic/score/v1/status.proto";
import "ai/stigmer/commons/apiresource/metadata.proto";
import "buf/validate/validate.proto";

// Score is one grade of a finished run.
//
// A run carries a score for each thing measured: a person's thumbs up or
// down on the final answer, and the free run-health checks the platform
// runs when a run completes. Anyone who can see the run sees its scores.
//
// @internal
// A child of its run (kind_meta: scope PARENT through spec.run_id), so
// visibility is the run's and nothing is granted on a score itself. The
// person who rates owns the rating through the row's creator stamp; a
// score the server writes has no person owner in the hosted edition. Kind
// number 61, id prefix "scr". Not search-indexed: a comment is a
// person's words about a conversation, and search results are
// org-visible.
message Score {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = 'agentic.stigmer.ai/v1'];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = 'Score'];

  // Resource metadata including name, organization, and labels.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // What was measured, on which run, by whom, and the result.
  ScoreSpec spec = 4;

  // System-managed state: whether the run could be graded.
  ScoreStatus status = 5;
}
