syntax = "proto3";

package ai.stigmer.agentic.score.v1;

import "ai/stigmer/agentic/score/v1/api.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";

// ScoreId wraps a score identifier.
message ScoreId {
  // Unique identifier of the score.
  string value = 1 [(buf.validate.field).required = true];
}

// ListScoresByRunRequest lists the scores of one run, newest first.
message ListScoresByRunRequest {
  // ID of the run whose scores to list.
  string run_id = 1 [(buf.validate.field).string.min_len = 1];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];

  // Only resources carrying every label given, each matched exactly (AND).
  // A selective filter may answer short pages, even empty ones, that still
  // carry a token.
  map<string, string> labels = 4;
}

// ListScoresBySessionRequest lists the scores of every run in a session,
// newest first.
message ListScoresBySessionRequest {
  // ID of the session whose runs' scores to list.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];

  // Only resources carrying every label given, each matched exactly (AND).
  // A selective filter may answer short pages, even empty ones, that still
  // carry a token.
  map<string, string> labels = 4;
}

// ScoreList is a list of scores.
message ScoreList {
  // The scores, newest first.
  repeated Score entries = 2;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 3;
}

// GetAgentQualityReportRequest asks how one agent's runs in one
// organization went over the last few days.
message GetAgentQualityReportRequest {
  // Organization whose runs of the agent are counted. The caller must be
  // able to view it; runs in other organizations are never counted.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // ID of the agent whose runs are counted. The caller must be able to view
  // it.
  string agent_id = 2 [(buf.validate.field).string.min_len = 1];

  // How many days to count, ending today, from 1 to 90. Zero counts the
  // last 30. Days are UTC.
  int32 days = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 90
  }];
}

// AgentQualityReport counts one agent's grades in one organization, in
// total, per day and per agent version.
//
// @internal
// Counts, metric and criterion names, version hashes and dates only: no
// reason, no comment and no model's text, so the report quotes no
// conversation and can be shown to everyone who sees the organization and
// the agent, including people who cannot open the runs it counts. A plugin
// eval's tries are not counted: they are tests, not live runs.
message AgentQualityReport {
  // First day counted (UTC), as YYYY-MM-DD.
  string from_date = 1;

  // Last day counted (UTC, today), as YYYY-MM-DD.
  string to_date = 2;

  // Every grade in the window.
  QualitySummary total = 3;

  // One entry per UTC day that has a grade, oldest first. A grade counts on
  // the day it was given.
  repeated QualityDay days = 4;

  // One entry per agent version that has a grade in the window, most
  // recently seen first.
  repeated QualityVersion versions = 5;

  // Where people's thumbs and the AI judge disagree, one entry per judge
  // rubric version, most recently seen first. Only runs with both a judge
  // grade and at least one thumbs in the window are counted.
  repeated JudgeAgreement agreement = 6;
}

// JudgeAgreement sets people's thumbs against one version of the AI
// judge's rubrics: for each run that has both, each thumbs is counted
// against each rubric that passed or failed on that run.
//
// @internal
// A grade and a thumbs on either side of the window's first day are not
// joined. Counts and names only, like the rest of the report; the thumbs
// totals already show in the report's feedback tally.
message JudgeAgreement {
  // The version of the rubrics these counts are for.
  string evaluator_version = 1;

  // Runs with both a judge grade of this version and at least one thumbs.
  int32 runs = 2;

  // Runs people gave a thumbs down where no rubric failed: the sign of a
  // failure no rubric catches.
  int32 thumbs_down_none_failed = 3;

  // One entry per rubric, in name order.
  repeated RuleAgreement rules = 4;
}

// RuleAgreement counts one rubric's outcomes against people's thumbs on the
// same runs. A rubric that did not apply to a run counts nothing.
message RuleAgreement {
  // The rubric's name, for example `did-the-task`.
  string name = 1;

  // Thumbs down on runs the rubric failed: people and the judge agree.
  int32 failed_thumbs_down = 2;

  // Thumbs up on runs the rubric failed: the rubric may be too strict.
  int32 failed_thumbs_up = 3;

  // Thumbs down on runs the rubric passed: the rubric may be too lenient.
  int32 passed_thumbs_down = 4;

  // Thumbs up on runs the rubric passed: people and the judge agree.
  int32 passed_thumbs_up = 5;
}

// QualitySummary counts the runs graded and their grades, by metric.
message QualitySummary {
  // Distinct runs with at least one grade.
  int32 runs = 1;

  // One tally per metric and evaluator version. Two versions of the same
  // checks or rubrics are never added together.
  repeated MetricTally metrics = 2;
}

// MetricTally counts the grades of one metric at one evaluator version.
message MetricTally {
  // What was measured: `run-health`, `judge` or `feedback` (a person's
  // thumbs, where up counts as passed and down as failed).
  string metric = 1;

  // The version of the checks or rubrics that gave these grades. Empty for
  // a person's feedback.
  string evaluator_version = 2;

  // Grades that passed.
  int32 passed = 3;

  // Grades that failed.
  int32 failed = 4;

  // Runs that could not be graded.
  int32 not_graded = 5;

  // Runs picked for grading whose grade is not in yet.
  int32 pending = 6;

  // One tally per check or rubric item, in name order.
  repeated CriterionTally criteria = 7;
}

// CriterionTally counts one check's or rubric item's outcomes.
message CriterionTally {
  // The criterion's identifier, for example `no-repeated-calls`.
  string name = 1;

  // Runs that met the criterion.
  int32 passed = 2;

  // Runs that did not meet it.
  int32 failed = 3;

  // Runs it did not apply to.
  int32 not_applicable = 4;
}

// QualityDay is one UTC day's grades.
message QualityDay {
  // The day, as YYYY-MM-DD.
  string date = 1;

  // The day's grades.
  QualitySummary summary = 2;
}

// QualityVersion is the grades of the runs of one agent version.
message QualityVersion {
  // Content hash of the agent version. Empty for runs of an agent with no
  // recorded version.
  string agent_version_hash = 1;

  // First UTC day in the window with a grade of this version, as
  // YYYY-MM-DD.
  string first_date = 2;

  // Last UTC day in the window with a grade of this version, as
  // YYYY-MM-DD.
  string last_date = 3;

  // The version's grades.
  QualitySummary summary = 4;
}

// ListFlaggedScoresByAgentRequest lists the failed grades of one agent's
// runs in one organization that the caller can open.
message ListFlaggedScoresByAgentRequest {
  // Organization whose runs are listed. The caller must be able to view it.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // ID of the agent whose runs are listed. The caller must be able to view
  // it.
  string agent_id = 2 [(buf.validate.field).string.min_len = 1];

  // How many days to look back, ending today, from 1 to 90. Zero looks back
  // 30. Days are UTC.
  int32 days = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 90
  }];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 4 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 5 [(buf.validate.field).string.max_len = 1024];

  // Only resources carrying every label given, each matched exactly (AND).
  // A selective filter may answer short pages, even empty ones, that still
  // carry a token.
  map<string, string> labels = 6;
}

// The changes an update makes to a score: the fields update_mask names,
// taken from resource.
message UpdateScoreInput {
  option (buf.validate.message).cel = {
    id: "update_names_its_target"
    message: "resource.metadata.id is required: an update names the score by its id"
    expression: "has(this.resource) && has(this.resource.metadata) && this.resource.metadata.id != ''"
  };

  // The score carrying the new values, named by metadata.id. Only the fields
  // update_mask names are read, so the others may be left empty; the result
  // is validated as a whole.
  Score resource = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The paths the update changes, as proto field names (spec.instructions,
  // metadata.labels). A list or map at a named path is replaced whole; "*"
  // names every path an update may change.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}
