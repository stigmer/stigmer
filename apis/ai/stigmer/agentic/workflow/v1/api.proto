syntax = "proto3";

package ai.stigmer.agentic.workflow.v1;

import "ai/stigmer/agentic/workflow/v1/spec.proto";
import "ai/stigmer/agentic/workflow/v1/status.proto";
import "ai/stigmer/commons/apiresource/metadata.proto";
import "buf/validate/validate.proto";

// Workflow defines a multi-step task orchestration with sequential, parallel, and conditional execution.
//
// @internal
message Workflow {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = 'agentic.stigmer.ai/v1'];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = 'Workflow'];

  // Resource metadata including name, organization, visibility, and labels.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // Configurable properties: document metadata, tasks, and environment variables.
  WorkflowSpec spec = 4;

  // System-managed state including audit trail and default instance ID.
  WorkflowStatus status = 5;
}
