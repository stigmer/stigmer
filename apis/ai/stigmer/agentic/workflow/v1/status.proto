syntax = "proto3";

package ai.stigmer.agentic.workflow.v1;

import "ai/stigmer/agentic/workflow/v1/serverless/validation.proto";
import "ai/stigmer/commons/apiresource/status.proto";

// WorkflowStatus contains system-managed state for a Workflow resource.
message WorkflowStatus {
  // Standard audit information (created_at, updated_at, created_by, etc.)
  ai.stigmer.commons.apiresource.ApiResourceAudit audit = 99;

  // Field 1 held the id of the workflow's default instance until the
  // instance kind was removed; a run names its workflow directly.
  reserved 1;
  reserved "default_instance_id";

  // Serverless Workflow YAML generation and validation state.
  // Contains the generated CNCF Serverless Workflow DSL 1.0.0 YAML and validation results.
  // Check this field to determine whether a workflow is valid before executing it.
  //
  // @internal
  // Populated asynchronously after workflow creation via a Temporal workflow.
  // Workflow creation does NOT block on validation — the workflow is created immediately
  // with status.state = PENDING, then validation runs in the background.
  ai.stigmer.agentic.workflow.v1.serverless.ServerlessWorkflowValidation serverless_workflow_validation = 2;

  // SHA-256 content hash of the workflow's current valid version.
  //
  // @internal
  // The canonical hash of the whole spec (the function agents use), taken
  // with spec.execution_visibility cleared, so a version covers everything a
  // run reads from its workflow: the task list, each step's environments, the
  // declared env and the budget. Changing who sees the runs mints no version.
  // Updated only when validation produces state=VALID. Empty for workflows
  // that have never passed validation. A workflow last saved before this rule
  // holds the hash of its generated YAML until its next save.
  //
  // Consumers:
  // - Execution create pipeline reads this to pin executions to a specific version
  // - getByReference resolves ApiResourceReference.version against this and audit entries
  // - UI displays this as the current version identifier
  string version_hash = 3;
}
