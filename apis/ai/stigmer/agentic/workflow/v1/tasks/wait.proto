syntax = "proto3";

package ai.stigmer.agentic.workflow.v1.tasks;

import "ai/stigmer/commons/apiresource/field_options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Duration represents a relative time period.
//
// Fields are additive: { days: 1, hours: 12 } equals 36 hours total.
// At least one field must be non-zero.
//
// Examples:
//   - 1 week: { days: 7 }
//   - 2.5 hours: { hours: 2, minutes: 30 }
//   - 90 seconds: { minutes: 1, seconds: 30 }
message Duration {
  // The 0u literals are load-bearing (stigmer#805): these fields are uint32,
  // which CEL types as uint, and comparing uint to a signed int literal is a
  // CROSS-TYPE comparison — an opt-in CEL extension protovalidate-go enables
  // but protovalidate-java does not, so `> 0` compiles on Go and throws
  // CompilationException on Java. uint-to-uint is core CEL and portable to
  // every protovalidate implementation a schema consumer might run.
  option (buf.validate.message).cel = {
    id: "duration.non_zero"
    message: "at least one duration field must be non-zero"
    expression: "this.days > 0u || this.hours > 0u || this.minutes > 0u || this.seconds > 0u || this.milliseconds > 0u"
  };

  // Number of days to wait (24 hours each).
  uint32 days = 1;

  // Number of hours to wait.
  uint32 hours = 2;

  // Number of minutes to wait.
  uint32 minutes = 3;

  // Number of seconds to wait.
  uint32 seconds = 4;

  // Number of milliseconds to wait.
  uint32 milliseconds = 5;
}

// WaitTaskConfig defines the configuration for wait tasks that pause workflow execution.
//
// Supports both relative durations and absolute timestamps.
//
// @internal
// Implemented via Temporal timers.
//
// YAML Examples:
//
//   Relative duration:
//   - waitForApproval:
//       wait:
//         duration:
//           days: 7
//
//   Absolute timestamp:
//   - waitUntilMarketOpen:
//       wait:
//         until: "2026-03-02T09:30:00Z"
//
// Reference: zigflow-dsl-pattern-catalog.md - Task Type 8
message WaitTaskConfig {
  option (ai.stigmer.commons.apiresource.discriminator_value) = "wait";

  oneof wait_type {
    // Relative duration to wait from now.
    //
    // Use this when you want to wait for a specific amount of time
    // regardless of when the workflow reaches this task.
    //
    // Example: { days: 7 } = wait 1 week from now
    Duration duration = 1;

    // Absolute timestamp to wait until.
    //
    // Use this when you want to wait until a specific point in time.
    // If the timestamp is in the past, the task completes immediately.
    //
    // Example: "2026-03-01T09:00:00Z" = wait until March 1st, 2026 at 9am UTC
    google.protobuf.Timestamp until = 2;
  }
}
