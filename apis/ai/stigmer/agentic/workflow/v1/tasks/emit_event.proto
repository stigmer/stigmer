syntax = "proto3";

package ai.stigmer.agentic.workflow.v1.tasks;

import "ai/stigmer/commons/apiresource/field_options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// EmitEventSpec defines the CloudEvents envelope for an event to be emitted.
//
// @internal
// Follows CloudEvents semantics (type, source, subject, data) because:
// 1. CloudEvents is a graduated CNCF project with broad ecosystem support
// 2. The CNCF Serverless Workflow spec already uses CloudEvents
// 3. It provides a standard envelope that external consumers can parse
//
// Runtime-generated fields not authored here:
// - id: unique event identifier (UUID, generated at emit time)
// - specversion: always "1.0"
// - time: ISO 8601 timestamp of emission
// - datacontenttype: always "application/json" (since data is a Struct)
//
// @since T03 (P0 New Task Types)
message EmitEventSpec {
  // CloudEvents type identifier.
  // A reverse-DNS string that categorizes the event for routing and filtering.
  // Examples: "stigmer.workflow.ticket.classified", "acme.order.completed"
  string type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];

  // CloudEvents source identifier.
  // URI or URI-reference that identifies the context in which the event
  // happened. Supports ${ } expression interpolation.
  // When empty, the runtime defaults to the workflow execution URI
  // (e.g., "/workflows/{workflow_id}/executions/{execution_id}").
  string source = 2 [(ai.stigmer.commons.apiresource.is_expression) = true];

  // Event payload data.
  // Arbitrary JSON object carried as the CloudEvents data attribute.
  // Values within the Struct can contain ${ } expressions that the
  // runtime evaluates before emission.
  //
  // Unlike other Struct fields in the workflow domain (response_schema,
  // form_schema, schema) which carry JSON Schema definitions, this field
  // carries the actual event payload — not a schema.
  google.protobuf.Struct data = 3;

  // CloudEvents subject identifier.
  // Describes the subject of the event in the context of the event producer.
  // Supports ${ } expression interpolation.
  // Examples: "${ $context.ticket.id }", "${ $context.order.number }"
  string subject = 4 [(ai.stigmer.commons.apiresource.is_expression) = true];
}

// EmitEventTaskConfig defines the configuration for emit_event tasks that
// publish CloudEvents to external consumers, other workflows, audit trails,
// and metrics systems.
//
// @internal
// emit_event is the complement to listen. While listen waits for Temporal
// signals (internal workflow primitives), emit_event publishes business
// events using the CloudEvents envelope (a standard external contract).
// The delivery field bridges the two: an emitted CloudEvent can be
// delivered as a signal to another workflow's listen task (server-mediated
// per oss#517) or POSTed to an external webhook. Authoring surface added
// at oss#530; before that the runner capability existed but was
// proto-invisible.
//
// The task output is the fully-resolved CloudEvents envelope with
// runtime-generated fields populated (plus "delivery_errors" when any
// delivery target failed):
//   {
//     "id": "<generated UUID>",
//     "specversion": "1.0",
//     "type": "stigmer.workflow.ticket.classified",
//     "source": "/workflows/triage/executions/abc-123",
//     "time": "2026-05-12T14:30:00Z",
//     "subject": "TICKET-456",
//     "datacontenttype": "application/json",
//     "data": { <resolved payload> }
//   }
//
// YAML Example (emit a classification event):
//   - notify_classified:
//       emit_event:
//         event:
//           type: "stigmer.workflow.ticket.classified"
//           subject: "${ $context.ticket.id }"
//           data:
//             ticket_id: "${ $context.ticket.id }"
//             severity: "${ $context.triage.severity }"
//             category: "${ $context.triage.category }"
//             classified_by: "${ $context.workflow_instance_id }"
//       export:
//         as: "${ . }"
//
// YAML Example (emit with explicit source):
//   - publish_completion:
//       emit_event:
//         event:
//           type: "acme.order.fulfilled"
//           source: "urn:acme:fulfillment-service"
//           subject: "${ $context.order.number }"
//           data:
//             order_id: "${ $context.order.id }"
//             status: "fulfilled"
//             fulfilled_at: "${ $context.timestamp }"
//       export:
//         as: "${ . }"
//
// YAML Example (emit with delivery — webhook plus a signal to another
// workflow's listen task):
//   - notify_downstream:
//       emit_event:
//         event:
//           type: "acme.order.fulfilled"
//           subject: "${ $context.order.number }"
//           data:
//             order_id: "${ $context.order.id }"
//         delivery:
//           - webhook:
//               url: "https://hooks.acme.com/orders"
//               headers:
//                 Authorization: "Bearer ${.secrets.ACME_HOOK_TOKEN}"
//           - signal:
//               execution_id: "${ .start_shipping.execution_id }"
//               signal_name: "order-fulfilled"
message EmitEventTaskConfig {
  option (ai.stigmer.commons.apiresource.discriminator_value) = "emit_event";

  // The event specification to emit.
  // Contains the CloudEvents envelope fields (type, source, data, subject).
  // Required field.
  EmitEventSpec event = 1 [(buf.validate.field).required = true];

  // Delivery targets for the emitted event (optional).
  // When empty, the task only constructs the CloudEvents envelope and
  // exposes it as task output — no external delivery happens.
  //
  // Delivery is best-effort: a failed target never fails the task. Failures
  // are collected into the "delivery_errors" array on the task output, one
  // entry per failed target, so workflows can branch on delivery health.
  // Each target has a 30-second timeout.
  repeated EmitDeliveryTarget delivery = 2;
}

// EmitDeliveryTarget selects one destination for an emitted event.
//
// Two delivery mechanisms are supported:
// - webhook: HTTP POST the CloudEvents envelope to an external endpoint.
// - signal: deliver the envelope as a signal to another workflow
//   execution's listen task (the emit/listen pairing).
message EmitDeliveryTarget {
  oneof target {
    option (buf.validate.oneof).required = true;

    // POST the CloudEvents envelope to an HTTP endpoint.
    WebhookDelivery webhook = 1;

    // Signal another workflow execution's listen task.
    SignalDelivery signal = 2;
  }
}

// WebhookDelivery posts the CloudEvents envelope to an external HTTP
// endpoint with Content-Type: application/cloudevents+json.
//
// @internal
// Executed by the runner's emit-event activity (deliverWebhook): plain
// fetch, 30s timeout, response body never read into the envelope. Egress
// posture matches the http_call task — both let workflow authors reach
// arbitrary URLs from the runner, so any future egress policy must govern
// the two surfaces together (ruled at oss#530).
message WebhookDelivery {
  // Endpoint URL to POST the event to.
  // Can contain expressions: "https://hooks.example.com/${ $context.tenant }"
  string url = 1 [
    (ai.stigmer.commons.apiresource.is_expression) = true,
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // HTTP headers to send with the POST (optional).
  // Values can contain runtime placeholders resolved just-in-time by the
  // runner: "Authorization: Bearer ${.secrets.WEBHOOK_TOKEN}" or
  // "${.env_vars.KEY}". Secrets resolve inside the delivery activity and
  // never enter workflow history.
  map<string, string> headers = 2;
}

// SignalDelivery routes the CloudEvents envelope to another workflow
// execution as a signal, completing the emit/listen pairing: the target
// execution receives the envelope on the listen task whose signal id
// matches signal_name.
//
// @internal
// Delivery is server-mediated via the workflowexecution sendSignal RPC —
// the only sanctioned path for runner-originated signals (oss#517:
// authorization boundary, phase gate, execution-id addressing). sendSignal
// enforces can_edit on the TARGET execution, which resolves to its owner:
// cross-execution signals therefore work only between executions triggered
// by the same principal. Deliberate conservative posture, ruled at
// oss#530; a scoped can_signal relation is the named follow-up if
// cross-principal pipelines get demand.
message SignalDelivery {
  // Target workflow execution id ("wfx_..."), as returned by run/create.
  // Usually flows from a prior task's output:
  // "${ .start_processor.execution_id }"
  string execution_id = 1 [
    (ai.stigmer.commons.apiresource.is_expression) = true,
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Signal name, matching the target's listen task event id (verbatim).
  string signal_name = 2 [
    (ai.stigmer.commons.apiresource.is_expression) = true,
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}
