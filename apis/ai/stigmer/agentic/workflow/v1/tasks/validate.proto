syntax = "proto3";

package ai.stigmer.agentic.workflow.v1.tasks;

import "ai/stigmer/commons/apiresource/field_options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// ValidationFailPolicy defines what happens when a validate task's
// validation fails (schema mismatch or business rule violation).
//
// @internal
// The policy determines whether validation failure is a hard stop,
// a branch point, or an advisory warning. This is distinct from
// OnInvalidOutputPolicy (which handles LLM/agent output schema failures
// with retry semantics) — validate tasks check data correctness, not
// LLM output quality, so retry (re-prompting) is not applicable.
//
// @since T03 (P0 New Task Types)
enum ValidationFailPolicy {
  // Unspecified: defaults to VALIDATION_FAIL_RAISE behavior.
  VALIDATION_FAIL_POLICY_UNSPECIFIED = 0;

  // Task fails with a validation error.
  // The workflow transitions to error handling (try_catch or EXECUTION_FAILED).
  // The error includes detailed validation results (which rules/schema
  // constraints failed and why).
  VALIDATION_FAIL_RAISE = 1;

  // Branch to fallback_task instead of failing.
  // Requires fallback_task to be set on the ValidateTaskConfig.
  // Use when validation failure should trigger an alternative workflow
  // path (e.g., human review, re-processing, data enrichment).
  VALIDATION_FAIL_BRANCH = 2;

  // Log warnings but continue to the next task.
  // Validation errors are included in the task output under the "errors"
  // key, allowing downstream tasks to inspect what failed without
  // stopping the workflow.
  // Use for advisory validation where downstream logic handles errors
  // gracefully, or for monitoring/audit purposes.
  VALIDATION_FAIL_WARN = 3;
}

// ValidationRule defines a business rule evaluated as a boolean expression.
//
// @internal
// Rules complement JSON Schema validation by expressing constraints that
// schema alone cannot: cross-field dependencies, conditional requirements,
// and domain-specific invariants.
//
// The expression must evaluate to a boolean. When it evaluates to false,
// the rule is considered violated and the message (if provided) is included
// in the validation error output.
//
// Expressions use the same expression engine as switch_case.when for
// consistency across the workflow domain.
//
// @since T03 (P0 New Task Types)
message ValidationRule {
  // Rule identifier for error reporting and debugging.
  // Appears in validation error output so operators can identify which
  // specific rule failed.
  // Examples: "critical_needs_rationale", "customer_impact_requires_high_severity"
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 127
  ];

  // Boolean expression that must evaluate to true for the rule to pass.
  // Supports ${ } expression interpolation.
  // The expression receives the validate task's input data as its context.
  // Example: "${ .severity != 'critical' || (.rationale != null && .rationale != '') }"
  string expression = 2 [
    (ai.stigmer.commons.apiresource.is_expression) = true,
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Error message included in validation output when the rule fails.
  // Supports ${ } expression interpolation for dynamic error messages.
  // When empty, a generic message is generated from the rule name.
  // Example: "Critical severity requires a rationale"
  string message = 3 [(ai.stigmer.commons.apiresource.is_expression) = true];
}

// ValidateTaskConfig defines the configuration for validate tasks that
// perform explicit schema and business-rule validation on workflow data.
//
// @internal
// Use validate when you need an explicit validation checkpoint before
// downstream actions. This is how you distinguish "the API call succeeded"
// from "the data is safe and complete enough to continue."
//
// While switch_case + raise_error can approximate validation, a dedicated
// validate task makes the intent explicit, the error messages richer, and
// the execution trace clearer. In the execution viewer (T09), a validate
// task shows exactly what was checked, what passed, and what failed —
// visible as a distinct verification step.
//
// The task supports two complementary validation modes:
// - schema: JSON Schema validation for structural correctness
// - rules: business-rule expressions for domain-specific constraints
//
// At least one of schema or rules must be set. Both can be used together
// for comprehensive validation (schema checks structure, rules check
// business logic). This cross-field constraint is enforced at runtime
// validation since buf.validate cannot express it on individual fields.
//
// Task output includes the full validation result:
//   {
//     "valid": true/false,
//     "errors": [
//       {"rule": "critical_needs_rationale", "message": "Critical severity requires a rationale"},
//       {"path": "$.category", "message": "must have at least 1 character"}
//     ],
//     "data": <original input data>
//   }
//
// YAML Example (schema + business rules):
//   - check_triage_quality:
//       validate:
//         input: "${ $context.triage }"
//         schema:
//           type: object
//           required: [severity, category, customer_impact]
//           properties:
//             severity:
//               type: string
//               enum: [low, medium, high, critical]
//             category:
//               type: string
//               minLength: 1
//             customer_impact:
//               type: boolean
//         rules:
//           - name: critical_needs_rationale
//             expression: "${ .severity != 'critical' || (.rationale != null && .rationale != '') }"
//             message: "Critical severity requires a rationale"
//           - name: customer_impact_needs_severity
//             expression: "${ .customer_impact != true || .severity in ['high', 'critical'] }"
//             message: "Customer-impacting issues must be high or critical severity"
//         on_fail: VALIDATION_FAIL_BRANCH
//         fallback_task: human_review
//       export:
//         as: "${ . }"
//
// YAML Example (schema-only validation with warn policy):
//   - check_payload_shape:
//       validate:
//         input: "${ $context.api_payload }"
//         schema:
//           type: object
//           required: [name, email]
//           properties:
//             name:
//               type: string
//             email:
//               type: string
//               format: email
//         on_fail: VALIDATION_FAIL_WARN
//       export:
//         as: "${ . }"
message ValidateTaskConfig {
  option (ai.stigmer.commons.apiresource.discriminator_value) = "validate";

  // Expression selecting the data to validate.
  // Supports ${ } expression interpolation.
  // Example: "${ $context.triage }" to validate the triage task's output.
  string input = 1 [
    (ai.stigmer.commons.apiresource.is_expression) = true,
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // JSON Schema to validate the input data against.
  //
  // Standard JSON Schema (draft 2020-12 or compatible). The runtime
  // validates the input data against this schema and reports detailed
  // errors for any constraint violations.
  //
  // Uses the same google.protobuf.Struct + JSON Schema pattern as
  // AgentCallOutputContract.schema, LlmCallTaskConfig.response_schema,
  // and HumanInputTaskConfig.form_schema.
  //
  // At least one of schema or rules must be set.
  google.protobuf.Struct schema = 2;

  // Business rules to evaluate against the input data.
  //
  // Each rule is a boolean expression that must evaluate to true.
  // Rules complement schema validation by expressing constraints that
  // JSON Schema cannot: cross-field dependencies, conditional requirements,
  // and domain-specific invariants.
  //
  // At least one of schema or rules must be set.
  repeated ValidationRule rules = 3;

  // Policy applied when validation fails.
  // Default: VALIDATION_FAIL_RAISE (task fails with validation error).
  ValidationFailPolicy on_fail = 4;

  // Target task to branch to when on_fail is VALIDATION_FAIL_BRANCH.
  //
  // Must reference a valid task name in the same workflow.
  // Only meaningful when on_fail is VALIDATION_FAIL_BRANCH; ignored otherwise.
  // When on_fail is BRANCH and fallback_task is empty, the task fails.
  string fallback_task = 5;
}
