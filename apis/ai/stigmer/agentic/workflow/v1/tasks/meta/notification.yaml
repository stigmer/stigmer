kind: notification
display_name: "Notification"
description: "Send a notification to humans through a channel (Slack, email, Discord, etc.)."
category: event
icon: "bell"
is_ai_native: false
requires_external_service: true
documentation_url: "/docs/workflow/tasks/notification"

output_schema:
  type: object
  description: "Delivery confirmation."
  properties:
    channel:
      type: string
    recipients:
      type: array
      items:
        type: string
    delivered:
      type: boolean
    delivered_at:
      type: string
      description: "ISO 8601 timestamp of delivery."

field_groups:
  - id: core
    display_name: "Message"
    fields: [channel, recipients, subject, body]
  - id: template
    display_name: "Template"
    fields: [template]
  - id: advanced
    display_name: "Channel Options"
    fields: [metadata]

yaml_examples:
  - |
    - alert_slack:
        notification:
          channel: "slack"
          recipients:
            - "#incident-response"
            - "@oncall-lead"
          subject: "P${ $context.triage.severity } Incident: ${ $context.ticket.title }"
          body: |
            *Severity*: ${ $context.triage.severity }
            *Category*: ${ $context.triage.category }
            *Summary*: ${ $context.agent_analysis.structured.summary }
          metadata:
            thread_ts: "${ $context.slack_thread_id }"
        export:
          as: "${ . }"
