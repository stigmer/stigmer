kind: set_vars
display_name: "Set Variables"
description: "Assign values to workflow state variables using expressions."
category: data
icon: "variable"
is_ai_native: false
requires_external_service: false
documentation_url: "/docs/guides/workflows/task-types/set-vars"

output_schema:
  type: "null"
  description: "set_vars mutates workflow context directly; it does not produce task output."

field_groups:
  - id: core
    display_name: "Variables"
    fields: [variables]

yaml_examples:
  - |
    - name: initialize
      kind: set_vars
      task_config:
        variables:
          status: "pending"
          timestamp: "${ now() }"
          request_id: "${ $context.input.id }"
