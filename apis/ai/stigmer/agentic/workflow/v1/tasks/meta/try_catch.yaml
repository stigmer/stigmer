kind: try_catch
display_name: "Try/Catch"
description: "Handle errors from a block of tasks with recovery logic."
category: control_flow
icon: "shield"
is_ai_native: false
requires_external_service: false
documentation_url: "/docs/guides/workflows/task-types/try-catch"

output_schema:
  type: object
  description: "Output from the try block (success) or catch block (recovery)."

field_groups:
  - id: core
    display_name: "Error Handling"
    fields: [try, catch]

yaml_examples:
  - |
    - name: safe_api_call
      kind: try_catch
      task_config:
        try:
          - name: risky_call
            kind: http_call
            task_config:
              method: "POST"
              endpoint:
                uri: "https://api.unreliable.com/submit"
        catch:
          as: error
          do:
            - name: log_failure
              kind: set_vars
              task_config:
                variables:
                  error_message: "${ $error.message }"
