kind: emit_event
display_name: "Emit Event"
description: "Publish a CloudEvents-formatted event for external consumers or other workflows."
category: event
icon: "send"
is_ai_native: false
requires_external_service: false
documentation_url: "/docs/workflow/tasks/emit-event"

output_schema:
  type: object
  description: "Fully-resolved CloudEvents envelope with runtime-generated fields."
  properties:
    id:
      type: string
      description: "Generated UUID for this event."
    specversion:
      type: string
      description: "Always '1.0'."
    type:
      type: string
    source:
      type: string
    time:
      type: string
      description: "ISO 8601 timestamp of emission."
    subject:
      type: string
    datacontenttype:
      type: string
      description: "Always 'application/json'."
    data:
      type: object

field_groups:
  - id: core
    display_name: "Event Specification"
    fields: [event]

yaml_examples:
  - |
    - notify_classified:
        emit_event:
          event:
            type: "stigmer.workflow.ticket.classified"
            subject: "${ $context.ticket.id }"
            data:
              ticket_id: "${ $context.ticket.id }"
              severity: "${ $context.triage.severity }"
              category: "${ $context.triage.category }"
        export:
          as: "${ . }"
