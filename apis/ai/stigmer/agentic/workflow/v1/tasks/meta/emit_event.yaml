kind: emit_event
display_name: "Emit Event"
description: "Publish a CloudEvents-formatted event for external consumers or other workflows."
category: event
icon: "send"
is_ai_native: false
requires_external_service: false
documentation_url: "/docs/guides/workflows/task-types/emit-event"

output_schema:
  type: object
  description: "Fully-resolved CloudEvents envelope with runtime-generated fields."
  properties:
    id:
      type: string
      description: "Generated UUID for this event."
    specversion:
      type: string
      description: "Always '1.0'."
    type:
      type: string
    source:
      type: string
    time:
      type: string
      description: "ISO 8601 timestamp of emission."
    subject:
      type: string
    datacontenttype:
      type: string
      description: "Always 'application/json'."
    data:
      type: object
    delivery_errors:
      type: array
      description: >-
        Present only when at least one delivery target failed. One entry per
        failed target; delivery is best-effort and never fails the task.
      items:
        type: string

field_groups:
  - id: core
    display_name: "Event Specification"
    fields: [event]
  - id: delivery
    display_name: "Delivery"
    fields: [delivery]

yaml_examples:
  - |
    - name: notify_classified
      kind: emit_event
      task_config:
        event:
          type: "stigmer.workflow.ticket.classified"
          subject: "${ $context.ticket.id }"
          data:
            ticket_id: "${ $context.ticket.id }"
            severity: "${ $context.triage.severity }"
            category: "${ $context.triage.category }"
      export:
        as: "${ . }"
  - |
    - name: notify_downstream
      kind: emit_event
      task_config:
        event:
          type: "acme.order.fulfilled"
          subject: "${ $context.order.number }"
          data:
            order_id: "${ $context.order.id }"
        delivery:
          - webhook:
              url: "https://hooks.acme.com/orders"
              headers:
                Authorization: "Bearer ${.secrets.ACME_HOOK_TOKEN}"
          - signal:
              execution_id: "${ .start_shipping.execution_id }"
              signal_name: "order-fulfilled"
