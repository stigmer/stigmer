kind: agent_call
display_name: "Agent Call"
description: "Invoke an AI agent for complex, multi-step reasoning with tool access."
category: ai
icon: "bot"
is_ai_native: true
requires_external_service: true
documentation_url: "/docs/guides/workflows/task-types/agent-call"

output_schema:
  type: object
  description: "Agent execution result with dual-channel output."
  properties:
    structured:
      type: object
      description: "Validated JSON output (when output contract is configured)."
    final_text:
      type: string
      description: "Human-readable agent response."
    agent_execution_id:
      type: string
      description: "Execution ID for drill-down into agent trace."
    usage_summary:
      type: object
      properties:
        total_tokens:
          type: integer
        estimated_cost_usd:
          type: number
        tool_call_count:
          type: integer
        artifact_count:
          type: integer

field_groups:
  - id: core
    display_name: "Agent Configuration"
    fields: [agent, message, org]
  - id: runtime
    display_name: "Runtime Settings"
    fields: [env, config]
  - id: budget
    display_name: "Budget Limits"
    description: "Cost controls for this agent call. Set max_cost_micros on the config field."
    fields: [config]
  - id: output
    display_name: "Structured Output"
    fields: [output]

yaml_examples:
  - |
    - name: triage_ticket
      kind: agent_call
      task_config:
        agent: "support-triage"
        message: "${ .ticket.description }"
        output:
          schema:
            type: object
            required: [severity, category]
            properties:
              severity:
                type: string
                enum: [low, medium, high, critical]
              category:
                type: string
          on_invalid: ON_INVALID_RETRY
          max_retries: 2
      export:
        as: "${ .structured }"
  - |
    - name: fix_flaky_test
      kind: agent_call
      task_config:
        agent: "code-reviewer"
        message: "Fix the flaky test in ${ .failing_test }"
        harness: HARNESS_CURSOR
        run_config:
          model_name: "composer-2.5"
          max_cost_usd: 0.50
          # Fast tier: billed at the model's fast rates. Valid only for
          # models with a fast pricing tier; refused at create otherwise.
          # The shorthand spellings "standard"/"fast" are also accepted.
          service_tier: SERVICE_TIER_FAST
  - |
    - name: deep_review
      kind: agent_call
      task_config:
        agent: "code-reviewer"
        message: "Review the architecture of ${ .module }"
        harness: HARNESS_CURSOR
        run_config:
          model_name: "claude-haiku-4-5"
          # Thinking mode: the model's extended-reasoning variant, billed
          # at base per-token rates (reasoning tokens count as output).
          # Valid only for models with the thinking capability; refused at
          # create otherwise. The shorthand spellings "disabled"/"enabled"
          # are also accepted.
          thinking_mode: THINKING_MODE_ENABLED
