kind: fork
display_name: "Fork"
description: "Execute multiple branches in parallel, optionally racing."
category: control_flow
icon: "git-fork"
is_ai_native: false
requires_external_service: false
documentation_url: "/docs/guides/workflows/task-types/fork"

output_schema:
  type: object
  description: "Combined results from all branches (or winner if compete=true)."

field_groups:
  - id: core
    display_name: "Parallel Branches"
    fields: [branches, compete]

yaml_examples:
  - |
    - name: parallel_enrichment
      kind: fork
      task_config:
        branches:
          - name: fetch_profile
            do:
              - name: get_profile
                kind: http_call
                task_config:
                  method: "GET"
                  endpoint:
                    uri: "https://api.example.com/users/${ $context.user_id }"
          - name: fetch_history
            do:
              - name: get_history
                kind: http_call
                task_config:
                  method: "GET"
                  endpoint:
                    uri: "https://api.example.com/history/${ $context.user_id }"
        compete: false
