kind: eval
display_name: "Evaluate (LLM Judge)"
description: "Assess semantic quality, correctness, safety, or completeness of content using an LLM judge."
category: ai
icon: "scale"
is_ai_native: true
requires_external_service: false
documentation_url: "/docs/guides/workflow-tasks/eval"

output_schema:
  type: object
  description: "Evaluation result with pass/fail, score, and judge reasoning."
  properties:
    pass:
      type: boolean
      description: "Whether the subject passed evaluation."
    score:
      type: number
      description: "Numeric score (0.0-1.0). Present for numeric_score and multi_criteria modes."
    reasoning:
      type: string
      description: "The judge's explanation of its assessment."
    criteria:
      type: array
      description: "Per-criterion scores and reasoning. Present only for multi_criteria mode."
      items:
        type: object
        properties:
          name:
            type: string
          score:
            type: number
          reasoning:
            type: string
    model_used:
      type: string
      description: "The LLM model that served as judge."
    subject:
      description: "The original subject data that was evaluated."

field_groups:
  - id: core
    display_name: "Evaluation Setup"
    fields: [model, subject, rubric]
  - id: scoring
    display_name: "Scoring"
    fields: [scoring_mode, threshold, criteria]
  - id: policy
    display_name: "Failure Policy"
    fields: [on_fail, fallback_task]
  - id: advanced
    display_name: "Advanced"
    fields: [system_prompt, max_cost_micros]

yaml_examples:
  - |
    - check_summary_quality:
        call: eval
        with:
          model: "gpt-4o"
          subject: "${ $context.summarize.text }"
          rubric: |
            Evaluate whether this summary accurately captures the key points
            of the source document without hallucinations or omissions.
          scoring_mode: EVAL_PASS_FAIL
          on_fail: EVAL_FAIL_BRANCH
          fallback_task: regenerate_summary
        export:
          as: "${ . }"
  - |
    - score_translation:
        call: eval
        with:
          model: "gpt-4o"
          subject: "${ $context.translate.text }"
          rubric: |
            Rate the quality of this translation on accuracy, fluency,
            and preservation of meaning.
          scoring_mode: EVAL_NUMERIC_SCORE
          threshold: 0.7
          on_fail: EVAL_FAIL_WARN
        export:
          as: "${ . }"
  - |
    - evaluate_response:
        call: eval
        with:
          model: "gpt-4o"
          subject: "${ $context.agent_response }"
          rubric: "Evaluate this customer support response."
          scoring_mode: EVAL_MULTI_CRITERIA
          threshold: 0.75
          criteria:
            - name: accuracy
              description: "Is the information factually correct?"
              weight: 3.0
            - name: helpfulness
              description: "Does it address the customer's actual question?"
              weight: 2.0
            - name: tone
              description: "Is the tone professional and empathetic?"
              weight: 1.0
          on_fail: EVAL_FAIL_RAISE
        export:
          as: "${ . }"
