kind: for_each
display_name: "For Each"
description: "Iterate over a collection, executing tasks for each item."
category: control_flow
icon: "repeat"
is_ai_native: false
requires_external_service: false
documentation_url: "/docs/guides/workflows/task-types/for-each"

output_schema:
  type: array
  description: "Collected results from each iteration."

field_groups:
  - id: core
    display_name: "Iteration"
    fields: [each, in, do]

yaml_examples:
  - |
    - name: process_items
      kind: for_each
      task_config:
        each: item
        in: "${ $context.items }"
        do:
          - name: classify_item
            kind: llm_call
            task_config:
              model: "gpt-4o-mini"
              prompt: "Classify: ${ $item.description }"
