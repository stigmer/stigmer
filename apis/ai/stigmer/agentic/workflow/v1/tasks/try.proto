syntax = "proto3";

package ai.stigmer.agentic.workflow.v1.tasks;

import "ai/stigmer/agentic/workflow/v1/spec.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "buf/validate/validate.proto";

// TryTaskConfig defines the configuration for try_catch tasks that handle errors.
//
// @internal
// YAML Example:
//   - taskName:
//       try:
//         - attemptTask:
//             call: http
//             with:
//               method: POST
//               endpoint:
//                 uri: https://api.example.com/flaky
//       catch:
//         as: error
//         do:
//           - errorHandler:
//               call: http
//               with:
//                 body:
//                   error: ${ .error }
//
// Reference: zigflow-dsl-pattern-catalog.md - Task Type 6
message TryTaskConfig {
  option (ai.stigmer.commons.apiresource.discriminator_value) = "try_catch";

  // Tasks to attempt (at least one required).
  // If any task fails, execution jumps to catch block.
  repeated ai.stigmer.agentic.workflow.v1.WorkflowTask try = 1 [(buf.validate.field).repeated.min_items = 1];

  // Catch block for error handling (optional).
  // If not provided, errors propagate to parent.
  CatchBlock catch = 2;
}

// CatchBlock defines error handling logic.
message CatchBlock {
  // Variable name to store the error (optional).
  // Accessible via ${ .error } in catch tasks.
  string as = 1;

  // Tasks to execute when error is caught.
  repeated ai.stigmer.agentic.workflow.v1.WorkflowTask do = 2 [(buf.validate.field).repeated.min_items = 1];

  // Whether to run compensation tasks for already-completed try tasks
  // before executing the catch do block.
  //
  // When true, the runtime walks the compensation stack (completed tasks
  // that declared a `compensate` block) in reverse order and executes
  // each task's compensation actions. After all compensations complete
  // (or fail), the catch `do` block runs as normal.
  //
  // Compensation failures do not prevent the catch block from running.
  // They are logged and included in the task output for diagnostics.
  //
  // Default: false (no compensation — preserves pre-T17 behavior).
  //
  // @since T17 (Advanced Agentic Orchestration)
  bool compensate = 3;
}
