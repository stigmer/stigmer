syntax = "proto3";

package ai.stigmer.agentic.workflow.v1.tasks;

import "ai/stigmer/commons/apiresource/field_options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// HttpCallTaskConfig defines the configuration for http_call tasks that make HTTP requests.
//
// @internal
// YAML Example:
//   - taskName:
//       call: http
//       with:
//         method: POST
//         endpoint:
//           uri: https://api.example.com/data
//         headers:
//           Authorization: "Bearer ${TOKEN}"
//         body:
//           field1: value
//
// Reference: zigflow-dsl-pattern-catalog.md - Task Type 2
message HttpCallTaskConfig {
  option (ai.stigmer.commons.apiresource.discriminator_value) = "http_call";

  // HTTP method (GET, POST, PUT, DELETE, PATCH).
  string method = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "GET",
        "POST",
        "PUT",
        "DELETE",
        "PATCH"
      ]
    }
  ];

  // HTTP endpoint configuration.
  HttpEndpoint endpoint = 2 [(buf.validate.field).required = true];

  // HTTP headers (optional).
  // Values can contain expressions: "Bearer ${TOKEN}"
  map<string, string> headers = 3;

  // Request body (optional).
  // Can be any JSON structure. Supports expressions in string values.
  google.protobuf.Struct body = 4;

  // Request timeout in seconds. Max: 300 (5 minutes).
  // Optional — unset (0) leaves the request bounded by the runner's activity
  // timeout. When set, the runner aborts the request at this budget and
  // fails the task with HTTP_CALL_TIMEOUT (non-retryable — catchable with
  // try/catch); the activity timeout widens to fit (#686).
  //
  // Unset (0) is valid: proto3 implicit presence makes an omitted field
  // indistinguishable from 0, so the range rule must not fire on it (#673).
  int32 timeout_seconds = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 300
    }
  ];
}

// HttpEndpoint defines the HTTP endpoint to call.
message HttpEndpoint {
  // URI of the endpoint.
  // Can contain expressions: "https://api.example.com/${.resource}"
  string uri = 1 [
    (ai.stigmer.commons.apiresource.is_expression) = true,
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}
