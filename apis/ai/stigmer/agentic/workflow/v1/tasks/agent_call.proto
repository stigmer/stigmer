syntax = "proto3";

package ai.stigmer.agentic.workflow.v1.tasks;

import "ai/stigmer/agentic/agentexecution/v1/spec.proto";
import "ai/stigmer/agentic/workflow/v1/tasks/common.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// AgentCallTaskConfig defines the configuration for agent_call tasks that invoke AI agents.
//
// @internal
// The agent is referenced by org/slug format (e.g., "stigmer/code-reviewer").
// Resolution order:
// 1. If org is specified: look in that org's agents
// 2. If org is empty: use the workflow's org
// 3. Before external lookup, check manifest (current deployment)
//
// The workflow's execution context (environment variables, secrets) is
// passed to the agent invocation, allowing agents to access workflow state.
//
// YAML Example (without structured output):
//   - analyze:
//       call: agent
//       with:
//         agent: "code-reviewer"
//         message: "Review this code: ${ $context.fetchCode.body }"
//         env:
//           GITHUB_TOKEN: "${ .secrets.GH_TOKEN }"
//         config:
//           model: "claude-3-5-sonnet"
//           timeout: 300
//
// YAML Example (with structured output):
//   - triage_ticket:
//       call: agent
//       with:
//         agent: "support-triage"
//         message: "${ .ticket.description }"
//         output:
//           schema:
//             type: object
//             required: [severity, category, customer_impact]
//             properties:
//               severity:
//                 type: string
//                 enum: [low, medium, high, critical]
//               category:
//                 type: string
//               customer_impact:
//                 type: boolean
//               rationale:
//                 type: string
//           on_invalid: ON_INVALID_RETRY
//           max_retries: 2
//           fallback_task: human_review
//       export:
//         as: "${ .structured }"
//
// Reference: design doc at stigmer/_cursor/add-agent-config-to-workflow.md
message AgentCallTaskConfig {
  option (ai.stigmer.commons.apiresource.discriminator_value) = "agent_call";

  // Agent reference in "org/slug" or "slug" format.
  // - "slug" only: uses the workflow's organization
  // - "org/slug": explicit organization reference
  // Examples: "code-reviewer", "stigmer/code-reviewer", "acme/data-analyst"
  // Required field.
  string agent = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 127
  ];

  // Explicit organization for agent resolution. Optional.
  // If empty, the org is parsed from the agent field or defaults to workflow's org.
  // Use this when you need to override the parsed org.
  string org = 2;

  // Instructions/prompt to send to the agent.
  // Supports interpolation of workflow variables using JQ expressions.
  // Example: "Analyze this code: ${ $context.fetchCode.body }"
  // Required field.
  string message = 3 [
    (ai.stigmer.commons.apiresource.is_expression) = true,
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Runtime environment variables to pass to the agent.
  // Values can be literal strings or JQ expressions that reference
  // workflow context or secrets.
  // Example: {"GITHUB_TOKEN": "${ .secrets.GH_TOKEN }"}
  // Optional.
  map<string, string> env = 4;

  // Execution configuration for the agent invocation.
  // Optional - defaults are applied if not specified.
  AgentExecutionConfig config = 5;

  // Structured output contract for this agent call.
  //
  // When set, the workflow runner extracts structured JSON from the agent's
  // final response and validates it against the declared schema. The validated
  // JSON is placed in the task output under the "structured" key, enabling
  // reliable downstream routing via switch_case expressions.
  //
  // When not set, the task output contains the agent's raw text response
  // (backward compatible with existing workflows).
  //
  // @since T02 (Structured Agent Output Model)
  AgentCallOutputContract output = 6;
}

// AgentCallOutputContract defines the structured output contract for an agent_call task.
//
// When configured, the workflow runner extracts structured JSON from the agent's
// final response and validates it against the provided JSON Schema. The validated
// JSON becomes the task's primary output under the "structured" key, accessible
// via export expressions (e.g., export.as: "${ .structured }").
//
// This enables reliable downstream routing: switch_case can evaluate expressions
// against typed fields (e.g., "${ $context.triage.severity == 'critical' }")
// rather than parsing unstructured prose.
//
// The dual-channel output model populates WorkflowTask.output as:
//   {
//     "structured": { <validated JSON matching the schema> },
//     "final_text": "<the agent's human-readable response>",
//     "agent_execution_id": "<execution ID for drill-down>",
//     "usage_summary": {
//       "total_tokens": 4523,
//       "estimated_cost_usd": 0.045,
//       "tool_call_count": 3,
//       "artifact_count": 1
//     }
//   }
//
// YAML Example:
//   output:
//     schema:
//       type: object
//       required: [severity, category, customer_impact]
//       properties:
//         severity:
//           type: string
//           enum: [low, medium, high, critical]
//         category:
//           type: string
//         customer_impact:
//           type: boolean
//         rationale:
//           type: string
//     on_invalid: ON_INVALID_RETRY
//     max_retries: 2
//     fallback_task: human_review
//
// @since T02 (Structured Agent Output Model)
message AgentCallOutputContract {
  // JSON Schema that the agent's structured output must conform to.
  //
  // Standard JSON Schema (draft 2020-12 or compatible). The workflow runner
  // extracts JSON from the agent's final response and validates it against
  // this schema. If validation fails, the on_invalid policy determines
  // what happens next.
  //
  // The schema is carried as a google.protobuf.Struct to preserve the
  // existing kind+Struct envelope pattern and allow YAML authors to write
  // standard JSON Schema inline without a Stigmer-specific schema language.
  google.protobuf.Struct schema = 1 [(buf.validate.field).required = true];

  // Policy when agent output fails schema validation.
  // Default: ON_INVALID_FAIL (task fails immediately).
  OnInvalidOutputPolicy on_invalid = 2;

  // Maximum retry attempts when on_invalid is ON_INVALID_RETRY.
  //
  // Each retry re-prompts the agent with the specific validation errors and
  // the expected schema, giving the agent an opportunity to self-correct.
  //
  // Only meaningful when on_invalid is ON_INVALID_RETRY; ignored otherwise.
  // Default: 1. Valid range: 1-5.
  int32 max_retries = 3 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 5
  ];

  // Target task to branch to when schema validation cannot be resolved.
  //
  // Used in two scenarios:
  // 1. on_invalid is ON_INVALID_RETRY and all retries are exhausted
  // 2. on_invalid is ON_INVALID_FALLBACK (immediate branch, no retry)
  //
  // Must reference a valid task name in the same workflow.
  // When empty and retries are exhausted, the task fails.
  string fallback_task = 4;
}

// AgentExecutionConfig defines optional execution parameters for agent calls.
// These settings override the agent's default configuration for this specific invocation.
message AgentExecutionConfig {
  // LLM model to use for this invocation.
  // Example: "claude-3-5-sonnet", "gpt-4", "claude-3-opus"
  // Optional - uses agent's default model if not specified.
  string model = 1;

  // Timeout for agent execution in seconds.
  // Default: 300 (5 minutes)
  // Optional.
  int32 timeout = 2 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 3600 // max 1 hour
  ];

  // Temperature for LLM sampling (0.0 to 1.0).
  // Lower = more deterministic, Higher = more creative
  // Default: 0.7
  // Optional.
  float temperature = 3 [
    (buf.validate.field).float.gte = 0.0,
    (buf.validate.field).float.lte = 1.0
  ];

  // Context management configuration for this agent invocation.
  // Controls automatic summarization behavior for long-running conversations.
  // When specified, overrides model defaults from the Model Registry.
  //
  // @internal
  // @since Phase 3 (Context Summarization Architecture)
  //
  // Use cases:
  // - Disable summarization for short-lived agents
  // - Custom thresholds for agents with specific context requirements
  // - Fine-tune summarization behavior per workflow task
  //
  // Example YAML:
  //   config:
  //     model: "claude-sonnet-4.5"
  //     context_management:
  //       custom_trigger_threshold: 150000
  //       custom_target_tokens: 120000
  ai.stigmer.agentic.agentexecution.v1.ContextManagementConfig context_management = 4;

  // Per-agent-call cost cap in micro-USD (1 USD = 1,000,000 micros).
  // When set, the runtime terminates this agent call if its accumulated cost
  // exceeds this limit. This uses the workflow domain's micro-USD convention
  // and provides per-task cost control at the workflow level.
  // The runtime checks both: per-task limit first, then workflow remaining budget.
  // Optional — when 0, no per-task cost limit is enforced.
  //
  // @since T05 (Workflow-Level Budget Primitives)
  int64 max_cost_micros = 5;
}
