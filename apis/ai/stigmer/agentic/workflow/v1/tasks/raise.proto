syntax = "proto3";

package ai.stigmer.agentic.workflow.v1.tasks;

import "ai/stigmer/commons/apiresource/field_options.proto";
import "buf/validate/validate.proto";

// RaiseTaskConfig defines the configuration for raise_error tasks that raise errors.
//
// @internal
// YAML Example:
//   - taskName:
//       raise:
//         error: ValidationError
//         message: ${ .errorMessage }
//
// Reference: zigflow-dsl-pattern-catalog.md - Task Type 11
message RaiseTaskConfig {
  option (ai.stigmer.commons.apiresource.discriminator_value) = "raise_error";

  // Error type/name.
  string error = 1 [
    (ai.stigmer.commons.apiresource.is_expression) = true,
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Error message.
  // Can contain expressions: "${ .errorMessage }"
  // Optional — when omitted, the raised error carries only the error
  // type/name. (The runtime maps this to the problem-details `detail`
  // field only when present; requiring it was contract fiction, #685.)
  string message = 2 [(ai.stigmer.commons.apiresource.is_expression) = true];
}
