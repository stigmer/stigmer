syntax = "proto3";

package ai.stigmer.agentic.workflow.v1;

import "ai/stigmer/agentic/workflow/v1/api.proto";
import "ai/stigmer/agentic/workflow/v1/io.proto";
import "ai/stigmer/agentic/workflow/v1/version.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// WorkflowQueryController handles read operations for workflows.
service WorkflowQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = workflow;

  // Get a single workflow by ID.
  rpc get(WorkflowId) returns (Workflow) {
    option (ai.stigmer.commons.rpc.config).resource_kind = workflow;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get workflow";
  }

  // Get a workflow by its organization-scoped reference (org/slug) with version support.
  //
  // Version resolution (via ApiResourceReference.version field):
  // - Empty/"latest" → Returns the current version
  // - Tag name (e.g., "stable", "v1.0") → Resolves to the version with this tag
  // - SHA256 hash (64 hex chars) → Returns the exact immutable version
  //
  // @internal
  // Custom authorization in handler — checks both direct resource access
  // and organization-level visibility permissions.
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (Workflow) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List version history for a workflow.
  //
  // Returns all historical versions ordered by applied_at (newest first).
  // Each entry includes the version hash, applied timestamp, actor, tag,
  // git provenance, and the validated CNCF YAML for historical access.
  //
  // @internal
  // Authorization is handled in the handler after resolving the workflow.
  // (Input uses org+slug, not workflow ID, so proto-level auth cannot work)
  //
  // @since Workflow Versioning
  rpc listVersions(ListWorkflowVersionsInput) returns (ListWorkflowVersionsResponse) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Get a specific historical version of a workflow by its content hash.
  //
  // Used by the runner (to hydrate execution from a pinned version) and
  // the execution viewer (to render the graph for historical executions).
  //
  // @internal
  // Authorization uses can_view on the workflow resource.
  //
  // @since Workflow Versioning
  rpc getVersion(GetWorkflowVersionInput) returns (WorkflowVersionEntry) {
    option (ai.stigmer.commons.rpc.config).resource_kind = workflow;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "workflow_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get workflow version";
  }
}
