syntax = "proto3";

package ai.stigmer.agentic.workflow.v1;

import "ai/stigmer/agentic/workflow/v1/api.proto";
import "ai/stigmer/agentic/workflow/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// WorkflowQueryController handles read operations for workflows.
service WorkflowQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = workflow;

  // Get a single workflow by ID.
  rpc get(WorkflowId) returns (Workflow) {
    option (ai.stigmer.commons.rpc.config).resource_kind = workflow;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get workflow";
  }

  // Get a workflow by its organization-scoped reference (org/slug).
  // Resolves a human-readable reference like "stigmer/deploy" to the full Workflow resource.
  //
  // @internal
  // Custom authorization in handler — checks both direct resource access
  // and organization-level visibility permissions.
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (Workflow) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
