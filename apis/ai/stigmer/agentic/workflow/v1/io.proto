syntax = "proto3";

package ai.stigmer.agentic.workflow.v1;

import "ai/stigmer/agentic/workflow/v1/enum.proto";
import "buf/validate/validate.proto";

// WorkflowId wraps a workflow identifier.
message WorkflowId {
  string value = 1 [(buf.validate.field).required = true];
}

// UpdateWorkflowRunVisibilityInput targets the run-observability setting
// of a single workflow.
//
// Mirrors the shape of commons UpdateVisibilityInput, but for the SEPARATE
// run-visibility axis (see WorkflowRunVisibility). A dedicated
// message keeps the two visibility concepts from being conflated.
message UpdateWorkflowRunVisibilityInput {
  // ID of the workflow whose run visibility is being updated.
  string resource_id = 1 [(buf.validate.field).required = true];

  // The new run-visibility setting. Must not be unspecified (0).
  WorkflowRunVisibility run_visibility = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}
