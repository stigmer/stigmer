syntax = "proto3";

package ai.stigmer.agentic.workflow.v1;

import "ai/stigmer/agentic/workflow/v1/api.proto";
import "ai/stigmer/agentic/workflow/v1/io.proto";
import "ai/stigmer/agentic/workflow/v1/serverless/validation.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// WorkflowCommandController handles write operations for workflows.
service WorkflowCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = workflow;

  // Create or update a workflow.
  //
  // @internal
  // The authorization and state-operation are determined depending on whether the workflow
  // is going to be created or updated which is determined as part of the request execution.
  rpc apply(Workflow) returns (Workflow);

  // Create a workflow.
  //
  // @internal
  // Authorization:
  // - Organization-scoped workflows: Caller must have can_create_workflow permission in the organization
  // - Platform-scoped workflows: Caller must be a platform operator (handled automatically by common auth step)
  rpc create(Workflow) returns (Workflow) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_workflow;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to create workflow in this organization";
  }

  // Update an existing workflow.
  rpc update(Workflow) returns (Workflow) {
    option (ai.stigmer.commons.rpc.config).resource_kind = workflow;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update workflow";
  }

  // Delete a workflow.
  rpc delete(WorkflowId) returns (Workflow) {
    option (ai.stigmer.commons.rpc.config).resource_kind = workflow;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete workflow";
  }

  // Validate a workflow spec without persisting it.
  //
  // Runs the same two-layer validation pipeline used by create/update:
  //   Layer 1: Proto field constraints (buf validate / protovalidate)
  //   Layer 2: Temporal-based structural validation (Go activity: proto → YAML → Zigflow)
  //
  // Returns ServerlessWorkflowValidation with:
  //   - VALID: Workflow structure passed all checks
  //   - INVALID: User error (bad structure, missing fields, unknown task kinds)
  //   - FAILED: System error (Temporal unavailable, converter crash)
  //
  // This RPC does NOT persist, authorize, or create instances. It is a
  // pure validation endpoint suitable for iterative authoring workflows
  // where the caller needs fast feedback before committing.
  //
  // @internal
  // Authorization: Uses the same permission as create — caller must have
  // can_create_workflow in the org. This prevents unauthenticated abuse
  // of the validation pipeline while allowing any user who could create
  // a workflow to also validate one.
  rpc validateSpec(Workflow) returns (ai.stigmer.agentic.workflow.v1.serverless.ServerlessWorkflowValidation) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_workflow;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to validate workflow in this organization";
  }
}
