syntax = "proto3";

package ai.stigmer.agentic.run.v1;

import "buf/validate/validate.proto";

// EvalCaseContext is what one eval case gives its try beyond
// the prompt: a starting folder, reference folders, an earlier
// conversation, variables, and stand-ins for the plugin's MCP servers.
//
// @internal
// Composed only by the server's eval case workflow; run create
// refuses it on any request that is not server-composed. Every path is
// relative to the case source's root and names a file in its archive: the
// plugin's at plugin_digest, or the Eval's at eval_digest (exactly one of
// plugin_id and eval_id is set). The runner downloads and verifies the
// archive itself, an Eval's through the reads that ask can_view, so no
// suite byte travels in this message. The server decides what the try runs
// (the reader's checks, the per-target plan, which servers are mocked);
// the runner executes it and never re-reads the suite.
message EvalCaseContext {
  option (buf.validate.message).cel = {
    id: "eval_case.one_source"
    message: "exactly one of plugin_id and eval_id names the case's archive"
    expression: "(this.plugin_id != '') != (this.eval_id != '')"
  };
  option (buf.validate.message).cel = {
    id: "eval_case.plugin_digest"
    message: "a plugin's case names the plugin version it runs"
    expression: "this.plugin_id == '' || this.plugin_digest.matches('^[a-f0-9]{64}$')"
  };
  option (buf.validate.message).cel = {
    id: "eval_case.eval_digest"
    message: "an Eval's case names the Eval version it runs"
    expression: "this.eval_id == '' || this.eval_digest.matches('^[a-f0-9]{64}$')"
  };
  option (buf.validate.message).cel = {
    id: "eval_case.plugin_suite_dir"
    message: "a plugin's case names its suite's directory"
    expression: "this.plugin_id == '' || this.suite_dir != ''"
  };

  // ID of the plugin whose case this is; empty for an Eval's case.
  string plugin_id = 1;

  // The plugin version (archive digest) the eval run stamped.
  string plugin_digest = 2;

  // The suite's directory, as in "evals"; empty for an Eval's case, whose
  // suite is its archive's root.
  //
  // @internal
  // A scaffold may reach files beside its case (a shared fixture), as it
  // does in Claude Code, so the whole suite is extracted for it.
  string suite_dir = 3;

  // The case's directory, as in "evals/fix-the-test".
  string case_dir = 4 [(buf.validate.field).string.min_len = 1];

  // The Bash script that builds the starting folder; empty for none.
  string scaffold_script = 5;

  // Directories the agent may read during the run.
  repeated string add_dirs = 6 [(buf.validate.field).repeated.max_items = 32];

  // A Claude Code transcript (.jsonl) the try resumes; empty for none.
  string history_file = 7;

  // EVAL_* variables the agent's shell and the plugin's hooks receive.
  map<string, string> env = 8 [(buf.validate.field).map = {
    max_pairs: 64
    keys: {
      string: {pattern: "^EVAL_[A-Z0-9_]*$"}
    }
    values: {
      string: {max_len: 4096}
    }
  }];

  // The plugin's MCP servers answered by stand-ins, one per server.
  repeated EvalMockServer mocks = 9 [(buf.validate.field).repeated.max_items = 32];

  // The model agent stand-ins answer with; empty uses the runner's default.
  string agent_mock_model = 10 [(buf.validate.field).string.max_len = 128];

  // Calls the agent stand-ins may answer in this try, together.
  int32 agent_mock_call_budget = 11 [(buf.validate.field).int32 = {
    gte: 0
    lte: 800
  }];

  // The files the case's graders read, relative to the workspace. The
  // runner returns their contents after the turn in
  // RunStatus.eval_files, so a grader can read a file the try did not
  // change (one the scaffold wrote, for example).
  repeated string read_files = 12 [(buf.validate.field).repeated = {
    max_items: 64
    items: {
      string: {
        min_len: 1
        max_len: 1024
      }
    }
  }];

  // The plugin's name, as a turn names its MCP servers
  // (`plugin_<plugin>_<server>`) and a hook reads a stand-in's origin.
  string plugin_name = 13 [(buf.validate.field).string.max_len = 256];

  // ID of the Eval whose case this is; empty for a plugin's case.
  string eval_id = 14 [(buf.validate.field).string.max_len = 128];

  // The Eval version (archive digest) the eval run stamped.
  string eval_digest = 15;
}

// EvalFiles is the content, after an eval try's turn, of each
// file its case's graders read (EvalCaseContext.read_files).
//
// @internal
// Written once by the runner with the turn's terminal status, read only by
// the case workflow's graders.
message EvalFiles {
  // Each file, once, in the order read_files names them.
  repeated EvalFile files = 1 [(buf.validate.field).repeated.max_items = 64];
}

// EvalFile is one file's content after the turn.
message EvalFile {
  // The path as the case's graders name it.
  string path = 1 [(buf.validate.field).string.min_len = 1];

  // What the runner found at the path.
  oneof content {
    // The file's text.
    string text = 2;

    // The file is not text.
    bool binary = 3;

    // Nothing is at the path.
    bool absent = 4;

    // The file could not be read, and why (too large, not a regular file,
    // outside the workspace).
    string unreadable = 5;
  }
}

// EvalMockServer is one MCP server answered by a stand-in.
message EvalMockServer {
  // The directory under mocks/ the stand-in answers from: a plugin's
  // server key for a plugin's case, the server's name in the turn for an
  // Eval's.
  string server = 1 [(buf.validate.field).string.min_len = 1];

  // The name the stand-in is registered under in the turn, the real
  // server's own.
  string segment = 2 [(buf.validate.field).string.min_len = 1];

  // The mocked tools; a tool not listed is not offered.
  repeated EvalMockTool tools = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 128
  }];

  // The server's saved tools/list response, for real descriptions and
  // input schemas; empty for none.
  string tools_file = 4;

  // Where the real server lives in the turn, which a hook reads as the
  // stand-in's origin. Unset means the case's own plugin.
  oneof home {
    // A server of a plugin the turn loads.
    EvalMockPluginHome plugin = 5;

    // One of the evaluated agent's own servers.
    EvalMockAgentHome agent = 6;
  }
}

// EvalMockPluginHome is a plugin server a stand-in replaces.
message EvalMockPluginHome {
  // The plugin's ID and name.
  string plugin_id = 1 [(buf.validate.field).string.min_len = 1];
  string plugin_name = 2 [(buf.validate.field).string.max_len = 256];

  // The server's key in the plugin's MCP configuration.
  string server = 3 [(buf.validate.field).string.min_len = 1];
}

// EvalMockAgentHome is one of the evaluated agent's own servers a stand-in
// replaces.
message EvalMockAgentHome {
  // The agent's ID.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];

  // The server's name as the agent writes it.
  string server = 2 [(buf.validate.field).string.min_len = 1];
}

// EvalMockTool is one mocked tool and how it answers.
message EvalMockTool {
  // The tool's name.
  string tool = 1 [(buf.validate.field).string.min_len = 1];

  // The mock file whose body answers, or instructs the agent stand-in.
  string file = 2 [(buf.validate.field).string.min_len = 1];

  // How the tool answers.
  EvalMockKind kind = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Whether a fixed answer is returned as a tool error.
  bool error = 4;

  // The input guard, as the mock's expect block in JSON; empty for none.
  //
  // @internal
  // Checked and compiled by the server at read; the runner compiles it
  // again with the same library (@stigmer/eval-runtime).
  string expect_json = 5 [(buf.validate.field).string.max_len = 16384];

  // The only conditions under which an agent stand-in may end the run.
  string abort_when = 6 [(buf.validate.field).string.max_len = 4096];
}

// EvalMockKind is how a mocked tool answers.
enum EvalMockKind {
  eval_mock_kind_unspecified = 0;

  // The mock file's body, with its substitutions.
  eval_mock_kind_fixed = 1;

  // A model acting as the server from the mock file's instructions.
  eval_mock_kind_agent = 2;
}
