syntax = "proto3";

package ai.stigmer.agentic.run.v1;

import "ai/stigmer/agentic/run/v1/enum.proto";
import "ai/stigmer/agentic/run/v1/invocation.proto";
import "ai/stigmer/agentic/session/v1/spec.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// RunSpec contains only user-provided inputs for triggering a run.
// All run results and state live in RunStatus (in api.proto).
message RunSpec {
  option (buf.validate.message).cel = {
    id: "run.session_spec_harness_state"
    message: "session_spec.harness_state_id must be empty — harness state is created by the runner after the first run"
    expression: "!has(this.session_spec) || this.session_spec.harness_state_id == ''"
  };

  // Field 2 named an agent whose default instance a new conversation ran
  // against until the instance kind was removed; a new conversation names
  // its agent in session_spec.agent_ref.
  reserved 2;
  reserved "agent_id";

  // Fields 6, 8, 11 and 17 linked a turn to the workflow run whose step
  // started it: a callback token, a signal target and a dispatch queue
  // override, which field 17 (`parent`) later carried together. They went
  // with the workflow product. Reserved so the numbers and names are never
  // reused for different fields.
  reserved 6, 8, 11, 17;
  reserved "callback_token", "parent_workflow_id", "activity_task_queue", "parent";

  // Fields 15 and 16 held the preference and memory snapshots the server
  // composes for each turn; they are RunStatus fields 29 and 30.
  reserved 15, 16;
  reserved "declared_preferences", "recalled_memories";

  // Field 4 held a retired config message that mixed this message's settings with
  // its per-message intents and the lane's approval mode. The settings are
  // run_config (a RunConfig, the message every surface saves), the intents
  // are interaction_mode, build_from_plan and structured_output_schema, and
  // the approval mode is the server's (RunStatus.approval_mode).
  reserved 4;
  reserved "execution_config";

  // The conversation this turn belongs to: an existing session, or a new
  // one. Neither set starts a new conversation with the built-in
  // assistant: a person starts a conversation without choosing an agent.
  //
  // A turn runs the agent its session names, at the version the session
  // records (SessionStatus), and is refused unless the caller may add a
  // turn to the session (can_create_run_in) and may still run that
  // agent (can_execute). The agent and version the turn runs are recorded on
  // its status (agent_id, agent_version_hash).
  oneof target {
    // ID of the existing session this turn continues.
    //
    // A run in an existing session belongs to that session's
    // organization: metadata.org, when set, must be the session's
    // (FAILED_PRECONDITION otherwise), and when left empty it is taken from
    // the session. A run stays in the session it was created in:
    // update refuses a different session_id (FAILED_PRECONDITION), and an
    // empty one keeps the stored session.
    string session_id = 1;

    // Spec for a new session this turn starts.
    //
    // This is the one-call session bootstrap: a single create carries the
    // full session shape (the agent, workspace_entries, harness,
    // execution_target, MCP servers, skills) together with the first
    // message, so embedders do not need to orchestrate session.create
    // followed by run.create. The created session's ID is
    // returned on the persisted run's session_id.
    //
    // session_spec.agent_ref names the agent the conversation runs (empty:
    // the built-in assistant). Fields that must be set at session-creation
    // time and are immutable once a run has started — harness and
    // execution_target — can only reach an auto-created session through
    // this field. session_spec.harness_state_id must be empty — it is
    // server-owned harness continuity state, created by the runner after
    // the first run.
    //
    // @internal
    // The Session resource created from this spec is the single source of
    // truth for session configuration. The handler replaces this field with
    // the created session's id before persist, so the run record never
    // carries a second copy of session config that could drift as the
    // session evolves. Extends the existing auto-create path in
    // createSessionIfNeededStep rather than adding a parallel one
    // (stigmer/stigmer#249).
    ai.stigmer.agentic.session.v1.SessionSpec session_spec = 13;
  }

  // User input message that triggers this run.
  // Each run represents one user message and the agent's response.
  string message = 3 [(buf.validate.field).string.min_len = 1];

  // The settings this message asks for (optional): a model, a speed tier,
  // thinking, and run bounds. Zero or empty fields are not set here.
  //
  // The server resolves the settings the turn runs with once, at create,
  // and records them on RunStatus.run_config. A choice (model,
  // tier, thinking) comes from the most specific layer that makes one: this
  // field, then the defaults of the agent the turn runs, then the lane's
  // operator profile. A bound (cost, tool rounds, result size) is the
  // tightest one any layer sets, so a message can lower an agent's cap but
  // never raise it. RunConfig's own comment has the full rule.
  //
  // Unlike a saved surface's settings, a message may set service_tier or
  // thinking_mode without a model: it then adjusts the model a less
  // specific layer chose (for example, thinking off for one message on an
  // agent whose default turns it on).
  //
  // A lane that composes the turn for a surface (a schedule, a channel)
  // writes that surface's saved settings here. On a lane where the
  // caller is a visitor (the hosted edition's shared-agent guests and
  // channel senders), the surface's saved settings replace this field; the
  // per-message intents below are the edition's to allow or clear for a
  // visitor, not replaced with this field.
  RunConfig run_config = 18;

  // Interaction mode for this message.
  //
  // AGENT (default): full tool access — read, write, create, delete, shell.
  // PLAN: read-only analysis — read, search, list only. No file mutations.
  //
  // When UNSPECIFIED, defaults to AGENT.
  //
  // The mode is set per message and does not carry over between messages
  // in the same session. Users toggle mode in the session composer before
  // sending each message.
  InteractionMode interaction_mode = 19 [(buf.validate.field).enum.defined_only = true];

  // Marks this message as a "Build from plan" turn: the user approved a plan
  // produced by a prior Plan-mode run and asked the agent to implement it.
  //
  // When set, the runner injects the implement-plan directive into the agent's
  // prompt (see runner shared/implement-plan-prompt.ts). If the approved plan
  // document travels as an attachment (the normal case), the directive points
  // the agent at the attached plan file and treats it as authoritative; when no
  // plan attachment is present (e.g. the client's upload failed), the directive
  // tells the agent to follow the plan from the conversation instead.
  //
  // Clients set this flag INSTEAD of embedding implement instructions in
  // `message`, so `message` stays a short human-readable label (e.g.
  // "Build from plan") that UIs can render as a compact chip.
  //
  // Like interaction_mode, this is per message and never carries over
  // between messages in the same session.
  bool build_from_plan = 20;

  // JSON Schema that the agent's output must conform to (optional).
  //
  // When set, the runner enforces structured output:
  // - Native harness: uses deepagents responseFormat/ToolStrategy
  // - Cursor harness: prompt instruction + extraction fallback
  //
  // The validated structured data lands on the run's
  // status.structured_output.
  google.protobuf.Struct structured_output_schema = 21;

  // Field 5 held runtime_env, a turn's own variables and secrets, until a
  // conversation's own values moved onto the session (SessionSpec.secrets
  // and SessionSpec.connections): one place for them, kept sealed for the
  // conversation's life. A first turn sends them on session_spec; a later
  // change is a session update.
  reserved 5;
  reserved "runtime_env";

  // ─────────────────────────────────────────────────────────────────────────────
  // Approval Configuration
  //
  // Runtime control over approval behavior for this specific run.
  // ─────────────────────────────────────────────────────────────────────────────

  // Auto-approve all tool executions for this run.
  //
  // When true, tools that would normally require approval are automatically
  // approved without user intervention. It clears approvals only: a tool the
  // agent's tool lists exclude stays excluded.
  //
  // Use cases:
  // - Automated CI/CD pipelines where human approval isn't practical
  // - Trusted batch operations with pre-validated inputs
  // - Development/testing environments
  // - Scheduled jobs where approval would block automation
  //
  // Security consideration: This flag bypasses all approval checks.
  // Ensure appropriate access controls on who can set this flag.
  // Consider auditing runs where this flag is used.
  //
  // Default: false (approvals required as configured in policies)
  bool auto_approve_all = 7;

  // ─────────────────────────────────────────────────────────────────────────────
  // File Attachments (Artifact Lifecycle)
  //
  // Files to inject into the sandbox before the run begins.
  // ─────────────────────────────────────────────────────────────────────────────

  // Files attached to this run.
  //
  // Attachments are injected into the sandbox before the run begins.
  // The agent can read these files from the specified mount paths.
  //
  // Use cases:
  // - Provide input data files to process
  // - Pass configuration files
  // - Supply reference documents for analysis
  //
  // Example CLI usage:
  //   stigmer run agent my-agent --attach ./config.yaml -m "Process this config"
  repeated Attachment attachments = 9;

  // ─────────────────────────────────────────────────────────────────────────────
  // Workspace File References (Workspace-Aware Attachments)
  //
  // Lightweight attention signals for files already in the workspace.
  // ─────────────────────────────────────────────────────────────────────────────

  // Workspace-relative file paths the user wants the agent to focus on.
  //
  // When users reference files that exist inside the session's workspace,
  // the client records the workspace-relative path here instead of uploading.
  // The agent accesses these files directly via the workspace filesystem --
  // no upload, no copy, no injection.
  //
  // This separates the "attention" signal ("look at this file") from the
  // "transport" mechanism (upload + inject) that regular attachments use.
  //
  // Works for any workspace type with a resolvable filesystem post-provisioning
  // (local-path workspaces, git-cloned workspaces, or any future source type).
  // The runner resolves paths after workspace provisioning regardless of source.
  //
  // Populated by:
  //   - CLI: detects --attach paths inside workspace roots automatically
  //   - Web/Desktop: drag-to-reference from workspace file tree to composer
  //
  // Example CLI usage:
  //   stigmer run agent reviewer --workspace . --attach ./src/config.yaml -m "Review"
  //   # CLI detects src/config.yaml is inside workspace -> workspace_file_ref
  //   # No upload, no injection; agent reads directly from src/config.yaml
  repeated string workspace_file_refs = 10;

  // ─────────────────────────────────────────────────────────────────────────────
  // Edit-and-Resubmit (Supersede Link)
  //
  // Marks this run as the corrected replacement of an earlier turn.
  // ─────────────────────────────────────────────────────────────────────────────

  // ID of the run this one supersedes via edit-and-resubmit (optional).
  //
  // When a user stops an in-flight turn, edits the message, and resubmits,
  // the client sets this field on the NEW run to point at the stopped
  // one. Chat-thread consumers hide the superseded run so the edited
  // message replaces the original in place; history surfaces (CLI, run
  // lists) keep showing the full record.
  //
  // Empty means this run is not an edit of another turn.
  //
  // @internal
  //
  // The link always lives on the successor — the superseded record is never
  // mutated (append-only run log, single writer). Chained edits form a
  // chain of links (A <- B <- C), each persisted on its own successor.
  //
  // Display-level semantics only: the runner does NOT rewind model context.
  // Conversation history lives in an opaque session-keyed store (LangGraph
  // checkpoint thread / Cursor SDK agent store) that is resumed as-is, so the
  // superseded turn's partial messages remain visible to the model. Do not
  // build features that assume the runner skips superseded turns.
  string supersedes_run_id = 12;

  // Conversation events the agent has not yet seen, composed by the platform
  // for this turn (optional).
  //
  // Set on live channel-conversation turns (WhatsApp, Slack): when a human
  // teammate handled the conversation or messages otherwise landed while the
  // agent was not watching, the digest carries what happened so the agent
  // re-enters informed. Absent on every other run surface.
  //
  // @internal
  // Composed per turn by the cloud channel runtime — ChannelSessionBroker
  // over the conversation timeline stitch, windowed by the conversation's
  // agent_witnessed_through watermark.
  // The OSS server never sets it. The runner prepends the framed digest to
  // the turn's user message on both harnesses and must never read
  // window_end. Top-level rather than inside run_config by design:
  // conversation content is not a setting, and must not vanish with the
  // execution-profile kill-switch.
  ConversationCatchup conversation_catchup = 14;
}

// ─────────────────────────────────────────────────────────────────────────────
// File Attachments (Artifact Lifecycle)
//
// These types support file input to runs.
// ─────────────────────────────────────────────────────────────────────────────

// Attachment represents a file attached to a run.
//
// All files must be pre-uploaded via the uploadAttachment RPC and referenced
// by storage_key. This ensures consistent behavior regardless of file size.
//
// ## Usage Flow
//
// 1. Client calls uploadAttachment RPC with file content
// 2. Server returns a storage_key
// 3. Client creates run with Attachment containing that storage_key
// 4. The runner downloads file from storage and injects into sandbox
//
// ## Mount Path
//
// The mount_path determines where the file appears in the sandbox.
// If not specified, defaults to /inputs/{filename}
//
// Examples:
//   - mount_path: "/inputs/config.yaml" -> file at /inputs/config.yaml
//   - mount_path: "/workspace/data/" -> directory extracted at /workspace/data/
message Attachment {
  // Original filename for display and default mount path derivation.
  // Example: "config.yaml", "input-data.zip"
  //
  // Must be a bare filename: no path separators and no `.`/`..` traversal
  // segments. The filename is interpolated into the storage key and, on the
  // local backend, into an on-disk path, so path structure here is a
  // directory-traversal vector.
  string filename = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "attachment.filename.no_path"
      message: "filename must be a bare filename without path separators or traversal segments"
      expression: "!this.contains('/') && !this.contains('\\\\') && this != '.' && this != '..'"
    }
  ];

  // Reference to pre-uploaded file in artifact store (required).
  // Obtained by calling uploadAttachment RPC before creating the run.
  // Format: "attachments/{ulid}/{filename}"
  string storage_key = 2 [(buf.validate.field).string.min_len = 1];

  // Path in sandbox where file will be placed.
  // Defaults to "/inputs/{filename}" if not specified.
  // Example: "/workspace/input.yaml", "/inputs/data/"
  string mount_path = 3;

  // MIME type for content negotiation (optional).
  // Example: "application/yaml", "text/plain", "application/zip"
  string content_type = 4;

  // When true, the attachment is a zip archive that should be extracted
  // at mount_path rather than written as a single file.
  // Set automatically by the CLI when a directory is attached.
  bool extract = 5;

  // Absolute filesystem path to the original file on the CLI host (optional).
  //
  // When set and the runner is in local mode, the file is read directly
  // from this path instead of downloading from artifact storage via
  // storage_key.  This eliminates the storage round-trip for local
  // runs.
  //
  // Ignored when the runner is not in local mode (cloud runners use
  // storage_key exclusively).
  //
  // The CLI sets this unconditionally to the resolved absolute path of
  // the attached file.  storage_key remains required -- the upload still
  // happens for run history and replay support.
  string local_path = 6;
}

// ConversationCatchup carries the channel-conversation events an agent
// missed, composed fresh for one run.
//
// @internal
// Present on EVERY channel turn — even with an empty digest — so window_end
// can advance the conversation's agent_witnessed_through watermark when the
// turn settles. Content is composed in the cloud; presentation (preamble, framing,
// prompt placement) is owned by the OSS runner's shared/conversation-catchup
// module — content and presentation are split.
message ConversationCatchup {
  // Plain-text digest of what the agent missed, oldest first; empty when
  // nothing was missed.
  //
  // @internal
  // Bare content lines ("Customer: ..." / "Teammate: ..." / "System: ..." /
  // "You escalated: ..." / "Note: ..."), no model-facing framing — the
  // runner owns the preamble and the prompt placement. Blank means "inject
  // nothing" (the shared-module blank-is-absent convention).
  string digest = 1;

  // The timeline instant this digest conveys through.
  //
  // @internal
  // Cloud bookkeeping, NEVER read by the runner. The delivery settle path
  // advances the conversation's agent_witnessed_through watermark to this
  // instant when the run COMPLETED and the settle won. Set on every
  // channel turn, digest or not; its
  // value is the broker's compose instant, which is strictly later than the
  // turn's own inbound message.
  google.protobuf.Timestamp window_end = 2;
}

// DeclaredPreferences carries the standing preference texts injected into
// this run's prompt, one field per declaring scope.
//
// @internal
// Verbatim copies of Organization.spec.preferences.standing_context and the
// caller IdentityAccount.spec.preferences.standing_context at create time.
// The server stamps content only; the runner owns all presentation —
// preamble, per-scope attribution, ordering — via its
// shared/declared-preferences.ts channel module (the established
// content/presentation split). Blank means "inject nothing" per scope
// (the shared-module blank-is-absent convention).
message DeclaredPreferences {
  // The organization's standing context, verbatim.
  //
  // @internal
  // Never set on a visitor's run (stigmer#1401): the edition names
  // its visitors, and open source has none.
  string org_context = 1;

  // The calling user's standing context, verbatim.
  //
  // @internal
  // Set only where callers are persons (the require-authentication
  // posture, every edition; stigmer#1397), from the run's person's
  // account. The single-operator posture (trusted-local) never sets it:
  // its one operator's scope collapses into the org scope.
  string user_context = 2;
}

// RecalledMemories is the server-composed snapshot of the caller's
// confirmed memories for one run — the candidate set for prompt
// injection.
//
// @internal
// See the RunStatus.recalled_memories field comment for the full
// ownership and composition contract, and status.recalled_memories_report
// for which candidates the runner actually injected. enabled=true with
// zero facts is a meaningful state: memory is on for this caller, nothing
// is stored yet — the runner still offers the remember tool.
message RecalledMemories {
  // Whether memory is enabled for this run's caller.
  bool enabled = 1;

  // The confirmed facts — every confirmed memory of the caller in this
  // organization, the candidate set for prompt injection.
  //
  // @internal
  // The compose steps stamp EVERY confirmed fact, never a compose-time
  // truncation: this is the auditable
  // CANDIDATE set, not necessarily the injected set. Above the
  // retriever's activation threshold the runner selects the most
  // relevant subset at prompt build and records it in
  // status.recalled_memories_report; at or below the
  // threshold, or with no embeddings-capable provider, injection is
  // wholesale and the report (when present) says so. Selection is
  // recorded, never silent: what the model saw always equals what the
  // user can audit — this snapshot joined to the report.
  repeated RecalledMemoryFact facts = 2;
}

// RecalledMemoryFact is one confirmed memory as injected into an
// run.
message RecalledMemoryFact {
  // ID of the memory record this fact came from.
  //
  // @internal
  // The transparency link: the run status shows exactly
  // which records the model saw, and each links back to the
  // addressable, deletable memory.
  string memory_id = 1;

  // The remembered fact, verbatim as stored at snapshot time.
  string content = 2;
}
