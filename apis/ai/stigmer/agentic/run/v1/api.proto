syntax = "proto3";

package ai.stigmer.agentic.run.v1;

import "ai/stigmer/agentic/run/v1/approval.proto";
import "ai/stigmer/agentic/run/v1/artifact.proto";
import "ai/stigmer/agentic/run/v1/context.proto";
import "ai/stigmer/agentic/run/v1/enum.proto";
import "ai/stigmer/agentic/run/v1/filereview.proto";
import "ai/stigmer/agentic/run/v1/invocation.proto";
import "ai/stigmer/agentic/run/v1/message.proto";
import "ai/stigmer/agentic/run/v1/spec.proto";
import "ai/stigmer/agentic/run/v1/subagent.proto";
import "ai/stigmer/agentic/run/v1/todo.proto";
import "ai/stigmer/agentic/run/v1/usage.proto";
import "ai/stigmer/agentic/run/v1/writeback.proto";
import "ai/stigmer/commons/apiresource/metadata.proto";
import "ai/stigmer/commons/apiresource/status.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// Run represents a single run instance (conversational).
// Follows the standard pattern: spec contains user inputs, status contains run results.
message Run {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = 'agentic.stigmer.ai/v1'];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = 'Run'];

  // Standard resource metadata including name, id, labels, and tags.
  // Runs belong to an organization and inherit permissions from the session.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // User-provided inputs for this run.
  // Contains: the conversation (session_id or a new session_spec), message,
  // run_config and the per-message intents. A turn's logins and secrets
  // come from its session's own values and the vaults the server resolves
  // for it (RunStatus.credentials records whose run it was).
  RunSpec spec = 4;

  // System-managed run state and results.
  // Contains: messages, phase, sub_agents, pending_approvals, timestamps, errors
  RunStatus status = 5;
}

// RunStatus contains all run results and state.
// Everything populated during or after the run goes here, not in spec.
message RunStatus {
  // Standard audit information (created_at, updated_at, created_by, etc.)
  ai.stigmer.commons.apiresource.ApiResourceAudit audit = 99;

  // Sequential stream of run events: AI messages, tool calls, and system notifications.
  // Ordered chronologically to reconstruct the complete run flow.
  // Each message captures what happened during the run (agent responses, tool invocations, progress updates).
  repeated AgentMessage messages = 1;

  // Current run lifecycle phase.
  // Tracks the run state from creation (PENDING) through active processing (IN_PROGRESS)
  // to terminal states (COMPLETED/FAILED/CANCELLED).
  RunPhase phase = 2 [(buf.validate.field).enum.defined_only = true];

  // Sub-agent runs invoked during this run.
  // Tracks when the main agent delegates work to specialized sub-agents.
  // Ordered chronologically by invocation time.
  repeated SubAgentRun sub_agent_runs = 4;

  // Error message if the run failed.
  // Only populated when phase == RUN_FAILED.
  string error = 6;

  // ISO 8601 timestamp when the run started.
  // Example: "2025-01-10T10:30:00Z"
  string started_at = 7;

  // ISO 8601 timestamp when the run completed, failed, or was cancelled.
  // Only populated for terminal states.
  string completed_at = 8;

  // Todo list tracking multi-step tasks and progress for this run.
  // Updated via write_todos tool (if TodoListMiddleware is enabled).
  // Each run maintains its own snapshot of todos at run time.
  // Key: todo item ID, Value: todo item details
  map<string, TodoItem> todos = 9;

  // Field 10 held the task token of the workflow step waiting on this run,
  // which the runner used to complete that step when the run finished. It
  // went with the workflow product. Reserved so the number and name are
  // never reused for a different field.
  reserved 10;
  reserved "callback_token";

  // Field 12 held `ResolvedExecutionContext resolved_context` — a snapshot of
  // the resources the agent had access to at run start. The contract was
  // retired (2026-08, issue #600): its only producer was the long-deleted
  // Python runner, so the field never carried data in any deployment. Reserved
  // so a future, deliberately designed observability surface cannot collide
  // with stale clients.
  reserved 12;
  reserved "resolved_context";

  // ─────────────────────────────────────────────────────────────────────────────
  // Pending Approvals (HITL — Computed Projection)
  //
  // Server-side computed projection of tool calls awaiting user approval.
  // Recomputed on every UpdateStatus write — never stale, never merged.
  // ─────────────────────────────────────────────────────────────────────────────

  // Active pending approval requests for this run.
  //
  // Contains one entry per tool call that requires user approval before
  // it can proceed. Sub-agent approvals are included with from_sub_agent
  // set to true. Empty when no approvals are pending.
  //
  // @internal
  //
  // Computed server-side by the Go/Java UpdateStatus handlers on every write.
  // The handler scans messages[].tool_calls and
  // sub_agent_runs[].messages[].tool_calls, collecting entries where
  // status == WAITING_APPROVAL && requires_approval == true, and projects
  // them into PendingApproval entries.
  //
  // Because this field is recomputed (not merged), it is always consistent
  // with the authoritative tool call state embedded in messages. No lifecycle
  // state machine, no merge logic, no forward-only enforcement needed.
  //
  // Lifecycle:
  // 1. The runner sets ToolCall.status = WAITING_APPROVAL on the message
  // 2. UpdateStatus handler recomputes this field, entry appears
  // 3. Phase changes to RUN_WAITING_FOR_APPROVAL
  // 4. User submits decisions via SubmitApproval RPC (one per tool call)
  // 5. Agent resumes, ToolCall.status advances, next recompute drops the entry
  repeated PendingApproval pending_approvals = 16;

  // ─────────────────────────────────────────────────────────────────────────────
  // Approval Event Stream (HITL re-architecture — persisted transition state)
  //
  // Append-only ledger of approval requests and decisions for this run.
  // ─────────────────────────────────────────────────────────────────────────────

  // Server-authored, append-only record of every approval request and decision.
  //
  // @internal
  //
  // This is the persisted form of the append-only stream that is the target
  // single source of truth for approvals (see ApprovalEventStream in
  // approval.proto). It is NOT yet read by any surface: pending_approvals is
  // still projected from the authoritative message scan, and the UI/SDK read
  // that. The stream coexists as a parallel, independently-authored record so
  // that (1) the message-scan vs event-stream projection parity check becomes a
  // real cross-writer regression guard rather than a tautology, and (2) the
  // approval audit trail — who decided, when, with what comment — has a home,
  // since the flat ToolCall.approval_action / approval_decided_at fields cannot
  // capture a decision comment at all.
  //
  // Field ownership (one writer per event type):
  //   - REQUESTED events are authored by the UpdateStatus handlers when a tool
  //     call enters WAITING_APPROVAL (seeded once from the message scan for
  //     runs that predate this field).
  //   - Decision events (APPROVED / REJECTED / SKIPPED) are authored by the
  //     SubmitApproval handler, carrying decided_by and the user's comment.
  //
  // Every append is keyed by the deterministic ApprovalEvent.event_id, so the
  // stream is idempotent under retries and the rich decision event (authored in
  // the same operation that records the decision on the message scan) can never
  // be duplicated or overwritten by a coarse re-derivation.
  //
  // Because it is server-only, the runner never sends it; it is preserved
  // across UpdateStatus writes automatically (the merge starts from the loaded
  // run and only replaces runner-owned fields).
  ApprovalEventStream approval_event_stream = 22;

  // ─────────────────────────────────────────────────────────────────────────────
  // Context Management
  //
  // Context window utilization and automatic summarization tracking.
  // ─────────────────────────────────────────────────────────────────────────────

  // Context window utilization and summarization tracking.
  //
  // Provides visibility into how the agent is using its context window and
  // any summarization events that occurred during the run.
  //
  // Populated when context management is active (not disabled via config).
  // Updated progressively during streaming as token counts change.
  //
  // Use cases:
  // - **Monitoring**: Track context utilization across runs
  // - **Debugging**: Understand why a run hit context limits
  // - **Cost optimization**: Identify runs with excessive summarization
  // - **UX**: Show users their context window health
  ContextInfo context_info = 14;

  // ─────────────────────────────────────────────────────────────────────────────
  // Run Artifacts (Artifact Lifecycle)
  //
  // Files and directories published by the agent for download.
  // ─────────────────────────────────────────────────────────────────────────────

  // Files/directories published by the agent for download.
  //
  // When an agent creates artifacts (e.g., generated code, reports, skills),
  // it can call the publish_artifact tool to make them downloadable.
  // Each artifact includes a pre-signed URL for direct download.
  //
  // Artifacts are stored in R2 and URLs expire after a configured period.
  // Use the run download endpoint to refresh expired URLs.
  //
  // Ordered by creation time (oldest first).
  repeated RunArtifact artifacts = 15;

  // ─────────────────────────────────────────────────────────────────────────────
  // Workspace Write-Backs (Platform-Owned Git Workflow)
  //
  // Outcomes of the platform's automatic branch/commit/push/PR workflow
  // for git-backed workspace entries.
  // ─────────────────────────────────────────────────────────────────────────────

  // Git write-back outcomes for workspace entries that had changes.
  //
  // One entry per git-backed workspace entry where the agent modified
  // files and write_back_mode was enabled on the GitRepoSource. Omitted
  // for workspace entries with no changes, non-git sources, or disabled
  // write-back mode.
  //
  // Populated during post-run processing. Each entry tracks the
  // write-back lifecycle (committed -> pushed -> PR created) and carries
  // the PR URL for UI display.
  repeated WorkspaceWriteBack workspace_write_backs = 17;

  // ─────────────────────────────────────────────────────────────────────────────
  // Setup Progress (Real-Time Setup Phase Reporting)
  //
  // Replaces the frontend's timer-based approximation with server-reported
  // setup phases so subscribers see what the worker is actually doing.
  // ─────────────────────────────────────────────────────────────────────────────

  // Real-time setup progress reported by the runner during RUN_PENDING.
  // Populated progressively as the worker completes setup steps (sandbox init,
  // workspace provisioning, skill loading, MCP server connection, etc.).
  // Only meaningful while phase == RUN_PENDING. Cleared by the server
  // when phase transitions away from PENDING.
  SetupProgress setup_progress = 18;

  // ─────────────────────────────────────────────────────────────────────────────
  // Run Usage (DISPLAY_ONLY Trust Level)
  //
  // Provisional usage captured from the execution worker's onDelta callbacks.
  // For Cursor harness: accumulated from SDK turn-ended events.
  // For native harness: not populated (authoritative usage comes from proxy).
  //
  // Trust: DISPLAY_ONLY. Not billing-authoritative. Use for real-time UX only.
  // Billing settlement comes from LlmCallUsageRecord (proxy-reported) or
  // future Cursor Admin API reconciliation.
  // ─────────────────────────────────────────────────────────────────────────────

  // Streaming usage summary, updated progressively during the run.
  StreamingUsageSummary streaming_usage = 20;

  // ─────────────────────────────────────────────────────────────────────────────
  // Structured Output (Deterministic Agent Responses)
  //
  // Schema-conforming data extracted from the agent's final response.
  // Replaces regex-based parsing for architect/refine/diagnose flows.
  // ─────────────────────────────────────────────────────────────────────────────

  // Structured output extracted from the agent's final response.
  //
  // Populated when spec.structured_output_schema was set and the
  // runner successfully extracted schema-conforming data. Only meaningful
  // when phase is RUN_COMPLETED.
  //
  // For native harness: populated from LangGraph graphState.structuredResponse
  // (ToolStrategy enforcement). For Cursor harness: populated from 3-tier
  // extraction (JSON.parse → fence extraction → extraction LLM fallback).
  //
  // Consumers: frontend architect/refine hooks read this instead of parsing
  // YAML from messages.
  google.protobuf.Struct structured_output = 21;

  // ─────────────────────────────────────────────────────────────────────────────
  // File Change Review (HITL — Computed Projection + Append-Only Ledger)
  //
  // Apply-then-review file edits: file_change_sets is the read-model the review
  // surface consumes; file_review_event_stream is the append-only source of
  // truth it is projected from. The pair mirrors pending_approvals (16) +
  // approval_event_stream (22) exactly, for a second lifecycle.
  // ─────────────────────────────────────────────────────────────────────────────

  // Server-computed projection of file change sets awaiting or completing
  // review for this run.
  //
  // @internal
  //
  // Recomputed on every status write from file_review_event_stream (never
  // merged), so it is always consistent with the authoritative ledger — exactly
  // as pending_approvals is recomputed from the message scan / approval stream.
  // Empty until the runner's capture activity authors events. A
  // terminal run projects no actionable review. See FileChangeSet.
  //
  // Field 23: appended after approval_event_stream (22), the prior maximum.
  repeated FileChangeSet file_change_sets = 23;

  // Server-owned, append-only record of every file-review event (baseline /
  // candidate capture, file decisions, reconcile, failures).
  //
  // @internal
  //
  // The persisted source of truth that file_change_sets is projected from — a
  // sibling of approval_event_stream for the file-review lifecycle (the
  // ApprovalEvent oneof is closed, so file events cannot ride it). Appends are
  // keyed by the deterministic FileReviewEvent.event_id, so the stream is
  // idempotent under retries.
  //
  // Write contract (one writer per event type): the runner CONTRIBUTES its
  // capture/reconcile events (BASELINE_CAPTURED / CANDIDATE_CAPTURED /
  // RECONCILED / FAILED) by carrying them here on UpdateStatus; the server folds
  // them into the stored stream append-only, by event_id, on the freshly-loaded
  // run under the write lock. The runner can never replace an existing
  // event and never authors FILE_DECIDED (the server drops a runner-sent
  // decision); FILE_DECIDED is authored solely by SubmitFileDecision. The stored
  // stream is otherwise preserved in place across writes. See
  // FileReviewEventStream.
  //
  // Field 24: appended after file_change_sets (23), the prior maximum.
  FileReviewEventStream file_review_event_stream = 24;

  // Transient, non-authoritative snapshot of the workspace delta accumulating
  // during the current turn — the live "N files changed so far" surface, shown
  // before any review is possible.
  //
  // @internal
  //
  // NOT part of the file-review ledger. This is a runner-owned, latest-snapshot
  // display field in the family of setup_progress (18) / streaming_usage (20):
  // the runner overwrites it on each mid-run persist and the server clears it once
  // its change set leaves CAPTURING, exactly as setup_progress is cleared when the
  // phase leaves PENDING. It carries paths + kinds + line counts only (no bodies,
  // no digests) and is never decidable — the turn-boundary CANDIDATE_CAPTURED in
  // file_change_sets remains the single authoritative, reviewable diff. See
  // FileChangeProgress.
  //
  // Field 25: appended after file_review_event_stream (24), the prior maximum.
  FileChangeProgress file_change_progress = 25;

  // ─────────────────────────────────────────────────────────────────────────────
  // Recalled-Memories Injection Report
  //
  // Runner-owned record of which status.recalled_memories facts the semantic
  // retriever injected into the prompt. Absent report = wholesale injection.
  // ─────────────────────────────────────────────────────────────────────────────

  // Report of which recalled memories were injected into this run's
  // prompt.
  //
  // Absent, or present with selection_active=false, means wholesale: every
  // fact in the status.recalled_memories snapshot was injected.
  //
  // @internal
  //
  // Runner-owned, single writer (the streaming_usage / context_info
  // posture): written at most once per run, at prompt build, through
  // the runner's status lane. The server merges it presence-guarded and
  // never writes it — the create pipeline stamps only the snapshot
  // (stigmer/stigmer#293).
  //
  // The audit contract: status.recalled_memories is the server-composed
  // CANDIDATE set (everything the caller's consent state made recallable);
  // what-the-model-saw = this report joined to that snapshot. Absent
  // report = wholesale is true by construction — for every run that
  // predates this field and for every wholesale path since (selection
  // below threshold, no embeddings-capable provider, embed/rank failure).
  //
  // Field 26: appended after file_change_progress (25), the prior maximum.
  RecalledMemoriesReport recalled_memories_report = 26;

  // ─────────────────────────────────────────────────────────────────────────────
  // The Agent This Turn Ran
  //
  // The agent and the exact agent version this turn ran, stamped once by the
  // server when the run is created and read by every later reader:
  // the runner hydrates the agent from this version, and a recovered
  // run rebuilds its context from it, so an author saving a new
  // version while the turn is queued or running never changes what runs.
  //
  // Server-only: a client-sent value is discarded at create, and status
  // writes never change either field.
  // ─────────────────────────────────────────────────────────────────────────────

  // ID of the agent this turn ran. Empty when the turn ran the built-in
  // assistant, which is not a stored agent.
  //
  // @internal
  // Recorded beside agent_version_hash: a version hash is unique only within
  // its agent, and the session's route to its agent can change after the
  // turn.
  string agent_id = 27;

  // Content hash of the agent version this turn ran (AgentStatus.version_hash
  // at create; resolvable through AgentQueryController.getVersion with
  // agent_id).
  //
  // Empty when agent_id is empty, or when the agent had no recorded version
  // at create (an agent last written before agents were versioned, or one
  // whose last version failed to archive); such a turn runs the agent as
  // it is when the turn starts.
  string agent_version_hash = 28;

  // Standing preferences declared by the organization and the calling user,
  // snapshotted into this run at create time.
  //
  // @internal
  // Server-owned: the create pipeline stamps it unconditionally (empty for
  // callers it does not apply to), and status writes never change it. The
  // two halves have different audiences. org_context is composed for
  // every run but a visitor's: the organization's own lanes (a
  // person, a schedule, the platform's pipelines)
  // carry it, and a caller the edition classifies as a visitor, admitted to
  // the organization's agents without belonging to it (the hosted edition's
  // shared-agent guests and channel senders), never does (stigmer#1401).
  // user_context is composed only for first-party human operators, and only
  // where callers are persons (the require-authentication posture, every
  // edition; stigmer#1397); the single-operator posture (trusted-local)
  // composes org_context only. Composition is best-effort; a preference
  // load failure never fails the create. Outside run_config: preference
  // content is not a setting, and must not vanish with the
  // execution-profile kill-switch (the conversation_catchup rationale).
  DeclaredPreferences declared_preferences = 29;

  // The caller's confirmed memories, snapshotted into this run at
  // create time: the candidate set the prompt was built from.
  //
  // @internal
  // Every declared_preferences invariant carries over: server-owned and
  // stamped unconditionally (enabled=false with no facts for excluded
  // callers); composed only for first-party human operators with both
  // memory_enabled flags on (the organization's and, where callers are
  // persons, the caller's; the single-operator posture, trusted-local: the
  // organization's alone, stigmer#1387); confirmed records only, never
  // proposed or rejected ones; best-effort (a memory load failure degrades
  // to disabled, never fails the create). What the model actually saw is
  // this snapshot joined to recalled_memories_report, whose absence means
  // the whole set. The enabled bit doubles as the runner's signal to offer
  // the remember tool. Composed by the create pipeline's compose steps.
  RecalledMemories recalled_memories = 30;

  // ─────────────────────────────────────────────────────────────────────────────
  // The Settings This Turn Ran With
  //
  // The settings and approval mode this turn runs with, resolved once by the
  // server when the run is created and read by every later reader:
  // the runner, history, billing and recovery all read one answer.
  //
  // Server-only: a client-sent value is discarded at create, and status
  // writes never change either field.
  // ─────────────────────────────────────────────────────────────────────────────

  // The settings this turn runs with: spec.run_config (or the saved settings
  // of the surface it came through), the defaults of the agent version the
  // turn runs, and the lane's operator profile, resolved by RunConfig's rule.
  //
  // An empty model_name means no layer named one and the engine chose (the
  // native engine's registry default; Cursor's Auto).
  RunConfig run_config = 31;

  // How this turn resolves approval gates: INTERACTIVE or UNATTENDED, never
  // UNSPECIFIED.
  //
  // A fact of the lane the turn came through, never of the request: a
  // schedule's turn and the hosted edition's shared-agent guest and channel
  // turns are UNATTENDED (nobody is present to approve); every other turn is
  // INTERACTIVE.
  ApprovalMode approval_mode = 32;

  // Whose logins and secrets this turn uses: decided once when the turn is
  // created, and kept when it is recovered.
  RunCredentials credentials = 33;
}

// RunCredentials records whose logins and secrets a turn uses.
message RunCredentials {
  // The person whose turn this is, by identity account id. Absent for a
  // turn no person sent: a schedule's, a channel's, a share link guest's, a
  // platform client user's or a machine account's, which use only the
  // vaults their session and surface name.
  //
  // @internal
  // Set at create by the platform's one rule for a first-party human
  // operator (isFirstPartyHumanOperator): class user, from the wire, not a
  // platform client's user token; the trusted-local operator is one. The
  // value is the caller's identity id. Recover reads it and never
  // re-derives it from the recovering caller. Server-only: a client-sent
  // value is discarded at create.
  optional string person = 1;
}

// Setup progress reported during the RUN_PENDING phase.
//
// @internal
// Designed as a sub-message (rather than a bare string) so future fields
// (completed_phases, total_phases, phase_index) can be added without
// deprecation or breaking changes.
message SetupProgress {
  // Human-readable label for the current setup phase.
  // Examples: "Initializing sandbox…", "Setting up workspace…", "Loading skills…"
  // Empty when setup phase reporting has not started or is complete.
  string current_phase = 1;
}

// RecalledMemoriesReport records the semantic retriever's injection outcome
// for one run.
//
// @internal
// Runner-owned, written at most once per run at prompt build.
// Selection activates only when the candidate set exceeds the
// retriever's threshold (k); every other path — at-or-below threshold, no
// embeddings-capable provider, embed/rank failure — injects the snapshot
// wholesale and reports selection_active=false. Wholesale is the behavior
// from before selection existed: selection is an optimization, its
// absence is not a degradation.
message RecalledMemoriesReport {
  // Whether semantic selection was active for this run's prompt.
  // False means wholesale: the full status.recalled_memories snapshot was
  // injected.
  bool selection_active = 1;

  // IDs of the injected memories when selection was active.
  //
  // @internal
  // Always a subset of the status.recalled_memories snapshot's memory_ids,
  // in SNAPSHOT order (oldest-first): selection is by relevance, but
  // presentation preserves the stable prompt order both editions pin.
  // Empty when selection_active is false — readers fall back
  // to the snapshot, which is exactly correct.
  repeated string injected_memory_ids = 2;

  // Embedding model that performed the selection.
  // Example: "text-embedding-3-small". Empty when selection_active is
  // false.
  string embedding_model = 3;
}
