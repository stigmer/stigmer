syntax = "proto3";

package ai.stigmer.agentic.run.v1;

import "ai/stigmer/agentic/run/v1/enum.proto";
import "ai/stigmer/agentic/run/v1/eval_case.proto";
import "ai/stigmer/agentic/run/v1/filereview.proto";
import "ai/stigmer/agentic/run/v1/invocation.proto";
import "ai/stigmer/agentic/run/v1/spec.proto";
import "ai/stigmer/agentic/run/v1/usage.proto";
import "ai/stigmer/agentic/run/v1/writeback.proto";
import "ai/stigmer/agentic/session/v1/event_content.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/metadata.proto";
import "ai/stigmer/commons/apiresource/status.proto";
import "buf/validate/validate.proto";

// Run represents a single run instance (conversational).
// Follows the standard pattern: spec contains user inputs, status contains run results.
message Run {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = 'agentic.stigmer.ai/v1'];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = 'Run'];

  // Standard resource metadata including name, id, labels, and tags.
  // Runs belong to an organization and inherit permissions from the session.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // User-provided inputs for this run.
  // Contains: the conversation (session_id or a new session_spec), message,
  // run_config and the per-message intents. A turn's logins and secrets
  // come from the vaults its conversation uses, which the server resolves
  // for it (RunStatus.credentials records whose run it was).
  RunSpec spec = 4;

  // System-managed run state and results.
  // Contains: phase, timestamps, errors, the file record and what the turn ran
  // with. What the agent said and did is the session's event log.
  RunStatus status = 5;
}

// RunStatus contains all run results and state.
// Everything populated during or after the run goes here, not in spec.
// The conversation itself (messages, tool calls, approvals, todos,
// subagents, structured output and file-review decisions) is the session's
// event log (SessionEvent), not a field here.
message RunStatus {
  // Standard audit information (created_at, updated_at, created_by, etc.)
  ai.stigmer.commons.apiresource.ApiResourceAudit audit = 99;

  // Fields 1 (messages), 4 (sub_agent_runs), 9 (todos), 14 (context_info),
  // 16 (pending_approvals), 21 (structured_output), 22
  // (approval_event_stream), 23 (file_change_sets), 24
  // (file_review_event_stream) and 26 (recalled_memories_report) held the
  // run's own transcript and ledgers. Every client and the platform read a
  // conversation from the session's events, so they left the contract.
  // Reserved so the numbers and names are never reused.
  reserved 1, 4, 9, 14, 16, 21, 22, 23, 24, 26;
  reserved "messages", "sub_agent_runs", "todos", "context_info", "pending_approvals", "structured_output", "approval_event_stream", "file_change_sets", "file_review_event_stream", "recalled_memories_report";

  // Current run lifecycle phase.
  // Tracks the run state from creation (PENDING) through active processing (IN_PROGRESS)
  // to terminal states (COMPLETED/FAILED/CANCELLED).
  RunPhase phase = 2 [(buf.validate.field).enum.defined_only = true];

  // Error message if the run failed.
  // Only populated when phase == RUN_FAILED.
  string error = 6;

  // ISO 8601 timestamp when the run started.
  // Example: "2025-01-10T10:30:00Z"
  string started_at = 7;

  // ISO 8601 timestamp when the run completed, failed, or was cancelled.
  // Only populated for terminal states.
  string completed_at = 8;

  // Field 10 held the task token of the workflow step waiting on this run,
  // which the runner used to complete that step when the run finished. It
  // went with the workflow product. Reserved so the number and name are
  // never reused for a different field.
  reserved 10;
  reserved "callback_token";

  // Field 12 held `ResolvedExecutionContext resolved_context` — a snapshot of
  // the resources the agent had access to at run start. The contract was
  // retired (2026-08, issue #600): its only producer was an earlier runner,
  // long deleted, so the field never carried data in any deployment. Reserved
  // so a future, deliberately designed observability surface cannot collide
  // with stale clients.
  reserved 12;
  reserved "resolved_context";

  // Field 15 held the files Stigmer's own harness uploaded as the agent wrote
  // them, each named by its storage key. What a turn returns is now a File:
  // whatever the agent saves in its outputs folder, listed by the File's
  // run_id. Stored entries become Files of their run when the server
  // starts. Reserved so the number and name are never reused.
  reserved 15;
  reserved "artifacts";

  // ─────────────────────────────────────────────────────────────────────────────
  // Workspace Write-Backs (Platform-Owned Git Workflow)
  //
  // Outcomes of the platform's automatic branch/commit/push/PR workflow
  // for git-backed workspace entries.
  // ─────────────────────────────────────────────────────────────────────────────

  // Git write-back outcomes for workspace entries that had changes.
  //
  // One entry per git repository the conversation holds where the agent
  // modified files and write_back_mode was enabled on the
  // GitRepositoryResource. Omitted for repositories with no changes, local
  // folders, or disabled write-back mode.
  //
  // Populated during post-run processing. Each entry tracks the
  // write-back lifecycle (committed -> pushed -> PR created) and carries
  // the PR URL for UI display.
  repeated WorkspaceWriteBack workspace_write_backs = 17;

  // ─────────────────────────────────────────────────────────────────────────────
  // Setup Progress (Real-Time Setup Phase Reporting)
  //
  // Replaces the frontend's timer-based approximation with server-reported
  // setup phases so subscribers see what the worker is actually doing.
  // ─────────────────────────────────────────────────────────────────────────────

  // Real-time setup progress reported by the runner during RUN_PENDING.
  // Populated progressively as the worker completes setup steps (sandbox init,
  // workspace provisioning, skill loading, MCP server connection, etc.).
  // Only meaningful while phase == RUN_PENDING. Cleared by the server
  // when phase transitions away from PENDING.
  SetupProgress setup_progress = 18;

  // ─────────────────────────────────────────────────────────────────────────────
  // Run Usage (DISPLAY_ONLY Trust Level)
  //
  // Provisional usage the runner accumulates from each turn's usage, on both
  // harnesses (the provider's usage reports).
  //
  // Trust: DISPLAY_ONLY. Not metering-authoritative: the metered record of
  // each call is LlmCallUsageRecord (proxy-reported). The usage reports
  // count a run from this field, marked estimated, only when the deployment
  // has not metered it.
  // ─────────────────────────────────────────────────────────────────────────────

  // Streaming usage summary, updated progressively during the run.
  StreamingUsageSummary streaming_usage = 20;

  // Transient, non-authoritative snapshot of the workspace delta accumulating
  // during the current turn — the live "N files changed so far" surface, shown
  // before any review is possible.
  //
  // @internal
  //
  // NOT part of the file record. This is a runner-owned, latest-snapshot
  // display field in the family of setup_progress (18) / streaming_usage (20):
  // the runner overwrites it on each mid-run persist and the server clears it once
  // its change set is on file_changes, exactly as setup_progress is cleared when
  // the phase leaves PENDING. It carries paths + kinds + line counts only (no
  // bodies, no digests) and is never decidable — the change set captured at the
  // turn boundary remains the single authoritative, reviewable diff. See
  // FileChangeProgress.
  FileChangeProgress file_change_progress = 25;

  // The run's file record: the change sets its turns captured, each with the
  // files' contents before and after (inline or by storage key), the diff, the
  // snapshots they were read from and the consent the turn's commands ran
  // under. Empty for a run that changed no file or ran without file review.
  //
  // A record only: it carries no status and no decisions. What was decided,
  // what is still undecided and what was put back are the session's
  // stigmer.file_review.* events.
  //
  // @internal
  // Runner-written at the turn boundary and merged by change set id. The
  // server reads it to put files back for an undo and to verify
  // command_provenance before the approved-command keep.
  //
  // Field 37: numbered after loaded_versions (36), the prior maximum.
  repeated FileChangeSet file_changes = 37;

  // ─────────────────────────────────────────────────────────────────────────────
  // The Agent This Turn Ran
  //
  // The agent and the exact agent version this turn ran, stamped once by the
  // server when the run is created and read by every later reader:
  // the runner hydrates the agent from this version, and a recovered
  // run rebuilds its context from it, so an author saving a new
  // version while the turn is queued or running never changes what runs.
  //
  // Server-only: a client-sent value is discarded at create, and status
  // writes never change either field.
  // ─────────────────────────────────────────────────────────────────────────────

  // ID of the agent this turn ran. Empty when the turn ran the built-in
  // assistant, which is not a stored agent.
  //
  // @internal
  // Recorded beside agent_version_hash: a version hash is unique only within
  // its agent, and the session's route to its agent can change after the
  // turn.
  string agent_id = 27;

  // Content hash of the agent version this turn ran (AgentStatus.version_hash
  // at create; resolvable through AgentQueryController.getVersion with
  // agent_id).
  //
  // Empty when agent_id is empty, or when the agent had no recorded version
  // at create (an agent last written before agents were versioned, or one
  // whose last version failed to archive); such a turn runs the agent as
  // it is when the turn starts.
  string agent_version_hash = 28;

  // ─────────────────────────────────────────────────────────────────────────────
  // What This Run Loaded
  //
  // The skills and plugins this run's turns loaded, each at the exact
  // version it ran. A skill or plugin listed without a version follows its
  // latest push, so the agent version above does not name it; this does.
  // A record, never a pin: it changes nothing a later run loads.
  //
  // Runner-written, unlike the agent stamp above.
  // ─────────────────────────────────────────────────────────────────────────────

  // Every skill and plugin a turn of this run loaded, for the agent and its
  // subagents, at the version it loaded. A turn that resumes after a pause
  // and loads a newer version adds an entry, so a run that ran two versions
  // of one skill lists both. Empty for a run that loaded none, and for runs
  // that predate this field.
  //
  // @internal
  // Written by the runner once per turn attempt and merged by union over
  // (id, version) in update-status.ts: an entry, once stored, is never
  // removed or reordered. Stored by id; the response interceptor names each
  // entry.
  //
  // Field 36: numbered after stop_cause (35), the prior maximum.
  LoadedVersions loaded_versions = 36;

  // Standing preferences declared by the organization and the calling user,
  // snapshotted into this run at create time.
  //
  // @internal
  // Server-owned: the create pipeline stamps it unconditionally (empty for
  // callers it does not apply to), and status writes never change it. The
  // two halves have different audiences. org_context is composed for
  // every run but a visitor's: the organization's own lanes (a
  // person, a routine, the platform's pipelines)
  // carry it, and a caller the edition classifies as a visitor, admitted to
  // the organization's agents without belonging to it (the hosted edition's
  // shared-agent guests and channel senders), never does (stigmer#1401).
  // user_context is composed only for first-party human operators, and only
  // where callers are persons (the require-authentication posture, every
  // edition; stigmer#1397); the single-operator posture (trusted-local)
  // composes org_context only. Composition is best-effort; a preference
  // load failure never fails the create. Outside run_config: preference
  // content is not a setting, and must not vanish with the
  // execution-profile kill-switch (the conversation_catchup rationale).
  DeclaredPreferences declared_preferences = 29;

  // The caller's confirmed memories, snapshotted into this run at
  // create time: the candidate set the prompt was built from.
  //
  // @internal
  // Every declared_preferences invariant carries over: server-owned and
  // stamped unconditionally (enabled=false with no facts for excluded
  // callers); composed only for first-party human operators with both
  // memory_enabled flags on (the organization's and, where callers are
  // persons, the caller's; the single-operator posture, trusted-local: the
  // organization's alone, stigmer#1387); confirmed records only, never
  // proposed or rejected ones; best-effort (a memory load failure degrades
  // to disabled, never fails the create). What the model actually saw is
  // this snapshot joined to the turn's stigmer.memory.recalled session
  // event, whose absence means the whole set. The enabled bit doubles as the runner's signal to offer
  // the remember tool. Composed by the create pipeline's compose steps.
  RecalledMemories recalled_memories = 30;

  // ─────────────────────────────────────────────────────────────────────────────
  // The Settings This Turn Ran With
  //
  // The settings and approval mode this turn runs with, resolved once by the
  // server when the run is created and read by every later reader:
  // the runner, history, billing and recovery all read one answer.
  //
  // Server-only: a client-sent value is discarded at create, and status
  // writes never change either field.
  // ─────────────────────────────────────────────────────────────────────────────

  // The settings this turn runs with: spec.run_config (or the saved settings
  // of the routine or channel it came through), the defaults of the agent version the
  // turn runs, and the lane's operator profile, resolved by RunConfig's rule.
  //
  // An empty model_name means no layer named one and the harness chose its
  // registry default.
  RunConfig run_config = 31;

  // How this turn resolves approval gates: INTERACTIVE or UNATTENDED, never
  // UNSPECIFIED.
  //
  // A fact of the lane the turn came through, never of the request: a
  // routine's turn and the hosted edition's shared-agent guest and channel
  // turns are UNATTENDED (nobody is present to approve); every other turn is
  // INTERACTIVE.
  ApprovalMode approval_mode = 32;

  // Whose logins and secrets this turn uses: decided once when the turn is
  // created, and kept when it is recovered.
  RunCredentials credentials = 33;

  // The files an eval case's graders read, as the try's turn left them.
  //
  // @internal
  // Set only on a run whose spec carries eval_case, by the runner,
  // once, with the turn's terminal status.
  EvalFiles eval_files = 34;

  // Why the turn stopped, as one word: budget_reached (the cost cap or the
  // tool-call limit), timeout (a stall or the workspace lock), infrastructure
  // (the worker shut down or stopped answering), platform_stop, user (a pause
  // or a cancel), model_error (the model provider failed the turn), failed
  // (any other failure), eval_stopped (an eval case's mock or scaffold
  // stopped the try) or review_resolved (a file review was settled). Empty
  // while the turn works, and when it ended on its own.
  //
  // @internal
  // Written with the terminal status by the turn's one writer of a
  // terminal (the runner's terminal table) and by the workflow's own
  // failure write; the session's status events read it.
  string stop_cause = 35 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "budget_reached",
        "timeout",
        "infrastructure",
        "platform_stop",
        "user",
        "model_error",
        "failed",
        "eval_stopped",
        "review_resolved"
      ]
    }
  ];

  // The files this turn's message carried, as content blocks: an image
  // block for an image File, a document block for any other, each with a
  // file source naming the conversation's own copy. The turn's
  // user.message event carries them after its text.
  //
  // @internal
  // Written by the server when the run is created, from spec.file_ids, as it
  // writes run_config; the runner's status writes never touch it.
  repeated ai.stigmer.agentic.session.v1.ContentBlock message_files = 38;
}

// LoadedVersions lists what a run loaded besides its agent: one list per
// kind, each entry a reference to the exact version that ran.
message LoadedVersions {
  // Skills, each at its version hash (SkillStatus.version_hash). The version
  // is empty only for a skill whose last version failed to archive, which
  // loads as it is.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference skills = 1 [
    (ai.stigmer.commons.apiresource.reference_kind) = skill,
    (buf.validate.field).repeated.items.cel = {
      id: "loaded_versions.skill_id"
      message: "a loaded skill is named by id"
      expression: "this.id != ''"
    }
  ];

  // Plugins, each at its archive's digest (PluginStatus.digest). A plugin's
  // own skills, servers and hooks are named by its digest.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference plugins = 2 [
    (ai.stigmer.commons.apiresource.reference_kind) = plugin,
    (buf.validate.field).repeated.items.cel = {
      id: "loaded_versions.plugin_id"
      message: "a loaded plugin is named by id"
      expression: "this.id != ''"
    }
  ];
}

// RunCredentials records whose logins and secrets a turn uses.
message RunCredentials {
  // The person whose turn this is, by identity account id. Absent for a
  // turn no person sent: a routine's, a channel's (a chat-link guest's
  // included), an app user's or a machine account's, which use only the
  // vaults their session and their routine, channel or embedding settings
  // name.
  //
  // @internal
  // Set at create by the platform's one rule for a first-party human
  // operator (isFirstPartyHumanOperator): class user, from the wire, not a
  // minted user token; the trusted-local operator is one. The
  // value is the caller's identity id. Recover reads it and never
  // re-derives it from the recovering caller. Server-only: a client-sent
  // value is discarded at create.
  optional string person = 1;

  // Where each value the turn uses lives: one entry per key and declarer,
  // naming a vault and an entry, never a value. A runner fetches the
  // values from these vaults when the turn's work starts
  // (VaultValueController.fetchValues). An optional key nothing holds has
  // no entry.
  //
  // @internal
  // Planned at create and again on recover, by the vault resolver's one
  // rule (domain/vault/resolve.ts); server-only like person: a client-sent
  // value is discarded at create and status writes never change it. Vault
  // ids, not names: a run's status is read by everyone who may view the
  // conversation, a chat link's visitor included.
  repeated RunValueSource sources = 2;
}

// RunValueSource says where one value a turn uses lives. It names no value.
message RunValueSource {
  // The environment variable.
  string key = 1;

  // Who declared it.
  RunValueDeclarer declarer = 2;

  // Where it lives.
  RunValueOrigin origin = 3;

  // The vault holding it; empty for a repository's own token and a
  // declaration's default.
  string vault_id = 4;

  // The entry: a secret's name, a login's address, or the repository
  // entry's name for its own token; empty for a declaration's default.
  string entry = 5;

  // Whether the entry is a login (a connection at an address) rather than a
  // secret by name. A sign-in among them is renewed when it is fetched, as
  // the vault records it then.
  bool login = 6;

  // Field 7 held whether a login was a sign-in, which nothing read: the
  // fetch renews a login by what the vault holds when it is opened.
  reserved 7;
  reserved "sign_in";

  // A declaration's own plain default, the one value a manifest holds: it
  // is a fixed setting of the agent or tool, never a secret.
  string plain_value = 8;
}

// RunValueDeclarer names who declared a value a turn uses.
message RunValueDeclarer {
  // Agent, tool, plugin or repository.
  RunValueDeclarerKind kind = 1;

  // The agent's name; a tool's name, as plugin:<plugin>:<server> for a
  // plugin's server or the server's own name for one written in an agent;
  // the plugin's name; or the repository entry's name.
  string name = 2;

  // Field 3 held a tool's MCP server id, from a kind that no longer exists;
  // a tool is named by server and by plugin_id or agent_id.
  reserved 3;
  reserved "mcp_server_id";

  // The repository's URL; empty for an agent, a tool or a plugin.
  string repository_url = 4;

  // The plugin that declared it: a plugin's tool's plugin, or the plugin
  // whose hooks read it; empty for everything else.
  string plugin_id = 5;

  // The tool's server name in its plugin or its agent; empty for everything
  // else.
  string server = 6;

  // The archive of the tool's plugin this run planned (the plugin's
  // digest); empty for everything else. The values fetch reads the server
  // at that version, so a run of a pinned version keeps its tools when the
  // plugin is pushed again.
  string plugin_digest = 7;

  // The agent whose own server the tool is; empty for everything else.
  string agent_id = 8;

  // The version of that agent this run planned (its version hash); empty
  // for everything else. The values fetch reads the server at that version,
  // so a run of a pinned version keeps the address it planned when the
  // agent is edited.
  string agent_version = 9;
}

// Setup progress reported during the RUN_PENDING phase.
//
// @internal
// Designed as a sub-message (rather than a bare string) so future fields
// (completed_phases, total_phases, phase_index) can be added without
// deprecation or breaking changes.
message SetupProgress {
  // Human-readable label for the current setup phase.
  // Examples: "Initializing sandbox…", "Setting up workspace…", "Loading skills…"
  // Empty when setup phase reporting has not started or is complete.
  string current_phase = 1;
}
