syntax = "proto3";

package ai.stigmer.agentic.run.v1;

import "ai/stigmer/agentic/run/v1/enum.proto";
import "google/protobuf/timestamp.proto";

// ═══════════════════════════════════════════════════════════════════════════════
// USAGE METERING ENUMS
//
// Trust and lifecycle classification for usage records.
// ═══════════════════════════════════════════════════════════════════════════════

// Identifies who wrote the usage record and under what conditions.
enum UsageMeteringSource {
  USAGE_METERING_SOURCE_UNSPECIFIED = 0;

  // Cloud mode: Stigmer proxy observed provider-reported final usage from SSE stream.
  USAGE_METERING_SOURCE_PROXY_PROVIDER_REPORTED = 1;

  // OSS/BYOK mode: runner reports provider response usage directly.
  USAGE_METERING_SOURCE_RUNNER_PROVIDER_REPORTED_OSS = 2;

  // Estimate from tokenizer/preflight/local accounting. Never metering-authoritative in cloud mode.
  USAGE_METERING_SOURCE_ESTIMATED = 3;

  // Reconciliation from provider admin usage/cost reports.
  USAGE_METERING_SOURCE_PROVIDER_ADMIN_RECONCILED = 4;

  // Human/system manual adjustment.
  USAGE_METERING_SOURCE_MANUAL_ADJUSTMENT = 5;
}

// Declares what the record can be used for.
enum UsageTrustLevel {
  USAGE_TRUST_LEVEL_UNSPECIFIED = 0;

  // The proxy's own measurement of the provider-reported usage: the
  // metering source of truth.
  USAGE_TRUST_LEVEL_BILLING_AUTHORITY = 1;

  // Server-observed but not the metered usage (e.g., proxy timing).
  USAGE_TRUST_LEVEL_SERVER_OBSERVED = 2;

  // Display-only: runner-reported, never used for metering.
  USAGE_TRUST_LEVEL_DISPLAY_ONLY = 3;
}

// Status of provider-reported token usage extraction.
enum UsageCompletionStatus {
  USAGE_COMPLETION_STATUS_UNSPECIFIED = 0;

  // Provider reported complete final usage (normal case).
  USAGE_COMPLETION_STATUS_COMPLETE = 1;

  // Stream ended without final usage event (e.g., connection interrupted).
  USAGE_COMPLETION_STATUS_STREAM_INTERRUPTED = 2;

  // Provider returned error but included partial usage data.
  USAGE_COMPLETION_STATUS_PROVIDER_ERROR_WITH_USAGE = 3;

  // Provider returned error with no usage data.
  USAGE_COMPLETION_STATUS_PROVIDER_ERROR_NO_USAGE = 4;

  // Usage is estimated (tokenizer/preflight), not provider-reported.
  USAGE_COMPLETION_STATUS_ESTIMATED_ONLY = 5;

  // Reconciled against provider admin reports.
  USAGE_COMPLETION_STATUS_RECONCILED = 6;

  // Conflict: retry with different payload detected.
  USAGE_COMPLETION_STATUS_CONFLICT = 7;
}

// Whose provider credential served a proxied LLM call.
//
// The proxy picks the key, injects it upstream, and reports the same source
// with the usage payload, so the record never disagrees with what was sent
// on the wire.
enum ProviderKeySource {
  // The meter did not report whose credential served the call.
  PROVIDER_KEY_SOURCE_UNSPECIFIED = 0;

  // The organization's own provider key served the call (bring-your-own
  // provider keys): the provider bills the organization directly.
  PROVIDER_KEY_SOURCE_ORGANIZATION = 2;
}

// ═══════════════════════════════════════════════════════════════════════════════
// TOKEN USAGE
//
// Normalized token buckets. Covers all known provider token categories.
// ═══════════════════════════════════════════════════════════════════════════════

// Normalized token usage from a single LLM call.
// Disjoint buckets: every token falls into exactly one category for cost calculation.
message TokenUsage {
  // Regular input tokens (non-cached, non-tool, billed at standard input rate).
  int64 input_tokens = 1;

  // Output/completion tokens generated by the model.
  int64 output_tokens = 2;

  // Provider-reported total tokens. May differ from sum of other fields
  // because providers include reasoning/overhead differently.
  int64 total_tokens = 3;

  // Tokens written to prompt cache (Anthropic cache_creation_input_tokens).
  int64 cache_creation_input_tokens = 4;

  // Tokens read from prompt cache (cache hits).
  int64 cache_read_input_tokens = 5;

  // Reasoning/thinking tokens (OpenAI reasoning_tokens, Vertex thoughtsTokenCount).
  int64 reasoning_tokens = 6;

  // Tool-use prompt tokens (Vertex toolUsePromptTokenCount).
  int64 tool_use_prompt_tokens = 7;

  // Audio tokens (multimodal models).
  int64 audio_input_tokens = 8;
  int64 audio_output_tokens = 9;

  // Provider-specific token details not yet normalized.
  map<string, int64> provider_token_details = 20;
}

// ═══════════════════════════════════════════════════════════════════════════════
// PROXY TIMING
//
// Trusted server-side timing observations. Observability, not billing.
// ═══════════════════════════════════════════════════════════════════════════════

// Proxy-observed timing for a single LLM call.
// These are server-side measurements, not client-perceived latency.
message ProxyTiming {
  // When the proxy received the runner's request.
  google.protobuf.Timestamp proxy_received_at = 1;

  // When the proxy sent the request to the upstream provider.
  google.protobuf.Timestamp upstream_request_started_at = 2;

  // When the first response byte arrived from the provider.
  google.protobuf.Timestamp first_response_byte_at = 3;

  // When the last response byte arrived from the provider.
  google.protobuf.Timestamp last_response_byte_at = 4;

  // When the proxy completed its handling.
  google.protobuf.Timestamp proxy_completed_at = 5;

  // Derived durations in milliseconds.
  int64 upstream_ttfb_ms = 10;
  int64 upstream_ttlb_ms = 11;
  int64 stream_duration_ms = 12;
  int64 proxy_total_duration_ms = 13;

  // Transfer sizes.
  int64 request_bytes = 20;
  int64 response_bytes = 21;
}

// ═══════════════════════════════════════════════════════════════════════════════
// LLM CALL USAGE RECORD (Per-Call Authoritative)
//
// Immutable metering record for a single LLM provider call. Written by the
// proxy (cloud) or runner (OSS). Stored in its own table. This is the
// metering source of truth: what each call was, never what it cost.
// ═══════════════════════════════════════════════════════════════════════════════

// Immutable, metering-authoritative record for a single LLM API call.
//
// Written by the proxy after each SSE stream completes (cloud mode) or by
// the runner directly (OSS mode). Stored in the `llm_call_usage_record`
// table, never embedded in the run document.
//
// ## Lifecycle
// 1. Proxy observes SSE stream completion and extracts final usage
// 2. Server resolves the call against the model catalog (harness, served
//    tier, thinking mode) and inserts LlmCallUsageRecord (idempotent by
//    idempotency_key)
//
// ## Idempotency
// Unique on idempotency_key: run_id + the call's identity + metering_source,
// where the identity is call_id when the reporter supplied one, else sequence.
// Insert-only; never mutated.
message LlmCallUsageRecord {
  // ─── Identity ───────────────────────────────────────────────────────────────
  // Stable unique ID for this record (ULID).
  string usage_record_id = 1;

  // Run this call belongs to.
  string run_id = 2;

  // For subagent rollups: root run of the tree.
  string root_run_id = 3;

  // 1-based call ordering within the run, as the reporting proxy
  // counted it. An ordering hint, not an identity: a proxy that restarts
  // mid-run counts from 1 again, so two records of one run may
  // share a sequence. Order by observed_at, then sequence.
  int32 sequence = 4;

  // Deduplication key: run_id + (call_id, else sequence) + metering_source.
  string idempotency_key = 5;

  // Hash of normalized payload for conflict detection on retries.
  string canonical_payload_hash = 6;

  // The call's identity as the reporting proxy minted it (RecordLlmCallUsageInput.call_id),
  // stamped verbatim; the idempotency key is built on it. Empty for records
  // whose reporter sent no call id; those key on sequence.
  string call_id = 9;

  // ─── Timestamps ─────────────────────────────────────────────────────────────
  // When the proxy observed stream completion.
  google.protobuf.Timestamp observed_at = 10;

  // When this record was created in the database.
  google.protobuf.Timestamp created_at = 11;

  // ─── Trust / Source ─────────────────────────────────────────────────────────
  // Who wrote this record and at what trust level.
  UsageMeteringSource metering_source = 20;
  UsageTrustLevel trust_level = 21;
  UsageCompletionStatus usage_status = 22;

  // ─── Provider / Request Metadata ────────────────────────────────────────────
  string provider = 30;
  string requested_model = 31;
  string resolved_model = 32;
  string endpoint = 33;
  bool streaming = 34;
  string service_tier = 35;
  string provider_request_id = 36;
  string harness = 37;

  int32 http_status_code = 40;
  string finish_reason = 41;
  string error_code = 42;

  // Whose provider credential served this call. ORGANIZATION marks a call on
  // the organization's own key, which is metered and never charged;
  // UNSPECIFIED marks a call whose meter did not report it.
  ProviderKeySource provider_key_source = 45;

  // Billed thinking mode derived from wire evidence ("enabled"/"disabled"),
  // mirroring service_tier's convention; empty when the wire carries no
  // evidence — never guessed. Thinking is per-token price-neutral
  // (stigmer/stigmer#772), so this field feeds the requested-vs-billed
  // consumption-drift reconciliation.
  string thinking = 44;

  // ─── Token Usage ────────────────────────────────────────────────────────────
  TokenUsage tokens = 50;

  // ─── Proxy Timing ──────────────────────────────────────────────────────────
  // Present when metering_source is PROXY_PROVIDER_REPORTED.
  ProxyTiming proxy_timing = 60;

  // ─── Raw Provider Usage ─────────────────────────────────────────────────────
  // Compact JSON of provider's raw usage object for audit/debug.
  string provider_usage_json = 70;

  // ─── Scope ──────────────────────────────────────────────────────────────────
  // Denormalized from the run for direct queries by org and session.
  // Populated at write time by the billing handler.

  // Organization that owns this run.
  string org = 7;

  // Session this run belongs to.
  string session_id = 8;

  // ─── Labels ─────────────────────────────────────────────────────────────────
  // Custom metadata for filtering (e.g., agent_path, node_path).
  map<string, string> labels = 90;
}

// ═══════════════════════════════════════════════════════════════════════════════
// USAGE REPORT TYPES
//
// Aggregate types used by usage report RPC responses. Usage is counted in
// tokens and calls, never priced: every token count is int64.
//
// Each run is counted from one source. When the deployment meters model
// calls (a proxy that writes LlmCallUsageRecord), a run it metered is
// counted from those records. Any other run is counted from its runner's
// own report (RunStatus.streaming_usage) and marked estimated. A
// deployment with no meter counts every run the second way.
// ═══════════════════════════════════════════════════════════════════════════════

// Aggregated usage across a scope (run, session, agent, or org).
//
// Used as the aggregate of a run report and the `total_usage` of the
// session, agent and organization reports. All token fields are int64 to
// support large aggregates (org-wide, multi-day).
message UsageReportAggregate {
  // Non-cached input tokens (disjoint from the cache buckets below).
  int64 input_tokens = 1;
  // Output/completion tokens.
  int64 output_tokens = 2;
  // Total tokens across all calls: the sum of each call's provider-reported
  // total (cache-inclusive). This is NOT input_tokens + output_tokens —
  // input_tokens excludes cached tokens, which are tracked in the buckets
  // below, so total_tokens = input + output + cache_creation + cache_read.
  int64 total_tokens = 3;
  int64 cache_creation_input_tokens = 4;
  int64 cache_read_input_tokens = 5;
  int64 reasoning_tokens = 6;

  // Seconds an agent was working (thinking, calling tools, writing files),
  // counted from the session's status events; waiting for a person is never
  // working. A stretch of work is credited to the run whose start began it.
  // This is the clock, never priced; a Stigmer Cloud plan's agent hours are
  // its subscription's getAgentHours.
  int64 working_seconds = 7;

  // Number of metered LLM API calls in this aggregate. A run counted from
  // its runner's own report adds its tokens and no calls.
  int32 llm_call_count = 10;

  // Primary model and provider: the model with the most tokens in this
  // aggregate. The provider is empty when a runner-reported run's harness
  // names none.
  string primary_model = 30;
  string primary_provider = 31;

  // The aggregate's tokens and calls by whose provider credential served
  // them. The rows always sum to total_tokens and llm_call_count.
  repeated ServedByUsage served_by = 40;
}

// Usage served by one kind of provider credential within an aggregate.
message ServedByUsage {
  // Whose credential served the calls. UNSPECIFIED counts the tokens whose
  // server is not known: a run counted from its runner's own report, or a
  // metered call whose meter did not report the credential.
  ProviderKeySource provider_key_source = 1;

  // Total tokens served this way (cache-inclusive, as the aggregate's).
  int64 total_tokens = 2;

  // Number of metered LLM API calls served this way.
  int32 llm_call_count = 3;
}

// Per-model usage breakdown within a report scope.
//
// Groups token counts by (model, provider) pair. Used in model_breakdown
// repeated fields on report responses, ordered by total_tokens descending.
message ModelUsage {
  // Model identifier as resolved by the provider.
  string model = 1;

  // LLM provider (e.g., "openai", "anthropic").
  string provider = 2;

  // Token counts for this model.
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  int64 cache_creation_input_tokens = 5;
  int64 cache_read_input_tokens = 6;

  // Number of metered LLM API calls to this model.
  int32 call_count = 7;

  // Total tokens for this model (cache-inclusive, as the aggregate's).
  int64 total_tokens = 10;
}

// ═══════════════════════════════════════════════════════════════════════════════
// RUN USAGE SUMMARY
//
// Provisional usage captured from the execution worker's onDelta callbacks
// during streaming. Updated progressively as turn-ended events arrive.
//
// Trust level: DISPLAY_ONLY. This data is reported by the execution worker
// (which may run on untrusted user machines) and is NOT metering-authoritative.
// The usage reports count a run from it, marked estimated, only when the
// deployment has not metered the run.
//
// The metered record of each call is LlmCallUsageRecord from the proxy,
// for every harness.
// ═══════════════════════════════════════════════════════════════════════════════

// Accumulated token usage from execution worker turn-ended events.
// Carried on RunStatus.streaming_usage for real-time streaming UX.
message StreamingUsageSummary {
  // Accumulated input tokens across all turns.
  int64 input_tokens = 1;

  // Accumulated output tokens across all turns.
  int64 output_tokens = 2;

  // Accumulated cache-read tokens across all turns.
  int64 cache_read_tokens = 3;

  // Accumulated cache-write tokens across all turns.
  int64 cache_write_tokens = 4;

  // Total tokens across all turns: input_tokens + output_tokens; the cache
  // buckets are NOT added again here.
  int64 total_tokens = 5;

  // Number of completed turns observed.
  int32 turn_count = 6;

  // Estimated cost in USD computed from the runner-side rate card (the
  // providers' list prices): the working number of the run's cost cap
  // (RunConfig.max_cost_usd). No usage report reads it.
  double estimated_cost_usd = 7;

  // Model identifier the runner requested for this run's turns.
  //
  // @internal
  // This is the validated REQUESTED model (UsageAccumulator constructor
  // argument), not a provider-reported resolved id: the authoritative
  // resolved model lives on billing's LlmCallUsageRecord
  // (requested_model / resolved_model / service_tier), not here.
  string model = 8;

  // ISO 8601 timestamp of the last turn-ended event observed.
  string observed_at = 9;

  // Service tier the runner requested for this run's model calls.
  //
  // Always explicit once the runner has translated the turn's settings
  // (STANDARD when RunStatus.run_config.service_tier was unset) — the audit
  // record that the account default was never left in control.
  ServiceTier requested_service_tier = 10;

  // JSON-encoded provider variant parameters the runner sent with the model
  // selection (e.g. [{"id":"fast","value":"false"}]). Empty when the
  // harness sent none.
  //
  // @internal
  // Recorded verbatim for audit: tier→params translation depends on the
  // provider catalog at send time, so the derivation is not reproducible
  // later from the tier alone.
  string requested_model_params = 11;

  // Thinking mode the runner requested for this run's model calls.
  //
  // Always explicit once the runner has translated the turn's settings
  // (DISABLED when RunStatus.run_config.thinking_mode was unset) — the audit
  // record that the account default was never left in control
  // (stigmer/stigmer#772; several catalog defaults are thinking=true).
  ThinkingMode requested_thinking_mode = 12;
}
