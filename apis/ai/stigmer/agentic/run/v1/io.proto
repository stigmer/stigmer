syntax = "proto3";

package ai.stigmer.agentic.run.v1;

import "ai/stigmer/agentic/run/v1/api.proto";
import "ai/stigmer/agentic/run/v1/enum.proto";
import "ai/stigmer/agentic/run/v1/usage.proto";
import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";

// RunId wraps a run identifier.
message RunId {
  string value = 1 [(buf.validate.field).required = true];
}

// SessionId wraps a session identifier for filtering.
message SessionId {
  string value = 1 [(buf.validate.field).required = true];
}

// RunList contains one page of runs, newest first.
message RunList {
  reserved 1;
  reserved "total_pages";

  // Runs in this page, newest first.
  repeated Run entries = 2;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 3;
}

// ListRunsRequest specifies parameters for listing runs.
message ListRunsRequest {
  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 1 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 2 [(buf.validate.field).string.max_len = 1024];

  // Filter by run phase (optional).
  RunPhase phase = 3;

  reserved 4;
  reserved "tags";

  // Organization slug to scope the results to.
  //
  // When set, only runs whose metadata.org matches are returned — the
  // org-context view a console tab needs. When empty, results are bounded
  // only by the caller's view permissions, which for a member of several
  // organizations spans all of them.
  //
  // @internal
  // Optional by design: pre-existing callers rely on the permission-bounded
  // behavior. Every edition honours it in the store's indexed read, never
  // client-side.
  string org = 5;

  // Only resources carrying every label given, each matched exactly (AND).
  // A selective filter may answer short pages, even empty ones, that still
  // carry a token.
  map<string, string> labels = 6;
}

// ListRunsBySessionRequest lists the runs of a session, newest first, one
// page at a time.
message ListRunsBySessionRequest {
  // Session ID to filter by.
  string session_id = 1 [(buf.validate.field).required = true];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];

  // Only resources carrying every label given, each matched exactly (AND).
  // A selective filter may answer short pages, even empty ones, that still
  // carry a token.
  map<string, string> labels = 4;
}

// Input message for updateStatus RPC.
// Contains only the run ID and the status fields to be updated.
// This avoids validation errors on incomplete metadata/spec fields and makes the API contract clearer.
message RunUpdateStatusInput {
  // ID of the run to update (required).
  // Format: "run_abc123xyz456"
  string run_id = 1 [(buf.validate.field).string.min_len = 1];

  // Status fields to update.
  // The handler will merge these status fields with the existing run's status.
  // Only the fields present in this status object will be updated.
  RunStatus status = 2 [(buf.validate.field).required = true];
}

// UpdateStatusResponse is the lightweight response returned by the
// updateStatus RPC. It replaces the previous Run return type
// to avoid serializing the full resource on every progressive update
// (~every 2-3 seconds during streaming).
//
// The response carries an optional run control signal from the
// platform back to the runner. The signal is generic — the runner acts
// on STOP / WARNING without knowing the source (billing, admin, budget).
message UpdateStatusResponse {
  // Platform-to-runner directive. UNSPECIFIED means continue normally.
  RunControlSignal signal = 1;

  // Human-readable reason for the signal (optional).
  // Logged by the runner and may be surfaced to the user in the stop summary.
  string signal_reason = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Lifecycle Control Input Messages
//
// These messages are used by lifecycle control RPCs (terminate, recover,
// pause, resume) to manage run state.
// ─────────────────────────────────────────────────────────────────────────────

// TerminateRunInput requests immediate termination of a run.
//
// Termination forcefully stops the run without allowing cleanup.
// Unlike an interrupt, the agent cannot respond to termination - it is stopped
// immediately. Use this for stuck or unresponsive runs. The run moves to
// RUN_TERMINATED at once, and any tool call in progress is stopped abruptly.
//
// ## Preconditions
//
// - Run must be in RUN_PENDING or RUN_IN_PROGRESS phase
// - User must have can_edit permission on the run
//
// ## Idempotency
//
// If the run is already terminated (phase == RUN_TERMINATED),
// the call succeeds as a no-op and returns the current run state.
//
// ## Terminated vs Cancelled
//
// | Aspect | Interrupt (session) | Terminate |
// |--------|--------|-----------|
// | Signal | The agent is told to stop | Nothing is sent |
// | Cleanup | The turn ends cleanly | No cleanup possible |
// | Use case | Normal cancellation | Stuck/unresponsive agents |
// | Recovery | Cannot recover | Cannot recover |
//
// ## Use Cases
//
// - Agent is stuck and not responding to cancellation
// - Agent is in an infinite loop
// - Emergency stop for misbehaving agent
// - Agent has a bug causing it to ignore cancellation signals
//
// ## Example
//
// {
//   "id": "run_abc123xyz456",
//   "reason": "Agent stuck in infinite loop, not responding to cancel"
// }
//
// @internal
//
// ## Behavior
//
// - Force-kills workflow via Temporal TerminateWorkflow API
// - Agent activity does NOT receive any signal (cannot clean up)
// - Run transitions to RUN_TERMINATED phase immediately
// - All in-progress tool calls are stopped abruptly
// - The native harness's LangGraph checkpoint may be incomplete
message TerminateRunInput {
  // Run ID to terminate.
  //
  // Format: "run_{ulid}" (auto-generated unique identifier)
  // Example: "run_abc123xyz456"
  //
  // Validation: Required, cannot be empty
  string id = 1 [(buf.validate.field).string.min_len = 1];

  // Human-readable reason for termination.
  //
  // Stored in the audit trail for operational debugging.
  // Optional but strongly recommended - termination is a drastic action
  // and the reason helps with post-incident analysis.
  //
  // Examples:
  // - "Agent stuck for 30 minutes, not responding to cancel"
  // - "Infinite loop detected in tool calls"
  // - "Emergency stop - agent making unexpected API calls"
  // - "Cancel failed after 3 attempts, force terminating"
  string reason = 2;
}

// RecoverRunInput requests recovery of a failed run.
//
// Recovery retries the failed run while preserving all completed work. The
// agent continues from where it failed without re-executing successful steps.
// The run moves from RUN_FAILED back to RUN_IN_PROGRESS.
//
// ## Preconditions
//
// - Run must be in RUN_FAILED phase
// - TERMINATED runs cannot be recovered (their saved state may be incomplete)
// - CANCELLED runs cannot be recovered (intentional user action)
// - User must have can_edit permission on the run
//
// ## Idempotency
//
// If recovery is already in progress (run moved to IN_PROGRESS after
// a previous recover call), the call succeeds as a no-op and returns current state.
//
// ## Use Cases
//
// - Agent failed due to transient error (network timeout, rate limit)
// - External API was down but is now available
// - Bug was fixed and agent should continue from failure point
// - Retry after investigating and fixing the root cause
//
// ## Example
//
// {
//   "id": "run_abc123xyz456"
// }
//
// @internal
//
// ## Behavior
//
// - Terminates the previous Temporal workflow and starts a fresh one
// - On the native harness, the LangGraph checkpoint is loaded using the
//   preserved thread_id, so completed work carries over from the session's
//   harness state
// - Completed tool calls are NOT re-executed
// - Run transitions from FAILED back to IN_PROGRESS phase
// - Agent retries from where it failed
message RecoverRunInput {
  // Run ID to recover.
  //
  // Must be in FAILED phase. TERMINATED and CANCELLED runs
  // cannot be recovered.
  //
  // Format: "run_{ulid}" (auto-generated unique identifier)
  // Example: "run_abc123xyz456"
  //
  // Validation: Required, cannot be empty
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// PauseRunInput requests temporarily pausing a run.
//
// Pauses the agent where it is. Unlike an interrupt, the run is NOT terminal:
// it reads RUN_PAUSED, uses no resources while paused, and the resume RPC
// continues it from where it left off.
//
// ## Preconditions
//
// - Run must be in RUN_PENDING or RUN_IN_PROGRESS phase
// - Cannot pause already paused or terminal runs
//
// ## Use Cases
//
// - User wants to review agent progress before continuing
// - Scheduled maintenance window requires pausing work
// - Rate limit concerns require throttling agent work
// - Need to modify agent configuration before continuing
//
// ## Example
//
// {
//   "id": "run_abc123xyz456",
//   "reason": "Pausing to review progress before continuing"
// }
//
// @internal
//
// ## Behavior
//
// When an agent is paused:
// 1. A "pause" signal is sent to the Temporal workflow
// 2. Running activity is gracefully cancelled (checkpoint saved)
// 3. On the native harness, LangGraph auto-saves its checkpoint on cancellation
// 4. Run transitions to RUN_PAUSED phase
// 5. Workflow waits for resume signal (no resources consumed)
//
// ## Resume Flow
//
// The paused agent can be resumed via the resume RPC:
// 1. Resume signal unblocks the workflow
// 2. Activity is re-invoked with same thread_id
// 3. On the native harness, LangGraph loads from checkpoint automatically
// 4. Agent continues from exact pause point
message PauseRunInput {
  // Run ID to pause.
  //
  // Must be in PENDING or IN_PROGRESS phase. Cannot pause
  // runs that are already terminal (COMPLETED, FAILED, CANCELLED, TERMINATED).
  //
  // Format: "run_{ulid}" (auto-generated unique identifier)
  // Example: "run_abc123xyz456"
  //
  // Validation: Required, cannot be empty
  string id = 1 [(buf.validate.field).string.min_len = 1];

  // Human-readable reason for pausing.
  //
  // Stored in the audit trail for operational debugging and compliance.
  // Helps track why the pause was needed.
  //
  // Examples:
  // - "Pausing for scheduled maintenance window"
  // - "User requested pause to review progress"
  // - "Pausing due to rate limit concerns"
  // - "Emergency pause - investigating issue"
  string reason = 2;
}

// ResumeRunInput requests resuming a paused run.
//
// Continues the run from where it was paused; the run moves back to
// RUN_IN_PROGRESS. How a turn's state is saved is the harness's
// ([Harnesses](/docs/concepts/harnesses)).
//
// ## Preconditions
//
// - Run must be in RUN_PAUSED phase
// - Cannot resume non-paused runs
//
// ## Idempotency
//
// If the run is not paused (already IN_PROGRESS),
// the call succeeds as a no-op and returns the current run state.
//
// ## Example
//
// {
//   "id": "run_abc123xyz456"
// }
// {
//   "id": "run_abc123xyz456"
// }
//
// @internal
//
// ## Behavior
//
// When an agent is resumed:
// 1. A "resume" signal is sent to the paused Temporal workflow
// 2. Workflow unblocks from its wait state
// 3. Activity is re-invoked with the same input
// 4. On the native harness, LangGraph loads its checkpoint using thread_id
// 5. Agent continues from exact pause point
message ResumeRunInput {
  // Run ID to resume.
  //
  // Must be in PAUSED phase. Cannot resume runs
  // that are not paused.
  //
  // Format: "run_{ulid}" (auto-generated unique identifier)
  // Example: "run_abc123xyz456"
  //
  // Validation: Required, cannot be empty
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// ─────────────────────────────────────────────────────────────────────────────
// Artifact Lifecycle Messages
//
// These messages support the artifacts (outputs) agents create during a
// run. A run's input files are Files (RunSpec.file_ids).
// ─────────────────────────────────────────────────────────────────────────────

// GetArtifactDownloadUrlRequest requests a download URL for a run artifact.
//
// This endpoint generates presigned URLs for artifacts published by agents
// during the run. The URLs are time-limited and can be used for direct
// HTTP download without authentication.
//
// ## Authorization
//
// Requires can_view permission on the run. This ensures users can only
// access artifacts from runs they have access to.
//
// ## Security
//
// The storage_key is validated to ensure it belongs to the specified run.
// Storage keys must start with "artifacts/{run_id}/" to prevent path
// traversal attacks where a user could request URLs for other runs'
// artifacts.
//
// ## Use Cases
//
// - CLI downloading agent-created files
// - Web UI providing download links for artifacts
// - Refreshing expired download URLs
//
// ## Example
//
// Request:
// {
//   "run_id": "run_abc123xyz456",
//   "storage_key": "artifacts/run_abc123xyz456/generated-skill.zip"
// }
//
// Response:
// {
//   "download_url": "https://r2.example.com/...",
//   "expires_at": "2026-02-20T10:30:00Z"
// }
message GetArtifactDownloadUrlRequest {
  // ID of the run that produced the artifact.
  //
  // Used for authorization (can_view check) and storage_key validation.
  //
  // Format: "run_{ulid}"
  // Example: "run_abc123xyz456"
  //
  // Validation: Required, minimum 1 character
  string run_id = 1 [(buf.validate.field).string.min_len = 1];

  // Storage key of the artifact to download.
  //
  // Must be an artifact from the specified run. The storage_key
  // is validated to start with "artifacts/{run_id}/" to prevent
  // access to other runs' artifacts.
  //
  // Obtain this value from RunArtifact.storage_key in the run status.
  //
  // Format: "artifacts/{run_id}/{filename}"
  // Example: "artifacts/run_abc123xyz456/generated-skill.zip"
  //
  // Validation: Required, minimum 1 character
  string storage_key = 2 [(buf.validate.field).string.min_len = 1];

  // Whether the URL should force a browser download instead of inline display.
  //
  // When true, the presigned URL carries a Content-Disposition: attachment
  // header keyed to the artifact's filename, so a browser navigating to it
  // saves the file rather than rendering it in a tab. Browsers ignore the
  // HTML `download` attribute on cross-origin URLs (e.g. presigned R2), so
  // the disposition MUST be signed into the URL itself — this flag is how a
  // caller requests it.
  //
  // When false (the default), the URL displays inline. Inline is required for
  // rendering surfaces such as an `<img src>` pointing at an offloaded
  // screenshot; forcing a download there would break the render.
  //
  // Use true for click-to-download affordances; false (or unset) for inline
  // rendering and programmatic reads.
  bool as_attachment = 3;
}

// GetArtifactDownloadUrlResponse returns a presigned download URL for an artifact.
//
// The download_url can be used with a simple HTTP GET request to download
// the artifact. No authentication headers are required - the URL contains
// embedded authorization.
message GetArtifactDownloadUrlResponse {
  // Presigned URL for downloading the artifact.
  //
  // Valid for direct HTTP GET request without authentication.
  // The URL includes embedded authorization that expires at expires_at.
  //
  // Example: "https://r2.cloudflarestorage.com/bucket/artifacts/...?X-Amz-Signature=..."
  // With local storage the URL is the server's artifact file server,
  // signed by the server: "http://localhost:7235/artifacts/...?exp=...&sig=..."
  string download_url = 1;

  // ISO 8601 timestamp when the download URL expires.
  //
  // After this time, the URL will no longer work and a new URL
  // must be requested via this endpoint.
  //
  // Default expiration: 7 days from generation.
  //
  // Example: "2026-02-20T10:30:00Z"
  string expires_at = 2;
}

// GetArtifactContentRequest reads the raw content of a run artifact.
//
// Unlike getArtifactDownloadUrl (which returns a presigned URL for direct
// browser download), this endpoint returns the artifact bytes through the
// Stigmer API. This eliminates CORS concerns for SDK consumers who need to
// read artifact content programmatically — e.g., for YAML parsing, resource
// detection, or in-app preview rendering.
//
// ## Authorization
//
// Requires can_view permission on the run. This ensures users can only
// read artifacts from runs they have access to.
//
// ## Security
//
// The storage_key is validated to ensure it belongs to the specified run.
// Storage keys must start with "artifacts/{run_id}/" to prevent path
// traversal attacks where a user could request content from other runs'
// artifacts.
//
// ## Size Limit
//
// The server enforces a maximum content size (default: 512 KB). If the
// artifact exceeds max_bytes, the response contains the first max_bytes of
// content with truncated=true. Callers can use total_size_bytes to decide
// whether to offer a full download via getArtifactDownloadUrl instead.
//
// ## Use Cases
//
// - Web UI reading YAML artifacts for Stigmer resource detection
// - SDK consumers rendering artifact previews in embedded components
// - CLI inspecting artifact content without a separate HTTP download
//
// ## Example
//
// Request:
// {
//   "run_id": "run_abc123xyz456",
//   "storage_key": "artifacts/run_abc123xyz456/pr-review-agent.yaml"
// }
//
// Response:
// {
//   "content": <bytes>,
//   "content_type": "text/yaml",
//   "total_size_bytes": 1842,
//   "truncated": false
// }
message GetArtifactContentRequest {
  // ID of the run that produced the artifact.
  //
  // Used for authorization (can_view check) and storage_key validation.
  //
  // Format: "run_{ulid}"
  // Example: "run_abc123xyz456"
  //
  // Validation: Required, minimum 1 character
  string run_id = 1 [(buf.validate.field).string.min_len = 1];

  // Storage key of the artifact to read.
  //
  // Must be an artifact from the specified run. The storage_key
  // is validated to start with "artifacts/{run_id}/" to prevent
  // access to other runs' artifacts.
  //
  // Obtain this value from RunArtifact.storage_key in the run status.
  //
  // Format: "artifacts/{run_id}/{filename}"
  // Example: "artifacts/run_abc123xyz456/pr-review-agent.yaml"
  //
  // Validation: Required, minimum 1 character
  string storage_key = 2 [(buf.validate.field).string.min_len = 1];

  // Maximum number of bytes to return.
  //
  // If the artifact is larger than this limit, the response will contain
  // the first max_bytes of content with truncated=true.
  //
  // When 0 or unset, the server applies a default limit (512 KB).
  // The server may also enforce a hard upper bound regardless of this value.
  //
  // Example: 524288 (512 KB)
  int64 max_bytes = 3;

  // For directory artifacts (ZIPs): extract a specific file by its
  // path within the archive instead of returning the raw ZIP bytes.
  //
  // When empty, returns the full artifact content (existing behavior).
  // When set for a FILE artifact, this field is ignored.
  //
  // The path must match an entry in the archive exactly (case-sensitive).
  // Use the paths from RunArtifact.entries to discover valid values.
  //
  // Example: "SKILL.md", "scripts/init_skill.py"
  string entry_path = 4;
}

// GetArtifactContentResponse returns the raw content of a run artifact.
//
// The content field contains the artifact bytes (up to max_bytes). For text
// artifacts, clients decode via TextDecoder or equivalent. The content_type
// field provides a hint for rendering (detected by file extension).
message GetArtifactContentResponse {
  // Raw artifact content (up to max_bytes).
  //
  // For text artifacts (YAML, JSON, Markdown, etc.), decode as UTF-8.
  // For binary artifacts, this contains raw bytes — but callers should
  // generally use getArtifactDownloadUrl for binary downloads instead.
  bytes content = 1;

  // Detected content type based on file extension.
  //
  // Examples: "text/yaml", "text/plain", "application/json",
  // "application/zip" (for directory artifacts).
  //
  // This is a best-effort detection — not based on content inspection.
  string content_type = 2;

  // Actual total size of the artifact in bytes.
  //
  // May be larger than len(content) when truncated=true.
  // Callers can use this to show "showing 512 KB of 2.1 MB" messages
  // or to decide whether to offer a full download link.
  int64 total_size_bytes = 3;

  // Whether the content was truncated to fit within max_bytes.
  //
  // When true, content contains only the first max_bytes of the artifact.
  // The full artifact can be downloaded via getArtifactDownloadUrl.
  bool truncated = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// Usage Report Types
//
// Request/response messages for usage reporting RPCs that show token
// consumption at run, session, agent, and organization levels. Usage is
// counted in tokens and calls, never priced; token counts are int64.
// A run the deployment's meter recorded is counted from its
// metered model calls; any other run from its runner's own report, marked
// estimated.
// ─────────────────────────────────────────────────────────────────────────────

// GetRunUsageReportInput requests a usage report for a single run.
message GetRunUsageReportInput {
  // Run ID to get usage report for.
  string run_id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetRunUsageReportOutput returns aggregated usage for one run.
message GetRunUsageReportOutput {
  // Aggregated token counts for this run.
  UsageReportAggregate aggregate = 1;

  // Per-model breakdown within this run.
  repeated ModelUsage model_breakdown = 2;
}

// GetSessionUsageReportInput requests a usage report for a single session.
// Aggregates token data across all runs in the session.
message GetSessionUsageReportInput {
  // Session ID to get usage report for.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetSessionUsageReportOutput returns aggregated usage for a session.
//
// Provides both the session-level totals and per-run breakdown,
// enabling drill-down from "this session used 90k tokens" to "run #3
// used 12k of them on claude-sonnet-4."
message GetSessionUsageReportOutput {
  // Session identifier.
  string session_id = 1;

  // Total number of runs in this session.
  int32 run_count = 2;

  // Aggregated usage across all runs in this session.
  UsageReportAggregate total_usage = 3;

  // Per-run breakdown (ordered chronologically).
  repeated RunUsageSummary runs = 4;

  // Per-model breakdown across the entire session.
  repeated ModelUsage model_breakdown = 5;

  // ISO 8601 timestamp of the first run in this session.
  string first_run_at = 6;

  // ISO 8601 timestamp of the most recent run in this session.
  string last_run_at = 7;

  // Whether any run in this session is counted from its runner's own report
  // rather than from the deployment's metered model calls.
  bool is_estimated = 8;
}

// GetAgentUsageReportInput requests a usage report for a specific agent
// within one organization. Aggregates token data across the org's
// sessions of the agent within a time range.
message GetAgentUsageReportInput {
  // Agent ID to get usage report for.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];

  // Start of the time range, inclusive: a UTC calendar day ("2026-03-01",
  // from its first instant) or an RFC 3339 instant. A run is in the range
  // when it was created in it.
  string from_date = 2;

  // End of the time range, inclusive: a UTC calendar day ("2026-03-13",
  // through its last instant) or an RFC 3339 instant.
  string to_date = 3;

  reserved 4;
  reserved "page_size";

  reserved 5;
  reserved "page_token";

  // Organization scope for the report: usage of this agent within this
  // organization. Only runs belonging to this organization are
  // aggregated. The caller must hold can_view on the organization.
  string org = 6 [(buf.validate.field).string.min_len = 1];
}

// GetAgentUsageReportOutput returns aggregated usage for an agent.
//
// Provides agent-level totals, per-model breakdown, and per-session
// summaries within the requested time range.
message GetAgentUsageReportOutput {
  // Agent identifier.
  string agent_id = 1;

  // Human-readable agent name for display.
  string agent_name = 2;

  // Aggregated usage within the time range.
  UsageReportAggregate total_usage = 3;

  // Per-model breakdown across the agent's runs.
  repeated ModelUsage model_breakdown = 4;

  // Per-session breakdown within the time range.
  repeated SessionUsageSummary sessions = 5;

  // Total number of sessions within the time range.
  int32 total_sessions = 6;

  // Total number of runs within the time range.
  int32 total_runs = 7;

  // 8 held total_billable_cost_micros, the agent's charged amount. Usage is
  // counted in tokens and never priced, so the number and the name are
  // reserved so neither is ever reused for a different field.
  reserved 8;
  reserved "total_billable_cost_micros";

  reserved 9;
  reserved "next_page_token";
}

// GetOrgUsageReportInput requests a usage report for an entire organization.
// Aggregates token data across all agents and sessions within a time range
// that the caller can read.
message GetOrgUsageReportInput {
  // Organization ID.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // Start of the time range, inclusive: a UTC calendar day ("2026-03-01",
  // from its first instant) or an RFC 3339 instant. A run is in the range
  // when it was created in it. Required.
  string from_date = 2 [(buf.validate.field).string.min_len = 1];

  // End of the time range, inclusive: a UTC calendar day ("2026-03-13",
  // through its last instant) or an RFC 3339 instant. Required.
  string to_date = 3 [(buf.validate.field).string.min_len = 1];
}

// GetOrgUsageReportOutput returns aggregated usage for an organization.
//
// Provides org-level totals, per-model breakdown, the agents with the most
// tokens, and a daily token trend. It counts only the runs the caller can
// read, and names only their agents.
message GetOrgUsageReportOutput {
  // Organization identifier.
  string org = 1;

  // Total distinct agents with runs in the time range.
  int32 total_agents = 2;

  // Total sessions across all agents in the time range.
  int32 total_sessions = 3;

  // Total runs across all agents in the time range.
  int32 total_runs = 4;

  // 5 held total_billable_cost_micros; 7, 8 and 9 held top_agents_by_cost,
  // daily_costs and harness_breakdown, which ordered, dated and split the
  // organization's charged amount. Usage is counted in tokens and never
  // priced: fields 10 to 12 replace them, and the numbers and the names
  // are reserved so neither is ever reused for a different field.
  reserved 5, 7, 8, 9;
  reserved "total_billable_cost_micros", "top_agents_by_cost", "daily_costs", "harness_breakdown";

  // Per-model breakdown across the organization.
  repeated ModelUsage model_breakdown = 6;

  // The ten agents with the most tokens, ordered by total_tokens descending.
  repeated AgentUsageSummary top_agents = 10;

  // Daily token trend within the time range, one row per UTC day that has a
  // run, ordered chronologically.
  repeated DailyUsage daily_usage = 11;

  // Usage split by execution harness (e.g., "native" vs "cursor").
  repeated HarnessUsage harness_usage = 12;

  // Aggregated usage across the organization in the time range.
  UsageReportAggregate total_usage = 13;
}

// ─────────────────────────────────────────────────────────────────────────────
// Usage Report Supporting Types
//
// Lightweight summary types used within usage report responses.
// All token counts are int64.
// ─────────────────────────────────────────────────────────────────────────────

// Lightweight view of a single run's usage within a session report.
message RunUsageSummary {
  // Run identifier.
  string run_id = 1;

  // ISO 8601 timestamp when the run started.
  string started_at = 2;

  // ISO 8601 timestamp when the run completed.
  string completed_at = 3;

  // Input tokens for this run.
  int64 input_tokens = 4;

  // Output tokens for this run.
  int64 output_tokens = 5;

  // Cache read tokens for this run.
  int64 cache_read_input_tokens = 6;

  // 7 held billable_cost_micros, the run's charged amount. Usage is counted
  // in tokens and never priced, so the number and the name are reserved so
  // neither is ever reused for a different field.
  reserved 7;
  reserved "billable_cost_micros";

  // Primary model used for this run.
  string primary_model = 8;

  // Number of subagent invocations in this run.
  int32 sub_agent_count = 9;

  // Terminal phase of this run.
  RunPhase phase = 10;

  // Whether this run is counted from its runner's own report rather than
  // from the deployment's metered model calls.
  bool is_estimated = 11;

  // Total tokens for this run (cache-inclusive, as the aggregate's).
  int64 total_tokens = 12;

  // Seconds an agent was working (thinking, calling tools, writing files),
  // counted from the session's status events; waiting for a person is never
  // working. A stretch of work is credited to the run whose start began it.
  // This is the clock, never priced; a Stigmer Cloud plan's agent hours are
  // its subscription's getAgentHours.
  int64 working_seconds = 13;
}

// Lightweight view of a session's usage within an agent report.
message SessionUsageSummary {
  // Session identifier.
  string session_id = 1;

  // Number of runs in this session.
  int32 run_count = 2;

  // Total tokens across all runs (cache-inclusive: the sum of each
  // call's provider-reported total, including cached input tokens).
  int64 total_tokens = 3;

  // 4 held billable_cost_micros, the session's charged amount. Usage is
  // counted in tokens and never priced, so the number and the name are
  // reserved so neither is ever reused for a different field.
  reserved 4;
  reserved "billable_cost_micros";

  // ISO 8601 timestamp of the first run in this session.
  string first_run_at = 5;

  // ISO 8601 timestamp of the most recent run in this session.
  string last_run_at = 6;

  // Seconds an agent was working (thinking, calling tools, writing files),
  // counted from the session's status events; waiting for a person is never
  // working. A stretch of work is credited to the run whose start began it.
  // This is the clock, never priced; a Stigmer Cloud plan's agent hours are
  // its subscription's getAgentHours.
  int64 working_seconds = 7;
}

// Lightweight view of an agent's usage within an org report.
message AgentUsageSummary {
  // Agent identifier.
  string agent_id = 1;

  // Human-readable agent name for display.
  string agent_name = 2;

  // Total runs for this agent in the time range.
  int32 run_count = 3;

  // Total tokens across all runs (cache-inclusive: the sum of each
  // call's provider-reported total, including cached input tokens).
  int64 total_tokens = 4;

  // 5 held billable_cost_micros, the agent's charged amount. Usage is
  // counted in tokens and never priced, so the number and the name are
  // reserved so neither is ever reused for a different field.
  reserved 5;
  reserved "billable_cost_micros";

  // Seconds an agent was working (thinking, calling tools, writing files),
  // counted from the session's status events; waiting for a person is never
  // working. A stretch of work is credited to the run whose start began it.
  // This is the clock, never priced; a Stigmer Cloud plan's agent hours are
  // its subscription's getAgentHours.
  int64 working_seconds = 6;
}

// Usage for a single UTC day within an org report.
message DailyUsage {
  // UTC date in YYYY-MM-DD format.
  string date = 1;

  // Number of runs created on this date.
  int32 run_count = 2;

  // Total tokens of those runs (cache-inclusive, as the aggregate's).
  int64 total_tokens = 3;

  // Number of metered LLM API calls of those runs.
  int32 llm_call_count = 4;
}

// Usage split by execution harness within an org report.
//
// Each entry represents one harness (e.g., "native" or "cursor") and
// aggregates tokens, call count, and run count for that harness
// within the report's time range.
message HarnessUsage {
  // Harness identifier (e.g., "native", "cursor").
  string harness = 1;

  // Total tokens through this harness (cache-inclusive, as the aggregate's).
  int64 total_tokens = 2;

  // Number of metered LLM API calls through this harness.
  int32 call_count = 3;

  // Number of distinct runs that used this harness.
  int32 run_count = 4;
}

// ═══════════════════════════════════════════════════════════════════════════════
// RUN SUMMARY (Dashboard Aggregation)
//
// Operational summary of runs scoped to an organization and time
// window. Used by the platform dashboard to show run health. Tokens are
// intentionally excluded: the dashboard reads them from getOrgUsageReport,
// so usage is never counted from two places.
//
// ═══════════════════════════════════════════════════════════════════════════════

// Controls the time range for run summary queries.
enum RunSummaryTimeWindow {
  RUN_SUMMARY_TIME_WINDOW_UNSPECIFIED = 0;
  RUN_SUMMARY_TIME_WINDOW_LAST_24H = 1;
  RUN_SUMMARY_TIME_WINDOW_LAST_7D = 2;
  RUN_SUMMARY_TIME_WINDOW_LAST_30D = 3;
  RUN_SUMMARY_TIME_WINDOW_ALL_TIME = 4;
}

// GetRunSummaryRequest fetches aggregated run statistics
// for an organization's runs.
message GetRunSummaryRequest {
  // Organization slug to scope the summary.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // Time window for aggregation.
  //
  // Defaults to LAST_7D when unspecified.
  RunSummaryTimeWindow time_window = 2;
}

// RunSummary contains aggregated operational statistics for agent
// runs. Designed for the platform dashboard's unified health view.
//
// Tokens are intentionally omitted. The dashboard reads them from
// getOrgUsageReport, so usage is never counted from two places.
message RunSummary {
  // Number of runs currently in a non-terminal phase
  // (PENDING, IN_PROGRESS, WAITING_FOR_APPROVAL, PAUSED).
  int32 active_count = 1;

  // Run counts broken down by RunPhase enum value.
  //
  // Keys are RunPhase enum values (as int32).
  // Only phases with at least one run are included.
  map<int32, int32> phase_counts = 2;

  // Mean run duration (from started_at to completed_at) for completed
  // runs in the time window.
  //
  // Zero when no completed runs exist.
  google.protobuf.Duration avg_duration = 3;

  // Agents with the highest failure count in the time window, ranked descending.
  //
  // Capped at 10 entries.
  repeated AgentFailureRank top_failing_agents = 4;
}

// AgentFailureRank represents an agent and its failure count within
// a time window.
message AgentFailureRank {
  // Agent slug (org/name format).
  string agent_slug = 1;

  // Human-readable agent name for display.
  string agent_name = 2;

  // Number of failed runs in the time window.
  int32 failure_count = 3;
}

// The changes an update makes to a run: the fields update_mask names,
// taken from resource.
message UpdateRunInput {
  option (buf.validate.message).cel = {
    id: "update_names_its_target"
    message: "resource.metadata.id is required: an update names the run by its id"
    expression: "has(this.resource) && has(this.resource.metadata) && this.resource.metadata.id != ''"
  };

  // The run carrying the new values, named by metadata.id. Only the fields
  // update_mask names are read, so the others may be left empty; the result
  // is validated as a whole.
  Run resource = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The paths the update changes, as proto field names (spec.instructions,
  // metadata.labels). A list or map at a named path is replaced whole; "*"
  // names every path an update may change.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}
