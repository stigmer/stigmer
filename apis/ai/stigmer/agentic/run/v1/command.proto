syntax = "proto3";

package ai.stigmer.agentic.run.v1;

import "ai/stigmer/agentic/run/v1/api.proto";
import "ai/stigmer/agentic/run/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// RunCommandController handles write operations for runs.
// Follows the standard pattern: create, update, delete (no granular field updates).
service RunCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = run;

  // Create and trigger a new run: a turn in an existing session,
  // or the first turn of a new one created from session_spec.
  //
  // @internal
  // Authorization is handled in the handler, in two run-gate checks
  // (AuthorizeRunTarget, then AuthorizeRunAgent):
  //   - session_id provided: can_create_run_in on the session, before
  //     anything about it is read; the run then belongs to the
  //     session's organization (ValidateSessionOrganization)
  //   - then can_execute on the agent the turn runs (the session's pinned
  //     agent, or the new session's agent_ref), or no check for the built-in
  //     assistant; a new session's own create authorizes can_create_session
  //     on metadata.org
  rpc create(Run) returns (Run) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Update a run: the fields update_mask names change, every other
  // field keeps its stored value.
  //
  // resource.metadata.id names the run; apply finds one by slug. The slug
  // changes only through rename, and a mask naming a field another door
  // owns, or a path the run does not have, is refused with
  // INVALID_ARGUMENT naming the path.
  //
  // An update is refused with ABORTED carrying a google.rpc.ErrorInfo detail
  // (domain "stigmer.ai"):
  //
  //   - ETAG_MISMATCH — resource.metadata.etag is set and the run changed
  //     since that etag was read: read it again and make the change again.
  //     No metadata.
  //   - WRITE_CONFLICT — the run kept changing while the update was
  //     being saved: try again. No metadata.
  //
  // @internal
  // Used by users to update run configuration (spec fields).
  // No individual field updates - always provide complete state.
  rpc update(UpdateRunInput) returns (Run) {
    option (ai.stigmer.commons.rpc.config).resource_kind = run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "resource.metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update run";
  }

  // Update a run's status.
  //
  // @internal
  // Used by the runner to send progressive status updates (phase, usage,
  // the file record, etc.). The runner authenticates as the triggering user,
  // who owns the run through the session ownership chain.
  // Optimized for frequent status updates and merges status fields with
  // existing state.
  rpc updateStatus(RunUpdateStatusInput) returns (UpdateStatusResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "run_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update run status";
  }

  // Delete a run by ID.
  rpc delete(ai.stigmer.commons.apiresource.ApiResourceId) returns (Run) {
    option (ai.stigmer.commons.rpc.config).resource_kind = run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete run";
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // Lifecycle Control Operations
  //
  // These RPCs control the run lifecycle, mapping to Temporal
  // workflow operations. They enable users to gracefully stop, force-stop,
  // pause, resume, or recover runs.
  // ─────────────────────────────────────────────────────────────────────────────

  // Terminate a run immediately.
  //
  // Force-stops the run without allowing cleanup. Unlike the session's
  // interrupt, the agent cannot respond to termination - it is stopped immediately.
  // Use this for stuck or unresponsive agents.
  //
  // @internal
  // Temporal Equivalent: `temporal workflow terminate --workflow-id <id>`
  //
  // ## Behavior
  //
  // 1. Validates run exists and is in a terminable phase
  // 2. Force-kills workflow via Temporal (no signal sent to agent)
  // 3. Run transitions to RUN_TERMINATED phase immediately
  // 4. No cleanup callbacks or checkpoint saves occur
  // 5. Returns updated Run with TERMINATED phase
  //
  // ## Preconditions
  //
  // - Run must be in RUN_PENDING or RUN_IN_PROGRESS phase
  // - Cannot terminate already-terminal runs
  //
  // ## State Transitions
  //
  // - status.phase: PENDING/IN_PROGRESS → TERMINATED
  // - status.completed_at: Set to current timestamp
  // - LangGraph checkpoint: May be incomplete (no graceful save)
  //
  // ## Terminated vs Cancelled
  //
  // | Aspect | interrupt (session) | terminate |
  // |--------|--------|-----------|
  // | Signal to agent | Yes (can handle) | No |
  // | Checkpoint saved | Yes (graceful) | No |
  // | Use case | Normal stop | Stuck agents |
  // | Can recover? | No | No |
  //
  // ## Idempotency
  //
  // Terminating an already-terminated run succeeds as a no-op.
  //
  // ## Error Cases
  //
  // - NOT_FOUND: Run with given ID doesn't exist
  // - PERMISSION_DENIED: User lacks can_edit permission on the run
  // - FAILED_PRECONDITION: Run is in a terminal phase
  // - INVALID_ARGUMENT: ID is empty or malformed
  rpc terminate(TerminateRunInput) returns (Run) {
    option (ai.stigmer.commons.rpc.config).resource_kind = run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to terminate run";
  }

  // Recover a failed run.
  //
  // Retries the failed run. Completed work is preserved - successful tool
  // calls are NOT re-executed.
  //
  // @internal
  // Terminates the previous Temporal workflow (NOT_FOUND tolerated) and starts
  // a fresh one; continuity comes from the session's harness state (LangGraph
  // thread checkpoint / harness_state_id), not from Temporal history. A
  // Temporal reset cannot work here: the runner activity RETURNS its FAILED
  // result, so a reset replays the preserved failure instead of re-dispatching.
  //
  // ## Behavior
  //
  // 1. Validates run is in FAILED phase (recoverable)
  // 2. Terminates the previous workflow and recreates the execution environment
  // 3. Starts a fresh workflow; the activity is re-invoked with the same thread_id
  // 4. LangGraph loads from checkpoint automatically
  // 5. Run transitions from FAILED to IN_PROGRESS phase
  // 6. Agent retries from where it failed
  //
  // ## Preconditions
  //
  // - Run must be in RUN_FAILED phase
  // - TERMINATED runs cannot be recovered (incomplete checkpoint)
  // - CANCELLED runs cannot be recovered (intentional user action)
  //
  // ## State Transitions
  //
  // - status.phase: FAILED → IN_PROGRESS
  // - status.completed_at: Cleared
  // - status.error: Cleared
  // - Completed tool calls: Preserved (not re-executed)
  //
  // ## Idempotency
  //
  // If recovery already succeeded (run is now IN_PROGRESS),
  // the call succeeds as a no-op.
  //
  // ## Error Cases
  //
  // - NOT_FOUND: Run with given ID doesn't exist
  // - PERMISSION_DENIED: User lacks can_edit permission
  // - FAILED_PRECONDITION: Run is not in FAILED phase
  // - INVALID_ARGUMENT: ID is empty or malformed
  rpc recover(RecoverRunInput) returns (Run) {
    option (ai.stigmer.commons.rpc.config).resource_kind = run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to recover run";
  }

  // Pause a running run.
  //
  // Temporarily stops the agent at its current checkpoint. Unlike the
  // session's interrupt, the run is NOT terminal and can be resumed later from where it left off.
  //
  // @internal
  //
  // ## Behavior
  //
  // 1. Validates run exists and is in a pausable phase
  // 2. Sends "pause" signal to Temporal workflow
  // 3. Workflow cancels running activity gracefully
  // 4. On the native harness, the runner saves the LangGraph checkpoint on
  //    cancellation
  // 5. Run transitions to RUN_PAUSED phase
  // 6. Workflow waits for resume signal (no resources consumed)
  //
  // ## Preconditions
  //
  // - Run must be in RUN_PENDING or RUN_IN_PROGRESS phase
  // - Cannot pause already-terminal or already-paused runs
  //
  // ## State Transitions
  //
  // - status.phase: PENDING/IN_PROGRESS → PAUSED
  // - status.completed_at: NOT set (run is not finished)
  // - LangGraph checkpoint: Saved via thread_id
  //
  // ## Paused vs Cancelled
  //
  // | Aspect | pause | interrupt (session) |
  // |--------|-------|--------|
  // | Terminal state? | No | Yes |
  // | Can resume? | Yes (via resume RPC) | No |
  // | Checkpoint saved? | Yes | Best-effort |
  // | Use case | Temporary stop | Permanent stop |
  //
  // ## Idempotency
  //
  // Pausing an already-paused run succeeds as a no-op.
  //
  // ## Error Cases
  //
  // - NOT_FOUND: Run with given ID doesn't exist
  // - PERMISSION_DENIED: User lacks can_edit permission
  // - FAILED_PRECONDITION: Run is in a terminal phase
  // - INVALID_ARGUMENT: ID is empty or malformed
  rpc pause(PauseRunInput) returns (Run) {
    option (ai.stigmer.commons.rpc.config).resource_kind = run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to pause run";
  }

  // Resume a paused run.
  //
  // Continues the run from where it was paused. How a turn's state is saved
  // is the harness's ([Harnesses](/docs/concepts/harnesses)).
  //
  // @internal
  //
  // ## Behavior
  //
  // 1. Validates run is in RUN_PAUSED phase
  // 2. Sends "resume" signal to Temporal workflow
  // 3. Workflow unblocks and re-invokes activity
  // 4. Activity loads from LangGraph checkpoint using thread_id
  // 5. Run transitions back to RUN_IN_PROGRESS phase
  // 6. Agent continues from exact pause point
  //
  // ## Preconditions
  //
  // - Run must be in RUN_PAUSED phase
  // - Cannot resume non-paused runs
  //
  // ## State Transitions
  //
  // - status.phase: PAUSED → IN_PROGRESS
  // - Activities: Re-invoked, load from checkpoint
  // - LangGraph state: Loaded from checkpoint via thread_id
  //
  // ## Idempotency
  //
  // Resuming a run that is already running succeeds as a no-op.
  //
  // ## Error Cases
  //
  // - NOT_FOUND: Run with given ID doesn't exist
  // - PERMISSION_DENIED: User lacks can_edit permission
  // - FAILED_PRECONDITION: Run is not in PAUSED phase
  // - INVALID_ARGUMENT: ID is empty or malformed
  rpc resume(ResumeRunInput) returns (Run) {
    option (ai.stigmer.commons.rpc.config).resource_kind = run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to resume run";
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // Artifact Lifecycle Operations
  //
  // These RPCs support file attachments and artifacts for runs.
  // Attachments are input files provided before the run; artifacts are
  // output files created during the run.
  // ─────────────────────────────────────────────────────────────────────────────

  // Upload a file attachment for use in a run.
  //
  // Pre-uploads files to artifact storage before creating a run.
  // The returned storage_key can be used in Attachment.storage_key when
  // creating the run.
  //
  // @internal
  //
  // ## Authorization
  //
  // This endpoint does not require authorization. The storage_key returned
  // acts as a capability token - knowing the key grants access to the content.
  // This simplifies the upload flow for CLI and other clients.
  //
  // ## Storage Path
  //
  // Files are stored at: attachments/{ulid}/{filename}
  // The ULID ensures unique paths and enables future cleanup policies.
  //
  // ## Use Cases
  //
  // - CLI uploading files (>4MB) before run
  // - Pre-uploading datasets for agent processing
  // - Uploading binary files that cannot be embedded inline in Attachment
  //
  // ## Example Flow
  //
  // 1. Client calls uploadAttachment with file content
  // 2. Server uploads to storage, returns storage_key
  // 3. Client creates Run with Attachment using storage_key
  // 4. The runner downloads attachment content when the run starts
  rpc uploadAttachment(UploadAttachmentRequest) returns (UploadAttachmentResponse) {
    // No authorization - storage_key acts as capability token
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
