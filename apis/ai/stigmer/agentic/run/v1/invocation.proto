syntax = "proto3";

package ai.stigmer.agentic.run.v1;

import "ai/stigmer/agentic/run/v1/enum.proto";
import "ai/stigmer/agentic/session/v1/enum.proto";
import "ai/stigmer/agentic/session/v1/resource.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";

// AgentInvocation is what a caller may ask an agent to do.
//
// It is the owner-settable subset of a run — the interactive
// composer's vocabulary (agent, message, harness, workspace,
// vaults, run bounds) minus what an unattended run makes structurally
// impossible. A routine or a channel that starts an agent on someone's
// behalf embeds this shape instead of re-deriving it: a routine embeds
// it whole; a channel embeds RunConfig.
//
// @internal
// An ALLOWLIST by
// construction: platform-owned run fields (approval_mode,
// execution_target, harness_state_id,
// auto_approve_all, org/labels/subject) cannot
// appear here, so embedding surfaces never need a blocklist validator
// — the rejected alternative was embedding RunSpec /
// SessionSpec and validating the illegal fields away. Exclusions,
// each with its reason: a repository's token (plaintext secrets in
// manifests leak; vaults are the vehicle), a message's file_ids
// (a routine's files are its resources, which each run copies),
// plugins/skill_refs (the
// agent blueprint owns its tool set), interaction_mode (Plan mode's
// deliverable is a plan for a human who isn't there). Surface-specific constraints live in the
// embedding surface's handlers, never here — e.g. routines reject
// local_path workspace sources and enforce agent_ref.org ==
// metadata.org.
message AgentInvocation {
  // Reference to the agent to run.
  //
  // A version on the reference (a tag or a content hash) is the version
  // each run starts on; none, or "latest", runs the agent's current version
  // when the run starts.
  //
  // @internal
  // Embedding surfaces own the referential invariants: the routine
  // requires agent_ref.org == metadata.org (the owning org is the
  // billing org for every run) and can_edit on this agent at create.
  // Deleting the agent deletes the routines that name it; one left by a
  // delete racing its create fails at its next start, never as a silent
  // stall.
  ai.stigmer.commons.apiresource.ApiResourceReference agent_ref = 1 [
    (ai.stigmer.commons.apiresource.reference_kind) = agent,
    (buf.validate.field).required = true
  ];

  // Prompt the run starts from.
  //
  // @internal
  // The runner injects no current date into any prompt, so
  // unattended surfaces compose this message plus a fire-context line.
  // The bound applies to the stored prompt, not the composed message.
  string message = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8192
  }];

  // Execution engine for the run's session. Unspecified: native when
  // run_config names a model (the engine the model was checked against at
  // save), else the agent's own engine (AgentSpec.harness), else the
  // embedding surface's platform default.
  //
  // @internal
  // Graduates from surface platform config (e.g.
  // stigmer.schedules.session-defaults.harness) to the invocation —
  // the config demotes from "the only source" to "the default".
  // Verified before deciding: unattended approval semantics are one
  // shared contract across every harness (approval-policy.ts), so
  // owner harness choice changes the engine, never the safety
  // posture.
  ai.stigmer.agentic.session.v1.Harness harness = 3 [(buf.validate.field).enum.defined_only = true];

  // Field 4 held the invocation's workspace entries until a conversation's
  // files, repositories and folders became one list (resources).
  reserved 4;
  reserved "workspace_entries";

  // Value 5 held environment_refs, the environments whose values a
  // run received, until vaults replaced environments.
  reserved 5;
  reserved "environment_refs";

  // Vaults whose logins and secrets the runs this invocation creates use, in
  // order: the first vault holding a match wins. At most 20.
  //
  // A routine's runs use these vaults and no others. The routine's owner
  // may attach their own My vault; nobody else's.
  //
  // @internal
  // Read by the run's credential resolver for a run carrying the
  // stigmer.ai/routine-id label. Each run asks can_use again of the account
  // recorded in the routine's status.vault_attachers, so a revoked grant
  // stops the routine at its next fire.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference vaults = 7 [
    (ai.stigmer.commons.apiresource.reference_kind) = vault,
    (buf.validate.field).repeated.max_items = 20
  ];

  // Per-invocation model choice and run bounds. Unset fields fall to the
  // agent's defaults, then to the lane's operator profile (RunConfig has the
  // rule).
  RunConfig run_config = 6;

  // The Environment the conversations this invocation starts run in: the
  // packages their sandboxes get and the websites they may reach. Unset:
  // the agent's default, else the organization's.
  //
  // @internal
  // Copied into each fired session's spec.environment_ref beside the
  // harness, so the session records it with source routine. Naming it
  // needs can_view on the Environment; each turn asks the routine's owner
  // again, as a vault the routine names is asked again.
  ai.stigmer.commons.apiresource.ApiResourceReference environment_ref = 8 [(ai.stigmer.commons.apiresource.reference_kind) = environment];

  // What each run's conversation holds: Files and git repositories (a
  // routine's runs have no machine of the person's to read a folder from).
  // Each run's conversation gets its own copy of each File, made when the
  // run starts, so every nightly run finds the same q3-ledger.xlsx.
  //
  // @internal
  // Maps onto SessionSpec.resources of the session each run creates. A
  // repository's token is sealed only on a session and is refused here,
  // because nothing in a routine's row is sealed: a private repository's
  // clone uses a connection for its host in one of the invocation's
  // vaults. The routine's owner must still be able to view each File when
  // a run starts.
  repeated ai.stigmer.agentic.session.v1.SessionResource resources = 9 [
    (buf.validate.field).repeated.max_items = 500,
    (buf.validate.field).repeated.items.cel = {
      id: "resources.no_local_path"
      message: "a routine's runs cannot use a folder on someone's machine: name a git repository or a File"
      expression: "!has(this.local_path)"
    },
    (buf.validate.field).repeated.items.cel = {
      id: "resources.no_token"
      message: "a repository here cannot carry a token: save it as a connection in a vault the invocation names"
      expression: "!has(this.git_repository) || this.git_repository.token == ''"
    }
  ];
}

// RunConfig is the settings message for every run: a model, a speed tier,
// thinking, and run bounds.
//
// The same message is a message's request (RunSpec.run_config),
// the saved settings of a routine (its invocation) or a channel,
// an agent author's defaults (AgentSpec.run_config,
// versioned with the agent), and the settings a turn ran with
// (RunStatus.run_config). Zero or empty means "not set at this
// layer".
//
// The server resolves a turn's settings once, at create, from three layers,
// most specific first: the message (or the routine or channel it came
// through), the
// agent's defaults, and the lane's operator profile.
//
// - Choices. model_name comes from the first layer that names one. When no
//   layer names one, the model is left to the harness's registry default.
//   service_tier and thinking_mode each
//   come from the first layer, at or above the model's layer, that sets
//   them: a less specific layer's tier or thinking was chosen for another
//   model, so it never lands on this one. Without a model, tier and thinking
//   come only from the message.
// - Bounds. max_cost_usd, max_tool_rounds and max_tool_result_chars each take
//   the smallest positive value any layer sets. An operator profile is a
//   ceiling the message, the routine or channel, and the agent can lower
//   but never raise.
// - The agent's choices apply only on the engine its defaults name
//   (AgentSpec.harness). On a conversation running another engine the
//   agent layer gives its bounds alone.
//
// Saved settings are self-contained: a routine, channel or agent that sets
// service_tier FAST or thinking_mode ENABLED names the model it is for. Only a
// message may set them alone, to adjust the model it is given.
//
// @internal
// The one resolution is resolveRunConfig in the server's run
// domain (resolve-run-config.ts); every lane goes through it. An allowlist
// by construction: per-message intents (interaction_mode, build_from_plan,
// structured_output_schema) and the lane-owned approval mode are not
// settings and cannot appear here.
message RunConfig {
  // The model each run uses. Example: "claude-sonnet-4-6".
  string model_name = 1;

  // Maximum estimated cost in USD per run.
  //
  // When the run's estimated spend reaches this limit, the run stops with a
  // "send another message to continue" prompt and ends TERMINATED; the work
  // done so far is kept. The limit is checked each time the engine reports
  // its spend, so a run can end somewhat above it. The native harness
  // reports after every model call, counts a subagent's spend toward the
  // limit, and advises the agent to wrap up at about 80% of the budget.
  //
  // 0 = not set at this layer. The budget is per message: a follow-up
  // message, or a run resuming after an approval, starts a fresh count; a
  // run continuing after a restart, a lost runner or a stall keeps its
  // count. The
  // spend is the runner's estimate, reported on
  // RunStatus.streaming_usage.estimated_cost_usd, not the billed
  // amount.
  //
  // @internal
  // The turn runtime is the one enforcement for every harness: each usage
  // report moves its running estimate, and the check there stops the turn at
  // the limit (backend/services/runner/src/harness/run-turn.ts over
  // backend/services/runner/src/shared/cost-guard.ts). A continuation's
  // estimate starts from the run's persisted streaming_usage
  // (backend/services/runner/src/harness/cost-cap-watch.ts). The native cost
  // advisory middleware only warns
  // (backend/services/runner/src/middleware/cost-advisory.ts).
  double max_cost_usd = 2 [(buf.validate.field).double.gte = 0];

  // Maximum model-to-tools reasoning cycles per message.
  //
  // A round is one model response that proposes one or more tool calls,
  // followed by their execution; parallel tool calls in one response are one
  // round. When the limit is reached the run stops with a "send another
  // message to continue" prompt, and the work done so far is kept. The agent
  // is advised to wrap up at about 80% of the budget.
  //
  // 0 = not set at this layer; with no layer setting it the agent runs until
  // the task completes or loop detection stops a repetitive pattern. When
  // set, the valid range is 10–1000; values outside it are clamped to the
  // nearest bound. The budget is per message: a follow-up message, or a run
  // resuming after an approval, starts a fresh count. Subagent rounds are
  // not counted.
  //
  // @internal
  // An implementation knob, not a user concept: API-reachable for
  // operators, deliberately absent from creation forms. The native runner
  // counts rounds in its execution budget middleware and stops in place of
  // the next model call (backend/services/runner/src/shared/tool-rounds.ts).
  int32 max_tool_rounds = 3 [(buf.validate.field).int32.gte = 0];

  // Service tier for each run's model calls: standard (the default) or fast, where fast bills at the model's fast-tier rates and requires a model that offers one.
  //
  // UNSPECIFIED is not set at this layer; with no layer setting it the run
  // uses STANDARD, never the provider account default. FAST is valid only
  // for a model whose registry entry declares a fast pricing variant on the
  // engine that runs it; validated fail-closed on the resolved settings at
  // create.
  ServiceTier service_tier = 4 [(buf.validate.field).enum.defined_only = true];

  // Thinking mode for each run's model calls: disabled (the default) or
  // enabled, where enabled selects the model's extended-reasoning variant
  // (billed at base per-token rates — reasoning tokens bill as output).
  //
  // UNSPECIFIED is not set at this layer; with no layer setting it the run
  // uses DISABLED, never the provider account default. ENABLED is valid only
  // for a model whose registry entry declares the thinking capability on the
  // engine that runs it; validated fail-closed on the resolved settings at
  // create. Combines freely with service_tier.
  ThinkingMode thinking_mode = 5 [(buf.validate.field).enum.defined_only = true];

  // Maximum number of characters for a single tool result before truncation.
  // A longer result reaches the agent as its start and its end, with a line
  // between them saying how much was left out. The whole result is kept for
  // the session, outside the workspace, and the line says where, so the
  // agent reads the rest back instead of running the tool again; a tool that
  // pages itself (reading a file, searching, listing, fetching a page) keeps
  // no copy, and the line says how to narrow the call instead. A value above
  // 80,000 raises the bound only for the file tools (reading, searching,
  // listing and editing files); every other tool's result is cut at 80,000
  // at most.
  //
  // 0 = not set at this layer; with no layer setting it the platform default
  // applies (30,000 chars, about 7,500 tokens). Applies to every tool result,
  // a subagent's included.
  int32 max_tool_result_chars = 6 [(buf.validate.field).int32.gte = 0];
}
