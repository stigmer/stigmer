syntax = "proto3";

package ai.stigmer.agentic.run.v1;

import "ai/stigmer/agentic/run/v1/enum.proto";
import "ai/stigmer/agentic/run/v1/message.proto";
import "buf/validate/validate.proto";

// ─────────────────────────────────────────────────────────────────────────────
// File Change Review (apply-then-review HITL)
//
// These types model AI file edits as captured workspace deltas reviewed as a
// unit, NOT as tool calls. A turn captures a baseline snapshot, lets edits
// happen in a reversible substrate, captures the candidate at the turn
// boundary, and the authoritative diff(baseline, candidate) is reviewed at
// change-set / file granularity. Decisions bind to content digests; the runner
// reconciles the exact approved bytes with hash verification.
//
// The run keeps the file record (RunStatus.file_changes): the change sets
// its turns captured. What was decided, what is still undecided and what was
// put back are the session's events (stigmer.file_review.changes, .decided and
// .reconciled), never fields of these messages.
//
// Identity rule (load-bearing): correlation is ALWAYS by stable id
// (FileChangeSet.id, CapturedFileChange.id); content digests
// (aggregate_digest, file_digest, before/after_sha256, expected_digest) are an
// ENFORCEMENT gate only — the runner refuses to apply content whose digest
// differs from what the user approved — and are NEVER used to match a decision
// to a change. This is the platform's standing "fingerprint = enforcement,
// never correlation" rule applied to file review.
//
// ─────────────────────────────────────────────────────────────────────────────

// The set of file deltas produced by one agent turn, reviewed and reconciled
// as a unit.
//
// A record of what the turn changed: the files' contents before and after,
// the snapshots they were read from and the consent the turn's commands ran
// under. It carries no state and no decisions; the session's
// stigmer.file_review.* events say what was kept, what was undone and what is
// still open.
//
// @internal
//
// Captured by the runner at the turn boundary and kept on
// RunStatus.file_changes. The server reads it to put files back for an undo
// and to verify command_provenance before the approved-command keep.
message FileChangeSet {
  // Stable id of this change set, unique per turn. The id the session's
  // stigmer.file_review.* events name. Never a content hash.
  string id = 1;

  // Id of the turn that produced this change set.
  string turn_id = 2;

  // Harness that produced the edits: "stigmer" | "claude".
  // Carried for audit and so the reconcile adapter knows which harness
  // lifecycle authored the set.
  string harness_id = 3;

  // Field 4 held the change set's review state, folded from a ledger the run
  // no longer keeps: the session's stigmer.file_review.* events say what is
  // decided. Reserved so the number and name are never reused.
  reserved 4;
  reserved "status";

  // Workspace state captured at turn start — the "before" the authoritative
  // diff is computed against.
  SnapshotRef baseline_snapshot = 5;

  // Workspace state captured at the turn boundary — the "after". The authoritative
  // diff is diff(baseline_snapshot, candidate_snapshot); no streamed args, no
  // pre-execution proposal is ever authoritative.
  SnapshotRef candidate_snapshot = 6;

  // Field 7 held the workspace state after an undo put files back. An undo's
  // outcome is the session's stigmer.file_review.reconciled event. Reserved
  // so the number and name are never reused.
  reserved 7;
  reserved "approved_snapshot";

  // The per-file deltas in this change set (the rendered review surface).
  repeated CapturedFileChange changes = 8;

  // Canonical digest over the ordered change manifest. ENFORCEMENT only: lets
  // the reconcile refuse to apply a manifest that differs from what was
  // reviewed. Never a correlation key.
  string aggregate_digest = 9;

  // Whether the rendered diff is complete enough to approve safely, a rollup
  // over the per-file changes. COMPLETE is approvable as-is; BINARY_SUMMARY_ONLY
  // (binary is the set's only blocker) is keepable in one shot via an
  // acknowledged CHANGE_SET approve; PARTIAL_BLOCKED must be resolved per file.
  // An honest UI/audit signal — the backend gate re-derives keep-all from the
  // per-file changes, never trusting this value. See DiffCompleteness.
  DiffCompleteness diff_completeness = 10 [(buf.validate.field).enum.defined_only = true];

  // Field 11 held the decisions on this change set. Decisions are the
  // session's stigmer.file_review.decided events. Reserved so the number and
  // name are never reused.
  reserved 11;
  reserved "decisions";

  // The consent the turn's commands ran under, when every change in the set
  // came from a command a person had allowed. Absent otherwise.
  //
  // @internal
  // The server's approved-command keep verifies it against the person's
  // answers in the session's log before it keeps the set on their behalf.
  // See TurnCommandProvenance.
  TurnCommandProvenance command_provenance = 12;
}

// One file's delta within a FileChangeSet.
//
// Reuses FileContent (inline-or-offload) for before/after and ToolCallOutputRef
// for the offloadable unified diff — no parallel blob types.
message CapturedFileChange {
  // Stable id of this file change within its set. The id a file-scoped
  // stigmer.file_review.decided event names. Never a content hash.
  string id = 1;

  // Path before the change (workspace-root-relative). Empty for ADD.
  string path_before = 2;

  // Path after the change (workspace-root-relative). Empty for DELETE; differs
  // from path_before for RENAME.
  string path_after = 3;

  // The per-file outcome. See FileChangeKind.
  FileChangeKind kind = 4 [(buf.validate.field).enum.defined_only = true];

  // How this file was captured (git-tracked vs ignored vs non-git/CAS), which
  // governs which substrate holds its before/after bytes. See FileCaptureClass.
  FileCaptureClass capture_class = 5 [(buf.validate.field).enum.defined_only = true];

  // Pre-edit content. Empty for ADD. Large bodies offloaded via FileContent.ref.
  FileContent before = 6;

  // Post-edit content. Empty for DELETE. Large bodies offloaded via FileContent.ref.
  FileContent after = 7;

  // SHA-256 of the pre-edit bytes. ENFORCEMENT digest (the reconcile compares
  // against the on-disk baseline). Empty for ADD.
  string before_sha256 = 8;

  // SHA-256 of the post-edit bytes. ENFORCEMENT digest (the reconcile applies
  // only these exact bytes). Empty for DELETE.
  string after_sha256 = 9;

  // Offloadable unified diff for this file. The rendered hunks; large diffs
  // spill to the run's storage via the same envelope tool output uses.
  ToolCallOutputRef unified_diff = 10;

  // False when this file's diff is incomplete (elided, truncated, or not
  // capturable). A change set with any diff_complete == false cannot be
  // approved as complete — the structural guard against approving an
  // unreviewable change.
  bool diff_complete = 11;

  // Canonical digest of (path, kind, before, after) for this file. ENFORCEMENT
  // only — the per-file analogue of aggregate_digest. Never a correlation key.
  string file_digest = 12;

  // The honest cause this file's diff is not fully reviewable, set by the runner
  // only when diff_complete == false (otherwise UNSPECIFIED). INFORMATIONAL
  // provenance for the review UI — never an enforcement input and never folded
  // into file_digest/aggregate_digest. Binary changes are conveyed by
  // FileContent.is_binary, not here. See FileReviewBlockReason.
  FileReviewBlockReason blocked_reason = 13 [(buf.validate.field).enum.defined_only = true];

  // Lines added by this change, computed at capture time by the runner with the
  // SAME diff algorithm the SDK renders with, so the list stat and the rendered
  // diff can never disagree. INFORMATIONAL display counts only — never an
  // enforcement input and never folded into file_digest/aggregate_digest (the
  // same contract as blocked_reason). Zero (alongside lines_removed == 0) when
  // counting was not possible or meaningful: binary changes, secret-withheld
  // entries, oversized sides, and records captured before this field existed.
  // Consumers hide the stat in that case rather than showing "+0 -0".
  int32 lines_added = 14;

  // Lines removed by this change. See lines_added for the contract.
  int32 lines_removed = 15;
}

// An immutable pointer to a captured workspace state.
//
// One of git / cas is set per kind; HYBRID carries both (git-tracked files via
// the tree ref, ignored/non-git files via the CAS manifest). Snapshots are
// captured by the runner and are idempotent under Temporal retries.
message SnapshotRef {
  // Which substrate holds this snapshot. See SnapshotKind.
  SnapshotKind kind = 1 [(buf.validate.field).enum.defined_only = true];

  // Git no-commit tree reference; set when kind is GIT_TREE_REF or HYBRID.
  GitTreeRef git = 2;

  // Content-addressed manifest reference for ignored/non-git paths; set when
  // kind is CAS_MANIFEST or HYBRID.
  CasManifestRef cas = 3;
}

// A git no-commit tree snapshot (write-tree + a stigmer-namespaced ref).
message GitTreeRef {
  // The tree object id produced by git write-tree.
  string tree_oid = 1;

  // The ref the snapshot is pinned under, e.g.
  // "refs/stigmer/{run}/{baseline|candidate|approved}". Keeps the
  // snapshot reachable (un-GC'd) without a commit on any user branch.
  string ref = 2;
}

// A content-addressed snapshot manifest for paths git cannot capture
// (gitignored or non-git workspaces).
message CasManifestRef {
  // Digest of the manifest listing each captured path and its blob digest.
  string manifest_digest = 1;

  // Storage URI of the stored manifest.
  string artifact_uri = 2;
}

// The runner's turn facts backing the approved-command auto-keep policy:
// its assertion that EVERY mutation in the candidate was produced by
// executed shell commands the human had already authorized, with the consent
// evidence the backend can verify.
//
// @internal
//
// Presence of this message on a change set asserts the runner-owned turn facts
// the server cannot derive: the turn executed zero file-tool (write/delete)
// calls, zero MCP tools, and delegated zero subagents — its only mutation
// source was consented commands. These facts carry the SAME trust level as the
// captured bytes themselves. What the runner can NEVER assert is the consent:
// the server verifies every claimed id below against the person's answers in
// the session's log (user.tool_confirmation, stigmer.permission.grant) before
// it records the keep, so a runner cannot mint authorization it was never
// given. Absent on any turn that does not qualify — the set then waits for a
// person (fail-closed).
message TurnCommandProvenance {
  // Ids of the tool calls whose answers in the session's log authorize this
  // turn's executed commands: the call a person allowed, or the call whose
  // grant for its class covered the command. Exact-id lookup — never a content
  // or fuzzy match. Empty only when authorized_by_auto_approve_all carries the
  // consent instead.
  repeated string consent_tool_call_ids = 1;

  // True when the commands ran ungated under the pre-armed
  // spec.auto_approve_all global bypass (there is no per-command consent row to
  // cite). The backend verifies this against the spec field it owns.
  bool authorized_by_auto_approve_all = 2;
}

// A transient, non-authoritative snapshot of the workspace delta accumulating
// during the CURRENT turn — the live "N files changed so far" surface.
//
// @internal
//
// This is the file-review analogue of SetupProgress / streaming_usage: a
// runner-owned, latest-snapshot-wins DISPLAY field, NOT an event-sourced
// projection. It is deliberately NOT a FileChangeSet — a FileChangeSet is the
// digest-bound record of the turn's changes that a person decides on; progress
// carries NO file bytes or digests, and is NEVER decidable or authoritative.
// The change set captured at the turn boundary remains the single reviewable
// diff (diff(baseline, candidate)); a mid-run snapshot is no more
// authoritative than a streamed tool-call arg.
//
// Lifecycle: the runner overwrites this on each mid-run persist until the
// turn's change set is captured; the server clears it once that change set is
// on file_changes (mirroring the setup_progress defense-in-depth clear), so it
// never outlives the turn.
//
// Secret safety: it carries paths + kinds + line counts ONLY — no file bodies —
// so nothing new can leak. A secret-like path is surfaced with zeroed counts
// (path visible, content withheld), the same rule the change set applies.
message FileChangeProgress {
  // Id of the change set this progress previews ("${executionId}:${turnSeq}"),
  // before it is captured. A stale prior-turn snapshot is cleared once the next
  // turn pins a new baseline.
  string change_set_id = 1;

  // Total number of files changed so far this turn. The honest total: it may
  // exceed entries.length when the entry list is capped for a very large turn.
  int32 files_changed = 2;

  // Total lines added / removed across all changed files this turn. Zero when
  // uncountable (binary / secret-withheld). INFORMATIONAL display only — never an
  // enforcement input (progress has no digests).
  int32 lines_added = 3;
  int32 lines_removed = 4;

  // The per-file entries (slim: no bodies, no digests, no diffs). May be a capped
  // prefix of the full change list; files_changed carries the true total.
  repeated FileChangeProgressEntry entries = 5;

  // When this snapshot was taken (RFC3339). Presentation-only; never a digest input.
  string captured_at = 6;
}

// One file within a FileChangeProgress snapshot — a slim, non-authoritative row.
//
// @internal
//
// Carries only what the live strip renders: paths, kind, and line counts. It is
// NOT a CapturedFileChange (which is the digest-bound, reviewable delta);
// it has no content, no digests, no unified diff. Path/kind naming mirrors
// CapturedFileChange so renames read honestly.
message FileChangeProgressEntry {
  // Path before the change (workspace-root-relative). Empty for ADD.
  string path_before = 1;

  // Path after the change (workspace-root-relative). Empty for DELETE.
  string path_after = 2;

  // The per-file outcome. See FileChangeKind.
  FileChangeKind kind = 3 [(buf.validate.field).enum.defined_only = true];

  // Lines added by this change. Zero (alongside lines_removed == 0) when counting
  // was not possible or meaningful (binary / secret) — consumers hide the stat
  // rather than show "+0 -0" (the same contract as CapturedFileChange.lines_added).
  int32 lines_added = 4;

  // Lines removed by this change. See lines_added for the contract.
  int32 lines_removed = 5;
}
