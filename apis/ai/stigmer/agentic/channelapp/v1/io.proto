syntax = "proto3";

package ai.stigmer.agentic.channelapp.v1;

import "ai/stigmer/agentic/channelapp/v1/api.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";

// ChannelApps contains a list of channel app resources.
message ChannelApps {
  // Channel app entries.
  repeated ChannelApp entries = 1;
}

// ListChannelAppsByOrgInput specifies the organization whose channel
// apps should be returned.
message ListChannelAppsByOrgInput {
  // Organization slug to list channel apps for.
  string org = 1 [(buf.validate.field).string.min_len = 1];
}

// The changes an update makes to a channel app: the fields update_mask names,
// taken from resource.
message UpdateChannelAppInput {
  option (buf.validate.message).cel = {
    id: "update_names_its_target"
    message: "resource.metadata.id is required: an update names the channel app by its id"
    expression: "has(this.resource) && has(this.resource.metadata) && this.resource.metadata.id != ''"
  };

  // The channel app carrying the new values, named by metadata.id. Only the fields
  // update_mask names are read, so the others may be left empty; the result
  // is validated as a whole.
  ChannelApp resource = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The paths the update changes, as proto field names (spec.instructions,
  // metadata.labels). A list or map at a named path is replaced whole; "*"
  // names every path an update may change.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}
