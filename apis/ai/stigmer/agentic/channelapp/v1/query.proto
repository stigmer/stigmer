syntax = "proto3";

package ai.stigmer.agentic.channelapp.v1;

import "ai/stigmer/agentic/channelapp/v1/api.proto";
import "ai/stigmer/agentic/channelapp/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// ChannelAppQueryController handles read operations for channel apps.
//
// @internal
// Every response passes through secret redaction — client_secret and
// signing_secret are replaced with the redaction marker. Runtime
// consumers that need the real values (installer, webhook receiver)
// read the repo directly, the documented OAuthAppResolutionService
// exception.
service ChannelAppQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = channel_app;

  // Get a channel app by its unique identifier.
  //
  // Secret fields are redacted in the response.
  //
  // @internal
  // Authorization: requires can_view permission on the channel_app
  // resource.
  rpc get(ai.stigmer.commons.apiresource.ApiResourceId) returns (ChannelApp) {
    option (ai.stigmer.commons.rpc.config).resource_kind = channel_app;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view channel app";
  }

  // Get a channel app by its organization-scoped reference (org/slug).
  //
  // Secret fields are redacted in the response.
  //
  // @internal
  // Custom authorization in handler — checks both direct resource access
  // and organization-level visibility permissions (the OAuthApp pattern).
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (ChannelApp) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List all channel apps belonging to an organization.
  //
  // Returns every ChannelApp whose metadata.org matches the input org,
  // with secret fields redacted. Typically a small set, so results are
  // not paginated.
  //
  // @internal
  // Authorization: requires can_view permission on the organization
  // resource.
  rpc listByOrg(ListChannelAppsByOrgInput) returns (ChannelApps) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to list channel apps in this organization";
  }
}
