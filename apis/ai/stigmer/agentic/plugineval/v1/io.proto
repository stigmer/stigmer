syntax = "proto3";

package ai.stigmer.agentic.plugineval.v1;

import "ai/stigmer/agentic/plugineval/v1/api.proto";
import "buf/validate/validate.proto";

// PluginEvalId wraps a plugin eval identifier.
message PluginEvalId {
  // Unique identifier of the plugin eval.
  string value = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];
}

// ListPluginEvalsByPluginRequest names the plugin whose evals to list.
message ListPluginEvalsByPluginRequest {
  // ID of the plugin.
  string plugin_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
}

// PluginEvalList is a list of plugin evals.
message PluginEvalList {
  reserved 1;
  reserved "total_count";

  // The evals, newest first.
  repeated PluginEval entries = 2;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 3;
}
