syntax = "proto3";

package ai.stigmer.agentic.plugineval.v1;

import "ai/stigmer/agentic/plugineval/v1/api.proto";
import "ai/stigmer/agentic/plugineval/v1/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// PluginEvalCommandController handles write operations for plugin evals.
//
// @internal
// No update and no apply: an eval is one suite run, started from the
// console or the CLI, never authored as a manifest.
service PluginEvalCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = plugin_eval;

  // Start an eval of a plugin's evals/ cases.
  //
  // The eval lives in its plugin's organization, which pays for every try.
  // It returns at once, pending; get it again to follow its progress.
  //
  // @internal
  // Authorization: skip standard resource authorization, because the
  // target is the plugin named in spec.plugin_id, not the request's own
  // id. In-handler enforcement, in order (the plugin-eval domain's create
  // chain):
  // 1. AuthorizeResolvedTarget: can_edit on the plugin, before the plugin
  //    is read, so a caller who cannot edit it learns nothing about
  //    whether it exists.
  // 2. metadata.org must be the plugin's organization.
  // 3. spec.plugin_digest, when set, must be a version of the plugin;
  //    empty is stamped with the current version.
  // 4. Each vault must be usable by the caller (the schedule's rule).
  // 5. The suite is read from the archive; more than 200 cases or 1000
  //    tries is refused with the computed counts.
  // Then the eval's workflow starts under a deterministic id; a start
  // that fails marks the eval failed with its reason.
  //
  // Error Cases:
  //
  // - FAILED_PRECONDITION: the organization is not the plugin's; the
  //   plugin has no evals/ cases; the suite is larger than an eval may run
  // - INVALID_ARGUMENT: the digest names no version of the plugin
  // - PERMISSION_DENIED: the caller may not edit the plugin, or may not use
  //   a named vault
  // - NOT_FOUND: the plugin does not exist
  rpc create(PluginEval) returns (PluginEval) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Cancel a pending or running eval.
  //
  // Tries in flight are stopped; the eval ends partial, "cancelled", with
  // the results of the tries that finished. Cancelling a finished eval
  // changes nothing.
  //
  // @internal
  // Authorization: requires can_edit on the eval (can_edit from its
  // plugin).
  rpc cancel(PluginEvalId) returns (PluginEval) {
    option (ai.stigmer.commons.rpc.config).resource_kind = plugin_eval;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to cancel plugin eval";
  }

  // Delete an eval with its tries' conversations, runs and scores.
  //
  // A pending or running eval is refused: cancel it first.
  //
  // @internal
  // Authorization: requires can_delete on the eval (can_edit from its
  // plugin). Deleting the plugin deletes its evals.
  //
  // Error Cases:
  //
  // - FAILED_PRECONDITION: the eval is pending or running; the error names
  //   cancel
  rpc delete(PluginEvalId) returns (PluginEval) {
    option (ai.stigmer.commons.rpc.config).resource_kind = plugin_eval;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete plugin eval";
  }
}
