syntax = "proto3";

package ai.stigmer.agentic.skill.v1;

import "ai/stigmer/agentic/skill/v1/status.proto";
import "ai/stigmer/commons/apiresource/status.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// SkillId wraps a skill identifier.
message SkillId {
  string value = 1 [(buf.validate.field).required = true];
}

// PushSkillRequest contains the skill artifact and metadata for upload.
// Creates a skill if it does not exist, or creates a new version of an
// existing skill.
//
// The artifact travels one of two ways (exactly one must be set):
// - artifact: inline ZIP bytes. Simple one-round-trip push, but bounded by
//   the gRPC transport's message-size cap (10MB) — well below the 100MB
//   skill limit.
// - artifact_upload_ref: reference to bytes already staged via
//   createArtifactUploadUrl() + HTTP PUT. Required for artifacts above the
//   transport cap; works for any size up to the skill limit.
//
// @internal
// The skill name and description are extracted by the backend from the SKILL.md
// YAML frontmatter within the artifact. The CLI validates the format but does not
// send these fields — backend is the single source of truth for parsing.
message PushSkillRequest {
  option (buf.validate.message).cel = {
    id: "push_skill_request.artifact_source"
    message: "exactly one of artifact (inline bytes) or artifact_upload_ref must be set"
    expression: "(this.artifact.size() > 0) != (this.artifact_upload_ref != '')"
  };

  // Organization that owns this skill.
  string org = 1 [(buf.validate.field).required = true];

  // Skill artifact as a ZIP file (binary content).
  // The ZIP must contain:
  // - SKILL.md (required): Interface definition and documentation with YAML frontmatter
  //   - name: Skill identifier (required in frontmatter, kebab-case)
  //   - description: Human-readable description (optional but recommended)
  // - Tool executables/scripts (optional)
  // - Additional files referenced in SKILL.md
  //
  // Mutually exclusive with artifact_upload_ref (see the message comment).
  bytes artifact = 2;

  // Optional tag to associate with this version.
  // If provided, this tag will point to the new version.
  // If empty/not provided, the version will only be accessible via its hash.
  // Examples: "stable", "v1.0", "latest"
  string tag = 3 [(buf.validate.field).string.pattern = "^$|^[a-zA-Z0-9._-]+$"];

  // Git provenance for this skill version.
  // Absent when pushed from a non-git directory.
  //
  // @internal
  // Populated by CLI during push:
  // - For local pushes: auto-detected if directory is within a git repository
  // - For git pushes: resolved from user-provided URL/ref
  // Stored in SkillStatus.git_provenance for traceability.
  GitProvenance git_provenance = 4;

  // Reserved field numbers from previous schema versions.
  reserved 5;

  // Optional human-readable message describing what changed in this version.
  // Stored in metadata.version.message for version history display.
  // Analogous to a git commit message. If empty, the version timeline falls
  // back to displaying git_provenance.commit message when available.
  string message = 6;

  // Reference to an artifact staged via createArtifactUploadUrl().
  // Set this instead of artifact when the ZIP exceeds the gRPC message-size
  // cap. The reference is single-use and expires with its upload URL.
  //
  // Mutually exclusive with artifact (see the message comment).
  string artifact_upload_ref = 7;
}

// CreateSkillArtifactUploadUrlRequest asks the server to mint a staging
// slot for a skill artifact that is too large to travel inline in
// PushSkillRequest.artifact (the gRPC message cap is 10MB; skills may be
// up to 100MB).
message CreateSkillArtifactUploadUrlRequest {
  // Organization that will own the skill (authorization scope — the caller
  // needs the same can_create_skill permission that push requires).
  string org = 1 [(buf.validate.field).required = true];

  // Declared size of the artifact ZIP in bytes.
  //
  // Lets the server refuse over-limit artifacts BEFORE any bytes move —
  // the fail-loud-at-authoring contract from #675. The upload endpoint
  // additionally enforces the declared size against the actual bytes.
  int64 size_bytes = 2 [(buf.validate.field).int64.gt = 0];
}

// SkillArtifactUploadUrl is a short-lived, single-use capability for
// staging a skill artifact over HTTP.
//
// @internal
// The upload strategy differs by edition (mirrors ArtifactDownloadUrl):
// - Cloud: pre-signed R2/S3 PUT URL with short TTL
// - OSS: capability URL on the server's own HTTP lane (the unguessable
//   token in the path is the credential, exactly like a presigned URL)
//
// This pattern avoids streaming large blobs through the gRPC control plane.
message SkillArtifactUploadUrl {
  // URL to PUT the artifact ZIP bytes to. Content-Type: application/zip.
  string url = 1;

  // Opaque reference to pass as PushSkillRequest.artifact_upload_ref after
  // the PUT succeeds. Single-use; invalid after the push consumes it or
  // the TTL lapses.
  string artifact_upload_ref = 2;

  // Time-to-live for the upload URL in seconds. After this duration the
  // URL and the reference expire and a new one must be requested.
  int32 ttl_seconds = 3;
}

// SkillArtifactDownloadUrl provides a URL for downloading a skill
// artifact over HTTP.
//
// @internal
// The download strategy differs by edition (mirrors ArtifactDownloadUrl):
// - Cloud: pre-signed R2/S3 URL with short TTL (e.g., 15 minutes)
// - OSS: capability URL on the server's own HTTP lane; the content-hash
//   storage key in the path is the capability (the same trust model as
//   getArtifact, which deliberately skips authorization)
//
// This pattern avoids streaming large blobs through the gRPC control
// plane — the transport cap stays at 10MB while skills may be 100MB.
message SkillArtifactDownloadUrl {
  // URL to download the artifact ZIP via HTTP GET.
  string url = 1;

  // Time-to-live for the download URL in seconds.
  // Typically 900 (15 minutes) for Cloud, 0 (no expiry) for OSS.
  int32 ttl_seconds = 2;

  // Size of the artifact ZIP in bytes. Lets clients pre-allocate or
  // sanity-check before fetching.
  int64 size_bytes = 3;
}

// PushSkillFromExecutionArtifactRequest publishes a skill from an execution
// artifact already in storage, without downloading and re-uploading the ZIP.
//
// @internal
// Server-side push flow: reads the ZIP directly from artifact storage and
// delegates to the standard push logic.
//
// Authorization:
// - Requires can_view on the agent execution (to read the artifact)
// - Requires can_create_skill in the target organization (to push the skill)
//
// Security:
// The storage_key is validated to start with "artifacts/{execution_id}/"
// to prevent access to other executions' artifacts.
message PushSkillFromExecutionArtifactRequest {
  // Organization that will own the skill.
  string org = 1 [(buf.validate.field).required = true];

  // ID of the agent execution that produced the artifact (e.g., "aex_abc123xyz456").
  //
  // @internal
  // Used for authorization (can_view check) and storage_key validation.
  // Format: "aex_{ulid}".
  string execution_id = 2 [(buf.validate.field).string.min_len = 1];

  // Storage key of the directory artifact (ZIP) to push as a skill.
  // Obtain this from ExecutionArtifact.storage_key in the execution status.
  //
  // @internal
  // Must start with "artifacts/{execution_id}/" for security.
  // Format: "artifacts/{execution_id}/{filename}.zip".
  string storage_key = 3 [(buf.validate.field).string.min_len = 1];

  // Optional version tag (same semantics as PushSkillRequest.tag).
  // Examples: "stable", "v1.0", "latest"
  string tag = 4 [(buf.validate.field).string.pattern = "^$|^[a-zA-Z0-9._-]+$"];
}

// GetArtifactRequest requests download of a skill artifact by storage key.
message GetArtifactRequest {
  // The artifact storage key from skill.status.artifact_storage_key.
  //
  // @internal
  // Identifies the location of the ZIP file in storage (R2/S3).
  string artifact_storage_key = 1 [(buf.validate.field).required = true];
}

// GetArtifactResponse contains the skill artifact content.
message GetArtifactResponse {
  // The skill artifact as a ZIP file (binary content).
  // Contains SKILL.md and implementation files.
  bytes artifact = 1;
}

// ListSkillVersionsInput requests the version history for a skill.
//
// Returns all historical versions of the skill ordered by push time
// (newest first). Used by the Console and SDK to render version
// timelines and enable version comparison.
message ListSkillVersionsInput {
  // Organization that owns the skill.
  string org = 1 [(buf.validate.field).required = true];

  // Skill slug (unique within the organization).
  string slug = 2 [(buf.validate.field).required = true];

  // Opaque token for cursor-based pagination.
  // Empty string or omitted for the first page.
  string page_token = 3;

  // Maximum number of versions to return per page.
  // Server may return fewer. Default is 50.
  int32 page_size = 4;
}

// SkillVersionEntry represents a single historical version of a skill.
//
// Each push creates a new version entry. The version is immutably
// identified by its content hash (SHA256 of the artifact ZIP).
message SkillVersionEntry {
  // SHA256 hash of the artifact — the immutable version identifier.
  string version_hash = 1;

  // Timestamp when this version was pushed.
  google.protobuf.Timestamp pushed_at = 2;

  // Actor who pushed this version.
  ai.stigmer.commons.apiresource.ApiResourceAuditActor pushed_by = 3;

  // Tag associated with this version at push time.
  // May be empty if the version was pushed without a tag.
  string tag = 4;

  // Whether this is the currently active version of the skill.
  bool is_current = 5;

  // Git provenance tracking where this version's artifacts originated.
  // Absent when pushed from a non-git directory.
  GitProvenance git_provenance = 6;

  // Optional human-readable message describing the change.
  string message = 7;

  // Storage key for this version's artifact ZIP.
  // Can be passed to getArtifact() to download the historical artifact.
  string artifact_storage_key = 8;
}

// ListSkillVersionsResponse contains a page of skill version history.
message ListSkillVersionsResponse {
  // Ordered list of versions (newest first).
  repeated SkillVersionEntry versions = 1;

  // Token for fetching the next page. Empty when no more pages exist.
  string next_page_token = 2;

  // Total number of versions across all pages.
  int32 total_count = 3;
}
