syntax = "proto3";

package ai.stigmer.agentic.schedule.v1;

import "ai/stigmer/agentic/schedule/v1/api.proto";
import "ai/stigmer/agentic/schedule/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// ScheduleQueryController handles read operations for schedules.
//
// @internal
// No anonymous/public RPC by design (the AgentChannel posture): a
// schedule has no public surface at all — its only runtime effect is the
// executions its fires create.
service ScheduleQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = schedule;

  // Get a single schedule by ID.
  rpc get(ScheduleId) returns (Schedule) {
    option (ai.stigmer.commons.rpc.config).resource_kind = schedule;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get schedule";
  }

  // Get a schedule by its organization-scoped reference (org/slug).
  //
  // @internal
  // Custom authorization in handler — checks both direct resource access
  // and organization-level visibility permissions (the AgentShare /
  // AgentChannel pattern).
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (Schedule) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Get all schedules of a specific agent.
  // Returns only schedules the caller has access to.
  //
  // This is how the agent's operational surfaces and CLI resolve an
  // agent's existing schedules regardless of slug.
  //
  // @internal
  // Authorization in-handler: FGA-filtered in cloud, unrestricted in OSS
  // (the getByAgent family convention — agent channels, agent shares,
  // agent instances).
  rpc getByAgent(GetSchedulesByAgentRequest) returns (ScheduleList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List schedules with optional label filtering.
  //
  // @internal
  // Authorization in-handler via FGA-filtered queries (cloud) or
  // unrestricted store queries (OSS).
  rpc list(ListSchedulesRequest) returns (ScheduleList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
