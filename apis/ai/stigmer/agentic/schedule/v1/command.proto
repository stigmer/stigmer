syntax = "proto3";

package ai.stigmer.agentic.schedule.v1;

import "ai/stigmer/agentic/schedule/v1/api.proto";
import "ai/stigmer/agentic/schedule/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// ScheduleCommandController handles write operations for schedules.
service ScheduleCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = schedule;

  // Create or update a schedule.
  //
  // A request that carries metadata.id of a schedule in its organization
  // updates that schedule, and its slug changes only through rename. A slug the
  // schedule was renamed away from, named without the schedule's id, is refused
  // with FAILED_PRECONDITION carrying a google.rpc.ErrorInfo detail (domain
  // "stigmer.ai"), because a write by a name that stops resolving after 30 days
  // would later make a second schedule:
  //
  //   - SLUG_RENAMED — the slug was renamed: it still leads to the same
  //     schedule for reading, but a write names its current slug. Metadata:
  //     slug (the one the request named).
  //
  // @internal
  // The authorization and state-operation are determined depending on
  // whether the schedule is going to be created or updated, resolved as
  // part of request execution. Status is preserved verbatim across
  // apply-as-update (the AgentChannel posture): status is
  // written only by the scheduling runtime and by the explicit resume
  // command, and a routine manifest apply must never reset the failure
  // streak or un-pause a platform-paused schedule.
  rpc apply(Schedule) returns (Schedule);

  // Create a schedule.
  //
  // Scheduling an agent is a spending decision: every fire creates a run
  // that calls models on the schedule-owning organization's own provider
  // keys, unattended, and the providers bill the organization for them.
  //
  // A slug another schedule of the organization holds is refused with
  // ALREADY_EXISTS. A slug another schedule was renamed away from, which still
  // leads to it for 30 days, is refused with ALREADY_EXISTS carrying a
  // google.rpc.ErrorInfo detail (domain "stigmer.ai"):
  //
  //   - SLUG_RESERVED — another schedule held the slug until a recent rename,
  //     and it still leads there. Metadata: slug.
  //
  // @internal
  // Authorization: requires can_edit on the REFERENCED AGENT
  // (spec.agent.agent_ref), checked in-handler: whoever may edit the
  // agent may schedule it, and there is deliberately no org-level
  // can_create_schedule permission. (A chat link or a channel also asks
  // can_edit on its agent, and in addition needs an organization admin.) Standard org-scoped create tuples
  // (owner = creator); no visibility tuples (the kind has no visibility
  // block). Invariant enforced here: metadata.org must equal
  // spec.agent.agent_ref.org.
  rpc create(Schedule) returns (Schedule) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Update a schedule: the fields update_mask names change, every other
  // field keeps its stored value.
  //
  // The referenced agent and the target arm are immutable; cron, time zone,
  // enablement and the message may change. Status (firing observations,
  // the platform pause) is never touched by updates: use resume to clear a
  // platform pause.
  //
  // resource.metadata.id names the schedule; apply finds one by slug. The slug
  // changes only through rename, and a mask naming a field another door
  // owns, or a path the schedule does not have, is refused with
  // INVALID_ARGUMENT naming the path.
  //
  // An update is refused with ABORTED carrying a google.rpc.ErrorInfo detail
  // (domain "stigmer.ai"):
  //
  //   - ETAG_MISMATCH — resource.metadata.etag is set and the schedule changed
  //     since that etag was read: read it again and make the change again.
  //     No metadata.
  //   - WRITE_CONFLICT — the schedule kept changing while the update was
  //     being saved: try again. No metadata.
  //
  // @internal
  // Authorization: requires can_edit permission on the schedule.
  // agent_ref immutability is a consent-bar guarantee, not convenience:
  // create's bar is can_edit on the REFERENCED agent, and
  // a repointing update would let a schedule owner drive an agent they
  // may not edit — the AgentChannel rule for the AgentChannel reason.
  // Target-arm immutability is enforced in-handler: each target kind
  // enters its own execution pipeline. Update deliberately
  // does NOT clear a platform auto-pause: apply routes through this same
  // handler, so any update-clears-pause behavior would let a routine
  // GitOps re-apply silently un-pause a failing schedule. resume is the
  // one clearing path.
  rpc update(UpdateScheduleInput) returns (Schedule) {
    option (ai.stigmer.commons.rpc.config).resource_kind = schedule;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "resource.metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update schedule";
  }

  // Rename a schedule: change its slug, the name people type.
  //
  // The schedule keeps its id, so everything that names it keeps working, and
  // every answer names it by the new slug. The old slug keeps leading to the
  // schedule for reading for 30 days, during which no other schedule of the
  // organization can take it and this one can take it back; then it is
  // released. A write that names the old slug is refused with SLUG_RENAMED (see
  // apply). A slug another schedule holds is refused with ALREADY_EXISTS, and
  // one another schedule was recently renamed away from with SLUG_RESERVED (see
  // create).
  //
  // Its fires keep their times; a conversation an earlier fire started keeps
  // the name it was given then.
  //
  // @internal
  // Authorization: Requires can_delete permission on the schedule: whoever may
  // delete it may rename it.
  rpc rename(ai.stigmer.commons.apiresource.RenameInput) returns (Schedule) {
    option (ai.stigmer.commons.rpc.config).resource_kind = schedule;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to rename schedule";
  }

  // Delete a schedule.
  //
  // Firing stops permanently. Runs created by past fires are
  // untouched. To stop firing while keeping the schedule and its
  // history, disable it (enabled=false) instead.
  //
  // @internal
  // Authorization: requires can_delete permission on the schedule. The
  // referenced agent is untouched. The Temporal artifact teardown runs
  // best-effort, AFTER the row delete; an orphaned artifact is harmless
  // by construction (fire-time revalidation no-ops it, and the
  // reconciliation pass removes it).
  rpc delete(ScheduleId) returns (Schedule) {
    option (ai.stigmer.commons.rpc.config).resource_kind = schedule;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete schedule";
  }

  // Resume a schedule the platform paused after repeated run failures.
  //
  // Clears status.paused_reason, resets status.consecutive_failures,
  // and re-arms the clock. Resuming a schedule that is not paused
  // succeeds and changes nothing. A disabled schedule stays disabled:
  // resume clears the platform's pause, not the owner's switch
  // (spec.enabled).
  //
  // @internal
  // Authorization: requires can_edit permission on the schedule — the
  // update bar; resuming does not change which agent runs, so it does
  // not re-open create's consent bar. This command is
  // deliberately the ONLY path that clears a platform auto-pause:
  // apply and update preserve status byte-for-byte, so a
  // routine manifest apply can never silently un-pause a failing
  // schedule. The cloud handler loads before authorizing (#224: a
  // missing schedule answers NOT_FOUND, not PERMISSION_DENIED) and
  // patches status leaves rather than saving the row — the tick is a
  // concurrent status writer. OSS excludes the authorization step, per
  // its recorded single-user posture.
  rpc resume(ScheduleId) returns (Schedule) {
    option (ai.stigmer.commons.rpc.config).resource_kind = schedule;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to resume schedule";
  }

  // Trigger a schedule to fire once, immediately, and answer with the
  // run's real outcome.
  //
  // The manual fire runs synchronously through the standard run
  // create pipeline — every launch gate runs — and the result names what
  // happened: the created run's id, or the refusing gate's own
  // copy verbatim. status.last_fire_at and status.last_run_id
  // record a started run. Manual fires do NOT feed the failure streak —
  // the streak is the unattended (cron) health signal, and a test fire
  // of a broken schedule must not race its owner to the pause threshold.
  //
  // A disabled schedule refuses (enable it first). A platform-paused
  // schedule MAY be triggered — a test fire is exactly how an owner
  // verifies a fix before resuming; resume remains the one path that
  // clears the pause.
  //
  // @internal
  // Authorization: requires can_edit permission on the schedule — the
  // update bar. The artifact round-trip is gone for manual fires (it made the fire
  // asynchronous, so the RPC answered before the launch gates ran — a
  // false "run started" beside a climbing failure counter). Cron fires
  // keep the tracked artifact tick unchanged. The disabled refusal
  // stays for this reason:
  // ScheduleBlueprintAccess requires spec.enabled at the create gate AND
  // the mid-run sandbox read predicate, so a disabled-schedule run would
  // die mid-run after billing side effects (consoles offer
  // "Enable & run now" instead; a fire-legitimacy model would be needed
  // to lift this). Two-level contract: a gRPC
  // error means the trigger itself was refused (disabled →
  // FAILED_PRECONDITION with the byte-pinned copy, missing → NOT_FOUND
  // before authorize, #224); a gRPC success means the fire happened and
  // ScheduleTriggerResult names the run's outcome — a deterministically
  // refused run is a successful trigger honestly reported, never an
  // exception. The handler stamps last_fire_at/last_run_id and
  // writes the fire-ledger row (origin=manual) because the tick is not
  // in the path to do it; status writes ride updateFields, never save().
  // OSS mirrors the semantics; it excludes the
  // authorization step per its recorded single-user posture.
  rpc trigger(ScheduleId) returns (ScheduleTriggerResult) {
    option (ai.stigmer.commons.rpc.config).resource_kind = schedule;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to trigger schedule";
  }
}
