syntax = "proto3";

package ai.stigmer.agentic.agentrun.v1;

import "ai/stigmer/agentic/agentrun/v1/api.proto";
import "ai/stigmer/agentic/agentrun/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// AgentRunCommandController handles write operations for agent runs.
// Follows the standard pattern: create, update, delete (no granular field updates).
service AgentRunCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = agent_run;

  // Create and trigger a new agent run: a turn in an existing session,
  // or the first turn of a new one created from session_spec.
  //
  // @internal
  // Authorization is handled in the handler, in two run-gate checks
  // (AuthorizeRunTarget, then AuthorizeRunAgent):
  //   - session_id provided: can_create_run_in on the session, before
  //     anything about it is read; the run then belongs to the
  //     session's organization (ValidateSessionOrganization)
  //   - then can_execute on the agent the turn runs (the session's pinned
  //     agent, or the new session's agent_ref), or no check for the built-in
  //     assistant; a new session's own create authorizes can_create_session
  //     on metadata.org
  rpc create(AgentRun) returns (AgentRun) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Update an agent run.
  //
  // @internal
  // Used by users to update run configuration (spec fields).
  // No individual field updates - always provide complete state.
  rpc update(AgentRun) returns (AgentRun) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update agent run";
  }

  // Update an agent run's status.
  //
  // @internal
  // Used by the runner to send progressive status updates (messages,
  // tool_calls, phase, etc.). The runner authenticates as the triggering user,
  // who owns the run through the session ownership chain.
  // Optimized for frequent status updates and merges status fields with
  // existing state.
  rpc updateStatus(AgentRunUpdateStatusInput) returns (UpdateStatusResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "run_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update agent run status";
  }

  // Delete an agent run by ID.
  rpc delete(ai.stigmer.commons.apiresource.ApiResourceId) returns (AgentRun) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete agent run";
  }

  // Submit an approval decision for a pending tool call.
  //
  // ## Preconditions
  //
  // - Run must be in RUN_WAITING_FOR_APPROVAL phase
  // - tool_call_id must match status.pending_approval.tool_call_id
  // - User must have can_edit permission on the run
  //
  // ## Behavior by Action
  //
  // - APPROVE: Tool executes normally, run resumes to IN_PROGRESS
  // - SKIP: Tool returns skip message to LLM, run continues to IN_PROGRESS
  // - REJECT: Tool is denied and the user's objection is fed back to the LLM;
  //   the run CONTINUES (see APPROVAL_ACTION_REJECT in enum.proto — to
  //   stop the whole run, use cancel/terminate)
  //
  // @internal
  //
  // ## State Transitions
  //
  // On success:
  // - ToolCall.approval_action = submitted action
  // - ToolCall.approval_decided_at = current timestamp
  // - ToolCall.approved_by = authenticated user ID
  // - AgentRunStatus.pending_approval = cleared
  // - RunPhase = RUN_IN_PROGRESS (for every action, REJECT included)
  //
  // ## Error Conditions
  //
  // - NOT_FOUND: Run doesn't exist
  // - FAILED_PRECONDITION: Run not in WAITING_FOR_APPROVAL phase
  // - INVALID_ARGUMENT: tool_call_id doesn't match pending approval, or action is UNSPECIFIED
  // - PERMISSION_DENIED: User lacks can_edit permission
  //
  // ## Idempotency
  //
  // If the same approval is submitted twice (same run, tool_call, action),
  // the second call is a no-op and returns the current state.
  rpc submitApproval(SubmitApprovalInput) returns (AgentRun) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "agent_run_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to submit approval for agent run";
  }

  // Submit a keep/discard decision on a file change set (or a single file).
  //
  // Records a FILE_DECIDED event in the append-only file_review stream;
  // FileChangeSet.decisions is the derived projection. The runner reconciles
  // the approved bytes — this RPC records the decision and enforces
  // that expected_digest still matches the captured content the user reviewed.
  //
  // ## Preconditions
  //
  // - Run must exist and be non-terminal
  // - change_set_id must match a status.file_change_sets[].id; for FILE scope,
  //   file_change_id must match a CapturedFileChange.id within it
  // - expected_digest must match the target's current digest
  // - User must have can_edit permission on the run
  //
  // @internal
  //
  // ## Error Conditions
  //
  // - NOT_FOUND: Run doesn't exist
  // - FAILED_PRECONDITION: Run terminal, or change set/file not found
  // - INVALID_ARGUMENT: scope/action UNSPECIFIED, missing file_change_id for
  //   FILE scope, or expected_digest mismatch
  // - PERMISSION_DENIED: User lacks can_edit permission
  //
  // ## Idempotency
  //
  // Re-submitting the same decision (same change set, scope, target) is a no-op
  // and returns the current state — appends are keyed by FileReviewEvent.event_id.
  rpc submitFileDecision(SubmitFileDecisionInput) returns (AgentRun) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "agent_run_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to submit file decision for agent run";
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // Lifecycle Control Operations
  //
  // These RPCs control the agent run lifecycle, mapping to Temporal
  // workflow operations. They enable users to gracefully stop, force-stop,
  // pause, resume, or recover agent runs.
  // ─────────────────────────────────────────────────────────────────────────────

  // Cancel a running agent run gracefully.
  //
  // Sends a cancellation signal to the agent run. The agent can handle
  // the cancellation signal to save checkpoint and clean up before
  // transitioning to the CANCELLED phase.
  //
  // @internal
  // Temporal Equivalent: `temporal workflow cancel --workflow-id <id>`
  //
  // ## Behavior
  //
  // 1. Validates run exists and is in a cancellable phase
  // 2. Sends cancellation signal to Temporal workflow
  // 3. Python activity receives cancellation and saves LangGraph checkpoint
  // 4. Run transitions to RUN_CANCELLED phase
  // 5. Returns updated AgentRun with new phase
  //
  // ## Preconditions
  //
  // - Run must be in RUN_PENDING or RUN_IN_PROGRESS phase
  // - Cannot cancel already-terminal runs (COMPLETED, FAILED, CANCELLED, TERMINATED)
  //
  // ## State Transitions
  //
  // - status.phase: PENDING/IN_PROGRESS → CANCELLED
  // - status.completed_at: Set to current timestamp
  // - LangGraph checkpoint: Preserved for potential future reference
  //
  // ## Idempotency
  //
  // Cancelling an already-cancelled run succeeds as a no-op.
  // The call returns the current run state without side effects.
  //
  // ## Error Cases
  //
  // - NOT_FOUND: Run with given ID doesn't exist
  // - PERMISSION_DENIED: User lacks can_edit permission on the run
  // - FAILED_PRECONDITION: Run is in a terminal phase
  // - INVALID_ARGUMENT: ID is empty or malformed
  rpc cancel(CancelAgentRunInput) returns (AgentRun) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to cancel agent run";
  }

  // Terminate an agent run immediately.
  //
  // Force-stops the agent run without allowing cleanup. Unlike cancel,
  // the agent cannot respond to termination - it is stopped immediately.
  // Use this for stuck or unresponsive agents.
  //
  // @internal
  // Temporal Equivalent: `temporal workflow terminate --workflow-id <id>`
  //
  // ## Behavior
  //
  // 1. Validates run exists and is in a terminable phase
  // 2. Force-kills workflow via Temporal (no signal sent to agent)
  // 3. Run transitions to RUN_TERMINATED phase immediately
  // 4. No cleanup callbacks or checkpoint saves occur
  // 5. Returns updated AgentRun with TERMINATED phase
  //
  // ## Preconditions
  //
  // - Run must be in RUN_PENDING or RUN_IN_PROGRESS phase
  // - Cannot terminate already-terminal runs
  //
  // ## State Transitions
  //
  // - status.phase: PENDING/IN_PROGRESS → TERMINATED
  // - status.completed_at: Set to current timestamp
  // - LangGraph checkpoint: May be incomplete (no graceful save)
  //
  // ## Terminated vs Cancelled
  //
  // | Aspect | cancel | terminate |
  // |--------|--------|-----------|
  // | Signal to agent | Yes (can handle) | No |
  // | Checkpoint saved | Yes (graceful) | No |
  // | Use case | Normal stop | Stuck agents |
  // | Can recover? | No | No |
  //
  // ## Idempotency
  //
  // Terminating an already-terminated run succeeds as a no-op.
  //
  // ## Error Cases
  //
  // - NOT_FOUND: Run with given ID doesn't exist
  // - PERMISSION_DENIED: User lacks can_edit permission on the run
  // - FAILED_PRECONDITION: Run is in a terminal phase
  // - INVALID_ARGUMENT: ID is empty or malformed
  rpc terminate(TerminateAgentRunInput) returns (AgentRun) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to terminate agent run";
  }

  // Recover a failed agent run.
  //
  // Retries the failed run. Completed work is preserved - successful tool
  // calls are NOT re-executed.
  //
  // @internal
  // Terminates the previous Temporal workflow (NOT_FOUND tolerated) and starts
  // a fresh one; continuity comes from the session's harness state (LangGraph
  // thread checkpoint / harness_state_id), not from Temporal history. A
  // Temporal reset cannot work here: the runner activity RETURNS its FAILED
  // result, so a reset replays the preserved failure instead of re-dispatching.
  //
  // ## Behavior
  //
  // 1. Validates run is in FAILED phase (recoverable)
  // 2. Terminates the previous workflow and recreates the execution environment
  // 3. Starts a fresh workflow; the activity is re-invoked with the same thread_id
  // 4. LangGraph loads from checkpoint automatically
  // 5. Run transitions from FAILED to IN_PROGRESS phase
  // 6. Agent retries from where it failed
  //
  // ## Preconditions
  //
  // - Run must be in RUN_FAILED phase
  // - TERMINATED runs cannot be recovered (incomplete checkpoint)
  // - CANCELLED runs cannot be recovered (intentional user action)
  //
  // ## State Transitions
  //
  // - status.phase: FAILED → IN_PROGRESS
  // - status.completed_at: Cleared
  // - status.error: Cleared
  // - Completed tool calls: Preserved (not re-executed)
  //
  // ## Idempotency
  //
  // If recovery already succeeded (run is now IN_PROGRESS),
  // the call succeeds as a no-op.
  //
  // ## Error Cases
  //
  // - NOT_FOUND: Run with given ID doesn't exist
  // - PERMISSION_DENIED: User lacks can_edit permission
  // - FAILED_PRECONDITION: Run is not in FAILED phase
  // - INVALID_ARGUMENT: ID is empty or malformed
  rpc recover(RecoverAgentRunInput) returns (AgentRun) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to recover agent run";
  }

  // Pause a running agent run.
  //
  // Temporarily stops the agent at its current checkpoint. Unlike cancel,
  // the run is NOT terminal and can be resumed later from where it left off.
  //
  // @internal
  //
  // ## Behavior
  //
  // 1. Validates run exists and is in a pausable phase
  // 2. Sends "pause" signal to Temporal workflow
  // 3. Workflow cancels running activity gracefully
  // 4. Python activity saves LangGraph checkpoint on cancellation
  // 5. Run transitions to RUN_PAUSED phase
  // 6. Workflow waits for resume signal (no resources consumed)
  //
  // ## Preconditions
  //
  // - Run must be in RUN_PENDING or RUN_IN_PROGRESS phase
  // - Cannot pause already-terminal or already-paused runs
  //
  // ## State Transitions
  //
  // - status.phase: PENDING/IN_PROGRESS → PAUSED
  // - status.completed_at: NOT set (run is not finished)
  // - LangGraph checkpoint: Saved via thread_id
  //
  // ## Paused vs Cancelled
  //
  // | Aspect | pause | cancel |
  // |--------|-------|--------|
  // | Terminal state? | No | Yes |
  // | Can resume? | Yes (via resume RPC) | No |
  // | Checkpoint saved? | Yes | Best-effort |
  // | Use case | Temporary stop | Permanent stop |
  //
  // ## Idempotency
  //
  // Pausing an already-paused run succeeds as a no-op.
  //
  // ## Error Cases
  //
  // - NOT_FOUND: Run with given ID doesn't exist
  // - PERMISSION_DENIED: User lacks can_edit permission
  // - FAILED_PRECONDITION: Run is in a terminal phase
  // - INVALID_ARGUMENT: ID is empty or malformed
  rpc pause(PauseAgentRunInput) returns (AgentRun) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to pause agent run";
  }

  // Resume a paused agent run.
  //
  // Continues the run from the checkpoint where it was paused. The agent
  // re-invokes with the same thread_id, loading from LangGraph checkpoint
  // and continuing from where it left off.
  //
  // @internal
  //
  // ## Behavior
  //
  // 1. Validates run is in RUN_PAUSED phase
  // 2. Sends "resume" signal to Temporal workflow
  // 3. Workflow unblocks and re-invokes activity
  // 4. Activity loads from LangGraph checkpoint using thread_id
  // 5. Run transitions back to RUN_IN_PROGRESS phase
  // 6. Agent continues from exact pause point
  //
  // ## Preconditions
  //
  // - Run must be in RUN_PAUSED phase
  // - Cannot resume non-paused runs
  //
  // ## State Transitions
  //
  // - status.phase: PAUSED → IN_PROGRESS
  // - Activities: Re-invoked, load from checkpoint
  // - LangGraph state: Loaded from checkpoint via thread_id
  //
  // ## Idempotency
  //
  // Resuming a run that is already running succeeds as a no-op.
  //
  // ## Error Cases
  //
  // - NOT_FOUND: Run with given ID doesn't exist
  // - PERMISSION_DENIED: User lacks can_edit permission
  // - FAILED_PRECONDITION: Run is not in PAUSED phase
  // - INVALID_ARGUMENT: ID is empty or malformed
  rpc resume(ResumeAgentRunInput) returns (AgentRun) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to resume agent run";
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // Artifact Lifecycle Operations
  //
  // These RPCs support file attachments and artifacts for agent runs.
  // Attachments are input files provided before the run; artifacts are
  // output files created during the run.
  // ─────────────────────────────────────────────────────────────────────────────

  // Upload a file attachment for use in an agent run.
  //
  // Pre-uploads files to artifact storage before creating a run.
  // The returned storage_key can be used in Attachment.storage_key when
  // creating the run.
  //
  // @internal
  //
  // ## Authorization
  //
  // This endpoint does not require authorization. The storage_key returned
  // acts as a capability token - knowing the key grants access to the content.
  // This simplifies the upload flow for CLI and other clients.
  //
  // ## Storage Path
  //
  // Files are stored at: attachments/{ulid}/{filename}
  // The ULID ensures unique paths and enables future cleanup policies.
  //
  // ## Use Cases
  //
  // - CLI uploading files (>4MB) before agent run
  // - Pre-uploading datasets for agent processing
  // - Uploading binary files that cannot be embedded inline in Attachment
  //
  // ## Example Flow
  //
  // 1. Client calls uploadAttachment with file content
  // 2. Server uploads to storage, returns storage_key
  // 3. Client creates AgentRun with Attachment using storage_key
  // 4. The runner downloads attachment content when the run starts
  rpc uploadAttachment(UploadAttachmentRequest) returns (UploadAttachmentResponse) {
    // No authorization - storage_key acts as capability token
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
