syntax = "proto3";

package ai.stigmer.agentic.agentrun.v1;

import "ai/stigmer/agentic/agentrun/v1/api.proto";
import "ai/stigmer/agentic/agentrun/v1/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// AgentRunQueryController handles read operations for agent runs.
service AgentRunQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = agent_run;

  // Get a single agent run by ID.
  rpc get(AgentRunId) returns (AgentRun) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get agent run";
  }

  // List all agent runs with pagination and optional filtering.
  rpc list(ListAgentRunsRequest) returns (AgentRunList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List all runs in a specific session.
  //
  // @internal
  // Authorization is handled in handler via FGA query for authorized agent_run_ids,
  // then filtered by session_id. This ensures consistent authorization pattern across all list operations.
  rpc listBySession(ListAgentRunsBySessionRequest) returns (AgentRunList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Subscribe to real-time run updates (streaming).
  //
  // @internal
  // Authorization is handled by the FJ model via proto configuration.
  rpc subscribe(AgentRunId) returns (stream AgentRun) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to subscribe to agent run";
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // Artifact Lifecycle Operations
  //
  // These RPCs support downloading artifacts created by agent runs.
  // ─────────────────────────────────────────────────────────────────────────────

  // Get a presigned download URL for a run artifact or attachment.
  //
  // Returns a time-limited URL for downloading an artifact published by
  // an agent during the run, or an attachment submitted with the
  // run. The URL can be used with a simple HTTP GET request without
  // authentication.
  //
  // @internal
  //
  // ## Authorization
  //
  // Requires can_view permission on the run. This ensures users can
  // only download files from runs they have access to.
  //
  // ## Security
  //
  // The storage_key is validated to ensure it belongs to the specified
  // run. Two key forms are accepted:
  //
  // - "artifacts/{run_id}/..." — outputs published by the run;
  //   the embedded run id is the ownership proof
  // - a key listed verbatim in the run's spec.attachments — inputs
  //   submitted with the turn ("attachments/{ulid}/{filename}", ULID-unique
  //   per upload); ownership is the spec reference, since the key carries
  //   no run id
  //
  // Any other key is rejected to prevent path traversal attacks.
  //
  // ## URL Expiration
  //
  // Download URLs expire after 7 days (configurable). After expiration,
  // call this endpoint again to get a fresh URL.
  //
  // ## Use Cases
  //
  // - CLI downloading agent-created files
  // - Web UI providing download links for artifacts
  // - Web UI rendering submitted attachments in the message thread
  // - Refreshing expired download URLs
  //
  // ## Example Flow
  //
  // 1. Get the run via AgentRunQueryController.get
  // 2. Find artifact in status.artifacts[] (or attachment in spec.attachments[])
  // 3. Call getArtifactDownloadUrl with run_id and storage_key
  // 4. Use returned download_url for HTTP GET
  rpc getArtifactDownloadUrl(GetArtifactDownloadUrlRequest) returns (GetArtifactDownloadUrlResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "run_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to download artifact from agent run";
  }

  // Read the raw content of a run artifact.
  //
  // Returns artifact bytes through the Stigmer API, eliminating CORS
  // concerns for SDK consumers who need to read content programmatically
  // (e.g., YAML parsing for resource detection, in-app preview rendering).
  //
  // For direct file downloads, use getArtifactDownloadUrl instead — it
  // returns a presigned R2 URL that avoids proxying bytes through the server.
  //
  // @internal
  //
  // ## Authorization
  //
  // Requires can_view permission on the run. This ensures users can
  // only read artifacts from runs they have access to.
  //
  // ## Security
  //
  // The storage_key is validated to ensure it belongs to the specified
  // run. Keys must start with "artifacts/{run_id}/" to prevent
  // path traversal attacks.
  //
  // ## Size Limit
  //
  // Content is truncated to max_bytes (default: 512 KB). The response
  // includes total_size_bytes and a truncated flag so callers can decide
  // whether to offer a full download via getArtifactDownloadUrl.
  //
  // ## Example Flow
  //
  // 1. Get the run via AgentRunQueryController.get
  // 2. Find artifact in status.artifacts[]
  // 3. Call getArtifactContent with run_id and storage_key
  // 4. Decode content bytes as UTF-8 for text artifacts
  // 5. Parse YAML to detect Stigmer resource kind (Agent, McpServer, etc.)
  rpc getArtifactContent(GetArtifactContentRequest) returns (GetArtifactContentResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "run_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to read artifact content from agent run";
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // Usage Report Operations
  //
  // These RPCs provide cost and token consumption visibility at run,
  // session, agent, and organization levels. All data is sourced from the
  // llm_call_usage_record collection (billing domain).
  // ─────────────────────────────────────────────────────────────────────────────

  // Get a usage report for a single run.
  //
  // Returns aggregated tokens, cost, and per-model breakdown for one run.
  rpc getRunUsageReport(GetRunUsageReportInput) returns (GetRunUsageReportOutput) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_run;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "run_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view run usage report";
  }

  // Get a usage report for a session.
  //
  // Returns aggregated tokens, cost, and per-run breakdown.
  rpc getSessionUsageReport(GetSessionUsageReportInput) returns (GetSessionUsageReportOutput) {
    option (ai.stigmer.commons.rpc.config).resource_kind = session;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "session_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view session usage report";
  }

  // Get a usage report for an agent within an organization.
  //
  // Returns aggregated tokens, cost, and per-session breakdown for one
  // organization's runs of the agent. Requires can_view on the
  // organization named in org; runs outside that organization are
  // never included, so the report is the per-agent drill-down of
  // getOrgUsageReport.
  //
  // @internal
  // Org-scoped by design (oss#389). Agent can_view is a consumption
  // permission — public agents grant it to every authenticated account via
  // the FGA wildcard — so gating on the agent would leak usage across organizations.
  // Gating on the organization also keeps other organizations' sessions of a
  // shared agent out of the report. Consumed by the CLI (`stigmer usage
  // agent`).
  rpc getAgentUsageReport(GetAgentUsageReportInput) returns (GetAgentUsageReportOutput) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view agent usage report";
  }

  // Get a usage report for an organization.
  //
  // Returns org-wide totals, top agents by cost, model breakdown, and daily trend.
  rpc getOrgUsageReport(GetOrgUsageReportInput) returns (GetOrgUsageReportOutput) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view organization usage report";
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // Run Summary (Dashboard Aggregation)
  //
  // Operational summary for the platform dashboard. Returns phase counts
  // and active run count — cost is sourced separately from
  // getOrgUsageReport, the billing source of truth, so it is never counted
  // from two sources.
  // ─────────────────────────────────────────────────────────────────────────────

  // Get aggregated run statistics for an organization's agent runs.
  //
  // Returns counts by phase, active count, average duration, and top failing
  // agents — scoped to a configurable time window (24h, 7d, 30d, all-time).
  //
  // @internal
  // Authorization:
  // Custom authorization — user must have organization-level access.
  // Results are scoped to the user's organization.
  //
  // Use Cases:
  //
  // 1. Dashboard Overview:
  //    - Display the agent run KPI cards
  //
  // 2. Reliability Monitoring:
  //    - Surface top failing agents for investigation
  //    - Track failure rates across the organization
  rpc getRunSummary(GetAgentRunSummaryRequest) returns (AgentRunSummary) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
