syntax = "proto3";

package ai.stigmer.agentic.agentrunner.v1;

import "ai/stigmer/agentic/agentrunner/v1/api.proto";
import "ai/stigmer/agentic/agentrunner/v1/enum.proto";
import "ai/stigmer/commons/rpc/pagination.proto";
import "buf/validate/validate.proto";

// AgentRunnerId wraps an agent runner identifier.
message AgentRunnerId {
  // Unique identifier of the agent runner.
  string value = 1 [(buf.validate.field).required = true];
}

// AgentRunnerHeartbeatInput is sent by the runner process on a regular
// interval (default 30s) to report liveness and operational state.
//
// The server uses heartbeat absence to detect stale runners: if no heartbeat
// arrives within the timeout window (default 90s = 3x interval), the runner
// transitions to STOPPED. When a stopped runner resumes heartbeating, it
// transitions back to READY.
//
// The heartbeat is intentionally lightweight — it carries only the fields that
// change frequently. Static runner identity (name, org, description) is set
// once via create/apply and does not repeat on every heartbeat.
message AgentRunnerHeartbeatInput {
  // ID of the agent runner sending the heartbeat.
  string agent_runner_id = 1 [(buf.validate.field).required = true];

  // Current operational phase as reported by the runner.
  // Typically READY (accepting work) or BUSY (at capacity).
  AgentRunnerPhase phase = 2 [(buf.validate.field).enum.defined_only = true];

  // Number of agent executions currently in progress on this runner.
  int32 current_executions = 3;

  // Self-reported machine information. The runner sends this on every
  // heartbeat so that version upgrades and hostname changes are reflected
  // without requiring a full resource update.
  AgentRunnerConnectionInfo connection_info = 4;
}

// ListAgentRunnersRequest is the input for listing agent runners within
// an organization.
message ListAgentRunnersRequest {
  // Organization slug to scope the listing.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // Filter by metadata labels. AND semantics: all labels must match.
  //
  // Common filters:
  // - Exclude system-managed: omit {"stigmer.ai/system-managed": "true"}
  // - Show only system-managed: {"stigmer.ai/system-managed": "true"}
  map<string, string> labels = 2;

  // Pagination options.
  ai.stigmer.commons.rpc.PageInfo page_info = 3;
}

// AgentRunnerList is the response for listing agent runners.
message AgentRunnerList {
  // Total number of agent runners matching the query.
  int32 total_count = 1;

  // Agent runners in the current page.
  repeated AgentRunner items = 2;
}
