syntax = "proto3";

package ai.stigmer.agentic.executioncontext.v1;

import "ai/stigmer/agentic/executioncontext/v1/spec.proto";
import "ai/stigmer/commons/apiresource/metadata.proto";
import "ai/stigmer/commons/apiresource/status.proto";
import "buf/validate/validate.proto";

// Ephemeral runtime configuration and secrets scoped to a single execution.
//
// @internal
// Created by the execution engine at start, deleted when execution completes.
// Used for B2B scenarios where secrets are injected at runtime.
message ExecutionContext {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = 'agentic.stigmer.ai/v1'];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = 'ExecutionContext'];

  // Resource metadata including name, organization, and labels.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // Configuration including the parent execution ID and runtime key-value data.
  ExecutionContextSpec spec = 4;

  // System-managed audit status.
  ai.stigmer.commons.apiresource.ApiResourceAuditStatus status = 5;
}
