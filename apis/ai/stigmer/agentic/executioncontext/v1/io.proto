syntax = "proto3";

package ai.stigmer.agentic.executioncontext.v1;

import "buf/validate/validate.proto";

// ExecutionContextId wraps an ExecutionContext identifier.
message ExecutionContextId {
  string value = 1 [(buf.validate.field).required = true];
}

// Input for looking up an ExecutionContext by its parent execution ID.
//
// @internal
// Primary lookup method used by runners to retrieve merged environment
// variables during execution.
message ExecutionContextExecutionIdInput {
  // AgentExecution or WorkflowExecution ID to look up.
  //
  // @internal
  // Must match the execution_id field in ExecutionContextSpec.
  string execution_id = 1 [(buf.validate.field).string.min_len = 1];
}
