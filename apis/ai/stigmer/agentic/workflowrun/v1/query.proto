syntax = "proto3";

package ai.stigmer.agentic.workflowrun.v1;

import "ai/stigmer/agentic/workflowrun/v1/api.proto";
import "ai/stigmer/agentic/workflowrun/v1/event.proto";
import "ai/stigmer/agentic/workflowrun/v1/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// WorkflowRunQueryController handles read operations (Get, List, Subscribe) for WorkflowRun resources.
//
// This service follows the Command-Query Separation (CQS) pattern:
// - CommandController: Write operations (create, update, delete)
// - QueryController: Read operations (get, list, search, subscribe)
//
// Authorization:
// - get: Standard authorization - user must have "get" permission on the specific WorkflowRun
// - list: Custom authorization - filters results based on user's owner scope and permissions
// - list_by_workflow: Custom authorization - verifies user has access to the Workflow
// - subscribe: Standard authorization - user must have "get" permission to subscribe to updates
//
// Service Options:
// - api_resource_kind: workflow_run - Links this service to the WorkflowRun resource
service WorkflowRunQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = workflow_run;

  // Get a single workflow run by ID.
  //
  // Retrieves the complete WorkflowRun resource including:
  // - spec: User inputs (workflow_id, trigger_message, etc.)
  // - status: Current run state (phase, tasks, progress_events, output/error)
  // - metadata: Resource identification (id, name, labels, tags)
  //
  // @internal
  // Authorization:
  // Standard authorization checks that user has "get" permission on the WorkflowRun.
  // Permission is granted if:
  // - User created the run (metadata.audit.created_by matches user)
  // - User has organization-level "workflow_run:get" permission
  // - User has explicit permission via IamPolicy
  //
  // Use Cases:
  //
  // 1. View Run Details:
  // - User clicks on a run in the UI
  // - UI calls get() to fetch full details
  // - UI displays run status, tasks, progress, output/error
  //
  // 2. Poll for Completion:
  // - Client triggers the run via create()
  // - Client periodically calls get() to check if phase is terminal
  // - Client retrieves output when phase == RUN_COMPLETED
  //
  // 3. Debug Failed Run:
  // - User sees run failed
  // - User calls get() to inspect status.error and status.tasks
  // - User checks status.tasks[] for task-level execution details
  //
  // 4. Retry Failed Run:
  // - User calls get() to retrieve failed run's spec
  // - User creates new run with same spec values
  // - New run retries with identical inputs
  //
  // Error Cases:
  //
  // - NOT_FOUND:
  //   - No WorkflowRun exists with the given ID
  //
  // - PERMISSION_DENIED:
  //   - User doesn't have "get" permission on this WorkflowRun
  //   - WorkflowRun belongs to different organization
  //
  // Example Request:
  // {
  //   "value": "wfx_abc123xyz456"
  // }
  //
  // Example Response:
  // {
  //   "api_version": "agentic.stigmer.ai/v1",
  //   "kind": "WorkflowRun",
  //   "metadata": {
  //     "id": "wfx_abc123xyz456",
  //     "name": "customer-onboarding-20250111-143022",
  //     "org": "acme"
  //   },
  //   "spec": {
  //     "workflow_id": "wfl_customer-onboarding",
  //     "trigger_message": "New signup: john.doe@example.com"
  //   },
  //   "status": {
  //     "phase": 2,  // RUN_IN_PROGRESS
  //     "total_tasks": 3,
  //     "completed_tasks": 1,
  //     "tasks": [ ... ],
  //     "started_at": "2025-01-11T14:30:22Z"
  //   }
  // }
  rpc get(WorkflowRunId) returns (WorkflowRun) {
    option (ai.stigmer.commons.rpc.config).resource_kind = workflow_run;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get workflow run";
  }

  // List workflow runs with pagination and optional filtering.
  //
  // Returns a paginated list of WorkflowRun resources that the user has access to.
  // Results are automatically filtered based on user's permissions and owner scope.
  //
  // @internal
  // Authorization:
  // Custom authorization filters results to only include runs the user
  // can access: the runs in their organization the parent workflow's
  // run visibility and their own runs admit.
  //
  // Pagination:
  // - page_size: zero returns every run; a positive size at most that
  //   many, and at most 100
  // - page_token: the previous response's next_page_token, the other
  //   fields unchanged
  // - next_page_token: set while more may follow; a page may be short
  //
  // Filtering:
  // - phase: Filter by run phase (PENDING, IN_PROGRESS, COMPLETED, FAILED, CANCELLED)
  // - tags: Filter by resource tags (AND logic - must match all tags)
  //
  // Sorting:
  // Results are sorted by created_at descending (newest first); another
  // sort_field sorts the whole matching set and returns no token.
  //
  // Use Cases:
  //
  // 1. Run History Dashboard:
  // - UI displays list of all recent runs
  // - User can filter by status (show only failed, show only in-progress)
  // - User can page through historical runs
  //
  // 2. Monitor Active Runs:
  // - UI calls list(phase=RUN_IN_PROGRESS) to show runs in progress
  // - UI displays progress for each run (completed_tasks / total_tasks)
  // - UI refreshes list periodically to show updates
  //
  // 3. Audit and Compliance:
  // - Admin lists all runs for a time period
  // - Admin filters by tags (environment, team, project)
  // - Admin exports run history for audit logs
  //
  // 4. Debug and Troubleshooting:
  // - Developer lists failed runs (phase=RUN_FAILED)
  // - Developer inspects error messages and retry patterns
  // - Developer identifies systematic failures
  //
  // Error Cases:
  //
  // - INVALID_ARGUMENT:
  //   - page_size is negative
  //   - page_token is malformed, or was issued for a different request
  //
  // Example Request (Filter for failed runs):
  // {
  //   "page_size": 20,
  //   "phase": 4,  // RUN_FAILED
  //   "tags": ["environment:production"]
  // }
  //
  // Example Response:
  // {
  //   "next_page_token": "…",
  //   "entries": [
  //     {
  //       "metadata": { "id": "wfx_failed-1", ... },
  //       "status": { "phase": 4, "error": "Task failed: API timeout", ... }
  //     },
  //     {
  //       "metadata": { "id": "wfx_failed-2", ... },
  //       "status": { "phase": 4, "error": "Task failed: Rate limit", ... }
  //     }
  //   ]
  // }
  rpc list(ListWorkflowRunsRequest) returns (WorkflowRunList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List all runs for a specific Workflow.
  //
  // Returns runs filtered by a specific Workflow ID.
  // This is useful for viewing the run history of a particular workflow.
  //
  // @internal
  // Authorization:
  // Custom authorization verifies:
  // 1. User has access to the referenced Workflow
  // 2. Results are filtered to only include runs user can access
  //
  // Pagination:
  // - page_size: zero returns every run; a positive size at most that
  //   many, and at most 100
  // - page_token: the previous response's next_page_token, the other
  //   fields unchanged
  //
  // Sorting:
  // Results are sorted by created_at descending (newest first); another
  // sort_field sorts the whole matching set and returns no token.
  //
  // Use Cases:
  //
  // 1. Workflow Run History:
  // - User views a Workflow in the UI
  // - UI calls listByWorkflow(workflow_id) to show all runs
  // - UI displays timeline of runs with success/failure indicators
  //
  // 2. Performance Analysis:
  // - Developer wants to analyze workflow performance over time
  // - Developer calls listByWorkflow() to get all runs
  // - Developer calculates average duration, success rate, failure patterns
  //
  // 3. Retry Analysis:
  // - User sees failed run
  // - User calls listByWorkflow() to see if other runs also failed
  // - User determines if failure is systematic or one-off
  //
  // 4. Workflow Testing:
  // - Developer tests a workflow with multiple runs
  // - Developer calls listByWorkflow() to see all test runs
  // - Developer compares outputs across runs
  //
  // Error Cases:
  //
  // - INVALID_ARGUMENT:
  //   - workflow_id is empty or invalid format
  //   - page_size is negative
  //   - page_token is malformed, or was issued for a different request
  //
  // - PERMISSION_DENIED:
  //   - User doesn't have access to the referenced Workflow
  //
  // - NOT_FOUND:
  //   - No Workflow exists with the given ID
  //
  // Example Request:
  // {
  //   "workflow_id": "wfl_customer-onboarding",
  //   "page_size": 50
  // }
  //
  // Example Response:
  // {
  //   "next_page_token": "…",
  //   "entries": [
  //     {
  //       "metadata": { "id": "wfx_latest", "created_at": "2025-01-11T14:30:22Z" },
  //       "status": { "phase": 3, ... }  // COMPLETED
  //     },
  //     {
  //       "metadata": { "id": "wfx_previous", "created_at": "2025-01-11T10:15:00Z" },
  //       "status": { "phase": 4, ... }  // FAILED
  //     }
  //   ]
  // }
  rpc listByWorkflow(ListWorkflowRunsByWorkflowRequest) returns (WorkflowRunList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Subscribe to real-time updates for a specific workflow run (server streaming).
  //
  // Opens a bidirectional stream that pushes WorkflowRun updates as they occur.
  // Client receives updates when:
  // - Run phase changes (PENDING → IN_PROGRESS → COMPLETED)
  // - Tasks start or complete
  // - Progress events are appended
  // - Output or error fields are set
  //
  // @internal
  // Authorization:
  // Standard authorization checks that user has "get" permission on the WorkflowRun.
  // This is the same permission check as get() RPC.
  //
  // Stream Lifecycle:
  // 1. Client sends SubscribeWorkflowRunRequest with run_id
  // 2. Server validates authorization
  // 3. Server sends initial WorkflowRun (current state)
  // 4. Server streams updates as run progresses
  // 5. Server closes stream when the run reaches terminal state (COMPLETED/FAILED/CANCELLED)
  // 6. Client can close stream early (e.g., user navigates away from page)
  //
  // Update Frequency:
  // - Updates are sent immediately when run state changes
  // - No polling necessary (server pushes updates)
  // - Typical update latency: < 100ms
  //
  // Use Cases:
  //
  // 1. Real-Time Progress Monitoring:
  // - User triggers a run from UI
  // - UI subscribes to run updates
  // - UI displays live progress: tasks completing, progress bar updating
  // - UI shows final output when the run completes
  //
  // 2. Long-Running Workflow Monitoring:
  // - Workflow takes hours to complete (e.g., data processing)
  // - UI subscribes and shows live progress
  // - User can leave page, come back, and reconnect to same run
  //
  // 3. Debugging with Live Updates:
  // - Developer triggers test run
  // - Developer subscribes to watch run progress
  // - Developer sees exactly which task is running and when failures occur
  //
  // 4. Multi-User Collaboration:
  // - Multiple users watching same run
  // - All users receive same updates simultaneously
  // - All users see consistent view of run state
  //
  // Stream Message Format:
  // Each message is a complete WorkflowRun resource with updated status.
  //
  // Error Cases:
  //
  // - NOT_FOUND:
  //   - No WorkflowRun exists with the given ID
  //
  // - PERMISSION_DENIED:
  //   - User doesn't have "get" permission on this WorkflowRun
  //
  // - DEADLINE_EXCEEDED:
  //   - Client timeout (client should reconnect)
  //
  // - UNAVAILABLE:
  //   - Server unavailable (client should retry with backoff)
  //
  // Example Request:
  // {
  //   "run_id": "wfx_abc123xyz456"
  // }
  //
  // Example Stream (sequence of messages):
  //
  // Message 1 (initial state):
  // {
  //   "metadata": { "id": "wfx_abc123xyz456" },
  //   "status": {
  //     "phase": 1,  // RUN_PENDING
  //     "total_tasks": 3,
  //     "completed_tasks": 0
  //   }
  // }
  //
  // Message 2 (run started):
  // {
  //   "metadata": { "id": "wfx_abc123xyz456" },
  //   "status": {
  //     "phase": 2,  // RUN_IN_PROGRESS
  //     "started_at": "2025-01-11T14:30:22Z"
  //   }
  // }
  //
  // Message 3 (task 1 completed):
  // {
  //   "metadata": { "id": "wfx_abc123xyz456" },
  //   "status": {
  //     "phase": 2,  // RUN_IN_PROGRESS
  //     "completed_tasks": 1,
  //     "tasks": [
  //       { "task_id": "task-1", "status": 3, "output": { ... } }
  //     ]
  //   }
  // }
  //
  // Message 4 (run completed):
  // {
  //   "metadata": { "id": "wfx_abc123xyz456" },
  //   "status": {
  //     "phase": 3,  // RUN_COMPLETED
  //     "completed_tasks": 3,
  //     "output": { ... },
  //     "completed_at": "2025-01-11T14:35:47Z"
  //   }
  // }
  // [Stream closes]
  rpc subscribe(SubscribeWorkflowRunRequest) returns (stream WorkflowRun) {
    option (ai.stigmer.commons.rpc.config).resource_kind = workflow_run;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "run_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get workflow run stream";
  }

  // Fetch the paginated event log for a workflow run.
  //
  // Returns run events ordered by sequence_number ascending, with
  // cursor-based pagination and optional filtering by event type or task name.
  //
  // @internal
  // Authorization:
  // Standard authorization checks that user has "get" permission on the
  // WorkflowRun. Same permission as get() and subscribe().
  //
  // The event log complements the status snapshot: the snapshot tells you
  // current state, the event log tells you what happened and when.
  //
  // Use Cases:
  //
  // 1. Run Viewer Timeline:
  //    - Load full event history for a completed run
  //    - Render timeline with task transitions, retries, approvals, cost
  //
  // 2. Task Drill-Down:
  //    - Filter by task_name to see all events for a specific task
  //    - Inspect retry history, duration, cost per attempt
  //
  // 3. Cost Audit:
  //    - Filter by budget_checkpoint events to chart cost over time
  //    - Correlate cost spikes with specific agent_call tasks
  //
  // 4. Approval Audit Trail:
  //    - Filter by approval_requested and approval_resolved
  //    - See who approved what, when, and with what comment
  //
  // Error Cases:
  //
  // - NOT_FOUND: No WorkflowRun exists with the given ID
  // - PERMISSION_DENIED: User doesn't have "get" permission
  // - INVALID_ARGUMENT: page_size exceeds maximum (500)
  rpc getEventLog(GetEventLogRequest) returns (GetEventLogResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = workflow_run;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "run_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get workflow run event log";
  }

  // Subscribe to real-time run events (incremental event stream).
  //
  // Opens a server-side streaming RPC that pushes individual
  // WorkflowRunEvent messages as they occur during the run.
  // Unlike subscribe() which streams full WorkflowRun snapshots,
  // this streams lightweight incremental events for the timeline view.
  //
  // @internal
  // Authorization:
  // Standard authorization checks that user has "get" permission on the
  // WorkflowRun. Same permission as get() and subscribe().
  //
  // Stream Lifecycle:
  // 1. Client sends SubscribeEventsRequest with run_id
  // 2. Server validates authorization
  // 3. If after_sequence > 0: Server replays missed events from persistence
  // 4. Server streams new events in real-time as the runner emits them
  // 5. Server closes stream when the run reaches a terminal phase
  //    (COMPLETED, FAILED, CANCELLED, TERMINATED)
  // 6. Client can close stream early
  //
  // Reconnection:
  // On disconnect, the client reconnects with after_sequence set to the
  // sequence_number of the last received event. The server replays any
  // events missed during the disconnect, then resumes live streaming.
  // No events are lost.
  //
  // Complementary Streams:
  // - subscribe(): Full snapshots for current-state views (progress bars, dashboards)
  // - subscribeEvents(): Incremental events for timeline views (run viewer)
  // Both streams can be used simultaneously for different UI concerns.
  //
  // Use Cases:
  //
  // 1. Live Run Timeline:
  //    - User watches a run in progress in the run viewer
  //    - Events stream in real-time, building the timeline as tasks progress
  //    - Each event adds a row: "task X started", "task X completed (2.3s, $0.05)"
  //
  // 2. Cost Monitoring:
  //    - Dashboard subscribes with event_types filter for budget_checkpoint
  //    - Budget gauge updates in real-time as costs accumulate
  //
  // 3. Approval Notifications:
  //    - Subscribe with event_types filter for approval_requested
  //    - Surface approval gates immediately when they activate
  //
  // Error Cases:
  //
  // - NOT_FOUND: No WorkflowRun exists with the given ID
  // - PERMISSION_DENIED: User doesn't have "get" permission
  // - DEADLINE_EXCEEDED: Client timeout (reconnect with after_sequence)
  // - UNAVAILABLE: Server unavailable (retry with backoff)
  rpc subscribeEvents(SubscribeEventsRequest) returns (stream WorkflowRunEvent) {
    option (ai.stigmer.commons.rpc.config).resource_kind = workflow_run;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "run_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to subscribe to workflow run events";
  }

  // Get aggregated run statistics for an organization's workflows.
  //
  // Returns counts by phase, total cost, average duration, top failing
  // workflows, and per-workflow cost breakdown — scoped to a configurable
  // time window (24h, 7d, 30d, all-time).
  //
  // @internal
  // Authorization:
  // Custom authorization — user must have organization-level access.
  // Results are scoped to the user's organization.
  //
  // Use Cases:
  //
  // 1. Dashboard Overview:
  //    - Display KPI cards: active runs, completed, failed, total cost
  //    - Time window selector toggles between 24h / 7d / 30d views
  //
  // 2. Cost Monitoring:
  //    - Show per-workflow cost breakdown to identify expensive workflows
  //    - Track cost trends across time windows
  //
  // 3. Reliability Monitoring:
  //    - Surface top failing workflows for investigation
  //    - Track failure rates across the organization
  rpc getRunSummary(GetRunSummaryRequest) returns (RunSummary) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List workflow runs with pending human_input tasks awaiting reviewer decisions.
  //
  // Returns a paginated list of runs where at least one human_input
  // task is actively waiting for a response. Each entry includes the
  // execution context, task details, requester, and timeout information.
  //
  // @internal
  // Authorization:
  // Custom authorization — user must have organization-level access.
  // Results are scoped to the user's organization.
  //
  // Use Cases:
  //
  // 1. Pending Approvals Dashboard Widget:
  //    - Display a list of items requiring human attention
  //    - Show time waiting and timeout countdown
  //    - Link to run viewer for review action
  //
  // 2. Approval Queue:
  //    - Reviewers see all pending approvals in one view
  //    - The newest run's approvals first, paged by page_token
  rpc listPendingApprovals(ListPendingApprovalsRequest) returns (PendingApprovalsList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
