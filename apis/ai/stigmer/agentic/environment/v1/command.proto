syntax = "proto3";

package ai.stigmer.agentic.environment.v1;

import "ai/stigmer/agentic/environment/v1/api.proto";
import "ai/stigmer/agentic/environment/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// EnvironmentCommandController handles write operations for environments.
service EnvironmentCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = environment;

  // Create or update an environment.
  //
  // @internal
  // The authorization and state-operation are determined depending on whether the
  // environment is going to be created or updated, which is resolved as part of
  // the request execution.
  rpc apply(Environment) returns (Environment);

  // Create an environment.
  //
  // @internal
  // Authorization:
  // - Organization-scoped environments: Caller must have can_create_environment
  //   permission in the organization.
  // - Platform-scoped environments: Caller must be a platform operator
  //   (handled automatically by common auth step).
  rpc create(Environment) returns (Environment) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_environment;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to create environment in this organization";
  }

  // Update an existing environment.
  //
  // @internal
  // Authorization: requires can_edit permission on the environment resource.
  rpc update(Environment) returns (Environment) {
    option (ai.stigmer.commons.rpc.config).resource_kind = environment;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update environment";
  }

  // Update the visibility of an existing environment.
  //
  // Only modifies metadata.visibility, leaving spec, status, and other
  // metadata fields untouched. Environments support two levels: private
  // (the default) and org. Setting org shares the environment with the
  // owning organization: members can view it with secret values redacted,
  // and any execution in the organization may use its values at runtime.
  // Secret values are revealed only to the environment's creator, at
  // every visibility level.
  //
  // @internal
  // Authorization: requires can_edit permission on the environment resource.
  // public/platform levels are rejected via the kind's VisibilityConfig
  // (supports_org only) — secret values must never be resolvable across the
  // org boundary. Personal (stigmer.ai/personal) and OAuth-managed
  // (stigmer.ai/managed) environments reject visibility changes entirely:
  // sharing a personal credential bag or per-user OAuth tokens must be
  // impossible, not merely discouraged.
  rpc updateVisibility(ai.stigmer.commons.apiresource.UpdateVisibilityInput) returns (Environment) {
    option (ai.stigmer.commons.rpc.config).resource_kind = environment;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update environment visibility";
  }

  // Delete an environment.
  //
  // @internal
  // Authorization: requires can_edit permission on the environment resource.
  rpc delete(ai.stigmer.commons.apiresource.ApiResourceDeleteInput) returns (Environment) {
    option (ai.stigmer.commons.rpc.config).resource_kind = environment;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete environment";
  }

  // Add or update specific variables in an environment.
  // Existing variables not included in the request are preserved unchanged.
  //
  // @internal
  // Authorization: requires can_edit permission on the environment resource.
  // Server-side merge — secret values are re-encrypted on write.
  rpc updateVariables(UpdateEnvironmentVariablesRequest) returns (Environment) {
    option (ai.stigmer.commons.rpc.config).resource_kind = environment;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "environment_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update environment variables";
  }

  // Remove specific variables from an environment by key.
  // Keys that do not exist are silently ignored.
  //
  // @internal
  // Authorization: requires can_edit permission on the environment resource.
  rpc removeVariables(RemoveEnvironmentVariablesRequest) returns (Environment) {
    option (ai.stigmer.commons.rpc.config).resource_kind = environment;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "environment_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to remove environment variables";
  }
}
