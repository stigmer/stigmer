syntax = "proto3";

package ai.stigmer.agentic.environment.v1;

import "ai/stigmer/agentic/environment/v1/api.proto";
import "ai/stigmer/agentic/environment/v1/io.proto";
import "ai/stigmer/agentic/environment/v1/spec.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// EnvironmentQueryController handles read operations for environments.
service EnvironmentQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = environment;

  // Get an environment by ID.
  //
  // @internal
  // Authorization: requires can_view permission on the environment resource.
  rpc get(ai.stigmer.commons.apiresource.ApiResourceId) returns (Environment) {
    option (ai.stigmer.commons.rpc.config).resource_kind = environment;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get environment";
  }

  // Get an environment by its organization-scoped reference (org/slug).
  // Resolves a human-readable reference like "acme/aws-prod" to the full Environment resource.
  //
  // @internal
  // Custom authorization in handler — checks both direct resource access
  // and organization-level visibility permissions.
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (Environment) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Get the unredacted value of a single secret key in an environment.
  // Returns the EnvironmentValue with the decrypted value for exactly one key.
  //
  // @internal
  // Creator-only: FGA authorization grants can_read_secrets via the creator relation.
  rpc getSecretValue(EnvironmentSecretValueInput) returns (EnvironmentValue) {
    option (ai.stigmer.commons.rpc.config).resource_kind = environment;
    option (ai.stigmer.commons.rpc.config).permission = can_read_secrets;
    option (ai.stigmer.commons.rpc.config).field_path = "environment_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to read secret values (creator-only)";
  }

  // List environments with optional label filtering.
  // Secret values are redacted in the response.
  //
  // @internal
  // Authorization is handled in-handler via FGA-filtered queries (cloud)
  // or unrestricted store queries (OSS).
  rpc list(ListEnvironmentsRequest) returns (EnvironmentList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
