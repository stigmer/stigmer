syntax = "proto3";

package ai.stigmer.agentic.environment.v1;

import "ai/stigmer/agentic/environment/v1/api.proto";
import "ai/stigmer/agentic/environment/v1/spec.proto";
import "ai/stigmer/commons/rpc/pagination.proto";
import "buf/validate/validate.proto";

// EnvironmentId wraps an environment identifier.
message EnvironmentId {
  // Unique identifier of the environment.
  string value = 1 [(buf.validate.field).required = true];
}

// Input for retrieving a single unredacted secret value from an environment.
//
// @internal
// Single-key retrieval by design: limits blast radius if intercepted,
// enables per-key audit trails, and matches the industry-standard
// "reveal" UX pattern (AWS, GitHub, 1Password).
message EnvironmentSecretValueInput {
  // The environment resource ID.
  string environment_id = 1 [(buf.validate.field).string.min_len = 1];

  // The key within EnvironmentSpec.data to retrieve the unredacted value for.
  string key = 2 [(buf.validate.field).string.min_len = 1];
}

// ListEnvironmentsRequest specifies parameters for listing environments.
message ListEnvironmentsRequest {
  // Organization to list environments for.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // Filter by metadata labels. AND semantics: the resource must match all provided labels.
  //
  // @internal
  // Example: {"stigmer.ai/personal": "true"} returns only personal environments.
  map<string, string> labels = 2;

  // Pagination options.
  ai.stigmer.commons.rpc.PageInfo page_info = 3;
}

// EnvironmentList contains a paginated list of environments.
message EnvironmentList {
  // Total count of matching environments.
  int32 total_count = 1;

  // Environments in the current page.
  repeated Environment items = 2;
}

// Request to add or update specific variables in an environment.
// Existing variables not included in this request are preserved.
//
// @internal
// Server-side merge. For secret variables the new value replaces the old
// one and is re-encrypted server-side.
message UpdateEnvironmentVariablesRequest {
  // The environment resource ID.
  string environment_id = 1 [(buf.validate.field).string.min_len = 1];

  // Variables to add or update. Keys that already exist are overwritten; keys not present in this map are left unchanged.
  map<string, EnvironmentValue> variables = 2;
}

// Request to remove specific variables from an environment by key.
message RemoveEnvironmentVariablesRequest {
  // The environment resource ID.
  string environment_id = 1 [(buf.validate.field).string.min_len = 1];

  // Keys to remove from EnvironmentSpec.data. Keys that do not exist are silently ignored.
  repeated string keys = 2 [(buf.validate.field).repeated.min_items = 1];
}
