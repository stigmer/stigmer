syntax = "proto3";

package ai.stigmer.agentic.mcpserver.v1;

import "ai/stigmer/agentic/executioncontext/v1/spec.proto";
import "buf/validate/validate.proto";

// OAuthConnectionHealth evaluates the health of an OAuth connection by
// examining whether a login is saved and its token expiry metadata. Used in
// GetOAuthGrantStatusOutput to give the frontend an actionable signal
// beyond the binary "connected" boolean.
//
// The backend determines health from locally available metadata (the
// saved connection and its sign-in expiry). It cannot detect server-side token
// revocation without making an API call to the vendor, so HEALTHY means
// "valid as far as we know" — not a guarantee the token will be accepted.
enum OAuthConnectionHealth {
  // Default / unset. Health has not been evaluated.
  OAUTH_CONNECTION_HEALTH_UNSPECIFIED = 0;

  // The access token exists and is not expired (or does not expire).
  OAUTH_CONNECTION_HEALTH_HEALTHY = 1;

  // The access token is expired and no refresh token is available.
  // The user must re-authenticate via the OAuth flow.
  OAUTH_CONNECTION_HEALTH_TOKEN_EXPIRED = 2;

  // The access token is expired but a refresh token is available.
  // The backend will attempt automatic refresh at run time.
  // If the refresh token is itself expired, the refresh will fail and
  // the user will need to re-authenticate.
  OAUTH_CONNECTION_HEALTH_TOKEN_EXPIRED_REFRESHABLE = 3;

  // No sign-in made for this server that a run would use: the user has
  // never signed in, has disconnected, or the saved login is not a
  // sign-in this server can use.
  OAUTH_CONNECTION_HEALTH_NO_GRANT = 4;
}

// McpServerId wraps an MCP server resource identifier.
// Used as input for operations that require an MCP server ID.
message McpServerId {
  // The unique identifier of the MCP server resource.
  // This is the system-generated ID (metadata.id), not the slug.
  // Format: "mcp_" followed by a unique identifier.
  // Example: "mcp_abc123xyz"
  string value = 1 [(buf.validate.field).required = true];
}

// ConnectInput is the request for the connect RPC.
//
// @internal
// Triggers server-side MCP discovery:
// the backend creates an ephemeral ExecutionContext with the resolved
// environment variables, starts a Temporal workflow that connects to the
// MCP server (via the runner), enumerates tools and resource
// templates, and stores the results in status.discovered_capabilities.
//
// Value resolution: the run credential resolver, with the caller as the
// person and runtime_env as the call's own values ahead of the caller's My
// vault, the one vault connect reads; the server's address and declared
// keys are matched as a run's are. A sign-in saved into a shared vault is
// not read here: it serves the runs that use that vault. One-time values
// are never saved.
//
// Callers:
// - Web console: calls connect after saving a login or secret to My vault.
// - CLI: calls connect with runtime_env populated from local env vars.
// - Runner backfill: calls connect with runtime_env from execution context
//   when status.discovered_capabilities is empty on first run.
//
// Prerequisites:
// - The MCP server must exist and have a valid server_type (stdio or http)
// - org must be provided (the caller's active organization)
// - Every required key must be in runtime_env or the caller's My vault
message ConnectInput {
  // System-generated ID of the MCP server to connect to.
  // Obtained from McpServer.metadata.id (e.g., via getByReference).
  string mcp_server_id = 1 [(buf.validate.field).required = true];

  // Optional environment variable values for one-time use, ahead of the
  // caller's My vault.
  map<string, ai.stigmer.agentic.executioncontext.v1.ExecutionValue> runtime_env = 2;

  // Organization context for credential resolution.
  //
  // The caller's My vault in this organization is the one connect reads.
  //
  // Required: the backend rejects the request when this field is empty.
  string org = 3 [(buf.validate.field).string.min_len = 1];
}

// InitiateOAuthConnectInput starts the OAuth authorization flow for an
// MCP server that has an auth block in its spec.
//
// @internal
// Returns an authorization URL that the frontend redirects the user to.
// The backend performs all setup (DCR registration for MCP OAuth servers,
// OAuthApp credential lookup for vendor OAuth servers, PKCE pair generation)
// and stores the pending state for the subsequent completeOAuthConnect call.
//
// Prerequisites:
// - The MCP server must exist and have spec.auth configured
// - For DCR: the server must use HTTP transport (discovery requires a URL)
// - For vendor OAuth: the referenced OAuthApp must exist and be accessible
message InitiateOAuthConnectInput {
  // System-generated ID of the MCP server to initiate OAuth for.
  string mcp_server_id = 1 [(buf.validate.field).required = true];

  // Organization context for token storage.
  // Must be an org the caller belongs to.
  string org = 2 [(buf.validate.field).string.min_len = 1];

  // The shared vault, by id, the login is saved into. Empty saves it in the
  // caller's My vault in the organization. A login saved into a shared vault
  // serves the runs that use that vault; connect reads only My vault. A
  // vault id is "vlt_" followed by 26 lowercase characters.
  //
  // @internal
  // A named vault needs can_edit for the caller, and My vault needs
  // can_create_vault on the organization, each checked here and again
  // when the flow completes.
  string vault_id = 3 [(buf.validate.field).string = {
    max_len: 30
    pattern: "^$|^vlt_[0-9a-z]{26}$"
  }];
}

// InitiateOAuthConnectOutput contains the authorization URL and metadata
// the frontend needs to redirect the user to the OAuth authorization server.
message InitiateOAuthConnectOutput {
  // Full authorization URL to redirect the user to.
  // Includes client_id, redirect_uri, code_challenge, state, and scopes.
  string authorization_url = 1;

  // Opaque state parameter for CSRF protection.
  // The frontend must pass this back in completeOAuthConnect to correlate
  // the callback with this initiation.
  string state = 2;

  // OAuth scopes that will be requested.
  // For DCR: discovered from authorization server metadata or scope_hints.
  // For vendor OAuth: from the OAuthApp spec.
  repeated string scopes = 3;

  // Human-readable provider name for UI display during the redirect.
  // For DCR: derived from the MCP server name.
  // For vendor OAuth: from OAuthApp.spec.provider.
  string provider_name = 4;
}

// CompleteOAuthConnectInput finishes the OAuth flow by exchanging the
// authorization code for tokens.
//
// @internal
// Called by the frontend after the user is redirected back from the
// OAuth authorization server. The frontend extracts the authorization
// code and state from the callback URL and passes them here.
//
// The backend:
// 1. Validates the state parameter against the stored PendingOAuthState
// 2. Exchanges the authorization code for tokens (using PKCE code_verifier)
// 3. Saves the login as a connection at the server's address in the vault
//    the flow started with, the refresh token sealed on its sign-in record
//
// After a sign-in saved into the caller's My vault, the frontend calls the
// regular connect RPC to trigger tool discovery, which finds the fresh
// login there. connect reads no shared vault: a sign-in saved into one
// serves the runs that use that vault.
message CompleteOAuthConnectInput {
  // System-generated ID of the MCP server.
  // Must match the mcp_server_id used in the preceding initiateOAuthConnect.
  string mcp_server_id = 1 [(buf.validate.field).required = true];

  // Authorization code from the OAuth callback redirect.
  string authorization_code = 2 [(buf.validate.field).string.min_len = 1];

  // State parameter from the OAuth callback redirect.
  // Must match the state returned by initiateOAuthConnect.
  string state = 3 [(buf.validate.field).string.min_len = 1];
}

// CompleteOAuthConnectOutput confirms that tokens were successfully
// acquired and stored.
message CompleteOAuthConnectOutput {
  // Whether the OAuth flow completed successfully and tokens are stored.
  bool connected = 1;

  // The environment variable the saved login fills.
  // Matches McpServerAuth.target_env_var on the MCP server spec.
  string target_env_var = 2;

  // Informational hint about expected token lifetime.
  // Echoed from McpServerAuth.token_lifetime_hint for UI display.
  string token_lifetime_hint = 3;
}

// GetOAuthGrantStatusInput queries the OAuth grant status for a resource.
//
// @internal
// Returns whether the authenticated user has a sign-in that a run would
// use for the specified server in their My vault in the given org: a
// connection this server's sign-in saved at the server's current address.
// A pasted login is no sign-in and reads as not connected; it and a
// sign-in saved into a shared vault are read through VaultQueryController.
// Used by the frontend to determine whether to show "Connected" vs.
// "Connect with OAuth" UI states.
message GetOAuthGrantStatusInput {
  // System-generated ID of the resource to check grant status for.
  string resource_id = 1 [(buf.validate.field).required = true];

  // Organization context. Required because the same user can have
  // separate OAuth connections for a shared resource across orgs.
  string org = 2 [(buf.validate.field).string.min_len = 1];
}

// GetOAuthGrantStatusOutput returns the current OAuth grant status.
message GetOAuthGrantStatusOutput {
  // Whether the user has a sign-in saved for this server in this org.
  bool connected = 1;

  // When the access token expires (Unix timestamp seconds).
  // 0 if no sign-in is saved or the token does not expire.
  int64 access_token_expires_at = 2;

  // The env var the saved sign-in fills.
  // Empty if no sign-in is saved.
  string target_env_var = 3;

  // Which auth method was used ("mcp_oauth" or "vendor_oauth").
  // Empty if no sign-in is saved.
  string auth_method = 4;

  // Evaluated health of the OAuth connection.
  // Provides an actionable signal beyond the binary "connected" field:
  // the frontend can distinguish "healthy" from "expired but refreshable"
  // from "expired and needs re-auth" from "never connected."
  OAuthConnectionHealth connection_health = 5;
}

// DisconnectOAuthInput tears down a user's OAuth connection for a resource.
//
// @internal
// The handler removes, from the caller's My vault in the org, every
// connection a sign-in to this server saved, through the vault's atomic
// entry write. It reads no server row, so it also removes a sign-in left
// at the server's earlier address. Once the server is deleted, the
// can_connect check may answer NOT_FOUND first; My vault's
// VaultCommandController.removeConnections removes that sign-in.
//
// After this, the user's access token and refresh token are gone. The
// MCP server remains configured — only the user's personal OAuth connection
// is removed. Other users' connections to the same resource, a pasted login
// at the server's address, and another server's sign-in are unaffected. A
// sign-in saved into a shared vault is removed through that vault's
// VaultCommandController.removeConnections.
//
// Idempotent: if no sign-in for the server is saved, the handler
// returns disconnected=false without error. This
// supports race conditions (concurrent disconnect calls), retries after
// partial failures, and desired-state semantics ("ensure no connection").
message DisconnectOAuthInput {
  // System-generated ID of the resource to disconnect OAuth for.
  string resource_id = 1 [(buf.validate.field).required = true];

  // Organization context: the caller's My vault in this org is the one
  // changed.
  string org = 2 [(buf.validate.field).string.min_len = 1];
}

// DisconnectOAuthOutput reports the result of a disconnect request.
message DisconnectOAuthOutput {
  // Whether a saved sign-in was found and removed.
  // true: the connection and its tokens were removed.
  // false: no sign-in was saved for this server, org and caller. The desired
  // state (no OAuth connection) was already achieved. This is not an error.
  bool disconnected = 1;
}

// SetOrgOAuthAppInput creates or updates an org-level BYOA OAuth app
// override for a resource.
//
// @internal
// The handler:
// 1. Looks up the platform-default OAuthApp via the resource's auth block
//    to use as a template (authorization_url, token_url, scopes, etc.)
// 2. Creates a new OAuthApp with the org-provided client_id + client_secret
//    and the template's endpoint URLs and scopes
// 3. Creates or updates an OAuthAppOverride binding
//    (resource_id, resource_kind, org) → new OAuthApp ID
//
// If an override already exists for this resource + org, the handler
// updates the existing OAuthApp's credentials and returns the same ID.
//
// After this, the resolution chain for this resource in this org will
// return the org's OAuthApp instead of the platform default.
//
// Prerequisites:
// - The resource must exist and have an auth block with oauth_app_ref
//   (BYOA requires a platform template to clone from)
// - The caller must have can_create_oauth_app permission in the org
//
// Errors:
// - FAILED_PRECONDITION: Resource has no auth block or no oauth_app_ref
// - NOT_FOUND: Resource does not exist
message SetOrgOAuthAppInput {
  // System-generated ID of the resource to set the BYOA override for.
  string resource_id = 1 [(buf.validate.field).required = true];

  // Organization that will own this override.
  string org = 2 [(buf.validate.field).string.min_len = 1];

  // OAuth client ID from the org's own app registration with the vendor.
  string client_id = 3 [(buf.validate.field).string.min_len = 1];

  // OAuth client secret from the org's own app registration with the vendor.
  // Encrypted at rest, redacted in logs.
  string client_secret = 4 [(buf.validate.field).string.min_len = 1];
}

// SetOrgOAuthAppOutput confirms the BYOA override was created or updated.
message SetOrgOAuthAppOutput {
  // System-generated ID of the OAuthApp resource created (or updated)
  // for this override. Can be used to inspect the full OAuthApp via
  // OAuthAppQueryController.get.
  string oauth_app_id = 1;
}

// GetOrgOAuthAppInput queries whether an org has a BYOA override for a resource.
//
// @internal
// Returns override metadata without exposing secrets. The frontend uses
// this to show "Using org credentials" vs. "Using platform credentials"
// and to offer the option to remove the override.
message GetOrgOAuthAppInput {
  // System-generated ID of the resource to check for an override.
  string resource_id = 1 [(buf.validate.field).required = true];

  // Organization context to check.
  string org = 2 [(buf.validate.field).string.min_len = 1];
}

// GetOrgOAuthAppOutput returns the org's BYOA override status.
message GetOrgOAuthAppOutput {
  // Whether an OAuthAppOverride exists for this resource + org.
  bool has_override = 1;

  // System-generated ID of the override's OAuthApp.
  // Empty when has_override is false.
  string oauth_app_id = 2;

  // Client ID from the override's OAuthApp (non-secret, safe to display).
  // Empty when has_override is false. Useful for UI display so the admin
  // can verify which app registration is active.
  string client_id = 3;
}

// DeleteOrgOAuthAppInput removes an org-level BYOA override for a resource.
//
// @internal
// The handler:
// 1. Finds the OAuthAppOverride for (resource_id, resource_kind, org)
// 2. Deletes the OAuthApp resource created for this override
// 3. Deletes the OAuthAppOverride binding
//
// After this, the resolution chain falls back to the platform default.
// Existing sign-ins that were issued using the org's OAuthApp
// will fail on next refresh — those users will need to re-authenticate
// using the platform default (or a new org override).
//
// Prerequisites:
// - An override must exist for this resource + org
//
// Errors:
// - NOT_FOUND: No override exists for this resource + org
message DeleteOrgOAuthAppInput {
  // System-generated ID of the resource to remove the override for.
  string resource_id = 1 [(buf.validate.field).required = true];

  // Organization whose override should be removed.
  string org = 2 [(buf.validate.field).string.min_len = 1];
}

// DeleteOrgOAuthAppOutput confirms the BYOA override was removed.
message DeleteOrgOAuthAppOutput {
  // Whether the delete completed successfully.
  bool deleted = 1;
}
