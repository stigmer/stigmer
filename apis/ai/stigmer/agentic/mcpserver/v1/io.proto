syntax = "proto3";

package ai.stigmer.agentic.mcpserver.v1;

import "ai/stigmer/agentic/mcpserver/v1/status.proto";
import "buf/validate/validate.proto";

// McpServerId wraps an MCP server resource identifier.
// Used as input for operations that require an MCP server ID.
message McpServerId {
  // The unique identifier of the MCP server resource.
  // This is the system-generated ID (metadata.id), not the slug.
  // Format: "mcp-" followed by a unique identifier.
  // Example: "mcp-abc123xyz"
  string value = 1 [(buf.validate.field).required = true];
}

// UpdateDiscoveredCapabilitiesInput is the request for the updateDiscoveredCapabilities RPC.
//
// Used by:
// - CLI: after `stigmer discover mcp-server <name>` connects locally, queries tools/resources,
//   and pushes the results to stigmer-server.
// - Agent-runner: future runtime cache refresh.
//
// The caller must first resolve the MCP server's system ID (e.g., via getByReference)
// before calling this RPC.
message UpdateDiscoveredCapabilitiesInput {
  // System-generated ID of the MCP server to update.
  // Obtained from McpServer.metadata.id (e.g., via getByReference).
  string mcp_server_id = 1 [(buf.validate.field).required = true];

  // Discovered tools and resource templates to store.
  DiscoveredCapabilities discovered_capabilities = 2 [(buf.validate.field).required = true];
}

// DiscoverCapabilitiesInput is the request for the discoverCapabilities RPC.
//
// Triggers server-side MCP discovery: the backend resolves credentials from the
// authenticated user's personal environment, starts a Temporal workflow that
// connects to the MCP server (via the agent-runner), enumerates tools and resource
// templates, and stores the result in status.discovered_capabilities.
//
// The RPC blocks until discovery completes (~30s timeout) and returns the updated
// McpServer with populated discovered_capabilities.
//
// Prerequisites:
// - The MCP server must exist and have a valid server_type (stdio or http)
// - Required credentials from env_spec must be present in the user's personal environment
message DiscoverCapabilitiesInput {
  // System-generated ID of the MCP server to discover.
  // Obtained from McpServer.metadata.id (e.g., via getByReference).
  string mcp_server_id = 1 [(buf.validate.field).required = true];
}
