syntax = "proto3";

package ai.stigmer.agentic.mcpserver.v1;

import "buf/validate/validate.proto";

// OAuthConnectionHealth evaluates the health of an OAuth connection by
// examining whether a login is saved and its token expiry metadata. Used in
// GetOAuthGrantStatusOutput to give the frontend an actionable signal
// beyond the binary "connected" boolean.
//
// The backend determines health from locally available metadata (the
// saved connection and its sign-in expiry). It cannot detect server-side token
// revocation without making an API call to the vendor, so HEALTHY means
// "valid as far as we know" — not a guarantee the token will be accepted.
enum OAuthConnectionHealth {
  // Default / unset. Health has not been evaluated.
  OAUTH_CONNECTION_HEALTH_UNSPECIFIED = 0;

  // The access token exists and is not expired (or does not expire).
  OAUTH_CONNECTION_HEALTH_HEALTHY = 1;

  // The access token is expired and no refresh token is available.
  // The user must re-authenticate via the OAuth flow.
  OAUTH_CONNECTION_HEALTH_TOKEN_EXPIRED = 2;

  // The access token is expired but a refresh token is available.
  // The backend will attempt automatic refresh at run time.
  // If the refresh token is itself expired, the refresh will fail and
  // the user will need to re-authenticate.
  OAUTH_CONNECTION_HEALTH_TOKEN_EXPIRED_REFRESHABLE = 3;

  // No sign-in made for this server that a run would use: the user has
  // never signed in, has disconnected, or the saved login is not a
  // sign-in this server can use.
  OAUTH_CONNECTION_HEALTH_NO_GRANT = 4;
}

// McpServerId wraps an MCP server resource identifier.
// Used as input for operations that require an MCP server ID.
message McpServerId {
  // The unique identifier of the MCP server resource.
  // This is the system-generated ID (metadata.id), not the slug.
  // Format: "mcp_" followed by a unique identifier.
  // Example: "mcp_abc123xyz"
  string value = 1 [(buf.validate.field).required = true];
}

// ConnectInput is the request for the connect and startConnect RPCs.
//
// A connect reads the caller's My vault in org, the one vault connect
// reads; the server's address and declared keys are matched as a run's
// are. A value is saved to a vault before a connect, never sent with it
// (`stigmer vault set-secret`). A sign-in saved into a shared vault is not
// read here: it serves the runs that use that vault.
//
// @internal
// Triggers server-side MCP discovery: the backend records a connect
// attempt (the binding of the runner credential it mints), starts a
// Temporal workflow that connects to the MCP server (via the runner),
// enumerates tools and resource templates, and stores the results in
// status.discovered_capabilities. The runner fetches the connect's values
// at discovery (VaultValueController.fetchValues), when they are planned.
//
// Callers:
// - Web console and CLI: call connect after saving a login or secret to My
//   vault.
// - Runner backfill: calls connect with run_id when
//   status.discovered_capabilities is empty on first use.
//
// Prerequisites:
// - The MCP server must exist and have a valid server_type (stdio or http)
// - org must be provided (the caller's active organization)
// - Every required key must be in the caller's My vault, or, with run_id,
//   in the run's planned values for this server
message ConnectInput {
  // Field 2 held runtime_env, a connect's own one-time values, until a value
  // could only reach a connect from a vault. Reserved so the number and
  // name are never reused.
  reserved 2;
  reserved "runtime_env";

  // System-generated ID of the MCP server to connect to.
  // Obtained from McpServer.metadata.id (e.g., via getByReference).
  string mcp_server_id = 1 [(buf.validate.field).required = true];

  // Organization context for credential resolution.
  //
  // The caller's My vault in this organization is the one connect reads.
  //
  // Required: the backend rejects the request when this field is empty.
  string org = 3 [(buf.validate.field).string.min_len = 1];

  // The run whose planned values for this server the connect uses, in place
  // of the caller's My vault.
  //
  // @internal
  // The runner's backfill only: accepted only from a runner credential
  // bound to that live run (the fetch's own gate), and only for a server
  // the run's source manifest names. can_connect still applies.
  string run_id = 4;
}

// GetOAuthGrantStatusInput queries the OAuth grant status for a resource.
//
// @internal
// Returns whether the authenticated user has a sign-in saved at the
// server's address in their My vault in the given org. A pasted login is no
// sign-in and reads as not connected; it and a sign-in saved into a shared
// vault are read through VaultQueryController. Used by the frontend to
// determine whether to show "Connected" vs. "Sign in" UI states.
message GetOAuthGrantStatusInput {
  // System-generated ID of the resource to check grant status for.
  string resource_id = 1 [(buf.validate.field).required = true];

  // Organization context. Required because the same user can have
  // separate OAuth connections for a shared resource across orgs.
  string org = 2 [(buf.validate.field).string.min_len = 1];
}

// GetOAuthGrantStatusOutput returns the current OAuth grant status.
message GetOAuthGrantStatusOutput {
  // Whether the user has a sign-in saved at this server's address in this org.
  bool connected = 1;

  // When the access token expires (Unix timestamp seconds).
  // 0 if no sign-in is saved or the token does not expire.
  int64 access_token_expires_at = 2;

  // The env var the saved sign-in fills.
  // Empty if no sign-in is saved.
  string target_env_var = 3;

  // Which auth method was used ("mcp_oauth" or "vendor_oauth").
  // Empty if no sign-in is saved.
  string auth_method = 4;

  // Evaluated health of the OAuth connection.
  // Provides an actionable signal beyond the binary "connected" field:
  // the frontend can distinguish "healthy" from "expired but refreshable"
  // from "expired and needs re-auth" from "never connected."
  OAuthConnectionHealth connection_health = 5;
}

// DisconnectOAuthInput tears down a user's sign-in for an MCP server.
//
// @internal
// The handler removes the sign-in saved at the server's address from the
// caller's My vault in the org, through the vault's atomic entry write.
// After this, the user's access token and refresh token are gone. The MCP
// server remains configured. Other users' sign-ins, a pasted login at the
// address and a sign-in saved into a shared vault are unaffected; the
// vault's VaultCommandController.removeConnections removes those.
//
// Idempotent: if no sign-in is saved at the address, the handler returns
// disconnected=false without error.
message DisconnectOAuthInput {
  // System-generated ID of the resource to disconnect OAuth for.
  string resource_id = 1 [(buf.validate.field).required = true];

  // Organization context: the caller's My vault in this org is the one
  // changed.
  string org = 2 [(buf.validate.field).string.min_len = 1];
}

// DisconnectOAuthOutput reports the result of a disconnect request.
message DisconnectOAuthOutput {
  // Whether a saved sign-in was found and removed.
  // true: the connection and its tokens were removed.
  // false: no sign-in was saved for this server, org and caller. The desired
  // state (no OAuth connection) was already achieved. This is not an error.
  bool disconnected = 1;
}
