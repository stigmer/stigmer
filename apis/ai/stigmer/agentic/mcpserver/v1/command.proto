syntax = "proto3";

package ai.stigmer.agentic.mcpserver.v1;

import "ai/stigmer/agentic/mcpserver/v1/api.proto";
import "ai/stigmer/agentic/mcpserver/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// McpServerCommandController provides write operations for MCP server resources.
//
// @internal
// Authorization model for writes: an MCP server is an organization's
// blueprint. create asks can_create_mcp_server on the organization (the
// admin bar every blueprint kind takes); update, delete and the connect
// lanes ask the row's own permission (can_edit, can_delete, can_connect).
//
// Primary interface: The `apply` method provides Kubernetes-style idempotent
// create-or-update semantics, which is the recommended approach for CLI usage.
service McpServerCommandController {
  // Service-level option identifying this as an MCP server controller.
  option (ai.stigmer.commons.apiresource.api_resource_kind) = mcp_server;

  // Create or update an MCP server resource.
  //
  // If the resource doesn't exist, creates it. If it exists, updates it.
  // The resource is identified by its (scope, org, slug) combination.
  //
  // @internal
  // The handler determines whether this is a create or update operation
  // and performs appropriate scope-aware authorization:
  // - Create: Requires permission to create in the target scope
  // - Update: Requires can_edit on the existing resource
  rpc apply(McpServer) returns (McpServer);

  // Create an MCP server resource.
  //
  // Returns an error if a resource with the same (scope, org, slug) already exists.
  // Use `apply` for idempotent create-or-update semantics.
  //
  // @internal
  // Authorization: can_create_mcp_server on the organization named by
  // metadata.org — the blueprint bar, as for agents and skills.
  rpc create(McpServer) returns (McpServer) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_mcp_server;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to create mcp server in this organization";
  }

  // Update an existing MCP server resource.
  //
  // @internal
  // Authorization: Requires can_edit permission on the mcp_server resource.
  // Only the owner (based on scope) can update:
  // - Platform: Platform operators
  // - Organization: Org admins or resource owner
  // - Identity Account: The owner
  rpc update(McpServer) returns (McpServer) {
    option (ai.stigmer.commons.rpc.config).resource_kind = mcp_server;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update mcp server";
  }

  // Delete an MCP server resource.
  //
  // Permanently removes the MCP server definition.
  // Agents referencing this server will need to be updated.
  //
  // @internal
  // Authorization: Requires can_delete permission on the mcp_server resource.
  // Only the owner can delete:
  // - Platform: Platform operators
  // - Organization: Org admins or resource owner
  // - Identity Account: The owner
  rpc delete(ai.stigmer.commons.apiresource.ApiResourceDeleteInput) returns (McpServer) {
    option (ai.stigmer.commons.rpc.config).resource_kind = mcp_server;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete mcp server";
  }

  // Update the visibility of an existing MCP server.
  //
  // Only modifies metadata.visibility, leaving spec, status, and other
  // metadata fields untouched.
  //
  // @internal
  // Authorization: can_manage_audience on the mcp_server for every transition.
  // Visibility decides who reaches the resource, so it is the owner's decision
  // and not an edit: an editor may change the definition but not its audience.
  // The level is checked against the kind's VisibilityConfig
  // (visibility_public is refused for every kind).
  rpc updateVisibility(ai.stigmer.commons.apiresource.UpdateVisibilityInput) returns (McpServer) {
    option (ai.stigmer.commons.rpc.config).resource_kind = mcp_server;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_audience;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update mcp server visibility";
  }

  // Connect to an MCP server and discover its tools.
  //
  // Connects to the MCP server, enumerates tools and resource templates,
  // records which tools the server marks destructive, and stores the
  // results in status.discovered_capabilities.
  // Blocks until the operation settles — legitimately minutes for heavy
  // stdio servers (the server-side workflow ceiling is the bound) — and
  // returns the updated McpServer.
  //
  // Prefer startConnect for interactive clients: browsers can drop a
  // no-bytes-yet unary response around ~300s, below the workflow ceiling,
  // so a blocking connect can appear to fail while succeeding server-side.
  // This RPC remains for callers that want synchronous semantics (and for
  // backends that do not yet serve startConnect).
  //
  // @internal
  // Typical flows:
  // - Runner backfill: the runner calls connect on first use when
  //   status.discovered_capabilities is empty, passing runtime_env from the
  //   execution context (shared/connect-backfill.ts).
  // - CLI / web console: legacy callers, and the fallback lane when
  //   startConnect answers UNIMPLEMENTED (a backend predating it).
  //
  // Errors:
  // - FAILED_PRECONDITION: A required credential is in none of the caller's vaults
  // - DEADLINE_EXCEEDED: Discovery did not complete within the timeout
  // - NOT_FOUND: MCP server does not exist
  //
  // Authorization: Requires can_connect permission on the mcp_server resource.
  rpc connect(ConnectInput) returns (McpServer) {
    option (ai.stigmer.commons.rpc.config).resource_kind = mcp_server;
    option (ai.stigmer.commons.rpc.config).permission = can_connect;
    option (ai.stigmer.commons.rpc.config).field_path = "mcp_server_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to connect to mcp server";
  }

  // Start a connect operation without waiting for it: discovery runs
  // server-side, and the caller observes progress by
  // polling the resource.
  //
  // Returns the McpServer immediately with status.connect_status describing
  // the accepted operation (phase CONNECTING, plus a warning when no runner
  // appears to be polling the task queue). Poll get/getByReference until
  // status.connect_status reaches a terminal phase; results land in
  // status.discovered_capabilities exactly as with the blocking connect.
  //
  // Idempotent while an operation is in flight: a startConnect that finds a
  // live CONNECTING operation attaches to it (the in-flight operation's
  // runtime_env wins) instead of starting a second workflow. A CONNECTING
  // entry orphaned by a backend restart is reconciled against Temporal
  // before a new operation starts.
  //
  // @internal
  // The async lane exists because every budget stretch inside the blocking
  // shape hit a client transport limit eventually (stigmer/stigmer#425):
  // browser fetch drops no-bytes unary responses (~300s), classification
  // budgets scale with tool count past any flat ceiling, and dead-runner
  // feedback rode the same timer. Setup that needs the caller's identity
  // (sign-in renewal, the caller's vault resolution, EC creation)
  // happens synchronously in this RPC; only awaiting the workflow moves to
  // the background.
  //
  // Errors (start-time only — post-start failures land in connect_status):
  // - FAILED_PRECONDITION: A required credential is in none of the caller's vaults
  // - NOT_FOUND: MCP server does not exist
  // - UNIMPLEMENTED: backend predates the async lane (clients fall back to connect)
  //
  // Authorization: Requires can_connect permission on the mcp_server resource.
  rpc startConnect(ConnectInput) returns (McpServer) {
    option (ai.stigmer.commons.rpc.config).resource_kind = mcp_server;
    option (ai.stigmer.commons.rpc.config).permission = can_connect;
    option (ai.stigmer.commons.rpc.config).field_path = "mcp_server_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to connect to mcp server";
  }

  // Disconnect the authenticated user's sign-in for an MCP server.
  //
  // Removes the sign-in saved at the server's address in the caller's My
  // vault, with its access and refresh tokens. The MCP server definition is
  // unchanged. A pasted login at the address is left in place, and so is a
  // sign-in saved into a shared vault: the vault's removeConnections removes
  // either.
  //
  // Idempotent: returns disconnected=true when a sign-in was removed,
  // disconnected=false when none was saved. Never returns an error
  // for a missing sign-in.
  //
  // @internal
  // Authorization: Requires can_connect permission on the mcp_server resource.
  // Uses the same permission as connect: if you can establish a connection,
  // you can tear it down.
  rpc disconnectOAuth(DisconnectOAuthInput) returns (DisconnectOAuthOutput) {
    option (ai.stigmer.commons.rpc.config).resource_kind = mcp_server;
    option (ai.stigmer.commons.rpc.config).permission = can_connect;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to disconnect oauth for mcp server";
  }
}
