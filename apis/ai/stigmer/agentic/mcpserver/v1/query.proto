syntax = "proto3";

package ai.stigmer.agentic.mcpserver.v1;

import "ai/stigmer/agentic/mcpserver/v1/api.proto";
import "ai/stigmer/agentic/mcpserver/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// McpServerQueryController provides read operations for MCP server resources.
//
// @internal
// Authorization model:
// - Platform-scoped: Anyone can view (public marketplace)
// - Organization-scoped: Org members can view
// - Identity-account-scoped: Only the owner can view
service McpServerQueryController {
  // Service-level option identifying this as an MCP server controller.
  option (ai.stigmer.commons.apiresource.api_resource_kind) = mcp_server;

  // Get an MCP server by its unique identifier.
  //
  // @internal
  // Authorization: Requires can_view permission on the mcp_server resource.
  // The caller must have access based on the resource's scope:
  // - Platform: All authenticated users
  // - Organization: Organization members
  // - Identity Account: Only the owner
  rpc get(ai.stigmer.commons.apiresource.ApiResourceId) returns (McpServer) {
    option (ai.stigmer.commons.rpc.config).resource_kind = mcp_server;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view mcp server";
  }

  // Get an MCP server by reference (scope + org + slug).
  //
  // Preferred method for looking up MCP servers by name/slug rather than
  // system-generated ID.
  //
  // @internal
  // Authorization: Custom authorization in handler.
  // The handler performs scope-aware authorization based on the reference.
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (McpServer) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Check whether the authenticated user has an active OAuth grant for
  // an MCP server in the specified org.
  //
  // Returns grant metadata (connected status, token expiry, auth method)
  // without exposing any secret token values. The frontend uses this to
  // render the correct OAuth state in the MCP server detail page and
  // session composer.
  //
  // @internal
  // Authorization: Requires can_view permission on the mcp_server resource.
  // The resource_id field contains the MCP server's system-generated ID.
  rpc getOAuthGrantStatus(GetOAuthGrantStatusInput) returns (GetOAuthGrantStatusOutput) {
    option (ai.stigmer.commons.rpc.config).resource_kind = mcp_server;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view oauth status for mcp server";
  }

  // Query whether an org has a BYOA override for a resource.
  //
  // Returns override metadata (existence, OAuthApp ID, client_id) without
  // exposing secrets. The frontend uses this to show which credential
  // source is active and to offer override management options to org admins.
  //
  // Edition scoping: hosted-only, together with setOrgOAuthApp and
  // deleteOrgOAuthApp — the three org-OAuth-app RPCs are ONE capability.
  // The OSS server answers UNIMPLEMENTED for all of them by design: its
  // flat OAuthApp store has no override binding, its OAuth resolution has
  // no override level to consult, and BYOA's clone-from-platform-template
  // model has no template to clone (self-hosted users apply their own
  // OAuthApp and reference it from spec.auth.oauth_app_ref — a strictly
  // more powerful path). Clients probe the capability through THIS RPC:
  // an UNIMPLEMENTED answer means "hide every BYOA affordance" (see the
  // SDK's useOrgOAuthApp.isSupported). Never implement one RPC of the
  // surface without the other two and the client-side gate.
  //
  // @internal
  // Authorization: Requires can_view permission on the mcp_server resource.
  // Any user who can view the MCP server can check whether their org has
  // an override — no secrets are exposed.
  rpc getOrgOAuthApp(GetOrgOAuthAppInput) returns (GetOrgOAuthAppOutput) {
    option (ai.stigmer.commons.rpc.config).resource_kind = mcp_server;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to view org oauth app override";
  }
}
