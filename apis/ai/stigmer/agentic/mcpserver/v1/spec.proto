syntax = "proto3";

package ai.stigmer.agentic.mcpserver.v1;

import "ai/stigmer/agentic/environment/v1/spec.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";

// McpServerSpec defines the configurable properties of an MCP server.
//
// @internal
// This is the "Template" layer — declares capabilities and requirements.
// The overview.md file provides the SDK-facing description and example YAML.
message McpServerSpec {
  // Human-readable description for marketplace display and documentation.
  // Should explain what this MCP server does and its primary use cases.
  // Example: "GitHub MCP server for repository operations, code search, and PR management"
  string description = 1;

  // Icon URL for UI display in marketplace and agent configuration screens.
  // Should be a publicly accessible URL to an image (SVG, PNG, or JPEG).
  // Example: "https://github.githubassets.com/favicons/favicon.svg"
  string icon_url = 2;

  // Categorization tags for discoverability in the marketplace.
  // Use lowercase, hyphenated tags that describe the server's domain and capabilities.
  // Examples: ["git", "vcs", "code-analysis"], ["aws", "cloud", "infrastructure"]
  repeated string tags = 3;

  // Server type and transport configuration.
  // Exactly one must be specified based on how the MCP server communicates.
  oneof server_type {
    option (buf.validate.oneof).required = true;

    // stdio-based server (subprocess with stdin/stdout communication).
    // Most common type - used for Node.js, Python, and other CLI-based MCP servers.
    StdioServerConfig stdio = 4;

    // HTTP-based server (HTTP + Server-Sent Events communication).
    // Used for remote/managed MCP services accessible over the network.
    HttpServerConfig http = 5;
  }

  // Default tools to enable from this MCP server.
  // Empty list means all tools are enabled by default.
  //
  // @internal
  // Tool names must match exactly what the MCP server reports via tools/list.
  // Only names from discovered_capabilities.tools are valid here.
  // Do NOT include names from discovered_capabilities.resource_templates —
  // resource templates are read-only data endpoints, not callable tools.
  // Including a resource template name here causes a fatal runtime error.
  repeated string default_enabled_tools = 7;

  // Environment variables required by the MCP server.
  ai.stigmer.agentic.environment.v1.EnvironmentSpec env_spec = 8;

  // Manual tool approval overrides set by the MCP server owner.
  //
  // @internal
  // These take precedence over system-generated `McpServerStatus.tool_approvals`.
  // Never auto-modified — only changed by explicit user action (apply/update).
  //
  // Use cases:
  // - Force approval for a tool the classifier marked as auto-approve
  // - Exempt a safe tool the classifier flagged as needing approval
  // - Establish organization-wide safety policies for dangerous tools
  //
  // Policy chain (lowest to highest priority):
  // 1. McpServerStatus.tool_approvals - System-generated defaults
  // 2. McpServerSpec.pinned_tool_approvals - Manual overrides (this field)
  // 3. Agent.McpServerUsage.tool_approval_overrides - Per-agent customization
  // 4. AgentExecution.auto_approve_all - Runtime bypass
  repeated ToolApprovalPolicy pinned_tool_approvals = 11;

  // URL of the upstream source repository for this MCP server.
  // Shown in the marketplace so users can inspect the implementation
  // for trust and transparency.
  // Example: "https://github.com/modelcontextprotocol/servers"
  string repository_url = 12;

  // GitHub star count at the time of curation.
  // Used as a popularity signal in marketplace display.
  // 0 if unknown or non-GitHub repository.
  int32 github_stars = 13;

  // OAuth authentication configuration for automated credential acquisition.
  // When set, the MCP server's Connect page offers an OAuth flow instead of
  // (or in addition to) manual credential entry.
  //
  // The acquired access token is stored in the user's personal environment
  // as the env var named by auth.target_env_var. That env var must also be
  // declared in env_spec.data so the execution pipeline knows about it.
  McpServerAuth auth = 14;
}

// StdioServerConfig defines an MCP server that runs as a subprocess.
//
// @internal
// Communication happens via stdin/stdout using JSON-RPC messages.
// The agent runner starts this process and communicates via stdio.
//
// Common examples:
// - Node.js servers: npx @modelcontextprotocol/server-github
// - Python servers: python -m mcp_server_sqlite
// - Go servers: ./mcp-server-binary
message StdioServerConfig {
  // Command to execute the MCP server.
  // This is the executable name or path.
  // Examples: "npx", "python", "node", "./custom-mcp-server"
  string command = 1 [(buf.validate.field).required = true];

  // Arguments to pass to the command.
  //
  // Argument values can reference environment variables using ${VAR_NAME} syntax.
  // These placeholders are resolved at runtime from the execution environment
  // (same source as HTTP header/query param placeholders). This enables MCP
  // servers that take core configuration as positional CLI arguments (e.g.
  // database connection URLs, directory paths) to be parameterized per-user
  // through env_spec.
  //
  // Resolution uses strict mode: missing variables produce a clear error
  // rather than passing a literal "${VAR}" to the subprocess.
  //
  // Note: resolved values appear in the subprocess argv, which is visible
  // via /proc/<pid>/cmdline within the container. In the containerized
  // agent-runner environment this is not a practical concern, but callers
  // should be aware when debugging.
  //
  // Examples:
  //   ["-y", "@modelcontextprotocol/server-github"]
  //   ["-y", "@modelcontextprotocol/server-postgres", "${POSTGRES_CONNECTION_URL}"]
  //   ["-m", "mcp_server_sqlite", "--db-path", "${DB_PATH}/data.sqlite"]
  repeated string args = 2;

  // Working directory for the process.
  // If not specified, the process inherits the agent runner's working directory.
  // Use absolute paths or paths relative to the agent runner's context.
  string working_dir = 3;
}

// HttpServerConfig defines an MCP server accessible via HTTP + Server-Sent Events.
//
// @internal
// Communication flow:
// 1. Agent sends JSON-RPC requests via HTTP POST
// 2. Server streams responses via Server-Sent Events (SSE)
//
// Use cases:
// - Managed MCP services (e.g., hosted by a cloud provider)
// - MCP servers behind a reverse proxy or API gateway
// - Sharing a single MCP server instance across multiple agents
message HttpServerConfig {
  // Base URL of the MCP server endpoint.
  // Must be a valid HTTP or HTTPS URL.
  // Examples:
  // - "http://localhost:3000/mcp"
  // - "https://mcp.example.com/v1"
  // - "https://api.company.com/mcp/github"
  string url = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uri = true
  ];

  // HTTP headers to include with every request.
  // Use for authentication, API versioning, or custom routing.
  //
  // Header values can reference environment variables using ${VAR_NAME} syntax.
  // These placeholders are resolved at runtime from AgentInstance's environment.
  //
  // Examples:
  //   "Authorization": "Bearer ${API_TOKEN}"
  //   "X-API-Version": "2024-01"
  //   "X-Tenant-ID": "${TENANT_ID}"
  map<string, string> headers = 2;

  // Query parameters to append to the URL.
  // Values can reference environment variables using ${VAR_NAME} syntax.
  //
  // Examples:
  //   "region": "${AWS_REGION}"
  //   "version": "v1"
  map<string, string> query_params = 3;

  // Timeout for HTTP requests in seconds.
  // Applies to both the initial connection and response streaming.
  // Default: 30 seconds if not specified.
  // Set higher values for MCP servers that perform long-running operations.
  int32 timeout_seconds = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 300
  }];
}

// ToolApprovalPolicy defines approval requirements for a specific tool.
//
// @internal
// The message field supports {{args.field}} placeholders that are resolved
// at runtime using the actual tool arguments. This enables contextual
// approval messages that help users make informed decisions.
//
// Placeholder syntax:
//   {{args.field_name}} - Replaced with the tool argument value
//   {{tool_name}} - Replaced with the tool name (always available)
//
// If a placeholder references a missing argument, it's replaced with "<unknown>".
//
// Policy chain (lowest to highest priority):
// 1. McpServerStatus.tool_approvals - System-generated defaults
// 2. McpServerSpec.pinned_tool_approvals - Manual overrides
// 3. Agent.McpServerUsage.tool_approval_overrides - Per-agent customization
// 4. AgentExecution.auto_approve_all - Runtime bypass
message ToolApprovalPolicy {
  // Name of the tool (must match tools/list from MCP server exactly).
  // Case-sensitive matching against tool names reported by the MCP server.
  // Example: "delete_repository", "send_email", "execute_sql"
  string tool_name = 1 [(buf.validate.field).string.min_len = 1];

  // Human-readable message shown to user when approval is requested.
  // Supports {{args.field}} placeholders for dynamic content.
  //
  // If empty, a default message is generated: "Execute tool: {tool_name}"
  //
  // Guidelines for effective messages:
  //   - Be specific about what will happen
  //   - Include the most important argument values using placeholders
  //   - Keep under 100 characters for UI display
  //   - Use action verbs: "Delete", "Send", "Execute", "Create"
  string message = 2;
}

// McpServerAuth configures automated credential acquisition via OAuth.
//
// @internal
// Two authentication methods are supported:
//
// - mcp_oauth: The MCP server implements the MCP Authorization specification
//   (RFC 8414 discovery, RFC 7591 Dynamic Client Registration, OAuth 2.1 with
//   PKCE). Stigmer auto-discovers everything from the server URL. No OAuthApp
//   resource is needed — credentials are obtained automatically via DCR.
//
// - vendor_oauth: The MCP server requires pre-registered OAuth app credentials
//   from a specific vendor (Slack, Salesforce, Figma, etc.). References an
//   OAuthApp resource created by the org admin.
//
// In both cases, the acquired access token is stored in the user's personal
// environment as target_env_var. A refresh token (if issued by the vendor) is
// stored alongside as {target_env_var}_REFRESH_TOKEN by convention.
//
// Token lifecycle:
// - Pre-flight check before execution: if the access token is expired,
//   the backend uses the refresh token to obtain a new one automatically.
// - If the refresh token is also expired: execution fails with a clear
//   error, and the user re-authenticates from the MCP server Connect page.
message McpServerAuth {
  // Authentication method. Exactly one must be specified.
  oneof method {
    option (buf.validate.oneof).required = true;

    // MCP OAuth spec: DCR + PKCE, auto-discovered from server URL.
    McpOAuth mcp_oauth = 1;

    // Vendor-specific OAuth: references an OAuthApp with client credentials.
    McpServerVendorOAuth vendor_oauth = 2;
  }

  // The env var in env_spec.data where the acquired access token is stored.
  // Must correspond to an entry in env_spec.data so the execution pipeline
  // resolves it. The refresh token is stored as {target_env_var}_REFRESH_TOKEN
  // by convention. Both are written to the user's personal environment.
  string target_env_var = 3 [(buf.validate.field).string.min_len = 1];

  // Informational hint about expected token lifetime for UI display.
  // Helps users understand when re-authentication may be needed.
  // Empty means unknown. Examples: "1h", "2h", "90d", "never".
  string token_lifetime_hint = 4;
}

// McpOAuth configures MCP Authorization spec authentication (DCR + PKCE).
//
// @internal
// The MCP server implements the MCP Authorization specification:
// - RFC 8414: OAuth 2.0 Authorization Server Metadata (.well-known discovery)
// - RFC 7591: Dynamic Client Registration
// - OAuth 2.1 with PKCE (S256)
//
// Stigmer discovers the authorization server metadata, registers a client
// via DCR, and performs the authorization code flow with PKCE — all
// automatically at connect time. No OAuthApp resource is needed.
message McpOAuth {
  // Optional scope hints for UI display before the OAuth flow starts.
  // These are informational — the actual scopes are negotiated during DCR
  // and the authorization request based on what the server supports.
  repeated string scope_hints = 1;
}

// McpServerVendorOAuth configures vendor-specific OAuth authentication.
//
// @internal
// References an OAuthApp resource that holds the vendor's client credentials
// (client_id, client_secret, endpoint URLs, scopes). The OAuthApp is created
// by the org admin or platform operator who registered an OAuth app with
// the vendor (e.g., Slack, Salesforce, Figma).
//
// At connect time, Stigmer uses the OAuthApp's credentials to perform
// the OAuth authorization code flow with the vendor on behalf of the user.
message McpServerVendorOAuth {
  // Reference to the OAuthApp resource providing client credentials.
  // The referenced OAuthApp must belong to the same organization as
  // the McpServer (or be accessible via cross-org reference).
  ai.stigmer.commons.apiresource.ApiResourceReference oauth_app_ref = 1 [(buf.validate.field).required = true];
}
