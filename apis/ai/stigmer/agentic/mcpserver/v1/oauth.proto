syntax = "proto3";

package ai.stigmer.agentic.mcpserver.v1;

// OAuthGrant tracks one sign-in to an API resource: the metadata that
// keeps its token fresh, and the refresh token itself.
//
// @internal
// Infrastructure-only. Not a public API resource — no kind, no apiVersion,
// no CRUD RPCs. Stored in the backend's database, keyed by the composite
// of (identity_account_id, resource_id, org); the organization's own
// sign-in to a server with organization sign-in has an empty
// identity_account_id.
//
// The grant is resource-agnostic: currently used for MCP servers, but the
// data model supports any API resource kind that needs OAuth credentials.
//
// Storage split:
// - The access token is a field of a Credential (credential_id), named by
//   target_env_var: it is a value runs receive, so it lives where every
//   value a run receives lives.
// - The refresh token is sealed on this grant (refresh_token): no run
//   receives it and no person can reveal it; it only renews the access
//   token.
message OAuthGrant {
  // Which user owns this grant.
  string identity_account_id = 1;

  // System-generated ID (metadata.id) of the API resource this grant
  // provides OAuth tokens for. Part of the composite key:
  // (identity_account_id, resource_id, org).
  string resource_id = 2;

  // When the current access token expires (Unix timestamp seconds).
  // 0 means the token does not expire (e.g., long-lived tokens from
  // Notion or Slack user tokens).
  int64 access_token_expires_at = 3;

  // OAuth client ID used for this grant.
  // For mcp_oauth: obtained via Dynamic Client Registration.
  // For vendor_oauth: copied from the referenced OAuthApp.spec.client_id.
  string client_id = 4;

  // Which auth method was used to obtain this grant.
  // Values: "mcp_oauth" or "vendor_oauth".
  // Determines how token refresh is performed (DCR client vs. OAuthApp credentials).
  string auth_method = 5;

  // Token endpoint URL for refresh requests.
  // For mcp_oauth: discovered via .well-known/oauth-authorization-server.
  // For vendor_oauth: copied from OAuthApp.spec.token_url.
  string token_endpoint = 6;

  // The key the access token fills: the name of the credential's field.
  string access_token_env_var = 7;

  // Field 8 named the refresh token's variable and field 9 the managed
  // environment that held both tokens, until sign-ins came to write a
  // credential and keep the refresh token sealed here. Reserved so the
  // numbers and names are never reused for different fields.
  reserved 8, 9;
  reserved "refresh_token_env_var", "environment_id";

  // Kind of the API resource identified by resource_id (e.g., "mcp_server").
  // Used for query filtering and handler routing.
  string resource_kind = 10;

  // Organization context for this grant. Part of the composite key:
  // (identity_account_id, resource_id, org). Enables the same user to
  // maintain separate OAuth connections for a shared resource across orgs.
  string org = 11;

  // ID of the Credential that holds the access token.
  // Created by completeOAuthConnect; deleted with this grant.
  string credential_id = 12;

  // The refresh token, sealed at rest.
  //
  // @internal
  // Ciphertext through the server's secret facade; never returned by any
  // RPC. Empty when the vendor issued none.
  string refresh_token = 13;
}

// OAuthAppOverride binds a specific OAuthApp to an API resource within an
// organization, overriding the platform-default OAuthApp for that resource.
//
// @internal
// Infrastructure-only. Not a public API resource — no kind, no apiVersion,
// no CRUD RPCs. Stored in the backend's database, keyed by the composite
// of (resource_id, resource_kind, org).
//
// This is the "Bring Your Own App" (BYOA) binding: it records that org Z
// wants resource Y to use OAuthApp X instead of the platform default
// referenced by McpServerAuth.oauth_app_ref.
//
// Separation of concerns:
// - OAuthApp (credential resource): holds client_id, client_secret, and
//   vendor endpoint URLs. Reusable — may be referenced by multiple overrides
//   or MCP servers.
// - OAuthAppOverride (binding document): maps (resource, org) to an OAuthApp.
//   Analogous to OAuthGrant, which maps (user, resource, org) to token metadata.
//
// Resolution chain (evaluated at connect time and token refresh):
//   1. OAuthAppOverride for (resource_id, resource_kind, org) — org override
//   2. McpServerAuth.oauth_app_ref on the resource spec — platform default
//   3. None — no OAuth app available (manual token or DCR only)
//
// Edition scoping: the override binding — and the whole resolution chain
// above it — exists only on the hosted platform. OSS resolves the
// oauth_app_ref directly against its flat OAuthApp store (the ref IS the
// whole resolution) and answers UNIMPLEMENTED for the org-OAuth-app RPCs;
// see McpServerQueryController.getOrgOAuthApp for the contract.
//
// The override is resource-agnostic: currently used for MCP servers, but the
// composite key supports any API resource kind that needs BYOA.
message OAuthAppOverride {
  // System-generated ID (metadata.id) of the API resource this override
  // applies to. Part of the composite key: (resource_id, resource_kind, org).
  string resource_id = 1;

  // Kind of the API resource identified by resource_id (e.g., "mcp_server").
  // Part of the composite key. Enables the same table to serve overrides
  // for multiple resource types without collision.
  string resource_kind = 2;

  // Organization that owns this override. Part of the composite key.
  // Different orgs can maintain independent BYOA overrides for the same
  // shared (platform-scoped) resource.
  string org = 3;

  // ID of the OAuthApp resource that holds the org's client credentials.
  // Created by the setOrgOAuthApp handler, which clones the platform
  // OAuthApp template and applies the org-provided client_id + client_secret.
  string oauth_app_id = 4;
}
