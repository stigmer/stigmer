syntax = "proto3";

package ai.stigmer.agentic.mcpserver.v1;

import "ai/stigmer/agentic/mcpserver/v1/spec.proto";
import "ai/stigmer/commons/apiresource/status.proto";
import "ai/stigmer/iam/oauthapp/v1/spec.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// McpServerStatus represents the system-managed state of an MCP server definition.
//
// @internal
// Tracks four concerns:
// 1. Structural validation — whether the definition is valid and can be used by agents.
// 2. Discovered capabilities — the tools and resource templates the MCP server
//    actually provides. Populated by:
//      a. Static seedpack bootstrap (for built-in servers like stigmer-mcp-server)
//      b. The connect RPC — the backend delegates to the agent-runner via a Temporal
//         workflow, which connects to the MCP server and enumerates tools/resources.
// 3. Tool approval policies — system-generated by a lightweight LLM classifier during
//    the connect flow. Manual overrides live in McpServerSpec.pinned_tool_approvals.
// 4. OAuth enrichment — vendor approval status and BYOA resolution chain results,
//    populated by the backend enricher at query time. Never persisted.
message McpServerStatus {
  // Validation state of the MCP server definition.
  // Indicates whether the definition passed structural validation.
  ValidationState validation_state = 1;

  // Human-readable validation message.
  // Populated when validation_state is INVALID to explain what's wrong.
  // Empty when validation_state is VALID or UNSPECIFIED.
  // Examples:
  // - "server_type is required: must specify stdio, http, or docker"
  // - "http.url is not a valid URL: missing scheme"
  // - "docker.image is required"
  string validation_message = 2;

  // Tools and resource templates discovered from the MCP server.
  // Optional — absent until the connect RPC has been called (or seeded from seedpack).
  DiscoveredCapabilities discovered_capabilities = 3;

  // System-generated tool approval policies.
  //
  // @internal
  // Produced by a lightweight LLM classifier during the connect flow.
  // Overwritten on each reconnect. Never manually edited — use
  // McpServerSpec.pinned_tool_approvals for manual overrides.
  //
  // Policy chain (lowest to highest priority):
  // 1. McpServerStatus.tool_approvals (this field) - System-generated defaults
  // 2. McpServerSpec.pinned_tool_approvals - Manual overrides
  // 3. Agent.McpServerUsage.tool_approval_overrides - Per-agent customization
  // 4. AgentExecution.auto_approve_all - Runtime bypass
  repeated ToolApprovalPolicy tool_approvals = 4;

  // OAuth-related enrichment state, populated at query time by the backend.
  // Carries the vendor approval status resolved from the referenced OAuthApp
  // (fields 1-2; fields 3-4 are never populated — see OAuthStatus).
  // None of these fields are persisted.
  OAuthStatus oauth_status = 5;

  // Standard audit information (created_at, updated_at, created_by, etc.)
  ai.stigmer.commons.apiresource.ApiResourceAudit audit = 99;
}

// ValidationState represents the structural validity of an MCP server definition.
// This is NOT runtime health — it only indicates whether the definition is valid.
enum ValidationState {
  // Default/unspecified state.
  // Used when validation has not yet been performed.
  validation_state_unspecified = 0;

  // The MCP server definition is structurally valid.
  // All required fields are present and have valid values.
  // The definition can be referenced by agents.
  valid = 1;

  // The MCP server definition is invalid.
  // Check validation_message for details on what's wrong.
  // The definition should be corrected before use.
  invalid = 2;
}

// DiscoveredCapabilities holds the tools and resource templates reported by an MCP server.
//
// @internal
// This is a point-in-time snapshot — the server's actual capabilities may change
// if tools are added or removed.
//
// Tools vs Resource Templates:
//   - tools: Callable actions the agent can invoke (e.g., search_code, create_pr).
//     Only tool names are valid in Agent enabled_tools and McpServer default_enabled_tools.
//   - resource_templates: Read-only data endpoints accessed by URI template.
//     Resource template names must NEVER appear in enabled_tools — such a name
//     never matches a discovered tool, so the runner warns and ignores it
//     (enforcing the intersection with the live toolset).
//
// Populated by:
// - Seedpack bootstrap (built-in servers with known, stable tool sets)
// - The connect RPC (web console, CLI, or Graphton first-time-use backfill)
message DiscoveredCapabilities {
  // Callable tools reported by the MCP server.
  repeated DiscoveredTool tools = 1;

  // Read-only data endpoints reported by the MCP server.
  repeated DiscoveredResourceTemplate resource_templates = 2;

  // When this snapshot was captured.
  google.protobuf.Timestamp last_discovered_at = 3;
}

// DiscoveredTool describes a single tool reported by an MCP server.
//
// @internal
// Maps directly to the MCP protocol's Tool type from tools/list.
message DiscoveredTool {
  // Unique tool name within the MCP server (case-sensitive).
  // Example: "search", "get_agent", "apply_mcp_server"
  string name = 1;

  // Human-readable description of the tool's purpose.
  string description = 2;

  // JSON Schema describing the tool's input parameters.
  google.protobuf.Struct input_schema = 3;
}

// DiscoveredResourceTemplate describes a parameterized resource template reported by an MCP server.
//
// @internal
// Resource templates use URI templates (RFC 6570) with placeholders that
// clients fill in to access specific resources.
message DiscoveredResourceTemplate {
  // URI template with placeholders (RFC 6570).
  // Example: "stigmer://agents/{org}/{slug}"
  string uri_template = 1;

  // Identifier for this resource template.
  string name = 2;

  // Human-readable description of the resource.
  string description = 3;

  // MIME type of the resource content.
  // Example: "application/json"
  string mime_type = 4;
}

// OAuthAppSource identifies where the effective OAuth app for an MCP server
// was resolved from.
//
// The resolution chain is the same one the OAuth connect flow evaluates:
//   1. OAuthAppOverride for (resource_id, resource_kind, org_id) → ORG_OVERRIDE
//   2. McpServerAuth.oauth_app_ref → PLATFORM
//   3. Neither exists → NONE
//
// Resolved CLIENT-SIDE by the shared SDK from the getOrgOAuthApp RPC: the
// resolution is per (server, caller's active org), and the caller's active
// org is client-side context the read RPCs never carry, so no backend can
// compute it at enrichment time (see OAuthStatus fields 3-4).
enum OAuthAppSource {
  // Default / unset. The resolution chain has not been evaluated yet.
  OAUTH_APP_SOURCE_UNSPECIFIED = 0;

  // The platform-default OAuthApp is in use (McpServerAuth.oauth_app_ref).
  OAUTH_APP_SOURCE_PLATFORM = 1;

  // An org-level BYOA override is in use (OAuthAppOverride binding).
  OAUTH_APP_SOURCE_ORG_OVERRIDE = 2;

  // No OAuthApp is available. The MCP server either uses DCR (mcp_oauth)
  // or has no auth block at all.
  OAUTH_APP_SOURCE_NONE = 3;
}

// OAuthStatus holds system-derived OAuth enrichment state for an MCP server.
//
// @internal
// All fields are read-only and never persisted on the McpServer document.
//
// Two categories, with different production stories:
// 1. Vendor approval (fields 1-2): populated by the backend enricher on
//    every get/getByReference response, resolved from the referenced
//    OAuthApp. Tells the frontend whether the platform sign-in flow is
//    gated and provides a BYOA documentation link when approval is pending.
// 2. BYOA resolution (fields 3-4): NEVER POPULATED, by any edition. The
//    resolution is per (server, caller's active org), and the caller's
//    active org is client-side context the read RPCs never carry — get has
//    no org, and getByReference's org is the server's OWNING org (the
//    lookup key), which differs from the caller's org when browsing another
//    org's public server. Resolving against the owning org would misreport
//    exactly the cross-org marketplace flow BYOA exists for. The shared SDK
//    instead derives the signal client-side from the getOrgOAuthApp RPC,
//    keyed on the same org the connect flow uses. The fields are retained
//    for wire compatibility and as the home of this contract note; a future
//    server-side active-org mechanism could legitimately populate them.
message OAuthStatus {
  // Vendor marketplace/app-review approval status for this MCP server's
  // OAuth app. Resolved from the referenced OAuthApp at query time.
  // When the platform OAuthApp is pending vendor approval, the frontend
  // gates the sign-in button and shows a BYOA alternative.
  ai.stigmer.iam.oauthapp.v1.VendorApprovalStatus vendor_approval_status = 1;

  // Documentation URL for users who want to bring their own OAuth app
  // credentials while the platform's OAuth app is pending vendor approval.
  // Resolved from the referenced OAuthApp at query time.
  // Empty when the OAuthApp has no documentation link or is already approved.
  string vendor_approval_docs_url = 2;

  // NEVER POPULATED (see the message comment): the caller's active org is
  // client-side context, so no backend can evaluate the resolution chain at
  // read time. The shared SDK derives this value client-side from the
  // getOrgOAuthApp RPC (useMcpServerCredentials.effectiveOAuthSource).
  OAuthAppSource effective_oauth_source = 3;

  // NEVER POPULATED (see the message comment). The override's OAuthApp ID
  // is available from the getOrgOAuthApp RPC (GetOrgOAuthAppOutput.oauth_app_id).
  string effective_oauth_app_id = 4;
}
