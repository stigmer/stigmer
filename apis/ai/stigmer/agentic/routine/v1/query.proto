syntax = "proto3";

package ai.stigmer.agentic.routine.v1;

import "ai/stigmer/agentic/routine/v1/api.proto";
import "ai/stigmer/agentic/routine/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// RoutineQueryController handles read operations for routines.
//
// @internal
// No anonymous/public RPC by design (the Channel posture for Slack and WhatsApp): a
// routine has no public surface at all — its only runtime effect is the
// runs its fires create.
service RoutineQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = routine;

  // Get a single routine by ID.
  rpc get(RoutineId) returns (Routine) {
    option (ai.stigmer.commons.rpc.config).resource_kind = routine;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get routine";
  }

  // Get a routine by its organization-scoped reference (org/slug).
  //
  // @internal
  // Custom authorization in handler — checks both direct resource access
  // and organization-level visibility permissions (the Channel
  // pattern).
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (Routine) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List the routines of a specific agent, newest first.
  // Returns only routines the caller has access to.
  //
  // This is how the agent's operational surfaces and CLI resolve an
  // agent's existing routines regardless of slug.
  //
  // @internal
  // Authorization in-handler: FGA-filtered in cloud, unrestricted in OSS
  // (the listByAgent family convention, as on channels).
  rpc listByAgent(ListRoutinesByAgentRequest) returns (RoutineList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List routines with optional label filtering.
  //
  // @internal
  // Authorization in-handler via FGA-filtered queries (cloud) or
  // unrestricted store queries (OSS).
  rpc list(ListRoutinesRequest) returns (RoutineList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List a routine's fire history, newest first.
  //
  // Every fire leaves a row — including fires that created no run
  // (a refused launch gate, a missing target agent) — with the refusing
  // gate's copy verbatim. This is the surface that explains
  // status.consecutive_failures.
  //
  // @internal
  // Backed by the fire ledger. Authorization:
  // can_view on the routine — fire history is the routine's own
  // operational record; the linked runs keep their own bars. Rows
  // carrying a run id but no terminal outcome are enriched with
  // the run's live phase at read time (one join), so manual fires
  // need no tracker and outcome columns never lie. OSS implements the
  // same contract against its store; the conformance suite holds both
  // editions to it.
  rpc listFires(ListRoutineFiresRequest) returns (RoutineFireList) {
    option (ai.stigmer.commons.rpc.config).resource_kind = routine;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "routine_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to list routine fires";
  }
}
