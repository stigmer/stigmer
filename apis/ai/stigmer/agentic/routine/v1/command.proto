syntax = "proto3";

package ai.stigmer.agentic.routine.v1;

import "ai/stigmer/agentic/routine/v1/api.proto";
import "ai/stigmer/agentic/routine/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// RoutineCommandController handles write operations for routines.
service RoutineCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = routine;

  // Create or update a routine.
  //
  // A request that carries metadata.id of a routine in its organization
  // updates that routine, and its slug changes only through rename. A slug the
  // routine was renamed away from, named without the routine's id, is refused
  // with FAILED_PRECONDITION carrying a google.rpc.ErrorInfo detail (domain
  // "stigmer.ai"), because a write by a name that stops resolving after 30 days
  // would later make a second routine:
  //
  //   - SLUG_RENAMED — the slug was renamed: it still leads to the same
  //     routine for reading, but a write names its current slug. Metadata:
  //     slug (the one the request named).
  //
  // @internal
  // The authorization and state-operation are determined depending on
  // whether the routine is going to be created or updated, resolved as
  // part of request execution. Status is preserved verbatim across
  // apply-as-update (the Channel posture): status is written only by the
  // scheduling runtime and by the explicit resume command, and a routine
  // manifest apply must never reset the failure streak or un-pause a
  // platform-paused routine.
  rpc apply(Routine) returns (Routine);

  // Create a routine.
  //
  // Creating a routine is a spending decision: every run calls models on the
  // organization's own provider keys, unattended, and the providers bill the
  // organization for them. Every run acts as the routine's creator, its
  // owner.
  //
  // A slug another routine of the organization holds is refused with
  // ALREADY_EXISTS. A slug another routine was renamed away from, which still
  // leads to it for 30 days, is refused with ALREADY_EXISTS carrying a
  // google.rpc.ErrorInfo detail (domain "stigmer.ai"):
  //
  //   - SLUG_RESERVED — another routine held the slug until a recent rename,
  //     and it still leads there. Metadata: slug.
  //
  // @internal
  // Authorization: requires can_edit on the REFERENCED AGENT
  // (spec.agent.agent_ref), checked in-handler: whoever may edit the agent
  // may make a routine of it, and there is deliberately no org-level
  // can_create_routine permission. (A chat link or a channel also asks
  // can_edit on its agent, and in addition needs an organization admin.)
  // Standard org-scoped create tuples (owner = creator); no visibility tuples
  // (the kind has no visibility block). Invariant enforced here:
  // metadata.org must equal spec.agent.agent_ref.org.
  rpc create(Routine) returns (Routine) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Update a routine: the fields update_mask names change, every other
  // field keeps its stored value.
  //
  // The referenced agent is immutable; the schedule, time zone, enablement
  // and the message may change. Only the routine's owner may change what it
  // runs (anything in spec but switching it off); whoever else may manage it
  // may switch it off, rename, relabel or delete it, and is refused
  // otherwise with PERMISSION_DENIED. Status (firing observations, the
  // platform pause) is never touched by updates: use resume to clear a
  // platform pause.
  //
  // resource.metadata.id names the routine; apply finds one by slug. The slug
  // changes only through rename, and a mask naming a field another door
  // owns, or a path the routine does not have, is refused with
  // INVALID_ARGUMENT naming the path.
  //
  // An update is refused with ABORTED carrying a google.rpc.ErrorInfo detail
  // (domain "stigmer.ai"):
  //
  //   - ETAG_MISMATCH — resource.metadata.etag is set and the routine changed
  //     since that etag was read: read it again and make the change again.
  //     No metadata.
  //   - WRITE_CONFLICT — the routine kept changing while the update was
  //     being saved: try again. No metadata.
  //
  // @internal
  // Authorization: requires can_edit permission on the routine, and the
  // owner's lock in-handler. agent_ref immutability is a consent-bar
  // guarantee, not convenience: create's bar is can_edit on the REFERENCED
  // agent, and a repointing update would let a routine owner drive an agent
  // they may not edit (the Channel rule for the Channel reason). The owner's
  // lock exists because every run acts as the owner: an admin who changed
  // the message would put words into a run in the owner's name. Update
  // deliberately does NOT clear a platform auto-pause: apply routes through
  // this same handler, so any update-clears-pause behavior would let a
  // routine GitOps re-apply silently un-pause a failing routine. resume is
  // the one clearing path.
  rpc update(UpdateRoutineInput) returns (Routine) {
    option (ai.stigmer.commons.rpc.config).resource_kind = routine;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "resource.metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update routine";
  }

  // Rename a routine: change its slug, the name people type.
  //
  // The routine keeps its id, so everything that names it keeps working, and
  // every answer names it by the new slug. The old slug keeps leading to the
  // routine for reading for 30 days, during which no other routine of the
  // organization can take it and this one can take it back; then it is
  // released. A write that names the old slug is refused with SLUG_RENAMED (see
  // apply). A slug another routine holds is refused with ALREADY_EXISTS, and
  // one another routine was recently renamed away from with SLUG_RESERVED (see
  // create).
  //
  // Its schedule keeps its times; a conversation an earlier run started keeps
  // the name it was given then.
  //
  // @internal
  // Authorization: Requires can_delete permission on the routine: whoever may
  // delete it may rename it.
  rpc rename(ai.stigmer.commons.apiresource.RenameInput) returns (Routine) {
    option (ai.stigmer.commons.rpc.config).resource_kind = routine;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to rename routine";
  }

  // Delete a routine.
  //
  // The routine stops permanently. Runs it started are untouched. To stop it
  // while keeping the routine and its history, disable it (enabled=false)
  // instead. Deleting the routine's agent deletes the routine too.
  //
  // @internal
  // Authorization: requires can_delete permission on the routine. The
  // referenced agent is untouched. The Temporal artifact teardown runs
  // best-effort, AFTER the row delete; an orphaned artifact is harmless
  // by construction (fire-time revalidation no-ops it, and the
  // reconciliation pass removes it).
  rpc delete(RoutineId) returns (Routine) {
    option (ai.stigmer.commons.rpc.config).resource_kind = routine;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete routine";
  }

  // Resume a routine the platform paused after repeated run failures.
  //
  // Clears status.paused_reason, resets status.consecutive_failures,
  // and re-arms its schedule. Resuming a routine that is not paused
  // succeeds and changes nothing. A disabled routine stays disabled:
  // resume clears the platform's pause, not the owner's switch
  // (spec.enabled).
  //
  // @internal
  // Authorization: requires can_edit permission on the routine, the update
  // bar; resuming does not change what runs, so it does not need the
  // owner's lock. This command is deliberately the ONLY path that clears a
  // platform auto-pause: apply and update preserve status byte-for-byte, so
  // a routine manifest apply can never silently un-pause a failing routine.
  // The handler loads before authorizing (#224: a missing routine answers
  // NOT_FOUND, not PERMISSION_DENIED) and patches status leaves rather than
  // saving the row, since the tick is a concurrent status writer.
  rpc resume(RoutineId) returns (Routine) {
    option (ai.stigmer.commons.rpc.config).resource_kind = routine;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to resume routine";
  }

  // Fire a routine once, immediately, and answer with the run's real
  // outcome.
  //
  // The run acts as the routine's owner and starts a new conversation, with
  // the routine's message. `text`, when set, is appended inside a block that
  // tells the agent it is information from whoever started the run, not
  // instructions: the routine's own message decides what to do with it.
  // Each call is its own run, even two in one second; a caller that retries
  // starts a second run.
  //
  // The fire runs synchronously through the standard run create pipeline
  // (every launch gate runs), and the result names what happened: the
  // created run's id, or the refusing gate's own copy verbatim.
  // status.last_fire_at and status.last_run_id record a started run. A fire
  // does NOT feed the failure streak: the streak is the schedule's
  // unattended health signal, and a test fire of a broken routine must not
  // race its owner to the pause threshold.
  //
  // A disabled routine refuses (enable it first). A platform-paused routine
  // MAY be fired: a test fire is exactly how an owner verifies a fix before
  // resuming; resume remains the one path that clears the pause. A routine
  // started by hand as often as the server allows in an hour (30 by
  // default) refuses until the hour has room again; the routine's own
  // schedule is never limited by it.
  //
  // @internal
  // Authorization: requires can_fire on the routine: its owner and the
  // Participants the owner granted. Organization admins manage a routine
  // but do not fire it, because the run acts as the owner and the text
  // reaches it. Two-level contract: a gRPC error means the fire itself was
  // refused (disabled → FAILED_PRECONDITION with the byte-pinned copy,
  // missing → NOT_FOUND before authorize, #224, past the hourly limit on
  // hand fires → RESOURCE_EXHAUSTED); a gRPC success means the
  // fire happened and RoutineFireResult names the run's outcome. A
  // deterministically refused run is a successful fire honestly reported,
  // never an exception. The handler stamps last_fire_at and last_run_id and
  // writes the fire-ledger row (origin=manual, fired_by=the caller),
  // because the tick is not in the path to do it; status writes ride
  // updateFields, never save().
  rpc fire(FireRoutineInput) returns (RoutineFireResult) {
    option (ai.stigmer.commons.rpc.config).resource_kind = routine;
    option (ai.stigmer.commons.rpc.config).permission = can_fire;
    option (ai.stigmer.commons.rpc.config).field_path = "id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to fire routine";
  }
}
