syntax = "proto3";

package ai.stigmer.agentic.agentinstance.v1;

import "ai/stigmer/agentic/agentinstance/v1/api.proto";
import "ai/stigmer/agentic/agentinstance/v1/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// AgentInstanceCommandController handles write operations for agent instances.
service AgentInstanceCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = agent_instance;

  // Create or update an agent instance.
  //
  // @internal
  // The authorization and state-operation are determined depending on whether the agent instance
  // is going to be created or updated which is determined as part of the request execution.
  rpc apply(AgentInstance) returns (AgentInstance);

  // Create an agent instance.
  //
  // Public agents allow any authenticated user to create instances (cross-org allowed).
  // Private agents restrict instance creation to org members and the agent owner.
  //
  // @internal
  // Provide organization_id in metadata.org, and complete spec with configuration and secrets.
  // Authorization: FGA can_create_instance on parent agent (handler-level).
  // FGA is the single source of truth — no hardcoded org-matching rules.
  // Agents are blueprints with zero secrets; instances are personal resources in the caller's org.
  rpc create(AgentInstance) returns (AgentInstance) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Update an existing agent instance.
  //
  // @internal
  // Replaces the entire instance configuration including metadata, spec, and secrets.
  // No individual field updates — always provide complete state.
  // Authorization: Only owner can update (can_edit permission).
  rpc update(AgentInstance) returns (AgentInstance) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_instance;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update agent instance";
  }

  // Delete an agent instance.
  //
  // @internal
  // Authorization: Only owner can delete (can_delete permission).
  rpc delete(AgentInstanceId) returns (AgentInstance) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_instance;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete agent instance";
  }
}
