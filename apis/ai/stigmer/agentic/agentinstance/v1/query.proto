syntax = "proto3";

package ai.stigmer.agentic.agentinstance.v1;

import "ai/stigmer/agentic/agentinstance/v1/api.proto";
import "ai/stigmer/agentic/agentinstance/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// AgentInstanceQueryController handles read operations for agent instances.
service AgentInstanceQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = agent_instance;

  // Get a single agent instance by ID.
  rpc get(AgentInstanceId) returns (AgentInstance) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_instance;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get Agent Instance";
  }

  // Get all instances of a specific agent template.
  // Returns only instances the caller has access to.
  //
  // @internal
  // Authorization is handled in handler via FGA query for authorized agent_instance_ids,
  // then filtered by agent_id.
  rpc getByAgent(GetAgentInstancesByAgentRequest) returns (AgentInstanceList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Get an agent instance by its organization-scoped reference (org/slug).
  //
  // @internal
  // Custom authorization in handler.
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (AgentInstance) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List agent instances with optional label filtering.
  //
  // @internal
  // Authorization is handled in-handler via FGA-filtered queries (cloud)
  // or unrestricted store queries (OSS).
  rpc list(ListAgentInstancesRequest) returns (AgentInstanceList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
