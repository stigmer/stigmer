syntax = "proto3";

package ai.stigmer.agentic.agentinstance.v1;

import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";

// AgentInstanceSpec defines the configurable properties of an agent instance.
//
// @internal
// This is the "Instance" layer — stateful configuration with secrets.
// The overview.md file provides the SDK-facing description and example YAML.
message AgentInstanceSpec {
  // Identifier of the Agent template this instance deploys.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];

  // Human-readable description for UI and API display.
  string description = 2;

  // References to Environment resources providing secrets and configuration at runtime.
  //
  // @internal
  // Environments are merged in order: later environments override earlier ones.
  // Example: [base-env, aws-prod-env, github-team-env]
  // This allows layering of configurations (base → specific overrides).
  repeated ai.stigmer.commons.apiresource.ApiResourceReference environment_refs = 3 [
    (ai.stigmer.commons.apiresource.reference_kind) = environment,
    (buf.validate.field).repeated.items.cel = {
      id: "environment_refs.kind"
      message: "environment_refs must reference resources with kind=environment"
      expression: "this.kind == 53"
    }
  ];

  // Data partition this instance's record operations are scoped to, for
  // every datastore the agent uses. Unset means the shared "default"
  // partition.
  //
  // Instances declaring the same label share records (e.g. the prod
  // instances of two agents on one datastore); a different label is a
  // fully isolated dataset (e.g. a dev instance whose test records
  // never touch prod).
  //
  // @internal
  // DD-010: the record RPCs derive the partition from the session's
  // resolved instance — server-side, per call, never from tool
  // arguments — so the label (not the instance id, which changes when
  // default instances are recreated) is the durable partition key.
  // One label per instance in v1; a per-datastore map is a recorded
  // additive growth slot.
  string datastore_partition = 4 [
    (buf.validate.field).string.pattern = "^$|^[a-z][a-z0-9-]*[a-z0-9]$",
    (buf.validate.field).string.max_len = 63
  ];
}
