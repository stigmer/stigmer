syntax = "proto3";

package ai.stigmer.agentic.file.v1;

import "ai/stigmer/agentic/file/v1/api.proto";
import "ai/stigmer/agentic/file/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// FileCommandController handles write operations for Files.
service FileCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = file;

  // Upload a File: its bytes inline, or the reference of bytes already put
  // to a URL createUploadUrl returned. Returns the File with its new id.
  //
  // With session_id, the File belongs to that conversation: whoever may
  // send it a message may upload into it, and org must be the
  // conversation's organization (FAILED_PRECONDITION otherwise). Without
  // it, the File is the uploader's own, private until shared, and any
  // member or guest of the organization may upload one.
  //
  // A file over the server's limit (500 MB unless the operator set
  // another) is refused with INVALID_ARGUMENT. An upload_ref that is
  // unknown, expired or already used is refused with FAILED_PRECONDITION,
  // and so is one whose bytes differ in size from the size createUploadUrl
  // was given.
  //
  // @internal
  // Skip-authorization: the permission depends on whether session_id is
  // set, so the handler asks it: can_create_run_in on the session, else
  // can_create_file on the organization. A staged upload is promoted by a
  // copy inside the blob store, never read back through the server.
  rpc upload(UploadFileInput) returns (File) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Mint a short-lived, single-use URL to put a file's bytes to, for a file
  // too large to upload inline. Then PUT exactly size_bytes bytes to the
  // URL and call upload with the returned upload_ref.
  //
  // A size over the server's limit is refused here, before any bytes move.
  //
  // @internal
  // Skip-authorization, authorized in the handler exactly as upload is:
  // the URL is a capability to stage bytes, so minting one asks what
  // consuming it will.
  rpc createUploadUrl(CreateFileUploadUrlInput) returns (FileUploadUrl) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Update a File's labels and tags: the fields update_mask names change,
  // every other field keeps its stored value. A File's name, type and
  // bytes never change, so any other path is refused with INVALID_ARGUMENT.
  //
  // An update is refused with ABORTED carrying a google.rpc.ErrorInfo detail
  // (domain "stigmer.ai"):
  //
  //   - ETAG_MISMATCH — resource.metadata.etag is set and the File changed
  //     since that etag was read: read it again and make the change again.
  //     No metadata.
  //   - WRITE_CONFLICT — the File kept changing while the update was being
  //     saved: try again. No metadata.
  rpc update(UpdateFileInput) returns (File) {
    option (ai.stigmer.commons.rpc.config).resource_kind = file;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "resource.metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update file";
  }

  // Update the visibility of a File.
  //
  // Setting org lets every member of the organization see the File.
  //
  // @internal
  // Authorization: can_manage_audience on the File (its owner). The level
  // is checked against the kind's VisibilityConfig.
  rpc updateVisibility(ai.stigmer.commons.apiresource.UpdateVisibilityInput) returns (File) {
    option (ai.stigmer.commons.rpc.config).resource_kind = file;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_audience;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update file visibility";
  }

  // Delete a File. Its bytes are removed once no other File shares them.
  //
  // Its uploader may delete it, and so may the owner of the conversation
  // it belongs to.
  //
  // @internal
  // Authorization: can_delete on the File. A conversation's delete and an
  // organization's purge delete its Files without this RPC.
  rpc delete(FileId) returns (File) {
    option (ai.stigmer.commons.rpc.config).resource_kind = file;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete file";
  }
}
