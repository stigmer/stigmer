syntax = "proto3";

package ai.stigmer.agentic.file.v1;

import "ai/stigmer/commons/rpc/method_options.proto";
import "buf/validate/validate.proto";

// FileMountController hands a runner the Files one turn's conversation
// holds, each with a short-lived link to its bytes. Nothing else answers a
// File's bytes to a runner.
//
// @internal
// A service of its own, apart from the File's commands and queries, so the
// one surface that answers capability links to a runner is one file to
// audit, and no SDK carries a runner-only method beside a person's. The
// authority is the runner credential the server minted for the run, not a
// permission: a runner acts as the person who owns the run, so a
// permission cannot tell it from that person.
service FileMountController {
  // The Files a run's conversation holds (SessionSpec.resources), each with
  // where the agent finds it under .stigmer/uploads/ and a link to its
  // bytes, valid for an hour.
  //
  // @internal
  // Runner-only. Skip-authorization with a handler-level gate: the bearer
  // must be the runner credential acting for this run, and the run must not
  // be finished (RunnerCredentialProvider.authorizeRunnerForRun, the
  // decision the session event log's append asks). Every other caller is
  // refused with PERMISSION_DENIED. A File the conversation no longer holds
  // as its own is left out; each link is signed for the runner's reader.
  rpc mount(MountRunFilesInput) returns (RunFileMounts) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}

// Which run's Files to mount.
message MountRunFilesInput {
  // The run's id.
  string run_id = 1 [(buf.validate.field).string.min_len = 1];
}

// RunFileMounts are the Files a run's conversation holds, ready to mount.
message RunFileMounts {
  // One per File the conversation holds, in its resources' order.
  repeated FileMount entries = 1;
}

// FileMount is one File to place under .stigmer/uploads/.
message FileMount {
  // The File's id.
  string file_id = 1;

  // Where the agent finds it, relative to .stigmer/uploads/.
  string mount_path = 2;

  // The File's name and type.
  string filename = 3;
  string mime_type = 4;

  // Its size, so the runner checks what it downloaded.
  int64 size_bytes = 5;

  // A link to its bytes, valid for an hour.
  string url = 6;
}
