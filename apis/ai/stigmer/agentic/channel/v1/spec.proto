syntax = "proto3";

package ai.stigmer.agentic.channel.v1;

import "ai/stigmer/agentic/run/v1/invocation.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";

// ChannelSpec defines the configurable properties of a channel.
//
// The fields every type shares come first: which agent serves the channel,
// whether serving is enabled, which vaults supply the agent's tool
// credentials, and the per-turn run settings. The type, exactly one of
// web, slack or whatsapp, carries what only that type declares.
//
// @internal
// Honest modeling: the type arms carry only user-declarable fields. What an
// install observes (a Slack team, a WhatsApp number's display facts) and
// what the server generates (a chat link's token) live in status, so a
// declarative apply can never clobber them. Numbers 5 to 9 are left for
// common fields to come; the type arms start at 10.
message ChannelSpec {
  option (buf.validate.message).cel = {
    id: "channel.vaults_public_web_only"
    message: "vaults can only be set on a web channel whose audience is public, or on a Slack or WhatsApp channel"
    expression: "!has(this.web) || this.web.audience == 1 || this.vaults.size() == 0"
  };
  option (buf.validate.message).cel = {
    id: "channel.run_config_public_web_only"
    message: "run_config can only be set on a web channel whose audience is public, or on a Slack or WhatsApp channel"
    expression: "!has(this.web) || this.web.audience == 1 || !has(this.run_config)"
  };

  // Reference to the agent this channel serves.
  //
  // The referenced agent must live in this channel's organization: a
  // channel offers an agent its own organization owns, billed to that
  // organization, with tool credentials bound from it. To offer another
  // organization's agent, install the plugin that carries it and make a
  // channel for the installed copy.
  //
  // A version on the reference (a tag or a content hash) is the version
  // each new conversation on this channel runs; none, or "latest", runs the
  // agent's current version when the conversation starts. A started
  // conversation keeps the version it started on.
  //
  // The agent cannot be changed after the channel is created.
  //
  // @internal
  // agent_ref.org must equal metadata.org, enforced app-level (spec-level
  // CEL cannot see metadata.org): the channel's org is the billing org and
  // its credentials resolve in that org. The stored reference holds the
  // agent's id, so it never names another agent after a slug is reused.
  ai.stigmer.commons.apiresource.ApiResourceReference agent_ref = 1 [
    (ai.stigmer.commons.apiresource.reference_kind) = agent,
    (buf.validate.field).required = true
  ];

  // Whether serving on this channel is enabled.
  //
  // Disabling is a configuration-preserving pause: a web channel keeps its
  // origins, messages, credentials and link token, and its chat link
  // answers NOT_FOUND; a Slack or WhatsApp channel keeps its install and
  // credentials, and refuses inbound messages. Delete the channel instead
  // for a full teardown.
  //
  // @internal
  // Pause must never drop an install: re-installing a Slack app to re-auth
  // is painful. Every per-turn gate re-reads this live, so disabling takes
  // effect on the next message.
  bool enabled = 2;

  // Vaults whose logins and secrets this channel's conversations use, in
  // order: the first vault holding a match wins. At most 20.
  //
  // This is how a tool-using agent becomes reachable over a channel: attach
  // a shared vault holding the needed keys (for example a read-only API
  // token). A channel's runs have no person of their own, so they use only
  // these vaults, never anyone's My vault, and a My vault cannot be
  // attached. A web channel takes vaults only when its audience is public:
  // members chatting on an organization link use their own vaults.
  //
  // @internal
  // Read by the run's credential resolver for a run whose session carries
  // the stigmer.ai/channel-id label. The reference rule asks can_use of the
  // writer for each vault a write introduces, and each run asks can_use
  // again of the account recorded in status.vault_attachers.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference vaults = 3 [
    (ai.stigmer.commons.apiresource.reference_kind) = vault,
    (buf.validate.field).repeated.max_items = 20
  ];

  // Per-turn model choice and run bounds for this channel's conversations.
  //
  // These settings are the turn's own layer: unset fields fall to the
  // agent's defaults, then to the platform's channel or guest execution
  // profile (RunConfig has the rule). A choice set here wins over the
  // agent's; max_cost_usd and max_tool_rounds can only lower the agent's
  // and the platform's caps, so a channel's owner can reduce what one turn
  // may spend, never raise it. What a sender's own request carries is
  // never read. A web channel takes run settings only when its audience is
  // public.
  //
  // @internal
  // The shared run shape (stigmer/stigmer#360), embedded directly. The
  // edition's run-lane driver loads this field server-side and hands it to
  // the server's one resolution; OSS stores and echoes it.
  ai.stigmer.agentic.run.v1.RunConfig run_config = 4;

  // How people reach the agent. Exactly one must be set, and it cannot be
  // changed after the channel is created.
  //
  // @internal
  // Type variance is configuration-shaped, not lifecycle-shaped: one kind,
  // a validated oneof (McpServerEntry.transport precedent). The install
  // state, credentials and delivery records are type-shaped, so the arm is
  // immutable (enforced in-handler).
  oneof type {
    option (buf.validate.oneof).required = true;

    // A hosted chat link and the chat widget other sites embed.
    WebChannelConfig web = 10;

    // A Slack workspace connection.
    SlackChannelConfig slack = 11;

    // A WhatsApp Business number connection (Meta Cloud API).
    WhatsAppChannelConfig whatsapp = 12;
  }
}

// WebChannelConfig is a web channel's settings: who may chat over its
// hosted link, which sites may embed it, and what visitors see when a
// limit refuses them.
//
// @internal
// Guest admission is enforced app-level in the profile, mint and
// create-time gates. A web channel writes no authorization tuples for
// visitors: a public wildcard viewer tuple would expose the referenced
// agent's full blueprint (instructions included) to any authenticated
// account, conflating blueprint visibility with chat access.
message WebChannelConfig {
  // Who can chat over this channel's link. Unspecified means the
  // organization's members: a link reaches anyone on the internet only
  // when audience is set to public. The server writes an omitted audience
  // out as org on create, update and apply, so every stored channel and
  // every echo says what it means.
  //
  // Update and apply replace the spec wholesale, so a manifest that omits
  // audience makes the link organization-only, never public.
  //
  // @internal
  // Readers ask one predicate (domain/channel `channelAdmitsAnyone`:
  // exactly public), so an unset audience reads as organization. The
  // guest mint and the anonymous profile read admit only a public channel.
  // On a server without guest sign-in, an organization link is the one a
  // signed-in reader opens; with sign-in off, every reader counts as
  // signed in.
  ChannelAudience audience = 1;

  // Origins permitted to embed this channel's chat widget.
  //
  // Each entry is an exact web origin (scheme://host[:port]) with no path,
  // for example "https://docs.example.com". An empty list allows embedding
  // from any site; listing origins restricts embedding to those sites. The
  // first-party hosted chat page is always exempt.
  //
  // @internal
  // Enforced against the embed_origin the widget reports at mintGuestToken
  // time (stamped into the guest JWT as a claim) and re-validated against
  // this live list by the guest create-time gate on every session/run
  // create, the gate that re-checks enabled, so revocation is immediate.
  // Unframed hosted-page visitors report no origin and are exempt by
  // construction. Both gates also cross-check the self-report against the
  // request's browser-enforced Origin header: for direct SDK embeds the
  // header is the authoritative origin, while requests from Stigmer's own
  // hosted page keep the widget's browser-authentic self-report as the
  // embedder signal. Exact origins only: loosening to wildcards later is a
  // non-breaking change, tightening would not be.
  repeated string allowed_origins = 2 [
    (buf.validate.field).repeated.max_items = 32,
    (buf.validate.field).repeated.items.cel = {
      id: "allowed_origins.format"
      message: "allowed_origins entries must be exact web origins like https://example.com (no path, query, or trailing slash)"
      expression: "this.matches('^https?://[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\\\\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*(:[0-9]{1,5})?$')"
    }
  ];

  // Owner-customizable copy shown to visitors when a limit refuses their
  // message. Unset fields fall back to platform defaults.
  //
  // @internal
  // Resolved server-side at the refusal point and carried in the gRPC
  // status description, deliberately not surfaced on ChannelAgentProfile
  // and not mapped client-side, so the copy reaches every client (web,
  // embed, CLI) through the existing error-message path.
  WebChannelMessages messages = 3;
}

// ChannelAudience selects who can chat over a web channel's hosted link.
//
// Unspecified is treated as org: a link reaches the internet only when
// public is chosen explicitly.
enum ChannelAudience {
  // Treated as org (audience omitted); the server stores org in its place.
  channel_audience_unspecified = 0;

  // Anyone with the link can chat, no Stigmer account required.
  // Visitors are anonymous guests; suitable only for knowledge that is
  // safe to expose to the entire internet.
  channel_audience_public = 1;

  // Only signed-in members of the channel's organization can chat.
  // Membership is checked on every conversation turn, so access ends the
  // moment a member leaves the organization. The right mode for
  // org-internal knowledge agents.
  channel_audience_org = 2;
}

// WebChannelMessages holds owner-customizable visitor-facing copy for
// limit refusals on a web channel.
//
// Empty fields mean "use the platform default". Plain text only; rendered
// verbatim in the visitor's chat surface.
message WebChannelMessages {
  // Shown when a visitor or the org exceeds the message rate limit.
  string rate_limited = 1 [(buf.validate.field).string.max_len = 300];

  // Shown when the channel cannot serve the conversation: the organization
  // holds no provider key for the agent's model or the agent's tools are
  // not ready (fails closed).
  string unavailable = 2 [(buf.validate.field).string.max_len = 300];

  // Shown when a conversation hits its turn limit or inactivity timeout.
  string conversation_ended = 3 [(buf.validate.field).string.max_len = 300];
}

// SlackChannelConfig is a Slack channel's settings.
//
// With the shared Stigmer Slack app there is nothing to declare before
// installing: the workspace identity, bot user and granted scopes are
// observed during the OAuth install and recorded in status.
//
// @internal
// Set explicitly in manifests (`slack: {}`) to satisfy the required oneof.
// Do not add OAuth-observed facts here: that is the spec-clobbering bug
// class (observed facts live in status).
message SlackChannelConfig {
  // The ChannelApp this channel installs through.
  //
  // Absent means the platform's shared Stigmer app, the zero-setup
  // default. Set it to install through your own Slack app instead: the bot
  // carries the app's name and icon, and each app is its own bot identity,
  // so several agents can serve one workspace.
  //
  // @internal
  // app_ref.org must equal metadata.org (secrets never cross orgs, the
  // agent_ref rule), and the reference is immutable while install_state is
  // installed (the workspace granted that app; switching apps requires a
  // re-install). The install flow resolves the app and fails closed on a
  // missing or wrong-provider reference.
  ai.stigmer.commons.apiresource.ApiResourceReference app_ref = 1 [(ai.stigmer.commons.apiresource.reference_kind) = channel_app];
}

// WhatsAppChannelConfig is a WhatsApp channel's settings: the Business
// phone number it serves, the Meta app it installs through, and whether the
// agent may message first.
//
// Installing validates the number against the Meta Cloud API and records
// the observed facts in status.
//
// @internal
// phone_number_id lives in spec because it is user-declared (a WABA holds
// many numbers; the owner picks which one this agent serves). The install
// flow echoes it into status.whatsapp as the routing and uniqueness fact,
// mirroring status.slack.team_id.
message WhatsAppChannelConfig {
  // Phone number ID of the WhatsApp Business number this channel serves,
  // from Meta's WhatsApp Manager (API Setup), e.g. "106540352242922".
  //
  // This is the Cloud API's identifier for the number, not the phone
  // number itself.
  string phone_number_id = 1 [(buf.validate.field).string.min_len = 1];

  // The ChannelApp (your own Meta app) this channel installs through.
  // Required: there is no shared platform WhatsApp app.
  //
  // @internal
  // Required app-level by the defaults step with its own refusal copy, not
  // by a protovalidate rule, so the refusal says what to do. app_ref.org
  // must equal metadata.org, and the reference is immutable while
  // install_state is installed.
  ai.stigmer.commons.apiresource.ApiResourceReference app_ref = 2 [(ai.stigmer.commons.apiresource.reference_kind) = channel_app];

  // Whether the agent may send business-initiated (proactive) messages on
  // this channel. Off by default: a channel is reply-only until its owner
  // grants this.
  //
  // @internal
  // The owner's consent lever, alongside the platform's own. The edition's
  // messaging driver lists a channel for proactive sends only when it is an
  // installed, enabled WhatsApp channel with this flag set, so an agent
  // with no proactive channel is offered nowhere to send.
  bool proactive_messaging_enabled = 3;
}
