syntax = "proto3";

package ai.stigmer.agentic.channel.v1;

import "ai/stigmer/agentic/channel/v1/spec.proto";
import "ai/stigmer/agentic/channel/v1/status.proto";
import "ai/stigmer/commons/apiresource/metadata.proto";
import "buf/validate/validate.proto";

// Channel is a way people reach an agent: a chat link, a Slack workspace or a WhatsApp number.
//
// The channel's type (spec.web, spec.slack or spec.whatsapp) says how
// people reach the agent. Every type records which agent serves the
// channel, whether serving is enabled, the vaults that supply the agent's
// tool credentials, and the per-turn run settings. A web channel is a
// hosted chat link (`/chat/<channel id>`) and the widget sites embed; a
// Slack or WhatsApp channel is a connection the provider delivers messages
// to, whose workspace identity and credentials come from the install flow
// and live in status. Disabling pauses serving and keeps the
// configuration; deleting tears it down. Deleting the agent deletes its
// channels. Channel operations never modify the referenced agent.
//
// @internal
// One kind for every way an agent is reached, typed by spec's oneof (the
// shape of a bot's channels in Azure Bot Service). metadata.org is the
// billing org. A nameless channel takes the slug `<agent slug>-<type>`;
// a named one takes its own, and rename moves it. The hosted chat link
// carries metadata.id, never an org or slug, so no rename or later name
// holder can move it. Ids minted while chat links and connections were two
// kinds keep their ash_ and ach_ prefixes (the kind's retired prefixes).
// The overview.md file provides the SDK-facing description and example
// YAML.
message Channel {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = 'agentic.stigmer.ai/v1'];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = 'Channel'];

  // Resource metadata including name, organization, and labels.
  //
  // The id forms a web channel's hosted chat link (`/chat/<channel id>`).
  // To retire a leaked link while keeping the channel, lock it with
  // rotateLink.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // Configurable properties: the agent, enablement, credentials, run settings and the type's own settings.
  ChannelSpec spec = 4;

  // System-managed state: the link token or the install facts, vault attachers, and the audit trail.
  ChannelStatus status = 5;
}
