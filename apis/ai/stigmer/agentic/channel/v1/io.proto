syntax = "proto3";

package ai.stigmer.agentic.channel.v1;

import "ai/stigmer/agentic/channel/v1/api.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";

// ChannelId wraps a channel identifier.
message ChannelId {
  // Unique identifier of the channel.
  string value = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];
}

// Input for listing channels within an organization.
message ListChannelsRequest {
  // Organization slug to scope the listing.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];

  // Only resources carrying every label given, each matched exactly (AND).
  // A selective filter may answer short pages, even empty ones, that still
  // carry a token.
  map<string, string> labels = 4;
}

// Input for retrieving all channels of a specific agent.
message ListChannelsByAgentRequest {
  // Identifier of the agent whose channels to retrieve.
  string agent_id = 1 [(buf.validate.field).required = true];

  // Organization slug to scope the results to.
  //
  // When set, only channels whose metadata.org matches are returned: the
  // org-context view a console tab needs. When empty, results are bounded
  // only by the caller's view permissions, which for a member of several
  // organizations spans all of them.
  //
  // @internal
  // Optional by design: cross-org administrative flows rely on the
  // permission-bounded behavior. Filtering happens in the query step of
  // each edition's handler, never client-side.
  string org = 2;

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 3 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 4 [(buf.validate.field).string.max_len = 1024];

  // Only resources carrying every label given, each matched exactly (AND).
  // A selective filter may answer short pages, even empty ones, that still
  // carry a token.
  map<string, string> labels = 5;
}

// Response containing a paginated list of channels.
message ChannelList {
  // Channels in the current page.
  repeated Channel entries = 1;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 2;
}

// The changes an update makes to a channel: the fields update_mask names,
// taken from resource.
message UpdateChannelInput {
  option (buf.validate.message).cel = {
    id: "update_names_its_target"
    message: "resource.metadata.id is required: an update names the channel by its id"
    expression: "has(this.resource) && has(this.resource.metadata) && this.resource.metadata.id != ''"
  };

  // The channel carrying the new values, named by metadata.id. Only the
  // fields update_mask names are read, so the others may be left empty; the
  // result is validated as a whole.
  Channel resource = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The paths the update changes, as proto field names (spec.enabled,
  // metadata.labels). A list or map at a named path is replaced whole; "*"
  // names every path an update may change.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}

// Input for rotating a web channel's link token.
//
// The server generates the new token (callers never supply one), and the
// previous link stops working the moment the rotation persists.
message RotateChannelLinkInput {
  // ID of the web channel whose link token is being rotated.
  string resource_id = 1 [(buf.validate.field).required = true];
}

// Input for resolving a web channel's public agent profile.
//
// Identifies the channel by its id, the one identity a hosted chat link
// carries (`/chat/<channel id>`), plus the link token when the link
// carries one. A channel id never changes and is never reused, so a link
// cannot be broken by a rename of the channel's organization or captured
// by a later holder of that organization's name.
message GetChannelAgentProfileRequest {
  // Id of the channel, from the hosted chat link.
  string channel_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];

  // Link token from the chat link's `?k=` parameter.
  //
  // Required (and validated) only when the link has been locked with
  // rotateLink; ignored for plain links.
  string link_token = 2 [(buf.validate.field).string.max_len = 128];
}

// ChannelAgentProfile is the public projection of the agent a web channel
// serves.
//
// Returned to visitors of the hosted chat page. It is deliberately
// trimmed: the full Agent resource carries the system prompt
// (spec.instructions) and MCP server wiring, none of which may leak to
// anyone-with-link callers. The profile carries only what the hosted chat
// page needs to render a header and start a session.
message ChannelAgentProfile {
  // Id of the organization that owns the channel. The hosted chat page
  // creates the visitor's session in it.
  string org = 1;

  // Slug of the channel: its name within its organization, as the CLI and
  // getByReference address it. The hosted chat link names the channel by
  // its id, never by this slug.
  string slug = 2;

  // Human-readable agent name for the chat page header.
  string name = 3;

  // Human-readable agent description for the chat page header.
  string description = 4;

  // Agent icon URL for the chat page header.
  string icon_url = 5;

  // The channel's agent reference (spec.agent_ref): the hosted chat page
  // starts the visitor's session on exactly this reference, version
  // included. This is a name, not a capability: session creation still
  // requires an authorized token, and the edition's guest gate admits a
  // session only on this channel's agent.
  ai.stigmer.commons.apiresource.ApiResourceReference agent_ref = 6 [(ai.stigmer.commons.apiresource.reference_kind) = agent];
}

// Input for starting a Slack or WhatsApp channel's install flow.
message InitiateChannelInstallInput {
  // ID of the channel to install.
  string resource_id = 1 [(buf.validate.field).required = true];
}

// Output of the initiate-install RPC.
//
// Two install styles share this output. For redirect-installed providers
// (Slack) the caller redirects the user to authorization_url; the provider
// redirects back to the console, which completes the install with the
// completeInstall RPC. For direct-installed providers (WhatsApp) the
// install completes inside this RPC: completed is true and there is
// nothing to redirect to; refresh the channel to see its install facts.
message InitiateChannelInstallOutput {
  // Provider authorization URL to redirect the installing user to
  // (for Slack: the "Add to Slack" consent screen). Empty when the
  // install completed directly.
  string authorization_url = 1;

  // Single-use opaque state parameter bound to this install attempt.
  // Empty when the install completed directly.
  //
  // @internal
  // Persisted server-side and consumed atomically by completeInstall;
  // expired or replayed states are rejected.
  string state = 2;

  // True when the install completed synchronously inside this RPC
  // (direct-installed providers). Clients branch on this field, never on
  // provider knowledge of their own, so the server stays the single
  // source of install-style truth.
  bool completed = 3;
}

// Input for completing a Slack channel's install flow.
//
// Carries the state and authorization code the provider's consent
// redirect delivered to the console.
message CompleteChannelInstallInput {
  // ID of the channel being installed.
  string resource_id = 1 [(buf.validate.field).required = true];

  // Single-use state parameter issued by initiateInstall.
  string state = 2 [(buf.validate.field).required = true];

  // Authorization code returned by the provider's consent screen.
  string code = 3 [(buf.validate.field).required = true];
}
