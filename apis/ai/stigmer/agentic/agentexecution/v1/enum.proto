syntax = "proto3";

package ai.stigmer.agentic.agentexecution.v1;

// ExecutionPhase defines the lifecycle phase of an agent execution.
//
// Phase Transitions:
//
// Normal flow:
// EXECUTION_PENDING → EXECUTION_IN_PROGRESS → EXECUTION_COMPLETED
//
// Failure flow:
// EXECUTION_PENDING → EXECUTION_IN_PROGRESS → EXECUTION_FAILED
//
// Termination flow (platform-initiated stop):
// EXECUTION_IN_PROGRESS → EXECUTION_TERMINATED
//
// Approval flow (HITL):
// EXECUTION_IN_PROGRESS → EXECUTION_WAITING_FOR_APPROVAL → EXECUTION_IN_PROGRESS
//
// Pause/Resume flow:
// EXECUTION_IN_PROGRESS → EXECUTION_PAUSED → EXECUTION_IN_PROGRESS
//
// Terminal States:
// - EXECUTION_COMPLETED: Agent finished successfully
// - EXECUTION_FAILED: Agent encountered an unexpected error
// - EXECUTION_TERMINATED: Platform stopped the agent (stall, budget, or force-kill)
// - EXECUTION_CANCELLED: User gracefully stopped the agent
//
// Non-Terminal States:
// - EXECUTION_WAITING_FOR_APPROVAL: Awaiting user approval for tool
// - EXECUTION_PAUSED: Temporarily paused, can be resumed
enum ExecutionPhase {
  // Default value, not a valid execution phase.
  EXECUTION_PHASE_UNSPECIFIED = 0;

  // Execution is queued and waiting for a worker to start processing.
  EXECUTION_PENDING = 1;

  // Execution is actively running — the agent is processing and producing output.
  EXECUTION_IN_PROGRESS = 2;

  // Execution finished successfully and the agent produced a final response.
  EXECUTION_COMPLETED = 3;

  // Execution encountered an unexpected error and could not finish.
  EXECUTION_FAILED = 4;

  // Execution was gracefully stopped by the user before it finished.
  EXECUTION_CANCELLED = 5;

  // Execution was stopped by the platform.
  //
  // Unlike CANCELLED (user-initiated graceful stop) and FAILED (unexpected
  // error), TERMINATED means the platform intentionally stopped this
  // execution — either via automated safety mechanisms or user-initiated
  // force-kill.
  //
  // Terminal state — execution will not change phases again.
  //
  // When this phase is reached:
  // - completed_at timestamp is set
  // - error field contains the termination reason
  //
  // Trigger paths:
  // - Internal (activity-level): stall timeout (agent unresponsive),
  //   tool-call budget exhausted (GraphRecursionError). LangGraph
  //   checkpoint is valid; the user can continue via follow-up message.
  // - External (Terminate RPC): user or system force-kills the Temporal
  //   workflow. LangGraph checkpoint may be incomplete.
  //
  // Use Cases:
  // - Agent stalled — no events for the configured timeout
  // - Agent exhausted its tool-call budget (recursion limit)
  // - Force-stop stuck agents that don't respond to cancellation
  // - Kill agents consuming excessive resources
  //
  // Terminated vs Cancelled vs Failed:
  // - Terminated: Platform stopped it (automated or force-kill)
  // - Cancelled: User gracefully stopped it (checkpoint saved)
  // - Failed: Something broke unexpectedly (exception, crash)
  //
  // @since Agent Execution Lifecycle
  EXECUTION_TERMINATED = 8;

  // Blocked on tool approval (HITL Phase 1).
  //
  // The agent has encountered a tool that requires user approval before execution.
  // When in this phase:
  // - status.pending_approval contains details about the tool awaiting approval
  // - User must call SubmitApproval RPC to continue
  //
  // This is NOT a terminal state - execution resumes after approval decision:
  // - APPROVE: Tool executes, phase returns to EXECUTION_IN_PROGRESS
  // - SKIP: Tool returns skip message, phase returns to EXECUTION_IN_PROGRESS
  // - REJECT: Execution fails, phase transitions to EXECUTION_FAILED
  //
  // UI should show distinct treatment for this phase (e.g., approval dialog).
  EXECUTION_WAITING_FOR_APPROVAL = 6;

  // Execution was paused by user and can be resumed.
  //
  // The execution was temporarily stopped at a checkpoint and can continue
  // from where it left off. Unlike CANCELLED, the execution is not terminal.
  //
  // Pause flow:
  // EXECUTION_IN_PROGRESS → EXECUTION_PAUSED
  //
  // Resume flow:
  // EXECUTION_PAUSED → EXECUTION_IN_PROGRESS
  //
  // NOT a terminal state - execution can be resumed.
  //
  // When this phase is reached:
  // - Running activities are gracefully cancelled
  // - LangGraph checkpoints are saved (thread_id preserved)
  // - No completed_at timestamp (execution is not finished)
  //
  // Resume behavior:
  // - Activity is re-invoked with same thread_id
  // - LangGraph loads from checkpoint automatically
  // - Execution continues from where it was paused
  //
  // @since Gap A3 (Pause/Resume Propagation)
  EXECUTION_PAUSED = 7;
}

// MessageType defines the type of message in the conversation.
enum MessageType {
  // Default value, not a valid message type.
  MESSAGE_TYPE_UNSPECIFIED = 0;

  // A message sent by the user to the agent.
  MESSAGE_HUMAN = 1;

  // A response generated by the AI agent.
  MESSAGE_AI = 2;

  // The result returned by a tool after execution.
  MESSAGE_TOOL = 3;

  // A system-generated message injected by the platform (e.g., budget warnings, summarization notices).
  MESSAGE_SYSTEM = 4;

  // Reasoning/thinking content from the model.
  //
  // Emitted by models with extended thinking enabled (e.g., Claude with
  // thinking, Cursor's thinking events). Contains the model's internal
  // reasoning that is distinct from the final assistant response.
  //
  // Rendered distinctly from assistant text in the UI (e.g., collapsible
  // thinking block with subdued styling).
  MESSAGE_THINKING = 5;
}

// ToolCallStatus defines the status of a tool call.
//
// Status Transitions:
//
// Normal flow (no approval required):
// TOOL_CALL_PENDING → TOOL_CALL_RUNNING → TOOL_CALL_COMPLETED
//
// Failure flow:
// TOOL_CALL_PENDING → TOOL_CALL_RUNNING → TOOL_CALL_FAILED
//
// Approval flow (HITL):
// TOOL_CALL_PENDING → TOOL_CALL_WAITING_APPROVAL → TOOL_CALL_RUNNING → TOOL_CALL_COMPLETED
//                                                ↘ TOOL_CALL_SKIPPED (if user skips)
//
// Terminal States:
// - TOOL_CALL_COMPLETED: Tool executed successfully
// - TOOL_CALL_FAILED: Tool execution failed
// - TOOL_CALL_SKIPPED: User chose to skip this tool (HITL)
enum ToolCallStatus {
  // Default value, not a valid tool call status.
  TOOL_CALL_STATUS_UNSPECIFIED = 0;

  // Tool call is queued and waiting to execute.
  TOOL_CALL_PENDING = 1;

  // Tool is currently executing.
  TOOL_CALL_RUNNING = 2;

  // Tool executed successfully and returned a result.
  TOOL_CALL_COMPLETED = 3;

  // Tool execution failed with an error.
  TOOL_CALL_FAILED = 4;

  // Blocked on user approval (HITL Phase 1).
  //
  // The tool requires user consent before execution. This status is set when:
  // - Tool has requires_approval=true (from approval policy chain)
  // - AgentExecutionSpec.auto_approve_all is false
  //
  // While in this status:
  // - ToolCall.approval_message contains the approval prompt
  // - ToolCall.approval_requested_at is set
  // - ExecutionPhase is EXECUTION_WAITING_FOR_APPROVAL
  //
  // Transitions:
  // - APPROVE → TOOL_CALL_RUNNING → TOOL_CALL_COMPLETED/FAILED
  // - SKIP → TOOL_CALL_SKIPPED
  // - REJECT → Execution fails (tool remains in WAITING_APPROVAL)
  TOOL_CALL_WAITING_APPROVAL = 5;

  // User skipped this tool (HITL Phase 1).
  //
  // Terminal state indicating the user chose not to execute this tool.
  // When a tool is skipped:
  // - The LLM receives a message: "Tool '{name}' was skipped by user"
  // - Execution continues without this tool's result
  // - The LLM can adapt its plan accordingly
  //
  // This is a terminal state - the tool will not be retried.
  // Unlike FAILED, SKIPPED is an intentional user decision, not an error.
  TOOL_CALL_SKIPPED = 6;
}

// ToolKind is the harness-agnostic category of a tool call.
//
// Both execution harnesses emit tool calls with engine-specific names — the
// native (deepagents) harness uses snake_case (edit_file, execute, grep), while
// the Cursor harness uses PascalCase (StrReplace, Shell, Grep). ToolKind
// normalizes that identity once, in the runner, so every client (web, desktop,
// CLI, Ink) renders a tool the same way regardless of which harness produced it.
//
// This is identity, not presentation: it answers "what kind of tool is this?"
// and is deliberately distinct from ToolCallStreamingSource, which describes an
// orthogonal streaming capability. Result formatting is a client concern and is
// intentionally not encoded here.
//
// TOOL_KIND_UNSPECIFIED means the runner did not classify the tool — either the
// execution predates this field, or the tool does not fit a known kind. Clients
// fall back to a tool-name lookup in that case, so legacy executions still
// render correctly.
enum ToolKind {
  // Not classified. Legacy executions (persisted before this field existed) and
  // tools with no known kind. Clients fall back to a name-based resolver.
  TOOL_KIND_UNSPECIFIED = 0;

  // Read a file's contents. Native: read, read_file. Cursor: Read.
  TOOL_KIND_FILE_READ = 1;

  // Create or overwrite an entire file. Native: write_file, create_file.
  // Cursor: Write.
  TOOL_KIND_FILE_WRITE = 2;

  // Modify part of an existing file. Native: edit_file, str_replace_editor.
  // Cursor: StrReplace, EditNotebook.
  TOOL_KIND_FILE_EDIT = 3;

  // Delete a file. Native: delete_file, remove_file. Cursor: Delete.
  TOOL_KIND_FILE_DELETE = 4;

  // Execute a shell command. Native: execute, shell. Cursor: Shell.
  TOOL_KIND_SHELL = 5;

  // Search file contents or names. Native: grep, glob. Cursor: Grep, Glob,
  // SemanticSearch.
  TOOL_KIND_SEARCH = 6;

  // List a directory. Native: ls, list_directory.
  TOOL_KIND_LIST = 7;

  // Fetch the contents of a URL. Cursor: WebFetch.
  TOOL_KIND_FETCH = 8;

  // Search the web. Cursor: WebSearch.
  TOOL_KIND_WEB_SEARCH = 9;

  // Record model reasoning via a think tool. Native: think.
  TOOL_KIND_THINK = 10;

  // Manage the agent's todo list. Native: write_todos. Cursor: TodoWrite.
  // Typically rendered through a dedicated todo surface, not the tool thread.
  TOOL_KIND_TODO = 11;

  // Delegate work to a sub-agent. Native/Cursor: task/Task. Rendered as a
  // nested thread, not via the standard tool result view.
  TOOL_KIND_SUBAGENT = 12;

  // A tool provided by an MCP server. The server is identified by
  // ToolCall.mcp_server_slug; the tool's bare name is in ToolCall.name.
  TOOL_KIND_MCP = 13;
}

// TodoStatus defines the status of a todo item.
enum TodoStatus {
  // Default value, not a valid todo status.
  TODO_STATUS_UNSPECIFIED = 0;

  // Task has not been started yet.
  TODO_PENDING = 1;

  // Task is currently being worked on by the agent.
  TODO_IN_PROGRESS = 2;

  // Task was completed successfully.
  TODO_COMPLETED = 3;

  // Task was cancelled and is no longer needed.
  TODO_CANCELLED = 4;
}

// SubAgentStatus defines the status of a sub-agent execution.
//
// Status Transitions:
//
// Normal flow:
// SUB_AGENT_PENDING → SUB_AGENT_IN_PROGRESS → SUB_AGENT_COMPLETED
//
// Failure flow:
// SUB_AGENT_IN_PROGRESS → SUB_AGENT_FAILED
//
// Cancellation flow (parent cancelled while sub-agent active):
// SUB_AGENT_IN_PROGRESS → SUB_AGENT_CANCELLED
//
// Terminal States:
// - SUB_AGENT_COMPLETED: Sub-agent finished successfully
// - SUB_AGENT_FAILED: Sub-agent encountered an error
// - SUB_AGENT_CANCELLED: Parent execution was cancelled while sub-agent was active
enum SubAgentStatus {
  // Default value, not a valid sub-agent status.
  SUB_AGENT_STATUS_UNSPECIFIED = 0;

  // Sub-agent invocation is queued and waiting to start.
  SUB_AGENT_PENDING = 1;

  // Sub-agent is actively executing its delegated task.
  SUB_AGENT_IN_PROGRESS = 2;

  // Sub-agent finished its task successfully and returned a result.
  SUB_AGENT_COMPLETED = 3;

  // Sub-agent encountered an error and could not complete its task.
  SUB_AGENT_FAILED = 4;

  // Parent execution was cancelled while this sub-agent was active.
  //
  // When a parent execution is cancelled (via user action or system timeout),
  // all active sub-agents transition to this terminal state. This prevents
  // sub-agents from remaining in IN_PROGRESS indefinitely in persisted status.
  //
  // When this status is reached:
  // - completed_at timestamp is set
  // - error field contains: "Cancelled: parent execution was cancelled"
  //
  // @since Sub-Agent Execution Streamline
  SUB_AGENT_CANCELLED = 5;
}

// ExecutionArtifactKind defines the type of artifact published by an agent.
//
// When an agent publishes a file, it's stored as-is.
// When an agent publishes a directory, it's archived as a ZIP file.
enum ExecutionArtifactKind {
  // Default value, not a valid artifact kind.
  EXECUTION_ARTIFACT_KIND_UNSPECIFIED = 0;

  // A single file published by the agent.
  EXECUTION_ARTIFACT_KIND_FILE = 1;

  // A directory published by the agent, archived as a ZIP file for download.
  EXECUTION_ARTIFACT_KIND_DIRECTORY = 2;
}

// SummarizationSource identifies what triggered a context summarization event.
//
// Context summarization can be triggered at two points during execution:
// - At graph start, when resuming a conversation that already exceeds the threshold
// - Mid-execution, when accumulated tool responses push context past the threshold
//
// This distinction enables the CLI to render appropriate notifications and
// allows monitoring to track compaction frequency by trigger type.
enum SummarizationSource {
  // Default value, not a valid summarization source.
  SUMMARIZATION_SOURCE_UNSPECIFIED = 0;

  // Summarization triggered at the start of processing, when resuming a conversation that already exceeds the token threshold.
  graph_start = 1;

  // Summarization triggered mid-execution, when accumulated tool responses push context past the token threshold.
  mid_execution = 2;
}

// ToolCallStreamingSource identifies what is currently being streamed on a
// tool call.
//
// Input streaming and output streaming are independent, universal capabilities
// of any tool — not categories of tools:
//
// - INPUT: The LLM is generating the tool's arguments. For tools where the
//   argument content is interesting to the user (file content being written,
//   thought text), tokens stream to the UI as they are produced.
//
// - OUTPUT: The tool is executing and producing output progressively. For
//   tools where the output is interesting (shell commands, long-running
//   processes), output chunks stream to the UI as they arrive.
//
// Any tool can have either, both, or neither. This enum tells consumers
// which streaming phase is active so they render correctly without
// client-side heuristics.
//
// Lifecycle:
//   Early tool call creation → streaming_source = INPUT
//   on_tool_start (reconcile) → streaming_source = UNSPECIFIED
//   tool_progress event      → streaming_source = OUTPUT
//   on_tool_end              → streaming_source = UNSPECIFIED
enum ToolCallStreamingSource {
  // No active streaming, or streaming has completed.
  TOOL_CALL_STREAMING_SOURCE_UNSPECIFIED = 0;

  // The LLM is generating the tool's arguments. result contains partial
  // content extracted from the in-progress argument JSON (e.g., file content
  // for a write tool, thought text for a think tool).
  TOOL_CALL_STREAMING_SOURCE_INPUT = 1;

  // The tool is executing and producing output progressively. result
  // contains accumulated output chunks (e.g., shell command stdout).
  TOOL_CALL_STREAMING_SOURCE_OUTPUT = 2;
}

// ExecutionControlSignal is a platform-to-runner directive returned by the
// updateStatus RPC. The runner inspects this signal after every status
// update and acts accordingly.
//
// Signal sources are opaque to the runner — the platform may set STOP due
// to credit exhaustion, an admin kill, a user-configured budget cap, or any
// future enforcement mechanism. The runner does not know or care about the
// source; it only reacts to the signal value.
enum ExecutionControlSignal {
  // No action required — continue execution normally.
  EXECUTION_CONTROL_SIGNAL_UNSPECIFIED = 0;

  // Execution must stop gracefully. The runner should block further tool
  // calls and give the model one final turn to produce a summary.
  EXECUTION_CONTROL_SIGNAL_STOP = 1;

  // Informational warning (e.g. low credit balance). The runner logs the
  // warning and continues execution.
  EXECUTION_CONTROL_SIGNAL_WARNING = 2;
}

// ApprovalAction represents the user's decision on an approval request.
//
// ## Action Semantics
//
// - APPROVE: Execute the tool normally, continue execution
// - SKIP: Return "skipped by user" message to LLM, continue execution
// - REJECT: Fail the execution immediately with rejection error
//
// ## LLM Behavior on Skip
//
// When a tool is skipped, the LLM receives a message like:
// "Tool 'delete_repository' was skipped by user. Please proceed without this operation."
// This allows the LLM to adapt its plan while preserving execution continuity.
//
// ## Usage
//
// Used in:
// - ToolCall.approval_action: Records the decision made
// - SubmitApprovalInput.action: User's submitted decision
enum ApprovalAction {
  // Unspecified action (invalid, should never be used).
  // SubmitApproval RPC rejects this value.
  APPROVAL_ACTION_UNSPECIFIED = 0;

  // Execute the tool normally.
  // Tool transitions from WAITING_APPROVAL to RUNNING, then executes.
  // Execution phase returns to IN_PROGRESS.
  APPROVAL_ACTION_APPROVE = 1;

  // Skip tool execution, continue without it.
  // Tool transitions to SKIPPED status.
  // LLM receives: "Tool '{name}' was skipped by user. Please proceed without this operation."
  // Execution continues - this is NOT a failure.
  APPROVAL_ACTION_SKIP = 2;

  // Reject tool execution, fail the entire execution.
  // Execution phase transitions to FAILED.
  // Error message includes rejection reason from user's comment.
  APPROVAL_ACTION_REJECT = 3;

  // Approve this tool call AND grant a run-lifetime lease that auto-approves
  // every subsequent tool call of the SAME class for the rest of this execution
  // ("approve all of this kind, don't ask again").
  //
  // This is the gate-time, scoped analog of AgentExecutionSpec.auto_approve_all:
  // it lets a human escalate from per-call approval to "trust this whole class"
  // at the moment of friction, without pre-arming a global bypass. The lease is
  // scoped to one class — a built-in approval category (write / delete / shell,
  // with write and edit collapsed) or a single MCP server — never the whole run.
  //
  // ## Canonical contract (every layer derives its behavior from this)
  //
  // 1. Control plane (SubmitApproval handler): record APPROVE_ALL on the clicked
  //    tool call, and resolve any other still-pending tool call that shares the
  //    clicked call's class — including sub-agent tool calls — to
  //    APPROVAL_ACTION_APPROVE. Pending tool calls of a DIFFERENT class stay in
  //    TOOL_CALL_WAITING_APPROVAL so the gate still holds for them. This keeps
  //    the audit trail honest: every tool that runs carries an explicit
  //    approval_action.
  //
  // 2. Runner (native + cursor harness): the lease is derived on read from the
  //    persisted APPROVE_ALL decision plus the tool's class — there is no
  //    separately stored lease. On reinvocation, a new tool call (or sub-agent
  //    tool call) whose class matches an active lease skips the approval gate; a
  //    tool call of any other class is still gated. The interrupted tool itself
  //    resumes as an approval.
  //
  // ## Scope
  //
  // The lease covers the rest of THIS execution and only the matched class. It
  // is NOT persisted to the session or the agent; a subsequent execution starts
  // gated again unless the caller sets it anew (interactive clients may carry a
  // session-scoped preference forward in-memory, but that is a client concern,
  // not server-persisted state). AgentExecutionSpec.auto_approve_all remains the
  // single, explicit whole-run global bypass.
  //
  // ## Audit
  //
  // Because it bypasses subsequent same-class approval checks, executions
  // containing an APPROVE_ALL decision should be auditable. The decision is
  // recorded on ToolCall.approval_action like any other; the policy layer that
  // cleared each subsequent call is recorded on ToolCall.approval_policy_source
  // (APPROVAL_POLICY_SOURCE_APPROVAL_LEASE).
  APPROVAL_ACTION_APPROVE_ALL = 4;
}

// ApprovalPolicySource is the policy layer that decided a tool call's approval
// requirement — the provenance recorded on every gated or auto-approved tool
// call so an execution's authorizations are auditable.
//
// Set by the runner at the approval gate (the one component that evaluates the
// merged policy) and persisted on ToolCall.approval_policy_source, exactly as
// ToolCall.tool_kind is set and persisted. Clients render it to answer "why was
// this tool gated or auto-approved?".
//
// @internal
// Mirrors the runner's internal PolicySource union (approval-policy.ts) one for
// one. Layered precedence: a pinned or agent override wins over the classifier
// default; a lease or the global bypass clears an otherwise-required approval.
enum ApprovalPolicySource {
  // Default — the execution predates this field, or the tool was never evaluated
  // by the approval gate (e.g. a read-only built-in). Clients show no provenance.
  APPROVAL_POLICY_SOURCE_UNSPECIFIED = 0;

  // Layer 1: the connect-time classifier's default for an MCP tool
  // (McpServerStatus.tool_approvals).
  APPROVAL_POLICY_SOURCE_CLASSIFIER_DEFAULT = 1;

  // Layer 2: an operator's pinned override on the MCP server blueprint
  // (McpServerSpec.pinned_tool_approvals).
  APPROVAL_POLICY_SOURCE_PINNED_OVERRIDE = 2;

  // Layer 3: an agent-level override for an MCP tool
  // (Agent McpServerUsage.tool_approval_overrides).
  APPROVAL_POLICY_SOURCE_AGENT_OVERRIDE = 3;

  // Layer 4: the pre-armed AgentExecutionSpec.auto_approve_all whole-run global
  // bypass cleared this call.
  APPROVAL_POLICY_SOURCE_AUTO_APPROVE_ALL = 4;

  // Layer 4: a run-lifetime scoped lease (the successor to a global "approve
  // all"; see APPROVAL_ACTION_APPROVE_ALL) cleared this call because it matched
  // the leased class.
  APPROVAL_POLICY_SOURCE_APPROVAL_LEASE = 5;

  // A non-MCP built-in tool gated by the shared tool taxonomy
  // (write / delete / shell).
  APPROVAL_POLICY_SOURCE_BUILTIN_CATEGORY = 6;

  // The connect-time MCP destructiveHint tightener forced this tool to require
  // approval, overriding a more permissive classifier verdict. First-class
  // provenance so a tightened tool is distinguishable from a plain classifier
  // default. See applyDestructiveHintTightener.
  APPROVAL_POLICY_SOURCE_ANNOTATION_DESTRUCTIVE_TIGHTEN = 7;
}

// ApprovalEventType is the kind of event in the append-only approval-event
// stream (see ApprovalEvent in approval.proto).
//
// The event stream is the future single source of truth for HITL approvals. In
// Phase 1 of the approval re-architecture it is computed in *shadow* beside the
// existing message-scan projection (PendingApproval) and compared for parity in
// CI — it never feeds the UI yet, so introducing it changes no behavior.
//
// The set covers every way an approval request resolves: the three user
// decisions (APPROVED / REJECTED / SKIPPED) plus RETRACTED — the platform
// withdrawing an in-flight request whose gated call became unreachable before a
// decision. Together they make the lifecycle total, which is what lets the
// event-stream projection stand on its own. Lease-expiry events remain
// intentionally omitted until a component emits them; enums extend additively,
// so adding them later is non-breaking.
//
// event_type is the coarse lifecycle bucket; the precise user action (including
// APPROVE_ALL, which buckets as APPROVED) lives on ApprovalDecision.action.
enum ApprovalEventType {
  // Default value, not a valid event type.
  APPROVAL_EVENT_TYPE_UNSPECIFIED = 0;

  // A tool call was gated and is awaiting a user decision.
  // Payload: ApprovalRequest.
  APPROVAL_EVENT_TYPE_REQUESTED = 1;

  // The user approved the request (APPROVE or APPROVE_ALL); the tool may run.
  // Payload: ApprovalDecision.
  APPROVAL_EVENT_TYPE_APPROVED = 2;

  // The user rejected the request; the execution fails.
  // Payload: ApprovalDecision.
  APPROVAL_EVENT_TYPE_REJECTED = 3;

  // The user skipped the request; execution continues without the tool.
  // Payload: ApprovalDecision.
  APPROVAL_EVENT_TYPE_SKIPPED = 4;

  // The platform withdrew the request before any user decision because the gated
  // call became unreachable while the execution was still live — its sub-agent
  // reached a terminal state, or the call was superseded on resume. This is the
  // system-actored terminal transition that makes the lifecycle total: a
  // REQUESTED is resolved by exactly one of APPROVED / REJECTED / SKIPPED (user
  // decisions) or RETRACTED (platform withdrawal). It is distinct from SKIPPED so
  // the audit trail never conflates "the human skipped this" with "the platform
  // withdrew it." Terminal-execution gate-exits (cancel / fail / terminate) are
  // NOT modeled as per-call events — a terminal execution simply projects to zero
  // pending approvals — so RETRACTED is reserved for the in-flight, per-call case.
  // Payload: ApprovalRetraction.
  APPROVAL_EVENT_TYPE_RETRACTED = 5;
}

// ApprovalRetractionReason explains why the platform withdrew an in-flight
// approval request (an APPROVAL_EVENT_TYPE_RETRACTED event). It is audit-trail
// metadata — it answers the user's question "why did my approval disappear?" —
// and never affects control flow.
enum ApprovalRetractionReason {
  // Default value, not a valid reason.
  APPROVAL_RETRACTION_REASON_UNSPECIFIED = 0;

  // The gated call's sub-agent reached a terminal state (completed, failed, or
  // cancelled) before the call was decided, orphaning the request.
  APPROVAL_RETRACTION_REASON_SUB_AGENT_TERMINAL = 1;

  // The gated call left the approval gate without a decision (the harness
  // advanced past it or abandoned it on resume) while the execution was still
  // live.
  APPROVAL_RETRACTION_REASON_SUPERSEDED = 2;
}

// InteractionMode controls the agent's behavioral posture for an execution.
//
// Determines what the agent is allowed to do — analysis only, or full
// read-write access. Mode is set per-execution via ExecutionConfig and
// does not carry over between executions.
//
// Enforcement:
// - Native harness (LangGraph): tool-level enforcement — write tools are
//   removed from the tool set in PLAN mode.
// - Cursor harness: best-effort via system prompt injection. The Cursor SDK
//   does not expose a mode parameter, so the agent is instructed not to
//   make changes. When the SDK adds native mode support, the prompt-based
//   approach will be replaced.
enum InteractionMode {
  // Default — resolves to INTERACTION_MODE_AGENT.
  INTERACTION_MODE_UNSPECIFIED = 0;

  // Full agent mode with unrestricted tool access.
  //
  // The agent can read, write, create, edit, and delete files; run shell
  // commands; and invoke any configured tool. This is the standard
  // execution mode for interactive sessions.
  INTERACTION_MODE_AGENT = 1;

  // Read-only planning mode — analysis and recommendations only.
  //
  // The agent can read files, search code, list directories, and reason
  // about the codebase, but cannot create, edit, or delete files or run
  // mutating shell commands. Designed for exploring approaches, producing
  // implementation plans, and answering architectural questions without
  // side effects.
  //
  // Native harness: enforced by removing write tools from the tool set.
  // Cursor harness: best-effort via system prompt directive.
  INTERACTION_MODE_PLAN = 2;
}

// FileChangeType is the per-file outcome of a file mutation in a tool call.
//
// Distinct from ToolKind, which classifies the tool: a single tool call may
// produce several FileChanges of different types (multi-file edits).
//
// @since First-Class Diff Review (#186)
enum FileChangeType {
  // Default value, not a valid file change type.
  FILE_CHANGE_TYPE_UNSPECIFIED = 0;

  // A new file was created.
  FILE_CHANGE_TYPE_CREATE = 1;

  // An existing file's contents were modified.
  FILE_CHANGE_TYPE_MODIFY = 2;

  // A file was deleted.
  FILE_CHANGE_TYPE_DELETE = 3;

  // A file was renamed or moved; FileChange.rename_from holds the source path.
  FILE_CHANGE_TYPE_RENAME = 4;
}

// FileChangeCaptureLevel describes how complete a FileChange's captured content
// is, so clients render whole-file vs hunk-only diffs honestly per harness.
//
// @since First-Class Diff Review (#186)
enum FileChangeCaptureLevel {
  // Default value, not a valid capture level.
  FILE_CHANGE_CAPTURE_LEVEL_UNSPECIFIED = 0;

  // Full before+after content captured (native edit/write; future Cursor
  // pre-read). Clients render a true two-pane diff.
  FILE_CHANGE_CAPTURE_LEVEL_WHOLE_FILE = 1;

  // Only a hunk-level unified_diff is available (Cursor today). Clients render
  // the hunk diff; before/after whole-file content is absent.
  FILE_CHANGE_CAPTURE_LEVEL_HUNK_ONLY = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// File Change Review (apply-then-review HITL)
//
// Enums for the FileChangeSet subsystem (see filereview.proto). Distinct from
// the legacy FileChangeType / FileChangeCaptureLevel above, which belong to the
// tool-call-coupled FileChange and are superseded by these once file review
// leaves the tool call.
//
// @since File-Change HITL Redesign (Phase 1)
// ─────────────────────────────────────────────────────────────────────────────

// FileChangeSetStatus is the state of a FileChangeSet, DERIVED by folding its
// file-review events (never stored-mutable).
//
// @since File-Change HITL Redesign (Phase 1)
enum FileChangeSetStatus {
  // Default value, not a valid status.
  FILE_CHANGE_SET_STATUS_UNSPECIFIED = 0;

  // Baseline captured; the turn is executing and the candidate is not yet
  // captured. No diff to review yet.
  FILE_CHANGE_SET_STATUS_CAPTURING = 1;

  // Candidate captured and the diff is reviewable; awaiting user decisions.
  // Partially-decided sets stay here (still actionable) until every change is
  // decided.
  FILE_CHANGE_SET_STATUS_AWAITING_REVIEW = 2;

  // All changes decided; awaiting the runner's reconcile.
  FILE_CHANGE_SET_STATUS_DECIDED = 3;

  // Approved bytes reconciled into the workspace and hash-verified. Terminal.
  FILE_CHANGE_SET_STATUS_RECONCILED = 4;

  // A capture, diff, or reconcile failure halted the lifecycle. Terminal. See
  // FileReviewFailureKind for the precise cause.
  FILE_CHANGE_SET_STATUS_FAILED = 5;
}

// FileChangeKind is the per-file outcome within a FileChangeSet.
//
// The minimal set that covers the overwhelming majority of edits; COPY /
// MODE_CHANGE / SYMLINK_CHANGE are deferred (adding enum values later is
// non-breaking).
//
// @since File-Change HITL Redesign (Phase 1)
enum FileChangeKind {
  // Default value, not a valid kind.
  FILE_CHANGE_KIND_UNSPECIFIED = 0;

  // A new file was created.
  FILE_CHANGE_KIND_ADD = 1;

  // An existing file's contents changed.
  FILE_CHANGE_KIND_MODIFY = 2;

  // A file was deleted.
  FILE_CHANGE_KIND_DELETE = 3;

  // A file was renamed or moved; path_before holds the source, path_after the
  // destination.
  FILE_CHANGE_KIND_RENAME = 4;

  // A binary file changed; rendered as "binary file changed" rather than a text
  // diff.
  FILE_CHANGE_KIND_BINARY_CHANGE = 5;
}

// FileCaptureClass records how a file was captured, which governs which
// substrate (git tree ref vs CAS) holds its bytes and whether it is reviewable
// before CAS lands.
//
// @since File-Change HITL Redesign (Phase 1)
enum FileCaptureClass {
  // Default value, not a valid capture class.
  FILE_CAPTURE_CLASS_UNSPECIFIED = 0;

  // A git-tracked file; captured via the git no-commit tree snapshot.
  FILE_CAPTURE_CLASS_GIT_TRACKED = 1;

  // A git-untracked (but not ignored) file captured into the snapshot.
  FILE_CAPTURE_CLASS_GIT_UNTRACKED_CAPTURED = 2;

  // A gitignored file captured via CAS (Phase 3).
  FILE_CAPTURE_CLASS_GIT_IGNORED_CAPTURED = 3;

  // A file in a non-git workspace captured via CAS (Phase 3).
  FILE_CAPTURE_CLASS_NON_GIT_CAS = 4;
}

// DiffCompleteness describes whether a change set's rendered diff is complete
// enough to approve safely. A non-COMPLETE value blocks normal approval so an
// elided or binary-only diff can never be approved as if it were the whole
// change. The value is a rollup the runner derives from the per-file
// diff_complete + is_binary signals; it is an honest UI/audit signal, never the
// enforcement boundary — the backend gate always re-derives the keep-all
// condition from the per-file changes so a stale or mislabeled rollup can never
// widen what may be approved.
//
// @since File-Change HITL Redesign (Phase 1)
enum DiffCompleteness {
  // Default value, not a valid completeness.
  DIFF_COMPLETENESS_UNSPECIFIED = 0;

  // Every file's full diff is available; safe to approve.
  DIFF_COMPLETENESS_COMPLETE = 1;

  // At least one file has a non-binary incompleteness (elided/truncated/
  // secret-withheld/uncapturable) with no keepable bytes. The set cannot be
  // approved in one shot; it is resolved per file (keep the reviewable files,
  // discard the rest).
  DIFF_COMPLETENESS_PARTIAL_BLOCKED = 2;

  // The set's ONLY incompleteness is binary files: every non-binary file is
  // fully reviewable, and the remaining files are binary (a byte-true summary,
  // no text diff). Includes mixed sets (e.g. text edits + generated images).
  // Such a set can be kept in one action via a CHANGE_SET-scoped APPROVE
  // carrying acknowledge_unreviewable=true ("Keep all"). The acknowledgment
  // relaxes completeness only — never the expected_digest gate ("what you
  // approve is what gets applied").
  DIFF_COMPLETENESS_BINARY_SUMMARY_ONLY = 3;
}

// SnapshotKind is the substrate backing a SnapshotRef.
//
// @since File-Change HITL Redesign (Phase 1)
enum SnapshotKind {
  // Default value, not a valid snapshot kind.
  SNAPSHOT_KIND_UNSPECIFIED = 0;

  // A git no-commit tree ref (git-tracked/untracked paths only).
  SNAPSHOT_KIND_GIT_TREE_REF = 1;

  // A content-addressed manifest (ignored/non-git paths; Phase 3).
  SNAPSHOT_KIND_CAS_MANIFEST = 2;

  // Both a git tree ref and a CAS manifest (mixed workspace).
  SNAPSHOT_KIND_HYBRID = 3;
}

// FileDecisionScope is the granularity a FileDecision applies to.
//
// HUNK is intentionally deferred — per-hunk approval is a derived approved
// snapshot, not a new lease, and ships after file-level is stable.
//
// @since File-Change HITL Redesign (Phase 1)
enum FileDecisionScope {
  // Default value, not a valid scope.
  FILE_DECISION_SCOPE_UNSPECIFIED = 0;

  // The decision applies to the whole change set.
  FILE_DECISION_SCOPE_CHANGE_SET = 1;

  // The decision applies to one CapturedFileChange (FileDecision.file_change_id).
  FILE_DECISION_SCOPE_FILE = 2;
}

// FileDecisionAction is a user's verdict on a change set or file.
//
// @since File-Change HITL Redesign (Phase 1)
enum FileDecisionAction {
  // Default value, not a valid action.
  FILE_DECISION_ACTION_UNSPECIFIED = 0;

  // Keep the change(s): reconcile the captured bytes into the workspace.
  FILE_DECISION_ACTION_APPROVE = 1;

  // Discard the change(s): reconcile back to baseline for the targeted scope.
  FILE_DECISION_ACTION_REJECT = 2;
}

// FileDecisionOrigin records which authority authored a FileDecision: a human
// reviewer, or a platform policy acting on consent the human already gave.
// Audit provenance carried on the decision so the record always shows WHO
// decided — it is never an enforcement input, never a correlation key, and
// never folded into any digest. UNSPECIFIED (decisions authored before this
// field existed) reads as a human decision, the only author that existed then.
//
// @since File-Change HITL Redesign (DD-28 approved-command auto-keep)
enum FileDecisionOrigin {
  // Default value: a pre-DD-28 decision with no recorded origin. Treated as
  // USER by every consumer (the only author that existed before origins).
  FILE_DECISION_ORIGIN_UNSPECIFIED = 0;

  // A human reviewer decided via SubmitFileDecision.
  FILE_DECISION_ORIGIN_USER = 1;

  // Platform policy auto-kept the set because every mutation in its turn came
  // from commands the human explicitly authorized (per-command approval,
  // APPROVE_ALL category lease, or spec.auto_approve_all) — consent verified
  // against server-authored approval records before authoring (DD-28). The
  // decision's actor is "policy", never the user.
  FILE_DECISION_ORIGIN_POLICY_APPROVED_COMMAND = 2;
}

// FileReviewEventType is the kind of event in the append-only file-review
// stream (see FileReviewEvent in filereview.proto). It is the coarse lifecycle
// bucket; failure fidelity lives on FileReviewFailure.kind.
//
// @since File-Change HITL Redesign (Phase 1)
enum FileReviewEventType {
  // Default value, not a valid event type.
  FILE_REVIEW_EVENT_TYPE_UNSPECIFIED = 0;

  // Baseline captured at turn start. Payload: FileReviewBaselineCaptured.
  FILE_REVIEW_EVENT_TYPE_BASELINE_CAPTURED = 1;

  // Candidate captured at the turn boundary, carrying the diff. Payload:
  // FileReviewCandidateCaptured.
  FILE_REVIEW_EVENT_TYPE_CANDIDATE_CAPTURED = 2;

  // A user decided a change set or file. Payload: FileDecision.
  FILE_REVIEW_EVENT_TYPE_FILE_DECIDED = 3;

  // Approved bytes reconciled and verified. Payload: FileReviewReconciled.
  FILE_REVIEW_EVENT_TYPE_RECONCILED = 4;

  // A capture/diff/reconcile failure. Payload: FileReviewFailure.
  FILE_REVIEW_EVENT_TYPE_FAILED = 5;
}

// FileReviewFailureKind is the precise cause carried by a FAILED file-review
// event (FileReviewFailure.kind). Audit/control metadata for the failure
// lifecycle.
//
// @since File-Change HITL Redesign (Phase 1)
enum FileReviewFailureKind {
  // Default value, not a valid failure kind.
  FILE_REVIEW_FAILURE_KIND_UNSPECIFIED = 0;

  // Capturing the baseline or candidate snapshot failed.
  FILE_REVIEW_FAILURE_KIND_CAPTURE_FAILED = 1;

  // The diff could not be rendered completely (uncapturable path); the change
  // set cannot become approvable.
  FILE_REVIEW_FAILURE_KIND_DIFF_UNREVIEWABLE = 2;

  // Reconciling approved bytes into the workspace failed.
  FILE_REVIEW_FAILURE_KIND_RECONCILE_FAILED = 3;

  // A post-reconcile filesystem hash did not match the approved digest.
  FILE_REVIEW_FAILURE_KIND_HASH_MISMATCH = 4;
}

// FileReviewBlockReason is the honest cause a captured file's diff is not fully
// reviewable (carried on CapturedFileChange.blocked_reason, set only when
// diff_complete == false). It is INFORMATIONAL provenance for the review UI —
// never an enforcement input and never folded into file_digest/aggregate_digest.
// Binary changes are conveyed by FileContent.is_binary, not here, so there is no
// BINARY value (it would duplicate a signal the wire already carries).
//
// @since File-Change HITL Redesign (Phase 4)
enum FileReviewBlockReason {
  // Default: the file is reviewable, or diff_complete is false for a reason the
  // wire already conveys elsewhere (a binary side via FileContent.is_binary).
  FILE_REVIEW_BLOCK_REASON_UNSPECIFIED = 0;

  // A secret-like path (doc 12, DD-E): the bytes were deliberately never
  // captured, so there is nothing to review. Authored content-less by the runner.
  FILE_REVIEW_BLOCK_REASON_SECRET_WITHHELD = 1;

  // Captured, then its inline bodies were dropped to keep the persisted status
  // under its size limit. The content exists but is not inline for review.
  FILE_REVIEW_BLOCK_REASON_SIZE_ELIDED = 2;

  // Generic non-capturable cause (forward-compat catch-all; e.g. a future
  // non-git path class). Mirrors the fail-open spirit of DIFF_UNREVIEWABLE.
  FILE_REVIEW_BLOCK_REASON_UNREVIEWABLE = 3;
}
