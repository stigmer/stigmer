syntax = "proto3";

package ai.stigmer.agentic.agentexecution.v1;

import "ai/stigmer/agentic/agentexecution/v1/enum.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// Represents a single message in the agent conversation.
// Used to track the full conversation flow including user messages,
// AI responses, and tool execution details.
message AgentMessage {
  // Type of message (human, ai, tool, system).
  MessageType type = 1 [(buf.validate.field).enum.defined_only = true];

  // The text content of the message.
  string content = 2;

  // ISO 8601 timestamp when the message was created.
  string timestamp = 3;

  // Tool calls associated with this message (if type == ai and tools were invoked).
  repeated ToolCall tool_calls = 4;

  // Optional message metadata.
  google.protobuf.Struct metadata = 5;

  // True while the AI is actively generating this message, false when complete.
  // Enables UI to show typing indicator during streaming and final content when done.
  // Default (false) indicates either a non-AI message or a completed AI message.
  bool is_streaming = 6;
}

// Represents a tool call made by the agent during execution.
message ToolCall {
  // Unique identifier for this tool call.
  string id = 1;

  // Name of the tool being called.
  string name = 2;

  // Arguments passed to the tool (JSON structure).
  google.protobuf.Struct args = 3;

  // Result returned by the tool (optional, populated after execution).
  string result = 4;

  // Status of the tool call execution.
  ToolCallStatus status = 5 [(buf.validate.field).enum.defined_only = true];

  // ISO 8601 timestamp when the tool call started.
  string started_at = 7;

  // ISO 8601 timestamp when the tool call completed or failed.
  string completed_at = 8;

  // Error message if status == TOOL_CALL_FAILED.
  string error = 9;

  // ─────────────────────────────────────────────────────────────────────────────
  // Approval Fields (HITL Phase 1)
  //
  // These fields track the approval state for tools that require user consent
  // before execution. Populated only for tools where approval is configured.
  // ─────────────────────────────────────────────────────────────────────────────

  // True if this tool requires approval before execution.
  // Determined at runtime by merging:
  //   1. McpServerStatus.tool_approvals (system-generated defaults)
  //   2. McpServerSpec.pinned_tool_approvals (manual overrides)
  //   3. McpServerUsage.tool_approval_overrides (agent-specific)
  //   4. AgentExecutionSpec.auto_approve_all (runtime bypass)
  //
  // When true and status == TOOL_CALL_WAITING_APPROVAL, the tool is paused
  // awaiting user decision via SubmitApproval RPC.
  bool requires_approval = 10;

  // Human-readable message explaining what approval is being requested.
  // Populated from ToolApprovalPolicy.message with argument placeholders resolved.
  //
  // Examples:
  //   - "Delete repository: my-important-repo"
  //   - "Force push to branch: main"
  //   - "Send email to: customer@example.com"
  //
  // If no custom message configured, defaults to: "Execute tool: {tool_name}"
  string approval_message = 11;

  // ISO 8601 timestamp when approval was requested.
  // Set when status transitions to TOOL_CALL_WAITING_APPROVAL.
  // Used for tracking approval latency and potential timeout logic.
  // Example: "2026-01-30T15:30:00Z"
  string approval_requested_at = 12;

  // ISO 8601 timestamp when approval decision was made.
  // Set when user submits APPROVE, SKIP, or REJECT via SubmitApproval.
  // Example: "2026-01-30T15:32:15Z"
  string approval_decided_at = 13;

  // User ID of who made the approval decision.
  // Extracted from authentication context when SubmitApproval is called.
  // Important for audit trails and accountability.
  // Example: "usr_abc123xyz"
  string approved_by = 14;

  // The action taken by the user.
  // Only populated after approval decision is made (approval_decided_at is set).
  // Determines how the tool execution proceeds:
  //   - APPROVE: Tool executes normally
  //   - SKIP: Tool returns skip message, execution continues
  //   - REJECT: Execution fails with rejection error
  ApprovalAction approval_action = 15;

  // ─────────────────────────────────────────────────────────────────────────────
  // Streaming State Fields
  //
  // These two fields together describe what is streaming and whether more
  // content is expected:
  //
  //   is_streaming = true  + streaming_source = INPUT  → LLM generating args
  //   is_streaming = true  + streaming_source = OUTPUT → tool producing output
  //   is_streaming = false + streaming_source = *      → not streaming
  //
  // Consumers always read `result` for the current content. `is_streaming`
  // signals whether more content is expected; `streaming_source` tells
  // consumers what kind of content it is so they render correctly.
  // ─────────────────────────────────────────────────────────────────────────────

  // True while the tool is actively producing content, false when complete.
  // Enables UI to show live output during long-running tool executions or
  // a typewriter effect during input generation.
  //
  // When true, `result` contains partial content accumulated so far.
  // When false (default), `result` contains the final complete output.
  // Consumers always read `result` — this flag only signals whether
  // more content is expected.
  bool is_streaming = 16;

  // Identifies what is currently being streamed.
  // Only meaningful when is_streaming is true; reset to UNSPECIFIED when
  // streaming ends.
  //
  // INPUT:  result contains partial content extracted from the in-progress
  //         argument JSON (e.g., file content for a write tool).
  // OUTPUT: result contains accumulated output chunks from tool execution
  //         (e.g., shell command stdout).
  //
  // Consumers use this to choose the correct rendering mode — typewriter
  // for input streaming, live terminal output for output streaming.
  ToolCallStreamingSource streaming_source = 19;

  // ─────────────────────────────────────────────────────────────────────────────
  // MCP Server Origin
  //
  // Identifies the MCP server that provides this tool. Empty for built-in
  // sandbox tools (read, write, shell, etc.). Populated by the worker when
  // the tool originates from an MCP server configured in the agent's
  // execution context.
  // ─────────────────────────────────────────────────────────────────────────────

  // Slug of the MCP server that provides this tool.
  // Empty for built-in sandbox tools.
  // Populated by the worker using the mcp_tools_config reverse lookup.
  //
  // Examples: "planton", "github", "slack"
  //
  // Used by CLI/UI to render a qualified tool name (e.g., "planton/search")
  // so users can distinguish tools with the same name from different servers.
  string mcp_server_slug = 17;

  // Sanitized preview of tool arguments for UI display.
  // Sensitive values (passwords, tokens, keys) are redacted.
  // Populated at tool call creation time by the agent-runner.
  // Used by the server-side ComputePendingApprovals projection
  // and by CLI/UI for inline argument visibility.
  //
  // Example: '{"repository": "acme/repo", "force": true}'
  string args_preview = 18;

  // ─────────────────────────────────────────────────────────────────────────────
  // Tool Classification
  // ─────────────────────────────────────────────────────────────────────────────

  // Harness-agnostic category of this tool, set by the runner so clients render
  // the tool identically regardless of which engine produced it. The native and
  // Cursor harnesses use different tool-name conventions; tool_kind erases that
  // difference at the source.
  //
  // TOOL_KIND_UNSPECIFIED means unclassified — either the execution predates this
  // field or the tool has no known kind. Clients fall back to a name-based
  // lookup in that case. See ToolKind.
  //
  // Field 20: field 6 is a historical gap and 19 (streaming_source) is the prior
  // maximum, so this is appended at 20.
  ToolKind tool_kind = 20;

  // ─────────────────────────────────────────────────────────────────────────────
  // Offloaded Output (large tool results)
  //
  // When a tool's output exceeds a size threshold, the runner spills the full
  // bytes to artifact storage and records a reference here instead of inlining
  // megabytes into `result` on every status update. Without this, a single
  // large result (e.g. a base64 screenshot or a multi-MB accessibility tree)
  // pushes AgentExecutionStatus past the gRPC message-size limit, so status
  // persistence fails silently and the live UI freezes mid-execution.
  //
  // When set, `result` holds only a short human-readable head/preview (so
  // consumers that read `result` still render something sensible) and
  // output_ref points at the full content. Empty for the overwhelming majority
  // of tool calls — only populated when output crosses the offload threshold.
  // See ToolCallOutputRef.
  //
  // Field 21: appended after tool_kind (20), the prior maximum.
  ToolCallOutputRef output_ref = 21;

  // ─────────────────────────────────────────────────────────────────────────────
  // File Changes (first-class diff review)
  // ─────────────────────────────────────────────────────────────────────────────

  // File changes produced by this tool call (create / modify / delete / rename).
  //
  // Populated by the runner for file-modifying tools. repeated because some
  // tools (notably multi-file MCP edits) mutate several files in one call. This
  // is the single source of truth for both the HITL approval-gate diff (set at
  // approval-request time) and the post-execution Changes view; clients read it
  // from the ToolCall directly rather than from a second copy.
  //
  // Field 22: appended after output_ref (21), the prior maximum.
  //
  // @since First-Class Diff Review (#186)
  repeated FileChange file_changes = 22;

  // ─────────────────────────────────────────────────────────────────────────────
  // Authorization Provenance (HITL)
  //
  // Which policy layer decided this tool call's approval requirement, recorded so
  // an execution's authorizations are auditable. Runner-written and carried
  // through update_status exactly like tool_kind — not owned by SubmitApproval,
  // so no preserve logic is needed.
  // ─────────────────────────────────────────────────────────────────────────────

  // Policy layer that decided this tool call's approval requirement, set by the
  // runner's approval gate so clients can explain "why was this gated or
  // auto-approved?".
  //
  // APPROVAL_POLICY_SOURCE_UNSPECIFIED means unevaluated — a read-only built-in,
  // or an execution that predates this field (clients fall back to no provenance,
  // exactly as for an unset tool_kind). See ApprovalPolicySource.
  //
  // Field 23: appended after file_changes (22), the prior maximum.
  ApprovalPolicySource approval_policy_source = 23;

  // Identifier of the policy-engine logic that produced approval_policy_source,
  // bumped when the merge/classification semantics change so decisions made by
  // different engine versions stay distinguishable in audits.
  //
  // @internal
  // Mirrors the runner's POLICY_ENGINE_VERSION constant (approval-policy.ts).
  //
  // Field 24: appended after approval_policy_source (23), the prior maximum.
  string policy_engine_version = 24;
}

// ToolCallOutputRef points to a tool call's full output after the runner
// offloaded it to artifact storage to keep AgentExecutionStatus under the gRPC
// message-size limit.
//
// This is deliberately distinct from ExecutionArtifact (a file the agent
// publishes for the user to download via publish_artifact): an output ref is
// internal spillover of a tool's result, not a user-facing deliverable. The
// bytes live in artifact storage (R2 in the cloud, locally served in dev);
// only this reference is persisted in the execution status.
//
// @since Durable Executions (tool-output offload)
message ToolCallOutputRef {
  // Storage location of the full output bytes.
  // Format: "artifacts/{execution_id}/toolcalls/{tool_call_id}.{ext}"
  //
  // Clients resolve the bytes/URL on demand from this stable key (via
  // getArtifactContent or getArtifactDownloadUrl) — there is deliberately no
  // persisted URL, since a pre-signed URL would expire while the reference does
  // not.
  string storage_key = 1;

  // Size in bytes of the full (original, pre-truncation) output.
  int64 size_bytes = 3;

  // SHA-256 hex digest of the full output bytes. Lets the runner dedupe
  // uploads (skip re-uploading identical content across repeated persists) and
  // lets clients invalidate caches when content changes under a stable key.
  string content_hash = 4;

  // MIME type of the offloaded content.
  // Examples: "image/png", "text/plain", "application/json".
  string mime_type = 5;

  // True when the offloaded content is an image the UI should render inline
  // (e.g. a screenshot from a computer-use MCP server).
  bool is_image = 6;

  // Short head of the original text content, kept inline for an at-a-glance
  // preview without fetching the full artifact. Empty for image content.
  string truncated_preview = 7;
}

// A single file mutation produced by a tool call.
//
// Large before/after bodies are offloaded to artifact storage via the existing
// ToolCallOutputRef envelope; small bodies stay inline. capture_level tells
// clients how complete the content is so they render whole-file vs hunk-only
// diffs honestly per harness.
//
// @since First-Class Diff Review (#186)
message FileChange {
  // Workspace-root-relative path for display, e.g. "src/app/main.ts".
  // Falls back to absolute_path when the workspace root is unknown.
  string path = 1;

  // Absolute on-disk path, retained for "open in editor" and diagnostics.
  string absolute_path = 2;

  // The per-file outcome of this change.
  //
  // Distinct from ToolCall.tool_kind, which classifies the tool: one tool call
  // may yield several FileChanges of different types (multi-file edits), and a
  // FILE_WRITE tool yields CREATE for a new file or MODIFY when it overwrites
  // an existing one.
  FileChangeType change_type = 3 [(buf.validate.field).enum.defined_only = true];

  // How complete the captured content is.
  //
  // WHOLE_FILE: before/after carry full content. HUNK_ONLY: only unified_diff
  // is available (Cursor today).
  FileChangeCaptureLevel capture_level = 4 [(buf.validate.field).enum.defined_only = true];

  // Pre-edit content. Empty for CREATE, or when capture_level is HUNK_ONLY.
  FileContent before = 5;

  // Post-edit content. Empty for DELETE, or when capture_level is HUNK_ONLY.
  FileContent after = 6;

  // Unified hunk-level diff. The primary payload for HUNK_ONLY captures
  // (Cursor's diffString); small and always safe to render even when
  // before/after are absent. Derivable from before/after for WHOLE_FILE.
  string unified_diff = 7;

  // Lines added by this change.
  int32 lines_added = 8;

  // Lines removed by this change.
  int32 lines_removed = 9;

  // Source path for RENAME; path holds the destination. Empty otherwise.
  string rename_from = 10;
}

// One side (before or after) of a file's content.
//
// Small bodies are carried inline; large bodies are offloaded to artifact
// storage and referenced via the existing tool-output offload envelope. Exactly
// one of inline or ref is set; when offloaded, the head preview lives in
// ref.truncated_preview and the full size in ref.size_bytes.
//
// @since First-Class Diff Review (#186)
message FileContent {
  // The body of this side — inline when small, an offload pointer when large.
  oneof body {
    // Full UTF-8 content, inline. Set only when under the inline cap.
    string inline = 1;

    // Offload pointer for large content; reuses the tool-output offload
    // envelope (storage_key, size_bytes, content_hash, truncated_preview).
    ToolCallOutputRef ref = 2;
  }

  // True when this side is binary; clients skip text diffing and render
  // "binary file changed" instead.
  bool is_binary = 3;
}
