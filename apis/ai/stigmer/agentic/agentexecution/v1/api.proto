syntax = "proto3";

package ai.stigmer.agentic.agentexecution.v1;

import "ai/stigmer/agentic/agentexecution/v1/enum.proto";
import "ai/stigmer/agentic/agentexecution/v1/spec.proto";
import "ai/stigmer/commons/apiresource/metadata.proto";
import "ai/stigmer/commons/apiresource/status.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// AgentExecution represents a single agent execution instance (conversational).
// Follows the standard pattern: spec contains user inputs, status contains execution results.
message AgentExecution {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = 'agentic.stigmer.ai/v1'];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = 'AgentExecution'];

  // Standard resource metadata including name, id, labels, and tags.
  // Agent executions belong to an organization and inherit permissions from the session.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // User-provided inputs for this execution.
  // Contains: session_id, agent_id, message, execution_config, environment_id, credential_overrides
  AgentExecutionSpec spec = 4;

  // System-managed execution state and results.
  // Contains: messages, phase, tool_calls, sub_agents, canvas_layout, timestamps, errors
  AgentExecutionStatus status = 5;
}

// AgentExecutionStatus contains all execution results and state.
// Everything populated during or after execution goes here, not in spec.
message AgentExecutionStatus {
  // Standard audit information (created_at, updated_at, created_by, etc.)
  ai.stigmer.commons.apiresource.ApiResourceAudit audit = 99;

  // Sequential stream of execution events: AI messages, tool calls, and system notifications.
  // Ordered chronologically to reconstruct the complete execution flow.
  // Each message captures what happened during execution (agent responses, tool invocations, progress updates).
  repeated AgentMessage messages = 1;

  // Current execution lifecycle phase.
  // Tracks the execution state from creation (PENDING) through active processing (IN_PROGRESS)
  // to terminal states (COMPLETED/FAILED/CANCELLED).
  ExecutionPhase phase = 2 [(buf.validate.field).enum.defined_only = true];

  // Tool calls made during this execution.
  // Tracked separately for easier querying and display.
  // Also referenced within messages[].tool_calls for conversation context.
  repeated ToolCall tool_calls = 3;

  // Sub-agent executions invoked during this execution.
  // Tracks when the main agent delegates work to specialized sub-agents.
  // Ordered chronologically by invocation time.
  repeated SubAgentExecution sub_agent_executions = 4;

  // Error message if execution failed.
  // Only populated when phase == EXECUTION_FAILED.
  string error = 6;

  // ISO 8601 timestamp when execution started.
  // Example: "2025-01-10T10:30:00Z"
  string started_at = 7;

  // ISO 8601 timestamp when execution completed, failed, or was cancelled.
  // Only populated for terminal states.
  string completed_at = 8;

  // Todo list tracking multi-step tasks and progress for this execution.
  // Updated via write_todos tool (if TodoListMiddleware is enabled).
  // Each execution maintains its own snapshot of todos at execution time.
  // Key: todo item ID, Value: todo item details
  map<string, TodoItem> todos = 9;

  // Temporal callback token for async activity completion.
  //
  // When this AgentExecution is triggered from a Temporal activity (e.g., from a workflow
  // that invokes an agent), the calling activity passes its task token here. The agent-runner
  // is responsible for completing the external activity when the agent execution finishes.
  //
  // ## Token Handshake Pattern
  //
  // Same pattern as WorkflowExecution (see workflowexecution/v1/api.proto for details):
  // 1. External activity extracts token and stores in AgentExecution.status
  // 2. Activity returns activity.ErrResultPending (paused, thread freed)
  // 3. Agent executes (seconds to minutes)
  // 4. On completion: agent-runner completes external activity via token
  //
  // ## Why in Status
  //
  // - System-generated by Temporal, not user-provided
  // - Runtime state, not configuration
  // - Ephemeral, only relevant during execution
  //
  // ## Use Cases
  //
  // - **With token**: Agent invoked from workflow, workflow waits for completion
  // - **Without token**: Agent runs independently (chat, API call)
  //
  // ## References
  //
  // - WorkflowExecution.spec.callback_token (field 7) - Same pattern
  // - [ADR](docs/adr/20260122-async-agent-execution-temporal-token-handshake.md)
  bytes callback_token = 10;

  // ─────────────────────────────────────────────────────────────────────────────
  // Usage Metrics (Phase 2.4)
  //
  // Aggregated token consumption and LLM resource usage for this execution.
  // ─────────────────────────────────────────────────────────────────────────────

  // Token and LLM resource usage for this execution (main agent only).
  // Does NOT include sub-agent usage - sum sub_agent_executions[].usage for total.
  // Updated progressively during streaming for real-time cost visibility.
  UsageMetrics usage = 11;

  // ─────────────────────────────────────────────────────────────────────────────
  // Resolved Execution Context (Phase 2.5)
  //
  // Captures what resources the agent actually had access to at execution time.
  // ─────────────────────────────────────────────────────────────────────────────

  // Resolved execution context showing what resources the agent had access to.
  // Populated once before streaming begins, after all resources are resolved.
  // Immutable after initial population - represents the "snapshot" of resolved state.
  ResolvedExecutionContext resolved_context = 12;

  // ─────────────────────────────────────────────────────────────────────────────
  // Pending Approvals (HITL — Batch Approval)
  //
  // When the LLM returns one or more tool calls that each require approval,
  // LangGraph creates one interrupt per tool. All pending interrupts are
  // surfaced here so the UI can collect decisions for every tool before the
  // graph is resumed.
  //
  // The agent-runner resumes the graph with a single
  //   Command(resume={interrupt_id_A: decision_A, interrupt_id_B: decision_B, ...})
  // once ALL entries have been decided. This avoids repeated node re-execution
  // and the idempotency risks of one-at-a-time resume.
  // ─────────────────────────────────────────────────────────────────────────────

  // All pending approval requests for this execution.
  //
  // Lifecycle:
  // 1. Populated after the event stream ends, by querying graph state for
  //    pending interrupts. Each interrupt is matched to a tool call.
  // 2. Phase changes to EXECUTION_WAITING_FOR_APPROVAL.
  // 3. User submits decisions via SubmitApproval RPC (one per tool call).
  // 4. After ALL entries have decisions, the Temporal workflow signals resume.
  // 5. On resume, all decisions are sent to LangGraph in a single Command.
  //
  // When populated:
  // - Each entry's tool_call_id matches an entry in tool_calls[] with status
  //   WAITING_APPROVAL
  // - Each entry carries its interrupt_id for targeted resume
  //
  // Empty when no approvals are pending.
  repeated PendingApproval pending_approvals = 16;

  // ─────────────────────────────────────────────────────────────────────────────
  // Context Management (Phase 3)
  //
  // Context window utilization and automatic summarization tracking.
  // ─────────────────────────────────────────────────────────────────────────────

  // Context window utilization and summarization tracking.
  //
  // Provides visibility into how the agent is using its context window and
  // any summarization events that occurred during execution.
  //
  // Populated when context management is active (not disabled via config).
  // Updated progressively during streaming as token counts change.
  //
  // Use cases:
  // - **Monitoring**: Track context utilization across executions
  // - **Debugging**: Understand why an execution hit context limits
  // - **Cost optimization**: Identify executions with excessive summarization
  // - **UX**: Show users their context window health
  //
  // @since Phase 3 (Context Summarization Architecture)
  ContextInfo context_info = 14;

  // ─────────────────────────────────────────────────────────────────────────────
  // Execution Artifacts (Artifact Lifecycle)
  //
  // Files and directories published by the agent for download.
  // ─────────────────────────────────────────────────────────────────────────────

  // Files/directories published by the agent for download.
  //
  // When an agent creates artifacts (e.g., generated code, reports, skills),
  // it can call the publish_artifact tool to make them downloadable.
  // Each artifact includes a pre-signed URL for direct download.
  //
  // Artifacts are stored in R2 and URLs expire after a configured period.
  // Use the execution download endpoint to refresh expired URLs.
  //
  // Ordered by creation time (oldest first).
  //
  // @since Artifact Lifecycle (Attachments & Artifacts)
  repeated ExecutionArtifact artifacts = 15;
}

// Represents a single item in the agent's todo list.
// Used by the write_todos tool to track multi-step tasks and progress.
message TodoItem {
  // Unique identifier for this todo item.
  string id = 1;

  // Description of the task to be completed.
  string content = 2;

  // Current status of the todo item.
  TodoStatus status = 3;

  // ISO 8601 timestamp when the todo was created.
  string created_at = 4;

  // ISO 8601 timestamp when the todo was last updated.
  string updated_at = 5;
}

// Represents a single message in the agent conversation.
// Used to track the full conversation flow including user messages,
// AI responses, and tool execution details.
message AgentMessage {
  // Type of message (human, ai, tool, system).
  MessageType type = 1 [(buf.validate.field).enum.defined_only = true];

  // The text content of the message.
  string content = 2;

  // ISO 8601 timestamp when the message was created.
  string timestamp = 3;

  // Tool calls associated with this message (if type == ai and tools were invoked).
  repeated ToolCall tool_calls = 4;

  // Optional message metadata.
  google.protobuf.Struct metadata = 5;

  // ─────────────────────────────────────────────────────────────────────────────
  // Streaming State Fields (Phase 2.1)
  //
  // These fields track AI message generation progress and resource usage.
  // Only meaningful for messages where type == MESSAGE_AI.
  // ─────────────────────────────────────────────────────────────────────────────

  // True while the AI is actively generating this message, false when complete.
  // Enables UI to show typing indicator during streaming and final content when done.
  // Default (false) indicates either a non-AI message or a completed AI message.
  bool is_streaming = 6;

  // Total tokens consumed to generate this message (prompt + completion tokens).
  // Zero until message generation completes, or if token usage is unavailable.
  // Useful for cost tracking and usage analytics at the message level.
  int32 token_count = 7;

  // Wall-clock time in milliseconds from first token to completion.
  // Measured from when streaming begins until on_chat_model_end event.
  // Zero until message generation completes.
  int32 generation_duration_ms = 8;
}

// Represents a tool call made by the agent during execution.
message ToolCall {
  // Unique identifier for this tool call.
  string id = 1;

  // Name of the tool being called.
  string name = 2;

  // Arguments passed to the tool (JSON structure).
  google.protobuf.Struct args = 3;

  // Result returned by the tool (optional, populated after execution).
  string result = 4;

  // Status of the tool call execution.
  ToolCallStatus status = 5 [(buf.validate.field).enum.defined_only = true];

  // Optional metadata to guide frontend UI component rendering.
  // Set by Python worker based on tool name or explicitly by agents.
  // Example: kubectl_get_pods → component_type="terminal"
  ComponentMetadata component_metadata = 6;

  // ISO 8601 timestamp when the tool call started.
  string started_at = 7;

  // ISO 8601 timestamp when the tool call completed or failed.
  string completed_at = 8;

  // Error message if status == TOOL_CALL_FAILED.
  string error = 9;

  // ─────────────────────────────────────────────────────────────────────────────
  // Approval Fields (HITL Phase 1)
  //
  // These fields track the approval state for tools that require user consent
  // before execution. Populated only for tools where approval is configured.
  // ─────────────────────────────────────────────────────────────────────────────

  // True if this tool requires approval before execution.
  // Determined at runtime by merging:
  //   1. McpServer.default_tool_approvals (platform/org defaults)
  //   2. McpServerUsage.tool_approval_overrides (agent-specific)
  //   3. AgentExecutionSpec.auto_approve_all (runtime bypass)
  //
  // When true and status == TOOL_CALL_WAITING_APPROVAL, the tool is paused
  // awaiting user decision via SubmitApproval RPC.
  bool requires_approval = 10;

  // Human-readable message explaining what approval is being requested.
  // Populated from ToolApprovalPolicy.message with argument placeholders resolved.
  //
  // Examples:
  //   - "Delete repository: my-important-repo"
  //   - "Force push to branch: main"
  //   - "Send email to: customer@example.com"
  //
  // If no custom message configured, defaults to: "Execute tool: {tool_name}"
  string approval_message = 11;

  // ISO 8601 timestamp when approval was requested.
  // Set when status transitions to TOOL_CALL_WAITING_APPROVAL.
  // Used for tracking approval latency and potential timeout logic.
  // Example: "2026-01-30T15:30:00Z"
  string approval_requested_at = 12;

  // ISO 8601 timestamp when approval decision was made.
  // Set when user submits APPROVE, SKIP, or REJECT via SubmitApproval.
  // Example: "2026-01-30T15:32:15Z"
  string approval_decided_at = 13;

  // User ID of who made the approval decision.
  // Extracted from authentication context when SubmitApproval is called.
  // Important for audit trails and accountability.
  // Example: "usr_abc123xyz"
  string approved_by = 14;

  // The action taken by the user.
  // Only populated after approval decision is made (approval_decided_at is set).
  // Determines how the tool execution proceeds:
  //   - APPROVE: Tool executes normally
  //   - SKIP: Tool returns skip message, execution continues
  //   - REJECT: Execution fails with rejection error
  ApprovalAction approval_action = 15;

  // ─────────────────────────────────────────────────────────────────────────────
  // Streaming State Fields
  //
  // These fields track tool output generation progress.
  // Mirrors AgentMessage.is_streaming for consistency.
  // ─────────────────────────────────────────────────────────────────────────────

  // True while the tool is actively producing output, false when complete.
  // Mirrors AgentMessage.is_streaming for consistency.
  // Enables UI to show live output during long-running tool executions.
  //
  // When true, `result` contains partial output accumulated so far.
  // When false (default), `result` contains the final complete output.
  // Consumers always read `result` — this flag only signals whether
  // more content is expected.
  bool is_streaming = 16;

  // ─────────────────────────────────────────────────────────────────────────────
  // MCP Server Origin
  //
  // Identifies the MCP server that provides this tool. Empty for built-in
  // sandbox tools (read, write, shell, etc.). Populated by the worker when
  // the tool originates from an MCP server configured in the agent's
  // execution context.
  // ─────────────────────────────────────────────────────────────────────────────

  // Slug of the MCP server that provides this tool.
  // Empty for built-in sandbox tools.
  // Populated by the worker using the mcp_tools_config reverse lookup.
  //
  // Examples: "planton-cloud", "github", "slack"
  //
  // Used by CLI/UI to render a qualified tool name (e.g., "planton-cloud/search")
  // so users can distinguish tools with the same name from different servers.
  string mcp_server_slug = 17;
}

// Metadata to guide frontend UI component rendering for tool calls.
// All fields are optional - if not set, frontend uses default rendering logic.
message ComponentMetadata {
  // Type of UI component to render for this tool call.
  // Examples: "terminal", "preview", "form", "approval", "diagram", "progress"
  // Frontend maps these to React Flow node types (TerminalNode, PreviewNode, etc.).
  string component_type = 1;

  // Optional group identifier for related tool calls.
  // Tool calls with the same group_id can be aggregated into a single UI component.
  // Example: Multiple kubectl commands in a deployment workflow.
  string component_group = 2;

  // Optional layout hint for canvas positioning.
  // Examples: "inline", "full-width", "sidebar", "floating"
  string layout_hint = 3;

  // Flexible metadata for component-specific configuration.
  // Frontend components can read this for custom behavior.
  // Example: {"syntax": "yaml", "readonly": true} for file preview
  google.protobuf.Struct metadata = 4;
}

// Represents a sub-agent invocation within an execution.
// When the main agent delegates work to a specialized sub-agent, this message
// tracks the complete lifecycle of that delegation including input, output, and timing.
message SubAgentExecution {
  // Unique identifier for this sub-agent execution.
  // Matches the tool call ID from the LangGraph "task" tool invocation.
  string id = 1;

  // Name of the sub-agent being invoked.
  // Examples: "code_editor", "researcher", "debugger"
  // Extracted from tool call args.subagent_type field.
  string name = 2;

  // Task/instruction given to the sub-agent.
  // This is the input prompt that tells the sub-agent what to do.
  string input = 3;

  // Result returned by the sub-agent when complete.
  // Only populated when status == SUB_AGENT_COMPLETED.
  string output = 4;

  // Current lifecycle status of the sub-agent execution.
  SubAgentStatus status = 5 [(buf.validate.field).enum.defined_only = true];

  // ISO 8601 timestamp when the sub-agent was invoked.
  // Example: "2025-11-22T10:30:00Z"
  string started_at = 6;

  // ISO 8601 timestamp when the sub-agent completed or failed.
  // Only populated for terminal states (completed/failed).
  string completed_at = 7;

  // Error message if status == SUB_AGENT_FAILED.
  // Contains the failure reason for debugging and user display.
  string error = 8;

  // Optional sub-agent execution metadata.
  google.protobuf.Struct metadata = 9;

  // ─────────────────────────────────────────────────────────────────────────────
  // Internal Execution Visibility (Phase 2.3)
  //
  // These fields capture what happened inside the sub-agent execution,
  // enabling debugging when sub-agents fail mid-execution.
  // ─────────────────────────────────────────────────────────────────────────────

  // Tool calls made by this sub-agent.
  // Captures the sub-agent's internal tool invocations separately from main agent.
  // Enables debugging when sub-agent fails (e.g., "failed on 8th tool call").
  repeated ToolCall tool_calls = 10;

  // Messages generated by this sub-agent.
  // Captures AI responses and tool results within the sub-agent context.
  // Ordered chronologically like AgentExecutionStatus.messages.
  repeated AgentMessage messages = 11;

  // ─────────────────────────────────────────────────────────────────────────────
  // Usage Metrics (Phase 2.4)
  //
  // Token consumption and LLM resource usage for this sub-agent.
  // ─────────────────────────────────────────────────────────────────────────────

  // Token and LLM resource usage for this sub-agent execution.
  // Captures only this sub-agent's direct LLM calls.
  // Isolated from main agent and other sub-agents for accurate cost attribution.
  UsageMetrics usage = 12;

  // ─────────────────────────────────────────────────────────────────────────────
  // Display Metadata
  // ─────────────────────────────────────────────────────────────────────────────

  // Concise, human-readable summary of the sub-agent's task (3-10 words).
  // Populated directly from the task tool's `description` argument — the short
  // label the invoking LLM provides when calling the "task" tool. No server-side
  // LLM generation; available instantly when the sub-agent starts.
  // Used as the primary display label in collapsed and expanded UI views.
  // Examples: "Explore CLI rendering code", "Fix auth middleware tests"
  string subject = 13;

  // ─────────────────────────────────────────────────────────────────────────────
  // Pending Approvals (Sub-Agent Scope)
  //
  // When a sub-agent's tool requires approval, the PendingApproval is surfaced
  // both here (sub-agent scope) and at the parent AgentExecutionStatus level
  // (top-level visibility). This field provides sub-agent-level isolation so
  // consumers querying a single sub-agent can determine its approval state
  // without scanning the parent's pending_approvals list.
  // ─────────────────────────────────────────────────────────────────────────────

  // Approval requests pending within this sub-agent's tool calls.
  // Also surfaced at parent AgentExecutionStatus.pending_approvals for
  // top-level visibility. Cleared when the approval is resolved.
  repeated PendingApproval pending_approvals = 14;
}

// UsageMetrics tracks token consumption and LLM resource usage.
// Provides execution-level aggregation for cost tracking, billing, and analytics.
//
// ## Scope
//
// Each UsageMetrics instance represents direct LLM usage within its context:
// - AgentExecutionStatus.usage: Main agent's LLM calls (excludes sub-agents)
// - SubAgentExecution.usage: That sub-agent's LLM calls
//
// To calculate total execution cost, sum: status.usage + sum(sub_agent.usage)
//
// ## Token Counting
//
// - prompt_tokens: Input tokens sent to the LLM (context, system prompt, user message)
// - completion_tokens: Output tokens generated by the LLM (response)
// - Extracted from on_chat_model_end events via LangChain usage_metadata
//
// ## Model Tracking
//
// primary_model reflects the configured model from ExecutionConfig.model_name.
// When model is auto-selected or varies per call, this captures the first/main model used.
message UsageMetrics {
  // Total input tokens (prompts) consumed across all LLM calls in this context.
  // Accumulated from each on_chat_model_end event's usage_metadata.input_tokens.
  int32 prompt_tokens = 1;

  // Total output tokens (completions) generated across all LLM calls in this context.
  // Accumulated from each on_chat_model_end event's usage_metadata.output_tokens.
  int32 completion_tokens = 2;

  // Total tokens (prompt + completion). Convenience field for quick reference.
  // Equals: prompt_tokens + completion_tokens
  int32 total_tokens = 3;

  // Number of LLM API calls made in this context.
  // Incremented for each on_chat_model_end event.
  // Useful for: average tokens per call, call frequency analysis.
  int32 llm_call_count = 4;

  // Primary model used for this execution.
  // Typically matches ExecutionConfig.model_name or the first model detected.
  // Examples: "claude-sonnet-4-20250514", "gpt-4o", "gemini-1.5-pro"
  string primary_model = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// Resolved Execution Context (Phase 2.5)
//
// Captures the resolved configuration state at execution time for visibility,
// debugging, and auditing purposes.
// ─────────────────────────────────────────────────────────────────────────────

// ResolvedExecutionContext captures the resolved configuration state at execution time.
// Populated once after all resources are resolved, before the agent begins processing.
//
// ## Purpose
//
// Provides visibility into what the agent actually had access to during execution:
// - Which environment variables were available (keys only, not values for security)
// - Which MCP servers were configured and their resolution status
// - Which skills were injected into the agent's context
//
// This enables:
// - **Debugging**: Understanding what environment/tools were available when investigating failures
// - **Auditing**: Tracking what resources each execution consumed
// - **Security review**: Verifying which secrets (by key name only) were exposed
// - **UX transparency**: Showing users what their agent can access
//
// ## Timing
//
// Populated in execute_graphton.py after Steps 3-5 complete (skills, env vars, MCP servers)
// but before the streaming loop begins. This represents the "snapshot" of resolved state.
// Once set, this field is immutable for the remainder of the execution.
//
// ## Security Considerations
//
// - Environment values are NEVER included (only keys)
// - MCP server credentials are not exposed
// - This is safe to include in status responses to clients
message ResolvedExecutionContext {
  // Environment variable keys available to the agent (NOT values for security).
  // Represents the merged result of: template env_spec + instance environment_refs + runtime_env.
  // Keys are sorted alphabetically for consistent ordering and deterministic comparison.
  // Examples: ["API_KEY", "DATABASE_URL", "LOG_LEVEL"]
  repeated string environment_keys = 1;

  // MCP servers referenced by the agent and their resolution status.
  // Key: MCP server slug (e.g., "github-mcp", "slack-mcp")
  // Value: Resolution status including success/failure and diagnostic information
  //
  // Note: This tracks configuration resolution, not runtime connection status.
  // A server showing resolved=true means it was found and transformed successfully;
  // actual WebSocket/stdio connection happens later in the Graphton runtime.
  map<string, McpServerResolutionStatus> mcp_servers = 2;

  // Names of skills injected into the agent's system prompt.
  // Each skill's SKILL.md content is appended to the instructions.
  // Sorted alphabetically for consistent ordering and deterministic comparison.
  // Examples: ["code-review", "docker-expert", "kubernetes-operator"]
  repeated string skill_names = 3;
}

// McpServerResolutionStatus captures the resolution outcome for a single MCP server.
// Provides richer information than a simple boolean for better debugging and visibility.
//
// ## Resolution vs Connection
//
// This tracks whether the MCP server definition was successfully loaded and configured,
// NOT whether the runtime connection succeeded. Resolution includes:
// - Looking up the McpServer resource by reference
// - Transforming the server config (resolving env var placeholders)
// - Determining which tools to enable
//
// Runtime connection (WebSocket/stdio) happens later and is not tracked here.
message McpServerResolutionStatus {
  // Whether the MCP server was successfully resolved and configured.
  // true: Server found, config transformed, ready for runtime connection
  // false: Resolution failed (server not found, missing env var, invalid config)
  bool resolved = 1;

  // Human-readable status message explaining the resolution outcome.
  // For success: "Configured successfully"
  // For failure: Describes what went wrong
  // Examples:
  //   - "Configured successfully"
  //   - "Server not found"
  //   - "Missing required environment variable: GITHUB_TOKEN"
  //   - "Invalid server configuration: missing command"
  string message = 2;

  // Number of tools enabled from this MCP server.
  // Reflects the intersection of server's available tools and enabled_tools config.
  // 0 if resolution failed, server has no tools, or all tools disabled.
  int32 enabled_tool_count = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// Context Management Types (Phase 3)
//
// These types provide visibility into context window utilization and
// automatic summarization for long-running agent conversations.
// ─────────────────────────────────────────────────────────────────────────────

// SummarizationEvent records a single summarization occurrence during execution.
//
// Each time the context window approaches the model's limit and summarization
// is triggered, an event is recorded with before/after metrics.
//
// ## Purpose
//
// - **Debugging**: Understand when and why summarization occurred
// - **Monitoring**: Track summarization frequency and effectiveness
// - **Cost analysis**: Measure compression ratios and summarization costs
// - **Performance**: Track summarization latency
//
// ## Event Timing
//
// Events are recorded immediately after successful summarization, capturing:
// - Token counts before and after (to measure compression)
// - Message counts before and after (to understand conversation reduction)
// - Duration in milliseconds (to track performance)
// - Model used (to understand cost implications)
//
// @since Phase 3 (Context Summarization Architecture)
message SummarizationEvent {
  // ISO 8601 timestamp when summarization occurred.
  // Example: "2026-01-31T14:30:00.123Z"
  string timestamp = 1;

  // Token count before summarization.
  // This was the token count that exceeded the trigger threshold.
  int32 tokens_before = 2;

  // Token count after summarization.
  // Should be approximately at or below the target_tokens threshold.
  int32 tokens_after = 3;

  // Compression ratio achieved (0.0 to 1.0).
  //
  // Calculated as: 1 - (tokens_after / tokens_before)
  // Example: 0.6 means 60% reduction in tokens (from 100K to 40K).
  //
  // Higher values indicate more aggressive compression.
  // Typical values range from 0.3 to 0.7 depending on conversation content.
  float compression_ratio = 4;

  // Time taken to perform summarization in milliseconds.
  //
  // Includes the LLM call to the summarization model, message processing,
  // and summary injection. Does not include token counting.
  //
  // Typical values: 1000-5000ms depending on context size and model.
  int32 duration_ms = 5;

  // Model used for summarization (economy-tier model).
  //
  // Summarization uses cost-effective models to minimize expense:
  // - For Anthropic: claude-haiku-4
  // - For OpenAI: gpt-4o-mini
  // - For Ollama: local model
  //
  // Example: "claude-haiku-4", "gpt-4o-mini"
  string summarization_model = 6;

  // Number of messages in conversation before summarization.
  // Provides insight into conversation length that triggered summarization.
  int32 messages_before = 7;

  // Number of messages in conversation after summarization.
  // Typically reduced significantly as historical messages are collapsed.
  int32 messages_after = 8;
}

// ContextInfo provides visibility into context window utilization.
//
// This message enables monitoring, debugging, and optimization of context
// usage during agent executions. It tracks both the current state and
// historical summarization events.
//
// ## Real-Time Updates
//
// Fields are updated progressively during execution:
// - current_token_count: Updated after each LLM call
// - utilization_percent: Recalculated when token count changes
// - summarization_events: Appended when summarization occurs
//
// ## Configuration Visibility
//
// The message also surfaces the effective configuration:
// - What thresholds are in effect (model defaults or custom overrides)
// - Whether summarization is enabled
// - The model's context window limit
//
// ## Use Cases
//
// - **Dashboard**: Show context health indicator (green/yellow/red based on utilization)
// - **Alerts**: Notify when utilization consistently exceeds thresholds
// - **Analytics**: Track summarization frequency across agent fleet
// - **Debugging**: Understand context-related failures
//
// @since Phase 3 (Context Summarization Architecture)
message ContextInfo {
  // Current token count in the context window.
  //
  // This is the most recent token count, updated after each LLM call
  // or summarization event. Represents the total tokens in the
  // conversation (system prompt + messages + tool results).
  //
  // Updated progressively during streaming for real-time visibility.
  int32 current_token_count = 1;

  // Model's maximum context window size in tokens.
  //
  // Retrieved from Model Registry for the configured model.
  // Example values:
  // - claude-sonnet-4.5: 200,000
  // - gpt-4o: 128,000
  // - gpt-4-turbo: 128,000
  //
  // Used to calculate utilization_percent.
  int32 context_window_limit = 2;

  // Token threshold that triggers summarization.
  //
  // When current_token_count exceeds this value, summarization is triggered
  // to reduce context size. This is either the model default from Model
  // Registry or a custom override from ContextManagementConfig.
  //
  // Typically set to ~90% of context_window_limit.
  int32 summarization_trigger_threshold = 3;

  // Target token count after summarization.
  //
  // Summarization aims to reduce context to approximately this size.
  // This is either the model default from Model Registry or a custom
  // override from ContextManagementConfig.
  //
  // Typically set to ~80% of context_window_limit.
  int32 summarization_target_tokens = 4;

  // Whether summarization is enabled for this execution.
  //
  // false if ContextManagementConfig.disable_summarization was true.
  // true otherwise (default).
  //
  // When false, no summarization events will occur regardless of
  // token count. The execution may fail if context exceeds limits.
  bool summarization_enabled = 5;

  // Summarization events that occurred during this execution.
  //
  // Ordered chronologically (oldest first).
  // Empty if no summarization was triggered during execution.
  //
  // Multiple events indicate a very long-running conversation that
  // required multiple rounds of summarization.
  repeated SummarizationEvent summarization_events = 6;

  // Context utilization as a percentage (0-100).
  //
  // Calculated as: (current_token_count / context_window_limit) * 100
  //
  // Use for health indicators:
  // - 0-70%: Green (healthy)
  // - 70-90%: Yellow (approaching threshold)
  // - 90-100%: Red (at or above trigger threshold)
  //
  // Updated progressively during streaming.
  float utilization_percent = 7;
}

// ─────────────────────────────────────────────────────────────────────────────
// Execution Artifacts (Artifact Lifecycle)
//
// These types support file artifacts from agent executions.
// ─────────────────────────────────────────────────────────────────────────────

// ExecutionArtifact represents a file or directory published by an agent.
//
// When an agent creates artifacts that users should download, it calls
// the publish_artifact tool. This generates a downloadable artifact stored
// in R2 with a time-limited signed URL.
//
// ## Storage
//
// Artifacts are stored in R2 under: artifacts/{execution_id}/{filename}
// Download URLs are pre-signed and expire after a configured period.
//
// ## Directory Handling
//
// Directories are automatically archived as ZIP files before storage.
// The kind field indicates DIRECTORY so clients know to extract after download.
//
// @since Artifact Lifecycle (Attachments & Artifacts)
message ExecutionArtifact {
  // Display name for this artifact.
  // Example: "generated-skill", "analysis-report"
  string name = 1;

  // Original path in sandbox where the artifact was created.
  // Example: "/workspace/my-skill", "/tmp/report.pdf"
  string sandbox_path = 2;

  // Type of artifact: file or directory.
  ExecutionArtifactKind kind = 3 [(buf.validate.field).enum.defined_only = true];

  // Total size in bytes.
  // For directories, this is the ZIP file size.
  int64 size_bytes = 4;

  // Storage location in R2.
  // Format: "artifacts/{execution_id}/{filename}"
  string storage_key = 5;

  // Pre-signed URL for downloading the artifact.
  // Expires after a configured period (default: 7 days).
  // Clients can call the refresh endpoint to get a new URL if expired.
  string download_url = 6;

  // ISO 8601 timestamp when the artifact was created.
  // Example: "2026-02-13T10:30:00Z"
  string created_at = 7;

  // ISO 8601 timestamp when the download URL expires.
  // Example: "2026-02-20T10:30:00Z"
  string expires_at = 8;
}

// ─────────────────────────────────────────────────────────────────────────────
// Human-in-the-Loop (HITL) Approval Types (Phase 1)
//
// These types support the approval flow for tool execution requiring user consent.
// ─────────────────────────────────────────────────────────────────────────────

// ApprovalAction represents the user's decision on an approval request.
//
// ## Action Semantics
//
// - APPROVE: Execute the tool normally, continue execution
// - SKIP: Return "skipped by user" message to LLM, continue execution
// - REJECT: Fail the execution immediately with rejection error
//
// ## LLM Behavior on Skip
//
// When a tool is skipped, the LLM receives a message like:
// "Tool 'delete_repository' was skipped by user. Please proceed without this operation."
// This allows the LLM to adapt its plan while preserving execution continuity.
//
// ## Usage
//
// Used in:
// - ToolCall.approval_action: Records the decision made
// - SubmitApprovalInput.action: User's submitted decision
enum ApprovalAction {
  // Unspecified action (invalid, should never be used).
  // SubmitApproval RPC rejects this value.
  APPROVAL_ACTION_UNSPECIFIED = 0;

  // Execute the tool normally.
  // Tool transitions from WAITING_APPROVAL to RUNNING, then executes.
  // Execution phase returns to IN_PROGRESS.
  APPROVAL_ACTION_APPROVE = 1;

  // Skip tool execution, continue without it.
  // Tool transitions to SKIPPED status.
  // LLM receives: "Tool '{name}' was skipped by user. Please proceed without this operation."
  // Execution continues - this is NOT a failure.
  APPROVAL_ACTION_SKIP = 2;

  // Reject tool execution, fail the entire execution.
  // Execution phase transitions to FAILED.
  // Error message includes rejection reason from user's comment.
  APPROVAL_ACTION_REJECT = 3;
}

// PendingApproval surfaces the current approval request for UI display.
//
// ## Purpose
//
// This message provides all information needed for a UI to render an approval
// dialog/card. It's populated when an execution enters WAITING_FOR_APPROVAL phase.
//
// ## Relationship to ToolCall
//
// While ToolCall contains the canonical approval state, PendingApproval provides
// a denormalized view optimized for UI consumption. The tool_call_id links back
// to the authoritative ToolCall record.
//
// ## Sub-Agent Approvals
//
// When a sub-agent's tool requires approval, the main agent's pending_approval
// is populated with from_sub_agent=true. This allows UI to show:
// "Sub-agent 'code-reviewer' needs approval to execute 'delete_file'"
//
// ## Lifecycle
//
// 1. Tool with requires_approval=true is about to execute
// 2. PendingApproval is populated, phase becomes WAITING_FOR_APPROVAL
// 3. User calls SubmitApproval RPC with their decision
// 4. PendingApproval is cleared, phase returns to IN_PROGRESS (or FAILED on REJECT)
message PendingApproval {
  // ID of the tool call waiting for approval.
  // Use this when calling SubmitApproval to identify which tool call to resume.
  // Format: Tool call ID from the agent runtime (e.g., "call_abc123")
  string tool_call_id = 1;

  // Name of the tool requiring approval.
  // Matches ToolCall.name for correlation.
  // Example: "delete_repository", "send_email", "execute_sql"
  string tool_name = 2;

  // Human-readable approval message for display.
  // Copied from ToolCall.approval_message for UI convenience.
  // Contains resolved placeholders (e.g., "Delete repo: my-repo")
  string message = 3;

  // Sanitized preview of tool arguments for informed decision-making.
  // Sensitive values (passwords, tokens) are redacted.
  // Displayed as formatted JSON or key-value pairs in UI.
  //
  // Example:
  //   {
  //     "repository": "acme/important-repo",
  //     "force": true,
  //     "reason": "cleanup"
  //   }
  string args_preview = 4;

  // ISO 8601 timestamp when the approval was requested.
  // Enables UI to show waiting duration: "Waiting for 2 minutes"
  // Example: "2026-01-30T15:30:00Z"
  string requested_at = 5;

  // True if this approval originates from a sub-agent.
  // Enables differentiated UI treatment:
  //   - false: "Agent needs approval to..."
  //   - true: "Sub-agent 'name' needs approval to..."
  bool from_sub_agent = 6;

  // Name of the sub-agent if from_sub_agent is true.
  // Example: "code-reviewer", "researcher", "debugger"
  // Empty if from_sub_agent is false.
  string sub_agent_name = 7;

  // ID of the child agent execution (for workflow-level approvals only).
  //
  // Populated when this PendingApproval is surfaced at WorkflowExecution level.
  // Empty when pending_approval is on AgentExecution directly.
  //
  // Use this ID to forward approvals from workflow to child agent via
  // AgentExecution.submitApproval RPC.
  //
  // Format: "aex_abc123xyz456"
  //
  // @since Phase 5.3 (Approval Forwarding)
  string child_agent_execution_id = 8;

  // LangGraph interrupt ID for targeted resume.
  //
  // When the LLM returns multiple tool calls requiring approval in a single
  // response, LangGraph creates one interrupt per tool. Each interrupt receives
  // a unique ID. On resume, `Command(resume={interrupt_id: value})` must target
  // the specific interrupt; otherwise LangGraph raises
  // "multiple pending interrupts, you must specify the interrupt id."
  //
  // Populated by the agent-runner after the event stream ends by querying
  // `graph.get_state(config).interrupts`. Matched to the tool call via
  // the interrupt's value payload (which contains tool_name).
  //
  // Empty for legacy executions or single-interrupt scenarios (backward compat).
  //
  // @since Batch Approval (Multiple Interrupts)
  string interrupt_id = 9;
}

// ─────────────────────────────────────────────────────────────────────────────
// Child Approval Notification (HITL Phase 5.1 — Batch)
//
// Signal payload for events-based approval propagation to parent workflows.
// Carries ALL pending approvals from a single child agent in one signal.
// ─────────────────────────────────────────────────────────────────────────────

// ChildApprovalNotification is the signal payload sent to parent workflows
// when a child agent enters WAITING_FOR_APPROVAL state.
//
// This enables events-based notification instead of polling, providing
// sub-100ms latency for approval state propagation from child agents to
// parent workflows.
//
// ## Signal Flow
//
// 1. Child agent requires tool approval (phase = WAITING_FOR_APPROVAL)
// 2. Java workflow detects this and builds ChildApprovalNotification
// 3. Java sends Temporal signal "child_approval_required" to parent workflow
// 4. Parent Go workflow receives signal via signal channel
// 5. Parent updates task status to WORKFLOW_TASK_WAITING_APPROVAL
// 6. Parent populates WorkflowExecution.status.pending_approvals
//
// ## Parent Workflow Actions
//
// Upon receiving this signal, the parent workflow should:
// 1. Update its task status to WORKFLOW_TASK_WAITING_APPROVAL
// 2. Populate WorkflowExecution.status.pending_approvals with all entries
// 3. Surface the approval requests to users via UI/API
//
// ## Graceful Degradation
//
// If the signal fails to send (parent workflow completed, network error),
// the system continues to function. Users can still submit approvals directly
// via the AgentExecution.SubmitApproval RPC.
//
// @since Phase 5.1 (Events-Based Approval Notification)
message ChildApprovalNotification {
  // Child agent execution ID that requires approval.
  // Format: AgentExecution.metadata.id (e.g., "agx-abc123xyz456")
  // Used by parent to track which child needs approval.
  string execution_id = 1;

  // All pending approvals from this child agent execution.
  //
  // Contains one entry per tool call requiring approval. Each entry carries
  // the full PendingApproval details (tool_call_id, tool_name, message,
  // args_preview, requested_at, interrupt_id).
  //
  // The child_agent_execution_id on each entry is set to execution_id above
  // so the parent can correlate approvals to the originating child.
  //
  // One signal, complete picture, no partial states.
  repeated PendingApproval pending_approvals = 2;
}
