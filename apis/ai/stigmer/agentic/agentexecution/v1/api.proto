syntax = "proto3";

package ai.stigmer.agentic.agentexecution.v1;

import "ai/stigmer/agentic/agentexecution/v1/approval.proto";
import "ai/stigmer/agentic/agentexecution/v1/artifact.proto";
import "ai/stigmer/agentic/agentexecution/v1/context.proto";
import "ai/stigmer/agentic/agentexecution/v1/enum.proto";
import "ai/stigmer/agentic/agentexecution/v1/message.proto";
import "ai/stigmer/agentic/agentexecution/v1/spec.proto";
import "ai/stigmer/agentic/agentexecution/v1/subagent.proto";
import "ai/stigmer/agentic/agentexecution/v1/todo.proto";
import "ai/stigmer/agentic/agentexecution/v1/usage.proto";
import "ai/stigmer/agentic/agentexecution/v1/writeback.proto";
import "ai/stigmer/commons/apiresource/metadata.proto";
import "ai/stigmer/commons/apiresource/status.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// AgentExecution represents a single agent execution instance (conversational).
// Follows the standard pattern: spec contains user inputs, status contains execution results.
message AgentExecution {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = 'agentic.stigmer.ai/v1'];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = 'AgentExecution'];

  // Standard resource metadata including name, id, labels, and tags.
  // Agent executions belong to an organization and inherit permissions from the session.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // User-provided inputs for this execution.
  // Contains: session_id, agent_id, message, execution_config, environment_id, credential_overrides
  AgentExecutionSpec spec = 4;

  // System-managed execution state and results.
  // Contains: messages, phase, sub_agents, pending_approvals, timestamps, errors
  AgentExecutionStatus status = 5;
}

// AgentExecutionStatus contains all execution results and state.
// Everything populated during or after execution goes here, not in spec.
message AgentExecutionStatus {
  // Standard audit information (created_at, updated_at, created_by, etc.)
  ai.stigmer.commons.apiresource.ApiResourceAudit audit = 99;

  // Sequential stream of execution events: AI messages, tool calls, and system notifications.
  // Ordered chronologically to reconstruct the complete execution flow.
  // Each message captures what happened during execution (agent responses, tool invocations, progress updates).
  repeated AgentMessage messages = 1;

  // Current execution lifecycle phase.
  // Tracks the execution state from creation (PENDING) through active processing (IN_PROGRESS)
  // to terminal states (COMPLETED/FAILED/CANCELLED).
  ExecutionPhase phase = 2 [(buf.validate.field).enum.defined_only = true];

  // Sub-agent executions invoked during this execution.
  // Tracks when the main agent delegates work to specialized sub-agents.
  // Ordered chronologically by invocation time.
  repeated SubAgentExecution sub_agent_executions = 4;

  // Error message if execution failed.
  // Only populated when phase == EXECUTION_FAILED.
  string error = 6;

  // ISO 8601 timestamp when execution started.
  // Example: "2025-01-10T10:30:00Z"
  string started_at = 7;

  // ISO 8601 timestamp when execution completed, failed, or was cancelled.
  // Only populated for terminal states.
  string completed_at = 8;

  // Todo list tracking multi-step tasks and progress for this execution.
  // Updated via write_todos tool (if TodoListMiddleware is enabled).
  // Each execution maintains its own snapshot of todos at execution time.
  // Key: todo item ID, Value: todo item details
  map<string, TodoItem> todos = 9;

  // Callback token for notifying a parent workflow when this execution completes.
  //
  // Present when this execution was triggered by a workflow. Empty when the
  // execution runs independently (chat, API call).
  //
  // @internal
  //
  // When this AgentExecution is triggered from a Temporal activity, the
  // calling activity passes its task token here. The agent-runner completes
  // the external activity when the execution finishes.
  //
  // Token Handshake Pattern:
  // 1. External activity extracts token and stores in AgentExecution.status
  // 2. Activity returns activity.ErrResultPending (paused, thread freed)
  // 3. Agent executes (seconds to minutes)
  // 4. On completion: agent-runner completes external activity via token
  //
  // Why in Status (not Spec):
  // - System-generated by Temporal, not user-provided
  // - Runtime state, not configuration
  // - Ephemeral, only relevant during execution
  //
  // References:
  // - WorkflowExecution.spec.callback_token (field 7) - Same pattern
  // - ADR: docs/adr/20260122-async-agent-execution-temporal-token-handshake.md
  bytes callback_token = 10;

  // ─────────────────────────────────────────────────────────────────────────────
  // Resolved Execution Context (Phase 2.5)
  //
  // Captures what resources the agent actually had access to at execution time.
  // ─────────────────────────────────────────────────────────────────────────────

  // Resolved execution context showing what resources the agent had access to.
  // Populated once before streaming begins, after all resources are resolved.
  // Immutable after initial population - represents the "snapshot" of resolved state.
  ResolvedExecutionContext resolved_context = 12;

  // ─────────────────────────────────────────────────────────────────────────────
  // Pending Approvals (HITL — Computed Projection)
  //
  // Server-side computed projection of tool calls awaiting user approval.
  // Recomputed on every UpdateStatus write — never stale, never merged.
  // ─────────────────────────────────────────────────────────────────────────────

  // Active pending approval requests for this execution.
  //
  // Contains one entry per tool call that requires user approval before
  // it can proceed. Sub-agent approvals are included with from_sub_agent
  // set to true. Empty when no approvals are pending.
  //
  // @internal
  //
  // Computed server-side by the Go/Java UpdateStatus handlers on every write.
  // The handler scans messages[].tool_calls and
  // sub_agent_executions[].messages[].tool_calls, collecting entries where
  // status == WAITING_APPROVAL && requires_approval == true, and projects
  // them into PendingApproval entries.
  //
  // Because this field is recomputed (not merged), it is always consistent
  // with the authoritative tool call state embedded in messages. No lifecycle
  // state machine, no merge logic, no forward-only enforcement needed.
  //
  // Lifecycle:
  // 1. Agent-runner sets ToolCall.status = WAITING_APPROVAL on the message
  // 2. UpdateStatus handler recomputes this field, entry appears
  // 3. Phase changes to EXECUTION_WAITING_FOR_APPROVAL
  // 4. User submits decisions via SubmitApproval RPC (one per tool call)
  // 5. Agent resumes, ToolCall.status advances, next recompute drops the entry
  repeated PendingApproval pending_approvals = 16;

  // ─────────────────────────────────────────────────────────────────────────────
  // Context Management (Phase 3)
  //
  // Context window utilization and automatic summarization tracking.
  // ─────────────────────────────────────────────────────────────────────────────

  // Context window utilization and summarization tracking.
  //
  // Provides visibility into how the agent is using its context window and
  // any summarization events that occurred during execution.
  //
  // Populated when context management is active (not disabled via config).
  // Updated progressively during streaming as token counts change.
  //
  // Use cases:
  // - **Monitoring**: Track context utilization across executions
  // - **Debugging**: Understand why an execution hit context limits
  // - **Cost optimization**: Identify executions with excessive summarization
  // - **UX**: Show users their context window health
  //
  // @since Phase 3 (Context Summarization Architecture)
  ContextInfo context_info = 14;

  // ─────────────────────────────────────────────────────────────────────────────
  // Execution Artifacts (Artifact Lifecycle)
  //
  // Files and directories published by the agent for download.
  // ─────────────────────────────────────────────────────────────────────────────

  // Files/directories published by the agent for download.
  //
  // When an agent creates artifacts (e.g., generated code, reports, skills),
  // it can call the publish_artifact tool to make them downloadable.
  // Each artifact includes a pre-signed URL for direct download.
  //
  // Artifacts are stored in R2 and URLs expire after a configured period.
  // Use the execution download endpoint to refresh expired URLs.
  //
  // Ordered by creation time (oldest first).
  //
  // @since Artifact Lifecycle (Attachments & Artifacts)
  repeated ExecutionArtifact artifacts = 15;

  // ─────────────────────────────────────────────────────────────────────────────
  // Workspace Write-Backs (Platform-Owned Git Workflow)
  //
  // Outcomes of the platform's automatic branch/commit/push/PR workflow
  // for git-backed workspace entries.
  // ─────────────────────────────────────────────────────────────────────────────

  // Git write-back outcomes for workspace entries that had changes.
  //
  // One entry per git-backed workspace entry where the agent modified
  // files and write_back_mode was enabled on the GitRepoSource. Omitted
  // for workspace entries with no changes, non-git sources, or disabled
  // write-back mode.
  //
  // Populated during post-execution processing. Each entry tracks the
  // write-back lifecycle (committed -> pushed -> PR created) and carries
  // the PR URL for UI display.
  //
  // @since Platform-Owned Git Write-Back
  repeated WorkspaceWriteBack workspace_write_backs = 17;

  // ─────────────────────────────────────────────────────────────────────────────
  // Setup Progress (Real-Time Setup Phase Reporting)
  //
  // Replaces the frontend's timer-based approximation with server-reported
  // setup phases so subscribers see what the worker is actually doing.
  // ─────────────────────────────────────────────────────────────────────────────

  // Real-time setup progress reported by the agent-runner during EXECUTION_PENDING.
  // Populated progressively as the worker completes setup steps (sandbox init,
  // workspace provisioning, skill loading, MCP server connection, etc.).
  // Only meaningful while phase == EXECUTION_PENDING. Cleared by the server
  // when phase transitions away from PENDING.
  SetupProgress setup_progress = 18;

  // ─────────────────────────────────────────────────────────────────────────────
  // Execution Usage (DISPLAY_ONLY Trust Level)
  //
  // Provisional usage captured from the execution worker's onDelta callbacks.
  // For Cursor harness: accumulated from SDK turn-ended events.
  // For native harness: not populated (authoritative usage comes from proxy).
  //
  // Trust: DISPLAY_ONLY. Not billing-authoritative. Use for real-time UX only.
  // Billing settlement comes from LlmCallUsageRecord (proxy-reported) or
  // future Cursor Admin API reconciliation.
  // ─────────────────────────────────────────────────────────────────────────────

  // Streaming usage summary, updated progressively during execution.
  StreamingUsageSummary streaming_usage = 20;

  // ─────────────────────────────────────────────────────────────────────────────
  // Structured Output (Deterministic Agent Responses)
  //
  // Schema-conforming data extracted from the agent's final response.
  // Replaces regex-based parsing for architect/refine/diagnose flows.
  // ─────────────────────────────────────────────────────────────────────────────

  // Structured output extracted from the agent's final response.
  //
  // Populated when ExecutionConfig.structured_output_schema was set and the
  // runner successfully extracted schema-conforming data. Only meaningful
  // when phase is EXECUTION_COMPLETED.
  //
  // For native harness: populated from LangGraph graphState.structuredResponse
  // (ToolStrategy enforcement). For Cursor harness: populated from 3-tier
  // extraction (JSON.parse → fence extraction → extraction LLM fallback).
  //
  // Consumers: frontend architect/refine hooks read this instead of parsing
  // YAML from messages. Workflow callback path reads structured_output from
  // the Temporal activity result (separate channel, same data).
  google.protobuf.Struct structured_output = 21;
}

// Setup progress reported during the EXECUTION_PENDING phase.
//
// @internal
// Designed as a sub-message (rather than a bare string) so future fields
// (completed_phases, total_phases, phase_index) can be added without
// deprecation or breaking changes.
message SetupProgress {
  // Human-readable label for the current setup phase.
  // Examples: "Initializing sandbox…", "Setting up workspace…", "Loading skills…"
  // Empty when setup phase reporting has not started or is complete.
  string current_phase = 1;
}
