syntax = "proto3";

package ai.stigmer.agentic.agentexecution.v1;

import "ai/stigmer/agentic/agentexecution/v1/enum.proto";
import "ai/stigmer/agentic/executioncontext/v1/spec.proto";
import "ai/stigmer/agentic/session/v1/spec.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// AgentExecutionSpec contains only user-provided inputs for triggering an execution.
// All execution results and state live in AgentExecutionStatus (in api.proto).
message AgentExecutionSpec {
  option (buf.validate.message).cel = {
    id: "agent_execution.session_exclusive"
    message: "session_id and session_spec are mutually exclusive — reference an existing session or define a new one, not both"
    expression: "!(this.session_id != '' && has(this.session_spec))"
  };
  option (buf.validate.message).cel = {
    id: "agent_execution.session_spec_harness_state"
    message: "session_spec.harness_state_id must be empty — harness state is created by the runner after the first execution"
    expression: "!has(this.session_spec) || this.session_spec.harness_state_id == ''"
  };

  // Session ID this execution belongs to (optional).
  //
  // Resolution priority (enforced in handler pipeline):
  //   1. session_id provided     -> use existing session
  //   2. session_spec provided   -> auto-create session from the embedded spec
  //   3. agent_id provided       -> auto-create session using agent's default instance
  //   4. neither provided        -> resolve platform default agent (label
  //      stigmer.ai/default-agent + visibility_public), then auto-create session
  //
  // session_id and agent_id may both be set — when both are present, session_id
  // is used for session resolution and agent_id is preserved as metadata for
  // downstream consumers (e.g., session subject generation). session_id and
  // session_spec are mutually exclusive.
  string session_id = 1;

  // Agent ID (optional).
  //
  // When absent along with session_id, the backend resolves the platform's
  // public default agent — the agent labeled stigmer.ai/default-agent: "true"
  // with visibility_public. This enables session-first UX where users start
  // a conversation without choosing an agent.
  //
  // Both may be set — agent_id is preserved on the execution record even when
  // session_id is present, so downstream consumers can access the agent
  // without resolving through the session chain.
  //
  // When provided without session_id, a new session is auto-created using
  // the agent's default instance ID.
  string agent_id = 2;

  // Spec for the session to auto-create when session_id is empty (optional).
  //
  // This is the one-call session bootstrap: a single create carries the full
  // session shape (workspace_entries, harness, execution_target, MCP servers,
  // skills) together with the first message, so embedders do not need to
  // orchestrate session.create followed by agentExecution.create. The created
  // session's ID is returned on the persisted execution's session_id.
  //
  // Fields that must be set at session-creation time and are immutable once
  // an execution has run — harness and execution_target — can only reach an
  // auto-created session through this field.
  //
  // When session_spec.agent_instance_id is set, the session runs against that
  // instance and agent_id must not also be resolved from it. When empty, the
  // normal resolution applies: agent_id's default instance, or the platform
  // default agent when agent_id is also empty.
  //
  // Mutually exclusive with session_id. session_spec.harness_state_id must be
  // empty — it is server-owned harness continuity state, created by the runner
  // after the first execution.
  //
  // @internal
  // The Session resource created from this spec is the single source of truth
  // for session configuration. The handler clears this field after the session
  // is created (before persist), so the execution record never carries a
  // second copy of session config that could drift as the session evolves.
  // Extends the existing auto-create path in createSessionIfNeededStep rather
  // than adding a parallel one (stigmer/stigmer#249).
  ai.stigmer.agentic.session.v1.SessionSpec session_spec = 13;

  // User input message that triggers this execution.
  // Each execution represents one user message and the agent's response.
  string message = 3 [(buf.validate.field).string.min_len = 1];

  // Optional execution-time configuration overrides.
  // Example: Specify the model to use for this execution.
  ExecutionConfig execution_config = 4;

  // Runtime environment variables and secrets (execution-scoped).
  // These values are only available for this specific execution.
  // Use case: B2B integrations where secrets are injected at runtime (e.g., Plant & Cloud).
  // These values are stored in ExecutionContext and deleted when execution completes.
  // Merge priority: Agent defaults < Environment < runtime_env (highest)
  map<string, ai.stigmer.agentic.executioncontext.v1.ExecutionValue> runtime_env = 5;

  // ============================================================================
  // Temporal Async Activity Completion Token (Token Handshake Pattern)
  // ============================================================================

  // Callback token for async activity completion (optional).
  //
  // When a workflow invokes an agent, this token enables the workflow to
  // wait for the agent to finish without blocking. When empty, the
  // execution runs independently (CLI, API calls, non-workflow triggers).
  //
  // @internal
  //
  // Enables async completion pattern where the caller (typically a
  // workflow activity) waits for actual agent completion without blocking
  // worker threads.
  //
  // Flow:
  // 1. Caller (Go Temporal activity) extracts its task token
  // 2. Passes token in this field when creating AgentExecution
  // 3. Returns activity.ErrResultPending (activity paused, thread released)
  // 4. Agent workflow completes (minutes/hours later)
  // 5. Agent workflow calls ActivityCompletionClient.complete(token, result)
  // 6. Temporal resumes the paused activity with the result
  //
  // Token Format:
  // - Opaque binary blob from Temporal SDK (typically 100-200 bytes)
  // - Contains: namespace, workflow ID, run ID, activity ID, attempt
  // - DO NOT parse or modify - treat as opaque handle
  //
  // Security:
  // - Token grants ability to complete the activity (bearer token)
  // - Should only be passed through trusted internal services
  // - Logged as Base64-encoded string (truncated for security)
  //
  // Timeout:
  // - Caller should set StartToCloseTimeout (e.g., 24 hours)
  // - If token callback never arrives, activity times out
  //
  // Example Usage (Go):
  // ```go
  // func CallAgentActivity(ctx context.Context, config *AgentCallTaskConfig) {
  //     taskToken := activity.GetInfo(ctx).TaskToken
  //     execution := &AgentExecution{
  //         Spec: &AgentExecutionSpec{
  //             AgentId: config.Agent,
  //             Message: config.Message,
  //             CallbackToken: taskToken,
  //         },
  //     }
  //     client.Create(ctx, execution)
  //     return nil, activity.ErrResultPending
  // }
  // ```
  //
  // References:
  // - ADR: docs/adr/20260122-async-agent-execution-temporal-token-handshake.md
  // - Temporal Docs: https://docs.temporal.io/activities#asynchronous-activity-completion
  //
  // @since 2026-01-22 (Phase 2: Async Agent Execution Integration)
  bytes callback_token = 6;

  // ─────────────────────────────────────────────────────────────────────────────
  // Approval Configuration (HITL Phase 1)
  //
  // Runtime control over approval behavior for this specific execution.
  // ─────────────────────────────────────────────────────────────────────────────

  // Auto-approve all tool executions for this execution.
  //
  // When true, tools that would normally require approval are automatically
  // approved without user intervention. This is the highest-priority override
  // in the approval policy chain:
  //   McpServerStatus.tool_approvals → McpServerSpec.pinned_tool_approvals → Agent.tool_approval_overrides → auto_approve_all
  //
  // Use cases:
  // - Automated CI/CD pipelines where human approval isn't practical
  // - Trusted batch operations with pre-validated inputs
  // - Development/testing environments
  // - Scheduled jobs where approval would block automation
  //
  // Security consideration: This flag bypasses all approval checks.
  // Ensure appropriate access controls on who can set this flag.
  // Consider auditing executions where this flag is used.
  //
  // Default: false (approvals required as configured in policies)
  bool auto_approve_all = 7;

  // ─────────────────────────────────────────────────────────────────────────────
  // Parent Workflow Context (HITL Phase 5.1)
  //
  // Events-based notification for approval state propagation.
  // ─────────────────────────────────────────────────────────────────────────────

  // Parent workflow ID when this execution was triggered by a workflow (optional).
  //
  // When set, the platform notifies the parent workflow about approval
  // requests instead of requiring polling. When empty, approvals are
  // submitted directly via the SubmitApproval RPC.
  //
  // @internal
  //
  // Signal Pattern:
  // 1. Go workflow passes its workflow ID when creating AgentExecution
  // 2. Go workflow starts signal listener for "child_approval_required"
  // 3. When agent enters WAITING_FOR_APPROVAL, Java sends signal to parent
  // 4. Go workflow receives signal, updates task status to WAITING_APPROVAL
  //
  // Format:
  // Temporal workflow ID, typically: "stigmer/workflow-execution/invoke/{execution-id}"
  //
  // Backward Compatibility:
  // This field is optional. Agents invoked without a parent workflow ID will
  // continue to work normally - approval is submitted directly via the
  // AgentExecution.SubmitApproval RPC.
  //
  // @since Phase 5.1 (Events-Based Approval Notification)
  string parent_workflow_id = 8;

  // ─────────────────────────────────────────────────────────────────────────────
  // File Attachments (Artifact Lifecycle)
  //
  // Files to inject into the sandbox before execution begins.
  // ─────────────────────────────────────────────────────────────────────────────

  // Files attached to this execution.
  //
  // Attachments are injected into the sandbox before execution begins.
  // The agent can read these files from the specified mount paths.
  //
  // Use cases:
  // - Provide input data files to process
  // - Pass configuration files
  // - Supply reference documents for analysis
  //
  // Example CLI usage:
  //   stigmer run agent my-agent --attach ./config.yaml -m "Process this config"
  //
  // @since Artifact Lifecycle (Attachments & Outputs)
  repeated Attachment attachments = 9;

  // ─────────────────────────────────────────────────────────────────────────────
  // Workspace File References (Workspace-Aware Attachments)
  //
  // Lightweight attention signals for files already in the workspace.
  // ─────────────────────────────────────────────────────────────────────────────

  // Workspace-relative file paths the user wants the agent to focus on.
  //
  // When users reference files that exist inside the session's workspace,
  // the client records the workspace-relative path here instead of uploading.
  // The agent accesses these files directly via the workspace filesystem --
  // no upload, no copy, no injection.
  //
  // This separates the "attention" signal ("look at this file") from the
  // "transport" mechanism (upload + inject) that regular attachments use.
  //
  // Works for any workspace type with a resolvable filesystem post-provisioning
  // (local-path workspaces, git-cloned workspaces, or any future source type).
  // The runner resolves paths after workspace provisioning regardless of source.
  //
  // Populated by:
  //   - CLI: detects --attach paths inside workspace roots automatically
  //   - Web/Desktop: drag-to-reference from workspace file tree to composer
  //
  // Example CLI usage:
  //   stigmer run agent reviewer --workspace . --attach ./src/config.yaml -m "Review"
  //   # CLI detects src/config.yaml is inside workspace -> workspace_file_ref
  //   # No upload, no injection; agent reads directly from src/config.yaml
  //
  // @since Workspace-Aware File Referencing
  repeated string workspace_file_refs = 10;

  // ─────────────────────────────────────────────────────────────────────────────
  // Sandbox Affinity (Workflow Sandbox Sharing)
  //
  // Explicit task queue override for co-locating agent execution with parent workflow.
  // ─────────────────────────────────────────────────────────────────────────────

  // Explicit Temporal task queue override for activity routing.
  //
  // @internal
  // When set, the agent execution's activities are routed to this queue
  // instead of the normally-resolved queue (session:{id} or global stigmer_runner).
  // This enables sandbox sharing: a parent workflow execution passes its own
  // queue so child agents run in the same sandbox without provisioning new VMs.
  //
  // When empty: normal dispatch resolution applies (default behavior).
  //
  // Security: Only accepted from internal callers (workflow engine's CallAgent
  // activity). External API callers cannot set this field — the create handler
  // strips it during input sanitization. Presence of parent_workflow_id is used
  // as a co-validation signal.
  //
  // Format: "wfexec:{workflow_execution_id}" (matches the parent workflow's
  // sandbox queue). The prefix ensures no collision with session:{id} queues.
  //
  // @since Workflow Sandbox Affinity
  string activity_task_queue = 11;

  // ─────────────────────────────────────────────────────────────────────────────
  // Edit-and-Resubmit (Supersede Link)
  //
  // Marks this execution as the corrected replacement of an earlier turn.
  // ─────────────────────────────────────────────────────────────────────────────

  // ID of the execution this one supersedes via edit-and-resubmit (optional).
  //
  // When a user stops an in-flight turn, edits the message, and resubmits,
  // the client sets this field on the NEW execution to point at the stopped
  // one. Chat-thread consumers hide the superseded execution so the edited
  // message replaces the original in place; history surfaces (CLI, execution
  // lists) keep showing the full record.
  //
  // Empty means this execution is not an edit of another turn.
  //
  // @internal
  //
  // The link always lives on the successor — the superseded record is never
  // mutated (append-only execution log, single writer). Chained edits form a
  // chain of links (A <- B <- C), each persisted on its own successor.
  //
  // Display-level semantics only: the runner does NOT rewind model context.
  // Conversation history lives in an opaque session-keyed store (LangGraph
  // checkpoint thread / Cursor SDK agent store) that is resumed as-is, so the
  // superseded turn's partial messages remain visible to the model. Do not
  // build features that assume the runner skips superseded turns.
  //
  // @since Edit-and-Resubmit In Place (stigmer/stigmer#181)
  string supersedes_execution_id = 12;
}

// Configuration that can be applied at execution time.
message ExecutionConfig {
  // The model to use for this execution.
  // Example: "claude-sonnet-4-6"
  string model_name = 1;

  // Context management configuration for this execution.
  // Controls automatic summarization behavior for long-running conversations.
  // When not specified, defaults are derived from the Model Registry.
  ContextManagementConfig context_management = 2;

  // Maximum number of model-to-tools reasoning cycles per message.
  //
  // Each "round" is one model call followed by tool execution — the atomic
  // unit of agent progress.  Internally mapped to LangGraph's recursion_limit
  // (approximately max_tool_rounds × 6 super-steps).
  //
  // ## Conversion
  //
  // LangGraph's recursion_limit counts "super-steps" — individual graph node
  // executions.  Each model-tool round consumes multiple super-steps because
  // every active middleware hook (before_model, after_model, etc.) is a
  // separate graph node.  The conversion formula is:
  //
  //   recursion_limit = max_tool_rounds × 6
  //
  // The ×6 factor is a floor estimate; actual cost per round depends on the
  // middleware stack.
  //
  // ## Default Behavior
  //
  // 0 = unlimited (no artificial recursion limit).
  // The agent runs until the task completes or loop detection middleware
  // detects repetitive behavior (7 consecutive / 20 total duplicate
  // patterns).  This is the recommended default — loop detection is the
  // primary safety mechanism.
  //
  // ## Valid Range
  //
  // When set: 10–1000 rounds (60–6000 super-steps).
  // Values outside this range are clamped to the nearest bound with a
  // warning log.  Sub-agent graphs have their own independent recursion
  // limit (LangGraph default: 10,000) and are not affected by this field.
  //
  // ## User Experience
  //
  // When a limit IS set and the agent approaches it, a graceful wrap-up
  // message is injected at ~80% of the budget.  At 100%, the user sees
  // a "send another message to continue" prompt.
  //
  // @since Recursion Limit Configurability (D1)
  int32 max_tool_rounds = 3;

  // ─────────────────────────────────────────────────────────────────────────────
  // Tool Result Truncation
  //
  // Prevents context window blow-up from large tool outputs.
  // ─────────────────────────────────────────────────────────────────────────────

  // Maximum number of characters for a single tool result before truncation.
  // When a tool result exceeds this limit, it is truncated and a marker is
  // appended: "[truncated — result exceeded {limit} chars, ask for specific sections]"
  //
  // 0 = use platform default (recommended: 30,000 chars ~ 7,500 tokens).
  // Set higher for agents that work with large files/outputs.
  //
  // Applies to all tool results (shell, read, write, MCP tools).
  // Does not apply to built-in tools that already manage their output size.
  int32 max_tool_result_chars = 4;

  // ─────────────────────────────────────────────────────────────────────────────
  // Cost Cap
  //
  // Prevents runaway agents from draining API credits.
  // ─────────────────────────────────────────────────────────────────────────────

  // Maximum estimated cost in USD for this execution.
  // When the running cost exceeds this limit, the agent receives a
  // "budget exhausted" message and the execution transitions to TERMINATED.
  //
  // 0.0 = no cost cap (default, unlimited).
  // Recommended: 1.00-5.00 for interactive sessions, 10.00+ for batch workflows.
  //
  // Cost is checked after each LLM call using the running total from
  // UsageMetrics.estimated_cost_usd. When approaching the cap (>80%),
  // a budget warning is injected into the conversation.
  double max_cost_usd = 5;

  // ─────────────────────────────────────────────────────────────────────────────
  // Interaction Mode
  //
  // Controls the agent's behavioral posture for this execution.
  // ─────────────────────────────────────────────────────────────────────────────

  // Interaction mode for this execution.
  //
  // AGENT (default): full tool access — read, write, create, delete, shell.
  // PLAN: read-only analysis — read, search, list only. No file mutations.
  //
  // When UNSPECIFIED, defaults to AGENT for backward compatibility.
  //
  // The mode is set per-execution and does not carry over between executions
  // in the same session. Users toggle mode in the session composer before
  // sending each message.
  InteractionMode interaction_mode = 6 [(buf.validate.field).enum.defined_only = true];

  // JSON Schema that the agent's output must conform to.
  //
  // When set, the runner enforces structured output:
  // - Native harness: uses deepagents responseFormat/ToolStrategy
  // - Cursor harness: prompt instruction + extraction fallback
  //
  // The validated structured data is returned in the activity result
  // and passed back to the parent workflow as `structured`.
  google.protobuf.Struct structured_output_schema = 7;

  // ─────────────────────────────────────────────────────────────────────────────
  // Build from Plan
  //
  // Marks the execution as the implement turn of a Plan → Build handoff.
  // ─────────────────────────────────────────────────────────────────────────────

  // Marks this execution as a "Build from plan" turn: the user approved a plan
  // produced by a prior Plan-mode execution and asked the agent to implement it.
  //
  // When set, the runner injects the implement-plan directive into the agent's
  // prompt (see runner shared/implement-plan-prompt.ts). If the approved plan
  // document travels as an attachment (the normal case), the directive points
  // the agent at the attached plan file and treats it as authoritative; when no
  // plan attachment is present (e.g. the client's upload failed), the directive
  // tells the agent to follow the plan from the conversation instead.
  //
  // Clients set this flag INSTEAD of embedding implement instructions in
  // `message`, so `message` stays a short human-readable label (e.g.
  // "Build from plan") that UIs can render as a compact chip.
  //
  // Like interaction_mode, this is per-execution and never carries over
  // between executions in the same session.
  bool build_from_plan = 8;

  // ─────────────────────────────────────────────────────────────────────────────
  // Approval Mode (Unattended Surfaces)
  //
  // How this execution resolves HITL approval gates.
  // ─────────────────────────────────────────────────────────────────────────────

  // How approval gates resolve for this execution. See ApprovalMode.
  //
  // UNSPECIFIED/INTERACTIVE: a gated tool pauses the execution until a human
  // decides (today's behavior). UNATTENDED: gated tools auto-skip and the
  // model adapts — set by surfaces with no approver (channel session broker,
  // guest execution scope step), never by external callers (the guest scope
  // step replaces the whole execution_config, so a guest-supplied mode is
  // discarded with the rest of the config).
  //
  // Orthogonal to auto_approve_all: the bypass clears gates so tools RUN;
  // unattended mode resolves gates so tools SKIP. When both are set the
  // bypass wins by layer order (the gate never fires).
  ApprovalMode approval_mode = 9 [(buf.validate.field).enum.defined_only = true];
}

// ─────────────────────────────────────────────────────────────────────────────
// Context Management Configuration (Phase 3)
//
// Controls automatic context summarization for long-running conversations.
// ─────────────────────────────────────────────────────────────────────────────

// ContextManagementConfig controls automatic context summarization behavior.
//
// Context summarization monitors token usage and automatically summarizes
// older conversation history when approaching the model's context window limit.
// This enables long-running agent conversations without hitting context limits.
//
// ## Default Behavior
//
// When not specified, defaults are derived from the Model Registry:
// - Each model has a configured context_window, trigger_threshold, and target_tokens
// - Summarization is enabled by default for all models
// - Economy-tier models (claude-haiku-4, gpt-4o-mini) are used for summarization
//
// ## Configuration Options
//
// - **disable_summarization**: Opt out of automatic summarization entirely
// - **custom_trigger_threshold**: Override when summarization triggers
// - **custom_target_tokens**: Override the target size after summarization
//
// ## Example YAML
//
// Default behavior (use model registry defaults):
//   execution_config:
//     model_name: "claude-sonnet-4.5"
//     # context_management not specified = use defaults
//
// Disable summarization:
//   execution_config:
//     model_name: "claude-sonnet-4.5"
//     context_management:
//       disable_summarization: true
//
// Custom thresholds (tokens):
//   execution_config:
//     model_name: "claude-sonnet-4.5"
//     context_management:
//       custom_trigger_threshold: 100000
//       custom_target_tokens: 80000
//
// @since Phase 3 (Context Summarization Architecture)
message ContextManagementConfig {
  // Disable automatic context summarization for this execution.
  //
  // When true, the agent will never trigger automatic summarization,
  // even if the context window approaches the model's limit.
  //
  // Use cases:
  // - Short-lived executions that won't approach context limits
  // - Debugging context-related issues
  // - Workflows that manage their own context externally
  //
  // Warning: Disabling summarization may cause execution failure
  // if context exceeds model limits.
  //
  // Default: false (summarization enabled based on model defaults)
  bool disable_summarization = 1;

  // Custom token threshold to trigger summarization.
  //
  // When the context token count exceeds this threshold, summarization
  // is triggered to reduce context size. Set to 0 to use model default.
  //
  // The default trigger threshold from Model Registry is typically 90%
  // of the model's context window (e.g., 180K for 200K context models).
  //
  // Must be greater than custom_target_tokens if both are specified.
  //
  // Default: 0 (use model default from Model Registry)
  int32 custom_trigger_threshold = 2 [(buf.validate.field).int32.gte = 0];

  // Custom target token count after summarization.
  //
  // Summarization aims to reduce context to approximately this size.
  // Set to 0 to use model default.
  //
  // The default target from Model Registry is typically 80% of the
  // model's context window (e.g., 160K for 200K context models).
  //
  // Must be less than custom_trigger_threshold if both are specified.
  //
  // Default: 0 (use model default from Model Registry)
  int32 custom_target_tokens = 3 [(buf.validate.field).int32.gte = 0];
}

// ─────────────────────────────────────────────────────────────────────────────
// File Attachments (Artifact Lifecycle)
//
// These types support file input to agent executions.
// ─────────────────────────────────────────────────────────────────────────────

// Attachment represents a file attached to an agent execution.
//
// All files must be pre-uploaded via the uploadAttachment RPC and referenced
// by storage_key. This ensures consistent behavior regardless of file size.
//
// ## Usage Flow
//
// 1. Client calls uploadAttachment RPC with file content
// 2. Server returns a storage_key
// 3. Client creates execution with Attachment containing that storage_key
// 4. Agent-runner downloads file from storage and injects into sandbox
//
// ## Mount Path
//
// The mount_path determines where the file appears in the sandbox.
// If not specified, defaults to /inputs/{filename}
//
// Examples:
//   - mount_path: "/inputs/config.yaml" -> file at /inputs/config.yaml
//   - mount_path: "/workspace/data/" -> directory extracted at /workspace/data/
//
// @since Artifact Lifecycle (Attachments & Outputs)
message Attachment {
  // Original filename for display and default mount path derivation.
  // Example: "config.yaml", "input-data.zip"
  string filename = 1 [(buf.validate.field).string.min_len = 1];

  // Reference to pre-uploaded file in artifact store (required).
  // Obtained by calling uploadAttachment RPC before creating the execution.
  // Format: "attachments/{ulid}/{filename}"
  string storage_key = 2 [(buf.validate.field).string.min_len = 1];

  // Path in sandbox where file will be placed.
  // Defaults to "/inputs/{filename}" if not specified.
  // Example: "/workspace/input.yaml", "/inputs/data/"
  string mount_path = 3;

  // MIME type for content negotiation (optional).
  // Example: "application/yaml", "text/plain", "application/zip"
  string content_type = 4;

  // When true, the attachment is a zip archive that should be extracted
  // at mount_path rather than written as a single file.
  // Set automatically by the CLI when a directory is attached.
  bool extract = 5;

  // Absolute filesystem path to the original file on the CLI host (optional).
  //
  // When set and the runner is in local mode, the file is read directly
  // from this path instead of downloading from artifact storage via
  // storage_key.  This eliminates the storage round-trip for local
  // executions.
  //
  // Ignored when the runner is not in local mode (cloud runners use
  // storage_key exclusively).
  //
  // The CLI sets this unconditionally to the resolved absolute path of
  // the attached file.  storage_key remains required -- the upload still
  // happens for execution history and replay support.
  string local_path = 6;
}
