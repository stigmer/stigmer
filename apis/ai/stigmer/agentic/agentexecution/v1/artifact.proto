syntax = "proto3";

package ai.stigmer.agentic.agentexecution.v1;

import "ai/stigmer/agentic/agentexecution/v1/enum.proto";
import "buf/validate/validate.proto";

// ─────────────────────────────────────────────────────────────────────────────
// Execution Artifacts (Artifact Lifecycle)
//
// These types support file artifacts from agent executions.
// ─────────────────────────────────────────────────────────────────────────────

// ExecutionArtifact represents a file or directory published by an agent.
//
// When an agent creates artifacts that users should download, it calls
// the publish_artifact tool. This generates a downloadable artifact stored
// in R2 with a time-limited signed URL.
//
// ## Storage
//
// Artifacts are stored in R2 under: artifacts/{execution_id}/{filename}
// Download URLs are pre-signed and expire after a configured period.
//
// ## Directory Handling
//
// Directories are automatically archived as ZIP files before storage.
// The kind field indicates DIRECTORY so clients know to extract after download.
//
// @since Artifact Lifecycle (Attachments & Artifacts)
message ExecutionArtifact {
  // Display name for this artifact.
  // Example: "generated-skill", "analysis-report"
  string name = 1;

  // Original path in sandbox where the artifact was created.
  // Example: "/workspace/my-skill", "/tmp/report.pdf"
  string sandbox_path = 2;

  // Type of artifact: file or directory.
  ExecutionArtifactKind kind = 3 [(buf.validate.field).enum.defined_only = true];

  // Total size in bytes.
  // For directories, this is the ZIP file size.
  int64 size_bytes = 4;

  // Storage location in R2.
  // Format: "artifacts/{execution_id}/{filename}"
  //
  // Clients resolve a download URL on demand from this stable key (via
  // getArtifactDownloadUrl) — there is deliberately no persisted URL, since a
  // pre-signed URL would expire while the reference does not.
  string storage_key = 5;

  // ISO 8601 timestamp when the artifact was created.
  // Example: "2026-02-13T10:30:00Z"
  string created_at = 7;

  // ISO 8601 timestamp when the download URL expires.
  // Example: "2026-02-20T10:30:00Z"
  string expires_at = 8;

  // Relative file paths within a directory artifact's archive.
  //
  // Populated at creation time by the agent runner when archiving a
  // directory. Empty for FILE artifacts and for older DIRECTORY
  // artifacts created before this field was added.
  //
  // Clients use this for instant skill package detection (check for
  // "SKILL.md") and for rendering file listings without additional RPCs.
  //
  // Paths use forward slashes and are relative to the archive root.
  // Directory entries are excluded — only regular files are listed.
  // Examples: ["SKILL.md", "scripts/init_skill.py", "references/workflows.md"]
  repeated string entries = 9;

  // SHA-256 hex digest of the uploaded artifact bytes.
  //
  // Used as a cache-invalidation signal by UI clients: when the same file
  // is overwritten (e.g., written then edited in the same execution), the
  // storage_key remains stable but the content_hash changes. Clients
  // include this value in their fetch-effect dependencies so that content
  // is re-fetched whenever the underlying bytes change.
  //
  // Empty for older artifacts created before this field was added.
  // Example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
  string content_hash = 10;
}
