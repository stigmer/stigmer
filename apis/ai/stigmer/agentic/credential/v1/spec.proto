syntax = "proto3";

package ai.stigmer.agentic.credential.v1;

import "ai/stigmer/agentic/credential/v1/requirement.proto";
import "buf/validate/validate.proto";

// CredentialSpec defines who a credential belongs to, the values it holds, and what it serves.
//
// @internal
// The overview.md file provides the SDK-facing description and example YAML.
message CredentialSpec {
  // Who the credential belongs to. Fixed when the credential is created.
  //
  // @internal
  // Each member is an authorization parent link (kind_meta
  // additional_parents, optional): `person` is the credential's `owner`
  // and `organization` its `org_owned` link, so both editions write and
  // derive the tuples from the row with no kind-specific code.
  oneof owner {
    option (buf.validate.oneof).required = true;

    // The person the credential belongs to, by identity account id.
    //
    // Empty means the person creating it; any other value must be that
    // person's own id.
    string person = 1;

    // The organization the credential belongs to, by organization id.
    //
    // Empty means the credential's own organization (metadata.org); any
    // other value must be that organization's id.
    string organization = 2;
  }

  // Human-readable description shown beside the credential's name.
  string description = 3 [(buf.validate.field).string.max_len = 1000];

  // The values the credential holds, by name.
  //
  // A field named `K` fills the requirement `K` of a declarer the
  // credential serves or is assigned to. Values are secret unless marked
  // plain.
  map<string, CredentialField> fields = 4 [(buf.validate.field).map = {
    max_pairs: 64
    keys: {
      string: {
        min_len: 1
        max_len: 128
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      }
    }
  }];

  // The agents, MCP servers and git hosts this credential is used for by default.
  //
  // A run takes a person's own credential for a target it serves, and an
  // organization's credential for it when the person may use it and has
  // none of their own. At most one of a person's credentials, and one of
  // the organization's, may serve the same target.
  repeated CredentialTarget serves = 5 [(buf.validate.field).repeated.max_items = 64];
}

// CredentialField is one value a credential holds.
message CredentialField {
  // The value.
  //
  // @internal
  // A secret value rests encrypted and leaves the server as the redaction
  // marker; sending the marker back on a write keeps the stored value.
  string value = 1;

  // Whether the value is plain configuration rather than a secret.
  //
  // A plain value is stored and returned as it is; every other value is
  // encrypted at rest and never returned.
  bool plain = 2;

  // Human-readable description of what the value is for.
  string description = 3 [(buf.validate.field).string.max_len = 1000];
}
