syntax = "proto3";

package ai.stigmer.agentic.credential.v1;

import "ai/stigmer/agentic/credential/v1/spec.proto";
import "ai/stigmer/agentic/credential/v1/status.proto";
import "ai/stigmer/commons/apiresource/metadata.proto";
import "buf/validate/validate.proto";

// Credential is a saved set of secret values that belongs to a person or to an organization.
//
// A person's Credential holds their own keys and sign-ins ("my Linear
// sign-in", "my OpenAI key"); an organization's Credential holds a shared
// key ("the deploy bot's AWS key") that an admin lets people and teams use.
// Each field fills the requirement with the same name of an agent, MCP
// server or git host the Credential serves or is assigned to.
//
// @internal
// Secret field values rest encrypted and leave the server redacted. A
// person reveals their own Credential's fields one at a time
// (revealField); an organization's Credential is write-only. Which run may
// use a Credential is decided by one rule at run create
// (domain/credential/resolve.ts in the server).
message Credential {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = 'agentic.stigmer.ai/v1'];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = 'Credential'];

  // Resource metadata: the display name, organization and labels.
  //
  // The name is how a person tells their Credentials apart ("OpenAI");
  // the slug is minted with a random suffix, so two members' Credentials
  // with the same name never collide.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // Configurable properties: the owner, the fields and what the Credential serves.
  CredentialSpec spec = 4;

  // System-managed state: the audit trail and where the values came from.
  CredentialStatus status = 5;
}
