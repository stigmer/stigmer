syntax = "proto3";

package ai.stigmer.agentic.credential.v1;

import "ai/stigmer/agentic/credential/v1/api.proto";
import "ai/stigmer/agentic/credential/v1/spec.proto";
import "ai/stigmer/commons/rpc/pagination.proto";
import "buf/validate/validate.proto";

// CredentialId wraps a credential identifier.
message CredentialId {
  // Unique identifier of the credential.
  string value = 1 [(buf.validate.field).required = true];
}

// Input for adding or replacing fields of a credential.
message SetCredentialFieldsInput {
  // The credential's id.
  string credential_id = 1 [(buf.validate.field).string.min_len = 1];

  // Fields to add or replace, by name. Fields not named here are kept.
  //
  // @internal
  // A secret field whose value is the redaction marker keeps its stored value.
  map<string, CredentialField> fields = 2 [(buf.validate.field).map = {
    min_pairs: 1
    max_pairs: 64
    keys: {
      string: {
        min_len: 1
        max_len: 128
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      }
    }
  }];
}

// Input for removing fields of a credential by name.
message RemoveCredentialFieldsInput {
  // The credential's id.
  string credential_id = 1 [(buf.validate.field).string.min_len = 1];

  // Names of the fields to remove. Names the credential does not hold are ignored.
  repeated string fields = 2 [(buf.validate.field).repeated.min_items = 1];
}

// Input for revealing one field of your own credential.
//
// @internal
// One field per call by design: a small blast radius if intercepted, an
// audit line per field, and the "reveal" pattern people know.
message RevealCredentialFieldInput {
  // The credential's id.
  string credential_id = 1 [(buf.validate.field).string.min_len = 1];

  // The field to reveal.
  string field = 2 [(buf.validate.field).string.min_len = 1];
}

// Input for listing credentials.
message ListCredentialsInput {
  // Organization to list credentials in.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // Pagination options.
  ai.stigmer.commons.rpc.PageInfo page_info = 2;
}

// CredentialList contains the credentials the caller may see.
message CredentialList {
  // Total count of matching credentials.
  int32 total_count = 1;

  // Credentials in the current page, with secret values redacted.
  repeated Credential items = 2;
}
