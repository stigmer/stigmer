syntax = "proto3";

package ai.stigmer.agentic.credential.v1;

import "ai/stigmer/agentic/credential/v1/api.proto";
import "ai/stigmer/agentic/credential/v1/io.proto";
import "ai/stigmer/agentic/credential/v1/spec.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// CredentialQueryController handles read operations for credentials.
service CredentialQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = credential;

  // Get a credential by ID, with secret values redacted.
  rpc get(ai.stigmer.commons.apiresource.ApiResourceId) returns (Credential) {
    option (ai.stigmer.commons.rpc.config).resource_kind = credential;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get credential";
  }

  // Get a credential by its organization-scoped reference (org/slug), with secret values redacted.
  //
  // @internal
  // Loads the credential, then authorizes it exactly as `get` would.
  rpc getByReference(ai.stigmer.commons.apiresource.ApiResourceReference) returns (Credential) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Reveal one field of your own credential.
  //
  // An organization's credential is write-only: its values can be
  // replaced, never read back.
  //
  // @internal
  // can_read_secrets is the owner's alone, and only a person's credential
  // has an owner.
  rpc revealField(RevealCredentialFieldInput) returns (CredentialField) {
    option (ai.stigmer.commons.rpc.config).resource_kind = credential;
    option (ai.stigmer.commons.rpc.config).permission = can_read_secrets;
    option (ai.stigmer.commons.rpc.config).field_path = "credential_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to reveal credential field";
  }

  // List the credentials you may see in an organization, with secret values redacted.
  //
  // Your own credentials, and the organization's credentials you may use;
  // an admin sees all of the organization's. Nobody lists another
  // person's credentials.
  //
  // @internal
  // Narrowed through the composed list read scope.
  rpc list(ListCredentialsInput) returns (CredentialList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
