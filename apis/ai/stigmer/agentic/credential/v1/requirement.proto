syntax = "proto3";

package ai.stigmer.agentic.credential.v1;

import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";

// EnvVarDeclaration declares a value an agent or MCP server needs at run time.
//
// It describes what a blueprint needs, never the value itself: the value
// comes from a credential when the run starts.
message EnvVarDeclaration {
  // Whether the value is a secret.
  //
  // @internal
  // When true: redacted in logs and Temporal history.
  bool is_secret = 1;

  // Human-readable description shown when someone is asked for the value.
  // Should explain what the value is used for and where to obtain it.
  string description = 2;

  // Whether the value may be absent.
  //
  // A run whose required value has no source is refused when it is
  // created, naming the value and who must provide it.
  bool optional = 3;
}

// CredentialTarget names something a credential's values are for: an MCP server, an agent, or a git host.
message CredentialTarget {
  // The target.
  oneof target {
    option (buf.validate.oneof).required = true;

    // An MCP server.
    ai.stigmer.commons.apiresource.ApiResourceReference mcp_server = 1 [
      (ai.stigmer.commons.apiresource.reference_kind) = mcp_server,
      (buf.validate.field).cel = {
        id: "credential_target.mcp_server.kind"
        message: "mcp_server must reference a resource with kind=mcp_server"
        expression: "this.kind == 44"
      }
    ];

    // An agent.
    ai.stigmer.commons.apiresource.ApiResourceReference agent = 2 [
      (ai.stigmer.commons.apiresource.reference_kind) = agent,
      (buf.validate.field).cel = {
        id: "credential_target.agent.kind"
        message: "agent must reference a resource with kind=agent"
        expression: "this.kind == 40"
      }
    ];

    // A git host, by host name (for example "github.com").
    //
    // The run's workspace clones a repository on this host with the
    // credential's GITHUB_TOKEN field.
    string git_host = 3 [(buf.validate.field).string = {
      min_len: 1
      max_len: 253
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"
    }];
  }
}

// RequirementRef names one value a declarer needs: the declarer and the key.
message RequirementRef {
  // The agent, MCP server or git host that declares the value.
  CredentialTarget declarer = 1 [(buf.validate.field).required = true];

  // The declared key (for example "LINEAR_API_KEY").
  string key = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
  }];
}

// CredentialFieldRef names one field of a credential.
message CredentialFieldRef {
  // The credential.
  ai.stigmer.commons.apiresource.ApiResourceReference credential = 1 [
    (ai.stigmer.commons.apiresource.reference_kind) = credential,
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "credential_field_ref.credential.kind"
      message: "credential must reference a resource with kind=credential"
      expression: "this.kind == 59"
    }
  ];

  // The field. Empty means the field named like the requirement's key.
  string field = 2 [(buf.validate.field).string = {
    max_len: 128
    pattern: "^$|^[A-Za-z_][A-Za-z0-9_]*$"
  }];
}

// CredentialAssignment gives one requirement its value on a surface that starts runs.
//
// Schedules, share links, channels and platform clients start runs with no
// person whose own credentials could be used, so they carry the values
// their runs need as assignments.
message CredentialAssignment {
  // The requirement this assignment fills.
  RequirementRef requirement = 1 [(buf.validate.field).required = true];

  // Where the value comes from.
  oneof source {
    option (buf.validate.oneof).required = true;

    // A field of a credential the writer may use.
    CredentialFieldRef credential = 2;

    // A plain value written on the surface itself; never a secret.
    string literal = 3 [(buf.validate.field).string.max_len = 4096];
  }

  // The identity account that wrote this assignment. Set by the server.
  //
  // @internal
  // Stamped from the caller on every assignment a write introduces, and
  // carried from the stored row for every assignment a write keeps; a
  // value sent by a client is never read. A run re-checks that the
  // writer may still use the credential.
  string writer = 4;
}
