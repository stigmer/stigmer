syntax = "proto3";

package ai.stigmer.agentic.credential.v1;

import "ai/stigmer/agentic/credential/v1/api.proto";
import "ai/stigmer/agentic/credential/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// CredentialCommandController handles write operations for credentials.
//
// @internal
// There is no apply: a secret never belongs in a manifest file, so a
// credential is created with its values through the console, the CLI or
// the API.
service CredentialCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = credential;

  // Create a credential for yourself or for your organization.
  //
  // @internal
  // Authorization depends on the requested owner, so the handler asks
  // after resolving it: can_create_credential on the organization for a
  // person's own credential (members), can_create_org_credential for the
  // organization's (admins).
  rpc create(Credential) returns (Credential) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Update a credential's name, description, fields and what it serves.
  //
  // The owner never changes. A secret field sent back as the redaction
  // marker keeps its stored value.
  rpc update(Credential) returns (Credential) {
    option (ai.stigmer.commons.rpc.config).resource_kind = credential;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update credential";
  }

  // Delete a credential.
  //
  // Runs that would have used it are refused at create until another
  // credential provides the values.
  rpc delete(ai.stigmer.commons.apiresource.ApiResourceDeleteInput) returns (Credential) {
    option (ai.stigmer.commons.rpc.config).resource_kind = credential;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete credential";
  }

  // Add or replace fields of a credential, keeping the fields not named.
  //
  // Refused on a credential written by an MCP server sign-in.
  rpc setFields(SetCredentialFieldsInput) returns (Credential) {
    option (ai.stigmer.commons.rpc.config).resource_kind = credential;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "credential_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to set credential fields";
  }

  // Remove fields of a credential by name.
  //
  // Refused on a credential written by an MCP server sign-in.
  rpc removeFields(RemoveCredentialFieldsInput) returns (Credential) {
    option (ai.stigmer.commons.rpc.config).resource_kind = credential;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "credential_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to remove credential fields";
  }
}
