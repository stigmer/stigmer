syntax = "proto3";

package ai.stigmer.agentic.credential.v1;

import "ai/stigmer/commons/apiresource/status.proto";

// CredentialStatus contains system-managed state for a credential.
message CredentialStatus {
  // Standard audit information (created_at, updated_at, created_by, etc.)
  ai.stigmer.commons.apiresource.ApiResourceAudit audit = 99;

  // How the credential's values were saved.
  CredentialSource source = 1;
}

// CredentialSource says how a credential's values were saved.
enum CredentialSource {
  // Not recorded.
  credential_source_unspecified = 0;

  // Typed or pasted by a person.
  credential_source_static = 1;

  // Written by an MCP server sign-in. The platform keeps the value fresh;
  // its fields cannot be set or removed by hand, only signed out.
  credential_source_oauth = 2;
}
