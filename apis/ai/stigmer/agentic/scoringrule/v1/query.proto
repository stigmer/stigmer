syntax = "proto3";

package ai.stigmer.agentic.scoringrule.v1;

import "ai/stigmer/agentic/scoringrule/v1/api.proto";
import "ai/stigmer/agentic/scoringrule/v1/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// ScoringRuleQueryController handles read operations for scoring rules.
//
// @internal
// A scoring rule's visibility is its agent's (can_view from agent).
service ScoringRuleQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = scoring_rule;

  // Get a single scoring rule by ID.
  rpc get(ScoringRuleId) returns (ScoringRule) {
    option (ai.stigmer.commons.rpc.config).resource_kind = scoring_rule;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get scoring rule";
  }

  // Get the scoring rule of an agent.
  //
  // Returns NOT_FOUND when the agent has none, which means AI grading is
  // off for it.
  //
  // @internal
  // Authorized on the agent: can_view there is can_view on its scoring rule.
  rpc getByAgent(GetScoringRuleByAgentRequest) returns (ScoringRule) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "agent_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get the scoring rule of agent";
  }
}
