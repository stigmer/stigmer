syntax = "proto3";

package ai.stigmer.agentic.scoringrule.v1;

import "ai/stigmer/agentic/scoringrule/v1/api.proto";
import "ai/stigmer/agentic/scoringrule/v1/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// ScoringRuleCommandController handles write operations for scoring rules.
//
// @internal
// No apply RPC: grading is configured in the console, never authored as a
// manifest, so an agent's YAML never carries grading criteria.
service ScoringRuleCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = scoring_rule;

  // Create the scoring rule that switches AI grading on for an agent.
  //
  // An agent has at most one scoring rule. The scoring rule lives in its agent's
  // organization.
  //
  // @internal
  // Authorization: skip standard resource authorization, because the
  // target is the agent named in spec.agent_id, not the request's own id.
  // In-handler enforcement, in order (the scoring rule domain's create
  // chain):
  // 1. AuthorizeResolvedTarget: can_edit on the agent, before the agent is
  //    read, so a caller who cannot edit it learns nothing about whether
  //    it exists.
  // 2. metadata.org must be the agent's organization.
  // 3. A second scoring rule for the same agent is refused with
  //    ALREADY_EXISTS naming the existing one.
  //
  // Error Cases:
  //
  // - FAILED_PRECONDITION: the organization is not the agent's
  // - ALREADY_EXISTS: the agent already has a scoring rule; the error
  //   carries reason SCORING_RULE_EXISTS with metadata scoring_rule_id, the
  //   scoring rule to update instead
  // - PERMISSION_DENIED: the caller may not edit the agent
  // - NOT_FOUND: the agent does not exist
  rpc create(ScoringRule) returns (ScoringRule) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Update a scoring rule: the fields update_mask names change, every other
  // field keeps its stored value.
  //
  // Its settings are whether it is enabled, its sample rate, its monthly
  // limit and its model. The agent it grades stays as created, and this
  // month's spend and counts are kept.
  //
  // resource.metadata.id names the scoring rule; apply finds one by slug. The slug
  // changes only through rename, and a mask naming a field another door
  // owns, or a path the scoring rule does not have, is refused with
  // INVALID_ARGUMENT naming the path.
  //
  // An update is refused with ABORTED carrying a google.rpc.ErrorInfo detail
  // (domain "stigmer.ai"):
  //
  //   - ETAG_MISMATCH — resource.metadata.etag is set and the scoring rule changed
  //     since that etag was read: read it again and make the change again.
  //     No metadata.
  //   - WRITE_CONFLICT — the scoring rule kept changing while the update was
  //     being saved: try again. No metadata.
  //
  // @internal
  // Authorization: requires can_edit on the scoring rule (can_edit from its
  // agent).
  rpc update(UpdateScoringRuleInput) returns (ScoringRule) {
    option (ai.stigmer.commons.rpc.config).resource_kind = scoring_rule;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "resource.metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update scoring rule";
  }

  // Delete a scoring rule, switching AI grading off for its agent.
  //
  // Scores already recorded stay on their runs.
  //
  // @internal
  // Authorization: requires can_delete on the scoring rule (can_edit from its
  // agent). Deleting the agent deletes its scoring rule.
  rpc delete(ScoringRuleId) returns (ScoringRule) {
    option (ai.stigmer.commons.rpc.config).resource_kind = scoring_rule;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete scoring rule";
  }
}
