syntax = "proto3";

// Package workflowinstance contains the WorkflowInstanceSpec definition.
package ai.stigmer.agentic.workflowinstance.v1;

import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";

// WorkflowExecutionVisibility controls who can observe the run history
// (executions) of a workflow instance.
//
// This is a SEPARATE axis from the instance's own visibility
// (metadata.visibility, which governs who can SEE and RUN the instance).
// Keeping them separate means making an instance org-runnable never exposes
// other users' run inputs/outputs. See workflow_execution.fga and
// workflow_instance.fga (the `execution_viewer` relation) for how this maps
// to authorization tuples.
//
// Only PRIVATE and ORGANIZATION are meaningful: run history is either visible
// to just the triggerer, or to every member of the owning organization.
// Public/platform run observability is deliberately unsupported.
enum WorkflowExecutionVisibility {
  // Unset. Treated as PRIVATE — each execution is visible only to the user
  // who triggered it.
  workflow_execution_visibility_unspecified = 0;

  // Each execution is visible only to the user who triggered it (its owner).
  workflow_execution_visibility_private = 1;

  // Every member of the owning organization can observe all executions of
  // this instance.
  workflow_execution_visibility_organization = 2;
}

// WorkflowInstanceSpec defines the configurable properties of a workflow instance.
//
// @internal
// This is the "Instance" layer in the Template→Instance→Execution pattern.
// It provides stateful configuration with environment bindings and secrets.
//
// The spec contains:
// - A reference to the Workflow template (the orchestration blueprint)
// - Descriptive metadata for humans
// - Environment references (layered configuration with secrets)
//
// Design Philosophy:
// WorkflowInstanceSpec separates "what to run" (Workflow) from "how to run it" (Environments).
// This allows the same Workflow template to be instantiated multiple times with different
// configurations (dev vs prod, different cloud accounts, different teams).
message WorkflowInstanceSpec {
  // Reference to the Workflow template this instance deploys.
  //
  // @internal
  // This links the instance to a reusable orchestration blueprint.
  // The Workflow defines which AgentInstances to orchestrate and in what order.
  // Format: Workflow resource ID (e.g., "wfl_abc123")
  // Validation: Minimum length of 1 character (required field)
  string workflow_id = 1 [(buf.validate.field).string.min_len = 1];

  // Human-readable description of this workflow instance.
  string description = 2;

  // Ordered list of Environment resources providing configuration and secrets.
  //
  // Environments are merged in declaration order — later entries override
  // earlier ones when keys conflict.
  //
  // @internal
  // Environments are layered configuration containers that provide:
  // - Environment variables (API keys, endpoints, flags)
  // - Secrets (credentials, tokens, passwords)
  // - Configuration values (timeouts, limits, settings)
  //
  // Example layering:
  //   [base-env, aws-prod-env, github-team-env]
  //   └─ base-env: Common settings for all instances
  //   └─ aws-prod-env: AWS production credentials (overrides base AWS settings)
  //   └─ github-team-env: Team-specific GitHub tokens (overrides generic tokens)
  //
  // Use Cases:
  // - Single env: [prod-env] - Simple, all config in one place
  // - Base + specific: [base, prod] - Common config + environment-specific
  // - Layered: [base, cloud, team] - Base + cloud credentials + team settings
  //
  // References use ApiResourceReference which supports:
  // - By ID: {id: "env_abc123"}
  // - By slug: {slug: "aws-prod-env"}
  //
  // At execution time, the WorkflowExecution runtime merges these environments
  // and provides the combined configuration to all agents in the workflow.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference environment_refs = 3 [
    (ai.stigmer.commons.apiresource.reference_kind) = environment,
    (buf.validate.field).repeated.items.cel = {
      id: "environment_refs.kind"
      message: "environment_refs must reference resources with kind=environment"
      expression: "this.kind == 53"
    }
  ];

  // Who can observe the run history (executions) of this instance.
  //
  // Independent of the instance's own visibility: making an instance
  // org-visible lets teammates see and run it, but does NOT expose each
  // other's run inputs/outputs unless this is set to ORGANIZATION.
  //
  // Defaults to PRIVATE (unspecified is treated as private) — each execution
  // is visible only to the user who triggered it. Update via
  // WorkflowInstanceCommandController.updateExecutionVisibility.
  WorkflowExecutionVisibility execution_visibility = 4 [(buf.validate.field).enum.defined_only = true];
}
