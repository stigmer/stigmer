syntax = "proto3";

package ai.stigmer.agentic.memory.v1;

import "ai/stigmer/agentic/memory/v1/api.proto";
import "ai/stigmer/commons/rpc/pagination.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";

// MemoryId wraps a memory identifier.
message MemoryId {
  // Unique identifier of the memory.
  string value = 1 [(buf.validate.field).required = true];
}

// Input for listing memories within an organization.
//
// @internal
// No subject filter by design: the cloud edition's list is FGA-filtered
// to records the caller can view (can_view: subject), so every caller
// already sees exactly their own memories; the OSS edition is
// single-user. A subject parameter would be either redundant or an
// information-disclosure bug.
message ListMemoriesRequest {
  // Organization slug to scope the listing.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // Pagination options.
  ai.stigmer.commons.rpc.PageInfo page_info = 2;
}

// Response containing a paginated list of memories.
message MemoryList {
  // Total number of memories matching the query.
  int32 total_count = 1;

  // Memories in the current page.
  repeated Memory items = 2;
}

// The changes an update makes to a memory: the fields update_mask names,
// taken from resource.
message UpdateMemoryInput {
  option (buf.validate.message).cel = {
    id: "update_names_its_target"
    message: "resource.metadata.id is required: an update names the memory by its id"
    expression: "has(this.resource) && has(this.resource.metadata) && this.resource.metadata.id != ''"
  };

  // The memory carrying the new values, named by metadata.id. Only the fields
  // update_mask names are read, so the others may be left empty; the result
  // is validated as a whole.
  Memory resource = 1 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // The paths the update changes, as proto field names (spec.instructions,
  // metadata.labels). A list or map at a named path is replaced whole; "*"
  // names every path an update may change.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
}
