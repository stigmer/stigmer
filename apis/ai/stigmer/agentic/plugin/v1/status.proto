syntax = "proto3";

package ai.stigmer.agentic.plugin.v1;

import "ai/stigmer/agentic/plugin/v1/hooks.proto";
import "ai/stigmer/agentic/vault/v1/declaration.proto";
import "ai/stigmer/commons/apiresource/status.proto";
import "buf/validate/validate.proto";

// PluginStatus is the system-managed state of an installed plugin: the
// archive identity and what the archive holds, read when the plugin was
// installed.
//
// @internal
// Install writes the plugin and nothing else, so everything here describes
// the archive at status.digest. A run reads the lists at turn start, from the
// version its reference names or the installed one.
message PluginStatus {
  // Standard audit information tracking creation and modification.
  //
  // @internal
  // Field 99 follows Stigmer convention for audit placement.
  ai.stigmer.commons.apiresource.ApiResourceAudit audit = 99;

  // SHA-256 of the plugin archive, the immutable version identifier.
  //
  // @internal
  // Calculated by the server from the pushed ZIP bytes; equals
  // metadata.version.id. A re-push of the same digest changes nothing.
  string digest = 1 [(buf.validate.field).string.pattern = "^$|^[a-f0-9]{64}$"];

  // Storage key of the plugin archive.
  string artifact_storage_key = 2;

  // Fields 3 to 5 held the install's lifecycle state, the failure naming the
  // member that did not install, and the per-kind counts, while install
  // created a resource per skill, server and composed agent. Install now
  // stores the plugin alone in one write, so none of them can be set.
  reserved 3, 4, 5;
  reserved "state", "error", "materialized";

  // Warnings the last push recorded: components Stigmer does not carry,
  // model hints it did not apply, names that shadow built-ins.
  repeated PluginWarning warnings = 6;

  // The plugin's tool-call hooks, as recorded at install; unset when the
  // plugin carries none.
  //
  // @internal
  // Derived at push from the archive, beside the lists below, so it is
  // versioned with the archive like the rest of this status. The hooks the
  // plugin carries but Stigmer does not read are named in warnings. A turn
  // runs them when its agent or its conversation lists the plugin.
  HookConfig hooks = 7;

  // The plugin's evals/ test cases, as read at install; unset when the
  // plugin carries none.
  //
  // @internal
  // A summary for the plugin page, derived at push from the archive by the
  // library's suite reader. A broken suite never refuses an install: each
  // case that cannot load is a finding here. An eval reads the suite from
  // the archive itself, which stays authoritative; plugins installed before
  // this field existed carry it after their next push. The runner reads dir
  // to keep the cases out of every session's plugin mount.
  PluginEvalSuite evals = 8;

  // The plugin's skills. A turn names each as <plugin>:<skill>.
  repeated PluginSkill skills = 9;

  // The plugin's agents, from its agents folder. A turn names each as
  // <plugin>:<agent>.
  repeated PluginAgent agents = 10;

  // The plugin's MCP servers.
  repeated McpServerEntry mcp_servers = 11;

  // The variables the plugin's servers and hooks read, by name: the
  // plugin's own declarations, a required secret for each name it uses but
  // does not declare, and the login key of a server that signs in.
  //
  // @internal
  // The platform's caller-identity keys are declared optional here: the
  // runner fills them, so no vault is asked for them.
  map<string, ai.stigmer.agentic.vault.v1.EnvVarDeclaration> env = 12;
}

// PluginSkill is one skill a plugin carries.
message PluginSkill {
  // The skill's name, from its SKILL.md.
  string name = 1;

  // What the skill is for, from its SKILL.md.
  string description = 2;

  // The skill's folder inside the plugin archive; empty when the plugin is
  // one skill with SKILL.md at its root.
  string path = 3;
}

// PluginAgent is one agent a plugin carries, read from its agent file.
message PluginAgent {
  // The agent's name.
  string name = 1;

  // What the agent specializes in.
  string description = 2;

  // The agent's system prompt: the body of its file.
  //
  // @internal
  // The agent runs on the model the turn runs: a model the file names is
  // recorded in PluginStatus.warnings and not applied.
  string instructions = 3;

  // Tools this agent may use, in Claude Code's names; empty means all of the
  // turn's. Checked at install: an entry the agent's rules refuse is dropped
  // with a warning, and an agent whose list loses every entry is left out.
  repeated string tools = 4;

  // Tools this agent may never use, in the same names as tools.
  repeated string disallowed_tools = 5;

  // The plugin's own skills this agent uses, by name.
  repeated string skills = 6;
}

// McpServerEntry is one MCP server a plugin carries: a local program or an
// address.
message McpServerEntry {
  // The server's key in the plugin's MCP configuration. A turn names its
  // tools mcp__plugin_<plugin>_<server>__<tool>, as Claude Code does.
  string name = 1;

  // How the server is reached.
  oneof transport {
    // A local program the runner starts.
    StdioMcpServer stdio = 2;

    // A server at an address.
    HttpMcpServer http = 3;
  }

  // The names of the variables this server reads, declared in
  // PluginStatus.env.
  repeated string env = 4;

  // How a person signs in to this server; unset when it needs no sign-in or
  // takes a key the plugin names.
  McpServerSignIn sign_in = 5;
}

// StdioMcpServer is a local program serving MCP over its standard input and
// output.
message StdioMcpServer {
  // The program to run.
  string command = 1;

  // Its arguments.
  repeated string args = 2;
}

// HttpMcpServer is an MCP server at an address.
message HttpMcpServer {
  // The server's URL.
  string url = 1;

  // Headers sent with every request; a value may name a variable as
  // ${NAME}.
  map<string, string> headers = 2;

  // Seconds to wait for one request; zero means the runner's default.
  int32 timeout_seconds = 3;
}

// McpServerSignIn says how a person signs in to a server.
message McpServerSignIn {
  // Whether the server accepts only a sign-in, and no pasted key.
  //
  // @internal
  // Set at install when the server's address answered an unauthenticated
  // probe with an OAuth challenge; the entry then carries an Authorization
  // header naming its login key, declared in PluginStatus.env.
  bool oauth_only = 1;
}

// PluginWarning is one thing a push noticed but did not refuse.
message PluginWarning {
  // Stable warning kind, e.g. "agent-not-installed", "component-ignored",
  // "model-hint-unresolved", "settings-agent-not-applied",
  // "tool-list-entry-dropped", "version-not-taggable".
  //
  // @internal
  // The library's PluginWarningKind values plus the server's own; a string
  // rather than an enum because the library owns most of the vocabulary and
  // the CLI already renders these kinds offline.
  string kind = 1;

  // The warning as one user-facing sentence.
  string message = 2;

  // The plugin-relative path the warning points at, when it has one.
  string path = 3;
}

// PluginEvalSuite summarises a plugin's evals/ test cases.
message PluginEvalSuite {
  // The suite's directory relative to the plugin's root: "evals", or the
  // manifest's experimental.evals.
  string dir = 1;

  // Cases found in the suite.
  int32 case_count = 2;

  // The tags the listed cases carry, once each, sorted: at most 200.
  repeated string case_tags = 3;

  // Each case, in directory order.
  repeated PluginEvalSuiteCase cases = 4;

  // Problems reading the suite: a case that cannot load, an unknown field.
  repeated PluginWarning findings = 5;
}

// PluginEvalSuiteCase is one case of a plugin's eval suite.
message PluginEvalSuiteCase {
  // The case's name.
  string case_name = 1;

  // The case's directory, relative to the plugin's root.
  string path = 2;

  // The case's tags.
  repeated string case_tags = 3;

  // Why Stigmer cannot run the case yet, naming the feature, as in
  // "context.scaffold_script"; empty when it can.
  string unsupported = 4;
}
