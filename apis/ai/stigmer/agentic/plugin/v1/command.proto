syntax = "proto3";

package ai.stigmer.agentic.plugin.v1;

import "ai/stigmer/agentic/plugin/v1/api.proto";
import "ai/stigmer/agentic/plugin/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// PluginCommandController handles write operations for plugins.
service PluginCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = plugin;

  // Push a plugin archive to install or upgrade it.
  // Creates the plugin if it does not exist, or installs a new version of an
  // existing plugin; pushing the archive already installed changes nothing.
  // The archive is a plugin folder in the Agent Plugins, Cursor, Claude Code
  // or Codex layout; the response's status lists what the plugin holds and
  // what was skipped.
  //
  // @internal
  // Authorization: can_create_plugin in the organization.
  //
  // The backend reads the package, plans the status from it (a server at an
  // address with no key is probed once for a sign-in), stores the archive
  // (deduplicated by digest), archives the previous version and stores the
  // plugin in one write. A re-push of the installed digest returns the head
  // unchanged.
  rpc push(PushPluginRequest) returns (Plugin) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_plugin;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to install plugin in this organization";
  }

  // Mint a short-lived, single-use upload URL for staging a plugin archive
  // that exceeds the gRPC message-size cap (10MB). Flow:
  //
  // 1. createArtifactUploadUrl(org, size_bytes) → { url, artifact_upload_ref }
  // 2. HTTP PUT the ZIP bytes to url
  // 3. push(PushPluginRequest{ artifact_upload_ref })
  //
  // @internal
  // Authorization matches push(): the URL is a capability to stage bytes,
  // so minting one requires the same permission as consuming it. The slots
  // are the skill transfer lane's, one upload surface for every archive.
  rpc createArtifactUploadUrl(CreatePluginArtifactUploadUrlRequest) returns (PluginArtifactUploadUrl) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_plugin;
    option (ai.stigmer.commons.rpc.config).field_path = "org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to install plugin in this organization";
  }

  // Update the visibility of a plugin.
  // Only modifies metadata.visibility.
  //
  // @internal
  // Authorization: can_manage_audience on the plugin for every transition.
  // Visibility decides who reaches the resource, so it is the owner's decision
  // and not an edit: an editor may change the definition but not its audience.
  // The level is checked against the plugin's VisibilityConfig
  // (visibility_public is refused).
  rpc updateVisibility(ai.stigmer.commons.apiresource.UpdateVisibilityInput) returns (Plugin) {
    option (ai.stigmer.commons.rpc.config).resource_kind = plugin;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_audience;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update plugin visibility";
  }

  // Delete a plugin, its evals included.
  // Refused while an agent of the organization lists it; the error names the
  // agents. Refused while one of its evals is pending or running: cancel that
  // eval first.
  //
  // @internal
  // A conversation that lists a deleted plugin fails its next turn naming
  // it, as one naming a deleted agent does. Audit history is preserved.
  //
  // Error Cases:
  //
  // - FAILED_PRECONDITION: an agent of the organization lists the plugin;
  //   the error names the agents
  // - FAILED_PRECONDITION: one of the plugin's evals is pending or running;
  //   the error names the eval and cancel
  rpc delete(PluginId) returns (Plugin) {
    option (ai.stigmer.commons.rpc.config).resource_kind = plugin;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete plugin";
  }

  // List the tools one of a plugin's MCP servers offers now, signed in as
  // the caller. Nothing is stored.
  //
  // Errors:
  // - FAILED_PRECONDITION: a key the server needs is in none of the caller's
  //   vaults, or the server needs a sign-in the caller has not made
  // - NOT_FOUND: the plugin, or the server in it, does not exist
  //
  // @internal
  // The server is reached by a runner of the organization, through the
  // connect lane: a connect attempt names the plugin and the server, and the
  // runner fetches the caller's My vault values for that entry with the
  // attempt's credential. The workflow answers the listing; the plugin is
  // never written.
  rpc listTools(ListPluginToolsInput) returns (ListPluginToolsOutput) {
    option (ai.stigmer.commons.rpc.config).resource_kind = plugin;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "plugin_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to list plugin tools";
  }
}
