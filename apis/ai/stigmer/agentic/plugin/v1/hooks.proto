syntax = "proto3";

package ai.stigmer.agentic.plugin.v1;

import "buf/validate/validate.proto";

// HookConfig is a set of tool-call hooks: commands that run before or after an
// agent's tool calls and can refuse a call, ask a person first, or let it run.
//
// A plugin's hooks are recorded here at install; an agent can also carry a
// block of its own (AgentSpec.hooks). The native engine runs hooks in Claude
// Code's format, with PreToolUse and PostToolUse events.
//
// @internal
// Derived at push from the plugin's hooks files (hooks/hooks.json and any
// manifest-declared source) and stored on PluginStatus.hooks. It carries only
// the events and handlers Stigmer reads (tool-call events, command handlers
// that can decide a call); every event, handler type and field it does not
// read is named in PluginStatus.warnings instead, so a reader needs no table
// of its own. Placeholders such as ${CLAUDE_PLUGIN_ROOT} and
// ${user_config.KEY} are kept verbatim; the runner substitutes them when it
// runs a hook. Cursor-format hooks are recorded, and no engine runs them yet.
message HookConfig {
  // The format the hooks are written in, which decides their input and answer.
  // An agent's own block may leave it unset; Claude Code's format is assumed.
  HookFormat format = 1;

  // Hook groups, in the order they are declared.
  repeated HookGroup groups = 2;
}

// HookFormat is the hook format a plugin's hooks are written in.
//
// @internal
// The one value the runner branches on: the JSON a hook reads on stdin, what
// its matcher is tested against, and how its answer is parsed. Codex plugin
// hooks are written in Claude Code's format and carry CLAUDE_CODE. This is
// deliberately not PluginDialect, which is recorded for display and never
// branches behaviour.
enum HookFormat {
  // Unspecified format (default/invalid).
  HOOK_FORMAT_UNSPECIFIED = 0;

  // Claude Code's hook format, also used by Codex plugins.
  HOOK_FORMAT_CLAUDE_CODE = 1;

  // Cursor's hook format.
  HOOK_FORMAT_CURSOR = 2;
}

// HookGroup is one event, an optional matcher, and the handlers that run when
// both match.
message HookGroup {
  // The event the handlers run on: "PreToolUse" before a call, which can
  // refuse it, ask first or allow it, or "PostToolUse" after a call succeeds,
  // which can add to what the agent reads.
  //
  // @internal
  // Spelled as the format spells it; a Cursor plugin's events, such as
  // "beforeShellExecution", are recorded verbatim.
  string event = 1 [(buf.validate.field).string.min_len = 1];

  // Which tools the handlers run for: a name such as "Bash", a list such as
  // "Write|Edit", or a regular expression such as "mcp__github__.*". Empty or
  // "*" matches every tool. A plugin's own MCP server's tools are named
  // mcp__plugin_<plugin>_<server>__<tool>, as in Claude Code.
  //
  // @internal
  // Kept verbatim: an exact list of names separated by "|" or ",", or an
  // unanchored regular expression, with the format's own semantics. A Cursor
  // handler's per-handler matcher becomes a group of one. Never rewritten to
  // Stigmer names at install, because a hook's script sees the tool name too.
  string matcher = 2;

  // The handlers to run, in order.
  repeated HookHandler handlers = 3;
}

// HookHandler is one command a hook runs.
//
// The command reads the call as JSON on stdin and answers as Claude Code's
// hooks do: exit code 2 refuses the call with stderr as the reason, and JSON on
// stdout can allow, ask or deny with a reason.
message HookHandler {
  // The command to run. Without args it runs in bash; ${CLAUDE_PLUGIN_ROOT}
  // names the plugin's files and ${CLAUDE_PROJECT_DIR} the workspace.
  string command = 1 [(buf.validate.field).string.min_len = 1];

  // Arguments for the command's exec form; when set, the command runs without
  // a shell.
  repeated string args = 2;

  // Seconds the command may run before it is stopped; zero means the default,
  // 600 seconds. A command that is stopped makes no decision.
  int32 timeout_seconds = 3 [(buf.validate.field).int32.gte = 0];

  // A permission rule that narrows when the handler runs, e.g.
  // "Bash(git push *)"; empty means whenever the group matches.
  //
  // @internal
  // Claude Code's "if" field, renamed because "if" is a keyword in every SDK
  // language. Only its Tool or Tool(specifier) shape is checked at install;
  // what the specifier matches is the runner's to evaluate.
  string condition = 4;

  // Whether a crash, timeout or missing answer blocks the call instead of
  // letting it through. Cursor's format only.
  //
  // @internal
  // Cursor's failClosed. Claude Code hooks fail open on a non-blocking error,
  // so a Claude Code handler never sets it, and apply refuses an agent's own
  // block that does.
  bool fail_closed = 5;
}
