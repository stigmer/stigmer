syntax = "proto3";

package ai.stigmer.agentic.evaluator.v1;

import "ai/stigmer/agentic/evaluator/v1/spec.proto";
import "ai/stigmer/agentic/evaluator/v1/status.proto";
import "ai/stigmer/commons/apiresource/metadata.proto";
import "buf/validate/validate.proto";

// Evaluator switches AI grading on for one agent.
//
// While an evaluator is enabled, Stigmer sends a sample of the agent's
// completed runs to an AI judge with its standard rubrics ("did the task",
// "made nothing up") and records the verdict as a score on each graded run.
// The sample rate and a monthly spending limit bound how many runs are
// graded and what grading costs; the organization the run belongs to pays.
//
// @internal
// A child of its agent (kind_meta: scope PARENT through spec.agent_id), so
// whoever may edit the agent configures its grading and whoever may view
// the agent sees the settings and this month's spend. One per agent.
// Not part of the agent's spec: an apply writes the whole spec, so a
// switch there would be wiped by every re-apply. Kind number 62, id
// prefix "evl". The rubrics are the platform's, versioned in the server's
// code; custom rubrics, if they come, are a field here.
message Evaluator {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = 'agentic.stigmer.ai/v1'];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = 'Evaluator'];

  // Resource metadata including name, organization, and labels.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // Which agent is graded, how often, with which model, and the monthly limit.
  EvaluatorSpec spec = 4;

  // System-managed state: this month's spend and grade counts.
  EvaluatorStatus status = 5;
}
