syntax = "proto3";

package ai.stigmer.agentic.evaluator.v1;

import "ai/stigmer/agentic/evaluator/v1/api.proto";
import "ai/stigmer/agentic/evaluator/v1/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// EvaluatorCommandController handles write operations for evaluators.
//
// @internal
// No apply RPC: grading is configured in the console, never authored as a
// manifest, so an agent's YAML never carries grading criteria.
service EvaluatorCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = evaluator;

  // Create the evaluator that switches AI grading on for an agent.
  //
  // An agent has at most one evaluator. The evaluator lives in its agent's
  // organization.
  //
  // @internal
  // Authorization: skip standard resource authorization, because the
  // target is the agent named in spec.agent_id, not the request's own id.
  // In-handler enforcement, in order (the evaluator domain's create
  // chain):
  // 1. AuthorizeResolvedTarget: can_edit on the agent, before the agent is
  //    read, so a caller who cannot edit it learns nothing about whether
  //    it exists.
  // 2. metadata.org must be the agent's organization.
  // 3. A second evaluator for the same agent is refused with
  //    ALREADY_EXISTS naming the existing one.
  //
  // Error Cases:
  //
  // - FAILED_PRECONDITION: the organization is not the agent's
  // - ALREADY_EXISTS: the agent already has an evaluator; the error
  //   carries reason EVALUATOR_EXISTS with metadata evaluator_id, the
  //   evaluator to update instead
  // - PERMISSION_DENIED: the caller may not edit the agent
  // - NOT_FOUND: the agent does not exist
  rpc create(Evaluator) returns (Evaluator) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Update an evaluator's settings: whether it is enabled, its sample rate,
  // its monthly limit and its model.
  //
  // The agent it grades stays as created, and this month's spend and
  // counts are kept.
  //
  // @internal
  // Authorization: requires can_edit on the evaluator (can_edit from its
  // agent).
  rpc update(Evaluator) returns (Evaluator) {
    option (ai.stigmer.commons.rpc.config).resource_kind = evaluator;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update evaluator";
  }

  // Delete an evaluator, switching AI grading off for its agent.
  //
  // Scores already recorded stay on their runs.
  //
  // @internal
  // Authorization: requires can_delete on the evaluator (can_edit from its
  // agent). Deleting the agent deletes its evaluator.
  rpc delete(EvaluatorId) returns (Evaluator) {
    option (ai.stigmer.commons.rpc.config).resource_kind = evaluator;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete evaluator";
  }
}
