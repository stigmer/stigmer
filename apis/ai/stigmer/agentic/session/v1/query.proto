syntax = "proto3";

package ai.stigmer.agentic.session.v1;

import "ai/stigmer/agentic/session/v1/api.proto";
import "ai/stigmer/agentic/session/v1/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// SessionQueryController handles read operations for agent sessions.
service SessionQueryController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = session;

  // Get a single session by ID.
  rpc get(SessionId) returns (Session) {
    option (ai.stigmer.commons.rpc.config).resource_kind = session;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to get session";
  }

  // List all sessions with pagination and optional filtering.
  //
  // An eval run's tries are left out: each runs in a session of its own,
  // read through the eval run (EvalRunQueryController.get) instead.
  //
  // @internal
  // Authorization is handled in-handler via FGA-filtered queries.
  rpc list(ListSessionsRequest) returns (SessionList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List the conversations on one agent, whichever version each runs.
  //
  // Results are filtered to the sessions the caller can view. An eval
  // run's tries are left out, as in list.
  //
  // @internal
  // Authorization is handled in handler via FGA query for authorized
  // session_ids, then filtered by status.agent_id.
  rpc listByAgent(ListSessionsByAgentRequest) returns (SessionList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List the conversations a channel served.
  //
  // Returns the sessions the given channel's visitors or its Slack or
  // WhatsApp runtime started, newest first. The caller must be able to view
  // the channel; results are additionally filtered to sessions the caller
  // can view.
  //
  // @internal
  // Authorization is two-stage in the handler: an explicit can_view check on
  // the channel (clean PERMISSION_DENIED, prevents channel-id probing),
  // then an FGA query for authorized session_ids intersected with the
  // stigmer.ai/channel-id label filter.
  rpc listByChannel(ListSessionsByChannelRequest) returns (SessionList) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // List a session's events, oldest first unless desc is asked for.
  //
  // The events are Claude Managed Agents session events, in the order they
  // were appended; a page holds at most page_size of them.
  rpc listEvents(ListSessionEventsRequest) returns (SessionEventList) {
    option (ai.stigmer.commons.rpc.config).resource_kind = session;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "session_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to list session events";
  }

  // Stream a session's events as they are appended.
  //
  // Without after_seq the stream starts at the moment it opens, as Managed
  // Agents' does. With after_seq it first sends the stored events after
  // that seq, then the new ones, with none missing: a client that listed
  // up to some seq, or whose stream ended, resumes from the last seq it
  // has. A watcher that falls too far behind is ended with
  // RESOURCE_EXHAUSTED; it resumes the same way.
  //
  // @internal
  // A direct handler: authorizeDirect at the start, as run subscribe, and
  // again before the next frame once the stream has served five minutes.
  rpc streamEvents(StreamSessionEventsRequest) returns (stream StreamSessionEventsResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = session;
    option (ai.stigmer.commons.rpc.config).permission = can_view;
    option (ai.stigmer.commons.rpc.config).field_path = "session_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to stream session events";
  }
}
