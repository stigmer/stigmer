syntax = "proto3";

package ai.stigmer.agentic.session.v1;

import "ai/stigmer/agentic/mcpserver/v1/usage.proto";
import "ai/stigmer/agentic/session/v1/enum.proto";
import "ai/stigmer/agentic/session/v1/workspace.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";

// SessionSpec defines the configurable properties of a session.
//
// @internal
// A session is a conversation with an agent, or with the built-in
// assistant when it names none. The overview.md file provides the
// SDK-facing description and example YAML.
message SessionSpec {
  // Field 1 named the agent instance the session ran against until the
  // instance kind was removed; a session names its agent directly through
  // agent_ref.
  reserved 1;
  reserved "agent_instance_id";

  // The agent this conversation runs, as 'org/slug' with an optional
  // version; empty means no agent, and the built-in assistant answers with
  // the MCP servers and skills this session itself declares.
  //
  // The conversation runs the agent version this reference resolved to
  // when it was written, recorded in status.agent_id and
  // status.agent_version_hash, so an author saving a new version never
  // changes an open conversation under its people. A version names a tag or
  // a content hash; none, on a reference the session did not already hold,
  // names the agent's current version. To move a conversation to the
  // agent's current version, update the session with this reference's
  // version set to `latest`: the server pins that version and stores the
  // reference with no version. An update that sends the stored reference
  // unchanged keeps the version the conversation runs, even when the tag it
  // names has moved since.
  //
  // A session may gain an agent, change it or drop back to the built-in
  // assistant on update; the harness and execution target are the
  // immutable fields, not this one. Naming an agent, or changing it, needs
  // permission to run that agent (can_execute), and every turn asks it
  // again.
  //
  // @internal
  // Another organization's agent is accepted only when it is this
  // organization's parent's, shared at visibility_child_orgs
  // (the reference rule). The resolved id beside the reference is what
  // every turn reads, by point read, so a slug deleted and taken by another
  // agent never redirects a live conversation (the share's pin).
  ai.stigmer.commons.apiresource.ApiResourceReference agent_ref = 14 [
    (ai.stigmer.commons.apiresource.reference_kind) = agent,
    (buf.validate.field).cel = {
      id: "session_agent_ref.kind"
      message: "agent_ref must reference a resource with kind=agent"
      expression: "this.kind == 40"
    }
  ];

  // Conversation title for UI display.
  string subject = 2;

  // Harness-specific state identifier for conversation continuity.
  //
  // Populated after the first run completes; empty until then.
  // Each harness uses this field differently:
  //
  // - NATIVE: LangGraph thread ID, derived deterministically as
  //   "thread-{session_id}" by the EnsureThread activity. Stored here
  //   so the immutability sentinel works uniformly across harnesses.
  //
  // - CURSOR: Cursor SDK agent ID (e.g., "agent-xxx" or "bc-xxx")
  //   returned by Agent.create(). Used for Agent.resume() on
  //   subsequent runs.
  //
  // @internal
  // Also serves as the immutability sentinel: when non-empty, the
  // session's harness and cursor_mode cannot be changed — each harness
  // owns its conversation state independently.
  string harness_state_id = 3;

  // Prior harness state identifiers this session has owned, oldest first.
  //
  // A session can span multiple harness-side conversations: when the
  // cursor-runner's resume fails, it creates a fresh Cursor agent and
  // replaces harness_state_id, and the replaced id lands here.
  //
  // @internal
  // Server-owned, append-only. The update handler computes the append from
  // the observed harness_state_id transition — client-supplied values for
  // this field are discarded, so a stale client resending an old spec can
  // never clobber the history. Billing reconciliation joins Cursor ledger
  // events on the union of current + prior ids; dropping a replaced id
  // would orphan the ledger events of every turn that ran under it.
  repeated string harness_state_id_history = 13;

  // Custom key-value pairs for client-specific information.
  map<string, string> metadata = 5;

  // Workspace entries for this session.
  //
  // Each entry pairs a name with a source (git repo or local path), forming
  // a multi-root workspace. Entries are provisioned on the first run;
  // subsequent runs reuse the same workspace.
  //
  // When empty, the session uses an empty workspace directory.
  repeated WorkspaceEntry workspace_entries = 6;

  // MCP servers to make available in this session.
  //
  // Augments the agent's tool set for this specific conversation without
  // modifying the agent blueprint. Each usage references an McpServer
  // resource. The agent's tool lists govern these servers like its own: an
  // agent whose tools list does not name a session server cannot use it.
  //
  // @internal
  // Merge semantics: session-level usages are union'd with agent-level usages,
  // one entry per MCP server slug. The agent runner merges these with the
  // agent's mcp_server_usages when constructing the execution graph.
  repeated ai.stigmer.agentic.mcpserver.v1.McpServerUsage mcp_server_usages = 7 [(buf.validate.field).repeated.items.cel = {
    id: "session_mcp_server_usages.kind"
    message: "mcp_server_usages must reference resources with kind=mcp_server"
    expression: "this.mcp_server_ref.kind == 44"
  }];

  // Skills to inject into this session's context.
  //
  // Provides domain-specific knowledge for this specific conversation without
  // modifying the agent blueprint. Each reference points to a Skill resource
  // whose content is added to the agent's context alongside agent-level skills.
  //
  // @internal
  // Merge semantics: union'd with agent-level skill_refs, deduplicated by slug.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference skill_refs = 8 [
    (ai.stigmer.commons.apiresource.reference_kind) = skill,
    (buf.validate.field).repeated.items.cel = {
      id: "session_skill_refs.kind"
      message: "skill_refs must reference resources with kind=skill"
      expression: "this.kind == 43"
    }
  ];

  // Execution harness for this session.
  //
  // Determines which Temporal activity type is dispatched when an
  // Run is created in this session:
  // - NATIVE (default): ExecuteDeepAgent activity -> Stigmer unified runner
  // - CURSOR: ExecuteCursor activity -> TypeScript/Cursor SDK worker
  //
  // The harness affects which tools the agent has, how conversation state
  // is managed, available models, and billing tier. Once set and a run
  // has run, the harness is immutable — changing it would break conversation
  // continuity since each harness owns its own state.
  //
  // When unspecified, defaults to HARNESS_NATIVE.
  Harness harness = 10;

  // Cursor SDK agent mode for this session.
  //
  // Determines whether the Cursor agent runs locally (Agent.create with
  // local.cwd) or in the cloud (Agent.create with cloud.repos). Set once
  // at session creation and never changed — switching mid-session would
  // lose Cursor-side conversation state.
  //
  // Only meaningful when harness == HARNESS_CURSOR. Ignored for other
  // harness types.
  //
  // @internal
  // Runner-owned, never user-set (see the CursorMode enum docs): the
  // cursor-runner stamps it on the first run when UNSPECIFIED —
  // always LOCAL while cloud mode is disabled platform-wide. The
  // workflow reads it back on subsequent runs to route to the
  // correct Agent.create / Agent.resume path.
  //
  // When UNSPECIFIED on an existing CURSOR session, the runner defaults
  // to LOCAL for backward compatibility.
  CursorMode cursor_mode = 11;

  // Where session activities are executed — local client or cloud sandbox.
  //
  // Determines dispatch routing: LOCAL means the client's embedded runner
  // (desktop app or CLI) polls the session's task queue; CLOUD means the
  // server provisions a sandbox with a runner.
  //
  // Set by the client at session creation:
  // - Desktop/CLI set LOCAL (they run an embedded runner)
  // - Web console sets CLOUD (or UNSPECIFIED → server defaults to CLOUD)
  // - Customer SDK sets whatever fits their architecture
  //
  // Immutable once a run has started — workspace state may not be
  // portable between local and cloud environments.
  ExecutionTarget execution_target = 12;

  // Vaults whose logins and secrets this conversation's runs use, in order:
  // the first vault holding a match wins. At most 20.
  //
  // A conversation that lists vaults uses exactly those. One that lists
  // none uses the My vault of the person sending each turn, then the
  // agent's vaults that person may use. A My vault cannot be listed: a
  // conversation can have several people, and each person's own vault
  // serves only their own turns.
  //
  // @internal
  // The reference rule asks can_use of the writer for each vault a write
  // introduces and records the writer in status.vault_attachers; each run
  // asks can_use again of its person, or of that recorded account when the
  // run has no person.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference vaults = 15 [
    (ai.stigmer.commons.apiresource.reference_kind) = vault,
    (buf.validate.field).repeated.max_items = 20,
    (buf.validate.field).repeated.items.cel = {
      id: "vaults.kind"
      message: "vaults must reference resources with kind=vault"
      expression: "this.kind == 59"
    }
  ];

  // Secrets this conversation's runs use, by name, ahead of every vault.
  //
  // This is how an integrator hands a run a key without saving it in a
  // vault. The values are kept sealed for the conversation's life, can be
  // replaced by an update at any time, are never returned by a read, and
  // are destroyed with the conversation.
  //
  // An update built on an older read than the stored conversation (it
  // echoes an older status.audit.spec_audit.updated_at) removes nothing it
  // could not have seen: the values it omits are kept, and so are the
  // vaults the conversation lists. Read the conversation again to remove a
  // value or change its vaults.
  //
  // @internal
  // Sealed through the server's SecretService. A read shows the redaction
  // marker for each value, and a write that sends the marker back keeps the
  // stored value, so the runner's per-turn session writes never clear them.
  map<string, string> secrets = 16 [(buf.validate.field).map = {
    max_pairs: 100
    keys: {
      string: {
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        max_len: 128
      }
    }
    values: {
      string: {
        min_len: 1
        max_len: 65536
      }
    }
  }];

  // Logins this conversation's runs use, by the address of the tool or Git
  // host each is for, ahead of every vault.
  //
  // Kept, replaced and destroyed as secrets are. Addresses are normalized
  // as a vault's are.
  //
  // @internal
  // Sealed and redacted as secrets are.
  map<string, string> connections = 17 [(buf.validate.field).map = {
    max_pairs: 100
    keys: {
      string: {
        min_len: 1
        max_len: 2048
      }
    }
    values: {
      string: {
        min_len: 1
        max_len: 65536
      }
    }
  }];
}
