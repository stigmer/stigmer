syntax = "proto3";

package ai.stigmer.agentic.session.v1;

import "ai/stigmer/agentic/session/v1/enum.proto";
import "ai/stigmer/agentic/session/v1/resource.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";

// SessionSpec defines the configurable properties of a session.
//
// @internal
// A session is a conversation with an agent, or with the built-in
// assistant when it names none. The overview.md file provides the
// SDK-facing description and example YAML.
message SessionSpec {
  // The agent this conversation runs, as 'org/slug' with an optional
  // version; empty means no agent, and the built-in assistant answers with
  // the plugins and skills this session itself declares.
  //
  // The conversation runs the agent version this reference resolved to
  // when it was written, recorded in status.agent_id and
  // status.agent_version_hash, so an author saving a new version never
  // changes an open conversation under its people. A version names a tag or
  // a content hash; none, on a reference the session did not already hold,
  // names the agent's current version. To move a conversation to the
  // agent's current version, update the session with this reference's
  // version set to `latest`: the server pins that version and stores the
  // reference with no version. An update that sends the stored reference
  // unchanged keeps the version the conversation runs, even when the tag it
  // names has moved since.
  //
  // A session may gain an agent, change it or drop back to the built-in
  // assistant on update; the harness and execution target are the
  // immutable fields, not this one. Naming an agent, or changing it, needs
  // permission to run that agent (can_execute), and every turn asks it
  // again.
  //
  // @internal
  // Another organization's agent is accepted only when it is this
  // organization's parent's, shared at visibility_child_orgs
  // (the reference rule). The reference holds the agent's id, which every
  // turn reads by point read, so a slug deleted and taken by another agent
  // never redirects a live conversation (as a channel's agent_ref does).
  ai.stigmer.commons.apiresource.ApiResourceReference agent_ref = 14 [(ai.stigmer.commons.apiresource.reference_kind) = agent];

  // Conversation title for UI display.
  string subject = 2;

  // Custom key-value pairs for client-specific information.
  map<string, string> metadata = 5;

  // Skills to inject into this session's context.
  //
  // Provides domain-specific knowledge for this specific conversation without
  // modifying the agent blueprint. Each reference points to a Skill resource
  // whose content is added to the agent's context alongside agent-level skills.
  //
  // @internal
  // Merge semantics: union'd with agent-level skill_refs, deduplicated by the
  // skill's current name (a skill mounts by its name).
  repeated ai.stigmer.commons.apiresource.ApiResourceReference skill_refs = 8 [(ai.stigmer.commons.apiresource.reference_kind) = skill];

  // Execution harness for this session.
  //
  // Determines which harness runs every turn in this session:
  // - STIGMER (default): Stigmer's own harness
  // - CLAUDE: Anthropic's Claude Agent SDK
  //
  // The harness affects which tools the agent has, how conversation state
  // is managed, available models, and billing tier. Once set and a run
  // has run, the harness is immutable — changing it would break conversation
  // continuity since each harness owns its own state.
  //
  // When unspecified, defaults to HARNESS_STIGMER.
  //
  // @internal
  // The harness picks the Temporal activity type dispatched when a Run is
  // created in this session:
  // - STIGMER: ExecuteDeepAgent activity -> Stigmer unified runner
  // - CLAUDE: ExecuteClaude activity -> Stigmer unified runner
  Harness harness = 10 [(buf.validate.field).enum.defined_only = true];

  // Where session activities are executed — local client or cloud sandbox.
  //
  // Determines dispatch routing: LOCAL means the client's embedded runner
  // (desktop app or CLI) polls the session's task queue; CLOUD means the
  // server provisions a sandbox with a runner.
  //
  // Set by the client at session creation:
  // - Desktop/CLI set LOCAL (they run an embedded runner)
  // - Web console sets CLOUD (or UNSPECIFIED → server defaults to CLOUD)
  // - Customer SDK sets whatever fits their architecture
  //
  // Immutable once a run has started — workspace state may not be
  // portable between local and cloud environments.
  ExecutionTarget execution_target = 12;

  // Vaults whose logins and secrets this conversation's runs use, in order:
  // the first vault holding a match wins. At most 20.
  //
  // The conversation uses exactly these, in order, after the sender's My
  // vault when include_my_vault is set. A My vault cannot be listed: set
  // include_my_vault, which gives each sender their own.
  //
  // An update built on an older read than the stored conversation (it
  // echoes an older status.audit.spec_audit.updated_at) keeps the stored
  // vaults and include_my_vault: read the conversation again to change
  // which vaults it uses.
  //
  // @internal
  // The reference rule asks can_use of the writer for each vault a write
  // introduces and records the writer in status.vault_attachers; each run
  // asks can_use again of its person, or of that recorded account when the
  // run has no person.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference vaults = 15 [
    (ai.stigmer.commons.apiresource.reference_kind) = vault,
    (buf.validate.field).repeated.max_items = 20
  ];

  // Whether each turn also uses its sender's own My vault, first, ahead of
  // the listed vaults. Off unless the caller sets it.
  //
  // Each person who sends a turn uses their own My vault, never another's.
  // A turn with no person, or one that runs another organization's agent,
  // ignores it.
  bool include_my_vault = 18;

  // Plugins this conversation uses, each whole, besides its agent's: their
  // skills, agents, hooks and MCP servers. A chat with the built-in
  // assistant gets its tools from these.
  //
  // The agent's tool lists govern a conversation's plugins like its own: an
  // agent whose tools list does not name a plugin's server cannot use it.
  //
  // @internal
  // Added to the agent version's plugins, one entry per plugin; this
  // reference's version wins when both name it. Resolved at turn start, the
  // reference's version when set, else the installed version.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference plugins = 19 [(ai.stigmer.commons.apiresource.reference_kind) = plugin];

  // Whether each turn's file edits are offered for review, Keep or Undo,
  // after the turn. Off unless the caller sets it. Review never makes a
  // turn wait: the edits are applied as the agent makes them, each stays
  // until it is undone, and whatever is undecided when the next message is
  // sent is kept. A turn in a workspace that cannot record its edits asks
  // before each file write instead.
  //
  // @internal
  // Read by the runner at each turn's start. An eval run's try records
  // its edits whatever this says: its graders read them.
  bool file_review = 20;

  // The Environment this conversation runs in: the packages its sandboxes
  // get and the websites they may reach. Unset: its routine's, else its
  // agent's default, else its organization's (status.environment records
  // which applied).
  //
  // Fixed once a turn has run. A conversation on the person's own machine
  // (the desktop app, the CLI) refuses one, since its sandbox is that
  // machine. Naming one needs permission to view it, and every turn asks
  // it again.
  //
  // @internal
  // Refused up front where the server's sandbox driver cannot install its
  // packages or limit its networking (domain/run/environment-admission.ts).
  ai.stigmer.commons.apiresource.ApiResourceReference environment_ref = 21 [(ai.stigmer.commons.apiresource.reference_kind) = environment];

  // What the conversation holds: Files the agent finds under
  // .stigmer/uploads/ on every turn, git repositories cloned into its
  // workspace, and folders on the person's own machine. Repositories and
  // folders are provisioned on the first turn and reused after it.
  //
  // A File named here that is not yet the conversation's (an organization
  // File the writer may view) becomes the conversation's own copy over the
  // same bytes, and the entry names the copy: deleting the original later
  // leaves the conversation's copy. A File of another organization is
  // refused. At most 500 files; repository and folder names are unique, and
  // so are the files' mount paths.
  //
  // A turn's own files (RunSpec.file_ids) join this list when the turn is
  // created, so whoever may send the conversation a message may add files
  // without editing it.
  repeated SessionResource resources = 22 [(buf.validate.field).repeated.max_items = 1000];
}
