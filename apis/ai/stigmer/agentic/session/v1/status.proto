syntax = "proto3";

package ai.stigmer.agentic.session.v1;

import "ai/stigmer/agentic/session/v1/enum.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/status.proto";

// SessionStatus contains system-managed state for a session.
message SessionStatus {
  // Standard audit information (created_at, updated_at, created_by, etc.)
  ai.stigmer.commons.apiresource.ApiResourceAudit audit = 99;

  // ID of the agent spec.agent_ref resolved to when it was last written.
  // Empty when the session names no agent: the built-in assistant answers.
  //
  // @internal
  // Server-owned: the server resolves the reference when a write names or
  // changes it, and every turn reaches its agent through this id by point
  // read, never by its slug again. A slug deleted and taken by another
  // agent therefore never redirects a live conversation; the conversation's
  // next turn fails naming the agent that is gone.
  string agent_id = 1;

  // Content hash of the agent version this conversation runs
  // (AgentStatus.version_hash when the reference resolved; resolvable
  // through AgentQueryController.getVersion with agent_id).
  //
  // Each turn runs this version and records it on its own status. Empty
  // when agent_id is empty, or when the agent had no recorded version when
  // the reference resolved; such a conversation runs the agent as it is
  // when each turn starts.
  string agent_version_hash = 2;

  // Who attached each of this resource's vaults, by vault id: the account
  // whose permission to use the vault each run checks when it has no
  // person.
  //
  // @internal
  // Server-owned. The reference rule records the writer for each vault a
  // write introduces, keeps the entry for each vault a write keeps, and
  // drops entries for removed vaults, so an editor's unrelated edit never
  // re-attributes a vault someone else attached.
  map<string, string> vault_attachers = 3;

  // Whether the session is working: running (a turn works) or idle (it
  // waits for input), the newest session.status_running or
  // session.status_idle event's word. A session none of whose turns ever
  // worked reads idle.
  //
  // @internal
  // Computed from the session's events on every read and never stored: a
  // value sent on a write is ignored.
  string state = 4;

  // The routine whose fire started this conversation; empty for every other
  // conversation.
  //
  // @internal
  // Server-owned: stamped at create, only on a server-composed request, from
  // the in-process caller identity the routine runtime propagates
  // (CallerIdentity.routineId), after a client's status is cleared; updates
  // keep it. The session kind's parent declaration reads it
  // (ParentRelationConfig.status_field), so the session#routine link that
  // shows the run to the routine's viewers is derived from a fact no client
  // can write. A label would not do: labels carry no authorization.
  string routine_id = 7;

  // The Environment this conversation runs in, whichever named it; unset
  // when none applies.
  //
  // @internal
  // Server-owned: resolved at session create in the order spec, routine,
  // agent, organization (environment_source), re-resolved on update until
  // the first turn, then kept. Only a conversation whose sandbox this server
  // starts takes a default. Each sandbox start reads its current contents.
  ai.stigmer.commons.apiresource.ApiResourceReference environment = 8 [(ai.stigmer.commons.apiresource.reference_kind) = environment];

  // Which choice environment came from.
  EnvironmentSource environment_source = 9;
}
