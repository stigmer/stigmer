syntax = "proto3";

package ai.stigmer.agentic.session.v1;

// GitWriteBackMode controls the platform's git workflow for a git-backed workspace entry.
//
// @internal
// The platform enables write-back by default when credentials are
// available. Users can override this per-session by setting an
// explicit mode. The agent never sees or controls this setting.
enum GitWriteBackMode {
  // Platform default behavior — write-back is enabled when git credentials are available.
  //
  // @internal
  // What the agent saves in its outputs folder comes back as Files
  // regardless of this setting. Set an explicit mode to override the
  // platform default.
  GIT_WRITE_BACK_MODE_UNSPECIFIED = 0;

  // Create a branch and pull request from the agent's file changes after the run completes.
  //
  // @internal
  // The platform automatically detects uncommitted changes via git diff,
  // creates a branch (stigmer/{run_id_short}), commits all changes,
  // pushes the branch to the remote, and creates a pull request targeting
  // the original branch. The write-back outcome is recorded in
  // RunStatus.workspace_write_backs.
  GIT_WRITE_BACK_BRANCH_AND_PR = 1;
}

// Harness identifies the harness, the agent loop that processes a session's
// turns. Each value has one label, the same on every surface: HARNESS_STIGMER
// is "Stigmer" and HARNESS_CLAUDE is "Claude Agent". Every string that names a
// harness (the CLI flag, the account default, the model registry, usage) uses
// the first word of its label, in lower case: "stigmer", "claude".
//
// Each harness corresponds to a different Temporal activity type registered
// by the runner daemon. The harness determines:
// - Which tools the agent has access to
// - How conversation state is managed (Stigmer checkpoints vs the harness's own)
// - Which LLM models are available
// - Billing tier and cost structure
//
// HARNESS_UNSPECIFIED defaults to HARNESS_STIGMER.
enum Harness {
  // Platform default — resolves to HARNESS_STIGMER.
  HARNESS_UNSPECIFIED = 0;

  // Stigmer: Stigmer's own harness. Runs any catalog model, open source end
  // to end.
  //
  // Stigmer-managed checkpoints, custom tools, sandbox isolation,
  // pause/resume, and full HITL approval flow.
  HARNESS_STIGMER = 1;

  // HARNESS_NATIVE was this value's name before the harness took the first
  // word of its label as its one word. The name is reserved so no other harness ever takes it.
  reserved "HARNESS_NATIVE";

  // 2 was HARNESS_CURSOR, the harness that ran Cursor's SDK agent on
  // Cursor's servers. It was retired: the number and the name are
  // reserved so neither is ever reused for a different harness.
  reserved 2;
  reserved "HARNESS_CURSOR";

  // Claude Agent: Anthropic's Claude Agent SDK. Claude models on the
  // organization's own Anthropic key.
  //
  // Approvals that stop at the exact call, conversation state mirrored to
  // Stigmer, model calls on the organization's own Anthropic key. A runner
  // that does not carry the Claude Agent SDK refuses its turns plainly.
  HARNESS_CLAUDE = 3;
}

// EnvironmentSource names whose choice a conversation's Environment was.
enum EnvironmentSource {
  // No Environment applies.
  ENVIRONMENT_SOURCE_UNSPECIFIED = 0;

  // The conversation named it.
  ENVIRONMENT_SOURCE_SESSION = 1;

  // The routine whose run started the conversation named it.
  ENVIRONMENT_SOURCE_ROUTINE = 2;

  // The conversation's agent names it as its default.
  ENVIRONMENT_SOURCE_AGENT = 3;

  // The organization names it as its default.
  ENVIRONMENT_SOURCE_ORGANIZATION = 4;
}

// ExecutionTarget specifies where session activities are executed.
//
// Determines whether the runner that processes agent activities lives on the
// client's machine (desktop app or CLI) or in a cloud-provisioned sandbox.
// Set at session creation time and immutable once a run has started —
// workspace state may not be portable between local and cloud environments.
//
// @internal
// The control plane uses this field in dispatch to decide whether to route
// activities to a client-polled per-session queue (LOCAL) or provision a
// cloud sandbox (CLOUD). Both use task queues named "session:{session_id}".
// The difference is who provides the runner: the client (LOCAL) or the
// server (CLOUD).
enum ExecutionTarget {
  // Platform default — server decides based on deployment context.
  //
  // @internal
  // Resolves to LOCAL for OSS/self-hosted, CLOUD for managed cloud service.
  EXECUTION_TARGET_UNSPECIFIED = 0;

  // Client's embedded runner handles activities.
  //
  // Desktop app or CLI spawns a local runner process that polls the
  // session's task queue. No server-side provisioning needed.
  EXECUTION_TARGET_LOCAL = 1;

  // Server provisions a cloud sandbox for execution.
  //
  // The control plane triggers EnsureSessionSandbox to create an isolated
  // environment with a runner polling the session's task queue.
  EXECUTION_TARGET_CLOUD = 2;
}
