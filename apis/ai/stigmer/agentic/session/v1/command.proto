syntax = "proto3";

package ai.stigmer.agentic.session.v1;

import "ai/stigmer/agentic/session/v1/api.proto";
import "ai/stigmer/agentic/session/v1/event.proto";
import "ai/stigmer/agentic/session/v1/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// SessionCommandController handles write operations for agent sessions.
service SessionCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = session;

  // Create or update a session.
  //
  // @internal
  // The authorization and state-operation are determined depending on whether the session
  // is going to be created or updated which is determined as part of the request execution.
  rpc apply(Session) returns (Session);

  // Create a session.
  //
  // @internal
  // Requires can_create_session permission in the organization.
  rpc create(Session) returns (Session) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_session;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to create session in this organization";
  }

  // Update an existing session (e.g., subject, thread_id).
  rpc update(Session) returns (Session) {
    option (ai.stigmer.commons.rpc.config).resource_kind = session;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update session";
  }

  // Set the session subject.
  //
  // This is a targeted update that modifies only the subject field,
  // leaving other session fields untouched. Use this instead of the full
  // update RPC when you only need to change the session subject.
  //
  // @internal
  // Server-side field-level update, race-safe. Atomically modifies only
  // spec.subject without touching other fields.
  rpc updateSubject(UpdateSessionSubjectRequest) returns (Session) {
    option (ai.stigmer.commons.rpc.config).resource_kind = session;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update session subject";
  }

  // Keep or undo the file changes a turn made, or one of its files.
  //
  // In a conversation with file review on (SessionSpec.file_review), each
  // turn's file edits are applied as the agent makes them and listed in a
  // stigmer.file_review.changes event. They can be decided until the
  // conversation's next message is sent; then whatever is undecided is
  // kept. Keep records the choice. Undo puts the file back as it was
  // before the turn: at once when the turn has ended (the reply names the
  // turn that does it), else when the turn's next step starts. The
  // decision is appended as a stigmer.file_review.decided event.
  //
  // ## Error Conditions
  //
  // - NOT_FOUND: the change set is not one of this conversation's
  // - FAILED_PRECONDITION: the conversation has moved on (a later message
  //   was sent), the change was already decided the other way (a decision
  //   is final), the file is not in the change set, or a keep of a change
  //   that cannot be shown whole without acknowledge_unreviewable
  // - INVALID_ARGUMENT: expected_digest does not match the change
  //
  // ## Idempotency
  //
  // The same decision sent again records nothing new and starts no second
  // turn.
  //
  // @internal
  // can_edit on the session, the posture of every answer a person gives a
  // conversation. The decision lands on the change set's run as a
  // FILE_DECIDED ledger event in the same write as its session event;
  // RunCommandController.submitFileDecision is an adapter onto the same
  // core.
  rpc reviewFileChanges(ReviewFileChangesInput) returns (ReviewFileChangesResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = session;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "session_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to review file changes in session";
  }

  // Allow or deny a tool use that waits for an answer.
  //
  // A call that needs a person's answer is an agent.tool_use (or
  // agent.mcp_tool_use) with evaluated_permission ask, and the session goes
  // idle with stop_reason requires_action naming it. The answer is appended
  // as a user.tool_confirmation. A deny may carry a message, which the
  // agent reads. When every waiting call of the turn is answered, the turn
  // resumes; until then the session re-states requires_action with the
  // calls still waiting.
  //
  // ## Error Conditions
  //
  // - NOT_FOUND: the tool use is not one of this conversation's calls that
  //   asked
  // - FAILED_PRECONDITION: the call no longer waits (its turn moved on or
  //   was stopped), or it was already answered the other way (an answer is
  //   final)
  //
  // ## Idempotency
  //
  // The same answer sent again records nothing new and returns the event
  // first recorded.
  //
  // @internal
  // can_edit on the session, the posture of every answer a person gives a
  // conversation. RunCommandController.submitApproval is an adapter onto
  // the same core.
  rpc confirmToolUse(ConfirmToolUseInput) returns (SessionEvent) {
    option (ai.stigmer.commons.rpc.config).resource_kind = session;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "session_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to answer a tool use in session";
  }

  // Allow a tool use, and every call of its class for the rest of the turn.
  //
  // The class is the call's built-in category (write, delete or shell), its
  // MCP server, or, when a hook asked, that hook on that tool. The grant is
  // appended as a stigmer.permission.grant after the call's
  // user.tool_confirmation, and every other call of the class waiting in
  // the same turn is allowed with it. A call with no class (one the
  // default never asks about) is allowed alone, with no grant.
  //
  // ## Error Conditions
  //
  // As confirmToolUse.
  //
  // ## Idempotency
  //
  // The same grant sent again records nothing new.
  //
  // @internal
  // can_edit on the session.
  rpc grantPermission(GrantPermissionInput) returns (GrantPermissionResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = session;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "session_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to grant a permission in session";
  }

  // Stop the session's unfinished work.
  //
  // Appends a user.interrupt and stops every unfinished turn of the
  // conversation: queued, working, waiting for an answer or paused. Each
  // ends cancelled and the session goes idle with end_turn. Files undone
  // in a turn that waited are put back at once.
  //
  // ## Error Conditions
  //
  // - INVALID_ARGUMENT: session_thread_id is set (one thread alone cannot
  //   be stopped)
  // - FAILED_PRECONDITION: the execution engine is not connected
  //
  // ## Idempotency
  //
  // An interrupt with nothing unfinished records the event and stops
  // nothing.
  //
  // @internal
  // can_edit on the session, once; each run is then cancelled through the
  // cancel chain's steps after its authorization.
  // RunCommandController.cancel stays the per-run stop.
  rpc interrupt(InterruptSessionInput) returns (InterruptSessionResponse) {
    option (ai.stigmer.commons.rpc.config).resource_kind = session;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "session_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to interrupt session";
  }

  // Delete a session.
  //
  // Deletion cascades to the session's runs. Billing usage
  // records are immutable and unaffected — they carry their own copies of
  // the session and run identifiers.
  //
  // Fails with FAILED_PRECONDITION while any run in the
  // session is still active (pending, in progress, waiting for approval,
  // or paused); cancel it or wait for it to finish first.
  //
  // @internal
  // Requires can_delete on the session (owner-only — sessions are personal
  // resources, so org admins have no implicit delete access).
  rpc delete(SessionId) returns (Session) {
    option (ai.stigmer.commons.rpc.config).resource_kind = session;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete session";
  }

  // Append a run's events to its session's log.
  //
  // Only the runner acting for the run may call it, while the run is not
  // finished. It accepts the events a runner produces: agent.*,
  // session.thread_* and session.error. The batch is appended whole or not
  // at all.
  //
  // @internal
  // Skip-authorization: a permission cannot tell a runner from the person
  // it acts for. The handler admits only a runner credential for this run,
  // decided by the composed RunnerCredentialProvider (its
  // authorizeRunEventsAppend capability, else the execution-scoped binding).
  rpc appendEvents(AppendSessionEventsInput) returns (AppendSessionEventsResponse) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }
}
