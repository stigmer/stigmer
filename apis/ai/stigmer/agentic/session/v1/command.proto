syntax = "proto3";

package ai.stigmer.agentic.session.v1;

import "ai/stigmer/agentic/session/v1/api.proto";
import "ai/stigmer/agentic/session/v1/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// SessionCommandController handles write operations for agent sessions.
service SessionCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = session;

  // Create or update a session.
  //
  // @internal
  // The authorization and state-operation are determined depending on whether the session
  // is going to be created or updated which is determined as part of the request execution.
  rpc apply(Session) returns (Session);

  // Create a session.
  //
  // @internal
  // Requires can_create_session permission in the organization.
  rpc create(Session) returns (Session) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_session;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to create session in this organization";
  }

  // Update an existing session (e.g., subject, thread_id).
  rpc update(Session) returns (Session) {
    option (ai.stigmer.commons.rpc.config).resource_kind = session;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update session";
  }

  // Set the session subject.
  //
  // This is a targeted update that modifies only the subject field,
  // leaving other session fields untouched. Use this instead of the full
  // update RPC when you only need to change the session subject.
  //
  // @internal
  // Server-side field-level update, race-safe. Atomically modifies only
  // spec.subject without touching other fields.
  rpc updateSubject(UpdateSessionSubjectRequest) returns (Session) {
    option (ai.stigmer.commons.rpc.config).resource_kind = session;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update session subject";
  }

  // Delete a session.
  //
  // @internal
  // Restricted to platform operators to preserve the billing and audit trail.
  // Regular users (including session owners) cannot delete sessions.
  rpc delete(SessionId) returns (Session) {
    option (ai.stigmer.commons.rpc.config).resource_kind = platform;
    option (ai.stigmer.commons.rpc.config).permission = can_delete_session;
    option (ai.stigmer.commons.rpc.config).resource_id = "stigmer";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete session — operator access required";
  }
}
