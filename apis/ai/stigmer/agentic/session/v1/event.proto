syntax = "proto3";

package ai.stigmer.agentic.session.v1;

import "ai/stigmer/agentic/session/v1/event_content.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// SessionEvent is one entry in a session's ordered event log.
//
// The event itself is a Claude Managed Agents session event, named and
// shaped as Anthropic's SDK types it (see the session docs for the pinned
// version). The envelope adds where the event sits: its place in the log,
// the turn (run) it belongs to and the thread that produced it.
//
// @internal
// Each oneof member carries its Managed Agents type string as the
// event_type field option; the messages keep no type field of their own,
// so the renderer (domain/session/events in the server) reads the name
// from the option.
message SessionEvent {
  // The event's place in the session's log, assigned when it is appended:
  // later events have higher numbers.
  int64 seq = 1;

  // The session the event belongs to.
  string session_id = 2;

  // The run (turn) the event belongs to; empty for none.
  string run_id = 3;

  // The thread that produced the event; empty for the session's primary
  // thread.
  string thread_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
  ];

  // The event.
  oneof event {
    // The user sent a message.
    UserMessageEvent user_message = 10 [(ai.stigmer.commons.apiresource.event_type) = "user.message"];

    // The session started working.
    SessionStatusRunningEvent session_status_running = 11 [(ai.stigmer.commons.apiresource.event_type) = "session.status_running"];

    // The session stopped working and waits for input.
    SessionStatusIdleEvent session_status_idle = 12 [(ai.stigmer.commons.apiresource.event_type) = "session.status_idle"];

    // An error happened.
    SessionErrorEvent session_error = 13 [(ai.stigmer.commons.apiresource.event_type) = "session.error"];

    // The agent wrote a message.
    AgentMessageEvent agent_message = 14 [(ai.stigmer.commons.apiresource.event_type) = "agent.message"];

    // The agent is thinking.
    AgentThinkingEvent agent_thinking = 15 [(ai.stigmer.commons.apiresource.event_type) = "agent.thinking"];

    // The agent called a built-in tool.
    AgentToolUseEvent agent_tool_use = 16 [(ai.stigmer.commons.apiresource.event_type) = "agent.tool_use"];

    // A built-in tool returned.
    AgentToolResultEvent agent_tool_result = 17 [(ai.stigmer.commons.apiresource.event_type) = "agent.tool_result"];

    // The agent called an MCP server's tool.
    AgentMcpToolUseEvent agent_mcp_tool_use = 18 [(ai.stigmer.commons.apiresource.event_type) = "agent.mcp_tool_use"];

    // An MCP server's tool returned.
    AgentMcpToolResultEvent agent_mcp_tool_result = 19 [(ai.stigmer.commons.apiresource.event_type) = "agent.mcp_tool_result"];

    // A thread (a sub-agent) was created.
    SessionThreadCreatedEvent session_thread_created = 20 [(ai.stigmer.commons.apiresource.event_type) = "session.thread_created"];

    // A thread started working.
    SessionThreadStatusRunningEvent session_thread_status_running = 21 [(ai.stigmer.commons.apiresource.event_type) = "session.thread_status_running"];

    // A thread stopped working.
    SessionThreadStatusIdleEvent session_thread_status_idle = 22 [(ai.stigmer.commons.apiresource.event_type) = "session.thread_status_idle"];

    // The agent sent a message to another thread.
    AgentThreadMessageSentEvent agent_thread_message_sent = 23 [(ai.stigmer.commons.apiresource.event_type) = "agent.thread_message_sent"];

    // The agent received a message from another thread.
    AgentThreadMessageReceivedEvent agent_thread_message_received = 24 [(ai.stigmer.commons.apiresource.event_type) = "agent.thread_message_received"];

    // A thread's context was compacted.
    AgentThreadContextCompactedEvent agent_thread_context_compacted = 25 [(ai.stigmer.commons.apiresource.event_type) = "agent.thread_context_compacted"];

    // Stigmer's own events (types starting with stigmer.): optional for a
    // Managed Agents client, which skips a type it does not know.

    // The text of the agent's thinking.
    StigmerAgentThinkingEvent stigmer_agent_thinking = 100 [(ai.stigmer.commons.apiresource.event_type) = "stigmer.agent.thinking"];

    // Why a tool use waits for a person's answer.
    StigmerPermissionAskedEvent stigmer_permission_asked = 101 [(ai.stigmer.commons.apiresource.event_type) = "stigmer.permission.asked"];

    // A line the platform added to the conversation in its own voice.
    StigmerHarnessNoteEvent stigmer_harness_note = 102 [(ai.stigmer.commons.apiresource.event_type) = "stigmer.harness.note"];

    // The structured output the turn produced.
    StigmerAgentStructuredOutputEvent stigmer_agent_structured_output = 103 [(ai.stigmer.commons.apiresource.event_type) = "stigmer.agent.structured_output"];

    // Which of the agent's memories the turn recalled.
    StigmerMemoryRecalledEvent stigmer_memory_recalled = 104 [(ai.stigmer.commons.apiresource.event_type) = "stigmer.memory.recalled"];

    // The files a turn changed, offered for review (the session asked for
    // file review).
    StigmerFileReviewChangesEvent stigmer_file_review_changes = 105 [(ai.stigmer.commons.apiresource.event_type) = "stigmer.file_review.changes"];

    // A turn's file changes, or one of its files, were kept or undone.
    StigmerFileReviewDecidedEvent stigmer_file_review_decided = 106 [(ai.stigmer.commons.apiresource.event_type) = "stigmer.file_review.decided"];

    // The files that were undone were put back.
    StigmerFileReviewReconciledEvent stigmer_file_review_reconciled = 107 [(ai.stigmer.commons.apiresource.event_type) = "stigmer.file_review.reconciled"];
  }
}

// UserMessageEvent is a message the user sent: user.message.
message UserMessageEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // The message's content.
  repeated ContentBlock content = 2;

  // When the server accepted the message, as RFC 3339 UTC.
  string processed_at = 3;
}

// SessionStatusRunningEvent says the session started working:
// session.status_running.
message SessionStatusRunningEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 2;
}

// SessionStatusIdleEvent says the session stopped working and waits for
// input: session.status_idle.
message SessionStatusIdleEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 2;

  // Why the session went idle.
  StopReason stop_reason = 3 [(buf.validate.field).required = true];

  // The refusal that stopped the session, when it was one; null otherwise.
  optional StopDetails stop_details = 4;
}

// SessionErrorEvent reports an error: session.error.
message SessionErrorEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 2;

  // The error.
  SessionError error = 3 [(buf.validate.field).required = true];
}

// AgentMessageEvent is a message the agent wrote: agent.message.
message AgentMessageEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // The message's content: text and redacted blocks.
  repeated ContentBlock content = 2;

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 3;
}

// AgentThinkingEvent says the agent is thinking: agent.thinking. It
// carries no text.
message AgentThinkingEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 2;
}

// AgentToolUseEvent is the agent calling a built-in tool: agent.tool_use.
message AgentToolUseEvent {
  // The event's id, unique in its session; the tool's result names it.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // The tool's input.
  google.protobuf.Struct input = 2 [(buf.validate.field).required = true];

  // The tool's name.
  string name = 3 [(buf.validate.field).string.min_len = 1];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 4;

  // The permission decided for the call: allow, ask or deny.
  string evaluated_permission = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "allow",
        "ask",
        "deny"
      ]
    }
  ];

  // How the permission was decided.
  ToolEvaluation evaluation = 6;

  // The thread that made the call; empty for the primary thread.
  string session_thread_id = 7;
}

// AgentToolResultEvent is a built-in tool's result: agent.tool_result.
message AgentToolResultEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 2;

  // The agent.tool_use event this result answers.
  string tool_use_id = 3 [(buf.validate.field).string.min_len = 1];

  // The result's content.
  repeated ContentBlock content = 4;

  // Whether the tool failed.
  bool is_error = 5;
}

// AgentMcpToolUseEvent is the agent calling an MCP server's tool:
// agent.mcp_tool_use.
message AgentMcpToolUseEvent {
  // The event's id, unique in its session; the tool's result names it.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // The tool's input.
  google.protobuf.Struct input = 2 [(buf.validate.field).required = true];

  // The MCP server the tool belongs to.
  string mcp_server_name = 3 [(buf.validate.field).string.min_len = 1];

  // The tool's name.
  string name = 4 [(buf.validate.field).string.min_len = 1];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 5;

  // The permission decided for the call: allow, ask or deny.
  string evaluated_permission = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "allow",
        "ask",
        "deny"
      ]
    }
  ];

  // How the permission was decided.
  ToolEvaluation evaluation = 7;

  // The thread that made the call; empty for the primary thread.
  string session_thread_id = 8;
}

// AgentMcpToolResultEvent is an MCP server tool's result:
// agent.mcp_tool_result.
message AgentMcpToolResultEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // The agent.mcp_tool_use event this result answers.
  string mcp_tool_use_id = 2 [(buf.validate.field).string.min_len = 1];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 3;

  // The result's content.
  repeated ContentBlock content = 4;

  // Whether the tool failed.
  bool is_error = 5;
}

// SessionThreadCreatedEvent says a thread (a sub-agent) was created:
// session.thread_created.
message SessionThreadCreatedEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // The name of the agent the thread runs.
  string agent_name = 2;

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 3;

  // The new thread.
  string session_thread_id = 4 [(buf.validate.field).string.min_len = 1];
}

// SessionThreadStatusRunningEvent says a thread started working:
// session.thread_status_running.
message SessionThreadStatusRunningEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // The name of the agent the thread runs.
  string agent_name = 2;

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 3;

  // The thread.
  string session_thread_id = 4 [(buf.validate.field).string.min_len = 1];
}

// SessionThreadStatusIdleEvent says a thread stopped working:
// session.thread_status_idle.
message SessionThreadStatusIdleEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // The name of the agent the thread runs.
  string agent_name = 2;

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 3;

  // The thread.
  string session_thread_id = 4 [(buf.validate.field).string.min_len = 1];

  // Why the thread went idle.
  StopReason stop_reason = 5 [(buf.validate.field).required = true];

  // The refusal that stopped the thread, when it was one; null otherwise.
  optional StopDetails stop_details = 6;
}

// AgentThreadMessageSentEvent is a message the agent sent to another
// thread: agent.thread_message_sent.
message AgentThreadMessageSentEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // The message's content.
  repeated ContentBlock content = 2;

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 3;

  // The thread the message went to.
  string to_session_thread_id = 4 [(buf.validate.field).string.min_len = 1];

  // The name of the agent that thread runs.
  string to_agent_name = 5;
}

// AgentThreadMessageReceivedEvent is a message the agent received from
// another thread: agent.thread_message_received.
message AgentThreadMessageReceivedEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // The message's content.
  repeated ContentBlock content = 2;

  // The thread the message came from.
  string from_session_thread_id = 3 [(buf.validate.field).string.min_len = 1];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 4;

  // The name of the agent that thread runs.
  string from_agent_name = 5;
}

// AgentThreadContextCompactedEvent says a thread's context was compacted:
// agent.thread_context_compacted.
message AgentThreadContextCompactedEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 2;
}

// StigmerAgentThinkingEvent is the text of the agent's thinking:
// stigmer.agent.thinking. It follows the agent.thinking event it belongs
// to, which carries no text.
message StigmerAgentThinkingEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 2;

  // The agent.thinking event this text belongs to.
  string thinking_id = 3 [(buf.validate.field).string.min_len = 1];

  // The thinking's text.
  string text = 4;
}

// StigmerPermissionAskedEvent says why a tool use waits for a person's
// answer: stigmer.permission.asked. It follows the tool use, whose
// evaluated_permission is ask.
message StigmerPermissionAskedEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 2;

  // The agent.tool_use or agent.mcp_tool_use event that waits.
  string tool_use_id = 3 [(buf.validate.field).string.min_len = 1];

  // What to show the person who answers, for example "Delete repo: my-repo".
  string message = 4;

  // A short preview of the tool's input, with secret values redacted.
  string args_preview = 5;

  // Which rule asked or resolved the call, as one word, the run's
  // ApprovalPolicySource without its prefix: builtin_category (a built-in
  // tool that writes, deletes or runs a shell), annotation_destructive_tighten
  // (an MCP tool its server marks destructive, or whose server's tools could
  // not be listed), hook (a hook decided), approval_lease (an "approve all"
  // for the call's class), auto_approve_all (the run approves every call) or
  // unattended_skip (no one can answer, so the call was skipped). Empty when
  // no rule is recorded.
  string policy_source = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "builtin_category",
        "annotation_destructive_tighten",
        "hook",
        "approval_lease",
        "auto_approve_all",
        "unattended_skip"
      ]
    }
  ];

  // The plugin whose hook asked; empty for the agent's own hooks, or when no
  // hook asked.
  string policy_hook = 7;
}

// StigmerHarnessNoteEvent is a line the platform added to the conversation
// in its own voice, for example that the platform's tools are off for this
// turn: stigmer.harness.note. It is not model input.
message StigmerHarnessNoteEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 2;

  // The line.
  string text = 3;
}

// StigmerAgentStructuredOutputEvent is the structured output the turn
// produced, when its run asked for one: stigmer.agent.structured_output.
message StigmerAgentStructuredOutputEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 2;

  // The output, conforming to the run's structured output schema.
  google.protobuf.Struct output = 3 [(buf.validate.field).required = true];
}

// StigmerMemoryRecalledEvent says which of the agent's memories the turn
// recalled: stigmer.memory.recalled.
message StigmerMemoryRecalledEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 2;

  // Whether the turn chose among the memories; false means the agent saw
  // every one.
  bool selection_active = 3;

  // The memories the turn recalled, by id, when it chose among them.
  repeated string injected_memory_ids = 4;

  // The embedding model that chose them; empty when the turn did not choose.
  string embedding_model = 5;
}

// ToolOutputDelta is one fragment of a running tool's output:
// stigmer.tool_output_delta. Streamed, never stored; the tool's result
// event carries the whole output.
message ToolOutputDelta {
  // The tool use whose output grows.
  string tool_use_id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // The fragment.
  string delta = 2;
}

// EventStart opens a live preview of an event still being produced: the
// event's type and id. Previews are streamed, never stored; the stored
// event with the same id replaces the preview.
message EventStart {
  // The previewed event.
  EventPreview event = 1 [(buf.validate.field).required = true];
}

// EventPreview names a previewed event.
message EventPreview {
  // The previewed event's id.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // The previewed event's type: agent.message or agent.thinking.
  string type = 2 [(buf.validate.field).string = {
    in: [
      "agent.message",
      "agent.thinking"
    ]
  }];
}

// StigmerFileReviewChangesEvent lists the files a turn changed, offered
// for review: stigmer.file_review.changes. Written once per turn that
// changed files in a session with file review on. The edits are already
// applied; each stays until it is undone (SessionCommandController
// reviewFileChanges), and whatever is undecided when the next message is
// sent is kept.
message StigmerFileReviewChangesEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 2;

  // The turn's change set, as reviewFileChanges names it.
  string change_set_id = 3 [(buf.validate.field).string.min_len = 1];

  // The files the turn changed.
  repeated StigmerFileReviewChange files = 4;

  // The digest of the whole change set: the expected_digest a decision on
  // the whole set presents.
  string aggregate_digest = 5;
}

// StigmerFileReviewChange is one file a turn changed.
message StigmerFileReviewChange {
  // The file's change, as a decision on one file names it.
  string file_change_id = 1 [(buf.validate.field).string.min_len = 1];

  // The file's path in the workspace after the change; for a deleted file,
  // the path it had.
  string path = 2;

  // The path the file had before a rename; empty otherwise.
  string previous_path = 3;

  // What happened to the file: added, modified, deleted or renamed.
  string change = 4 [(buf.validate.field).string = {
    in: [
      "added",
      "modified",
      "deleted",
      "renamed"
    ]
  }];

  // The digest of the file's change: the expected_digest a decision on
  // this file presents.
  string digest = 5;

  // Lines the change added; 0 for a binary file or one whose text was
  // withheld.
  int32 lines_added = 6 [(buf.validate.field).int32.gte = 0];

  // Lines the change removed; 0 for a binary file or one whose text was
  // withheld.
  int32 lines_removed = 7 [(buf.validate.field).int32.gte = 0];

  // How much of the change can be shown: complete (the whole diff), binary
  // (bytes only, no text diff), secret (a secret-like file whose text is
  // withheld) or partial (too large, or not readable). Only a complete or
  // an acknowledged binary change can be kept on its own; any change can
  // be undone.
  string reviewable = 8 [(buf.validate.field).string = {
    in: [
      "complete",
      "partial",
      "binary",
      "secret"
    ]
  }];
}

// StigmerFileReviewDecidedEvent records that a turn's file changes, or one
// of its files, were kept or undone: stigmer.file_review.decided. Written
// by the server only: by a person's decision, or by a rule that keeps
// changes on the person's behalf.
message StigmerFileReviewDecidedEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 2;

  // The change set decided, as stigmer.file_review.changes named it.
  string change_set_id = 3 [(buf.validate.field).string.min_len = 1];

  // What the decision covers: change_set (every file of the set) or file
  // (the one file_change_id).
  string scope = 4 [(buf.validate.field).string = {
    in: [
      "change_set",
      "file"
    ]
  }];

  // The file decided, when scope is file; empty otherwise.
  string file_change_id = 5;

  // keep (the change stays) or undo (the file is put back as it was before
  // the turn).
  string action = 6 [(buf.validate.field).string = {
    in: [
      "keep",
      "undo"
    ]
  }];

  // The digest the decision was made against.
  string expected_digest = 7;

  // Who decided: person (someone with edit access to the conversation),
  // approved_command (every change came from a command the person had
  // approved), eval_try (a plugin eval's try, whose edits are always
  // kept) or next_turn (the next message was sent before a decision, so
  // the change was kept).
  string origin = 8 [(buf.validate.field).string = {
    in: [
      "person",
      "approved_command",
      "eval_try",
      "next_turn"
    ]
  }];

  // The reason given with the decision, if any.
  string reason = 9;
}

// StigmerFileReviewReconciledEvent records that the files undone in a
// change set were put back: stigmer.file_review.reconciled. Written once
// per change set with an undo, by the turn that put the files back.
message StigmerFileReviewReconciledEvent {
  // The event's id, unique in its session: letters, digits, _ . : -, at most 128.
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];

  // When the event was appended, as RFC 3339 UTC.
  string processed_at = 2;

  // The change set reconciled.
  string change_set_id = 3 [(buf.validate.field).string.min_len = 1];

  // The paths put back as they were before the turn.
  repeated string undone_paths = 4;

  // Why nothing was put back, when the reconcile failed: hash_mismatch
  // (the captured content no longer matches what was reviewed) or
  // reconcile_failed (the files could not be restored). Empty when the
  // files were put back.
  string failure = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "hash_mismatch",
        "reconcile_failed"
      ]
    }
  ];

  // What failed, for a person; empty when nothing failed.
  string failure_detail = 6;
}

// EventDelta is one fragment of a previewed agent.message.
message EventDelta {
  // The fragment.
  DeltaContent delta = 1 [(buf.validate.field).required = true];

  // The previewed event's id, as its EventStart named it.
  string event_id = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"];
}

// DeltaContent is a fragment of a previewed event's content.
message DeltaContent {
  // The fragment: part of one text block.
  ContentBlock content = 1 [(buf.validate.field).required = true];

  // Always content_delta.
  string type = 2 [(buf.validate.field).string = {
    in: ["content_delta"]
  }];

  // The index of the content block the fragment belongs to.
  int32 index = 3 [(buf.validate.field).int32.gte = 0];
}
