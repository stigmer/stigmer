syntax = "proto3";

package ai.stigmer.agentic.project.v1;

// ProjectRuntime specifies the SDK runtime for project synthesis.
// The runtime determines which SDK generates the resource manifest.
enum ProjectRuntime {
  // Unspecified runtime - validation will reject this.
  project_runtime_unspecified = 0;

  // Go SDK runtime.
  // Default entry point: main.go
  // Synthesis: `go run <entry_point>` generates manifest
  go = 1;

  // Python SDK runtime.
  // Default entry point: main.py
  // Synthesis: `python <entry_point>` generates manifest
  python = 2;

  // Node.js SDK runtime.
  // Default entry point: index.ts
  // Synthesis: `npx ts-node <entry_point>` generates manifest
  node = 3;
}
