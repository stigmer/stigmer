syntax = "proto3";

package ai.stigmer.agentic.agentshare.v1;

import "ai/stigmer/agentic/agentshare/v1/api.proto";
import "ai/stigmer/agentic/agentshare/v1/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// AgentShareCommandController handles write operations for agent shares.
service AgentShareCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = agent_share;

  // Create or update an agent share.
  //
  // @internal
  // The authorization and state-operation are determined depending on
  // whether the share is going to be created or updated, which is resolved
  // as part of the request execution. The share slug defaults to the
  // referenced agent's slug when omitted.
  rpc apply(AgentShare) returns (AgentShare);

  // Create an agent share.
  //
  // Enabling a share is a spending decision: conversations over the hosted
  // link call models on the sharing organization's own provider keys, and
  // the providers bill the organization for them.
  //
  // @internal
  // Authorization: requires can_edit on the REFERENCED AGENT
  // (spec.agent_ref), checked in-handler — the same bar as the former
  // updateSharing RPC, since creating a channel broadens who can chat with
  // the agent runtime. The standard org-scoped create tuples (owner =
  // creator) are written for the share itself; no visibility tuples are
  // written for visitors (guest admission is app-level by design — see
  // AgentShareSpec). Enforced here: metadata.org must equal
  // spec.agent_ref.org, so a share lives in its agent's organization.
  rpc create(AgentShare) returns (AgentShare) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Update an agent share: the fields update_mask names change, every other
  // field keeps its stored value.
  //
  // The referenced agent is immutable. A mask naming the audience or the
  // vaults replaces them whole: an empty audience makes the share
  // organization-only, and empty vaults detach them (both fail closed).
  //
  // resource.metadata.id names the agent share; apply finds one by slug. The slug
  // changes only through rename, and a mask naming a field another door
  // owns, or a path the agent share does not have, is refused with
  // INVALID_ARGUMENT naming the path.
  //
  // An update is refused with ABORTED carrying a google.rpc.ErrorInfo detail
  // (domain "stigmer.ai"):
  //
  //   - ETAG_MISMATCH — resource.metadata.etag is set and the agent share changed
  //     since that etag was read: read it again and make the change again.
  //     No metadata.
  //   - WRITE_CONFLICT — the agent share kept changing while the update was
  //     being saved: try again. No metadata.
  //
  // @internal
  // Authorization: requires can_edit permission on the agent share.
  // status.share_link_token is preserved verbatim (rotateShareLink is its
  // sole writer).
  rpc update(UpdateAgentShareInput) returns (AgentShare) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_share;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "resource.metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update agent share";
  }

  // Rotate the share's link token.
  //
  // Generates a fresh server-side token for the share's hosted chat link.
  // The share URL becomes `/chat/<share id>?k=<token>` and the previous
  // link (tokened or plain) stops working immediately — including for
  // visitors mid-conversation. Use this to kill a leaked or over-shared
  // public link without disabling or deleting the share.
  //
  // The token lives in status.share_link_token, so manifest applies never
  // reset it. Rotation affects public-audience shares only; org-audience
  // access is governed by live org membership instead.
  //
  // @internal
  // Authorization: requires can_edit on the agent share — the same bar as
  // update, since both control shared-link access. The handler is the sole
  // writer of status.share_link_token (server-generated entropy; clients
  // never supply the token).
  rpc rotateShareLink(RotateShareLinkInput) returns (AgentShare) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_share;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to rotate agent share link";
  }

  // Delete an agent share.
  //
  // Full teardown of the channel: the hosted link stops resolving, live
  // guest tokens die on their next message, and the share's configuration
  // (origins, messages, credentials, link token) is gone. To pause serving
  // while keeping configuration, update the share with enabled=false
  // instead.
  //
  // @internal
  // Authorization: requires can_delete permission on the agent share. The
  // referenced agent is untouched.
  rpc delete(AgentShareId) returns (AgentShare) {
    option (ai.stigmer.commons.rpc.config).resource_kind = agent_share;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "value";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete agent share";
  }
}
