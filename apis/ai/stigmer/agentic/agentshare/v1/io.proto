syntax = "proto3";

package ai.stigmer.agentic.agentshare.v1;

import "ai/stigmer/agentic/agentshare/v1/api.proto";
import "ai/stigmer/commons/rpc/pagination.proto";
import "buf/validate/validate.proto";

// AgentShareId wraps an agent share identifier.
message AgentShareId {
  // Unique identifier of the agent share.
  string value = 1 [(buf.validate.field).required = true];
}

// Input for retrieving all shares of a specific agent.
message GetAgentSharesByAgentRequest {
  // Identifier of the agent whose shares to retrieve.
  string agent_id = 1 [(buf.validate.field).required = true];

  // Pagination options.
  ai.stigmer.commons.rpc.PageInfo page_info = 2;

  // Organization slug to scope the results to.
  //
  // When set, only shares whose metadata.org matches are returned — the
  // org-context view a console tab needs. When empty, results are bounded
  // only by the caller's view permissions, which for a member of several
  // organizations spans all of them.
  //
  // @internal
  // Optional by design: the field must stay empty-tolerant because
  // pre-existing callers (and cross-org administrative flows) rely on the
  // permission-bounded behavior. Filtering happens in the query/list step
  // of each edition's handler, never client-side.
  string org = 3;
}

// Response containing a paginated list of agent shares.
message AgentShareList {
  // Total number of agent shares matching the query.
  int32 total_count = 1;

  // Agent shares in the current page.
  repeated AgentShare items = 2;
}

// Input for listing agent shares within an organization.
message ListAgentSharesRequest {
  // Organization slug to scope the listing.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // Filter by metadata labels. AND semantics: all labels must match.
  map<string, string> labels = 2;

  // Pagination options.
  ai.stigmer.commons.rpc.PageInfo page_info = 3;
}

// Input for rotating a share's link token.
//
// Used by the rotateShareLink RPC. The server generates the new token —
// callers never supply one — and the previous link stops working the
// moment the rotation persists.
message RotateShareLinkInput {
  // ID of the agent share whose link token is being rotated.
  string resource_id = 1 [(buf.validate.field).required = true];
}

// Input for resolving a share's public profile.
//
// Identifies the share by its id, the one identity a hosted chat link
// carries (`/chat/<share id>`), plus the link token when the link carries
// one. A share id never changes and is never reused, so a link cannot be
// broken by a rename of the share's organization or captured by a later
// holder of that organization's name.
message GetSharedProfileRequest {
  reserved 1, 2;
  reserved "org", "slug";

  // Id of the share, from the hosted chat link.
  string share_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];

  // Link token from the share link's `?k=` parameter.
  //
  // Required (and validated) only when the share link has been locked with
  // rotateShareLink; ignored for plain share links.
  string link_token = 3 [(buf.validate.field).string.max_len = 128];
}

// SharedAgentProfile is the public projection of a shared agent.
//
// Returned by the getSharedProfile RPC to anonymous visitors of the hosted
// chat page. It is deliberately trimmed: the full Agent resource carries the
// system prompt (spec.instructions), environment declarations, and MCP
// server wiring — none of which may leak to anyone-with-link callers. The
// profile carries only what the hosted chat page needs to render a header
// and start a session.
message SharedAgentProfile {
  // Id of the organization that owns the share. The hosted chat page
  // creates the visitor's session in it.
  string org = 1;

  // Slug of the share: its name within its organization, as the CLI and
  // getByReference address it. The hosted chat link names the share by
  // its id, never by this slug.
  string slug = 2;

  // Human-readable agent name for the chat page header.
  string name = 3;

  // Human-readable description for the chat page header.
  string description = 4;

  // Icon URL for the chat page header.
  string icon_url = 5;

  // ID of the referenced agent's default instance, used by the hosted chat
  // page to create sessions. This is an identifier, not a capability —
  // session creation still requires an authorized token.
  string default_instance_id = 6;
}
