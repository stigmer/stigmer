syntax = "proto3";

package ai.stigmer.agentic.agentshare.v1;

import "ai/stigmer/agentic/agentshare/v1/spec.proto";
import "ai/stigmer/agentic/agentshare/v1/status.proto";
import "ai/stigmer/commons/apiresource/metadata.proto";
import "buf/validate/validate.proto";

// AgentShare turns an agent into a hosted chat link with its own audience, embed origins, and tool credentials.
//
// A share is a distribution channel: it controls who can chat with the
// referenced agent over `/chat/<share id>`, which sites may embed the
// chat widget, what visitors see when a limit refuses them, and which
// vaults guest conversations use. Deleting the share
// tears the channel down; disabling it pauses serving while preserving
// configuration. The referenced agent is never modified by share
// operations.
//
// @internal
// Promoted from Agent.spec.sharing: sharing is channel
// configuration with its own writer and lifecycle. metadata.slug
// names the share within its org (the CLI and getByReference),
// defaults to the referenced agent's slug, and is unique per org.
// The hosted chat link carries metadata.id, never an org or slug,
// so no rename or later name holder can move it.
message AgentShare {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = 'agentic.stigmer.ai/v1'];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = 'AgentShare'];

  // Resource metadata including name, organization, and labels.
  //
  // The id forms the share's hosted chat link (`/chat/<share id>`). The
  // slug names the share within its org, defaults to the referenced
  // agent's slug and is immutable once created. To retire a leaked link
  // while keeping the share, lock it with rotateShareLink.
  ai.stigmer.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // Configurable properties: referenced agent, audience, origins, messages, and credentials.
  AgentShareSpec spec = 4;

  // System-managed state including audit trail and the rotatable link token.
  AgentShareStatus status = 5;
}
