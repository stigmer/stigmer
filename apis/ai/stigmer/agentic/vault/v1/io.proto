syntax = "proto3";

package ai.stigmer.agentic.vault.v1;

import "ai/stigmer/agentic/vault/v1/api.proto";
import "ai/stigmer/commons/rpc/pagination.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// VaultTarget names the vault an entry write changes: a vault by id, or the
// caller's own My vault.
message VaultTarget {
  // Organization the vault belongs to, by slug or id.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // The vault to change.
  oneof vault {
    option (buf.validate.oneof).required = true;

    // A vault by its id.
    string id = 2 [(buf.validate.field).string.min_len = 1];

    // The caller's own My vault in the organization. It is created by the
    // first write that names it.
    bool mine = 3 [(buf.validate.field).bool.const = true];
  }
}

// VaultSecretInput is a secret to save.
message VaultSecretInput {
  // The secret's value.
  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 65536
  }];

  // What the secret is for. Empty keeps the description already saved.
  string description = 2 [(buf.validate.field).string.max_len = 500];
}

// Input for saving secrets in a vault. Secrets already saved under other
// names are kept.
message SetVaultSecretsInput {
  // The vault to save into.
  VaultTarget vault = 1 [(buf.validate.field).required = true];

  // Secrets by name. A name that is already saved has its value replaced.
  map<string, VaultSecretInput> secrets = 2 [(buf.validate.field).map = {
    min_pairs: 1
    max_pairs: 100
    keys: {
      string: {
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        max_len: 128
      }
    }
  }];
}

// Input for removing secrets from a vault by name. Names that are not saved
// are ignored.
message RemoveVaultSecretsInput {
  // The vault to remove from.
  VaultTarget vault = 1 [(buf.validate.field).required = true];

  // Names of the secrets to remove.
  repeated string names = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
}

// Input for saving a login in a vault, at the address of the tool or Git
// host it is for.
message SetVaultConnectionInput {
  // The vault to save into.
  VaultTarget vault = 1 [(buf.validate.field).required = true];

  // The address the login is for: a tool's URL (https://mcp.example.com/mcp)
  // or a Git host (github.com).
  //
  // A tool's address keeps its scheme, host, port and path; the server
  // lowercases the scheme and host, drops a default port and one trailing
  // slash, and drops any query or fragment. A Git host is its bare host name.
  string address = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];

  // The access token.
  string token = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 65536
  }];

  // What the login is for. Empty keeps the description already saved.
  string description = 4 [(buf.validate.field).string.max_len = 500];
}

// Input for removing logins from a vault by address. Addresses that are not
// saved are ignored.
message RemoveVaultConnectionsInput {
  // The vault to remove from.
  VaultTarget vault = 1 [(buf.validate.field).required = true];

  // Addresses of the logins to remove, in any shape setConnection accepts.
  repeated string addresses = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 2048
      }
    }
  }];
}

// Input for reading the caller's own My vault in an organization.
message GetMyVaultInput {
  // Organization, by slug or id.
  string org = 1 [(buf.validate.field).string.min_len = 1];
}

// Input for finding a shared vault by the integrator's own id.
message GetVaultByExternalIdInput {
  // Organization, by slug or id.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // The vault's external id.
  string external_id = 2 [(buf.validate.field).string.min_len = 1];
}

// ListVaultsRequest lists the vaults the caller can see in an organization.
message ListVaultsRequest {
  // Organization, by slug or id.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // Pagination options.
  ai.stigmer.commons.rpc.PageInfo page_info = 2;
}

// VaultList contains a paginated list of vaults.
message VaultList {
  // Total count of matching vaults.
  int32 total_count = 1;

  // Vaults in the current page.
  repeated Vault items = 2;
}

// SignInReturn says where the login page sends the person back to once they
// have signed in. The server builds the address from this choice; a caller
// never writes it.
enum SignInReturn {
  // The console's callback page: the same as web.
  sign_in_return_unspecified = 0;

  // The console's callback page on this deployment.
  web = 1;

  // The console's callback page, which hands the result on to the desktop
  // app (the page opens the app's own link).
  desktop = 2;

  // A page the desktop app serves on this machine: the path
  // /auth/oauth/callback over plain http on 127.0.0.1 at loopback_port
  // (RFC 8252 section 7.3, for apps on the person's own computer).
  loopback = 3;
}

// Input for starting a sign-in at an address. The login is saved into the
// named vault when the sign-in completes.
//
// @internal
// The login app is found by the address: the organization's own OAuthApp
// listing it, then Stigmer's built-in app for it, then (for a tool's URL)
// the address's own login server, which Stigmer registers with once. An
// address none of these can sign in to is refused, naming it.
message StartSignInInput {
  // The vault the login is saved into: a shared vault the caller may edit,
  // or the caller's own My vault.
  VaultTarget vault = 1 [(buf.validate.field).required = true];

  // The address to sign in to: a tool's URL (Linear's MCP endpoint at
  // mcp.linear.app/mcp, over https) or a Git host (github.com), in any shape
  // setConnection accepts.
  string address = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];

  // Where the login page sends the person back to. Unset means web.
  SignInReturn return_to = 3;

  // The port of the desktop app's page, for return_to loopback only: one of
  // the three Stigmer Desktop listens on (17237 to 17239). A login server
  // registers Stigmer once per return address, so the ports are few.
  uint32 loopback_port = 4 [(buf.validate.field).uint32 = {lte: 65535}];

  option (buf.validate.message).cel = {
    id: "start_sign_in.loopback_port"
    message: "loopback_port is required for return_to loopback (17237 to 17239, the ports Stigmer Desktop listens on) and must be left unset otherwise"
    expression: "this.return_to == 3 ? (this.loopback_port >= 17237u && this.loopback_port <= 17239u) : this.loopback_port == 0u"
  };
}

// The login page to send the person to.
message StartSignInOutput {
  // The login page, with every parameter the sign-in needs.
  string authorization_url = 1;

  // The value the login page hands back with the code; completeSignIn takes
  // it.
  string state = 2;

  // Who the person signs in with, for display ("GitHub", or the address's
  // host when the login server has no name).
  string provider_name = 3;

  // The permissions asked for.
  repeated string scopes = 4;
}

// Input for finishing a sign-in, with what the login page handed back.
message CompleteSignInInput {
  // The state from startSignIn, as the login page returned it.
  string state = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];

  // The authorization code the login page returned.
  string code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
}

// The login a sign-in saved.
message CompleteSignInOutput {
  // The address the login was saved at.
  string address = 1;

  // How the saved login is described: the account when the login app says
  // who signed in ("GitHub @ana"), else the host ("Signed in at
  // mcp.linear.app").
  string description = 2;
}

// Input for making a Connect link: a one-time page an integrator sends its
// customer, where the customer signs in at an address and the login is saved
// into the integrator's vault for that customer. The customer needs no
// Stigmer account.
message CreateConnectLinkInput {
  // Organization the vault belongs to, by slug or id.
  string org = 1 [(buf.validate.field).string.min_len = 1];

  // The shared vault the login is saved into, by id. My vault is refused:
  // a link is for someone else.
  string vault_id = 2 [(buf.validate.field).string = {
    max_len: 30
    pattern: "^vlt_[0-9a-z]{26}$"
  }];

  // The address the customer signs in to: a tool's URL or a Git host.
  string address = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];

  // Where the customer is sent once the sign-in is over: an absolute https
  // URL (http only for localhost, 127.0.0.1 or [::1]), with no user name or
  // password in it. Stigmer adds stigmer_connect=connected, or
  // stigmer_connect=error with a short reason.
  string return_url = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];

  // How long the link stays usable, in seconds: 60 to 86400 (a day).
  // Unset means 1800 (30 minutes).
  int32 expires_in_seconds = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 86400
  }];

  option (buf.validate.message).cel = {
    id: "create_connect_link.expires_in_seconds"
    message: "expires_in_seconds is 60 to 86400, or unset for 30 minutes"
    expression: "this.expires_in_seconds == 0 || this.expires_in_seconds >= 60"
  };
}

// A Connect link. It works once: the first sign-in saved through it spends
// it.
message ConnectLink {
  // The page to send the customer to. It carries the link's secret: send it
  // only to that customer.
  string url = 1;

  // When the link stops working.
  google.protobuf.Timestamp expires_at = 2;
}
