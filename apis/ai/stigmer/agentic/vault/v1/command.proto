syntax = "proto3";

package ai.stigmer.agentic.vault.v1;

import "ai/stigmer/agentic/vault/v1/api.proto";
import "ai/stigmer/agentic/vault/v1/io.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "ai/stigmer/commons/apiresource/rpc_service_options.proto";
import "ai/stigmer/commons/rpc/method_options.proto";

// VaultCommandController handles write operations for vaults.
//
// @internal
// No apply RPC by design: a secret never belongs in a manifest file. My vault
// has no create RPC: the first entry write that names it creates it.
service VaultCommandController {
  option (ai.stigmer.commons.apiresource.api_resource_kind) = vault;

  // Create a shared vault in an organization.
  //
  // The vault belongs to the organization and starts empty. It starts
  // private, so only the organization's admins may use it until it is
  // shared, unless it is created with organization visibility
  // (metadata.visibility), which shares it with every member at once.
  //
  // A slug another vault of the organization holds is refused with
  // ALREADY_EXISTS. A slug another vault was renamed away from, which still
  // leads to it for 30 days, is refused with ALREADY_EXISTS carrying a
  // google.rpc.ErrorInfo detail (domain "stigmer.ai"):
  //
  //   - SLUG_RESERVED — another vault held the slug until a recent rename, and
  //     it still leads there. Metadata: slug.
  //
  // @internal
  // Authorization: can_create_shared_vault on the organization (admins).
  // The server stamps spec.owner with the organization's id; a request that
  // names a person is refused.
  rpc create(Vault) returns (Vault) {
    option (ai.stigmer.commons.rpc.config).resource_kind = organization;
    option (ai.stigmer.commons.rpc.config).permission = can_create_shared_vault;
    option (ai.stigmer.commons.rpc.config).field_path = "metadata.org";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to create a shared vault in this organization";
  }

  // Update a vault: the fields update_mask names change, every other
  // field keeps its stored value.
  //
  // Its name, description and external id may change. Entries are kept as
  // stored: change them with setSecrets, removeSecrets, setConnection and
  // removeConnections.
  //
  // resource.metadata.id names the vault; apply finds one by slug. The slug
  // changes only through rename, and a mask naming a field another door
  // owns, or a path the vault does not have, is refused with
  // INVALID_ARGUMENT naming the path.
  //
  // An update is refused with ABORTED carrying a google.rpc.ErrorInfo detail
  // (domain "stigmer.ai"):
  //
  //   - ETAG_MISMATCH — resource.metadata.etag is set and the vault changed
  //     since that etag was read: read it again and make the change again.
  //     No metadata.
  //   - WRITE_CONFLICT — the vault kept changing while the update was
  //     being saved: try again. No metadata.
  //
  // @internal
  // Authorization: can_edit on the vault (My vault's person, or an admin of
  // a shared vault's organization).
  rpc update(UpdateVaultInput) returns (Vault) {
    option (ai.stigmer.commons.rpc.config).resource_kind = vault;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "resource.metadata.id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update vault";
  }

  // Update the visibility of a shared vault.
  //
  // Setting org lets every member of the organization use the vault in
  // their runs. My vault is always private.
  //
  // @internal
  // Authorization: can_manage_audience on the vault (admins of a shared
  // vault's organization). The kind supports org visibility only; My vault
  // refuses every visibility change.
  rpc updateVisibility(ai.stigmer.commons.apiresource.UpdateVisibilityInput) returns (Vault) {
    option (ai.stigmer.commons.rpc.config).resource_kind = vault;
    option (ai.stigmer.commons.rpc.config).permission = can_manage_audience;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to update vault visibility";
  }

  // Rename a vault: change its slug, the name people type.
  //
  // The vault keeps its id, so everything that names it keeps working, and
  // every answer names it by the new slug. The old slug keeps leading to the
  // vault for reading for 30 days, during which no other vault of the
  // organization can take it and this one can take it back; then it is
  // released. A write that names the old slug is refused with SLUG_RENAMED (see
  // update). A slug another vault holds is refused with ALREADY_EXISTS, and one
  // another vault was recently renamed away from with SLUG_RESERVED (see
  // create).
  //
  // My vault is named after its person and is never renamed: renaming it is
  // refused with INVALID_ARGUMENT, and so is a slug that starts with my-vault,
  // as on create.
  //
  // @internal
  // Authorization: Requires can_delete permission on the vault: whoever may
  // delete it may rename it.
  rpc rename(ai.stigmer.commons.apiresource.RenameInput) returns (Vault) {
    option (ai.stigmer.commons.rpc.config).resource_kind = vault;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to rename vault";
  }

  // Delete a vault and every value it holds.
  //
  // Sessions, routines, channels and embedding settings that name
  // the vault are refused at their next run, naming it.
  //
  // @internal
  // Authorization: can_delete on the vault. The delete chain destroys the
  // sealed values.
  rpc delete(ai.stigmer.commons.apiresource.ApiResourceDeleteInput) returns (Vault) {
    option (ai.stigmer.commons.rpc.config).resource_kind = vault;
    option (ai.stigmer.commons.rpc.config).permission = can_delete;
    option (ai.stigmer.commons.rpc.config).field_path = "resource_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to delete vault";
  }

  // Save secrets in a vault, replacing any saved under the same names.
  //
  // Naming the caller's own My vault creates it on its first write.
  //
  // @internal
  // Authorization in the handler, because the target is a oneof the
  // annotation cannot express: can_edit on a vault named by id;
  // can_create_vault on the organization when My vault does not exist yet.
  rpc setSecrets(SetVaultSecretsInput) returns (Vault) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Remove secrets from a vault by name.
  //
  // @internal
  // Authorization in the handler, as setSecrets.
  rpc removeSecrets(RemoveVaultSecretsInput) returns (Vault) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Save a login in a vault at the address of the tool or Git host it is
  // for, replacing any saved at the same address.
  //
  // Naming the caller's own My vault creates it on its first write.
  //
  // @internal
  // Authorization in the handler, as setSecrets.
  rpc setConnection(SetVaultConnectionInput) returns (Vault) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Remove logins from a vault by address.
  //
  // @internal
  // Authorization in the handler, as setSecrets.
  rpc removeConnections(RemoveVaultConnectionsInput) returns (Vault) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Start a sign-in at an address, to save the login in a vault.
  //
  // Answers the login page to send the person to. When they have signed in,
  // the login page sends them back to the console's callback page, which
  // hands its answer to Stigmer (handBackSignIn); the app that started the
  // sign-in then finishes it with completeSignIn, asking with no code until
  // the answer is there. A page of the app's own that receives the code (the
  // desktop app's) finishes with completeSignIn and the code instead. The
  // sign-in must be completed within ten minutes.
  //
  // The login fills every HTTP tool whose URL is the address, and a Git
  // host's login serves clones from that host.
  //
  // @internal
  // Authorization in the handler, as setConnection: can_edit on a vault
  // named by id; can_create_vault on the organization for My vault. Asked
  // again at completion. Every request to a login server goes through the
  // server's egress guard.
  rpc startSignIn(StartSignInInput) returns (StartSignInOutput) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Finish a sign-in: exchange the code the login page handed back and save
  // the login in the vault the sign-in was started for, replacing any login
  // saved at the address.
  //
  // With no code, it finishes with the answer the callback page handed back
  // (handBackSignIn). Until that answer arrives it answers pending and
  // changes nothing, so the app that started the sign-in asks again; a
  // refusal from the login page fails the sign-in with the login page's
  // words. With a code, it finishes with that code; a sign-in whose answer
  // was already handed back is refused, since a sign-in has one answer.
  //
  // Only the person who started the sign-in may finish it.
  //
  // A sign-in that is unknown, expired or already finished is refused with
  // FAILED_PRECONDITION carrying a google.rpc.ErrorInfo detail (domain
  // "stigmer.ai"):
  //
  //   - SIGN_IN_ENDED — the sign-in is over: start it again. Asked right
  //     after an ask that failed, it means that ask took the sign-in, so the
  //     earlier failure is the sign-in's outcome. No metadata.
  //
  // @internal
  // Authorization in the handler: the caller must be the signer the pending
  // state recorded, checked before anything else happens to the state, so
  // a caller holding someone else's state cannot spend it. While pending,
  // an ask costs one read and that check, and no call to the authorizer.
  // Once there is something to exchange, the vault rule of startSignIn is
  // asked again before the state is taken and the code exchanged. A
  // sign-in started by a Connect link is refused here
  // (ConnectLinkController.completeConnectLink finishes it).
  rpc completeSignIn(CompleteSignInInput) returns (CompleteSignInOutput) {
    option (ai.stigmer.commons.rpc.is_skip_authorization) = true;
  }

  // Hand back what the login page answered a sign-in: its code, or its
  // refusal. The page the login page returns to calls it, whoever that
  // person is signed in as, or with no session at all; the app that started
  // the sign-in then finishes it (completeSignIn with no code).
  //
  // Answers who the sign-in is with and its address, for the page to say
  // where the person signed in. An unknown, expired or already answered
  // sign-in is refused with FAILED_PRECONDITION, the same for each, carrying
  // the ErrorInfo reason SIGN_IN_ENDED (as completeSignIn); a sign-in started
  // by a Connect link is refused too, with no reason, since it finishes on
  // the link's own page.
  //
  // @internal
  // Public: the state, 256 random bits only the person's browser saw, is
  // the authority, as a Connect link's secret is for its page. It reads no
  // credential and exchanges nothing: it records the answer on the pending
  // sign-in (the code sealed at rest, as the sign-in's other secrets are),
  // once. Who may save into the vault is still settled by completeSignIn,
  // under the signer's own session.
  rpc handBackSignIn(HandBackSignInInput) returns (HandBackSignInOutput) {
    option (ai.stigmer.commons.rpc.is_public) = true;
  }

  // Make a Connect link: a one-time page where someone without a Stigmer
  // account signs in at an address, and the login is saved into a shared
  // vault.
  //
  // An integrator makes one for each customer's vault and sends the
  // customer to its url. The customer sees one Stigmer page with a
  // Continue button, then the login page, then returns to return_url.
  //
  // Refused for My vault, and for an address the organization has no
  // approved login app of its own for: a link signs in only through the
  // organization's app (its name on the vendor's consent page), never
  // through Stigmer's own apps or Stigmer's client at a login server.
  //
  // @internal
  // Authorization: can_edit on the vault, asked again when the link is
  // opened and when it completes. Only the link's SHA-256 is stored.
  rpc createConnectLink(CreateConnectLinkInput) returns (ConnectLink) {
    option (ai.stigmer.commons.rpc.config).resource_kind = vault;
    option (ai.stigmer.commons.rpc.config).permission = can_edit;
    option (ai.stigmer.commons.rpc.config).field_path = "vault_id";
    option (ai.stigmer.commons.rpc.config).error_msg = "unauthorized to make a Connect link for this vault";
  }
}
