syntax = "proto3";

package ai.stigmer.agentic.evalrun.v1;

import "ai/stigmer/agentic/session/v1/enum.proto";
import "ai/stigmer/commons/apiresource/field_options.proto";
import "ai/stigmer/commons/apiresource/io.proto";
import "buf/validate/validate.proto";

// EvalRunSpec says what an eval run is about, whose cases run, on which
// models, how many times, and within what spend.
//
// @internal
// Immutable after create: an eval run is one run of the cases, and a
// different setting is a new eval run. The cases and their graders are
// read from each case source's archive at the version the eval run
// stamped, never copied here, so criteria live with the cases.
message EvalRunSpec {
  option (buf.validate.message).cel = {
    id: "eval_run.agent_version_needs_agent"
    message: "agent_version names a version of the agent: set agent_id"
    expression: "this.agent_version == '' || this.agent_id != ''"
  };
  option (buf.validate.message).cel = {
    id: "eval_run.plugin_digest_needs_plugin"
    message: "plugin_digest names a version of the plugin evaluated: set plugin_id"
    expression: "this.plugin_digest == '' || this.plugin_id != ''"
  };
  option (buf.validate.message).cel = {
    id: "eval_run.compared_plugin_needs_agent"
    message: "compared_plugin_id compares a plugin on an agent: set agent_id, or name the plugin as plugin_id to evaluate it on the built-in assistant"
    expression: "this.compared_plugin_id == '' || this.agent_id != ''"
  };
  option (buf.validate.message).cel = {
    id: "eval_run.cases_need_agent"
    message: "cases chooses whose cases run on an agent: an eval run of a plugin runs that plugin's own cases"
    expression: "size(this.cases) == 0 || this.agent_id != ''"
  };

  // What the eval run is about: an agent, or a plugin run on the built-in
  // assistant. Exactly one is required.
  //
  // @internal
  // The authorization parent: the eval run's access is its subject's. Each
  // member is an optional parent of the kind (api_resource_kind.proto), and
  // the oneof keeps exactly one of them written, as a vault's owner does.
  oneof subject {
    option (buf.validate.oneof).required = true;

    // ID of the agent the cases run on.
    string agent_id = 1 [(buf.validate.field).string.max_len = 128];

    // ID of a plugin whose own cases run on the built-in assistant, with
    // the plugin and, unless ablation is none, without it.
    string plugin_id = 2 [(buf.validate.field).string.max_len = 128];
  }

  // The agent version to evaluate, a version hash or a tag. Empty
  // evaluates the current version. Only with agent_id.
  //
  // @internal
  // Create resolves a tag and stamps the version's hash in
  // status.agent_version_hash, so the eval run names the exact version
  // every try ran even after the agent is saved again.
  string agent_version = 3 [(buf.validate.field).string.max_len = 128];

  // The version (archive digest) of the plugin evaluated. Empty evaluates
  // its current version. Only with plugin_id.
  //
  // @internal
  // Create stamps the current digest when empty, and refuses any other:
  // the with arm runs the plugin as installed now.
  string plugin_digest = 4 [(buf.validate.field).string.pattern = "^$|^[a-f0-9]{64}$"];

  // ID of a plugin each case runs with and, unless ablation is none,
  // without, on the agent: whether the agent does better with it. The
  // agent may attach it or not. Only with agent_id.
  //
  // @internal
  // The without arm's tries exclude it from the whole turn (the agent's
  // plugins, the conversation's and every subagent's) through the run's
  // server-composed excluded_plugin_ids.
  string compared_plugin_id = 5 [(buf.validate.field).string.max_len = 128];

  // Whose cases run, on an agent: each a plugin the agent attaches or the
  // compared plugin. Empty runs the compared plugin's cases when one is
  // named, else the cases of every plugin the agent attaches. Only with
  // agent_id; an eval run of a plugin runs that plugin's own cases.
  repeated EvalRunCaseSource cases = 6 [(buf.validate.field).repeated.max_items = 64];

  // The engines and models each case runs on, at most six. Empty runs each
  // case on the agent as it runs (its own engine, model and settings), or,
  // on the built-in assistant, on the model the case names or the
  // platform's default model.
  repeated EvalRunTarget targets = 7 [(buf.validate.field).repeated.max_items = 6];

  // Tries per case, arm and target, from 1 to 50. Zero uses each case's
  // own runs value, or 3.
  int32 runs = 8 [(buf.validate.field).int32 = {
    gte: 0
    lte: 50
  }];

  // Whether each case also runs without the compared plugin. Ignored when
  // no plugin is compared: an agent's own cases run with what it
  // attaches.
  EvalRunAblation ablation = 9 [(buf.validate.field).enum.defined_only = true];

  // The score a case needs to pass, from 0 to 1, or 1 when unset: every
  // scored check passes on every try.
  optional double threshold = 10 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];

  // Runs only the cases whose directory name matches this glob, as in
  // "review-*". Empty runs every case.
  string case_glob = 11 [(buf.validate.field).string.max_len = 256];

  // Runs only the cases carrying at least one of these tags. Empty runs
  // every case.
  //
  // @internal
  // Not named tags: every SDK generator reads a top-level spec field
  // named tags as resource metadata and drops it.
  repeated string case_tags = 12 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];

  // The model AI-graded checks use. Empty uses the platform's default
  // judge model.
  string judge_model = 13 [(buf.validate.field).string.max_len = 128];

  // The most this eval run may spend, in estimated US dollars of model
  // cost.
  //
  // Checked before each try starts, counting what tries already spent and
  // the cap each running try still holds: tries already running and their
  // AI-graded checks finish, so the spend can pass the limit by those.
  double max_cost_usd = 14 [(buf.validate.field).double = {
    gt: 0
    lte: 1000
    finite: true
  }];

  // Tries running at once, from 1 to 8. Zero means 1.
  int32 concurrency = 15 [(buf.validate.field).int32 = {
    gte: 0
    lte: 8
  }];

  // Tools every try may use beyond each case's own list, in Claude Code's
  // names, as Claude Code's --allow-tools.
  //
  // A try runs with only the tools its case and this list grant, within
  // the agent's own tool lists: name the agent's working tools here (Skill
  // for its skills, Agent for its hand-offs to subagents). A specifier in
  // parentheses, as in Bash(npm test *), grants the whole tool. A plugin's
  // MCP tools are named as Claude Code names them,
  // mcp__plugin_<plugin>_<server>__<tool>; the tools of a server written in
  // the agent itself are mcp__<server>__<tool>.
  //
  // @internal
  // Stored as written; create refuses an entry naming a server no try
  // loads, since it could never grant anything.
  repeated string allow_tools = 16 [(buf.validate.field).repeated = {
    max_items: 64
    items: {
      string: {
        max_len: 256
        pattern: "^(mcp__\\*|mcp__plugin_[A-Za-z0-9.-]+_[A-Za-z0-9_.-]+?(__(\\*|[A-Za-z0-9_.-]+))?|mcp__[a-z][a-z0-9-]*[a-z0-9](__(\\*|[A-Za-z0-9_.-]+))?|[A-Z][A-Za-z0-9_]*(\\([^()\\r\\n]+\\))?)$"
      }
    }
  }];

  // Runs the MCP servers for real, the agent's own and its plugins', with
  // the organization's connections. Off by default: a try cannot call MCP
  // tools no mock answers, as in Claude Code's evals without mocks.
  bool real_mcp_servers = 17;

  // Vaults whose logins and secrets the tries use, in order: the first
  // vault holding a match wins. At most 20.
  //
  // A try has no person, so these vaults are all its hooks and servers
  // use. Each is a shared vault: a My vault, the creator's included, is
  // refused, because every viewer of the subject may read a try, and a
  // hook's or server's output can show what a key unlocked.
  //
  // @internal
  // The schedule's rule: the credential resolver finds the eval run from
  // the run's stigmer.ai/eval-run label and asks can_use again of the
  // account recorded in status.vault_attachers.
  repeated ai.stigmer.commons.apiresource.ApiResourceReference vaults = 18 [
    (ai.stigmer.commons.apiresource.reference_kind) = vault,
    (buf.validate.field).repeated.max_items = 20
  ];

  // Skips each case's scaffold script, as Claude Code's --no-scaffold; a
  // case that has one is then listed as not run.
  //
  // A scaffold runs in the try's own sandbox, as the agent, with none of
  // the eval run's vaults, so no opt-in is asked for it.
  bool skip_scaffold = 19;

  // Starts the real MCP servers no mock answers, as Claude Code's
  // --allow-real-servers; mocked tools still answer from their files.
  // Their tools still need allow_tools.
  //
  // @internal
  // Create refuses it with real_mcp_servers, which ignores mocks entirely
  // (Claude Code's --mocks off): the format pairs this flag with mocks on.
  bool allow_real_servers = 20;
}

// EvalRunCaseSource is where an eval run's cases come from.
message EvalRunCaseSource {
  // The source. Exactly one is required.
  oneof source {
    option (buf.validate.oneof).required = true;

    // A plugin whose evals/ folder holds the cases: one the agent attaches,
    // or the compared plugin.
    ai.stigmer.commons.apiresource.ApiResourceReference plugin = 1 [(ai.stigmer.commons.apiresource.reference_kind) = plugin];
  }
}

// EvalRunTarget is one engine and model a case runs on.
message EvalRunTarget {
  // The engine. Unspecified is the native engine.
  ai.stigmer.agentic.session.v1.Harness harness = 1 [(buf.validate.field).enum.defined_only = true];

  // A model id from the model catalog for that engine, as in
  // "claude-sonnet-4-6". Empty uses the engine's default model.
  string model_name = 2 [(buf.validate.field).string.max_len = 128];
}

// EvalRunAblation says whether a case also runs without the compared
// plugin.
enum EvalRunAblation {
  // Runs with and without the compared plugin (the default).
  eval_run_ablation_unspecified = 0;

  // Runs with and without the compared plugin.
  eval_run_ablation_with_without = 1;

  // Runs with the compared plugin only; no comparison is made.
  eval_run_ablation_none = 2;
}
