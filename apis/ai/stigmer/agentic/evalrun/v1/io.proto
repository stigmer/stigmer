syntax = "proto3";

package ai.stigmer.agentic.evalrun.v1;

import "ai/stigmer/agentic/evalrun/v1/api.proto";
import "buf/validate/validate.proto";

// EvalRunId wraps an eval run identifier.
message EvalRunId {
  // Unique identifier of the eval run.
  string value = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];
}

// ListEvalRunsByAgentRequest names the agent whose eval runs to list.
message ListEvalRunsByAgentRequest {
  // ID of the agent.
  string agent_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];

  // Only resources carrying every label given, each matched exactly (AND).
  // A selective filter may answer short pages, even empty ones, that still
  // carry a token.
  map<string, string> labels = 4;
}

// ListEvalRunsByPluginRequest names the plugin whose eval runs to list:
// the eval runs about that plugin, on the built-in assistant.
message ListEvalRunsByPluginRequest {
  // ID of the plugin.
  string plugin_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];

  // The most entries to return: 0 asks for the default page of 50, and a
  // size above 100 is read as 100.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // The previous response's next_page_token, to continue that list; every
  // other field must equal that request's, or the call is refused.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];

  // Only resources carrying every label given, each matched exactly (AND).
  // A selective filter may answer short pages, even empty ones, that still
  // carry a token.
  map<string, string> labels = 4;
}

// EvalRunList is a list of eval runs.
message EvalRunList {
  // The eval runs, newest first.
  repeated EvalRun entries = 1;

  // Set when more entries may follow: pass it as page_token to continue.
  // A page may be short, even empty, and still carry a token.
  string next_page_token = 2;
}
