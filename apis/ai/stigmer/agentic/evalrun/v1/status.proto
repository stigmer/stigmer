syntax = "proto3";

package ai.stigmer.agentic.evalrun.v1;

import "ai/stigmer/agentic/evalrun/v1/spec.proto";
import "ai/stigmer/commons/apiresource/status.proto";
import "google/protobuf/timestamp.proto";

// EvalRunStatus holds an eval run's progress and results: per plugin, per
// case, per target and per arm, the score, the difference the compared
// plugin makes, and every try with its run.
//
// @internal
// Written only by the eval run's workflow, one write at a time (the parent
// workflow is the single writer; each case run reports to it), so no two
// writers race on the row. Create starts it pending with every plugin
// stamped. The case, target, arm and aggregate shapes mirror Claude Code's
// plugin-eval result file, whose field names the CLI's --json output
// keeps.
message EvalRunStatus {
  // Where the eval run is.
  EvalRunPhase phase = 1;

  // Why a partial eval run stopped early; unspecified otherwise.
  EvalRunPartialReason partial_reason = 2;

  // One sentence naming what failed when the phase is failed, as in "the
  // plugins' evals could not be read"; empty otherwise.
  string error = 3;

  // The agent version every try ran, as a version hash; empty on an eval
  // run of a plugin, whose tries run the built-in assistant.
  string agent_version_hash = 4;

  // Every plugin a try loads: the plugins the agent version attaches, in
  // the agent's order, then the compared plugin when the agent does not
  // attach it; on an eval run of a plugin, that plugin alone. Each holds
  // the version every try runs and its cases' results.
  repeated EvalRunPlugin plugins = 5;

  // The totals over every case that ran, a plugin's or an Eval's.
  EvalRunAggregates aggregates = 6;

  // Estimated model cost so far of every try and every AI-graded check,
  // in US dollars.
  double cost_usd = 7;

  // Tries the eval run plans in all, and tries finished.
  int32 tries_total = 8;
  int32 tries_finished = 9;

  // When the eval run started running and when it finished.
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;

  // Who attached each of this eval run's vaults, by vault id: the account
  // whose permission to use the vault each try checks, since a try has no
  // person.
  //
  // @internal
  // Server-owned, written at create (the routine's reference rule).
  map<string, string> vault_attachers = 12;

  // Every Eval whose cases run, in the order the spec names them: the
  // version every try runs and its cases' results. A try loads no Eval;
  // it runs the Eval's cases on the agent.
  repeated EvalRunEval evals = 13;

  // Standard audit information (created_at, updated_at, created_by, etc.)
  ai.stigmer.commons.apiresource.ApiResourceAudit audit = 99;
}

// EvalRunPlugin is one plugin a try loads, as the eval run ran it.
message EvalRunPlugin {
  // The plugin's ID and slug.
  string plugin_id = 1;
  string plugin_slug = 2;

  // The plugin version (archive digest) every try runs: the version the
  // agent's reference names, or the one installed when the eval run was
  // created.
  string plugin_digest = 3;

  // Whether the agent attaches the plugin; false for a compared plugin
  // the agent does not attach, and on an eval run of a plugin.
  bool attached = 4;

  // Whether this is the plugin each case runs with and without: the
  // compared plugin, or the plugin of an eval run of a plugin.
  bool compared = 5;

  // Why none of this plugin's cases run, as in "no eval cases at this
  // version" or "not selected"; empty when its cases run.
  string not_run_reason = 6;

  // The plugin's cases, in directory order, each with its results.
  repeated EvalRunCase cases = 7;

  // This plugin's totals.
  EvalRunAggregates aggregates = 8;
}

// EvalRunEval is one Eval whose cases an eval run runs, as it ran them.
message EvalRunEval {
  // The Eval's ID and slug.
  string eval_id = 1;
  string eval_slug = 2;

  // The Eval version (archive digest) every try runs: the one the case
  // source named, or the current one when the eval run was created.
  string eval_digest = 3;

  // Why none of the Eval's cases run, as in "no eval cases at this
  // version"; empty when its cases run.
  string not_run_reason = 4;

  // The Eval's cases, in directory order, each with its results.
  repeated EvalRunCase cases = 5;

  // This Eval's totals.
  EvalRunAggregates aggregates = 6;
}

// EvalRunPhase is where an eval run is.
enum EvalRunPhase {
  eval_run_phase_unspecified = 0;

  // Created; the suite has not started.
  eval_run_phase_pending = 1;

  // Tries are running.
  eval_run_phase_running = 2;

  // Every planned try finished.
  eval_run_phase_completed = 3;

  // The eval run stopped before every try ran; partial_reason says why. The
  // results cover the tries that ran.
  eval_run_phase_partial = 4;

  // The eval run could not run at all; error says why.
  eval_run_phase_failed = 5;
}

// EvalRunPartialReason is why an eval run stopped early.
enum EvalRunPartialReason {
  eval_run_partial_reason_unspecified = 0;

  // The eval run's spending limit was reached.
  eval_run_partial_reason_cost_ceiling = 1;

  // Someone cancelled the eval run.
  eval_run_partial_reason_cancelled = 2;
}

// EvalRunCase is one case of the suite and its results.
message EvalRunCase {
  // The case's name, from its case.yaml or its directory.
  string case_name = 1;

  // The case's directory, relative to the plugin's root, as in
  // "evals/review-fires", or to the Eval's, as in "review-fires".
  string path = 2;

  // The case's tags.
  repeated string case_tags = 3;

  // Why the case is not run, as in "not run: plugins" for a feature
  // Stigmer does not run yet, or "not run: scaffold skipped"; empty when
  // the case runs.
  //
  // @internal
  // A case is never run degraded: one that needs an unsupported feature is
  // listed here instead of being scored without it.
  string not_run_reason = 4;

  // Results per target, in the eval run's target order.
  repeated EvalRunCaseTarget targets = 5;

  // Notes about how the case was run, as in "max_turns 4 raised to the
  // run's minimum of 10 tool rounds".
  repeated string notes = 6;

  // The MCP servers the case answers with mocks, and those it leaves
  // unstarted, as Claude Code's mocked: line: a plugin's servers for a
  // plugin's case; the agent's and its plugins' servers for an Eval's.
  repeated EvalRunMockedServer mocked_servers = 7;
}

// EvalRunMockedServer is one MCP server as a case's tries see it.
message EvalRunMockedServer {
  // The server's name in the run, as in "plugin_tracker_issues" or an
  // agent's own "billing".
  string name = 1;

  // The tools its mocks answer.
  repeated string tools = 2;

  // Why the server is not started, as in "not started: no mock", or why
  // its mocks answer nothing, as in "no such server on the agent"; empty
  // when its mocks answer.
  string not_started_reason = 3;
}

// EvalRunCaseTarget is one case's results on one target.
message EvalRunCaseTarget {
  // The engine and model.
  EvalRunTarget target = 1;

  // Why this case did not run on this target, as in "not run: model
  // 'sonnet' is not in Stigmer's catalog"; empty when it ran.
  string not_run_reason = 2;

  // The tries with the compared plugin; when no plugin is compared, the
  // only tries, run with what the agent attaches.
  EvalRunArm with_plugin = 3;

  // The tries without the compared plugin; unset when the eval run makes no
  // comparison.
  EvalRunArm without_plugin = 4;

  // The with_plugin score minus the without_plugin score; unset when
  // either is missing.
  optional double delta = 5;

  // Whether the with_plugin score reached the threshold.
  bool passed = 6;

  // Whether every with_plugin try scored 1 (pass^k, k being the tries).
  bool pass_k = 7;
}

// EvalRunArm is one arm's tries and their summary.
message EvalRunArm {
  // The mean score of the graded tries; unset when none was graded.
  optional double score = 1;

  // Graded tries in which every scored check passed.
  int32 perfect_runs = 2;

  // Tries that produced a score.
  int32 graded_tries = 3;

  // Every try, in order.
  repeated EvalRunTry tries = 4;
}

// EvalRunTry is one try: one run in a fresh conversation.
message EvalRunTry {
  // The try's number in its arm, from 1.
  int32 index = 1;

  // The conversation and run of the try; empty until they exist.
  string session_id = 2;
  string run_id = 3;

  // Where the try is.
  EvalRunTryState state = 4;

  // The try's score from 0 to 1 when graded: the weighted share of its
  // scored checks that passed.
  double score = 5;

  // Why the try produced no score, as in "platform busy"; empty when
  // graded.
  //
  // @internal
  // A platform failure is never a zero: the try is left out of every mean
  // and named here. An agent failure (a timeout, a turn cap, a run error)
  // is graded on what the run produced, with error set.
  string not_graded_reason = 6;

  // The run's own failure, when it had one, as in "timed out after 300s".
  string error = 7;

  // The try's estimated model cost, AI-graded checks included, in US
  // dollars.
  double cost_usd = 8;

  // How long the try ran, in seconds.
  double duration_seconds = 9;

  // Set when a mock stopped the try: its input guard was violated, its
  // agent ended the run, or the agent mocks' call budget ran out. The try
  // scores 0 and error stays empty, as Claude Code reports it.
  EvalRunAbort aborted = 10;
}

// EvalRunAbort says which mock stopped a try, and why.
message EvalRunAbort {
  // The mocked server's key in the plugin's MCP configuration.
  string server = 1;

  // The tool whose call was stopped.
  string tool = 2;

  // Why, as in "input.priority must be one of low, medium, high".
  string reason = 3;
}

// EvalRunTryState is where a try is.
enum EvalRunTryState {
  eval_run_try_state_unspecified = 0;

  // Planned; not started.
  eval_run_try_state_pending = 1;

  // Its run is running or being graded.
  eval_run_try_state_running = 2;

  // Graded; score holds the result.
  eval_run_try_state_graded = 3;

  // Finished without a score; not_graded_reason says why.
  eval_run_try_state_not_graded = 4;
}

// EvalRunAggregates are the suite's totals, in Claude Code's names.
message EvalRunAggregates {
  // The mean with_plugin score over the cases that ran.
  double overall_score = 1;

  // Cases whose with_plugin score reached the threshold on every target.
  int32 cases_passed = 2;

  // Cases that ran.
  int32 cases_total = 3;

  // The mean difference the compared plugin made, over the cases with a
  // comparison; unset when none had one.
  optional double mean_delta = 4;

  // Cases listed but not run.
  int32 cases_not_run = 5;
}
