version: v2
plugins:
  - remote: buf.build/bufbuild/es:v2.2.2
    out: stubs/ts
    opt:
      - target=ts
      - import_extension=js
    include_imports: true
  - remote: buf.build/connectrpc/es:v1.6.1
    out: stubs/ts
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: .
  # google.rpc error-detail types (ErrorInfo & co) for the SDK's typed
  # reading of structured refusals (grpc-status-details-bin). Nothing in
  # our protos imports these — details ride error trailers, not messages —
  # so buf would never generate them from the main input; they need their
  # own, paths-filtered input.
  - module: buf.build/googleapis/googleapis
    paths:
      - google/rpc/error_details.proto
  # grpc.health.v1 for the MCP bridge's /ready probe: a native-gRPC
  # Health/Check against stigmer-server is the one backend RPC both
  # editions serve credential-free (the Go server sets it SERVING before
  # its listener opens; the cloud Java interceptors exempt it by name).
  # Same paths-filtered pattern as google/rpc above — nothing in our
  # protos imports it.
  - module: buf.build/grpc/grpc
    paths:
      - grpc/health/v1/health.proto
