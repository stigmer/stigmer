version: v2
managed:
  enabled: true
  disable:
    - file_option: java_package
  override:
    - file_option: java_multiple_files
      value: true
    - file_option: optimize_for
      value: SPEED
plugins:
  - remote: buf.build/protocolbuffers/java:v34.0
    out: stubs/java/src/main/java
  - remote: buf.build/grpc/java:v1.79.0
    out: stubs/java/src/main/java
inputs:
  - directory: .
