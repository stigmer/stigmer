# Lychee link checker configuration
# https://lychee.cli.rs/usage/config/

# Vendor dashboard / console URLs always redirect to a login page (HTTP 302).
# They are "open your admin panel" links in how-to guides — not broken.
# localhost URLs reference the local dev server and are unreachable in CI.
exclude = [
  "https://manage\\.auth0\\.com/",
  "https://developer\\.okta\\.com/login/",
  "https://portal\\.azure\\.com/",
  "https://console\\.aws\\.amazon\\.com/",
  "https://console\\.anthropic\\.com/",
  "https://docs\\.aws\\.amazon\\.com/cognito/",
  "https://api\\.stigmer\\.ai",
  "http://localhost"
]

exclude_path = ["docs/_archive"]

fallback_extensions = ["mdx"]
no_progress = true
# No `scheme` restriction: validate internal/relative links (which have no URL
# scheme) in addition to http(s). Restricting to ["https","http"] silently skips
# every internal /docs/ and relative link, which let dangling links ship.
accept = ["100..=199", "200..=299", "403", "415"]
