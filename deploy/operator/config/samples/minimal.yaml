# The smallest Stigmer: the operator runs Postgres and Temporal, mints every
# key, and the shared runner reads its model key from the Secret named here.
#
#   kubectl create namespace stigmer
#   kubectl -n stigmer create secret generic anthropic --from-literal=ANTHROPIC_API_KEY=<your key>
#   kubectl apply -f minimal.yaml
#   kubectl -n stigmer get stigmer
apiVersion: stigmer.ai/v1
kind: Stigmer
metadata:
  name: stigmer
  namespace: stigmer
spec:
  owner:
    email: priya@acme.dev
  runner:
    llm:
      secretName: anthropic
