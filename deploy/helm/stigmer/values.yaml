# Values for the Stigmer chart. Every key carries its reason; a key without
# one does not belong here. The chart is docker-compose.yml translated, so
# where a value has a compose counterpart the comment names it, and a test
# (deploy/helm/stigmer/__tests__/parity.test.mjs) holds the rendered env of
# the server and the runner equal to the compose services', name for name.
#
# Unknown keys are refused at install (values.schema.json sets
# additionalProperties: false): a misspelled value fails loudly instead of
# silently doing nothing. Anything the chart does not model is set through
# `server.extraEnv` and `runner.extraEnv`.

# The release name is the endpoint: every Service is named from it, so a
# release named `stigmer` gives `stigmer`, `stigmer-postgres`,
# `stigmer-temporal`. Set this only to keep a Service name stable across a
# rename of the release.
fullnameOverride: ""

image:
  # One registry for both images; the compose stack pins the same two.
  registry: ghcr.io/stigmer
  server:
    repository: stigmer-server
    # The Stigmer Enterprise server image, run in place of `repository`
    # when enterprise.license.existingSecret is set: the same Dockerfile,
    # user, ports and health check over the Enterprise package, so only the
    # image changes. It takes the same `tag` below, so one tag names the
    # server's release whichever edition runs it. A mirror sets this beside
    # `repository`.
    enterpriseRepository: stigmer-server-ee
    # Empty means v<appVersion> — the release train bumps Chart.yaml and the
    # images together (the fourth release pin). Set only to run a different
    # released version, as compose's STIGMER_VERSION does.
    tag: ""
  runner:
    # The compose-runner stage of Dockerfile.sandbox: the runner with the
    # CLI baked in (it spawns `stigmer mcp-server` for memory and channel
    # attachments). Not ghcr.io/stigmer/runner, a different image built for
    # sandboxed execution.
    repository: stigmer-runner
    tag: ""
  # For the two Stigmer images. IfNotPresent: the tags are immutable release
  # versions, never latest. (The bundled postgres and temporal images are
  # exact third-party tags and always IfNotPresent.)
  pullPolicy: IfNotPresent
  # Names of imagePullSecrets in the release namespace; the public images
  # need none.
  pullSecrets: []

secrets:
  # REQUIRED. The name of a Secret in the release namespace carrying
  # STIGMER_ENCRYPTION_KEY and STIGMER_RUNNER_TOKEN_KEY (base64-encoded 32
  # bytes each), plus POSTGRES_PASSWORD when Postgres is bundled. The chart
  # refuses to render without it, as `docker compose up` refuses without
  # .env (explicit keys, loud fail: the server would otherwise
  # auto-generate keys into its volume, making the backup and rotation story
  # invisible exactly where a self-hoster needs it explicit). Never inline:
  # a values file gets committed; a key in it is .env in git.
  #
  # The Secret MAY also carry STIGMER_PLATFORM_TOKEN_KEY (Base64 of a PKCS#8
  # RSA private key), which signs the 15-minute user tokens a service
  # account's API key mints when authentication is on. It is optional where the two above are
  # not: losing it costs at most one token lifetime, so it has no backup
  # story, and the server generates one on its claim when it is absent.
  #
  #   kubectl create secret generic stigmer-secrets \
  #     --from-literal=STIGMER_ENCRYPTION_KEY=$(openssl rand -base64 32) \
  #     --from-literal=STIGMER_RUNNER_TOKEN_KEY=$(openssl rand -base64 32) \
  #     --from-literal=POSTGRES_PASSWORD=$(openssl rand -hex 24)
  existingSecret: ""

server:
  # The address browsers and the CLI reach the API on; feeds
  # SKILL_TRANSFER_BASE_URL (skill push and download capability URLs are
  # consumed by the CLI and SDKs, never in-cluster) and the runner's
  # STIGMER_MCP_PUBLIC_ENDPOINT (the address remote MCP servers are given
  # to dial back); the server also derives the console's MCP OAuth callback
  # from SKILL_TRANSFER_BASE_URL, so Sign in returns here. Empty derives it:
  # the Ingress API host when ingress.enabled, else http://localhost:7234,
  # the port-forward posture and compose's own default.
  publicUrl: ""
  # The same for artifact download URLs (ARTIFACT_LOCAL_SERVE_URL): the
  # Ingress artifacts host, else http://localhost:7235.
  artifactPublicUrl: ""
  # With server.oidc.issuer empty every caller has full control, so the
  # chart refuses an install meant to be reached from outside the cluster
  # (an Ingress, a NodePort or LoadBalancer Service, or a public URL whose
  # host is not localhost, 127.0.0.1 or [::1]) until sign-in is on. Set this
  # only when something of yours authenticates every caller first (a proxy
  # in front, a private network): it says the exposure is on purpose, it
  # does not make it safe, and the install notes repeat that.
  allowUnauthenticatedExposure: false
  operator:
    # Optional operator identity for audit attribution
    # (STIGMER_OPERATOR_EMAIL / STIGMER_OPERATOR_NAME; compose passes the
    # same two). The server refuses a name without an email at boot.
    email: ""
    name: ""
  oidc:
    # Authentication is on when the issuer is set (STIGMER_OIDC_ISSUER):
    # the server then refuses tokenless callers except the health service
    # and is_public methods. Issuer and audience go together; the chart
    # refuses one without the other before the server would at boot. An
    # https URL: discovery and the signing keys are fetched from it, and a
    # plaintext issuer would let the network vouch for every token.
    issuer: ""
    audience: ""
    # The public PKCE client the served console signs in with
    # (STIGMER_OIDC_CONSOLE_CLIENT_ID). A public identifier, never a
    # secret. Empty means the console cannot sign in; the server warns.
    consoleClientId: ""
  # Requests sized for one team; raise them with your load. Memory is
  # limited so a leak is a restart, not a node; CPU is requested, not
  # limited, so a burst (a search-index rebuild at boot on an adopted
  # database) is not throttled.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
  persistence:
    # The server's /data (HOME): the skill content store, the key files
    # if any, everything under ~/.stigmer except artifacts. Compose's
    # server-data volume. Kept on uninstall.
    size: 5Gi
    # Empty means the cluster default. ReadWriteOnce.
    storageClass: ""
  # The server image runs as `node`; Kubernetes needs the NUMBER to verify
  # runAsNonRoot (uid 1000, the Dockerfile's). fsGroup 1000 on the pod
  # makes fresh claims writable by it.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  # Verbatim EnvVar entries appended to the server container. The chart
  # models what compose sets; the server's wider surface (LOG_LEVEL, the
  # OTel endpoint, STIGMER_OAUTH_REDIRECT_URI, PGSSLMODE, …) goes here. A
  # name the chart sets itself (DATABASE_URL among them) is refused here:
  # Kubernetes keeps the last entry of a name, so a repeat would silently
  # replace the chart's value. The parity
  # test runs with this empty, so it cannot hide a contract drift.
  extraEnv: []

runner:
  llm:
    # Optional: the name of a Secret carrying ANTHROPIC_API_KEY. Read by an
    # explicit reference marked optional, never envFrom (which would inject
    # a Secret's every key). Agents need the key.
    existingSecret: ""
  stigmerToken:
    # With server.oidc.issuer set, the API key the runner calls the server
    # with (STIGMER_TOKEN). It is the runner's own credential; each run it
    # serves is attributed to the member who started it, not to the key's
    # holder. Only someone signed in can create a key, so the install that
    # sets the issuer runs without the runner: sign in, create the key
    # (`stigmer apikey create --name runner --never-expires`), put it in a
    # Secret and upgrade with its name here, and the runner starts. A key
    # created before sign-in was turned on is refused once it is on.
    existingSecret: ""
    key: STIGMER_TOKEN
  # The runner calls the LLM, runs tools and installs packages at runtime;
  # its memory is the pod's biggest swing. Requested for one team, limited
  # so a runaway tool is a restart.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
  persistence:
    # The runner's /data (HOME): paused-session checkpoints, the HITL gate
    # dir, agent workspaces. Compose's runner-data volume: lifecycle state,
    # not backup state (the backup is Postgres + artifacts + server-data +
    # the Secret). Kept on uninstall anyway.
    size: 10Gi
    storageClass: ""
  # The runner runs as root and starts the agent's side (the engines, their
  # commands, MCP servers and hooks) as its own user, stigmer-agent (uid
  # 10001), so nothing an agent runs can read the runner's keys. Every
  # capability is dropped but the five that needs: SETUID and SETGID to
  # drop to that user, CHOWN to hand it its home and workspace, KILL to end
  # its host when it will not exit, DAC_OVERRIDE to write its own state on
  # volumes it shares with the server. The agent's side holds none of them.
  # Root is required, not a default to tighten: the image's start script
  # (/runner/bin/start) refuses to start the runner as any other user, so a
  # runAsUser or runAsNonRoot here stops the pod at once.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
      add: ["SETUID", "SETGID", "CHOWN", "KILL", "DAC_OVERRIDE"]
    seccompProfile:
      type: RuntimeDefault
  # As server.extraEnv: a name the chart sets itself is refused.
  extraEnv: []

artifacts:
  persistence:
    # The artifact root the server writes and the runner reads
    # (stigmer#285: filesystem sharing is the contract). Mounted at
    # /artifacts in BOTH containers, never nested under /data: a claim
    # starts empty and a mount nested inside it is created root-owned by
    # the runtime, which the non-root server cannot write. Compose's
    # `artifacts` volume. Kept on uninstall.
    size: 20Gi
    storageClass: ""

# How long a SIGTERM'd pod may drain. The runner finishes in-flight
# activities with no deadline of its own, so this is the only cap: 60 s
# costs at most a redone turn (Temporal retries from the checkpoint), while
# a drain as long as a whole session's turn (600 s) would stall every
# upgrade for ten minutes.
terminationGracePeriodSeconds: 60

waitForDependencies:
  # compose's `depends_on: condition: service_healthy`, translated. The
  # server throws at boot when Postgres is unreachable and the runner exits
  # when Temporal is; without this both crash-loop through Kubernetes'
  # growing backoff until the dependencies are up. The init container waits
  # for pg_isready and for a TCP connection to Temporal (whose Service has
  # no endpoints until the default namespace exists — the stigmer#904 gate).
  enabled: true
  # The postgres image the chart already ships, for pg_isready and bash.
  image: postgres:16.15
  # The init containers run as that image's postgres user (uid 999), with
  # nothing to escalate to; they only wait on two TCP addresses.
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

postgres:
  # Bundled Postgres: one instance, one claim, the compose stack's posture
  # (one Postgres instance, one backup story). Temporal's
  # auto-setup creates its two databases on it. Right for one team; for HA
  # or managed backups set enabled: false and fill externalDatabase.
  enabled: true
  # An exact minor release, never the floating `16`: the image compose runs,
  # and the parity test holds the two equal. A minor release is Postgres's
  # security fix, so moving this tag is how the bundled database is patched.
  image: postgres:16.15
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  # The image's own postgres user, by number (uid 999), from the first
  # process: the official entrypoint initializes and serves as whichever
  # user it starts as. The pod's fsGroup follows runAsGroup, so a fresh
  # claim is writable. A cluster that assigns its own UIDs (OpenShift)
  # overrides this whole object.
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  networkPolicy:
    # Admits connections to the bundled Postgres (5432) only from this
    # release's stigmer pod and Temporal pod. It holds everything Stigmer
    # keeps and authenticates by password alone, so without a fence every
    # pod in the cluster could try it. A backup job in a pod of its own
    # needs a NetworkPolicy of yours that admits it (policies add up). A
    # cluster whose network plugin ignores NetworkPolicy gets no fence.
    enabled: true

externalDatabase:
  # Used when postgres.enabled is false. The server's DATABASE_URL is
  # postgres://<user>@host:port; the database reaches it as PGDATABASE and
  # the password as PGPASSWORD from the Secret, so the password never
  # lands in rendered YAML and no character in either can break the URL.
  # Connection options node-postgres reads from the environment, such as
  # PGSSLMODE=require for a managed Postgres, go through server.extraEnv.
  # Bundled Temporal creates its own two databases on this instance and
  # needs CREATE DATABASE.
  host: ""
  port: 5432
  user: postgres
  database: stigmer
  # The Secret holding the password; empty means secrets.existingSecret.
  existingSecret: ""
  passwordKey: POSTGRES_PASSWORD

temporal:
  # Bundled Temporal: one temporalio/auto-setup pod, the compose stack's
  # choice ("a real Temporal server, NOT the CLI's dev-server"). Ready
  # only when the default namespace exists (stigmer#904). For production
  # Temporal, Temporal's own chart is the path; set enabled: false and
  # fill externalTemporal.
  enabled: true
  image: temporalio/auto-setup:1.28.0
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  # The image runs as its user named `temporal`; Kubernetes needs the
  # NUMBER to verify runAsNonRoot (uid 1000, read from the image).
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  networkPolicy:
    # Admits connections to the bundled Temporal's frontend (7233) only from
    # this release's stigmer pod and from Temporal itself. The bundled
    # Temporal authenticates nothing, so without a fence every pod in the
    # cluster could start work on the runner's queue. What it cannot fence:
    # the runner's own tools and stdio MCP servers, which run inside the
    # stigmer pod. A cluster whose network plugin ignores NetworkPolicy
    # gets no fence at all.
    enabled: true

externalTemporal:
  # Used when temporal.enabled is false. Address and namespace always
  # travel together: the address without the namespace is half a
  # coordinate.
  hostPort: ""
  namespace: default
  # How the server and the runner authenticate to that frontend. Both read
  # the same STIGMER_TEMPORAL_* settings, rendered from these values.
  tls:
    # TLS to the frontend; with only this set, its certificate is checked
    # against the system's trusted roots.
    enabled: false
    # SNI / host-name override, when the frontend's certificate names a
    # host other than hostPort's. Rendered with TLS on or an API key (which
    # implies TLS); refused when neither is.
    serverName: ""
    # A Secret holding the PEM items below, by key; an empty key is unset.
    existingSecret: ""
    caKey: ""
    # Mutual TLS: the client certificate and its key, both or neither.
    certKey: ""
    keyKey: ""
  apiKey:
    # A Secret holding the frontend's API key (Temporal Cloud, or a
    # frontend with a JWT authorizer). An API key implies TLS.
    existingSecret: ""
    key: STIGMER_TEMPORAL_API_KEY

service:
  # ClusterIP; reach it with `kubectl port-forward` or through the Ingress.
  # NodePort and LoadBalancer expose it outside the cluster, so they are
  # refused while sign-in is off (server.allowUnauthenticatedExposure).
  type: ClusterIP

ingress:
  # Two Ingress objects, because the two lanes want different annotations:
  # the API host carries gRPC (the CLI and SDKs), Connect and the console,
  # and on ingress-nginx needs
  #   nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
  # for the CLI's gRPC to pass (without it the browser lanes work and gRPC
  # fails with "missing status"). The artifacts host is plain HTTP. Setting
  # a tlsSecretName makes the derived public URL https. An Ingress with
  # sign-in off is refused (server.allowUnauthenticatedExposure).
  enabled: false
  className: ""
  api:
    host: ""
    annotations: {}
    tlsSecretName: ""
  artifacts:
    host: ""
    annotations: {}
    tlsSecretName: ""

enterprise:
  license:
    # The switch to Stigmer Enterprise: the name of a Secret in the release
    # namespace holding the license key. Set, the server container runs
    # image.server.enterpriseRepository and reads the key and the settings
    # below (STIGMER_LICENSE_KEY and the three named with them); empty, the
    # chart is the open-source stack and refuses those settings, which the
    # open-source server never reads. A licensed server signs every caller
    # in, so server.oidc is required with it. Renew a key in place by
    # updating the Secret and restarting the pod; a lapsed license keeps
    # everything working and refuses only growth until it is renewed.
    #
    #   kubectl create secret generic stigmer-license \
    #     --from-literal=STIGMER_LICENSE_KEY=<the key you were sent>
    existingSecret: ""
    key: STIGMER_LICENSE_KEY
  # Who may create an organization (STIGMER_ORGANIZATION_CREATORS): account
  # ids, as `stigmer auth whoami` prints them (ida_ and 26 characters).
  # Empty means anyone signed in. An admin of an organization still creates
  # organizations under it. A change takes a restart.
  organizationCreators: []
  # Days the access history is kept (STIGMER_ACCESS_HISTORY_RETENTION_DAYS),
  # a whole number of at least 1; null keeps every entry.
  accessHistoryRetentionDays: null
  # Which addresses the server dials when it reaches a URL a person wrote
  # (a federation issuer's documents, an MCP install probe, a vault
  # sign-in), STIGMER_OUTBOUND_EGRESS. strict: public addresses only, and
  # the chart also turns on the pod's outbound fence (egressPolicy below),
  # so one promise holds at two layers. relaxed: private and loopback
  # addresses too (link-local stays refused), for an identity provider or
  # MCP server on your private network; no fence unless
  # egressPolicy.enabled.
  outboundEgress: strict

egressPolicy:
  # A NetworkPolicy on the stigmer pod's outbound connections: DNS, the
  # bundled Postgres and Temporal on their ports, every public address, and
  # allowedCidrs; no other private, shared, link-local or loopback address.
  # Everything an agent runs (its commands, MCP servers, fetches) leaves
  # from this pod, so without a fence it reaches whatever the pod can: your
  # databases, internal dashboards, cloud metadata. Rendered when this is
  # true, or under a license with enterprise.outboundEgress strict (the
  # default); wherever it renders, the runner's fetch tool refuses private
  # addresses too. A cluster whose network plugin ignores NetworkPolicy
  # gets no fence, and Kubernetes always allows a pod's traffic to its own
  # node.
  enabled: false
  # CIDRs the fence lets through besides the public internet: an external
  # Postgres or Temporal on a private address, an in-cluster identity
  # provider, a private model endpoint. NetworkPolicy takes addresses, not
  # host names. A distribution whose DNS listens on a port other than 53
  # (OpenShift's 5353) lists its DNS pods' CIDR here. Refused with no fence
  # to open.
  allowedCidrs: []

# Deliberately absent, and why:
#   replicas — the server's skill store and key files live on its claim;
#     one replica is a fact, so a value that could only be 1 would lie.
#   a sandbox provisioner — the open-source agent-sandbox and docker drivers
#     hand a per-session runner no artifact path (stigmer#1099); the values
#     arrive with the artifact backend that fixes it.
#   a NetworkPolicy admitting connections INTO the stigmer pod — its ports
#     are the API, which authenticates every caller once sign-in is on. Its
#     outbound connections have a fence (egressPolicy), and inside it the
#     pod is still one trust domain (stdio MCP servers run inside the runner
#     container and can reach its filesystem and network); the README says
#     so. The bundled Temporal has its fence (temporal.networkPolicy),
#     because it authenticates nothing, and the bundled Postgres its own
#     (postgres.networkPolicy).
#   openfga, redis, openbao, licenseKeySecret — reserved here before
#     Stigmer Enterprise shipped, now retired: no edition runs OpenFGA,
#     Redis or OpenBao beside the server, and the license is
#     enterprise.license.existingSecret. A values file that still carries
#     them at their off values installs; turned on, they are refused.
#   an HPA — nothing here scales horizontally yet.
#   TLS inside the pod — terminate the API's at the Ingress, as behind
#     Caddy or nginx with compose. (TLS to an external Temporal is
#     externalTemporal.tls.)
#   helm test hooks — the smoke (test/install/smoke-helm.mjs) is the proof and
#     runs the same probes as the compose stack and the all-in-one.
