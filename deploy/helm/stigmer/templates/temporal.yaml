{{- /*
Bundled Temporal: compose's three Temporal services in one pod, a real
Temporal server (temporalio/server), never the CLI's dev-server. The two setup
steps run on temporalio/admin-tools at the server's own version (the parity
test holds every Temporal image to compose's, and compose's to one version):

  - temporal-schema, an init container after wait-for-postgres, creates
    Temporal's two databases and brings their schemas to the server's
    version; every step is safe to repeat, so every pod start runs it, a
    reinstall onto kept disks leaves a current schema as it is, and an attempt
    that fails while the network settles is retried for a minute;
  - temporal-namespace, a container beside the server, registers the default
    namespace (retention 24h) once the server answers, then stays up and
    carries the pod's readiness.

Ready means "the default namespace is registered", NOT "the frontend
answers": a server that connects before the namespace exists fails its worker
creation without a later retry (stigmer#904). The readiness exec encodes that,
so the Service has no endpoint until the namespace exists and the stigmer
pod's init container (a TCP connect) waits for exactly that moment. The
registrar is a regular container, not a native sidecar, because the chart
supports Kubernetes from 1.27. It dials the pod's own address: the server
binds that address, not loopback. Both scripts are compose's, byte for byte
after compose's $$ escaping; the parity test holds them equal.

The server refuses to start without a dynamic-config file, and its image
ships none, so the <release>-temporal ConfigMap carries one: empty, the same
text as compose's, so every setting is Temporal's default.

Every container runs as the images' own temporal user, by number (uid 1000):
the images name their user, and Kubernetes can verify runAsNonRoot only
against a numeric one. The one mount is a read-only ConfigMap, so the pod
needs no fsGroup. For production Temporal, Temporal's own chart is the path
(externalTemporal).
*/ -}}
{{- if .Values.temporal.enabled }}
{{- $fullname := include "stigmer.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-temporal
  labels:
    {{- include "stigmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal
spec:
  type: ClusterIP
  selector:
    {{- include "stigmer.selectorLabels" (dict "root" . "component" "temporal") | nindent 4 }}
  ports:
    - name: frontend
      port: 7233
      targetPort: frontend
      appProtocol: grpc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-temporal
  labels:
    {{- include "stigmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal
data:
  # A Temporal setting this install ever needs goes here, under Temporal's own
  # dynamic-config key, and in compose's temporal-dynamic-config alike.
  dynamic-config.yaml: |
    # Temporal dynamic config. Empty: every setting is Temporal's default.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-temporal
  labels:
    {{- include "stigmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "stigmer.selectorLabels" (dict "root" . "component" "temporal") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stigmer.selectorLabels" (dict "root" . "component" "temporal") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      initContainers:
        {{- if .Values.waitForDependencies.enabled }}
        - name: wait-for-postgres
          image: {{ .Values.waitForDependencies.image | quote }}
          # The address arrives as env and pg_isready reads it, so nothing
          # from values is spliced into shell text.
          env:
            - name: PGHOST
              value: {{ include "stigmer.postgresHost" . | quote }}
            - name: PGPORT
              value: {{ include "stigmer.postgresPort" . | quote }}
            - name: PGUSER
              value: {{ include "stigmer.postgresUser" . | quote }}
          command:
            - bash
            - -c
            - |
              until pg_isready; do
                echo "waiting for postgres at ${PGHOST}:${PGPORT}"; sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            {{- toYaml .Values.waitForDependencies.securityContext | nindent 12 }}
        {{- end }}
        - name: temporal-schema
          image: {{ .Values.temporal.adminToolsImage | quote }}
          imagePullPolicy: IfNotPresent
          # temporal-sql-tool reads its connection from these, the password
          # by secretKeyRef, so nothing from values is spliced into the
          # script.
          env:
            - name: SQL_PLUGIN
              value: postgres12
            - name: SQL_HOST
              value: {{ include "stigmer.postgresHost" . | quote }}
            - name: SQL_PORT
              value: {{ include "stigmer.postgresPort" . | quote }}
            - name: SQL_USER
              value: {{ include "stigmer.postgresUser" . | quote }}
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "stigmer.postgresPasswordSecret" . | quote }}
                  key: {{ include "stigmer.postgresPasswordKey" . | quote }}
          command:
            - sh
            - -c
            - |
              set -u
              schema=/etc/temporal/schema/postgresql/v12
              setup() {
                for pair in temporal:temporal temporal_visibility:visibility; do
                  db=${pair%%:*}
                  dir=${pair##*:}
                  temporal-sql-tool --db "$db" create &&
                    temporal-sql-tool --db "$db" setup-schema -v 0.0 &&
                    temporal-sql-tool --db "$db" update-schema -d "$schema/$dir/versioned" ||
                    return 1
                done
              }
              # Connections can fail for a few seconds after Postgres or this step starts,
              # while the network settles (seen on a reinstall onto kept disks). The
              # sequence is safe to repeat, so it is retried for a minute before failing.
              deadline=$(( $(date +%s) + 60 ))
              until setup; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "temporal-schema: gave up after a minute of failed attempts" >&2
                  exit 1
                fi
                echo "temporal-schema: an attempt failed; retrying in 3s" >&2
                sleep 3
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            {{- toYaml .Values.temporal.securityContext | nindent 12 }}
      containers:
        - name: temporal
          image: {{ .Values.temporal.image | quote }}
          # An exact third-party tag: IfNotPresent by definition. image.pullPolicy
          # governs the two Stigmer images only.
          imagePullPolicy: IfNotPresent
          # The server reads its configuration from these variables, through
          # the template built into its image.
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: {{ include "stigmer.postgresPort" . | quote }}
            - name: POSTGRES_USER
              value: {{ include "stigmer.postgresUser" . | quote }}
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "stigmer.postgresPasswordSecret" . | quote }}
                  key: {{ include "stigmer.postgresPasswordKey" . | quote }}
            - name: POSTGRES_SEEDS
              value: {{ include "stigmer.postgresHost" . | quote }}
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: /etc/temporal/config/dynamicconfig/dynamic-config.yaml
          ports:
            - name: frontend
              containerPort: 7233
          volumeMounts:
            - name: dynamic-config
              mountPath: /etc/temporal/config/dynamicconfig
              readOnly: true
          resources:
            {{- toYaml .Values.temporal.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.temporal.securityContext | nindent 12 }}
        - name: temporal-namespace
          image: {{ .Values.temporal.adminToolsImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The temporal CLI's own variable for the server it dials, read by
            # the script and the readiness exec alike.
            - name: TEMPORAL_ADDRESS
              value: $(POD_IP):7233
          command:
            - sh
            - -c
            - |
              set -u
              deadline=$(( $(date +%s) + 240 ))
              wait_until() {
                what=$1
                shift
                until "$@" >/dev/null 2>&1; do
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                    echo "temporal-namespace: gave up waiting for $what at $TEMPORAL_ADDRESS" >&2
                    exit 1
                  fi
                  sleep 2
                done
              }
              serving() { temporal operator cluster health | grep -q SERVING; }
              wait_until "the server to answer SERVING" serving
              if ! temporal operator namespace describe -n default >/dev/null 2>&1; then
                temporal operator namespace create -n default --retention 24h || true
              fi
              wait_until "the default namespace" temporal operator namespace describe -n default
              echo "temporal-namespace: the default namespace is registered"
              # Stay up, as the image's own command does, so the readiness
              # exec below keeps reporting the namespace.
              trap exit INT HUP TERM
              sleep infinity & wait
          readinessProbe:
            exec:
              command: [temporal, operator, namespace, describe, -n, default]
            periodSeconds: 5
            # 10 s: the exec runs the temporal CLI inside the pod, and on a
            # loaded node (the CI gate saw it) 5 s timed out while the
            # frontend was serving.
            timeoutSeconds: 10
            failureThreshold: 60
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            {{- toYaml .Values.temporal.securityContext | nindent 12 }}
      volumes:
        - name: dynamic-config
          configMap:
            name: {{ $fullname }}-temporal
{{- end }}
