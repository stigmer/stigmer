{{- /*
The stigmer pod: the server and the runner, compose's stigmer-server and
stigmer-runner services in one pod. They share the pod network (the runner
dials the server on localhost, as `stigmer up` does) and three ReadWriteOnce
claims: server-data at the server's /data, runner-data at the runner's /data,
and artifacts at /artifacts in both, never nested under /data (a claim
starts empty and a mount nested inside it is created root-owned by the
runtime, which the non-root server cannot write).

With authentication on and no runner key named yet, the pod is the server
alone: the runner container and its claim's mount are left out until the
upgrade that names the key (stigmer.runnerEnabled in _helpers.tpl).

Recreate, one replica: two runners polling one queue mid-rollout would race
the disk, and a ReadWriteOnce claim cannot follow a rolling pod. The two
containers' env is _env.tpl's (stigmer.serverEnv, stigmer.runnerEnv), with
each container's extraEnv after it; stigmer.validate refuses an extraEnv
entry that repeats a name the chart sets.
*/ -}}
{{- include "stigmer.validate" . -}}
{{- $fullname := include "stigmer.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "stigmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: stigmer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "stigmer.selectorLabels" (dict "root" . "component" "stigmer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stigmer.selectorLabels" (dict "root" . "component" "stigmer") | nindent 8 }}
    spec:
      # fsGroup 1000 makes fresh claims writable by the server's node user
      # (the Dockerfile's uid). Nothing in the pod talks to the API server.
      securityContext:
        fsGroup: 1000
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.waitForDependencies.enabled }}
      # compose's depends_on, translated: the server throws at boot when
      # Postgres is unreachable and the runner exits when Temporal is. A TCP
      # connect to Temporal is also the stigmer#904 gate, because the bundled
      # Service has no endpoints until the default namespace exists.
      initContainers:
        - name: wait-for-dependencies
          image: {{ .Values.waitForDependencies.image | quote }}
          # The addresses arrive as env and the script reads them quoted, so
          # nothing from values is spliced into shell text. pg_isready reads
          # PGHOST, PGPORT and PGUSER itself.
          env:
            - name: PGHOST
              value: {{ include "stigmer.postgresHost" . | quote }}
            - name: PGPORT
              value: {{ include "stigmer.postgresPort" . | quote }}
            - name: PGUSER
              value: {{ include "stigmer.postgresUser" . | quote }}
            - name: TEMPORAL_HOST
              value: {{ include "stigmer.temporalHost" . | quote }}
            - name: TEMPORAL_PORT
              value: {{ include "stigmer.temporalPort" . | quote }}
          command:
            - bash
            - -c
            - |
              until pg_isready; do
                echo "waiting for postgres at ${PGHOST}:${PGPORT}"; sleep 2
              done
              until (exec 3<>"/dev/tcp/${TEMPORAL_HOST}/${TEMPORAL_PORT}") 2>/dev/null; do
                echo "waiting for temporal at ${TEMPORAL_HOST}:${TEMPORAL_PORT}"; sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            {{- toYaml .Values.waitForDependencies.securityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "stigmer.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "stigmer.serverEnv" . | nindent 12 }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: grpc-api
              containerPort: 7234
            - name: artifacts
              containerPort: 7235
          # Native gRPC probes on the unified port (the health service is
          # tokenless-exempt for exactly this, stigmer#974). Startup covers
          # a search-index rebuild on a large adopted database.
          startupProbe:
            grpc:
              port: 7234
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 7234
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 7234
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.server.securityContext | nindent 12 }}
          volumeMounts:
            - name: server-data
              mountPath: /data
            - name: artifacts
              mountPath: /artifacts
        {{- if include "stigmer.runnerEnabled" . }}
        - name: runner
          image: {{ include "stigmer.runnerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "stigmer.runnerEnv" . | nindent 12 }}
            {{- with .Values.runner.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # No probes: the runner has no health surface (an OSS follow-up,
          # stigmer#1101); a probe that pretended would be worse than none.
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.runner.securityContext | nindent 12 }}
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: artifacts
              mountPath: /artifacts
        {{- end }}
      volumes:
        - name: server-data
          persistentVolumeClaim:
            claimName: {{ $fullname }}-server-data
        {{- if include "stigmer.runnerEnabled" . }}
        - name: runner-data
          persistentVolumeClaim:
            claimName: {{ $fullname }}-runner-data
        {{- end }}
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ $fullname }}-artifacts
