{{- /*
Bundled Postgres: compose's `postgres` service. One instance, one claim,
the image compose runs (the parity test holds the two tags equal), the app
database created by POSTGRES_DB; Temporal's auto-setup creates its two on
the same instance at first boot (one Postgres, three databases, one backup
story). A StatefulSet so the claim follows the pod; its volumeClaimTemplate
is retained on uninstall by Kubernetes' default policy. Right for one team;
production brings its own through externalDatabase.

It runs as the image's own postgres user (uid 999) from the first process,
never as root: the official image's entrypoint initializes and serves as
whichever user it starts as, and the pod's fsGroup, the same group, makes a
fresh claim writable by it. postgres.networkPolicy fences it to this
release's stigmer and Temporal pods (postgres-networkpolicy.yaml).
*/ -}}
{{- if .Values.postgres.enabled }}
{{- $fullname := include "stigmer.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "stigmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    {{- include "stigmer.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "stigmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "stigmer.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stigmer.selectorLabels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      {{- with (.Values.postgres.securityContext | default dict).runAsGroup }}
      # The claim's group: a fresh volume is writable by the user above.
      # OnRootMismatch: the kubelet re-owns the volume only when its root
      # is not already the group's, never the whole database at each start.
      securityContext:
        fsGroup: {{ . }}
        fsGroupChangePolicy: OnRootMismatch
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          # An exact third-party tag: IfNotPresent by definition. image.pullPolicy
          # governs the two Stigmer images only.
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: POSTGRES_PASSWORD
            # The app database; auto-setup creates `temporal` and
            # `temporal_visibility` beside it.
            - name: POSTGRES_DB
              value: stigmer
            # Postgres refuses to initialize a data directory that is the
            # mount point itself when it carries lost+found; a subdirectory
            # is the documented shape.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.postgres.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
