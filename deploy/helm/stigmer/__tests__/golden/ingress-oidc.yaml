apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stigmer-api
  labels:
    app.kubernetes.io/name: stigmer
    app.kubernetes.io/instance: stigmer
    app.kubernetes.io/version: "<CHART_VERSION>"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: stigmer-<CHART_VERSION>
    app.kubernetes.io/component: stigmer
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - stigmer.example.com
      secretName: stigmer-api-tls
  rules:
    - host: stigmer.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stigmer
                port:
                  name: grpc-api
