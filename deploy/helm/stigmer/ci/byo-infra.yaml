# The "bring your own" stand-ins for the BYO smoke profile: a Postgres and a
# Temporal the chart did NOT install, in their own namespace, so the
# externalDatabase and externalTemporal values are proven against
# addresses the release does not own. Plain manifests mirroring the compose
# services (postgres:16.15; temporalio/server with its schema and namespace
# steps on temporalio/admin-tools, and the namespace-exists readiness,
# stigmer#904). The smoke creates the `byo-secrets` Secret with
# the same POSTGRES_PASSWORD it gives the chart's Secret before applying
# this file. Not for any use beyond the smoke.
apiVersion: v1
kind: Namespace
metadata:
  name: byo-infra
---
apiVersion: v1
kind: Service
metadata:
  name: byo-postgres
  namespace: byo-infra
spec:
  selector:
    app: byo-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: byo-postgres
  namespace: byo-infra
spec:
  serviceName: byo-postgres
  replicas: 1
  selector:
    matchLabels:
      app: byo-postgres
  template:
    metadata:
      labels:
        app: byo-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.15
          env:
            - name: POSTGRES_DB
              value: stigmer
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: byo-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: byo-temporal
  namespace: byo-infra
spec:
  selector:
    app: byo-temporal
  ports:
    - port: 7233
      targetPort: 7233
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: byo-temporal
  namespace: byo-infra
data:
  dynamic-config.yaml: |
    # Temporal dynamic config. Empty: every setting is Temporal's default.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: byo-temporal
  namespace: byo-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: byo-temporal
  template:
    metadata:
      labels:
        app: byo-temporal
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16.15
          command: [sh, -c, "until pg_isready -h byo-postgres -U postgres; do sleep 2; done"]
        - name: temporal-schema
          image: temporalio/admin-tools:1.32.2
          env:
            - name: SQL_PLUGIN
              value: postgres12
            - name: SQL_HOST
              value: byo-postgres
            - name: SQL_PORT
              value: "5432"
            - name: SQL_USER
              value: postgres
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: byo-secrets
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              set -u
              schema=/etc/temporal/schema/postgresql/v12
              setup() {
                for pair in temporal:temporal temporal_visibility:visibility; do
                  db=${pair%%:*}
                  dir=${pair##*:}
                  temporal-sql-tool --db "$db" create &&
                    temporal-sql-tool --db "$db" setup-schema -v 0.0 &&
                    temporal-sql-tool --db "$db" update-schema -d "$schema/$dir/versioned" ||
                    return 1
                done
              }
              # Connections can fail for a few seconds after Postgres or this step starts,
              # while the network settles (seen on a reinstall onto kept disks). The
              # sequence is safe to repeat, so it is retried for a minute before failing.
              deadline=$(( $(date +%s) + 60 ))
              until setup; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "temporal-schema: gave up after a minute of failed attempts" >&2
                  exit 1
                fi
                echo "temporal-schema: an attempt failed; retrying in 3s" >&2
                sleep 3
              done
      containers:
        - name: temporal
          image: temporalio/server:1.32.2
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: byo-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_SEEDS
              value: byo-postgres
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: /etc/temporal/config/dynamicconfig/dynamic-config.yaml
          ports:
            - containerPort: 7233
          volumeMounts:
            - name: dynamic-config
              mountPath: /etc/temporal/config/dynamicconfig
              readOnly: true
        - name: temporal-namespace
          image: temporalio/admin-tools:1.32.2
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TEMPORAL_ADDRESS
              value: $(POD_IP):7233
          command:
            - sh
            - -c
            - |
              until temporal operator cluster health 2>/dev/null | grep -q SERVING; do sleep 2; done
              temporal operator namespace describe -n default >/dev/null 2>&1 ||
                temporal operator namespace create -n default --retention 24h
              trap exit INT HUP TERM
              sleep infinity & wait
          readinessProbe:
            exec:
              command: [temporal, operator, namespace, describe, -n, default]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
      volumes:
        - name: dynamic-config
          configMap:
            name: byo-temporal
