---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: stigmers.stigmer.ai
spec:
  group: stigmer.ai
  names:
    kind: Stigmer
    listKind: StigmerList
    plural: stigmers
    shortNames:
    - stg
    singular: stigmer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .status.edition
      name: Edition
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.backup.lastSuccessfulBackup
      name: Backup
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Stigmer is one self-hosted Stigmer install. A cluster holds one.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: StigmerSpec declares one Stigmer install.
            properties:
              database:
                description: |-
                  Database is where Stigmer keeps its records. Absent, the operator runs
                  Postgres for you.
                properties:
                  postgresql:
                    description: PostgreSQL is the one database engine Stigmer runs
                      on in a cluster.
                    properties:
                      bundled:
                        description: Bundled is the Postgres the operator runs, through
                          CloudNativePG.
                        properties:
                          backup:
                            description: |-
                              Backup tunes the database's backups. With spec.objectStore declared the
                              database archives every change to the bucket from its first minute and
                              takes a full backup on this schedule; these are the defaults otherwise.
                            properties:
                              retention:
                                default: 30d
                                description: |-
                                  Retention is how long backups and the archive are kept, as a number and
                                  d, w or m. Defaults to 30d.
                                pattern: ^[1-9][0-9]*[dwm]$
                                type: string
                              schedule:
                                default: 0 0 2 * * *
                                description: |-
                                  Schedule is when a full backup is taken, as a six-field cron with
                                  seconds first, in UTC. Defaults to daily at 02:00.
                                type: string
                            type: object
                          instances:
                            default: 1
                            description: |-
                              Instances is the number of Postgres instances: one primary, the rest
                              standbys.
                            format: int32
                            maximum: 5
                            minimum: 1
                            type: integer
                          recoverFrom:
                            description: |-
                              RecoverFrom creates the database from an archive in the bucket instead
                              of empty: the install it names, to the moment it names. Honoured only
                              when the database is created; on a running install it changes nothing,
                              and the status says so.
                            properties:
                              serverName:
                                description: |-
                                  ServerName is the archive's name in the bucket: the source install's
                                  status.backup.serverName.
                                minLength: 1
                                type: string
                              targetTime:
                                description: |-
                                  TargetTime is the moment to restore to, in RFC 3339. Absent restores
                                  to the newest moment the archive holds.
                                format: date-time
                                type: string
                            required:
                            - serverName
                            type: object
                          resources:
                            description: Resources overrides each instance's requests
                              and limits.
                            properties:
                              claims:
                                description: |-
                                  Claims lists the names of resources, defined in spec.resourceClaims,
                                  that are used by this container.

                                  This field depends on the
                                  DynamicResourceAllocation feature gate.

                                  This field is immutable. It can only be set for containers.
                                items:
                                  description: ResourceClaim references one entry
                                    in PodSpec.ResourceClaims.
                                  properties:
                                    name:
                                      description: |-
                                        Name must match the name of one entry in pod.spec.resourceClaims of
                                        the Pod where this field is used. It makes that resource available
                                        inside a container.
                                      type: string
                                    request:
                                      description: |-
                                        Request is the name chosen for a request in the referenced claim.
                                        If empty, everything from the claim is made available, otherwise
                                        only the result of this request.
                                      type: string
                                  required:
                                  - name
                                  type: object
                                type: array
                                x-kubernetes-list-map-keys:
                                - name
                                x-kubernetes-list-type: map
                              limits:
                                additionalProperties:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                description: |-
                                  Limits describes the maximum amount of compute resources allowed.
                                  More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                                type: object
                              requests:
                                additionalProperties:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                description: |-
                                  Requests describes the minimum amount of compute resources required.
                                  If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                                  otherwise to an implementation-defined value. Requests cannot exceed Limits.
                                  More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                                type: object
                            type: object
                          storage:
                            description: Storage sizes each instance's volume. Defaults
                              to 10Gi.
                            properties:
                              size:
                                anyOf:
                                - type: integer
                                - type: string
                                description: Size is the claim's requested capacity.
                                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                x-kubernetes-int-or-string: true
                              storageClassName:
                                description: |-
                                  StorageClassName is the class the claim binds with; absent means the
                                  cluster's default.
                                type: string
                            type: object
                        type: object
                      external:
                        description: External is a Postgres you run.
                        properties:
                          database:
                            default: stigmer
                            description: Database is the database Stigmer uses.
                            type: string
                          host:
                            description: Host is the server's address.
                            minLength: 1
                            type: string
                          passwordSecret:
                            description: PasswordSecret names the Secret and key holding
                              the role's password.
                            properties:
                              key:
                                description: Key is the key within the Secret.
                                minLength: 1
                                type: string
                              name:
                                description: Name is the Secret's name.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          port:
                            default: 5432
                            description: Port is the server's port.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                          sslMode:
                            description: SSLMode is libpq's sslmode for the connection.
                            enum:
                            - disable
                            - allow
                            - prefer
                            - require
                            - verify-ca
                            - verify-full
                            type: string
                          user:
                            description: |-
                              User is the role Stigmer signs in as. It needs to own Database, where
                              Stigmer creates its schemas.
                            minLength: 1
                            type: string
                        required:
                        - host
                        - passwordSecret
                        - user
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: 'spec.database.postgresql: choose one of bundled or
                        external'
                      rule: '!(has(self.bundled) && has(self.external))'
                type: object
              enterprise:
                description: Enterprise runs Stigmer Enterprise under a license.
                properties:
                  accessHistoryRetentionDays:
                    description: |-
                      AccessHistoryRetentionDays is how long the access history is kept;
                      absent keeps every entry.
                    format: int32
                    minimum: 1
                    type: integer
                  license:
                    description: |-
                      License names the Secret and key holding the license key you were sent.
                      The server runs the Enterprise image and verifies it at boot.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the Secret's name.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  organizationCreators:
                    description: |-
                      OrganizationCreators are the account ids (ida_ and 26 characters, as
                      `stigmer auth whoami` prints them) who may create an organization.
                      Empty means anyone signed in.
                    items:
                      type: string
                    type: array
                  outboundEgress:
                    default: strict
                    description: |-
                      OutboundEgress is which addresses the server dials when it reaches a
                      URL a person wrote: strict allows public addresses only; relaxed also
                      allows private and loopback ones, for an identity provider or MCP
                      server on your private network.
                    enum:
                    - strict
                    - relaxed
                    type: string
                type: object
                x-kubernetes-validations:
                - message: 'Stigmer Enterprise settings need a license: set spec.enterprise.license
                    to the Secret holding your license key'
                  rule: has(self.license)
              identity:
                description: |-
                  Identity is how people sign in. Absent on an install with a front
                  door, the operator runs the bundled sign-in; absent on one without,
                  the server signs nobody in and every caller is the owner, which is
                  safe only while the install is reachable from inside the cluster.
                properties:
                  bundled:
                    description: |-
                      Bundled is the sign-in the operator runs beside Stigmer, at
                      <hostname>/idp. The owner's account is created with a one-time
                      password.
                    properties:
                      signUp:
                        description: |-
                          SignUp opens sign-up to people with an address in your domains, once
                          the owner has signed in. Absent, only the owner signs in.
                        properties:
                          emailDomains:
                            description: |-
                              EmailDomains are the domains whose addresses may sign up, such as
                              acme.dev.
                            items:
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$
                              type: string
                            type: array
                        type: object
                      smtp:
                        description: |-
                          SMTP is the mail server the sign-in sends verification and password
                          mail through.
                        properties:
                          from:
                            description: From is the address mail is sent from.
                            type: string
                            x-kubernetes-validations:
                            - message: spec.identity.bundled.smtp.from must be an
                                email address
                              rule: self.contains('@')
                          host:
                            description: Host is the mail server's address.
                            type: string
                          port:
                            default: 587
                            description: Port is the mail server's port.
                            format: int32
                            type: integer
                          secretName:
                            description: |-
                              SecretName is a Secret with the keys username and password, when the
                              mail server asks for them.
                            type: string
                          starttls:
                            description: StartTLS upgrades the connection to TLS.
                            type: boolean
                        required:
                        - from
                        - host
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: 'sign-up for your email domains needs mail: without
                        a verification email anyone could claim an address in the
                        domain. Set spec.identity.bundled.smtp'
                      rule: '!has(self.signUp) || size(self.signUp.emailDomains) ==
                        0 || has(self.smtp)'
                  oidc:
                    description: OIDC is your own identity provider.
                    properties:
                      audience:
                        description: Audience is the audience the issuer puts in Stigmer's
                          tokens.
                        minLength: 1
                        type: string
                      consoleClientId:
                        description: ConsoleClientID is the web console's client.
                        type: string
                      discoveryUrl:
                        description: |-
                          DiscoveryURL is where the server fetches the issuer's discovery
                          document when it cannot reach the issuer's public name from inside the
                          cluster. The document must still name Issuer.
                        type: string
                      issuer:
                        description: Issuer is the issuer's URL, exactly as its discovery
                          document names it.
                        type: string
                        x-kubernetes-validations:
                        - message: spec.identity.oidc.issuer must be an https URL
                            (plain http is allowed only for a loopback issuer)
                          rule: self.startsWith('https://') || self.matches('^http://(localhost|127[.]0[.]0[.]1)(:[0-9]+)?(/.*)?$')
                      nativeClientId:
                        description: NativeClientID is the desktop app's and the CLI's
                          client.
                        type: string
                    required:
                    - audience
                    - issuer
                    type: object
                type: object
                x-kubernetes-validations:
                - message: spec.identity needs exactly one of bundled (the sign-in
                    the operator runs) or oidc (your own issuer)
                  rule: has(self.bundled) != has(self.oidc)
              image:
                description: |-
                  Image says where Stigmer's images are pulled from. The tag is always
                  this operator's own version: operator vX runs Stigmer vX.
                properties:
                  pullPolicy:
                    default: IfNotPresent
                    description: PullPolicy applies to every Stigmer image.
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  pullSecrets:
                    description: PullSecrets are Secrets in this namespace the kubelet
                      pulls with.
                    items:
                      description: |-
                        LocalObjectReference contains enough information to let you locate the
                        referenced object inside the same namespace.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    type: array
                  registry:
                    default: ghcr.io/stigmer
                    description: Registry holds every Stigmer image under its usual
                      name.
                    type: string
                type: object
              ingress:
                description: |-
                  Ingress is the front door: the one hostname people reach Stigmer at,
                  for the console, the API, sign-in (/idp) and files kept on a volume
                  (/artifacts). Absent, the install is reached by port-forward.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      Annotations go on the Ingress for the console, the API and files, for
                      a controller that needs a hint to speak gRPC to the server.
                    type: object
                  className:
                    description: ClassName is the IngressClass that serves the front
                      door.
                    type: string
                  gatewayRef:
                    description: |-
                      GatewayRef attaches routes to a Gateway the cluster runs instead of
                      rendering an Ingress. The operator never edits the Gateway.
                    properties:
                      name:
                        description: Name is the Gateway's name.
                        type: string
                      namespace:
                        description: Namespace is the Gateway's namespace; this one
                          when empty.
                        type: string
                      sectionName:
                        description: SectionName is the listener the routes attach
                          to.
                        type: string
                    required:
                    - name
                    type: object
                  hostname:
                    description: |-
                      Hostname is the one name people reach Stigmer at, on port 443 (the CLI
                      and the desktop app speak TLS to a server on 443).
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$
                    type: string
                  serviceAnnotations:
                    additionalProperties:
                      type: string
                    description: |-
                      ServiceAnnotations go on the server's Service, for a controller that
                      reads its gRPC hint there (Traefik's
                      traefik.ingress.kubernetes.io/service.serversscheme: h2c).
                    type: object
                  tls:
                    description: TLS is the front door's certificate.
                    properties:
                      issuer:
                        description: Issuer is the cert-manager issuer that issues
                          the certificate.
                        properties:
                          kind:
                            default: ClusterIssuer
                            description: Kind is Issuer (in this namespace) or ClusterIssuer.
                            enum:
                            - Issuer
                            - ClusterIssuer
                            type: string
                          name:
                            description: Name is the issuer's name.
                            type: string
                        required:
                        - name
                        type: object
                      secretName:
                        description: SecretName is a TLS Secret in this namespace
                          you keep current.
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: spec.ingress.tls needs exactly one of secretName (a
                        certificate you keep) or issuer (cert-manager issues one)
                      rule: has(self.secretName) != has(self.issuer)
                required:
                - hostname
                type: object
                x-kubernetes-validations:
                - message: spec.ingress needs exactly one of tls (an Ingress with
                    its certificate) or gatewayRef (routes on your Gateway, whose
                    listener holds the certificate)
                  rule: has(self.tls) != has(self.gatewayRef)
              objectStore:
                description: |-
                  ObjectStore is the bucket Stigmer keeps its files in: what a run stores
                  beside its record, Skills, and the database's archive. Declared, the
                  server and the runner share no disk, a runner reads and writes files
                  through short-lived URLs without ever holding the bucket's keys, and
                  the bundled database archives to the bucket from its first minute.
                  Absent, files live on a volume the server and the shared runner share.
                properties:
                  s3:
                    description: |-
                      S3 is any S3-compatible bucket: AWS S3, Cloudflare R2, SeaweedFS, MinIO,
                      or Google Cloud Storage through its S3 API. Agent Substrate's snapshots
                      need a store other than Cloud Storage, whose S3 API refuses them.
                    properties:
                      bucket:
                        description: Bucket is the bucket's name.
                        maxLength: 63
                        minLength: 3
                        type: string
                      credentialsSecret:
                        description: |-
                          CredentialsSecret is a Secret in this namespace holding the bucket's
                          access key as ACCESS_KEY_ID and SECRET_ACCESS_KEY. The server and the
                          database's backups read it; no runner ever does.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      endpoint:
                        description: |-
                          Endpoint is the store's URL, such as
                          https://<account>.r2.cloudflarestorage.com or
                          http://minio.storage.svc:9000. Absent means AWS S3 itself.
                        type: string
                        x-kubernetes-validations:
                        - message: spec.objectStore.s3.endpoint must be an http or
                            https URL
                          rule: self.startsWith('https://') || self.startsWith('http://')
                      region:
                        default: us-east-1
                        description: Region is the bucket's region; R2 also accepts
                          us-east-1.
                        type: string
                      runnerEndpoint:
                        description: |-
                          RunnerEndpoint is the address runners reach the store at, when it is
                          not Endpoint: the URLs handed to runners are signed for it, since a
                          signed URL's host is part of its signature.
                        type: string
                        x-kubernetes-validations:
                        - message: spec.objectStore.s3.runnerEndpoint must be an http
                            or https URL
                          rule: self.startsWith('https://') || self.startsWith('http://')
                    required:
                    - bucket
                    - credentialsSecret
                    type: object
                required:
                - s3
                type: object
              owner:
                description: |-
                  Owner is the person who runs this install. They own the organization
                  when sign-in is on, and every action is attributed to them when it
                  is off (the server's STIGMER_OPERATOR_EMAIL and STIGMER_OPERATOR_NAME).
                properties:
                  email:
                    description: Email is the owner's sign-in address.
                    type: string
                    x-kubernetes-validations:
                    - message: spec.owner.email must be an email address
                      rule: self.contains('@')
                  name:
                    description: Name is how the owner is shown.
                    type: string
                required:
                - email
                type: object
              prerequisites:
                description: |-
                  Prerequisites says which cluster-level operators this operator may
                  install when they are missing. Under auto, one someone else installed
                  is trusted while a controller of theirs runs (a Deployment running its
                  controller's image, from any registry); skip trusts it without looking.
                properties:
                  agentSandbox:
                    default: auto
                    description: |-
                      AgentSandbox is agent-sandbox's controller, which runs the agentSandbox
                      driver's pods.
                    enum:
                    - auto
                    - skip
                    type: string
                  postgresBackupPlugin:
                    default: auto
                    description: |-
                      PostgresBackupPlugin is CloudNativePG's Barman Cloud plugin, which backs
                      the bundled Postgres up to the bucket. It needs cert-manager, which the
                      operator never installs.
                    enum:
                    - auto
                    - skip
                    type: string
                  postgresOperator:
                    default: auto
                    description: PostgresOperator is CloudNativePG, which runs the
                      bundled Postgres.
                    enum:
                    - auto
                    - skip
                    type: string
                  substrate:
                    default: auto
                    description: |-
                      Substrate is Agent Substrate's control plane, which runs the
                      substrate driver's actors.
                    enum:
                    - auto
                    - skip
                    type: string
                type: object
              runner:
                description: |-
                  Runner sizes and tunes the shared runner, the worker that runs agents
                  beside the server.
                properties:
                  extraEnv:
                    description: |-
                      ExtraEnv adds settings to the runner container. A name the operator
                      sets itself is refused.
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: The key to select.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
