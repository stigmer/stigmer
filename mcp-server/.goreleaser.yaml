# GoReleaser configuration for mcp-server-stigmer.
#
# Produces multi-platform binaries following the same naming convention as
# github/github-mcp-server:
#   mcp-server-stigmer_Darwin_arm64.tar.gz
#   mcp-server-stigmer_Linux_x86_64.tar.gz
#   ...
#
# Usage:
#   cd mcp-server && goreleaser release --clean
#
# For snapshot builds (no tag required):
#   cd mcp-server && goreleaser release --snapshot --clean

version: 2

project_name: mcp-server-stigmer

builds:
  - id: mcp-server-stigmer
    main: ./cmd/mcp-server-stigmer
    binary: mcp-server-stigmer
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/stigmer/stigmer/mcp-server/internal/server.buildVersion={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release:
  github:
    owner: stigmer
    name: stigmer
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
