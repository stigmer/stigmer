schema_version: "1.1"
name: refine-over-turns
tags: [quality]
context:
  scaffold_script: "scaffold.sh"
  history_file: "history.jsonl"
execution:
  prompt: "Put it under Fixed rather than Added, and cite ticket BUG-112. Then show me the final Unreleased section."
  max_turns: 15
  allowed_tools: ["Read", "Glob", "Grep", "Skill"]
  append_system_prompt: "Be direct and concise. Act on requests rather than explaining steps. When you do not know something, say so.\n\nYour workspace is the orders-sync repository."
graders:
  - name: final-file-correct
    type: "regex"
    pattern: "## \\[Unreleased\\][\\s\\S]*?### Fixed\\s*\\n+- [^\\n]*ParseMinutes[^\\n]*\\(BUG-112\\)[\\s\\S]*## \\[1\\.4\\.0\\]"
    target:
      source: "file"
      path: "CHANGELOG.md"
    weight: 3
  - name: moved-not-copied
    type: "regex"
    pattern: "ParseMinutes"
    match: "count:1"
    target:
      source: "file"
      path: "CHANGELOG.md"
    weight: 2
  - name: added-kept
    type: "regex"
    pattern: "### Added\\s*\\n+- `orders\\.CountByStatus`"
    target:
      source: "file"
      path: "CHANGELOG.md"
    weight: 1
  - name: release-unchanged
    type: "regex"
    pattern: "## \\[1\\.4\\.0\\] - 2026-09-01\\n\\n### Changed\\n\\n- The sync interval defaults to 5 minutes\\.\\n\\n### Fixed\\n\\n- The sync loop no longer stops after a timeout \\(BUG-98\\)\\."
    target:
      source: "file"
      path: "CHANGELOG.md"
    weight: 1
  - name: reply-shows-section
    type: "regex"
    pattern: "BUG-112"
    weight: 1
