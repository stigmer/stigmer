schema_version: "1.1"
name: fix-bug-with-test
tags: [quality]
context:
  scaffold_script: "scaffold.sh"
execution:
  prompt: "ParseMinutes in duration/duration.go returns an error for \"90s\". Make it accept seconds, rounding down to whole minutes, and add a test case for it. Then run `go test ./...` and write its full output to test-output.txt."
  max_turns: 30
  allowed_tools: ["Read", "Glob", "Grep", "Skill"]
  append_system_prompt: "Be direct and concise. Act on requests rather than explaining steps. When you do not know something, say so.\n\nYour workspace is the orders-sync repository."
graders:
  - name: tests-pass
    type: "regex"
    pattern: "^ok\\s+\\S*duration"
    flags: "m"
    target:
      source: "file"
      path: "test-output.txt"
    weight: 2
  - name: no-failures
    type: "regex"
    pattern: "FAIL"
    match: "not_contains"
    target:
      source: "file"
      path: "test-output.txt"
    weight: 1
  - name: ran-go-test
    type: "tool_used"
    tool: "Bash"
    input_match: "go test"
    weight: 1
  - name: meaningful-test
    type: "regex"
    pattern: "\"\\d+s\""
    target:
      source: "file"
      path: "duration/duration_test.go"
    weight: 2
  - name: no-unrelated-edits
    type: "regex"
    pattern: "^(?!duration/|CHANGELOG\\.md$|test-output\\.txt$).+"
    flags: "m"
    match: "not_contains"
    target: "files"
    weight: 2
  - name: correct-fix
    type: "llm"
    weight: 3
    focus:
      source: "file"
      path: "duration/duration.go"
    criteria: "PASS if ParseMinutes handles the \"s\" unit, rounding down to whole minutes, so \"90s\" is 1, \"30s\" is 0 and \"1h30m45s\" is 90, while \"1h30m\" stays 90, \"45m\" 45, \"2h\" 120 and \"\", \"abc\" and \"10\" stay errors. FAIL otherwise."
  - name: follows-conventions
    type: "llm"
    weight: 1
    focus:
      source: "file"
      path: "duration/duration.go"
    criteria: "PASS if errors are wrapped with context, only the standard library is used, and the doc comment stays true. FAIL otherwise."
