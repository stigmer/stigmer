# The RPC contract's waivers: the declared RPCs that no conformance test here
# tags as `[rpc:<Service>.<method>]`, each with the reason it is not.
#
# Every RPC the API declares is either tagged on the conformance test that
# pins its promise and sends it (the transport's recorder fails a tagged test
# that never sends its RPC, src/harness/rpc-recorder.ts), or listed here.
# src/inventory/rpc-contract.ts holds the two equal. There are two kinds and
# nothing else:
#
#   - rpc: <Service>.<method>
#     kind: gap               # no conformance test pins it yet
#     issue: <number>         # the open stigmer issue that owns the test
#     reason: <one sentence>
#
#   - rpc: <Service>.<method>
#     kind: proven-elsewhere  # its promise is pinned in another layer
#     proven_by: <repository-relative path to a *.test.ts carrying the same tag>
#     reason: <one sentence on why the conformance suite is the wrong layer>
#
# An RPC is waived once, never both waived and tagged, and a waiver names a
# declared RPC; a `proven_by` file must exist and carry the tag. A pull request
# that adds a waiver, or moves one from proven-elsewhere to gap, declares it in
# its body (`RPC-waiver: <Service>.<method> -- <reason>`, scripts/
# test-integrity.mjs), which reads this block form line by line: keep each
# entry as `  - rpc:` then `    kind:`.
waivers:
  - rpc: AgentExecutionCommandController.update
    kind: gap
    issue: 1551
    reason: >-
      What an update may change on a started or terminal run is undecided; the contract is decided before an arm pins it.
  - rpc: ApiKeyQueryController.getByKeyHash
    kind: proven-elsewhere
    proven_by: backend/services/stigmer-server/src/domain/apikey/__tests__/apikey.test.ts
    reason: >-
      The editions gate it differently by design (a platform-admin check on the cloud, open on the single-team default), so no one cross-edition answer exists to pin; the open-source server's suite pins its lookup.
  - rpc: CursorAccountCommandController.addCursorMemberKey
    kind: gap
    issue: 1548
    reason: >-
      Served by the Cloud edition only; the open-source server routes no CursorAccount service and the suite has no client for it.
