    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org, fake-stripe]
  - id: billing.rpc.create-credit-checkout-session.stripe-failure-surfaces
    surface: billing
    lane: >-
      rpc.createCreditCheckoutSession
    behavior: >-
      When Stripe refuses the session create (the fake fails the next /v1/checkout/sessions call), the RPC fails with a non-OK status and no purchase is left completed — the pending row does not grant credits.
    java_source: >-
      domain/billing/stripe/StripeCheckoutService.java:168-172; domain/billing/request/handler/CreateCreditCheckoutSessionHandler.java:108
    java_test: >-
      domain/billing/stripe/StripeCheckoutServiceTest.java
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org, fake-stripe]
    note: >-
      The exact status Java maps StripeCheckoutException to is read in S3 and pinned; the contract asserted is "no credits granted, error surfaced".
