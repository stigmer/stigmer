  # --- purchases and Stripe-facing org lanes ---------------------------------
  - id: billing.rpc.create-credit-checkout-session.creates-customer-and-session
    surface: billing
    lane: >-
      rpc.createCreditCheckoutSession
    behavior: >-
      createCreditCheckoutSession for a known pack ensures a Stripe customer (POST /v1/customers with name = org id and metadata stigmer_org_id), creates a checkout session (POST /v1/checkout/sessions, mode payment, one line item at the pack's price in cents, metadata stigmer_org_id / stigmer_purchase_id / stigmer_pack_id / stigmer_credits_micros) and returns the session URL, the purchase id and the session id.
    java_source: >-
      domain/billing/stripe/StripeCheckoutService.java:95-168; domain/billing/stripe/StripeCustomerService.java:100-109
    java_test: >-
      domain/billing/stripe/StripeCheckoutServiceTest.java; domain/billing/stripe/StripeCustomerServiceTest.java
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org, fake-stripe]
  - id: billing.rpc.create-credit-checkout-session.reuses-existing-customer
    surface: billing
    lane: >-
      rpc.createCreditCheckoutSession
    behavior: >-
      A second createCreditCheckoutSession for the same org does not create a second Stripe customer — the fake sees exactly one POST /v1/customers across both calls.
    java_source: >-
      domain/billing/stripe/StripeCustomerService.java:80-97
    java_test: >-
      domain/billing/stripe/StripeCustomerServiceTest.java
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org, fake-stripe]
  - id: billing.rpc.create-credit-checkout-session.unknown-pack-invalid-argument
    surface: billing
    lane: >-
      rpc.createCreditCheckoutSession
    behavior: >-
      createCreditCheckoutSession with a pack id the catalog does not know answers INVALID_ARGUMENT and makes no Stripe call.
    java_source: >-
      domain/billing/request/handler/CreateCreditCheckoutSessionHandler.java:102; domain/billing/catalog/CreditPackCatalog.java:69
    java_test: >-
      domain/billing/catalog/CreditPackCatalogTest.java
