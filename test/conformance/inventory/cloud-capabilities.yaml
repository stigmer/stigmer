  # PROXY — cursor (HTTP) and cursor-bidi
  # ===========================================================================
  - id: proxy.cursor.host-allow-list-403
    surface: proxy
    lane: >-
      cursor
    behavior: >-
      /v1/proxy/cursor/{host}/... for a host outside api2.cursor.sh, api.cursor.com, api.cursor.sh answers 403.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [none]
  - id: proxy.cursor.scope.foreign-execution-403
    surface: proxy
    lane: >-
      cursor
    behavior: >-
      A scoped Cursor call naming an execution the caller cannot can_edit answers 403 before the organization's Cursor key is looked up.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [agent-execution]
  - id: proxy.cursor.provider-key-required-403
    surface: proxy
    lane: >-
      cursor
    behavior: >-
      An authorized scoped call for an execution whose organization holds no Cursor key (its own or its parent organization's) answers 403 with a Connect-shaped JSON body {"code":"permission_denied","message":...} whose message carries the sentinel STIGMER_PROVIDER_KEY_REQUIRED and tells an admin to add one in Settings → Provider keys, and touches no upstream; no call is ever served on a Cursor key of Stigmer's own.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyed-org, agent-execution]
    note: >-
      The org holds the fixture Anthropic and OpenAI keys, so its native run is admitted, and no Cursor key. A failed key lookup answers 503 instead (retryable); the hosted edition's own unit arms carry that branch.
  - id: proxy.cursor.relay.sse-and-connect-usage
    surface: proxy
    lane: >-
      cursor
    behavior: >-
      A scoped Cursor call on the organization's own Cursor key relays to https://{host} with the key as Bearer and meters usage from SSE (CursorUsageExtractor) or Connect application/proto (ConnectCursorUsageExtractor, TurnEndedUpdate scan), recorded as the organization's key's usage and never charged.
    class: behavior
    disposition: smoke
    observability: none
    caller: none
    needs: [none]
    note: >-
      The relay cannot be faked (hardcoded https + allow-list, and the key is checked with Cursor at save), so a live runner smoke on a real Cursor key proves it. The extractors are `unit` rows below.
  - id: proxy.cursor.metadata-paths-scoped
    surface: proxy
    lane: >-
      cursor
    behavior: >-
      GET /v1/proxy/cursor/api.cursor.com/v1/models and /v1/me need a scope header like every other Cursor call and are served on the execution's organization's own Cursor key; the model list is cached per organization that owns the serving key.
    class: behavior
    disposition: smoke
    observability: none
    caller: none
    needs: [none]
    note: >-
      A served call reaches Cursor itself, so a live runner smoke on a real Cursor key proves it; the refusal of a call naming no execution is the shared edge's (proxy.llm.scope.missing-scope-header-403-when-required).
  - id: proxy.cursor-bidi.missing-token-refused-stream
    surface: proxy
    lane: >-
      cursor-bidi
    behavior: >-
      A Connect stream opened on the bidi port with no x-stigmer-auth is reset with REFUSED_STREAM, even when it carries a valid Stigmer token in authorization or x-api-key: the stream's Stigmer credential is x-stigmer-auth alone, and its authorization is the Cursor access token it forwards.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: anonymous
    needs: [none]
    note: >-
      The bidi handler authenticates itself, so this arm is observable on the conformance environment.
  - id: proxy.cursor-bidi.authn-failure-401-code-16
    surface: proxy
    lane: >-
      cursor-bidi
    behavior: >-
      A stream carrying a token no verifier claims answers a Connect error HTTP 401, code 16, message "Authentication failed" with application/grpc headers.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: anonymous
    needs: [none]
  - id: proxy.cursor-bidi.fga-denied-403-code-7
    surface: proxy
    lane: >-
      cursor-bidi
    behavior: >-
      A stream on an /agent.v1.* path whose execution scope the caller cannot can_edit answers a Connect error HTTP 403, code 7, "Access denied".
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [agent-execution]
  - id: proxy.cursor-bidi.relay-and-per-turn-usage
    surface: proxy
    lane: >-
      cursor-bidi
    behavior: >-
      An authorized stream is relayed over TLS h2 to api2.cursor.sh with the Cursor SDK's own access token (exchanged from the organization's Cursor key on the REST lane) forwarded unchanged, per-turn usage is extracted from Connect end-stream envelopes, and Cursor's own end-stream errors reach the runner unchanged.
    class: behavior
    disposition: smoke
    observability: none
    caller: none
    needs: [none]
  - id: proxy.cursor-bidi.ping-keepalive
    surface: proxy
    lane: >-
      cursor-bidi
    behavior: >-
      The upstream connection is kept alive with HTTP/2 PING frames and drained with GOAWAY on shutdown.
    class: behavior
    disposition: debris
    observability: none
    caller: none
    needs: [none]
    note: >-
      Debris as a row: transport plumbing with no client-visible contract. The composition still implements h2 PING keepalive on both the inbound and the upstream session as an implementation detail (pinned by its own unit tests), not as a behavior the suite observes.

