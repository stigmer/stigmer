  # ===========================================================================
  # PROXY — the llm lane (/v1/proxy/llm/{provider}/**)
  # ===========================================================================
  - id: proxy.llm.anthropic.relays-sse-and-injects-provider-key
    surface: proxy
    lane: >-
      llm
    behavior: >-
      POST /v1/proxy/llm/anthropic/v1/messages with a valid bearer and an execution scope header relays the request to the Anthropic upstream with x-api-key set to the execution's organization's own Anthropic key and anthropic-version 2023-06-01, and streams the upstream SSE back byte for byte with content-type text/event-stream.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, keyed-org, agent-execution]
  - id: proxy.llm.openai.injects-bearer-and-include-usage
    surface: proxy
    lane: >-
      llm
    behavior: >-
      POST /v1/proxy/llm/openai/v1/chat/completions with stream true reaches the upstream with Authorization "Bearer <the organization's own OpenAI key>" and stream_options.include_usage injected into the body.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, keyed-org, agent-execution]
  - id: proxy.llm.usage.anthropic-sse-usage-lands
    surface: proxy
    lane: >-
      llm
    behavior: >-
      After an Anthropic stream whose message_start/message_delta carry input and output tokens, the named run's getRunUsageReport counts the call and its tokens (llm_call_count and total_tokens move, served by the organization's key; metered because the scope named an execution). The wire carries no total, so the total is its input and output tokens.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, keyed-org, agent-execution]
  - id: proxy.llm.usage.openai-final-chunk-usage-lands
    surface: proxy
    lane: >-
      llm
    behavior: >-
      After an OpenAI stream whose final chunk carries usage, the call and its tokens are counted on the named run's getRunUsageReport; a plain-JSON (non-stream) completion's call is counted too.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, keyed-org, agent-execution]
  - id: proxy.llm.usage.mcp-scope-authorized-not-metered
    surface: proxy
    lane: >-
      llm
    behavior: >-
      A call scoped by X-Stigmer-Mcp-Server-Id on a server the caller can_connect is relayed but records NO usage row (authorized, not metered).
    class: behavior
    disposition: debris
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, mcp-server]
    note: >-
      Debris: the McpServer resource kind was deleted (an MCP server is configuration inside a plugin), so no resource is left for X-Stigmer-Mcp-Server-Id to name, and the cloud proxy stops reading the header with the same change. No runner ever sent it: every proxy call is scoped by its execution. Listing a plugin server's tools runs under an execution-scoped runner credential bound to its connect attempt (domain/plugin/list-tools.ts).
  - id: proxy.llm.unknown-provider-400
    surface: proxy
    lane: >-
      llm
    behavior: >-
      POST /v1/proxy/llm/mistral/... answers 400 without touching any upstream.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream]
  - id: proxy.llm.no-upstream-key-502
    surface: proxy
    lane: >-
      llm
    behavior: >-
      A provider whose platform key is not configured answers 502 without touching the upstream.
    class: adversarial
    disposition: debris
    observability: none
    caller: primary
    needs: [fake-llm-upstream]
    note: >-
      Debris: the proxy holds no platform key to be missing; every call is served on the organization's own key, and a call no key serves is refused 403 (proxy.llm.provider-key.keyless-403-sentinel).
  - id: proxy.llm.provider-key.keyless-403-sentinel
    surface: proxy
    lane: >-
      llm
    behavior: >-
      A scoped call for a provider the execution's organization holds no key for (its own or its parent organization's) answers 403, content-type application/json, header x-should-retry false, with a provider-shaped error body whose message carries the sentinel STIGMER_PROVIDER_KEY_REQUIRED, and never reaches the upstream; no call is ever served on a key of Stigmer's own.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, keyed-org, agent-execution]
    note: >-
      Observed by removing the org's key after its run was admitted: the proxy is the backstop for every call run admission could not see (a sub-agent on another provider, a key removed mid-run). An unscoped call has no organization to serve; every lane requires the scope header, so the edge refuses it earlier (proxy.llm.scope.missing-scope-header-403-when-required).
  - id: proxy.llm.scope.foreign-execution-403
    surface: proxy
    lane: >-
      llm
    behavior: >-
      A call whose X-Stigmer-Execution-Id names an execution the caller cannot can_edit (an outsider's) answers 403 and never reaches the upstream.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [fake-llm-upstream, agent-execution]
  - id: proxy.llm.scope.missing-scope-header-403-when-required
    surface: proxy
    lane: >-
      llm
    behavior: >-
      A call carrying no scope header answers 403.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream]
    note: >-
      Every proxy lane requires the scope header; there is no setting that lets a call name no execution. The id keeps its old wording, from when the requirement was a setting.
  - id: proxy.llm.authn.no-bearer-401
    surface: proxy
    lane: >-
      llm
    behavior: >-
      A call with no Authorization and no x-api-key answers 401 without touching the upstream.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: anonymous
    needs: [fake-llm-upstream]
  - id: proxy.llm.authn.foreign-or-expired-token-401
    surface: proxy
    lane: >-
      llm
    behavior: >-
      A bearer that no verifier claims (a token signed by another key, or an expired one) answers 401.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: anonymous
    needs: [fake-llm-upstream]
  - id: proxy.llm.authn.x-api-key-header-accepted
    surface: proxy
    lane: >-
      llm
    behavior: >-
      The caller's credential is accepted from x-api-key as well as from Authorization: Bearer (the Anthropic SDK convention).
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, agent-execution]
  - id: proxy.llm.upstream.connection-refused-502
    surface: proxy
    lane: >-
      llm
    behavior: >-
      When the upstream is unreachable (the fake's port closed), the call answers 502.
    class: adversarial
    disposition: smoke
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream]
    note: >-
      Needs the upstream base to point at a closed port for one call, which the shared run-scoped fixture cannot do without disturbing other files; the hosted edition's own unit arms cover it.
  - id: proxy.llm.upstream.platform-auth-rewritten-503
    surface: proxy
    lane: >-
      llm
    behavior: >-
      An upstream 401 or 403 is NOT relayed — the caller gets 503, content-type application/json, header x-should-retry false, and a body carrying the sentinel STIGMER_PLATFORM_MODEL_CAPACITY.
    class: carve-out
    disposition: debris
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, agent-execution]
    note: >-
      Debris: the LLM lane serves no call on a platform key, so no upstream failure is the platform's to rewrite; every failure is the organization's key's (proxy.llm.upstream.organization-key-failures-relayed-marked). The Cursor lanes rewrite nothing either: they serve every call on the organization's own Cursor key, so Cursor's own error is the organization's.
  - id: proxy.llm.upstream.platform-billing-rewritten-503
    surface: proxy
    lane: >-
      llm
    behavior: >-
      An OpenAI 429 whose error type or code is insufficient_quota, and an Anthropic 400 carrying billing text, are rewritten to the same 503 sentinel; a plain 429 is relayed verbatim.
    class: carve-out
    disposition: debris
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, agent-execution]
    note: >-
      Debris: the LLM lane serves no call on a platform key, so no upstream failure is the platform's to rewrite; every failure is the organization's key's (proxy.llm.upstream.organization-key-failures-relayed-marked). The Cursor lanes rewrite nothing either: they serve every call on the organization's own Cursor key, so Cursor's own error is the organization's.
  - id: proxy.llm.upstream.organization-key-failures-relayed-marked
    surface: proxy
    lane: >-
      llm
    behavior: >-
      An upstream 401, 403, insufficient_quota 429 or billing 400 on the organization's own key is relayed with its own status, never rewritten to 503, in the provider's error envelope with the provider's message kept and marked with the sentinel STIGMER_ORGANIZATION_PROVIDER_KEY.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, keyed-org, agent-execution]
  - id: proxy.llm.upstream.other-errors-relayed-verbatim
    surface: proxy
    lane: >-
      llm
    behavior: >-
      An upstream 400 (non-billing), 404 or 500 is relayed with its status, the provider's message kept in the body (marked as the organization's key, as every upstream failure is).
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, agent-execution]
  - id: proxy.llm.upstream.aborted-mid-stream-truncates-and-records-partial-usage
    surface: proxy
    lane: >-
      llm
    behavior: >-
      When the upstream cuts an SSE stream after a few events, the caller's stream ends early (a 200 already sent) and the meter records the partial call with the usage seen so far — the input tokens from message_start, no output tokens — rather than dropping it; the named run's getRunUsageReport counts it (read on the first hermetic run, 2026-09-06).
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, keyed-org, agent-execution]
    note: >-
      Corrected on the first hermetic run: Java records the partial row (llm_call_count +1); the assumption "records nothing" was wrong.
  - id: proxy.llm.headers.hop-by-hop-stripped
    surface: proxy
    lane: >-
      llm
    behavior: >-
      Ordinary upstream response headers (e.g. Anthropic's request-id) are relayed to the caller; the upstream's x-* infrastructure headers and its hop-by-hop headers (keep-alive, connection, upgrade, transfer-encoding) are stripped (ProxyHeaders.isForwardableResponseHeader) — corrected on the first hermetic run: the assumption "x-* relays" was the inverse of the code.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, agent-execution]

