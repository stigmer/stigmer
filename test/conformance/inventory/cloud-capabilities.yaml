# The cloud-capability behavior inventory: a behavior inventory, not a test
# count.
#
# Every behavior of the three surfaces only the hosted edition serves — the
# billing engine, the side-channel proxy, the public REST lane — each with a
# disposition that says where it is proven. The rows were first enumerated
# from the retired Java service's code and tests; the composition that
# replaced it is held to them. `npm run inventory:check`
# (scripts/check-inventory.ts, logic in src/inventory/inventory.ts) fails the
# CI lanes when a `conformance` row has no test tag, when a tag names no row,
# or when a tag sits on a row whose proof lives elsewhere.
#
# Row fields (schema enforced by src/inventory/inventory.ts):
#   id           <surface>.<lane>.<behavior> — stable dotted name, never a number;
#                tests carry it as `[id]` in their titles.
#   surface      billing | proxy | public
#   lane         rpc.<name> | gate.<name> | hook.<name> | stripe.<event> | worker
#                | llm | cursor | cursor-bidi | claimcheck | artifact | checkpointer
#                | model-registry | health | public.<endpoint> | site
#   behavior     one sentence: inputs -> status / typed field / side effect /
#                exact copy where the copy is contract
#   class        behavior | carve-out (bytes that must not differ between editions) | adversarial
#   disposition  conformance | unit | smoke | debris-candidate | debris
#                (`deviation` — the contract asserted here while Java carried a
#                tracked entry for its wrong answer — retired with the Java
#                service and its registry, stigmer#1023)
#   observability launcher | composition-only | none
#                (`launcher`: observable from outside on the environment the
#                cloud suites run against, src/harness/cloud-env.ts, so
#                authentication-class rows are `launcher` like every other
#                observable row)
#   caller       primary | operator | outsider | anonymous | runner-token | none
#   needs        fixtures/affordances the test requires
#   note         optional context
#
# A row's `disposition` is the maintainers' decision in durable form: a
# `debris` row records a behavior deliberately not carried forward, so the
# cut stays visible, and a `debris-candidate` row awaits that decision.
#
# The counts the rows were reconciled against: 23 billing RPCs (14 command
# + 9 query), 5 gate steps + 2 status hooks, 7 Stripe handlers over 8 event
# strings, 6 billing schedule ids from 5 starters.


rows:
  # ===========================================================================
  # BILLING — the RPC surface (BillingCommandController, BillingQueryController)
  # ===========================================================================

  # --- account and balance reads (org lanes, can_view_billing) ---------------
  - id: billing.rpc.get-billing-account.owner-reads-zero-balance-account
    surface: billing
    lane: >-
      rpc.getBillingAccount
    behavior: >-
      After an organization create, the org owner's getBillingAccount returns the account the create provisioned for that org with status active, a zero balance and the default thresholds.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org]
  - id: billing.rpc.get-billing-account.unknown-org-not-found
    surface: billing
    lane: >-
      rpc.getBillingAccount
    behavior: >-
      getBillingAccount for an org id that has no account answers NOT_FOUND.
    class: behavior
    disposition: unit
    observability: none
    caller: operator
    needs: [none]
    note: >-
      Every org create provisions an account and authorization runs before the handler, so the NOT_FOUND branch is unreachable from outside; the hosted edition pins it in its own unit arms.
  - id: billing.rpc.get-billing-account.outsider-permission-denied
    surface: billing
    lane: >-
      rpc.getBillingAccount
    behavior: >-
      A caller with no grant on the org gets PERMISSION_DENIED with the proto's error_msg "unauthorized to view billing for this organization".
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [unfunded-org]
  - id: billing.rpc.get-credit-balance.reflects-adjustments
    surface: billing
    lane: >-
      rpc.getCreditBalance
    behavior: >-
      getCreditBalance returns the CreditBalance whose available micros equal the sum of adjustments and grants applied to the account, in *_micros integer columns.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [funded-org]
  - id: billing.rpc.get-credit-balance.outsider-permission-denied
    surface: billing
    lane: >-
      rpc.getCreditBalance
    behavior: >-
      An outsider's getCreditBalance answers PERMISSION_DENIED "unauthorized to view billing for this organization".
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [unfunded-org]
  - id: billing.rpc.get-credit-ledger.lists-entries-newest-first-with-shape
    surface: billing
    lane: >-
      rpc.getCreditLedger
    behavior: >-
      getCreditLedger lists the org's ledger entries with entry type, amount_micros, balance-after, reason, source and idempotency key populated for every adjustment and grant made, paginated as the proto declares.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [funded-org]
  - id: billing.rpc.get-billing-usage-report.shape-and-empty-org
    surface: billing
    lane: >-
      rpc.getBillingUsageReport
    behavior: >-
      getBillingUsageReport for an org with no usage returns an empty report with the proto's aggregate fields present and zero; after proxied usage lands it lists per-call usage with model, tokens and cost micros.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [funded-org, fake-llm-upstream, agent-execution]
  - id: billing.rpc.get-customer-model-pricing.applies-policy-markup
    surface: billing
    lane: >-
      rpc.getCustomerModelPricing
    behavior: >-
      getCustomerModelPricing returns the org's effective per-model prices with the billing policy's markup applied and the *_micros_per_million fields populated for every model the baseline carries a policy for.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org]

  # --- the account (org lane, can_manage_billing) and the credit mutations
  # (platform lane, can_manage_credits: an operator or a credit issuer) --------
  - id: billing.rpc.get-or-create-billing-account.idempotent-for-existing
    surface: billing
    lane: >-
      rpc.getOrCreateBillingAccount
    behavior: >-
      getOrCreateBillingAccount on an org that already has an account returns that same account (same id, same balance) without creating a second one.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org]
  - id: billing.rpc.get-or-create-billing-account.member-without-manage-denied
    surface: billing
    lane: >-
      rpc.getOrCreateBillingAccount
    behavior: >-
      An outsider's getOrCreateBillingAccount answers PERMISSION_DENIED "unauthorized to manage billing for this organization".
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [unfunded-org]
  - id: billing.rpc.adjust-credits.positive-and-negative-move-balance
    surface: billing
    lane: >-
      rpc.adjustCredits
    behavior: >-
      adjustCredits by a caller holding can_manage_credits on the platform, with a positive then a negative amount_micros, returns a ledger entry each time and the balance reflects both, with the reason and source recorded on the entries.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [unfunded-org]
  - id: billing.rpc.adjust-credits.zero-amount-invalid-argument
    surface: billing
    lane: >-
      rpc.adjustCredits
    behavior: >-
      adjustCredits with amount_micros 0 answers INVALID_ARGUMENT "amount_micros must be non-zero".
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [unfunded-org]
  - id: billing.rpc.adjust-credits.idempotency-key-replays-once
    surface: billing
    lane: >-
      rpc.adjustCredits
    behavior: >-
      Two adjustCredits calls with the same idempotency_key apply the amount once — the second returns the original entry and the balance moves once.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [unfunded-org]
  - id: billing.rpc.adjust-credits.outsider-permission-denied
    surface: billing
    lane: >-
      rpc.adjustCredits
    behavior: >-
      An outsider's adjustCredits answers PERMISSION_DENIED "only platform operators and credit issuers can adjust credits".
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [unfunded-org]
  - id: billing.rpc.adjust-credits.owner-permission-denied
    surface: billing
    lane: >-
      rpc.adjustCredits
    behavior: >-
      The org's own owner's adjustCredits answers PERMISSION_DENIED "only platform operators and credit issuers can adjust credits" and the balance does not move: owning an organization never lets anyone add credit to it.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org]
  - id: billing.rpc.adjust-credits.no-billing-account-not-found
    surface: billing
    lane: >-
      rpc.adjustCredits
    behavior: >-
      adjustCredits by a credit issuer on an org id with no billing account answers NOT_FOUND "No billing account for <org>" and writes nothing.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [none]
  - id: billing.rpc.grant-credits.grants-with-expiry
    surface: billing
    lane: >-
      rpc.grantCredits
    behavior: >-
      grantCredits with a positive amount_micros and an expiry records a grant entry, raises the balance, and the grant's expiry is visible on the ledger entry.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [unfunded-org]
  - id: billing.rpc.grant-credits.non-positive-invalid-argument
    surface: billing
    lane: >-
      rpc.grantCredits
    behavior: >-
      grantCredits with amount_micros <= 0 answers INVALID_ARGUMENT "amount_micros must be positive".
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [unfunded-org]
  - id: billing.rpc.grant-credits.owner-permission-denied
    surface: billing
    lane: >-
      rpc.grantCredits
    behavior: >-
      The org's own owner's grantCredits answers PERMISSION_DENIED "only platform operators and credit issuers can grant credits" and the balance does not move.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org]
  - id: billing.rpc.grant-credits.no-billing-account-not-found
    surface: billing
    lane: >-
      rpc.grantCredits
    behavior: >-
      grantCredits by a credit issuer on an org id with no billing account answers NOT_FOUND "No billing account for <org>" and writes nothing.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [none]
  - id: billing.rpc.grant-credits.outsider-permission-denied
    surface: billing
    lane: >-
      rpc.grantCredits
    behavior: >-
      An outsider's grantCredits answers PERMISSION_DENIED "only platform operators and credit issuers can grant credits".
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [unfunded-org]

  # --- purchases and Stripe-facing org lanes ---------------------------------
  - id: billing.rpc.create-credit-checkout-session.creates-customer-and-session
    surface: billing
    lane: >-
      rpc.createCreditCheckoutSession
    behavior: >-
      createCreditCheckoutSession for a known pack ensures a Stripe customer (POST /v1/customers with name = org id and metadata stigmer_org_id), creates a checkout session (POST /v1/checkout/sessions, mode payment, one line item at the pack's price in cents, metadata stigmer_org_id / stigmer_purchase_id / stigmer_pack_id / stigmer_credits_micros) and returns the session URL, the purchase id and the session id.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org, fake-stripe]
  - id: billing.rpc.create-credit-checkout-session.reuses-existing-customer
    surface: billing
    lane: >-
      rpc.createCreditCheckoutSession
    behavior: >-
      A second createCreditCheckoutSession for the same org does not create a second Stripe customer — the fake sees exactly one POST /v1/customers across both calls.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org, fake-stripe]
  - id: billing.rpc.create-credit-checkout-session.unknown-pack-invalid-argument
    surface: billing
    lane: >-
      rpc.createCreditCheckoutSession
    behavior: >-
      createCreditCheckoutSession with a pack id the catalog does not know answers INVALID_ARGUMENT and makes no Stripe call.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org, fake-stripe]
  - id: billing.rpc.create-credit-checkout-session.stripe-failure-surfaces
    surface: billing
    lane: >-
      rpc.createCreditCheckoutSession
    behavior: >-
      When Stripe refuses the session create (the fake fails the next /v1/checkout/sessions call), the RPC fails with a non-OK status and no purchase is left completed — the pending row does not grant credits.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org, fake-stripe]
    note: >-
      The contract asserted is "no credits granted, error surfaced".
  - id: billing.rpc.create-credit-checkout-session.outsider-permission-denied
    surface: billing
    lane: >-
      rpc.createCreditCheckoutSession
    behavior: >-
      An outsider's createCreditCheckoutSession answers PERMISSION_DENIED "unauthorized to purchase credits for this organization".
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [unfunded-org]
  - id: billing.rpc.create-billing-portal-session.returns-portal-url
    surface: billing
    lane: >-
      rpc.createBillingPortalSession
    behavior: >-
      For an org with a Stripe customer, createBillingPortalSession creates a portal session (POST /v1/billing_portal/sessions with that customer and the return URL) and returns its URL.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org, fake-stripe]
  - id: billing.rpc.create-billing-portal-session.no-customer-failed-precondition
    surface: billing
    lane: >-
      rpc.createBillingPortalSession
    behavior: >-
      For an org that never purchased (no Stripe customer), createBillingPortalSession answers FAILED_PRECONDITION and makes no Stripe call.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org, fake-stripe]
  - id: billing.rpc.create-payment-method-setup-session.creates-customer-and-setup-session
    surface: billing
    lane: >-
      rpc.createPaymentMethodSetupSession
    behavior: >-
      For an org that never purchased, createPaymentMethodSetupSession ensures a Stripe customer (POST /v1/customers, once across calls), creates a checkout session in setup mode for that customer (POST /v1/checkout/sessions, mode setup, the given success and cancel URLs) and returns its URL and id. Nothing is charged and no purchase is recorded.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org, fake-stripe]
  - id: billing.rpc.create-payment-method-setup-session.outsider-permission-denied
    surface: billing
    lane: >-
      rpc.createPaymentMethodSetupSession
    behavior: >-
      An outsider's createPaymentMethodSetupSession answers PERMISSION_DENIED "unauthorized to manage billing for this organization" and makes no Stripe call.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [unfunded-org, fake-stripe]

  # --- the plan catalog and subscriptions (cloud_only kinds; no Java) ---------
  - id: billing.rpc.plan-list.buyable-rows-only
    surface: billing
    lane: >-
      rpc.Plan.list
    behavior: >-
      Plan list (no include_retired) answers at least one plan, every one active, under a pln_ id with a slug and a set instrument, each subscription plan naming a monthly minimum; get by id answers the same row to any signed-in caller, an outsider included.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [outsider]
  - id: billing.rpc.plan-create.operator-only
    surface: billing
    lane: >-
      rpc.Plan.create
    behavior: >-
      An organization owner's Plan create answers PERMISSION_DENIED "only platform operators can manage plans" and the catalog, retired rows included, is unchanged.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [none]
  - id: billing.rpc.get-entitlements.free-by-default
    surface: billing
    lane: >-
      rpc.Subscription.getEntitlements
    behavior: >-
      For an organization that never subscribed, getEntitlements answers an empty plan_id and Free's features, exactly [channels, sharing]; getForOrg answers NOT_FOUND.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org]
  - id: billing.rpc.change-plan.requires-payment-method
    surface: billing
    lane: >-
      rpc.Subscription.changePlan
    behavior: >-
      changePlan to a subscription plan for an organization with no saved payment method answers FAILED_PRECONDITION "A saved payment method is required to subscribe to a plan. Add a payment method first." with a google.rpc.ErrorInfo detail (reason PAYMENT_METHOD_REQUIRED, domain stigmer.ai, metadata org); afterwards getForOrg still answers NOT_FOUND, getEntitlements an empty plan_id, and no request reached Stripe.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org, fake-stripe]
  - id: billing.rpc.get-period-estimate.not-found-on-free
    surface: billing
    lane: >-
      rpc.Subscription.getPeriodEstimate
    behavior: >-
      For an organization that never subscribed, getPeriodEstimate answers NOT_FOUND: Free is not invoiced a plan, so it has no period to estimate.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org]
  - id: billing.rpc.subscription.outsider-permission-denied
    surface: billing
    lane: >-
      rpc.Subscription.changePlan
    behavior: >-
      An outsider's changePlan answers PERMISSION_DENIED "unauthorized to change this organization's plan", its getEntitlements PERMISSION_DENIED "unauthorized to view this organization's entitlements", and its getPeriodEstimate PERMISSION_DENIED "unauthorized to view this organization's period estimate".
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [unfunded-org, outsider]
  - id: billing.rpc.oss-boundary.every-plan-rpc-unimplemented
    surface: billing
    lane: >-
      rpc.Plan.list
    behavior: >-
      On a target where billingPlans is false (the local OSS server), every RPC of the Plan and Subscription controllers answers Unimplemented — the edition boundary (the kinds are cloud_only) as an observable contract.
    class: carve-out
    disposition: conformance
    observability: none
    caller: primary
    needs: [none]
  - id: billing.rpc.set-auto-recharge-config.persists-and-validates
    surface: billing
    lane: >-
      rpc.setAutoRechargeConfig
    behavior: >-
      setAutoRechargeConfig persists the threshold, top-up and monthly-cap amounts onto the account (visible on getBillingAccount) whether enabling or disabling; disabling still refuses a negative amount INVALID_ARGUMENT; enabling requires a saved payment method FIRST (FAILED_PRECONDITION "A saved payment method is required to enable auto-recharge. Purchase a credit pack first.") and then validates the amounts in order — threshold positive, amount positive, cap at least the amount — each INVALID_ARGUMENT with the engine's copy; a refused enable changes nothing.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org, fake-stripe]
    note: >-
      Auto-recharge is a live product surface: the console renders AutoRechargeCard and the SDKs expose setAutoRechargeConfig. The arm needs the fake Stripe because the only way an account gets a saved card from outside is the payment_method.attached webhook. The NOT_FOUND branch for an org without an account is unreachable black-box (every org create provisions an account; a foreign org is PERMISSION_DENIED first).
  - id: billing.rpc.set-auto-recharge-config.outsider-permission-denied
    surface: billing
    lane: >-
      rpc.setAutoRechargeConfig
    behavior: >-
      An outsider's setAutoRechargeConfig answers PERMISSION_DENIED "unauthorized to manage auto-recharge for this organization".
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [unfunded-org]

  # --- engine lanes (platform can_execute_billing_ops) -----------------------
  - id: billing.rpc.engine-lanes.ordinary-caller-permission-denied
    surface: billing
    lane: >-
      rpc.authorizeExecution
    behavior: >-
      Each of the six engine RPCs (authorizeExecution, finalizeExecution, rearmForRecovery, recordLlmCallUsage, previewAuthorization, getExecutionBillingSignal) answers PERMISSION_DENIED "only platform operators can execute billing operations" to an org owner who is not a platform operator.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org]
  - id: billing.rpc.preview-authorization.reasons-for-unfunded-and-funded
    surface: billing
    lane: >-
      rpc.previewAuthorization
    behavior: >-
      previewAuthorization answers not-authorized with reason "Insufficient credits to start execution" for a zero-balance org and authorized for a funded one; an org without an account answers "No billing account for this organization".
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [unfunded-org, funded-org]
  - id: billing.rpc.authorize-execution.reserves-and-latches
    surface: billing
    lane: >-
      rpc.authorizeExecution
    behavior: >-
      authorizeExecution for a funded org and a fresh execution id returns authorized with a reservation id; a second authorizeExecution for the same execution id returns the same reservation (idempotent), never a second hold.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [funded-org]
  - id: billing.rpc.authorize-execution.denied-when-unfunded
    surface: billing
    lane: >-
      rpc.authorizeExecution
    behavior: >-
      authorizeExecution for a zero-balance org returns not-authorized with denial reason "Insufficient credits to start execution" and creates no reservation.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [unfunded-org]
  - id: billing.rpc.authorize-execution.concurrent-reserves-one-hold
    surface: billing
    lane: >-
      rpc.authorizeExecution
    behavior: >-
      Concurrent authorizeExecution calls for the same execution id (fired without awaiting) leave exactly one reservation and one hold on the balance.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [funded-org]
  - id: billing.rpc.finalize-execution.settles-and-is-idempotent
    surface: billing
    lane: >-
      rpc.finalizeExecution
    behavior: >-
      finalizeExecution on an authorized execution settles the reservation (the hold is released, the balance reflects the recorded usage) and a second finalizeExecution for the same execution is a no-op — the balance moves once.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [funded-org]
  - id: billing.rpc.finalize-execution.unknown-execution-failed-precondition
    surface: billing
    lane: >-
      rpc.finalizeExecution
    behavior: >-
      finalizeExecution for an execution that was never authorized answers FAILED_PRECONDITION.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [funded-org]
  - id: billing.rpc.rearm-for-recovery.rotates-reservation-past-settled-latch
    surface: billing
    lane: >-
      rpc.rearmForRecovery
    behavior: >-
      rearmForRecovery on a settled execution mints a new reservation id (different from the original) and authorizes when the org is funded; on an unfunded org it answers not-authorized with the denial reason.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [funded-org]
  - id: billing.rpc.get-execution-billing-signal.unspecified-when-no-reservation
    surface: billing
    lane: >-
      rpc.getExecutionBillingSignal
    behavior: >-
      getExecutionBillingSignal for an execution with no reservation answers UNSPECIFIED with an empty reason; for an authorized execution on a healthy balance it answers UNSPECIFIED; when the balance is exhausted it answers STOP with reason "Credit balance exhausted"; when low, WARNING with "Credit balance is low".
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [funded-org]
  - id: billing.rpc.record-llm-call-usage.records-cost-and-marks-price-not-found
    surface: billing
    lane: >-
      rpc.recordLlmCallUsage
    behavior: >-
      recordLlmCallUsage for an authorized execution records a usage row (visible on getBillingUsageReport) with cost computed from the model's price; a model with no price records the row with cost status PRICE_NOT_FOUND instead of failing.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [funded-org]
    note: >-
      The composition deduplicates a report on RecordLlmCallUsageInput.call_id when the caller sends one, falling back to sequence when it does not, so a restarted proxy's legitimate calls are never dropped as duplicates. This row's arm sends no call_id; the call_id path is pinned by the hosted edition's own suites.

  # --- pricing governance (platform can_manage_model_pricing) ----------------
  - id: billing.rpc.pricing-admin-lanes.ordinary-caller-permission-denied
    surface: billing
    lane: >-
      rpc.upsertModelPricingBaseline
    behavior: >-
      Each pricing-admin RPC answers PERMISSION_DENIED with its proto error_msg to an org owner who is not a platform operator — "only platform operators can edit the model registry baseline" (upsert/retire), "only platform operators can decide pricing overrides" (decide), "only platform operators can view pricing governance" (getModelPricingGovernance), "only platform operators can view the model registry baseline" (listModelPricingBaselines).
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [none]
  - id: billing.rpc.upsert-model-pricing-baseline.round-trips-through-list
    surface: billing
    lane: >-
      rpc.upsertModelPricingBaseline
    behavior: >-
      An operator's upsertModelPricingBaseline for a new model key is listed ACTIVE by listModelPricingBaselines with the given prices and the server's stamps (baseline_id, decided_by, effective_at; supersedes_baseline_id empty); a second upsert of the same key supersedes the first — one ACTIVE per key, the prior revision SUPERSEDED and chained through supersedes_baseline_id, both visible with include_history (ACTIVE first); a variant declaring a Cursor token rate answers INVALID_ARGUMENT "Variant '<key>' declares a Cursor Token Rate — variants inherit the base entry's rate; set it on the base pricing block instead.".
    class: behavior
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [none]
    note: >-
      The pricing-governance operator lanes (upsert/retire/decide/list/governance) are operator tooling with a console and travel with the provider-reconciliation subsystem. Baselines are PLATFORM-GLOBAL state, not org state — the arm keys on a run-unique model id and retires it on cleanup so nothing outlives the test.
  - id: billing.rpc.retire-model-pricing-baseline.unknown-not-found
    surface: billing
    lane: >-
      rpc.retireModelPricingBaseline
    behavior: >-
      retireModelPricingBaseline with no ACTIVE baseline for the key answers NOT_FOUND "No ACTIVE baseline found for <model>/<provider>/<harness> — it may already be retired, or the key is misspelled."; for a known key the document turns RETIRED (visible with include_history) and stops appearing in the ACTIVE list; retiring it again is the same NOT_FOUND.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [none]
  - id: billing.rpc.decide-model-pricing-override.unknown-not-found
    surface: billing
    lane: >-
      rpc.decideModelPricingOverride
    behavior: >-
      decideModelPricingOverride for an override nobody proposed answers NOT_FOUND "No pricing override found with id <override_id>", approving or rejecting alike.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [none]
    note: >-
      The already-decided case is not drivable from outside — no RPC creates a pending override, only the Temporal provider-reconciliation corrector does — so it is the `unit` row below.
  - id: billing.rpc.decide-model-pricing-override.already-decided-failed-precondition
    surface: billing
    lane: >-
      rpc.decideModelPricingOverride
    behavior: >-
      decideModelPricingOverride on an override whose status is not PENDING_SIGNOFF answers FAILED_PRECONDITION "Pricing override <id> is <status>, not PENDING_SIGNOFF — only pending proposals can be decided."; a concurrent decision loses the CAS with ABORTED.
    class: behavior
    disposition: unit
    observability: none
    caller: operator
    needs: [none]
    note: >-
      A pending override exists only after the provider-reconciliation corrector (default off; fed by the Anthropic / Cursor admin APIs) proposes one, so the launcher cannot observe this branch; the hosted edition's own suites pin it.
  - id: billing.rpc.get-model-pricing-governance.returns-queue
