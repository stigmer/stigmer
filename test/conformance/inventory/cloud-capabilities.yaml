# The cloud-capability behavior inventory: a behavior inventory, not a test
# count.
#
# Every behavior of the three surfaces only the hosted edition serves — the
# billing engine, the side-channel proxy, the public REST lane — each with a
# disposition that says where it is proven. The rows were first enumerated
# from the retired Java service's code and tests; the composition that
# replaced it is held to them. `npm run inventory:check`
# (scripts/check-inventory.ts, logic in src/inventory/inventory.ts) fails the
# CI lanes when a `conformance` row has no test tag, when a tag names no row,
# or when a tag sits on a row whose proof lives elsewhere.
#
# Row fields (schema enforced by src/inventory/inventory.ts):
#   id           <surface>.<lane>.<behavior> — stable dotted name, never a number;
#                tests carry it as `[id]` in their titles.
#   surface      billing | proxy | public
#   lane         rpc.<name> | gate.<name> | hook.<name> | stripe.<event> | worker
#                | llm | cursor | cursor-bidi | claimcheck | artifact | checkpointer
#                | model-registry | health | public.<endpoint> | site
#   behavior     one sentence: inputs -> status / typed field / side effect /
#                exact copy where the copy is contract
#   class        behavior | carve-out (bytes that must not differ between editions) | adversarial
#   disposition  conformance | unit | smoke | debris-candidate | debris
#                (`deviation` — the contract asserted here while Java carried a
#                tracked entry for its wrong answer — retired with the Java
#                service and its registry, stigmer#1023)
#   observability launcher | composition-only | none
#                (`launcher`: observable from outside on the environment the
#                cloud suites run against, src/harness/cloud-env.ts, so
#                authentication-class rows are `launcher` like every other
#                observable row)
#   caller       primary | operator | outsider | anonymous | runner-token | none
#   needs        fixtures/affordances the test requires
#   note         optional context
#
# A row's `disposition` is the maintainers' decision in durable form: a
# `debris` row records a behavior deliberately not carried forward, so the
# cut stays visible, and a `debris-candidate` row awaits that decision.
#
# The counts the rows were reconciled against: 8 billing RPCs (6 command
# + 2 query; the billing usage report left when the run's own usage reports
# began reading the meter), 2 gate steps (account provisioning at organization create and
# provider-key admission at run create) and no status hook, 2 Stripe handlers
# over 2 event strings (customer.updated, payment_method.attached; the
# subscription engine's invoice handlers carry no rows here), 1 billing
# schedule id. The `debris` rows of the prepaid credit wallet (its gates,
# hook, Stripe events, sweeps, unit tables and public price list) each name
# the row that covers what took its place.


rows:
  # ===========================================================================
  # BILLING — the RPC surface (BillingCommandController, BillingQueryController)
  # ===========================================================================

  # --- account reads (org lanes, can_view_billing) ---------------------------
  - id: billing.rpc.get-billing-account.owner-reads-active-account
    surface: billing
    lane: >-
      rpc.getBillingAccount
    behavior: >-
      After an organization create, the org owner's getBillingAccount returns the account the create provisioned for that org with status active, no Stripe customer and no card on file.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyless-org]
  - id: billing.rpc.get-billing-account.unknown-org-not-found
    surface: billing
    lane: >-
      rpc.getBillingAccount
    behavior: >-
      getBillingAccount for an org id that has no account answers NOT_FOUND.
    class: behavior
    disposition: unit
    observability: none
    caller: operator
    needs: [none]
    note: >-
      Every org create provisions an account and authorization runs before the handler, so the NOT_FOUND branch is unreachable from outside; the hosted edition pins it in its own unit arms.
  - id: billing.rpc.get-billing-account.outsider-permission-denied
    surface: billing
    lane: >-
      rpc.getBillingAccount
    behavior: >-
      A caller with no grant on the org gets PERMISSION_DENIED with the proto's error_msg "unauthorized to view billing for this organization".
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [keyless-org]

  # --- the account (org lane, can_manage_billing) ----------------------------
  - id: billing.rpc.get-or-create-billing-account.idempotent-for-existing
    surface: billing
    lane: >-
      rpc.getOrCreateBillingAccount
    behavior: >-
      getOrCreateBillingAccount on an org that already has an account returns that same account (same id, same status) without creating a second one.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyless-org]
  - id: billing.rpc.get-or-create-billing-account.member-without-manage-denied
    surface: billing
    lane: >-
      rpc.getOrCreateBillingAccount
    behavior: >-
      An outsider's getOrCreateBillingAccount answers PERMISSION_DENIED "unauthorized to manage billing for this organization".
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [keyless-org]

  # --- the card on file: Stripe-facing org lanes -----------------------------
  - id: billing.rpc.create-billing-portal-session.returns-portal-url
    surface: billing
    lane: >-
      rpc.createBillingPortalSession
    behavior: >-
      For an org with a Stripe customer, createBillingPortalSession creates a portal session (POST /v1/billing_portal/sessions with that customer and the return URL) and returns its URL.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyless-org, fake-stripe]
  - id: billing.rpc.create-billing-portal-session.no-customer-failed-precondition
    surface: billing
    lane: >-
      rpc.createBillingPortalSession
    behavior: >-
      For an org that never saved a card (no Stripe customer), createBillingPortalSession answers FAILED_PRECONDITION and makes no Stripe call.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyless-org, fake-stripe]
  - id: billing.rpc.create-payment-method-setup-session.creates-customer-and-setup-session
    surface: billing
    lane: >-
      rpc.createPaymentMethodSetupSession
    behavior: >-
      For an org with no Stripe customer, createPaymentMethodSetupSession ensures one (POST /v1/customers with name = org id and metadata stigmer_org_id, once across calls, recorded as the account's stripe_customer_id), creates a checkout session in setup mode for that customer (POST /v1/checkout/sessions, mode setup, the given success and cancel URLs) and returns its URL and id. Nothing is charged.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyless-org, fake-stripe]
  - id: billing.rpc.create-payment-method-setup-session.outsider-permission-denied
    surface: billing
    lane: >-
      rpc.createPaymentMethodSetupSession
    behavior: >-
      An outsider's createPaymentMethodSetupSession answers PERMISSION_DENIED "unauthorized to manage billing for this organization" and makes no Stripe call.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [keyless-org, fake-stripe]

  # --- the plan catalog and subscriptions (cloud_only kinds; no Java) ---------
  - id: billing.rpc.plan-list.buyable-rows-only
    surface: billing
    lane: >-
      rpc.Plan.list
    behavior: >-
      Plan list (no include_retired) answers at least one plan, every one active, under a pln_ id with a slug and a set instrument, each subscription plan naming its monthly fee (monthly_minimum_micros); get by id answers the same row to any signed-in caller, an outsider included.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [outsider]
  - id: billing.rpc.plan-create.operator-only
    surface: billing
    lane: >-
      rpc.Plan.create
    behavior: >-
      An organization owner's Plan create answers PERMISSION_DENIED "only platform operators can manage plans" and the catalog, retired rows included, is unchanged.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [none]
  - id: billing.rpc.get-entitlements.free-by-default
    surface: billing
    lane: >-
      rpc.Subscription.getEntitlements
    behavior: >-
      For an organization that never subscribed, getEntitlements answers an empty plan_id and Free's features, exactly [channels, sharing]; getForOrg answers NOT_FOUND.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyless-org]
  - id: billing.rpc.change-plan.requires-payment-method
    surface: billing
    lane: >-
      rpc.Subscription.changePlan
    behavior: >-
      changePlan to a subscription plan for an organization with no saved payment method answers FAILED_PRECONDITION "A saved payment method is required to subscribe to a plan. Add a payment method first." with a google.rpc.ErrorInfo detail (reason PAYMENT_METHOD_REQUIRED, domain stigmer.ai, metadata org); afterwards getForOrg still answers NOT_FOUND, getEntitlements an empty plan_id, and no request reached Stripe.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyless-org, fake-stripe]
  - id: billing.rpc.get-period-estimate.not-found-on-free
    surface: billing
    lane: >-
      rpc.Subscription.getPeriodEstimate
    behavior: >-
      For an organization that never subscribed, getPeriodEstimate answers NOT_FOUND: Free is not invoiced a plan, so it has no period to estimate.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyless-org]
  - id: billing.rpc.get-agent-hours.free-calendar-month
    surface: billing
    lane: >-
      rpc.Subscription.getAgentHours
    behavior: >-
      For an organization that never subscribed, getAgentHours answers Free's standing: included_hours present, no per_agent_hour_micros (new work pauses at the allowance), window calendar_month from the current UTC month's first instant to the next month's, and working_seconds 0.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyless-org]
  - id: billing.rpc.subscription.outsider-permission-denied
    surface: billing
    lane: >-
      rpc.Subscription.changePlan
    behavior: >-
      An outsider's changePlan answers PERMISSION_DENIED "unauthorized to change this organization's plan", its getEntitlements PERMISSION_DENIED "unauthorized to view this organization's entitlements", its getPeriodEstimate PERMISSION_DENIED "unauthorized to view this organization's period estimate", and its getAgentHours PERMISSION_DENIED "unauthorized to view this organization's agent hours".
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: outsider
    needs: [keyless-org, outsider]
  - id: billing.rpc.oss-boundary.every-plan-rpc-unimplemented
    surface: billing
    lane: >-
      rpc.Plan.list
    behavior: >-
      On a target where billingPlans is false (the local OSS server), every RPC of the Plan and Subscription controllers answers Unimplemented — the edition boundary (the kinds are cloud_only) as an observable contract.
    class: carve-out
    disposition: conformance
    observability: none
    caller: primary
    needs: [none]

  # --- the usage meter (platform can_execute_billing_ops) --------------------
  - id: billing.rpc.engine-lanes.ordinary-caller-permission-denied
    surface: billing
    lane: >-
      rpc.recordLlmCallUsage
    behavior: >-
      recordLlmCallUsage, the usage meter's write and the one engine RPC, answers PERMISSION_DENIED "only platform operators can execute billing operations" to an org owner who is not a platform operator.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [none]
  - id: billing.rpc.record-llm-call-usage.records-calls-and-unknown-models
    surface: billing
    lane: >-
      rpc.recordLlmCallUsage
    behavior: >-
      recordLlmCallUsage by the platform operator for two calls on one existing run, each with its tokens and the organization's key as its source, answers a fresh usage_record_id for each, and the run's getRunUsageReport counts them (llm_call_count 2, the tokens summed, one served_by row for the organization's key, one model breakdown row per model ordered by tokens); a model the catalog has no entry for is recorded the same way instead of failing. The record says what the call was, never a price.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [keyed-org, agent-execution]
    note: >-
      The composition deduplicates a report on RecordLlmCallUsageInput.call_id when the caller sends one, falling back to sequence when it does not, so a restarted proxy's legitimate calls are never dropped as duplicates. This row's arm sends no call_id; the call_id path is pinned by the hosted edition's own suites.

  # --- the metered usage source (the run usage reports read the meter) -------
  - id: billing.rpc.get-run-usage-report.reads-metered-tokens
    surface: billing
    lane: >-
      rpc.getRunUsageReport
    behavior: >-
      Once the meter holds calls for a run, the run's getRunUsageReport counts them from the meter: llm_call_count the calls, the token buckets summed (input excluding the cache buckets), served_by naming whose key served them (the organization's own key here) and summing to the totals, the model breakdown ordered by tokens; the run's row in its conversation's getSessionUsageReport reads is_estimated false, as does the session report.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, keyed-org, agent-execution]
    note: >-
      The meter's rows reach the open-source reports through their single metered-usage driver point, so the fold, the fallback and the windows are the library's; the arms here read what the hosted edition's meter recorded.
  - id: billing.rpc.get-org-usage-report.metered-totals-and-top-agents
    surface: billing
    lane: >-
      rpc.getOrgUsageReport
    behavior: >-
      An organization's getOrgUsageReport over the UTC day its run was created (from_date = to_date = that day) counts the run's metered calls: total_usage carries the tokens, llm_call_count and served_by of every run in the window, top_agents names the run's agent with its tokens, and daily_usage holds one row for the day with the run, its tokens and its calls.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, keyed-org, agent-execution]
  - id: billing.rpc.get-run-usage-report.unmetered-run-counts-runner-report
    surface: billing
    lane: >-
      rpc.getRunUsageReport
    behavior: >-
      A completed run the meter holds no call for (its runner reached its model without the proxy, or the report of its calls was lost) is counted from its own runner report: the runner's tokens with input less the cache buckets, the runner's total, llm_call_count 0, one served_by row whose source is unspecified, and is_estimated true on its conversation's report and its row there.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [agent-execution]
    note: >-
      Proven by the execution suite on the cloud execution target, whose runner dials the suite's mock model directly so none of its calls is metered (CapabilityFlags.runModelCallsMetered); the same arm holds the open-source targets, which compose no meter, to the same rule.

  # --- model catalog (platform can_manage_model_pricing) ---------------------
  - id: billing.rpc.pricing-admin-lanes.ordinary-caller-permission-denied
    surface: billing
    lane: >-
      rpc.upsertModelPricingBaseline
    behavior: >-
      Each pricing-admin RPC answers PERMISSION_DENIED with its proto error_msg to an org owner who is not a platform operator — "only platform operators can edit the model registry baseline" (upsert/retire), "only platform operators can view the model registry baseline" (listModelPricingBaselines).
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [none]
  - id: billing.rpc.upsert-model-pricing-baseline.round-trips-through-list
    surface: billing
    lane: >-
      rpc.upsertModelPricingBaseline
    behavior: >-
      An operator's upsertModelPricingBaseline for a new model key is listed ACTIVE by listModelPricingBaselines with the given prices and the server's stamps (baseline_id, decided_by, effective_at; supersedes_baseline_id empty); a second upsert of the same key supersedes the first — one ACTIVE per key, the prior revision SUPERSEDED and chained through supersedes_baseline_id, both visible with include_history (ACTIVE first); a variant declaring a Cursor token rate answers INVALID_ARGUMENT "Variant '<key>' declares a Cursor Token Rate — variants inherit the base entry's rate; set it on the base pricing block instead.".
    class: behavior
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [none]
    note: >-
      The model catalog operator lanes (upsert/retire/list) are operator tooling with a console. Baselines are PLATFORM-GLOBAL state, not org state — the arm keys on a run-unique model id and retires it on cleanup so nothing outlives the test.
  - id: billing.rpc.retire-model-pricing-baseline.unknown-not-found
    surface: billing
    lane: >-
      rpc.retireModelPricingBaseline
    behavior: >-
      retireModelPricingBaseline with no ACTIVE baseline for the key answers NOT_FOUND "No ACTIVE baseline found for <model>/<provider>/<harness> — it may already be retired, or the key is misspelled."; for a known key the document turns RETIRED (visible with include_history) and stops appearing in the ACTIVE list; retiring it again is the same NOT_FOUND.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: operator
    needs: [none]

  # --- local OSS posture ----------------------------------------------------
  - id: billing.rpc.oss-boundary.every-billing-rpc-unimplemented
    surface: billing
    lane: >-
      rpc.getBillingAccount
    behavior: >-
      On a target where billingEngine is false (the local OSS server), every one of the 8 billing RPCs answers Unimplemented — the edition boundary (billing is Cloud only) as an observable contract.
    class: carve-out
    disposition: conformance
    observability: none
    caller: primary
    needs: [none]
    note: >-
      Runs where the flag is FALSE (the versionTagging posture); observability `none` here means "not a Java behavior".

  # ===========================================================================
  # BILLING — gate steps and status hooks, observed through agent executions
  # ===========================================================================
  - id: billing.gate.provision-account.org-create-provisions-account
    surface: billing
    lane: >-
      gate.provisionBillingAccount
    behavior: >-
      Creating an organization provisions its billing account (status active) in the same call — getBillingAccount succeeds immediately after the create without any billing RPC having been called.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyless-org]
  - id: billing.gate.reserve.unfunded-execution-denied
    surface: billing
    lane: >-
      gate.reserve
    behavior: >-
      The reserve step, asked to reserve for an agent-execution create in a zero-balance org, refuses it synchronously: FAILED_PRECONDITION with the engine's denial reason verbatim ("Insufficient credits to start execution"), and no execution resource exists afterwards.
    class: carve-out
    disposition: debris
    observability: none
    caller: primary
    needs: [unfunded-org, agent-execution]
    note: >-
      Debris: no run draws credit, so no create reserves and there is no balance to refuse it on. Run admission asks only whether the organization holds a key for the run's provider (billing.gate.provider-key.keyless-run-refused, billing.gate.provider-key.keyless-cursor-run-refused).
  - id: billing.gate.provider-key.keyless-run-refused
    surface: billing
    lane: >-
      gate.providerKey
    behavior: >-
      A native agent-execution create in an org holding no provider key for the run's model's provider (the agent's model, or the catalog's default model when none is named) is refused synchronously after the request's own validation: FAILED_PRECONDITION with ErrorInfo reason PROVIDER_KEY_REQUIRED and metadata org, provider and model, the copy "This organization has no <Anthropic|OpenAI> key for model '<model>', so the run was not started. An admin can add one in Settings → Provider keys.", and nothing reaches a model.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyless-org, agent-execution]
    note: >-
      Asserted by suites-execution/run-admission.conformance.test.ts. Guests and channel users get their own copy with no ErrorInfo (the visitor refusal sets); conformance cannot mint those callers, so the hosted edition's unit arms carry their wording.
  - id: billing.gate.provider-key.keyless-cursor-run-refused
    surface: billing
    lane: >-
      gate.providerKey
    behavior: >-
      A Cursor agent-execution create in an org holding no Cursor key (its own or its parent organization's) is refused synchronously after the request's own validation: FAILED_PRECONDITION with ErrorInfo reason PROVIDER_KEY_REQUIRED and metadata org and provider "cursor", the copy "This organization has no Cursor key, so the run was not started. An admin can add one in Settings → Provider keys." for a run on Auto (the copy names the model when the run names one), and nothing reaches a model.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyless-org, agent-execution]
    note: >-
      Asserted by suites-execution/run-admission.conformance.test.ts on an org that holds no key at all: the harness names the provider, so no catalog lookup is involved. The keyed half needs a real Cursor key, because the key is checked with Cursor at save; the Cursor execution arms run on one when the run supplies CURSOR_API_KEY.
  - id: billing.gate.provider-key.keyed-run-completes
    surface: billing
    lane: >-
      gate.providerKey
    behavior: >-
      The same org, once it saves its provider keys, runs a native execution to completion: the provider bills the organization directly.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyless-org, keyed-org, agent-execution]
    note: >-
      The second arm of suites-execution/run-admission.conformance.test.ts.
  - id: billing.gate.provider-key.reconcile-turn-needs-no-key
    surface: billing
    lane: >-
      gate.providerKey
    behavior: >-
      An undo of a finished turn's file changes, in an org that holds no provider key any more, still starts the reconcile turn (a run with reconcile_file_review set, which asks no model) and it puts the file back and completes; the provider-key gate passes such a run.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [keyed-org, agent-execution, git-workspace]
    note: >-
      Asserted by suites-execution/run-file-review.conformance.test.ts, which removes the org's keys after the turn that edited the file.
  - id: billing.gate.reserve.funding-clears-denial
    surface: billing
    lane: >-
      gate.reserve
    behavior: >-
      Funding the SAME org that was just denied lets its next execution run — the denial was credit-driven (the negative control).
    class: behavior
    disposition: debris
    observability: none
    caller: primary
    needs: [unfunded-org, agent-execution]
    note: >-
      Debris: there is no credit to fund, so no denial for funding to clear. The negative control is the provider-key pair: the org refused for holding no key runs once it saves one (billing.gate.provider-key.keyless-run-refused, billing.gate.provider-key.keyed-run-completes).
  - id: billing.gate.reserve.funded-execution-holds-then-settles
    surface: billing
    lane: >-
      gate.reserve
    behavior: >-
      An execution that holds a reservation settles it when it completes — after completion the balance reflects the metered usage and no reservation remains held (a second execution reserves afresh).
    class: behavior
    disposition: debris
    observability: none
    caller: primary
    needs: [funded-org, agent-execution]
    note: >-
      Debris: no run holds a reservation or settles against a balance; a run on the organization's own key is billed by its provider directly (billing.gate.provider-key.keyed-run-completes).
  - id: billing.hook.status-signal.update-status-carries-stop-when-exhausted
    surface: billing
    lane: >-
      hook.statusSignal
    behavior: >-
      The runner's updateStatus reply on a running execution carries execution_control_signal UNSPECIFIED on a healthy balance, WARNING with signal_reason "Credit balance is low" once the balance falls under the warning threshold, and STOP with "Credit balance exhausted" once exhausted.
    class: carve-out
    disposition: debris
    observability: none
    caller: runner-token
    needs: [funded-org, agent-execution]
    note: >-
      Debris: there is no balance to fall low or run out, so the billing unit registers no status hook and the runner's updateStatus reply carries no billing signal; RunControlSignal stays a generic mechanism. A run whose organization holds no key is refused before it starts (billing.gate.provider-key.keyless-run-refused, billing.gate.provider-key.keyless-cursor-run-refused).
  - id: billing.gate.approval-signal.stop-refuses-approval
    surface: billing
    lane: >-
      gate.checkBilling
    behavior: >-
      submitApproval on an execution whose billing signal is STOP answers FAILED_PRECONDITION "Insufficient credits to continue this execution. Please add credits before acting on this approval, or cancel the execution."; a non-billed execution's approval is unaffected.
    class: carve-out
    disposition: debris
    observability: none
    caller: primary
    needs: [funded-org, agent-execution]
    note: >-
      Debris: no execution carries a billing STOP, so an approval asks nothing of billing. The provider-key gate at create is the only billing question a run meets (billing.gate.provider-key.keyless-run-refused, billing.gate.provider-key.keyless-cursor-run-refused).
  - id: billing.gate.rearm.recover-refused-when-unfunded
    surface: billing
    lane: >-
      gate.rearmBilling
    behavior: >-
      recover on a failed execution whose org has since been drained answers FAILED_PRECONDITION "Insufficient credits to recover this execution: Insufficient credits to start execution"; with funds the recover re-arms and relaunches.
    class: carve-out
    disposition: debris
    observability: none
    caller: primary
    needs: [funded-org, agent-execution]
    note: >-
      Debris: a recover holds no reservation to re-arm and no balance to refuse it on; the recovered run runs on the organization's own provider keys like any run (billing.gate.provider-key.keyless-run-refused, billing.gate.provider-key.keyed-run-completes).
  - id: billing.gate.visitor-preflight.schedule-fire-refused-when-unfunded
    surface: billing
    lane: >-
      gate.visitorPreflight
    behavior: >-
      A schedule-fired execution create in a zero-balance org is refused FAILED_PRECONDITION "The organization cannot fund a scheduled run right now." before any side effect; guest and channel callers get their own per-surface copy (GuestRefusal / ChannelLimitReason.UNAVAILABLE).
    class: carve-out
    disposition: debris
    observability: none
    caller: none
    needs: [unfunded-org]
    note: >-
      Debris: no run draws credit, so a visitor's or a schedule's run has nothing to fund. The preflight asked only about Cursor runs, the last runs that spent credit, and went when they moved to the organization's own Cursor key. A run whose organization holds no key for its provider is refused by provider-key admission instead (billing.gate.provider-key.keyless-run-refused, billing.gate.provider-key.keyless-cursor-run-refused).
  - id: billing.gate.reserve.billing-unavailable-fails-closed
    surface: billing
    lane: >-
      gate.reserve
    behavior: >-
      When the billing engine errors during authorization, the execution fails closed with status.error "Billing service unavailable" and the system message "Execution could not start due to a billing system error. Please try again."
    class: carve-out
    disposition: debris
    observability: none
    caller: none
    needs: [none]
    note: >-
      Debris: run admission reserves nothing, so no billing engine is asked and none can fail mid-admission; admission asks only for the organization's provider key (billing.gate.provider-key.keyless-run-refused, billing.gate.provider-key.keyless-cursor-run-refused).

