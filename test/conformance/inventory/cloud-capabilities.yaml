  - id: proxy.llm.upstream.aborted-mid-stream-truncates-and-records-partial-usage
    surface: proxy
    lane: >-
      llm
    behavior: >-
      When the upstream cuts an SSE stream after a few events, the caller's stream ends early (a 200 already sent) and Java records the partial call with the usage seen so far — the input tokens from message_start — rather than dropping it (read on the first hermetic run, 2026-09-06).
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, funded-org, agent-execution]
    note: >-
      Corrected on the first hermetic run: Java records the partial row (llm_call_count +1); the assumption "records nothing" was wrong.
  - id: proxy.llm.headers.hop-by-hop-stripped
    surface: proxy
    lane: >-
      llm
    behavior: >-
      Ordinary upstream response headers (e.g. Anthropic's request-id) are relayed to the caller; the upstream's x-* infrastructure headers and its hop-by-hop headers (keep-alive, connection, upgrade, transfer-encoding) are stripped (ProxyHeaders.isForwardableResponseHeader) — corrected on the first hermetic run: the assumption "x-* relays" was the inverse of the code.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [fake-llm-upstream, agent-execution]

