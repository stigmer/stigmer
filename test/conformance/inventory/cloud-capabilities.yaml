# The cloud-capability behavior inventory (DD-012 §5: "a behavior inventory,
# not a test count").
#
# Every behavior of the three surfaces the Java stigmer-service still owns
# alone — the billing engine, the side-channel proxy, the public REST lane —
# enumerated FROM JAVA'S CODE, cross-checked against Java's unit tests, and
# given a disposition that says where it is proven. `npm run inventory:check`
# (scripts/check-inventory.ts, logic in src/inventory/inventory.ts) fails the
# CI lanes when a `conformance` or `deviation` row has no test tag, when a tag
# names no row, or when a tag sits on a row whose proof lives elsewhere.
#
# Row fields (schema enforced by src/inventory/inventory.ts):
#   id           <surface>.<lane>.<behavior> — stable dotted name, never a number;
#                tests carry it as `[id]` in their titles.
#   surface      billing | proxy | public
#   lane         rpc.<name> | gate.<name> | hook.<name> | stripe.<event> | worker
#                | llm | cursor | cursor-bidi | claimcheck | artifact | checkpointer
#                | model-registry | health | public.<endpoint> | site
#   behavior     one sentence: inputs -> status / typed field / side effect /
#                exact copy where the copy is contract
#   java_source  path under backend/services/stigmer-service/src/main/java/ai/stigmer (:line)
#   java_test    path under .../src/test/java/ai/stigmer, or `none`
#   class        behavior | carve-out (a DD-012 byte-identical carve-out) | adversarial
#   disposition  conformance | deviation | unit | smoke | debris-candidate | debris
#   observability launcher | launcher-authz-only | composition-only | none
#                (`launcher-authz-only`: needs production security mode — the
#                hermetic launcher runs STIGMER_SECURITY_MODE=test, which does
#                not load HttpSecurityConfig; those tests skip through
#                TargetProfile.edgeAuthenticationBypass() until the launcher
#                entry lands)
#   caller       primary | operator | outsider | anonymous | runner-token | none
#   needs        fixtures/affordances the test requires
#   note         optional context
#   disputed     optional: why Java looks wrong (drives a `deviation` ruling)
#
# Owner rulings on rows (debris cuts, deviation calls) are dated lines in the
# entry's tasks/T01_1_review.md; the row's `disposition` is the ruling's
# durable form. `debris-candidate` rows await that ruling.
#
# The record's counts, reconciled here from code: 22 billing RPCs (13 command
# + 9 query), 5 gate steps + 2 status hooks, 7 Stripe handlers over 8 event
# strings, 6 billing schedule ids from 5 starters.
#
# Abbreviations in java_source: H = domain/billing/request/handler,
# S = domain/billing/service, ST = domain/billing/stripe, P = proxy.

rows:
  # ===========================================================================
  # BILLING — the RPC surface (BillingCommandController, BillingQueryController)
  # ===========================================================================

  # --- account and balance reads (org lanes, can_view_billing) ---------------
  - id: billing.rpc.get-billing-account.owner-reads-zero-balance-account
    surface: billing
    lane: >-
      rpc.getBillingAccount
    behavior: >-
      After an organization create, the org owner's getBillingAccount returns the E5-provisioned account for that org with status active, a zero balance and the default thresholds.
    java_source: >-
      domain/billing/request/handler/GetBillingAccountHandler.java; domain/tenancy/organization/request/handler/OrganizationCreateHandler.java:467
    java_test: >-
      domain/billing/service/BillingAccountServiceTest.java
    class: behavior
    disposition: conformance
    observability: launcher
    caller: primary
    needs: [unfunded-org]
  - id: billing.rpc.get-billing-account.unknown-org-not-found
    surface: billing
    lane: >-
      rpc.getBillingAccount
    behavior: >-
      getBillingAccount for an org id that has no account answers NOT_FOUND.
    java_source: >-
      domain/billing/request/handler/GetBillingAccountHandler.java:75
    java_test: >-
      none
    class: behavior
    disposition: unit
    observability: none
    caller: operator
    needs: [none]
    note: >-
      Re-dispositioned at S3: every org create provisions an account and authorization runs before the handler, so the NOT_FOUND branch is unreachable from outside on Java; the composition carries it as a unit arm. The org must exist for authorization to pass but carry no account row; on Java every org create provisions one, so the arm targets an org id the operator is authorized on that never had an account — feasibility confirmed in S3, else re-dispositioned.
