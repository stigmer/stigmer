      public.leads
    behavior: >-
      A blank message answers 400 "Message is required"; a long message is accepted, capped at 5000 on intake, and the Discord embed description is the first 4000 characters plus one ellipsis.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: anonymous
    needs: [fake-discord]
  - id: public.leads.fields-trimmed
    surface: public
    lane: >-
      public.leads
    behavior: >-
      Leading and trailing whitespace on name, email, company and message is trimmed before validation and before the embed.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: anonymous
    needs: [fake-discord]
  - id: public.leads.discord-failure-502-fail-loud
    surface: public
    lane: >-
      public.leads
    behavior: >-
      When Discord answers non-2xx, the submission answers 502 {"success":false,"error":"Failed to submit. Please try again."} — no queue, no retry.
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: anonymous
    needs: [fake-discord]
  - id: public.leads.unconfigured-503
    surface: public
    lane: >-
      public.leads
    behavior: >-
      When no leads webhook URL is configured, every submission answers 503 {"success":false,"error":"Lead intake is not configured"}.
    class: carve-out
    disposition: unit
    observability: none
    caller: none
    needs: [none]
    note: >-
      The conformance environment always configures the fake receiver; the unconfigured posture is pinned by the hosted edition's own unit arms.
  - id: public.cors.allow-list-and-methods
    surface: public
    lane: >-
      public.leads
    behavior: >-
      Actual requests from https://stigmer.ai, https://www.stigmer.ai and http://localhost:3000 carry Access-Control-Allow-Origin for that origin with GET and POST allowed and max-age 3600; an Origin outside the list gets no allow header (the browser refuses).
    class: carve-out
    disposition: conformance
    observability: launcher
    caller: anonymous
    needs: [none]
    note: >-
      Observed from outside on the hosted edition's conformance environment.
  - id: public.edge.public-paths-anonymous
    surface: public
    lane: >-
      public.model-registry
    behavior: >-
      /api/v1/public/** is reachable with no credential at all (permitAll) while /v1/proxy/** on the same listener is not.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: anonymous
    needs: [none]

# The metric inventory: every `stigmer.*` metric the retired Java service
# emitted in these domains, ported by the composition under the same name or
# dropped with the mechanism that emitted it. Same discipline, same file.
#
#   name         the Java metric name, byte-exact (the composition emits the
#                same name when `disposition: ported` — from its own code or
#                from the OSS server it pins, the row's note says which)
#   surface      billing | proxy | platform (a metric no lane owns: the HTTP
#                edge, the gRPC edge, the secret cleanup)
#   disposition  ported | dropped
#   alerts       the hosted edition's alert rules that read the series
#   note         required when `dropped`: why the mechanism retires
#
# Billing-side series that proxy reports FEED (stigmer.billing.usage.
# metered_execution, .service_tier.mismatch, .thinking.mismatch,
# .pricing.price_not_found) are the billing rows.
metrics:
  # ---- proxy ---------------------------------------------------------------
  - name: stigmer.proxy.cursor.connect.streams_metered
    surface: proxy
    disposition: ported
  - name: stigmer.proxy.cursor.connect.turns_extracted
    surface: proxy
    disposition: ported
  - name: stigmer.proxy.cursor.connect.zero_usage_streams
    surface: proxy
    disposition: ported
  - name: stigmer.proxy.cursor.bidi.streams_total
    surface: proxy
    disposition: ported
  - name: stigmer.proxy.cursor.bidi.upstream_stream_aborts_total
    surface: proxy
    disposition: ported
    alerts: [cursor-bidi-upstream-stream-aborts]
  - name: stigmer.proxy.cursor.bidi.upstream_connects_total
    surface: proxy
    disposition: ported
  - name: stigmer.proxy.cursor.bidi.upstream_ping_timeouts_total
    surface: proxy
    disposition: ported
  - name: stigmer.proxy.cursor.bidi.inbound_ping_timeouts_total
    surface: proxy
    disposition: ported
  - name: stigmer.proxy.cursor.platform_provider_errors
    surface: proxy
    disposition: dropped
    note: >-
      The bidi lane no longer rewrites Cursor's usage-limit end-stream as the platform's: every call runs on the organization's own Cursor key, so Cursor's error is the organization's. The counter and its alert retired with the rewrite.
  - name: stigmer.proxy.cursor.key_selection_rejected
    surface: proxy
    disposition: dropped
    note: >-
      The Cursor lanes serve every call on the organization's own Cursor key, so there is no pool of Stigmer's Cursor accounts to select a key from or refuse a call for; the counter and its alert retired with the pool.
  - name: stigmer.proxy.cursor.key_selection_soft_drained
    surface: proxy
    disposition: dropped
    note: >-
      The Cursor lanes serve every call on the organization's own Cursor key, so there is no pool of Stigmer's Cursor accounts to drain; the counter and its alert retired with the pool.
  - name: stigmer.proxy.cursor.key_selection_served_guard_tripped
    surface: proxy
    disposition: dropped
    note: >-
      The Cursor lanes serve every call on the organization's own Cursor key, so there is no pool of Stigmer's Cursor accounts to guard; the counter and its alert retired with the pool.
  - name: stigmer.proxy.cursor.session_repinned
    surface: proxy
    disposition: dropped
    note: >-
      An organization holds one Cursor key, so every turn of a session already runs on the same key; the session pin and its counter retired with the pool.
  - name: stigmer.proxy.cursor.key_health_reactive_syncs
    surface: proxy
    disposition: dropped
    note: >-
      The Cursor lanes serve every call on the organization's own Cursor key, so there is no pool of Stigmer's Cursor accounts to re-sync on an upstream refusal; the counter and its alert retired with the pool.
  - name: stigmer.proxy.llm.platform_provider_errors
    surface: proxy
    disposition: dropped
    note: >-
      The LLM lane serves no call on a platform key, so no upstream failure is the platform's: every failure is relayed as the organization's own key's. The counter, its metric and logs rules and its dashboard retired with the platform key.
  - name: stigmer.http.request.duration
    surface: platform
    disposition: ported
    note: >-
      Java's servlet filter saw every HTTP route. The contract for the composition is the same: the pair recorded once per request by each HTTP lane's dispatcher — the cloud ingress (proxy and webhook mounts) and the public lane — with the same labels: http.request.method, http.route (first two path segments), http.response.status_code.
  - name: stigmer.http.request.count
    surface: platform
    disposition: ported
    alerts: [webhook-silence-24h]
    note: >-
      The webhook silence rule is a threshold on this counter's rate under http_route contains /webhook, so the /webhook route series must exist from boot (born at zero) or the rule never fires — a money-path watch (Stripe rides /webhook/stripe).
  - name: stigmer.encryption.cleanup.failures
    surface: platform
    disposition: ported
    alerts: [encryption-cleanup-failures]
    note: >-
      Secret backing-state destructions that failed after the DB write succeeded (orphaned KV entries); pre-registered at zero on boot in both editions so the first orphan after a pod start is visible to the alert.
  - name: stigmer.grpc.request.count
    surface: platform
    disposition: ported
    alerts: [telemetry-heartbeat-lost, grpc-error-rate-spike]
    note: >-
      Emitted by the OSS server itself (pipeline/interceptors/request-metrics.ts), not by the composition: one record per RPC on the serving chain, labels rpc.service, rpc.method and rpc.grpc.status_code as the gRPC status NAME (OK, NOT_FOUND, CANCELLED). Born attribute-less at zero before the port binds, Java's constructor add(0), so the heartbeat's ten-minute absence window measures the export pipeline rather than a post-restart lull; the error-rate rule is the share of status_code != OK. Recorded inside the identity source — Java's @Order position — so an identity refusal is never a counted error. Health is not measured; is_public methods are.
  - name: stigmer.grpc.request.duration
    surface: platform
    disposition: ported
    alerts: [grpc-latency-regression-p95]
    note: >-
      The count's sibling, same labels, fractional milliseconds from interception to the RPC's end — for a server stream, the end of the stream (Java measured to ServerCall.close). Never pre-registered: a record(0) would be a real sample in the p95. SDK default histogram buckets in both editions.
  - name: stigmer.db.postgres.connections.used
    surface: platform
    disposition: ported
    alerts: [postgres-connections-above-80-of-max]
    note: >-
      Backends connected to the composition's database (pg_stat_activity, datname = current_database()), polled every 60 s by the composition's observability/postgres-capacity.ts and observed as a gauge with db.cluster = app-postgres only: Java's second cluster label, checkpointer-postgres, probed the separate stigmer_checkpoints database, whose tables the composition moved into the one database — that series retires with Java. The connections rule divides this by connections.max, so both rows name it. Nothing is observed before the first successful poll; a failed poll keeps the last values (Java's atomics).
  - name: stigmer.db.postgres.connections.max
    surface: platform
    disposition: ported
    alerts: [postgres-connections-above-80-of-max]
    note: >-
      The server's max_connections setting (current_setting), the denominator of the connections rule; same poll, same label as connections.used.
  - name: stigmer.db.postgres.database.size
    surface: platform
    disposition: ported
    alerts: [postgres-database-above-70-of-disk]
    note: >-
      pg_database_size(current_database()) in bytes; the disk rule's threshold is 70 % of the 30 G volume, a production fact the rule carries, not a metric.
  - name: stigmer.db.postgres.wal.size
    surface: platform
    disposition: ported
    alerts: [postgres-wal-above-80-of-max-wal-size]
    note: >-
      The WAL directory's size in bytes (sum over pg_ls_waldir()), which needs the pg_monitor role — granted to stigmer_app by hand on 2026-07-29 and carried by the composition's connections as the same role. Probed inside the same poll but on its own terms, as Java does: a failure sits out the next 15 polls and warns once with the GRANT to run, the last good value stays observed through the window, and only a probe that has never succeeded is absent. The rule's threshold is 80 % of max_wal_size (1024 MB), a production fact the rule carries.
  - name: stigmer.cursor.account_default.drift
    surface: platform
    disposition: dropped
    note: >-
      Watched the default speed variant of Stigmer's own Cursor team accounts. Cursor runs on the organization's own Cursor key, billed by Cursor to that organization, so there is no platform account to audit; the gauge, its sync and its alert retired with the pool.
  - name: stigmer.sandbox.pool.target
    surface: platform
    disposition: ported
    alerts: [sandbox-pool-below-target]
    note: >-
      The warm sandbox pool's effective target: the configured size while the pool is enabled, 0 while it is not, observed as a gauge by the composition's sandbox/pool-metrics.ts. The below-target rule subtracts READY members from this, so a deliberate disable or drain reads as a target of 0 and never fires. Polled every 60 s on the instrument's own loop, deliberately not a census handed over by the pool sweep: a sweep that stopped would freeze a sweep-fed gauge at its last healthy reading, whereas an independent poll shows a dead sweep as members that never move. Nothing is observed before the first successful poll (no fake zero that would read as an empty, healthy pool); a failed poll keeps the last census.
  - name: stigmer.sandbox.pool.members
    surface: platform
    disposition: ported
    alerts: [sandbox-pool-below-target]
    note: >-
      Pool members by status, one series per status the pool model knows (provisioning, ready, claimed), the label lowercased as Java emitted it and as the rule filters (status = ready). Same poll as the target. Every status is observed on every poll, zero included, so a status with no members reads 0 rather than vanishing from the series: an absent series cannot be alerted on.
  - name: stigmer.proxy.cursor.execution_authority_lookups
    surface: proxy
    disposition: dropped
    note: >-
      Counted the Java proxy's calls to the composition for an execution it did not own. In process the proxy reads its own store, so there is no lookup to count; the mechanism retired with Java.
  - name: stigmer.cursor_account.store_write_refused
    surface: proxy
    disposition: dropped
    note: >-
      Counted refusals of Java's second-client writes to the composition's cursor tables. The composition is now the only writer, so the gate retired with Java.
  # ---- billing -------------------------------------------------------------
  # The stigmer.billing.* names the Java service emitted. Those whose
  # mechanism the composition still runs are ported under the same names onto
  # its lazy-instrument idiom; every counter whose alert needs a series before
  # its first increment is pre-registered at zero on unit boot. The rest are
  # dropped, each with its reason; stigmer.billing.model_pin.unknown was never
  # billing's — see its note.
  - name: stigmer.billing.pricing.baseline_fallback
    surface: billing
    disposition: ported
    alerts: [pricing-baseline-fallback]
  - name: stigmer.billing.pricing.price_not_found
    surface: billing
    disposition: ported
    alerts: [billing-price-not-found]
    note: >-
      A call whose model the catalog has no entry for. The meter prices nothing, but the catalog's list prices are what every runner's per-run cost cap reads, so a missing entry is a model no run can cap.
  - name: stigmer.billing.service_tier.mismatch
    surface: billing
    disposition: ported
    alerts: [billing-service-tier-mismatch]
  - name: stigmer.billing.thinking.mismatch
    surface: billing
    disposition: ported
    alerts: [billing-thinking-mismatch]
  - name: stigmer.billing.usage.metered_execution
    surface: billing
    disposition: ported
  - name: stigmer.billing.repricing.still_unpriced
    surface: billing
    disposition: dropped
    note: >-
      The meter records what a call was and never a price, so no usage row waits to be repriced; the repricing sweep, this gauge and its alert retired with the price on the record.
  - name: stigmer.billing.auto_recharge.rejected
    surface: billing
    disposition: dropped
    note: >-
      There is no prepaid balance to top up, so no off-session top-up is charged; the counter and its alert retired with auto-recharge.
  - name: stigmer.billing.auto_recharge.late_success_repair
    surface: billing
    disposition: dropped
    note: >-
      There is no prepaid balance to top up, so no off-session top-up is charged; the counter and its alert retired with auto-recharge.
  - name: stigmer.billing.auto_recharge.gate_skipped
    surface: billing
    disposition: dropped
    note: >-
      There is no prepaid balance to top up, so no off-session top-up is charged; the counter retired with auto-recharge.
  - name: stigmer.billing.auto_recharge.reconciled
    surface: billing
    disposition: dropped
    note: >-
      There is no prepaid balance to top up, so no off-session top-up is charged; the counter retired with auto-recharge.
  - name: stigmer.billing.model_pin.unknown
    surface: billing
    disposition: dropped
    note: >-
      Emitted by Java's agentic-domain BOOT CHECK (a channel, schedule or guest model pin the registry no longer knows), never by billing code — it carries the billing prefix only because the registry is billing's. The composition validates model pins at write time in the surfaces that own them (channels/model-pinning.ts; the OSS schedule and agentchannel steps) and has no boot-time sweep to attach the counter to; no alert reads it. A boot check, if one is wanted, belongs to the pin-owning surfaces, not to a billing metric.
