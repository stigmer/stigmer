  - id: billing.stripe.api-version.mismatch-silently-no-ops
    surface: billing
    lane: >-
      stripe.webhook
    behavior: >-
      An otherwise valid checkout.session.completed whose api_version is not stripe-java 32.1.0's pin answers 200 and grants nothing — getObject() deserializes nothing (the api_version trap the fake Stripe documents).
    class: behavior
    disposition: debris
    observability: launcher
    caller: anonymous
    needs: [unfunded-org, fake-stripe]
    note: >-
      Debris: a silent 200 that grants nothing was stripe-java's release-train strictness (getObject() answered empty unless the event's api_version shared the SDK's train), not a behavior of the product — the composition (stripe-node) parses regardless and must not replicate it. The fake stamps the pin on every event so no other row trips on this.
  - id: billing.stripe.customer-updated.syncs-default-payment-method
    surface: billing
    lane: >-
      stripe.customer-updated
    behavior: >-
      customer.updated carrying invoice_settings.default_payment_method makes Java retrieve that payment method (GET /v1/payment_methods/{id}) and record it as the account's default (id, brand, last4, exp_month, exp_year — visible on getBillingAccount); carrying none clears the account's default; a customer Java never minted is a silent 200 with no retrieve.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: anonymous
    needs: [keyless-org, fake-stripe]
    note: >-
      The card it records is the one the plan's invoices are charged to. The fake's card carries exp_month and exp_year (FAKE_CARD).
      The webhook claims the event id before this handler runs; a handler failure marks the claim failed and answers 500, so Stripe's redelivery is admitted again rather than skipped as a duplicate, and every money handler is idempotent underneath the claim.
  - id: billing.stripe.payment-method-attached.sets-default-when-none
    surface: billing
    lane: >-
      stripe.payment-method-attached
    behavior: >-
      payment_method.attached for a card sets it as the account's default ONLY when none is set (a second card does not displace the first) and makes it the customer's default on Stripe (POST /v1/customers/{id} invoice_settings[default_payment_method], once); a method without a card (us_bank_account) and a customer Java never minted are silent 200s with no write.
    class: behavior
    disposition: conformance
    observability: launcher
    caller: anonymous
    needs: [keyless-org, fake-stripe]
    note: >-
      The card it records is the one the plan's invoices are charged to.
      The same claim-then-process admission as customer.updated: a handler failure re-admits the redelivery.
  - id: billing.stripe.payment-intent-succeeded.recharge-provisions-credits
    surface: billing
    lane: >-
      stripe.payment-intent-succeeded
    behavior: >-
      payment_intent.succeeded carrying metadata stigmer_recharge_event_id provisions the recharge's credits exactly once — an auto_recharge_credit ledger entry under idempotency key auto_recharge_<event_id>, the balance up by the recharge amount; the same event replayed or a fresh event for the same recharge grants nothing more; without the metadata (a checkout's intent) or naming a recharge Java never created the event is a silent 200.
    class: behavior
    disposition: debris
    observability: none
    caller: anonymous
    needs: [unfunded-org, fake-stripe]
    note: >-
      Debris: there is no prepaid balance to top up, so no off-session top-up is charged and no PaymentIntent is created; a saved card pays the plan's invoices. The payment_intent.* events are unhandled and acknowledged 200 with no effect (billing.stripe.unhandled-event.ignored-200).
  - id: billing.stripe.payment-intent-failed.recharge-compensated
    surface: billing
    lane: >-
      stripe.payment-intent-failed
    behavior: >-
      payment_intent.payment_failed carrying stigmer_recharge_event_id marks the recharge FAILED and releases its monthly-cap slot (current_month_charged_micros back down by the amount) with no grant; with the recharge no longer pending, the next debit past the threshold triggers a fresh recharge under a new event id.
    class: behavior
    disposition: debris
    observability: none
    caller: anonymous
    needs: [unfunded-org, fake-stripe]
    note: >-
      Debris: there is no prepaid balance to top up, so no off-session top-up is charged and no PaymentIntent is created; a saved card pays the plan's invoices. The payment_intent.* events are unhandled and acknowledged 200 with no effect (billing.stripe.unhandled-event.ignored-200).
  - id: billing.stripe.outbound.idempotency-key-on-recharge-payment-intent
    surface: billing
    lane: >-
      stripe.outbound
    behavior: >-
      The auto-recharge PaymentIntent create carries Idempotency-Key auto_recharge_<event_id> (the event's own key) and the shape Java sends — amount in cents (micros / 10_000), currency usd, the saved payment method, the org's customer, off_session=true, confirm=true, metadata stigmer_org_id / stigmer_recharge_event_id / stigmer_credits_micros — and the month's slot is claimed (current_month_charged_micros) before any money moves.
    class: carve-out
    disposition: debris
    observability: none
    caller: none
    needs: [fake-stripe]
    note: >-
      Debris: there is no prepaid balance to top up, so no off-session top-up is charged and no PaymentIntent is created; a saved card pays the plan's invoices. The payment_intent.* events are unhandled and acknowledged 200 with no effect (billing.stripe.unhandled-event.ignored-200).

  # ===========================================================================
  # BILLING — workers and schedules (Temporal vocabulary is a carve-out)
  # ===========================================================================
  - id: billing.worker.schedule-ids.one-byte-pinned
    surface: billing
    lane: >-
      worker
    behavior: >-
      The billing workers own exactly one Temporal schedule id — billing-subscription-periods — and its byte-pinned workflow type billing/subscription-periods, run on ONE composition-own queue, cloud-billing (the queue is server vocabulary, never a wire artifact). At boot the worker removes the schedules of sweeps it does not run, grant-expiry, reservation-expiry, billing-reconciliation and billing-usage-repricing among them, since a schedule whose workflow no worker serves fails every tick.
    class: carve-out
    disposition: unit
    observability: none
    caller: none
    needs: [none]
    note: >-
      The composition keeps the id (and type) by name; its billing workers' model is the list of record, and its retired-schedule list names what boot removes.
  - id: billing.worker.reservation-expiry.releases-stale-holds
    surface: billing
    lane: >-
      worker
    behavior: >-
      The reservation-expiry sweep releases holds whose executions never settled, restoring the balance.
    class: behavior
    disposition: debris
    observability: none
    caller: none
    needs: [none]
    note: >-
      Debris: no run holds a reservation, so there is no stale hold to release; the worker removes the reservation-expiry schedule at boot (billing.worker.schedule-ids.one-byte-pinned).
  - id: billing.worker.grant-expiry.expires-grants
    surface: billing
    lane: >-
      worker
    behavior: >-
      The grant-expiry sweep removes expired grants from the available balance.
    class: behavior
    disposition: debris
    observability: none
    caller: none
    needs: [none]
    note: >-
      Debris: no organization holds a credit grant, so none expires; the worker removes the grant-expiry schedule at boot (billing.worker.schedule-ids.one-byte-pinned).
  - id: billing.worker.usage-repricing.reprices-price-not-found-rows
    surface: billing
    lane: >-
      worker
    behavior: >-
      The usage-repricing sweep re-rates usage rows recorded with PRICE_NOT_FOUND once a price exists.
    class: behavior
    disposition: debris
    observability: none
    caller: none
    needs: [none]
    note: >-
      Debris: the meter records what a call was and never a price, so no row waits for one; a model the catalog lacks is recorded as it is (billing.rpc.record-llm-call-usage.records-calls-and-unknown-models), and the worker removes the billing-usage-repricing schedule at boot (billing.worker.schedule-ids.one-byte-pinned).
  - id: billing.worker.reconciliation.detects-drift
    surface: billing
    lane: >-
      worker
    behavior: >-
      The billing reconciliation sweep is the money-IN backstop: a PENDING credit purchase older than the stale threshold is settled from its Stripe Checkout Session (complete+paid grants under the webhook's own key, expired marks expired, open is left; one with no session is marked failed past the orphan threshold), and a PENDING auto-recharge event is settled from its PaymentIntent or re-driven under its original idempotency key (compensated past the 20 h ceiling or without a saved card).
    class: behavior
    disposition: debris
    observability: none
    caller: none
    needs: [none]
    note: >-
      Debris: no credit is sold and no top-up is charged, so there is no pending purchase or top-up for the backstop to settle from Stripe; the worker removes the billing-reconciliation schedule at boot (billing.worker.schedule-ids.one-byte-pinned).

