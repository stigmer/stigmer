    observability: launcher
    caller: primary
    needs: [workflow-execution]
    note: >-
      Debris: the lane has no caller. CLAIMCHECK_ENABLED is set in no sandbox manifest, and the runner's claimcheck codec presigns through the ARTIFACTS lane with a claimcheck/ key prefix that lane rejects (stigmer#992). The composition does not carry it; the controller retired with Java.
