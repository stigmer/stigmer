  - id: proxy.edge.unknown-path-denied
    surface: proxy
    lane: >-
      llm
    behavior: >-
      A request to a path outside the declared lanes (e.g. /actuator, /v1/other) is denied by the edge (denyAll) rather than reaching a controller.
    class: adversarial
    disposition: conformance
    observability: launcher
    caller: anonymous
    needs: [none]
  - id: proxy.authorization.decision-cache-five-minutes
    surface: proxy
    lane: >-
      llm
    behavior: >-
      Proxy authorization decisions are cached per identity/permission/resource for five minutes — a grant revoked after a successful call keeps succeeding until the cache expires.
    class: behavior
    disposition: debris
    observability: launcher
    caller: primary
    needs: [agent-execution]
    note: >-
      Debris as a row — a latency-only divergence. The composition keeps a short ALLOW-only decision cache as implementation; DENY caching is not carried, so a fresh grant takes effect on the next call rather than up to five minutes later.

