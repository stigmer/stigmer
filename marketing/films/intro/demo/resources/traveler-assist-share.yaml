# Hosted-chat web channel for traveler-assist — scene 4's "same agent,
# everywhere" beat: the share link (S4e) and the Meridian page embed
# (S4d) both ride this channel. The embed page is served by
# embed/serve.mjs on localhost:4173.
apiVersion: agentic.stigmer.ai/v1
kind: Channel
# The /chat/... link and the <stigmer-agent share="..."> attribute name the
# channel by its id, which the seed records (channel-id.mjs). The channel
# carries the agent's own slug, so `stigmer share agent` edits this channel
# rather than making another (kinds have separate slug namespaces).
metadata:
  name: traveler-assist
  org: meridian-travel
spec:
  agent_ref:
    kind: agent
    slug: traveler-assist
  enabled: true
  web:
    # Org audience: on the OSS single-user stack the public-audience guest
    # path (guest mint / public profile RPCs) is cloud-only, while the
    # org-audience hosted page rides the trusted-local identity.
    audience: channel_audience_org
    allowed_origins:
      - http://localhost:4173
