# Meridian Travel's operations MCP server — flight search and rebooking.
#
# The server is a real stdio process (mcp/meridian-ops.mjs, spawned by the
# Stigmer runner). __MERIDIAN_DEMO_DIR__ is substituted with the demo's
# absolute path by seed.mjs at apply time.
apiVersion: agentic.stigmer.ai/v1
kind: McpServer
metadata:
  name: meridian-ops
  org: meridian-travel
spec:
  description: "Meridian Travel operations: search flights and manage bookings"
  tags:
    - travel
    - bookings
  stdio:
    command: node
    args: [meridian-ops.mjs]
    working_dir: __MERIDIAN_DEMO_DIR__/mcp

# Rebooking moves real money, so it always stops for a human: the server
# marks rebook_booking destructive (MCP annotation destructiveHint: true,
# mcp/meridian-ops.mjs), and Stigmer asks before any tool so marked.
