# Stigmer self-host compose stack.
#
#   cp .env.example .env   # fill in the three required values (see the file)
#   docker compose up -d
#   open http://localhost:7234
#
# Topology — four long-running services on one Postgres instance, and two
# Temporal setup steps that run to completion on every boot:
#   postgres        one instance, three databases: `stigmer` (the app, created
#                   by POSTGRES_DB), plus `temporal` + `temporal_visibility`
#                   (created by temporal-schema). One container, one volume,
#                   one backup story.
#   temporal-schema creates Temporal's two databases and brings their
#                   schemas to the server's version, then exits.
#   temporal        a real Temporal server (temporalio/server), NOT the CLI's
#                   dev-server binary.
#   temporal-namespace registers Temporal's `default` namespace, then exits;
#                   the two Stigmer services start only after it has.
#   stigmer-server  the control plane + web console + artifact file server.
#   stigmer-runner  the execution worker (agent runs). stdio MCP
#                   servers spawn INSIDE this container — they can reach this
#                   container's filesystem and network, not your host's.
#
# One trust domain: every agent the runner runs shares its user, its
# workspace root and its network, and every service on this network, the
# runner's own tools included, can reach Temporal, which authenticates
# nothing here. That is right for one organization, which is what this stack
# serves. The tenant boundary on a self-hosted install is a sandbox driver
# (SANDBOX_PROVISIONER_TYPE): each sandboxed runner serves one session and
# reaches Temporal only through the Stigmer server. Temporal's port is not
# published to the host. For a Temporal outside this boundary, use the Helm
# chart with an authenticated external Temporal (externalTemporal.tls,
# externalTemporal.apiKey).
#
# Image pins: the STIGMER_VERSION default below is bumped in the release
# commit the tag is cut from (`make release` and the release procedure refuse
# to tag without it, alongside the other release pins); release.npm-libs
# then proves the pinned images with the compose smoke on both
# architectures. Override in .env to run a different released version.
#
# The env blocks below set every load-bearing variable EXPLICITLY, even
# where the image default would coincide — two independent defaults
# agreeing by luck is not a contract (the client-apps/cli daemon's
# components.ts discipline, applied to compose).

# The ONE runner task queue: the server dispatches to it and the runner
# polls it, both from this anchor, so the two can never drift.
x-runner-task-queue: &runner-task-queue "stigmer_runner"

# The artifact root. The server WRITES artifacts here and the runner READS
# them from the same named volume (stigmer/stigmer#285's local pattern,
# ported: filesystem sharing is the contract, not HTTP). The path is the
# daemon's ~/.stigmer/data/artifacts layout under the containers' HOME=/data.
x-artifacts-path: &artifacts-path "/data/.stigmer/data/artifacts"

# Where artifact download URLs point. These URLs are minted for HOST-side
# consumers (your browser, the CLI), so they use the host-published port —
# NOT the in-network address. Serving this stack to other machines? Set
# STIGMER_ARTIFACT_PUBLIC_URL in .env to the address they reach the artifact
# lane on (the chart's server.artifactPublicUrl); the default is the
# single-machine posture.
x-artifact-serve-url: &artifact-serve-url "${STIGMER_ARTIFACT_PUBLIC_URL:-http://localhost:7235}"

services:
  postgres:
    # An exact minor release, never the floating `16`; the chart's
    # postgres.image is the same tag (its parity test holds the two equal).
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing — copy .env.example to .env and fill it in}
      # The app database. temporal-schema creates Temporal's own two
      # (`temporal`, `temporal_visibility`) on this same instance at first
      # boot.
      POSTGRES_DB: stigmer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Temporal's two databases and their schemas: the steps Temporal's retired
  # all-in-one auto-setup image ran before its server. Every step is safe to
  # repeat: `create` accepts a database that exists, `setup-schema -v 0.0`
  # never lowers a recorded version, and `update-schema` applies only the
  # versions a database lacks. So every boot runs it, and leaves a current
  # schema as it is, and a failed attempt is retried for a minute. The
  # password reaches the tool as SQL_PASSWORD, never on a command line. The chart runs the same script as an init container of
  # the Temporal pod, and its parity test holds the two equal ($$ is
  # compose-escaping for a literal $).
  temporal-schema:
    # Temporal's setup tools at the server's own version; the parity test
    # holds every Temporal image here to one version, so they move together.
    image: temporalio/admin-tools:1.32.2
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: postgres
      SQL_PORT: "5432"
      SQL_USER: postgres
      SQL_PASSWORD: ${POSTGRES_PASSWORD:?missing — copy .env.example to .env and fill it in}
    command:
      - sh
      - -c
      - |
        set -u
        schema=/etc/temporal/schema/postgresql/v12
        setup() {
          for pair in temporal:temporal temporal_visibility:visibility; do
            db=$${pair%%:*}
            dir=$${pair##*:}
            temporal-sql-tool --db "$$db" create &&
              temporal-sql-tool --db "$$db" setup-schema -v 0.0 &&
              temporal-sql-tool --db "$$db" update-schema -d "$$schema/$$dir/versioned" ||
              return 1
          done
        }
        # Connections can fail for a few seconds after Postgres or this step starts,
        # while the network settles (seen on a reinstall onto kept disks). The
        # sequence is safe to repeat, so it is retried for a minute before failing.
        deadline=$$(( $$(date +%s) + 60 ))
        until setup; do
          if [ "$$(date +%s)" -ge "$$deadline" ]; then
            echo "temporal-schema: gave up after a minute of failed attempts" >&2
            exit 1
          fi
          echo "temporal-schema: an attempt failed; retrying in 3s" >&2
          sleep 3
        done

  temporal:
    image: temporalio/server:1.32.2
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    # The server reads its configuration from these variables, through the
    # template built into its image.
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?missing — copy .env.example to .env and fill it in}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/dynamic-config.yaml
    configs:
      - source: temporal-dynamic-config
        target: /etc/temporal/config/dynamicconfig/dynamic-config.yaml
    # No healthcheck: the server image carries no client to probe with, and
    # readiness is temporal-namespace's to say.

  # Registers the `default` namespace the Stigmer services use, with the
  # retention auto-setup gave it (24h), once the server answers. It exits 0
  # only when the namespace can be described, so its completion means what
  # this stack's readiness has always meant: a server that connects before
  # the namespace exists fails its Temporal worker creation without a later
  # retry (stigmer#904; its health monitor watches connection health, which
  # is green). It gives up after four minutes with a line naming what it
  # waited for. The chart runs the same script in a container of the
  # Temporal pod and reports the pod Ready from it.
  temporal-namespace:
    image: temporalio/admin-tools:1.32.2
    restart: "no"
    depends_on:
      temporal:
        condition: service_started
    environment:
      # The temporal CLI's own variable for the server it dials.
      TEMPORAL_ADDRESS: temporal:7233
    command:
      - sh
      - -c
      - |
        set -u
        deadline=$$(( $$(date +%s) + 240 ))
        wait_until() {
          what=$$1
          shift
          until "$$@" >/dev/null 2>&1; do
            if [ "$$(date +%s)" -ge "$$deadline" ]; then
              echo "temporal-namespace: gave up waiting for $$what at $$TEMPORAL_ADDRESS" >&2
              exit 1
            fi
            sleep 2
          done
        }
        serving() { temporal operator cluster health | grep -q SERVING; }
        wait_until "the server to answer SERVING" serving
        if ! temporal operator namespace describe -n default >/dev/null 2>&1; then
          temporal operator namespace create -n default --retention 24h || true
        fi
        wait_until "the default namespace" temporal operator namespace describe -n default
        echo "temporal-namespace: the default namespace is registered"

  stigmer-server:
    image: ghcr.io/stigmer/stigmer-server:${STIGMER_VERSION:-v0.1.3}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Completed = the default namespace exists (see temporal-namespace):
      # the server's worker creation needs the namespace, and its health
      # monitor does not re-run it on a healthy connection.
      temporal-namespace:
        condition: service_completed_successfully
    ports:
      # 7234: the unified port — gRPC, Connect, the web console.
      # 7235: the artifact file server (downloads); a separate listener by
      #       design, bound 0.0.0.0 inside the container (the image sets
      #       ARTIFACT_HTTP_HOST and GRPC_HOST; the laptop tier keeps its
      #       loopback default).
      # Published on the host's loopback: until .env names an issuer, the
      # server signs nobody in and every caller is the operator, and on
      # Linux a host firewall does not filter ports Docker publishes. Set
      # STIGMER_PUBLISH_ADDRESS=0.0.0.0 only after configuring sign-in.
      - "${STIGMER_PUBLISH_ADDRESS:-127.0.0.1}:7234:7234"
      - "${STIGMER_PUBLISH_ADDRESS:-127.0.0.1}:7235:7235"
    environment:
      GRPC_PORT: "7234"
      # Non-empty DATABASE_URL selects the Postgres driver; the
      # image's sqlite path is the single-container `docker run` tier. It
      # names the user and the address only: node-postgres reads
      # PGDATABASE and PGPASSWORD when the URL carries neither, so no
      # character in the password can break the URL.
      DATABASE_URL: postgres://postgres@postgres:5432
      PGDATABASE: stigmer
      PGPASSWORD: ${POSTGRES_PASSWORD:?missing — copy .env.example to .env and fill it in}
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_AGENT_EXECUTION_RUNNER_TASK_QUEUE: *runner-task-queue
      ARTIFACT_STORAGE_TYPE: local
      ARTIFACT_LOCAL_BASE_PATH: *artifacts-path
      ARTIFACT_LOCAL_SERVE_URL: *artifact-serve-url
      # Skill push/download capability URLs are host-consumed too (the CLI
      # and SDKs); same reasoning as the artifact serve URL. Behind a TLS
      # proxy, STIGMER_PUBLIC_URL in .env is the address clients reach the
      # API on (the chart's server.publicUrl).
      SKILL_TRANSFER_BASE_URL: "${STIGMER_PUBLIC_URL:-http://localhost:7234}"
      # Explicit keys, loud fail: the server would otherwise
      # auto-generate keys into the volume, making the backup/rotation
      # story invisible exactly where self-hosters need it explicit.
      STIGMER_ENCRYPTION_KEY: ${STIGMER_ENCRYPTION_KEY:?missing — copy .env.example to .env and fill it in}
      STIGMER_RUNNER_TOKEN_KEY: ${STIGMER_RUNNER_TOKEN_KEY:?missing — copy .env.example to .env and fill it in}
      # Optional: signs the user tokens a service account mints when
      # authentication is on (see .env.example); generated into the volume when unset.
      STIGMER_PLATFORM_TOKEN_KEY: ${STIGMER_PLATFORM_TOKEN_KEY:-}
      # Optional operator identity for audit attribution (see .env.example).
      STIGMER_OPERATOR_EMAIL: ${STIGMER_OPERATOR_EMAIL:-}
      STIGMER_OPERATOR_NAME: ${STIGMER_OPERATOR_NAME:-}
      # Authentication, off until .env sets it (see .env.example). The
      # issuer is THE switch: the server treats an empty value as unset,
      # refuses an issuer without an audience at boot, and warns when the
      # console's or the desktop app's client id is missing. The same four
      # as the chart's
      # server.oidc.{issuer,audience,consoleClientId,nativeClientId}.
      STIGMER_OIDC_ISSUER: ${STIGMER_OIDC_ISSUER:-}
      STIGMER_OIDC_AUDIENCE: ${STIGMER_OIDC_AUDIENCE:-}
      STIGMER_OIDC_CONSOLE_CLIENT_ID: ${STIGMER_OIDC_CONSOLE_CLIENT_ID:-}
      STIGMER_OIDC_NATIVE_CLIENT_ID: ${STIGMER_OIDC_NATIVE_CLIENT_ID:-}
      # Where your people ask for help, off until .env sets it (see
      # .env.example). The chart's server.help.{url,label}.
      STIGMER_HELP_URL: ${STIGMER_HELP_URL:-}
      STIGMER_HELP_LABEL: ${STIGMER_HELP_LABEL:-}
    volumes:
      # Server state beyond Postgres: the skill content store
      # (~/.stigmer/storage) and anything else under the image's HOME=/data.
      - server-data:/data
      # The shared artifact root — the same named volume the runner mounts.
      - type: volume
        source: artifacts
        target: *artifacts-path
    # Healthcheck comes from the image (Connect-JSON health probe); the
    # runner's depends_on gates on it.

  stigmer-runner:
    image: ghcr.io/stigmer/stigmer-runner:${STIGMER_VERSION:-v0.1.3}
    restart: unless-stopped
    depends_on:
      stigmer-server:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      # local mode: stdio MCP servers are allowed (they spawn inside this
      # container — see the header) and the LangGraph checkpointer uses its
      # durable sqlite saver under HOME.
      MODE: local
      STIGMER_BACKEND_ENDPOINT: http://stigmer-server:7234
      # The address a remote MCP server dials back on: the one clients reach
      # the API on (the server's SKILL_TRANSFER_BASE_URL, the chart's
      # server.publicUrl). The runner fills a declared STIGMER_SERVER_ADDRESS
      # from it; the in-network address above reaches no one outside.
      STIGMER_MCP_PUBLIC_ENDPOINT: "${STIGMER_PUBLIC_URL:-http://localhost:7234}"
      TEMPORAL_SERVICE_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      STIGMER_TASK_QUEUE: *runner-task-queue
      # The daemon's ~/.stigmer/data/workspace layout under HOME=/data —
      # agent workspaces live on the runner-data volume with the session
      # state.
      WORKSPACE_ROOT_DIR: /data/.stigmer/data/workspace
      # The agent user's home, on the same volume as the runner's state, so
      # a paused session's checkpoints and approvals persist the same.
      STIGMER_AGENT_HOME: /data/agent
      ARTIFACT_STORAGE_TYPE: local
      LOCAL_ARTIFACT_PATH: *artifacts-path
      # LLM provider keys (optional at boot; agent executions need one —
      # see .env.example). ANTHROPIC_BASE_URL sends Anthropic calls to a gateway in
      # front of Anthropic instead; empty means Anthropic's own address.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # The runner's own API key (the chart's runner.stigmerToken); an empty
      # value reads as unset, and the authentication guide says when to set
      # it. Each run the runner serves is attributed to the member who
      # started it, not to this key's holder.
      STIGMER_TOKEN: ${STIGMER_TOKEN:-}
    # The runner starts the agent's side as its own user, stigmer-agent, so
    # nothing an agent runs can read the keys above. It keeps only the five
    # capabilities that takes, as the Helm chart's runner does, DAC_OVERRIDE
    # among them for the artifact volume, which is the server's user's.
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "CHOWN", "KILL", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      # Runner state (HITL/pause checkpoints, session dirs, workspaces)
      # lives under HOME=/data — on a volume so in-flight paused sessions
      # survive container recreation, the durability the laptop tier gets
      # from the user's own disk. Lifecycle state, not backup state: the
      # complete backup is postgres-data + artifacts + server-data + .env.
      - runner-data:/data
      - type: volume
        source: artifacts
        target: *artifacts-path

# The Temporal server refuses to start without a dynamic-config file, and its
# image ships none. This one is empty on purpose: Temporal's defaults are this
# stack's settings. A Temporal setting this stack ever needs goes here, under
# Temporal's own dynamic-config key, and the chart's <release>-temporal
# ConfigMap carries the same text (its parity test holds the two equal).
# Compose interpolates this text, so it carries no dollar sign. Inline content
# needs Docker Compose 2.23.1 or newer.
configs:
  temporal-dynamic-config:
    content: |
      # Temporal dynamic config. Empty: every setting is Temporal's default.

volumes:
  postgres-data:
  server-data:
  runner-data:
  artifacts:
