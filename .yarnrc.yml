# Yarn (Berry) config for building the workspace libs FROM SOURCE.
#
# Production/CI install + publish via npm (`npm ci`, scripts/publish-libs.mjs) and
# do NOT read this file. It only affects contributors/integrators who build the
# SDKs from a clean clone with yarn (the fast loop external integrators use to
# consume `main` without waiting on the npm publish cycle). See issue #156.

# Keep the classic node_modules layout (not PnP) so the existing build/test
# tooling and the apis/stubs/ts workspace symlinks work unchanged.
nodeLinker: node-modules

# @testing-library/react@16 re-exports `screen`/`fireEvent`/`waitFor` from its
# `@testing-library/dom` PEER. npm auto-installs that peer, but Yarn Berry does
# not, so the @stigmer/react lib build (which type-checks its __tests__) fails
# under yarn only. Inject the peer as a dependency for yarn installs. This is a
# yarn-only resolution hint; it changes no published package and no npm lockfile.
packageExtensions:
  "@testing-library/react@*":
    dependencies:
      "@testing-library/dom": "^10.4.1"
