apiVersion: agentic.stigmer.ai/v1
kind: Workflow
metadata:
  name: multi-step-example
  labels:
    category: tutorial
    complexity: intermediate
spec:
  description: Comprehensive example demonstrating multiple task types, flow control, and data exports
  document:
    dsl: "1.0.0"
    namespace: examples
    name: multi-step
    version: "1.0.0"
  tasks:
    - name: initialize_context
      kind: set_vars
      task_config:
        variables:
          workflow_label: "multi-step-example"
          started_at: "${ now }"
          environment: "production"
      export:
        as: "${ . }"
      flow:
        then: fetch_data

    - name: fetch_data
      kind: http_call
      task_config:
        method: GET
        endpoint:
          uri: "https://api.example.com/data"
        headers:
          Content-Type: "application/json"
          X-Workflow-Label: "${ $context.initialize_context.workflow_label }"
      export:
        as: "${ .response }"
      flow:
        then: process_with_agent

    - name: process_with_agent
      kind: agent_call
      task_config:
        agent: data-processor
        message: "Process this data: ${ $context.fetch_data.response }"
      export:
        as: "${ .processed }"
      flow:
        then: conditional_wait

    - name: conditional_wait
      kind: wait
      task_config:
        duration:
          seconds: 5
      flow:
        then: validate_results

    - name: validate_results
      kind: agent_call
      task_config:
        agent: validator
        message: "Validate processing results: ${ $context.process_with_agent.processed }"
      export:
        as: "${ .validation }"
      flow:
        then: store_results

    - name: store_results
      kind: http_call
      task_config:
        method: POST
        endpoint:
          uri: "https://api.example.com/results"
        headers:
          Content-Type: "application/json"
        body:
          workflow_label: "${ $context.initialize_context.workflow_label }"
          processed_data: "${ $context.process_with_agent.processed }"
          validation: "${ $context.validate_results.validation }"
          completed_at: "${ now }"
      export:
        as: "${ . }"
      flow:
        then: end
