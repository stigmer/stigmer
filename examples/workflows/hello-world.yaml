apiVersion: agentic.stigmer.ai/v1
kind: Workflow
metadata:
  name: hello-world
spec:
  description: A minimal workflow to get started with Stigmer workflows
  document:
    dsl: "1.0.0"
    namespace: examples
    name: hello-world
    version: "1.0.0"
  tasks:
    - name: set_greeting
      kind: set_vars
      task_config:
        variables:
          greeting: "Hello, World!"
          timestamp: "${ now }"
      export:
        as: "${ . }"
