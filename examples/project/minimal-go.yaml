# Minimal Stigmer Project Configuration
#
# This is the simplest valid stigmer.yaml - perfect for getting started.
# Place this file at the root of your project directory alongside your entry_point.

apiVersion: tenancy.stigmer.ai/v1
kind: Project

metadata:
  # Project name must be unique within your organization.
  # Use lowercase letters, numbers, and hyphens. Must start with a letter.
  # Valid: "data-pipeline", "api-gateway", "ml-trainer"
  # Invalid: "Data_Pipeline", "123-project", "my project"
  name: minimal-project
  
  # Organization slug or ID. The project will be deployed to this organization.
  # You can override this with --org flag or CLI context.
  org: my-org

spec:
  # Entry point file for SDK synthesis. The runtime is inferred from the
  # extension (.go -> Go, .py -> Python, .ts/.js/.mts/.mjs -> Node); there is no
  # separate `runtime` field.
  #
  # NOTE: the Go SDK synthesis library is a planned follow-up. Today only the
  # TypeScript SDK (@stigmer/sdk/synth) can author an entry point end to end —
  # see ../typescript-quickstart for a runnable example. This file illustrates
  # the project *configuration* shape.
  entry_point: main.go

  # Optional: Human-readable description of what this project does.
  description: Minimal Go project showing essential configuration

# What happens when you run 'stigmer apply':
# 1. CLI finds this stigmer.yaml (walks up from current directory)
# 2. CLI validates the configuration (schema + cross-field rules)
# 3. CLI executes your entry_point (e.g., go run main.go)
# 4. Your SDK code generates resource manifests (agents, workflows, etc.)
# 5. CLI sends manifests to backend for reconciliation
# 6. Backend creates/updates/deletes resources to match your desired state
#
# This is Project Track - SDK synthesis with automatic reconciliation.
# For quick experiments with individual resources, use Atomic Track:
#   stigmer apply -f agent.yaml
#   stigmer apply -f workflow.yaml
