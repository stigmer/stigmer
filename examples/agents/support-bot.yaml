apiVersion: agentic.stigmer.ai/v1
kind: Agent
metadata:
  name: support-bot
  labels:
    team: customer-success
    environment: production
spec:
  description: Customer support agent that answers questions and checks GitHub for known problems
  instructions: |
    You are a helpful customer support agent for a SaaS company.

    Your responsibilities:
    - Answer customer questions politely and accurately
    - Check GitHub issues for known problems
    - Escalate complex issues to human support
    - Provide links to documentation when relevant

    Be concise but friendly. Always verify information before responding.

  # The plugins this agent uses, each whole: its skills, agents, hooks and
  # MCP servers. Install them first (examples/README.md).
  plugins:
    # GitHub's MCP server, for repositories and issues
    - kind: plugin
      slug: github
    # Slack's MCP server, to post to the support channel when escalating
    - kind: plugin
      slug: slack
    # hookify's hooks run around every tool call: a hook can refuse a call,
    # ask a person first, or let it run.
    - kind: plugin
      slug: hookify

  # Only these tools: reading, two GitHub lookups, and Slack. No shell
  # commands and no file writes. A plugin's MCP server is named
  # plugin_<plugin>_<server>.
  tools:
    - Read
    - Grep
    - mcp__plugin_github_github__search_issues
    - mcp__plugin_github_github__get_issue
    - mcp__plugin_slack_slack
