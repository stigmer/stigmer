apiVersion: agentic.stigmer.ai/v1
kind: Agent
metadata:
  name: release-notes
spec:
  description: Writes release notes from the pull requests merged since the last release
  instructions: |
    You write release notes. Read the pull requests merged since the last
    release tag, group them into features, fixes and internal changes, and
    write one plain sentence per change for the people who use the product.
    Link each sentence to its pull request. Report the notes back; do not
    publish them.

  # Its own plugin: as a subagent it works as itself and does not borrow
  # the tools of the agent that hands it work.
  plugins:
    - kind: plugin
      slug: github

  # Reading and GitHub's server only: no shell commands and no file writes.
  tools:
    - Read
    - Grep
    - mcp__plugin_github_github
