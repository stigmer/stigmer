apiVersion: agentic.stigmer.ai/v1
kind: Agent
metadata:
  name: issue-triage
  labels:
    team: engineering
spec:
  description: Triages new Linear issues by reading them and suggesting a team, a priority and a label
  instructions: |
    You triage new issues in Linear.

    For each issue you are asked about:
    - Read the issue and any linked issues
    - Suggest the team that should own it, a priority, and a label
    - Point out a likely duplicate when you find one
    - Explain your suggestion in two or three sentences

    Change nothing in Linear unless you are asked to.

  # An MCP server written in the agent itself, instead of in a plugin: Linear's
  # hosted server. Only an organization admin may apply an agent with a server
  # of its own. With no Authorization header, a run logs in with the sign-in
  # saved at the server's address: sign in once with "Sign in" on the server's
  # row in the agent's MCP servers section (examples/README.md).
  mcp_servers:
    - name: linear
      url: https://mcp.linear.app/mcp

  # Only these tools: reading, and the linear server. An agent's own server is
  # named mcp__<server>, without the plugin_ part. Linear's tools that change an
  # issue ask a person first when the server marks them destructive.
  tools:
    - Read
    - mcp__linear
