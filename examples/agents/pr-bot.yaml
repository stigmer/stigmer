apiVersion: agentic.stigmer.ai/v1
kind: Agent
metadata:
  name: pr-bot
spec:
  description: Reviews pull requests and prepares releases
  instructions: |
    You review pull requests and prepare releases. When someone asks for
    release notes, hand the work to the release-notes subagent and pass its
    notes on.

  plugins:
    - kind: plugin
      slug: github

  # Agent lets it hand work to its subagents.
  tools:
    - Read
    - Grep
    - Agent
    - mcp__plugin_github_github

  # Saved agents it may hand work to. Apply release-notes first: saving
  # pr-bot pins it to release-notes' latest version, and pr-bot keeps that
  # version until it is saved again.
  subagents:
    - kind: agent
      slug: release-notes
