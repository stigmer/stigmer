# =============================================================================
# Website Release
# =============================================================================
# Builds and deploys stigmer.ai to GitHub Pages.
# =============================================================================

name: release.website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "vale/**"
      - ".github/workflows/release.website.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  pages-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install npm dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Install Vale
        run: make install-vale

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          make build-site
          if [ -f site/out/index.html ] && [ ! -f site/out/404.html ]; then
            cp site/out/index.html site/out/404.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
