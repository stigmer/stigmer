# =============================================================================
# Website Release
# =============================================================================
# Builds stigmer.ai once (build.website.yaml) and deploys that export to the
# Cloudflare Worker `stigmer-website` (site/wrangler.jsonc). The Worker has no
# address of its own: the router in front of stigmer.ai hands it the apex
# through a service binding, and answers www and each pull request's review
# site itself.
#
# The build holds no key. The Cloudflare job installs only the pinned wrangler
# in site/deploy and deploys the artifact with a key that reaches
# `stigmer-website` alone, from the GitHub environment `website`, which only
# main may use.
#
# GitHub Pages receives the same export until stigmer.ai is served by the
# Worker; its two jobs leave with the Pages site.
#
# Pull requests get their own review sites (preview.website.yaml builds,
# publish.website-preview.yaml uploads).
# =============================================================================

name: release.website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "brand/**"
      - "docs/**"
      - "demos/**"
      - "vale/**"
      # What the site and the demo tours link and the build compiles from
      # source (build:libs, then the site and the tour bundles), so a change to
      # one reaches stigmer.ai with its merge (scripts/lane-triggers.test.mjs
      # fails when one is missing). preview.website.yaml keeps the same list.
      - "apis/stubs/ts/**"
      - "sdk/typescript/**"
      - "sdk/react/**"
      - "sdk/theme/**"
      - "sdk/embed/**"
      - "backend/libs/ts/plugin-package/**"
      - "backend/libs/ts/eval-runtime/**"
      - "backend/libs/ts/session-log/**"
      - "backend/libs/ts/tool-vocabulary/**"
      - ".github/workflows/build.website.yaml"
      - ".github/workflows/release.website.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A deploy is never cut short: a newer merge waits and then deploys its own export.
  group: release.website
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.website.yaml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: website
      url: https://stigmer.ai
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Only the Worker's config and the deploy tool's lockfile: nothing of the website runs here.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            site/wrangler.jsonc
            site/deploy
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          package-manager-cache: false
          node-version-file: ".nvmrc"

      # Before the export is on disk, so nothing of it is near the install.
      - name: Install wrangler
        working-directory: site/deploy
        run: npm ci --no-audit --no-fund

      - name: Download the export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-out
          path: site/out

      - name: Check wrangler reads the whole export
        working-directory: site/deploy
        run: bash check-export-read.sh --env=""

      - name: Deploy stigmer-website
        working-directory: site/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler deploy --config ../wrangler.jsonc --env="" --message "main ${GITHUB_SHA::12}"

  pages-build:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-out
          path: site/out

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/out

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deploying to Pages needs the Pages write and an OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
