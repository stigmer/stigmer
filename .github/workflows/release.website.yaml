# =============================================================================
# Website Release
# =============================================================================
# Builds and deploys stigmer.ai to GitHub Pages.
# =============================================================================

name: release.website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "demos/**"
      - "vale/**"
      - ".github/workflows/release.website.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  pages-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Install npm dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      # scenar shoot renders docs stills from the packed bundles in a real
      # Chromium (pack-all shoots only the tours that declare a `shot`).
      # --with-deps pulls the system libraries headless Chromium needs on
      # the runner. The npm packages themselves arrived with `npm ci` above.
      #
      # BOTH playwright installations are provisioned on purpose. The repo
      # carries two versions — the root's (for e2e) and demos' — and each
      # pins a DIFFERENT Chromium build (1.60 -> 1223, 1.62 -> 1234). The
      # build that must exist is the one belonging to whichever playwright
      # `@scenar/cli` imports, and that is decided by npm's hoisting, not by
      # us: @scenar/cli sat in demos/node_modules at 0.9.0 and hoisted to the
      # root at 0.9.1, silently flipping the answer and breaking this step
      # (2026-07-29). Installing both makes the step correct under either
      # layout. The real fix is to run one playwright version repo-wide;
      # until then, do not "optimize" this back to a single install.
      - name: Install Playwright Chromium (demos)
        run: npm exec --workspace @stigmer/demos -- playwright install --with-deps chromium

      - name: Install Playwright Chromium (root)
        run: npx playwright install --with-deps chromium

      # Scenar product tours ship with the site: pack every tour in demos/
      # into a static embed bundle, served below at stigmer.ai/demos/<tour>/,
      # then shoot stills for shot-declaring tours (served from
      # stigmer.ai/demos/<tour>/stills/, referenced by docs <Still> tags).
      # Tours consume the in-repo @stigmer/* source, so the embeds always
      # depict the components this deploy ships.
      - name: Pack demo tours and shoot stills
        run: npm run pack-all -w @stigmer/demos

      - name: Install Vale
        run: make install-vale

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          make build-site
          if [ -f site/out/index.html ] && [ ! -f site/out/404.html ]; then
            cp site/out/index.html site/out/404.html
          fi

      - name: Add demo tour bundles to the site
        run: |
          mkdir -p site/out/demos
          cp -R demos/.bundles/. site/out/demos/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
