# =============================================================================
# Integration Tests (Provider-Backed)
# =============================================================================
# Provider integration tests that make real API calls to LLM providers and
# Cursor. These are MANUAL-ONLY (workflow_dispatch).
#
# Tests exercise:
#   - llm_call: direct LLM API calls via workflow-runner (cheap, ~$0.001/test)
#   - agent_call: full pipeline through Java + Python agent-runner (~$0.01/test)
#   - session-routing Tier 3: full E2E via Cursor SDK
#
# Cost: under $0.10 per full run with claude-sonnet-4-6.
#
# Secrets: ANTHROPIC_API_KEY and CURSOR_API_KEY from "provider-integration".
# =============================================================================

name: ci.integration-providers

on:
  workflow_dispatch:
    inputs:
      cloud_ref:
        description: "stigmer-cloud git ref to build the service JAR from"
        required: false
        type: string
        default: "main"

concurrency:
  group: integration-providers-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  build-service-jar:
    name: Build Service JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stigmer-cloud
        uses: actions/checkout@v4
        with:
          repository: stigmer/stigmer-cloud
          ref: ${{ inputs.cloud_ref || 'main' }}
          path: stigmer-cloud
          token: ${{ secrets.STIGMER_CLOUD_TOKEN }}

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: integration-jar
          repository-cache: true

      - name: Build fat JAR
        working-directory: stigmer-cloud
        run: ./bazelw build //backend/services/stigmer-service:stigmer_service_fatjar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: stigmer-service-jar
          path: stigmer-cloud/bazel-bin/backend/services/stigmer-service/stigmer_service_fatjar.jar
          retention-days: 1
          if-no-files-found: error

  integration-tests:
    name: Provider Integration Tests
    runs-on: ubuntu-latest
    needs: build-service-jar
    timeout-minutes: 15
    environment: provider-integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download service JAR
        uses: actions/download-artifact@v4
        with:
          name: stigmer-service-jar
          path: .artifacts

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Temporal CLI
        uses: temporalio/setup-temporal@v0

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.1

      - name: Install agent-runner dependencies
        working-directory: backend/services/agent-runner
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run provider integration tests
        env:
          STIGMER_SERVICE_JAR: ${{ github.workspace }}/.artifacts/stigmer_service_fatjar.jar
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make test-integration-providers

      - name: Run session routing provider tests
        if: always()
        env:
          STIGMER_SERVICE_JAR: ${{ github.workspace }}/.artifacts/stigmer_service_fatjar.jar
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: make test-integration-session-routing-providers

      - name: Generate flake report
        if: always()
        run: |
          REPORT_DIR=test/integration/.test-output-providers
          if [ -f "$REPORT_DIR/test-output.json" ]; then
            cd test/integration && GOWORK=off go run ./tools/flaketrack report \
              --json "$(pwd)/.test-output-providers/test-output.json" \
              --rerun-report "$(pwd)/.test-output-providers/rerun-report.txt" \
              --quarantine "$(pwd)/quarantine.json" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload provider test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-integration-results
          path: test/integration/.test-output-providers/
          retention-days: 30

      - name: Upload session routing provider results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-routing-provider-results
          path: test/integration-session-routing/.test-output-session-routing-providers/
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish provider test report
        if: always() && hashFiles('test/integration/.test-output-providers/junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Provider Integration Test Report
          path: test/integration/.test-output-providers/junit.xml
          reporter: java-junit

      - name: Publish session routing provider test report
        if: always() && hashFiles('test/integration-session-routing/.test-output-session-routing-providers/junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Session Routing Provider Test Report
          path: test/integration-session-routing/.test-output-session-routing-providers/junit.xml
          reporter: java-junit
