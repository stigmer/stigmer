# =============================================================================
# TypeScript SDK typecheck gate: sdk/typescript + mcp-server + sdk/react +
# sdk/ink + client-apps/cli (issue #632), plus test/conformance (issue #999)
# =============================================================================
# The TS counterpart of ci.go-sdk (issue #264 / PR #613), created after the
# #607/#628 incident: a fresh checkout showed 477 tsc errors in sdk/typescript
# because an upstream @bufbuild/protobuf publish split the workspace into two
# protobuf-es copies whose branded types don't unify — and NO lane could see
# it. vitest doesn't typecheck (395 tests passed green against the broken
# types), and while ci.frontend's build:libs does run tsc, it installs with
# `npm ci` against the tracked package-lock.json, whose pinned resolution can
# never reproduce the drift. The breakage only exists on installs that
# RE-RESOLVE caret ranges — the integrator fresh-clone path.
#
# Two jobs, two failure classes:
#   - typecheck (locked) — npm ci + tsc --noEmit on each package's build
#     config PLUS each package's own `typecheck` script (tsconfig.json, which
#     includes test files — mcp-server/ink/cli test files were previously
#     typechecked by NO lane; only sdk/react and sdk/typescript got this via
#     make verify-web). Deterministic: catches ordinary type errors including
#     ones vitest happily executes past.
#   - typecheck-clean-room (fresh resolution) — `npm install` with the tracked
#     package-lock.json REMOVED, re-resolving every caret range from the live
#     registry exactly like a consumer's fresh install, honoring the root
#     `overrides` pins (PR #628's @bufbuild/protobuf; the zod pin this lane's
#     own dry run forced: @modelcontextprotocol/sdk had drifted 1.27→1.30 and
#     pulled a nested zod v4 whose type inference OOMs tsc on mcp-server and
#     cli — live on main for every fresh clone until pinned). This is the only
#     job in the fleet that can catch this class before it ships. It is
#     inherently non-hermetic — an unrelated upstream publish can redden a PR.
#     That is the point of the gate; if it proves too flaky in practice,
#     demote THIS JOB ONLY to a scheduled canary (the ci.integration-canary
#     precedent) and keep the locked job on PRs.
#
#     Until 2026-09-10 this job installed with Yarn Berry (issue #687 for the
#     immutable-install fix it needed). It moved to npm when npm became the
#     workspace's one declared package manager (root `packageManager`;
#     stigmer-cloud project 20260904.04, Stage B). Two consequences worth
#     knowing:
#       * npm is STRICTER than yarn on peer ranges: a conflicting peer that
#         yarn only warned about fails `npm install` with ERESOLVE. That is a
#         real consumer-facing signal, not noise — a consumer's fresh install
#         hits the same wall.
#       * npm is MORE LENIENT than yarn on undeclared siblings: it hoists every
#         workspace's dependencies to the root node_modules, so a package that
#         imports something only a SIBLING workspace declares still typechecks
#         here. Yarn did not hoist that way, and its last catch on this job was
#         exactly that class (issue #1044: @stigmer/react imported
#         @base-ui/react, declared only by client-apps/web and
#         client-apps/desktop). This job cannot see that class under npm; it
#         is each package's own devDependencies discipline.
#
# @stigmer/protos is built first in both jobs: it is the one workspace package
# that exports ./dist (everything else exports src in dev), so nothing
# typechecks without its build output. Its dist is never committed — every CI
# job that needs it builds it fresh from the committed generated sources.
# =============================================================================

name: ci.ts-sdk

on:
  pull_request:
    paths:
      - "apis/stubs/ts/**"
      - "sdk/typescript/**"
      - "mcp-server/**"
      - "sdk/react/**"
      - "sdk/ink/**"
      # sdk/react consumes @stigmer/theme workspace source; a theme change can
      # break react's typecheck without touching sdk/react/**.
      - "sdk/theme/**"
      - "client-apps/cli/**"
      # test/conformance typechecks mcp-server (and, through it, sdk/typescript)
      # SOURCE under its own stricter compiler options, so the coupling cuts
      # both ways: a conformance change or an sdk/mcp-server change can redden
      # it. Both sides already trigger this lane (issue #999).
      - "test/conformance/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.ts-sdk.yaml"
  push:
    branches: [main]
    paths:
      - "apis/stubs/ts/**"
      - "sdk/typescript/**"
      - "mcp-server/**"
      - "sdk/react/**"
      - "sdk/ink/**"
      - "sdk/theme/**"
      - "client-apps/cli/**"
      - "test/conformance/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.ts-sdk.yaml"
  workflow_dispatch: {}

concurrency:
  group: ci-ts-sdk-${{ github.head_ref || github.ref }}
  # PR pushes cancel superseded runs; main pushes queue instead, so every
  # merge gets a completed, attributable run (stigmer/stigmer#725).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Make installs resilient to transient registry drops (ECONNRESET) — the same
# npm_config_* retry knobs ci.frontend uses.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_factor: "2"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"

jobs:
  typecheck:
    name: typecheck (locked resolution)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies (npm ci, tracked lockfile)
        run: npm ci

      - name: Build @stigmer/protos dist
        run: npm run build -w @stigmer/protos

      # Both configs per package: tsconfig.build.json is what ships (and what
      # the #628 incident surfaced through); the `typecheck` script covers
      # tsconfig.json, which is the only config that includes the test files.
      - name: Typecheck sdk/typescript
        run: |
          npx tsc -p sdk/typescript/tsconfig.build.json --noEmit
          npm run typecheck -w @stigmer/sdk

      - name: Typecheck mcp-server
        run: |
          npx tsc -p mcp-server/tsconfig.build.json --noEmit
          npm run typecheck -w @stigmer/mcp-server

      - name: Typecheck sdk/react
        run: |
          npx tsc -p sdk/react/tsconfig.build.json --noEmit
          npm run typecheck -w @stigmer/react

      - name: Typecheck sdk/ink
        run: |
          npx tsc -p sdk/ink/tsconfig.build.json --noEmit
          npm run typecheck -w @stigmer/ink

      - name: Typecheck client-apps/cli
        run: |
          npx tsc -p client-apps/cli/tsconfig.build.json --noEmit
          npm run typecheck -w @stigmer/cli

      # The conformance suite is a consumer too: it compiles @stigmer/mcp-server
      # source (and, through it, @stigmer/sdk source) under its own
      # `noUncheckedIndexedAccess`, so a guard-free indexed read in either
      # package fails HERE even when both packages' own typechecks pass. Before
      # issue #999 no lane ran this and 19 errors accumulated on main unseen.
      # One config: the package has no build output (nothing ships), so
      # tsconfig.json is the whole program.
      - name: Typecheck test/conformance
        run: npm run typecheck -w @stigmer/conformance

  typecheck-clean-room:
    name: typecheck (clean-room resolution)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `cache: npm` here on purpose: the cache key is package-lock.json,
      # and this job's whole point is to resolve WITHOUT it.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # The tracked lockfile is removed before the install, so npm RE-RESOLVES
      # every caret range from the live registry: the exact path that exposed
      # the 477-error split. `--no-package-lock` keeps npm from writing a new
      # one (nothing downstream needs it, and a lockfile left behind would make
      # the next step's resolution look reproducible when it is not). The root
      # `overrides` block pins the known-toxic drifts (@bufbuild/protobuf from
      # PR #628; zod from this lane's dry run); anything else that drifts into
      # un-unifiable or pathological types fails HERE, before a consumer's
      # fresh install finds it.
      - name: Install dependencies (npm, fresh resolution)
        run: |
          rm package-lock.json
          npm install --no-package-lock --no-audit --no-fund

      - name: Build @stigmer/protos dist
        run: npm run build -w @stigmer/protos

      # Build configs only: the resolution-split class this job exists for
      # surfaces in the shipping surface. Test-file typechecking is the locked
      # job's business — including it here would add @types-drift flake
      # without adding signal for this failure class.
      - name: Typecheck the five consumer packages
        run: |
          npx tsc -p sdk/typescript/tsconfig.build.json --noEmit
          npx tsc -p mcp-server/tsconfig.build.json --noEmit
          npx tsc -p sdk/react/tsconfig.build.json --noEmit
          npx tsc -p sdk/ink/tsconfig.build.json --noEmit
          npx tsc -p client-apps/cli/tsconfig.build.json --noEmit
