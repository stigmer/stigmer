# =============================================================================
# Unified Runner — Vitest Suite
# =============================================================================
# Runs the standalone TypeScript runner's (`@stigmer/runner`) full vitest suite.
#
# The runner is NOT part of the root npm workspaces — it has its own
# package-lock.json and is installed/built separately (see the Makefile's
# build-runner). Its ~3,100-test vitest suite ran in NO automated gate before
# this workflow: ci.conformance-execution only BUILDS + TYPECHECKS the runner,
# and `make check` (check-node) runs its typecheck/build/check-deps but not
# `npm test`. So compile-time contracts were guarded while runtime behavior
# across the whole suite could rot silently. This workflow closes that gap.
#
# It also boot-checks the compiled dist with plain `node` (verify:dist):
# vitest/tsx module interop tolerates ESM/CJS import shapes that Node's real
# loader rejects, so an import-time boot crash (#399) can pass every other
# gate. See scripts/verify-dist-boot.mjs for the mechanism.
#
# This is a SEPARATE job from ci.conformance-execution (its closest sibling)
# rather than an added step, so it has an independent signal, its own path
# filter, and its own concurrency group.
#
# No Temporal CLI step: the one Temporal-backed suite (golden-e2e) uses
# @temporalio/testing's TestWorkflowEnvironment.createLocal(), which downloads
# and manages its OWN test-server binary — it never consults a system `temporal`
# on PATH — and self-skips if that fails, so it can never hard-fail this job.
#
# Path filter is intentionally narrow (the runner's own tree + the proto stubs
# it imports). Root package.json/package-lock.json are deliberately omitted: the
# runner's deps live in its own lockfile, and a root-dep change that broke the
# proto build is already caught by ci.conformance-execution.
#
# Fork concurrency is capped in CI via vitest.config.ts (it keys off the CI env
# GitHub sets) to avoid oversubscribing the runner with bash/git subprocess
# tests; see that file for the rationale.
# =============================================================================

name: ci.runner

on:
  pull_request:
    paths:
      - "backend/services/runner/**"
      - "apis/stubs/ts/**"
      - "Makefile"
      - ".github/workflows/ci.runner.yaml"
  push:
    branches: [main]
    paths:
      - "backend/services/runner/**"
      - "apis/stubs/ts/**"
      - "Makefile"
      - ".github/workflows/ci.runner.yaml"

concurrency:
  group: runner-${{ github.head_ref || github.ref }}
  # PR pushes cancel superseded runs; main pushes queue instead, so every
  # merge gets a completed, attributable run (stigmer/stigmer#725).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  runner-vitest:
    name: Runner Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      # The runner imports the built proto stubs (dist), not source.
      - name: Build proto stubs
        run: npm run build -w @stigmer/protos

      # The runner is a standalone package with its own lockfile, so it needs
      # its own install (mirrors ci.integration-offline).
      - name: Install unified runner dependencies
        working-directory: backend/services/runner
        run: npm ci

      # Build the tsc dist and boot it with plain `node` BEFORE the long
      # vitest run: vitest/tsx module interop masks ESM/CJS import crashes
      # that kill `node dist/main.js` at startup (#399 shipped through every
      # existing gate this way). verify-dist-boot.mjs is the only gate that
      # executes the compiled output directly; it needs no Temporal server.
      - name: Boot-check the compiled dist
        working-directory: backend/services/runner
        run: npm run build && npm run verify:dist

      # Consumer-install smoke (#786): every other gate runs against the
      # repo's lockfile-resolved node_modules, but embedders fresh-install
      # the published tarball from the manifest's version specs — a
      # resolution this repo never exercises. This packs the tarball,
      # installs it into a fresh prefix the way an embedder does, asserts
      # a single @temporalio/proto copy (two copies = the #786 duplicate
      # coresdk registration that killed manager init), and boots the
      # staged dist. See scripts/verify-consumer-install.mjs.
      - name: Consumer-install smoke check
        working-directory: backend/services/runner
        run: npm run verify:consumer

      # GitHub sets CI=true, so vitest.config.ts caps fork concurrency here.
      - name: Run runner vitest suite
        run: make test-runner
