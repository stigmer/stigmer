# =============================================================================
# Unified Runner — Vitest Suite
# =============================================================================
# Runs the standalone TypeScript runner's (`@stigmer/runner`) full vitest suite.
#
# The runner is NOT part of the root npm workspaces — it has its own
# package-lock.json and is installed/built separately (see the Makefile's
# build-runner). Its ~3,100-test vitest suite ran in NO automated gate before
# this workflow: ci.conformance-execution only BUILDS + TYPECHECKS the runner,
# and `make check` (check-node) runs its typecheck/build/check-deps but not
# `npm test`. So compile-time contracts were guarded while runtime behavior
# across the whole suite could rot silently. This workflow closes that gap.
#
# It also boot-checks the compiled dist with plain `node` (verify:dist):
# vitest/tsx module interop tolerates ESM/CJS import shapes that Node's real
# loader rejects, so an import-time boot crash (#399) can pass every other
# gate. See scripts/verify-dist-boot.mjs for the mechanism.
#
# This is a SEPARATE lane from ci.conformance-execution (its closest sibling)
# rather than an added step, so it has an independent signal and its own
# path list (scripts/ci-lanes.mjs: the runner's own tree, the workspace libs
# it file:-links, and the root tooling that builds them).
#
# No Temporal CLI step: the Temporal-backed suites (the goldens) use
# @temporalio/testing's TestWorkflowEnvironment, which downloads and manages
# its OWN test-server binary and never consults a system `temporal` on PATH.
# Outside the gate a failed download skips them by name; inside it
# (STIGMER_TEST_GATE=1, below) it fails this job, since the gate provides
# every dependency its suites need.
#
# Fork concurrency is capped in CI via vitest.config.ts (it keys off the CI env
# GitHub sets) to avoid oversubscribing the runner with bash/git subprocess
# tests; see that file for the rationale.
# =============================================================================

name: ci.runner

on:
  # Called by ci.gate.yaml when scripts/ci-lanes.mjs finds the change needs
  # this lane (the path list and its reasons live there); `Gate` is the
  # required check.
  workflow_call:

permissions:
  contents: read

env:
  # Inside the gate a missing test dependency fails instead of skipping
  # (the Postgres and Temporal helpers read it); a caller's env does not
  # reach a called workflow, so each lane sets it itself.
  STIGMER_TEST_GATE: "1"

jobs:
  # The runner layer's start script (backend/services/runner/layer/start.sh)
  # passes on to the runner's Node only as root on glibc, which no step
  # above runs as, so its success case (arguments through unchanged,
  # NODE_OPTIONS and NODE_PATH gone, a warning per missing optional tool)
  # runs here, in Node's Debian image at the .nvmrc version, where
  # STIGMER_TEST_AS_ROOT=1 makes that case's skip a failure. The checkout is
  # mounted read-only; the suite writes only to the container's temp dir.
  # Then the script alone, on Alpine: a musl base with none of the required
  # tools, which no Linux runner's own tree can stand in for, must be
  # refused with exit 78 and the line that names the contract.
  layer-start-as-root:
    name: Runner layer start script (as root)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run the start script's suite as root on glibc
        run: |
          NODE_VERSION="$(tr -d '[:space:]v' < .nvmrc)"
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo \
            --env STIGMER_TEST_AS_ROOT=1 \
            "node:${NODE_VERSION}-bookworm" \
            node --test scripts/runner-layer-start.test.mjs

      - name: Refuse a musl base (alpine)
        run: |
          set +e
          message="$(docker run --rm \
            --volume "$PWD/backend/services/runner/layer/start.sh:/runner/bin/start:ro" \
            alpine /runner/bin/start /runner/dist/main.js 2>&1)"
          status=$?
          set -e
          echo "$message"
          if [ "$status" != 78 ]; then
            echo "expected the start script's refusal (exit 78), got exit $status" >&2
            exit 1
          fi
          for expected in "no glibc dynamic loader" "musl" "missing from PATH: bash, git" "runners#bring-your-own-base-image"; do
            if [[ "$message" != *"$expected"* ]]; then
              echo "the refusal does not say '$expected'" >&2
              exit 1
            fi
          done

  runner-vitest:
    name: Runner Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Restore the Turbo cache
        uses: ./.github/actions/turbo-cache

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      # The runner file:-links its workspace libs (@stigmer/protos,
      # @stigmer/temporal-codecs) and imports their built dists, not source.
      - name: Build runner-linked workspace libs
        run: npm run build:runner-deps

      # The runner is a standalone package with its own lockfile, so it needs
      # its own install (mirrors ci.integration-offline).
      - name: Install unified runner dependencies
        working-directory: backend/services/runner
        run: npm ci

      # Build the tsc dist and boot it with plain `node` BEFORE the long
      # vitest run: vitest/tsx module interop masks ESM/CJS import crashes
      # that kill `node dist/main.js` at startup (#399 shipped through every
      # existing gate this way). verify-dist-boot.mjs is the only gate that
      # executes the compiled output directly; it needs no Temporal server.
      - name: Boot-check the compiled dist
        working-directory: backend/services/runner
        run: npm run build && npm run verify:dist

      # Consumer-install smoke (#786): every other gate runs against the
      # repo's lockfile-resolved node_modules, but embedders fresh-install
      # the published tarball from the manifest's version specs — a
      # resolution this repo never exercises. This packs the tarball,
      # installs it into a fresh prefix the way an embedder does, asserts
      # a single @temporalio/proto copy (two copies = the #786 duplicate
      # coresdk registration that killed manager init), and boots the
      # staged dist. See the repo-root scripts/verify-consumer-install.mjs
      # (shared with @stigmer/server; the runner's checks are declared in
      # its package.json under stigmerPublish.consumerCheck).
      # `--resolve-before=1` ignores versions published in the last hour, so a
      # version the registry has not propagated yet cannot fail a gate
      # (#1669; scripts/lib/resolve-before.mjs). A release resolves live.
      - name: Consumer-install smoke check
        working-directory: backend/services/runner
        run: npm run verify:consumer -- --resolve-before=1

      # GitHub sets CI=true, so vitest.config.ts caps fork concurrency here.
      # `make test-runner` is the install above and then `npm test`; it is
      # called directly here so the coverage flags reach vitest.
      - name: Run runner vitest suite
        working-directory: backend/services/runner
        run: npm test -- --coverage.enabled --coverage.reportsDirectory=coverage/v8 --reporter=default --reporter=github-actions --reporter=json --outputFile.json=coverage/report.json

      # The coverage and the report for ci.gate.yaml's Coverage job, red or
      # green: a failed run still says what it covered (reportOnFailure).
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-runner-runner-vitest
          path: |
            backend/services/runner/coverage/
          if-no-files-found: error
          retention-days: 14
