# Plugin catalogue static validation: the official marketplace under plugins/
# read through @stigmer/plugin-package, the reader the CLI and the server use
# (plugins/__tests__, vitest.config.ts). Deterministic and network-free. The
# suite proves the marketplace file and the tree agree and every offered
# plugin reads clean under its own name, so what merges is what `stigmer up`
# and `stigmer install` will accept. Structural validity of the ai.stigmer/
# overlays against the contract is check-docs-yaml's job (ci.docs, authoring
# dir `plugins`); this lane owns what the contract cannot say.

name: CI / Plugins Static Validation

on:
  # Called by ci.gate.yaml when scripts/ci-lanes.mjs finds the change needs
  # this lane (the path list and its reasons live there); `Gate` is the
  # required check.
  workflow_call:

env:
  # Inside the gate a missing test dependency fails instead of skipping
  # (the Postgres and Temporal helpers read it); a caller's env does not
  # reach a called workflow, so each lane sets it itself.
  STIGMER_TEST_GATE: "1"

jobs:
  plugins-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install dependencies (npm ci, tracked lockfile)
        run: npm ci
      - name: Run the plugin catalogue's static suite
        run: make test-plugins-static
