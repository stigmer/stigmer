# =============================================================================
# Documentation CI
# =============================================================================
# Quality gates for documentation changes: prose linting, formatting, site
# build verification, SDK docs freshness, and link checking. Runs for every
# change that touches docs, the site or a package it builds against, protos,
# or codegen tooling.
#
# Which changes need it is its list in scripts/ci-lanes.mjs; ci.gate.yaml
# calls it for those, and `Gate` is the required check. That replaced two
# shapes that each let a red docs lane merge: a noop twin workflow whose
# unconditional green satisfied the required check on a mixed PR (#662 merged
# over a red `Lint & Build` that way, #688; the twin retired in #709), and
# then an internal paths filter whose skipped jobs satisfied it on every
# other PR while the lanes that did run were not required at all.
#
# SDK Docs Freshness is a gate everywhere, main included: nothing regenerates
# and pushes behind a merge any more. A stale generated doc fails the pull
# request that made it stale, and its author runs `make gen-sdk-docs`.
# =============================================================================

name: ci.docs

on:
  # Called by ci.gate.yaml when scripts/ci-lanes.mjs finds the change needs
  # this lane (the path list and its reasons live there); `Gate` is the
  # required check.
  workflow_call:
  workflow_dispatch:

# Make `npm ci` resilient to transient registry drops (ECONNRESET). npm reads
# these npm_config_* vars, so every install step retries with backoff instead
# of failing the whole job on the first dropped download.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_factor: "2"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"
  # Inside the gate a missing test dependency fails instead of skipping
  # (the Postgres and Temporal helpers read it); a caller's env does not
  # reach a called workflow, so each lane sets it itself.
  STIGMER_TEST_GATE: "1"

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Restore the Turbo cache
        uses: ./.github/actions/turbo-cache

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install Vale
        run: make install-vale

      - name: Install npm dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Check formatting
        run: make format-docs-check

      # Agent guidance gate: every nested AGENTS.md has a current Cursor shim,
      # every path a guide cites resolves, and no private-record identifier
      # reached public guidance. See .agents/README.md.
      - name: Verify agent guidance
        run: make agents-check

      # Vitest unit/component tests (e.g. the Ask AI panel invariants).
      # check-site runs these locally, but this workflow invokes individual
      # targets rather than check-site — so the tests need their own step to
      # gate PRs.
      - name: Run site unit tests
        run: make -C site test-unit

      # Every <ScenarEmbed id> in docs/** must resolve to a real
      # demos/tours/<id>/ — nothing else checks this, and a typo ships a
      # blank iframe with CI green. Also wired in ci.ts-workspace.yaml, which
      # runs it whenever @stigmer/demos is affected (this workflow doesn't
      # trigger on demos/**).
      - name: Verify Scenar tours
        run: node scripts/verify-scenar-tours.mjs

      # Every docs page must be classified in docs/_inventory/
      # classification.yaml (fate, diataxis, teaches, medium; generated
      # pages via cohort rules) and each page's embeds must match its
      # declared per-embed fates. This is the docs-revamp inventory gate —
      # see docs/STYLE.md, "Classify every page".
      - name: Verify docs inventory
        run: make check-docs-inventory

      - name: Build documentation site
        run: make build-site

  sdk-docs-freshness:
    name: SDK Docs Freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Restore the Turbo cache
        uses: ./.github/actions/turbo-cache

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install npm dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Install site dependencies
        run: cd site && YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      # A pure gate on every run: stale generated docs fail it, and the
      # author regenerates locally (`make gen-sdk-docs`).
      - name: Verify SDK docs are up to date
        run: make gen-sdk-docs-check

      # Hand-written docs drift is a different animal: a proto change that
      # invalidates a guide's YAML example needs editorial judgment, not
      # regeneration. This stays a hard gate on every run.
      - name: Validate docs YAML against proto contracts
        run: make check-docs-yaml

  links:
    name: Links (Lychee)
    runs-on: ubuntu-latest
    # Non-blocking: external links are inherently flaky in CI due to rate
    # limiting, transient failures, and geo-blocks. Exclusions for known
    # vendor dashboard URLs live in .lychee.toml.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config .lychee.toml
            --root-dir .
            docs/
          fail: true
