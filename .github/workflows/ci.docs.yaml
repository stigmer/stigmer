# =============================================================================
# Documentation CI
# =============================================================================
# Quality gates for documentation changes: prose linting, formatting, site
# build verification, and link checking. Runs on every PR and push to main
# that touches docs, the site, or the linting/formatting configuration.
# =============================================================================

name: ci.docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "client-apps/cli/**"
      - ".vale.ini"
      - ".prettierrc"
      - "vale/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "client-apps/cli/**"
      - ".vale.ini"
      - ".prettierrc"
      - "vale/**"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install Vale
        run: make install-vale

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting
        run: make format-docs-check

      - name: Build documentation site
        run: make build-site

  cli-docs-freshness:
    name: CLI Docs Freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: client-apps/cli/go.mod

      - name: Verify CLI docs are up to date
        run: make gen-cli-docs-check

  links:
    name: Links (Lychee)
    runs-on: ubuntu-latest
    # Non-blocking: external links are inherently flaky in CI due to rate
    # limiting, transient failures, and geo-blocks. Tighten after tuning
    # exclusions in a .lychee.toml config.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-path docs/_archive
            --exclude '^/'
            docs/
          fail: true
