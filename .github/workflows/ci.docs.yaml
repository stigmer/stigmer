# =============================================================================
# Documentation CI
# =============================================================================
# Quality gates for documentation changes: prose linting, formatting, site
# build verification, SDK docs freshness, and link checking. Runs on every PR
# and push to main that touches docs, the site, protos, or codegen tooling.
# =============================================================================

name: ci.docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "apis/**"
      - "tools/codegen/**"
      - "client-apps/cli/**"
      - "sdk/ink/**"
      - "sdk/react/**"
      - ".vale.ini"
      - ".prettierrc"
      - "vale/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "apis/**"
      - "tools/codegen/**"
      - "client-apps/cli/**"
      - "sdk/ink/**"
      - "sdk/react/**"
      - ".vale.ini"
      - ".prettierrc"
      - "vale/**"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install Vale
        run: make install-vale

      - name: Install npm dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Check formatting
        run: make format-docs-check

      - name: Build documentation site
        run: make build-site

  sdk-docs-freshness:
    name: SDK Docs Freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install npm dependencies
        run: npm ci

      - name: Install site dependencies
        run: cd site && YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      - name: Verify SDK docs are up to date
        run: make gen-sdk-docs-check

  links:
    name: Links (Lychee)
    runs-on: ubuntu-latest
    # Non-blocking: external links are inherently flaky in CI due to rate
    # limiting, transient failures, and geo-blocks. Exclusions for known
    # vendor dashboard URLs live in .lychee.toml.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --root-dir .
            docs/
          fail: true
