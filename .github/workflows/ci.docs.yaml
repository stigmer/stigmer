# =============================================================================
# Documentation CI
# =============================================================================
# Quality gates for documentation changes: prose linting, formatting, site
# build verification, SDK docs freshness, and link checking.
#
# `Lint & Build` is a required status check on main, and required checks with
# workflow-level `paths` filters need a way to report on the PRs the filter
# skips. This workflow used to solve that with a no-op twin
# (ci.docs-noop.yaml, `paths-ignore` mirroring the `paths` list) — a design
# with a hole this repo shipped through: the two filters only partition PRs
# that fall entirely on one side. A MIXED PR (docs + non-docs files) triggered
# BOTH workflows, and because branch protection matches checks by name, the
# twin's unconditionally green `Lint & Build` satisfied the requirement even
# when the real one failed. PR #662 merged exactly that way and turned main
# red for every docs-adjacent PR (issue #688).
#
# The twin is gone. This workflow now runs on EVERY pull request; the cheap
# `changes` job diffs the PR against its base and each gate job skips itself
# when no docs-adjacent path changed. A job skipped by its `if` condition
# still reports a conclusion, which satisfies required status checks — one
# check name, one workflow, no partition to get wrong.
# =============================================================================

name: ci.docs

on:
  # No `paths` filter here — the required check must report on every PR, and
  # the docs-adjacent path decision lives in the `changes` job below.
  pull_request:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "apis/**"
      - "tools/codegen/**"
      - "client-apps/cli/**"
      - "sdk/ink/**"
      - "sdk/react/**"
      # The docs site embeds the Ask AI panel through @stigmer/embed's
      # workspace source, so embed changes can break the site build/tests.
      - "sdk/embed/**"
      - ".vale.ini"
      - ".prettierrc"
      - ".lychee.toml"
      - "vale/**"
      - ".github/workflows/ci.docs.yaml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Make `npm ci` resilient to transient registry drops (ECONNRESET). npm reads
# these npm_config_* vars, so every install step retries with backoff instead
# of failing the whole job on the first dropped download.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_factor: "2"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"

jobs:
  # Decides whether this PR touches docs-adjacent paths. Keep the list below
  # in lockstep with the push-trigger `paths` list above — both live in this
  # one file precisely so a change can't update one and miss the other.
  changes:
    name: Detect docs-adjacent changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout (merge commit + its parents)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # On a pull_request event HEAD is the merge commit GitHub builds from
      # the PR onto the CURRENT base, so `git diff HEAD^1 HEAD` is exactly
      # the file set this PR would land — no stale event SHAs, no extra API
      # calls. Non-PR events (push already path-filtered above; manual
      # dispatch means someone wants the run) always gate in.
      - name: Diff changed paths against the docs-adjacent list
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event — docs gates run."
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          echo "$changed"
          pattern='^(docs/|site/|apis/|tools/codegen/|client-apps/cli/|sdk/ink/|sdk/react/|sdk/embed/|vale/|\.vale\.ini$|\.prettierrc$|\.lychee\.toml$|\.github/workflows/ci\.docs\.yaml$)'
          if echo "$changed" | grep -qE "$pattern"; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "Docs-adjacent paths changed — docs gates run."
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "No docs-adjacent paths changed — docs gates skip (reported as skipped, which satisfies the required check)."
          fi

  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install Vale
        run: make install-vale

      - name: Install npm dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Check formatting
        run: make format-docs-check

      # Vitest unit/component tests (e.g. the Ask AI panel invariants).
      # check-site runs these locally, but this workflow invokes individual
      # targets rather than check-site — so the tests need their own step to
      # gate PRs.
      - name: Run site unit tests
        run: make -C site test-unit

      # Every <ScenarEmbed id> in docs/** must resolve to a real
      # demos/tours/<id>/ — nothing else checks this, and a typo ships a
      # blank iframe with CI green. Also wired in ci.frontend.yaml, which
      # covers the demos/** side (this workflow doesn't trigger on demos/**).
      - name: Verify Scenar tours
        run: node scripts/verify-scenar-tours.mjs

      # Every docs page must be classified in docs/_inventory/
      # classification.yaml (fate, diataxis, teaches, medium; generated
      # pages via cohort rules) and each page's embeds must match its
      # declared per-embed fates. This is the docs-revamp inventory gate —
      # see docs/STYLE.md, "Classify every page".
      - name: Verify docs inventory
        run: make check-docs-inventory

      - name: Build documentation site
        run: make build-site

  sdk-docs-freshness:
    name: SDK Docs Freshness
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    # The self-heal step pushes regenerated docs back to main; every other
    # step only reads the repo.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install npm dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Install site dependencies
        run: cd site && YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      # On PRs this job is a pure gate: stale generated docs fail the run
      # and the author regenerates locally.
      - name: Verify SDK docs are up to date
        if: github.ref != 'refs/heads/main' || github.actor == 'github-actions[bot]'
        run: make gen-sdk-docs-check

      # On main (pushes, or a manual dispatch as a "heal now" button),
      # stale generated docs are pure toil — they are mechanically
      # derivable from the commit that just landed — so this job heals
      # them itself instead of turning main red and waiting for a human to
      # push a "regenerate sdk docs" commit.
      - name: Regenerate SDK docs (self-heal)
        if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: make gen-sdk-docs

      # Loop safety: this push uses the workflow's own GITHUB_TOKEN, and
      # GitHub never triggers push workflows for commits pushed with that
      # token — so the self-heal commit cannot re-trigger this workflow.
      # The actor guard above is belt-and-braces for a future token swap.
      # The pushed commit is still validated: it is exactly the tree this
      # run generated, and check-docs-yaml below runs against it.
      - name: Commit regenerated docs (self-heal)
        if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          set -euo pipefail
          # Only the generators' known output paths (plus the yarn.lock that
          # the non-immutable site install may touch) are eligible for the
          # self-heal commit.
          git add -- \
            docs/sdk \
            docs/guides/workflows/task-types \
            docs/cli/commands \
            backend/services/stigmer-server/pkg/domain/workflow/registry/data \
            tools/codegen/output \
            site/src/data/react-sdk-summary.json \
            site/yarn.lock
          if git diff --cached --quiet; then
            echo "Generated SDK docs are already fresh — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit \
              -m "chore(docs): regenerate SDK reference docs" \
              -m "Automated self-heal by the SDK Docs Freshness job (ci.docs)."
            # Fail soft on a push race: the commit that beat us triggers its
            # own run, which regenerates on top of both changes.
            git push origin HEAD:main \
              || { git pull --rebase origin main && git push origin HEAD:main; } \
              || echo "::warning::Self-heal push lost a race with a concurrent push to main; the next run will regenerate."
          fi
          # Ratchet: any remaining tracked change means a generator wrote
          # outside the pathspec above (or is nondeterministic). Fail loudly
          # — with the full diff, so the firing is self-diagnosing — and
          # extend the pathspec instead of letting it silently drift.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::make gen-sdk-docs modified tracked files outside the self-heal pathspec:"
            git status --porcelain --untracked-files=no
            echo "::group::Diff of the unexpected changes"
            git --no-pager diff
            echo "::endgroup::"
            exit 1
          fi

      # Hand-written docs drift is a different animal: a proto change that
      # invalidates a guide's YAML example needs editorial judgment, not
      # regeneration. This stays a hard gate on every run.
      - name: Validate docs YAML against proto contracts
        run: make check-docs-yaml

  links:
    name: Links (Lychee)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    # Non-blocking: external links are inherently flaky in CI due to rate
    # limiting, transient failures, and geo-blocks. Exclusions for known
    # vendor dashboard URLs live in .lychee.toml.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --root-dir .
            docs/
          fail: true
