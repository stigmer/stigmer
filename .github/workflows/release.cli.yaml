# Creates the GitHub Release for a version tag: tag verification (or creation
# on manual dispatch) plus curated release notes from the annotated tag.
#
# No binary assets ship here: the served implementation is acquired as
# the @stigmer/server-slim npm package (published by release.npm-libs.yaml),
# and the CLI itself ships as the @stigmer/cli npm package.
name: release.cli

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v1.2.3, etc.)
  workflow_dispatch:  # Allow manual trigger
    inputs:
      create_release:
        description: 'Create a release after successful build'
        required: false
        type: boolean
        default: false
      version:
        description: 'Version number (e.g., 1.0.0) - only needed if creating release'
        required: false
        type: string

permissions:
  contents: read

# Run JavaScript actions on Node 24. GitHub's runners now force Node 20 actions
# onto Node 24 on their own; this sets it explicitly. It does not silence the
# deprecation warning: GitHub annotates every action it forces until that
# action's pin moves to a Node 24 major (#2825).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Determine version for this build
  determine-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Tag push: use tag name as version and create release
            VERSION="${GITHUB_REF_NAME}"
            SHOULD_RELEASE="true"
            echo "Triggered by tag: $VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${GITHUB_EVENT_INPUTS_VERSION}" ]; then
              VERSION="v${GITHUB_EVENT_INPUTS_VERSION}"
              SHOULD_RELEASE="${GITHUB_EVENT_INPUTS_CREATE_RELEASE}"
            else
              # Generate test version from commit hash
              VERSION="test-$(git rev-parse --short HEAD)"
              SHOULD_RELEASE="false"
            fi
          else
            VERSION="test-$(git rev-parse --short HEAD)"
            SHOULD_RELEASE="false"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (release: $SHOULD_RELEASE)"
        env:
          GITHUB_EVENT_INPUTS_VERSION: ${{ github.event.inputs.version }}
          GITHUB_EVENT_INPUTS_CREATE_RELEASE: ${{ github.event.inputs.create_release }}

  release:
    needs: [determine-version]
    runs-on: ubuntu-24.04
    # Pushes the release tag and creates the GitHub release.
    permissions:
      contents: write
    if: needs.determine-version.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          # This job pushes the release tag with git, so the checkout keeps its token.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Verify tag exists
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          # If triggered by tag push, tag already exists
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "Tag $VERSION already exists (triggered by tag push)"
          else
            # If triggered by workflow_dispatch, create and push tag
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Check if tag already exists
            if git rev-parse "$VERSION" >/dev/null 2>&1; then
              echo "Tag $VERSION already exists, skipping tag creation"
            else
              # Create annotated tag
              git tag -a "$VERSION" -m "Release $VERSION"
              git push origin "$VERSION"
              echo "Created and pushed tag: $VERSION"
            fi
          fi

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          # actions/checkout with protocol v2 may fetch tag refs without the
          # underlying annotated tag objects.  Re-fetch the specific tag to
          # guarantee the object is available locally.
          git fetch origin tag "$VERSION" --force 2>/dev/null || true

          PREVIOUS_TAG=$(git describe --abbrev=0 --tags "$VERSION^" 2>/dev/null || echo "")

          TAG_BODY=""
          OBJ_TYPE=$(git cat-file -t "$VERSION" 2>/dev/null || echo "unknown")
          echo "Tag $VERSION object type: $OBJ_TYPE"
          if [ "$OBJ_TYPE" = "tag" ]; then
            # Blank lines are Markdown paragraph breaks and must reach the
            # release page as written (#1156); nothing is trimmed here.
            TAG_BODY=$(git tag -l --format='%(contents:body)' "$VERSION" | head -c 10000)
            echo "Extracted TAG_BODY length: ${#TAG_BODY}"
          fi

          # Written for a first-time reader, on every release. The install
          # script and npm lead because they serve the new version the moment
          # npm has it; the Homebrew tap follows a day later on purpose
          # (reconcile-homebrew.yaml, stigmer/stigmer#210), so `brew install`
          # comes third and says so.
          INSTALL_SECTION=$(cat <<'INST'
          ## Install

          ```bash
          curl -fsSL https://stigmer.ai/install.sh | sh
          ```

          Or with npm (Node 22.13 or later):

          ```bash
          npm install -g @stigmer/cli
          ```

          Or with Homebrew, about a day after the release:

          ```bash
          brew install stigmer/tap/stigmer
          ```

          Already on an earlier 0.x release? `brew upgrade stigmer`, or the npm line again, moves you to this release. Then run `stigmer up`.
          INST
          )

          if [ -n "$TAG_BODY" ]; then
            # Use the curated release notes from the annotated tag
            {
              echo "$INSTALL_SECTION"
              echo ""
              echo "$TAG_BODY"
            } > /tmp/changelog.txt
          else
            # Fallback: generate changelog from git log. With no previous
            # tag (the line's first release tagged without a body) the range
            # is every commit the tag reaches; `|| true` keeps an empty list
            # from failing the step under `bash -e`.
            if [ -n "$PREVIOUS_TAG" ]; then RANGE="$PREVIOUS_TAG..$VERSION"; else RANGE="$VERSION"; fi
            echo "Falling back to git log changelog ($RANGE)"
            CHANGES=$(git log --pretty=format:"- %s (%h)" "$RANGE" | grep -v "^- Merge" || true)
            {
              echo "$INSTALL_SECTION"
              echo ""
              echo "## Changes"
              echo ""
              echo "$CHANGES"
            } > /tmp/changelog.txt
          fi

          echo "changelog_file=/tmp/changelog.txt" >> $GITHUB_OUTPUT

      # Kept as an action: it finds the tag's release, a re-run's public release or
      # the draft release.desktop.yaml leaves when this step is late, and updates
      # and publishes that one in place, which a `gh release create` script would
      # have to re-implement. `draft: false` is what makes it publish. Its token is
      # the `token` input, which defaults to the job's GITHUB_TOKEN. The suppression
      # sits on the step's name, so the `uses:` line keeps a version comment that
      # Dependabot and zizmor can read.
      - name: Create Release # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.determine-version.outputs.version }}
          name: Release ${{ needs.determine-version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          draft: false
          prerelease: false

# NOTE: The Homebrew tap is intentionally NOT bumped here. Homebrew runs
# formula npm installs with `--min-release-age=1`, which rejects the
# same-day @stigmer/* dependency versions for ~24h and breaks
# `brew install stigmer` right after a release (stigmer/stigmer#210). The
# tap is instead reconciled by .github/workflows/reconcile-homebrew.yaml
# on a schedule, once the packages are old enough.
