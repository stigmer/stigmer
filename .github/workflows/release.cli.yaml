name: release.cli

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v1.2.3, etc.)
  workflow_dispatch:  # Allow manual trigger
    inputs:
      create_release:
        description: 'Create a release after successful build'
        required: false
        type: boolean
        default: false
      version:
        description: 'Version number (e.g., 1.0.0) - only needed if creating release'
        required: false
        type: string

permissions:
  contents: write
  packages: write

# Force JavaScript actions onto Node 24. GitHub is removing the Node 20 runtime
# from runners in 2026; this opts in early and silences the deprecation warnings
# without requiring risky major-version bumps of the artifact actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Determine version for this build
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Tag push: use tag name as version and create release
            VERSION="${{ github.ref_name }}"
            SHOULD_RELEASE="true"
            echo "Triggered by tag: $VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.version }}" ]; then
              VERSION="v${{ github.event.inputs.version }}"
              SHOULD_RELEASE="${{ github.event.inputs.create_release }}"
            else
              # Generate test version from commit hash
              VERSION="test-$(git rev-parse --short HEAD)"
              SHOULD_RELEASE="false"
            fi
          else
            # For push to main, generate test version
            VERSION="test-$(git rev-parse --short HEAD)"
            SHOULD_RELEASE="false"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (release: $SHOULD_RELEASE)"

  # Generate all proto stubs once and share with downstream jobs.
  # Consolidates BSR requests to a single job to avoid rate limiting.
  generate-protos:
    needs: determine-version
    runs-on: ubuntu-latest
    # Pin Go's module + build caches to workspace-relative paths so they can be
    # cached uniformly across Linux and macOS runners (see Cache Go step below).
    env:
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # This repo is a go.work workspace with no root go.sum, so setup-go's
          # built-in cache silently no-ops. We manage the cache explicitly below.
          cache: false

      - name: Cache Go modules and build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gomodcache
            ${{ github.workspace }}/.gocache
          key: go-protos-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-protos-${{ runner.os }}-

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache buf modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/buf
          key: buf-${{ hashFiles('apis/buf.lock') }}
          restore-keys: buf-

      - name: Generate proto stubs
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: make protos

      - name: Package generated stubs
        run: |
          tar -czf proto-stubs.tar.gz \
            apis/stubs/ \
            sdk/go/proto/ \
            sdk/go/internal/gen/ \
            tools/codegen/schemas/ \
            mcp-server/src/gen/ \
            sdk/typescript/src/gen/ \
            sdk/python/src/stigmer/_gen/ \
            sdk/java/src/main/java/ai/stigmer/sdk/gen/

      - name: Upload proto stubs
        uses: actions/upload-artifact@v4
        with:
          name: proto-stubs
          path: proto-stubs.tar.gz
          retention-days: 1

  # Build for macOS Apple Silicon
  build-darwin-arm64:
    needs: [determine-version, generate-protos]
    runs-on: macos-latest  # macOS 14 (M1)
    env:
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Cache Go modules and build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gomodcache
            ${{ github.workspace }}/.gocache
          key: go-darwin-arm64-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-darwin-arm64-${{ runner.os }}-

      - name: Download proto stubs
        uses: actions/download-artifact@v4
        with:
          name: proto-stubs

      - name: Extract proto stubs
        run: tar -xzf proto-stubs.tar.gz

      - name: Build stigmer-server
        env:
          GH_OAUTH_CLIENT_ID: ${{ secrets.STIGMER_LOCAL_GITHUB_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.STIGMER_LOCAL_GITHUB_OAUTH_CLIENT_SECRET }}
        run: |
          cd backend/services/stigmer-server
          go build -ldflags="-s -w \
            -X github.com/stigmer/stigmer/backend/services/stigmer-server/pkg/config.defaultGitHubOAuthClientID=$GH_OAUTH_CLIENT_ID \
            -X github.com/stigmer/stigmer/backend/services/stigmer-server/pkg/config.defaultGitHubOAuthClientSecret=$GH_OAUTH_CLIENT_SECRET" \
            -o ../../../bin/stigmer-server ./cmd/server

      - name: Verify binary
        run: |
          file bin/stigmer-server
          ls -lh bin/

      - name: Package
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          cd bin
          # Standalone stigmer-server asset: the npm CLI downloads this on demand
          # and verifies the sha256 before first use (DD-003).
          tar -czf stigmer-server-$VERSION-darwin-arm64.tar.gz stigmer-server
          shasum -a 256 stigmer-server-$VERSION-darwin-arm64.tar.gz > stigmer-server-$VERSION-darwin-arm64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stigmer-server-darwin-arm64
          path: bin/*

  # Build CLI for Intel Mac (cross-compiled from ARM runner)
  build-darwin-amd64:
    needs: [determine-version, generate-protos]
    runs-on: macos-latest  # ARM Mac (cross-compile Go CLI to Intel)
    env:
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Cache Go modules and build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gomodcache
            ${{ github.workspace }}/.gocache
          key: go-darwin-amd64-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-darwin-amd64-${{ runner.os }}-

      - name: Download proto stubs
        uses: actions/download-artifact@v4
        with:
          name: proto-stubs

      - name: Extract proto stubs
        run: tar -xzf proto-stubs.tar.gz

      - name: Build stigmer-server (cross-compile to Intel)
        env:
          GOARCH: amd64
          GOOS: darwin
          GH_OAUTH_CLIENT_ID: ${{ secrets.STIGMER_LOCAL_GITHUB_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.STIGMER_LOCAL_GITHUB_OAUTH_CLIENT_SECRET }}
        run: |
          cd backend/services/stigmer-server
          go build -ldflags="-s -w \
            -X github.com/stigmer/stigmer/backend/services/stigmer-server/pkg/config.defaultGitHubOAuthClientID=$GH_OAUTH_CLIENT_ID \
            -X github.com/stigmer/stigmer/backend/services/stigmer-server/pkg/config.defaultGitHubOAuthClientSecret=$GH_OAUTH_CLIENT_SECRET" \
            -o ../../../bin/stigmer-server ./cmd/server

      - name: Verify binary
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          file bin/stigmer-server
          ls -lh bin/
          echo "Version: $VERSION (Intel binary, cannot run on ARM Mac)"

      - name: Package
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          cd bin
          # Standalone stigmer-server asset: the npm CLI downloads this on demand
          # and verifies the sha256 before first use (DD-003).
          tar -czf stigmer-server-$VERSION-darwin-amd64.tar.gz stigmer-server
          shasum -a 256 stigmer-server-$VERSION-darwin-amd64.tar.gz > stigmer-server-$VERSION-darwin-amd64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stigmer-server-darwin-amd64
          path: bin/*

  # Build for Linux
  build-linux-amd64:
    needs: [determine-version, generate-protos]
    runs-on: ubuntu-latest
    env:
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Cache Go modules and build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gomodcache
            ${{ github.workspace }}/.gocache
          key: go-linux-amd64-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-linux-amd64-${{ runner.os }}-

      - name: Download proto stubs
        uses: actions/download-artifact@v4
        with:
          name: proto-stubs

      - name: Extract proto stubs
        run: tar -xzf proto-stubs.tar.gz

      - name: Build stigmer-server
        env:
          GH_OAUTH_CLIENT_ID: ${{ secrets.STIGMER_LOCAL_GITHUB_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.STIGMER_LOCAL_GITHUB_OAUTH_CLIENT_SECRET }}
        run: |
          cd backend/services/stigmer-server
          go build -ldflags="-s -w \
            -X github.com/stigmer/stigmer/backend/services/stigmer-server/pkg/config.defaultGitHubOAuthClientID=$GH_OAUTH_CLIENT_ID \
            -X github.com/stigmer/stigmer/backend/services/stigmer-server/pkg/config.defaultGitHubOAuthClientSecret=$GH_OAUTH_CLIENT_SECRET" \
            -o ../../../bin/stigmer-server ./cmd/server

      - name: Verify binary
        run: |
          file bin/stigmer-server
          ls -lh bin/

      - name: Package
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          cd bin
          # Standalone stigmer-server asset: the npm CLI downloads this on demand
          # and verifies the sha256 before first use (DD-003).
          tar -czf stigmer-server-$VERSION-linux-amd64.tar.gz stigmer-server
          sha256sum stigmer-server-$VERSION-linux-amd64.tar.gz > stigmer-server-$VERSION-linux-amd64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stigmer-server-linux-amd64
          path: bin/*

  # Create GitHub Release (only if requested)
  release:
    needs: [determine-version, build-darwin-arm64, build-darwin-amd64, build-linux-amd64]
    runs-on: ubuntu-latest
    if: needs.determine-version.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag exists
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          # If triggered by tag push, tag already exists
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Tag $VERSION already exists (triggered by tag push)"
          else
            # If triggered by workflow_dispatch, create and push tag
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            # Check if tag already exists
            if git rev-parse "$VERSION" >/dev/null 2>&1; then
              echo "Tag $VERSION already exists, skipping tag creation"
            else
              # Create annotated tag
              git tag -a "$VERSION" -m "Release $VERSION"
              git push origin "$VERSION"
              echo "Created and pushed tag: $VERSION"
            fi
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Copy CLI tarballs
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          # Copy all checksums
          find artifacts -name "*.sha256" -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          # actions/checkout with protocol v2 may fetch tag refs without the
          # underlying annotated tag objects.  Re-fetch the specific tag to
          # guarantee the object is available locally.
          git fetch origin tag "$VERSION" --force 2>/dev/null || true

          PREVIOUS_TAG=$(git describe --abbrev=0 --tags "$VERSION^" 2>/dev/null || echo "")

          TAG_BODY=""
          OBJ_TYPE=$(git cat-file -t "$VERSION" 2>/dev/null || echo "unknown")
          echo "Tag $VERSION object type: $OBJ_TYPE"
          if [ "$OBJ_TYPE" = "tag" ]; then
            TAG_BODY=$(git tag -l --format='%(contents:body)' "$VERSION" | sed '/^$/d' | head -c 10000)
            echo "Extracted TAG_BODY length: ${#TAG_BODY}"
          fi

          INSTALL_SECTION=$(cat <<'INST'
          ## Installation

          ### Homebrew (macOS/Linux)
          ```bash
          brew upgrade stigmer
          ```

          ### Manual Installation
          Download the appropriate binary for your platform from the assets below.
          INST
          )

          if [ -n "$TAG_BODY" ]; then
            # Use the curated release notes from the annotated tag
            {
              echo "$INSTALL_SECTION"
              echo ""
              echo "$TAG_BODY"
            } > /tmp/changelog.txt
          elif [ -z "$PREVIOUS_TAG" ]; then
            cat > /tmp/changelog.txt <<FIRST
          ## Installation

          ### Homebrew (macOS/Linux)
          \`\`\`bash
          brew install stigmer/tap/stigmer
          \`\`\`

          ### Manual Installation
          Download the appropriate binary for your platform from the assets below.

          ## What's New

          First release of Stigmer CLI. Agent-runner runs as a native process — no Docker required.
          FIRST
          else
            # Fallback: generate changelog from git log
            echo "Falling back to git log changelog ($PREVIOUS_TAG..$VERSION)"
            CHANGES=$(git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG..$VERSION" | grep -v "^- Merge")
            {
              echo "$INSTALL_SECTION"
              echo ""
              echo "## Changes"
              echo ""
              echo "$CHANGES"
            } > /tmp/changelog.txt
          fi

          echo "changelog_file=/tmp/changelog.txt" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.determine-version.outputs.version }}
          name: Release ${{ needs.determine-version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          files: release-assets/*
          draft: false
          prerelease: false

  # Update Homebrew tap with the npm-distributed CLI.
  #
  # The CLI ships as the @stigmer/cli npm package (a Node program), so the
  # formula is a canonical Language::Node formula: Homebrew downloads the npm
  # registry tarball, installs it (and its @stigmer/* deps) into libexec, and
  # symlinks the `stigmer` launcher into bin. The backend server is no longer
  # bundled — the CLI downloads stigmer-server on first use (DD-003).
  update-homebrew:
    needs: [determine-version, release]
    runs-on: ubuntu-latest
    if: needs.determine-version.outputs.should_release == 'true'
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: stigmer/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for @stigmer/cli on npm
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          # The npm publish (release.npm-libs) runs in parallel with this release,
          # so poll until the exact version is queryable before building the formula.
          NPM_VERSION="${VERSION#v}"
          echo "Waiting for @stigmer/cli@$NPM_VERSION on npm..."
          for i in $(seq 1 60); do
            if npm view "@stigmer/cli@$NPM_VERSION" version >/dev/null 2>&1; then
              echo "Found @stigmer/cli@$NPM_VERSION on npm"
              exit 0
            fi
            echo "Attempt $i/60: not yet available, waiting 10s..."
            sleep 10
          done
          echo "ERROR: @stigmer/cli@$NPM_VERSION not found on npm after 10 minutes"
          echo "Check the release.npm-libs workflow for failures."
          exit 1

      - name: Update Formula
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          VERSION_NO_V=${VERSION#v}

          # Resolve the npm registry tarball for this exact version and compute the
          # sha256 Homebrew requires. npm's dist metadata only exposes sha1/sha512,
          # so we download the tarball and hash it ourselves.
          TARBALL_URL=$(npm view "@stigmer/cli@${VERSION_NO_V}" dist.tarball)
          echo "Tarball: $TARBALL_URL"
          curl -sL "$TARBALL_URL" -o /tmp/stigmer-cli.tgz
          SHA256=$(sha256sum /tmp/stigmer-cli.tgz | awk '{print $1}')
          echo "sha256:  $SHA256"

          cat > Formula/stigmer.rb <<EOF
          require "language/node"

          class Stigmer < Formula
            desc "AI-powered workflow automation — agents, skills, MCP servers, workflows"
            homepage "https://github.com/stigmer/stigmer"
            url "${TARBALL_URL}"
            sha256 "${SHA256}"
            license "Apache-2.0"

            depends_on "node"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink Dir["#{libexec}/bin/*"]
            end

            def caveats
              <<~CAVEATS
                The Stigmer backend server is downloaded automatically on first use,
                so no extra binaries are bundled. Provide a model API key first:

                  Option 1 (recommended):         export ANTHROPIC_API_KEY=sk-ant-...
                  Option 2:                        export OPENAI_API_KEY=sk-...
                  Option 3 (local, lower quality): brew install ollama && ollama serve

                Then start the local stack with:  stigmer up
              CAVEATS
            end

            test do
              system "#{bin}/stigmer", "--version"
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/stigmer.rb
          git commit -m "Update stigmer to ${VERSION}"
          git push
