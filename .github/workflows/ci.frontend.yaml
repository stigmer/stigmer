# =============================================================================
# Frontend CI (SDK + Client App Tests)
# =============================================================================
# Runs Vitest unit and component tests for the TypeScript/React SDK packages
# and client applications (web console, desktop app).
#
# Triggers on PRs and pushes to main when SDK or client-app code changes.
# This catches frontend-backend contract breakages, hook regressions, and
# component rendering errors before deployment.
# =============================================================================

name: ci.frontend

on:
  pull_request:
    paths:
      - "sdk/typescript/**"
      - "sdk/react/**"
      - "sdk/theme/**"
      - "sdk/ink/**"
      - "client-apps/web/**"
      - "client-apps/desktop/**"
      - "apis/stubs/ts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.frontend.yaml"
  push:
    branches: [main]
    paths:
      - "sdk/typescript/**"
      - "sdk/react/**"
      - "sdk/theme/**"
      - "sdk/ink/**"
      - "client-apps/web/**"
      - "client-apps/desktop/**"
      - "apis/stubs/ts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.frontend.yaml"

concurrency:
  group: frontend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Make `npm ci` resilient to transient registry drops (ECONNRESET). npm reads
# these npm_config_* vars, so every install step retries with backoff instead
# of failing the whole job on the first dropped download.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_factor: "2"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"

jobs:
  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      # Regression lock for #209: fail the PR if any published dist ships an
      # extension-less relative specifier that crashes under plain Node ESM.
      - name: Verify Node-ESM output
        run: node scripts/verify-esm-node.mjs

      - name: Run SDK tests
        run: npm test

  a11y-audit:
    name: Workspace Panel A11y Audit
    runs-on: ubuntu-latest
    needs: sdk-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      # Builds @stigmer/react's dist/styles.css — the SHIPPED stylesheet the
      # audit renders against (DD-21). The browser suite imports that artifact.
      - name: Build SDK libraries
        run: npm run build:libs

      # The audit renders real components in a real Chromium (Vitest browser
      # mode) so axe can evaluate contrast/layout rules happy-dom cannot.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run workspace-panel accessibility audit
        run: npm run test:a11y -w @stigmer/react

  web-tests:
    name: Web Console Tests
    runs-on: ubuntu-latest
    needs: sdk-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Run web console tests
        run: npm run test -w client-apps/web

  desktop-tests:
    name: Desktop App Tests
    runs-on: ubuntu-latest
    needs: sdk-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Run desktop app tests
        run: npm run test -w desktop

  verify:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Verify web console
        run: make verify-web

      - name: Verify desktop app
        run: make verify-desktop
        continue-on-error: true
