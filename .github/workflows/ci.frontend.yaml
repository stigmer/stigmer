# =============================================================================
# Frontend CI (SDK + Client App Tests)
# =============================================================================
# Runs Vitest unit and component tests for the TypeScript/React SDK packages
# and client applications (web console, desktop app).
#
# Triggers on PRs and pushes to main when SDK or client-app code changes.
# This catches frontend-backend contract breakages, hook regressions, and
# component rendering errors before deployment.
# =============================================================================

name: ci.frontend

on:
  pull_request:
    paths:
      - "sdk/typescript/**"
      - "sdk/react/**"
      - "sdk/theme/**"
      - "sdk/ink/**"
      - "sdk/embed/**"
      # Scenar tours consume the @stigmer/* workspace source; an SDK change
      # can break them (and vice versa), so tour changes gate here too.
      - "demos/**"
      # E2E specs typecheck against @stigmer/sdk + @stigmer/protos workspace
      # source — the same coupling as demos (see cloud#275: spec/helper
      # drift rode to main because nothing typechecked test/e2e).
      - "test/e2e/**"
      - "client-apps/web/**"
      - "client-apps/desktop/**"
      - "client-apps/cli/**"
      # The build step compiles the full npm workspace (build:libs), which
      # includes mcp-server — so its changes can break this workflow too.
      - "mcp-server/**"
      - "apis/stubs/ts/**"
      # The web routing gate (run by `make verify-web` in the verify job)
      # judges client-apps/web/nginx.conf; editing the gate alone must
      # still run this workflow.
      - "scripts/verify-static-export-routes.mjs"
      - "scripts/verify-static-export-routes.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.frontend.yaml"
  push:
    branches: [main]
    paths:
      - "sdk/typescript/**"
      - "sdk/react/**"
      - "sdk/theme/**"
      - "sdk/ink/**"
      - "sdk/embed/**"
      - "demos/**"
      - "test/e2e/**"
      - "client-apps/web/**"
      - "client-apps/desktop/**"
      - "client-apps/cli/**"
      - "mcp-server/**"
      - "apis/stubs/ts/**"
      - "scripts/verify-static-export-routes.mjs"
      - "scripts/verify-static-export-routes.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.frontend.yaml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Make `npm ci` resilient to transient registry drops (ECONNRESET). npm reads
# these npm_config_* vars, so every install step retries with backoff instead
# of failing the whole job on the first dropped download.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_factor: "2"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"

jobs:
  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      # Regression lock for #209: fail the PR if any published dist ships an
      # extension-less relative specifier that crashes under plain Node ESM.
      - name: Verify Node-ESM output
        run: node scripts/verify-esm-node.mjs

      - name: Run SDK tests
        run: npm test

  # Browser-mode suites (vitest.a11y.config.ts): the workspace-panel a11y
  # audit (DD-22) plus layout-contract regressions (*.layout.test.tsx, e.g.
  # the provider container's sizing contract, #260/DD-019) — both need a
  # real Chromium for layout/paint that happy-dom cannot evaluate.
  a11y-audit:
    name: Browser Suite (A11y Audit + Layout Contracts)
    runs-on: ubuntu-latest
    needs: sdk-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      # Builds @stigmer/react's dist/styles.css — the SHIPPED stylesheet the
      # suites render against (DD-21). The browser suite imports that artifact.
      - name: Build SDK libraries
        run: npm run build:libs

      # The suites render real components in a real Chromium (Vitest browser
      # mode) so axe/layout assertions evaluate rules happy-dom cannot.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser-mode suites
        run: npm run test:a11y -w @stigmer/react

  web-tests:
    name: Web Console Tests
    runs-on: ubuntu-latest
    needs: sdk-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Run web console tests
        run: npm run test -w client-apps/web

  desktop-tests:
    name: Desktop App Tests
    runs-on: ubuntu-latest
    needs: sdk-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Run desktop app tests
        run: npm run test -w desktop

  verify:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Verify web console
        run: make verify-web

      # Tours build against the @stigmer/* workspace source, so this is the
      # gate that catches an SDK change breaking a tour before release time
      # (bundles are only packed by release.website.yaml).
      - name: Typecheck Scenar tours
        run: npm run typecheck -w @stigmer/demos

      # Same coupling as the tours: e2e specs typecheck against @stigmer/sdk
      # + @stigmer/protos workspace source, and no other lane typechecks
      # test/e2e (the interactive Playwright project never runs in CI), so
      # spec/helper drift is invisible without this step (cloud#275).
      - name: Typecheck e2e specs
        run: npm run typecheck -w @stigmer/e2e

      # Determinism (DD-006), timeline shape, and docs embed-id resolution.
      # Also wired in ci.docs.yaml: this workflow doesn't trigger on docs/**,
      # so each workflow guards the half of the contract its paths cover.
      - name: Verify Scenar tours
        run: node scripts/verify-scenar-tours.mjs

      - name: Verify desktop app
        run: make verify-desktop
        continue-on-error: true
