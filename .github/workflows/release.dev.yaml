name: release.dev

# =============================================================================
# Dev-publishing pipeline (manual / on-demand, from `main` only).
#
# Publishes a "dev" build of the Stigmer npm packages and of the sandbox runner
# image from a commit of `main`. Dev builds exist for compositions that embed
# @stigmer/server (the hosted edition): an open-source change a composition
# needs merges here first, this workflow publishes that commit, and the
# composition pins the build and merges on it before the change is released.
#
# Design (see .github/workflows/docs/dev-publishing.md):
#   - This is a SEPARATE pipeline from the production release.* workflows. Those
#     only ever publish immutable, lockstep `v*` releases to npmjs.com and
#     ghcr.io, the registries users install from. A dev build never goes there:
#       * npm    -> `X.Y.Z-dev.<stamp>.g<sha>` under the `dev` dist-tag in
#                   Stigmer's own npm repository on Google Artifact Registry
#                   (vars.STIGMER_NPM_REGISTRY); the version names the commit.
#       * Docker -> the sandbox runner image at the npm version,
#                   `<vars.STIGMER_OSS_REGISTRY_ROOT>/runner:v<npm version>`,
#                   published before the server that launches it.
#     Both repositories are publicly readable, so installing or pulling a dev
#     build needs no login, and nobody browsing npmjs.com or ghcr.io sees one.
#     Releases are copied into the npm repository too (release.npm-mirror.yaml),
#     so a consumer that routes the @stigmer scope there once installs a dev
#     build and a release alike, and switching is a version-string change.
#   - Publishing is keyless. Each publishing job exchanges GitHub's OIDC token
#     with Google's workload identity pool for a short-lived token of the
#     publisher (vars.GCP_WORKLOAD_IDENTITY_PROVIDER, vars.GCP_IMAGE_PUBLISHER).
#     The pool admits this workflow, release.runner-images.yaml and
#     release.npm-mirror.yaml, on `main` or a `v*` tag only. No npm token is
#     involved.
#   - Where a package goes is npm's own configuration: setup-node points the
#     @stigmer scope at the npm repository (`scope:`), npm publishes a scoped
#     package to its scope's registry, and the publish scripts wait on and
#     smoke-install from that same registry (scripts/publish-standalone.mjs,
#     configuredRegistry).
#   - X.Y.Z is the next patch after the newest stable v* tag, or 0.1.0 while the
#     line has no release yet (scripts/lib/line-base.mjs). Until v0.1.0 is
#     tagged a dev build is `0.1.0-dev.<14-digit UTC stamp>.g<12-char sha>`;
#     after it, `0.1.1-dev...`.
#   - Python, Java, the Go SDK, the Rust crate and the MCP server image have no
#     dev build: their consumers install releases, and Go and Rust can follow a
#     commit of `main` by git ref.
#
# Trigger: workflow_dispatch only, on `main`. The first job refuses any other
# ref: the publisher's trust admits `main` and release tags only, so a run from
# a branch would otherwise fail at its first Google sign-in, many minutes in.
# Unmerged work is tried from tarballs of the checkout instead
# (scripts/stage-server-library.mjs), which publishes nothing.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: 'Base semver to derive the dev build from, e.g. 0.1.1 (default: next patch after the latest v* tag, or 0.1.0 before the first release)'
        required: false
        type: string
      targets:
        description: 'What to publish: "npm" (the packages and the sandbox runner image) or "all" (the same)'
        required: false
        default: 'all'
        type: string

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Refuse a ref other than `main`, then derive the dev version: one base,
  # stamped with the time and the commit.
  # ---------------------------------------------------------------------------
  determine-version:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.v.outputs.targets }}
      base: ${{ steps.v.outputs.base }}
      npm_version: ${{ steps.v.outputs.npm_version }}
      short_sha: ${{ steps.v.outputs.short_sha }}
    steps:
      - name: Refuse a ref other than main
        env:
          REF: ${{ github.ref }}
          NPM_REGISTRY: ${{ vars.STIGMER_NPM_REGISTRY }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::release.dev publishes from main only, and this run is on '$REF'. The publisher's trust admits main and release tags, so a dev build is always a commit of main a composition can merge on; stage unmerged work as tarballs with scripts/stage-server-library.mjs, which publishes nothing." >&2
            exit 1
          fi
          # Without it setup-node writes no scope line and npm would publish to
          # npmjs.com, which then refuses for want of a token: refuse here instead.
          if [ -z "$NPM_REGISTRY" ]; then
            echo "::error::the repository Variable STIGMER_NPM_REGISTRY is unset: dev builds publish to Stigmer's npm repository, never npmjs.com" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive the dev version
        id: v
        run: |
          set -euo pipefail

          # "all" and "npm" are the same publish: the packages and the runner
          # image their server launches. The Maven, PyPI and MCP-image dev
          # channels were retired; a stale dispatch naming one is refused
          # rather than publishing half of what was asked.
          TARGETS="${GITHUB_EVENT_INPUTS_TARGETS}"
          case "${TARGETS:-all}" in
            all|npm) TARGETS="npm" ;;
            *)
              echo "::error::targets '$TARGETS' is not a dev channel: release.dev publishes npm (with the runner image) only. Maven, PyPI and the MCP image publish releases only." >&2
              exit 1
              ;;
          esac

          # Base semver: explicit input wins; otherwise the next patch after the
          # newest stable v* tag, or 0.1.0 before the line's first release
          # (scripts/lib/line-base.mjs, the rule `make release` tags by too). A
          # dev build always targets the NEXT unreleased version so it sorts
          # below the eventual real release.
          BASE="${GITHUB_EVENT_INPUTS_BASE_VERSION}"
          if [ -z "$BASE" ]; then
            BASE=$(node scripts/lib/line-base.mjs)
          fi

          # Reject a base that collides with an existing release tag: a dev build
          # must never share a coordinate with a real release (cf. the published
          # @stigmer/apis shadowing a workspace stub, issue #156).
          if git rev-parse "v${BASE}" >/dev/null 2>&1; then
            echo "ERROR: v${BASE} already exists as a release tag. Pass a higher base_version." >&2
            exit 1
          fi

          STAMP=$(date -u +%Y%m%d%H%M%S)   # monotonic; keeps each npm dev build unique
          SHORT_SHA=$(git rev-parse --short HEAD)
          # The npm version names the commit it was built from (`.g<sha>`);
          # scripts/lib/dev-version.mjs is the rule.
          NPM_VERSION=$(node scripts/lib/dev-version.mjs --base "$BASE" --stamp "$STAMP")

          {
            echo "targets=$TARGETS"
            echo "base=$BASE"
            echo "npm_version=${NPM_VERSION}"
            echo "short_sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

          echo "Dev build base: $BASE"
          echo "  npm    : ${NPM_VERSION} (tag: dev)"
          echo "  runner : runner:v${NPM_VERSION}"
        env:
          GITHUB_EVENT_INPUTS_TARGETS: ${{ github.event.inputs.targets }}
          GITHUB_EVENT_INPUTS_BASE_VERSION: ${{ github.event.inputs.base_version }}

  # ---------------------------------------------------------------------------
  # npm: publish all @stigmer/* libs under the `dev` dist-tag, to Stigmer's
  # npm repository. publish-libs.mjs handles build + dist/package.json
  # stamping; --tag dev keeps these off `latest` and `next` there too.
  # ---------------------------------------------------------------------------
  publish-npm:
    needs: determine-version
    if: contains(needs.determine-version.outputs.targets, 'npm')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # exchanged for the publisher's token (Authenticate to Google Cloud)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Node before stub generation: the stub scrub inside gen-stubs.sh runs
      # from TypeScript source via the repo-pinned tsx.
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # No restored npm cache in a release (v5+ caches by default).
          package-manager-cache: false
          node-version-file: ".nvmrc"
          # @stigmer/* goes to Stigmer's npm repository, never npmjs.com.
          registry-url: ${{ vars.STIGMER_NPM_REGISTRY }}
          scope: '@stigmer'

      - name: Install dependencies
        run: npm ci

      - name: Generate TypeScript proto stubs
        run: STUBS_FORCE=1 make -C apis ts-stubs

      # Keyless: GitHub's OIDC token, exchanged for a short-lived token of the
      # publisher, which may write Stigmer's npm repository. Taken just before
      # the publish so the hour it lasts covers the wait and the smoke.
      - name: Authenticate to Google Cloud (keyless)
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUBLISHER }}
          token_format: access_token
          create_credentials_file: false

      - name: Publish @stigmer/* to Stigmer's npm repository (dev tag)
        env:
          NODE_AUTH_TOKEN: ${{ steps.gcp.outputs.access_token }}
          NEEDS_DETERMINE_VERSION_OUTPUTS_NPM_VERSION: ${{ needs.determine-version.outputs.npm_version }}
        run: node scripts/publish-libs.mjs --version "${NEEDS_DETERMINE_VERSION_OUTPUTS_NPM_VERSION}" --tag dev

  # @stigmer/runner is a non-workspace npm package built via `make build-runner`.
  # It pins @stigmer/apis to the exact dev version, so it must run after the
  # libs job has published that version. Mirrors the production publish-runner.
  publish-npm-runner:
    needs: [determine-version, publish-npm]
    if: contains(needs.determine-version.outputs.targets, 'npm')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # exchanged for the publisher's token (Authenticate to Google Cloud)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Node before stub generation: the stub scrub inside gen-stubs.sh runs
      # from TypeScript source via the repo-pinned tsx.
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # No restored npm cache in a release (v5+ caches by default).
          package-manager-cache: false
          node-version-file: ".nvmrc"
          # @stigmer/* goes to, and is read from, Stigmer's npm repository.
          registry-url: ${{ vars.STIGMER_NPM_REGISTRY }}
          scope: '@stigmer'

      - name: Install dependencies
        run: npm ci

      - name: Generate TypeScript proto stubs
        run: STUBS_FORCE=1 make -C apis ts-stubs

      - name: Build runner
        run: make build-runner

      # Keyless: GitHub's OIDC token, exchanged for a short-lived token of the
      # publisher, which may write Stigmer's npm repository. Taken just before
      # the publish so the hour it lasts covers the wait and the smoke.
      - name: Authenticate to Google Cloud (keyless)
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUBLISHER }}
          token_format: access_token
          create_credentials_file: false

      # The standalone publish sequence (scripts/publish-standalone.mjs, shared
      # with @stigmer/server and with release.npm-libs.yaml): stamp the dev
      # version, pin EVERY workspace-lib file: link to it (the inline block
      # this replaced pinned protos and temporal-codecs but not zip-structure,
      # so a dev runner tarball carried an unresolvable file: link), wait for
      # the pinned libs in the registry, run the consumer-install smoke (#786) over the
      # real stamped manifest, publish under the `dev` dist-tag. The manifest
      # stays stamped for the slim steps below.
      - name: Publish runner to Stigmer's npm repository (dev tag)
        env:
          NODE_AUTH_TOKEN: ${{ steps.gcp.outputs.access_token }}
          NEEDS_DETERMINE_VERSION_OUTPUTS_NPM_VERSION: ${{ needs.determine-version.outputs.npm_version }}
        run: |
          node scripts/publish-standalone.mjs \
            --package backend/services/runner \
            --version "${NEEDS_DETERMINE_VERSION_OUTPUTS_NPM_VERSION}" \
            --tag dev

      # npm's debug log, kept when the job fails: a failed install or publish
      # names its log file but the runner is gone before anyone can read it
      # (stigmer#1367). A failure before npm runs leaves no log, so none is
      # not an error.
      - name: Upload npm's debug log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-logs-runner
          path: ~/.npm/_logs/
          retention-days: 3
          if-no-files-found: ignore

      # The slim embedding artifact (stigmer/stigmer#170), mirroring the
      # production publish in release.npm-libs.yaml. Self-contained — its bundle
      # does not pin @stigmer/apis — so it just needs the version already
      # stamped above, which the bundle script propagates into every manifest.
      - name: Build slim artifact packages
        working-directory: backend/services/runner
        run: node scripts/bundle-slim.mjs --emit-packages

      - name: Set up Temporal CLI
        uses: temporalio/setup-temporal@1059a504f87e7fa2f385e3fa40d1aa7e62f1c6ca # v0

      - name: Verify slim artifact boots
        working-directory: backend/services/runner
        run: |
          temporal server start-dev --headless --log-level error &
          TEMPORAL_PID=$!
          trap "kill $TEMPORAL_PID" EXIT
          for i in $(seq 1 30); do
            temporal operator cluster health >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/verify-slim-artifact.mjs

      - name: Publish slim packages to Stigmer's npm repository (dev tag)
        working-directory: backend/services/runner
        env:
          NODE_AUTH_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          # Platform packages first so the meta package's optionalDependencies
          # resolve the moment it lands.
          for pkg in dist-slim-pkgs/runner-slim-*; do
            (cd "$pkg" && npm publish --access public --tag dev)
          done
          cd dist-slim-pkgs/runner-slim && npm publish --access public --tag dev

  # The sandbox runner image of this build (release.runner-images.yaml, the
  # lane release.sandbox-cloud runs for main and the release tags), pushed to
  # Stigmer's image repository (vars.STIGMER_OSS_REGISTRY_ROOT) and tagged
  # v<npm version> after the in-image smoke: a composition that selects its
  # runner by its pin finds it by the version it pins, so it names no image
  # by hand. Never latest or prod, no runner-base or runner-layer, and the
  # layer inside is a development layer (a dev server sends no release).
  # id-token for the keyless push; packages to read the build cache on
  # ghcr.io. The lane's failure notice stays with release.sandbox-cloud.
  publish-runner-image:
    needs: determine-version
    if: contains(needs.determine-version.outputs.targets, 'npm')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/release.runner-images.yaml
    with:
      dev_version: ${{ needs.determine-version.outputs.npm_version }}

  # @stigmer/server as a library — the dev twin of release.npm-libs.yaml's
  # publish-server. This is the lane a cross-repo seam change rides: once the
  # OSS pull request has merged, dispatch this workflow (it runs on `main`
  # only), and the composition's PR pins the `X.Y.Z-dev.<stamp>.g<sha>` it
  # prints and merges on it.
  # Same publish-standalone.mjs sequence as production; the consumer-install
  # smoke boots the staged install against a Temporal dev server and requires
  # every worker to start. It waits for this build's runner image, so a
  # server version in the npm repository always has its runner (about two minutes: the
  # runner lane ends shortly after publish-npm, which the server waits for
  # anyway).
  publish-npm-server:
    needs: [determine-version, publish-npm, publish-runner-image]
    if: contains(needs.determine-version.outputs.targets, 'npm')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # exchanged for the publisher's token (Authenticate to Google Cloud)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # No restored npm cache in a release (v5+ caches by default).
          package-manager-cache: false
          node-version-file: ".nvmrc"
          # @stigmer/* goes to, and is read from, Stigmer's npm repository.
          registry-url: ${{ vars.STIGMER_NPM_REGISTRY }}
          scope: '@stigmer'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build TS server
        run: make build-server

      - name: Set up Temporal CLI
        uses: temporalio/setup-temporal@1059a504f87e7fa2f385e3fa40d1aa7e62f1c6ca # v0

      # Keyless: GitHub's OIDC token, exchanged for a short-lived token of the
      # publisher, which may write Stigmer's npm repository. Taken just before
      # the publish so the hour it lasts covers the wait and the smoke.
      - name: Authenticate to Google Cloud (keyless)
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUBLISHER }}
          token_format: access_token
          create_credentials_file: false

      - name: Publish server to Stigmer's npm repository (dev tag)
        env:
          NODE_AUTH_TOKEN: ${{ steps.gcp.outputs.access_token }}
          NEEDS_DETERMINE_VERSION_OUTPUTS_NPM_VERSION: ${{ needs.determine-version.outputs.npm_version }}
        run: |
          temporal server start-dev --headless --log-level error &
          TEMPORAL_PID=$!
          trap "kill $TEMPORAL_PID" EXIT
          for i in $(seq 1 30); do
            temporal operator cluster health >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/publish-standalone.mjs \
            --package backend/services/stigmer-server \
            --version "${NEEDS_DETERMINE_VERSION_OUTPUTS_NPM_VERSION}" \
            --tag dev

      # npm's debug log, kept when the job fails: a failed install or publish
      # names its log file but the runner is gone before anyone can read it
      # (stigmer#1367). A failure before npm runs leaves no log, so none is
      # not an error.
      - name: Upload npm's debug log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-logs-server
          path: ~/.npm/_logs/
          retention-days: 3
          if-no-files-found: ignore

  # @stigmer/enterprise (ee/server) — the dev twin of release.npm-libs.yaml's
  # publish-enterprise, at the same version as the server it links, so a
  # composition pins every @stigmer/* package at the one build this run
  # prints. Needs `publish-npm-server`: its tarball pins that server version.
  publish-npm-enterprise:
    needs: [determine-version, publish-npm-server]
    if: contains(needs.determine-version.outputs.targets, 'npm')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # exchanged for the publisher's token (Authenticate to Google Cloud)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # No restored npm cache in a release (v5+ caches by default).
          package-manager-cache: false
          node-version-file: ".nvmrc"
          # @stigmer/* goes to, and is read from, Stigmer's npm repository.
          registry-url: ${{ vars.STIGMER_NPM_REGISTRY }}
          scope: '@stigmer'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the Enterprise package
        run: make build-ee

      - name: Set up Temporal CLI
        uses: temporalio/setup-temporal@1059a504f87e7fa2f385e3fa40d1aa7e62f1c6ca # v0

      # Keyless: GitHub's OIDC token, exchanged for a short-lived token of the
      # publisher, which may write Stigmer's npm repository. Taken just before
      # the publish so the hour it lasts covers the wait and the smoke.
      - name: Authenticate to Google Cloud (keyless)
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUBLISHER }}
          token_format: access_token
          create_credentials_file: false

      - name: Publish Enterprise to Stigmer's npm repository (dev tag)
        env:
          NODE_AUTH_TOKEN: ${{ steps.gcp.outputs.access_token }}
          NEEDS_DETERMINE_VERSION_OUTPUTS_NPM_VERSION: ${{ needs.determine-version.outputs.npm_version }}
        run: |
          temporal server start-dev --headless --log-level error &
          TEMPORAL_PID=$!
          trap "kill $TEMPORAL_PID" EXIT
          for i in $(seq 1 30); do
            temporal operator cluster health >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/publish-standalone.mjs \
            --package ee/server \
            --version "${NEEDS_DETERMINE_VERSION_OUTPUTS_NPM_VERSION}" \
            --tag dev

      # npm's debug log, kept when the job fails: a failed install or publish
      # names its log file but the runner is gone before anyone can read it
      # (stigmer#1367). A failure before npm runs leaves no log, so none is
      # not an error.
      - name: Upload npm's debug log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-logs-enterprise
          path: ~/.npm/_logs/
          retention-days: 3
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Print what a composition pins: the version, where it lives, and the scope
  # line that routes @stigmer/* there.
  # ---------------------------------------------------------------------------
  summary:
    needs: [determine-version, publish-npm, publish-runner-image, publish-npm-runner, publish-npm-server, publish-npm-enterprise]
    if: always() && needs.determine-version.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Write dev build summary
        env:
          BASE: ${{ needs.determine-version.outputs.base }}
          NPM_VERSION: ${{ needs.determine-version.outputs.npm_version }}
          SHORT_SHA: ${{ needs.determine-version.outputs.short_sha }}
          NPM_REGISTRY: ${{ vars.STIGMER_NPM_REGISTRY }}
          OSS_REGISTRY_ROOT: ${{ vars.STIGMER_OSS_REGISTRY_ROOT }}
          RUNNER_RESULT: ${{ needs.publish-runner-image.result }}
          SERVER_RESULT: ${{ needs.publish-npm-server.result }}
        run: |
          {
            echo "# Stigmer dev build published"
            echo ""
            echo "Base: \`$BASE\` · commit: \`$SHORT_SHA\` on \`main\`"
            echo ""
            echo "## npm (Stigmer's npm repository)"
            echo "A consumer routes the scope once, in an \`.npmrc\` beside its manifest:"
            echo '```ini'
            echo "@stigmer:registry=$NPM_REGISTRY"
            echo '```'
            echo "then pins exactly \`$NPM_VERSION\` (the \`dev\` dist-tag there names the newest dev build). Releases are mirrored into the same repository, so a release pin needs no other change."
            echo ""
            echo "## Sandbox runner image"
            if [ "$RUNNER_RESULT" = "success" ]; then
              echo '```text'
              echo "$OSS_REGISTRY_ROOT/runner:v$NPM_VERSION   (linux/amd64)"
              echo '```'
              echo "Booted in the image before publishing. A composition that selects its runner by its pin launches this image."
            else
              echo "Not published (\`publish-runner-image\`: $RUNNER_RESULT)."
            fi
            echo ""
            echo "## @stigmer/server library (a composition's pin)"
            if [ "$SERVER_RESULT" = "success" ]; then
              echo '```json'
              echo "\"@stigmer/server\": \"$NPM_VERSION\", \"@stigmer/apis\": \"$NPM_VERSION\", \"@stigmer/temporal-codecs\": \"$NPM_VERSION\", \"@stigmer/outbound\": \"$NPM_VERSION\", \"@stigmer/enterprise\": \"$NPM_VERSION\""
              echo '```'
              echo "Exact versions, all equal. Built from \`main\`, so a composition may merge on it."
            else
              echo "Not pinnable: \`@stigmer/server@$NPM_VERSION\` was not published (\`publish-npm-server\`: $SERVER_RESULT; it waits for the runner image, \`publish-runner-image\`: $RUNNER_RESULT)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
