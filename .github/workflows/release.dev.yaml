name: release.dev

# =============================================================================
# Dev-publishing pipeline (manual / on-demand).
#
# Publishes throwaway "dev" builds of the Stigmer dependencies so two developers
# can iterate across repos fast: one publishes a dev build, the other bumps a
# version reference and tries it within minutes.
#
# Design (see .github/workflows/docs/dev-publishing.md):
#   - This is a SEPARATE pipeline from the production release.* workflows. Those
#     stay pristine and only ever publish immutable, signed, lockstep `v*`
#     releases. This one is dispatch-only and routes to each ecosystem's NATIVE
#     EPHEMERAL dev channel so nothing pollutes a production release index:
#       * Maven  -> `X.Y.Z-SNAPSHOT` to the Sonatype Central snapshot repo
#                   (mutable, auto-expired; reuses MAVEN_CENTRAL_* creds).
#       * npm    -> `X.Y.Z-dev.<stamp>` under the `dev` dist-tag on public npm
#                   (never touches `latest`/`next`).
#       * PyPI   -> `X.Y.Z.dev<N>` to TestPyPI (the purpose-built throwaway PyPI).
#       * Docker -> `ghcr.io/stigmer/mcp-server-stigmer:dev-<sha>` on GHCR.
#   - Consumers configure each channel ONCE; thereafter switching a dev<->prod
#     dependency is only a version-string change (see the consumer doc).
#   - Go SDK and the Rust crate have no dev publish step: their native dev
#     mechanism is a git ref (`go get ...@<branch>` / a Cargo git dependency).
#     The job summary documents the exact coordinates.
#
# Trigger: workflow_dispatch only. The file must exist on the default branch for
# GitHub to expose the dispatch, but it can then run against ANY branch/ref
# (publish dev builds straight off your feature branch).
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: 'Base semver to derive the dev build from, e.g. 3.0.1 (default: next patch after the latest v* tag)'
        required: false
        type: string
      targets:
        description: 'Comma-separated targets to publish: maven, npm, python, mcp (or "all")'
        required: false
        default: 'all'
        type: string

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Derive one dev "base" version and the per-ecosystem coordinates from it.
  # Mirrors the lockstep mental model of the production release train: one base
  # drives every artifact, just with an ecosystem-appropriate dev suffix.
  # ---------------------------------------------------------------------------
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.v.outputs.targets }}
      base: ${{ steps.v.outputs.base }}
      maven_version: ${{ steps.v.outputs.maven_version }}
      npm_version: ${{ steps.v.outputs.npm_version }}
      py_version: ${{ steps.v.outputs.py_version }}
      docker_tag: ${{ steps.v.outputs.docker_tag }}
      short_sha: ${{ steps.v.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive dev versions
        id: v
        run: |
          set -euo pipefail

          # Normalize the target list. "all" expands to every publishable channel.
          TARGETS="${GITHUB_EVENT_INPUTS_TARGETS}"
          [ -z "$TARGETS" ] && TARGETS="all"
          if [ "$TARGETS" = "all" ]; then
            TARGETS="maven,npm,python,mcp"
          fi

          # The dev MCP image installs the published @stigmer/mcp-server package,
          # so building it requires the npm publish to run first. Ensure npm is
          # selected whenever mcp is.
          if echo ",$TARGETS," | grep -q ",mcp," && ! echo ",$TARGETS," | grep -q ",npm,"; then
            TARGETS="$TARGETS,npm"
          fi

          # Base semver: explicit input wins; otherwise bump the patch of the
          # latest v* tag. A dev build always targets the NEXT unreleased version
          # so it sorts below the eventual real release.
          BASE="${GITHUB_EVENT_INPUTS_BASE_VERSION}"
          if [ -z "$BASE" ]; then
            LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n1)
            [ -z "$LATEST_TAG" ] && LATEST_TAG="v0.0.0"
            V="${LATEST_TAG#v}"
            MAJOR=$(echo "$V" | cut -d. -f1)
            MINOR=$(echo "$V" | cut -d. -f2)
            PATCH=$(echo "$V" | cut -d. -f3)
            BASE="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          # Reject a base that collides with an existing release tag: a dev build
          # must never share a coordinate with a real release (cf. the published
          # @stigmer/protos shadowing a workspace stub, issue #156).
          if git rev-parse "v${BASE}" >/dev/null 2>&1; then
            echo "ERROR: v${BASE} already exists as a release tag. Pass a higher base_version." >&2
            exit 1
          fi

          STAMP=$(date -u +%Y%m%d%H%M%S)   # monotonic; keeps each npm dev build unique
          EPOCH=$(date -u +%s)             # PEP 440 .devN must be an integer
          SHORT_SHA=$(git rev-parse --short HEAD)

          {
            echo "targets=$TARGETS"
            echo "base=$BASE"
            echo "maven_version=${BASE}-SNAPSHOT"
            echo "npm_version=${BASE}-dev.${STAMP}"
            echo "py_version=${BASE}.dev${EPOCH}"
            echo "docker_tag=dev-${SHORT_SHA}"
            echo "short_sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

          echo "Dev build base: $BASE (targets: $TARGETS)"
          echo "  maven  : ${BASE}-SNAPSHOT"
          echo "  npm    : ${BASE}-dev.${STAMP} (tag: dev)"
          echo "  python : ${BASE}.dev${EPOCH} (TestPyPI)"
          echo "  docker : dev-${SHORT_SHA}"
        env:
          GITHUB_EVENT_INPUTS_TARGETS: ${{ github.event.inputs.targets }}
          GITHUB_EVENT_INPUTS_BASE_VERSION: ${{ github.event.inputs.base_version }}

  # ---------------------------------------------------------------------------
  # Java: deploy `X.Y.Z-SNAPSHOT` to the Central snapshot repo.
  # No GPG, no `-P release`: plain `mvn deploy` uses the default
  # maven-deploy-plugin, which routes a -SNAPSHOT to <snapshotRepository>.
  # ---------------------------------------------------------------------------
  publish-maven:
    needs: determine-version
    if: contains(needs.determine-version.outputs.targets, 'maven')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      - name: Deploy protos SNAPSHOT
        working-directory: apis/stubs/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          NEEDS_DETERMINE_VERSION_OUTPUTS_MAVEN_VERSION: ${{ needs.determine-version.outputs.maven_version }}
        run: |
          VERSION="${NEEDS_DETERMINE_VERSION_OUTPUTS_MAVEN_VERSION}"
          mvn --batch-mode versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          # `deploy` runs through `install`, so the SNAPSHOT is also placed in the
          # local ~/.m2 for the SDK build below to resolve.
          mvn --batch-mode deploy -DskipTests
          echo "Deployed ai.stigmer:stigmer-java-protos:$VERSION"

      - name: Generate SDK client code
        run: make -C sdk/java codegen

      - name: Deploy SDK SNAPSHOT
        working-directory: sdk/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          NEEDS_DETERMINE_VERSION_OUTPUTS_MAVEN_VERSION: ${{ needs.determine-version.outputs.maven_version }}
        run: |
          VERSION="${NEEDS_DETERMINE_VERSION_OUTPUTS_MAVEN_VERSION}"
          mvn --batch-mode versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn --batch-mode versions:set-property -Dproperty=stigmer-protos.version -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn --batch-mode deploy -DskipTests
          echo "Deployed ai.stigmer:stigmer-java:$VERSION (protos: $VERSION)"

  # ---------------------------------------------------------------------------
  # npm: publish all @stigmer/* libs under the `dev` dist-tag.
  # publish-libs.mjs handles build + dist/package.json stamping; --tag dev keeps
  # these off `latest` and `next`.
  # ---------------------------------------------------------------------------
  publish-npm:
    needs: determine-version
    if: contains(needs.determine-version.outputs.targets, 'npm')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Node before stub generation: the stub scrub inside gen-stubs.sh runs
      # from TypeScript source via the repo-pinned tsx.
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # No restored npm cache in a release (v5+ caches by default).
          package-manager-cache: false
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Generate TypeScript proto stubs
        run: STUBS_FORCE=1 make -C apis ts-stubs

      - name: Publish @stigmer/* to npm (dev tag)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NEEDS_DETERMINE_VERSION_OUTPUTS_NPM_VERSION: ${{ needs.determine-version.outputs.npm_version }}
        run: node scripts/publish-libs.mjs --version "${NEEDS_DETERMINE_VERSION_OUTPUTS_NPM_VERSION}" --tag dev

  # @stigmer/runner is a non-workspace npm package built via `make build-runner`.
  # It pins @stigmer/protos to the exact dev version, so it must run after the
  # libs job has put that version on npm. Mirrors the production publish-runner.
  publish-npm-runner:
    needs: [determine-version, publish-npm]
    if: contains(needs.determine-version.outputs.targets, 'npm')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Node before stub generation: the stub scrub inside gen-stubs.sh runs
      # from TypeScript source via the repo-pinned tsx.
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # No restored npm cache in a release (v5+ caches by default).
          package-manager-cache: false
          node-version-file: ".nvmrc"
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Generate TypeScript proto stubs
        run: STUBS_FORCE=1 make -C apis ts-stubs

      - name: Build runner
        run: make build-runner

      # The standalone publish sequence (scripts/publish-standalone.mjs, shared
      # with @stigmer/server and with release.npm-libs.yaml): stamp the dev
      # version, pin EVERY workspace-lib file: link to it (the inline block
      # this replaced pinned protos and temporal-codecs but not zip-structure,
      # so a dev runner tarball carried an unresolvable file: link), wait for
      # the pinned libs on npm, run the consumer-install smoke (#786) over the
      # real stamped manifest, publish under the `dev` dist-tag. The manifest
      # stays stamped for the slim steps below.
      - name: Publish runner to npm (dev tag)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NEEDS_DETERMINE_VERSION_OUTPUTS_NPM_VERSION: ${{ needs.determine-version.outputs.npm_version }}
        run: |
          node scripts/publish-standalone.mjs \
            --package backend/services/runner \
            --version "${NEEDS_DETERMINE_VERSION_OUTPUTS_NPM_VERSION}" \
            --tag dev

      # The slim embedding artifact (stigmer/stigmer#170), mirroring the
      # production publish in release.npm-libs.yaml. Self-contained — its bundle
      # does not pin @stigmer/protos — so it just needs the version already
      # stamped above, which the bundle script propagates into every manifest.
      - name: Build slim artifact packages
        working-directory: backend/services/runner
        run: node scripts/bundle-slim.mjs --emit-packages

      - name: Set up Temporal CLI
        uses: temporalio/setup-temporal@1059a504f87e7fa2f385e3fa40d1aa7e62f1c6ca # v0

      - name: Verify slim artifact boots
        working-directory: backend/services/runner
        run: |
          temporal server start-dev --headless --log-level error &
          TEMPORAL_PID=$!
          trap "kill $TEMPORAL_PID" EXIT
          for i in $(seq 1 30); do
            temporal operator cluster health >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/verify-slim-artifact.mjs

      - name: Publish slim packages to npm (dev tag)
        working-directory: backend/services/runner
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Platform packages first so the meta package's optionalDependencies
          # resolve the moment it lands.
          for pkg in dist-slim-pkgs/runner-slim-*; do
            (cd "$pkg" && npm publish --access public --tag dev)
          done
          cd dist-slim-pkgs/runner-slim && npm publish --access public --tag dev

  # @stigmer/server as a library (stigmer-cloud project 20260910.04) — the
  # dev twin of release.npm-libs.yaml's publish-server. This is the lane a
  # cross-repo seam change rides: dispatch this workflow from the OSS feature
  # branch, and the cloud composition's PR pins the `X.Y.Z-dev.<stamp>` it
  # prints while the seam is reviewed (the cloud's pin guard keeps that PR red
  # until it re-pins the released version). Same publish-standalone.mjs
  # sequence as production; the consumer-install smoke boots the staged
  # install against a Temporal dev server and requires every worker to start.
  publish-npm-server:
    needs: [determine-version, publish-npm]
    if: contains(needs.determine-version.outputs.targets, 'npm')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # No restored npm cache in a release (v5+ caches by default).
          package-manager-cache: false
          node-version-file: ".nvmrc"
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build TS server
        run: make build-server

      - name: Set up Temporal CLI
        uses: temporalio/setup-temporal@1059a504f87e7fa2f385e3fa40d1aa7e62f1c6ca # v0

      - name: Publish server to npm (dev tag)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NEEDS_DETERMINE_VERSION_OUTPUTS_NPM_VERSION: ${{ needs.determine-version.outputs.npm_version }}
        run: |
          temporal server start-dev --headless --log-level error &
          TEMPORAL_PID=$!
          trap "kill $TEMPORAL_PID" EXIT
          for i in $(seq 1 30); do
            temporal operator cluster health >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/publish-standalone.mjs \
            --package backend/services/stigmer-server \
            --version "${NEEDS_DETERMINE_VERSION_OUTPUTS_NPM_VERSION}" \
            --tag dev

  # ---------------------------------------------------------------------------
  # Python: publish dev releases to TestPyPI (keeps prod PyPI clean).
  # Auth is OIDC trusted publishing, matching release.python-sdk; a Trusted
  # Publisher for test.pypi.org must be configured for both projects.
  # ---------------------------------------------------------------------------
  publish-python-protos:
    needs: determine-version
    if: contains(needs.determine-version.outputs.targets, 'python')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Node before stub generation: the stub scrub inside gen-stubs.sh runs
      # from TypeScript source via the repo-pinned tsx.
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # No restored npm cache in a release (v5+ caches by default).
          package-manager-cache: false
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Generate Python proto stubs
        run: STUBS_FORCE=1 make -C apis python-stubs

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Set version
        working-directory: apis/stubs/python/stigmer
        run: |
          VERSION="${NEEDS_DETERMINE_VERSION_OUTPUTS_PY_VERSION}"
          python -c "
          import re, pathlib
          p = pathlib.Path('pyproject.toml')
          text = p.read_text()
          text = re.sub(r'version\s*=\s*\"[^\"]*\"', 'version = \"$VERSION\"', text, count=1)
          p.write_text(text)
          "
          echo "Set stigmer-protos version to $VERSION"
        env:
          NEEDS_DETERMINE_VERSION_OUTPUTS_PY_VERSION: ${{ needs.determine-version.outputs.py_version }}

      - name: Build package
        working-directory: apis/stubs/python/stigmer
        run: |
          pip install build
          python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: apis/stubs/python/stigmer/dist/
          repository-url: https://test.pypi.org/legacy/

  publish-python-sdk:
    needs: [determine-version, publish-python-protos]
    if: contains(needs.determine-version.outputs.targets, 'python')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Generate SDK client code
        run: make -C sdk/python codegen

      - name: Set version and pin protos dependency
        working-directory: sdk/python
        run: |
          VERSION="${NEEDS_DETERMINE_VERSION_OUTPUTS_PY_VERSION}"
          python -c "
          import re, pathlib
          p = pathlib.Path('pyproject.toml')
          text = p.read_text()
          text = re.sub(r'version\s*=\s*\"[^\"]*\"', 'version = \"$VERSION\"', text, count=1)
          text = re.sub(r'\"stigmer-protos[^\"]*\"', '\"stigmer-protos==$VERSION\"', text)
          p.write_text(text)
          "
          echo "Set stigmer version to $VERSION (protos dependency: $VERSION)"
        env:
          NEEDS_DETERMINE_VERSION_OUTPUTS_PY_VERSION: ${{ needs.determine-version.outputs.py_version }}

      - name: Build package
        working-directory: sdk/python
        run: |
          pip install build
          python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist/
          repository-url: https://test.pypi.org/legacy/

  # ---------------------------------------------------------------------------
  # MCP server: build + push a dev Docker image to GHCR (mutable, deletable).
  # Tags both an immutable-per-commit `dev-<sha>` and a moving `dev` pointer.
  # ---------------------------------------------------------------------------
  # The dev image installs the published dev @stigmer/mcp-server, so it runs
  # after publish-npm (which publishes it under the `dev` dist-tag). determine-
  # version guarantees npm is targeted whenever mcp is.
  publish-mcp:
    needs: [determine-version, publish-npm]
    if: contains(needs.determine-version.outputs.targets, 'mcp')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # No restored npm cache in a release (v5+ caches by default).
          package-manager-cache: false
          node-version: '20'

      - name: Wait for @stigmer/mcp-server on npm
        env:
          NPM_VERSION: ${{ needs.determine-version.outputs.npm_version }}
        run: |
          echo "Waiting for @stigmer/mcp-server@$NPM_VERSION on npm..."
          for i in $(seq 1 30); do
            if npm view "@stigmer/mcp-server@$NPM_VERSION" version 2>/dev/null; then
              echo "Found @stigmer/mcp-server@$NPM_VERSION on npm"
              exit 0
            fi
            echo "Attempt $i/30: not yet available, waiting 10s..."
            sleep 10
          done
          echo "ERROR: @stigmer/mcp-server@$NPM_VERSION not found on npm after 5 minutes"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        env:
          DOCKER_TAG: ${{ needs.determine-version.outputs.docker_tag }}
          NPM_VERSION: ${{ needs.determine-version.outputs.npm_version }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file mcp-server/Dockerfile \
            --build-arg NODE_IMAGE=node:22-alpine \
            --build-arg MCP_SERVER_VERSION=$NPM_VERSION \
            --tag ghcr.io/stigmer/mcp-server-stigmer:$DOCKER_TAG \
            --tag ghcr.io/stigmer/mcp-server-stigmer:dev \
            --push \
            .
          echo "Pushed ghcr.io/stigmer/mcp-server-stigmer:$DOCKER_TAG (and :dev)"

  # ---------------------------------------------------------------------------
  # Print the exact consumer coordinates for every target that ran. This is the
  # copy-paste block the other developer uses to upgrade their references.
  # ---------------------------------------------------------------------------
  summary:
    needs: [determine-version, publish-maven, publish-npm, publish-npm-runner, publish-npm-server, publish-python-protos, publish-python-sdk, publish-mcp]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write dev build summary
        env:
          TARGETS: ${{ needs.determine-version.outputs.targets }}
          BASE: ${{ needs.determine-version.outputs.base }}
          MAVEN_VERSION: ${{ needs.determine-version.outputs.maven_version }}
          NPM_VERSION: ${{ needs.determine-version.outputs.npm_version }}
          PY_VERSION: ${{ needs.determine-version.outputs.py_version }}
          DOCKER_TAG: ${{ needs.determine-version.outputs.docker_tag }}
          SHORT_SHA: ${{ needs.determine-version.outputs.short_sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "# Stigmer dev build published"
            echo ""
            echo "Base: \`$BASE\` · ref: \`$REF_NAME\` · commit: \`$SHORT_SHA\` · targets: \`$TARGETS\`"
            echo ""
            echo "Setup is one-time (see \`.github/workflows/docs/dev-publishing.md\`); afterwards, switching dev<->prod is only a version-string change."
            echo ""

            if [[ "$TARGETS" == *maven* ]]; then
              echo "## Maven (Java SDK)"
              echo '```xml'
              echo "<dependency>"
              echo "  <groupId>ai.stigmer</groupId>"
              echo "  <artifactId>stigmer-java</artifactId>"
              echo "  <version>$MAVEN_VERSION</version>"
              echo "</dependency>"
              echo '```'
              echo "Run \`mvn -U ...\` to force-refresh the SNAPSHOT."
              echo ""
            fi

            if [[ "$TARGETS" == *npm* ]]; then
              echo "## npm (React / TS SDK)"
              echo '```bash'
              echo "npm install @stigmer/react@dev   # or pin exactly: @stigmer/react@$NPM_VERSION"
              echo '```'
              echo "The \`dev\` dist-tag always resolves to the newest dev build."
              echo ""
              echo "## npm (@stigmer/server library — a composition's PR branch)"
              echo '```json'
              echo "\"@stigmer/server\": \"$NPM_VERSION\", \"@stigmer/protos\": \"$NPM_VERSION\", \"@stigmer/temporal-codecs\": \"$NPM_VERSION\""
              echo '```'
              echo "Exact versions, all three equal (the cloud's pin guard requires it). Re-pin to the release before merging to main."
              echo ""
            fi

            if [[ "$TARGETS" == *python* ]]; then
              echo "## Python SDK (TestPyPI)"
              echo '```bash'
              echo "pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ --pre 'stigmer==$PY_VERSION'"
              echo '```'
              echo ""
            fi

            if [[ "$TARGETS" == *mcp* ]]; then
              echo "## MCP server (Docker)"
              echo '```bash'
              echo "docker pull ghcr.io/stigmer/mcp-server-stigmer:$DOCKER_TAG"
              echo '```'
              echo ""
            fi

            echo "## Go SDK / Rust crate (no publish needed — use a git ref)"
            echo '```bash'
            echo "# Go:"
            echo "go get github.com/stigmer/stigmer/sdk/go/v3@$REF_NAME"
            echo "# Rust (Cargo.toml):"
            echo "# stigmer-runner-host = { git = \"https://github.com/stigmer/stigmer\", branch = \"$REF_NAME\" }"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
