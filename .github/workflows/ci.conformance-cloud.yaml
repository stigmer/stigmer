# =============================================================================
# gRPC Conformance Suite (cloud target)
# =============================================================================
# Runs the implementation-agnostic gRPC conformance suite (Class A / CRUD)
# against the Stigmer Cloud Java service — the suite's whole reason to exist:
# behavioral drift between the OSS and cloud editions becomes a failing test.
#
# Architecture (mirrors ci.integration-offline):
#   Job 1 (build-service-jar)   — checks out stigmer-cloud, builds the fat JAR
#   Job 2 (conformance-cloud)   — the suite's cloud global setup boots the
#                                 hermetic environment (Testcontainers Postgres/
#                                 Redis/MinIO/OpenFGA + Temporal dev + the JAR
#                                 in test security mode with real FGA) via the
#                                 Go launcher, then runs `npm run test:cloud`.
#
# The nightly schedule is load-bearing: path triggers in this repo cannot see
# stigmer-cloud merges, so the cron is what catches cloud-side drift.
# =============================================================================

name: ci.conformance-cloud

on:
  pull_request:
    paths:
      - "test/conformance/**"
      - "test/integration/harness/**"
      - "test/integration/cmd/conformance-cloudenv/**"
      - "apis/**"
      - ".github/workflows/ci.conformance-cloud.yaml"
  push:
    branches: [main]
    paths:
      - "test/conformance/**"
      - "test/integration/harness/**"
      - "test/integration/cmd/conformance-cloudenv/**"
      - "apis/**"
      - ".github/workflows/ci.conformance-cloud.yaml"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      cloud_ref:
        description: "stigmer-cloud git ref to build the service JAR from"
        required: false
        type: string
        default: "main"

concurrency:
  group: conformance-cloud-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build the Stigmer Cloud Java service fat JAR from source.
  # Identical to ci.integration-offline's build job; isolated so it can be
  # replaced with a pre-built artifact download once stigmer-cloud publishes
  # standalone JAR releases.
  # ---------------------------------------------------------------------------
  build-service-jar:
    name: Build Service JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stigmer-cloud
        uses: actions/checkout@v4
        with:
          repository: stigmer/stigmer-cloud
          ref: ${{ inputs.cloud_ref || 'main' }}
          path: stigmer-cloud
          token: ${{ secrets.STIGMER_CLOUD_TOKEN }}

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: conformance-cloud-jar
          repository-cache: true

      - name: Build fat JAR
        working-directory: stigmer-cloud
        run: ./bazelw build //backend/services/stigmer-service:stigmer_service_fatjar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: stigmer-service-jar
          path: stigmer-cloud/bazel-bin/backend/services/stigmer-service/stigmer_service_fatjar.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload FGA model
        uses: actions/upload-artifact@v4
        with:
          name: fga-model
          path: stigmer-cloud/backend/services/stigmer-service/src/main/resources/fga/model/
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: Run the Class A conformance suite against the Java service.
  # The suite's cloud global setup owns the environment lifecycle; this job
  # only supplies toolchains, the JAR, and the FGA model.
  # ---------------------------------------------------------------------------
  conformance-cloud:
    name: Conformance (cloud)
    runs-on: ubuntu-latest
    needs: build-service-jar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download service JAR
        uses: actions/download-artifact@v4
        with:
          name: stigmer-service-jar
          path: .artifacts

      - name: Download FGA model
        uses: actions/download-artifact@v4
        with:
          name: fga-model
          path: .artifacts/fga-model

      # Go builds/runs the environment launcher (Testcontainers + service boot).
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm workspace dependencies
        run: npm ci

      # The suite imports the built proto stubs (dist), not their source.
      - name: Build proto stubs
        run: npm run build -w @stigmer/protos

      - name: Install Temporal CLI
        uses: temporalio/setup-temporal@v0

      # Transforms the modular FGA DSL into the JSON model the launcher writes
      # into its OpenFGA container.
      - name: Install OpenFGA CLI
        run: |
          go install github.com/openfga/cli/cmd/fga@latest
          fga version

      - name: Run conformance suite (cloud)
        env:
          STIGMER_SERVICE_JAR: ${{ github.workspace }}/.artifacts/stigmer_service_fatjar.jar
          STIGMER_FGA_MODEL_DIR: ${{ github.workspace }}/.artifacts/fga-model
        run: npm run test:cloud -w @stigmer/conformance

      # The launcher writes the service log under the integration module's
      # output dir; surface it when a run goes red.
      - name: Upload environment logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-cloud-logs
          path: test/integration/.test-output/logs/
          retention-days: 14
          if-no-files-found: ignore
