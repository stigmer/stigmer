# =============================================================================
# The all-in-one evaluation image — build from the PR's sources, boot-smoke
# =============================================================================
# deploy/all-in-one is a pre-warmed `stigmer up`: the CLI's own runtimes
# layout baked off the volume, the composition run in the foreground. The
# CLI IS the composition, so this gate must build the image from the PR's
# own sources — an image that installed the published @stigmer/cli would
# test yesterday's composition. scripts/stage-all-in-one.mjs packs every
# workspace package and the slim server and runner at a dev-stamped version
# and downloads the checksum-verified Temporal binary; the Dockerfile
# installs them; scripts/smoke-all-in-one.mjs proves the container (healthy,
# console, the bootstrap, one end-to-end run through the embedded Temporal and
# runner, clean and UNCLEAN restarts, graceful stop). One job per arch on
# native runners: the packages carry a per-arch native bridge, and the
# smoke run here is the exact platform proof — no QEMU.
#
# When it runs (its list in scripts/ci-lanes.mjs): the image's own tree, the two scripts and their shared
# probes, the CLI's local stack (the composition the image runs), the
# packaging scripts the staging calls, the Makefile (smoke-all-in-one lives
# there), and this file.
# =============================================================================

name: ci.all-in-one

on:
  # Called by ci.gate.yaml when scripts/ci-lanes.mjs finds the change needs
  # this lane (the path list and its reasons live there); `Gate` is the
  # required check.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Inside the gate a missing test dependency fails instead of skipping
  # (the Postgres and Temporal helpers read it); a caller's env does not
  # reach a called workflow, so each lane sets it itself.
  STIGMER_TEST_GATE: "1"

jobs:
  # One job body, two native runners. `make smoke-all-in-one` builds the
  # runner, the server and the console, stages, builds the image for the
  # runner's own arch, and smokes it — the same three commands a developer
  # runs locally.
  smoke-amd64:
    name: All-in-one Gate (native amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore the Turbo cache
        uses: ./.github/actions/turbo-cache

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      - name: Stage from source, build the image, boot-smoke it
        run: make smoke-all-in-one

  smoke-arm64:
    name: All-in-one Gate (native arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore the Turbo cache
        uses: ./.github/actions/turbo-cache

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      - name: Stage from source, build the image, boot-smoke it
        run: make smoke-all-in-one
