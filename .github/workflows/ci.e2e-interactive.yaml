# =============================================================================
# Interactive E2E (Playwright, full local stack)
# =============================================================================
# Runs the interactive Playwright project (test/e2e/tests/interactive) against
# the full locally-booted stack: stigmer-server, the unified runner,
# a Temporal dev server, and the Next.js web console — everything
# test/e2e/global-setup.ts orchestrates. This is the lane issue #572 asked
# for: the suite rotted undetected for three months (2026-05 → 2026-08,
# #501/#570/#571) because nothing ran it; cloud#275's typecheck gate cannot
# catch runtime validation, UI drift, or infra deadlocks.
#
# The e2e-approval job (below) runs the HITL approval projects the same way —
# added by stigmer/stigmer#754 after the SAME rot pattern hit them (they were
# Makefile-only and silently invalidated by the apply-then-review change).
#
# Distinct from ci.e2e.yaml, which smoke-tests the DEPLOYED console after
# releases; this lane tests the code on the PR.
#
# Needs NO secrets: the deterministic specs drive set_vars/wait workflows
# through the real runner, and the two session specs self-skip without an
# LLM key (test.skip(!HAS_LLM_KEY)). Bringing those in via the mock-LLM
# proxy (the interactive-approval pattern) is a tracked follow-up.
#
# Which changes need it is its list in scripts/ci-lanes.mjs; ci.gate.yaml
# calls it for those, and a red job here turns `Gate`, the required check,
# red.
# =============================================================================

name: ci.e2e-interactive

on:
  # Called by ci.gate.yaml when scripts/ci-lanes.mjs finds the change needs
  # this lane (the path list and its reasons live there); `Gate` is the
  # required check.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Make `npm ci` resilient to transient registry drops (ECONNRESET). npm reads
# these npm_config_* vars, so every install step retries with backoff instead
# of failing the whole job on the first dropped download.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_factor: "2"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"
  # Inside the gate a missing test dependency fails instead of skipping
  # (the Postgres and Temporal helpers read it); a caller's env does not
  # reach a called workflow, so each lane sets it itself.
  STIGMER_TEST_GATE: "1"

jobs:
  e2e-interactive:
    name: Interactive E2E (full stack)
    runs-on: ubuntu-latest
    # The Playwright config has no globalTimeout, so this is the only
    # wall-clock cap. Measured: ~2.2 min for the suite once built; the
    # builds (two npm trees + Chromium) dominate.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore the Turbo cache
        uses: ./.github/actions/turbo-cache

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # Root install, deliberately not `cd test/e2e && npm ci` — the e2e
      # package resolves @stigmer/sdk + @stigmer/protos through workspace
      # hoisting (the make test-e2e-approval precedent).
      - name: Install npm workspace dependencies
        run: npm ci

      # The web console and the SDK resolve @stigmer/protos through built
      # dist/ output (the package `exports` map points only at ./dist/*.js).
      - name: Build SDK libraries
        run: npm run build:libs

      # Install the Temporal CLI; global-setup boots its dev server.
      # `make install-temporal-cli` fetches the version `stigmer up` pins,
      # verified against the release's checksums.txt and retried on a dropped
      # connection, so the suites run the Temporal users run.
      - name: Install Temporal CLI
        run: |
          make install-temporal-cli
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/temporal" --version

      # global-setup expects a prebuilt server dist and runner dist; build
      # them explicitly so a build break is an isolated, legible failure
      # rather than a confusing globalSetup error (the
      # ci.conformance-execution precedent).
      - name: Build stigmer-server
        run: make build-server

      - name: Build unified runner
        run: make build-runner

      - name: Install Playwright browsers
        working-directory: test/e2e
        run: npx playwright install --with-deps chromium

      # Mock mode gives the session specs zero-secrets agent-turn coverage
      # (stigmer/stigmer#743): global-setup boots the canned-SSE proxy and the
      # runner points at it; specs that never invoke the LLM are unaffected.
      - name: Run interactive E2E suite
        working-directory: test/e2e
        env:
          STIGMER_E2E_MOCK_LLM: "1"
        run: npx playwright test --project=interactive

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-interactive-test-results
          path: test/e2e/test-results/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-interactive-playwright-report
          path: test/e2e/playwright-report/
          retention-days: 30

  # The HITL approval suite (stigmer/stigmer#754): before this job the suite
  # ran NOWHERE automatically (Makefile target only), which is exactly how it
  # rotted — the phase-7 apply-then-review change silently invalidated its
  # write-gate premise, and a workspace-escape bug in the runner's legacy
  # path mode went unnoticed with it. Two serial invocations, two stack
  # shapes (one Playwright run boots exactly one stack; both use the shared
  # single-FIFO mock proxy, so --workers=1 is load-bearing):
  #   1. capture stack — approval flows (shell gates), disclosure rows, and
  #      the apply-then-review file-review flow;
  #   2. file-gate stack (no artifact store) — the pre-execution file-gate
  #      card, the only shape where it exists.
  # A separate job (not steps on e2e-interactive) so the two suites fail
  # independently and re-run independently — same builds, ~4 extra minutes.
  e2e-approval:
    name: Approval E2E (mock LLM, two stack shapes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore the Turbo cache
        uses: ./.github/actions/turbo-cache

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Install Temporal CLI
        run: |
          make install-temporal-cli
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/temporal" --version

      - name: Build stigmer-server
        run: make build-server

      - name: Build unified runner
        run: make build-runner

      - name: Install Playwright browsers
        working-directory: test/e2e
        run: npx playwright install --with-deps chromium

      - name: Run approval suite (capture stack)
        working-directory: test/e2e
        env:
          STIGMER_E2E_MOCK_LLM: "1"
        run: npx playwright test --project=interactive-approval --workers=1

      - name: Run approval suite (file-gate stack)
        working-directory: test/e2e
        env:
          STIGMER_E2E_MOCK_LLM: "1"
          STIGMER_E2E_FILE_GATES: "1"
        run: npx playwright test --project=interactive-approval-gate --workers=1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-approval-test-results
          path: test/e2e/test-results/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-approval-playwright-report
          path: test/e2e/playwright-report/
          retention-days: 30

  # The served console signing in to an authenticated self-hosted server
  # (20260913.02 sp.console-login; stigmer#924): a real browser through a
  # real PKCE code flow against the conformance harness's hermetic issuer,
  # verified by a real server in the OIDC posture. Its own stack shape, so
  # its own job (the approval job's precedent); no runner is needed — the
  # flow ends at the create-organization form — but the stack boots one.
  e2e-console-login:
    name: Console login E2E (OIDC posture, hermetic issuer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore the Turbo cache
        uses: ./.github/actions/turbo-cache

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Install Temporal CLI
        run: |
          make install-temporal-cli
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/temporal" --version

      - name: Build stigmer-server
        run: make build-server

      - name: Build unified runner
        run: make build-runner

      - name: Install Playwright browsers
        working-directory: test/e2e
        run: npx playwright install --with-deps chromium

      - name: Run console-login suite (OIDC stack)
        working-directory: test/e2e
        env:
          STIGMER_E2E_OIDC: "1"
        run: npx playwright test --project=console-login --workers=1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-console-login-test-results
          path: test/e2e/test-results/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-console-login-playwright-report
          path: test/e2e/playwright-report/
          retention-days: 30
