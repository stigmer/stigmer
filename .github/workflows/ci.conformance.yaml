# =============================================================================
# gRPC Conformance Suite (local target)
# =============================================================================
# Runs the implementation-agnostic gRPC conformance suite against the OSS
# server, built from source. The suite is the shared API contract for the OSS
# server and the Java cloud service — it turns OSS<->cloud behavioral drift
# into a failing test.
#
# This slice is the dependency-light Class A signal: no Temporal, no runner,
# no Java service. The suite compiles the server, boots it against a
# throwaway SQLite database, and drives it through generated Connect clients.
# The execution-engine suites (Class B) run in ci.conformance-execution.yaml.
# =============================================================================

name: ci.conformance

on:
  # Called by ci.gate.yaml when scripts/ci-lanes.mjs finds the change needs
  # this lane (the path list and its reasons live there); `Gate` is the
  # required check.
  workflow_call:

permissions:
  contents: read

env:
  # Inside the gate a missing test dependency fails instead of skipping
  # (the Postgres and Temporal helpers read it); a caller's env does not
  # reach a called workflow, so each lane sets it itself.
  STIGMER_TEST_GATE: "1"

jobs:
  conformance-local:
    name: Conformance (local)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      # Both the suite and the server import the built proto stubs (dist).
      - name: Build proto stubs
        run: npm run build -w @stigmer/protos

      # The behavior inventory gate (E1): fails in seconds, before any boot,
      # when a conformance row lacks a test or a tag names no row.
      - name: Check the cloud-capability inventory
        run: npm run inventory:check -w @stigmer/conformance

      # The harness's PURE unit arms (the inventory library, the cloud-capability
      # fixtures, the submit-approval seam):
      # `make check-conformance-inventory` runs them locally; this is the same
      # gate in CI, before any target boots.
      - name: Run the harness unit arms
        run: npm run test:unit -w @stigmer/conformance -- --coverage.enabled --coverage.reportsDirectory=coverage/v8 --reporter=default --reporter=github-actions --reporter=json --outputFile.json=coverage/report.json

      # The coverage and the report for ci.gate.yaml's Coverage job, red or
      # green: a failed run still says what it covered (reportOnFailure).
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-conformance-conformance-local
          path: |
            test/conformance/coverage/
          if-no-files-found: error
          retention-days: 14

      # The shared test machinery's own cases (test/support: the stack spawns,
      # the model fakes, the identity fixtures the suites import).
      - name: Run the shared test machinery's cases
        run: npm test -w @stigmer/test-support

      # The server is standalone (own lockfile, file-linked protos); its
      # global-setup compiles it, but the install must happen here where
      # network access is expected.
      - name: Install server dependencies
        working-directory: backend/services/stigmer-server
        run: npm ci

      - name: Run conformance suite (local)
        env:
          CONFORMANCE_TARGET: local
        run: npm run test -w @stigmer/conformance

  # The same full roster on the Postgres Store driver (Phase-2 P2, DD-011:
  # the gate requires the Postgres targets at byte-identical capability
  # matrices — the driver must be wire-invisible). The database is a
  # service container pinned to the major the compose stack ships (DD-013).
  conformance-local-postgres:
    name: Conformance (local-postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      - name: Build proto stubs
        run: npm run build -w @stigmer/protos

      - name: Install server dependencies
        working-directory: backend/services/stigmer-server
        run: npm ci

      - name: Run conformance suite (local-postgres)
        env:
          CONFORMANCE_TARGET: local-postgres
          CONFORMANCE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test -w @stigmer/conformance
