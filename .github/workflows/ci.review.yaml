# =============================================================================
# Review verdict: a pull request merges only after a reviewer that did not
# write it approved exactly this change
# =============================================================================
# Runs scripts/review-verdict.mjs, which reads the newest `## Review` comment
# posted on the pull request by an account with write access and passes only
# when it says `approve` and was bound to the change as it is now: the patch
# id of the diff from the merge base, and the body's declarations
# (`Test-removal:`, `Quarantine:`, `Skip:`, `RPC-waiver:`). A push that
# changes the change, or a declaration added or reworded, turns it red until
# the review runs again; merging `main` into the branch without touching the
# change does not. The review itself is `.agents/skills/review-pull-request/SKILL.md`, and the
# script's header has the rules. `Review verdict` is a required check on
# `main`, beside `Gate` (ci.gate.yaml) and `Test integrity`
# (ci.integrity.yaml).
#
# Its own workflow, not a job beside `Test integrity`: a verdict is a comment,
# which fires no pull-request event, so posting one reruns this workflow's
# newest run for the head (the script's --write). The script waits for that
# run to finish before rerunning it, and a rerun runs every job again, so
# inside ci.integrity.yaml each verdict posted would wait on the integrity job
# and then run it again.
#
# The script a pull request is judged by is the base branch's as it is now:
# the job checks out the base branch's tip and runs its copy, so a pull
# request that edits scripts/review-verdict.mjs cannot loosen that rule for
# itself, and every pull request is judged by the copy `--write` used to post
# its verdict. Not the pull request's recorded base commit: GitHub leaves that
# at the base as of the last push, so an older pull request would be judged by
# an older script, and could never match a digest the current one computed.
# This file itself is not covered: GitHub takes a pull request's workflow from
# its merge commit, so a pull request that edits this file runs its edit. That
# is why the review brief reads a change to this file, the script or the brief
# as a change to the gate. The check proves that a writer posted a current
# approve; that the reviewer did not write the change rests on the procedure.
#
# In the merge queue there is no new review to read: the pull request's own
# run already judged it, and auto-merge queues a pull request only once its
# required checks have passed. The verdict is judged at the pull request's
# events (a push, a body edit, a verdict posted); `main` moving underneath an
# approved pull request does not re-judge it. A later push that brings in a
# change on `main` inside a hunk's context does, and then the verdict goes
# stale. The job never carries an `if:`: a required
# check that is skipped counts as passed.
# =============================================================================

name: ci.review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

# No concurrency group, so no run is ever cancelled on its own head. GitHub
# judges a required check by the newest run created for the head, and a
# cancelled one blocks the merge however many runs beside it passed, with no
# red check to say why. With a group that cancels in progress, the rerun that
# --write starts cancelled a newer run started by a body edit (#1704), and of
# two runs started seconds apart the one GitHub judges could be the one
# cancelled (#1670). A group that does not cancel still replaces its one
# pending run with the next (#1524, ci.gate.yaml). A run on a head that has
# since moved is left to finish, and ends in seconds: the script refuses a
# head that is no longer the pull request's (`--expect-head`).

permissions: {}

jobs:
  review:
    name: Review verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The pull request's head, base and body.
      pull-requests: read
      # The review comments are issue comments on the pull request.
      issues: read
    steps:
      # Full commit graph, no blobs: the script finds the merge base and reads
      # only the blobs of the diff it hashes. The base branch's tip, not the
      # merge ref: see the header. The queue event has no base branch and
      # checks out its own commit.
      - name: Checkout the base branch (full history, no blobs)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.base_ref || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # Every value reaches the shell through `env`, never through `${{ }}`
      # inside `run`. The runner's own Node runs the script, which needs no
      # dependency and nothing newer than Node 18.
      - name: Judge the review (pull request)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ ! -f scripts/review-verdict.mjs ]; then
            echo "$BASE_REF has no scripts/review-verdict.mjs, so nothing can judge this pull request's review; target a branch that carries it."
            exit 1
          fi
          node scripts/review-verdict.mjs --status -R "$REPO" "$PR" --expect-head "$HEAD_SHA"

      - name: The merge queue
        if: github.event_name == 'merge_group'
        run: echo "The pull request's own Review verdict run judged this change; a queue entry adds no review to read."
