name: release.maven

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          fi
          VERSION_NO_V="${VERSION#v}"
          echo "version=$VERSION_NO_V" >> $GITHUB_OUTPUT
          echo "Publishing Java packages at version: $VERSION_NO_V"

  publish-protos:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set version
        working-directory: apis/stubs/java
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          mvn --batch-mode versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          echo "Set stigmer-java-protos version to $VERSION"

      - name: Publish to Maven Central
        working-directory: apis/stubs/java
        # The Central Portal upload endpoint can return transient 403/5xx
        # responses (rate limiting, in-flight publishes). Retry with backoff
        # so a single flaky response does not fail the whole release.
        run: |
          for attempt in 1 2 3; do
            if mvn --batch-mode deploy -P release -DskipTests; then
              exit 0
            fi
            echo "Publish attempt $attempt failed; retrying in 120s..."
            sleep 120
          done
          echo "Publish failed after 3 attempts"
          exit 1
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-sdk:
    needs: [determine-version, publish-protos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Generate SDK client code
        run: make -C sdk/java codegen

      - name: Set version and update protos dependency
        working-directory: sdk/java
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          mvn --batch-mode versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn --batch-mode versions:set-property -Dproperty=stigmer-protos.version -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          echo "Set stigmer-java version to $VERSION (protos dependency: $VERSION)"

      - name: Install protos locally
        working-directory: apis/stubs/java
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          mvn --batch-mode versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn --batch-mode install -DskipTests

      - name: Publish to Maven Central
        working-directory: sdk/java
        # The protos job returns once its deployment is *validated*, then
        # autoPublish finishes asynchronously. Uploading the SDK bundle while
        # the protos deployment for the shared ai.stigmer namespace is still
        # PUBLISHING makes the Central Portal reject the upload with a 403, and
        # the upload endpoint can also return transient 403/5xx responses on its
        # own. Retry with backoff: the common case succeeds on the first attempt
        # with no wait, and a transient rejection self-heals within a few
        # minutes instead of failing the whole release.
        run: |
          for attempt in 1 2 3 4 5; do
            if mvn --batch-mode deploy -P release -DskipTests; then
              exit 0
            fi
            echo "Publish attempt $attempt failed; retrying in 90s..."
            sleep 90
          done
          echo "Publish failed after 5 attempts"
          exit 1
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
