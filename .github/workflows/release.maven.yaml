name: release.maven

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${GITHUB_EVENT_INPUTS_VERSION}"
          fi
          VERSION_NO_V="${VERSION#v}"
          echo "version=$VERSION_NO_V" >> $GITHUB_OUTPUT
          echo "Publishing Java packages at version: $VERSION_NO_V"
        env:
          GITHUB_EVENT_INPUTS_VERSION: ${{ github.event.inputs.version }}

  publish-protos:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set version
        working-directory: apis/stubs/java
        run: |
          VERSION="${NEEDS_DETERMINE_VERSION_OUTPUTS_VERSION}"
          mvn --batch-mode versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          echo "Set stigmer-java-protos version to $VERSION"
        env:
          NEEDS_DETERMINE_VERSION_OUTPUTS_VERSION: ${{ needs.determine-version.outputs.version }}

      # Central rejects re-publishing an existing version, so a rerun after a
      # partial failure (e.g. protos published, SDK didn't) must skip the
      # already-live artifact instead of failing the whole release. repo1
      # sync lags a fresh publish by a few minutes, so a rerun within that
      # window may still attempt a duplicate upload — acceptable, since real
      # recovery runs happen well after the sync completes.
      - name: Check if version is already on Central
        id: central-check
        run: |
          VERSION="${NEEDS_DETERMINE_VERSION_OUTPUTS_VERSION}"
          URL="https://repo1.maven.org/maven2/ai/stigmer/stigmer-java-protos/$VERSION/stigmer-java-protos-$VERSION.pom"
          if curl --silent --fail --output /dev/null "$URL"; then
            echo "stigmer-java-protos:$VERSION is already on Central; skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEEDS_DETERMINE_VERSION_OUTPUTS_VERSION: ${{ needs.determine-version.outputs.version }}

      - name: Publish to Maven Central
        if: steps.central-check.outputs.published != 'true'
        working-directory: apis/stubs/java
        # The Central Portal upload endpoint can return transient 403/5xx
        # responses (rate limiting, in-flight publishes). Retry with backoff
        # so a single flaky response does not fail the whole release.
        run: |
          for attempt in 1 2 3; do
            if mvn --batch-mode deploy -P release -DskipTests; then
              exit 0
            fi
            echo "Publish attempt $attempt failed; retrying in 120s..."
            sleep 120
          done
          echo "Publish failed after 3 attempts"
          exit 1
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-sdk:
    needs: [determine-version, publish-protos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # The client generator runs from TypeScript source via the repo-pinned
      # tsx (never bare npx — oss#531), so the root npm install must exist
      # before the codegen step.
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # No restored npm cache in a release (v5+ caches by default).
          package-manager-cache: false
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Generate SDK client code
        run: make -C sdk/java codegen

      - name: Set version and update protos dependency
        working-directory: sdk/java
        run: |
          VERSION="${NEEDS_DETERMINE_VERSION_OUTPUTS_VERSION}"
          mvn --batch-mode versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn --batch-mode versions:set-property -Dproperty=stigmer-protos.version -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          echo "Set stigmer-java version to $VERSION (protos dependency: $VERSION)"
        env:
          NEEDS_DETERMINE_VERSION_OUTPUTS_VERSION: ${{ needs.determine-version.outputs.version }}

      - name: Install protos locally
        working-directory: apis/stubs/java
        run: |
          VERSION="${NEEDS_DETERMINE_VERSION_OUTPUTS_VERSION}"
          mvn --batch-mode versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn --batch-mode install -DskipTests
        env:
          NEEDS_DETERMINE_VERSION_OUTPUTS_VERSION: ${{ needs.determine-version.outputs.version }}

      # Same duplicate-version skip as publish-protos; see the comment there.
      - name: Check if version is already on Central
        id: central-check
        run: |
          VERSION="${NEEDS_DETERMINE_VERSION_OUTPUTS_VERSION}"
          URL="https://repo1.maven.org/maven2/ai/stigmer/stigmer-java/$VERSION/stigmer-java-$VERSION.pom"
          if curl --silent --fail --output /dev/null "$URL"; then
            echo "stigmer-java:$VERSION is already on Central; skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEEDS_DETERMINE_VERSION_OUTPUTS_VERSION: ${{ needs.determine-version.outputs.version }}

      - name: Publish to Maven Central
        if: steps.central-check.outputs.published != 'true'
        working-directory: sdk/java
        # The protos job returns once its deployment is *validated*, then
        # autoPublish finishes asynchronously. Uploading the SDK bundle while
        # the protos deployment for the shared ai.stigmer namespace is still
        # PUBLISHING makes the Central Portal reject the upload with a 403, and
        # the upload endpoint can also return transient 403/5xx responses on its
        # own. Retry with backoff: the common case succeeds on the first attempt
        # with no wait, and a transient rejection self-heals within a few
        # minutes instead of failing the whole release.
        run: |
          for attempt in 1 2 3 4 5; do
            if mvn --batch-mode deploy -P release -DskipTests; then
              exit 0
            fi
            echo "Publish attempt $attempt failed; retrying in 90s..."
            sleep 90
          done
          echo "Publish failed after 5 attempts"
          exit 1
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
