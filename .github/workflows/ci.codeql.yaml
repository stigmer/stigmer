# =============================================================================
# Code scanning: CodeQL over every language the repository ships
# =============================================================================
# Analyses the TypeScript, Go, Java, Python and Rust sources with CodeQL and
# uploads the results to the repository's code scanning. A ruleset rule on
# `main` ("Require code scanning results", tool CodeQL) refuses a pull request
# that introduces a high or critical security alert, or an error-level alert,
# relative to its base; alerts already on `main` are listed on the Security
# tab and never block an unrelated change.
#
# The rule judges the pull request before it can enter the merge queue. It
# never waits on a merge-group commit, and GitHub posts no code-scanning check
# on one, so this workflow does not run on `merge_group`: a required `CodeQL`
# check would wait there forever (measured on a scratch queue, 2026-09-30).
# Two queued pull requests that only together add an alert are caught by the
# `push` analysis of `main`, which is also what "new" is measured against.
# The weekly run applies newly published queries to old code.
#
# No `paths:` filter, and every language on every pull request: a required
# result that a filter skipped would never arrive.
#
# Workflows (CodeQL's `actions` language) are left out: a dedicated workflow
# auditor covers them more strictly, and one finding reported by two tools is
# two triage queues.
# =============================================================================

name: ci.codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          # CodeQL cannot analyse Go without a build; autobuild reads go.work.
          - language: go
            build-mode: autobuild
          - language: java-kotlin
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build (Go)
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
