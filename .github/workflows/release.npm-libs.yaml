name: release.npm-libs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          fi
          VERSION_NO_V="${VERSION#v}"
          echo "version=$VERSION_NO_V" >> $GITHUB_OUTPUT
          echo "Publishing @stigmer/* packages at version: $VERSION_NO_V"

  publish:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pre-publish hard gate: the prod bridge image (mcp-server/Dockerfile)
      # installs the npm version named by its pinned ARG default, and the prod
      # deploy pipeline rebuilds from that default on every mcp-server-touching
      # push to main. If the pin does not move with the release, prod silently
      # keeps serving the previous bridge — which is exactly what happened on
      # five consecutive releases (3.5.0 → 3.6.0) until the 2026-08-05
      # stale-roster incident. The rule is now enforced, not remembered: bump
      # the pin in the commit you tag, or this release fails here.
      #
      # Ordering note: the pin-bump commit reaches main before this workflow
      # publishes the version it names, so the Planton bridge build that commit
      # triggers can fail once (npm 404) — re-run it after this publish lands.
      - name: Verify mcp-server Dockerfile pin matches release (pre-publish gate)
        run: |
          PIN="$(sed -n 's/^ARG MCP_SERVER_VERSION=//p' mcp-server/Dockerfile)"
          VERSION="${{ needs.determine-version.outputs.version }}"
          if [ "$PIN" != "$VERSION" ]; then
            echo "ERROR: mcp-server/Dockerfile pins MCP_SERVER_VERSION=$PIN but this release publishes $VERSION."
            echo "Prod deploys the pin, not the tag — bump the pin in the same commit you tag."
            exit 1
          fi
          echo "mcp-server/Dockerfile pin $PIN matches release version $VERSION"

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate TypeScript proto stubs
        run: STUBS_FORCE=1 make -C apis ts-stubs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Pre-publish hard gate for #209: build the libs and prove every published
      # dist is resolvable under plain Node ESM before anything reaches npm. A
      # broken build fails here instead of shipping (publish-libs rebuilds from
      # the same source, so this never drifts from what is published).
      - name: Verify Node-ESM output (pre-publish gate)
        run: |
          npm run build:libs
          node scripts/verify-esm-node.mjs

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-libs.mjs --version ${{ needs.determine-version.outputs.version }}

  # @stigmer/runner is an npm package too, so it ships from this same npm workflow.
  # It lives in its own job (not publish-libs.mjs) only because it is deliberately
  # NOT an npm workspace (see root package.json) and is built via make build-runner.
  # Running after `publish` means @stigmer/protos@<version> is already on npm, so its
  # pinned dependency resolves with no cross-workflow race.
  publish-runner:
    needs: [determine-version, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate TypeScript proto stubs
        run: STUBS_FORCE=1 make -C apis ts-stubs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Builds the workspace lib dists the runner links (@stigmer/protos,
      # @stigmer/temporal-codecs — via build-ts-stubs), installs the runner's own
      # deps, and compiles the runner to dist/ while the libs are still local
      # file: links (so tsc resolves types against the in-repo sources).
      - name: Build runner
        run: make build-runner

      # Stamp the release version and pin the workspace lib deps from their local
      # file: links to the exact published versions (the runner's analogue of how
      # release.maven / release.python-sdk pin protos). The committed package.json
      # is only mutated in this ephemeral CI checkout.
      - name: Stamp version and pin workspace lib dependencies
        working-directory: backend/services/runner
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          node -e "
            const fs = require('node:fs');
            const path = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = process.env.VERSION;
            pkg.dependencies['@stigmer/protos'] = process.env.VERSION;
            pkg.dependencies['@stigmer/temporal-codecs'] = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            console.log('stamped @stigmer/runner@' + pkg.version + ' (protos: ' + pkg.dependencies['@stigmer/protos'] + ', temporal-codecs: ' + pkg.dependencies['@stigmer/temporal-codecs'] + ')');
          "

      - name: Verify published file list
        working-directory: backend/services/runner
        run: npm pack --dry-run

      # Defensive only: `publish` already put both libs at <version> on npm; this
      # absorbs registry propagation lag before the runner (which pins them) goes out.
      - name: Wait for workspace libs on npm
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          for pkg in @stigmer/protos @stigmer/temporal-codecs; do
            echo "Confirming $pkg@$VERSION is queryable on npm..."
            found=""
            for i in $(seq 1 30); do
              if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
                echo "Found $pkg@$VERSION"
                found=1
                break
              fi
              echo "Attempt $i/30: not yet visible, waiting 10s..."
              sleep 10
            done
            if [ -z "$found" ]; then
              echo "ERROR: $pkg@$VERSION not visible on npm after 5 minutes."
              exit 1
            fi
          done

      # Last gate before publish (#786): install the packed tarball into a
      # fresh prefix the way an embedder does and boot it. The manifest at
      # this point is the REAL published one (version stamped, protos pinned
      # to the registry version that the wait step just confirmed), so this
      # verifies the exact resolution consumers will get — the class of
      # failure the repo's lockfile-resolved gates structurally cannot see.
      - name: Consumer-install smoke check
        working-directory: backend/services/runner
        run: npm run verify:consumer

      - name: Publish to npm
        working-directory: backend/services/runner
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Pre-release versions (e.g. 1.2.0-rc.0) go under the "next" dist-tag.
          VERSION="${{ needs.determine-version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then NPM_TAG="next"; else NPM_TAG="latest"; fi
          npm publish --access public --tag "$NPM_TAG"

      # The slim embedding artifact (stigmer/stigmer#170): a bundled runner plus
      # per-platform native-bridge packages — ~85 MB installed instead of the
      # full package's ~508 MB node_modules. Built after the fat publish so a
      # slim failure never blocks the canonical package. All six packages build
      # from this single Linux host: the JS bundles are platform-independent and
      # core-bridge's npm tarball already carries every platform's prebuilt
      # release. The version was stamped into package.json above, which the
      # bundle script propagates into every generated manifest.
      - name: Build slim artifact packages
        working-directory: backend/services/runner
        run: node scripts/bundle-slim.mjs --emit-packages

      # Gate the slim publish on the artifact actually booting: size budget,
      # static-mode worker reaching RUNNING, and the manager-mode IPC
      # lifecycle — all against a real Temporal dev server, from an isolated
      # copy so nothing resolves from this checkout's node_modules.
      - name: Set up Temporal CLI
        uses: temporalio/setup-temporal@v0

      - name: Verify slim artifact boots
        working-directory: backend/services/runner
        run: |
          temporal server start-dev --headless --log-level error &
          TEMPORAL_PID=$!
          trap "kill $TEMPORAL_PID" EXIT
          for i in $(seq 1 30); do
            temporal operator cluster health >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/verify-slim-artifact.mjs

      - name: Publish slim packages to npm
        working-directory: backend/services/runner
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then NPM_TAG="next"; else NPM_TAG="latest"; fi
          # Platform packages first so the meta package's optionalDependencies
          # resolve the moment it lands.
          for pkg in dist-slim-pkgs/runner-slim-*; do
            (cd "$pkg" && npm publish --access public --tag "$NPM_TAG")
          done
          cd dist-slim-pkgs/runner-slim && npm publish --access public --tag "$NPM_TAG"
