name: release.npm-libs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          fi
          VERSION_NO_V="${VERSION#v}"
          echo "version=$VERSION_NO_V" >> $GITHUB_OUTPUT
          echo "Publishing @stigmer/* packages at version: $VERSION_NO_V"

  publish:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate TypeScript proto stubs
        run: STUBS_FORCE=1 make -C apis ts-stubs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-libs.mjs --version ${{ needs.determine-version.outputs.version }}

  # @stigmer/runner is an npm package too, so it ships from this same npm workflow.
  # It lives in its own job (not publish-libs.mjs) only because it is deliberately
  # NOT an npm workspace (see root package.json) and is built via make build-runner.
  # Running after `publish` means @stigmer/protos@<version> is already on npm, so its
  # pinned dependency resolves with no cross-workflow race.
  publish-runner:
    needs: [determine-version, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate TypeScript proto stubs
        run: STUBS_FORCE=1 make -C apis ts-stubs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Builds @stigmer/protos dist, installs the runner's own deps, and compiles the
      # runner to dist/ while @stigmer/protos is still the local file: link (so tsc
      # resolves types against the in-repo stubs).
      - name: Build runner
        run: make build-runner

      # Stamp the release version and pin @stigmer/protos from the local file: link to
      # the exact published version (the runner's analogue of how release.maven /
      # release.python-sdk pin protos). The committed package.json is only mutated in
      # this ephemeral CI checkout.
      - name: Stamp version and pin protos dependency
        working-directory: backend/services/runner
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          node -e "
            const fs = require('node:fs');
            const path = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = process.env.VERSION;
            pkg.dependencies['@stigmer/protos'] = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            console.log('stamped @stigmer/runner@' + pkg.version + ' (protos: ' + pkg.dependencies['@stigmer/protos'] + ')');
          "

      - name: Verify published file list
        working-directory: backend/services/runner
        run: npm pack --dry-run

      # Defensive only: `publish` already put @stigmer/protos@<version> on npm; this
      # absorbs registry propagation lag before the runner (which pins it) goes out.
      - name: Wait for @stigmer/protos on npm
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          echo "Confirming @stigmer/protos@$VERSION is queryable on npm..."
          for i in $(seq 1 30); do
            if npm view "@stigmer/protos@$VERSION" version >/dev/null 2>&1; then
              echo "Found @stigmer/protos@$VERSION"
              exit 0
            fi
            echo "Attempt $i/30: not yet visible, waiting 10s..."
            sleep 10
          done
          echo "ERROR: @stigmer/protos@$VERSION not visible on npm after 5 minutes."
          exit 1

      - name: Publish to npm
        working-directory: backend/services/runner
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Pre-release versions (e.g. 1.2.0-rc.0) go under the "next" dist-tag.
          VERSION="${{ needs.determine-version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then NPM_TAG="next"; else NPM_TAG="latest"; fi
          npm publish --access public --tag "$NPM_TAG"
