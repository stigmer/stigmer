name: release.npm-libs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          fi
          VERSION_NO_V="${VERSION#v}"
          echo "version=$VERSION_NO_V" >> $GITHUB_OUTPUT
          echo "Publishing @stigmer/* packages at version: $VERSION_NO_V"

  publish:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pre-publish hard gate: the prod bridge image (mcp-server/Dockerfile)
      # installs the npm version named by its pinned ARG default, and the prod
      # deploy pipeline rebuilds from that default on every mcp-server-touching
      # push to main. If the pin does not move with the release, prod silently
      # keeps serving the previous bridge — which is exactly what happened on
      # five consecutive releases (3.5.0 → 3.6.0) until the 2026-08-05
      # stale-roster incident. The rule is now enforced, not remembered: bump
      # the pin in the commit you tag, or this release fails here.
      #
      # Ordering note: the pin-bump commit reaches main before this workflow
      # publishes the version it names, so the Planton bridge build that commit
      # triggers can fail once (npm 404) — re-run it after this publish lands.
      - name: Verify mcp-server Dockerfile pin matches release (pre-publish gate)
        run: |
          PIN="$(sed -n 's/^ARG MCP_SERVER_VERSION=//p' mcp-server/Dockerfile)"
          VERSION="${{ needs.determine-version.outputs.version }}"
          if [ "$PIN" != "$VERSION" ]; then
            echo "ERROR: mcp-server/Dockerfile pins MCP_SERVER_VERSION=$PIN but this release publishes $VERSION."
            echo "Prod deploys the pin, not the tag — bump the pin in the same commit you tag."
            exit 1
          fi
          echo "mcp-server/Dockerfile pin $PIN matches release version $VERSION"

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Node before stub generation: the stub scrub inside gen-stubs.sh runs
      # from TypeScript source via the repo-pinned tsx.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate TypeScript proto stubs
        run: STUBS_FORCE=1 make -C apis ts-stubs

      # Pre-publish hard gate for #209: build the libs and prove every published
      # dist is resolvable under plain Node ESM before anything reaches npm. A
      # broken build fails here instead of shipping (publish-libs rebuilds from
      # the same source, so this never drifts from what is published).
      - name: Verify Node-ESM output (pre-publish gate)
        run: |
          npm run build:libs
          node scripts/verify-esm-node.mjs

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-libs.mjs --version ${{ needs.determine-version.outputs.version }}

  # @stigmer/runner is an npm package too, so it ships from this same npm workflow.
  # It lives in its own job (not publish-libs.mjs) only because it is deliberately
  # NOT an npm workspace (see root package.json) and is built via make build-runner.
  # Running after `publish` means @stigmer/protos@<version> is already on npm, so its
  # pinned dependency resolves with no cross-workflow race.
  publish-runner:
    needs: [determine-version, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Node before stub generation: the stub scrub inside gen-stubs.sh runs
      # from TypeScript source via the repo-pinned tsx.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Generate TypeScript proto stubs
        run: STUBS_FORCE=1 make -C apis ts-stubs

      # Builds the workspace lib dists the runner links (@stigmer/protos,
      # @stigmer/temporal-codecs — via build-ts-stubs), installs the runner's own
      # deps, and compiles the runner to dist/ while the libs are still local
      # file: links (so tsc resolves types against the in-repo sources).
      - name: Build runner
        run: make build-runner

      # Stamp the release version and pin the workspace lib deps from their local
      # file: links to the exact published versions (the runner's analogue of how
      # release.maven / release.python-sdk pin protos). The committed package.json
      # is only mutated in this ephemeral CI checkout.
      - name: Stamp version and pin workspace lib dependencies
        working-directory: backend/services/runner
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          node -e "
            const fs = require('node:fs');
            const path = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = process.env.VERSION;
            pkg.dependencies['@stigmer/protos'] = process.env.VERSION;
            pkg.dependencies['@stigmer/temporal-codecs'] = process.env.VERSION;
            pkg.dependencies['@stigmer/zip-structure'] = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            console.log('stamped @stigmer/runner@' + pkg.version + ' (protos: ' + pkg.dependencies['@stigmer/protos'] + ', temporal-codecs: ' + pkg.dependencies['@stigmer/temporal-codecs'] + ', zip-structure: ' + pkg.dependencies['@stigmer/zip-structure'] + ')');
          "

      - name: Verify published file list
        working-directory: backend/services/runner
        run: npm pack --dry-run

      # Defensive only: `publish` already put both libs at <version> on npm; this
      # absorbs registry propagation lag before the runner (which pins them) goes out.
      - name: Wait for workspace libs on npm
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          for pkg in @stigmer/protos @stigmer/temporal-codecs @stigmer/zip-structure; do
            echo "Confirming $pkg@$VERSION is queryable on npm..."
            found=""
            for i in $(seq 1 30); do
              if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
                echo "Found $pkg@$VERSION"
                found=1
                break
              fi
              echo "Attempt $i/30: not yet visible, waiting 10s..."
              sleep 10
            done
            if [ -z "$found" ]; then
              echo "ERROR: $pkg@$VERSION not visible on npm after 5 minutes."
              exit 1
            fi
          done

      # Last gate before publish (#786): install the packed tarball into a
      # fresh prefix the way an embedder does and boot it. The manifest at
      # this point is the REAL published one (version stamped, protos pinned
      # to the registry version that the wait step just confirmed), so this
      # verifies the exact resolution consumers will get — the class of
      # failure the repo's lockfile-resolved gates structurally cannot see.
      - name: Consumer-install smoke check
        working-directory: backend/services/runner
        run: npm run verify:consumer

      - name: Publish to npm
        working-directory: backend/services/runner
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Pre-release versions (e.g. 1.2.0-rc.0) go under the "next" dist-tag.
          VERSION="${{ needs.determine-version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then NPM_TAG="next"; else NPM_TAG="latest"; fi
          npm publish --access public --tag "$NPM_TAG"

      # The slim embedding artifact (stigmer/stigmer#170): a bundled runner plus
      # per-platform native-bridge packages — ~85 MB installed instead of the
      # full package's ~508 MB node_modules. Built after the fat publish so a
      # slim failure never blocks the canonical package. All six packages build
      # from this single Linux host: the JS bundles are platform-independent and
      # core-bridge's npm tarball already carries every platform's prebuilt
      # release. The version was stamped into package.json above, which the
      # bundle script propagates into every generated manifest.
      - name: Build slim artifact packages
        working-directory: backend/services/runner
        run: node scripts/bundle-slim.mjs --emit-packages

      # Gate the slim publish on the artifact actually booting: size budget,
      # static-mode worker reaching RUNNING, and the manager-mode IPC
      # lifecycle — all against a real Temporal dev server, from an isolated
      # copy so nothing resolves from this checkout's node_modules.
      - name: Set up Temporal CLI
        uses: temporalio/setup-temporal@v0

      - name: Verify slim artifact boots
        working-directory: backend/services/runner
        run: |
          temporal server start-dev --headless --log-level error &
          TEMPORAL_PID=$!
          trap "kill $TEMPORAL_PID" EXIT
          for i in $(seq 1 30); do
            temporal operator cluster health >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/verify-slim-artifact.mjs

      - name: Publish slim packages to npm
        working-directory: backend/services/runner
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then NPM_TAG="next"; else NPM_TAG="latest"; fi
          # Platform packages first so the meta package's optionalDependencies
          # resolve the moment it lands.
          for pkg in dist-slim-pkgs/runner-slim-*; do
            (cd "$pkg" && npm publish --access public --tag "$NPM_TAG")
          done
          cd dist-slim-pkgs/runner-slim && npm publish --access public --tag "$NPM_TAG"

  # The TS server's slim artifact (D4 #24 cli-cutover): @stigmer/server-slim
  # plus per-platform native-bridge packages, the runner-slim pattern exactly.
  # The CLI installs it on demand at `stigmer up` and launches `node main.js`
  # as the local stack's server — the DD-006 cutover's distribution half.
  # Runs after `publish` only for release-train symmetry: the slim artifact
  # bundles everything, so it has no registry dependency on @stigmer/protos.
  publish-server-slim:
    needs: [determine-version, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace dependencies
        run: npm ci

      # Builds the ts stubs + the server-linked lib dists (build-ts-stubs),
      # installs the server's own deps, and compiles the server to dist/.
      - name: Build TS server
        run: make build-server

      # The slim artifact ships the web console's static export (DD-012:
      # console and server travel in ONE artifact, so no version skew can
      # exist); bundle-slim loud-fails without a built client-apps/web/out.
      - name: Build the web console static export
        run: make build-web

      # Stamp the release version into the package manifest; the bundle
      # script propagates it into every generated slim manifest. The file:
      # lib deps are NOT pinned to registry versions — the slim bundle
      # compiles them in, so the published packages carry no @stigmer/* deps.
      - name: Stamp version
        working-directory: backend/services/stigmer-server
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('stamped @stigmer/server-slim@' + pkg.version);
          "

      # The defines are the Go build's ldflags equivalent (release.cli.yaml):
      # the version for getServerInfo and the bundled GitHub OAuth app the
      # local github broker defaults to.
      - name: Build slim artifact packages
        working-directory: backend/services/stigmer-server
        env:
          STIGMER_SERVER_VERSION: ${{ needs.determine-version.outputs.version }}
          STIGMER_GITHUB_CLIENT_ID: ${{ secrets.STIGMER_LOCAL_GITHUB_OAUTH_CLIENT_ID }}
          STIGMER_GITHUB_CLIENT_SECRET: ${{ secrets.STIGMER_LOCAL_GITHUB_OAUTH_CLIENT_SECRET }}
        run: node scripts/bundle-slim.mjs --emit-packages

      # Gate the publish on the artifact actually working: an ISOLATED copy
      # (nothing resolves from this checkout) must serve the transport AND
      # start all three Temporal workers from the pre-built workflow bundles
      # through the per-platform native bridge, against a real Temporal dev
      # server, answer the console lane's live-HTTP probes (config.json,
      # documents, flight payloads, the 404 posture — DD-012), then shut
      # down cleanly.
      - name: Set up Temporal CLI
        uses: temporalio/setup-temporal@v0

      - name: Verify slim artifact boots and starts workers
        working-directory: backend/services/stigmer-server
        run: |
          temporal server start-dev --headless --log-level error &
          TEMPORAL_PID=$!
          trap "kill $TEMPORAL_PID" EXIT
          for i in $(seq 1 30); do
            temporal operator cluster health >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/verify-slim-artifact.mjs

      # ── The Docker image's input (DD-014, Phase-2 P4) ──
      # The amd64 tree is a byte copy of the tree the deep verify above
      # just proved; the arm64 tree is the same bundle invocation
      # retargeted (core-bridge's npm tarball carries every platform's
      # prebuilds, so cross-building is exact — the pushed arm64 image is
      # booted on a native arm64 runner before `latest` moves). Staged
      # under the TARGETARCH names the Dockerfile's COPY expects and
      # handed to publish-server-image as a workflow artifact: the image
      # consumes the already-built slim artifact, never a rebuild of its
      # own. The stamp env must ride along — the defines are baked at
      # bundle time.
      - name: Stage the per-arch image trees
        working-directory: backend/services/stigmer-server
        env:
          STIGMER_SERVER_VERSION: ${{ needs.determine-version.outputs.version }}
          STIGMER_GITHUB_CLIENT_ID: ${{ secrets.STIGMER_LOCAL_GITHUB_OAUTH_CLIENT_ID }}
          STIGMER_GITHUB_CLIENT_SECRET: ${{ secrets.STIGMER_LOCAL_GITHUB_OAUTH_CLIENT_SECRET }}
        run: |
          cp -R dist-slim dist-slim-amd64
          node scripts/bundle-slim.mjs --platform=linux-arm64
          cp -R dist-slim dist-slim-arm64

      # Before the npm publish so a failed upload leaves the version
      # unpublished and the whole run safely re-runnable.
      - name: Upload the per-arch image trees
        uses: actions/upload-artifact@v4
        with:
          name: server-slim-image-trees
          path: |
            backend/services/stigmer-server/dist-slim-amd64
            backend/services/stigmer-server/dist-slim-arm64
          retention-days: 3
          if-no-files-found: error

      - name: Publish slim packages to npm
        working-directory: backend/services/stigmer-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then NPM_TAG="next"; else NPM_TAG="latest"; fi
          # Platform packages first so the meta package's optionalDependencies
          # resolve the moment it lands.
          for pkg in dist-slim-pkgs/server-slim-*; do
            (cd "$pkg" && npm publish --access public --tag "$NPM_TAG")
          done
          cd dist-slim-pkgs/server-slim && npm publish --access public --tag "$NPM_TAG"

  # ══ The official server Docker image (DD-014, Phase-2 P4) ══
  # Push → prove → promote: the version tag is pushed first, both-arch
  # NATIVE boot smokes run against the PUSHED bytes, and only then does
  # `latest` move (the release.sandbox-cloud :prod blessing pattern applied
  # to the public tag). `latest` is only ever an image that has booted on
  # each platform it claims.
  publish-server-image:
    needs: [determine-version, publish-server-slim]
    runs-on: ubuntu-latest
    # A healthy build is a few minutes — the Dockerfile is COPY-only, so
    # nothing executes under QEMU. Cap the job so a stalled buildx/QEMU
    # step fails fast (the release.mcp-server ~1h hang on v3.1.11).
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the per-arch image trees
        uses: actions/download-artifact@v4
        with:
          name: server-slim-image-trees
          path: backend/services/stigmer-server

      # QEMU only assembles the foreign-arch layers (no RUN under
      # emulation); registered explicitly rather than relying on
      # preinstalled binfmt (release.mcp-server precedent).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No gha build cache: a COPY-only build gains nothing from it, and
      # `cache-to type=gha` has hung the export for up to an hour
      # (release.mcp-server, v3.1.11). Only the version tag is pushed
      # here — `latest` waits for the smoke jobs below.
      - name: Build and push the image (version tag only)
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file backend/services/stigmer-server/Dockerfile \
            --build-arg IMAGE_VERSION="v${VERSION}" \
            --build-arg IMAGE_REVISION="${{ github.sha }}" \
            --tag "ghcr.io/${{ github.repository_owner }}/stigmer-server:v${VERSION}" \
            --push \
            backend/services/stigmer-server

      # New GHCR packages default to private; this image is the OSS
      # self-host artifact. Idempotent, so it rides every release. The
      # first push above came from this repo's workflow, which auto-links
      # the package to stigmer/stigmer — keeping GITHUB_TOKEN write access
      # (the linkage whose absence broke the mirror packages).
      - name: Ensure GHCR package is public
        continue-on-error: true
        run: |
          gh api \
            -X PUT \
            /orgs/${{ github.repository_owner }}/packages/container/stigmer-server/visibility \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Native smokes of the PUSHED tag — the same script PR CI and local dev
  # run (scripts/smoke-docker-image.mjs): docker health, Connect-JSON
  # health SERVING, console lane, CRUD round-trip, restart persistence,
  # clean SIGTERM. No QEMU: each arch proves itself on its own runner.
  smoke-server-image-amd64:
    needs: [determine-version, publish-server-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot-smoke the pushed image (native amd64)
        run: |
          node backend/services/stigmer-server/scripts/smoke-docker-image.mjs \
            --image="ghcr.io/${{ github.repository_owner }}/stigmer-server:v${{ needs.determine-version.outputs.version }}"

  smoke-server-image-arm64:
    needs: [determine-version, publish-server-image]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot-smoke the pushed image (native arm64)
        run: |
          node backend/services/stigmer-server/scripts/smoke-docker-image.mjs \
            --image="ghcr.io/${{ github.repository_owner }}/stigmer-server:v${{ needs.determine-version.outputs.version }}"

  promote-server-image-latest:
    needs: [determine-version, smoke-server-image-amd64, smoke-server-image-arm64]
    # Stable only: a prerelease (any '-') never becomes `latest` — the npm
    # `next`-tag logic applied to the image channel (DD-014: latest on
    # stable). imagetools create re-points the manifest list without
    # rebuilding, so `latest` is bit-identical to the smoked version tag.
    if: ${{ !contains(needs.determine-version.outputs.version, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote latest to the smoked version tag
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository_owner }}/stigmer-server:latest" \
            "ghcr.io/${{ github.repository_owner }}/stigmer-server:v${VERSION}"

  # ══ The compose-runner image (DD-013/DD-014, Phase-2 P5) ══
  # The self-host stack's runner: Dockerfile.sandbox's `compose-runner`
  # stage (the cloud sandbox stage + the stigmer CLI the OSS-shape MCP
  # attachments spawn). Published as ghcr.io/stigmer/stigmer-runner with
  # the server image's tag policy: push the version tag → prove it with
  # the FULL compose smoke on both native arches → promote `latest` and
  # bump the committed compose pin.
  #
  # Unlike the server image (COPY-only, QEMU-safe), this build compiles
  # the runner and npm-installs the CLI in RUN steps — so each arch builds
  # NATIVELY on its own runner (per-arch tags), and a manifest job merges
  # them. Needs `publish`: the CLI installs from the npm registry at this
  # release's version.
  publish-runner-image-amd64:
    needs: [determine-version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (native amd64, per-arch tag)
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target compose-runner \
            --build-arg STIGMER_CLI_VERSION="${VERSION}" \
            --file backend/services/runner/Dockerfile.sandbox \
            --tag "ghcr.io/${{ github.repository_owner }}/stigmer-runner:v${VERSION}-amd64" \
            --push \
            .

  publish-runner-image-arm64:
    needs: [determine-version, publish]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (native arm64, per-arch tag)
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --target compose-runner \
            --build-arg STIGMER_CLI_VERSION="${VERSION}" \
            --file backend/services/runner/Dockerfile.sandbox \
            --tag "ghcr.io/${{ github.repository_owner }}/stigmer-runner:v${VERSION}-arm64" \
            --push \
            .

  publish-runner-image:
    needs: [determine-version, publish-runner-image-amd64, publish-runner-image-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the per-arch tags into the version manifest
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository_owner }}/stigmer-runner:v${VERSION}" \
            "ghcr.io/${{ github.repository_owner }}/stigmer-runner:v${VERSION}-amd64" \
            "ghcr.io/${{ github.repository_owner }}/stigmer-runner:v${VERSION}-arm64"

      - name: Ensure GHCR package is public
        continue-on-error: true
        run: |
          gh api \
            -X PUT \
            /orgs/${{ github.repository_owner }}/packages/container/stigmer-runner/visibility \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The published-tag re-verification the P5 gate ruled (Q-A): the SAME
  # scripts/smoke-compose.mjs that gates PRs (there: build-from-source)
  # runs the full stack — Postgres, Temporal, server, runner — from the
  # images just pushed, up to one end-to-end workflow run, natively per
  # arch. `stigmer-runner:latest` and the compose pin only move after
  # the stack these tags name has actually run somewhere.
  smoke-compose-amd64:
    needs: [determine-version, publish-server-image, publish-runner-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose smoke against the pushed tags (native amd64)
        run: |
          node scripts/smoke-compose.mjs --published \
            --version="v${{ needs.determine-version.outputs.version }}"

  smoke-compose-arm64:
    needs: [determine-version, publish-server-image, publish-runner-image]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose smoke against the pushed tags (native arm64)
        run: |
          node scripts/smoke-compose.mjs --published \
            --version="v${{ needs.determine-version.outputs.version }}"

  promote-runner-image-latest:
    needs: [determine-version, smoke-compose-amd64, smoke-compose-arm64]
    # Stable only — same channel policy as the server image, with a
    # stronger proof: `latest` moves only after the full compose stack ran
    # end-to-end on both arches from the pushed tags.
    if: ${{ !contains(needs.determine-version.outputs.version, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote latest to the smoked version tag
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository_owner }}/stigmer-runner:latest" \
            "ghcr.io/${{ github.repository_owner }}/stigmer-runner:v${VERSION}"

  # The compose pin is release-lane-managed (P5 gate ruling Q-A): after
  # both published-tag compose smokes pass on a stable release, open a PR
  # re-pointing docker-compose.yml's STIGMER_VERSION default (and the
  # .env.example doc line) at this version. A PR, not a push: main stays
  # protected and the bump is reviewable. Requires the org setting
  # "Allow GitHub Actions to create and approve pull requests"; if the
  # job fails on that, flip the setting — do not hand-edit the pin.
  bump-compose-pins:
    needs: [determine-version, smoke-compose-amd64, smoke-compose-arm64]
    if: ${{ !contains(needs.determine-version.outputs.version, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Re-point the compose pins and open the bump PR
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sed -i -E "s/STIGMER_VERSION:-v[0-9A-Za-z.+-]+/STIGMER_VERSION:-v${VERSION}/g" docker-compose.yml
          sed -i -E "s/^#STIGMER_VERSION=.*/#STIGMER_VERSION=v${VERSION}/" .env.example
          if git diff --quiet; then
            echo "pins already at v${VERSION} — nothing to bump"
            exit 0
          fi
          BRANCH="release/compose-pin-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore(release): pin the compose stack to v${VERSION}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore(release): pin the compose stack to v${VERSION}" \
            --body "Automated by release.npm-libs.yaml after both published-tag compose smokes passed (amd64 + arm64). Re-points the \`STIGMER_VERSION\` default in docker-compose.yml (and the .env.example doc line) at the release both images were proven under."
