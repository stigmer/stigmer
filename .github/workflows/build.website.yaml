# =============================================================================
# Website Build
# =============================================================================
# Builds stigmer.ai's static export (site/out) once, the same way for both of
# its callers, and uploads it as the artifact `site-out`:
#   - release.website.yaml, on main: production deploys exactly this export;
#   - preview.website.yaml, on a pull request: the pull request's review site
#     at https://review-<number>.stigmer.ai is exactly this export, so a review
#     shows what merging would ship.
#
# It holds no secret and runs the website's own dependencies, so a caller may
# be a fork's pull request. Its one credential is the run's own read-only
# token, in the one step that saves GitHub's releases list for the Releases
# page, before anything is installed; the steps that install and run the
# website's dependencies never see it. The jobs
# that hold a Cloudflare key never run this build; they download its artifact
# and upload files.
# =============================================================================

name: build.website

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The Releases page lists stigmer/stigmer's releases, the repository
      # the site names (site/src/lib/constants.ts), and a build that cannot
      # read them fails (site/src/lib/releases.ts). The list is read here,
      # with this run's read-only token, and handed to the build as a file.
      # The build's own read carries no token, so it shares the small
      # allowance of the runner's address with every other job on it. The
      # read comes before anything is installed, so no code the website
      # depends on has run when the token is used, and the token is in no
      # later step.
      - name: Save the releases list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/stigmer/stigmer/releases?per_page=100" --jq '.[]' \
            | jq --slurp '.' > "${RUNNER_TEMP}/releases.json"
          echo "Saved $(jq length "${RUNNER_TEMP}/releases.json") releases."

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # No restored npm cache: the export is built from the lockfile alone (v5+ caches by default).
          package-manager-cache: false
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Install npm dependencies
        run: npm ci

      - name: Build SDK libraries
        run: npm run build:libs

      - name: Install Vale
        run: make install-vale

      - name: Build site
        env:
          STIGMER_RELEASES_FILE: ${{ runner.temp }}/releases.json
        run: |
          make build-site
          if [ -f site/out/index.html ] && [ ! -f site/out/404.html ]; then
            cp site/out/index.html site/out/404.html
          fi

      # Every published release in the saved list has its entry in the
      # export, so a deploy never ships a Releases page that is a release
      # behind the list it was built from.
      - name: Check the export lists every published release
        env:
          STIGMER_RELEASES_FILE: ${{ runner.temp }}/releases.json
        run: |
          set -euo pipefail
          page=site/out/releases.html
          [ -f "$page" ] || page=site/out/releases/index.html
          jq -r '.[] | select((.draft or .prerelease) | not) | .tag_name' "$STIGMER_RELEASES_FILE" > "${RUNNER_TEMP}/published-tags.txt"
          while read -r tag; do
            grep -qF "id=\"${tag}\"" "$page" || { echo "::error::${page} has no entry for ${tag}"; exit 1; }
          done < "${RUNNER_TEMP}/published-tags.txt"
          echo "${page} lists all $(wc -l < "${RUNNER_TEMP}/published-tags.txt" | tr -d ' ') published releases."

      # Each caller's deploy job downloads this by name, from its own run.
      - name: Upload the export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-out
          path: site/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
