# Live-tests marketplace MCP servers: credential-free transport reachability
# probes from the seedpack module (oss#569).
#
# The canary job that once ran here — full-harness calls with real vendor
# credentials through the Go test/integration suite, booted on the Java
# stigmer-service JAR — retired with the service and the Go harness
# (stigmer-cloud DD-013; stigmer#1022 / #1031). Its successor is the canary's
# re-point at the cloud composition, E1's open item on stigmer#988; until
# that lands this lane is the transport probe alone.

name: ci.seedpack-canary

on:
  schedule:
    - cron: '0 2 * * 1-5'  # Weekdays at 2am UTC
  workflow_dispatch:

concurrency:
  group: seedpack-canary-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write


jobs:
  seedpack-transport:
    name: Seedpack Transport Reachability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run transport reachability tests
        run: make test-seedpack-transport

      - name: Upload transport test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seedpack-transport-test-results
          path: seedpack/.test-output-transport/
          retention-days: 30
          if-no-files-found: ignore
          # The output dir is dot-prefixed and upload-artifact@v4 excludes
          # hidden paths by default — without this the artifact is silently
          # empty (found on the integration-canary lane's first real run, #323).
          include-hidden-files: true

      - name: Publish transport test report
        if: always() && hashFiles('seedpack/.test-output-transport/junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Seedpack Transport Test Report
          path: seedpack/.test-output-transport/junit.xml
          reporter: java-junit

  # Scheduled runs are unattended; manual dispatches are watched (#477).
  # Shared file-or-comment mechanics live in notify-failure.yaml.
  notify-failure:
    name: File Seedpack Canary Failure Issue
    needs: [seedpack-transport]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      label: ci-seedpack-canary-failure
      title: "ci.seedpack-canary: seedpack MCP canary is failing"
      body-context: >-
        This lane probes marketplace MCP servers' transport reachability
        (credential-free). A failure here usually means a vendor endpoint
        moved or a seedpack manifest that no longer matches the vendor.
