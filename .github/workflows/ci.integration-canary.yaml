# =============================================================================
# Integration Tests (Canary — Nightly Provider Health)
# =============================================================================
# Minimal live provider canary tests that only assert phase == COMPLETED.
# No content assertions — these detect provider regressions (model retirement,
# proxy breakage, API key expiry) without flaking on LLM output.
#
# Tests:
#   TestCanary_NativeAgentCompletes   — Anthropic simple prompt
#   TestCanary_CursorAgentCompletes   — Cursor SDK simple prompt
#   TestCanary_LlmCallProxy           — Workflow llm_call via proxy
#   TestCanary_McpToolStdio            — MCP stdio tool invocation
#   TestCanary_McpToolHttp             — MCP HTTP tool invocation
#
# Cost: under $0.05 per run.
#
# Secrets: ANTHROPIC_API_KEY and CURSOR_API_KEY from "provider-integration".
# =============================================================================

name: ci.integration-canary

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      cloud_ref:
        description: "stigmer-cloud git ref to build the service JAR from"
        required: false
        type: string
        default: "main"

concurrency:
  group: integration-canary-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  build-service-jar:
    name: Build Service JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stigmer-cloud
        uses: actions/checkout@v4
        with:
          repository: stigmer/stigmer-cloud
          ref: ${{ inputs.cloud_ref || 'main' }}
          path: stigmer-cloud
          token: ${{ secrets.STIGMER_CLOUD_TOKEN }}

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: integration-jar
          repository-cache: true

      - name: Build fat JAR
        working-directory: stigmer-cloud
        run: ./bazelw build //backend/services/stigmer-service:stigmer_service_fatjar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: stigmer-service-jar
          path: stigmer-cloud/bazel-bin/backend/services/stigmer-service/stigmer_service_fatjar.jar
          retention-days: 1
          if-no-files-found: error

  canary-tests:
    name: Canary Tests
    runs-on: ubuntu-latest
    needs: build-service-jar
    timeout-minutes: 15
    environment: provider-integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download service JAR
        uses: actions/download-artifact@v4
        with:
          name: stigmer-service-jar
          path: .artifacts

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm workspace dependencies
        run: npm ci

      - name: Build proto stubs
        run: npm run build -w @stigmer/protos

      - name: Install and build unified runner
        working-directory: backend/services/runner
        run: npm ci && npm run build

      - name: Install Temporal CLI
        uses: temporalio/setup-temporal@v0

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Install OpenFGA CLI
        run: |
          go install github.com/openfga/cli/cmd/fga@latest
          fga version

      - name: Run canary tests
        env:
          STIGMER_SERVICE_JAR: ${{ github.workspace }}/.artifacts/stigmer_service_fatjar.jar
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: make test-integration-canary

      - name: Upload canary test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-test-results
          path: test/integration/.test-output-canary/
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish canary test report
        if: always() && hashFiles('test/integration/.test-output-canary/junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Canary Test Report
          path: test/integration/.test-output-canary/junit.xml
          reporter: java-junit
