name: release.python-sdk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${GITHUB_EVENT_INPUTS_VERSION}"
          fi
          VERSION_NO_V="${VERSION#v}"
          echo "version=$VERSION_NO_V" >> $GITHUB_OUTPUT
          echo "Publishing stigmer Python packages at version: $VERSION_NO_V"
        env:
          GITHUB_EVENT_INPUTS_VERSION: ${{ github.event.inputs.version }}

  publish-protos:
    needs: determine-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Node before stub generation: the stub scrub inside gen-stubs.sh runs
      # from TypeScript source via the repo-pinned tsx.
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # No restored npm cache in a release (v5+ caches by default).
          package-manager-cache: false
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Generate Python proto stubs
        run: STUBS_FORCE=1 make -C apis python-stubs

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Set version
        working-directory: apis/stubs/python/stigmer
        run: |
          VERSION="${NEEDS_DETERMINE_VERSION_OUTPUTS_VERSION}"
          python -c "
          import re, pathlib
          p = pathlib.Path('pyproject.toml')
          text = p.read_text()
          text = re.sub(r'version\s*=\s*\"[^\"]*\"', 'version = \"$VERSION\"', text, count=1)
          p.write_text(text)
          "
          echo "Set stigmer-protos version to $VERSION"
        env:
          NEEDS_DETERMINE_VERSION_OUTPUTS_VERSION: ${{ needs.determine-version.outputs.version }}

      - name: Build package
        working-directory: apis/stubs/python/stigmer
        run: |
          pip install build
          python -m build

      # skip-existing keeps release re-runs idempotent: recovering a partial
      # release via workflow_dispatch re-runs this job, and PyPI rejects
      # duplicate uploads of an already-published version (oss#908).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: apis/stubs/python/stigmer/dist/
          skip-existing: true

  publish-sdk:
    needs: [determine-version, publish-protos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The client generator runs from TypeScript source via the repo-pinned
      # tsx (never bare npx — oss#531), so the root npm install must exist
      # before the codegen step.
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # No restored npm cache in a release (v5+ caches by default).
          package-manager-cache: false
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Generate SDK client code
        run: make -C sdk/python codegen

      - name: Set version and pin protos dependency
        working-directory: sdk/python
        run: |
          VERSION="${NEEDS_DETERMINE_VERSION_OUTPUTS_VERSION}"
          python -c "
          import re, pathlib
          p = pathlib.Path('pyproject.toml')
          text = p.read_text()
          text = re.sub(r'version\s*=\s*\"[^\"]*\"', 'version = \"$VERSION\"', text, count=1)
          text = re.sub(r'\"stigmer-protos[^\"]*\"', '\"stigmer-protos==$VERSION\"', text)
          p.write_text(text)
          "
          echo "Set stigmer version to $VERSION (protos dependency: $VERSION)"
        env:
          NEEDS_DETERMINE_VERSION_OUTPUTS_VERSION: ${{ needs.determine-version.outputs.version }}

      - name: Build package
        working-directory: sdk/python
        run: |
          pip install build
          python -m build

      # skip-existing for the same re-run idempotency as publish-protos.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist/
          skip-existing: true
