name: release.cursor-runner

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          fi
          VERSION_NO_V="${VERSION#v}"
          echo "version=$VERSION_NO_V" >> $GITHUB_OUTPUT
          echo "Publishing @stigmer/cursor-runner at version: $VERSION_NO_V"

  publish:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate TypeScript proto stubs
        run: make -C apis ts-stubs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install proto stubs dependencies
        working-directory: apis/stubs/ts
        run: npm install

      - name: Install cursor-runner dependencies
        working-directory: backend/services/cursor-runner
        run: npm install

      - name: Build cursor-runner
        working-directory: backend/services/cursor-runner
        run: npm run build

      - name: Prepare dist/package.json for publishing
        working-directory: backend/services/cursor-runner
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const pub = pkg.publishConfig || {};

          const dist = {
            name: pkg.name,
            version: '$VERSION',
            description: pkg.description,
            license: pkg.license,
            type: pkg.type,
            engines: pkg.engines,
            bin: { 'stigmer-cursor-runner': './main.js' },
            main: (pub.main || './dist/main.js').replace('./dist/', './'),
            types: (pub.types || './dist/main.d.ts').replace('./dist/', './'),
            exports: pub.exports ? JSON.parse(JSON.stringify(pub.exports).replace(/\.\/dist\//g, './')) : undefined,
            repository: pkg.repository,
            keywords: pkg.keywords,
            dependencies: { ...pkg.dependencies },
          };

          // Replace file: proto dep with pinned version
          if (dist.dependencies['@stigmer/protos']) {
            dist.dependencies['@stigmer/protos'] = '$VERSION';
          }

          fs.writeFileSync('dist/package.json', JSON.stringify(dist, null, 2) + '\n');
          console.log('Generated dist/package.json at version ' + '$VERSION');
          "

      - name: Copy metadata files to dist
        working-directory: backend/services/cursor-runner
        run: |
          [ -f README.md ] && cp README.md dist/ || true
          [ -f ../../LICENSE ] && cp ../../LICENSE dist/ || true

      - name: Publish to npm
        working-directory: backend/services/cursor-runner
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          VERSION="${{ needs.determine-version.outputs.version }}"
          TAG="latest"
          if echo "$VERSION" | grep -q '-'; then TAG="next"; fi
          npm publish dist/ --access public --tag "$TAG"
          rm -f .npmrc
