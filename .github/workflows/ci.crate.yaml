# =============================================================================
# Rust crate quality gate: stigmer-runner-host
# =============================================================================
# This is the only CI that exercises the Rust crate as a standalone artifact
# (the desktop shell that links it is tested by ci.ts-workspace's
# desktop-rust job and built by release.desktop). It guards the crate before it
# ships to crates.io, so it must stay green on `main`.
#
# Two independent jobs:
#   - `rust`         — fmt, clippy (both feature sets), build + test. The crate
#                      MUST build without Tauri (framework-agnostic core) and
#                      with it (the desktop binding), so we check both. Then
#                      the desktop shell, its one consumer, is checked against
#                      it: the shell links the crate by path, which the
#                      workspace lane's turbo gate cannot see.
#   - `ipc-fixtures` — proves the crate's vendored IPC fixture is still
#                      byte-identical to what the canonical runner contract
#                      (backend/services/runner/src/ipc-protocol.ts) generates.
#                      Triggered on the runner protocol source too, so a
#                      contract change that forgets to regenerate the crate copy
#                      fails here rather than silently drifting.
# =============================================================================

name: ci.crate

on:
  # Called by ci.gate.yaml when scripts/ci-lanes.mjs finds the change needs
  # this lane (the path list and its reasons live there); `Gate` is the
  # required check.
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Inside the gate a missing test dependency fails instead of skipping
  # (the Postgres and Temporal helpers read it); a caller's env does not
  # reach a called workflow, so each lane sets it itself.
  STIGMER_TEST_GATE: "1"

jobs:
  rust:
    name: fmt / clippy / build / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/stigmer-runner-host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/stigmer-runner-host -> target
            client-apps/desktop/src-tauri -> target

      # The `tauri` feature pulls in the Tauri crate, which needs system webkit
      # libraries to compile on Linux.
      - name: Install Tauri's Linux packages
        uses: ./.github/actions/tauri-linux-deps

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (default, no Tauri)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (tauri feature)
        run: cargo clippy --all-targets --features tauri -- -D warnings

      - name: Build + test (no Tauri)
        run: cargo build && cargo test

      - name: Build (tauri feature)
        run: cargo build --features tauri

      # The desktop shell re-exports this crate's Tauri commands; a change to
      # the crate's API has to compile there too, and no other lane runs for a
      # crate-only change. A check, not ci.ts-workspace's `cargo test`: the
      # shell's own tests do not call this crate, whose tests ran above.
      - name: Check the desktop shell against this crate
        working-directory: .
        run: make check-desktop-rust

  ipc-fixtures:
    name: IPC fixture freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # `make gen-ipc-fixtures-check` installs the runner's deps on demand, then
      # regenerates the golden fixtures and fails if either committed copy (the
      # runner's or the crate's) differs.
      - name: Verify golden IPC fixtures are fresh
        run: make gen-ipc-fixtures-check
