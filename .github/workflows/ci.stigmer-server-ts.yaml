# =============================================================================
# TypeScript Server — Vitest Suite + Artifact Boot Gates
# =============================================================================
# Runs the standalone TypeScript server's (`@stigmer/server`,
# backend/services/stigmer-server-ts) full gate: typecheck, vitest suite,
# and plain-`node` boot checks of BOTH compiled artifacts (tsc dist and the
# esbuild slim bundle).
#
# The service is the parity-gated TS port of stigmer-server (Go) — see the
# directory's README.md. Like the runner, it is NOT part of the root npm
# workspaces: own package-lock.json, file:-linked @stigmer/protos, installed
# and built separately (this mirrors ci.runner.yaml, the per-service CI
# pattern).
#
# The boot checks exist for the #399 failure class: vitest/tsx module
# interop tolerates ESM/CJS import shapes that Node's real loader rejects,
# so an import-time crash in `node dist/main.js` can pass every other gate.
# scripts/verify-boot.mjs runs the full lifecycle (bind → listening →
# SIGTERM → exit 0) the way the CLI daemon will.
#
# Path filter mirrors ci.runner.yaml's: the service's own tree, the proto
# stubs it links, the Makefile (test-server-ts lives there), and this file.
# =============================================================================

name: ci.stigmer-server-ts

on:
  pull_request:
    paths:
      - "backend/services/stigmer-server-ts/**"
      - "apis/stubs/ts/**"
      - "Makefile"
      - ".github/workflows/ci.stigmer-server-ts.yaml"
  push:
    branches: [main]
    paths:
      - "backend/services/stigmer-server-ts/**"
      - "apis/stubs/ts/**"
      - "Makefile"
      - ".github/workflows/ci.stigmer-server-ts.yaml"

concurrency:
  group: stigmer-server-ts-${{ github.head_ref || github.ref }}
  # PR pushes cancel superseded runs; main pushes queue instead, so every
  # merge gets a completed, attributable run (stigmer/stigmer#725).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  server-ts:
    name: Server TS Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      # The server file:-links @stigmer/protos AND @stigmer/temporal-codecs
      # (the decode-only payload codec wraps the lib since D4 #18) and
      # imports their built dists — build:runner-deps builds exactly both.
      - name: Build the proto stubs and temporal-codecs
        run: npm run build:runner-deps

      # Standalone package with its own lockfile (mirrors ci.runner.yaml).
      - name: Install server dependencies
        working-directory: backend/services/stigmer-server-ts
        run: npm ci

      - name: Typecheck
        working-directory: backend/services/stigmer-server-ts
        run: npm run typecheck

      - name: Build and boot-check the compiled dist
        working-directory: backend/services/stigmer-server-ts
        run: npm run build && npm run verify:dist

      - name: Bundle and boot-check the slim artifact
        working-directory: backend/services/stigmer-server-ts
        run: node scripts/bundle-slim.mjs && npm run verify:slim

      - name: Run the vitest suite
        run: make test-server-ts
