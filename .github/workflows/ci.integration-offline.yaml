# =============================================================================
# Integration Tests (Offline)
# =============================================================================
# Runs ALL offline integration test suites against the Stigmer Cloud Java
# service. "Offline" means no LLM provider API keys are needed.
#
# Suites:
#   1. integration          — core platform (agents, workflows, auth, FGA, SDK)
#   2. integration-security — production JWT auth chain, federated IdP
#   3. integration-session-routing  — per-session Temporal task queue routing
#   4. integration-wfexec-routing   — per-execution workflow activity routing
#   5. integration-offline  — deterministic tests with recorded LLM responses
#
# Architecture:
#   Job 1 (build-service-jar) — checks out stigmer-cloud, builds the fat JAR
#   Job 2 (integration-tests) — runs all offline suites with the JAR
#
# Job 1 is intentionally isolated so it can be replaced with a pre-built
# artifact download when stigmer-cloud publishes standalone JAR releases.
# =============================================================================

name: ci.integration-offline

on:
  pull_request:
    paths:
      - "backend/**"
      - "test/integration/**"
      - "test/integration-offline/**"
      - "test/integration-security/**"
      - "test/integration-session-routing/**"
      - "test/integration-wfexec-routing/**"
      - "apis/**"
      - "go.work"
      - "go.work.sum"
      - "Makefile"
      - ".github/workflows/ci.integration-offline.yaml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "test/integration/**"
      - "test/integration-offline/**"
      - "test/integration-security/**"
      - "test/integration-session-routing/**"
      - "test/integration-wfexec-routing/**"
      - "apis/**"
      - "go.work"
      - "go.work.sum"
      - "Makefile"
      - ".github/workflows/ci.integration-offline.yaml"
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      cloud_ref:
        description: "stigmer-cloud git ref to build the service JAR from"
        required: false
        type: string
        default: "main"

concurrency:
  group: integration-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build the Stigmer Cloud Java service fat JAR from source.
  #
  # Uses Bazel with the repo's own .bazelrc (which configures BuildBuddy
  # remote cache for read-only access). The setup-bazel action adds local
  # disk and repository caching for faster subsequent runs.
  # ---------------------------------------------------------------------------
  build-service-jar:
    name: Build Service JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stigmer-cloud
        uses: actions/checkout@v4
        with:
          repository: stigmer/stigmer-cloud
          ref: ${{ inputs.cloud_ref || 'main' }}
          path: stigmer-cloud
          token: ${{ secrets.STIGMER_CLOUD_TOKEN }}

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: integration-jar
          repository-cache: true

      - name: Build fat JAR
        working-directory: stigmer-cloud
        run: ./bazelw build //backend/services/stigmer-service:stigmer_service_fatjar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: stigmer-service-jar
          path: stigmer-cloud/bazel-bin/backend/services/stigmer-service/stigmer_service_fatjar.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload FGA model
        uses: actions/upload-artifact@v4
        with:
          name: fga-model
          path: stigmer-cloud/backend/services/stigmer-service/src/main/resources/fga/model/
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: Run all offline integration test suites.
  #
  # Downloads the JAR from Job 1, sets up runtime dependencies (Go, Java 21,
  # Node.js, Temporal CLI, gotestsum), and runs all four suites sequentially.
  # Docker is available on ubuntu-latest for Testcontainers (Mongo 7, Redis 7).
  #
  # Each suite spins up its own infrastructure (containers + Java service) with
  # different service configurations, then tears it down on completion.
  #
  # Outputs: JUnit XML, JSON event log, service logs per suite.
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-service-jar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download service JAR
        uses: actions/download-artifact@v4
        with:
          name: stigmer-service-jar
          path: .artifacts

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm workspace dependencies
        run: npm ci

      - name: Build proto stubs
        run: npm run build -w @stigmer/protos

      - name: Install and build unified runner
        working-directory: backend/services/runner
        run: npm ci && npm run build

      - name: Install Temporal CLI
        uses: temporalio/setup-temporal@v0

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Install OpenFGA CLI
        run: |
          go install github.com/openfga/cli/cmd/fga@latest
          fga version

      - name: Download FGA model
        uses: actions/download-artifact@v4
        with:
          name: fga-model
          path: .artifacts/fga-model

      # ── Suite 1: Core integration tests ──────────────────────────────────

      - name: "Suite 1: Run integration tests"
        env:
          STIGMER_SERVICE_JAR: ${{ github.workspace }}/.artifacts/stigmer_service_fatjar.jar
          STIGMER_FGA_MODEL_DIR: ${{ github.workspace }}/.artifacts/fga-model
          INTEGRATION_TEST_OTEL: "true"
        run: make test-integration

      - name: "Suite 1: Guard against silent test skip"
        if: success()
        run: |
          JUNIT="test/integration/.test-output/junit.xml"
          if [ ! -f "$JUNIT" ]; then
            echo "::error::JUnit XML not found at $JUNIT"
            exit 1
          fi
          COUNT=$(grep -o 'tests="[0-9]*"' "$JUNIT" | head -1 | grep -o '[0-9]*')
          if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
            echo "::error::JUnit reports 0 tests — integration suite was silently skipped"
            exit 1
          fi
          echo "Integration tests executed: $COUNT"

      - name: "Suite 1: Generate flake report"
        if: always()
        run: |
          REPORT_DIR=test/integration/.test-output
          if [ -f "$REPORT_DIR/test-output.json" ]; then
            cd test/integration/tools/flaketrack && GOWORK=off go run . report \
              --json "$(pwd)/../../.test-output/test-output.json" \
              --rerun-report "$(pwd)/../../.test-output/rerun-report.txt" \
              --quarantine "$(pwd)/../../quarantine.json" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Suite 2: Security integration tests ─────────────────────────────

      - name: "Suite 2: Run security integration tests"
        if: always()
        env:
          STIGMER_SERVICE_JAR: ${{ github.workspace }}/.artifacts/stigmer_service_fatjar.jar
          STIGMER_FGA_MODEL_DIR: ${{ github.workspace }}/.artifacts/fga-model
        run: make test-integration-security

      # ── Suite 3: Session routing integration tests ──────────────────────

      - name: "Suite 3: Run session routing integration tests"
        if: always()
        env:
          STIGMER_SERVICE_JAR: ${{ github.workspace }}/.artifacts/stigmer_service_fatjar.jar
          STIGMER_FGA_MODEL_DIR: ${{ github.workspace }}/.artifacts/fga-model
        run: make test-integration-session-routing

      # ── Suite 4: Workflow execution routing integration tests ────────────

      - name: "Suite 4: Run wfexec routing integration tests"
        if: always()
        env:
          STIGMER_SERVICE_JAR: ${{ github.workspace }}/.artifacts/stigmer_service_fatjar.jar
          STIGMER_FGA_MODEL_DIR: ${{ github.workspace }}/.artifacts/fga-model
        run: make test-integration-wfexec-routing

      # ── Suite 5: Deterministic offline tests (recorded LLM responses) ──

      - name: "Suite 5: Run deterministic offline tests (recorded LLM)"
        if: always()
        env:
          STIGMER_SERVICE_JAR: ${{ github.workspace }}/.artifacts/stigmer_service_fatjar.jar
          STIGMER_FGA_MODEL_DIR: ${{ github.workspace }}/.artifacts/fga-model
        run: make test-integration-offline

      # ── Artifacts ───────────────────────────────────────────────────────

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test/integration/.test-output/
          retention-days: 30

      - name: Upload security test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-results
          path: test/integration-security/.test-output-security/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload session routing test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-routing-test-results
          path: test/integration-session-routing/.test-output-session-routing/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload wfexec routing test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wfexec-routing-test-results
          path: test/integration-wfexec-routing/.test-output-wfexec-routing/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload deterministic offline test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-offline-test-results
          path: test/integration-offline/.test-output-offline/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload trace bundles
        if: failure() && hashFiles('test/integration/.test-output/traces/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: integration-trace-bundles
          path: test/integration/.test-output/traces/
          retention-days: 30

      - name: Publish integration test report
        if: always() && hashFiles('test/integration/.test-output/junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Integration Test Report
          path: test/integration/.test-output/junit.xml
          reporter: java-junit

      - name: Publish security test report
        if: always() && hashFiles('test/integration-security/.test-output-security/junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Security Test Report
          path: test/integration-security/.test-output-security/junit.xml
          reporter: java-junit

      - name: Publish session routing test report
        if: always() && hashFiles('test/integration-session-routing/.test-output-session-routing/junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Session Routing Test Report
          path: test/integration-session-routing/.test-output-session-routing/junit.xml
          reporter: java-junit

      - name: Publish wfexec routing test report
        if: always() && hashFiles('test/integration-wfexec-routing/.test-output-wfexec-routing/junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: WfExec Routing Test Report
          path: test/integration-wfexec-routing/.test-output-wfexec-routing/junit.xml
          reporter: java-junit

      - name: Publish deterministic offline test report
        if: always() && hashFiles('test/integration-offline/.test-output-offline/junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Deterministic Offline Test Report
          path: test/integration-offline/.test-output-offline/junit.xml
          reporter: java-junit
