# =============================================================================
# Integration Tests (Offline)
# =============================================================================
# End-to-end integration tests for the workflow execution pipeline. Validates
# the full path: Go test harness → Testcontainers (Mongo, Redis) → Temporal →
# Java service (stigmer-cloud) → Go workflow-runner → zigflow → gRPC callbacks.
#
# "Offline" means no LLM provider API keys are needed. These tests exercise
# the orchestration infrastructure without making external AI calls.
#
# Architecture:
#   Job 1 (build-service-jar) — checks out stigmer-cloud, builds the fat JAR
#   Job 2 (integration-tests) — runs `make test-integration` with the JAR
#
# Job 1 is intentionally isolated so it can be replaced with a pre-built
# artifact download when stigmer-cloud publishes standalone JAR releases.
# =============================================================================

name: ci.integration-offline

on:
  pull_request:
    paths:
      - "backend/**"
      - "test/integration/**"
      - "apis/**"
      - "go.work"
      - "go.work.sum"
      - "Makefile"
      - ".github/workflows/ci.integration-offline.yaml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "test/integration/**"
      - "apis/**"
      - "go.work"
      - "go.work.sum"
      - "Makefile"
      - ".github/workflows/ci.integration-offline.yaml"
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      cloud_ref:
        description: "stigmer-cloud git ref to build the service JAR from"
        required: false
        type: string
        default: "main"

concurrency:
  group: integration-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build the Stigmer Cloud Java service fat JAR from source.
  #
  # Uses Bazel with the repo's own .bazelrc (which configures BuildBuddy
  # remote cache for read-only access). The setup-bazel action adds local
  # disk and repository caching for faster subsequent runs.
  # ---------------------------------------------------------------------------
  build-service-jar:
    name: Build Service JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stigmer-cloud
        uses: actions/checkout@v4
        with:
          repository: stigmer/stigmer-cloud
          ref: ${{ inputs.cloud_ref || 'main' }}
          path: stigmer-cloud
          token: ${{ secrets.STIGMER_CLOUD_TOKEN }}

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: integration-jar
          repository-cache: true

      - name: Build fat JAR
        working-directory: stigmer-cloud
        run: ./bazelw build //backend/services/stigmer-service:stigmer_service_fatjar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: stigmer-service-jar
          path: stigmer-cloud/bazel-bin/backend/services/stigmer-service/stigmer_service_fatjar.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload FGA model
        uses: actions/upload-artifact@v4
        with:
          name: fga-model
          path: stigmer-cloud/backend/services/stigmer-service/src/main/resources/fga/model/
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: Run the integration test suite.
  #
  # Downloads the JAR from Job 1, sets up runtime dependencies (Go, Java 21,
  # Temporal CLI, gotestsum), and runs `make test-integration`. Docker is
  # available on ubuntu-latest for Testcontainers (Mongo 7, Redis 7).
  #
  # Outputs: JUnit XML, JSON event log, Java service log, workflow-runner log.
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-service-jar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download service JAR
        uses: actions/download-artifact@v4
        with:
          name: stigmer-service-jar
          path: .artifacts

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Temporal CLI
        uses: temporalio/setup-temporal@v0

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Install OpenFGA CLI
        run: |
          curl -fsSL https://openfga.dev/api/installcli | bash
          fga version

      - name: Download FGA model
        uses: actions/download-artifact@v4
        with:
          name: fga-model
          path: .artifacts/fga-model

      - name: Run integration tests
        env:
          STIGMER_SERVICE_JAR: ${{ github.workspace }}/.artifacts/stigmer_service_fatjar.jar
          STIGMER_FGA_MODEL_DIR: ${{ github.workspace }}/.artifacts/fga-model
          INTEGRATION_TEST_OTEL: "true"
        run: make test-integration

      - name: Guard against silent test skip
        if: success()
        run: |
          JUNIT="test/integration/.test-output/junit.xml"
          if [ ! -f "$JUNIT" ]; then
            echo "::error::JUnit XML not found at $JUNIT"
            exit 1
          fi
          COUNT=$(grep -o 'tests="[0-9]*"' "$JUNIT" | head -1 | grep -o '[0-9]*')
          if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
            echo "::error::JUnit reports 0 tests — integration suite was silently skipped"
            exit 1
          fi
          echo "Integration tests executed: $COUNT"

      - name: Generate flake report
        if: always()
        run: |
          REPORT_DIR=test/integration/.test-output
          if [ -f "$REPORT_DIR/test-output.json" ]; then
            cd test/integration && GOWORK=off go run ./tools/flaketrack report \
              --json "$(pwd)/.test-output/test-output.json" \
              --rerun-report "$(pwd)/.test-output/rerun-report.txt" \
              --quarantine "$(pwd)/quarantine.json" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test/integration/.test-output/
          retention-days: 30

      - name: Upload trace bundles
        if: failure() && hashFiles('test/integration/.test-output/traces/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: integration-trace-bundles
          path: test/integration/.test-output/traces/
          retention-days: 30

      - name: Publish test report
        if: always() && hashFiles('test/integration/.test-output/junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Integration Test Report
          path: test/integration/.test-output/junit.xml
          reporter: java-junit
