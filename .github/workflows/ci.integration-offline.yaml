# =============================================================================
# Integration Tests (Offline)
# =============================================================================
# Runs ALL offline integration test suites against the Stigmer Cloud Java
# service. "Offline" means no LLM provider API keys are needed.
#
# Suites:
#   1. integration          — core platform (agents, workflows, auth, FGA, SDK)
#   2. integration-security — production JWT auth chain, federated IdP
#   3. integration-session-routing  — per-session Temporal task queue routing
#   4. integration-wfexec-routing   — per-execution workflow activity routing
#   5. integration-offline  — deterministic tests with recorded LLM responses
#
# Architecture:
#   Job 1 (build-service-jar) — checks out stigmer-cloud, builds the fat JAR
#   Job 2 (integration-tests) — a matrix that fans the suites above out into
#                               one parallel job each, all reusing Job 1's JAR
#
# Job 1 is intentionally isolated so it can be replaced with a pre-built
# artifact download when stigmer-cloud publishes standalone JAR releases.
#
# Cross-repo coupling contract: Job 1 builds stigmer-cloud@main at run time,
# so a breaking change spanning both repos must merge its stigmer-cloud PR
# FIRST and its OSS PR second (remove-side merges last). Merging OSS first
# opens a window where every suite fails at service boot — the Datastore
# removal hit exactly this (oss#553 at 21:38 UTC vs cloud#395 at 21:48 UTC;
# run 31643768168). The red heals with a full re-run once cloud main lands.
# Job 2 runs the suites concurrently rather than sequentially: each suite owns
# its infrastructure, so wall-clock time is the slowest suite, not their sum.
# =============================================================================

name: ci.integration-offline

on:
  pull_request:
    paths:
      - "backend/**"
      - "test/integration/**"
      - "test/integration-offline/**"
      - "test/integration-security/**"
      - "test/integration-session-routing/**"
      - "test/integration-wfexec-routing/**"
      - "apis/**"
      - "go.work"
      - "go.work.sum"
      - "Makefile"
      - ".github/workflows/ci.integration-offline.yaml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "test/integration/**"
      - "test/integration-offline/**"
      - "test/integration-security/**"
      - "test/integration-session-routing/**"
      - "test/integration-wfexec-routing/**"
      - "apis/**"
      - "go.work"
      - "go.work.sum"
      - "Makefile"
      - ".github/workflows/ci.integration-offline.yaml"
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      cloud_ref:
        description: "stigmer-cloud git ref to build the service JAR from"
        required: false
        type: string
        default: "main"

concurrency:
  group: integration-${{ github.head_ref || github.ref }}
  # PR pushes cancel superseded runs; main pushes queue instead, so every
  # merge gets a completed, attributable run (stigmer/stigmer#725).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  checks: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build the Stigmer Cloud Java service fat JAR from source.
  #
  # Uses Bazel with the repo's own .bazelrc. BuildBuddy is opt-in there
  # (stigmer-cloud#405 / DD-020: no committed key, --config=bb), and this job
  # deliberately does not opt in, so the build is fully offline. The
  # setup-bazel action's disk and repository caches keep subsequent runs warm.
  # ---------------------------------------------------------------------------
  build-service-jar:
    name: Build Service JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stigmer-cloud
        uses: actions/checkout@v4
        with:
          repository: stigmer/stigmer-cloud
          ref: ${{ inputs.cloud_ref || 'main' }}
          path: stigmer-cloud
          token: ${{ secrets.STIGMER_CLOUD_TOKEN }}

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: integration-jar
          repository-cache: true

      - name: Build fat JAR
        working-directory: stigmer-cloud
        run: ./bazelw build //backend/services/stigmer-service:stigmer_service_fatjar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: stigmer-service-jar
          path: stigmer-cloud/bazel-bin/backend/services/stigmer-service/stigmer_service_fatjar.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload FGA model
        uses: actions/upload-artifact@v4
        with:
          name: fga-model
          path: stigmer-cloud/backend/services/stigmer-service/src/main/resources/fga/model/
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: Run the offline integration test suites — one parallel job per suite.
  #
  # Each suite is fully self-contained: it spins up its own infrastructure
  # (Testcontainers Postgres 16 + Redis 7, a Java service with a suite-specific
  # configuration, and where needed the unified Node runner), runs, and tears
  # everything down. Nothing is shared between suites at runtime, so they fan
  # out across a matrix of independent runners instead of running back-to-back
  # as sequential steps on a single runner.
  #
  # This trades a little extra setup work (each job re-downloads the JAR and
  # reinstalls toolchains) for a large wall-clock win: total time drops from the
  # sum of all suites to roughly the slowest single suite plus per-job setup.
  #
  # Per-suite tuning lives in each suite's Makefile (e.g. Go's `-parallel`),
  # which already governs in-suite concurrency; this matrix adds cross-suite
  # concurrency on top.
  #
  # `fail-fast: false` keeps every suite running even if one fails, so a single
  # red suite still yields full signal across the others.
  #
  # Outputs (per suite): JUnit XML, JSON event log, service logs.
  # ---------------------------------------------------------------------------
  integration-tests:
    name: "Integration Tests (${{ matrix.label }})"
    runs-on: ubuntu-latest
    needs: build-service-jar
    # Pull harness images from the GHCR mirror instead of Docker Hub —
    # anonymous Hub pulls made harness boot a recurring flake (issue #334).
    # testcontainers-go rewrites every bare-Hub reference, Ryuk included;
    # see test/integration/harness/images.go for the mirrored list.
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/stigmer/mirror
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: integration
            label: Core
            make: test-integration
            output: test/integration/.test-output
            artifact: integration-test-results
            report: Integration Test Report
          - suite: security
            label: Security
            make: test-integration-security
            output: test/integration-security/.test-output-security
            artifact: security-test-results
            report: Security Test Report
          - suite: session-routing
            label: Session Routing
            make: test-integration-session-routing
            output: test/integration-session-routing/.test-output-session-routing
            artifact: session-routing-test-results
            report: Session Routing Test Report
          - suite: wfexec-routing
            label: WfExec Routing
            make: test-integration-wfexec-routing
            output: test/integration-wfexec-routing/.test-output-wfexec-routing
            artifact: wfexec-routing-test-results
            report: WfExec Routing Test Report
          - suite: offline
            label: Deterministic Offline
            make: test-integration-offline
            output: test/integration-offline/.test-output-offline
            artifact: deterministic-offline-test-results
            report: Deterministic Offline Test Report
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download service JAR
        uses: actions/download-artifact@v4
        with:
          name: stigmer-service-jar
          path: .artifacts

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      # The runner links workspace libs by file: and imports their built dists.
      - name: Build runner-linked workspace libs
        run: npm run build:runner-deps

      - name: Install and build unified runner
        working-directory: backend/services/runner
        run: npm ci && npm run build

      - name: Install Temporal CLI
        uses: temporalio/setup-temporal@v0

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Install OpenFGA CLI
        # Pinned like gotestsum above: @latest re-resolves (and re-verifies
        # against sum.golang.org) on every run — a pure flake surface and
        # drift risk (stigmer#886).
        run: |
          go install github.com/openfga/cli/cmd/fga@v0.7.20
          fga version

      - name: Download FGA model
        uses: actions/download-artifact@v4
        with:
          name: fga-model
          path: .artifacts/fga-model

      # ── Run the suite for this matrix leg ────────────────────────────────

      - name: "Run ${{ matrix.label }} suite"
        env:
          STIGMER_SERVICE_JAR: ${{ github.workspace }}/.artifacts/stigmer_service_fatjar.jar
          STIGMER_FGA_MODEL_DIR: ${{ github.workspace }}/.artifacts/fga-model
          # The core suite emits OTel traces so failures upload trace bundles.
          INTEGRATION_TEST_OTEL: ${{ matrix.suite == 'integration' && 'true' || '' }}
        run: make ${{ matrix.make }}

      # ── Core-suite-only guards / reports ─────────────────────────────────

      - name: Guard against silent test skip
        if: success() && matrix.suite == 'integration'
        run: |
          JUNIT="${{ matrix.output }}/junit.xml"
          if [ ! -f "$JUNIT" ]; then
            echo "::error::JUnit XML not found at $JUNIT"
            exit 1
          fi
          COUNT=$(grep -o 'tests="[0-9]*"' "$JUNIT" | head -1 | grep -o '[0-9]*')
          if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
            echo "::error::JUnit reports 0 tests — integration suite was silently skipped"
            exit 1
          fi
          echo "Integration tests executed: $COUNT"

      - name: Generate flake report
        if: always() && matrix.suite == 'integration'
        run: |
          REPORT_DIR=test/integration/.test-output
          if [ -f "$REPORT_DIR/test-output.json" ]; then
            cd test/integration/tools/flaketrack && GOWORK=off go run . report \
              --json "$(pwd)/../../.test-output/test-output.json" \
              --rerun-report "$(pwd)/../../.test-output/rerun-report.txt" \
              --quarantine "$(pwd)/../../quarantine.json" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Artifacts & report ───────────────────────────────────────────────

      # include-hidden-files: the suite output dirs are dot-named
      # (.test-output-*), and upload-artifact@v4 excludes hidden paths by
      # default — without the flag this step silently uploads nothing
      # (if-no-files-found: ignore), which left oss#541's only red run with
      # no service log to diagnose from. Canary hit the same class in #323;
      # this sweep propagates its fix to every sibling lane.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}/
          retention-days: 30
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload trace bundles
        if: failure() && matrix.suite == 'integration' && hashFiles('test/integration/.test-output/traces/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: integration-trace-bundles
          path: test/integration/.test-output/traces/
          retention-days: 30
          include-hidden-files: true

      - name: Publish test report
        if: always() && hashFiles(format('{0}/junit.xml', matrix.output)) != ''
        uses: dorny/test-reporter@v3
        with:
          name: ${{ matrix.report }}
          path: ${{ matrix.output }}/junit.xml
          reporter: java-junit

  # PR and push failures are attended surfaces; the weekly cron is not (#477).
  # failure() is true if any matrix leg failed. Shared file-or-comment
  # mechanics live in notify-failure.yaml.
  notify-failure:
    name: File Offline-Suite Failure Issue
    needs: [build-service-jar, integration-tests]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      label: ci-integration-offline-failure
      title: "ci.integration-offline: weekly offline integration run is failing"
      body-context: >-
        The weekly cron runs all five offline suites against stigmer-cloud@main.
        PR and push runs of this lane are attended, so this issue tracks cron
        failures only — often cloud-side drift landing between OSS merges (see
        the cross-repo coupling contract in the workflow header).
