# =============================================================================
# TypeScript Server — Vitest Suite + Artifact Boot Gates
# =============================================================================
# Runs the standalone TypeScript server's (`@stigmer/server`,
# backend/services/stigmer-server) full gate: typecheck, vitest suite,
# and plain-`node` boot checks of BOTH compiled artifacts (tsc dist and the
# esbuild slim bundle).
#
# The service began as the parity-gated TS port of the retired Go server
# (go-server-retirement, D4 #25) — see the directory's README.md. Like the
# runner, it is NOT part of the root npm workspaces: own package-lock.json,
# file:-linked @stigmer/protos, installed and built separately (this mirrors
# ci.runner.yaml, the per-service CI pattern).
#
# The boot checks exist for the #399 failure class: vitest/tsx module
# interop tolerates ESM/CJS import shapes that Node's real loader rejects,
# so an import-time crash in `node dist/main.js` can pass every other gate.
# scripts/verify-boot.mjs runs the full lifecycle (bind → listening →
# SIGTERM → exit 0) the way the CLI daemon will.
#
# Path filter mirrors ci.runner.yaml's: the service's own tree, the proto
# stubs it links, the Makefile (test-server lives there), and this file.
# =============================================================================

name: ci.stigmer-server

# client-apps/web/nginx.conf rides the filter because it is a CONTRACT
# input here since the console lane landed: the server's nginx-equivalence
# test (src/transport/console/__tests__/) holds the lane's resolver to the
# parsed nginx model, so a serving-rule change must run this gate in its
# own PR, not redden main later. Route-tree changes need no filter entry —
# the resolver implements the model generically, and unmodelled router
# constructs already fail verify-web in the web PR itself.
on:
  pull_request:
    paths:
      - "backend/services/stigmer-server/**"
      - "apis/stubs/ts/**"
      - "client-apps/web/nginx.conf"
      - "scripts/verify-static-export-routes.mjs"
      - "test/extension-consumer/**"
      - "Makefile"
      - ".github/workflows/ci.stigmer-server.yaml"
  push:
    branches: [main]
    paths:
      - "backend/services/stigmer-server/**"
      - "apis/stubs/ts/**"
      - "client-apps/web/nginx.conf"
      - "scripts/verify-static-export-routes.mjs"
      - "test/extension-consumer/**"
      - "Makefile"
      - ".github/workflows/ci.stigmer-server.yaml"

concurrency:
  group: stigmer-server-${{ github.head_ref || github.ref }}
  # PR pushes cancel superseded runs; main pushes queue instead, so every
  # merge gets a completed, attributable run (stigmer/stigmer#725).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  server:
    name: Server Gate
    runs-on: ubuntu-latest
    # The Postgres driver's unit/contract tests are gated on
    # TEST_DATABASE_URL (visible skips without it) — this container makes
    # CI the place they ALWAYS run for real (Phase-2 P2; the pinned major
    # is the one the compose stack ships, DD-011/DD-013).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      # The server file:-links @stigmer/protos AND @stigmer/temporal-codecs
      # (the decode-only payload codec wraps the lib since D4 #18) and
      # imports their built dists — build:runner-deps builds exactly both.
      - name: Build the proto stubs and temporal-codecs
        run: npm run build:runner-deps

      # Standalone package with its own lockfile (mirrors ci.runner.yaml).
      - name: Install server dependencies
        working-directory: backend/services/stigmer-server
        run: npm ci

      # The slim artifact ships the console's static export (DD-012);
      # bundle-slim loud-fails without a built client-apps/web/out.
      - name: Build the web console static export
        run: make build-web

      - name: Typecheck
        working-directory: backend/services/stigmer-server
        run: npm run typecheck

      - name: Build and boot-check the compiled dist
        working-directory: backend/services/stigmer-server
        run: npm run build && npm run verify:dist

      # The exports-map compile proof (DD-005, sub-project 20260826.09/O1):
      # a standalone consumer typechecks a fake extension against the
      # @stigmer/server library contract ALONE — a missing export fails
      # here, at PR time, instead of at the cloud composition's pin bump.
      # Runs after the dist build above because the exports map points into
      # dist. Standalone install, the same per-service pattern as the
      # server itself.
      - name: Compile-proof the exports map (test/extension-consumer)
        working-directory: test/extension-consumer
        run: npm ci --no-audit --no-fund && npm run typecheck

      - name: Bundle and boot-check the slim artifact
        working-directory: backend/services/stigmer-server
        run: node scripts/bundle-slim.mjs && npm run verify:slim

      # D-5: `pg` lazy-requires optional pg-native; the slim bundle marks
      # it external so the JS client is used. This is the first boot of
      # that artifact against a real Postgres — a packaging break must
      # not silently defer to the Docker-image sub-project (P4).
      - name: Boot-check the slim artifact against Postgres
        working-directory: backend/services/stigmer-server
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run verify:slim

      # The deep slim gate at PR time (D4 #24 panel finding): verify:slim
      # boots WITHOUT Temporal, so the slim-only machinery — prebuilt
      # workflow-bundle discovery, the threaded-vm patch, per-platform
      # core-bridge dispatch — never executes there. A drifted bundle would
      # otherwise merge green and wedge the release train at publish time
      # (the workers fail SOFT: manager.ts retries instead of crashing).
      # This runs the isolated-copy + real-Temporal check the release lane
      # gates publishing on.
      - name: Set up Temporal CLI
        uses: temporalio/setup-temporal@v0

      - name: Deep-verify the slim artifact (isolated copy + Temporal workers)
        working-directory: backend/services/stigmer-server
        run: |
          temporal server start-dev --headless --log-level error &
          TEMPORAL_PID=$!
          trap "kill $TEMPORAL_PID" EXIT
          for i in $(seq 1 30); do
            temporal operator cluster health >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/verify-slim-artifact.mjs

      # The Docker image smoke (DD-014, Phase-2 P4): the SAME dist-slim the
      # deep verify just proved, packaged by the service's Dockerfile and
      # proven as a container — HEALTHCHECK reaches healthy, Connect-JSON
      # health answers SERVING, the console lane serves, a CRUD round-trip
      # lands, state survives a restart, SIGTERM exits clean. Native amd64;
      # the arm64 twin runs in the boot-smoke job below. This is what makes
      # the image PR-testable at all — the release lane consumes the same
      # Dockerfile and the same smoke script.
      - name: Boot-smoke the Docker image (sqlite + volume)
        working-directory: backend/services/stigmer-server
        run: node scripts/smoke-docker-image.mjs

      # The image against Postgres: without this, the first time the
      # image ever met Postgres would be the compose gate (P5). Reuses the
      # image the sqlite smoke just built and this job's service container,
      # reached from the sibling container via the host gateway.
      - name: Boot-smoke the Docker image (Postgres)
        working-directory: backend/services/stigmer-server
        run: |
          node scripts/smoke-docker-image.mjs \
            --image=stigmer-server:smoke-local \
            --database-url=postgres://postgres:postgres@host.docker.internal:5432/postgres

      - name: Run the vitest suite
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: make test-server

  # linux-arm64 boot smoke (owner ruling at go-server-retirement, D4 #25):
  # when the Go server retired, arm64 Linux lost its only fallback, so this
  # server must be PROVEN to boot there — not assumed from x64 green. The
  # platform-sensitive surface is exactly what the deep slim verify
  # exercises: node:sqlite with FTS5, the per-platform Temporal core-bridge
  # (the one native component, selected by npm optionalDependencies), and
  # the worker boot path. Native arm64 runner — no QEMU, no emulation
  # blind spots. The full vitest suite stays on the x64 job; this job is
  # the platform proof, kept boot-scoped so per-PR cost stays sane.
  # Windows remains deferred and platform claims stay quiet (#24 ruling).
  server-linux-arm64:
    name: Server Boot Smoke (linux-arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      - name: Build the proto stubs and temporal-codecs
        run: npm run build:runner-deps

      - name: Install server dependencies
        working-directory: backend/services/stigmer-server
        run: npm ci

      # Same DD-012 requirement as the x64 job: the slim bundle stages the
      # console export and loud-fails without it.
      - name: Build the web console static export
        run: make build-web

      - name: Build and boot-check the compiled dist
        working-directory: backend/services/stigmer-server
        run: npm run build && npm run verify:dist

      - name: Bundle and boot-check the slim artifact
        working-directory: backend/services/stigmer-server
        run: node scripts/bundle-slim.mjs && npm run verify:slim

      - name: Set up Temporal CLI
        uses: temporalio/setup-temporal@v0

      - name: Deep-verify the slim artifact (isolated copy + Temporal workers)
        working-directory: backend/services/stigmer-server
        run: |
          temporal server start-dev --headless --log-level error &
          TEMPORAL_PID=$!
          trap "kill $TEMPORAL_PID" EXIT
          for i in $(seq 1 30); do
            temporal operator cluster health >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/verify-slim-artifact.mjs

      # The arm64 half of the Docker image's both-arch acceptance (DD-014,
      # Phase-2 P4): the tree bundled above IS linux-arm64 on this native
      # runner, so the container smoke here is the exact platform proof —
      # no QEMU, no emulation blind spots (this job's founding posture).
      - name: Boot-smoke the Docker image (sqlite + volume, native arm64)
        working-directory: backend/services/stigmer-server
        run: node scripts/smoke-docker-image.mjs
