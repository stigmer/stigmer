name: release.mcp-server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0) - used as the image tag for manual builds'
        required: false
        type: string

permissions:
  contents: read

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            echo "Triggered by tag: $VERSION"
          elif [ -n "${GITHUB_EVENT_INPUTS_VERSION}" ]; then
            VERSION="v${GITHUB_EVENT_INPUTS_VERSION}"
          else
            VERSION="test-$(git rev-parse --short HEAD)"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building mcp-server-stigmer image version: $VERSION"
        env:
          GITHUB_EVENT_INPUTS_VERSION: ${{ github.event.inputs.version }}

  # The MCP server ships only as a Docker image. The image installs the
  # published @stigmer/mcp-server npm package (published by release.npm-libs),
  # so it runs byte-for-byte what `npx @stigmer/mcp-server` runs. This build
  # therefore waits for the npm package to appear before building.
  build-docker-image:
    needs: determine-version
    runs-on: ubuntu-latest
    # Pushes the image to ghcr.io.
    permissions:
      contents: read
      packages: write
    # A healthy build finishes in ~5 minutes. Cap the job so a stalled buildx /
    # QEMU / cache-export step fails fast instead of hanging near the default
    # 6-hour limit (see the ~1h hang on the v3.1.11 release).
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # No restored npm cache in a release (v5+ caches by default).
          package-manager-cache: false
          node-version: '20'

      - name: Wait for @stigmer/mcp-server on npm
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          # Strip the leading 'v' for the npm version (tag v1.2.3 -> npm 1.2.3).
          NPM_VERSION="${VERSION#v}"
          echo "Waiting for @stigmer/mcp-server@$NPM_VERSION on npm..."
          for i in $(seq 1 60); do
            if npm view "@stigmer/mcp-server@$NPM_VERSION" version 2>/dev/null; then
              echo "Found @stigmer/mcp-server@$NPM_VERSION on npm"
              exit 0
            fi
            echo "Attempt $i/60: not yet available, waiting 10s..."
            sleep 10
          done
          echo "ERROR: @stigmer/mcp-server@$NPM_VERSION not found on npm after 10 minutes"
          echo "The Docker image installs this package. Check the release.npm-libs workflow."
          exit 1

      # Register QEMU binfmt handlers so the emulated linux/arm64 leg builds
      # reliably on the amd64 runner (do not rely on preinstalled binfmt).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache: the image is a single `npm install --global` layer that
      # builds in well under a minute per platform, so the GitHub Actions cache
      # (type=gha) buys nothing. Worse, `cache-to type=gha,mode=max` has hung the
      # export for up to an hour (see the v3.1.11 release), so we omit it entirely.
      - name: Build and push Docker image
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          NPM_VERSION="${VERSION#v}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file mcp-server/Dockerfile \
            --build-arg NODE_IMAGE=node:22-alpine \
            --build-arg MCP_SERVER_VERSION=$NPM_VERSION \
            --tag ghcr.io/stigmer/mcp-server-stigmer:$VERSION \
            --tag ghcr.io/stigmer/mcp-server-stigmer:latest \
            --push \
            .

          echo "Docker image built and pushed:"
          echo "  - ghcr.io/stigmer/mcp-server-stigmer:$VERSION"
          echo "  - ghcr.io/stigmer/mcp-server-stigmer:latest"
