name: release.sandbox-cloud

# Builds the cloud sandbox image (unified TypeScript runner) used by
# Daytona in cloud mode.
#
# Triggers:
#   - push to main: rebuild when runner code, proto stubs, or Dockerfile
#     change (path gate evaluated in the detect-changes job, not via the
#     event-level `paths:` filter — that filter is unreliable on very large
#     pushes/merges and silently skipped the v2.0.0 merge).
#   - push of a v* tag: always rebuild so every release ships a matching
#     cloud sandbox image.
#   - workflow_dispatch: manual rebuild/redeploy.
#
# Image is tagged with latest + commit SHA (no semver tags).
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Reliable change detection. Event-level `paths:` filtering is skipped by
  # GitHub on oversized pushes (the v2.0.0 merge changed 1,348 files / ~347K
  # lines and never triggered this workflow). dorny/paths-filter queries the
  # API for the real changed-file set, so it works regardless of push size.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect runner-relevant changes
        id: filter
        # Only meaningful for main-branch pushes; tag pushes and manual
        # dispatch always build (handled in the decision step below).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            runner:
              - 'backend/services/runner/src/**'
              - 'backend/services/runner/package.json'
              - 'backend/services/runner/package-lock.json'
              - 'backend/services/runner/tsconfig*.json'
              - 'backend/services/runner/Dockerfile.sandbox'
              - 'apis/stubs/ts/**'

      - name: Decide whether to build
        id: decide
        run: |
          # Always build on tag pushes (releases) and manual dispatch.
          # On main pushes, build only when runner-relevant paths changed.
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.runner }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Build decision: $(cat "$GITHUB_OUTPUT" | grep should_build)"

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Building: latest + main-$SHORT_SHA"

      - name: Build and push sandbox image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file backend/services/runner/Dockerfile.sandbox \
            --tag ghcr.io/${{ github.repository_owner }}/runner:latest \
            --tag ghcr.io/${{ github.repository_owner }}/runner:main-${{ steps.tags.outputs.short_sha }} \
            --push \
            .

      - name: Ensure GHCR package is public
        continue-on-error: true
        run: |
          gh api \
            -X PUT \
            /orgs/${{ github.repository_owner }}/packages/container/runner/visibility \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Planton CLI
        env:
          PLANTON_CLI_VERSION: v0.0.25-cli.20260426.1
          PLANTON_API_KEY: ${{ secrets.PLANTON_API_KEY }}
        run: |
          curl -fsSLo /usr/local/bin/planton \
            "https://downloads.planton.ai/cli/${PLANTON_CLI_VERSION}/planton-${PLANTON_CLI_VERSION}-linux-amd64"
          chmod +x /usr/local/bin/planton
          planton --version
          planton context set --org stigmer

      - name: Update Planton sandbox image variable
        env:
          PLANTON_API_KEY: ${{ secrets.PLANTON_API_KEY }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/runner:main-${{ steps.tags.outputs.short_sha }}"
          # config-manager standalone env-scoped Variable (slug: sandbox-ci-sandbox-image, env: prod).
          # Resolved at deploy as $var/@prod/sandbox-ci-sandbox-image.
          planton variable set sandbox-ci-sandbox-image --env prod "${IMAGE}"

      - name: Redeploy stigmer-service to pick up new image variable
        env:
          PLANTON_API_KEY: ${{ secrets.PLANTON_API_KEY }}
        run: planton service run-pipeline --service stigmer-service --branch main

      - name: Warm Daytona image cache
        continue-on-error: true
        timeout-minutes: 5
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/runner:main-${{ steps.tags.outputs.short_sha }}
        run: |
          pip install daytona-sdk
          python - <<'PYEOF'
          import os, time
          from daytona_sdk import Daytona, DaytonaConfig, CreateSandboxFromImageParams

          d = Daytona(DaytonaConfig(api_key=os.environ["DAYTONA_API_KEY"]))

          print(f"Creating sandbox from {os.environ['IMAGE']} to warm cache …")
          t0 = time.monotonic()
          sandbox = d.create(CreateSandboxFromImageParams(image=os.environ["IMAGE"]))
          elapsed = time.monotonic() - t0
          print(f"Sandbox {sandbox.id} ready in {elapsed:.1f}s — image layers cached")

          d.delete(sandbox)
          print("Sandbox deleted — cache-warming complete")
          PYEOF

      - name: Summary
        run: |
          echo "## Cloud Sandbox Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ github.repository_owner }}/runner\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`latest\`, \`main-${{ steps.tags.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "**Planton variable:** updated \`sandbox-ci-sandbox-image\` (env prod)" >> $GITHUB_STEP_SUMMARY
          echo "**Daytona cache warm:** attempted with SHA tag (continue-on-error)" >> $GITHUB_STEP_SUMMARY
