name: release.sandbox-cloud

# Builds and publishes the cloud sandbox runner image, ghcr.io/stigmer/runner,
# the image the hosted edition launches its sandboxes from.
#
# This pipeline is a pure artifact publisher: build -> push (latest + main-<sha>)
# -> smoke-test -> on a release tag that passed, promote. The tag policy is the
# self-host runner's (ghcr.io/stigmer/stigmer-runner in release.npm-libs.yaml):
#   - latest, main-<sha>: every build, before the smoke (development and the
#     OSS drivers follow latest).
#   - v<X.Y.Z>: a v* tag's build, pushed only after the smoke passes, so a
#     version tag existing means that release's runner booted. A deployment
#     that runs a server release names the runner of the same release by it.
#   - prod: the latest smoke-tested release. Moved only on a release tag,
#     never on a main push, a prerelease tag, or a rebuild dispatched from
#     main, so nothing unreleased reaches a deployment that follows it.
# The version tag is added after the smoke, not before as the self-host lane
# does: that lane smokes the pushed version tag itself, while this one smokes
# the pushed main-<sha> bytes the version tag then names.
#
# Triggers:
#   - push to main: rebuild when runner code, proto stubs, or Dockerfile
#     change (path gate evaluated in the detect-changes job, not via the
#     event-level `paths:` filter — that filter is unreliable on very large
#     pushes/merges and silently skipped the v2.0.0 merge).
#   - push of a v* tag: always rebuild so every release ships a matching
#     cloud sandbox image.
#   - workflow_dispatch: manual rebuild; dispatched from a v* tag it
#     re-publishes that release's version tag (and prod, for a release).
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Reliable change detection. Event-level `paths:` filtering is skipped by
  # GitHub on oversized pushes (the v2.0.0 merge changed 1,348 files / ~347K
  # lines and never triggered this workflow). dorny/paths-filter queries the
  # API for the real changed-file set, so it works regardless of push size.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect runner-relevant changes
        id: filter
        # Only meaningful for main-branch pushes; tag pushes and manual
        # dispatch always build (handled in the decision step below).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            runner:
              - 'backend/services/runner/src/**'
              - 'backend/services/runner/package.json'
              - 'backend/services/runner/package-lock.json'
              - 'backend/services/runner/tsconfig*.json'
              - 'backend/services/runner/Dockerfile.sandbox'
              - 'apis/stubs/ts/**'
              - 'backend/libs/ts/**'

      - name: Decide whether to build
        id: decide
        run: |
          # Always build on tag pushes (releases) and manual dispatch.
          # On main pushes, build only when runner-relevant paths changed.
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.runner }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Build decision: $(cat "$GITHUB_OUTPUT" | grep should_build)"

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          # A v* tag's build (pushed or dispatched from the tag) publishes
          # its version tag after the smoke; only a release, not a
          # prerelease (v1.2.3-rc.1), also moves prod.
          VERSION_TAG=""
          MOVES_PROD="false"
          if [ "$REF_TYPE" = "tag" ] && [[ "$REF_NAME" == v* ]]; then
            VERSION_TAG="$REF_NAME"
            if [[ "$REF_NAME" != *-* ]]; then
              MOVES_PROD="true"
            fi
          fi
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "moves_prod=$MOVES_PROD" >> "$GITHUB_OUTPUT"
          echo "Building: latest + main-$SHORT_SHA; after the smoke: version tag '${VERSION_TAG:-none}', moves prod: $MOVES_PROD"

      # --target sandbox: the Dockerfile's final stage is the self-host
      # compose runner (sandbox + stigmer CLI, published separately as
      # ghcr.io/stigmer/stigmer-runner by release.npm-libs.yaml); this lane
      # ships the CLOUD sandbox stage, byte-identical to before the stage
      # split. amd64 stays this lane's platform — the cloud fleet is amd64;
      # the multi-arch proof lives on the compose-runner lane.
      # The layer cache is what lets an unchanged step produce the SAME layer
      # bytes build after build, so a node holding the last image pulls only
      # what changed (stigmer/stigmer#1244; the Dockerfile cuts its layers
      # by what changes them). A registry cache in its own package, not
      # type=gha, whose export has hung releases for up to an hour
      # (release.mcp-server, v3.1.11); a failed cache export is ignored, so
      # the cache can slow a release down but never fail one.
      - name: Build and push sandbox image
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/runner-buildcache:sandbox-amd64
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target sandbox \
            --cache-from "type=registry,ref=$CACHE_REF" \
            --cache-to "type=registry,ref=$CACHE_REF,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
            --file backend/services/runner/Dockerfile.sandbox \
            --tag ghcr.io/${{ github.repository_owner }}/runner:latest \
            --tag ghcr.io/${{ github.repository_owner }}/runner:main-${{ steps.tags.outputs.short_sha }} \
            --push \
            .

      # Package visibility is an org-settings fact, not a step (GHCR has no
      # REST endpoint for it; the PUT this job carried answered 404 on
      # every run, masked into an error annotation). `runner` is public.

      - name: Smoke-test runner image
        # Gate before promotion. Boot a sandbox from the freshly built SHA image:
        # if the image is broken/unpullable or the runner crashes on boot (the
        # 2026-04 stale-image failure mode), creation fails and neither the
        # version tag nor :prod is written.
        # The smoke runs on Daytona (that is where CI has credentials); it validates
        # "the runner boots", not k8s-specific concerns (PVC/gVisor). A deeper
        # worker-level assertion is a future enhancement (see design-decision 003).
        timeout-minutes: 8
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/runner:main-${{ steps.tags.outputs.short_sha }}
        run: |
          pip install daytona-sdk
          python - <<'PYEOF'
          import os, time
          from daytona_sdk import Daytona, DaytonaConfig, CreateSandboxFromImageParams

          d = Daytona(DaytonaConfig(api_key=os.environ["DAYTONA_API_KEY"]))
          image = os.environ["IMAGE"]

          print(f"Smoke-testing {image} …")
          t0 = time.monotonic()
          sandbox = d.create(CreateSandboxFromImageParams(image=image))
          print(f"Sandbox {sandbox.id} booted in {time.monotonic() - t0:.1f}s")

          d.delete(sandbox)
          print("Smoke test passed — sandbox booted from the image and was cleaned up")
          PYEOF

      - name: Promote the tested release image
        # Only a smoke-tested build of a v* tag gets here: the version tag
        # names that release's runner, and prod moves for a release only.
        if: steps.tags.outputs.version_tag != ''
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/runner
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
          MOVES_PROD: ${{ steps.tags.outputs.moves_prod }}
        run: |
          TAGS=(--tag "$IMAGE:$VERSION_TAG")
          if [ "$MOVES_PROD" = "true" ]; then
            TAGS+=(--tag "$IMAGE:prod")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$IMAGE:main-$SHORT_SHA"

      - name: Summary
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/runner
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
          MOVES_PROD: ${{ steps.tags.outputs.moves_prod }}
        run: |
          {
            echo "## Cloud Sandbox Image Published"
            echo ""
            echo "**Image:** \`$IMAGE\`"
            echo "**Tags:** \`latest\`, \`main-$SHORT_SHA\`${VERSION_TAG:+, \`$VERSION_TAG\` (after the smoke)}"
            echo "**Architecture:** linux/amd64"
            if [ "$MOVES_PROD" = "true" ]; then
              echo "**prod:** moved to \`$VERSION_TAG\`, the latest smoke-tested release"
            else
              echo "**prod:** unchanged (moves on a release tag only)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
