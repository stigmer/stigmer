name: release.sandbox-cloud

# Builds the full (cloud) sandbox image used by Daytona in cloud mode.
# Triggers on main when Dockerfile.sandbox.full changes — no semver tags needed.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/services/agent-runner/sandbox/Dockerfile.sandbox.full'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Building: latest + main-$SHORT_SHA"

      - name: Build and push full sandbox image
        run: |
          cd backend/services/agent-runner/sandbox
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.sandbox.full \
            --tag ghcr.io/${{ github.repository_owner }}/agent-sandbox-full:latest \
            --tag ghcr.io/${{ github.repository_owner }}/agent-sandbox-full:main-${{ steps.tags.outputs.short_sha }} \
            --push \
            .

      - name: Ensure GHCR package is public
        run: |
          gh api \
            -X PUT \
            /orgs/${{ github.repository_owner }}/packages/container/agent-sandbox-full/visibility \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Cloud Sandbox Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ github.repository_owner }}/agent-sandbox-full\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`latest\`, \`main-${{ steps.tags.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** linux/amd64" >> $GITHUB_STEP_SUMMARY
