name: release.sandbox-cloud

# Builds and publishes the cloud sandbox runner image, ghcr.io/stigmer/runner,
# the image the hosted edition launches its sandboxes from.
#
# This pipeline is a pure artifact publisher: build -> push (main-<sha>) ->
# smoke-test -> promote what passed. The tags:
#   - main-<sha>: every build, before the smoke; the bytes the smoke tests.
#   - latest: every build that passed the smoke (development, and an OSS
#     server with no release of its own, follow latest).
#   - v<X.Y.Z>: a v* tag's build that passed the smoke, so a version tag
#     existing means that release's runner booted. A server release launches
#     the runner of the same release by it (the OSS default and the cloud).
#   - prod: the latest smoke-tested release. Moved only on a release tag,
#     never on a main push, a prerelease tag, or a rebuild dispatched from
#     main, so nothing unreleased reaches a deployment that follows it.
# Every tag but main-<sha> is added after the smoke, not before as the
# self-host lane does: that lane smokes the pushed version tag itself, while
# this one smokes the pushed main-<sha> bytes the other tags then name.
# A dispatch runs the workflow of the ref it is dispatched from: from a tag
# whose workflow predates the in-image smoke below, that workflow pushes
# latest at build time, which would move latest back to an image without
# /runner/bin/node, the launch path every newer server uses. Re-publish
# such a release by its version tag only, never by dispatching its build.
#
# Triggers:
#   - push to main: rebuild when runner code, proto stubs, or Dockerfile
#     change (path gate evaluated in the detect-changes job, not via the
#     event-level `paths:` filter — that filter is unreliable on very large
#     pushes/merges and silently skipped the v2.0.0 merge).
#   - push of a v* tag: always rebuild so every release ships a matching
#     cloud sandbox image.
#   - workflow_dispatch: manual rebuild; dispatched from a v* tag it
#     re-publishes that release's version tag (and prod, for a release).
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reliable change detection. Event-level `paths:` filtering is skipped by
  # GitHub on oversized pushes (the v2.0.0 merge changed 1,348 files / ~347K
  # lines and never triggered this workflow). dorny/paths-filter queries the
  # API for the real changed-file set, so it works regardless of push size.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Detect runner-relevant changes
        id: filter
        # Only meaningful for main-branch pushes; tag pushes and manual
        # dispatch always build (handled in the decision step below).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            runner:
              - 'backend/services/runner/src/**'
              - 'backend/services/runner/package.json'
              - 'backend/services/runner/package-lock.json'
              - 'backend/services/runner/tsconfig*.json'
              - 'backend/services/runner/Dockerfile.sandbox'
              # The image's runner is the slim artifact these scripts build
              # (bundle-slim.mjs and what it imports and aliases).
              - 'backend/services/runner/scripts/**'
              - 'scripts/lib/source-map-pragma.mjs'
              - 'apis/stubs/ts/**'
              - 'backend/libs/ts/**'

      - name: Decide whether to build
        id: decide
        run: |
          # Always build on tag pushes (releases) and manual dispatch.
          # On main pushes, build only when runner-relevant paths changed.
          if [ "${{ github.event_name }}" != "push" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${STEPS_FILTER_OUTPUTS_RUNNER}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Build decision: $(cat "$GITHUB_OUTPUT" | grep should_build)"
        env:
          STEPS_FILTER_OUTPUTS_RUNNER: ${{ steps.filter.outputs.runner }}

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          # A v* tag's build (pushed or dispatched from the tag) publishes
          # its version tag after the smoke; only a release, not a
          # prerelease (v1.2.3-rc.1), also moves prod.
          VERSION_TAG=""
          MOVES_PROD="false"
          if [ "$REF_TYPE" = "tag" ] && [[ "$REF_NAME" == v* ]]; then
            VERSION_TAG="$REF_NAME"
            if [[ "$REF_NAME" != *-* ]]; then
              MOVES_PROD="true"
            fi
          fi
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "moves_prod=$MOVES_PROD" >> "$GITHUB_OUTPUT"
          echo "Building: main-$SHORT_SHA; after the smoke: latest, version tag '${VERSION_TAG:-none}', moves prod: $MOVES_PROD"

      # --target sandbox: the Dockerfile's final stage is the self-host
      # compose runner (sandbox + stigmer CLI, published separately as
      # ghcr.io/stigmer/stigmer-runner by release.npm-libs.yaml); this lane
      # ships the CLOUD sandbox stage: the default base image plus the runner
      # layer. amd64 stays this lane's platform — the cloud fleet is amd64;
      # the multi-arch proof lives on the compose-runner lane.
      # The layer cache is what lets an unchanged step produce the SAME layer
      # bytes build after build, so a node holding the last image pulls only
      # what changed (stigmer/stigmer#1244; the Dockerfile cuts its layers
      # by owner: the base's change with its tools, the runner layer with
      # each runner change). A registry cache in its own package, not
      # type=gha, whose export has hung releases for up to an hour
      # (release.mcp-server, v3.1.11); a failed cache export is ignored, so
      # the cache can slow a release down but never fail one.
      - name: Build and push sandbox image
        env:
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/runner-buildcache:sandbox-amd64
          STEPS_TAGS_OUTPUTS_SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target sandbox \
            --cache-from "type=registry,ref=$CACHE_REF" \
            --cache-to "type=registry,ref=$CACHE_REF,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
            --file backend/services/runner/Dockerfile.sandbox \
            --tag ghcr.io/${{ github.repository_owner }}/runner:main-"${STEPS_TAGS_OUTPUTS_SHORT_SHA}" \
            --push \
            .

      # Package visibility is an org-settings fact, not a step (GHCR has no
      # REST endpoint for it; the PUT this job carried answered 404 on
      # every run, masked into an error annotation). `runner` is public.

      - name: Set up the Temporal CLI
        uses: temporalio/setup-temporal@1059a504f87e7fa2f385e3fa40d1aa7e62f1c6ca # v0

      # Gate before promotion: the runner itself boots inside the built image,
      # started as the drivers start it (its own /runner/bin/node, the slim
      # artifact at /runner/dist). The runner's slim check runs from the
      # checkout, mounted read-only (its scripts import only Node built-ins
      # and each other), against a Temporal dev server on the host network:
      # the cloud-mode boot to the Temporal dial, @cursor/sdk and its platform
      # package, the attach waiter, a worker that reaches RUNNING, the
      # manager lifecycle, and a warm-pool member booted with an OTLP endpoint
      # set, as production sets one. A broken image or a runner that dies at boot (the
      # 2026-04 stale-image failure mode) fails here, and no tag but
      # main-<sha> names it.
      - name: Smoke-test the runner in the image
        timeout-minutes: 8
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/runner:main-${{ steps.tags.outputs.short_sha }}
        run: |
          temporal server start-dev --headless --log-level error &
          TEMPORAL_PID=$!
          trap "kill $TEMPORAL_PID" EXIT
          for i in $(seq 1 30); do
            temporal operator cluster health >/dev/null 2>&1 && break
            sleep 1
          done
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/backend/services/runner/scripts:/verify:ro" \
            --env TEMPORAL_SERVICE_ADDRESS=127.0.0.1:7233 \
            "$IMAGE" \
            /runner/bin/node /verify/verify-slim-artifact.mjs --node /runner/bin/node --artifact /runner/dist

      - name: Promote the smoke-tested image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/runner
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:main-$SHORT_SHA"

      - name: Promote the tested release image
        # Only a smoke-tested build of a v* tag gets here: the version tag
        # names that release's runner, and prod moves for a release only.
        if: steps.tags.outputs.version_tag != ''
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/runner
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
          MOVES_PROD: ${{ steps.tags.outputs.moves_prod }}
        run: |
          TAGS=(--tag "$IMAGE:$VERSION_TAG")
          if [ "$MOVES_PROD" = "true" ]; then
            TAGS+=(--tag "$IMAGE:prod")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$IMAGE:main-$SHORT_SHA"

      - name: Summary
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/runner
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
          MOVES_PROD: ${{ steps.tags.outputs.moves_prod }}
        run: |
          {
            echo "## Cloud Sandbox Image Published"
            echo ""
            echo "**Image:** \`$IMAGE\`"
            echo "**Tags:** \`main-$SHORT_SHA\`; after the smoke \`latest\`${VERSION_TAG:+, \`$VERSION_TAG\`}"
            echo "**Architecture:** linux/amd64"
            if [ "$MOVES_PROD" = "true" ]; then
              echo "**prod:** moved to \`$VERSION_TAG\`, the latest smoke-tested release"
            else
              echo "**prod:** unchanged (moves on a release tag only)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
