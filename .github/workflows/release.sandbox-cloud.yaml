name: release.sandbox-cloud

# Builds and publishes the cloud sandbox runner image, ghcr.io/stigmer/runner,
# the image the hosted edition launches its sandboxes from, and the two
# images it is made of: ghcr.io/stigmer/runner-base (the default base image,
# the agent's tools) and ghcr.io/stigmer/runner-layer (the runner, under
# /runner, FROM scratch), which an operator adds to a base image of their
# own with deploy/runner-layer/Dockerfile. `runner` is amd64; the base and
# the layer are amd64 and arm64.
#
# This workflow decides when main and the release tags build them, and owns
# the failure notice; the build, smoke and publish jobs are
# release.runner-images.yaml, which release.dev.yaml also calls to publish a
# dev build's runner (stigmer/stigmer#2255).
#
# The lane is a pure artifact publisher: build -> push (the stage tag) ->
# smoke-test -> promote what passed. The base and the layer are pushed per
# arch (<stage>-<arch>), proven on foreign bases, then merged into the stage
# tag, latest and the version tag (never prod). The runner tags:
#   - main-<sha>: every build from here, before the smoke; the bytes the
#     smoke tests. A dev build's is dev-<sha12> instead, in Stigmer's own
#     image repository, never on ghcr.io.
#   - latest: every build from here that passed the smoke (development, and
#     an OSS server with no release of its own, follow latest). Never a dev
#     build's.
#   - v<X.Y.Z>: a v* tag's build that passed the smoke, so a version tag
#     existing means that release's runner booted. A server release launches
#     the runner of the same release by it (the OSS default and the cloud).
#   - v<X.Y.Z-dev.<stamp>.g<sha12>>: a dev build's runner that passed the
#     smoke, published by release.dev to Stigmer's own image repository
#     (not ghcr.io) before the server of that version, so a composition
#     pinning a dev build launches its runner by the version it pins.
#   - prod: the latest smoke-tested release. Moved only on a release tag,
#     never on a main push, a prerelease tag, a dev build, or a rebuild
#     dispatched from main, so nothing unreleased reaches a deployment that
#     follows it.
# Every tag but the stage tag is added after the smoke, not before as the
# self-host lane does: that lane smokes the pushed version tag itself, while
# this one smokes the pushed stage bytes the other tags then name.
# A dispatch runs the workflow of the ref it is dispatched from: from a tag
# whose workflow predates the in-image smoke below, that workflow pushes
# latest at build time, which would move latest back to an image without
# /runner/bin/node (or, from a tag before the start script, without
# /runner/bin/start), the launch path every newer server uses. Re-publish
# such a release by its version tag only, never by dispatching its build.
#
# Triggers:
#   - push to main: rebuild when runner code, proto stubs, or Dockerfile
#     change (path gate evaluated in the detect-changes job, not via the
#     event-level `paths:` filter — that filter is unreliable on very large
#     pushes/merges and silently skipped the v2.0.0 merge).
#   - push of a v* tag: always rebuild so every release ships a matching
#     cloud sandbox image.
#   - workflow_dispatch: manual rebuild from main or a v* tag; dispatched
#     from a v* tag it re-publishes that release's version tag (and prod,
#     for a release). Refused from any other ref: it would push main-<sha>
#     and move latest to code that is not on main.
#
# A red main push files (or comments on) a `ci-sandbox-cloud-failure` issue
# (notify-failure.yaml): nobody watches a main push, and a smoke that failed
# silently once held latest and every release's runner for days
# (stigmer/stigmer#2253). Tag pushes and dispatches are watched by whoever
# started them.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reliable change detection. Event-level `paths:` filtering is skipped by
  # GitHub on oversized pushes (the v2.0.0 merge changed 1,348 files / ~347K
  # lines and never triggered this workflow). dorny/paths-filter queries the
  # API for the real changed-file set, so it works regardless of push size.
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Refuse a dispatch from a branch other than main
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF" != "refs/heads/main" ] && ! { [ "$REF_TYPE" = "tag" ] && [[ "$REF_NAME" == v* ]]; }; then
            echo "release.sandbox-cloud runs from main or a v* tag, not $REF: it would move latest to code that is not on main. A branch's runner is built locally; dev builds come from main only." >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Detect runner-relevant changes
        id: filter
        # Only meaningful for main-branch pushes; tag pushes and manual
        # dispatch always build (handled in the decision step below).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            runner:
              - 'backend/services/runner/src/**'
              - 'backend/services/runner/package.json'
              - 'backend/services/runner/package-lock.json'
              - 'backend/services/runner/tsconfig*.json'
              - 'backend/services/runner/Dockerfile.sandbox'
              # The layer's start script, and the join the foreign-base
              # checks build as the self-hosting guide prints it.
              - 'backend/services/runner/layer/**'
              - 'deploy/runner-layer/**'
              # The image's runner is the slim artifact these scripts build
              # (bundle-slim.mjs and what it imports and aliases).
              - 'backend/services/runner/scripts/**'
              - 'scripts/lib/source-map-pragma.mjs'
              - 'apis/stubs/ts/**'
              - 'backend/libs/ts/**'
              # The lane itself, so a change to it runs it on merge.
              - '.github/workflows/release.sandbox-cloud.yaml'
              - '.github/workflows/release.runner-images.yaml'

      - name: Decide whether to build
        id: decide
        run: |
          # Always build on tag pushes (releases) and manual dispatch.
          # On main pushes, build only when runner-relevant paths changed.
          if [ "${{ github.event_name }}" != "push" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${STEPS_FILTER_OUTPUTS_RUNNER}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Build decision: $(cat "$GITHUB_OUTPUT" | grep should_build)"
        env:
          STEPS_FILTER_OUTPUTS_RUNNER: ${{ steps.filter.outputs.runner }}

  images:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write
      # Asked by the called lane's job for a dev build's keyless push; a main
      # or tag build never takes a Google token.
      id-token: write
    uses: ./.github/workflows/release.runner-images.yaml

  # Only a main push is unattended: a tag push is a release someone is
  # watching, and a dispatch is watched by whoever started it. A skipped build
  # (no runner path changed) is not failure() and files nothing.
  notify-failure:
    name: File Sandbox Image Failure Issue
    needs: [detect-changes, images]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      label: ci-sandbox-cloud-failure
      title: "release.sandbox-cloud: the sandbox runner image build on main is failing"
      body-context: >-
        This lane builds ghcr.io/stigmer/runner, runner-layer and runner-base
        on every main push that touches the runner, boots the runner inside
        the built image (verify-slim-artifact.mjs --in-place), and only then
        moves latest. While it is red, latest stays on the last green build
        and a release tag would publish no runner image. Start with the
        failed step's log: the smoke names the check that failed, and the
        foreign-base steps name the join or the start script.
