name: release.sandbox-cloud

# Builds the full (cloud) sandbox image used by Daytona in cloud mode.
# Triggers on main when the sandbox Dockerfile, runner code, or runner
# dependencies change. No semver tags — latest + commit SHA.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/services/agent-runner/sandbox/Dockerfile.sandbox.full'
      - 'backend/services/agent-runner/pyproject.toml'
      - 'backend/services/agent-runner/poetry.lock'
      - 'backend/services/agent-runner/main.py'
      - 'backend/services/agent-runner/src/stigmer_runner/worker/**'
      - 'backend/services/agent-runner/src/stigmer_runner/grpc_client/**'
      - 'backend/libs/python/graphton/**'
      - 'apis/stubs/python/**'
      - 'backend/services/cursor-runner/src/**'
      - 'backend/services/cursor-runner/package.json'
      - 'backend/services/cursor-runner/package-lock.json'
      - 'backend/services/cursor-runner/tsconfig*.json'
      - 'backend/libs/model-registry.json'
      - 'apis/stubs/ts/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Building: latest + main-$SHORT_SHA"

      - name: Build and push full sandbox image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file backend/services/agent-runner/sandbox/Dockerfile.sandbox.full \
            --tag ghcr.io/${{ github.repository_owner }}/agent-sandbox-full:latest \
            --tag ghcr.io/${{ github.repository_owner }}/agent-sandbox-full:main-${{ steps.tags.outputs.short_sha }} \
            --push \
            .

      - name: Ensure GHCR package is public
        continue-on-error: true
        run: |
          gh api \
            -X PUT \
            /orgs/${{ github.repository_owner }}/packages/container/agent-sandbox-full/visibility \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Planton CLI
        env:
          PLANTON_CLI_VERSION: v0.0.25-cli.20260426.1
          PLANTON_API_KEY: ${{ secrets.PLANTON_API_KEY }}
        run: |
          curl -fsSLo /usr/local/bin/planton \
            "https://downloads.planton.ai/cli/${PLANTON_CLI_VERSION}/planton-${PLANTON_CLI_VERSION}-linux-amd64"
          chmod +x /usr/local/bin/planton
          planton --version
          planton context set --org stigmer

      - name: Update Planton sandbox image variable
        env:
          PLANTON_API_KEY: ${{ secrets.PLANTON_API_KEY }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/agent-sandbox-full:main-${{ steps.tags.outputs.short_sha }}"
          cat > /tmp/sandbox-ci-vargroup.yaml <<EOF
          apiVersion: service-hub.planton.ai/v1
          kind: VariablesGroup
          metadata:
            name: sandbox-ci
            org: stigmer
          spec:
            description: CI-managed sandbox configuration. Updated exclusively by release.sandbox-cloud.
            entries:
              - name: prod.sandbox-image
                value: ${IMAGE}
                description: Immutable image tag for Daytona sandbox provisioning
          EOF
          planton apply -f /tmp/sandbox-ci-vargroup.yaml

      - name: Redeploy stigmer-service to pick up new image variable
        env:
          PLANTON_API_KEY: ${{ secrets.PLANTON_API_KEY }}
        run: planton service run-pipeline --service stigmer-service --branch main

      - name: Warm Daytona image cache
        continue-on-error: true
        timeout-minutes: 5
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/agent-sandbox-full:main-${{ steps.tags.outputs.short_sha }}
        run: |
          pip install daytona-sdk
          python - <<'PYEOF'
          import os, time
          from daytona_sdk import Daytona, DaytonaConfig, CreateSandboxFromImageParams

          d = Daytona(DaytonaConfig(api_key=os.environ["DAYTONA_API_KEY"]))

          print(f"Creating sandbox from {os.environ['IMAGE']} to warm cache …")
          t0 = time.monotonic()
          sandbox = d.create(CreateSandboxFromImageParams(image=os.environ["IMAGE"]))
          elapsed = time.monotonic() - t0
          print(f"Sandbox {sandbox.id} ready in {elapsed:.1f}s — image layers cached")

          d.delete(sandbox)
          print("Sandbox deleted — cache-warming complete")
          PYEOF

      - name: Summary
        run: |
          echo "## Cloud Sandbox Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ github.repository_owner }}/agent-sandbox-full\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`latest\`, \`main-${{ steps.tags.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "**Planton variable:** updated \`sandbox-ci/prod.sandbox-image\`" >> $GITHUB_STEP_SUMMARY
          echo "**Daytona cache warm:** attempted with SHA tag (continue-on-error)" >> $GITHUB_STEP_SUMMARY
