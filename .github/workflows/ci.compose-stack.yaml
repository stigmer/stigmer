# =============================================================================
# Compose Stack — the self-host gate
# =============================================================================
# Proves `docker compose up` from a clean clone: server + one Postgres +
# real Temporal + containerized runner, up to ONE END-TO-END workflow run
# through the runner (LLM-free, so no provider secrets are needed).
#
# Both images build FROM SOURCE via docker-compose.dev.yml: the committed
# docker-compose.yml pins published version tags for
# users, but a PR must prove the real topology without waiting for a
# release. The published-tag path is re-proven by the release lane
# (release.npm-libs.yaml), which runs the SAME test/install/smoke-compose.mjs
# against the pushed images on native amd64 + arm64 runners.
#
# When it runs (its list in scripts/ci-lanes.mjs): the compose surface only. Server/runner SOURCE changes are
# gated by ci.stigmer-server / ci.runner (+ the conformance lanes); this
# workflow guards the topology, the images' packaging seams, and the smoke
# itself.
# =============================================================================

name: ci.compose-stack

on:
  # Called by ci.gate.yaml when scripts/ci-lanes.mjs finds the change needs
  # this lane (the path list and its reasons live there); `Gate` is the
  # required check.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Inside the gate a missing test dependency fails instead of skipping
  # (the Postgres and Temporal helpers read it); a caller's env does not
  # reach a called workflow, so each lane sets it itself.
  STIGMER_TEST_GATE: "1"

jobs:
  compose-gate:
    name: Compose Gate (build-from-source)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Restore the Turbo cache
        uses: ./.github/actions/turbo-cache

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      # make smoke-compose = build-server (stubs + deps + compile) +
      # build-web (the console export bundle-slim stages) +
      # stage-compose-runner-cli (the CLI tarballs the runner image
      # installs) + bundle-slim + test/install/smoke-compose.mjs --build. One
      # entry point, identical to what a contributor runs locally.
      - name: Build the stack from source and run the gate smoke
        run: make smoke-compose
