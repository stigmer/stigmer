# =============================================================================
# Go SDK quality gate: sdk/go
# =============================================================================
# The Go-SDK counterpart of ci.java-sdk: the only CI that compiles sdk/go
# before it ships inside release artifacts (release.cli and release.desktop
# tar up sdk/go/internal/gen without ever compiling it). It exists because a
# generated file containing a type error (schedule.go's oneof
# ApiResourceReference member, 2026-08-03) reached main uncompiled — no
# workflow built sdk/go, so `make check-go` was red on every developer
# machine while CI stayed green.
#
# Three gates, one job (issue #264 closed the hygiene gaps):
#   - freshness — regenerates the SDK client code (Stage 2, schemas are
#     committed) and fails if the committed copy differs, so stale or
#     hand-edited generated code fails here rather than silently drifting
#     from the generator.
#   - build + vet + test — compiles the whole module and runs its tests
#     under -race (the root `make test` convention), so any codegen output
#     that cannot compile fails pre-merge instead of at release time.
#   - hygiene — gofmt -s and `go mod tidy -diff`, neither of which any other
#     CI lane checks; without them formatting and go.mod drift land silently
#     and turn up as noise in unrelated PRs.
#
# go.work/go.work.sum are trigger paths because sdk/go is a go.work member:
# the checkout runs these commands in workspace mode, so a workspace change
# (module set, Go version, the genproto replace) changes this module's build
# without touching sdk/go/** (the ci.conformance lanes model the same).
# =============================================================================

name: ci.go-sdk

on:
  pull_request:
    paths:
      - "apis/**"
      - "sdk/go/**"
      - "tools/codegen/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ci.go-sdk.yaml"
  push:
    branches: [main]
    paths:
      - "apis/**"
      - "sdk/go/**"
      - "tools/codegen/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ci.go-sdk.yaml"
  workflow_dispatch: {}

concurrency:
  group: ci-go-sdk-${{ github.head_ref || github.ref }}
  # PR pushes cancel superseded runs; main pushes queue instead, so every
  # merge gets a completed, attributable run (stigmer/stigmer#725).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  go-sdk:
    name: codegen freshness / build / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # go-version-file keeps this lane on the workspace's toolchain when
      # go.work bumps, instead of silently testing on a stale pinned version.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: sdk/go/go.sum

      # The client generator runs from TypeScript source via the repo-pinned
      # tsx (never bare npx — oss#531), so the root npm install must exist
      # before the codegen step.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Stage 2 only: proto stubs and JSON schemas are committed; the client
      # generator is a pure function of tools/codegen/schemas.
      - name: Generate SDK client code
        run: make -C sdk/go codegen-clients

      # The generator also owns two files at the sdk root (types.go,
      # from_proto.go) — they are in the diff scope because a hand-edit to
      # types.go outside it was silently clobbered by a later regeneration,
      # re-adding an alias that collided with a hand-written wrapper and
      # breaking the build one step later with a confusing error (#716).
      - name: Verify committed generated code is fresh
        run: git diff --exit-code sdk/go/internal/gen sdk/go/types.go sdk/go/from_proto.go

      # gofmt -s (the `make lint` formatter) and tidy -diff are check-only:
      # they fail with the offending files/diff instead of mutating the tree.
      - name: Check formatting and go.mod tidiness
        working-directory: sdk/go
        run: |
          untidy=$(gofmt -s -l .)
          if [ -n "$untidy" ]; then
            echo "gofmt -s would reformat:" >&2
            echo "$untidy" >&2
            exit 1
          fi
          go mod tidy -diff

      # -race and -timeout 30s match the root `make test` invocation, so this
      # lane cannot pass code that the local gate rejects.
      - name: Build, vet, and test
        working-directory: sdk/go
        run: |
          go build ./...
          go vet ./...
          go test -race -timeout 30s ./... -count=1

      # The codegen toolchain's own tests (vitest) — includes the @internal
      # strip contract (oss#327) and the gojson serializer's pinned Go
      # equivalence corpus.
      - name: Run the codegen toolchain's own tests
        run: npm run test -w @stigmer/codegen
