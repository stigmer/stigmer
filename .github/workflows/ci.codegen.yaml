# =============================================================================
# Codegen freshness gate: mcp-server/src/gen, sdk/typescript/src/gen,
# sdk/python/src/stigmer/_gen
# =============================================================================
# The freshness counterpart of ci.go-sdk / ci.java-sdk for the three committed
# codegen dirs that had no gate at all (oss#496): nothing regenerated them in
# CI, so schema evolution could silently strand any of them — exactly how the
# retired sdk/go/gen dir accumulated months of drift before it was deleted.
#
# One job, one gate per language surface:
#   - regenerate all three dirs from the committed schemas (the generator is
#     a pure function of tools/codegen/schemas) and fail on any diff, so a
#     schema or generator change that lands without its regenerated output
#     fails here rather than drifting.
#   - Python runs codegen-verify (regen + ast.parse) because no other lane
#     ever syntax-checks the committed Python output; TypeScript and
#     mcp-server compile validity is already covered by ci.ts-workspace's
#     turbo `build` (their src/gen is inside the package, so a regen makes
#     the package affected), so their steps stay freshness-only.
# =============================================================================

name: ci.codegen

on:
  # Called by ci.gate.yaml when scripts/ci-lanes.mjs finds the change needs
  # this lane (the path list and its reasons live there); `Gate` is the
  # required check.
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Inside the gate a missing test dependency fails instead of skipping
  # (the Postgres and Temporal helpers read it); a caller's env does not
  # reach a called workflow, so each lane sets it itself.
  STIGMER_TEST_GATE: "1"

jobs:
  codegen:
    name: codegen freshness (mcp-server / ts / python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The whole codegen toolchain runs from TypeScript source via the
      # repo-pinned tsx, so the root npm install must exist before any step
      # that reaches it.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate mcp-server apply-input modules
        run: make -C mcp-server codegen

      - name: Regenerate TypeScript SDK client code
        run: make -C sdk/typescript codegen

      # codegen-verify = regen + ast.parse over the output: the only syntax
      # check the committed Python gen dir gets anywhere in CI.
      - name: Regenerate and verify Python SDK client code
        run: make -C sdk/python codegen-verify

      - name: Verify committed generated code is fresh
        run: |
          git diff --exit-code \
            mcp-server/src/gen \
            sdk/typescript/src/gen \
            sdk/python/src/stigmer/_gen

      # Census guard for the stub scrub (oss#497): committed protoc stubs
      # must carry no @internal comment sections. The scrub runs inside the
      # generation paths; this catches a stub regen that bypassed them.
      - name: Verify stubs carry no @internal comment sections
        run: make stubs-internal-check
