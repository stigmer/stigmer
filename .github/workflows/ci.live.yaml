# =============================================================================
# Live — the release against real model providers
# =============================================================================
# Every other check talks to a fake model. This one runs the live class
# (`*.live.test.ts`, the runner's `npm run test:live`) and the published CLI
# against the real providers, on their cheapest models, so a retired model id,
# a changed provider API or a price table that no longer knows a model is seen
# the week it happens instead of by a user:
#   runner-live  the runner's live suites: a native turn, a tool call and a
#                cost-cap stop on Claude Haiku; the workflow llm_call; every
#                registry row's id at its provider; the Cursor instruments.
#   cli-live     the CLI npm just published, `stigmer up` and an agent run on
#                Claude Haiku (test/install/smoke-cli-cutover.mjs --live-model).
#
# Runs:
# - after `release.npm-libs` completes on a pushed `v*` tag (workflow_run),
#   against the tagged commit and the version it published;
# - by hand (workflow_dispatch), against the dispatched ref's code and the
#   newest published CLI (or the `version` given).
# Never on a pull request or in the merge queue: it spends money and depends
# on providers being up, so it blocks nothing.
#
# Money: each native and Cursor execution runs under its own cost cap
# (max_cost_usd), the case list is fixed, and each job writes every case's
# estimated spend to its step summary. The SDK-direct Cursor instruments and
# the CLI's one turn have no product cap; each is one short turn. The keys'
# monthly limits are set in the provider consoles.
#
# Keys: ANTHROPIC_API_KEY and CURSOR_API_KEY from the `provider-integration`
# environment, which deploys only to `main` (both triggers run on `main`; the
# tag is only the commit checked out). They reach one step each through
# `env:` and are never printed. STIGMER_LIVE=1 makes a missing key fail the
# run instead of skipping it (backend/services/runner/src/__test-utils__/live-gate.ts).
#
# Red: an unattended (workflow_run) failure files or comments on one
# `live-failure` issue; a dispatch is watched by whoever dispatched it. The
# release train reads this workflow's runs on `main` before it ships again.
# =============================================================================

name: ci.live

# workflow_run is safe here: the triggering workflow runs only on `v*` tag
# pushes and dispatches, which only a writer can make; the job condition
# below admits only a successful tag push. The tagged commit is checked out
# on purpose (the live check tests the code that was released), with
# persist-credentials off, and nothing from the triggering run (artifacts,
# outputs) is read.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - "release.npm-libs"
    types: [completed]

  workflow_dispatch:
    inputs:
      version:
        description: "The published CLI version for cli-live (X.Y.Z); empty means the newest release"
        required: false
        type: string
        default: ""

concurrency:
  group: live-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Resolve the release
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: The commit to test and the CLI version to install
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ -n "$RUN_TAG" ]; then
            tag="$RUN_TAG"
            ref="$RUN_SHA"
          else
            ref="$DISPATCH_SHA"
            if [ -n "$INPUT_VERSION" ]; then
              tag="v${INPUT_VERSION#v}"
            else
              tag=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
            fi
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a release tag: $tag"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Testing $ref against the published CLI ${tag#v}" >> "$GITHUB_STEP_SUMMARY"

  runner-live:
    name: Runner live suites
    needs: release
    runs-on: ubuntu-latest
    environment: provider-integration
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      # The runner file:-links its workspace libs and imports their built dists.
      - name: Build runner-linked workspace libs
        run: npm run build:runner-deps

      - name: Install unified runner dependencies
        working-directory: backend/services/runner
        run: npm ci

      - name: Run the live suites against the real providers
        working-directory: backend/services/runner
        env:
          STIGMER_LIVE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          echo "### Runner live suites: estimated spend per case" >> "$GITHUB_STEP_SUMMARY"
          npm run test:live

  cli-live:
    name: Published CLI on a real model
    needs: release
    runs-on: ubuntu-latest
    environment: provider-integration
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      # The install scripts need no install (test/install runs on bare node).
      - name: stigmer up from the published CLI, an agent on the real provider
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "### Published CLI ${VERSION}: one short turn on claude-haiku-4.5, no product cost cap" >> "$GITHUB_STEP_SUMMARY"
          node test/install/smoke-cli-cutover.mjs --published --version="$VERSION" --live-model

  # An unattended run's red announces itself (#477); a dispatch is watched by
  # whoever dispatched it. A skipped release job (the release itself failed,
  # or the run was not a tag push) is not failure() and files nothing.
  notify-failure:
    name: File Live Failure Issue
    needs: [release, runner-live, cli-live]
    if: failure() && github.event_name != 'workflow_dispatch'
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      label: live-failure
      title: "ci.live: the release's check against real model providers is failing"
      body-context: >-
        This workflow runs the runner's live suites and the published CLI
        against the real model providers after each release. A failure means a
        provider path a user takes is broken (a retired model id, a changed
        provider API, a price table that no longer knows a model), a provider
        was down, or a key expired; the job log names which. The release train
        reads this before it ships again; re-dispatch the workflow after the
        fix, and close this issue when it is green.
