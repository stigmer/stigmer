# =============================================================================
# gRPC Conformance Suite — Execution Engine (local-execution target)
# =============================================================================
# Runs the execution-engine conformance suites (Class B) against the OSS
# server with its engine provisioned: a real Temporal dev server plus the
# TypeScript unified runner, all built from source.
#
# This is intentionally a SEPARATE job from ci.conformance.yaml so the
# dependency-light CRUD signal stays fast. It needs the `temporal`
# CLI and a runner build that the CRUD job does not.
#
# Each target runs as three shards (`--shard=<index>/3`). The suite's files
# run one at a time, because each boots its own Temporal, server and runner
# (vitest.execution.config.ts), so a single job runs for 9 to 13 minutes and
# holds the whole gate to that. vitest splits the files by a hash of their path, in
# equal counts; three is where the split stops paying, since the file that
# exercises provider errors (about two minutes alone) lands in one shard
# whatever the count. scripts/ci-shards.test.mjs holds every shard matrix to
# the indices 1 to 3, so no shard can be dropped without the suite failing.
# =============================================================================

name: ci.conformance-execution

on:
  # Called by ci.gate.yaml when scripts/ci-lanes.mjs finds the change needs
  # this lane (the path list and its reasons live there); `Gate` is the
  # required check.
  workflow_call:

permissions:
  contents: read

env:
  # Inside the gate a missing test dependency fails instead of skipping
  # (the Postgres and Temporal helpers read it); a caller's env does not
  # reach a called workflow, so each lane sets it itself.
  STIGMER_TEST_GATE: "1"

jobs:
  conformance-execution-local:
    name: Conformance Execution (local-execution, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # About 3x a shard's time: without it a hung shard would hold a runner for
    # GitHub's six-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      # The runner, the server, and the suites import the built proto stubs.
      - name: Build proto stubs
        run: npm run build -w @stigmer/protos

      # The server is standalone with its own lockfile (runner-style, not a
      # workspace member) — the ci.stigmer-server.yaml precedent.
      - name: Install server dependencies
        working-directory: backend/services/stigmer-server
        run: npm ci

      # Install the Temporal CLI; the dev server backs the execution harness.
      # The action installs the version `stigmer up` pins, verified against the
      # release's checksums.txt, from the archive main caches when it has it,
      # so a release-host outage cannot fail the lane before a test runs.
      - name: Install Temporal CLI
        uses: ./.github/actions/temporal-cli

      # Build the runner explicitly so a runner build break is an isolated,
      # legible failure rather than a confusing globalSetup error.
      - name: Build unified runner
        run: make build-runner

      # Memory-enabled executions spawn `stigmer mcp-server` as a stdio child
      # (the runner's memory capture attachment, shared/memory-attachment.ts).
      # Every real OSS install carries the CLI by construction; give the lane
      # the same from-source tsx shim `make local` installs on dev machines,
      # so those executions run instead of failing on a missing binary.
      - name: Install stigmer CLI shim
        run: |
          make install-cli-shim
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # Typecheck the runner's tests too (the production build above excludes
      # them via tsconfig.build.json). Cheap (~5s), pure, and the only pre-merge
      # gate that keeps the runner's test types from drifting out of sync with
      # the contracts they guard. It judges no suite file, so one shard runs it.
      - name: Typecheck runner (incl. tests)
        if: matrix.shard == 1
        working-directory: backend/services/runner
        run: npm run typecheck

      - name: Run execution conformance suite (local-execution)
        env:
          CONFORMANCE_TARGET: local-execution
        run: npm run test:execution -w @stigmer/conformance -- --shard=${{ matrix.shard }}/3

  # The same execution roster on the Postgres Store driver: the execution
  # suites hammer exactly the surfaces where a
  # Postgres driver most plausibly diverges from sqlite's single-writer
  # serialization — event-append idempotence, fire-identity upserts, signal
  # dedupe under real concurrency. A Postgres gate that skipped them would
  # certify the driver everywhere except where it is most at risk.
  conformance-execution-local-postgres:
    name: Conformance Execution (local-postgres-execution, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      - name: Build proto stubs
        run: npm run build -w @stigmer/protos

      - name: Install server dependencies
        working-directory: backend/services/stigmer-server
        run: npm ci

      - name: Install Temporal CLI
        uses: ./.github/actions/temporal-cli

      - name: Build unified runner
        run: make build-runner

      - name: Install stigmer CLI shim
        run: |
          make install-cli-shim
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Run execution conformance suite (local-postgres-execution)
        env:
          CONFORMANCE_TARGET: local-postgres-execution
          CONFORMANCE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:execution -w @stigmer/conformance -- --shard=${{ matrix.shard }}/3
