name: release.python-runner

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          fi
          VERSION_NO_V="${VERSION#v}"
          echo "version=$VERSION_NO_V" >> $GITHUB_OUTPUT
          echo "Publishing Python runner packages at version: $VERSION_NO_V"

  publish-graphton:
    needs: determine-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set version
        working-directory: backend/libs/python/graphton
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          python -c "
          import re, pathlib
          p = pathlib.Path('pyproject.toml')
          text = p.read_text()
          text = re.sub(r'version\s*=\s*\"[^\"]*\"', 'version = \"$VERSION\"', text, count=1)
          p.write_text(text)
          "
          echo "Set graphton version to $VERSION"

      - name: Build package
        working-directory: backend/libs/python/graphton
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/libs/python/graphton/dist/
          skip-existing: true

  publish-runner:
    needs: [determine-version, publish-graphton]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set version and pin graphton dependency
        working-directory: backend/services/agent-runner
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          python -c "
          import re, pathlib
          p = pathlib.Path('pyproject.toml')
          text = p.read_text()
          text = re.sub(r'version\s*=\s*\"[^\"]*\"', 'version = \"$VERSION\"', text, count=1)
          text = re.sub(r'\"graphton[^\"]*\"', '\"graphton==$VERSION\"', text)
          text = re.sub(r'\"stigmer-protos[^\"]*\"', '\"stigmer-protos>=$VERSION\"', text)
          p.write_text(text)
          "
          echo "Set stigmer-runner version to $VERSION (graphton pinned to ==$VERSION)"

      - name: Build package
        working-directory: backend/services/agent-runner
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/services/agent-runner/dist/
