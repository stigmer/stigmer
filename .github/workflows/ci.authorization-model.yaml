# =============================================================================
# Authorization model gate: backend/services/stigmer-server/fga
# =============================================================================
# The authorization model is the .fga files under
# backend/services/stigmer-server/fga/model, compiled by OpenFGA's own parser
# into src/authorization/model/data/authorization-model.json: the bytes the
# built-in evaluator runs and every edition applies. On every change to the
# model, its compiled file or its generator, this lane proves:
#   - the generator's own tests (tools/codegen, src/authorization-model);
#   - the committed JSON is exactly what the .fga files compile to
#     (make gen-authorization-model-check);
#   - every suite under fga/tests passes on the real OpenFGA engine, at the
#     version production runs. The fga CLI embeds the engine, and its release
#     tarball is verified against a pinned SHA-256 because the engine version
#     is the proof's premise. FGA_CLI_VERSION below and in the Makefile name
#     the same version (a step fails when they disagree), and both move with
#     production's engine.
#
# The same suites run through the built-in evaluator in ci.stigmer-server's
# make test-server, whose filter covers the whole server package.
# =============================================================================

name: ci.authorization-model

on:
  # Called by ci.gate.yaml when scripts/ci-lanes.mjs finds the change needs
  # this lane (the path list and its reasons live there); `Gate` is the
  # required check.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FGA_CLI_VERSION: "0.7.20"
  # sha256 of fga_0.7.20_linux_amd64.tar.gz, from the release's checksums.txt.
  FGA_CLI_SHA256: f0136868bdced6f8fded1876d41aa8d594d23588183497f6d876c1a5343529a4
  # Inside the gate a missing test dependency fails instead of skipping
  # (the Postgres and Temporal helpers read it); a caller's env does not
  # reach a called workflow, so each lane sets it itself.
  STIGMER_TEST_GATE: "1"

jobs:
  model:
    name: generator, freshness and the engine suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install npm workspace dependencies
        run: npm ci

      # The resource-kind generator reads kind metadata from @stigmer/protos
      # at runtime, and that package exports only ./dist, which a bare
      # checkout does not have (stigmer#1498).
      - name: Build the protos dist the generator reads
        run: npm run build -w @stigmer/protos

      - name: Test the generator
        run: npm run test -w @stigmer/codegen -- --coverage.enabled --coverage.reportsDirectory=coverage/v8 --reporter=default --reporter=github-actions --reporter=json --outputFile.json=coverage/report.json

      # The coverage and the report for ci.gate.yaml's Coverage job, red or
      # green: a failed run still says what it covered (reportOnFailure).
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-authorization-model-model
          path: |
            tools/codegen/coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Check the committed JSON is what the .fga files compile to
        run: make gen-authorization-model-check

      - name: Check the workflow and the Makefile pin one engine version
        run: |
          grep -qx "FGA_CLI_VERSION := ${FGA_CLI_VERSION}" Makefile || {
            echo "error: FGA_CLI_VERSION here (${FGA_CLI_VERSION}) differs from the Makefile's"; exit 1; }

      - name: Install the fga CLI, verified by checksum
        run: |
          curl -sSfL -o "$RUNNER_TEMP/fga.tar.gz" \
            "https://github.com/openfga/cli/releases/download/v${FGA_CLI_VERSION}/fga_${FGA_CLI_VERSION}_linux_amd64.tar.gz"
          echo "${FGA_CLI_SHA256}  $RUNNER_TEMP/fga.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/fga"
          tar -xzf "$RUNNER_TEMP/fga.tar.gz" -C "$RUNNER_TEMP/fga" fga
          echo "$RUNNER_TEMP/fga" >> "$GITHUB_PATH"

      - name: Run the suites on the engine
        working-directory: backend/services/stigmer-server
        run: |
          fga version
          fga model test --tests 'fga/tests/*.fga.yaml'
