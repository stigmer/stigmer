name: release.desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a draft GitHub release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            SHOULD_RELEASE="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Numeric-only pre-release id; Windows MSI rejects non-numeric identifiers.
            VERSION="0.0.0-${{ github.run_number }}"
            SHOULD_RELEASE="${{ github.event.inputs.create_release }}"
          else
            VERSION="0.0.0-${{ github.run_number }}"
            SHOULD_RELEASE="false"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "Desktop build: $VERSION (release: $SHOULD_RELEASE) [$(git rev-parse --short HEAD)]"

  # Independent of determine-version (it never consumes the version output), so
  # the two run concurrently and shave the version step off the critical path.
  generate-protos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # Monorepo has no root go.sum; point the module cache at all of them
          # so setup-go stops warning about a missing dependency file.
          cache-dependency-path: '**/go.sum'

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache buf modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/buf
          key: buf-${{ hashFiles('apis/buf.lock') }}
          restore-keys: buf-

      - name: Generate proto stubs
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: make protos

      - name: Package generated stubs
        run: |
          tar -czf proto-stubs.tar.gz \
            apis/stubs/ \
            sdk/go/proto/ \
            sdk/go/internal/gen/ \
            sdk/typescript/src/gen/

      - name: Upload proto stubs
        uses: actions/upload-artifact@v4
        with:
          name: proto-stubs
          path: proto-stubs.tar.gz
          retention-days: 1


  # Pre-create a single draft release up front so every parallel build leg can
  # upload its bundles to the same release via releaseId. The updater manifest
  # is assembled once in the publish job (see below), which is what lets the
  # builds run concurrently without racing on latest.json.
  create-release:
    needs: determine-version
    if: needs.determine-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        with:
          script: |
            const tag = process.env.VERSION;
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Stigmer Desktop ${tag}`,
              body: 'Download the desktop installer for your platform below.',
              draft: true,
              prerelease: false,
            };
            try {
              const { data } = await github.rest.repos.createRelease(params);
              core.setOutput('release_id', data.id);
            } catch (err) {
              // A re-run may hit an existing release for this tag; reuse it.
              if (err.status !== 422) throw err;
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput('release_id', data.id);
            }

  build:
    needs: [determine-version, generate-protos, create-release]
    # create-release is skipped for build-only (workflow_dispatch without
    # create_release), so gate on it not having failed rather than on success.
    if: |
      always() &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') &&
      needs.determine-version.result == 'success' &&
      needs.generate-protos.result == 'success' &&
      needs.create-release.result != 'failure'
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      # Builds run fully in parallel. Per-leg latest.json writes are disabled
      # (includeUpdaterJson: false) and the manifest is assembled once in the
      # publish job, so there is no shared-asset race. See tauri-action#1270.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: universal-apple-darwin
            go_os: darwin
            go_arch: universal
            tauri_args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            sidecar_name: stigmer-cli-x86_64-unknown-linux-gnu
            go_os: linux
            go_arch: amd64
            tauri_args: ''
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            sidecar_name: stigmer-cli-x86_64-pc-windows-msvc.exe
            go_os: windows
            go_arch: amd64
            tauri_args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download proto stubs
        uses: actions/download-artifact@v4
        with:
          name: proto-stubs

      - name: Extract proto stubs
        run: tar -xzf proto-stubs.tar.gz

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: client-apps/cli/go.sum

      - name: Build CLI sidecar
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          BINDIR=client-apps/desktop/src-tauri/binaries
          if [ "${{ matrix.go_arch }}" = "universal" ]; then
            GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" \
              -o "$BINDIR/stigmer-cli-aarch64-apple-darwin" ./client-apps/cli
            GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" \
              -o "$BINDIR/stigmer-cli-x86_64-apple-darwin" ./client-apps/cli
            lipo -create \
              -output "$BINDIR/stigmer-cli-universal-apple-darwin" \
              "$BINDIR/stigmer-cli-aarch64-apple-darwin" \
              "$BINDIR/stigmer-cli-x86_64-apple-darwin"
          else
            GOOS=${{ matrix.go_os }} GOARCH=${{ matrix.go_arch }} go build -ldflags="-s -w" \
              -o "$BINDIR/${{ matrix.sidecar_name }}" \
              ./client-apps/cli
          fi

      - name: Verify sidecar binary
        shell: bash
        run: |
          BINDIR=client-apps/desktop/src-tauri/binaries
          if [ "${{ matrix.go_arch }}" = "universal" ]; then
            ls -lh "$BINDIR"/stigmer-cli-*-apple-darwin
            file "$BINDIR"/stigmer-cli-*-apple-darwin
          else
            ls -lh "$BINDIR/${{ matrix.sidecar_name }}"
            file "$BINDIR/${{ matrix.sidecar_name }}"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'client-apps/desktop/src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build SDK libraries
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npm config set script-shell "$(which bash)"
          fi
          npm run build:libs

      - name: Set app version from tag
        shell: bash
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          VERSION="${VERSION#v}"
          echo "Setting desktop app version to $VERSION"
          cd client-apps/desktop/src-tauri
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync('tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

      # TODO: Re-enable macOS code signing once APPLE_CERTIFICATE and related
      # secrets are properly configured. Setting APPLE_CERTIFICATE to any
      # non-empty value causes tauri-action to attempt keychain import, which
      # fails if the certificate is invalid.
      # Upload this platform's signed bundles to the shared draft release.
      # includeUpdaterJson is disabled: latest.json is assembled once in the
      # publish job to avoid the parallel read-modify-write race.
      - name: Build and upload (release)
        if: needs.determine-version.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client-apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          retryAttempts: 3
          args: ${{ matrix.tauri_args }}

      - name: Build updater fragment
        if: needs.determine-version.outputs.should_release == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.determine-version.outputs.version }}
        run: |
          node client-apps/desktop/scripts/ci-latest-json.mjs fragment \
            --target-dir client-apps/desktop/src-tauri/target \
            --tag "$RELEASE_TAG" \
            --out "updater-fragment-${{ matrix.platform }}.json"

      - name: Upload updater fragment
        if: needs.determine-version.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-${{ matrix.platform }}
          path: updater-fragment-${{ matrix.platform }}.json
          retention-days: 1

      - name: Build only (no release)
        if: needs.determine-version.outputs.should_release != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client-apps/desktop
          includeUpdaterJson: false
          args: ${{ matrix.tauri_args }}

  # Merge every platform's updater fragment into a single latest.json, attach it
  # to the release, then flip the draft to published. This is the single writer
  # of the manifest, so the build matrix above can run fully in parallel.
  publish:
    needs: [determine-version, create-release, build]
    if: needs.determine-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download updater fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-fragment-*
          path: updater-fragments

      - name: Assemble latest.json
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          node client-apps/desktop/scripts/ci-latest-json.mjs merge \
            --fragments-dir updater-fragments \
            --version "$VERSION" \
            --out latest.json
          cat latest.json

      - name: Upload latest.json and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-version.outputs.version }}
        run: |
          gh release upload "$TAG" latest.json --clobber
          gh release edit "$TAG" --draft=false --prerelease=false
