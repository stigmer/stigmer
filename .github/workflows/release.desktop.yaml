name: release.desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a draft GitHub release'
        required: false
        type: boolean
        default: false
      version:
        description: 'Existing tag to build and release (e.g. v3.4.1). Leave empty for a dev build.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            SHOULD_RELEASE="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            # Recovery path: re-release an existing tag when its tag-push run
            # failed (the tag itself can't be re-pushed).
            VERSION="${{ github.event.inputs.version }}"
            SHOULD_RELEASE="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Numeric-only pre-release id; Windows MSI rejects non-numeric identifiers.
            VERSION="0.0.0-${{ github.run_number }}"
            SHOULD_RELEASE="${{ github.event.inputs.create_release }}"
          else
            VERSION="0.0.0-${{ github.run_number }}"
            SHOULD_RELEASE="false"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "Desktop build: $VERSION (release: $SHOULD_RELEASE) [$(git rev-parse --short HEAD)]"

  # Independent of determine-version (it never consumes the version output), so
  # the two run concurrently and shave the version step off the critical path.
  generate-protos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # Monorepo has no root go.sum; point the module cache at all of them
          # so setup-go stops warning about a missing dependency file.
          cache-dependency-path: '**/go.sum'

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache buf modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/buf
          key: buf-${{ hashFiles('apis/buf.lock') }}
          restore-keys: buf-

      # The stub scrub inside gen-stubs.sh runs from TypeScript source via
      # the repo-pinned tsx, so the root npm install must precede `make protos`.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate proto stubs
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: make protos

      - name: Package generated stubs
        run: |
          tar -czf proto-stubs.tar.gz \
            apis/stubs/ \
            sdk/go/proto/ \
            sdk/go/internal/gen/ \
            sdk/typescript/src/gen/

      - name: Upload proto stubs
        uses: actions/upload-artifact@v4
        with:
          name: proto-stubs
          path: proto-stubs.tar.gz
          retention-days: 1


  # Resolve a single release up front (reusing the canonical one for the tag
  # when it exists) so every parallel build leg can upload its bundles to the
  # same release via releaseId. The updater manifest is assembled once in the
  # publish job (see below), which is what lets the builds run concurrently
  # without racing on latest.json.
  create-release:
    needs: determine-version
    if: needs.determine-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        with:
          script: |
            const tag = process.env.VERSION;

            // Desktop assets must land on the canonical release for the tag
            // (the "Release vX.Y.Z" that release.cli publishes). Creating our
            // own draft instead strands the installers forever: drafts do not
            // collide on tag_name (no 422), and the publish job's
            // `gh release edit <tag>` resolves to the published release, so a
            // parallel draft is never flipped public (this is how the
            // v3.3.0/v3.4.0 desktop drafts got stranded). On a tag push the
            // CLI release appears a couple of minutes in, so poll briefly.
            const findByTag = async () => {
              try {
                const { data } = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag,
                });
                return data;
              } catch (err) {
                if (err.status !== 404) throw err;
                return null;
              }
            };

            // Dev dispatch builds use 0.0.0-N versions that never have a
            // canonical release; skip the poll and go straight to a draft.
            const isVersionTag = /^v/.test(tag);
            const deadline = Date.now() + 5 * 60 * 1000;
            let release = isVersionTag ? await findByTag() : null;
            while (isVersionTag && !release && Date.now() < deadline) {
              await new Promise((resolve) => setTimeout(resolve, 15000));
              release = await findByTag();
            }

            if (!release) {
              // No target_commitish: the Actions token 403s ("Resource not
              // accessible by integration") when it names a SHA that is not a
              // branch tip, and that gate fires even when the tag already
              // exists. GitHub resolves the commit from the tag itself.
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Stigmer Desktop ${tag}`,
                body: 'Download the desktop installer for your platform below.',
                draft: true,
                prerelease: false,
              });
              release = data;
            }
            core.setOutput('release_id', release.id);

  build:
    needs: [determine-version, generate-protos, create-release]
    # create-release is skipped for build-only (workflow_dispatch without
    # create_release), so gate on it not having failed rather than on success.
    if: |
      always() &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') &&
      needs.determine-version.result == 'success' &&
      needs.generate-protos.result == 'success' &&
      needs.create-release.result != 'failure'
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      # Builds run fully in parallel. Per-leg latest.json writes are disabled
      # (includeUpdaterJson: false) and the manifest is assembled once in the
      # publish job, so there is no shared-asset race. See tauri-action#1270.
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. The embedded runner is staged for the build
          # host (stage-runner-slim.sh), and macos-latest is arm64, so the
          # former universal target shipped an arm64-only runner inside an
          # Intel-capable shell. An Intel leg is a second row here on
          # macos-15-intel; ci-latest-json.mjs already keys macOS bundles by
          # target triple. See stigmer-cloud 20260912.01 DD-001.
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_args: '--target aarch64-apple-darwin'
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: ''
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── macOS code signing and notarization ─────────────────────────────
      #
      # Seven repository secrets drive it: APPLE_CERTIFICATE (base64 .p12),
      # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID,
      # APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8 (base64 .p8). The
      # scripts under client-apps/desktop/scripts/macos-*.sh do the work and
      # run identically on a laptop; these steps only move secrets into files
      # and environment variables.
      #
      # Two rules shape the steps. First, all seven or none: with only some
      # set, Tauri signs and then silently skips notarization (tauri-bundler
      # notarize_auth warns and continues), and a signed-but-unnotarized DMG is
      # blocked by Gatekeeper exactly like an unsigned one while looking like
      # it worked. Second, the APPLE_* variables the build reads are exported
      # to GITHUB_ENV only when signing is available: tauri-cli treats a
      # present-but-empty APPLE_SIGNING_IDENTITY as an identity and fails
      # (interface/rust.rs), so absent means unsigned and present means
      # signed, never the empty string. APPLE_CERTIFICATE itself is never
      # handed to Tauri: its keychain import takes the leaf only, and codesign
      # needs the Developer ID intermediate to build a chain, so the import
      # script imports chain and leaf and Tauri looks the identity up on the
      # keychain search list.
      #
      # An unsigned macOS build is allowed only on a build-only run. On a
      # release, missing signing fails the leg (stigmer-cloud 20260912.01
      # DD-002) so a tag can never regress to shipping the scare-screen DMG.
      - name: Detect Apple signing availability
        id: signing
        if: runner.os == 'macOS'
        # Secrets are not visible to a step-level `if:`, so presence is
        # evaluated here and later steps gate on this step's output.
        env:
          HAS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          SHOULD_RELEASE: ${{ needs.determine-version.outputs.should_release }}
        run: |
          set -euo pipefail
          present=0
          missing=()
          for name in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY TEAM_ID API_ISSUER API_KEY API_KEY_P8; do
            flag="HAS_$name"
            if [ "${!flag}" = "true" ]; then
              present=$((present + 1))
            else
              missing+=("APPLE_$name")
            fi
          done
          if [ "$present" -eq 7 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing: all seven secrets present; the build will be signed and notarized."
          elif [ "$present" -eq 0 ] && [ "$SHOULD_RELEASE" != "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing: no secrets configured; build-only run continues unsigned."
          elif [ "$present" -eq 0 ]; then
            echo "::error::Apple signing secrets are not configured. A release never ships an unsigned macOS build; add the seven APPLE_* secrets or run a build-only dispatch."
            exit 1
          else
            echo "::error::Apple signing is PARTIALLY configured ($present/7; missing: ${missing[*]}). Tauri would sign and skip notarization, so refusing to build."
            exit 1
          fi

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && steps.signing.outputs.available == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/certificate.p12"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          chmod 600 "$P12"
          client-apps/desktop/scripts/macos-import-signing-keychain.sh "$P12" "$RUNNER_TEMP/stigmer-signing.keychain-db"
          rm -f "$P12"

      - name: Install Apple notarization key
        if: runner.os == 'macOS' && steps.signing.outputs.available == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          echo -n "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          # From here on every step, tauri-action included, sees the signing
          # identity and the notarization credentials. Same names Tauri reads.
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Download proto stubs
        uses: actions/download-artifact@v4
        with:
          name: proto-stubs

      - name: Extract proto stubs
        run: tar -xzf proto-stubs.tar.gz

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'client-apps/desktop/src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build SDK libraries
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npm config set script-shell "$(which bash)"
          fi
          npm run build:libs

      # Stage the embedded runner as the slim artifact (stigmer/stigmer#170).
      # resources/runner is gitignored; without this step the packaged app
      # would ship no runner at all (and historically the dev symlink leaked
      # the full ~485 MB runner tree into local bundles — or a broken one
      # without dist/node_modules in CI). The runner is not an npm workspace,
      # so its deps install here. @stigmer/protos dist was built by build:libs.
      # On macOS with APPLE_SIGNING_IDENTITY exported above, the stage script
      # also code-signs the runner's native binaries: Tauri never signs
      # Resources/, and the notary rejects a bundle with any unsigned Mach-O.
      - name: Stage embedded runner (slim artifact)
        shell: bash
        run: |
          (cd backend/services/runner && npm ci && npm run build:slim)
          client-apps/desktop/scripts/stage-runner-slim.sh

      - name: Set app version from tag
        shell: bash
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          VERSION="${VERSION#v}"
          echo "Setting desktop app version to $VERSION"
          cd client-apps/desktop/src-tauri
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync('tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

      # Upload this platform's signed bundles to the shared draft release.
      # includeUpdaterJson is disabled: latest.json is assembled once in the
      # publish job to avoid the parallel read-modify-write race. On macOS the
      # APPLE_* variables arrive through GITHUB_ENV (see the signing steps
      # above), so this env block is the same on every platform.
      - name: Build and upload (release)
        if: needs.determine-version.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client-apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          retryAttempts: 3
          args: ${{ matrix.tauri_args }}

      - name: Build only (no release)
        if: needs.determine-version.outputs.should_release != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client-apps/desktop
          includeUpdaterJson: false
          args: ${{ matrix.tauri_args }}

      # Tauri notarizes and staples the .app and signs the DMG, but never
      # notarizes the DMG container; a first-time download is the DMG. The
      # script submits it, staples it, and then proves the whole artifact with
      # Gatekeeper's own checks, so this step passing means "a Mac opens it".
      # Stapling changes the bytes, and tauri-action has already uploaded the
      # pre-staple DMG on the release path, so the stapled one replaces it.
      - name: Locate macOS bundles
        id: bundles
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          BUNDLE_DIR="client-apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          shopt -s nullglob
          dmgs=("$BUNDLE_DIR"/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::expected exactly one DMG under $BUNDLE_DIR/dmg, found ${#dmgs[@]}"; exit 1; }
          echo "dmg=${dmgs[0]}" >> "$GITHUB_OUTPUT"
          echo "app=$BUNDLE_DIR/macos/Stigmer.app" >> "$GITHUB_OUTPUT"

      - name: Notarize, staple and verify the DMG
        if: runner.os == 'macOS' && steps.signing.outputs.available == 'true'
        run: |
          client-apps/desktop/scripts/macos-notarize-dmg.sh \
            "${{ steps.bundles.outputs.dmg }}" "${{ steps.bundles.outputs.app }}"

      - name: Replace the release DMG with the stapled one
        if: runner.os == 'macOS' && steps.signing.outputs.available == 'true' && needs.determine-version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-version.outputs.version }}
        run: gh release upload "$TAG" "${{ steps.bundles.outputs.dmg }}" --clobber

      # Build-only runs have no release to upload to; the DMG rides as a
      # workflow artifact so it can be opened on a Mac before a tag is cut.
      - name: Upload macOS DMG artifact
        if: runner.os == 'macOS' && needs.determine-version.outputs.should_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-dmg
          path: ${{ steps.bundles.outputs.dmg }}
          retention-days: 7

      - name: Build updater fragment
        if: needs.determine-version.outputs.should_release == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.determine-version.outputs.version }}
        run: |
          node client-apps/desktop/scripts/ci-latest-json.mjs fragment \
            --target-dir client-apps/desktop/src-tauri/target \
            --tag "$RELEASE_TAG" \
            --out "updater-fragment-${{ matrix.platform }}.json"

      - name: Upload updater fragment
        if: needs.determine-version.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-${{ matrix.platform }}
          path: updater-fragment-${{ matrix.platform }}.json
          retention-days: 1

  # Merge every platform's updater fragment into a single latest.json, attach it
  # to the release, then flip the draft to published. This is the single writer
  # of the manifest, so the build matrix above can run fully in parallel.
  publish:
    needs: [determine-version, create-release, build]
    if: needs.determine-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download updater fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-fragment-*
          path: updater-fragments

      - name: Assemble latest.json
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          node client-apps/desktop/scripts/ci-latest-json.mjs merge \
            --fragments-dir updater-fragments \
            --version "$VERSION" \
            --out latest.json
          cat latest.json

      - name: Upload latest.json and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-version.outputs.version }}
        run: |
          gh release upload "$TAG" latest.json --clobber
          gh release edit "$TAG" --draft=false --prerelease=false
